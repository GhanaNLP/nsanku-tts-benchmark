    bible_00000:
      source: bible
      text: Yezu en ta bɔna Bɛtani, Simɔn insageŋɔ daana la yire la, ti pɔka waam a zian na, tara lila
        ti ba dikɛ kugesuma yagum ka, ti kaam daa n kpeem bɔna ka puan.
      sbs: 0.5639
