      sbs: 0.6604
      gen_sec: 3.41
      ref_sec: 5.82
      cer: 0.2679
      wer: 0.6429
    bible_00072:
      source: bible
      text: “Ya han luta nuurɛ, da ni zuŋe ya nɛhi wuu birekɔgenduma la, seere en sɔi la, ba ni zuŋe ba
        nɛhi la bala ti ba paalɛ la nɛreba ti bamam luti la nuurɛ.
      sbs: 0.6014
