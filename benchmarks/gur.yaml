      ref_sec: 8.38
      cer: 0.2697
      wer: 0.92
    bible_00005:
      source: bible
      text: A ẽŋɛ yel-ɩr-sõŋɔ, dee sike a mẽŋa paalɛ tɩ a tarɩ yɛm.
