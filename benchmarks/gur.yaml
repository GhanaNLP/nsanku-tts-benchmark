  entries:
    bible_00000:
      source: bible
      text: Yezu en ta bɔna Bɛtani, Simɔn insageŋɔ daana la yire la, ti pɔka waam a zian na, tara lila
        ti ba dikɛ kugesuma yagum ka, ti kaam daa n kpeem bɔna ka puan.
      sbs: 0.7805
      gen_sec: 16.16
      ref_sec: 11.2
      cer: 0.4017
      wer: 0.8182
    bible_00001:
      source: bible
      text: La mam wʋn tõm sɛka tɩ mam Sɔ daan bĩŋe nõorɛ bɔ ya la, tɩ a waam wa bɔna la ya.
      sbs: 0.653
      gen_sec: 22.4
      ref_sec: 5.24
      cer: 3.2414
      wer: 3.9048
    bible_00002:
      source: bible
      text: Wakat-ẽŋa, la wʋn dɛna la toogo bɔ pɔg-sɛba n tarɩ pʋa, la sɛba n tarɩ bilɛɛsɩ tɩ ba mõgra
        la.
      sbs: 0.685
      gen_sec: 10.88
      ref_sec: 5.48
      cer: 0.9143
      wer: 1.5
    bible_00003:
      source: bible
      text: » Tɩ Nawẽnnɛ Sɩa darɛ bɔna la mam botɩ mam yẽ naam bĩmbĩnne n boe Nawẽnnɛ yire, tɩ nẽra
        zẽa a zuo.
      sbs: 0.6316
      gen_sec: 26.48
      ref_sec: 5.76
      cer: 0.9189
      wer: 1.4762
    bible_00004:
      source: bible
      text: Ba wʋn zɛbɛ la Pebila la mɛ, la Pebila la wʋn zɛbɛ yãŋɛ ba mɛ, ẽŋa n de zuudãandõma Zuudãana,
        la naadõma Naba la ĩyã.
      sbs: 0.5836
      gen_sec: 26.96
      ref_sec: 8.38
      cer: 2.8876
      wer: 3.76
    bible_00005:
      source: bible
      text: A ẽŋɛ yel-ɩr-sõŋɔ, dee sike a mẽŋa paalɛ tɩ a tarɩ yɛm.
      sbs: 0.7263
      gen_sec: 9.36
      ref_sec: 3.08
      cer: 1.25
      wer: 1.9167
    bible_00006:
      source: bible
      text: La ban daa pun ka nyɛ yele seere ti ba wan zeele de zuo ku en la, ba daa kelum yele Palete
        mɛ ti a bahɛ ti ba ku en.
      sbs: 0.7563
      gen_sec: 20.48
      ref_sec: 8.34
      cer: 1.6353
      wer: 2.0333
    bible_00007:
      source: bible
      text: La sãn dɛna Alevi yɩɩsɩ la n toosrɩ pia pʋam ayɩla la, ba de la nẽrsaalba n kiiri, la Amelkisedɛkɩ
        de la sɛka tɩ Nawẽnnɛ gõŋɔ la yetɩ, a vɔa mɛ.
      sbs: 0.6639
      gen_sec: 12.4
      ref_sec: 10.52
      cer: 0.2909
      wer: 0.6452
    bible_00008:
      source: bible
      text: Nẽr-sɛka n ka mi Nawẽnnɛ sore yɛla sõŋa la, sãn yẽ fõn tarɩ bãŋrɛ la n zĩ baga kãabgɔ
        zẽam ɔbra nẽnnɔ, la wʋn pãasɛ ẽ tɩ a mẽ obe la baga nẽnnɔ.
      sbs: 0.6708
      gen_sec: 20.88
      ref_sec: 11.32
      cer: 1.2685
      wer: 2.0606
    bible_00009:
      source: bible
      text: Nɛra woo kule la a tiŋa a tiŋa ti ba ta gulehɛ ba yuura.
      sbs: 0.7117
      gen_sec: 10.32
      ref_sec: 5.3
      cer: 0.9286
      wer: 0.7857
    bible_00010:
      source: bible
      text: Bɛla tɩ ya wʋn tãagɛ tɔgɛ lerge nẽr-sɛba n wẽerɩ yõogɔ la sɛla n yẽtɩ la nini, dee ka
        bɩsra ba sũure pʋam na.
      sbs: 0.6192
      gen_sec: 26.88
      ref_sec: 8.24
      cer: 2.2289
      wer: 3.5
    bible_00011:
      source: bible
      text: A pɔgesaaren na ti a ele ta paaɛ yuuma ayopɔi ti a sira a ka wa bɔna.
