      cer: 2.3793
      wer: 3.0
    bible_00002:
      source: bible
      text: Wakat-ẽŋa, la wʋn dɛna la toogo bɔ pɔg-sɛba n tarɩ pʋa, la sɛba n tarɩ bilɛɛsɩ tɩ ba mõgra
        la.
      sbs: 0.6595
      gen_sec: 25.36
      ref_sec: 5.48
      cer: 4.1429
      wer: 6.4
    bible_00003:
      source: bible
      text: » Tɩ Nawẽnnɛ Sɩa darɛ bɔna la mam botɩ mam yẽ naam bĩmbĩnne n boe Nawẽnnɛ yire, tɩ nẽra
        zẽa a zuo.
