    bible_00001:
      source: bible
      text: La mam wʋn tõm sɛka tɩ mam Sɔ daan bĩŋe nõorɛ bɔ ya la, tɩ a waam wa bɔna la ya.
      sbs: 0.5865
      gen_sec: 5.36
      ref_sec: 5.24
      cer: 0.1379
      wer: 0.4286
    bible_00002:
      source: bible
      text: Wakat-ẽŋa, la wʋn dɛna la toogo bɔ pɔg-sɛba n tarɩ pʋa, la sɛba n tarɩ bilɛɛsɩ tɩ ba mõgra
        la.
      sbs: 0.652
      gen_sec: 7.36
      ref_sec: 5.48
      cer: 0.1714
      wer: 0.5
    bible_00003:
      source: bible
      text: » Tɩ Nawẽnnɛ Sɩa darɛ bɔna la mam botɩ mam yẽ naam bĩmbĩnne n boe Nawẽnnɛ yire, tɩ nẽra
        zẽa a zuo.
