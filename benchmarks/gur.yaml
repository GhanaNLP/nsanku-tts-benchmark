      sbs: 0.5542
      gen_sec: 3.63
      ref_sec: 4.74
      cer: 0.1053
      wer: 0.3125
    bible_00066:
      source: bible
      text: La sɛla tɩ ya dɩkɛ makɛ bɔ nẽrba la, ẽŋa tɩ Nawẽnnɛ wʋn dɩkɛ makɛ bɔ ya.
      sbs: 0.6597
