      gen_sec: 4.88
      ref_sec: 11.3
      cer: 0.0435
      wer: 0.125
    bible_00013:
      source: bible
      text: » La ban sẽnnɩ wɛɛsa la, tɩ bãasɩ la basɛ ba, tɩ ba ãna sõŋa.
      sbs: 0.5514
      gen_sec: 17.6
      ref_sec: 9.44
      cer: 1.5581
      wer: 1.3571
    bible_00014:
      source: bible
      text: 'Tɩ Azezi yẽ ban bɔ ẽ sɩra la, yele kɔɔrŋɔ la yetɩ: «M bia, keŋe fʋ sũure, fʋ tõon-beero
        taalɛ ka le bɔna fʋ zuo.'
      sbs: 0.7258
      gen_sec: 9.04
      ref_sec: 8.54
      cer: 0.1605
      wer: 0.68
    bible_00015:
      source: bible
      text: Yãma tarɩ la nẽrba n boe ya pʋam dɔla Abalaam zãsŋɔ.
      sbs: 0.6159
      gen_sec: 2.72
      ref_sec: 3.1
      cer: 0.2683
      wer: 0.8182
    bible_00016:
      source: bible
      text: 'La ba yetɩ: «Tɩ da kãn ẽŋɛ-ya bɛla kibsa la pʋam, tɩ nẽrba la wʋn gire mɛ.'
      sbs: 0.603
      gen_sec: 5.36
      ref_sec: 4.44
      cer: 0.4151
      wer: 0.8824
    bible_00017:
      source: bible
      text: 'Tɩ Apolɩ tɔgɛ ba yetɔga ayɩla yetɩ: «Nawẽnnɛ Sɩa n yʋʋn botɩ a nõtɔɔsa Aezayi tɔgɛ la ya
        yaabdõma la de la sɩra.'
      sbs: 0.6879
      gen_sec: 8.72
      ref_sec: 7.46
      cer: 0.2529
      wer: 0.7391
