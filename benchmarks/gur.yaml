      ref_sec: 12.7
      cer: 0.1186
      wer: 0.4667
    bible_00075:
      source: bible
      text: Mam tẽesɛ tɩ Nawẽnnɛ looge tõma sɛba n de a Tõntõnɩba la, tɩ tɩ bɔna la nẽrba la wuu
        poorʋm, ãna wʋ nẽrba tɩ ba di ba sarɩya yetɩ ba kʋ ba, tɩ dũnia dõma wuu bɩsra dee laara,
        nẽrsaalba, la malɛkadõma wuu.
