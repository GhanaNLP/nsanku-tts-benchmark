      ref_sec: 11.2
      cer: 0.1026
      wer: 0.4242
    bible_00001:
      source: bible
      text: La mam wʋn tõm sɛka tɩ mam Sɔ daan bĩŋe nõorɛ bɔ ya la, tɩ a waam wa bɔna la ya.
      sbs: 0.587
      gen_sec: 3.86
      ref_sec: 5.24
      cer: 0.2759
      wer: 0.4286
    bible_00002:
      source: bible
      text: Wakat-ẽŋa, la wʋn dɛna la toogo bɔ pɔg-sɛba n tarɩ pʋa, la sɛba n tarɩ bilɛɛsɩ tɩ ba mõgra
        la.
      sbs: 0.6147
      gen_sec: 5.25
      ref_sec: 5.48
      cer: 0.1
      wer: 0.4
    bible_00003:
      source: bible
      text: » Tɩ Nawẽnnɛ Sɩa darɛ bɔna la mam botɩ mam yẽ naam bĩmbĩnne n boe Nawẽnnɛ yire, tɩ nẽra
        zẽa a zuo.
      sbs: 0.6622
      gen_sec: 4.66
      ref_sec: 5.76
      cer: 0.1622
      wer: 0.7143
    bible_00004:
      source: bible
      text: Ba wʋn zɛbɛ la Pebila la mɛ, la Pebila la wʋn zɛbɛ yãŋɛ ba mɛ, ẽŋa n de zuudãandõma Zuudãana,
        la naadõma Naba la ĩyã.
      sbs: 0.6143
      gen_sec: 5.58
      ref_sec: 8.38
      cer: 0.1124
      wer: 0.4
    bible_00005:
      source: bible
      text: A ẽŋɛ yel-ɩr-sõŋɔ, dee sike a mẽŋa paalɛ tɩ a tarɩ yɛm.
      sbs: 0.6834
      gen_sec: 2.77
      ref_sec: 3.08
      cer: 0.25
      wer: 0.8333
    bible_00006:
      source: bible
      text: La ban daa pun ka nyɛ yele seere ti ba wan zeele de zuo ku en la, ba daa kelum yele Palete
        mɛ ti a bahɛ ti ba ku en.
      sbs: 0.6223
      gen_sec: 5.54
      ref_sec: 8.34
      cer: 0.1294
      wer: 0.3333
    bible_00007:
      source: bible
      text: La sãn dɛna Alevi yɩɩsɩ la n toosrɩ pia pʋam ayɩla la, ba de la nẽrsaalba n kiiri, la Amelkisedɛkɩ
        de la sɛka tɩ Nawẽnnɛ gõŋɔ la yetɩ, a vɔa mɛ.
      sbs: 0.6435
      gen_sec: 7.6
      ref_sec: 10.52
      cer: 0.1818
      wer: 0.4839
    bible_00008:
      source: bible
      text: Nẽr-sɛka n ka mi Nawẽnnɛ sore yɛla sõŋa la, sãn yẽ fõn tarɩ bãŋrɛ la n zĩ baga kãabgɔ
        zẽam ɔbra nẽnnɔ, la wʋn pãasɛ ẽ tɩ a mẽ obe la baga nẽnnɔ.
      sbs: 0.6287
      gen_sec: 6.81
      ref_sec: 11.32
      cer: 0.3056
      wer: 0.6061
    bible_00009:
      source: bible
      text: Nɛra woo kule la a tiŋa a tiŋa ti ba ta gulehɛ ba yuura.
      sbs: 0.6026
      gen_sec: 2.62
      ref_sec: 5.3
      cer: 0.2619
      wer: 0.5
    bible_00010:
      source: bible
      text: Bɛla tɩ ya wʋn tãagɛ tɔgɛ lerge nẽr-sɛba n wẽerɩ yõogɔ la sɛla n yẽtɩ la nini, dee ka
