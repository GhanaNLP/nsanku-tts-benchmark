      gen_sec: 3.82
      ref_sec: 5.16
      cer: 0.1509
      wer: 0.625
    bible_00058:
      source: bible
      text: A lebge la zãŋa, a ka le tara yõorɔ, a de la ba lobe ẽ basɛ yẽŋa, tɩ nẽrba nẽ ẽ la
