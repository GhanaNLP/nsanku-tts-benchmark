      sbs: 0.662
      gen_sec: 5.73
      ref_sec: 8.24
      cer: 0.0602
      wer: 0.3333
    bible_00011:
      source: bible
      text: A pɔgesaaren na ti a ele ta paaɛ yuuma ayopɔi ti a sira a ka wa bɔna.
