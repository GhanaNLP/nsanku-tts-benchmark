      sbs: 0.6418
      gen_sec: 7.04
      ref_sec: 11.48
      cer: 0.08
      wer: 0.24
    bible_00020:
      source: bible
      text: Tõma tɔgrɩ paala la sɩra vẽelga vẽelga, tɩ nẽrba sũure n mi seem na wʋn bãŋɛ tɩ tõma
        ɩtɩ sɛla n ãn sõŋa Nawẽnnɛ nifum.
