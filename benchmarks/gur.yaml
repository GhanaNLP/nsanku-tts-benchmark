      cer: 0.2295
      wer: 0.5263
    bible_00052:
      source: bible
      text: La mam yetɩ ya mɛ tɩ, baa naba Asalomõ naam n yʋʋn tarɩ pãŋa la, a yʋʋn ka tãagɛ yɛ fuugo
