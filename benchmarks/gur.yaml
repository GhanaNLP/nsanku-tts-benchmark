      gen_sec: 2.3
      ref_sec: 3.06
      cer: 0.1765
      wer: 0.4545
    bible_00074:
      source: bible
      text: Yinɛ dela yelemɛŋerɛ daana, a kan bahɛ ti makerɛ paaɛ ya gaŋɛ ya paŋa tɛka.
      sbs: 0.614
