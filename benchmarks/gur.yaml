      gen_sec: 10.69
      ref_sec: 13.2
      cer: 0.1731
      wer: 0.6279
    bible_00076:
      source: bible
      text: Bɛla yãma botɩ ba kʋ la yõvore dãana, ẽŋa tɩ Nawẽnnɛ vooge.
