      source: bible
      text: Tõma nẽra woo tõnnɩ la tõon-sɛka tɩ Zuudãana la bɔ tɔ tɩ tɩ tõm.
      sbs: 0.5293
      gen_sec: 16.16
      ref_sec: 4.26
      cer: 0.7755
      wer: 0.8571
    bible_00019:
      source: bible
      text: Gee ya han sina gee iŋɛ bala, yi yeen toe ya mam bala ti n dɛna gɔɔŋɔ, ti mam me taam ŋmɛ
