      gen_sec: 28.16
      ref_sec: 5.76
      cer: 3.1486
      wer: 2.9048
    bible_00004:
      source: bible
      text: Ba wʋn zɛbɛ la Pebila la mɛ, la Pebila la wʋn zɛbɛ yãŋɛ ba mɛ, ẽŋa n de zuudãandõma Zuudãana,
