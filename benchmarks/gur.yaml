      ref_sec: 6.28
      cer: 0.1385
      wer: 0.2857
    bible_00057:
      source: bible
      text: Yãma n boorɩ tɩ nẽrba ɩta seem bɔɔra ya la, yãma mẽ ɩta bɛla bɔɔra ba.
