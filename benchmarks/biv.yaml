      cer: 0.3125
      wer: 0.8214
    bible_00121:
      source: bible
      text: Be a Yesu 'yɛr kʊ ba, “N be naa yɩ sɛ̃ bãlãa, tɩ naa pãa lɛ lɩɛb chen a 'lɔ na tʊ̃ ma sɛ̃.
