      gen_sec: 16.2
      ref_sec: 13.52
      cer: 0.2832
      wer: 0.7143
    bible_00153:
      source: bible
      text: ba bɔ̃ɔ wʊ naa an ɩ 'lɔ lɛ ma jãnɛ sʊɔrɔ libie be a Nãaŋmɩn puorfʊ yir dɔ̃dɔr 'lɔ ban bʊɔlɔ
