      ref_sec: 5.54
      cer: 0.3269
      wer: 0.6667
    bible_00174:
      source: bible
      text: Lɛ nɩ wʊ ju lɛ a yɩn mɩ, yɩ pʊʊr na sɔ̃ɔ naa a pʊ̃pãanyã, tɩchɛ ɩn lɛ wa nyɛ yɩn go ka yɩ
