      ref_sec: 5.78
      cer: 0.2985
      wer: 0.8095
    bible_00126:
      source: bible
      text: A lɛ nɩrɛ 'lɔ jaa na tara Yesu nɩ nɛbʊ̃'yen, wʊ maa lɛ chɛnɛ ɩrɛ yeldɛɛr go ɛ, tɩchɛ a nɩnyɩnɛ
