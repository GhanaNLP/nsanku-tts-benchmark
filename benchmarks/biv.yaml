      wer: 0.9231
    bible_00194:
      source: bible
      text: Hɛrɔd nɩ a wʊ sojasɩ maal a Yesu dɛɛr na ba ɩrɛ wʊ laara. Ba su wʊ naa a nãa fuu tɩ lɩɛb wʊ
