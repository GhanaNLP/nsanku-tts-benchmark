      gen_sec: 6.12
      ref_sec: 6.42
      cer: 0.3585
      wer: 0.6842
    bible_00140:
      source: bible
      text: Ala ɩ nɩrɛ den sɛlma, kpãna, kʊsɩr kpãɛn, daar, mʊɔr bɩɩ kakɩɛ,
      sbs: 0.6646
