      wer: 0.7727
    bible_00107:
      source: bible
      text: A ba mɛ bʊtɩɩ a daar 'lɔ̃nɔ̃ ka wʊ nyɛtãan nele, na ba waan bomo wa lon bɔɔr a jie na ba dãɛn
