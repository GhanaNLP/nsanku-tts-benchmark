      gen_sec: 7.28
      ref_sec: 3.36
      cer: 0.3333
      wer: 0.6923
    bible_00191:
      source: bible
      text: N nyɛ naa a n nɩbɛ be a Ijipitɩ pɔ ban gere, n wõ naa ba hʊ̃ʊnfʊ naa suu ɩka n wa faa ba.
        Wa, ka n tʊ̃ fʊ a be a Ijipitɩ.’
