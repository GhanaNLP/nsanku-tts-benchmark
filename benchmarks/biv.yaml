      cer: 0.3115
      wer: 0.8421
    bible_00110:
      source: bible
      text: Nãaŋmɩn 'yɛ'yɛrbɛ ba ɩ ayi bɩɩ ata na ba 'yɛrɛ, tɩchɛ ka a bala na chɛ jʊrɔ kaara a lɛ ban
