      ref_sec: 5.68
      cer: 0.3103
      wer: 0.5833
    bible_00122:
      source: bible
      text: Nãaŋmɩn guor yelvɩɛl na gar a anyã na wʊ gun sɩ, ka wʊ na de sɩ 'matãan ba maal yele a jaa
