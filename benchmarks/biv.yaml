      cer: 0.2787
      wer: 0.619
    bible_00132:
      source: bible
      text: A nɩbɛrɛ tu naa a lɛ a Gamaliel na 'yɛr, tɩ na ba bʊɔl a nɩtʊ̃nsɩ fɔb ba tɩ kpãkpãan ba ɩka
