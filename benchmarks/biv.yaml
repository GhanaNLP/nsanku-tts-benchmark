      wer: 0.6842
    bible_00130:
      source: bible
      text: A anyãna lɛ sɩ 'yɛrɛ, a ba ɩ nɩrɛ 'yɛrbie sɩn jãn ɛ, tɩchɛ 'yɛrbie ala sɩn jãn a Nãaŋmɩn Sɩɛ
