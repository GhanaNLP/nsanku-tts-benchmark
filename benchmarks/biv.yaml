      ref_sec: 8.86
      cer: 0.3768
      wer: 0.75
    bible_00187:
      source: bible
      text: Ka wʊ sʊʊr ba, “Ŋmɩnɛ a yɩ gã guro? Yɩ ir sʊɔrɔ Nãaŋmɩn na yɩ taa lo a bɛɛr kaa pɔ ɛ.”
