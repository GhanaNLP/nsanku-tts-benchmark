      sbs: 0.5851
      gen_sec: 16.44
      ref_sec: 11.26
      cer: 0.3571
      wer: 0.7674
    bible_00162:
      source: bible
      text: Nɩrɛ 'lɔ jaa na chɛnɛ ɩrɛ yeldɛɛr, a nɩnyɩnɛ sɔ̃ɔnɔ̃ naa a Nãaŋmɩn nɛbinsɩ ala wʊn bin, bojũu
