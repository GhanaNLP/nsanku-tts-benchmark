      wer: 0.5714
    bible_00195:
      source: bible
      text: Fʊ̃ʊ mɩ, bɔ̃ɔ a wʊ yele sʊ̃, bojũu wʊ chɩrɛ naa a lɛ sɩn 'yɛrɛ.
