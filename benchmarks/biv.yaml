    bible_00168:
      source: bible
      text: Ala ɩ a pɔɔkɔnyɩnɛ tara na bibiir bɩɩ yɔ̃n, bala lɛ a sɛɛ ɩka ba turo a Nãaŋmɩn nɛɛ, na ba
        kaara a ba dɔɔrbɔ a yie pɔ fɩka a lɛ a ba dɔɔrbɔ na dɔ̃ɔ kaa ba. Lɛ lɛ pɛlɛ a Nãaŋmɩn pʊɔ.
