      ref_sec: 8.04
      cer: 0.2152
      wer: 0.6552
    bible_00152:
      source: bible
      text: Ka a nɩyɔɔ bala 'yɛr, “Sɩ wõn yi a Nɛɛ pɔ ɩka, a Nɩ-iraa naa 'lɔ na ben be kpo kpo, tɩ ŋmɩnɛ
