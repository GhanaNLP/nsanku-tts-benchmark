      wer: 0.6154
    bible_00129:
      source: bible
      text: Bojũu nɩrɛ jaa bɔ̃ɔn naa ɩka a sɩ Soro ɩn a Juda bal nɩrɛ, ka a bala nyã pɔ, Mosesɩ mɩ ba
