      wer: 0.9091
    bible_00188:
      source: bible
      text: Ka wʊ dɔɔ a pɔɔsarbie ka wʊ ɩ dabile a wʊ vil wʊ a fɔbaa gaal a dʊ̃n mʊɔr 'wɔfʊ jie bojũu
        baa nyɛ jie na kpɛ a sãanba kpɛfʊ jie ɛ.
