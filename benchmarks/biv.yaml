      gen_sec: 14.0
      ref_sec: 9.58
      cer: 0.494
      wer: 0.7576
    bible_00192:
      source: bible
      text: Jɔɔn 'lɔ, kʊ̃ɔ lɛ wʊ de son a nɩbɛ, tɩchɛ yɩn 'lɔ, a kʊ̃ lɛ kor ɛ, Nãaŋmɩn na so yɩ naa nɩ
