      wer: 0.6897
    bible_00113:
      source: bible
      text: A sɛb a Nãaŋmɩn gãn pɔ ɩka, “Nyɛ, n bin a kʊsɩr be a Jiyon tẽe pɔ, a kʊsɩr vɩla 'lɔ ɩn kaa
