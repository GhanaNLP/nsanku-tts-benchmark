      source: bible
      text: Bojũu sɔ̃ɔ waara ka nɩbɛ kʊ̃ lɛ chɛlɛ a wiilfʊ ala na tor ɛ, tɩchɛ ka a ba tobo jɔ̃ɔnɔ̃ ba
