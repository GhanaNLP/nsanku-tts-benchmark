      wer: 0.75
    bible_00119:
      source: bible
      text: Tɩchɛ, yɩn 'lɔ wa naa a Jiyon Tɔ̃ɔ par na ɩ a saaju Jerusalɛm, be lɛ a Nãaŋmɩn nɩbir nyã kpɩɛrɛ.
