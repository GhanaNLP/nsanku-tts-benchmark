      ref_sec: 6.02
      cer: 0.2241
      wer: 0.7895
    bible_00128:
      source: bible
      text: Be lɛ ba tãn tãn taa na ba ŋma dẽdẽme, ka a Banabasɩ de a Jɔɔn Maakɩ na wʊ kpɛ̃n a gboro chiin
