      wer: 0.8438
    bible_00189:
      source: bible
      text: An ɩ maa lɛ ɩ a Nãaŋmɩn nɩbɛ ba jaa bɩr baaraa tɩchɛ ka a wãɛfʊ nyã kʊ ma sɔr ɩka n mʊɔl a
        Kɩrɩsɩto 'yɛr nʊ̃ɔ kʊ a bala na ba ɩ a Juu nɩbɛ ɛ, nɩrɛ na kʊ̃ tʊ̃ɔ bɔ̃ɔ ɛ,
