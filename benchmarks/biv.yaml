      ref_sec: 6.5
      cer: 0.3485
      wer: 0.7692
    bible_00193:
      source: bible
      text: A anyã lɛ ba ta bʊɔrɔ a wʊ nyɔɔfʊ, tɩchɛ nɩrɛ jaa ba lɩɛb wʊ nũu sɩɩr wʊ ɛ, bojũu a wʊ bɩbir
