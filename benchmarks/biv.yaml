      gen_sec: 12.56
      ref_sec: 9.42
      cer: 0.2637
      wer: 0.7778
    bible_00135:
      source: bible
      text: Ka n wõ kɔkɔr na 'yɛr, ‘Pita ir na fʊ kʊ 'wɔb.’
