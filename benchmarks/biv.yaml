      ref_sec: 6.54
      cer: 0.3279
      wer: 0.619
    bible_00116:
      source: bible
      text: Nɩrɛ jaa wa sʊɔr fʊ bon de kʊ wʊ, nɩrɛ wa de a fʊ bon taa lɛ wa sʊrɔ wʊ go ɛ.
