      wer: 0.6471
    bible_00112:
      source: bible
      text: Maa Pɔɔl na ɩ a Yesu Kɩrɩsɩto nɩtʊ̃nãa tu a Nãaŋmɩn bɔfʊ pɔ, nɩ a nɛɛ wʊn tɩr kʊ sɩ a nyɛvʊr
