      ref_sec: 11.96
      cer: 0.2617
      wer: 0.6047
    bible_00114:
      source: bible
      text: A Simon mɩ sɔɔ naa ka ba so wʊ a Nãaŋmɩn kʊ̃ɔ a wʊ turo a Filip yʊɔrɔ, a nɛ'maa tʊ̃yɔɔ wʊn
