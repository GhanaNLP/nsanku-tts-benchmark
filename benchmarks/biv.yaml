      cer: 0.2321
      wer: 0.6857
    bible_00127:
      source: bible
      text: Ba 'yɛr kʊ yɩ ɩka, “A ber baaraa sɔ̃ɔ, nɩlaarba na turo a ba ãgãn vɔlaa na wa naa.”
