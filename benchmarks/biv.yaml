      ref_sec: 11.34
      cer: 0.161
      wer: 0.5952
    bible_00133:
      source: bible
      text: A wʊ 'yɛr kʊ ba, “Yelmãɛ lɛ n 'yɛrɛ kʊrɔ yɩ ɩka, ba maa de Nãaŋmɩn 'yɛ'yɛrɛ a wʊ mãɛ tẽe pɔ
