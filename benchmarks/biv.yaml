      ref_sec: 6.36
      cer: 0.3617
      wer: 0.6667
    bible_00141:
      source: bible
      text: “Ala ɩ a yɩ ãsʊɔ tara na piir kɔbaa ka a bʊ̃'yen wa bɔr, a ba ɩ wʊn bar a kɔbaa forbir ala
        a pɛchiin baa pɔ, tɩ yʊɔrɔ bʊɔrɔ a bʊ̃'yen 'lɔ tɩ tãn a sɔ̃ɔ 'lɔ jaa wʊn wa tɩ nyɛ wʊ bɩɩ?
