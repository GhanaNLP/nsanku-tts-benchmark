      source: bible
      text: tɩchɛ dãbãɛ tɛɛ lɛ sɩ chɛlɛ nɩ a 'yɛr tɔɔrfʊ, nɩ a bũu dagel 'lɔ na wa di a Nãaŋmɩn dɔ̃dẽme.
