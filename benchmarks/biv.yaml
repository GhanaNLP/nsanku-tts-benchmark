      cer: 0.2708
      wer: 0.9333
    bible_00124:
      source: bible
      text: Ba ma dãn tiitasɩ ayi kobsɩ ayi. Tɩchɛ ãsʊɔ kʊ lo tẽe ɛ, ala baa ɩ a yɩ Sãa Nãaŋmɩn bɔfʊ lɛ
