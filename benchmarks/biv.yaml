      ref_sec: 9.88
      cer: 0.2258
      wer: 0.5429
    bible_00184:
      source: bible
      text: A nɩbɛ na wõ a nɩtɔ̃, ka a ŋmara ba a nyãn, ka ba sʊʊr a Pita nɩ a nɩtʊ̃nsɩ, “N yɛɛr, ŋmɩnɛ
