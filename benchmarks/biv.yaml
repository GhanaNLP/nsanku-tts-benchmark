    bible_00136:
      source: bible
      text: Tɩ na wʊ nyɔɔ a daba nũsʊ̃ɔ sʊ̃ʊ wʊ ka wʊ ir ka a ɩ a gbɛpɛlɛ nɩ a nakɔɔtɩɛ kpɛ̃mɛ naa.
      sbs: 0.6297
      gen_sec: 5.76
      ref_sec: 6.34
      cer: 0.2581
      wer: 0.8182
    bible_00137:
      source: bible
      text: Tɩchɛ a Faraseemɩne nɩ a Mosesɩ Nɛɛ wiwiilbe hũhũnõ nɩ a yele nyã sʊrɔ a Yesu poturbo, “Bo
        lɛ so ka yɩ 'mataa dire nɩ a lõpodierbe nɩ a tʊ̃dɛbɛ tʊ̃nbɔ?”
      sbs: 0.656
      gen_sec: 9.92
      ref_sec: 12.38
      cer: 0.1478
      wer: 0.6452
    bible_00138:
      source: bible
      text: An yi a dɩna nɩbɛ anũu na kpɩɛrɛ yir na ŋman jiir ayi. Ka ata jɛɛrɛ nɩ a ayi ka ayi mɩ jɛɛrɛ
        nɩ a ata.
      sbs: 0.7088
      gen_sec: 8.16
      ref_sec: 7.66
      cer: 0.0533
      wer: 0.2692
    bible_00139:
      source: bible
      text: A wʊ yele na ɩn nʊ̃ɔ kpɛ fʊ ka fʊ chɩlɛ ka nɩyɔɔ mɩ chɩlɛ a wʊ dɔɔfʊ jũu.
      sbs: 0.6853
      gen_sec: 5.04
      ref_sec: 6.42
      cer: 0.1698
      wer: 0.4737
    bible_00140:
      source: bible
      text: Ala ɩ nɩrɛ den sɛlma, kpãna, kʊsɩr kpãɛn, daar, mʊɔr bɩɩ kakɩɛ,
      sbs: 0.7625
      gen_sec: 5.76
      ref_sec: 6.36
      cer: 0.1702
      wer: 0.6667
    bible_00141:
      source: bible
      text: “Ala ɩ a yɩ ãsʊɔ tara na piir kɔbaa ka a bʊ̃'yen wa bɔr, a ba ɩ wʊn bar a kɔbaa forbir ala
        a pɛchiin baa pɔ, tɩ yʊɔrɔ bʊɔrɔ a bʊ̃'yen 'lɔ tɩ tãn a sɔ̃ɔ 'lɔ jaa wʊn wa tɩ nyɛ wʊ bɩɩ?
      sbs: 0.6689
      gen_sec: 12.0
      ref_sec: 10.48
      cer: 0.2063
      wer: 0.5111
    bible_00142:
      source: bible
      text: Be a Sisariya, daba kɔ̃ɔ dɔ̃ɔ be be a ba bʊɔlɔ wʊ Konɩlɩyɔs, wʊ be naa a sojasɩ gbul 'lɔ pɔ
        a Itali nɩbɛ na bʊɔlɔ a sojasɩ kɔbaa nɩkpɛ̃ɛ.
      sbs: 0.7019
      gen_sec: 9.76
      ref_sec: 10.02
      cer: 0.1485
      wer: 0.4333
    bible_00143:
      source: bible
      text: Yesu dʊɔn kaa nyɛ a tara dẽme na 'yɔ̃ɔnɔ̃ a ba libie be a Nãaŋmɩn puorfʊ yir.
      sbs: 0.6897
      gen_sec: 5.04
      ref_sec: 5.2
      cer: 0.193
      wer: 0.5882
    bible_00144:
      source: bible
      text: Tɩchɛ lɛ a nɩtʊ̃nsɩ, Banabasɩ nɩ a Pɔɔl na wa wõ a lɛ, ba tɔɔn a ba fuusɩ chɩɛr tɩ jo kpɛ
        be a nɩyɔɔ bala pɔ tɩ tãna,
      sbs: 0.6628
      gen_sec: 8.64
      ref_sec: 9.1
      cer: 0.0706
      wer: 0.4138
    bible_00145:
      source: bible
      text: “Saa kpãkpãan yɩ jaa 'yɛr ɩka, yɩ taa lɛ ɩrɛ wa pʊrɔ a yuor nyãna wile nɩ nɩrɛ jaa go ɛ? Tɩchɛ
        a yɩ chɛnɛ tɔr tɩ sɛɛ a Jerusalɛm nɩ a yɩ wiilfʊ nyãna, na yɩ bʊɔrɔ ɩka yɩ de a daba nyãna jãɩ
        yele dɔɔl sɩ.”
      sbs: 0.6569
      gen_sec: 16.16
      ref_sec: 13.9
      cer: 0.0867
      wer: 0.2917
    bible_00146:
      source: bible
      text: Filip chen tɩ 'yɛr kʊ Andiru ka ba 'mataa chen tɩ 'yɛr a Yesu.
      sbs: 0.6492
      gen_sec: 3.12
      ref_sec: 4.1
      cer: 0.3111
      wer: 0.7857
    bible_00147:
      source: bible
      text: A kʊ̃ɔ nyã nyɛtãan fɩka a Nãaŋmɩn kʊ̃ɔ sofʊ na faa yɩ mɩ a pʊ̃pãanyã, a ba ɩ ãgãn dɛɛr pɛɛ
        barfʊ lɛ ɛ, tɩchɛ a nɛɛ yɩn tɩr kʊ Nãaŋmɩn nɩ pʊtɩvɩla. Yɩ nyɛn faafʊ tu a Kɩrɩsɩto kũu irfʊ pɔ.
      sbs: 0.6476
      gen_sec: 14.32
      ref_sec: 13.08
      cer: 0.1151
      wer: 0.3333
    bible_00148:
      source: bible
      text: Ka a sɩ pãa na 'la 'yɛr ɩka, “A n Soro lɛ ɩ a n sʊ̃nɔ̃, ka n kʊ̃ joro dãbãɛ ɛ. Bo lɛ nɩrɛ
        na ɩ ma?”
      sbs: 0.7044
      gen_sec: 7.52
      ref_sec: 8.14
      cer: 0.082
      wer: 0.2143
    bible_00149:
      source: bible
      text: Bojũu ãgãn bʊ̃'yen lɛ be be, nɩ a Sɩɛ bʊ̃'yen, nɩtãa lɛ a Nãaŋmɩn na bʊɔl yɩ, ka yɩ tara tɩɛrtɔ
        jie bʊ̃'yen.
      sbs: 0.7152
      gen_sec: 8.96
      ref_sec: 7.76
      cer: 0.0658
      wer: 0.2174
    bible_00150:
      source: bible
      text: An chɛnɛ ɩ mɔ̃tɔ̃ɔ, sɩn tʊ̃ naa a 'lɔ na tʊ̃ ma tʊ̃mɔ̃. Wɛr na sɔb naa ka nɩrɛ kʊ̃ lɛ tʊ̃ɔ
        tʊ̃mɔ̃ tʊ̃ ɛ.
      sbs: 0.603
      gen_sec: 7.52
      ref_sec: 6.32
      cer: 0.2
      wer: 0.64
    bible_00151:
      source: bible
      text: Tɩchɛ Yesu bɔ̃ɔn a lɛ ban tɩɛrɛ na wʊ 'yɛr kʊ a daba 'lɔ nũu na kpi, “Ir ara ka nɩrɛ jaa nyɛ
        fʊ.” Ka a daba ir ara.
      sbs: 0.6244
      gen_sec: 8.24
      ref_sec: 8.04
      cer: 0.2911
      wer: 0.4828
    bible_00152:
      source: bible
      text: Ka a nɩyɔɔ bala 'yɛr, “Sɩ wõn yi a Nɛɛ pɔ ɩka, a Nɩ-iraa naa 'lɔ na ben be kpo kpo, tɩ ŋmɩnɛ
        a ɩ a fʊ 'yɛr ɩka ban 'mɔɔn a Nɩsaal Bie a saaju? An lɛ a Nɩsaal Bie 'lɔ?”
      sbs: 0.6882
      gen_sec: 12.4
      ref_sec: 13.52
      cer: 0.0442
      wer: 0.0952
    bible_00153:
      source: bible
      text: ba bɔ̃ɔ wʊ naa an ɩ 'lɔ lɛ ma jãnɛ sʊɔrɔ libie be a Nãaŋmɩn puorfʊ yir dɔ̃dɔr 'lɔ ban bʊɔlɔ
        a, Vɩla. Ka a ɩ ba chĩcham naa 'maa ba nɛɛ a lɛ na ɩ.
      sbs: 0.6368
      gen_sec: 10.8
      ref_sec: 12.1
      cer: 0.1471
      wer: 0.3611
    bible_00154:
      source: bible
      text: Ba ŋman a mibe ala na nyɔɔr a nɛbinyɔɔrsɩ ala bar, na ba mɩ lɛ for a vuulsɩ ala na ma dɛnɛ
        a gboro tɩ pãa yɛr a fɔbaa bar a gboro niem ka a sɛsɛbɛ pãa tɔɔrɔ ba chiine a bire pɔ.
      sbs: 0.691
      gen_sec: 13.52
      ref_sec: 12.66
      cer: 0.0526
      wer: 0.1395
    bible_00155:
      source: bible
      text: A lɛ jũu, n bʊɔrɔ naa ɩka yɩ bɔ̃ɔ ɩka a Nãaŋmɩn den a wʊ faafʊ 'yɛr tɩ kʊ a bala na ba ɩ a
        Juu nɩbɛ ɛ na chɛlɛ naa.”
      sbs: 0.6838
      gen_sec: 9.68
      ref_sec: 8.66
      cer: 0.1235
      wer: 0.2581
    bible_00156:
      source: bible
      text: Bojũu, lɛ a Jona na dɔ̃ɔ ɩ jãnɛ kʊ a Ninive dẽme, lɛ mɩ lɛ a maa Nɩsaal Bie na ɩ a jãnɛ kʊ
        a dɩna nɩbɛ.
      sbs: 0.6829
      gen_sec: 7.12
      ref_sec: 6.98
      cer: 0.1507
      wer: 0.4444
    bible_00157:
      source: bible
      text: A sɔ̃ɔ 'lɔ̃nɔ̃ lɛ a pɔɔfʊ die guguro de ba yin a tãsɔɔ 'lɔ̃nɔ̃ na wʊ tɩ pɛɛ a ba natɩɛ tɩchɛ
        a ba mɩ tɔ̃ɔ so a 'lɔ nɩ a wʊ yir dẽme ba jaa a Nãaŋmɩn kʊ̃ɔ.
      sbs: 0.6718
      gen_sec: 13.04
      ref_sec: 10.6
      cer: 0.1048
      wer: 0.3846
    bible_00158:
      source: bible
      text: Bojũu saa waan bon jaa a wɛr nyã pɔ ɛ, na sɩ kʊ̃ lɛ de bon jaa yin a wɛr pɔ ɛ.
      sbs: 0.7172
      gen_sec: 5.36
      ref_sec: 5.78
      cer: 0.2037
      wer: 0.5
    bible_00159:
      source: bible
      text: Ka a Juu nɩrɛ ãsʊɔ yuor na di Apolosɩ yin be a Aleksandiriya na wʊ wa a Efesus tẽe pɔ. Wʊ
        ɩ naa nɩrɛ na jãn na wʊ bɔ̃ɔ a Nãaŋmɩn gãma tɩ bɔ̃ɔ 'yɛr sʊ̃.
      sbs: 0.661
      gen_sec: 11.36
      ref_sec: 13.08
      cer: 0.1364
      wer: 0.4167
    bible_00160:
      source: bible
      text: Yɩ tɩɛr kaa a Isɩral nɩbɛ pɔ. A ba ɩ a bala na ma di a Nãaŋmɩn bɔɔrlo bomo ma pʊɔn a bɔɔr
        lofʊ jie ɛ?
      sbs: 0.6904
      gen_sec: 7.28
      ref_sec: 6.98
      cer: 0.1622
      wer: 0.3846
    bible_00161:
      source: bible
      text: Nɩrɛ 'lɔ jaa na sɔɔ a Nãaŋmɩn Bie, a dãasɩɛ nyã be naa a wʊ nyãa pɔ. Nɩrɛ nyã jaa na ba wa
        sɔɔ Nãaŋmɩn ɛ, wʊ bʊɔl wʊn jir ŋmara bojũu waa sɔɔ a dãasɩɛ wʊn di a wʊ Bie 'yɔ̃ɔ ɛ.
      sbs: 0.6636
      gen_sec: 11.2
      ref_sec: 11.26
      cer: 0.1349
      wer: 0.4419
    bible_00162:
      source: bible
      text: Nɩrɛ 'lɔ jaa na chɛnɛ ɩrɛ yeldɛɛr, a nɩnyɩnɛ sɔ̃ɔnɔ̃ naa a Nãaŋmɩn nɛbinsɩ ala wʊn bin, bojũu
        waa tara Nãaŋmɩn nɩ nɛbʊ̃'yen ɛ.
      sbs: 0.6858
      gen_sec: 10.4
      ref_sec: 7.98
      cer: 0.1053
      wer: 0.5833
    bible_00163:
      source: bible
      text: Lɛ lɛ ba wob a ala na chɛ 'yɔ̃ɔ pɛr pie nɩ ayi a chi paanʊ̃ɔ anũu ala.
      sbs: 0.6571
      gen_sec: 4.96
      ref_sec: 5.12
      cer: 0.1633
      wer: 0.7222
    bible_00164:
      source: bible
      text: A sojasɩ na wa kpa a Yesu baar, ba põn a wʊ fuusɩ jiir anaar ka ãsʊɔ jaa 'mɔɔ wʊ bon. A wa
        chɛn a fuu wõo 'lɔ na ba tara nɛɛ ɛ, bʊ̃bʊ̃'yen lɛ ba wob yin a saaju tɩ baar a gbɛɛ pɔ.
      sbs: 0.6842
      gen_sec: 10.4
      ref_sec: 13.28
      cer: 0.1825
      wer: 0.5778
    bible_00165:
      source: bible
      text: An wa ta a pʊ̃pãanyã, yaa de a n yuor sʊɔr bon gba ɛ. Yɩ sʊɔr, yɩn nyɛ naa, ka yɩ pʊpɛl na
        sɛɛ.
      sbs: 0.7197
      gen_sec: 7.68
      ref_sec: 6.98
      cer: 0.3636
      wer: 0.5833
    bible_00166:
      source: bible
      text: Ka wʊ 'yɛr, “Yɩ nyɛ ka, n nyɛ naa saaju na yuo ka a Nɩsaal Bie ara a Nãaŋmɩn nũsʊ̃ɔ jie.”
      sbs: 0.6331
      gen_sec: 6.88
      ref_sec: 5.98
      cer: 0.0806
      wer: 0.1905
    bible_00167:
      source: bible
      text: Ka a Tomasɩ 'yɛr, “N Soro nɩ n Nãaŋmɩn.”
      sbs: 0.7029
      gen_sec: 3.12
      ref_sec: 3.46
      cer: 0.1852
      wer: 0.5556
    bible_00168:
      source: bible
      text: Ala ɩ a pɔɔkɔnyɩnɛ tara na bibiir bɩɩ yɔ̃n, bala lɛ a sɛɛ ɩka ba turo a Nãaŋmɩn nɛɛ, na ba
        kaara a ba dɔɔrbɔ a yie pɔ fɩka a lɛ a ba dɔɔrbɔ na dɔ̃ɔ kaa ba. Lɛ lɛ pɛlɛ a Nãaŋmɩn pʊɔ.
      sbs: 0.7083
      gen_sec: 13.92
      ref_sec: 14.58
      cer: 0.053
      wer: 0.25
    bible_00169:
      source: bible
      text: A 'lɔ na de nie wa 'yɛr naa, ‘Nɩkpɛ̃ɛ, a fʊ libir dɔɔn pie dɔɔl.’
      sbs: 0.7113
      gen_sec: 4.64
      ref_sec: 4.72
      cer: 0.0698
      wer: 0.2667
    bible_00170:
      source: bible
      text: A lɛ jũu, yɩ ta ɩ jɔlɔ ɛ, tɩchɛ yɩ bɔ̃ɔ a ala a sɩ Soro na bʊɔrɔ.
      sbs: 0.7302
      gen_sec: 4.56
      ref_sec: 4.8
      cer: 0.2273
      wer: 0.5
    bible_00171:
      source: bible
      text: Jɔɔn kpãa ban nɩ yelyɔɔ na wʊ 'yɛr a Nãaŋmɩn 'yɛr kʊ ba.
      sbs: 0.6784
      gen_sec: 3.92
      ref_sec: 3.36
      cer: 0.1463
      wer: 0.6923
    bible_00172:
      source: bible
      text: A wiilfʊ anyã yire na a dãnfʊ Nãaŋmɩn na ɩ a tɩɩr sʊɔ 'yɛr nʊ̃ɔ wʊn de kʊ ma sɛ̃.
      sbs: 0.628
      gen_sec: 5.84
      ref_sec: 6.0
      cer: 0.1552
      wer: 0.7
    bible_00173:
      source: bible
      text: na yɩ bɔ̃ɔ a nʊ̃fʊ na gar a bɔ̃ɔfʊsɩ a jaa, a yɩ pãa be a lɛ a Nãaŋmɩn na be.
      sbs: 0.6793
      gen_sec: 5.52
      ref_sec: 5.54
      cer: 0.1923
      wer: 0.4762
    bible_00174:
      source: bible
      text: Lɛ nɩ wʊ ju lɛ a yɩn mɩ, yɩ pʊʊr na sɔ̃ɔ naa a pʊ̃pãanyã, tɩchɛ ɩn lɛ wa nyɛ yɩn go ka yɩ
        pʊʊl pɛl, ka a nɩrɛ jaa kʊ̃ tʊ̃ɔ faa wʊ ɛ.
      sbs: 0.6974
      gen_sec: 10.8
      ref_sec: 9.54
      cer: 0.1111
      wer: 0.2571
    bible_00175:
      source: bible
      text: A anyãna lɛ wʊ tɩɛr a kõr jaa na wʊ wa de a Yesu Kɩrɩsɩto a sɩ Soro na wʊ maal a wɛr.
      sbs: 0.7218
      gen_sec: 6.0
      ref_sec: 6.8
      cer: 0.0968
      wer: 0.4348
    bible_00176:
      source: bible
      text: Ka a paal nɩkpɛ̃ɛ kar a gãn tɩ na wʊ sʊʊr a Pɔɔl a tẽbuor wʊn yi, wʊn wa bɔ̃ɔn ɩka a Sɩlɩsɩya
        lɛ wʊ yi.
      sbs: 0.6663
      gen_sec: 8.56
      ref_sec: 7.28
      cer: 0.1351
      wer: 0.4615
    bible_00177:
      source: bible
      text: ɩka yɩ ta vɛ̃ ka a sɔb yɩ nɩbir a nɩbɛ bamɩne na 'yɛrɛ ɩka sɩn lɛ 'yɛr bɩɩ, sɛb ɩka a Yesu
        wan baar.
      sbs: 0.6732
      gen_sec: 7.12
      ref_sec: 8.56
      cer: 0.0
      wer: 0.24
    bible_00178:
      source: bible
      text: a nɩbɛ banyãna lɛ sɔɔ kũu a sɩ Soro Yesu Kɩrɩsɩto yuor jũu.
      sbs: 0.6576
      gen_sec: 3.44
      ref_sec: 3.12
      cer: 0.087
      wer: 0.4615
    bible_00179:
      source: bible
      text: A n 'yɛr ɩn kʊrɔ yɩ nɩ nyã. Yɩ nʊ̃ taa nɩtãa lɛ ɩn nʊ̃ yɩ.
      sbs: 0.7034
      gen_sec: 3.36
      ref_sec: 3.82
      cer: 0.2895
      wer: 0.6875
    bible_00180:
      source: bible
      text: A 'yɛr wa ɩ naa nɩrɛ na wʊ jãnɛ a sɩ sɛ̃. Sɩ nyɛ naa a wʊ tɩɩr, a tɩɩr nyã na ɩ a Sãa Bidabʊ̃'yen
        tɛɛ. 'Lɔ lɛ yi a Sãa sɛ̃ wa, na wʊ tara wãɛfʊ nɩ yelmãɛ.
      sbs: 0.6798
      gen_sec: 11.52
      ref_sec: 10.98
      cer: 0.1154
      wer: 0.3
    bible_00181:
      source: bible
      text: Ka n sʊʊr, ‘Soro, an lɛ fʊ ɩ?’ Ka a kɔkɔr 'yɛr, ‘Maa lɛ a Yesu na yi a Najaretɩ a 'lɔ fʊn
        gere.’
      sbs: 0.7034
      gen_sec: 8.4
      ref_sec: 8.62
      cer: 0.1452
      wer: 0.2917
    bible_00182:
      source: bible
      text: Be lɛ a Yesu pãa sʊʊr ba, “Ɩn dɔ̃ɔ tʊ̃ yɩ a nũjaala, yaa tara libie ɛ, bɩɩ wʊɔ nɩ nafɔɔr ɛ,
        yɩ dɔ̃ɔ bɔ bon faa bɩɩ?” A ba 'yɛr ɩka baa bɔ bon jaa faa ɛ.
      sbs: 0.7583
      gen_sec: 10.64
      ref_sec: 11.8
      cer: 0.1359
      wer: 0.3947
    bible_00183:
      source: bible
      text: Maa bɔfʊ lɛ ɩka yɩ ta tara yele jaa tɩɛr ɛ. An ɩ daba baa tara pɔɔ ɛ, a sɩ Soro yele lɛ wʊ
        ma tɩɛrɛ, lɛ wʊn na ɩ pɛl a sɩ Soro pʊɔ.
      sbs: 0.7407
      gen_sec: 10.08
      ref_sec: 9.88
      cer: 0.1398
      wer: 0.4286
    bible_00184:
      source: bible
      text: A nɩbɛ na wõ a nɩtɔ̃, ka a ŋmara ba a nyãn, ka ba sʊʊr a Pita nɩ a nɩtʊ̃nsɩ, “N yɛɛr, ŋmɩnɛ
        sɩn ɩ?”
      sbs: 0.6784
      gen_sec: 8.64
      ref_sec: 8.12
      cer: 0.1212
      wer: 0.32
    bible_00185:
      source: bible
      text: A wʊ mãɛ lɛ tuo a sɩ yeldɛbɛ a wʊ ãgãn pɔ a daa ju, ka sɩ mɩ na kpi kʊ yelbier tɩ be be kʊ
        yeltorsɩ. A wʊ fɛlɛ ala jũu lɛ sãa sɩ.
      sbs: 0.6847
      gen_sec: 9.6
      ref_sec: 10.56
      cer: 0.1413
      wer: 0.2857
