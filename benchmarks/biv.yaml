      wer: 0.6765
    bible_00131:
      source: bible
      text: Daar kɔ̃ɔ a sɩdɛɛr sʊʊr ba naa, “N bɔ̃ɔn Yesu naa bɔ̃ɔ Pɔɔl, tɩchɛ a yɩn mɩ ba boo yɩ ɩ?”
