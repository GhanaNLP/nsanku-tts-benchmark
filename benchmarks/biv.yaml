      cer: 0.2574
      wer: 0.7667
    bible_00143:
      source: bible
      text: Yesu dʊɔn kaa nyɛ a tara dẽme na 'yɔ̃ɔnɔ̃ a ba libie be a Nãaŋmɩn puorfʊ yir.
