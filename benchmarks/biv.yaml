      cer: 0.5
      wer: 0.9375
    bible_00180:
      source: bible
      text: A 'yɛr wa ɩ naa nɩrɛ na wʊ jãnɛ a sɩ sɛ̃. Sɩ nyɛ naa a wʊ tɩɩr, a tɩɩr nyã na ɩ a Sãa Bidabʊ̃'yen
