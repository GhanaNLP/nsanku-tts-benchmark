      ref_sec: 11.06
      cer: 0.2105
      wer: 0.5588
    bible_00120:
      source: bible
      text: Fʊ̃ʊ wa maal a bier nyã tɔ kʊ a fʊ yɛɛr, fʊ 'yɔ̃ɔn a ba tɩɛrsɩ baal, Yesu Kɩrɩsɩto mãɛ lɛ
