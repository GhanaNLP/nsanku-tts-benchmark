      gen_sec: 18.96
      ref_sec: 10.56
      cer: 0.3804
      wer: 0.6571
    bible_00186:
      source: bible
      text: Ɩn wiil ban yelfɛrsɩ na yi saaju ka a jãnsɩ mɩ be ka a tẽe, jãɩ, bũu nɩ jʊʊr na den jie wʊ
