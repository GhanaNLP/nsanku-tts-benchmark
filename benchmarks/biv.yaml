      ref_sec: 7.66
      cer: 0.3288
      wer: 0.8
    bible_00115:
      source: bible
      text: Ka Tomasɩ sʊʊr wʊ, “N Soro, sɩn ba bɔ̃ɔ a jie fʊn chiine ɛ, ŋmɩnɛ sɩn ɩrɛ wa bɔ̃ɔ a sɔr?”
