      wer: 0.6897
    bible_00108:
      source: bible
      text: Tɩchɛ a sɩ ãsʊɔ jaa nyɛn a wãɛfʊ kʊfʊ dẽdẽme nɩtãa lɛ a Kɩrɩsɩto na põ.
