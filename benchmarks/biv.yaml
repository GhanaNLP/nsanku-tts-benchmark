      cer: 0.3594
      wer: 0.7391
    bible_00134:
      source: bible
      text: A nʊ̃fʊ nɩ nyã ɩka sɩ turo a lɛ a Nãaŋmɩn na bin a wʊ nɛɛ kʊ sɩ. Wʊ 'yɛr ɩka sɩ nʊ̃ taa nɩtãa
