      ref_sec: 10.42
      cer: 0.1867
      wer: 0.76
    bible_00123:
      source: bible
      text: Be lɛ wʊ nyɛ Yesu na tala, ka wʊ 'yɛr, “Yɩ nyɛ a Nãaŋmɩn Pɛraabile.”
