      gen_sec: 16.92
      ref_sec: 14.58
      cer: 0.3333
      wer: 0.7273
    bible_00169:
      source: bible
      text: A 'lɔ na de nie wa 'yɛr naa, ‘Nɩkpɛ̃ɛ, a fʊ libir dɔɔn pie dɔɔl.’
