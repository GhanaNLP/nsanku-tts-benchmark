      wer: 0.8125
    bible_00109:
      source: bible
      text: Bojũu wʊ dɔ̃ɔ kaara niem ɩka wʊ nyɛ yir par ban sʊ̃ɔ, ka a Nãaŋmɩn mãɛ ɩ a mɩmɩɛrɛ.
