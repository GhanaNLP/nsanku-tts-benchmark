      gen_sec: 8.2
      ref_sec: 8.14
      cer: 0.3443
      wer: 0.7143
    bible_00149:
      source: bible
      text: Bojũu ãgãn bʊ̃'yen lɛ be be, nɩ a Sɩɛ bʊ̃'yen, nɩtãa lɛ a Nãaŋmɩn na bʊɔl yɩ, ka yɩ tara tɩɛrtɔ
