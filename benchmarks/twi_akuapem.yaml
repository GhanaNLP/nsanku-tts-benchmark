      cer: 0.0816
      wer: 0.5
    bible_00077:
      source: bible
      text: Ɛbɛyɛ hintabea ne onwini wɔ awia anoden mu, na osu ne ahum mu nso, ɛbɛyɛ guankɔbea ne hintabea.
