      gen_sec: 3.16
      ref_sec: 3.14
      cer: 0.0588
      wer: 0.1111
    bible_00094:
      source: bible
      text: 'Saa adehu yi baa afe a ɔhene Ahas wui no: Munnni ahurusi, mo Filistifo.'
