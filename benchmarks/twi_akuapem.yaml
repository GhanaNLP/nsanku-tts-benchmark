      cer: 0.1905
      wer: 0.5
    bible_00084:
      source: bible
      text: Wɔn nsusuwii bɔne no dɛɛdɛɛ anadwo mu nyinaa; anɔpa, ɛdɛw te sɛ ogyatannaa.
      sbs: 0.7319
      gen_sec: 5.46
      ref_sec: 3.82
      cer: 0.1833
      wer: 0.5385
    bible_00085:
      source: bible
      text: “Me de, eyi yɛ me ne wɔn apam,” sɛnea Awurade se ni.
