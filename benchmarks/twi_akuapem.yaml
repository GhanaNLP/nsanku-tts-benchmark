      gen_sec: 3.67
      ref_sec: 3.32
      cer: 0.2195
      wer: 0.7273
    bible_00089:
      source: bible
      text: na yɛn trenee nneyɛe nyinaa te sɛ ntamagow fi; yɛn nyinaa akisa te sɛ ahaban.
