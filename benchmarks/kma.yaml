      sbs: 0.6694
      gen_sec: 9.44
      ref_sec: 8.78
      cer: 0.0816
      wer: 0.28
    bible_00073:
      source: bible
      text: Die wɩa die Yisa die dɩ nagɩ paanʋkʋ a nagɩ yɩ ba, ta bɩ nagɩ zaasɩbʋ dɩaŋ a yɩ ba.
      sbs: 0.6977
      gen_sec: 6.4
      ref_sec: 6.12
      cer: 0.0645
      wer: 0.15
    bible_00074:
      source: bible
      text: Ba baarɩ dɩ, “Yisa, vuodieke dɩ nyɩnna Nazeriti wa.”
