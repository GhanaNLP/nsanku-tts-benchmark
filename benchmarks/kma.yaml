      ref_sec: 4.58
      cer: 0.0769
      wer: 0.5556
    bible_00075:
      source: bible
      text: Kʋrɩŋ ma wa kɩkaabɩtɩba mi wo die kpiye mɩŋ ta ba chanchaalɩŋ dɩ tuose ba tʋʋma, die wɩa die
