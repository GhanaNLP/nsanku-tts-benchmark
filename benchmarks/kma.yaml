      ref_sec: 10.32
      cer: 0.3333
      wer: 0.7667
    bible_00172:
      source: bible
      text: Ama ba bataŋ dɩ baarɩ dɩ, “Lalɩa tʋntʋmbɩatɩ tieŋ dɩ baaŋ bɩagɩ tʋŋ mamachi wʋkpɩɩka gie?”
