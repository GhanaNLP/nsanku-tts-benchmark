      gen_sec: 4.64
      ref_sec: 4.36
      cer: 0.0816
      wer: 0.2308
    bible_00069:
      source: bible
      text: Vuosi gie mana ba yada wɩa Ŋmɩŋ die dɩ bɩrɩ ba ama ba wʋnyɩ mana die ka tuo wudieke Ŋmɩŋ dɩ
