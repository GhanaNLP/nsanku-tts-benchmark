      gen_sec: 16.4
      ref_sec: 10.86
      cer: 0.2252
      wer: 0.6176
    bible_00174:
      source: bible
      text: “N Chʋa, saŋka tʋgɩya mɩŋ. Vaa manɩŋ fʋ Bʋa Dembike ye bɩrɩŋ, amʋ n gbaŋ n nan vaa fʋ ye bɩrɩŋ.
