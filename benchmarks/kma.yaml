    bible_00191:
      source: bible
      text: Yisa die dɩ pɩasɩ wa dɩ, “Fʋ yene mɩŋ wɩa fʋ yi yada? Sʋgɩfɩalɩŋ bie vuodiekemba dɩ kana ka
