      gen_sec: 4.32
      ref_sec: 6.16
      cer: 0.5147
      wer: 0.875
    bible_00125:
      source: bible
      text: ta tɩ nagɩ tɩnɩŋ tɩ saŋŋa a yi Ŋmɩŋ jʋʋsɩŋ mi aŋaŋ Ŋmɩŋ wɩa dagɩŋ ma.”
