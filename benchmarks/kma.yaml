      wer: 0.2727
    bible_00098:
      source: bible
      text: Die gbɩgbarɩtʋ wa dɩ balɩ a yi Pɔɔli dɩ, “Nyɩŋkʋraha yɩ wa nʋaŋ dɩ n vaa fʋnɩŋ aŋaŋ Silasi
