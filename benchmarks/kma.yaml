      gen_sec: 7.33
      ref_sec: 9.34
      cer: 0.339
      wer: 0.75
    bible_00149:
      source: bible
      text: Ama tɩ Gbɩgbatɩtaantʋ Yisa Masia keniŋ yuorine a dagɩ tɩ, wʋnɩŋ Yisa Masia die chʋʋsɩna kuŋ
        hagɩrɩŋ, ta bɩ dagɩ tɩ dɩ tɩ saagɩ ʋ wʋvɩɩnaha tɩ nan ye miivoli dieke dɩ wone kpatɩŋ.
      sbs: 0.6249
      gen_sec: 8.5
      ref_sec: 14.46
      cer: 0.1972
      wer: 0.6471
    bible_00150:
      source: bible
      text: Yisa die dɩ yiŋŋi balɩ wa dɩ, “N naa, bɩa fʋ yaala n yi? N saŋŋa ye ka tʋgɩya.”
