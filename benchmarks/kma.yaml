      ref_sec: 9.22
      cer: 0.0476
      wer: 0.1818
    bible_00092:
      source: bible
      text: Die daa wʋnyɩ die benne ba wasa wa Josefu, die ʋ nyɩŋ wa Juu vuosi tɩŋ ba wasɩnana Arimatia.
