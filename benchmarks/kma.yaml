      gen_sec: 10.48
      ref_sec: 9.14
      cer: 0.1391
      wer: 0.3636
    bible_00130:
      source: bible
      text: Dama yuŋ vuosi dɩ gʋʋra ta bataŋ dɩ nyuo daaŋ a buge.
      sbs: 0.7063
      gen_sec: 2.96
      ref_sec: 3.64
      cer: 0.0488
      wer: 0.25
    bible_00131:
      source: bible
      text: Wʋvɩɩnaha gie dɩ kenne nɩ jigiri tʋga jigiŋ mana mɩŋ tɩŋgbaŋka gie me ta wʋnsa vuosi beriŋ
        sɩba ka wʋnsɩna nɩ beriŋ a nyɩŋ daa dieke die nɩ wʋnna ta sɩba Ŋmɩŋ zɔɔlɩnchɩgɩla aŋaŋ wusieke
