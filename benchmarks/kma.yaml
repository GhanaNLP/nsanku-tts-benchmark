      wer: 0.8095
    bible_00175:
      source: bible
      text: Davidi beriŋ die dɩ suuli Ŋmɩŋ nine, ta die keŋ jʋʋsɩ dɩ ʋ vaa ʋ mɩɩ tigiŋ a yɩ wʋnɩŋ Ŋmɩŋ
