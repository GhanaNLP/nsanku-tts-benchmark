      wer: 0.2609
    bible_00115:
      source: bible
      text: Yisa die dɩ bɩrɩma a gʋta aŋaŋ yɩaŋ ta Ŋmɩŋ aŋaŋ vuota sʋgɩtɩ dɩ fɩala ʋ ma.
