      gen_sec: 7.46
      ref_sec: 11.9
      cer: 0.0917
      wer: 0.5
    bible_00142:
      source: bible
      text: ‘Manɩŋ n vʋara fʋ mɩŋ dɩ fʋ yi chaanɩŋ a yi vuodiekemba dɩ kana ka yi Juu vuosisi,
      sbs: 0.6412
      gen_sec: 3.86
      ref_sec: 4.48
      cer: 0.2063
      wer: 0.7222
    bible_00143:
      source: bible
      text: Ta die ba wʋnyɩ die dɩ yiŋŋi keŋ Yisa jigiŋ dama die ʋ sɩba a baarɩ dɩ Yisa gbaanna wa, a
