      cer: 0.0932
      wer: 0.1071
    bible_00149:
      source: bible
      text: Ama tɩ Gbɩgbatɩtaantʋ Yisa Masia keniŋ yuorine a dagɩ tɩ, wʋnɩŋ Yisa Masia die chʋʋsɩna kuŋ
        hagɩrɩŋ, ta bɩ dagɩ tɩ dɩ tɩ saagɩ ʋ wʋvɩɩnaha tɩ nan ye miivoli dieke dɩ wone kpatɩŋ.
