      sbs: 0.7063
      gen_sec: 8.48
      ref_sec: 8.62
      cer: 0.0217
      wer: 0.0435
    bible_00115:
      source: bible
      text: Yisa die dɩ bɩrɩma a gʋta aŋaŋ yɩaŋ ta Ŋmɩŋ aŋaŋ vuota sʋgɩtɩ dɩ fɩala ʋ ma.
      sbs: 0.7429
      gen_sec: 5.36
      ref_sec: 7.6
      cer: 0.0508
      wer: 0.1765
    bible_00116:
      source: bible
      text: Die maŋ yiŋŋi a balɩ dɩ, ‘N Yɔmʋtieŋ ba wɔŋ sɩba dɩ die n ŋaaŋ gara Ŋmɩŋ jɩamɩŋ juone me a
