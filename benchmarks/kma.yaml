    bible_00082:
      source: bible
      text: Masia dɩdɩɩsɩrɩ diekemba dɩ benne Asia tɩŋgbaŋ mana waasa nɩ. Akuyila aŋaŋ Pirisila Masia
        dɩdɩɩsɩrɩba dɩ lagɩsɩnana jɩama Ŋmɩŋ ba tigiri me wo waasa nɩ vɩɩnɩŋ tɩ Yɔmʋtieŋ saaŋ ma.
