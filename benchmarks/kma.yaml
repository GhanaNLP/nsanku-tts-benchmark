      ref_sec: 7.08
      cer: 0.0366
      wer: 0.0952
    bible_00086:
      source: bible
      text: Die nyɩŋkʋraha die dɩ wʋnna naa, die ba jɩɩ sɩnyɩɩrɩŋ pam dɩ ba kʋʋ tʋntʋntɩba.
