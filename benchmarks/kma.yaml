      wer: 0.6333
    bible_00179:
      source: bible
      text: Vuodiekemba mana dɩ yine Ŋmɩŋ ballɩ tuo wo ba Chɔɔŋ Ŋmɩŋ ta ka yie bɩaŋ. Ba ka bɩagɩ yie bɩaŋ
