      ref_sec: 8.02
      cer: 0.0506
      wer: 0.1429
    bible_00076:
      source: bible
      text: Die ʋ wa balɩ yɩ ba dɩ “N chanchaalɩŋ Izara vuosi, nɩ sɩmma aŋaŋ nɩ bala nɩ yi vuosi gie wudieke
        wo.
