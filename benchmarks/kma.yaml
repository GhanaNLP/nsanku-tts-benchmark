      gen_sec: 4.06
      ref_sec: 6.58
      cer: 0.2182
      wer: 0.5789
    bible_00151:
      source: bible
      text: Tɩ Yɔmʋtieŋ Yisa Masia gbaŋ gbaŋ aŋaŋ tɩ Chɔɔŋ Ŋmɩŋ vuodieke dɩ chone tɩ ta suŋŋi tɩ a yɩ
        tɩ sʋgɩdʋagɩ dieke dɩ wone kpatɩkʋ aŋaŋ tama dieke dɩ vɩɩŋna ʋ zɔɔlɩnchɩgɩla wɩa wa,
      sbs: 0.5805
      gen_sec: 8.59
      ref_sec: 11.2
      cer: 0.0929
      wer: 0.5588
    bible_00152:
      source: bible
      text: Die tʋŋ dɩ bala ka vʋŋ, dɩ Juu vuosi davʋʋsɩkɩrɩ daraaŋ wa, ta vɔrɩkʋ dɩaŋ die dɩ gbigi mi
        wo, die wɩa die ba guu wo mi.
      sbs: 0.647
      gen_sec: 6.21
      ref_sec: 11.78
      cer: 0.1222
      wer: 0.4444
    bible_00153:
      source: bible
      text: Ʋ nan keŋ zeti Ŋmɩŋ jɩamɩŋ aŋaŋ jɩamɩŋ mana, ta yi ʋ gbaŋ sikpeŋ tieŋ dieke dɩ tɩanna jadieke
        mana vuota dɩ jɩanna. Ʋ nan keŋ juu Ŋmɩŋ jɩamɩŋ juoku gbaŋ ta wasa ʋ gbaŋ Ŋmɩŋ.
      sbs: 0.6716
      gen_sec: 9.21
      ref_sec: 12.6
      cer: 0.3259
      wer: 0.7778
    bible_00154:
      source: bible
      text: Womi Lazurusi die dɩ keŋ nyɩŋ, logiti die dɩ veli ʋ nuusi aŋaŋ ʋ nagɩsɩ ta garɩbɩŋ die dɩ
        bɔbɩ ʋ nine. Yisa die dɩ balɩ a yɩ ba dɩ, “Nɩ forisi gatɩtɩ ta vaa ʋ ga.”
      sbs: 0.6323
      gen_sec: 8.93
      ref_sec: 13.18
      cer: 0.314
      wer: 0.8108
    bible_00155:
      source: bible
      text: Ka kʋaŋ chaaŋ kʋaŋandɩɩsɩrʋ wa mi die dɩ wolinne a tʋgɩ wa gbaŋ die dɩ juu vɔrɩkʋ sʋŋ a ye
