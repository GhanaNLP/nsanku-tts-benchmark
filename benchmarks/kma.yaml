      gen_sec: 9.92
      ref_sec: 8.9
      cer: 0.0667
      wer: 0.1852
    bible_00061:
      source: bible
      text: Lele wo mi Ŋmɩŋ malaka die dɩ vaa yʋagɩbɩaŋ dɩ yigi wo, die ʋ nyuuti die dɩ suuli aŋaŋ gbarɩtɩ
