      gen_sec: 10.24
      ref_sec: 14.26
      cer: 0.0741
      wer: 0.359
    bible_00132:
      source: bible
      text: Kʋrɩŋ ma wa, ta jaaŋ die dɩ ye wone wo, ama Ŋmɩŋ Nʋawɩɩŋ, vuodieke dɩ yine Yisa Masia, die
