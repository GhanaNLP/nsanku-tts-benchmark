      cer: 0.1304
      wer: 0.5455
    bible_00139:
      source: bible
      text: Die ba yiŋŋi a baarɩ dɩ, “Aayɩ, tɩ ye ka wɔŋ wʋŋ Ŋmɩŋ Halɩkasɩka wɩa.”
