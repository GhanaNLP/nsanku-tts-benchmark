      sbs: 0.6544
      gen_sec: 4.89
      ref_sec: 8.1
      cer: 0.1948
      wer: 0.6316
    bible_00135:
      source: bible
      text: Dɩɩ yi nɩ suŋŋe Ŋmɩŋ vuosi a yɩa ba jadieke ba wone, naa nan vaa vuosi pam bɩrɩ Ŋmɩŋ.
