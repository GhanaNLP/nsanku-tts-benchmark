      wer: 0.4737
    bible_00101:
      source: bible
      text: Ama tɩ haalɩtɩ dɩ yene suu nyɩŋgbaŋka gie me wo, tɩ ŋmuuse mɩŋ. Daa tɩ ka bɩ yaala nyɩŋgbaŋka
