      gen_sec: 14.4
      ref_sec: 14.7
      cer: 0.025
      wer: 0.1463
    bible_00097:
      source: bible
      text: Fʋ sʋŋ ka fɩala aŋaŋ dɔŋɩsɩ ba nagɩna a yie kaaba
      sbs: 0.5844
