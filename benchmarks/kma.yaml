      ref_sec: 9.0
      cer: 0.3438
      wer: 0.7857
    bible_00133:
      source: bible
      text: a datɩ wa nyɩŋ tɩka lʋgɩŋ a piili a taa wa tana. Die vuodiekemba die dɩ taana wa tana wa die
        dɩ vʋarɩ ba nyinyeeke dʋaŋ dalʋakɩŋ wʋnyɩ die dɩ dine Sɔɔli dɩ ʋ daansɩma ha.
