      gen_sec: 4.88
      ref_sec: 5.12
      cer: 0.1698
      wer: 0.375
    bible_00126:
      source: bible
      text: Die vuodiekemba dɩ kenne dɩ ba waasɩ Meri wa pam die dɩ ye wudieke Yisa dɩ yine wo ta yi wo
        yada.
      sbs: 0.6832
      gen_sec: 7.12
      ref_sec: 6.12
      cer: 0.1733
      wer: 0.6364
    bible_00127:
      source: bible
      text: wʋnɩŋ ʋ yaala vuota mana ye gbatɩtaanɩŋ ta keŋ sɩmma wusieke.
