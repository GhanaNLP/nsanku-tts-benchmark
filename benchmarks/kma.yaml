      gen_sec: 3.4
      ref_sec: 5.46
      cer: 0.0577
      wer: 0.3077
    bible_00138:
      source: bible
      text: Tɩ yalla kɩkaabɩtʋ kpɩɩŋ dieke dɩ sɩna Ŋmɩŋ tigiŋ me wɩa,
