      cer: 0.1098
      wer: 0.3158
    bible_00096:
      source: bible
      text: Die wɩa Ŋmɩŋ Halɩkasɩka die dɩ balɩ yɩ mɩŋ dɩ n gamma aŋaŋ ba ta da vaa ka mugisi mɩŋ. Womi
