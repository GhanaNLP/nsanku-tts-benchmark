      gen_sec: 6.72
      ref_sec: 5.34
      cer: 0.087
      wer: 0.2857
    bible_00060:
      source: bible
      text: Dɩɩ yi tɩ dɩa ʋ mɩraha ta yie wudieke dɩ nannana ʋ sʋŋ die bala ka vaa ʋ dɩ yɩa tɩ jadieke
        mana tɩ jʋʋsɩnana a yaala.
