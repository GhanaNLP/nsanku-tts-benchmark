      gen_sec: 8.0
      ref_sec: 9.14
      cer: 0.2261
      wer: 0.6061
    bible_00130:
      source: bible
      text: Dama yuŋ vuosi dɩ gʋʋra ta bataŋ dɩ nyuo daaŋ a buge.
