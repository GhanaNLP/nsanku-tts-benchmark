    bible_00178:
      source: bible
      text: Ŋmɩŋ vʋarɩ wa vuosi ba yi Masia dɩdɩɩsɩrɩŋ “Babiloni” tɩŋgbaŋ ma gie sɩba ʋ vʋarɩna nɩ dene
