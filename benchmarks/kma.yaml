      wer: 0.1
    bible_00157:
      source: bible
      text: Hanɩŋ wʋbalɩka nɩŋ sɩɩ sɩba kʋjagɩ dieke dɩ kana ka kpiye. Hamenusi aŋaŋ Filetusi ye daga
