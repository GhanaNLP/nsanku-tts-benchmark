      wer: 0.2162
    bible_00155:
      source: bible
      text: Ka kʋaŋ chaaŋ kʋaŋandɩɩsɩrʋ wa mi die dɩ wolinne a tʋgɩ wa gbaŋ die dɩ juu vɔrɩkʋ sʋŋ a ye
