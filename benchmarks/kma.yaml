      gen_sec: 9.28
      ref_sec: 8.56
      cer: 0.1236
      wer: 0.4615
    bible_00161:
      source: bible
      text: Ama ta malakaka die dɩ balɩ a yɩ wa dɩ, “Zakaria, da vaa ŋmaamɩŋ yalla fʋ! Ŋmɩŋ wʋŋ fʋ jʋʋsɩkʋ
        mɩŋ, ta fʋ hɔgʋ Elizabeti nan mɩɩrɩ bʋadembiŋ a yɩ fʋ, ta nɩ nan wa wa Jɔɔn.
