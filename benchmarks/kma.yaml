      gen_sec: 4.64
      ref_sec: 4.4
      cer: 0.22
      wer: 0.5455
    bible_00128:
      source: bible
      text: Ta Ŋmɩŋ dieke dɩ yɩna mɩŋ tʋʋmaha dɩ tʋŋ wa, wʋnɩŋ ʋ yine mɩŋ Masia dɩdɩɩsɩrɩba mi yɔmʋ nɩ
        suŋŋiŋ wɩa, dɩ vuosi sɩmma Ŋmɩŋ wɩaha.
