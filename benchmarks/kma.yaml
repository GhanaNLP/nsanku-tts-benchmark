      ref_sec: 7.2
      cer: 0.0857
      wer: 0.2632
    bible_00068:
      source: bible
      text: Nɩ sʋʋŋ nɩ gbaŋ nɩ Yɔmʋtieŋ nɩŋŋa, ta ʋ nan kɔtɩ nɩ ŋmɩŋsikpeŋ.
