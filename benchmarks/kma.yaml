      gen_sec: 3.59
      ref_sec: 5.12
      cer: 0.283
      wer: 0.5625
    bible_00126:
      source: bible
      text: Die vuodiekemba dɩ kenne dɩ ba waasɩ Meri wa pam die dɩ ye wudieke Yisa dɩ yine wo ta yi wo
