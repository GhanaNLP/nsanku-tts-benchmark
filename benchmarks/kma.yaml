      ref_sec: 11.82
      cer: 0.0397
      wer: 0.1765
    bible_00093:
      source: bible
      text: Manɩŋ Pɔɔli aŋaŋ tɩ nɩmballɩ diekemba dɩ benne giena mana waasa Masia dɩdɩsɩɩrɩba dɩ benne
