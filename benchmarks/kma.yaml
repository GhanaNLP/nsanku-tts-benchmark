      gen_sec: 8.16
      ref_sec: 8.06
      cer: 0.0
      wer: 0.0
    bible_00103:
      source: bible
      text: Ta lele bɩa fʋ bɩ chɩɩsa? Hagɩ aŋ n sɩɩ fʋ Ŋmɩŋ nyaabʋ, aŋ Ŋmɩŋ vaa fʋ wʋbɩatɩ a chaa fʋ fʋ
        jʋʋsɩna wa wɩa.’
      sbs: 0.6964
      gen_sec: 9.04
      ref_sec: 7.46
      cer: 0.1375
      wer: 0.36
    bible_00104:
      source: bible
      text: amʋ vuosi pam sʋŋanyile nan nyɩŋ yeŋ me ama wɩɩŋ nan yi ta chʋʋsɩ fʋ gbaŋ gbaŋ fʋ sʋŋ pam.”
