      gen_sec: 11.2
      ref_sec: 11.3
      cer: 0.0874
      wer: 0.303
    bible_00080:
      source: bible
      text: Nɩ wɔŋ wʋŋ mɩŋ die n tʋʋma dɩ sɩna die saŋŋa dieke die n dɩna Juu vuosi jɩaŋkʋ, die n mugise
        Masia dɩdɩɩsɩrɩŋ pam, ta die mɩa dɩ n chʋʋsɩ ba ta ka chɩgɩ ba zɔɔlɩŋ.
      sbs: 0.7024
      gen_sec: 10.8
      ref_sec: 12.94
      cer: 0.096
      wer: 0.2778
    bible_00081:
      source: bible
      text: Sɩba ba bala dɩ, “Dabɔtɩ bɩta vasɩnana paanʋ zɔŋ mana dɩ yire.”
