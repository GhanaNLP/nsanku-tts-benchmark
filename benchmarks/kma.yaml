      gen_sec: 7.92
      ref_sec: 8.28
      cer: 0.0562
      wer: 0.1429
    bible_00090:
      source: bible
      text: Yisa die dɩ balɩ a yɩ tʋntʋntɩba dɩ, “Nɩ yi nyaaŋ suuli gbiesisi.” Die wɩa die ba yi nyaaŋ
        a suulihe pili pili.
