      wer: 0.2857
    bible_00123:
      source: bible
      text: 'Yisa die wɔŋ vaa ba yaalɩ wa boniŋ die ʋ jʋalɩ a kalɩ ka ma, sɩba dɩ maagɩna die Ŋmɩŋ gbaŋkʋ
