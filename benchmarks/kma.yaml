      gen_sec: 1.44
      ref_sec: 5.14
      cer: 0.6863
      wer: 0.7333
    bible_00140:
      source: bible
      text: Dɩɩ yi ʋ yi fʋ bɩaŋ bʋyʋpɔyɩ dabalɩmɩŋ, ama ta yiŋŋi keŋ fʋ jigiŋ bʋyʋpɔyɩ a baarɩ dɩ ʋ chʋʋsɩya,
