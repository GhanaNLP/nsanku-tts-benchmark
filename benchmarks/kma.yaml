      ref_sec: 7.6
      cer: 0.2034
      wer: 0.7059
    bible_00116:
      source: bible
      text: Die maŋ yiŋŋi a balɩ dɩ, ‘N Yɔmʋtieŋ ba wɔŋ sɩba dɩ die n ŋaaŋ gara Ŋmɩŋ jɩamɩŋ juone me a
