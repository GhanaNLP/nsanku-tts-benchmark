      wer: 0.8929
    bible_00176:
      source: bible
      text: Ama kɩkaabɩtɩba nyɩŋkʋraha aŋaŋ Farasisi vuosisi die wɔŋ yɩ wa nʋaŋ dɩ vuodieke dɩ keŋ ye
