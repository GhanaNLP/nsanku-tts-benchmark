      gen_sec: 6.41
      ref_sec: 8.26
      cer: 0.2673
      wer: 0.7308
    bible_00129:
      source: bible
      text: Saŋka mi gbaŋ gbaŋ Farasisi vuosi bataŋ die dɩ keŋ Yisa jigiŋ a balɩ a yɩ wa dɩ, “Sie fʋ nyɩŋ
        giena a ga jigigaaŋ, dama naaŋ Herodi yaala ʋ kʋʋ fʋ mɩŋ.”
