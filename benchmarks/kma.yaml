      gen_sec: 7.68
      ref_sec: 7.3
      cer: 0.0602
      wer: 0.3182
    bible_00100:
      source: bible
      text: Die ʋ kenne a gbigi jigidieke sieku dɩ sʋʋna gara Olivi kunkogiri jigiri, ʋ kʋaŋanvuosi mana
        die dɩ piili a bɩra Ŋmɩŋ aŋaŋ sʋgɩfɩalɩŋ, ta bɩra wa aŋaŋ lɔlɩkpɩɩma yaa gamma mamachi wʋkpɩɩma
