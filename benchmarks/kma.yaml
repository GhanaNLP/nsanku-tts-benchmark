      wer: 0.1935
    bible_00159:
      source: bible
      text: Dɩɩ yi vuodieke dɩ yallɩ nyinti a mɔgɩsa ʋ gbaŋ ta tɩala, ama ta ye ʋ nɩmbʋa dɩ wo jaaŋ, ta
