      gen_sec: 8.47
      ref_sec: 14.04
      cer: 0.2556
      wer: 0.75
    bible_00134:
      source: bible
      text: Naa kʋaŋ chaaŋ yʋagɩtieliŋ die dɩ benne tɩŋgbaŋka ma die dɩ keŋ Pɔɔli jigiŋ die ʋ gbaaŋ ba
