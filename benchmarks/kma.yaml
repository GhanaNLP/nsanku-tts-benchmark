      gen_sec: 6.96
      ref_sec: 5.3
      cer: 0.1587
      wer: 0.5294
    bible_00064:
      source: bible
      text: Die wɩa n zʋalɩŋ, nɩ dii sikimiŋ, dama n yi Ŋmɩŋ yada mɩŋ dɩ wudieke ʋ bala mɩŋ wa nan seŋ
