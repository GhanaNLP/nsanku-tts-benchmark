      gen_sec: 11.2
      ref_sec: 11.8
      cer: 0.0522
      wer: 0.1176
    bible_00058:
      source: bible
      text: Ama Mosisi die yɩna nɩ nʋaŋ dɩ nɩ gobime nɩ ballɩdembisi kɔlaha (Daa Mosisi die piiline ke,
        ama nɩ chɔɔŋkʋʋlɩba die piiline ke), nɩ ŋaaŋ gobi be mɩŋ davʋʋsɩkɩrɩ daraaŋ.
