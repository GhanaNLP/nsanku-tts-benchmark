    bible_00088:
      source: bible
      text: Die wɩa, Juu vuosisi diekemba die dɩ benne aŋaŋ ba wa dɩaŋ dɩ piili a chɩga ŋmaamɩŋ, ta dɩ
        Piita dɩ yine wudieke, ta Banabasi gbaŋ die dɩ taarɩ a dɩ ba.
      sbs: 0.6749
      gen_sec: 12.72
      ref_sec: 13.4
      cer: 0.0513
      wer: 0.2812
    bible_00089:
      source: bible
      text: Fʋ yie naa a yie bɩaŋ a yɩa fʋ nɩmballɩ, ta chʋʋsa ba yada dieke dɩ kana ka dala wa, ka daga
        dɩ yie bɩaŋ yɩa Masia mɩŋ.
      sbs: 0.6822
      gen_sec: 9.44
      ref_sec: 8.28
      cer: 0.0674
      wer: 0.2857
    bible_00090:
      source: bible
      text: Yisa die dɩ balɩ a yɩ tʋntʋntɩba dɩ, “Nɩ yi nyaaŋ suuli gbiesisi.” Die wɩa die ba yi nyaaŋ
        a suulihe pili pili.
      sbs: 0.6784
      gen_sec: 7.6
      ref_sec: 7.64
      cer: 0.0595
      wer: 0.2174
    bible_00091:
      source: bible
      text: Izara vuosi yada wɩa die ba chʋnna a giliŋ Jeriko tɩka daraa ayʋpɔyɩ wa die ka gaama mana
        die dɩ nan dene.
      sbs: 0.6536
      gen_sec: 7.6
      ref_sec: 9.22
      cer: 0.0714
      wer: 0.3636
    bible_00092:
      source: bible
      text: Die daa wʋnyɩ die benne ba wasa wa Josefu, die ʋ nyɩŋ wa Juu vuosi tɩŋ ba wasɩnana Arimatia.
        Die ʋ yiwo vuovɩɩnɩŋ ta bɩ dɩɩ Ŋmɩŋ ta die a chɩɩsa Ŋmɩŋ naarɩ keniŋ.
      sbs: 0.7149
      gen_sec: 10.08
      ref_sec: 11.82
      cer: 0.1032
      wer: 0.3824
    bible_00093:
      source: bible
      text: Manɩŋ Pɔɔli aŋaŋ tɩ nɩmballɩ diekemba dɩ benne giena mana waasa Masia dɩdɩsɩɩrɩba dɩ benne
        Galasia ma.
      sbs: 0.6827
      gen_sec: 9.04
      ref_sec: 7.84
      cer: 0.0824
      wer: 0.6471
    bible_00094:
      source: bible
      text: Nɩ tʋma nɩ tʋʋma aŋaŋ sʋgɩfɩalɩŋ sɩba nɩ tʋma yɩa tɩ Yɔmʋtieŋ Masia ama nɩ daa yilime dɩ nɩ
        tʋma a yɩa vuota nyɩɩna ma,
      sbs: 0.633
      gen_sec: 8.16
      ref_sec: 8.08
      cer: 0.0851
      wer: 0.32
    bible_00095:
      source: bible
      text: Ka sʋkʋleeliŋ Yisa die dɩ keŋ zie gbagɩrɩ nʋaŋ ama ʋ kʋaŋandɩɩsɩrɩba die ka mɩŋŋɩya dɩ dɩ
        yiwo wʋnɩŋ.
      sbs: 0.6241
      gen_sec: 7.04
      ref_sec: 5.7
      cer: 0.2073
      wer: 0.5263
    bible_00096:
      source: bible
      text: Die wɩa Ŋmɩŋ Halɩkasɩka die dɩ balɩ yɩ mɩŋ dɩ n gamma aŋaŋ ba ta da vaa ka mugisi mɩŋ. Womi
        Yisa dɩdɩɩsɩrɩŋ bayʋaba diekemba die dɩ benne Joopa ma die dɩ beeli mɩŋ tɩ ga Siisiria a ga Koniliawosi
        tigiŋ,
      sbs: 0.6659
      gen_sec: 15.44
      ref_sec: 14.7
      cer: 0.0875
      wer: 0.4146
    bible_00097:
      source: bible
      text: Fʋ sʋŋ ka fɩala aŋaŋ dɔŋɩsɩ ba nagɩna a yie kaaba
      sbs: 0.5936
      gen_sec: 3.84
      ref_sec: 3.4
      cer: 0.1538
      wer: 0.7273
    bible_00098:
      source: bible
      text: Die gbɩgbarɩtʋ wa dɩ balɩ a yi Pɔɔli dɩ, “Nyɩŋkʋraha yɩ wa nʋaŋ dɩ n vaa fʋnɩŋ aŋaŋ Silasi
        ga yɔrɩ. Die wɩa nɩ gamma aŋaŋ sʋgɩfɩalɩŋ.”
      sbs: 0.7059
      gen_sec: 10.56
      ref_sec: 10.46
      cer: 0.0874
      wer: 0.5556
    bible_00099:
      source: bible
      text: Die wɩa die sojasisi die dɩ gobi gobi guuŋ dieke dɩ bɔbɩna haarɩbike a yallɩ wa ta vaa ka
        nan nyaabʋ sʋŋ.
      sbs: 0.6224
      gen_sec: 8.72
      ref_sec: 7.3
      cer: 0.2048
      wer: 0.7273
    bible_00100:
      source: bible
      text: Die ʋ kenne a gbigi jigidieke sieku dɩ sʋʋna gara Olivi kunkogiri jigiri, ʋ kʋaŋanvuosi mana
        die dɩ piili a bɩra Ŋmɩŋ aŋaŋ sʋgɩfɩalɩŋ, ta bɩra wa aŋaŋ lɔlɩkpɩɩma yaa gamma mamachi wʋkpɩɩma
        dieke ba yene wo dɩ,
      sbs: 0.5488
      gen_sec: 29.28
      ref_sec: 13.04
      cer: 1.4615
      wer: 2.1316
    bible_00101:
      source: bible
      text: Ama tɩ haalɩtɩ dɩ yene suu nyɩŋgbaŋka gie me wo, tɩ ŋmuuse mɩŋ. Daa tɩ ka bɩ yaala nyɩŋgbaŋka
        gie beriŋ, ama tɩ yaala arɩzanna nyɩŋgbaŋka mɩŋ, dɩ dɩnɩŋ daarɩ mi miivolike nan keŋ nyii kuŋ
        aŋ a kpatɩ.
      sbs: 0.6678
      gen_sec: 12.8
      ref_sec: 14.02
      cer: 0.0833
      wer: 0.2821
    bible_00102:
      source: bible
      text: Wusie, vuodiekemba mana dɩ yine Yisa Masia sɩɩtɩ ta yaala ba bemme vɩɩnɩŋ nan ye mugisiŋ a
        nyɩŋ vuosi jigiŋ;
      sbs: 0.6325
      gen_sec: 8.16
      ref_sec: 8.06
      cer: 0.1149
      wer: 0.35
    bible_00103:
      source: bible
      text: Ta lele bɩa fʋ bɩ chɩɩsa? Hagɩ aŋ n sɩɩ fʋ Ŋmɩŋ nyaabʋ, aŋ Ŋmɩŋ vaa fʋ wʋbɩatɩ a chaa fʋ fʋ
        jʋʋsɩna wa wɩa.’
      sbs: 0.659
      gen_sec: 8.16
      ref_sec: 7.46
      cer: 0.1125
      wer: 0.4
    bible_00104:
      source: bible
      text: amʋ vuosi pam sʋŋanyile nan nyɩŋ yeŋ me ama wɩɩŋ nan yi ta chʋʋsɩ fʋ gbaŋ gbaŋ fʋ sʋŋ pam.”
      sbs: 0.6277
      gen_sec: 6.4
      ref_sec: 7.86
      cer: 0.2429
      wer: 0.6
    bible_00105:
      source: bible
      text: Yisa die dɩ yiŋŋi a balɩ ba dɩ, “Daa wʋnɩŋ yaa ʋ chɔɔŋ aŋaŋ ʋ nuŋ bɩaŋ taasɩna ʋ yɩɩsɩsɩ.
        Ʋ yɩɩŋya mɩŋ dɩ n vaa ʋ nine yuori amʋ vuosi ye Ŋmɩŋ tʋnkpɩɩma.
      sbs: 0.6502
      gen_sec: 10.72
      ref_sec: 13.7
      cer: 0.1293
      wer: 0.5
    bible_00106:
      source: bible
      text: Fʋ zɩ n nan dɩ bie nɩ jigiŋ daraa ale yaa n nan wɩarɩ nɩ jigiŋ wʋyaalɩka gie mana; ta nɩ nan
        keŋ suŋŋi mɩŋ aŋ n tɩaŋ ga jigidieke n yaala n ga.
      sbs: 0.6883
      gen_sec: 8.96
      ref_sec: 10.56
      cer: 0.0556
      wer: 0.2941
    bible_00107:
      source: bible
      text: Dɩɩ yi vuoŋ dɩ yaala ʋ yɩ Ŋmɩŋ piini, ta yɩ ʋ yalla dene, Ŋmɩŋ nan tuoke. Ŋmɩŋ ka yaala vuoŋ
        yɩ wa piini a tɩaŋ ʋ yalla dene.
      sbs: 0.6543
      gen_sec: 8.4
      ref_sec: 9.68
      cer: 0.0968
      wer: 0.2414
    bible_00108:
      source: bible
      text: Nɩnɩŋ Samaria vuosi ka sɩba vuodieke nɩ jɩanna ama tɩnɩŋ Juu vuosi nɩŋ sɩba vuodieke tɩ jɩanna
        mɩŋ dama gbatɩtaanɩŋ wɩa nyɩŋ wa Juu vuosi jigiŋ mɩŋ.
      sbs: 0.6697
      gen_sec: 11.28
      ref_sec: 10.96
      cer: 0.0083
      wer: 0.1481
    bible_00109:
      source: bible
      text: Dama saŋŋa kieŋ ta vuosi kaaŋ dɩ wʋmma dagɩvɩɩnʋ, ama ba nan keŋ dɩ ba gbaŋ gbaŋ ba lɔlɩbɩatɩ,
        ta nan dɩ wʋmma yɩa dɩdagɩrɩŋ pam diekemba dɩ dagɩnana wa wudieke ba yaalala ba wʋŋ.
      sbs: 0.6949
      gen_sec: 12.88
      ref_sec: 13.42
      cer: 0.0563
      wer: 0.4571
    bible_00110:
      source: bible
      text: Ka tʋnvʋʋsa die ba benne sieku me a gara wa a keŋ gbigi Joopa, saŋka mi Piita die dɩ ga jʋalɩ
        kɔsʋŋ sikpeŋ agbaa saŋŋa dɩ ʋ jʋʋsɩ Ŋmɩŋ.
      sbs: 0.5999
      gen_sec: 10.16
      ref_sec: 9.82
      cer: 0.1333
      wer: 0.4483
    bible_00111:
      source: bible
      text: Ama ba vɩɩnɩŋ nyɩna ba sʋgɩtɩ ma, a nyɩna nyinti sɩba sʋʋŋ-n gbaŋ tɩŋgbaŋ aŋaŋ sɔmm beriŋ.
        Kanɩŋ vɩɩŋkʋ wo chʋʋsɩŋ ta bɩ faasɩ vɩɩna Ŋmɩŋ nɩŋŋa.
      sbs: 0.6846
      gen_sec: 9.92
      ref_sec: 10.54
      cer: 0.114
      wer: 0.3704
    bible_00112:
      source: bible
      text: Ŋmɩŋ gbaŋ sɩba dɩ wudieke n maagɩna yiwo wusie ta ŋmɩnchɩbɩsɩ dɩ wo ka ma.
      sbs: 0.7014
      gen_sec: 6.0
      ref_sec: 5.1
      cer: 0.0508
      wer: 0.4667
    bible_00113:
      source: bible
      text: Ta ʋ wa keŋ giena aŋaŋ Ŋmɩŋ kɩkaabɩtʋ yiko dɩ ʋ yigi vuodieke mana dɩ wasɩnana fʋ saaŋ.”
      sbs: 0.6491
      gen_sec: 6.48
      ref_sec: 8.44
      cer: 0.1739
      wer: 0.6111
    bible_00114:
      source: bible
      text: Womi Anasi die dɩ vaa ba nagɩ Yisa a ga Kayafasi jigiŋ, vuodieke dɩ yine kɩkaabɩtɩba jakʋʋrɩ;
        ta die ba ye bɔbɩ Yisa.
      sbs: 0.6775
      gen_sec: 8.08
      ref_sec: 8.62
      cer: 0.0543
      wer: 0.1304
    bible_00115:
      source: bible
      text: Yisa die dɩ bɩrɩma a gʋta aŋaŋ yɩaŋ ta Ŋmɩŋ aŋaŋ vuota sʋgɩtɩ dɩ fɩala ʋ ma.
      sbs: 0.6615
      gen_sec: 4.96
      ref_sec: 7.6
      cer: 0.1017
      wer: 0.2941
    bible_00116:
      source: bible
      text: Die maŋ yiŋŋi a balɩ dɩ, ‘N Yɔmʋtieŋ ba wɔŋ sɩba dɩ die n ŋaaŋ gara Ŋmɩŋ jɩamɩŋ juone me a
        yige ta nɩga vuodiekemba dɩ tuone fʋ a dii wo.
      sbs: 0.6595
      gen_sec: 9.76
      ref_sec: 8.62
      cer: 0.2212
      wer: 0.6129
    bible_00117:
      source: bible
      text: Die ba nagɩ wa a ga Siisiria ta die nagɩ gbaŋkʋ a yɩ vuokpɩɩkʋ Felikisi ta nagɩ Pɔɔli yi ʋ
        nuusi me.
      sbs: 0.6345
      gen_sec: 6.32
      ref_sec: 8.34
      cer: 0.1538
      wer: 0.2727
    bible_00118:
      source: bible
      text: Ama vuoŋ benne a bala vuosi yaa gamma vuodieke n yine. Wʋnɩŋ ʋ yiwo Ŋmɩŋ, ta maŋ sɩba dɩ ʋ
        balɩkʋ yiwo wusie.
      sbs: 0.7256
      gen_sec: 6.96
      ref_sec: 9.36
      cer: 0.1548
      wer: 0.4348
    bible_00119:
      source: bible
      text: Banabasi die dɩ yaala ʋ nagɩ Jɔɔn Maki a gʋtɩ ba ma aŋ ba ga.
      sbs: 0.6676
      gen_sec: 3.92
      ref_sec: 3.24
      cer: 0.0652
      wer: 0.2
    bible_00120:
      source: bible
      text: N bala yɩa nɩ dama nɩ yiwo yɩantieliŋ, nɩ gbaŋ nɩ yilime yaa gamma wudieke n bala naa wa.
      sbs: 0.6857
      gen_sec: 7.12
      ref_sec: 7.4
      cer: 0.029
      wer: 0.2105
    bible_00121:
      source: bible
      text: Saŋka gie dɩ tʋana wɩa, n yile dɩ dɩ vɩɩna dɩ vuoŋ bemme ʋ wone beri die wo.
      sbs: 0.6568
      gen_sec: 4.56
      ref_sec: 6.36
      cer: 0.0526
      wer: 0.3889
    bible_00122:
      source: bible
      text: Die ka yiwo ŋmɩntʋasɩ, ta die ka tʋnvʋʋsa dɩ baa dɩ yi gasɩtɩaŋkʋ dʋʋgaka daraaŋ. Paliti die
        dɩ balɩ a yɩ Juu vuosisi dɩ, “Nɩ naaŋ wa wʋnna.”
      sbs: 0.6034
      gen_sec: 10.64
      ref_sec: 10.34
      cer: 0.213
      wer: 0.5
    bible_00123:
      source: bible
      text: 'Yisa die wɔŋ vaa ba yaalɩ wa boniŋ die ʋ jʋalɩ a kalɩ ka ma, sɩba dɩ maagɩna die Ŋmɩŋ gbaŋkʋ
        ma dɩ:'
      sbs: 0.6378
      gen_sec: 6.56
      ref_sec: 6.76
      cer: 0.08
      wer: 0.2609
    bible_00124:
      source: bible
      text: Die Ŋmɩŋ die dɩ naaŋ jaaŋ mana a nyɩŋ ʋ ma, ta jaaŋ die wori Ŋmɩŋ dɩ naaŋ ta ka ka nyɩŋ ʋ
        ma.
      sbs: 0.6717
      gen_sec: 6.56
      ref_sec: 6.16
      cer: 0.1324
      wer: 0.2083
    bible_00125:
      source: bible
      text: ta tɩ nagɩ tɩnɩŋ tɩ saŋŋa a yi Ŋmɩŋ jʋʋsɩŋ mi aŋaŋ Ŋmɩŋ wɩa dagɩŋ ma.”
      sbs: 0.6392
      gen_sec: 4.96
      ref_sec: 5.12
      cer: 0.0755
      wer: 0.3125
    bible_00126:
      source: bible
      text: Die vuodiekemba dɩ kenne dɩ ba waasɩ Meri wa pam die dɩ ye wudieke Yisa dɩ yine wo ta yi wo
        yada.
      sbs: 0.6919
      gen_sec: 5.12
      ref_sec: 6.12
      cer: 0.08
      wer: 0.2727
    bible_00127:
      source: bible
      text: wʋnɩŋ ʋ yaala vuota mana ye gbatɩtaanɩŋ ta keŋ sɩmma wusieke.
      sbs: 0.6158
      gen_sec: 3.36
      ref_sec: 4.4
      cer: 0.12
      wer: 0.4545
    bible_00128:
      source: bible
      text: Ta Ŋmɩŋ dieke dɩ yɩna mɩŋ tʋʋmaha dɩ tʋŋ wa, wʋnɩŋ ʋ yine mɩŋ Masia dɩdɩɩsɩrɩba mi yɔmʋ nɩ
        suŋŋiŋ wɩa, dɩ vuosi sɩmma Ŋmɩŋ wɩaha.
      sbs: 0.6524
      gen_sec: 8.8
      ref_sec: 8.26
      cer: 0.1287
      wer: 0.6154
    bible_00129:
      source: bible
      text: Saŋka mi gbaŋ gbaŋ Farasisi vuosi bataŋ die dɩ keŋ Yisa jigiŋ a balɩ a yɩ wa dɩ, “Sie fʋ nyɩŋ
        giena a ga jigigaaŋ, dama naaŋ Herodi yaala ʋ kʋʋ fʋ mɩŋ.”
      sbs: 0.6738
      gen_sec: 9.52
      ref_sec: 9.14
      cer: 0.087
      wer: 0.2727
    bible_00130:
      source: bible
      text: Dama yuŋ vuosi dɩ gʋʋra ta bataŋ dɩ nyuo daaŋ a buge.
      sbs: 0.638
      gen_sec: 3.2
      ref_sec: 3.64
      cer: 0.122
      wer: 0.25
    bible_00131:
      source: bible
      text: Wʋvɩɩnaha gie dɩ kenne nɩ jigiri tʋga jigiŋ mana mɩŋ tɩŋgbaŋka gie me ta wʋnsa vuosi beriŋ
        sɩba ka wʋnsɩna nɩ beriŋ a nyɩŋ daa dieke die nɩ wʋnna ta sɩba Ŋmɩŋ zɔɔlɩnchɩgɩla aŋaŋ wusieke
        dɩ sɩna die wo.
      sbs: 0.6253
      gen_sec: 12.96
      ref_sec: 14.26
      cer: 0.1173
      wer: 0.359
    bible_00132:
      source: bible
      text: Kʋrɩŋ ma wa, ta jaaŋ die dɩ ye wone wo, ama Ŋmɩŋ Nʋawɩɩŋ, vuodieke dɩ yine Yisa Masia, die
        wɔŋ beri mɩŋ aŋaŋ Ŋmɩŋ. Ta bɩ yi Ŋmɩŋ.
      sbs: 0.6899
      gen_sec: 9.36
      ref_sec: 9.0
      cer: 0.1458
      wer: 0.4643
    bible_00133:
      source: bible
      text: a datɩ wa nyɩŋ tɩka lʋgɩŋ a piili a taa wa tana. Die vuodiekemba die dɩ taana wa tana wa die
        dɩ vʋarɩ ba nyinyeeke dʋaŋ dalʋakɩŋ wʋnyɩ die dɩ dine Sɔɔli dɩ ʋ daansɩma ha.
      sbs: 0.6057
      gen_sec: 12.56
      ref_sec: 14.04
      cer: 0.0752
      wer: 0.3056
    bible_00134:
      source: bible
      text: Naa kʋaŋ chaaŋ yʋagɩtieliŋ die dɩ benne tɩŋgbaŋka ma die dɩ keŋ Pɔɔli jigiŋ die ʋ gbaaŋ ba
        mana.
      sbs: 0.6234
      gen_sec: 6.96
      ref_sec: 8.1
      cer: 0.2338
      wer: 0.5263
    bible_00135:
      source: bible
      text: Dɩɩ yi nɩ suŋŋe Ŋmɩŋ vuosi a yɩa ba jadieke ba wone, naa nan vaa vuosi pam bɩrɩ Ŋmɩŋ.
      sbs: 0.651
      gen_sec: 5.76
      ref_sec: 5.98
      cer: 0.2
      wer: 0.5263
    bible_00136:
      source: bible
      text: Die wɩa die ʋ yɩ nʋaŋ dɩ ba sɩɩ ba; die ba sɩɩ ba Ŋmɩŋ nyaaŋ Yisa Masia saaŋ ma. Die wɩa die
        ba balɩ Piita dɩ ʋ wɩɩrɩ ba jigiŋ daraa ale.
      sbs: 0.6816
      gen_sec: 9.28
      ref_sec: 12.28
      cer: 0.1176
      wer: 0.2424
    bible_00137:
      source: bible
      text: Ama nɩ yallɩ wa kalinbaani ta kuule; nɩ kuulinene die wo ka vɩɩna.
      sbs: 0.651
      gen_sec: 6.32
      ref_sec: 5.46
      cer: 0.2115
      wer: 0.7692
    bible_00138:
      source: bible
      text: Tɩ yalla kɩkaabɩtʋ kpɩɩŋ dieke dɩ sɩna Ŋmɩŋ tigiŋ me wɩa,
      sbs: 0.6938
      gen_sec: 3.6
      ref_sec: 3.48
      cer: 0.1087
      wer: 0.2727
    bible_00139:
      source: bible
      text: Die ba yiŋŋi a baarɩ dɩ, “Aayɩ, tɩ ye ka wɔŋ wʋŋ Ŋmɩŋ Halɩkasɩka wɩa.”
      sbs: 0.6961
      gen_sec: 5.68
      ref_sec: 5.14
      cer: 0.0588
      wer: 0.2667
    bible_00140:
      source: bible
      text: Dɩɩ yi ʋ yi fʋ bɩaŋ bʋyʋpɔyɩ dabalɩmɩŋ, ama ta yiŋŋi keŋ fʋ jigiŋ bʋyʋpɔyɩ a baarɩ dɩ ʋ chʋʋsɩya,
        fʋ nagɩ ʋ taalɩ a chaa wa.”
      sbs: 0.6737
      gen_sec: 9.68
      ref_sec: 8.16
      cer: 0.1684
      wer: 0.5185
    bible_00141:
      source: bible
