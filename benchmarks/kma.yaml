      ref_sec: 8.34
      cer: 0.1923
      wer: 0.4091
    bible_00118:
      source: bible
      text: Ama vuoŋ benne a bala vuosi yaa gamma vuodieke n yine. Wʋnɩŋ ʋ yiwo Ŋmɩŋ, ta maŋ sɩba dɩ ʋ
