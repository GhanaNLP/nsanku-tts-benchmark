      sbs: 0.639
      gen_sec: 13.92
      ref_sec: 13.04
      cer: 0.0651
      wer: 0.1842
    bible_00101:
      source: bible
      text: Ama tɩ haalɩtɩ dɩ yene suu nyɩŋgbaŋka gie me wo, tɩ ŋmuuse mɩŋ. Daa tɩ ka bɩ yaala nyɩŋgbaŋka
        gie beriŋ, ama tɩ yaala arɩzanna nyɩŋgbaŋka mɩŋ, dɩ dɩnɩŋ daarɩ mi miivolike nan keŋ nyii kuŋ
