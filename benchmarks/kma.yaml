      sbs: 0.7437
      gen_sec: 15.44
      ref_sec: 14.02
      cer: 0.0769
      wer: 0.2308
    bible_00102:
      source: bible
      text: Wusie, vuodiekemba mana dɩ yine Yisa Masia sɩɩtɩ ta yaala ba bemme vɩɩnɩŋ nan ye mugisiŋ a
        nyɩŋ vuosi jigiŋ;
