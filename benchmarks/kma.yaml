      ref_sec: 11.48
      cer: 0.3235
      wer: 0.6667
    bible_00160:
      source: bible
      text: Mi die tɩ ye Yisa dɩdɩɩsɩrɩba bataŋ, die ba balɩ tɩ dɩ tɩ wɩarɩ ba jigiŋ daraa ayʋpɔyɩ. Die
