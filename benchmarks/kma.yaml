      sbs: 0.7131
      gen_sec: 12.24
      ref_sec: 10.56
      cer: 0.0648
      wer: 0.1765
    bible_00107:
      source: bible
      text: Dɩɩ yi vuoŋ dɩ yaala ʋ yɩ Ŋmɩŋ piini, ta yɩ ʋ yalla dene, Ŋmɩŋ nan tuoke. Ŋmɩŋ ka yaala vuoŋ
