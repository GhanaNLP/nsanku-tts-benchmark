      gen_sec: 11.73
      ref_sec: 14.46
      cer: 0.0775
      wer: 0.2059
    bible_00150:
      source: bible
      text: Yisa die dɩ yiŋŋi balɩ wa dɩ, “N naa, bɩa fʋ yaala n yi? N saŋŋa ye ka tʋgɩya.”
