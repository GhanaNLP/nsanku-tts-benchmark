      wer: 0.7143
    bible_00187:
      source: bible
      text: Tɩ Yɔmʋtieŋ Yisa dɩ keŋ keŋ saŋŋa dieke, nɩnɩŋ nɩ bala nɩ yi tɩ tama aŋaŋ tɩ nyʋarɩ, ta nɩ
