      ref_sec: 5.98
      cer: 0.3538
      wer: 0.8421
    bible_00136:
      source: bible
      text: Die wɩa die ʋ yɩ nʋaŋ dɩ ba sɩɩ ba; die ba sɩɩ ba Ŋmɩŋ nyaaŋ Yisa Masia saaŋ ma. Die wɩa die
        ba balɩ Piita dɩ ʋ wɩɩrɩ ba jigiŋ daraa ale.
      sbs: 0.6222
      gen_sec: 6.54
      ref_sec: 12.28
      cer: 0.1961
      wer: 0.5758
    bible_00137:
      source: bible
      text: Ama nɩ yallɩ wa kalinbaani ta kuule; nɩ kuulinene die wo ka vɩɩna.
