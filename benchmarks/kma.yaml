      wer: 0.2778
    bible_00154:
      source: bible
      text: Womi Lazurusi die dɩ keŋ nyɩŋ, logiti die dɩ veli ʋ nuusi aŋaŋ ʋ nagɩsɩ ta garɩbɩŋ die dɩ
