      wer: 0.6087
    bible_00156:
      source: bible
      text: Die wɩa die ba hagɩ mi aŋaŋ nɩnhagɩrɩŋ aŋaŋ taŋ yaa gamma wʋbalɩkaha gie. Pɔɔli die dɩ balɩ
