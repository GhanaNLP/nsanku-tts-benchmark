      gen_sec: 6.24
      ref_sec: 5.0
      cer: 0.1111
      wer: 0.3333
    bible_00087:
      source: bible
      text: Die ba pɩasɩ wa dɩ, “Lalɩa fʋ yi ta fʋ ninehe dɩ yuori?”
      sbs: 0.6805
      gen_sec: 4.8
      ref_sec: 4.44
      cer: 0.125
      wer: 0.3077
    bible_00088:
      source: bible
      text: Die wɩa, Juu vuosisi diekemba die dɩ benne aŋaŋ ba wa dɩaŋ dɩ piili a chɩga ŋmaamɩŋ, ta dɩ
