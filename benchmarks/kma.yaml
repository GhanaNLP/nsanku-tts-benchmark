      sbs: 0.6008
      gen_sec: 6.88
      ref_sec: 10.28
      cer: 0.2213
      wer: 0.7778
    bible_00147:
      source: bible
      text: Vuoŋ wori a ye ye Ŋmɩŋ; ama ʋ gbaŋ gbaŋ Bʋadembiŋ balɩŋka vuodieke dɩ benne ʋ lʋgɩŋ wa ta
        bɩ mʋ wa, wʋnɩŋ ʋ yuorine a dagɩ tɩ Ŋmɩŋ dɩ sɩna dene.
      sbs: 0.6211
      gen_sec: 7.18
      ref_sec: 10.6
      cer: 0.2364
      wer: 0.75
    bible_00148:
      source: bible
      text: Die ba dine vaa Piita aŋaŋ Jɔɔn wa, die ba yiŋŋi ga ba chanchaalɩba jigiŋ a balɩ ba wudieke
        Ŋmɩŋ kɩkaabɩtɩba jakʋʋrɩ aŋaŋ nyɩŋkʋraha dɩ bala ba wa.
