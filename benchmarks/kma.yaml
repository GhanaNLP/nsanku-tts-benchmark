      ref_sec: 13.42
      cer: 0.169
      wer: 0.6571
    bible_00110:
      source: bible
      text: Ka tʋnvʋʋsa die ba benne sieku me a gara wa a keŋ gbigi Joopa, saŋka mi Piita die dɩ ga jʋalɩ
