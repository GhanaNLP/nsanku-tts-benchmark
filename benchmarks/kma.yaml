      gen_sec: 9.68
      ref_sec: 8.62
      cer: 0.0481
      wer: 0.2581
    bible_00117:
      source: bible
      text: Die ba nagɩ wa a ga Siisiria ta die nagɩ gbaŋkʋ a yɩ vuokpɩɩkʋ Felikisi ta nagɩ Pɔɔli yi ʋ
