      gen_sec: 6.0
      ref_sec: 4.58
      cer: 0.0256
      wer: 0.1111
    bible_00075:
      source: bible
      text: Kʋrɩŋ ma wa kɩkaabɩtɩba mi wo die kpiye mɩŋ ta ba chanchaalɩŋ dɩ tuose ba tʋʋma, die wɩa die
        ba dala.
      sbs: 0.6853
      gen_sec: 7.2
      ref_sec: 8.02
      cer: 0.038
      wer: 0.0952
    bible_00076:
      source: bible
      text: Die ʋ wa balɩ yɩ ba dɩ “N chanchaalɩŋ Izara vuosi, nɩ sɩmma aŋaŋ nɩ bala nɩ yi vuosi gie wudieke
        wo.
