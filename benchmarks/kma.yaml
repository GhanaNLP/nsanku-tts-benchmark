      gen_sec: 8.64
      ref_sec: 9.34
      cer: 0.086
      wer: 0.32
    bible_00079:
      source: bible
      text: Die ʋ balɩ wa naa amʋ wudieke die ʋ bala wa nan keŋ yi wusie, die ʋ baarɩ dɩ, “N Chʋa, n ka
