      ref_sec: 9.44
      cer: 0.0947
      wer: 0.3913
    bible_00078:
      source: bible
      text: Ta fʋ ballɩbɩsɩ mi wɔŋ sɩba Ŋmɩŋ gbaŋkʋ dɩ bɩagɩna yɩa fʋ yɩaŋ ta daga fʋ fʋ baaŋ yi Yisa
