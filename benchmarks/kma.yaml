      gen_sec: 10.16
      ref_sec: 9.12
      cer: 0.0275
      wer: 0.0833
    bible_00067:
      source: bible
      text: Die wɩa mɩraha dɩdagɩrɩba wʋnyɩ dɩ balɩ yɩ wa dɩ, “Dɩdagɩrʋ, fʋ bala naa nɩŋ zɩa wa tɩ gbaŋ.”
