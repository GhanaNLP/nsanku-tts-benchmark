      gen_sec: 7.12
      ref_sec: 6.22
      cer: 0.0714
      wer: 0.2727
    bible_00065:
      source: bible
      text: Ama vuodieke nɩŋ mana dɩ tʋnnana wudieke dɩ mʋna kieŋ wo chaanɩŋ ma, dɩ vuoŋ mana sɩmma a
