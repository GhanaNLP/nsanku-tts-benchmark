      wer: 0.7059
    bible_00193:
      source: bible
      text: Ama ta Ŋmɩŋ die dɩ sʋgɩrɩ wa kumbu me daraa ataa daraaŋ ta yi ʋ hagɩ ta tɩ ye wo ʋ seŋ yi
