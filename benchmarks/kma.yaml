      cer: 0.0851
      wer: 0.28
    bible_00095:
      source: bible
      text: Ka sʋkʋleeliŋ Yisa die dɩ keŋ zie gbagɩrɩ nʋaŋ ama ʋ kʋaŋandɩɩsɩrɩba die ka mɩŋŋɩya dɩ dɩ
