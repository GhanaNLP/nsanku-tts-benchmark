      ref_sec: 9.68
      cer: 0.2043
      wer: 0.5172
    bible_00108:
      source: bible
      text: Nɩnɩŋ Samaria vuosi ka sɩba vuodieke nɩ jɩanna ama tɩnɩŋ Juu vuosi nɩŋ sɩba vuodieke tɩ jɩanna
        mɩŋ dama gbatɩtaanɩŋ wɩa nyɩŋ wa Juu vuosi jigiŋ mɩŋ.
