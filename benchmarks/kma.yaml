      gen_sec: 8.0
      ref_sec: 7.28
      cer: 0.0132
      wer: 0.0455
    bible_00077:
      source: bible
      text: Vuosi bale dieke die dɩ wʋnna Jɔɔn balɩkʋ ta die dɩ Yisa kʋaka wʋnyɩ die yine Andurusi, die
