      ref_sec: 10.62
      cer: 0.301
      wer: 0.8214
    bible_00180:
      source: bible
      text: Die wɩa tɩ wa sɩba dɩ die ba ka bɩagɩ juu kanɩŋ tɩŋgbaŋka me, dama die ba wone yada wɩa.
