      gen_sec: 15.28
      ref_sec: 14.7
      cer: 0.0813
      wer: 0.2439
    bible_00097:
      source: bible
      text: Fʋ sʋŋ ka fɩala aŋaŋ dɔŋɩsɩ ba nagɩna a yie kaaba
      sbs: 0.6067
