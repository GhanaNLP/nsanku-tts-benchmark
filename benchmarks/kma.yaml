      text: Die ba kana ka bɩagɩ a nyaŋŋɩ wa wɩa, die ba ga kpalɩ dembisi bataŋ dɩ ba balɩ dɩ “Tɩnɩŋ tɩ
        wʋŋ wa ʋ balala a chʋʋsa Mosisi aŋaŋ Ŋmɩŋ.”
