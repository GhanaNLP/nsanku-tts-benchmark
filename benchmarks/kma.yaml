      cer: 0.32
      wer: 0.7941
    bible_00182:
      source: bible
      text: Lele tɩ wa sɩba dɩ sɩba jaaŋ mana mɩŋ, ta ka bɩ mʋ dɩ vuoŋ pɩasɩ fʋ wʋpɩasɩka. Lele tɩ yi
