      gen_sec: 11.92
      ref_sec: 13.4
      cer: 0.0171
      wer: 0.0312
    bible_00089:
      source: bible
      text: Fʋ yie naa a yie bɩaŋ a yɩa fʋ nɩmballɩ, ta chʋʋsa ba yada dieke dɩ kana ka dala wa, ka daga
