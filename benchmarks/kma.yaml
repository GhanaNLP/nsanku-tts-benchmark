      ref_sec: 8.74
      cer: 0.1829
      wer: 0.7222
    bible_00158:
      source: bible
      text: Die wɩa, dɩɩ yi nyindiike dieke n dinene wa dɩ vasa n nɩmbʋa dɩ yie bɩaŋ, die nɩŋ n kaaŋ bɩ
        ŋɔbɩ nɔŋ bɩbra amʋ n kaaŋ vaa ʋ yi bɩaŋ.
