      gen_sec: 12.0
      ref_sec: 12.1
      cer: 0.0522
      wer: 0.1944
    bible_00063:
      source: bible
      text: Kpɩkpaakʋ die dɩ yiŋŋi balɩ dɩ, “Fʋnɩŋ yaa wa jɩmbɩaŋ fʋ ma. Mɩnɩa mɩnana ʋ kʋʋ fʋ?”
      sbs: 0.6484
      gen_sec: 6.4
      ref_sec: 5.3
      cer: 0.127
      wer: 0.4706
    bible_00064:
      source: bible
      text: Die wɩa n zʋalɩŋ, nɩ dii sikimiŋ, dama n yi Ŋmɩŋ yada mɩŋ dɩ wudieke ʋ bala mɩŋ wa nan seŋ
