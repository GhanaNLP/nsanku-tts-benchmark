  entries:
    bible_00000:
      source: bible
      text: Vuodieke die yine yɔmʋ ta Ŋmɩŋ dɩ keŋ vʋarɩ wa ʋ wa bɩrɩŋ wa tɩ Yɔmʋtieŋ sɩɩtɩ ta bie ʋ dʋŋŋʋ;
        die gbaŋ vuodieke dɩ sɩna ʋ gbaŋ ta Masia dɩ keŋ vʋarɩ wa, ʋ wa bɩrɩŋ wʋnɩŋ Masia yɔmʋ.
      sbs: 0.617
      gen_sec: 9.41
      ref_sec: 14.94
      cer: 0.2071
      wer: 0.6
    bible_00001:
      source: bible
      text: Paliti die dɩ yiŋŋi balɩ ba dɩ, “Wudieke n maagɩna wa wo tarɩgɩŋ.”
      sbs: 0.6099
      gen_sec: 3.49
      ref_sec: 5.1
      cer: 0.32
      wer: 0.9231
    bible_00002:
      source: bible
      text: Manɩŋ Jemisi, vuodieke dɩ yine Nabidie Ŋmɩŋ tʋntʋntʋ aŋaŋ tɩ Yɔmʋtieŋ Yisa Masia tʋntʋntʋ,
        n waasa Izara buuriŋ baŋ aŋaŋ bale wo dɩ jaasɩna dʋnɩa mana ma wa mana.
      sbs: 0.6768
      gen_sec: 8.99
      ref_sec: 10.1
      cer: 0.0916
      wer: 0.3103
    bible_00003:
      source: bible
      text: Ama die dɩ ka yʋasɩya ta bʋlɔgɩsɩkpeŋkpɩɩŋ die dɩ nɩga nyɩna ŋmɩŋ pɔsɩŋ chaaŋ a keŋ sʋʋna
        mʋgɩkpɩɩrɩ sʋŋ.
      sbs: 0.6346
      gen_sec: 5.76
      ref_sec: 8.9
      cer: 0.1512
      wer: 0.5263
    bible_00004:
      source: bible
      text: Die ba wa daa dieke nine dɩ yuorine wo ka bule me a balɩ wa dɩ, “Hʋʋ Ŋmɩŋ nɩŋŋa dɩ baa fʋ
        balɩ wa wusie. Tɩ sɩba a baarɩ Yisa yiwo tʋntʋmbɩatɩ tieŋ.”
      sbs: 0.6526
      gen_sec: 7.26
      ref_sec: 9.64
      cer: 0.3661
      wer: 0.8485
    bible_00005:
      source: bible
      text: Dɩɩ yi tɩ sɩɩ sɩba wabɩtɩ ta nɩ hagɩrɩŋ tɩ ŋaaŋ yaa sʋgɩfɩalɩŋ mɩŋ. Die wɩa tɩ Ŋmɩŋ jʋʋsɩŋ
        yiwo dɩ nɩ yi vuovɩɩna a kpatɩ.
      sbs: 0.6206
      gen_sec: 6.59
      ref_sec: 7.9
      cer: 0.1895
      wer: 0.6923
    bible_00006:
      source: bible
      text: Die wɩa vuodieke mana dɩ benne Masia ma ka yie bɩaŋ; ama vuodieke dɩ yinene bɩaŋ ye ka sɩba
        Yisa dɩ yine vuodieke, ta ka wɔŋ sɩba wa.
      sbs: 0.6452
      gen_sec: 5.72
      ref_sec: 10.42
      cer: 0.3398
      wer: 0.7857
    bible_00007:
      source: bible
      text: Saŋka mi dɩ keŋ tʋgɩ, ʋ nan yi ʋ saŋkʋ a kpatɩ ta lagɩsɩ jadieke ʋ naanna mana ta a bie ŋmɩŋsikpeŋ
        aŋaŋ tɩŋgbaŋka gie me mana ta vaa Masia yi a sikpeŋtieŋ.
      sbs: 0.6416
      gen_sec: 8.54
      ref_sec: 14.3
      cer: 0.157
      wer: 0.7576
    bible_00008:
      source: bible
      text: Ta daa wʋnyɩ die dɩ bie mi ba wasa wa Zakiyosi, die ʋ yiwo lampotuosiriŋ jakʋʋŋ, ta die yaa
        nyinti pam.
      sbs: 0.603
      gen_sec: 5.68
      ref_sec: 7.1
      cer: 0.1375
      wer: 0.4762
    bible_00009:
      source: bible
      text: “Wusie maŋ bala nɩ, vuodieke nɩŋ mana dɩ tuone vuodieke nɩŋ mana n tʋnna wa tuo wo n gbaŋ,
        ta vuodieke nɩŋ mana dɩ tuone mɩŋ, tuo wo vuodieke dɩ tʋna mɩŋ wa mɩŋ.”
      sbs: 0.6271
      gen_sec: 7.39
      ref_sec: 13.0
      cer: 0.3252
      wer: 0.7647
    bible_00010:
      source: bible
      text: “Die n nagɩ fʋ wɩaha a yɩ ba mɩŋ, ta tɩŋgbaŋka gie vuosi dɩ haa ba ba kana ka yi tɩŋgbaŋka
        gie sɩɩtɩ wa wɩa, sɩba n gbaŋ dɩ kana ka yi tɩŋgbaŋka gie sɩɩtɩ die wo.
      sbs: 0.6067
      gen_sec: 8.28
      ref_sec: 10.92
      cer: 0.2951
      wer: 0.7568
    bible_00011:
      source: bible
      text: Die wɩa Farasisi vuosisi aŋaŋ kɩkaabɩtɩba nyɩŋkʋraha aŋaŋ tɩka nyɩŋkʋraha die dɩ lagɩŋ taŋ
        a baarɩ dɩ, “Bɩa tɩ nan yi? Nɩ ye mamachi tʋŋ dieke daa wa gie dɩ tʋnnana.
      sbs: 0.6089
      gen_sec: 8.29
      ref_sec: 10.94
      cer: 0.2595
      wer: 0.6452
    bible_00012:
      source: bible
      text: Die Paliti die dɩ yiŋŋi juu tigiri sʋŋ ta wa Yisa a pɩasɩ wa dɩ, “Fʋ yine Juu vuosi naaŋ wa?”
      sbs: 0.6357
      gen_sec: 4.57
      ref_sec: 6.52
      cer: 0.087
      wer: 0.4762
    bible_00013:
      source: bible
      text: Yisa die dɩ kala wa die ʋ keŋ ye kpɩkpaaŋ dɩ kienene ʋ jigiŋ. Die ʋ pɩasɩ Filipi dɩ, “Sɩa
        tɩ nan ye nyindiike a daa a yɩ vuosi gie mana?”
      sbs: 0.597
      gen_sec: 7.23
      ref_sec: 11.24
      cer: 0.1078
      wer: 0.4516
    bible_00014:
      source: bible
      text: Saŋŋa kaanɩ, nɩ sʋŋanyilibɩatɩ aŋaŋ nɩ tʋmbɩatɩ die yine nɩ Ŋmɩŋ dataasɩ, ta nɩ yʋa aŋaŋ wa,
      sbs: 0.6195
      gen_sec: 5.11
      ref_sec: 8.24
      cer: 0.1781
      wer: 0.5294
    bible_00015:
      source: bible
      text: Dama jigidieke fʋ nyinti dɩ benne, mi dɩaŋ fʋ sʋŋ dɩ beri.
      sbs: 0.6129
      gen_sec: 3.26
      ref_sec: 3.82
      cer: 0.2444
      wer: 0.9167
    bible_00016:
      source: bible
      text: ta woliŋ yaa wa a ga Anasi jigiŋ. Anasi die yiwo Kayafasi hanɩɩŋ, Kayafasi die yine kɩkaabɩtɩba
        jakʋʋŋ kanɩŋ bɩnɩŋ mi.
      sbs: 0.6519
      gen_sec: 4.46
      ref_sec: 9.26
      cer: 0.7368
      wer: 1.0
    bible_00017:
      source: bible
      text: Ba kaaŋ bɩagɩ a dagɩ dɩ ŋmɩnchɩbɩsɩ dieke ba chɩbɩna a yɩ mɩŋ wa yiwo wusie.
      sbs: 0.653
      gen_sec: 3.73
      ref_sec: 4.46
      cer: 0.25
      wer: 0.625
    bible_00018:
      source: bible
      text: Ŋmɩŋ Halɩkasɩka yi nɩ wo jabalɩmɩŋ, die wɩa nɩ kpaŋŋɩ nɩ gbaŋ aŋaŋ nɩŋŋmɩna a bemme aŋaŋ sʋgɩfɩalɩŋ
        amʋ nɩ nan wɩarɩ yi jabalɩmɩŋ.
      sbs: 0.6025
      gen_sec: 5.54
      ref_sec: 9.66
      cer: 0.3143
      wer: 0.75
    bible_00019:
      source: bible
      text: “Die gbaŋ Mosisi dɩ baarɩ dɩ, ‘Tɩ Yɔmʋtieŋ Nabidie Ŋmɩŋ nan daansɩ yɩ nɩ naazʋa sɩba ʋ tʋnna
        mɩŋ naa, ta ʋ nan yi nɩ gbaŋ gbaŋ nɩ vuoŋ. Nɩnɩŋ nɩ mʋ nɩ wʋmma wudieke mana ʋ balala nɩ.
      sbs: 0.6427
      gen_sec: 9.68
      ref_sec: 13.9
      cer: 0.1159
      wer: 0.5385
    bible_00020:
      source: bible
      text: Vuosi bataŋ bene a mɩa dɩ ba tarɩgɩ Masia wʋvɩɩnaha ta chɔrɩma nɩ, ama wusie wʋbalɩkɩgaaŋ
        bɩ wori.
      sbs: 0.6355
      gen_sec: 6.08
      ref_sec: 7.84
      cer: 0.3544
      wer: 0.8889
    bible_00021:
      source: bible
      text: Ama tɩ Yɔmʋtieŋ Yisa die dɩ yiŋŋi a balɩ wa dɩ, “Maata n sɩba a baarɩ mɩa mɩŋ aŋaŋ nyinti
        pam, a mugise fʋ ta chʋʋsa fʋ sʋŋ,
      sbs: 0.6313
      gen_sec: 6.1
      ref_sec: 9.58
      cer: 0.1828
      wer: 0.6429
    bible_00022:
      source: bible
      text: Ama nɩ yaa kalinbaani ta ka chɩga viivi ka wɩa. Nɩ tɩŋ mʋ nɩ yallɩma sʋgɩchʋʋsɩŋ ta vuodieke
        dɩ yine die wo nɩ tɩŋ vʋarɩ wa a nyɩŋ nɩ lagɩŋkʋ ma.
      sbs: 0.591
      gen_sec: 7.81
      ref_sec: 9.44
      cer: 0.3009
      wer: 0.7419
    bible_00023:
      source: bible
      text: Die wɩa ba balɩ dɩ, “Ʋ ka yi bʋabiŋ, nɩ pɩasɩ wa.”
      sbs: 0.6311
      gen_sec: 2.42
      ref_sec: 4.0
      cer: 0.1765
      wer: 0.4167
    bible_00024:
      source: bible
      text: Die ʋ bene sieku me a gara wa, ʋ tʋntʋntɩŋ die dɩ tuoli wo sieku mi a balɩ wa dɩ, “Fʋ bʋa
        wa ye alaafɩa mɩŋ.”
      sbs: 0.6024
      gen_sec: 6.32
      ref_sec: 8.64
      cer: 0.2405
      wer: 0.7692
    bible_00025:
      source: bible
      text: ta vuobɩatɩ aŋaŋ gɩgaantɩba nan keŋ gʋta ba wʋbɩatɩ ta gaama vuosi ta vuosi dɩaŋ dɩ gaama
        ba.
      sbs: 0.5688
      gen_sec: 5.12
      ref_sec: 7.76
      cer: 0.2533
      wer: 0.7778
    bible_00026:
      source: bible
      text: Die ba ka yile yaa gamma tɩŋgbaŋ dieke ba vana wa, dɩɩ yi die ba tɩŋ yile ka wɩa, ba tɩŋ nan
        ye sieŋ a yiŋŋi ga ka ma.
      sbs: 0.629
      gen_sec: 6.13
      ref_sec: 10.36
      cer: 0.0575
      wer: 0.4138
    bible_00027:
      source: bible
      text: ta da bɩ yi vuodieke dɩ nyunene daaŋ a buge,
      sbs: 0.6143
      gen_sec: 2.76
      ref_sec: 3.0
      cer: 2.2059
      wer: 3.1
    bible_00028:
      source: bible
      text: N balɩ nɩ wɩaha gie amʋ nɩ nan dɩ yaa sʋgɩdʋagɩŋ n wɩa. Tɩŋgbaŋka gie me nɩ nan dii wahala
        ama nɩ dii sikimiŋ dama n wɔŋ nyaŋŋɩ tɩŋgbaŋka mɩŋ.”
      sbs: 0.6367
      gen_sec: 7.42
      ref_sec: 13.66
      cer: 0.3694
      wer: 0.8667
    bible_00029:
      source: bible
      text: Jɔɔn die dɩ yiŋŋi a balɩ ba dɩ, “Aayɩ, n ka yi wo.”
      sbs: 0.687
      gen_sec: 2.5
      ref_sec: 3.26
      cer: 0.1176
      wer: 0.6154
    bible_00030:
      source: bible
      text: a daga ba dɩ Masia wa mʋ ba kʋʋ wa mɩŋ, ama ʋ nan hagɩ kuŋ me. Pɔɔli dɩ balɩ ba dɩ Yisa wa
        yine Masia ka ʋ balala wa.
      sbs: 0.6629
      gen_sec: 5.84
      ref_sec: 10.26
      cer: 0.1529
      wer: 0.6333
    bible_00031:
      source: bible
      text: Dama tɩ lagɩsɩ tʋma mɩŋ a yɩa Ŋmɩŋ. Nɩ sɩɩ sɩba Ŋmɩŋ kʋaŋ, ta bɩ sɩɩ sɩba Ŋmɩŋ juoŋ.
      sbs: 0.6271
      gen_sec: 4.74
      ref_sec: 6.42
      cer: 0.0952
      wer: 0.3684
    bible_00032:
      source: bible
      text: Die daa wa dɩ yiŋŋi a balɩ dɩ, “N yine bʋabiŋ mana a yaa ga mʋʋna, n dɩɩ mɩraha gie mana mɩŋ.”
      sbs: 0.6507
      gen_sec: 5.1
      ref_sec: 6.34
      cer: 0.2206
      wer: 0.5
    bible_00033:
      source: bible
      text: Mi die ka yʋa aŋaŋ tɩŋgbaŋka naaŋ Pubiluwosi kʋatɩ. Die ʋ mɩŋŋɩ tuo tɩ chaantɩ ta die tɩ yi
        ʋ chaanɩŋ daraa ataa.
      sbs: 0.6445
      gen_sec: 6.24
      ref_sec: 8.84
      cer: 0.1348
      wer: 0.4783
    bible_00034:
      source: bible
      text: Ama manɩŋ, Ŋmɩŋ hagɩrɩŋ maŋ nagɩ vʋara jɩmbɩatɩ vuosi ma, die dagɩna sɩba Ŋmɩŋ naarɩ wɔŋ keŋ
        nɩ jigiŋ mɩŋ.
      sbs: 0.6475
      gen_sec: 5.82
      ref_sec: 7.58
      cer: 0.2024
      wer: 0.75
    bible_00035:
      source: bible
      text: Daansɩ ye, bolikaalɩbɩŋ dɩ ŋaana bɩagɩ a dii boŋŋʋkpɩɩŋ die wo!
      sbs: 0.6968
      gen_sec: 3.74
      ref_sec: 4.12
      cer: 0.2745
      wer: 0.8182
    bible_00036:
      source: bible
      text: Die ba bale wo die dɩ nagɩ Yisa nyɩŋgbaŋka a veli ke aŋaŋ garɩhaalɩ yɩalɩŋ aŋaŋ nyɩnnyʋʋgaha,
        sɩba die Juu vuosisi kuŋ guule chʋara dɩ dagɩna die.
      sbs: 0.5916
      gen_sec: 8.89
      ref_sec: 9.52
      cer: 0.161
      wer: 0.4815
    bible_00037:
      source: bible
      text: Dama n nagɩ wa wudiekemba fʋ nagɩna a yɩ mɩŋ wa a yɩ ba ta ba tuohe; ba sɩba dɩ dɩ yiwo wusie
        dɩ n nyɩŋ wa fʋ jigiŋ, ta bɩ yi yada dɩ fʋ tʋnna mɩŋ.
      sbs: 0.6284
      gen_sec: 7.99
      ref_sec: 12.88
      cer: 0.1759
      wer: 0.6216
    bible_00038:
      source: bible
      text: Saŋka mi Ŋmɩŋ die dɩ yɩ Pɔɔli hagɩrɩŋ ʋ tʋma mamachi tʋnkpɩɩma.
      sbs: 0.6132
      gen_sec: 3.7
      ref_sec: 3.76
      cer: 0.3529
      wer: 0.8333
    bible_00039:
      source: bible
      text: Saŋŋa mi tʋntʋntɩba die dɩ tʋma mamachi tʋnkpɩɩma pam vuosisi jigiŋ. Ta Yisa kʋaŋandɩɩsɩrɩŋ
        mana die dɩ ŋaaŋ lagɩsɩ taŋ Ŋmɩŋ jɩamɩŋ juokpeŋkpɩɩkʋ, Solomoni lɩɩfaaka jigiŋ.
      sbs: 0.6174
      gen_sec: 9.57
      ref_sec: 12.5
      cer: 0.2168
      wer: 0.8846
    bible_00040:
      source: bible
      text: Ʋ bɩ balɩ tɩ nɩ choti yaa gamma nɩ chanchaalɩŋ ma dɩ sɩna dene Ŋmɩŋ Halɩkasɩka suŋŋiŋ wɩa.
      sbs: 0.6305
      gen_sec: 4.5
      ref_sec: 5.78
      cer: 0.0972
      wer: 0.5556
    bible_00041:
      source: bible
      text: Dɩ kaaŋ yʋasɩ tɩŋgbaŋka gie vuosi kaaŋ bɩ ye mɩŋ bɩbra, ama nɩnɩŋ nɩ nan ye mɩŋ. Dama n nan
        dɩ beri n mɩsɩ ma; die wɩa nɩ gbaŋ nɩ nan dɩ bie nɩ mɩsɩ ma.
      sbs: 0.6414
      gen_sec: 7.55
      ref_sec: 11.74
      cer: 0.1681
      wer: 0.5278
    bible_00042:
      source: bible
      text: Nɩ ye, nɩnɩŋ vuodiekemba dɩ balala dɩ, “Jinne yaa soriŋ, tɩ nan dɩa a ga tɩŋ kaanɩ, tɩ nan
        dɩ bie mi a ga tʋgɩ bɩŋ ta dii nyʋŋ a ye ligire pam”,
      sbs: 0.6763
      gen_sec: 7.82
      ref_sec: 11.32
      cer: 0.1238
      wer: 0.4545
    bible_00043:
      source: bible
      text: Mi daa wʋnyɩ die dɩ bie kpɩkpaakʋ ma ta balɩ yɩ Yisa dɩ, “Dɩdagɩrʋ, balɩ yɩ n mɩɩ wa, dɩ ʋ
        vaa maŋ ŋaŋ wa puo faarɩ dieke tɩ chɔɔŋ dɩ vana a zieŋ tɩ wo.”
      sbs: 0.5862
      gen_sec: 7.62
      ref_sec: 11.1
      cer: 0.1964
      wer: 0.6389
    bible_00044:
      source: bible
      text: Ama Susuŋŋiru, Ŋmɩŋ Halɩkasɩka vuodieke n Chʋa Ŋmɩŋ dɩ bala ʋ tʋŋ n saaŋ ma wa, nan dagɩ nɩ
        jaaŋ mana ta vaa nɩ tɩɩnsɩ wudiekemba mana n bala nɩ wa.
      sbs: 0.6042
      gen_sec: 7.01
      ref_sec: 11.4
      cer: 0.287
      wer: 0.8065
    bible_00045:
      source: bible
      text: Die wɩa die ʋ wa ʋ tʋntʋntɩba mana aŋaŋ vuodieke dɩ tʋnnana ʋ tʋʋmaha chanchaaŋ a lagɩsɩ a
        balɩ yɩ ba dɩ, “N zʋamba, nɩ sɩba a baarɩ tɩ yese tɩ nyʋarɩ a nyɩna tɩ tʋʋmaha gie mi.
      sbs: 0.6132
      gen_sec: 10.48
      ref_sec: 13.06
      cer: 0.2868
      wer: 0.6579
    bible_00046:
      source: bible
      text: ama kpihɔgʋ wa gie dɩ faasɩna daama mɩŋ wɩa, n ko baa n dii ʋ sarɩya ka a yɩ wa mɩŋ, dɩ daa
        die ʋ nan dɩ kieŋ daaŋ mana ta vaa n gbalɩgɩ aŋaŋ wa.’ ”
      sbs: 0.6668
      gen_sec: 7.46
      ref_sec: 10.76
      cer: 0.215
      wer: 0.5278
    bible_00047:
      source: bible
      text: ta die bie mi a ga tʋgɩ chɩɩtɩ ataa. Ka kʋaŋ chaaŋ die ʋ gɔmɩsɩ dɩ ʋ ga Siiria ta die mɩŋŋɩ
        dɩ Juu vuosisi saŋya mɩŋ a gbarɩ wa; naa chɩaŋ mana die ʋ saŋ dɩ ʋ yiŋŋi a daagɩ Masedonia a ga.
      sbs: 0.6075
      gen_sec: 8.92
      ref_sec: 14.8
      cer: 0.162
      wer: 0.5682
    bible_00048:
      source: bible
      text: Dɩɩ yi tɩ baarɩ dɩ tɩ wo bɩaŋ tɩ gaama tɩ gbaŋ ta ka bala wusie.
      sbs: 0.6511
      gen_sec: 3.08
      ref_sec: 4.34
      cer: 0.0833
      wer: 0.5625
    bible_00049:
      source: bible
      text: Womi vuoŋ wʋnyɩ die dɩ keŋ juu mi a baarɩ dɩ, “Nɩ ye, daa diekemba nɩ nagɩna a yi dansarɩka
        ma wa zie Ŋmɩŋ jɩamɩŋ juokpeŋkpɩɩkʋ ma a daga vuosi Ŋmɩŋ wɩa.”
      sbs: 0.6372
      gen_sec: 8.17
      ref_sec: 10.8
      cer: 0.2712
      wer: 0.8125
    bible_00050:
      source: bible
      text: Die wɩa, tɩ ka chɩga ŋmaamɩŋ nɩ wɩa, dama tɩ sɩba a baarɩ nɩ dine wahala sɩba tɩ dine die
