      sbs: 0.6747
      gen_sec: 7.92
      ref_sec: 9.9
      cer: 0.0549
      wer: 0.1379
    bible_00070:
      source: bible
      text: Die Ŋmɩŋ kɩkaabɩtɩba nyɩŋkʋraha aŋaŋ mɩraha dɩdagɩrɩba die zie mi ta faasɩ bala a chʋʋsa Yisa.
      sbs: 0.6983
      gen_sec: 6.48
      ref_sec: 5.76
      cer: 0.0385
      wer: 0.125
    bible_00071:
      source: bible
      text: N nan keŋ a kaagɩ nɩ n bʋtaa ma. Dɩɩ yi nɩ balɩ dɩ vuoŋ yiwo taalɩ sɩba dɩ maagɩna Ŋmɩŋ gbaŋkʋ
        sʋŋ dene wo dɩ, “Sie daansɩa vuosi bale yaa bataa balɩ a chʋʋsɩ wa.”
