      gen_sec: 8.72
      ref_sec: 7.4
      cer: 0.0568
      wer: 0.12
    bible_00057:
      source: bible
      text: Wudieke dɩ yine talasɩ yiwo naa, nɩ jʋʋsɩma Ŋmɩŋ a yɩma vuoŋ mana. Ta jʋʋsɩ wa dɩ ʋ suŋŋi
        be ta bɩ yi alibarika a yɩ ba mana, ta waasɩma wa ba mana wɩa.
