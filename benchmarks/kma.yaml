      sbs: 0.6328
      gen_sec: 6.84
      ref_sec: 8.16
      cer: 0.2632
      wer: 0.7778
    bible_00141:
      source: bible
      text: ta nyɩŋ mi a ga Filipi me, jigidieke die dɩ yine tɩgɩkpɩɩŋ Masedonia tɩŋgbaŋ ma. Die ka yiwo
