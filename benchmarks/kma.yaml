      ref_sec: 11.78
      cer: 0.1333
      wer: 0.1481
    bible_00153:
      source: bible
      text: Ʋ nan keŋ zeti Ŋmɩŋ jɩamɩŋ aŋaŋ jɩamɩŋ mana, ta yi ʋ gbaŋ sikpeŋ tieŋ dieke dɩ tɩanna jadieke
