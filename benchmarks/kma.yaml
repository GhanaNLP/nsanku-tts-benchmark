      gen_sec: 5.36
      ref_sec: 4.68
      cer: 0.1042
      wer: 0.6667
    bible_00082:
      source: bible
      text: Masia dɩdɩɩsɩrɩ diekemba dɩ benne Asia tɩŋgbaŋ mana waasa nɩ. Akuyila aŋaŋ Pirisila Masia
        dɩdɩɩsɩrɩba dɩ lagɩsɩnana jɩama Ŋmɩŋ ba tigiri me wo waasa nɩ vɩɩnɩŋ tɩ Yɔmʋtieŋ saaŋ ma.
      sbs: 0.6958
      gen_sec: 13.2
      ref_sec: 13.04
      cer: 0.0068
      wer: 0.0333
    bible_00083:
      source: bible
      text: Nɩ yine wo yada wa wɩa, nɩ yese gbatɩtaanɩŋ mɩŋ.
