      gen_sec: 6.84
      ref_sec: 8.34
      cer: 0.1154
      wer: 0.4091
    bible_00118:
      source: bible
      text: Ama vuoŋ benne a bala vuosi yaa gamma vuodieke n yine. Wʋnɩŋ ʋ yiwo Ŋmɩŋ, ta maŋ sɩba dɩ ʋ
        balɩkʋ yiwo wusie.
      sbs: 0.6764
      gen_sec: 7.44
      ref_sec: 9.36
      cer: 0.0476
      wer: 0.1739
    bible_00119:
      source: bible
      text: Banabasi die dɩ yaala ʋ nagɩ Jɔɔn Maki a gʋtɩ ba ma aŋ ba ga.
      sbs: 0.6482
      gen_sec: 4.16
      ref_sec: 3.24
      cer: 0.0652
      wer: 0.3333
    bible_00120:
      source: bible
      text: N bala yɩa nɩ dama nɩ yiwo yɩantieliŋ, nɩ gbaŋ nɩ yilime yaa gamma wudieke n bala naa wa.
