      wer: 0.3793
    bible_00108:
      source: bible
      text: Nɩnɩŋ Samaria vuosi ka sɩba vuodieke nɩ jɩanna ama tɩnɩŋ Juu vuosi nɩŋ sɩba vuodieke tɩ jɩanna
