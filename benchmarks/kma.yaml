      cer: 0.1087
      wer: 0.5333
    bible_00120:
      source: bible
      text: N bala yɩa nɩ dama nɩ yiwo yɩantieliŋ, nɩ gbaŋ nɩ yilime yaa gamma wudieke n bala naa wa.
