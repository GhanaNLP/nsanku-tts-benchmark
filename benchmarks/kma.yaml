      gen_sec: 6.72
      ref_sec: 7.86
      cer: 0.1571
      wer: 0.45
    bible_00105:
      source: bible
      text: Yisa die dɩ yiŋŋi a balɩ ba dɩ, “Daa wʋnɩŋ yaa ʋ chɔɔŋ aŋaŋ ʋ nuŋ bɩaŋ taasɩna ʋ yɩɩsɩsɩ.
        Ʋ yɩɩŋya mɩŋ dɩ n vaa ʋ nine yuori amʋ vuosi ye Ŋmɩŋ tʋnkpɩɩma.
      sbs: 0.6824
      gen_sec: 11.2
      ref_sec: 13.7
      cer: 0.0776
      wer: 0.2647
    bible_00106:
      source: bible
      text: Fʋ zɩ n nan dɩ bie nɩ jigiŋ daraa ale yaa n nan wɩarɩ nɩ jigiŋ wʋyaalɩka gie mana; ta nɩ nan
