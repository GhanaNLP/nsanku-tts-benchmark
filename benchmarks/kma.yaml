      ref_sec: 11.22
      cer: 0.3443
      wer: 0.7742
    bible_00177:
      source: bible
      text: Die wɩa mɩrɩkʋʋrɩ ka bɩ tʋma dama ka wo hagɩrɩŋ aŋaŋ nyʋarɩ.
