      ref_sec: 7.46
      cer: 0.175
      wer: 0.52
    bible_00104:
      source: bible
      text: amʋ vuosi pam sʋŋanyile nan nyɩŋ yeŋ me ama wɩɩŋ nan yi ta chʋʋsɩ fʋ gbaŋ gbaŋ fʋ sʋŋ pam.”
