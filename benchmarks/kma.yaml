      wer: 0.2941
    bible_00106:
      source: bible
      text: Fʋ zɩ n nan dɩ bie nɩ jigiŋ daraa ale yaa n nan wɩarɩ nɩ jigiŋ wʋyaalɩka gie mana; ta nɩ nan
