      gen_sec: 5.38
      ref_sec: 6.12
      cer: 0.1067
      wer: 0.4545
    bible_00127:
      source: bible
      text: wʋnɩŋ ʋ yaala vuota mana ye gbatɩtaanɩŋ ta keŋ sɩmma wusieke.
