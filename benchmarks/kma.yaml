      gen_sec: 7.13
      ref_sec: 10.54
      cer: 0.3421
      wer: 0.7037
    bible_00112:
      source: bible
      text: Ŋmɩŋ gbaŋ sɩba dɩ wudieke n maagɩna yiwo wusie ta ŋmɩnchɩbɩsɩ dɩ wo ka ma.
