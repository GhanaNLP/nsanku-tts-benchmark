      gen_sec: 5.65
      ref_sec: 9.36
      cer: 0.2738
      wer: 0.7826
    bible_00119:
      source: bible
      text: Banabasi die dɩ yaala ʋ nagɩ Jɔɔn Maki a gʋtɩ ba ma aŋ ba ga.
