      ref_sec: 9.02
      cer: 0.3301
      wer: 0.7083
    bible_00173:
      source: bible
      text: Wʋnɩŋ Ŋmɩŋ taasɩna tɩ aŋaŋ Yisa Masia ta ʋ yine tɩ yɩaŋ. Ʋ wɩa Ŋmɩŋ dɩ vʋarɩ tɩ a nyɩŋ bɩaŋ
