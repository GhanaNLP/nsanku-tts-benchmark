      gen_sec: 10.32
      ref_sec: 11.32
      cer: 0.065
      wer: 0.1944
    bible_00072:
      source: bible
      text: Genke kʋaŋ chaaŋ Yisa aŋaŋ ʋ kʋaŋandɩɩsɩrɩba die dɩ ga Judia tɩŋgbaŋ ma, die ʋ yi daraa ale
