      cer: 0.3284
      wer: 0.85
    bible_00181:
      source: bible
      text: Chɩchɩgɩla mana mɩa mɩŋ ta yige ba gbaŋ dɩ ba keŋ tuo tune dieke dɩ kana ka yʋasa aŋaŋ kpatɩŋ,
