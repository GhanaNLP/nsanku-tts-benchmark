      ref_sec: 8.22
      cer: 0.1522
      wer: 0.3462
    bible_00144:
      source: bible
      text: Saŋka mi die wumugisike pam die dɩ nan yaa gamma sie dieke tɩ Yɔmʋtieŋ dɩ dagɩna wɩa.
      sbs: 0.6314
      gen_sec: 4.54
      ref_sec: 5.62
      cer: 0.1324
      wer: 0.5294
    bible_00145:
      source: bible
      text: die ʋ faasɩ a keesi ŋmɩŋsikpeŋ a baarɩ dɩ, “Ŋmɩŋ alibarika bie fʋ ma a tɩaŋ hɔgʋba mana, ta
        bɩ bie bʋa dieke fʋ balla fʋ mɩɩrɩ wa ma!
      sbs: 0.6614
      gen_sec: 6.8
      ref_sec: 10.02
      cer: 0.1782
      wer: 0.7241
    bible_00146:
      source: bible
      text: Ama die Ŋmɩŋ Halɩkasɩka die dɩ suuli Sitiiveni, ʋ kɔtɩ ʋ sikpeŋ a daansɩ ŋmɩŋsikpeŋ a ye Ŋmɩŋ
