      gen_sec: 9.44
      ref_sec: 9.82
      cer: 0.0952
      wer: 0.2414
    bible_00111:
      source: bible
      text: Ama ba vɩɩnɩŋ nyɩna ba sʋgɩtɩ ma, a nyɩna nyinti sɩba sʋʋŋ-n gbaŋ tɩŋgbaŋ aŋaŋ sɔmm beriŋ.
        Kanɩŋ vɩɩŋkʋ wo chʋʋsɩŋ ta bɩ faasɩ vɩɩna Ŋmɩŋ nɩŋŋa.
      sbs: 0.7093
      gen_sec: 11.36
      ref_sec: 10.54
      cer: 0.1053
      wer: 0.2963
    bible_00112:
      source: bible
      text: Ŋmɩŋ gbaŋ sɩba dɩ wudieke n maagɩna yiwo wusie ta ŋmɩnchɩbɩsɩ dɩ wo ka ma.
      sbs: 0.7271
      gen_sec: 4.96
      ref_sec: 5.1
      cer: 0.0678
      wer: 0.0667
    bible_00113:
      source: bible
      text: Ta ʋ wa keŋ giena aŋaŋ Ŋmɩŋ kɩkaabɩtʋ yiko dɩ ʋ yigi vuodieke mana dɩ wasɩnana fʋ saaŋ.”
      sbs: 0.7136
      gen_sec: 5.92
      ref_sec: 8.44
      cer: 0.1159
      wer: 0.3889
    bible_00114:
      source: bible
      text: Womi Anasi die dɩ vaa ba nagɩ Yisa a ga Kayafasi jigiŋ, vuodieke dɩ yine kɩkaabɩtɩba jakʋʋrɩ;
