    bible_00105:
      source: bible
      text: Yisa die dɩ yiŋŋi a balɩ ba dɩ, “Daa wʋnɩŋ yaa ʋ chɔɔŋ aŋaŋ ʋ nuŋ bɩaŋ taasɩna ʋ yɩɩsɩsɩ.
