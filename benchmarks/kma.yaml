      gen_sec: 6.12
      ref_sec: 7.4
      cer: 0.1159
      wer: 0.5789
    bible_00121:
      source: bible
      text: Saŋka gie dɩ tʋana wɩa, n yile dɩ dɩ vɩɩna dɩ vuoŋ bemme ʋ wone beri die wo.
      sbs: 0.7054
      gen_sec: 5.08
      ref_sec: 6.36
      cer: 0.0702
      wer: 0.2778
    bible_00122:
      source: bible
      text: Die ka yiwo ŋmɩntʋasɩ, ta die ka tʋnvʋʋsa dɩ baa dɩ yi gasɩtɩaŋkʋ dʋʋgaka daraaŋ. Paliti die
        dɩ balɩ a yɩ Juu vuosisi dɩ, “Nɩ naaŋ wa wʋnna.”
      sbs: 0.6312
      gen_sec: 9.56
      ref_sec: 10.34
      cer: 0.0833
      wer: 0.2857
    bible_00123:
      source: bible
      text: 'Yisa die wɔŋ vaa ba yaalɩ wa boniŋ die ʋ jʋalɩ a kalɩ ka ma, sɩba dɩ maagɩna die Ŋmɩŋ gbaŋkʋ
        ma dɩ:'
