      ref_sec: 11.2
      cer: 0.0857
      wer: 0.2353
    bible_00152:
      source: bible
      text: Die tʋŋ dɩ bala ka vʋŋ, dɩ Juu vuosi davʋʋsɩkɩrɩ daraaŋ wa, ta vɔrɩkʋ dɩaŋ die dɩ gbigi mi
