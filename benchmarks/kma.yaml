      ref_sec: 4.4
      cer: 0.08
      wer: 0.3636
    bible_00128:
      source: bible
      text: Ta Ŋmɩŋ dieke dɩ yɩna mɩŋ tʋʋmaha dɩ tʋŋ wa, wʋnɩŋ ʋ yine mɩŋ Masia dɩdɩɩsɩrɩba mi yɔmʋ nɩ
