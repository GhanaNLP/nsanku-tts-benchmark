      sbs: 0.6927
      gen_sec: 8.0
      ref_sec: 9.36
      cer: 0.1071
      wer: 0.5217
    bible_00119:
      source: bible
      text: Banabasi die dɩ yaala ʋ nagɩ Jɔɔn Maki a gʋtɩ ba ma aŋ ba ga.
