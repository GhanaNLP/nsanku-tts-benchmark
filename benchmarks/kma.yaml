      ref_sec: 6.58
      cer: 0.0545
      wer: 0.1579
    bible_00151:
      source: bible
      text: Tɩ Yɔmʋtieŋ Yisa Masia gbaŋ gbaŋ aŋaŋ tɩ Chɔɔŋ Ŋmɩŋ vuodieke dɩ chone tɩ ta suŋŋi tɩ a yɩ
        tɩ sʋgɩdʋagɩ dieke dɩ wone kpatɩkʋ aŋaŋ tama dieke dɩ vɩɩŋna ʋ zɔɔlɩnchɩgɩla wɩa wa,
