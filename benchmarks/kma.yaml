      gen_sec: 13.28
      ref_sec: 12.38
      cer: 0.1045
      wer: 0.4
    bible_00059:
      source: bible
      text: Die wɩa die ba pɩasɩ wa dɩ, “Die nɩŋ, mɩnɩa yine fʋ? Yiwo Elaja?”
