      gen_sec: 4.25
      ref_sec: 6.36
      cer: 0.1053
      wer: 0.2778
    bible_00122:
      source: bible
      text: Die ka yiwo ŋmɩntʋasɩ, ta die ka tʋnvʋʋsa dɩ baa dɩ yi gasɩtɩaŋkʋ dʋʋgaka daraaŋ. Paliti die
