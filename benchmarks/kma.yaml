      gen_sec: 6.8
      ref_sec: 5.7
      cer: 0.1098
      wer: 0.2632
    bible_00096:
      source: bible
      text: Die wɩa Ŋmɩŋ Halɩkasɩka die dɩ balɩ yɩ mɩŋ dɩ n gamma aŋaŋ ba ta da vaa ka mugisi mɩŋ. Womi
        Yisa dɩdɩɩsɩrɩŋ bayʋaba diekemba die dɩ benne Joopa ma die dɩ beeli mɩŋ tɩ ga Siisiria a ga Koniliawosi
