      ref_sec: 7.84
      cer: 0.0471
      wer: 0.5294
    bible_00094:
      source: bible
      text: Nɩ tʋma nɩ tʋʋma aŋaŋ sʋgɩfɩalɩŋ sɩba nɩ tʋma yɩa tɩ Yɔmʋtieŋ Masia ama nɩ daa yilime dɩ nɩ
