      gen_sec: 4.88
      ref_sec: 5.42
      cer: 0.1224
      wer: 0.3333
    bible_00085:
      source: bible
      text: dama saŋka mi yiwo tɩbɩdatɩŋ saŋŋa. Wɩaha gie mana nan keŋ yi sɩba die dɩ maagɩna Ŋmɩŋ gbaŋkʋ
