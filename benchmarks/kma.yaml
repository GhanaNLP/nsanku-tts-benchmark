      sbs: 0.6576
      gen_sec: 10.64
      ref_sec: 10.96
      cer: 0.0165
      wer: 0.1111
    bible_00109:
      source: bible
      text: Dama saŋŋa kieŋ ta vuosi kaaŋ dɩ wʋmma dagɩvɩɩnʋ, ama ba nan keŋ dɩ ba gbaŋ gbaŋ ba lɔlɩbɩatɩ,
