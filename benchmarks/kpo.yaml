      wer: 0.8947
    waxal_00171:
      source: waxal
      text: Alʋ zati nʋ ɛfʋyɛkʋ kɩka Alʋ zati nʋ ɛkplɔ ɛtʋ, ɛdɩnɩ adʋ awʋvɛ, ɛdɩnɩ lɛ ɔlʋwɩnɩ, ɛlʋ efuele
