      cer: 0.1405
      wer: 0.6774
    waxal_00180:
      source: waxal
      text: Alu ekʊalɛ nɛvɛ kaka wa ɛsɛnalɛ munalɛ ɛfɛla ku ɔsidɩ agbavlɛ ku ewu ɛlu uvidi bi akɔ agbavlɛ
        uluvisu akɔ tsitsɩ ɔsɩdi bi azɛ ɔsɛɣa ko ayitsu kaɣa ɛsɛ zɔnafa mutɛ akayɔ alɛ nu osɩfisɛdza
