      sbs: 0.6552
      gen_sec: 10.41
      ref_sec: 22.11
      cer: 0.2967
      wer: 0.95
    waxal_00186:
      source: waxal
      text: Ɛmɛ bilɛ ɛfʋ katikpo udzali kʋ owʋ ni alʋlʋ keli kʋ ɛduni bibi kaxa kaba
      sbs: 0.6648
      gen_sec: 6.91
      ref_sec: 15.76
      cer: 0.1379
      wer: 0.8
    waxal_00187:
      source: waxal
      text: alʊɛfua ya nʊ idza, ɔsi nʊ uluvi akala, ɔsi yɛ akɔvlɛ nʊli kʊ ewu ɛdɩ nʊ ukponu, uluviebɩ
        akɔdʊ nʊ agbatɛ, kʊ atanɩ adʊ ufa nʊ ɛmɔ, uluvie ewu ɛkunɛlʊ alʊɛdɩnɩ kɔ nʊ atamidu kakɔsʊma,
