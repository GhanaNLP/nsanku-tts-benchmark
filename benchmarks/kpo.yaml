      wer: 0.9062
    waxal_00173:
      source: waxal
      text: Eluviwani ya nʋ owu gbɔtɔ tʋ Ɛdini agb'ɔna kɔ, ɛdi yavʋ k'ayɔ aɣla ɣǝ n'owu yɛ, ɛdini adʋ
