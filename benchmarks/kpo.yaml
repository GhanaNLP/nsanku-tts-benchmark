      cer: 0.2745
      wer: 0.9
    waxal_00183:
      source: waxal
      text: Ɔbɛ kɩka, itsunɩ dʋ ɩtsɛdɩ-tsɛdɩ ka yɩ kʋ ɛkʋtɛnɩ bɩ dʋ ɩtsɛdɩ-tsɛdɩ yɛ Owu ava ayʋ ɔbɛ wanɩ
