      wer: 0.9615
    waxal_00002:
      source: waxal
      text: Alʋ ɛdini ya n'udzali Ɛdi adʋ aɣla n'idu, ɛdi adʋ aɣla nʋ akpɔ Atɛ ɛkʋyɛ nʋ atami alɔ, ɛdi
        zati n'atam'idu kʋ atɛ abidzo dʋ n'atamidu
      sbs: 0.6554
      gen_sec: 7.59
      ref_sec: 16.51
      cer: 0.1089
      wer: 0.5385
    waxal_00003:
      source: waxal
      text: owʋ alɔ kʋ owʋalɔɛ eƒiodu Kʋ alʋme ivʋe abehui ɛfʋɛ kasɛsɛ aba owʋetʋ kama kɔdsu ɛsɛ kadzɔ
        iv owʋe kakɔnaeme ivʋebi ɔyanʋdue kalʋɛdini kɔ kakakɔsʋ nukunu sɛ kadzɔɛ
      sbs: 0.6516
      gen_sec: 9.24
      ref_sec: 25.16
      cer: 0.1912
      wer: 0.75
    waxal_00004:
      source: waxal
      text: Alʋ ɛdini kana ɔlʋ kʋ ayɔ gagba dini lɛ kʋ ɛkʋti kʋ akana ɔlʋ ɛdini adʋ awʋfue nʋ ava edini
        adʋ awʋvɛ nʋ ava kʋ alʋ ɛdini akɔ ɛkɔmɔtɔ ofue nʋ ava kʋ ekʋ uti kʋ akana ɔlʋ iwui dini bibi dʋ
        atmi ava nʋ ɛfɛ
      sbs: 0.6294
      gen_sec: 10.89
      ref_sec: 17.27
      cer: 0.2152
      wer: 0.913
    waxal_00005:
      source: waxal
      text: Ɛmɛ lɛ ɛfʋɛdɩ kʋ na mʋ asɩ ɛla dɩnɩ akewele ɛkʋRɔba wɛ li la kʋ akewele ɛkʋɛ
      sbs: 0.5395
      gen_sec: 3.66
      ref_sec: 16.74
      cer: 0.25
      wer: 1.0
    waxal_00006:
      source: waxal
      text: Edɩnɩ dɩ li la nʋ tɛ kʋ ɛtʋfue alʋ tsʋe Ɔsɩ kʋ ɔdʋ atamɩlɩ yɛ mʋa, ozǝtɩ nʋ uluvi dɩ bʋa kʋ
        adʋ aɣʋ ʋblɔ nʋ uti nʋ ɔwɛ nʋ ava Ɔsɩ yɛ mʋa akɔ tsɩtsɩ kʋ kɔpʋ ɔnʋlɩ dɩ yadʋ nʋ ɛkplɔ yɛ bʋakʋ
        ɔlɛ nʋ ayʋ ɛtʋ ava Uluvi ɛfua emlɩ ya nʋ atamɩlɩ kʋ atanɩ emʋ nʋ ʋwɔ ɣafa nʋ ava
      sbs: 0.6668
      gen_sec: 15.56
      ref_sec: 29.79
      cer: 0.2451
      wer: 0.7969
    waxal_00007:
      source: waxal
      text: Alʋka dini ʋsealʋ dʋ usedza kʋ akamʋ inʋ Ɛdini kɔnʋ ava, ɛdini adʋ ɛkʋvɛ, kʋ adʋ ɛkʋfue yadʋ
        kʋ adʋ ʋblʋ awʋ, ɛkʋwɛ yadʋ kʋ awʋ Kʋ awɛgɛbi azɛ ɛkʋxɛsɛ dʋnʋ ayili kʋ ɔkaxɛsɛ
      sbs: 0.6037
      gen_sec: 9.26
      ref_sec: 24.38
      cer: 0.1176
      wer: 0.5294
    waxal_00008:
      source: waxal
      text: Ɛtʋfue alʋ wani lanʋtɛ kakpɔ ʋtokʋ adʋ awʋ ɔvɛ nʋ ava ɛdigbo ayavɛ kʋ ɔyakpɔ ʋtokʋe adʋ ɔwɛ
        nʋ ʋti kʋ akakpɔ ʋtokʋe atani aya ɛvʋ nʋ ɛmɛ alʋ poo dʋ ʋdʋ kʋ aka kɔsʋ ma nʋ alɛnɛ kʋ akakpɔ
        ʋtokʋe
      sbs: 0.6606
      gen_sec: 10.64
      ref_sec: 24.46
      cer: 0.1382
      wer: 0.5854
    waxal_00009:
      source: waxal
      text: Alɛ ɛku vɛ dunu uti kɔluwui ni di ku ɔyeli nu ayava ku akɔ agbavlɛ adu awu ofue adu ufa nu
        uwɔ kpɔlusi dibi ya nu itsɛdi akɔ ɛkɔtɔ ɔwɛ ku akɔ ɛku du nu unuku
      sbs: 0.5962
      gen_sec: 8.8
      ref_sec: 23.37
      cer: 0.1721
      wer: 0.9444
    waxal_00010:
      source: waxal
      text: Ɛmɛ lɛ ɛfuɛdi alʋ Yovo di keyi ɛkʋ gɛdɛɛ Okeyi kusi ka atani ayɔkele bagi Okeyi ɔ tʋnʋgavi
        nʋ ɔ ɛkʋ gɛdɛɛ nʋ ɛkplɔ ava
      sbs: 0.6586
      gen_sec: 5.56
      ref_sec: 18.61
      cer: 0.2021
      wer: 0.92
    waxal_00011:
      source: waxal
      text: Ɛmloɖini ana aɖʋ ɔbɛli,atani azɛ bokiti n'ahla, atani akɔlu keno Ivieɛɖini azɛ kpolu n'ahla,
        ɛɖi aɖʋ ɛkɔtɔ
      sbs: 0.5716
      gen_sec: 5.38
      ref_sec: 16.21
      cer: 0.1765
      wer: 1.0
    waxal_00012:
      source: waxal
      text: Tʋ kɔdzɩnɩ wa aba suku dɩ li kʋ abakakɔsʋ evidzenɩ kʋ akɔsʋ yɛ bʋa mɛ aka yɛ atike Alʋtɛ ɔlʋkɔsʋ
        ɔ evidze wanɩ dɩ bɩ edigbo evidze nʋ aɣla la kʋ ɛdɩ bɩ zati nʋ ɩtsɛdɩ kʋ ɔkeŋlo ɛkʋ nʋ ɛkplɔ yɛ
        ava kʋ ɔkeŋlo atike ka ma kʋ kabakʋtʋ nyuǝ kʋ ɛtʋ kɔbese ma
      sbs: 0.6579
      gen_sec: 13.95
      ref_sec: 24.28
      cer: 0.2626
      wer: 0.8545
    waxal_00013:
      source: waxal
      text: Ɛvɛ lɛ alu ɔfue sɔŋ la za uti alu ɛfua aza uti nu itsu kika di wu akatulu owu di ma atami
        owu ma nu ayɛtu  Yovo wani bi ɛkplɔ ma nu atamiili Ku ɛkplɔdini atupa nu ɔfidini ma nu ɛkplɔ yɛ
        ava ku ezati katɛ ulu
      sbs: 0.6171
      gen_sec: 10.95
      ref_sec: 16.42
      cer: 0.1187
      wer: 0.8298
    waxal_00014:
      source: waxal
      text: Ɔsɩ ɛla dɩnɩ kɔ nʋ ɛmɛ, akɔ nʋ kpafo kʋ akewele ɔɣɔkʋ kʋ edogbo adʋ ɔvlɛawʋ kʋ ewu duku nʋ
        ɛlʋ kʋ ayɔ aɣla yɔyǝdu nʋ ɛlʋ kʋ edigbo awʋwɛ kʋ ewu dukuwɛ kʋ edigbo bɩ kewele kɔpʋ nʋ gagba
        li kʋ atigo lɛ nʋ atamɩɛtʋ nʋ bokiti nʋ rɔba botitinɩ
      sbs: 0.6411
      gen_sec: 12.16
      ref_sec: 22.63
      cer: 0.246
      wer: 0.7059
    waxal_00015:
      source: waxal
      text: Alʋɛdɩnɩ dʋ ɛfʋɛ, ito dʋ atamidu ; apʋ adʋ bagɩ n'atamidu  Sno bɩ otsue n'ɛfʋɛ
      sbs: 0.574
      gen_sec: 3.69
      ref_sec: 16.46
      cer: 0.2034
      wer: 0.9286
    waxal_00016:
      source: waxal
      text: Not clear atani adu awu kuaka la Aka la ɔɔ ata mi ala Ɛdini ayɔ ɛwu duku nɛ luKu ata tsi yɔ
        ɛvlɛ yɔ wu nu li
      sbs: 0.6337
      gen_sec: 4.8
      ref_sec: 18.04
      cer: 0.2683
      wer: 0.9259
    waxal_00017:
      source: waxal
      text: Alʋɛdìní la ntɛ kʋ atadza, atani adu awu ɛlu ɛlu ɛlʋ kʋ ɛdigbo adu ugbatawla kʋ azɛ ʋwovi
        'u nʋ aɣla kʋ atani azɛ ɛtu
      sbs: 0.5088
      gen_sec: 5.56
      ref_sec: 16.42
      cer: 0.2747
      wer: 0.84
    waxal_00018:
      source: waxal
      text: Alukpɔ ɛkutɛ dini dʋ ɛfuɛdi kʋ akakpɔ ɛkutɛAtani ama utu ɔnuli ni nʋ ɛfuɛƐdini akemuɣanavaƐdini
        bi yanu itsu diava kʋ akanɔlʋ nɛfuɛ
      sbs: 0.6241
      gen_sec: 6.98
      ref_sec: 18.68
      cer: 0.1273
      wer: 1.0
    waxal_00019:
      source: waxal
      text: Iwo ni tsue nʋ ɔbava nʋ ɔfuta tsɔdi lι Iwowani iwo ɛfua ɔsi edigbo uluvi edigbo kʋ kʋsi ya
        nʋ iwowani ayʋ itsɛdι Ɛdi iwo ɛfuani yɛ ɔsidι dʋ ayʋ iili kʋ lakɔ ɔvlɛ vɛ
      sbs: 0.6417
      gen_sec: 8.98
      ref_sec: 18.64
      cer: 0.2231
      wer: 0.6857
    waxal_00020:
      source: waxal
      text: Amu ɛmɛa alevidini du ʊdzɔli akagbɔ sika alevi wani azɛ kusi naɣla ɛdini ewu ɛkuvɛ nu aɣla
        kalevi efua kakɔsu ɛsɛ adi kalua ayɛlʊtɛ aleviwani azɛ kataya naɣla
      sbs: 0.6775
      gen_sec: 9.24
      ref_sec: 22.92
      cer: 0.1221
      wer: 0.8214
    waxal_00021:
      source: waxal
      text: 'Ƒome l''ekualɛ n''ɛvɛ: kʋ osɩɛ zati nʋ owuava kazɛ ay''evidze n''aɣla , k''ɔnyɩɛ bɩ ya n''ayɛtʋ  Atadza
        akɔ ɛkɔtɔ, kayɔ ɔvlɛkɩka dɩ yɔ kɔdʋ nʋ atanɩ ayidue Ukpidɩ ya n''atamɩalɔ ɔkɔlʋ n''atamɩalɔ, kʋ
        owudɩ bɩ ma , k''owudɩ bɩ ma n''atamidu'
      sbs: 0.6859
      gen_sec: 13.47
      ref_sec: 25.12
      cer: 0.2775
      wer: 0.9744
    waxal_00022:
      source: waxal
      text: Uvi di bi la ntɛ di yɛ kasɛ ku motoKi tsuwu di bi sua nu motoɛ Kɔ wu di ni bi maƆya nɔɔ ɔma
        nɔɔ itsɛdi ku akɔ ɛkɔtɔƐkɔtɔɛ bua kua kɔ mua ɔlɛ ublɔ, ɔtili su kɔ ya ba
      sbs: 0.6322
      gen_sec: 8.06
      ref_sec: 17.92
      cer: 0.0565
      wer: 0.7
    waxal_00023:
      source: waxal
      text: Ɔsɩ ɔsɩ ofue azɛ ɩbɔtsɔ nʋ aɣla kʋ ɛkʋwɛ dʋ ayili kʋ bodobodo bɩ dʋ plɛtɛ li Kʋ namʋ itsede
        ɔvɛ nʋ ofue bɩ ɛtsue, ɛna nʋ ofue yɛ, ɛfʋa nʋ ɔvɛ yɛ kʋ kɔfɛ ayʋ ʋwʋ bɩ otsue
      sbs: 0.6274
      gen_sec: 8.37
      ref_sec: 23.65
      cer: 0.2171
      wer: 0.8205
    waxal_00024:
      source: waxal
      text: Ɔbɛ kɩka k'atʋ agba nʋ ɔbɛ yɛ ava, k'alʋ asɛsɛ nʋ agba yɛ mʋa ayava alo alʋ ya nʋ agba yɛ
        ava k'owudɩ bɩ mʋa ɔma n'uti
      sbs: 0.6373
      gen_sec: 5.64
      ref_sec: 15.92
      cer: 0.1839
      wer: 0.7778
    waxal_00025:
      source: waxal
      text: awli wani azati nʋ itdza itdza kikaa, awli ɛlʋɛlʋ, ɔwlikataya kika kika, atani akɔ ɔvlɛ ɛlʋɛlʋ,
        akɔ sika kɔtɔ kʋadʋsika ɛkʋ dʋ nʋ ɛmɔ nʋʋƒa ni
      sbs: 0.6206
      gen_sec: 8.68
      ref_sec: 27.26
      cer: 0.2301
      wer: 0.9231
    waxal_00026:
      source: waxal
      text: Ɔsɩ ƴɛ zati nʋ iƙpoƙu li t' aɖʋ awʋ wɛ, t' eƙele ɛlɔNʋ aƴʋ ɛƙplɔ ƴɛ ava mʋa,ƙɔpʋ ɖɩ lɛ ƙʋ
        ivi ɖʋ aƴili,ƙʋ ɔƙa ma ɩfɔ nʋ ɛmʋnʋƙpaƙo ƴɛ
      sbs: 0.6125
      gen_sec: 6.58
      ref_sec: 18.12
      cer: 0.3838
      wer: 0.8667
    waxal_00027:
      source: waxal
      text: evidzedɩ ya nʊ itsɛdɩ, nʊ edini yɛ, ya mʊ ɔgba ɛlʊɛlʊ ɛdɩnɩ dʊ iko li, ɛdɩnɩ lɛ ugbata,
      sbs: 0.6397
      gen_sec: 5.24
      ref_sec: 18.04
      cer: 0.2727
      wer: 1.0
    waxal_00028:
      source: waxal
      text: Ɛmɛbi lɛ kɔndzi, dɔktɛ zati kʋ asɩyɛ bi zati Kʋ ɔke yi ɛsɛyɛ kʋ ɔkazɔfa kʋ ɔbamʋ alɛ ɛsɛlɛ
        lakʋ ɔba kʋtʋ kayi atike Atikeni kɔ ɛkplɔ, ikpokʋ dɔkta adʋ awʋfueƆsiyɛ adʋ awʋ pɩapɩa kʋ azɛ
        bagiwɛ, kʋ ɛkʋni kɔnʋ edinie
      sbs: 0.5402
      gen_sec: 11.9
      ref_sec: 18.08
      cer: 0.1941
      wer: 0.9024
    waxal_00029:
      source: waxal
      text: Ase no aluvi ɔbu de ya kaka zɛvi kɔnu wa Ase wanw ayɔ uwi yɔ kele awu do no uti, ko atame
        ado awuvɛ no ava ko azɛ itsu Uluviwa be nado awu ko atame ado trɔza no uti ko aka zavi kɔnu wa
      sbs: 0.6297
      gen_sec: 0.9
      ref_sec: 21.08
      cer: 0.9571
      wer: 1.0
    waxal_00030:
      source: waxal
      text: ɛmɛ bi lɛ edini k'awi no ofue kò alɛ ɛkò ta ni sɔŋ n'edini yɛ ivu to n'ava k'ɔka lò n'edini
        yɛ ikpoku ma no edini yɛ keka kò sude bi do ayili kpe kpe kò ɛkplɔ ma no udunu li kò ivlitsɛ ya
        du n'ava
      sbs: 0.5327
      gen_sec: 9.67
      ref_sec: 19.99
      cer: 0.1931
      wer: 0.7826
    waxal_00031:
      source: waxal
      text: Aalʋɛɖini lanutɛ aaza nʋ ɔrga kikadi bua kuu ekele lɛ kuu ɔlɔɛɖigbo kakpɔ ɔrganyɛƐɖi azɛ ɔsɛhako
        koka ɖʋ unɔ ɖu n'aili,ku ɔsi ɛtʋfue tsiɖi bi azɛ giŋta koka pɔ
      sbs: 0.6527
      gen_sec: 8.54
      ref_sec: 18.4
      cer: 0.2171
      wer: 0.8621
    waxal_00032:
      source: waxal
      text: Ɔsɩ ɛwlʋdɩ akakpɔ ɛwʋnyɛ Alʋɛdɩnɩ bɩ adʋ awʋ ɔvɛ, ɛdɩnɩ adʋ awʋfue, ɛdɩnɩ bɩ adʋ ɔyɔmɔawʋ
        Uvi dɩnɩ bɩ atanɩ nʋ ʋvatsɛ yɛ nʋ ɛfɛ, ata atanɩ adʋ awʋwɛ sɔŋ la kʋ atanɩ dʋ udu yɛ kʋ akakɔsʋ
        ma
      sbs: 0.6527
      gen_sec: 10.07
      ref_sec: 19.79
      cer: 0.2721
      wer: 0.9487
    waxal_00033:
      source: waxal
      text: ʊvɩ dɩ lanʊtɛ dʊ Shatawalɩ nʊ Stobɔyɩ atamɩ ɩlɩ Stobɔyɩ adʊ awʊ ɔwɛ ʊtɩ nava kʊ Shatawalɩ
        bɩ adʊ awʊ ovɛ katʊ tsɩtsɩ ɔwɛ Ʊvɩ dɩ akɔ ɔvlɛ kadʊ awʊ ofʊe nʊtɩ kazɛma nawla katanɩ kasɛmɔ kaka
        wlɛsɛdʊ
      sbs: 0.6173
      gen_sec: 10.37
      ref_sec: 28.73
      cer: 0.3354
      wer: 0.9737
    waxal_00034:
      source: waxal
      text: ɛmɛ lɛ ɛbʋɛlɛ dza kʋ ɛvidzɛ dini kɛ bʋɛlɛ, aka kpɔ ɔtsɛ, ɛdi ka kpɔ ɔtsɛ ɛdi azɛ itsʋ nʋ ala
        ka kpɔ ɔtsɛ kʋ ɛdibi ayɔ ala la katsi nʋ ɔtsɛ aɣa, kʋ alʋɛdini bi zanʋ atami ʋdʋ nʋ ɔtsɛ tʋ
      sbs: 0.6418
      gen_sec: 10.57
      ref_sec: 18.12
      cer: 0.1786
      wer: 0.6905
    waxal_00035:
      source: waxal
      text: Ɔsɩ dɩ aɣa udzǝli kʋ oyevu ɛkʋ Ɔlʋ yɛ keyi ɔlɔkʋ, dzakali nʋ abula nʋ ɛfɛ Mɛ evidze dɩnɩ bɩ
        alʋ ɛkʋ nʋ ɛlʋ kasekpe fa nʋ ʋdza yɛ li Ayɛlʋtɛ ɔsɩyɛ oyevu ɛkʋ yɛa, kʋ ɔlʋyɩɛkʋ yɛ kɛwʋ ɛkʋ yɛ
        ka, evidze wani bɩ abakɔ kʋ aka kɔsʋ ma
      sbs: 0.6366
      gen_sec: 12.47
      ref_sec: 22.63
      cer: 0.1543
      wer: 0.72
    waxal_00036:
      source: waxal
      text: Ɛmɛ asɩ kʊ aluvɩ zanʊ ʊtɩkpa kʊ owudɩ ma nʊ atamɩɛtʊ kʊ atanɩ zanʊ ʊtɩ kakɔsʊ ɛkʊ
      sbs: 0.6664
      gen_sec: 3.95
      ref_sec: 17.15
      cer: 0.9538
      wer: 1.0
    waxal_00037:
      source: waxal
      text: alũni dũ ɛvɛ ɛdini adũ awʊ vɛ ɛdini biadũ tsuava atani ka nó ɔbɛvi ɔbɛbi alili ɔbẽ nalɛ ivie
        kũ yakutũ ngũa ɔlɔdini azevi awʊ ɔlɔdini bi adu awũ ga kpokũ ni lɛ nata mietũ ylɔba ni dũ atamietũ
        atani nũ
      sbs: 0.6113
      gen_sec: 10.92
      ref_sec: 21.7
      cer: 0.1938
      wer: 0.9024
    waxal_00038:
      source: waxal
      text: ɛkutɛ kika di ma, ku alulu zati nu ɛkutɛ ayɛtu, ku foŋfoŋm bi tsʋe nu ɛkutɛ ayu itsɛdi, ku
        ukpi bi du ɛfɛ, ɔsi di ama uvi nu idu ku esikuti
      sbs: 0.6143
      gen_sec: 7.61
      ref_sec: 18.94
      cer: 0.2381
      wer: 0.7742
    waxal_00039:
      source: waxal
      text: ɛfu wla ɛsɛ do keka di lantɛ ikpoku lɛ ikpokue efuele ɛfuɛdi avɛ edinie dzakplo lɛ ofue ɛkplɔ
        lɛ no iliɛ k'ivlitsɛ dini lɛ
      sbs: 0.5887
      gen_sec: 6.94
      ref_sec: 16.86
      cer: 0.1122
      wer: 0.75
    waxal_00040:
      source: waxal
      text: Ɛvɛlɛ ɛfu gbɔ galamsi ku atani kewele etie du nu ivi li alevi ɛfuadi ya nu atamitsɛdi ku atani
        azɛ kataya atadza adu awu fue atamitsɛdi bi uwe dini ma nu ɛfɛ
      sbs: 0.6538
      gen_sec: 8.46
      ref_sec: 18.0
      cer: 0.0794
      wer: 0.9062
    waxal_00041:
      source: waxal
      text: Tɛfʋɛ lɛ ɛfʋ dɩ bʋakʋ asɛlɛ k' alʋ akɔ naɣa akɔsʋ ɛsɛ dɩ bʋa kadzɔ beli Ɔlɛ ɛkʋtɛ dɩ bʋa kʋ
        ayʋɩ nʋ ofueƐtʋ fue dɩnɩ abɛfʋɛ, katanɩ ya kabe de yeyezɛlɛ; ɛdɩnɩ yavʋ, kɛdɩnɩ bɩ ezikɔlʋAsɩ
        naluvi, ɛdɩnɩ akɔtsɩtsɩ, ɛdɩnɩ adʋ awʋ vɛ,ofue, ɔwɛ ɛdɩnɩ bɩ akɔ ɛkɔtɔ
      sbs: 0.6561
      gen_sec: 13.72
      ref_sec: 26.58
      cer: 0.34
      wer: 0.9388
    waxal_00042:
      source: waxal
      text: Evidze dini kebuele nʋ ɔbɛ ayʋ ɛtʋ, akawele ɔkʋ, atadza kɔlʋ ɛdi agbɔ ɔnakɔ kʋ ɔkewele ɛkʋ
        yɛ nʋ ɔbɛ yɛli Ɔkʋwani ɛdi lɛ ɔvɛ, ɛdi lɛ ʋgbatawla, kʋ evidzewani kɔ
      sbs: 0.6087
      gen_sec: 9.5
      ref_sec: 16.42
      cer: 0.119
      wer: 0.8065
    waxal_00043:
      source: waxal
      text: Ʋdza li kʋ ɛtʋfue alʋɛdɩnɩ aya nʋ ayɛtʋ Ɛdɩ asʋɩa akpo nʋ agbatɛ, akɔ ɛkvɔtɔfue, adʋ bɛtɛku
        Ɛdɩnɩ adʋ awʋnʋ, ɛdɩnɩ adʋ bɛtɛnʋlɩ kʋ ɔlʋka dɩ bɩ ya nʋ
      sbs: 0.6651
      gen_sec: 9.0
      ref_sec: 21.01
      cer: 0.547
      wer: 0.9655
    waxal_00044:
      source: waxal
      text: Tazɛ ɛƙʋ nʋ aɣla,gatsi nɩ lɛ nʋ aƴɛtʋtable nʋ etule nɩ lɛ nʋ aƴɛtʋ nʋ ƴovo tule nɩ
      sbs: 0.4512
      gen_sec: 3.83
      ref_sec: 18.41
      cer: 0.1875
      wer: 0.9444
    waxal_00045:
      source: waxal
      text: Ɛmɛ lɛ edini ,ɛzawla kʋ ɛkplɔ lɛ nʋ ɩɣɩlɩƲgbatawla dʋ ɛkʋɛdɩ ,kɔpʋ dɩ li Ikpoku lɛ nʋ ɩtsɛdɩ
        sʋde dʋ ayili
      sbs: 0.6417
      gen_sec: 6.48
      ref_sec: 21.41
      cer: 0.2143
      wer: 0.9048
    waxal_00046:
      source: waxal
      text: Akagbɔ ɛgamɩ nɔbelɩ Kʊ alʊ ɛfua yavʊ nɩtsenʊ, kalʊɛdɩnɩ akewele nʊ ɔbelɩ Alʊɛdinɩ ewʊ ɛkʊvɛ
        nɛlʊ kadu ɔbelɩ
      sbs: 0.6692
      gen_sec: 5.88
      ref_sec: 21.33
      cer: 0.9551
      wer: 1.0
    waxal_00047:
      source: waxal
      text: Atanɩ ekualɛ nʋ owu ayɛtʋ, alʋwle owu dʋ la ekualɛ nʋ ɛfɛ, kʋ aya nʋ owu ayʋ alɔ
      sbs: 0.6263
      gen_sec: 4.8
      ref_sec: 16.6
      cer: 0.3115
      wer: 0.9444
    waxal_00048:
      source: waxal
      text: tɛlɛ udzali ka ka yu dză mɛ wamu olévi di bua ku ɔlɛ ɛtufué alu ka adu awu ɔwlɔmɔ adu tinétsé
        lɛ ɔwɛ ku éwu ɛku nu unuku kɔké vu ɛku du kusi li
      sbs: 0.6169
      gen_sec: 6.65
      ref_sec: 21.09
      cer: 0.1909
      wer: 1.0
    waxal_00049:
      source: waxal
      text: Evidze ɛla dɩ ekʋalɛ nʋ ɛfʋ duku dɩ k'akɔ kasʋ ɛsɛ Atanɩ eyua kadegba yɔzɛ kakɔsʋ ɩvlɩ yɛ
        li
      sbs: 0.6233
      gen_sec: 4.96
      ref_sec: 19.0
      cer: 0.2192
      wer: 0.8947
    waxal_00050:
      source: waxal
      text: Ɛkʋtɛdɩ la ma nʋ ɔbɛ ayinu, k'ɔ ɔbɛɛ ayinua , ʋgbatawa bʋa k'adʋ ʋbʋɛsʋ nʋ itsu mua viavanɩ
        nʋ kokosidɩ k'emuava k'ɔya n'ɔbɛɛtʋ kʋ avavlɩtsɛ ekele ɔɔ ʋblʋ ; k'ɛkʋtɛ viavadɩ bɩ ya n'ɛfɛ atsasʋ
      sbs: 0.6526
      gen_sec: 9.15
      ref_sec: 24.1
      cer: 0.2381
      wer: 0.9394
    waxal_00051:
      source: waxal
      text: Alu ŋi ɛmu pípa ɔbu ɔbu Ataŋi abu kʋ akawalɛ aɣla kʋ akamɔ Ɛɖìní aɖu ifɔ ŋu ʋtu Ɛɖìní ɣa ŋu
        uti kʋ akakɔsu ma ŋu ava
      sbs: 0.5661
      gen_sec: 6.92
      ref_sec: 18.29
      cer: 0.3667
      wer: 1.0
    waxal_00052:
      source: waxal
      text: aluɛdɩnɩ kawa ivi nʊ ukulu nʊ ikoli kɔmamɛ, adʊ ɛkʊ nʊ aɣla, kʊ akɔ ɛkɔtɔ bɩ nʊ ɛlu, ukulu
        yɛ amɛ kʊ abuɛ amʊ
      sbs: 0.6256
      gen_sec: 5.98
      ref_sec: 16.76
      cer: 0.3614
      wer: 0.875
    waxal_00053:
      source: waxal
      text: alʊɛdɩnɩ adʊ edini, kʊ uluvi edigbo adʊ awu wɛ, kʊ azɛ ɛkʊ ɣa ɛsɛ dʊ nʊ ayili, kʊ aluɛdɩnɩ
        bɩ ya nʊ ayalɔ, ɛdɩnɩ adʊ awu kʊcawu yɛ kakʊ nuti, ɛdɩnɩ adʊ awu wɛ
      sbs: 0.6331
      gen_sec: 4.48
      ref_sec: 18.36
      cer: 0.75
      wer: 1.0
    waxal_00054:
      source: waxal
      text: Ɔwli ga yɛ kasɛmʋ nʋ alili alʋka wani kʋ alevi ɛfua azɛ kataya kʋ edigbo tɔ n'alɔ kʋ edigbo
        bi ya n'ayidu kʋ alʋ onewani emli ya vu k'aka kɔsu ma
      sbs: 0.6635
      gen_sec: 8.2
      ref_sec: 20.81
      cer: 0.0982
      wer: 0.5484
    waxal_00055:
      source: waxal
      text: Ɛmɛ bi lɛ udzali  Ku ɔsi yɛ ewu duku nu ɛlu ku ɔke yi ɛku ku ɔsi bene ku evidze dini kɔ nu
        ayɛtu Evidze edigbo alu ɛku nu ɛlu ku ɔsi di bi ya nu udu nu ɛfɛ ku alu ɛku nu gagba dzakali,
        abula, ɔlɔku Laku ɔlɔku nu ɛku ni kɔ Evidze edigbo kamɔ
      sbs: 0.5977
      gen_sec: 12.95
      ref_sec: 17.92
      cer: 0.0879
      wer: 0.8393
    waxal_00056:
      source: waxal
      text: Ɛkplɔ lɛ dɩ ɛkplɔdɩ lɛ n'ɛmɛ ,al'ɛkʋwɛ dʋ , plɛtɛ fuele ɛfʋa oyǝ n'ayava , biskuit dʋ edigbo
        li ,ɛgawʋnɩ tsue n'ayava  Ɔlɔdɩ zati kenyuǝ ti n'ayɛtʋ
      sbs: 0.6664
      gen_sec: 8.76
      ref_sec: 17.31
      cer: 0.2162
      wer: 1.0
    waxal_00057:
      source: waxal
      text: Ɛvɛ, akana ɔlʋ kʋ ɔlʋna yɛ bʋa kʋ akana yɛ mʋa, atamɩ ɔlʋwɩnɩ yɛ aba kɔyaba kɔsʋ ɔ ɔlʋna yɛ
        bʋa kʋ ɔkana ayɛlʋtɛ, ɛdɩnɩ adʋ ʋɣɔ nʋ udu kʋ ɛdɩnɩ akɔ ɛkɔtɔ ʋblɔ kʋ adʋ awʋ bɩ ʋblɔ kʋ edigbo
        bɩ mʋa, ɔdʋ ɔya nʋ atamɩɛtʋ kʋ ɔta ayʋ awʋ yɛ mʋa, ama mʋ ʋgbatawla kʋ ɔya nʋ atamɩɛtʋ kʋ ɔta
        bɩ akɔ ɛkɔtɔ
      sbs: 0.6116
      gen_sec: 17.0
      ref_sec: 21.01
      cer: 0.1556
      wer: 0.8
    waxal_00058:
      source: waxal
      text: Gana prezidɛt nʋ alʋ ɛdɩnɩ kadʋalɛ aɣlaAkunfo Adʋ, Gana prezidɛt adʋ kotu Kʋ alʋ one wanɩ
        bɩ adʋ kotu ,kata dza kplo ewu tayKʋ Akunfo Adʋ ekpe alɔ nɔlʋ edigbo kʊ ayɔ aɣla dʋ kayɩ naɣlamɛ
        kʋ ɔka dʋ yɩ aɣla nedini di bʋa kʋ ikpoku nɩ lɛ nʋ edinie
      sbs: 0.6677
      gen_sec: 14.04
      ref_sec: 24.54
      cer: 0.2124
      wer: 0.72
    waxal_00059:
      source: waxal
      text: Ɔse de ado awuwɛ ko ezukuti no udzali koke yi ɛku Azɛ peya nahlaTomantos eme bokiti de li
        kɔdo ayetoPeya wane tsue no ɔku de liAbidzo de be do ayidu
      sbs: 0.6609
      gen_sec: 8.59
      ref_sec: 22.23
      cer: 0.2017
      wer: 1.0
    waxal_00060:
      source: waxal
      text: Alʋ kɔnʋ ɛmɛ agbɔ eti kʋ ɔlɛdi azɛ ɛkʋka eti kʋ afɔvi eti ɛdibi alʋ ɛfʋa adʋ alʋ nʋ uti kʋ
        azɛ ɛkʋɛdi ɛdi adʋ awʋfue kʋ ɛdini bi yanʋ ʋdʋ kʋ adʋ awʋwɛ kʋ adʋ ʋnʋkʋ bɛtɛ kʋ ɛdibi badʋ awʋ
        ɔtili kʋ atabi adʋ ʋnʋkʋgi kʋ uwi kɔnʋ atami idʋ
      sbs: 0.6079
      gen_sec: 12.92
      ref_sec: 29.64
      cer: 0.288
      wer: 0.9423
    waxal_00061:
      source: waxal
      text: Aƙéɓʊɛlé, ɛƙʊte ɛla ma , aluvɩ ɛla ƙala ƙalu oŋé wanɩ ƙasu ɛsɛ, ɛɖiŋɩ ƙakpɔ ɔtsɛ Ɔlʊ éɖɩɣɓo
        aɖʊ ɔwlɔmɔ awʊ, éɖiɣɓo awu mɛ, éɖiɣbo aɖʊ atalègbɛ ƒoé
      sbs: 0.6855
      gen_sec: 4.98
      ref_sec: 23.12
      cer: 0.886
      wer: 1.0
    waxal_00062:
      source: waxal
      text: ɔsi yɛ zati nu kɛkɛ ayava nu ello wani ɛfua ayili kewu ɔɣɛdu nukɛke ayidu kʊ alu kusi nu ɛlu
      sbs: 0.6461
      gen_sec: 4.49
      ref_sec: 18.0
      cer: 0.1781
      wer: 0.65
    waxal_00063:
      source: waxal
      text: Tʋ iye kʋ ɔdʋ ayava ɔkawa ɛtʋfue nʋ amɛyibɔ Asi nʋ alʋvi adʋ edini kika kakaɣa inyeli nʋ amɛyibɔ
        ayu uti e ava ayɛga sɛ nʋ dzidudu wani ayɛsɛ
      sbs: 0.5956
      gen_sec: 7.51
      ref_sec: 26.8
      cer: 0.1947
      wer: 0.931
    waxal_00064:
      source: waxal
      text: ɛmɛ lɛ ɔbɛli kʋ alʋɛdini zanʋ ɔbɛ ayinʋ, ɛdini kɛ wɛlɛ ɔnʋ, ɛdini bi kɛbʋɛlɛ, ɛvidzɛ tsɔ dini
        bi dʋ atamili, alɛ asii bʋba
      sbs: 0.6611
      gen_sec: 6.66
      ref_sec: 16.29
      cer: 0.1053
      wer: 0.6667
    waxal_00065:
      source: waxal
      text: eti ɔɔkʊ, ablidzo ɛla dʊ ayili, peya, ɔwʊlʊ, dzakalɩ dʊ ayili, eti ɔɔkʊ yɛ abʊɛ amʊ kpanabʊɛ,
        ɛkʊyɛ wanɩbɩ abʊɛ amʊ
      sbs: 0.632
      gen_sec: 2.54
      ref_sec: 17.24
      cer: 0.8427
      wer: 0.9524
    waxal_00066:
      source: waxal
      text: uvi di no ɔse di la ya k'ɛkoɛdi ma n'ili k'ɛkoɛ ma n'iliɛa atani etsoga yi no ɛkò vɛ no ublɔ
        kò ɔsiɛ do ba no t'inetsɛ ɔsiɛ kala k'ewu ɛkoɛdi n'ɛlu k'ado etsue ufa n'ɛmɔ no uwɔ ni k'ewu ɛkò
        bi n'uvò k'ewu ɛkoɛdi ni bi
      sbs: 0.6307
      gen_sec: 11.35
      ref_sec: 22.02
      cer: 0.1384
      wer: 0.8511
    waxal_00067:
      source: waxal
      text: ̈̈̈̈̈namʊ aluvinɩ kɔ kpekpekpe, atanɩ ya nʊ ɩvɩdza, nʊ evidze dɩnɩ kʊ akakpɔ avita, kʊ itsunɩ
        kɔ nʊ ɩvɩdza yɛ ayidu
      sbs: 0.5602
      gen_sec: 1.08
      ref_sec: 16.17
      cer: 0.8851
      wer: 1.0
    waxal_00068:
      source: waxal
      text: Olevi di nu ɔsidi kana ɔlu nu edini Olevi yɛ za uti nu ikpoku wɛ di li Olevi yɛ adu awu vɛ
        nu ava Ɔsi yɛ ya ɛvu ku ɔkazɔli uku Olevi yɛ bi kami ifɔ nu ɛkuɛ di ava
      sbs: 0.6097
      gen_sec: 8.8
      ref_sec: 19.72
      cer: 0.3333
      wer: 0.9
    waxal_00069:
      source: waxal
      text: Alʋ ɛfʋa dìní la ntɛ dʋ ɛdiní di nʋ ɛmɛ Alu ɛfʋa wani atani adu ɛku fʋe kʋ ɛdigbo ya kʋ ɔka
        wa aɣla nʋ ɛku kɔsu iyeyi Ɛdigbo zɛti kʋ atani atɛ ɛku ni nʋ ɛkplɔ di ava Ɛdiní lɛ ɔwɛ
      sbs: 0.5922
      gen_sec: 9.66
      ref_sec: 17.43
      cer: 0.2409
      wer: 0.9286
    waxal_00070:
      source: waxal
      text: ali bɛ bʋakʋ ɛkʋtɛ bɛ dʋ ɛƒɛ, ɛkʋtɛ vi nibi dʋ ɛƒɛ, itsʋ nidʋ aliɛli
      sbs: 0.61
      gen_sec: 3.32
      ref_sec: 17.12
      cer: 0.0577
      wer: 0.7333
    waxal_00071:
      source: waxal
      text: ɛkωɑlɛ ɛɗiniɖilɑɲutɛ kɑlu ɛkuɑlɛɲɛfɛ ɛkplɔ pionodilɛ ƙɑtɑni zɑti ĩmlɑ nu ĩyiɲɑ ɛtufuɛɑlu ɗuɑyili
        lɑku ɛtuwɛɑlubi ɗωɑyili kompitɑni mɑ ɲɛkploɑvɑ ɲɔluɲɔlu ɑyɑlõ ku ɔsiɛɗigbo ɛtuwétsiɛ ɛmliyɛvω
        kɑhésɛdi kɑluoɲéwɑni kɑkɑtωfɑ
      sbs: 0.6648
      gen_sec: 13.05
      ref_sec: 22.24
      cer: 0.3472
      wer: 1.0714
    waxal_00072:
      source: waxal
      text: evidze di ni eku alɛ kò uvi di zati no atami ɛto atɛ iko boa kò atike do ayili no ɛkplɔ ava
        evidze uluvi yɛ azɛ utu tinya di no ala ka kɔsu
      sbs: 0.647
      gen_sec: 7.4
      ref_sec: 26.56
      cer: 0.1776
      wer: 0.8182
    waxal_00073:
      source: waxal
      text: Idi bene alʋ ɛdini Atani zati nʋ atami udunu Ɛfua adzɔ ya nʋ ava nʋ evidze ɔsi la kʋ one wani,
        atani na ozati nʋ uti la anɔvʋ kʋ akɔ ɛdigbo bi nʋ ʋvu ava, kʋ ozati fa nʋ ʋvu ava Atadza kplo
        alɔ
      sbs: 0.6414
      gen_sec: 10.43
      ref_sec: 20.48
      cer: 0.1892
      wer: 0.6818
    waxal_00074:
      source: waxal
      text: ɛƒʋɛdi nʋ ʋgbɛli lantɛ, adi nakɔ na wlia kʋ ivi kɛ ɛdè, ivi blamɛ di la atɛma kʋ iwɔviʋ ni
        kɛ nyʋa, ʋlɛ nʋ giraffe nigya dʋali, itsʋ ɛdigbɔ digbɔ dini ma, yakʋtʋ mʋnʋ ɔvɛ kalʋ kpa nabʋɛ
      sbs: 0.6585
      gen_sec: 10.4
      ref_sec: 24.48
      cer: 0.1049
      wer: 0.7368
    waxal_00075:
      source: waxal
      text: tɛƒʋɛ lɛ alika li, ɔlɛ alika ayi katikpɔ kʋ alʋ gɛdɛɛ kɔnʋ ʋnɛ ɛtʋ kʋ gyikpɔhɔ ɛƒʋyi ɛkʋ wani
        atʋ kɔ nʋ alɛ kʋ ɔwʋ ɛlʋɛlʋ bi atʋ kɔ nʋ alɛ kʋ alʋyiɛkʋ wani dʋ atani agbadɔɛ ayiti, ɛdi yɛli
        ɛdi yɛvʋ ɛkʋ ɛdi adʋ ɔwʋ ɛdibi dʋ ɔwʋɛli kʋ atani gya yɛli
      sbs: 0.6985
      gen_sec: 12.59
      ref_sec: 25.04
      cer: 0.5492
      wer: 0.8113
    waxal_00076:
      source: waxal
      text: ũdza di la nũtɛ ́atania atɛ tũmati sɔo la nũ ũdzaeli ɔssidï ya nũdzaɛli assi ɛfua bi zati
        ayo ɔssi edigbo ewũ dũkũ bua kadũlɔ ɔvɛ nɔ ofué ɛdï adʊ awʊ ɔvɛ
      sbs: 0.6192
      gen_sec: 8.42
      ref_sec: 23.69
      cer: 0.3802
      wer: 0.9062
    waxal_00077:
      source: waxal
      text: ʋvidi yanʋ kpaƒɔ bʋamʋ li, ɛvidzɛ ɛdigbɔ adʋ awʋ ƒʋɛ nʋ aɣa kʋ atilɛ kʋ adʋ ʋti ɔwɛ kʋ adʋ
        ɛlɛ nʋti ɔƒʋɛ, ɛdigbɔ adʋ ɔblɔ nʋ aɣa kʋ adʋ ɔwɛ nʋti, aɣa kɛzi ɔƒʋɛ nʋ ɔblɔ, itɔ dibi dʋ atami
        idʋ
      sbs: 0.6433
      gen_sec: 8.56
      ref_sec: 21.01
      cer: 0.2966
      wer: 1.0
    waxal_00078:
      source: waxal
      text: Ɔlɔdi eku k'atani aɖu yi olukuadka k'ayɔ Ghana yɔɔ ɛdʋk'ɛtu ayʋ ɔvlɛ mía tɔwu nʋ oluku yɛ
        adaka yɛtʋ kʋ sapoponi tsue nʋ adaka yɛ ayava kʋ policini alu oluku yɛ k'atani asɛsɛ
      sbs: 0.5331
      gen_sec: 9.14
      ref_sec: 19.14
      cer: 0.1377
      wer: 0.7879
    waxal_00079:
      source: waxal
      text: õẅũ õƴõ ḍũ ƙatïkpo ălũ mũ mʊ ɛtũẽ alõ ɛwlũ ăžɛ ɛ hẽ ǧanụ katãdjä kéké ƙõnũõ owũvã kũlʊvï dïbĩ
        yañọɔ ʘwʊavã kʊ ʊlụ vị dĩ bị ya kõkakõssũ katịkpọ ayïtchǝdï
      sbs: 0.6248
      gen_sec: 8.54
      ref_sec: 16.09
      cer: 0.6098
      wer: 1.0
    waxal_00080:
      source: waxal
      text: uluvi nu ɔsi du ibuele dza ɔsiɛ kala kamɔ lɛ ewu ɛku fue nu ɔwɛ nu ɔɣlomɔ nu ɛlu adu ɛkufue
        di naɣla adu awu ɔwɛ nu ofue nava kadu ofue nu ɔwɛ nu uti uvie akpɔ ɔtsɛlɛ lɛ
      sbs: 0.6427
      gen_sec: 8.9
      ref_sec: 26.58
      cer: 0.1603
      wer: 0.8974
    waxal_00081:
      source: waxal
      text: ɛtufué dini la tɛ ka ta dza azɛti ni ikpokpo bua ka tɛ ikpokpo néya néya ƙɔnunɔlu zɛti ké
        kpé idu wu tatɛ foɛ ku uglié tu nɛ ɛfoɛ atani ékpé alua ɛmu kɔsu télévichin ɛfoa ɔtu nu ilitsɛ
        ka akakɔsu ka alu ɛdini ya na atamialɔ ka ka yɛsɛ nafă
      sbs: 0.6501
      gen_sec: 13.41
      ref_sec: 23.32
      cer: 0.1799
      wer: 0.8824
    waxal_00082:
      source: waxal
      text: owú kika, adù ɔnu ɔbuɔbu, ayi alɔɛ lɛ ofuele anyamadu ya nu uneɛtu, ɔnuwani ɛdini eɣle ,ɛdini
        atɔlɔ kɔ n'uti,ɛdini tsué nu owuɛ ayɛlu, alù ɛla ya nu owúe aya lɔ, ɛdigbo ezukuti, ɛfua yaʋú
        , ɛdigbo akɔ ɛkɔtɔ, owue ɛdini ke li ,ofue di ya nu ayalɔ , ɔlu ɛmɔ̀ la di bi ya nu ayi itsɛdi
      sbs: 0.6053
      gen_sec: 14.5
      ref_sec: 29.68
      cer: 0.1706
      wer: 0.9286
    waxal_00083:
      source: waxal
      text: Akawa ma ɛsɛ Atanɩ adʋ mʋ sukudini kʋ akawa ma ɛsɛ kʋ kɔmpuita tsue nʋ atamɩalɔ, sapopo bɩ
        tsue nʋ atamɩalɔ kʋ edigbo emli ya ɛvʋ kʋ ɔkebie ɛsɛ sʋ
      sbs: 0.6777
      gen_sec: 2.32
      ref_sec: 15.93
      cer: 0.8879
      wer: 1.0
    waxal_00084:
      source: waxal
      text: 'Alʋɛdìní zɛti nʋ ibʋele dza kʋ akebʋele Ɛdigbo adu awu fʋele ʋwɔ nʋli su yɛ kʋ layɔ aɣla
        imla sʋɛ yɔ zɛ ɛgla ti: ɔkebʋ ɛsɛ Ɔluka dibi zɛti kʋ la kɔ ɛkɔtɔ fʋe nʋ ɛlu'
      sbs: 0.6247
      gen_sec: 9.15
      ref_sec: 19.72
      cer: 0.2812
      wer: 0.9444
    waxal_00085:
      source: waxal
      text: Evidze ni yeli nʋ katikpo ayinʋ kʋ ɛdigbo zati nʋ kɛkɛ ava Ayiyalɛ ʋkpa ɛdigbo kasɛ zu yi
        la dʋ
      sbs: 0.6323
      gen_sec: 4.6
      ref_sec: 17.04
      cer: 0.2237
      wer: 0.7
    waxal_00086:
      source: waxal
      text: Ɛfʋɛdɩ la nʋ tɛ kʋ ɛtʋfue nɩ kɔ nɛvɛ, ɔlɛ ɛfʋ ɣa uneEdigbo, dekǝ dɩ adʋ awʋ uklo awʋ ɔɣlɔmɔ
        ,kʋadʋ bɛtɛtsɔ; kʋ ɛdɩnɩ azɛ atamɩ akpo nɩ ,adʋ gbaka li Ɛdɩɛ kɔya nalonue azɛ ɛzɔkpako naɣla
        kʋ ɔka kɔsʋ ɛsɛ
      sbs: 0.6523
      gen_sec: 10.19
      ref_sec: 21.82
      cer: 0.1603
      wer: 0.7073
    waxal_00087:
      source: waxal
      text: Alʋ bʋ la tsue nʋ tʋ edini yɛ bʋa kʋ alʋ ɛla zati nʋ ɩtsɛdɩ, alʋ ɛfʋa bɩ zati nʋ ɩtsɛdɩ nʋ
        tʋ yawladini yɛ Ɔlɔdɩ edigbo adʋ ofue kʋ edigbo adʋ awʋwɛ bʋa kʋ azati nʋ ikookufue li
      sbs: 0.6442
      gen_sec: 10.02
      ref_sec: 15.2
      cer: 0.2391
      wer: 0.8974
    waxal_00088:
      source: waxal
      text: Ekʊalɛ dza la nʊtɛ Alʊ ekʊalɛ nʊ ɩmadinɩ Kaka gbavɩ alɛ Akaƴa ɩmenʊsɛ nesɛwlenɩ nʊ ʊkɔ ayɩnʊ
        Alʊ ekʊalɛ kpekpeekpe Alʊ ɔsɩ nʊlʊvɩ ekʊalɛ nefʊɛ, kʊ aka gbavɩ alɛ la
      sbs: 0.6417
      gen_sec: 8.47
      ref_sec: 19.46
      cer: 0.2932
      wer: 0.9
    waxal_00089:
      source: waxal
      text: 'Alʋ zati kpekpekpekpekpe edlnidɩ bʋakʋ akasʋ ibuele bʋa kʋ aka zɛvɩwa nʋ tele zva Atanɩ zati
        : ɔsɩ dʋ ayili , uluvi dʋ ayili ; edinie lɛ edini kɩka ! Edinie adulu'
      sbs: 0.617
      gen_sec: 9.16
      ref_sec: 16.72
      cer: 0.315
      wer: 0.8571
    waxal_00090:
      source: waxal
      text: ɛtofue alo akɔ no edini di li ɛdini akɔ ɛkɔtɔ ɔwɛ ɛdini ado awu vɛ ɛdini ado awu kò ulɔ do
        ayili
      sbs: 0.5771
      gen_sec: 4.47
      ref_sec: 17.68
      cer: 0.24
      wer: 0.9545
    waxal_00091:
      source: waxal
      text: Alʋ poo dɩnɩ tsue nʋ ɛvɛ Owu ɛfʋa dɩnɩ ma nʋ ɛkʋtɛ, avakʋtɛ ayuti Alʋ wanɩ tsue nʋ owu wanɩ
        ɛtʋ a, atanɩ akɔ ɛdɩnɩ akɔ ɛkɔtɔvɛ, ɛdɩnɩ akɔ ɛkɔtɔwɛ
      sbs: 0.6567
      gen_sec: 8.43
      ref_sec: 23.4
      cer: 0.2832
      wer: 0.9333
    waxal_00092:
      source: waxal
      text: ʋdʋnʋ dilantɛ, ɛkʋtɛ yanʋ ʋwi nʋ, akɔ ɛkʋtɛ nʋ kankyi, ɛdini ni ɛna ladʋ ayili, aklatɛ nʋɔ
        abidzɔ dini bi dʋ adidʋɛ
      sbs: 0.6059
      gen_sec: 5.89
      ref_sec: 18.96
      cer: 0.2
      wer: 0.8636
    waxal_00093:
      source: waxal
      text: Alʋ ɛdι nι alʋ ɔnʋ nʋ ɔɔ ɛlʋ, kʋ akasɛ sɛ nʋ une,ʋvʋ ne, kʋ aye li nʋ aza dι Aza yɛ mua, ala
        yι nʋ eti kʋ ayɔ uyui la yɔ kɔ ɛkʋtɛ yɛ Evidze yɛ,,ɔsι yɛ bʋa kʋ alʋ ɔnʋ yɛ mʋa,ɔnʋ yɛ lebe,adʋ
        ɔnʋ kayι kʋ, ebe kʋ ɛɛ ɔfʋa ɔvla yɛ nʋ udu ɔka,ɔnʋ yɛ ebe kʋ ayeli nʋ dzʋklɔ si dι tʋ
      sbs: 0.5977
      gen_sec: 15.04
      ref_sec: 21.08
      cer: 0.1667
      wer: 0.806
    waxal_00094:
      source: waxal
      text: Tʋ owue kɔma nʋ ɛvɛ ɔyabevu amɔ dʋ nʋ ayʋ owue lι ayʋɛlʋtɛ abewi ɛfu yi amɔ kʋ ɔlʋyi amɔ yɛ
        adʋ ʋkʋɛ nʋ owue lι kʋ abakutu yi amɔ yɛ kayʋ
      sbs: 0.6419
      gen_sec: 6.49
      ref_sec: 18.08
      cer: 0.2547
      wer: 0.9375
    waxal_00095:
      source: waxal
      text: ɛmɛ bi lɛ ɛfu ɛdi boa kò aka gbɔ ɛga vɛ alo wani k'aka gbɔ ɛga vɛ atani na boɛ amo koraa ɛdi
        bi adu ublɔ ɛdi bi adu ɔwɛ k'ɛdini bi adu ɔvɛ k'akɔ su ɛfɛ ɛdini bi n'adu awu k'ɛfu yɛ k'atɔ yɛ
        ana bò ɛdini bi ka kpɔ alɛ
      sbs: 0.6086
      gen_sec: 11.6
      ref_sec: 17.51
      cer: 0.1456
      wer: 0.9808
    waxal_00096:
      source: waxal
      text: 'Evidze ɛna azǝtɩ nʋ ʋdʋnʋ ɩkpokʋ, kʋ edigb adʋ alɔ nʋ uti Edigbo ekple edigbo zɛ nʋ aɣla
        kʋ ayɔ ɩfɔ dʋ ka onedzǝ nʋ unuku, kʋ ewu ɛlʋ kayi, kʋ bɩdɔŋ dɩ bɩ lɛ nʋ atamɩ ɛtʋ : bɩdɔŋ obe
        edigbo nʋ ɛtɩnya edigbo, kʋ azǝtɩ, kʋ akebʋele nʋ alɛ'
      sbs: 0.6215
      gen_sec: 12.59
      ref_sec: 20.22
      cer: 0.3389
      wer: 0.9
    waxal_00097:
      source: waxal
      text: tʊ alʊwanɩ kʊ ayeli yɛ yaɣa ividza, ay'ɛlutɛ atanɩ alʊ adaka yɛ, asi nʊ aluvi, kʊ ayaɣa ividza
        yɛ kama ɣa ma ɔlʊ yɛ, adaka yɛ ofue, atanɩ ewui uwili ekple nʊ ividza yɛ, kama kʊtʊ ama yi
      sbs: 0.6159
      gen_sec: 10.0
      ref_sec: 20.68
      cer: 0.3617
      wer: 0.9474
    waxal_00098:
      source: waxal
      text: asiwani adudzali kakeyi ɛku ɛlu ɛlu ɛkuɛdini mu abula unoko ananse dzakali nu utani
      sbs: 0.5825
      gen_sec: 4.18
      ref_sec: 17.11
      cer: 0.1429
      wer: 1.0
    waxal_00099:
      source: waxal
      text: Ɛmɛ lɛ azafʋ bʋa kʋ evidze dɩnɩ edigbo adʋ awʋ orɛdze kʋ edigbo adʋ awʋ uti nʋ ava, kʋ ɛdɩ
        bɩ adʋ awʋzi, la kʋ uluvi edigbo fʋa ma nʋ udu kʋ azɛ itsu nʋ aɣla
      sbs: 0.6256
      gen_sec: 7.13
      ref_sec: 17.32
      cer: 0.2583
      wer: 1.0
    waxal_00100:
      source: waxal
      text: Alʋɛdɩnɩ dʋ ɛfʋɛdɩ Ɛdɩ azɛ evidze nʋ aɣla, ɛdɩ bɩ ya, ɛdɩ bɩ ya nʋ ɩtsɛdɩ Ɛdɩ adʋ awʋfue,
        awʋwɛ, ikofue
      sbs: 0.6221
      gen_sec: 6.14
      ref_sec: 21.05
      cer: 0.3544
      wer: 0.9524
    waxal_00101:
      source: waxal
      text: ɛvɛ lɛ ɛƒʋ lʋ ɔwɔlɔwʋ kʋ wazɔnʋ sɔlimɛ, alʋɛdini adʋ awʋgblɔɔ, awʋɛ ayi adava collarɛ lɛ ɔwlɔmʋ,
        alʋ wa kʋ adʋ ɛƒʋɛ mʋa abʋ pɔɔm
      sbs: 0.638
      gen_sec: 7.16
      ref_sec: 20.44
      cer: 0.3069
      wer: 0.96
    waxal_00102:
      source: waxal
      text: Alʊ ɛdɩnɩ dʊ ibɛtɔyɛlɩ kʊ akafʊsʊ klosalo akewele klosalo nɩɩ sika wafɔna zɔyɩ lanʊ galasɩ
        ɛdɩyɛ kalili mɛ amewele kamalɩɛtʊ kama xafa nʊ ʊdzalɩ
      sbs: 0.5752
      gen_sec: 8.22
      ref_sec: 17.15
      cer: 0.2479
      wer: 0.875
    waxal_00103:
      source: waxal
      text: Udunu kikadi la nu tɛ kaka vegele asɛ zɔli ɔlɔdi ku ɔzati nu owue li ku ɔlɔdini kɔ kɛdini
        bi ɔya ku adu aɣla nu akpo ku ɔsidibi ku ashua akpo ku udunu mua ebe ku ɛdibi du imla ku ɛdibi
        du ina
      sbs: 0.636
      gen_sec: 11.17
      ref_sec: 22.96
      cer: 0.1409
      wer: 0.8605
    waxal_00104:
      source: waxal
      text: Ɔsidi lazɛ evidze di nʋ aɣla kʋ ɔka wlɔ kʋ ʋvidí adu adu awu fʋele azɛ kʋ ɔkasɛ zɔli
      sbs: 0.5763
      gen_sec: 3.74
      ref_sec: 16.12
      cer: 0.2424
      wer: 0.9474
    waxal_00105:
      source: waxal
      text: Ʋnyi dini yanʋ ɛmɛ nʋ ɔfʋ ayinʋ kʋ owʋ yanʋ ɛfɛ ɔlʋkʋ owue zati nʋ ayava kakɔ ɛkɔtɔ kʋ ikpokʋni
        kɔnʋ owʋeli kʋ itsʋni kɔ nʋ ɛfɛ ɔbʋ owʋelɛ ɔwɛ
      sbs: 0.6302
      gen_sec: 8.6
      ref_sec: 23.93
      cer: 0.1681
      wer: 0.7333
    waxal_00106:
      source: waxal
      text: ɛʋɛlɛ ʊne owʊaƴɛƒʊsɛ ɩhɩlɩɛ owʊ ɓɩnɩ tsʊe ɛɗɩnɩƙasɛtɩ ƙaɓalɔ ɛɗɩnɩa ƴnamaɗʊ ƙɔtsʊe lanʊtɛ
        owʊƙɩƙa ɗɩnɩɓɩ ƙasɛsɛ nʊ atamɩtsɛɗɩ owʊwanɩ ƙaƙasɛsɛtɩ ƙaɓalʊa atanɩlanʊtɛ tsʊe nʊ ɩhɩlɩɛ nɛƒɛ
      sbs: 0.6249
      gen_sec: 9.3
      ref_sec: 27.55
      cer: 0.434
      wer: 1.0385
    waxal_00107:
      source: waxal
      text: Alʊ ɛdɩnɩ bɩ la nʊ tɛ Atanɩ lɛ ɩmadɩnɩ, ɩmatsɛ alʊadɩnɩ bɩ mʊa bakʊ akɔvlɛ nʊ ʊti nʊ ava mɛ
        ayɔ ɛdɩnɩ wʊ nʊ alɔ Ɔsɩ dɩ ya nʊ analɔ kʊ lewʊ ɔvlɛ nʊ ɛlʊ kʊ ladʊ ɛdɩ, dʊ ɛkʊnɩ nʊ ʊmɔ dʊ ɛkʊnɩ
        nʊ ɛmɔ
      sbs: 0.5494
      gen_sec: 9.13
      ref_sec: 17.39
      cer: 0.8378
      wer: 0.9783
    waxal_00108:
      source: waxal
      text: ɛmɛ lɛ ɛfu ku alɛ alò kɔ no edinie kpe kpe kpe k'ɔluɛ boa kò ɔlɛ ɔlu nue ya aya vu no ɛkplɔɛ
        ayi alɔ ivli ɔwlɔmɔ lɛ no ayɛto k'ɔka ɣa ɛsɛ zɔ no alòwani
      sbs: 0.5815
      gen_sec: 7.15
      ref_sec: 19.5
      cer: 0.2281
      wer: 0.9167
    waxal_00109:
      source: waxal
      text: Unyi du ɛfu yɛ Ivlɔ dini bi du ɛfɛ Etikutɛ di bi du atami idu Ɔbɛ di bi du ɛfu yɛ
      sbs: 0.5919
      gen_sec: 3.96
      ref_sec: 16.05
      cer: 0.0492
      wer: 0.9524
    waxal_00110:
      source: waxal
      text: osi nu ayuʋini ayanu ɛfuyiɛkuda xlẽ kuatani aduɔʋlẽ awuɛdigbo ɔluyiɛkuda xlẽ bi aɖu awuɔƒi
        kuakɔɛkɔtɔ ɔʋẽ
      sbs: 0.6052
      gen_sec: 5.75
      ref_sec: 18.04
      cer: 0.2222
      wer: 1.0
    waxal_00111:
      source: waxal
      text: Alili ɔluka efue inye kaka akpɔ avita kekele imenʋsɛ atani akɔ ɛkʋfue atupa dʋ ɔlʋkpɔ avita
        yɛ nʋ aɣla itsu dufa nʋ aɣla atadza kplo adʋ ufa ɔlɔdini akɔ agbavlɛ kʋ ewʋ ɛkʋfue nʋ ɛlʋ
      sbs: 0.6334
      gen_sec: 8.44
      ref_sec: 24.58
      cer: 0.1837
      wer: 0.9143
    waxal_00112:
      source: waxal
      text: Tɛ bɩ lɛ owu dɩ kʋ atanɩ afɔnayɔwlɩ usi kʋ alʋ aluvi sɔŋ la dʋ owu yɛ li la kʋ namʋ ulluvi
        dɩ nʋ udu yɛ kʋ adʋ awʋvɛ
      sbs: 0.6156
      gen_sec: 5.75
      ref_sec: 16.09
      cer: 0.3864
      wer: 0.8621
    waxal_00113:
      source: waxal
      text: ɛkplɔdi ma kʋ kɔpʋni yadʋ nayava kʋ ɔkʋdini yadʋ kʋ apɛtɔ dini kayɛkʋ ɔlʋɛdi adʋɛkʋ wɛ kʋ
        ɛkʋƒʋedi lɛ nʋ atamiɛtʋ kʋ ɛkʋɛdini sʋa
      sbs: 0.6012
      gen_sec: 7.25
      ref_sec: 16.62
      cer: 0.0472
      wer: 0.4167
    waxal_00114:
      source: waxal
      text: ɛfu ɛdi lantɛ boa kò ava owu la anyama do kò aba ma alo wani kɔ n'ɛfɛ ɛdini adu ɔvɛ ɛdini
        adu ɔwɛ ya du ɛdini adu ɔwlɔmɔ ɛdini adu ofue boa kò ɔku di ni lɛ n'ɛfɛ
      sbs: 0.6366
      gen_sec: 8.46
      ref_sec: 16.86
      cer: 0.2213
      wer: 0.8421
    waxal_00115:
      source: waxal
      text: aluɛdɩnɩ zati kʊ akevu adɩ, aluɛdɩnɩ bɩ zati nʊ atamiɛtʊ kʊ akakɔsʊ alɛnɛ kʊ alʊwanɩ kevu
        adɩ yɛ, edɩnɩ ayʊ awu lɛ ofue, edigbo sʊ bɩ lɛ owɛ kʊ ofue dʊ ayili
      sbs: 0.6453
      gen_sec: 8.6
      ref_sec: 19.08
      cer: 0.2846
      wer: 1.0
    waxal_00116:
      source: waxal
      text: Ɔsɩ ɖɩ ɖʋ aƴʋ eɖinieƆƴaɛvʋ nʋ ɛƙplɔ ɖɩ ɛtʋ,ƙʋ oƙe nƴuǝ ɩɖɩƙaɖɩ aƴʋ ivifʋSɔlɔ nɩ ƙɔ nʋ ɛƙplɔ
        ɖɩ ava nʋ ɛfɛƐɖɩ bɩ ɖʋ aƴʋ iɖu ,ƙ oƙe nƴuǝ ivi fʋɛ
      sbs: 0.6583
      gen_sec: 8.05
      ref_sec: 24.58
      cer: 0.4364
      wer: 0.9677
    waxal_00117:
      source: waxal
      text: Ƙoƙo aƴʋ usi ɖɩ la nʋ tɛƘoƙotsu wanɩ ƴa,ƙoƙotsu wanɩ awʋ tʋ,ƙʋ avlɩ aƴili ɖʋ zɩazɩa;atatʋ
        ɛfʋƴɛ la ƙʋ alʋ atɛ iƙpoƙu ƙʋ alʋnalʋ zati ƙ'atsɩ iƙotu ɖʋalɛ,ƙʋ uluvi eɖigbo ɖɩ bʋa ƙʋ aɖʋ awʋ
        nʋ ʋwɔnʋ ,nʋ atalɛgbɛ wɛ zati, ɛɖɩ ƴaɛvʋ ƙʋ ɔƙa ɣa ɛsɛ nʋ afa nɩɩ n'afa
      sbs: 0.646
      gen_sec: 11.35
      ref_sec: 23.28
      cer: 0.4422
      wer: 0.9216
    waxal_00118:
      source: waxal
      text: Alʋ ɛdigbo di la nʋ tɛ dʋ ɔ edini, ɛfʋyɛkʋ kʋ ɛkʋyɛ kɔ nʋ ɔ ɛkplɔ ava Edigbo zati kʋ ɛfua
        yavʋ Edigbo azɛ ɛkʋnyua di n'aɣla kʋ ɔkaɣɛ ɛsɛ, ɔkazɔ ɛsɛ di nʋ ayiɣalɛ, ayʋ ɛfuaniɛ nʋ edini
        Ayʋ vatsɛ moa, kadigba tʋ nʋ atami ɛlʋalɛ
      sbs: 0.624
      gen_sec: 11.25
      ref_sec: 22.32
      cer: 0.2874
      wer: 0.9787
    waxal_00119:
      source: waxal
      text: Namʋ ɛtʋfue aluɛdini atani abʋ ɛdini asɛti ɛdini akede foto ɛdini bi akɔ ɛkɔtɔ kʋ ɔlɛ ʋgbatawla
        ɛdini bi adʋ awʋwɛ kʋ adʋ patalɔwɛ
      sbs: 0.6771
      gen_sec: 6.82
      ref_sec: 22.51
      cer: 0.1495
      wer: 0.9167
    waxal_00120:
      source: waxal
      text: asii nʋ alʋvi ɛkʋalɛ nʋ ɛdinikikaa kʋ azati nʋ ɛkplɔ ɛtʋ ka srɔ ɛsɛ
      sbs: 0.6072
      gen_sec: 3.35
      ref_sec: 16.96
      cer: 0.2593
      wer: 1.0
    waxal_00121:
      source: waxal
      text: alʋlʋ kɔ bʋakʋ ɔlʋ tɔnʋ alɔ ka ima kayɛsɛ, ɔdɛsiadɛ aƒɔ kɔzɛ ayi ɔgyi
      sbs: 0.6253
      gen_sec: 3.39
      ref_sec: 16.96
      cer: 0.3455
      wer: 0.9286
    waxal_00122:
      source: waxal
      text: Ɛmɛ bɩ lɛ ɛfʋɛ dɩ bʋa kʋ atanɩ afɔnayɛ ɛkʋ Kʋ ɛkʋyɛ ɛlʋ-ɛlʋ la kʋ atanɩ akɔnayɛ la kʋ ɛkplɔ
        yɛ ava mʋa, ɛɛ ɛkʋ bʋ lɛ nʋ ɛkplɔ yɛ ava Yamʋ ɔɣɔkʋnyuǝ ivi, yamʋ ɔɣɔkʋgbɔ, yamʋ ɛga la kʋ yamʋ
        uyui dɩ bɩ nʋ ɛkʋ yɛ ava Ɔlʋ yɛ adʋ awʋ ɔvɛ bʋa kʋ atsɩdʋ blamɛ
      sbs: 0.628
      gen_sec: 13.88
      ref_sec: 28.08
      cer: 0.2565
      wer: 0.9649
    waxal_00123:
      source: waxal
      text: tʊ ɛfʊ yɛ lɛ ɔlɔdɩ ayʊ edini, kʊ ewle edini yɛ dʊ ziăă, kʊ alɛ ikpoku bua kʊ ezati mɛ adɔdʊ,
        kʊ alɛ sundenɩ nʊ ayili, kʊ ɛkʊ kɔsʊ yɛ bɩ ɔtʊ nʊ ugli yɛ, kadegbǝ nɩ bɩ dʊ edini yɛ, kʊ ɛkplɔnɩ
        bɩ lɛ nʊ iili yɛ
      sbs: 0.5906
      gen_sec: 0.53
      ref_sec: 21.0
      cer: 0.9085
      wer: 0.9583
    waxal_00124:
      source: waxal
      text: Ɛmɛ lɛ ɛkutawaa ɛɛdi kuni aluɛdini ku ɛdigbo ɔluɛdigbo ʒa nuu ku aluɛfua liku edigbo kaƶɔlii
        ma ukpi dibi duɛfuɛ ku kokosi yaa nu ɛfuɛ
      sbs: 0.6854
      gen_sec: 7.28
      ref_sec: 18.81
      cer: 0.0727
      wer: 0.76
    waxal_00125:
      source: waxal
      text: afɔ ma ɛkutɛ, ku ata ni adu, oyewu nu uti, ku ayɔ utu yɔzɛ , ku ayɔ pila yɔ kele utu kɔ nu
        ayuti, ɛ kantsi, ivi bi ma nu itsɛdi, pila bi ya nu itsɛdi, ɛkutɛ ni bi abu kpekpekpe li kali
        ɛfuɛ du
      sbs: 0.6471
      gen_sec: 9.75
      ref_sec: 18.2
      cer: 0.1786
      wer: 0.8409
    waxal_00126:
      source: waxal
      text: Iyeye yɛ kawa ɛtʋ fueni ɛla kʋ atani atakata ɛkʋ dunu igli ɛtʋ ɛfʋa yanʋ ikpoku ava ugli ɛtʋ
        edigbo ya ɛvʋ ɛkʋta ɛkʋwani kʋ akayɔ ta ɛkʋ tsue nʋ atupa nili atami bagi ni lɛnʋ atamiɛtʋ
      sbs: 0.6207
      gen_sec: 10.42
      ref_sec: 28.68
      cer: 0.1156
      wer: 0.6757
    waxal_00127:
      source: waxal
      text: Ɛmɛ lɛ ʋwuili kʋ ʋynini ayaa,atalʋ unakʋ owu abaya abamaya n'atamiɛtʋ alʋlʋ ɖʋ owuɛli k'akakɔsuma
        alʋɛɖini akɔ ɛkɔtɔ,ofue', ɛɖini aɖʋ awu ofue' k'akɔ ɛkʋfue ɖʋnʋ ɛlʋ
      sbs: 0.6052
      gen_sec: 10.1
      ref_sec: 27.67
      cer: 0.2576
      wer: 0.9615
    waxal_00128:
      source: waxal
      text: Aalʋɛɖini ekʋalɛ nʋ ɛfuɛɖi kʋ ɛɖini yaa n'atamialɔ k'aɖŋnɔƆlʋɖʋnɔɛ aɖʋ awu ava nʋ uti ɔwuɛ
        kʋ ɔsiɖibi ya kʋ ɔka tsi aɣla ɖʋƐɖinibi aɖʋ awu wuɛ k'azatiAalʋ fueni bi dʋ ayili akʋ Aalʋ wuɛnibi
        dʋ ayili k'atadza k'akatʋ nʋ ʋnɔɛ
      sbs: 0.6412
      gen_sec: 12.73
      ref_sec: 20.89
      cer: 0.3743
      wer: 1.0
    waxal_00129:
      source: waxal
      text: Ɛmɛ lɛ  Ghana ayu ɛfu ɣa use dza la nu ɛvɛ amu ɛkutɛ mamu nuGhana ayu use dza la nu ɛvɛ ɛfudini
        du ɛfɛ laku yamu ivi ku ekele pipe du nayu li ki ivi kefue ɛfuɛ abuɛ amʊ
      sbs: 0.6276
      gen_sec: 9.36
      ref_sec: 25.68
      cer: 0.2946
      wer: 0.8205
    waxal_00130:
      source: waxal
      text: 'Kǝdegbǝ la nʋtɛ kɔ nʋ utikpa n''ɛvɛ: alʋ ka kǝdegbǝwanɩ ya nʋ ayɩlɩ k''aka kɔsʋ alɛnɛ k''ɛ
        ɔlɛ Atadza akɔ ɛkɔtɔ k''aya k''aka n''ɔlʋ nʋ kǝdegbǝwanɩ ɛtʋ :ɔlɛ kǝdegbǝdɩ bʋa k''azɔ nʋ sola'
      sbs: 0.6305
      gen_sec: 9.38
      ref_sec: 18.88
      cer: 0.3577
      wer: 0.697
    waxal_00131:
      source: waxal
      text: Ɛmɛlɛ bi lɛ katikpo di ayʋ inu la nʋ ɛmɛ kʋ alu wle ɛfʋ du, katikpo du yɛ akɔ nʋ ɛfɛ kʋ ewu
        ɛku nʋ ʋnʋku ke ke ke Akɔ ɛkɔtɔ ɔwlɔmɔ ɔfʋe, ɔwlɔmɔ, ɔvɛ nʋ ɛlu nʋ ɛblu nʋ ɛlu
      sbs: 0.6351
      gen_sec: 9.32
      ref_sec: 23.16
      cer: 0.1732
      wer: 0.9756
    waxal_00132:
      source: waxal
      text: Kpolusi ɛlɔ dini yanʋ ɛmɛ alʋvi ɛfʋa nʋ ɔsi edigbo atani azɛ etʋ kʋ akɔ ɛkɔtɔwɛ kʋ ɔlʋyi ɛkʋ
        dawli yanʋ atami idʋ kʋ alʋni yanʋ atami idʋ itsu di manʋ atami idʋ
      sbs: 0.5854
      gen_sec: 8.68
      ref_sec: 22.8
      cer: 0.2266
      wer: 0.8485
    waxal_00133:
      source: waxal
      text: Ɔsidi ozati nu kpokuwɛ Ayiwla du awuwɛ kuesɛlu kɔ Ɛkplɔfue du ayavutsɛ Ɔka nɔlu nu ɛkplɔ yɛ
        ava ku ɛkunyua lɛ ka nu ɛkplɔ ava
      sbs: 0.6519
      gen_sec: 7.17
      ref_sec: 20.28
      cer: 0.099
      wer: 0.72
    waxal_00134:
      source: waxal
      text: Edini k'ayɔ ikpokʋɖi lɔlɛ lakʋ ɛkplɔ bi lɛ,kʋ sɔlɔ lɛnʋ ɛklɔɛ ayiɖʋ kʋ ayɔ ɔvlɛɖi yɔlaɖʋ nʋʋʋyɔlɛ
        nʋ ɛkplɔɛ licolaɛ lɛ ʋgbata wlua ɛkʋ yea ɛlʋɛ ugbatawlua n'ɔfue
      sbs: 0.5241
      gen_sec: 8.37
      ref_sec: 22.35
      cer: 0.1985
      wer: 0.9643
    waxal_00135:
      source: waxal
      text: Talu wani lɛ alu srɔ ιvlι niKʋ ɛfue nu ɛfu srɔ ιvlιtsɛ dι ni yɛ kaba ya nu uneKa akawlɛ ɛsɛ
        duKu ɛdιnι adu awu fueƆlu ɛdigbo ɛwu ɛlu nu ɛdzɔƐdιni ɛtsuku ɛlɔKu akɔ su ɔli yɛ buaku
      sbs: 0.605
      gen_sec: 10.03
      ref_sec: 20.6
      cer: 0.1915
      wer: 1.0
    waxal_00136:
      source: waxal
      text: Ɛʋɛ agaga 'ɛfu, k'ayaba afualɛ k'ayaba Ak'unuku k'ɔtɔ edini akɔ ekɔtɔfue ɛdini akɔ ɛkɔtɔ ʋɛ
        ɛdini akɔ ɔyɔmɔ kɔtɔ, ɛdini adu awu fue nuti k'ayɔ awu wɛ yɔdu Alu z'alu bi fuama n'udu yaba,
        adu atalɛgbɛ 'wɛ ɛdi akɔ adu ɔɔ uti uti wu uti n'aʋa
      sbs: 0.6634
      gen_sec: 13.71
      ref_sec: 19.63
      cer: 0.1278
      wer: 0.7174
    waxal_00137:
      source: waxal
      text: ɛmɛ lɛ alʋ wlɛ ɔwʋ dʋ kʋ atani zati nʋ sɔgbè aɣa, ɛdini adʋ awʋ wɛ kʋ ɛdini adʋ awʋ ɛblɔ kʋ
        akɔ ɛkɔtɔ ƒʋɛ kʋ atani zati kʋ akɛ wlɛ ɛkʋɛdi dʋ nʋ sɔgbèɛ aɣa
      sbs: 0.5944
      gen_sec: 7.6
      ref_sec: 17.96
      cer: 0.2627
      wer: 0.9722
    waxal_00138:
      source: waxal
      text: Ake buele ku tu deka yɛ kayavɛ kakpɔ alu kɔnu udu kaka kɔsu uvie nu inetsedigbo adu awu fue
        ku edzeklo kakɔsu deka di bi yanu udu kakɔsu ɔliɛ kayavɛ
      sbs: 0.6461
      gen_sec: 7.9
      ref_sec: 25.24
      cer: 0.0588
      wer: 0.7
    waxal_00139:
      source: waxal
      text: ɛmɛ lɛ alʋɛdini, asii dini yanʋ ʋsi dili kʋ ɛdini ka mɔ, ɛdini ɛwʋ dʋkʋ nʋ ɛlʋ, ɛdini bi nɛ
        wʋ dʋkʋ nʋ ɛlʋ, asiivi nʋadɛka ni, itsʋ dini bi manʋ ɛƒʋɛ
      sbs: 0.6157
      gen_sec: 1.55
      ref_sec: 17.68
      cer: 0.9115
      wer: 0.9688
    waxal_00140:
      source: waxal
      text: uvi di ama evidze di n'idu k'aye fue no ɛkutɛ di li adi aluia ɛlutɛ ivi atɛma n'atami ɛkutɛ
        yɛ alɔ k'aka sɛ sɛ no ivi yɛ li owu ɛfua bi ma n'ɛkutɛ yɛ ayi alɔ ivi yɛ atɛma no atami udunu
        ayi ɛto dza kplo
      sbs: 0.6661
      gen_sec: 10.94
      ref_sec: 20.12
      cer: 0.1184
      wer: 0.8696
    waxal_00141:
      source: waxal
      text: alo n'ɔlò dini kɔ n'ɛfuedi k'aka n'ɔlò edigbo ka kò eti k'edigbo ya no ayɛto atami nɛna atadza
        kplo ewu ɛkò n'ɛlu ɛdini ado awu fue k'edigbo ado awu wɛ
      sbs: 0.6752
      gen_sec: 8.16
      ref_sec: 16.38
      cer: 0.0696
      wer: 0.6333
    waxal_00142:
      source: waxal
      text: Alʋ poo dɩnɩ la nʋ tɛ kɔ, nʋ etikʋtɛ dɩ alɔ kʋ atanɩ ekpe alɔ nʋ lɛ, ɛdɩnɩ kɔ ɛkɔtɔ, ɛdɩnɩ
        nakɔ ɛkɔtɔ, edigbo adʋ ʋɣɔ nʋ udu, kʋ ɔya kʋ ekpe alɔ nʋ alʋ one wanɩ
      sbs: 0.6479
      gen_sec: 8.47
      ref_sec: 17.39
      cer: 0.1765
      wer: 0.5946
    waxal_00143:
      source: waxal
      text: Atʋnʋ ali bene kʋ ayaxa ali bene Namʋ asidini atʋnʋ atami ali kʋ ayaxa ali bene, kʋ atani
        adʋ awʋwani ivi ɛlʋ ɛlʋ ɛlʋ Kʋ atani yanʋ ɛmɛ
      sbs: 0.6519
      gen_sec: 7.59
      ref_sec: 20.28
      cer: 0.4299
      wer: 0.9643
    waxal_00144:
      source: waxal
      text: Ɔlɔdi la lũ ɔnu yeli n'ɛvɛ, ɔyaba mua mɛ owu di bi yaeli n'ɛfɛ, k'aluɛdini kɔ n'ɛfɛ, aluwani
        kɔ n'ɛfɛ mua ɛdini adu awù fue,k'ɛdi adu ɔvɛ, k'ɛdi adu ɔwlɔmɔ
      sbs: 0.6499
      gen_sec: 7.68
      ref_sec: 17.84
      cer: 0.3421
      wer: 0.9333
    waxal_00145:
      source: waxal
      text: Alʋma ɛkʋtɛ aya Ɛdini azɛ ɔlʋnana, ɛdi bi eya aɣla nʋ inaga, la kʋ ayɔ etidzo la kama avakʋtɛ
        Atani ama kʋ ɛlʋa ɔlɛ nʋ ayɛtʋ Atani ayawla Eti bi tsue nʋ atami alɔ
      sbs: 0.637
      gen_sec: 7.65
      ref_sec: 18.12
      cer: 0.2362
      wer: 0.8824
    waxal_00146:
      source: waxal
      text: Aluɛdini lanutɛ asɛ tulu nu ɔbɛtu azati nu ɔbɛ owuava ɔliɛ aseku ayɔ ɛkuɛdi du nɛmɔ kumu atɔlɔdu
        nu obɛli mɛ kɔma bafa nu ɔbɛ ava adu tsitsi wɛ ɔlukadibi zati ku tabi adu ayɛku buaku atɔlɔ du
        nu obeli kɔma bafa ava lɛ ublɔ
      sbs: 0.6525
      gen_sec: 13.29
      ref_sec: 23.77
      cer: 0.1461
      wer: 0.9333
    waxal_00147:
      source: waxal
      text: Ɛkutɛ kika de boako ɔlɛ ɛfo boa ka atane ɛfɔnaa kɔsu asɛ nɛfɛ Aloɛ poun de aba luɛluɛ Ade
        ado bagi nedu Ɛde ne ado awufue Ɛde neado ɔwɛ Ɛde ne ado ɔvɛ ko ata dza baakɔ nɛvɛ kaka yɛsɛ nalɛAva
        kutɛ de ne ma netsɛdeɛ kɔlɛ ofue
      sbs: 0.6011
      gen_sec: 12.23
      ref_sec: 19.55
      cer: 0.5227
      wer: 0.9167
    waxal_00148:
      source: waxal
      text: Ta asi wani aka du ɛdi Adu ɛdιnι dι kɔ ɛya wɛ du nu ɔɔku ɛdigbo kata dza aka yɛ nu ɔɔku ɛdigboƐkuyɛ
        ata na yi liKɛdi ni ayɔ aɣla yɔtɛ nunuku kɛdini ka mɔƆsi ɛdigbo ayɔ ɔvlɛkwakɔ yɔ tsi yɔ wu ɛlu
        kʋ ɔlɔdi ayɛ lu kɛ dze nu udu
      sbs: 0.5943
      gen_sec: 11.26
      ref_sec: 20.52
      cer: 0.1379
      wer: 0.8235
    waxal_00149:
      source: waxal
      text: aloɛdini ya no ɛvɛ atani abò ponŋ ase do ayili lako aluvi bi do ayili ɛdini ado awu fue ɛdini
        akɔ ɛkɔtɔ ɛdini akɔ ɛkufue do n'atami ɛluɛ ɛdini anyuɛ ala k'aka mo no uvi di k'ado awu fue k'ɔya
        n'atami alɔ
      sbs: 0.6183
      gen_sec: 11.22
      ref_sec: 19.99
      cer: 0.121
      wer: 0.8095
    waxal_00150:
      source: waxal
      text: ase ɛto ewle do ko ake kele ilevle sɛ akpɔ idama no duku yowu no ɛlu k'atani ado ufa no ɛmɔ
        ɔse edigbo ewu ɔwlɔmɔ duku n'ɛlu k'ado ɔwlɔmɔ awu
      sbs: 0.6178
      gen_sec: 7.42
      ref_sec: 21.86
      cer: 0.1193
      wer: 0.8333
    waxal_00151:
      source: waxal
      text: ɛdini kikɑdi lɑnute kɑtania du ikpoku bua kɔle ɑtsayikpoku ku ɛvlɛdi'iduziaa kɑdigbɑ du ɛdinie
      sbs: 0.6199
      gen_sec: 5.4
      ref_sec: 16.21
      cer: 0.2
      wer: 1.0
    waxal_00152:
      source: waxal
      text: Alʋfue wanɩ atsue nʋ ɛfʋɛdɩ kpe-kpe-kpe kʋ atanɩ azɛ atamɩ ɔ ɔ alɩ yɛ ayʋ ɛ flag kʋ ɔ atanɩ
        abʋ, ɔsɩ bɩ uluvi bɩ Ɛdɩnɩ adʋ awʋfue, ɛdɩnɩ adʋ awʋ ʋlɔ ɛlʋ-ɛlʋ kʋ atanɩ ya
      sbs: 0.6768
      gen_sec: 4.66
      ref_sec: 16.83
      cer: 0.9688
      wer: 1.0
    waxal_00153:
      source: waxal
      text: Ɛmɛ lɛ edɩnɩ kʋ kabɔd lɛ nʋ ɩtsɛdɩ kʋ abatɩ ɔlɛ nʋ edɩnɩe ka ɔsɩ nʋ ʋlʋvɩ aza nʋ atamɩ abatɩ
        ava
      sbs: 0.6409
      gen_sec: 5.8
      ref_sec: 20.44
      cer: 0.3333
      wer: 0.8636
    waxal_00154:
      source: waxal
      text: Ali tinya di bʋa kʋ alʋ ɛladi yeli ɔlʋ edigbo azɛ evidzetsɔ ʋlʋvi di nʋ aɣla kʋ edigbo bi
        yanʋ ʋdʋe kʋ azɛ ɛkʋ bʋeledi kʋ ayɔlɛ nʋ ayʋ agbatɛ kʋ eke kʋ kʋ akasɛ layɛ
      sbs: 0.665
      gen_sec: 7.67
      ref_sec: 16.94
      cer: 0.3385
      wer: 0.9444
    waxal_00155:
      source: waxal
      text: Ama ɛkʋtɛ di n'ɛmɛ nʋ eyǝ n'eyǝ, ɔlɛ avakʋtɛni ɛlʋ ɛlʋ Itsu bebeni bi ma nʋ utikpa k'atɛ ma
        bi n'eyǝ n'eyǝ Owʋ dini bi ma nʋ ina netse k'atɛ ma nʋ eyǝ n'eyǝ
      sbs: 0.6162
      gen_sec: 8.2
      ref_sec: 20.8
      cer: 0.1913
      wer: 0.8235
    waxal_00156:
      source: waxal
      text: Alʋka dini lan'tɛ k'akekele kɔnʋ Ɔlʋk'edigbo akɔlʋ k'ɛkʋɛdini tsue n'uti k'ɔkatsi ɛkʋɛdi n'ayava,
        k'ɛdini k'akpɔtsɛ n'udu Ʋgbatawani ma n'udu, k'ɛdini bi k'akɔsʋ ɛva
      sbs: 0.6478
      gen_sec: 8.67
      ref_sec: 19.59
      cer: 0.0781
      wer: 0.6087
    waxal_00157:
      source: waxal
      text: Ɛmɛ lɛ ɛfʋ yɛ bʋa kʋ adɩ alʋɩa, yakʋtʋ mʋ nʋ adɩ alʋɩa paa kʋ akɔs nadɩ nʋ ɛfɛ Olevi edigbo
        dɩ ta af a a ama ɔlɔdɩ ul evidze dɩ nʋ ayidu mʋa, kʋ ɔkayɔ yɩ yɔkpɔtsɩ ivi yɛ
      sbs: 0.6459
      gen_sec: 9.78
      ref_sec: 16.88
      cer: 0.1484
      wer: 0.675
    waxal_00158:
      source: waxal
      text: Ɛtʋfue alʋ kɔ kpe kpe kpe kʋ atani ekple adaka mʋfa nʋ ava adaka yɛ lɛ ɔwʋe ɛkɔtɔ ni kɔ nʋ
        ayava ɛdini azɛ ɛzɔkpako nʋ aɣla ɛdini azɛ ɛmʋzɛlɛko nʋ aɣla kʋ akede itsu di manʋ itsɛdi
      sbs: 0.6337
      gen_sec: 10.37
      ref_sec: 25.44
      cer: 0.1119
      wer: 0.8684
    waxal_00159:
      source: waxal
      text: Ɩma ayʋ alɔtɔnɩ ayʋ ɛsɛ Ɩma yɛ kɔ kpe-kpe-kpe kʋ akakɔsʋ sɔdza wanɩ tɛ azɛ ma ya nʋ kafameli
        mɛ Ayɔ ɛkʋ yɔtɛ ka ma nʋ kafamakʋtʋ gbɔ ʋkpɔ yɛ mɛ Alʋ ɛdɩnɩ ewu ɛkʋ nʋ ɛlʋ, ɛdɩnɩ akatɛ alɔ dʋ
        sɔdza wanɩ nʋ ɩma yɛ li Ɛdɩnɩ aya kpoo anakɔnakatʋ
      sbs: 0.5708
      gen_sec: 12.51
      ref_sec: 23.24
      cer: 0.2742
      wer: 0.902
    waxal_00160:
      source: waxal
      text: Ɛmɛ be alɛde de ne za no edini de ko do no evidze de ne Ata dza za no ikpoku ava ke evidze
        edigbo ya, ɔyavu no ɛkplɔ de ayeto ko evidze de ne za no atane na ne
      sbs: 0.6743
      gen_sec: 7.89
      ref_sec: 19.55
      cer: 0.175
      wer: 0.9487
    waxal_00161:
      source: waxal
      text: Alʋ kpɔ ɔkpɔɣa dʋ alʋ, kʋ wʋ azɔ nʋ polis, ata la kʋ wʋ ka mʋ nʋɛmɛEdigbo atɛ aɣla nʋ awʋ
        la dι, ayili nʋ ɛsɛ dι bʋa kʋ ɔnabʋɛ nʋ okele adzɔ nʋ ɛfʋɛdι, kʋ atanι yaɣa kʋ abaɣa kpɔ ɔkpɔɣa
        dʋ alʋlʋ wanι
      sbs: 0.6321
      gen_sec: 10.54
      ref_sec: 24.81
      cer: 0.2781
      wer: 0.9556
    waxal_00162:
      source: waxal
      text: Ɔsɩ ɛʋʊaɗɩnɩ lanʊtɛ ayanʊ adɗjanɩnʊ nʊ ɛƒʊ ɛɗɩ alɛ ɛtʊ oƒe alʊ eɗɩgɓo ɛtʊwɛ eɗɩgɓo ɛtʊwɛ aƴɔlʊƴɛ
        azɛ ʊgɓɩ nahla aɗʊƴɩ ʊƙʊ oɓe nʊ ɛmɔ ɛtʊƒʊelanɩɛɓɩ azɛ ʊgɓɩ nʊ ahla ƙaɗʊƴɩ ʊƙʊ nʊ ɛmɔ
      sbs: 0.6244
      gen_sec: 6.73
      ref_sec: 25.19
      cer: 0.9459
      wer: 1.0
    waxal_00163:
      source: waxal
      text: alʋ dʋ ʋgya li, ɔsii ɛdigbɔ di kʋ adʋ awʋ vɛ nʋ aɣa nʋ ɔwɛ nʋ ʋti ɔka mlɔ anɛ, anɛ twɛ nʋ
        gblɛgɛdzɛɛ ɔgbatawla li kʋ akɔ mlɔ dʋnʋ gblɛgɛdzɛɛ ɔfʋɛ nʋ ɔwlɔmʋ li,alʋ kɛyi ɛkʋ bɛnɛ dibi nʋ
        ayidʋ, alʋ abʋ nʋ ɔdzali blamɛ
      sbs: 0.6808
      gen_sec: 11.22
      ref_sec: 25.84
      cer: 0.2892
      wer: 0.9565
    waxal_00164:
      source: waxal
      text: Azawla dìní la ntɛ Ikpoku ɛla lɛ nʋ ɛdiní ye Iteno ɔvɛ nʋ ɔfʋe Ɛkplɔ lɛ nʋ ìlí Kabinɛt di
        lɛ kʋ ɛmʋnu kpako ɔyadu nʋ ava kʋ itsu dìní du itsɛdi
      sbs: 0.6125
      gen_sec: 6.74
      ref_sec: 25.36
      cer: 0.1964
      wer: 0.875
    waxal_00165:
      source: waxal
      text: alò ɛdini do owu li ya ɣa une ilefo alɛ ma no owu yɛ li owu yɛ li bi aliɛto alò ɛdini ka n'ɔlu
