      sbs: 0.6513
      gen_sec: 7.99
      ref_sec: 20.88
      cer: 0.1132
      wer: 0.8056
    waxal_00166:
      source: waxal
      text: ɛbʋɛlɛ dza mɛmʋ ayi ɛbʋɛlɛ? aka kpɔ bɔlʋ, anakyɛ ayi bɔlʋ, yamʋ alʋ wani ta adʋ atami awʋ
        wani ɛlʋɛlʋ nʋɛbʋɛlɛ dzaɛ
      sbs: 0.6623
      gen_sec: 6.34
      ref_sec: 16.23
      cer: 0.3846
      wer: 0.8182
    waxal_00167:
      source: waxal
      text: alɛ dɩnɩ ya nʊ ɛfʊɛdɩ asɩ ɛla ewʊ dʊkʊ nʊ ɛlʊ atanɩ azɛ evɩdje ɛplɔ lɛ nʊ atamɩa lɔ kʊ ʊʋɩdɩ
        nʊ ɔsodɩ ya nʊ atamɩalɔ
      sbs: 0.6455
      gen_sec: 7.0
      ref_sec: 16.74
      cer: 0.3516
      wer: 0.9615
    waxal_00168:
      source: waxal
      text: Ɔsɩ nʋ uluvi dɩ Uluvi yɛ zati kʋ ɔsɩ yɛ kakʋ ɛfʋ Bokiti dɩ ya nʋ ɔsɩ yɛ ayɛtʋ Bokiti yɛ ɔlɛ
        blu kʋ wedropu yɛ bɩ ɛkʋɛdɩnɩ dʋ ayili mʋ kɔpʋ
      sbs: 0.6144
      gen_sec: 7.45
      ref_sec: 22.15
      cer: 0.3084
      wer: 0.8438
    waxal_00169:
      source: waxal
      text: ɛmɛ lɛ ɛfu mu ulu li owu atani ya k'aka sɛ zɔli bag no uti uvi di adu awu ɔwlɔmɔ kò ɔsua bag
        no idu k'azɛ bag wɛ n'ala ɛdibi azɛ ɛdi bi ya n'ayi itsɛdi k'azɛ bag ɔwɛ n'ala kò adu awu wɛ ɛdi
        bi ya no ɛmɛ kò adu awu blu k'azɛ bag k'ɛdi bi ama bag n'idu k'ado ɔwɛ
      sbs: 0.6208
      gen_sec: 12.44
      ref_sec: 28.69
      cer: 0.3651
      wer: 0.9516
    waxal_00170:
      source: waxal
      text: owu gbɔ sɩka ma nʋ ɛfʋ gbɔ sɩka kɔ aka gbɔeti dʋ nʋ ɛfʋ kaka wele etie, sɩka wanɩ bɩ dʋ ivie
        li, ivi bɩatɛma nɛ fʋɛ, alʋɛdɩnɩ zati nɛfɛ kadʋ agbadʋ kɩka dɩ áɣuti akakɔsʋ diɛ kadjɔ
      sbs: 0.6306
      gen_sec: 9.84
      ref_sec: 22.19
      cer: 0.1727
      wer: 0.8158
    waxal_00171:
      source: waxal
      text: Alʋ zati nʋ ɛfʋyɛkʋ kɩka Alʋ zati nʋ ɛkplɔ ɛtʋ, ɛdɩnɩ adʋ awʋvɛ, ɛdɩnɩ lɛ ɔlʋwɩnɩ, ɛlʋ efuele
        ka ma Edigbo dɩ ta adʋ awʋ kʋ ayidu yɛ dza tsue Flawanɩ tsue nʋ atamɩalɔ
      sbs: 0.6338
      gen_sec: 9.96
      ref_sec: 17.92
      cer: 0.3615
      wer: 0.9706
    waxal_00172:
      source: waxal
      text: ali di lantɛ, adi kawlia, ɛdini asɛsɛ nʋ iviɛli kʋ atani azɛ kataya kʋ ayɔ kɔdʋ nʋ ɛlʋ, ɛdinibi
        yɛli, ɛdi yɛli, ɛkʋtɛ dini bi ya nʋ aliɛli kʋ ʋnɛ di twɛ
      sbs: 0.5786
      gen_sec: 7.36
      ref_sec: 15.81
      cer: 0.1552
      wer: 0.8125
    waxal_00173:
      source: waxal
      text: Eluviwani ya nʋ owu gbɔtɔ tʋ Ɛdini agb'ɔna kɔ, ɛdi yavʋ k'ayɔ aɣla ɣǝ n'owu yɛ, ɛdini adʋ
        ʋwɔ n'udu, ɛdini yavʋ, sɔfi ma n'eti li
      sbs: 0.6725
      gen_sec: 7.09
      ref_sec: 15.56
      cer: 0.1053
      wer: 0.7308
    waxal_00174:
      source: waxal
      text: Wukamu ɔsi dini nu uluvi dini la ku wuyamu owu bi ɔsi edigbo adu awu ku eŋlo pɔlisi du nu
        awu yɛ ava ayili nu ɔlu yɛ ku akɔna kpɔ ɔkpɔwa du uti yɛ ava ayu aluwani
      sbs: 0.6003
      gen_sec: 8.3
      ref_sec: 24.73
      cer: 0.2143
      wer: 0.8649
    waxal_00175:
      source: waxal
      text: Gana ayʋ asanti yɛ ayʋ ɔwlɩga yɛ nʋ ayʋ adɩ wanɩ Adʋ ɛkʋ nʋ ɛtʋ bʋa kʋ awa ata alɛna yɛ bʋa
        kʋ atanɩ akɔnadʋ ɛkʋ nʋ ɛtʋ, sɩka, akɔ ɔvlɛ, kɛtɛ kʋ adʋ akpla sɩkakʋ wanɩ nʋ ɛtʋ
      sbs: 0.59
      gen_sec: 8.83
      ref_sec: 22.87
      cer: 0.1439
      wer: 0.6667
    waxal_00176:
      source: waxal
      text: Zodope ikpokʋ ni lɛ ɛkplɔ kika lɛ ɛfʋ no ivi ɔkʋ ni lɛ ɛdini yanʋ ava ɛdini lɛnʋ uti ɛkʋfueni
      sbs: 0.6143
      gen_sec: 4.65
      ref_sec: 16.0
      cer: 0.2027
      wer: 0.95
    waxal_00177:
      source: waxal
      text: Asɩnɩ dʊ ʊsɩlɩ ɛdɩnɩ ama emlo nʊ ɩdʊ atanɩ azɛ elʊte nʊ axla ɛdɩnɩ akɔlʊ ka vlɩ ɛdɩbɩ yavʊ
      sbs: 0.5856
      gen_sec: 5.56
      ref_sec: 16.04
      cer: 0.3611
      wer: 0.9474
    waxal_00178:
      source: waxal
      text: tʋ alʋwani aka zɛvi kɔnʋ wa, atani akɔ ɔvlɛ nʋ ɛvi, kʋ ɛdini adʋ ʋƒa nʋ ɛmɔ, atani adʋ agba
        kʋ atani asɛsɛ yaba itdzaɛ, ɔlɛ aza la kʋ aka yɛ, ɔlʋ ɛdigbɔ alʋ ɔkʋdi nʋ ɛlʋ kʋ ɔgbatawla dʋali
      sbs: 0.6417
      gen_sec: 9.33
      ref_sec: 22.16
      cer: 0.5139
      wer: 1.0
    waxal_00179:
      source: waxal
      text: Aka ekele imenu sɛ, ku alukà nu asívì azati, ku emlowa ni akɔ ɔvlɛ k'adu ufa nu agbatɛ, ɛdini
        ewu ɔvlɛ n'ɛlu,k'ɛdini bi ewu ufa n'ɛlu ku akalã nu alukawani alɔ̃
      sbs: 0.6331
      gen_sec: 8.92
      ref_sec: 21.7
      cer: 0.1983
      wer: 0.7742
    waxal_00180:
      source: waxal
      text: Alu ekʊalɛ nɛvɛ kaka wa ɛsɛnalɛ munalɛ ɛfɛla ku ɔsidɩ agbavlɛ ku ewu ɛlu uvidi bi akɔ agbavlɛ
        uluvisu akɔ tsitsɩ ɔsɩdi bi azɛ ɔsɛɣa ko ayitsu kaɣa ɛsɛ zɔnafa mutɛ akayɔ alɛ nu osɩfisɛdza
      sbs: 0.6313
      gen_sec: 10.05
      ref_sec: 25.04
      cer: 0.1974
      wer: 0.8286
    waxal_00181:
      source: waxal
      text: Ɔlɔ ɛdinɛdi awa ɛfuɛ ku atu nawɛsɛkele malɛ kuu aluvi anaduawu katani asa ɔvlɛ nuti kataniaʒɛ
        flag nu ɔlɔ ɛluɛlu mu ɔvɛɛ, okpo, ɔwɛɛ nayadini
      sbs: 0.6182
      gen_sec: 7.31
      ref_sec: 21.6
      cer: 0.1565
      wer: 0.8
    waxal_00182:
      source: waxal
      text: Aalʋviɖini kɔ n'ɛmɛ k'atani k'ekeleAkɔ nʋ kpafo Ɛɖini aɖdʋ awu foe,ɛɖini aɖʋ awu ɔɣlɔmɔ,ɛɖini
        adʋ ugbatawla k'atani kɔ nʋ kpafo
      sbs: 0.6231
      gen_sec: 6.77
      ref_sec: 17.88
      cer: 0.2255
      wer: 0.95
    waxal_00183:
      source: waxal
      text: Ɔbɛ kɩka, itsunɩ dʋ ɩtsɛdɩ-tsɛdɩ ka yɩ kʋ ɛkʋtɛnɩ bɩ dʋ ɩtsɛdɩ-tsɛdɩ yɛ Owu ava ayʋ ɔbɛ wanɩ
        dʋ ayava
      sbs: 0.679
      gen_sec: 4.71
      ref_sec: 17.55
      cer: 0.557
      wer: 0.95
    waxal_00184:
      source: waxal
      text: Ɔlɔdɩnɩ bʋakʋ atani ama ɛkʋtɛIkpokuni, itsuwuni, ŋkpɔnʋ, flawa Flawa wani ale ɔvɛ nʋ ɔɣlɔmɔ
        lakʋ ivu dʋ edini yɛ, ɛkʋ ni dʋ edini yɛ
      sbs: 0.579
      gen_sec: 7.11
      ref_sec: 19.63
      cer: 0.1524
      wer: 0.5
    waxal_00185:
      source: waxal
      text: Alʊɛdi akɔ ɲu idza Ɔtsɛ lɛ ɲatamiaʋtsɛ' kakakpɔ Ediɲi katsi tsudu Ɛdiɲi akɔvlɛ ɲʊ ʊkpoɲʊ Adʊfa
