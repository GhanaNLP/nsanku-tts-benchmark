      sbs: 0.6851
      gen_sec: 12.39
      ref_sec: 16.84
      cer: 0.1359
      wer: 0.75
    waxal_00189:
      source: waxal
      text: Alʋɛdìní la ntɛ Ɛdiní adu ɔwlɔmɔ ayʋ awu Ɛdiní adu ugbatawla Ɛdiní kala kʋ ɛdí bi kasɛsɛ nʋ
        ɛfʋɛ bʋakʋ ɛdigbo kala yɛ
      sbs: 0.5664
      gen_sec: 10.48
      ref_sec: 15.97
      cer: 0.1789
      wer: 0.6522
    waxal_00190:
      source: waxal
      text: Ɛvɛ lɛ ɔbɛ ayʋ ɛtʋ bʋa kʋ alʋ akɔnaba tɛ ulu, kʋ atanɩ ama uyuikʋtɛ dɩnɩ nʋ ɛfɛ, kokosi dɩnɩ
        ma nʋ ɔbɛ yɛ ayʋ ɛtʋ, uyui dɩnɩ bɩ ma nʋ ɔbɛ yɛ ayʋ ɛtʋ, ikpoku kʋ alʋ akɔnavlɛ nʋ ayili yɔtɛ
        ulu bɩ ma nʋ ɔbɛ yɛ ayʋ ɛtʋ
      sbs: 0.7027
      gen_sec: 18.68
      ref_sec: 19.99
      cer: 0.0497
      wer: 0.52
    waxal_00191:
      source: waxal
      text: Ikpɔkʋ di lanʋtɛ kʋ apɛnɔ ɛfʋadini zati kʋ akɛzu ɛdi ewʋ dukufue kʋ asa ɔvlɛvɛ nʋ uti kʋ gaze
        di manʋ atami itsɛdi ɛdi adʋ ɛkʋfue kʋ itukpavɛ yanu atami itsɛdi dʋnʋ utukpawɛ kʋ ɔwlɔ dibi yanʋ
        atami itsɛdi ke
      sbs: 0.661
      gen_sec: 19.12
      ref_sec: 20.89
      cer: 0.119
      wer: 0.9
    waxal_00192:
      source: waxal
      text: alʋvidini kanaɔlʋ atani alʋ NA nɛlʋ udunudidu atamidu NA dibidu ɛfuɛ
      sbs: 0.6023
      gen_sec: 6.84
      ref_sec: 18.61
      cer: 0.1207
      wer: 0.8182
    waxal_00193:
      source: waxal
      text: Akekele braŋdɩ kʋ ɩvʋ kɔbaba ɛfʋɛ nɛfɛ kama Alu ɛna; ɛdɩ adu awuvɛ, ɛdɩ adu awu ugbatawla
        nʋ uti
      sbs: 0.6608
      gen_sec: 9.12
      ref_sec: 15.88
      cer: 0.2105
      wer: 0.7895
    waxal_00194:
      source: waxal
      text: 'Atɛ itsuwʋ dɩnɩ n''ɛmɛ: ɛdɩ lɛ aklǝte, maŋkeni, apʋ, paya n''ɔɔ muti'
      sbs: 0.6622
      gen_sec: 6.2
      ref_sec: 17.88
      cer: 0.2245
      wer: 0.6667
    waxal_00195:
      source: waxal
      text: Edini uli, ikpoku ɛna nɛ kplɔ edigbo no flawapɔtƐkplɔ ava ayɔ kɔpu fue yɔ yia no pɔɛtɛ li
        ko yadu na ava ko ala ɛku do no tsi ke kapɛt
      sbs: 0.6581
      gen_sec: 12.04
      ref_sec: 19.28
      cer: 0.0288
      wer: 0.7333
    waxal_00196:
      source: waxal
      text: alò ɛwlò lantɛ atadza lɛ ɛtufue aba ka gbɔ ivie kama yɔ ma ɔlu atamili ɛfua akɔ ɛkɔtɔ alò
        ɛfua ka gbɔ ɛfu yɛ ɔsi edigbo no uli edigbo bi ya no tantsɛ ka wla ɛsɛ do
      sbs: 0.6682
      gen_sec: 14.98
      ref_sec: 23.04
      cer: 0.0787
      wer: 0.7568
    waxal_00197:
      source: waxal
      text: Ɛvɛ, owʋ di ni ma nʋ ɛvɛ, owʋ wani abʋ Owʋ wani ya nʋ kapɛti di kʋ ɔlɛ ɔvɛ Alʋɛdini bi ya
        nʋ owʋ yɛ ayɛtʋ Ɛdini adʋ awʋ fue kʋ adʋ ɛkɔtɔ
      sbs: 0.6445
      gen_sec: 12.2
      ref_sec: 20.16
      cer: 0.1765
      wer: 0.6667
    waxal_00198:
      source: waxal
      text: Adeka ɛla olevi ɛfua ɔluedigbo lɛ ɔwuɛ ku asiwani bɩ nu ʊlʊvɩ edɩgbo lɛ alʊvɛ ake nyiu ɛkʊɛdɩ
        kakɔsu alɛ nu alɔ
      sbs: 0.68
      gen_sec: 10.64
      ref_sec: 20.5
      cer: 0.1444
      wer: 0.7273
    waxal_00199:
      source: waxal
      text: ɛmɛbilɛ ɛƒʋɛdi bʋakatani aƒʋnevie tɔtsi ka akɔsʋ awɛtʋbia yamʋ ɛkʋtɛ ɛƒʋadini bʋakʋ atani
        NA nʋ gbatawla akɔsʋ ɛkʋtɛ ayalɔnʋa atani akʋ ɛna kika kika lɛ kɛ ƒʋɛ nabʋɛmʋ kran kʋ ʋvidila
        kevie tɔtsiɛ kadʋ awʋ ɔwɛ ka kɔsʋ ayuɛtʋ itsʋ kika alikalima dʋ
      sbs: 0.6569
