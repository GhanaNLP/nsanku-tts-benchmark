      sbs: 0.6902
      gen_sec: 14.41
      ref_sec: 21.7
      cer: 0.0992
      wer: 0.5806
    waxal_00180:
      source: waxal
      text: Alu ekʊalɛ nɛvɛ kaka wa ɛsɛnalɛ munalɛ ɛfɛla ku ɔsidɩ agbavlɛ ku ewu ɛlu uvidi bi akɔ agbavlɛ
        uluvisu akɔ tsitsɩ ɔsɩdi bi azɛ ɔsɛɣa ko ayitsu kaɣa ɛsɛ zɔnafa mutɛ akayɔ alɛ nu osɩfisɛdza
      sbs: 0.7219
      gen_sec: 17.16
      ref_sec: 25.04
      cer: 0.1118
      wer: 0.6571
    waxal_00181:
      source: waxal
      text: Ɔlɔ ɛdinɛdi awa ɛfuɛ ku atu nawɛsɛkele malɛ kuu aluvi anaduawu katani asa ɔvlɛ nuti kataniaʒɛ
        flag nu ɔlɔ ɛluɛlu mu ɔvɛɛ, okpo, ɔwɛɛ nayadini
      sbs: 0.6321
      gen_sec: 13.6
      ref_sec: 21.6
      cer: 0.0696
      wer: 0.76
    waxal_00182:
      source: waxal
      text: Aalʋviɖini kɔ n'ɛmɛ k'atani k'ekeleAkɔ nʋ kpafo Ɛɖini aɖdʋ awu foe,ɛɖini aɖʋ awu ɔɣlɔmɔ,ɛɖini
