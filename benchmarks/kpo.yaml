        ulu bɩ ma nʋ ɔbɛ yɛ ayʋ ɛtʋ
      sbs: 0.6519
      gen_sec: 11.45
      ref_sec: 19.99
      cer: 0.2733
      wer: 0.82
    waxal_00191:
      source: waxal
      text: Ikpɔkʋ di lanʋtɛ kʋ apɛnɔ ɛfʋadini zati kʋ akɛzu ɛdi ewʋ dukufue kʋ asa ɔvlɛvɛ nʋ uti kʋ gaze
        di manʋ atami itsɛdi ɛdi adʋ ɛkʋfue kʋ itukpavɛ yanu atami itsɛdi dʋnʋ utukpawɛ kʋ ɔwlɔ dibi yanʋ
