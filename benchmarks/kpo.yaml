      cer: 0.0758
      wer: 0.5641
    waxal_00176:
      source: waxal
      text: Zodope ikpokʋ ni lɛ ɛkplɔ kika lɛ ɛfʋ no ivi ɔkʋ ni lɛ ɛdini yanʋ ava ɛdini lɛnʋ uti ɛkʋfueni
