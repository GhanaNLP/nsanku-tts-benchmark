      sbs: 0.6071
      gen_sec: 6.83
      ref_sec: 16.38
      cer: 0.3297
      wer: 0.7692
    waxal_00002:
      source: waxal
      text: Alʋ ɛdini ya n'udzali Ɛdi adʋ aɣla n'idu, ɛdi adʋ aɣla nʋ akpɔ Atɛ ɛkʋyɛ nʋ atami alɔ, ɛdi
        zati n'atam'idu kʋ atɛ abidzo dʋ n'atamidu
      sbs: 0.6434
      gen_sec: 6.87
      ref_sec: 16.51
      cer: 0.1287
      wer: 0.7692
    waxal_00003:
      source: waxal
      text: owʋ alɔ kʋ owʋalɔɛ eƒiodu Kʋ alʋme ivʋe abehui ɛfʋɛ kasɛsɛ aba owʋetʋ kama kɔdsu ɛsɛ kadzɔ
        iv owʋe kakɔnaeme ivʋebi ɔyanʋdue kalʋɛdini kɔ kakakɔsʋ nukunu sɛ kadzɔɛ
      sbs: 0.6193
      gen_sec: 9.01
      ref_sec: 25.16
      cer: 0.2574
      wer: 0.8571
    waxal_00004:
      source: waxal
      text: Alʋ ɛdini kana ɔlʋ kʋ ayɔ gagba dini lɛ kʋ ɛkʋti kʋ akana ɔlʋ ɛdini adʋ awʋfue nʋ ava edini
        adʋ awʋvɛ nʋ ava kʋ alʋ ɛdini akɔ ɛkɔmɔtɔ ofue nʋ ava kʋ ekʋ uti kʋ akana ɔlʋ iwui dini bibi dʋ
        atmi ava nʋ ɛfɛ
      sbs: 0.6024
      gen_sec: 10.29
      ref_sec: 17.27
      cer: 0.1076
      wer: 0.5
    waxal_00005:
      source: waxal
      text: Ɛmɛ lɛ ɛfʋɛdɩ kʋ na mʋ asɩ ɛla dɩnɩ akewele ɛkʋRɔba wɛ li la kʋ akewele ɛkʋɛ
      sbs: 0.5487
      gen_sec: 3.93
      ref_sec: 16.74
      cer: 0.2167
      wer: 0.9412
    waxal_00006:
      source: waxal
      text: Edɩnɩ dɩ li la nʋ tɛ kʋ ɛtʋfue alʋ tsʋe Ɔsɩ kʋ ɔdʋ atamɩlɩ yɛ mʋa, ozǝtɩ nʋ uluvi dɩ bʋa kʋ
        adʋ aɣʋ ʋblɔ nʋ uti nʋ ɔwɛ nʋ ava Ɔsɩ yɛ mʋa akɔ tsɩtsɩ kʋ kɔpʋ ɔnʋlɩ dɩ yadʋ nʋ ɛkplɔ yɛ bʋakʋ
        ɔlɛ nʋ ayʋ ɛtʋ ava Uluvi ɛfua emlɩ ya nʋ atamɩlɩ kʋ atanɩ emʋ nʋ ʋwɔ ɣafa nʋ ava
      sbs: 0.6633
      gen_sec: 15.39
      ref_sec: 29.79
      cer: 0.3235
      wer: 0.9844
    waxal_00007:
      source: waxal
      text: Alʋka dini ʋsealʋ dʋ usedza kʋ akamʋ inʋ Ɛdini kɔnʋ ava, ɛdini adʋ ɛkʋvɛ, kʋ adʋ ɛkʋfue yadʋ
        kʋ adʋ ʋblʋ awʋ, ɛkʋwɛ yadʋ kʋ awʋ Kʋ awɛgɛbi azɛ ɛkʋxɛsɛ dʋnʋ ayili kʋ ɔkaxɛsɛ
      sbs: 0.6232
      gen_sec: 8.79
      ref_sec: 24.38
      cer: 0.2647
      wer: 0.8824
    waxal_00008:
      source: waxal
      text: Ɛtʋfue alʋ wani lanʋtɛ kakpɔ ʋtokʋ adʋ awʋ ɔvɛ nʋ ava ɛdigbo ayavɛ kʋ ɔyakpɔ ʋtokʋe adʋ ɔwɛ
        nʋ ʋti kʋ akakpɔ ʋtokʋe atani aya ɛvʋ nʋ ɛmɛ alʋ poo dʋ ʋdʋ kʋ aka kɔsʋ ma nʋ alɛnɛ kʋ akakpɔ
        ʋtokʋe
      sbs: 0.6799
      gen_sec: 10.33
      ref_sec: 24.46
      cer: 0.2368
      wer: 0.9756
    waxal_00009:
      source: waxal
      text: Alɛ ɛku vɛ dunu uti kɔluwui ni di ku ɔyeli nu ayava ku akɔ agbavlɛ adu awu ofue adu ufa nu
        uwɔ kpɔlusi dibi ya nu itsɛdi akɔ ɛkɔtɔ ɔwɛ ku akɔ ɛku du nu unuku
      sbs: 0.6194
      gen_sec: 8.71
      ref_sec: 23.37
      cer: 0.2623
      wer: 0.8333
    waxal_00010:
      source: waxal
      text: Ɛmɛ lɛ ɛfuɛdi alʋ Yovo di keyi ɛkʋ gɛdɛɛ Okeyi kusi ka atani ayɔkele bagi Okeyi ɔ tʋnʋgavi
        nʋ ɔ ɛkʋ gɛdɛɛ nʋ ɛkplɔ ava
      sbs: 0.6558
      gen_sec: 5.5
      ref_sec: 18.61
      cer: 0.2553
      wer: 1.0
    waxal_00011:
      source: waxal
      text: Ɛmloɖini ana aɖʋ ɔbɛli,atani azɛ bokiti n'ahla, atani akɔlu keno Ivieɛɖini azɛ kpolu n'ahla,
        ɛɖi aɖʋ ɛkɔtɔ
      sbs: 0.5758
      gen_sec: 5.53
      ref_sec: 16.21
      cer: 0.2118
      wer: 1.0
    waxal_00012:
      source: waxal
      text: Tʋ kɔdzɩnɩ wa aba suku dɩ li kʋ abakakɔsʋ evidzenɩ kʋ akɔsʋ yɛ bʋa mɛ aka yɛ atike Alʋtɛ ɔlʋkɔsʋ
        ɔ evidze wanɩ dɩ bɩ edigbo evidze nʋ aɣla la kʋ ɛdɩ bɩ zati nʋ ɩtsɛdɩ kʋ ɔkeŋlo ɛkʋ nʋ ɛkplɔ yɛ
        ava kʋ ɔkeŋlo atike ka ma kʋ kabakʋtʋ nyuǝ kʋ ɛtʋ kɔbese ma
      sbs: 0.6505
      gen_sec: 13.34
      ref_sec: 24.28
      cer: 0.2475
      wer: 0.8727
    waxal_00013:
      source: waxal
      text: Ɛvɛ lɛ alu ɔfue sɔŋ la za uti alu ɛfua aza uti nu itsu kika di wu akatulu owu di ma atami
        owu ma nu ayɛtu  Yovo wani bi ɛkplɔ ma nu atamiili Ku ɛkplɔdini atupa nu ɔfidini ma nu ɛkplɔ yɛ
        ava ku ezati katɛ ulu
      sbs: 0.6362
      gen_sec: 11.31
      ref_sec: 16.42
      cer: 0.175
      wer: 0.8511
    waxal_00014:
      source: waxal
      text: Ɔsɩ ɛla dɩnɩ kɔ nʋ ɛmɛ, akɔ nʋ kpafo kʋ akewele ɔɣɔkʋ kʋ edogbo adʋ ɔvlɛawʋ kʋ ewu duku nʋ
        ɛlʋ kʋ ayɔ aɣla yɔyǝdu nʋ ɛlʋ kʋ edigbo awʋwɛ kʋ ewu dukuwɛ kʋ edigbo bɩ kewele kɔpʋ nʋ gagba
        li kʋ atigo lɛ nʋ atamɩɛtʋ nʋ bokiti nʋ rɔba botitinɩ
      sbs: 0.651
      gen_sec: 14.2
      ref_sec: 22.63
      cer: 0.2513
      wer: 0.9804
    waxal_00015:
      source: waxal
      text: Alʋɛdɩnɩ dʋ ɛfʋɛ, ito dʋ atamidu ; apʋ adʋ bagɩ n'atamidu  Sno bɩ otsue n'ɛfʋɛ
      sbs: 0.568
      gen_sec: 3.25
      ref_sec: 16.46
      cer: 0.322
      wer: 0.9286
    waxal_00016:
      source: waxal
      text: Not clear atani adu awu kuaka la Aka la ɔɔ ata mi ala Ɛdini ayɔ ɛwu duku nɛ luKu ata tsi yɔ
        ɛvlɛ yɔ wu nu li
      sbs: 0.6413
      gen_sec: 5.5
      ref_sec: 18.04
      cer: 0.1585
      wer: 0.8889
    waxal_00017:
      source: waxal
      text: Alʋɛdìní la ntɛ kʋ atadza, atani adu awu ɛlu ɛlu ɛlʋ kʋ ɛdigbo adu ugbatawla kʋ azɛ ʋwovi
        'u nʋ aɣla kʋ atani azɛ ɛtu
      sbs: 0.5161
      gen_sec: 6.02
      ref_sec: 16.42
      cer: 0.2418
      wer: 0.92
    waxal_00018:
      source: waxal
      text: Alukpɔ ɛkutɛ dini dʋ ɛfuɛdi kʋ akakpɔ ɛkutɛAtani ama utu ɔnuli ni nʋ ɛfuɛƐdini akemuɣanavaƐdini
        bi yanu itsu diava kʋ akanɔlʋ nɛfuɛ
      sbs: 0.6051
      gen_sec: 7.83
      ref_sec: 18.68
      cer: 0.1
      wer: 0.9091
    waxal_00019:
      source: waxal
      text: Iwo ni tsue nʋ ɔbava nʋ ɔfuta tsɔdi lι Iwowani iwo ɛfua ɔsi edigbo uluvi edigbo kʋ kʋsi ya
        nʋ iwowani ayʋ itsɛdι Ɛdi iwo ɛfuani yɛ ɔsidι dʋ ayʋ iili kʋ lakɔ ɔvlɛ vɛ
      sbs: 0.6336
      gen_sec: 9.1
      ref_sec: 18.64
      cer: 0.2385
      wer: 0.8286
    waxal_00020:
      source: waxal
      text: Amu ɛmɛa alevidini du ʊdzɔli akagbɔ sika alevi wani azɛ kusi naɣla ɛdini ewu ɛkuvɛ nu aɣla
        kalevi efua kakɔsu ɛsɛ adi kalua ayɛlʊtɛ aleviwani azɛ kataya naɣla
      sbs: 0.653
      gen_sec: 9.07
      ref_sec: 22.92
      cer: 0.0763
      wer: 0.7857
    waxal_00021:
      source: waxal
      text: 'Ƒome l''ekualɛ n''ɛvɛ: kʋ osɩɛ zati nʋ owuava kazɛ ay''evidze n''aɣla , k''ɔnyɩɛ bɩ ya n''ayɛtʋ  Atadza
        akɔ ɛkɔtɔ, kayɔ ɔvlɛkɩka dɩ yɔ kɔdʋ nʋ atanɩ ayidue Ukpidɩ ya n''atamɩalɔ ɔkɔlʋ n''atamɩalɔ, kʋ
        owudɩ bɩ ma , k''owudɩ bɩ ma n''atamidu'
      sbs: 0.67
      gen_sec: 12.92
      ref_sec: 25.12
      cer: 0.2197
      wer: 0.8718
    waxal_00022:
      source: waxal
      text: Uvi di bi la ntɛ di yɛ kasɛ ku motoKi tsuwu di bi sua nu motoɛ Kɔ wu di ni bi maƆya nɔɔ ɔma
        nɔɔ itsɛdi ku akɔ ɛkɔtɔƐkɔtɔɛ bua kua kɔ mua ɔlɛ ublɔ, ɔtili su kɔ ya ba
      sbs: 0.6324
      gen_sec: 8.58
      ref_sec: 17.92
      cer: 0.0565
      wer: 0.55
    waxal_00023:
      source: waxal
      text: Ɔsɩ ɔsɩ ofue azɛ ɩbɔtsɔ nʋ aɣla kʋ ɛkʋwɛ dʋ ayili kʋ bodobodo bɩ dʋ plɛtɛ li Kʋ namʋ itsede
        ɔvɛ nʋ ofue bɩ ɛtsue, ɛna nʋ ofue yɛ, ɛfʋa nʋ ɔvɛ yɛ kʋ kɔfɛ ayʋ ʋwʋ bɩ otsue
      sbs: 0.6005
      gen_sec: 9.3
      ref_sec: 23.65
      cer: 0.2558
      wer: 0.8462
    waxal_00024:
      source: waxal
      text: Ɔbɛ kɩka k'atʋ agba nʋ ɔbɛ yɛ ava, k'alʋ asɛsɛ nʋ agba yɛ mʋa ayava alo alʋ ya nʋ agba yɛ
        ava k'owudɩ bɩ mʋa ɔma n'uti
      sbs: 0.6332
      gen_sec: 6.17
      ref_sec: 15.92
      cer: 0.1954
      wer: 0.9259
    waxal_00025:
      source: waxal
      text: awli wani azati nʋ itdza itdza kikaa, awli ɛlʋɛlʋ, ɔwlikataya kika kika, atani akɔ ɔvlɛ ɛlʋɛlʋ,
        akɔ sika kɔtɔ kʋadʋsika ɛkʋ dʋ nʋ ɛmɔ nʋʋƒa ni
      sbs: 0.6361
      gen_sec: 8.68
      ref_sec: 27.26
      cer: 0.1504
      wer: 0.8846
    waxal_00026:
      source: waxal
      text: Ɔsɩ ƴɛ zati nʋ iƙpoƙu li t' aɖʋ awʋ wɛ, t' eƙele ɛlɔNʋ aƴʋ ɛƙplɔ ƴɛ ava mʋa,ƙɔpʋ ɖɩ lɛ ƙʋ
        ivi ɖʋ aƴili,ƙʋ ɔƙa ma ɩfɔ nʋ ɛmʋnʋƙpaƙo ƴɛ
      sbs: 0.6162
      gen_sec: 6.37
      ref_sec: 18.12
      cer: 0.3838
      wer: 0.9667
    waxal_00027:
      source: waxal
      text: evidzedɩ ya nʊ itsɛdɩ, nʊ edini yɛ, ya mʊ ɔgba ɛlʊɛlʊ ɛdɩnɩ dʊ iko li, ɛdɩnɩ lɛ ugbata,
      sbs: 0.6481
      gen_sec: 5.24
      ref_sec: 18.04
      cer: 0.197
      wer: 0.7222
    waxal_00028:
      source: waxal
      text: Ɛmɛbi lɛ kɔndzi, dɔktɛ zati kʋ asɩyɛ bi zati Kʋ ɔke yi ɛsɛyɛ kʋ ɔkazɔfa kʋ ɔbamʋ alɛ ɛsɛlɛ
        lakʋ ɔba kʋtʋ kayi atike Atikeni kɔ ɛkplɔ, ikpokʋ dɔkta adʋ awʋfueƆsiyɛ adʋ awʋ pɩapɩa kʋ azɛ
        bagiwɛ, kʋ ɛkʋni kɔnʋ edinie
      sbs: 0.5448
      gen_sec: 11.87
      ref_sec: 18.08
      cer: 0.0824
      wer: 0.6829
    waxal_00029:
      source: waxal
      text: Ase no aluvi ɔbu de ya kaka zɛvi kɔnu wa Ase wanw ayɔ uwi yɔ kele awu do no uti, ko atame
        ado awuvɛ no ava ko azɛ itsu Uluviwa be nado awu ko atame ado trɔza no uti ko aka zavi kɔnu wa
      sbs: 0.6739
      gen_sec: 10.53
      ref_sec: 21.08
      cer: 0.2
      wer: 0.8636
    waxal_00030:
      source: waxal
      text: ɛmɛ bi lɛ edini k'awi no ofue kò alɛ ɛkò ta ni sɔŋ n'edini yɛ ivu to n'ava k'ɔka lò n'edini
        yɛ ikpoku ma no edini yɛ keka kò sude bi do ayili kpe kpe kò ɛkplɔ ma no udunu li kò ivlitsɛ ya
        du n'ava
      sbs: 0.4953
      gen_sec: 10.23
      ref_sec: 19.99
      cer: 0.1862
      wer: 0.7609
    waxal_00031:
      source: waxal
      text: Aalʋɛɖini lanutɛ aaza nʋ ɔrga kikadi bua kuu ekele lɛ kuu ɔlɔɛɖigbo kakpɔ ɔrganyɛƐɖi azɛ ɔsɛhako
        koka ɖʋ unɔ ɖu n'aili,ku ɔsi ɛtʋfue tsiɖi bi azɛ giŋta koka pɔ
      sbs: 0.6638
      gen_sec: 9.37
      ref_sec: 18.4
      cer: 0.2248
      wer: 0.931
    waxal_00032:
      source: waxal
      text: Ɔsɩ ɛwlʋdɩ akakpɔ ɛwʋnyɛ Alʋɛdɩnɩ bɩ adʋ awʋ ɔvɛ, ɛdɩnɩ adʋ awʋfue, ɛdɩnɩ bɩ adʋ ɔyɔmɔawʋ
        Uvi dɩnɩ bɩ atanɩ nʋ ʋvatsɛ yɛ nʋ ɛfɛ, ata atanɩ adʋ awʋwɛ sɔŋ la kʋ atanɩ dʋ udu yɛ kʋ akakɔsʋ
        ma
      sbs: 0.6607
      gen_sec: 11.22
      ref_sec: 19.79
      cer: 0.2789
      wer: 0.7692
    waxal_00033:
      source: waxal
      text: ʊvɩ dɩ lanʊtɛ dʊ Shatawalɩ nʊ Stobɔyɩ atamɩ ɩlɩ Stobɔyɩ adʊ awʊ ɔwɛ ʊtɩ nava kʊ Shatawalɩ
        bɩ adʊ awʊ ovɛ katʊ tsɩtsɩ ɔwɛ Ʊvɩ dɩ akɔ ɔvlɛ kadʊ awʊ ofʊe nʊtɩ kazɛma nawla katanɩ kasɛmɔ kaka
        wlɛsɛdʊ
      sbs: 0.6204
      gen_sec: 9.87
      ref_sec: 28.73
      cer: 0.3354
      wer: 0.9211
    waxal_00034:
      source: waxal
      text: ɛmɛ lɛ ɛbʋɛlɛ dza kʋ ɛvidzɛ dini kɛ bʋɛlɛ, aka kpɔ ɔtsɛ, ɛdi ka kpɔ ɔtsɛ ɛdi azɛ itsʋ nʋ ala
        ka kpɔ ɔtsɛ kʋ ɛdibi ayɔ ala la katsi nʋ ɔtsɛ aɣa, kʋ alʋɛdini bi zanʋ atami ʋdʋ nʋ ɔtsɛ tʋ
      sbs: 0.6214
      gen_sec: 10.52
      ref_sec: 18.12
      cer: 0.1571
      wer: 0.8095
    waxal_00035:
      source: waxal
      text: Ɔsɩ dɩ aɣa udzǝli kʋ oyevu ɛkʋ Ɔlʋ yɛ keyi ɔlɔkʋ, dzakali nʋ abula nʋ ɛfɛ Mɛ evidze dɩnɩ bɩ
        alʋ ɛkʋ nʋ ɛlʋ kasekpe fa nʋ ʋdza yɛ li Ayɛlʋtɛ ɔsɩyɛ oyevu ɛkʋ yɛa, kʋ ɔlʋyɩɛkʋ yɛ kɛwʋ ɛkʋ yɛ
        ka, evidze wani bɩ abakɔ kʋ aka kɔsʋ ma
      sbs: 0.646
      gen_sec: 10.64
      ref_sec: 22.63
      cer: 0.4057
      wer: 0.98
    waxal_00036:
      source: waxal
      text: Ɛmɛ asɩ kʊ aluvɩ zanʊ ʊtɩkpa kʊ owudɩ ma nʊ atamɩɛtʊ kʊ atanɩ zanʊ ʊtɩ kakɔsʊ ɛkʊ
      sbs: 0.6088
      gen_sec: 4.91
      ref_sec: 17.15
      cer: 0.3538
      wer: 1.0
    waxal_00037:
      source: waxal
      text: alũni dũ ɛvɛ ɛdini adũ awʊ vɛ ɛdini biadũ tsuava atani ka nó ɔbɛvi ɔbɛbi alili ɔbẽ nalɛ ivie
        kũ yakutũ ngũa ɔlɔdini azevi awʊ ɔlɔdini bi adu awũ ga kpokũ ni lɛ nata mietũ ylɔba ni dũ atamietũ
        atani nũ
      sbs: 0.5933
      gen_sec: 1.42
      ref_sec: 21.7
      cer: 0.9125
      wer: 0.9756
    waxal_00038:
      source: waxal
      text: ɛkutɛ kika di ma, ku alulu zati nu ɛkutɛ ayɛtu, ku foŋfoŋm bi tsʋe nu ɛkutɛ ayu itsɛdi, ku
        ukpi bi du ɛfɛ, ɔsi di ama uvi nu idu ku esikuti
      sbs: 0.6271
      gen_sec: 7.18
      ref_sec: 18.94
      cer: 0.1429
      wer: 0.9355
    waxal_00039:
      source: waxal
      text: ɛfu wla ɛsɛ do keka di lantɛ ikpoku lɛ ikpokue efuele ɛfuɛdi avɛ edinie dzakplo lɛ ofue ɛkplɔ
        lɛ no iliɛ k'ivlitsɛ dini lɛ
      sbs: 0.5969
