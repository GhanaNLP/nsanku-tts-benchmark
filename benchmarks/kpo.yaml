      sbs: 0.6887
      gen_sec: 11.8
      ref_sec: 15.56
      cer: 0.0842
      wer: 0.6154
    waxal_00174:
      source: waxal
      text: Wukamu ɔsi dini nu uluvi dini la ku wuyamu owu bi ɔsi edigbo adu awu ku eŋlo pɔlisi du nu
        awu yɛ ava ayili nu ɔlu yɛ ku akɔna kpɔ ɔkpɔwa du uti yɛ ava ayu aluwani
      sbs: 0.617
      gen_sec: 14.3
      ref_sec: 24.73
      cer: 0.0317
      wer: 0.8649
    waxal_00175:
      source: waxal
      text: Gana ayʋ asanti yɛ ayʋ ɔwlɩga yɛ nʋ ayʋ adɩ wanɩ Adʋ ɛkʋ nʋ ɛtʋ bʋa kʋ awa ata alɛna yɛ bʋa
        kʋ atanɩ akɔnadʋ ɛkʋ nʋ ɛtʋ, sɩka, akɔ ɔvlɛ, kɛtɛ kʋ adʋ akpla sɩkakʋ wanɩ nʋ ɛtʋ
      sbs: 0.6536
      gen_sec: 15.38
      ref_sec: 22.87
      cer: 0.053
      wer: 0.4615
    waxal_00176:
      source: waxal
      text: Zodope ikpokʋ ni lɛ ɛkplɔ kika lɛ ɛfʋ no ivi ɔkʋ ni lɛ ɛdini yanʋ ava ɛdini lɛnʋ uti ɛkʋfueni
      sbs: 0.6599
      gen_sec: 7.99
      ref_sec: 16.0
      cer: 0.1622
      wer: 0.85
    waxal_00177:
      source: waxal
      text: Asɩnɩ dʊ ʊsɩlɩ ɛdɩnɩ ama emlo nʊ ɩdʊ atanɩ azɛ elʊte nʊ axla ɛdɩnɩ akɔlʊ ka vlɩ ɛdɩbɩ yavʊ
      sbs: 0.5932
      gen_sec: 8.21
      ref_sec: 16.04
      cer: 0.3611
      wer: 0.9474
    waxal_00178:
      source: waxal
      text: tʋ alʋwani aka zɛvi kɔnʋ wa, atani akɔ ɔvlɛ nʋ ɛvi, kʋ ɛdini adʋ ʋƒa nʋ ɛmɔ, atani adʋ agba
        kʋ atani asɛsɛ yaba itdzaɛ, ɔlɛ aza la kʋ aka yɛ, ɔlʋ ɛdigbɔ alʋ ɔkʋdi nʋ ɛlʋ kʋ ɔgbatawla dʋali
      sbs: 0.6785
      gen_sec: 16.28
      ref_sec: 22.16
      cer: 0.1944
      wer: 0.925
    waxal_00179:
      source: waxal
      text: Aka ekele imenu sɛ, ku alukà nu asívì azati, ku emlowa ni akɔ ɔvlɛ k'adu ufa nu agbatɛ, ɛdini
