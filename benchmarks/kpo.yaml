      sbs: 0.5838
      gen_sec: 16.55
      ref_sec: 25.72
      cer: 0.2617
      wer: 0.8056
    waxal_00188:
      source: waxal
      text: utu owu di ni ya utu owu di ya n'ɛmɛ kò ɛtofue ni di ya no owuɛto k'atani akɔ ɛkɔtɔ ya kò
