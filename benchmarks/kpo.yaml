    waxal_00040:
      source: waxal
      text: Ɛvɛlɛ ɛfu gbɔ galamsi ku atani kewele etie du nu ivi li alevi ɛfuadi ya nu atamitsɛdi ku atani
        azɛ kataya atadza adu awu fue atamitsɛdi bi uwe dini ma nu ɛfɛ
      sbs: 0.6672
      gen_sec: 8.85
      ref_sec: 18.0
      cer: 0.0952
      wer: 0.875
    waxal_00041:
      source: waxal
      text: Tɛfʋɛ lɛ ɛfʋ dɩ bʋakʋ asɛlɛ k' alʋ akɔ naɣa akɔsʋ ɛsɛ dɩ bʋa kadzɔ beli Ɔlɛ ɛkʋtɛ dɩ bʋa kʋ
        ayʋɩ nʋ ofueƐtʋ fue dɩnɩ abɛfʋɛ, katanɩ ya kabe de yeyezɛlɛ; ɛdɩnɩ yavʋ, kɛdɩnɩ bɩ ezikɔlʋAsɩ
        naluvi, ɛdɩnɩ akɔtsɩtsɩ, ɛdɩnɩ adʋ awʋ vɛ,ofue, ɔwɛ ɛdɩnɩ bɩ akɔ ɛkɔtɔ
      sbs: 0.6629
      gen_sec: 15.32
      ref_sec: 26.58
      cer: 0.27
      wer: 0.898
    waxal_00042:
      source: waxal
      text: Evidze dini kebuele nʋ ɔbɛ ayʋ ɛtʋ, akawele ɔkʋ, atadza kɔlʋ ɛdi agbɔ ɔnakɔ kʋ ɔkewele ɛkʋ
        yɛ nʋ ɔbɛ yɛli Ɔkʋwani ɛdi lɛ ɔvɛ, ɛdi lɛ ʋgbatawla, kʋ evidzewani kɔ
      sbs: 0.5412
      gen_sec: 9.11
      ref_sec: 16.42
      cer: 0.1111
      wer: 0.8387
    waxal_00043:
      source: waxal
      text: Ʋdza li kʋ ɛtʋfue alʋɛdɩnɩ aya nʋ ayɛtʋ Ɛdɩ asʋɩa akpo nʋ agbatɛ, akɔ ɛkvɔtɔfue, adʋ bɛtɛku
        Ɛdɩnɩ adʋ awʋnʋ, ɛdɩnɩ adʋ bɛtɛnʋlɩ kʋ ɔlʋka dɩ bɩ ya nʋ
      sbs: 0.6188
      gen_sec: 8.24
      ref_sec: 21.01
      cer: 0.188
      wer: 0.7241
    waxal_00044:
      source: waxal
      text: Tazɛ ɛƙʋ nʋ aɣla,gatsi nɩ lɛ nʋ aƴɛtʋtable nʋ etule nɩ lɛ nʋ aƴɛtʋ nʋ ƴovo tule nɩ
      sbs: 0.5452
      gen_sec: 4.98
      ref_sec: 18.41
      cer: 0.4375
      wer: 0.9444
    waxal_00045:
      source: waxal
      text: Ɛmɛ lɛ edini ,ɛzawla kʋ ɛkplɔ lɛ nʋ ɩɣɩlɩƲgbatawla dʋ ɛkʋɛdɩ ,kɔpʋ dɩ li Ikpoku lɛ nʋ ɩtsɛdɩ
        sʋde dʋ ayili
      sbs: 0.6264
      gen_sec: 6.03
      ref_sec: 21.41
      cer: 0.2024
      wer: 0.8571
    waxal_00046:
      source: waxal
      text: Akagbɔ ɛgamɩ nɔbelɩ Kʊ alʊ ɛfua yavʊ nɩtsenʊ, kalʊɛdɩnɩ akewele nʊ ɔbelɩ Alʊɛdinɩ ewʊ ɛkʊvɛ
        nɛlʊ kadu ɔbelɩ
      sbs: 0.6033
      gen_sec: 5.41
      ref_sec: 21.33
      cer: 0.4719
      wer: 1.0
    waxal_00047:
      source: waxal
      text: Atanɩ ekualɛ nʋ owu ayɛtʋ, alʋwle owu dʋ la ekualɛ nʋ ɛfɛ, kʋ aya nʋ owu ayʋ alɔ
      sbs: 0.6272
      gen_sec: 3.81
      ref_sec: 16.6
      cer: 0.3443
      wer: 0.8889
    waxal_00048:
      source: waxal
      text: tɛlɛ udzali ka ka yu dză mɛ wamu olévi di bua ku ɔlɛ ɛtufué alu ka adu awu ɔwlɔmɔ adu tinétsé
        lɛ ɔwɛ ku éwu ɛku nu unuku kɔké vu ɛku du kusi li
      sbs: 0.6437
      gen_sec: 7.91
      ref_sec: 21.09
      cer: 0.1818
      wer: 0.9412
    waxal_00049:
      source: waxal
      text: Evidze ɛla dɩ ekʋalɛ nʋ ɛfʋ duku dɩ k'akɔ kasʋ ɛsɛ Atanɩ eyua kadegba yɔzɛ kakɔsʋ ɩvlɩ yɛ
        li
      sbs: 0.6497
      gen_sec: 5.14
      ref_sec: 19.0
      cer: 0.3014
      wer: 0.9474
    waxal_00050:
      source: waxal
      text: Ɛkʋtɛdɩ la ma nʋ ɔbɛ ayinu, k'ɔ ɔbɛɛ ayinua , ʋgbatawa bʋa k'adʋ ʋbʋɛsʋ nʋ itsu mua viavanɩ
        nʋ kokosidɩ k'emuava k'ɔya n'ɔbɛɛtʋ kʋ avavlɩtsɛ ekele ɔɔ ʋblʋ ; k'ɛkʋtɛ viavadɩ bɩ ya n'ɛfɛ atsasʋ
      sbs: 0.6482
      gen_sec: 9.64
      ref_sec: 24.1
      cer: 0.2517
      wer: 0.8788
    waxal_00051:
      source: waxal
      text: Alu ŋi ɛmu pípa ɔbu ɔbu Ataŋi abu kʋ akawalɛ aɣla kʋ akamɔ Ɛɖìní aɖu ifɔ ŋu ʋtu Ɛɖìní ɣa ŋu
        uti kʋ akakɔsu ma ŋu ava
      sbs: 0.4865
      gen_sec: 6.92
      ref_sec: 18.29
      cer: 0.2889
      wer: 0.963
    waxal_00052:
      source: waxal
      text: aluɛdɩnɩ kawa ivi nʊ ukulu nʊ ikoli kɔmamɛ, adʊ ɛkʊ nʊ aɣla, kʊ akɔ ɛkɔtɔ bɩ nʊ ɛlu, ukulu
        yɛ amɛ kʊ abuɛ amʊ
      sbs: 0.6784
      gen_sec: 4.53
      ref_sec: 16.76
      cer: 0.8795
      wer: 1.0
    waxal_00053:
      source: waxal
      text: alʊɛdɩnɩ adʊ edini, kʊ uluvi edigbo adʊ awu wɛ, kʊ azɛ ɛkʊ ɣa ɛsɛ dʊ nʊ ayili, kʊ aluɛdɩnɩ
        bɩ ya nʊ ayalɔ, ɛdɩnɩ adʊ awu kʊcawu yɛ kakʊ nuti, ɛdɩnɩ adʊ awu wɛ
      sbs: 0.6056
      gen_sec: 9.14
      ref_sec: 18.36
      cer: 0.3083
      wer: 0.9412
    waxal_00054:
      source: waxal
      text: Ɔwli ga yɛ kasɛmʋ nʋ alili alʋka wani kʋ alevi ɛfua azɛ kataya kʋ edigbo tɔ n'alɔ kʋ edigbo
        bi ya n'ayidu kʋ alʋ onewani emli ya vu k'aka kɔsu ma
      sbs: 0.6624
      gen_sec: 7.69
      ref_sec: 20.81
      cer: 0.1696
      wer: 0.7419
    waxal_00055:
      source: waxal
      text: Ɛmɛ bi lɛ udzali  Ku ɔsi yɛ ewu duku nu ɛlu ku ɔke yi ɛku ku ɔsi bene ku evidze dini kɔ nu
        ayɛtu Evidze edigbo alu ɛku nu ɛlu ku ɔsi di bi ya nu udu nu ɛfɛ ku alu ɛku nu gagba dzakali,
        abula, ɔlɔku Laku ɔlɔku nu ɛku ni kɔ Evidze edigbo kamɔ
      sbs: 0.6011
      gen_sec: 12.6
      ref_sec: 17.92
      cer: 0.1099
      wer: 0.6964
    waxal_00056:
      source: waxal
      text: Ɛkplɔ lɛ dɩ ɛkplɔdɩ lɛ n'ɛmɛ ,al'ɛkʋwɛ dʋ , plɛtɛ fuele ɛfʋa oyǝ n'ayava , biskuit dʋ edigbo
        li ,ɛgawʋnɩ tsue n'ayava  Ɔlɔdɩ zati kenyuǝ ti n'ayɛtʋ
      sbs: 0.6726
      gen_sec: 8.19
      ref_sec: 17.31
      cer: 0.1171
      wer: 0.76
    waxal_00057:
      source: waxal
      text: Ɛvɛ, akana ɔlʋ kʋ ɔlʋna yɛ bʋa kʋ akana yɛ mʋa, atamɩ ɔlʋwɩnɩ yɛ aba kɔyaba kɔsʋ ɔ ɔlʋna yɛ
        bʋa kʋ ɔkana ayɛlʋtɛ, ɛdɩnɩ adʋ ʋɣɔ nʋ udu kʋ ɛdɩnɩ akɔ ɛkɔtɔ ʋblɔ kʋ adʋ awʋ bɩ ʋblɔ kʋ edigbo
        bɩ mʋa, ɔdʋ ɔya nʋ atamɩɛtʋ kʋ ɔta ayʋ awʋ yɛ mʋa, ama mʋ ʋgbatawla kʋ ɔya nʋ atamɩɛtʋ kʋ ɔta
        bɩ akɔ ɛkɔtɔ
      sbs: 0.6251
      gen_sec: 16.2
      ref_sec: 21.01
      cer: 0.1689
      wer: 0.7846
    waxal_00058:
      source: waxal
      text: Gana prezidɛt nʋ alʋ ɛdɩnɩ kadʋalɛ aɣlaAkunfo Adʋ, Gana prezidɛt adʋ kotu Kʋ alʋ one wanɩ
        bɩ adʋ kotu ,kata dza kplo ewu tayKʋ Akunfo Adʋ ekpe alɔ nɔlʋ edigbo kʊ ayɔ aɣla dʋ kayɩ naɣlamɛ
        kʋ ɔka dʋ yɩ aɣla nedini di bʋa kʋ ikpoku nɩ lɛ nʋ edinie
      sbs: 0.6752
      gen_sec: 12.48
      ref_sec: 24.54
      cer: 0.2435
      wer: 0.9
    waxal_00059:
      source: waxal
      text: Ɔse de ado awuwɛ ko ezukuti no udzali koke yi ɛku Azɛ peya nahlaTomantos eme bokiti de li
        kɔdo ayetoPeya wane tsue no ɔku de liAbidzo de be do ayidu
      sbs: 0.6771
      gen_sec: 7.81
      ref_sec: 22.23
      cer: 0.1429
      wer: 1.0
    waxal_00060:
      source: waxal
      text: Alʋ kɔnʋ ɛmɛ agbɔ eti kʋ ɔlɛdi azɛ ɛkʋka eti kʋ afɔvi eti ɛdibi alʋ ɛfʋa adʋ alʋ nʋ uti kʋ
        azɛ ɛkʋɛdi ɛdi adʋ awʋfue kʋ ɛdini bi yanʋ ʋdʋ kʋ adʋ awʋwɛ kʋ adʋ ʋnʋkʋ bɛtɛ kʋ ɛdibi badʋ awʋ
        ɔtili kʋ atabi adʋ ʋnʋkʋgi kʋ uwi kɔnʋ atami idʋ
      sbs: 0.6155
      gen_sec: 13.21
      ref_sec: 29.64
      cer: 0.3641
      wer: 0.9038
    waxal_00061:
      source: waxal
      text: Aƙéɓʊɛlé, ɛƙʊte ɛla ma , aluvɩ ɛla ƙala ƙalu oŋé wanɩ ƙasu ɛsɛ, ɛɖiŋɩ ƙakpɔ ɔtsɛ Ɔlʊ éɖɩɣɓo
        aɖʊ ɔwlɔmɔ awʊ, éɖiɣɓo awu mɛ, éɖiɣbo aɖʊ atalègbɛ ƒoé
      sbs: 0.6606
      gen_sec: 8.84
      ref_sec: 23.12
      cer: 0.7632
      wer: 1.0
    waxal_00062:
      source: waxal
      text: ɔsi yɛ zati nu kɛkɛ ayava nu ello wani ɛfua ayili kewu ɔɣɛdu nukɛke ayidu kʊ alu kusi nu ɛlu
      sbs: 0.6577
      gen_sec: 5.07
      ref_sec: 18.0
      cer: 0.137
      wer: 0.65
    waxal_00063:
      source: waxal
      text: Tʋ iye kʋ ɔdʋ ayava ɔkawa ɛtʋfue nʋ amɛyibɔ Asi nʋ alʋvi adʋ edini kika kakaɣa inyeli nʋ amɛyibɔ
        ayu uti e ava ayɛga sɛ nʋ dzidudu wani ayɛsɛ
      sbs: 0.6157
      gen_sec: 8.13
      ref_sec: 26.8
      cer: 0.2212
      wer: 0.931
    waxal_00064:
      source: waxal
      text: ɛmɛ lɛ ɔbɛli kʋ alʋɛdini zanʋ ɔbɛ ayinʋ, ɛdini kɛ wɛlɛ ɔnʋ, ɛdini bi kɛbʋɛlɛ, ɛvidzɛ tsɔ dini
        bi dʋ atamili, alɛ asii bʋba
      sbs: 0.6508
      gen_sec: 6.24
      ref_sec: 16.29
      cer: 0.1263
      wer: 0.75
    waxal_00065:
      source: waxal
      text: eti ɔɔkʊ, ablidzo ɛla dʊ ayili, peya, ɔwʊlʊ, dzakalɩ dʊ ayili, eti ɔɔkʊ yɛ abʊɛ amʊ kpanabʊɛ,
        ɛkʊyɛ wanɩbɩ abʊɛ amʊ
      sbs: 0.6379
      gen_sec: 6.53
      ref_sec: 17.24
      cer: 0.3933
      wer: 1.0
    waxal_00066:
      source: waxal
      text: uvi di no ɔse di la ya k'ɛkoɛdi ma n'ili k'ɛkoɛ ma n'iliɛa atani etsoga yi no ɛkò vɛ no ublɔ
        kò ɔsiɛ do ba no t'inetsɛ ɔsiɛ kala k'ewu ɛkoɛdi n'ɛlu k'ado etsue ufa n'ɛmɔ no uwɔ ni k'ewu ɛkò
        bi n'uvò k'ewu ɛkoɛdi ni bi
      sbs: 0.6049
      gen_sec: 12.48
      ref_sec: 22.02
      cer: 0.1006
      wer: 0.8936
    waxal_00067:
      source: waxal
      text: ̈̈̈̈̈namʊ aluvinɩ kɔ kpekpekpe, atanɩ ya nʊ ɩvɩdza, nʊ evidze dɩnɩ kʊ akakpɔ avita, kʊ itsunɩ
        kɔ nʊ ɩvɩdza yɛ ayidu
      sbs: 0.5986
      gen_sec: 5.87
      ref_sec: 16.17
      cer: 0.3103
      wer: 0.9048
    waxal_00068:
      source: waxal
      text: Olevi di nu ɔsidi kana ɔlu nu edini Olevi yɛ za uti nu ikpoku wɛ di li Olevi yɛ adu awu vɛ
        nu ava Ɔsi yɛ ya ɛvu ku ɔkazɔli uku Olevi yɛ bi kami ifɔ nu ɛkuɛ di ava
      sbs: 0.6201
      gen_sec: 8.95
      ref_sec: 19.72
      cer: 0.1545
      wer: 0.9
    waxal_00069:
      source: waxal
      text: Alʋ ɛfʋa dìní la ntɛ dʋ ɛdiní di nʋ ɛmɛ Alu ɛfʋa wani atani adu ɛku fʋe kʋ ɛdigbo ya kʋ ɔka
        wa aɣla nʋ ɛku kɔsu iyeyi Ɛdigbo zɛti kʋ atani atɛ ɛku ni nʋ ɛkplɔ di ava Ɛdiní lɛ ɔwɛ
      sbs: 0.5931
      gen_sec: 9.55
      ref_sec: 17.43
      cer: 0.1533
      wer: 0.6429
    waxal_00070:
      source: waxal
      text: ali bɛ bʋakʋ ɛkʋtɛ bɛ dʋ ɛƒɛ, ɛkʋtɛ vi nibi dʋ ɛƒɛ, itsʋ nidʋ aliɛli
      sbs: 0.593
      gen_sec: 3.0
      ref_sec: 17.12
      cer: 0.2115
      wer: 0.9333
    waxal_00071:
      source: waxal
      text: ɛkωɑlɛ ɛɗiniɖilɑɲutɛ kɑlu ɛkuɑlɛɲɛfɛ ɛkplɔ pionodilɛ ƙɑtɑni zɑti ĩmlɑ nu ĩyiɲɑ ɛtufuɛɑlu ɗuɑyili
        lɑku ɛtuwɛɑlubi ɗωɑyili kompitɑni mɑ ɲɛkploɑvɑ ɲɔluɲɔlu ɑyɑlõ ku ɔsiɛɗigbo ɛtuwétsiɛ ɛmliyɛvω
        kɑhésɛdi kɑluoɲéwɑni kɑkɑtωfɑ
      sbs: 0.6458
      gen_sec: 13.2
      ref_sec: 22.24
      cer: 0.3316
      wer: 1.1071
    waxal_00072:
      source: waxal
      text: evidze di ni eku alɛ kò uvi di zati no atami ɛto atɛ iko boa kò atike do ayili no ɛkplɔ ava
        evidze uluvi yɛ azɛ utu tinya di no ala ka kɔsu
      sbs: 0.6713
      gen_sec: 7.6
      ref_sec: 26.56
      cer: 0.215
      wer: 0.8182
    waxal_00073:
      source: waxal
      text: Idi bene alʋ ɛdini Atani zati nʋ atami udunu Ɛfua adzɔ ya nʋ ava nʋ evidze ɔsi la kʋ one wani,
        atani na ozati nʋ uti la anɔvʋ kʋ akɔ ɛdigbo bi nʋ ʋvu ava, kʋ ozati fa nʋ ʋvu ava Atadza kplo
        alɔ
      sbs: 0.6733
      gen_sec: 6.62
      ref_sec: 20.48
      cer: 0.6149
      wer: 0.9545
    waxal_00074:
      source: waxal
      text: ɛƒʋɛdi nʋ ʋgbɛli lantɛ, adi nakɔ na wlia kʋ ivi kɛ ɛdè, ivi blamɛ di la atɛma kʋ iwɔviʋ ni
        kɛ nyʋa, ʋlɛ nʋ giraffe nigya dʋali, itsʋ ɛdigbɔ digbɔ dini ma, yakʋtʋ mʋnʋ ɔvɛ kalʋ kpa nabʋɛ
      sbs: 0.6783
      gen_sec: 9.28
      ref_sec: 24.48
      cer: 0.3427
      wer: 0.7632
    waxal_00075:
      source: waxal
      text: tɛƒʋɛ lɛ alika li, ɔlɛ alika ayi katikpɔ kʋ alʋ gɛdɛɛ kɔnʋ ʋnɛ ɛtʋ kʋ gyikpɔhɔ ɛƒʋyi ɛkʋ wani
        atʋ kɔ nʋ alɛ kʋ ɔwʋ ɛlʋɛlʋ bi atʋ kɔ nʋ alɛ kʋ alʋyiɛkʋ wani dʋ atani agbadɔɛ ayiti, ɛdi yɛli
        ɛdi yɛvʋ ɛkʋ ɛdi adʋ ɔwʋ ɛdibi dʋ ɔwʋɛli kʋ atani gya yɛli
      sbs: 0.6988
      gen_sec: 14.3
      ref_sec: 25.04
      cer: 0.2798
      wer: 0.8491
    waxal_00076:
      source: waxal
      text: ũdza di la nũtɛ ́atania atɛ tũmati sɔo la nũ ũdzaeli ɔssidï ya nũdzaɛli assi ɛfua bi zati
        ayo ɔssi edigbo ewũ dũkũ bua kadũlɔ ɔvɛ nɔ ofué ɛdï adʊ awʊ ɔvɛ
      sbs: 0.6416
      gen_sec: 8.78
      ref_sec: 23.69
      cer: 0.3554
      wer: 0.9375
    waxal_00077:
      source: waxal
      text: ʋvidi yanʋ kpaƒɔ bʋamʋ li, ɛvidzɛ ɛdigbɔ adʋ awʋ ƒʋɛ nʋ aɣa kʋ atilɛ kʋ adʋ ʋti ɔwɛ kʋ adʋ
        ɛlɛ nʋti ɔƒʋɛ, ɛdigbɔ adʋ ɔblɔ nʋ aɣa kʋ adʋ ɔwɛ nʋti, aɣa kɛzi ɔƒʋɛ nʋ ɔblɔ, itɔ dibi dʋ atami
        idʋ
      sbs: 0.6445
      gen_sec: 10.21
      ref_sec: 21.01
      cer: 0.2483
      wer: 1.0
    waxal_00078:
      source: waxal
      text: Ɔlɔdi eku k'atani aɖu yi olukuadka k'ayɔ Ghana yɔɔ ɛdʋk'ɛtu ayʋ ɔvlɛ mía tɔwu nʋ oluku yɛ
        adaka yɛtʋ kʋ sapoponi tsue nʋ adaka yɛ ayava kʋ policini alu oluku yɛ k'atani asɛsɛ
      sbs: 0.5989
      gen_sec: 10.56
      ref_sec: 19.14
      cer: 0.1812
      wer: 0.7879
    waxal_00079:
      source: waxal
      text: õẅũ õƴõ ḍũ ƙatïkpo ălũ mũ mʊ ɛtũẽ alõ ɛwlũ ăžɛ ɛ hẽ ǧanụ katãdjä kéké ƙõnũõ owũvã kũlʊvï dïbĩ
        yañọɔ ʘwʊavã kʊ ʊlụ vị dĩ bị ya kõkakõssũ katịkpọ ayïtchǝdï
      sbs: 0.6213
      gen_sec: 8.49
      ref_sec: 16.09
      cer: 0.5935
      wer: 1.0
    waxal_00080:
      source: waxal
      text: uluvi nu ɔsi du ibuele dza ɔsiɛ kala kamɔ lɛ ewu ɛku fue nu ɔwɛ nu ɔɣlomɔ nu ɛlu adu ɛkufue
        di naɣla adu awu ɔwɛ nu ofue nava kadu ofue nu ɔwɛ nu uti uvie akpɔ ɔtsɛlɛ lɛ
      sbs: 0.6416
      gen_sec: 10.0
      ref_sec: 26.58
      cer: 0.1679
      wer: 0.9231
    waxal_00081:
      source: waxal
      text: ɛtufué dini la tɛ ka ta dza azɛti ni ikpokpo bua ka tɛ ikpokpo néya néya ƙɔnunɔlu zɛti ké
        kpé idu wu tatɛ foɛ ku uglié tu nɛ ɛfoɛ atani ékpé alua ɛmu kɔsu télévichin ɛfoa ɔtu nu ilitsɛ
        ka akakɔsu ka alu ɛdini ya na atamialɔ ka ka yɛsɛ nafă
      sbs: 0.6521
      gen_sec: 13.62
      ref_sec: 23.32
      cer: 0.1905
      wer: 0.902
    waxal_00082:
      source: waxal
      text: owú kika, adù ɔnu ɔbuɔbu, ayi alɔɛ lɛ ofuele anyamadu ya nu uneɛtu, ɔnuwani ɛdini eɣle ,ɛdini
        atɔlɔ kɔ n'uti,ɛdini tsué nu owuɛ ayɛlu, alù ɛla ya nu owúe aya lɔ, ɛdigbo ezukuti, ɛfua yaʋú
        , ɛdigbo akɔ ɛkɔtɔ, owue ɛdini ke li ,ofue di ya nu ayalɔ , ɔlu ɛmɔ̀ la di bi ya nu ayi itsɛdi
      sbs: 0.6066
      gen_sec: 14.37
      ref_sec: 29.68
      cer: 0.1374
      wer: 0.8214
    waxal_00083:
      source: waxal
      text: Akawa ma ɛsɛ Atanɩ adʋ mʋ sukudini kʋ akawa ma ɛsɛ kʋ kɔmpuita tsue nʋ atamɩalɔ, sapopo bɩ
        tsue nʋ atamɩalɔ kʋ edigbo emli ya ɛvʋ kʋ ɔkebie ɛsɛ sʋ
      sbs: 0.6336
      gen_sec: 8.34
      ref_sec: 15.93
      cer: 0.1983
      wer: 0.8667
    waxal_00084:
      source: waxal
      text: 'Alʋɛdìní zɛti nʋ ibʋele dza kʋ akebʋele Ɛdigbo adu awu fʋele ʋwɔ nʋli su yɛ kʋ layɔ aɣla
        imla sʋɛ yɔ zɛ ɛgla ti: ɔkebʋ ɛsɛ Ɔluka dibi zɛti kʋ la kɔ ɛkɔtɔ fʋe nʋ ɛlu'
      sbs: 0.651
      gen_sec: 9.15
      ref_sec: 19.72
      cer: 0.2266
      wer: 0.8889
    waxal_00085:
      source: waxal
      text: Evidze ni yeli nʋ katikpo ayinʋ kʋ ɛdigbo zati nʋ kɛkɛ ava Ayiyalɛ ʋkpa ɛdigbo kasɛ zu yi
        la dʋ
      sbs: 0.6286
      gen_sec: 4.86
      ref_sec: 17.04
      cer: 0.1447
      wer: 0.8
    waxal_00086:
      source: waxal
      text: Ɛfʋɛdɩ la nʋ tɛ kʋ ɛtʋfue nɩ kɔ nɛvɛ, ɔlɛ ɛfʋ ɣa uneEdigbo, dekǝ dɩ adʋ awʋ uklo awʋ ɔɣlɔmɔ
        ,kʋadʋ bɛtɛtsɔ; kʋ ɛdɩnɩ azɛ atamɩ akpo nɩ ,adʋ gbaka li Ɛdɩɛ kɔya nalonue azɛ ɛzɔkpako naɣla
        kʋ ɔka kɔsʋ ɛsɛ
      sbs: 0.6709
      gen_sec: 12.0
      ref_sec: 21.82
      cer: 0.2692
      wer: 0.9756
    waxal_00087:
      source: waxal
      text: Alʋ bʋ la tsue nʋ tʋ edini yɛ bʋa kʋ alʋ ɛla zati nʋ ɩtsɛdɩ, alʋ ɛfʋa bɩ zati nʋ ɩtsɛdɩ nʋ
        tʋ yawladini yɛ Ɔlɔdɩ edigbo adʋ ofue kʋ edigbo adʋ awʋwɛ bʋa kʋ azati nʋ ikookufue li
      sbs: 0.6303
      gen_sec: 9.79
      ref_sec: 15.2
      cer: 0.1667
      wer: 0.7692
    waxal_00088:
      source: waxal
      text: Ekʊalɛ dza la nʊtɛ Alʊ ekʊalɛ nʊ ɩmadinɩ Kaka gbavɩ alɛ Akaƴa ɩmenʊsɛ nesɛwlenɩ nʊ ʊkɔ ayɩnʊ
        Alʊ ekʊalɛ kpekpeekpe Alʊ ɔsɩ nʊlʊvɩ ekʊalɛ nefʊɛ, kʊ aka gbavɩ alɛ la
      sbs: 0.5955
      gen_sec: 9.11
      ref_sec: 19.46
      cer: 0.218
      wer: 1.0
    waxal_00089:
      source: waxal
      text: 'Alʋ zati kpekpekpekpekpe edlnidɩ bʋakʋ akasʋ ibuele bʋa kʋ aka zɛvɩwa nʋ tele zva Atanɩ zati
        : ɔsɩ dʋ ayili , uluvi dʋ ayili ; edinie lɛ edini kɩka ! Edinie adulu'
      sbs: 0.6284
      gen_sec: 9.76
      ref_sec: 16.72
      cer: 0.2835
      wer: 0.9643
    waxal_00090:
      source: waxal
      text: ɛtofue alo akɔ no edini di li ɛdini akɔ ɛkɔtɔ ɔwɛ ɛdini ado awu vɛ ɛdini ado awu kò ulɔ do
        ayili
      sbs: 0.566
      gen_sec: 5.18
      ref_sec: 17.68
      cer: 0.1733
      wer: 0.7727
    waxal_00091:
      source: waxal
      text: Alʋ poo dɩnɩ tsue nʋ ɛvɛ Owu ɛfʋa dɩnɩ ma nʋ ɛkʋtɛ, avakʋtɛ ayuti Alʋ wanɩ tsue nʋ owu wanɩ
        ɛtʋ a, atanɩ akɔ ɛdɩnɩ akɔ ɛkɔtɔvɛ, ɛdɩnɩ akɔ ɛkɔtɔwɛ
      sbs: 0.6489
      gen_sec: 8.72
      ref_sec: 23.4
      cer: 0.4336
      wer: 0.9333
    waxal_00092:
      source: waxal
      text: ʋdʋnʋ dilantɛ, ɛkʋtɛ yanʋ ʋwi nʋ, akɔ ɛkʋtɛ nʋ kankyi, ɛdini ni ɛna ladʋ ayili, aklatɛ nʋɔ
        abidzɔ dini bi dʋ adidʋɛ
      sbs: 0.6435
      gen_sec: 6.58
      ref_sec: 18.96
      cer: 0.2222
      wer: 0.8636
    waxal_00093:
      source: waxal
      text: Alʋ ɛdι nι alʋ ɔnʋ nʋ ɔɔ ɛlʋ, kʋ akasɛ sɛ nʋ une,ʋvʋ ne, kʋ aye li nʋ aza dι Aza yɛ mua, ala
        yι nʋ eti kʋ ayɔ uyui la yɔ kɔ ɛkʋtɛ yɛ Evidze yɛ,,ɔsι yɛ bʋa kʋ alʋ ɔnʋ yɛ mʋa,ɔnʋ yɛ lebe,adʋ
        ɔnʋ kayι kʋ, ebe kʋ ɛɛ ɔfʋa ɔvla yɛ nʋ udu ɔka,ɔnʋ yɛ ebe kʋ ayeli nʋ dzʋklɔ si dι tʋ
      sbs: 0.5957
      gen_sec: 14.12
      ref_sec: 21.08
      cer: 0.197
      wer: 0.7164
    waxal_00094:
      source: waxal
      text: Tʋ owue kɔma nʋ ɛvɛ ɔyabevu amɔ dʋ nʋ ayʋ owue lι ayʋɛlʋtɛ abewi ɛfu yi amɔ kʋ ɔlʋyi amɔ yɛ
        adʋ ʋkʋɛ nʋ owue lι kʋ abakutu yi amɔ yɛ kayʋ
      sbs: 0.6546
      gen_sec: 7.47
      ref_sec: 18.08
      cer: 0.1887
      wer: 0.875
    waxal_00095:
      source: waxal
      text: ɛmɛ bi lɛ ɛfu ɛdi boa kò aka gbɔ ɛga vɛ alo wani k'aka gbɔ ɛga vɛ atani na boɛ amo koraa ɛdi
        bi adu ublɔ ɛdi bi adu ɔwɛ k'ɛdini bi adu ɔvɛ k'akɔ su ɛfɛ ɛdini bi n'adu awu k'ɛfu yɛ k'atɔ yɛ
        ana bò ɛdini bi ka kpɔ alɛ
      sbs: 0.5809
      gen_sec: 11.58
      ref_sec: 17.51
      cer: 0.1962
      wer: 0.8462
    waxal_00096:
      source: waxal
      text: 'Evidze ɛna azǝtɩ nʋ ʋdʋnʋ ɩkpokʋ, kʋ edigb adʋ alɔ nʋ uti Edigbo ekple edigbo zɛ nʋ aɣla
        kʋ ayɔ ɩfɔ dʋ ka onedzǝ nʋ unuku, kʋ ewu ɛlʋ kayi, kʋ bɩdɔŋ dɩ bɩ lɛ nʋ atamɩ ɛtʋ : bɩdɔŋ obe
        edigbo nʋ ɛtɩnya edigbo, kʋ azǝtɩ, kʋ akebʋele nʋ alɛ'
      sbs: 0.6337
      gen_sec: 12.75
      ref_sec: 20.22
      cer: 0.3278
      wer: 0.64
    waxal_00097:
      source: waxal
      text: tʊ alʊwanɩ kʊ ayeli yɛ yaɣa ividza, ay'ɛlutɛ atanɩ alʊ adaka yɛ, asi nʊ aluvi, kʊ ayaɣa ividza
        yɛ kama ɣa ma ɔlʊ yɛ, adaka yɛ ofue, atanɩ ewui uwili ekple nʊ ividza yɛ, kama kʊtʊ ama yi
      sbs: 0.6665
      gen_sec: 9.86
      ref_sec: 20.68
      cer: 0.2766
      wer: 0.8947
    waxal_00098:
      source: waxal
      text: asiwani adudzali kakeyi ɛku ɛlu ɛlu ɛkuɛdini mu abula unoko ananse dzakali nu utani
      sbs: 0.5926
      gen_sec: 4.46
      ref_sec: 17.11
      cer: 0.1286
      wer: 0.8571
    waxal_00099:
      source: waxal
      text: Ɛmɛ lɛ azafʋ bʋa kʋ evidze dɩnɩ edigbo adʋ awʋ orɛdze kʋ edigbo adʋ awʋ uti nʋ ava, kʋ ɛdɩ
        bɩ adʋ awʋzi, la kʋ uluvi edigbo fʋa ma nʋ udu kʋ azɛ itsu nʋ aɣla
      sbs: 0.652
      gen_sec: 8.59
      ref_sec: 17.32
      cer: 0.225
      wer: 1.0
    waxal_00100:
      source: waxal
      text: Alʋɛdɩnɩ dʋ ɛfʋɛdɩ Ɛdɩ azɛ evidze nʋ aɣla, ɛdɩ bɩ ya, ɛdɩ bɩ ya nʋ ɩtsɛdɩ Ɛdɩ adʋ awʋfue,
        awʋwɛ, ikofue
      sbs: 0.6105
      gen_sec: 6.2
      ref_sec: 21.05
      cer: 0.2532
      wer: 0.8095
    waxal_00101:
      source: waxal
      text: ɛvɛ lɛ ɛƒʋ lʋ ɔwɔlɔwʋ kʋ wazɔnʋ sɔlimɛ, alʋɛdini adʋ awʋgblɔɔ, awʋɛ ayi adava collarɛ lɛ ɔwlɔmʋ,
        alʋ wa kʋ adʋ ɛƒʋɛ mʋa abʋ pɔɔm
      sbs: 0.6398
      gen_sec: 6.81
      ref_sec: 20.44
      cer: 0.3663
      wer: 1.0
    waxal_00102:
      source: waxal
      text: Alʊ ɛdɩnɩ dʊ ibɛtɔyɛlɩ kʊ akafʊsʊ klosalo akewele klosalo nɩɩ sika wafɔna zɔyɩ lanʊ galasɩ
        ɛdɩyɛ kalili mɛ amewele kamalɩɛtʊ kama xafa nʊ ʊdzalɩ
      sbs: 0.6266
      gen_sec: 9.08
      ref_sec: 17.15
      cer: 0.2645
      wer: 0.875
    waxal_00103:
      source: waxal
      text: Udunu kikadi la nu tɛ kaka vegele asɛ zɔli ɔlɔdi ku ɔzati nu owue li ku ɔlɔdini kɔ kɛdini
        bi ɔya ku adu aɣla nu akpo ku ɔsidibi ku ashua akpo ku udunu mua ebe ku ɛdibi du imla ku ɛdibi
        du ina
      sbs: 0.6579
      gen_sec: 11.35
      ref_sec: 22.96
      cer: 0.2349
      wer: 0.814
    waxal_00104:
      source: waxal
      text: Ɔsidi lazɛ evidze di nʋ aɣla kʋ ɔka wlɔ kʋ ʋvidí adu adu awu fʋele azɛ kʋ ɔkasɛ zɔli
      sbs: 0.5851
      gen_sec: 4.22
      ref_sec: 16.12
      cer: 0.2273
      wer: 0.9474
    waxal_00105:
      source: waxal
      text: Ʋnyi dini yanʋ ɛmɛ nʋ ɔfʋ ayinʋ kʋ owʋ yanʋ ɛfɛ ɔlʋkʋ owue zati nʋ ayava kakɔ ɛkɔtɔ kʋ ikpokʋni
        kɔnʋ owʋeli kʋ itsʋni kɔ nʋ ɛfɛ ɔbʋ owʋelɛ ɔwɛ
      sbs: 0.6452
      gen_sec: 8.1
      ref_sec: 23.93
      cer: 0.2566
      wer: 0.9
    waxal_00106:
      source: waxal
      text: ɛʋɛlɛ ʊne owʊaƴɛƒʊsɛ ɩhɩlɩɛ owʊ ɓɩnɩ tsʊe ɛɗɩnɩƙasɛtɩ ƙaɓalɔ ɛɗɩnɩa ƴnamaɗʊ ƙɔtsʊe lanʊtɛ
        owʊƙɩƙa ɗɩnɩɓɩ ƙasɛsɛ nʊ atamɩtsɛɗɩ owʊwanɩ ƙaƙasɛsɛtɩ ƙaɓalʊa atanɩlanʊtɛ tsʊe nʊ ɩhɩlɩɛ nɛƒɛ
      sbs: 0.6065
      gen_sec: 9.02
      ref_sec: 27.55
      cer: 0.5786
      wer: 1.0
    waxal_00107:
      source: waxal
      text: Alʊ ɛdɩnɩ bɩ la nʊ tɛ Atanɩ lɛ ɩmadɩnɩ, ɩmatsɛ alʊadɩnɩ bɩ mʊa bakʊ akɔvlɛ nʊ ʊti nʊ ava mɛ
        ayɔ ɛdɩnɩ wʊ nʊ alɔ Ɔsɩ dɩ ya nʊ analɔ kʊ lewʊ ɔvlɛ nʊ ɛlʊ kʊ ladʊ ɛdɩ, dʊ ɛkʊnɩ nʊ ʊmɔ dʊ ɛkʊnɩ
        nʊ ɛmɔ
      sbs: 0.6078
      gen_sec: 2.44
      ref_sec: 17.39
      cer: 0.8649
      wer: 1.0
    waxal_00108:
      source: waxal
      text: ɛmɛ lɛ ɛfu ku alɛ alò kɔ no edinie kpe kpe kpe k'ɔluɛ boa kò ɔlɛ ɔlu nue ya aya vu no ɛkplɔɛ
        ayi alɔ ivli ɔwlɔmɔ lɛ no ayɛto k'ɔka ɣa ɛsɛ zɔ no alòwani
      sbs: 0.5913
      gen_sec: 7.21
      ref_sec: 19.5
      cer: 0.2105
      wer: 0.9722
    waxal_00109:
      source: waxal
      text: Unyi du ɛfu yɛ Ivlɔ dini bi du ɛfɛ Etikutɛ di bi du atami idu Ɔbɛ di bi du ɛfu yɛ
      sbs: 0.597
      gen_sec: 3.52
      ref_sec: 16.05
      cer: 0.1475
      wer: 1.0
    waxal_00110:
      source: waxal
      text: osi nu ayuʋini ayanu ɛfuyiɛkuda xlẽ kuatani aduɔʋlẽ awuɛdigbo ɔluyiɛkuda xlẽ bi aɖu awuɔƒi
        kuakɔɛkɔtɔ ɔʋẽ
      sbs: 0.5951
      gen_sec: 5.33
      ref_sec: 18.04
      cer: 0.2778
      wer: 1.0
    waxal_00111:
      source: waxal
      text: Alili ɔluka efue inye kaka akpɔ avita kekele imenʋsɛ atani akɔ ɛkʋfue atupa dʋ ɔlʋkpɔ avita
        yɛ nʋ aɣla itsu dufa nʋ aɣla atadza kplo adʋ ufa ɔlɔdini akɔ agbavlɛ kʋ ewʋ ɛkʋfue nʋ ɛlʋ
      sbs: 0.6787
      gen_sec: 10.54
      ref_sec: 24.58
      cer: 0.1497
      wer: 0.8286
    waxal_00112:
      source: waxal
      text: Tɛ bɩ lɛ owu dɩ kʋ atanɩ afɔnayɔwlɩ usi kʋ alʋ aluvi sɔŋ la dʋ owu yɛ li la kʋ namʋ ulluvi
        dɩ nʋ udu yɛ kʋ adʋ awʋvɛ
      sbs: 0.6307
      gen_sec: 5.35
      ref_sec: 16.09
      cer: 0.2386
      wer: 0.9655
    waxal_00113:
      source: waxal
      text: ɛkplɔdi ma kʋ kɔpʋni yadʋ nayava kʋ ɔkʋdini yadʋ kʋ apɛtɔ dini kayɛkʋ ɔlʋɛdi adʋɛkʋ wɛ kʋ
        ɛkʋƒʋedi lɛ nʋ atamiɛtʋ kʋ ɛkʋɛdini sʋa
      sbs: 0.6302
      gen_sec: 6.57
      ref_sec: 16.62
      cer: 0.283
      wer: 0.9583
    waxal_00114:
      source: waxal
      text: ɛfu ɛdi lantɛ boa kò ava owu la anyama do kò aba ma alo wani kɔ n'ɛfɛ ɛdini adu ɔvɛ ɛdini
        adu ɔwɛ ya du ɛdini adu ɔwlɔmɔ ɛdini adu ofue boa kò ɔku di ni lɛ n'ɛfɛ
      sbs: 0.6211
      gen_sec: 9.02
      ref_sec: 16.86
      cer: 0.1311
      wer: 0.7632
    waxal_00115:
      source: waxal
      text: aluɛdɩnɩ zati kʊ akevu adɩ, aluɛdɩnɩ bɩ zati nʊ atamiɛtʊ kʊ akakɔsʊ alɛnɛ kʊ alʊwanɩ kevu
        adɩ yɛ, edɩnɩ ayʊ awu lɛ ofue, edigbo sʊ bɩ lɛ owɛ kʊ ofue dʊ ayili
      sbs: 0.6234
      gen_sec: 8.37
      ref_sec: 19.08
      cer: 0.3089
      wer: 0.9062
    waxal_00116:
      source: waxal
      text: Ɔsɩ ɖɩ ɖʋ aƴʋ eɖinieƆƴaɛvʋ nʋ ɛƙplɔ ɖɩ ɛtʋ,ƙʋ oƙe nƴuǝ ɩɖɩƙaɖɩ aƴʋ ivifʋSɔlɔ nɩ ƙɔ nʋ ɛƙplɔ
        ɖɩ ava nʋ ɛfɛƐɖɩ bɩ ɖʋ aƴʋ iɖu ,ƙ oƙe nƴuǝ ivi fʋɛ
      sbs: 0.6386
      gen_sec: 8.13
      ref_sec: 24.58
      cer: 0.4182
      wer: 0.9032
    waxal_00117:
      source: waxal
      text: Ƙoƙo aƴʋ usi ɖɩ la nʋ tɛƘoƙotsu wanɩ ƴa,ƙoƙotsu wanɩ awʋ tʋ,ƙʋ avlɩ aƴili ɖʋ zɩazɩa;atatʋ
        ɛfʋƴɛ la ƙʋ alʋ atɛ iƙpoƙu ƙʋ alʋnalʋ zati ƙ'atsɩ iƙotu ɖʋalɛ,ƙʋ uluvi eɖigbo ɖɩ bʋa ƙʋ aɖʋ awʋ
        nʋ ʋwɔnʋ ,nʋ atalɛgbɛ wɛ zati, ɛɖɩ ƴaɛvʋ ƙʋ ɔƙa ɣa ɛsɛ nʋ afa nɩɩ n'afa
      sbs: 0.6451
      gen_sec: 14.1
      ref_sec: 23.28
      cer: 0.397
      wer: 0.9804
    waxal_00118:
      source: waxal
      text: Alʋ ɛdigbo di la nʋ tɛ dʋ ɔ edini, ɛfʋyɛkʋ kʋ ɛkʋyɛ kɔ nʋ ɔ ɛkplɔ ava Edigbo zati kʋ ɛfua
        yavʋ Edigbo azɛ ɛkʋnyua di n'aɣla kʋ ɔkaɣɛ ɛsɛ, ɔkazɔ ɛsɛ di nʋ ayiɣalɛ, ayʋ ɛfuaniɛ nʋ edini
        Ayʋ vatsɛ moa, kadigba tʋ nʋ atami ɛlʋalɛ
      sbs: 0.61
      gen_sec: 11.89
      ref_sec: 22.32
      cer: 0.2241
      wer: 0.8723
    waxal_00119:
      source: waxal
      text: Namʋ ɛtʋfue aluɛdini atani abʋ ɛdini asɛti ɛdini akede foto ɛdini bi akɔ ɛkɔtɔ kʋ ɔlɛ ʋgbatawla
        ɛdini bi adʋ awʋwɛ kʋ adʋ patalɔwɛ
      sbs: 0.6537
      gen_sec: 7.7
      ref_sec: 22.51
      cer: 0.1776
      wer: 0.9583
    waxal_00120:
      source: waxal
      text: asii nʋ alʋvi ɛkʋalɛ nʋ ɛdinikikaa kʋ azati nʋ ɛkplɔ ɛtʋ ka srɔ ɛsɛ
      sbs: 0.603
      gen_sec: 3.16
      ref_sec: 16.96
      cer: 0.1852
      wer: 1.0
    waxal_00121:
      source: waxal
      text: alʋlʋ kɔ bʋakʋ ɔlʋ tɔnʋ alɔ ka ima kayɛsɛ, ɔdɛsiadɛ aƒɔ kɔzɛ ayi ɔgyi
      sbs: 0.61
      gen_sec: 3.67
      ref_sec: 16.96
      cer: 0.2909
      wer: 0.9286
    waxal_00122:
      source: waxal
      text: Ɛmɛ bɩ lɛ ɛfʋɛ dɩ bʋa kʋ atanɩ afɔnayɛ ɛkʋ Kʋ ɛkʋyɛ ɛlʋ-ɛlʋ la kʋ atanɩ akɔnayɛ la kʋ ɛkplɔ
        yɛ ava mʋa, ɛɛ ɛkʋ bʋ lɛ nʋ ɛkplɔ yɛ ava Yamʋ ɔɣɔkʋnyuǝ ivi, yamʋ ɔɣɔkʋgbɔ, yamʋ ɛga la kʋ yamʋ
        uyui dɩ bɩ nʋ ɛkʋ yɛ ava Ɔlʋ yɛ adʋ awʋ ɔvɛ bʋa kʋ atsɩdʋ blamɛ
      sbs: 0.615
      gen_sec: 13.4
      ref_sec: 28.08
      cer: 0.2984
      wer: 0.8772
    waxal_00123:
      source: waxal
      text: tʊ ɛfʊ yɛ lɛ ɔlɔdɩ ayʊ edini, kʊ ewle edini yɛ dʊ ziăă, kʊ alɛ ikpoku bua kʊ ezati mɛ adɔdʊ,
        kʊ alɛ sundenɩ nʊ ayili, kʊ ɛkʊ kɔsʊ yɛ bɩ ɔtʊ nʊ ugli yɛ, kadegbǝ nɩ bɩ dʊ edini yɛ, kʊ ɛkplɔnɩ
        bɩ lɛ nʊ iili yɛ
      sbs: 0.6567
      gen_sec: 1.07
      ref_sec: 21.0
      cer: 0.9673
      wer: 1.0
    waxal_00124:
      source: waxal
      text: Ɛmɛ lɛ ɛkutawaa ɛɛdi kuni aluɛdini ku ɛdigbo ɔluɛdigbo ʒa nuu ku aluɛfua liku edigbo kaƶɔlii
        ma ukpi dibi duɛfuɛ ku kokosi yaa nu ɛfuɛ
      sbs: 0.6861
      gen_sec: 6.94
      ref_sec: 18.81
      cer: 0.1091
      wer: 0.88
    waxal_00125:
      source: waxal
      text: afɔ ma ɛkutɛ, ku ata ni adu, oyewu nu uti, ku ayɔ utu yɔzɛ , ku ayɔ pila yɔ kele utu kɔ nu
        ayuti, ɛ kantsi, ivi bi ma nu itsɛdi, pila bi ya nu itsɛdi, ɛkutɛ ni bi abu kpekpekpe li kali
        ɛfuɛ du
      sbs: 0.6655
      gen_sec: 10.25
      ref_sec: 18.2
      cer: 0.2357
      wer: 0.7955
    waxal_00126:
      source: waxal
      text: Iyeye yɛ kawa ɛtʋ fueni ɛla kʋ atani atakata ɛkʋ dunu igli ɛtʋ ɛfʋa yanʋ ikpoku ava ugli ɛtʋ
        edigbo ya ɛvʋ ɛkʋta ɛkʋwani kʋ akayɔ ta ɛkʋ tsue nʋ atupa nili atami bagi ni lɛnʋ atamiɛtʋ
      sbs: 0.6126
      gen_sec: 10.33
      ref_sec: 28.68
      cer: 0.102
      wer: 0.6486
    waxal_00127:
      source: waxal
      text: Ɛmɛ lɛ ʋwuili kʋ ʋynini ayaa,atalʋ unakʋ owu abaya abamaya n'atamiɛtʋ alʋlʋ ɖʋ owuɛli k'akakɔsuma
        alʋɛɖini akɔ ɛkɔtɔ,ofue', ɛɖini aɖʋ awu ofue' k'akɔ ɛkʋfue ɖʋnʋ ɛlʋ
      sbs: 0.5905
      gen_sec: 8.74
      ref_sec: 27.67
      cer: 0.2424
      wer: 1.0385
    waxal_00128:
      source: waxal
      text: Aalʋɛɖini ekʋalɛ nʋ ɛfuɛɖi kʋ ɛɖini yaa n'atamialɔ k'aɖŋnɔƆlʋɖʋnɔɛ aɖʋ awu ava nʋ uti ɔwuɛ
        kʋ ɔsiɖibi ya kʋ ɔka tsi aɣla ɖʋƐɖinibi aɖʋ awu wuɛ k'azatiAalʋ fueni bi dʋ ayili akʋ Aalʋ wuɛnibi
        dʋ ayili k'atadza k'akatʋ nʋ ʋnɔɛ
      sbs: 0.643
      gen_sec: 12.78
      ref_sec: 20.89
      cer: 0.2011
      wer: 0.875
    waxal_00129:
      source: waxal
      text: Ɛmɛ lɛ  Ghana ayu ɛfu ɣa use dza la nu ɛvɛ amu ɛkutɛ mamu nuGhana ayu use dza la nu ɛvɛ ɛfudini
        du ɛfɛ laku yamu ivi ku ekele pipe du nayu li ki ivi kefue ɛfuɛ abuɛ amʊ
      sbs: 0.6261
      gen_sec: 9.36
      ref_sec: 25.68
      cer: 0.186
      wer: 0.7436
    waxal_00130:
      source: waxal
      text: 'Kǝdegbǝ la nʋtɛ kɔ nʋ utikpa n''ɛvɛ: alʋ ka kǝdegbǝwanɩ ya nʋ ayɩlɩ k''aka kɔsʋ alɛnɛ k''ɛ
        ɔlɛ Atadza akɔ ɛkɔtɔ k''aya k''aka n''ɔlʋ nʋ kǝdegbǝwanɩ ɛtʋ :ɔlɛ kǝdegbǝdɩ bʋa k''azɔ nʋ sola'
      sbs: 0.6644
      gen_sec: 10.0
      ref_sec: 18.88
      cer: 0.2044
      wer: 0.8182
    waxal_00131:
      source: waxal
      text: Ɛmɛlɛ bi lɛ katikpo di ayʋ inu la nʋ ɛmɛ kʋ alu wle ɛfʋ du, katikpo du yɛ akɔ nʋ ɛfɛ kʋ ewu
        ɛku nʋ ʋnʋku ke ke ke Akɔ ɛkɔtɔ ɔwlɔmɔ ɔfʋe, ɔwlɔmɔ, ɔvɛ nʋ ɛlu nʋ ɛblu nʋ ɛlu
      sbs: 0.6495
      gen_sec: 9.87
      ref_sec: 23.16
      cer: 0.2126
      wer: 0.8293
    waxal_00132:
      source: waxal
      text: Kpolusi ɛlɔ dini yanʋ ɛmɛ alʋvi ɛfʋa nʋ ɔsi edigbo atani azɛ etʋ kʋ akɔ ɛkɔtɔwɛ kʋ ɔlʋyi ɛkʋ
        dawli yanʋ atami idʋ kʋ alʋni yanʋ atami idʋ itsu di manʋ atami idʋ
      sbs: 0.5744
      gen_sec: 9.4
      ref_sec: 22.8
      cer: 0.0938
      wer: 0.4545
    waxal_00133:
      source: waxal
      text: Ɔsidi ozati nu kpokuwɛ Ayiwla du awuwɛ kuesɛlu kɔ Ɛkplɔfue du ayavutsɛ Ɔka nɔlu nu ɛkplɔ yɛ
        ava ku ɛkunyua lɛ ka nu ɛkplɔ ava
      sbs: 0.6402
      gen_sec: 6.5
      ref_sec: 20.28
      cer: 0.1287
      wer: 0.88
    waxal_00134:
      source: waxal
      text: Edini k'ayɔ ikpokʋɖi lɔlɛ lakʋ ɛkplɔ bi lɛ,kʋ sɔlɔ lɛnʋ ɛklɔɛ ayiɖʋ kʋ ayɔ ɔvlɛɖi yɔlaɖʋ nʋʋʋyɔlɛ
        nʋ ɛkplɔɛ licolaɛ lɛ ʋgbata wlua ɛkʋ yea ɛlʋɛ ugbatawlua n'ɔfue
      sbs: 0.5594
      gen_sec: 9.46
      ref_sec: 22.35
      cer: 0.2595
      wer: 0.8571
    waxal_00135:
      source: waxal
      text: Talu wani lɛ alu srɔ ιvlι niKʋ ɛfue nu ɛfu srɔ ιvlιtsɛ dι ni yɛ kaba ya nu uneKa akawlɛ ɛsɛ
        duKu ɛdιnι adu awu fueƆlu ɛdigbo ɛwu ɛlu nu ɛdzɔƐdιni ɛtsuku ɛlɔKu akɔ su ɔli yɛ buaku
      sbs: 0.6204
      gen_sec: 10.33
      ref_sec: 20.6
      cer: 0.1489
      wer: 0.9474
    waxal_00136:
      source: waxal
      text: Ɛʋɛ agaga 'ɛfu, k'ayaba afualɛ k'ayaba Ak'unuku k'ɔtɔ edini akɔ ekɔtɔfue ɛdini akɔ ɛkɔtɔ ʋɛ
        ɛdini akɔ ɔyɔmɔ kɔtɔ, ɛdini adu awu fue nuti k'ayɔ awu wɛ yɔdu Alu z'alu bi fuama n'udu yaba,
        adu atalɛgbɛ 'wɛ ɛdi akɔ adu ɔɔ uti uti wu uti n'aʋa
      sbs: 0.6415
      gen_sec: 14.04
      ref_sec: 19.63
      cer: 0.3278
      wer: 0.7826
    waxal_00137:
      source: waxal
      text: ɛmɛ lɛ alʋ wlɛ ɔwʋ dʋ kʋ atani zati nʋ sɔgbè aɣa, ɛdini adʋ awʋ wɛ kʋ ɛdini adʋ awʋ ɛblɔ kʋ
        akɔ ɛkɔtɔ ƒʋɛ kʋ atani zati kʋ akɛ wlɛ ɛkʋɛdi dʋ nʋ sɔgbèɛ aɣa
      sbs: 0.6097
      gen_sec: 8.98
      ref_sec: 17.96
      cer: 0.2458
      wer: 0.9722
    waxal_00138:
      source: waxal
      text: Ake buele ku tu deka yɛ kayavɛ kakpɔ alu kɔnu udu kaka kɔsu uvie nu inetsedigbo adu awu fue
        ku edzeklo kakɔsu deka di bi yanu udu kakɔsu ɔliɛ kayavɛ
      sbs: 0.6642
      gen_sec: 8.08
      ref_sec: 25.24
      cer: 0.0672
      wer: 0.8667
    waxal_00139:
      source: waxal
      text: ɛmɛ lɛ alʋɛdini, asii dini yanʋ ʋsi dili kʋ ɛdini ka mɔ, ɛdini ɛwʋ dʋkʋ nʋ ɛlʋ, ɛdini bi nɛ
        wʋ dʋkʋ nʋ ɛlʋ, asiivi nʋadɛka ni, itsʋ dini bi manʋ ɛƒʋɛ
      sbs: 0.6372
      gen_sec: 8.35
      ref_sec: 17.68
      cer: 0.0973
      wer: 0.625
    waxal_00140:
      source: waxal
      text: uvi di ama evidze di n'idu k'aye fue no ɛkutɛ di li adi aluia ɛlutɛ ivi atɛma n'atami ɛkutɛ
        yɛ alɔ k'aka sɛ sɛ no ivi yɛ li owu ɛfua bi ma n'ɛkutɛ yɛ ayi alɔ ivi yɛ atɛma no atami udunu
        ayi ɛto dza kplo
      sbs: 0.6086
      gen_sec: 10.86
      ref_sec: 20.12
      cer: 0.1974
      wer: 0.8696
    waxal_00141:
      source: waxal
      text: alo n'ɔlò dini kɔ n'ɛfuedi k'aka n'ɔlò edigbo ka kò eti k'edigbo ya no ayɛto atami nɛna atadza
        kplo ewu ɛkò n'ɛlu ɛdini ado awu fue k'edigbo ado awu wɛ
      sbs: 0.6702
      gen_sec: 7.63
      ref_sec: 16.38
      cer: 0.1391
      wer: 0.8333
    waxal_00142:
      source: waxal
      text: Alʋ poo dɩnɩ la nʋ tɛ kɔ, nʋ etikʋtɛ dɩ alɔ kʋ atanɩ ekpe alɔ nʋ lɛ, ɛdɩnɩ kɔ ɛkɔtɔ, ɛdɩnɩ
        nakɔ ɛkɔtɔ, edigbo adʋ ʋɣɔ nʋ udu, kʋ ɔya kʋ ekpe alɔ nʋ alʋ one wanɩ
      sbs: 0.6616
      gen_sec: 8.34
      ref_sec: 17.39
      cer: 0.2101
      wer: 0.6216
    waxal_00143:
      source: waxal
      text: Atʋnʋ ali bene kʋ ayaxa ali bene Namʋ asidini atʋnʋ atami ali kʋ ayaxa ali bene, kʋ atani
        adʋ awʋwani ivi ɛlʋ ɛlʋ ɛlʋ Kʋ atani yanʋ ɛmɛ
      sbs: 0.6119
      gen_sec: 5.38
      ref_sec: 20.28
      cer: 0.3551
      wer: 1.0
    waxal_00144:
      source: waxal
      text: Ɔlɔdi la lũ ɔnu yeli n'ɛvɛ, ɔyaba mua mɛ owu di bi yaeli n'ɛfɛ, k'aluɛdini kɔ n'ɛfɛ, aluwani
        kɔ n'ɛfɛ mua ɛdini adu awù fue,k'ɛdi adu ɔvɛ, k'ɛdi adu ɔwlɔmɔ
      sbs: 0.6548
      gen_sec: 8.6
      ref_sec: 17.84
      cer: 0.1667
      wer: 0.9
    waxal_00145:
      source: waxal
      text: Alʋma ɛkʋtɛ aya Ɛdini azɛ ɔlʋnana, ɛdi bi eya aɣla nʋ inaga, la kʋ ayɔ etidzo la kama avakʋtɛ
        Atani ama kʋ ɛlʋa ɔlɛ nʋ ayɛtʋ Atani ayawla Eti bi tsue nʋ atami alɔ
      sbs: 0.6555
      gen_sec: 8.14
      ref_sec: 18.12
      cer: 0.1732
      wer: 0.7353
    waxal_00146:
      source: waxal
      text: Aluɛdini lanutɛ asɛ tulu nu ɔbɛtu azati nu ɔbɛ owuava ɔliɛ aseku ayɔ ɛkuɛdi du nɛmɔ kumu atɔlɔdu
        nu obɛli mɛ kɔma bafa nu ɔbɛ ava adu tsitsi wɛ ɔlukadibi zati ku tabi adu ayɛku buaku atɔlɔ du
        nu obeli kɔma bafa ava lɛ ublɔ
      sbs: 0.6494
      gen_sec: 12.32
      ref_sec: 23.77
      cer: 0.1798
      wer: 0.9333
    waxal_00147:
      source: waxal
      text: Ɛkutɛ kika de boako ɔlɛ ɛfo boa ka atane ɛfɔnaa kɔsu asɛ nɛfɛ Aloɛ poun de aba luɛluɛ Ade
        ado bagi nedu Ɛde ne ado awufue Ɛde neado ɔwɛ Ɛde ne ado ɔvɛ ko ata dza baakɔ nɛvɛ kaka yɛsɛ nalɛAva
        kutɛ de ne ma netsɛdeɛ kɔlɛ ofue
      sbs: 0.6091
      gen_sec: 13.25
      ref_sec: 19.55
      cer: 0.2102
      wer: 0.7708
    waxal_00148:
      source: waxal
      text: Ta asi wani aka du ɛdi Adu ɛdιnι dι kɔ ɛya wɛ du nu ɔɔku ɛdigbo kata dza aka yɛ nu ɔɔku ɛdigboƐkuyɛ
        ata na yi liKɛdi ni ayɔ aɣla yɔtɛ nunuku kɛdini ka mɔƆsi ɛdigbo ayɔ ɔvlɛkwakɔ yɔ tsi yɔ wu ɛlu
        kʋ ɔlɔdi ayɛ lu kɛ dze nu udu
      sbs: 0.6305
      gen_sec: 11.75
      ref_sec: 20.52
      cer: 0.1149
      wer: 0.7451
    waxal_00149:
      source: waxal
      text: aloɛdini ya no ɛvɛ atani abò ponŋ ase do ayili lako aluvi bi do ayili ɛdini ado awu fue ɛdini
        akɔ ɛkɔtɔ ɛdini akɔ ɛkufue do n'atami ɛluɛ ɛdini anyuɛ ala k'aka mo no uvi di k'ado awu fue k'ɔya
        n'atami alɔ
      sbs: 0.6252
      gen_sec: 10.21
      ref_sec: 19.99
      cer: 0.1592
      wer: 0.9048
    waxal_00150:
      source: waxal
      text: ase ɛto ewle do ko ake kele ilevle sɛ akpɔ idama no duku yowu no ɛlu k'atani ado ufa no ɛmɔ
        ɔse edigbo ewu ɔwlɔmɔ duku n'ɛlu k'ado ɔwlɔmɔ awu
      sbs: 0.6101
      gen_sec: 7.91
      ref_sec: 21.86
      cer: 0.1376
      wer: 0.6667
    waxal_00151:
      source: waxal
      text: ɛdini kikɑdi lɑnute kɑtania du ikpoku bua kɔle ɑtsayikpoku ku ɛvlɛdi'iduziaa kɑdigbɑ du ɛdinie
      sbs: 0.598
      gen_sec: 5.27
      ref_sec: 16.21
      cer: 0.175
      wer: 0.8571
    waxal_00152:
      source: waxal
      text: Alʋfue wanɩ atsue nʋ ɛfʋɛdɩ kpe-kpe-kpe kʋ atanɩ azɛ atamɩ ɔ ɔ alɩ yɛ ayʋ ɛ flag kʋ ɔ atanɩ
        abʋ, ɔsɩ bɩ uluvi bɩ Ɛdɩnɩ adʋ awʋfue, ɛdɩnɩ adʋ awʋ ʋlɔ ɛlʋ-ɛlʋ kʋ atanɩ ya
      sbs: 0.639
      gen_sec: 9.6
      ref_sec: 16.83
      cer: 0.2422
      wer: 0.6944
    waxal_00153:
      source: waxal
      text: Ɛmɛ lɛ edɩnɩ kʋ kabɔd lɛ nʋ ɩtsɛdɩ kʋ abatɩ ɔlɛ nʋ edɩnɩe ka ɔsɩ nʋ ʋlʋvɩ aza nʋ atamɩ abatɩ
        ava
      sbs: 0.5979
      gen_sec: 4.22
      ref_sec: 20.44
      cer: 0.4133
      wer: 0.9091
    waxal_00154:
      source: waxal
      text: Ali tinya di bʋa kʋ alʋ ɛladi yeli ɔlʋ edigbo azɛ evidzetsɔ ʋlʋvi di nʋ aɣla kʋ edigbo bi
        yanʋ ʋdʋe kʋ azɛ ɛkʋ bʋeledi kʋ ayɔlɛ nʋ ayʋ agbatɛ kʋ eke kʋ kʋ akasɛ layɛ
      sbs: 0.6571
      gen_sec: 8.59
      ref_sec: 16.94
      cer: 0.2154
      wer: 0.7778
    waxal_00155:
      source: waxal
      text: Ama ɛkʋtɛ di n'ɛmɛ nʋ eyǝ n'eyǝ, ɔlɛ avakʋtɛni ɛlʋ ɛlʋ Itsu bebeni bi ma nʋ utikpa k'atɛ ma
        bi n'eyǝ n'eyǝ Owʋ dini bi ma nʋ ina netse k'atɛ ma nʋ eyǝ n'eyǝ
      sbs: 0.6555
      gen_sec: 8.13
      ref_sec: 20.8
      cer: 0.3304
      wer: 1.0
    waxal_00156:
      source: waxal
      text: Alʋka dini lan'tɛ k'akekele kɔnʋ Ɔlʋk'edigbo akɔlʋ k'ɛkʋɛdini tsue n'uti k'ɔkatsi ɛkʋɛdi n'ayava,
        k'ɛdini k'akpɔtsɛ n'udu Ʋgbatawani ma n'udu, k'ɛdini bi k'akɔsʋ ɛva
      sbs: 0.6421
      gen_sec: 8.51
      ref_sec: 19.59
      cer: 0.1094
      wer: 0.913
    waxal_00157:
      source: waxal
      text: Ɛmɛ lɛ ɛfʋ yɛ bʋa kʋ adɩ alʋɩa, yakʋtʋ mʋ nʋ adɩ alʋɩa paa kʋ akɔs nadɩ nʋ ɛfɛ Olevi edigbo
        dɩ ta af a a ama ɔlɔdɩ ul evidze dɩ nʋ ayidu mʋa, kʋ ɔkayɔ yɩ yɔkpɔtsɩ ivi yɛ
      sbs: 0.6029
      gen_sec: 9.7
      ref_sec: 16.88
      cer: 0.2734
      wer: 0.95
    waxal_00158:
      source: waxal
      text: Ɛtʋfue alʋ kɔ kpe kpe kpe kʋ atani ekple adaka mʋfa nʋ ava adaka yɛ lɛ ɔwʋe ɛkɔtɔ ni kɔ nʋ
        ayava ɛdini azɛ ɛzɔkpako nʋ aɣla ɛdini azɛ ɛmʋzɛlɛko nʋ aɣla kʋ akede itsu di manʋ itsɛdi
      sbs: 0.6413
      gen_sec: 9.4
      ref_sec: 25.44
      cer: 0.1469
      wer: 0.7895
    waxal_00159:
      source: waxal
      text: Ɩma ayʋ alɔtɔnɩ ayʋ ɛsɛ Ɩma yɛ kɔ kpe-kpe-kpe kʋ akakɔsʋ sɔdza wanɩ tɛ azɛ ma ya nʋ kafameli
        mɛ Ayɔ ɛkʋ yɔtɛ ka ma nʋ kafamakʋtʋ gbɔ ʋkpɔ yɛ mɛ Alʋ ɛdɩnɩ ewu ɛkʋ nʋ ɛlʋ, ɛdɩnɩ akatɛ alɔ dʋ
        sɔdza wanɩ nʋ ɩma yɛ li Ɛdɩnɩ aya kpoo anakɔnakatʋ
      sbs: 0.6224
      gen_sec: 13.18
      ref_sec: 23.24
