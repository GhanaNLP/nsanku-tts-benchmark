      sbs: 0.6516
      gen_sec: 8.08
      ref_sec: 16.84
      cer: 0.1456
      wer: 0.8438
    waxal_00189:
      source: waxal
      text: Alʋɛdìní la ntɛ Ɛdiní adu ɔwlɔmɔ ayʋ awu Ɛdiní adu ugbatawla Ɛdiní kala kʋ ɛdí bi kasɛsɛ nʋ
