      wer: 1.3333
    bible_00001:
      source: bible
      text: Kukyure kake ko̱ be̱e̱ ne̱ Yeesuu a be̱e̱ yɔ ke̱bware̱ko̱re̱kyaŋ‑nɔ ya kaapo̱ abware̱se̱ŋ.
        Saŋ amo̱‑ɔ ɔnyare̱ ko̱ mɔ bo̱ mfe̱ŋ na mò̱ kigyisesare̱e̱ a wu.
      sbs: 0.6655
      gen_sec: 9.92
      ref_sec: 13.68
      cer: 0.1238
      wer: 0.44
    bible_00002:
      source: bible
      text: Ne̱ Ɔbɔnsam ne̱ bo̱ be̱e̱ ba te̱e̱ mò̱ ɛ Ɔkyɔrɔpo̱‑ɔ a ba mò̱ ase̱. Ne̱ ɔ yɛ, “Fo̱ i nyi
        fe̱yɛ Wuribware̱ mò̱ gyi‑o e̱ gye̱ fo̱ kase̱ŋtiŋ, amo̱ fe̱raa sa a abu mɔ buruwi bodobodoo sa
        fo̱ a fo̱ gyi.”
      sbs: 0.6534
      gen_sec: 12.24
      ref_sec: 13.76
      cer: 0.0952
      wer: 0.2683
    bible_00003:
      source: bible
      text: Se̱sɛ ne̱ Wuribware̱ a kufwiiŋe‑o te mò̱ kakpo̱nɔ‑rɔ‑ɔ e̱ taare̱ a o nu atɔ mɔ pɛɛɛ kaase̱,
        amaa ɔko̱ ne̱ mò̱ kufwiiŋe‑o mo̱ŋ te mò̱‑rɔ‑ɔ maa taare̱ a o ŋu ke̱tɔ ne̱ ke̱ bo̱ ane̱ŋ a se̱sɛ‑ɔ
        kakpo̱nɔ‑rɔ‑ɔ.
      sbs: 0.6613
      gen_sec: 12.32
      ref_sec: 12.54
      cer: 0.1259
      wer: 0.6053
    bible_00004:
      source: bible
      text: Mo̱ e̱ tɔwe̱ mo̱ i gywii mo̱ne̱ fe̱yɛ fo̱ i di tiikpa mfe̱ŋ ane̱ŋ‑aaa bo̱ fo̱ saŋ ne̱ fo̱
        e̱ ka fo̱ ko̱kɔ a fo̱ lo̱we̱‑ɔ, na paso̱wa gbaa mo̱ŋ saŋ‑ɔ.”
      sbs: 0.6645
      gen_sec: 7.6
      ref_sec: 11.62
      cer: 0.3043
      wer: 0.5484
    bible_00005:
      source: bible
      text: Saŋ ne̱ Yeesuu e̱ tɔwe̱ amo̱‑ɔ, ne̱ kabɔɔ ko̱ a le̱e̱ Yayerus a lɔŋ‑ɔ‑rɔ bo̱ tɔwe̱ gywii Yayerus
        fe̱yɛ, “Fo̱ kakye̱e̱sɛɛ‑ɔ a wu, amo̱se̱‑ɔ fo̱ ma lɛɛ sa a ɔkaapo̱po̱‑ɔ kpo̱ne̱ mò̱ e̱ye̱e̱.”
      sbs: 0.6415
      gen_sec: 11.04
      ref_sec: 14.06
      cer: 0.15
      wer: 0.6364
    bible_00006:
      source: bible
      text: Ne̱ Yeesuu yɛ, “Mo̱ne̱ ya ko̱re̱ Wuribware̱ atɔ, mo̱ne̱ e̱ nya ke̱tɔ ne̱ mo̱ne̱ e̱ kpa‑ɔ.
        Mo̱ne̱ ya buwi kpa Wuribware̱ a e̱kpa‑ɔ, mo̱ne̱ i ŋu ke̱tɔ ne̱ mo̱ne̱ e̱ kpa‑ɔ. Mo̱ne̱ ya ye̱re̱
        kawu te̱e̱ mò̱, ɔ taye̱ po̱ne̱‑ɔ, na mo̱nꞌ nya lweero.
      sbs: 0.6155
      gen_sec: 13.36
      ref_sec: 14.48
      cer: 0.1208
      wer: 0.2727
    bible_00007:
      source: bible
      text: Ne̱ agyase̱po̱ anyɔ amo̱ a ya waa ane̱ŋ ne̱ Yeesuu a tɔwe̱ gywii bamo̱ fe̱yɛ bo̱ waa‑ɔ.
      sbs: 0.6644
      gen_sec: 4.16
      ref_sec: 6.42
      cer: 0.0508
      wer: 0.3529
    bible_00008:
      source: bible
      text: Amaa ke̱tɔ ko̱ e̱ bo̱‑rɔ na ko̱ kyɔ ne̱ mo̱ne̱ e̱ kpa fe̱raa, amɔ mo̱nꞌ lɔŋŋɔ mfe̱ŋ ne̱ maŋ
        agyi e̱ gyaŋŋe̱ ba waa mbraa ba sa maŋ‑ɔ.
      sbs: 0.6732
      gen_sec: 8.24
      ref_sec: 9.98
      cer: 0.023
      wer: 0.1786
    bible_00009:
      source: bible
      text: Amo̱ fe̱raa, bamo̱ ne̱ bo̱ mo̱ŋ gye̱ Yudaa awuye‑o a nu ane̱ŋ‑ɔ, ne̱ baa kyo̱rɔ ke̱tɔ ne̱
        Wuribware̱ a tɔwe̱‑ɔ. Ne̱ bamo̱ ne̱ Wuribware̱ a kyɔ lee fe̱yɛ bo̱ nya ŋkpa na kukyure ne̱ a mo̱ŋ
        de kɛɛ‑ɔ a kii Yeesuu akɔɔre̱gyipo̱.
      sbs: 0.6279
      gen_sec: 12.88
      ref_sec: 12.4
      cer: 0.1192
      wer: 0.4762
    bible_00010:
      source: bible
      text: Bo̱ le̱e̱ fe̱yɛ ɔke̱maa ne̱ o bu mò̱ e̱ye̱e̱ ke̱dabe̱‑ɔ, mò̱ ne̱ Wuribware̱ e̱ baa kaase̱.
        Ne̱ ɔke̱maa mɔ ne̱ ɔ baa mò̱ e̱ye̱e̱ kaase̱‑ɔ, Wuribware̱ e̱ sa mò̱ ke̱dabe̱.”
