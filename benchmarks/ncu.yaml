    bible_00171:
      source: bible
      text: “Ɔko̱ mo̱ŋ tɛɛ ŋu, ɔko̱ mo̱ŋ tɛɛ nu, ɔko̱ mo̱ŋ tɛɛ pini
      sbs: 0.627
