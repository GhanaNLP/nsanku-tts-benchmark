        ane̱ ŋkpo̱nɔ‑rɔ kpa mo̱ne̱‑ɔ, mo̱ne̱ mɔ, mo̱nꞌ buŋŋi mo̱ne̱ ŋkpo̱nɔ‑rɔ kpa ane̱.
