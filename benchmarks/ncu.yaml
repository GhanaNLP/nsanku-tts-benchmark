      text: Ane̱ maa kpa a kitiri kra mo̱ne̱, na a taare̱ kya bo̱ko̱ mɔ‑rɔ, amaa ane̱ e̱ kpa fe̱yɛ ɔke̱maa
        nya mò̱ ke̱be̱gya‑ɔ ne̱e̱.
      sbs: 0.5968
      gen_sec: 8.6
      ref_sec: 7.92
      cer: 0.1646
      wer: 0.6957
    bible_00126:
      source: bible
      text: Kake nsiŋ ne̱ mo̱ a waa mfɛɛre̱ fe̱yɛ m mo̱rɔwe̱ mo̱ne̱‑ɔ,
      sbs: 0.536
      gen_sec: 5.08
      ref_sec: 3.02
      cer: 0.3684
      wer: 1.1818
    bible_00127:
      source: bible
      text: Amɔ ase̱ŋ ne̱ ane̱ a ye̱re̱ ayaa‑rɔ ane̱ e̱ tɔwe̱. Ne̱ Wuribware̱ a kufwiiŋe timaa ne̱ Wuribware̱
        i ke bamo̱ ne̱ ba gya mò̱ kanɔ se̱‑ɔ, e̱ de̱ŋ ɔ be̱e̱ ɔ ye̱re̱ ase̱ŋ amo̱ ayaa‑rɔ.”
      sbs: 0.5522
      gen_sec: 13.52
      ref_sec: 12.8
      cer: 0.3879
      wer: 1.0
    bible_00128:
      source: bible
      text: ne̱ mo̱ akatɔ a gyi mo̱ e̱ tɔwe̱ fo̱ kuŋu si ase̱ŋ.
      sbs: 0.5878
      gen_sec: 5.84
      ref_sec: 3.72
      cer: 0.2812
      wer: 0.5833
    bible_00129:
      source: bible
      text: Ne̱ Peetroo yɛ, “Ke̱e̱ ɛ, ane̱ a yɔwe̱ ke̱tɔ ke̱maa ane̱ gya fo̱ se̱‑ɔ, nte̱tɔ ne̱ ane̱ e̱
        nya?”
      sbs: 0.5951
      gen_sec: 8.76
      ref_sec: 5.7
      cer: 0.3333
      wer: 0.7368
    bible_00130:
      source: bible
      text: Na ba gyaŋŋe̱ Wuribware̱ suŋkpa‑ɔ kabuno kake ke̱maa, na ba gyaŋŋe̱ ba gyi abɛɛ aye̱ kakatɔgyi‑ro
        na kakpo̱nɔyuri‑ro.
      sbs: 0.607
      gen_sec: 10.56
      ref_sec: 7.18
      cer: 0.2921
      wer: 1.2222
    bible_00131:
      source: bible
      text: Ŋkee bamo̱ ne̱ bo̱ gye̱ mò̱ ŋkpɛɛ na bamo̱ ne̱ bo̱ gya mò̱ se̱‑ɔ a le̱e̱ ba fɛɛ‑rɔ ne̱e̱
        fe̱yɛ,
      sbs: 0.5267
      gen_sec: 7.76
      ref_sec: 7.56
      cer: 0.3448
      wer: 0.8
    bible_00132:
      source: bible
      text: Fe̱yɛ ane̱ŋ ne̱ baa kyo̱rɛɛ bo̱ le̱e̱ Yeesuu kuŋu si abware̱se̱ŋ wo̱re̱‑ɔ‑rɔ‑ɔ,
      sbs: 0.5881
      gen_sec: 7.68
      ref_sec: 5.48
      cer: 0.3396
      wer: 0.9167
    bible_00133:
      source: bible
      text: Ne̱ Yeesuu a tɔwe̱ bo̱ gye̱ kɛɛ fe̱yɛ, “To, ɔke̱maa ne̱ ɔɔ kpa atɔ timaa bo̱ dɔŋŋɔ abɛɛ se̱‑ɔ,
        ne̱ Wuribware̱ ase̱ fe̱raa ɔ gye̱ otiripo̱ ne̱e̱‑ɔ, o du ne̱e̱ fe̱yɛ atɔ wuye amo̱ ne̱ ɔ mo̱ŋ
        de mfɛɛre̱‑ɔ.”
      sbs: 0.5859
      gen_sec: 15.92
      ref_sec: 14.08
      cer: 0.3282
      wer: 0.8718
    bible_00134:
      source: bible
      text: Mo̱ e̱ ko̱re̱ ke̱bware̱ko̱re̱ fe̱yɛ ane̱ nyaŋpe̱ Yeesuu Kristoo yure mo̱ne̱.
      sbs: 0.577
      gen_sec: 6.76
      ref_sec: 4.44
      cer: 0.3654
      wer: 1.1818
    bible_00135:
      source: bible
      text: Ne̱ oo fuwi ywe̱e̱, ne̱ ɔɔ ye̱re̱ mò̱ ayaa se̱, ne̱ ɔɔ le̱e̱ ɔ naa. Ne̱ mò̱ aa bamo̱ a lwee
        Wuribware̱ suŋkpa kabuno, na ɔ naa na o fuwi ɔ ywe̱e̱, na ɔ kyo̱rɔ Wuribware̱.
      sbs: 0.5698
      gen_sec: 13.68
      ref_sec: 9.22
      cer: 0.2909
      wer: 0.6944
    bible_00136:
      source: bible
      text: Na mo̱nꞌ yure bamo̱ ne̱ bamo̱ fe̱raa ba da mo̱ne̱ yii‑o, na mo̱nꞌ ko̱re̱ ke̱bware̱ko̱re̱ sa
        bamo̱ ne̱ ba waa mo̱ne̱ bo̱rɔkraa‑ɔ.
      sbs: 0.6094
      gen_sec: 9.24
      ref_sec: 7.84
      cer: 0.1548
      wer: 0.5455
    bible_00137:
      source: bible
      text: Saŋ ne̱ Yeesuu a tɔwe̱ amo̱‑ɔ pɛɛɛ lo̱we̱‑ɔ, ne̱ ɔɔ le̱e̱ Galile̱ya swe̱e̱re̱ se̱ yɔ Yude̱ya
        swe̱e̱re̱ se̱ a ke̱be̱gya ne̱ ke̱ bo̱ Yo̱o̱daŋ bo̱ŋ nno̱ŋ a bo̱ŋbe̱‑ɔ se̱‑ɔ.
      sbs: 0.5936
      gen_sec: 13.12
      ref_sec: 14.22
      cer: 0.2095
      wer: 0.5517
    bible_00138:
      source: bible
      text: Kyɔwe̱ a lo̱we̱‑ɔ, ne̱ ko̱dɔɔ‑ɔ wuye‑o a tɔwe̱ gywii mò̱ ke̱paafo̱wɔ bre̱sɛ fe̱yɛ, ‘Te̱e̱
        mo̱ apafo̱wɔ‑ɔ pɛɛɛ bo̱ gyaŋŋe̱ na fo̱ ka bamo̱ ko̱kɔ. Na fo̱ ka bamo̱ ne̱ baa sii kamɛɛ yɔ mo̱
        ko̱dɔɔ‑ɔ‑rɔ ko̱kɔ pwɛɛ na fo̱ dɛɛ ka bamo̱ ne̱ baa gye̱ ŋkpɛɛ yɔ‑ɔ.’
      sbs: 0.5819
      gen_sec: 17.28
      ref_sec: 14.24
      cer: 0.3394
      wer: 0.7447
    bible_00139:
      source: bible
      text: Mò̱ ne̱ nde̱ se̱ awuye pɛɛɛ e̱ kɔɔre̱ a bo̱ gyi.”
      sbs: 0.5548
      gen_sec: 4.48
      ref_sec: 3.36
      cer: 0.3667
      wer: 0.6364
    bible_00140:
      source: bible
      text: Mo̱ e̱ kaapo̱ mo̱ne̱ ane̱ŋ ne̱ ɔko̱ ne̱ ɔ ba mo̱ ase̱ a o nu mo̱ ase̱ŋ, ne̱ o bu amo̱‑ɔ du‑o.
      sbs: 0.6125
      gen_sec: 8.0
      ref_sec: 6.6
      cer: 0.2264
      wer: 0.6818
    bible_00141:
      source: bible
      text: Ne̱ soogyaa ɔgye̱ŋkpɛɛpo̱‑ɔ yɛ, “Mo̱ a ka atanne̱ dabe̱ pwɛɛ ne̱ mo̱ a dɛɛ kii Roma maŋ kigyi.”
      sbs: 0.5863
      gen_sec: 8.76
      ref_sec: 6.78
      cer: 0.2462
      wer: 0.7778
    bible_00142:
      source: bible
      text: Ne̱ Pɔɔl na Silas a bo̱rɔ Amfipolis na Apoloniya e̱maŋ‑nɔ, ne̱ baa ba Tisalonikaa maŋ‑nɔ.
      sbs: 0.6124
      gen_sec: 7.92
      ref_sec: 8.8
      cer: 0.1642
      wer: 0.6
    bible_00143:
      source: bible
      text: A le̱e̱ fe̱yɛ ɔko̱ ne̱ ɔ kpa a ɔ nya mò̱ e̱ye̱e̱ le̱e̱ lowi ase̱‑ɔ, lowi e̱ nya mò̱ nsu
        pɛɛɛ. Ɔko̱ mɔ ne̱ o kperi mo̱ se̱ na o wu‑o e̱ nya ŋkpa na kukyure ne̱ a mo̱ŋ de kɛɛ‑ɔ.
      sbs: 0.6932
      gen_sec: 21.76
      ref_sec: 11.24
      cer: 0.287
      wer: 0.7073
    bible_00144:
      source: bible
      text: Ne̱ Simɔŋ yɛ, “Yooo, ɔkaapo̱po̱, tɔwe̱ gywii mo̱.”
      sbs: 0.6384
      gen_sec: 4.8
      ref_sec: 4.04
      cer: 0.375
      wer: 0.75
    bible_00145:
      source: bible
      text: Kanye na mpase̱ pɛɛɛ ane̱ e̱ ko̱re̱ Wuribware̱ fe̱yɛ ane̱ aa mo̱ne̱ a be̱e̱ ŋu abɛɛ, na ane̱
        nya sa mo̱ne̱ ke̱tɔ ne̱ ke̱ saŋ ki tiri fe̱yɛ mo̱nꞌ nya, na mo̱nꞌ taare̱ kɔɔre̱ Kristoo gyi lo̱we̱‑ɔ.
      sbs: 0.6089
      gen_sec: 19.84
      ref_sec: 14.12
      cer: 0.2713
      wer: 0.8108
    bible_00146:
      source: bible
      text: Ke̱tɔ se̱ ne̱ n de itee na akpare̱ mo̱ e̱ tɔwe̱ ase̱ŋ mo̱ i gywii lamaŋ‑ɔ e̱ gye̱ fe̱yɛ bo̱
        de akatɔ, amaa bo̱ mo̱ŋ ke̱e̱, ne̱ bo̱ de e̱se̱bɔ, amaa bo̱ maa nu ase̱ŋ.
      sbs: 0.6187
      gen_sec: 12.32
      ref_sec: 14.26
      cer: 0.3204
      wer: 0.6571
    bible_00147:
      source: bible
      text: Ne̱ amo̱ e̱ gye̱ fe̱yɛ kaye̱ mɔ‑rɔ dooo ne̱ ane̱ i de te̱maa Kristoo si, amo̱ fe̱raa ane̱
        ase̱ŋ e̱ waa e̱wɛɛ a a kyo̱ŋ ɔke̱maa kaye̱ mɔ‑rɔ.
      sbs: 0.556
      gen_sec: 11.4
      ref_sec: 11.18
      cer: 0.2444
      wer: 0.75
    bible_00148:
      source: bible
      text: Ŋ yɛ, fo̱ ya ŋu kiyii ko̱ a swɛɛ agyi timaa, a kaapo̱ ne̱e̱ fe̱yɛ kiyii‑o bo̱ daŋ. Ne̱ fo̱
        ya ŋu kiyii suyo ko̱ mɔ a swɛɛ agyi preepreesɛ, a kaapo̱ ne̱e̱ fe̱yɛ kiyii amo̱ mo̱ŋ bo̱ daŋ.
        Kiyii agyi ne̱ bo̱ de ba pini kiyii suyo ne̱ ke̱ gye̱‑ɔ.
      sbs: 0.5896
      gen_sec: 21.28
      ref_sec: 14.72
      cer: 0.5217
      wer: 0.8824
    bible_00149:
      source: bible
      text: Asɔre̱e̱ asɔre̱e̱ ne̱ a bo̱ Asiya swe̱e̱re̱ se̱‑ɔ awuye e̱ ka mo̱ne̱ kanɔ. Akwila na Prisikila
        na asɔre̱e̱ agyi ne̱ ba gyaŋŋe̱ bamo̱ aye̱ ba waa asɔre̱e̱‑ɔ de ane̱ nyaŋpe̱ ba ka mo̱ne̱ kanɔ.
      sbs: 0.5396
      gen_sec: 15.88
      ref_sec: 14.98
      cer: 0.3281
      wer: 0.8824
    bible_00150:
      source: bible
      text: Ne̱ ɔɔ tɔwe̱ keŋkeŋ fe̱yɛ, “Ko̱so̱ ye̱re̱ fo̱ ayaa se̱.” Mfe̱ŋ ne̱ ke̱gyabɔɔ amo̱ a ko̱so̱
        fuwi ywe̱e̱, ne̱ ɔɔ nare̱ mò̱ ayaa se̱ ɔ kaa.
      sbs: 0.5514
      gen_sec: 11.36
      ref_sec: 7.86
      cer: 0.2143
      wer: 0.6154
    bible_00151:
      source: bible
      text: Ne̱ Wuribware̱ kabɔɔ amo̱ a be̱ŋŋaa mò̱ ɛ, “Wuribware̱ akatɔ a gyi fo̱ ke̱bware̱ko̱re̱ na
        ke̱dame̱naŋsɛ ne̱ fo̱ e̱ waa atiripo̱‑ɔ se̱, ne̱ ɔ kpa a ɔ be̱ŋŋaa fo̱.
      sbs: 0.5259
      gen_sec: 12.08
      ref_sec: 9.0
      cer: 0.271
      wer: 0.7931
    bible_00152:
      source: bible
      text: Amo̱se̱‑ɔ to̱ŋ ke̱maa ne̱ fo̱ kapo̱tɛɛ da‑ɔ, fo̱ mfɛɛre̱ e̱ ya dɔŋŋɔ kamo̱ se̱ mfe̱ŋ.”
      sbs: 0.5625
      gen_sec: 6.48
      ref_sec: 5.68
      cer: 0.3333
      wer: 0.9333
    bible_00153:
      source: bible
      text: Ne̱ Pɔɔl fɔŋfɔŋ e̱ kpa fe̱yɛ ɔ yɔ lamaŋ amo̱ akatɔ‑rɔ mfe̱ŋ ya sa se̱ŋsa gywii ase̱sɛ‑ɔ, amaa
        bamo̱ ne̱ ba kɔɔre̱ Yeesuu ba gyi‑o mo̱ŋ sure.
      sbs: 0.5663
      gen_sec: 11.4
      ref_sec: 9.26
      cer: 0.2857
      wer: 0.7778
    bible_00154:
      source: bible
      text: Bo̱ le̱e̱ fe̱yɛ mo̱ne̱ bwe̱e̱tɔ a fa mfɛɛre̱ fe̱yɛ mo̱nꞌ gyiiri mò̱ ke̱se̱bɔ, ne̱ mo̱ne̱
        a gya mò̱ le̱e̱ mo̱ne̱ asɔre̱e̱‑ɔ‑rɔ. Ne̱ mbe̱yɔmɔ mo̱ a ŋu fe̱yɛ mò̱ ke̱se̱bɔgyiiri ne̱ mo̱ne̱
        a gyiiri mò̱‑ɔ a baare.
      sbs: 0.5891
      gen_sec: 17.48
      ref_sec: 13.3
      cer: 0.553
      wer: 0.7778
    bible_00155:
      source: bible
      text: Ne̱ baa kaapo̱ mò̱ bamo̱ Igyipiti awuye kanyiase̱ŋ, ne̱ oo kii se̱sɛ dabe̱ mò̱ se̱ŋsa na
        asuŋ waasɛ‑rɔ.
      sbs: 0.5552
      gen_sec: 7.36
      ref_sec: 8.3
      cer: 0.2055
      wer: 0.8333
    bible_00156:
      source: bible
      text: Ane̱ e̱ kyo̱rɛɛ amo̱‑ɔ ne̱e̱ a ane̱ kakatɔgyi‑o ma lo̱we̱ daa.
      sbs: 0.5936
      gen_sec: 6.36
      ref_sec: 4.02
      cer: 0.375
      wer: 0.9091
    bible_00157:
      source: bible
      text: Amo̱se̱ se̱‑ɔ, ke̱tɔ ne̱ mo̱ e̱ ka mo̱ne̱ ase̱ŋ ke̱mo̱ se̱‑ɔ ne̱e̱. Suŋno mo̱ne̱ ya gye̱ ŋkpɛɛ
        tɔwe̱ fe̱yɛ mo̱ne̱ e̱ kpa a mo̱nꞌ sa atanne̱. Kase̱ŋtiŋ si mɔ ne̱ mo̱ne̱ a gye̱ ŋkpɛɛ e̱sa.
      sbs: 0.5423
      gen_sec: 13.8
      ref_sec: 12.06
      cer: 0.2
      wer: 0.7143
    bible_00158:
      source: bible
      text: Amo̱ fe̱raa ne̱ Yeesuu a tɔwe̱ gywii mò̱ fe̱yɛ, “Ko̱so̱, nare̱ dame̱naŋsɛ. Ane̱ŋ ne̱ fo̱
        a kɔɔre̱ mo̱ gyi‑o si ne̱ fo̱ a kpaare̱.”
      sbs: 0.5907
      gen_sec: 10.96
      ref_sec: 8.56
      cer: 0.2073
      wer: 0.625
    bible_00159:
      source: bible
      text: Amo̱se̱ ne̱ owure‑o a te̱e̱ ane̱ŋ a ke̱yaafɔre̱ amo̱. Ne̱ ɔɔ tɔwe̱ gywii mò̱ fe̱yɛ, ‘Kuŋurole̱ŋ
        wuye ke̱yaafɔre̱ e̱ gye̱ fo̱. Ko̱kɔ ne̱ fo̱ de mo̱‑ɔ kyɔ bwe̱e̱tɔ bɛɛɛ? Amaa fo̱ a ko̱re̱ mo̱
        fe̱yɛ ŋ nyite fo̱‑ɔ se̱‑ɔ, mo̱ a taa fo̱ ko̱kɔ amo̱ bo̱ ke fo̱.
      sbs: 0.6336
      gen_sec: 24.08
      ref_sec: 14.76
      cer: 0.2994
      wer: 0.7917
    bible_00160:
      source: bible
      text: Hare̱e̱ gbaa fo̱ ya ko̱re̱ ke̱bware̱ko̱re̱, ne̱ fo̱ a sa aŋsɛ nɛɛnɛɛ, fo̱ se̱ŋsa‑ɔ mo̱ŋ kya
        fo̱ bɛɛko̱‑ana asɔre̱e̱ agyi‑o‑ro.
      sbs: 0.5801
      gen_sec: 8.32
      ref_sec: 10.14
      cer: 0.2073
      wer: 0.9
    bible_00161:
      source: bible
      text: Amaa Pɔɔl a yɔ swe̱e̱re̱ mfe̱ŋ, ne̱ ɔɔ ya di ke̱yaafɔre̱ amo̱ se̱, ne̱ oo powi mò̱, ne̱ ɔ
        yɛ, “Mo̱ne̱ ma sa a a tiri mo̱ne̱ na ɔ ke̱e̱!”
      sbs: 0.5711
      gen_sec: 13.04
      ref_sec: 8.56
      cer: 0.3171
      wer: 0.8333
    bible_00162:
      source: bible
      text: Amɔ leŋpoo ɔkɔɔre̱po̱ bre̱sɛ ko̱ ne̱ o de atanne̱, ne̱ ba te̱e̱ mò̱ ɛ Sakiiyus‑o bo̱ maŋ‑ɔ‑rɔ
        mfe̱ŋ.
      sbs: 0.5869
      gen_sec: 9.64
      ref_sec: 10.78
      cer: 0.3182
      wer: 0.8889
    bible_00163:
      source: bible
      text: Ne̱ Yeesuu a tɔwe̱ gywii soogyaa amo̱ fe̱yɛ, “Nare̱ pe̱, na ke̱tɔ ne̱ fo̱ a kɔɔre̱ gyi‑o e̱
        waa a ke̱ sa fo̱.”
      sbs: 0.5776
      gen_sec: 8.64
      ref_sec: 5.38
      cer: 0.4493
      wer: 0.913
    bible_00164:
      source: bible
      text: Ne̱ ŋkee ɔ yɛ ɔke̱maa ma lɛɛ so̱rɔ tɔso̱rɔ bo̱ kyo̱ŋ kabuno‑o mfe̱ŋ.
      sbs: 0.5774
      gen_sec: 4.84
      ref_sec: 5.66
      cer: 0.5106
      wer: 0.9231
    bible_00165:
      source: bible
      text: Ntɔ se̱ ne̱ mo̱ne̱ mo̱ŋ nu ase̱ŋ amo̱ kaase̱‑ɔ ne̱e̱? Mo̱nꞌ nu fe̱yɛ ke̱tɔ ne̱ se̱sɛ i gyi‑o
        i lwee mò̱ kanɔ‑rɔ ne̱e̱ na ko̱ yɔ mò̱ kame‑ro na ŋkee ɔ kɔɔ bo̱ twe̱e̱.
      sbs: 0.5713
      gen_sec: 13.28
      ref_sec: 11.18
      cer: 0.3107
      wer: 0.9118
    bible_00166:
      source: bible
      text: Saŋ amo̱‑ɔ, ne̱ Hɛrɔd ne̱ ɔ gye̱ Galile̱ya swe̱e̱re̱ se̱ owure‑o a nu Yeesuu ase̱ŋ na ane̱ŋ
        ne̱ ɔɔ waa akpe̱ŋe̱ye̱e̱tɔ bwe̱e̱tɔ‑ɔ.
      sbs: 0.5842
      gen_sec: 10.92
      ref_sec: 9.76
      cer: 0.3721
      wer: 0.8636
    bible_00167:
      source: bible
      text: Mo̱ne̱ ma sa a mo̱ne̱ akatɔ gyi fe̱yɛ ibrisi a bu mo̱ne̱, amaa mo̱nꞌ sa a mo̱ne̱ akatɔ gyi
        bwe̱e̱tɔ fe̱yɛ Wuribware̱ a kyo̱rɛɛ mo̱ne̱ anyare̱ bo̱ be̱ya so̱so̱.”
      sbs: 0.6024
      gen_sec: 10.32
      ref_sec: 8.5
      cer: 0.1589
      wer: 0.5517
    bible_00168:
      source: bible
      text: Bamo̱ ya pure se̱sɛ, kifuniŋ ne̱ ki de ayeegyi na abowii ne̱ baa pure, ne̱ mò̱ ya be̱e̱ kyiŋŋi
        le̱e̱ lowi‑ro, amɔ se̱sɛ‑ɔ e̱ nya kayo̱wɔre̱ po̱pwɛɛ, na mò̱ kra be̱e̱ bo̱ kye̱na kamo̱‑rɔ.
      sbs: 0.6108
      gen_sec: 14.36
      ref_sec: 14.12
      cer: 0.2823
      wer: 0.8529
    bible_00169:
      source: bible
      text: Ŋke mfe̱ne̱ ko̱ kamɛɛ‑ɔ, ne̱ Yeesuu a yɔ maŋ ko̱ ne̱ ba te̱e̱ ɛ Nayiŋ‑o‑ro. Amɔ saŋ amo̱‑ɔ
        mò̱ agyase̱po̱‑ɔ na ase̱sɛ biribiri gya mò̱ se̱.
      sbs: 0.6261
      gen_sec: 13.04
      ref_sec: 12.0
      cer: 0.1758
      wer: 0.6154
    bible_00170:
      source: bible
      text: Ane̱ pɛɛɛ a ŋu Yeesuu amo̱ ne̱ mo̱ e̱ tɔwe̱ mò̱ ase̱ŋ‑ɔ mò̱ kikyiŋŋi le̱e̱ lowi‑ro kamɛɛ‑rɔ.
      sbs: 0.5609
      gen_sec: 9.24
      ref_sec: 6.02
      cer: 0.2787
      wer: 0.7647
    bible_00171:
      source: bible
      text: “Ɔko̱ mo̱ŋ tɛɛ ŋu, ɔko̱ mo̱ŋ tɛɛ nu, ɔko̱ mo̱ŋ tɛɛ pini
      sbs: 0.5703
      gen_sec: 5.92
      ref_sec: 3.64
      cer: 0.3714
      wer: 0.5
    bible_00172:
      source: bible
      text: Mo̱ a nu fe̱yɛ fo̱ gyi‑ana‑ɔ bo̱ko̱ a gya kase̱ŋtiŋ a e̱kpa‑ɔ se̱ fe̱yɛ ane̱ŋ ne̱ ane̱ se̱
        ne̱ ɔ bo̱ so̱so̱‑ɔ a de̱ŋ kaapo̱ fe̱yɛ ane̱ gya se̱‑ɔ, mo̱ akatɔ a gyi amo̱ se̱ fɛɛ.
      sbs: 0.6161
      gen_sec: 2.24
      ref_sec: 13.2
      cer: 0.8519
      wer: 0.9444
    bible_00173:
      source: bible
      text: Ke̱mo̱ kaye̱ ŋke‑o, ne̱ Roma awuye ase̱ŋgyipo̱‑ɔ a suŋ purisii awuye ya tɔwe̱ gywii ɔde̱e̱re̱se̱po̱‑ɔ
        ɛ, “Sa a anyare̱ amo̱ kpa a bo̱ nare̱.”
      sbs: 0.6105
      gen_sec: 14.2
      ref_sec: 7.5
      cer: 0.3298
      wer: 1.1667
    bible_00174:
      source: bible
      text: Amo̱se̱‑ɔ mbe̱yɔmɔ, mo̱ ko̱so̱bɛɛ‑ana, ane̱ e̱ kpa fe̱yɛ mo̱nꞌ ŋu ane̱ŋ ne̱ Wuribware̱ ke̱kpa
        a suŋ kusuŋ asɔre̱e̱ awuye ne̱ bo̱ bo̱ Makedoniya swe̱e̱re̱ se̱‑ɔ ŋkpo̱nɔ‑rɔ‑ɔ.
      sbs: 0.5768
      gen_sec: 13.52
      ref_sec: 12.32
      cer: 0.2069
      wer: 0.7692
    bible_00175:
      source: bible
      text: A le̱e̱ fe̱yɛ mo̱, dimaadi mò̱ gyi‑o, de kukyure kake‑o gbaa e̱le̱ŋ.”
      sbs: 0.6117
      gen_sec: 5.48
      ref_sec: 4.52
      cer: 0.2444
      wer: 0.75
    bible_00176:
      source: bible
      text: Amaa mbe̱yɔmɔ ane̱ a nu fe̱yɛ bo̱ko̱ bo̱ mo̱ne̱‑rɔ, ne̱ bo̱ de wo̱rɔgya. Bo̱ maa waa asuŋ
        ke̱maa, amɔ ase̱sɛ ase̱ŋ‑nɔ ke̱nare̱ lweero dooo.
      sbs: 0.5776
      gen_sec: 12.0
      ref_sec: 10.36
      cer: 0.2366
      wer: 0.9583
    bible_00177:
      source: bible
      text: Mo̱ e̱ sa se̱ŋsa mo̱ i gywii mo̱ne̱ ne̱e̱ fe̱yɛ mo̱ne̱ a gye̱ mo̱ gyi‑ana‑ɔ. Ane̱ a tɛɛ buŋŋi
        ane̱ ŋkpo̱nɔ‑rɔ kpa mo̱ne̱‑ɔ, mo̱ne̱ mɔ, mo̱nꞌ buŋŋi mo̱ne̱ ŋkpo̱nɔ‑rɔ kpa ane̱.
      sbs: 0.6284
      gen_sec: 23.68
      ref_sec: 10.6
      cer: 0.2545
      wer: 1.2581
    bible_00178:
      source: bible
      text: Mò̱ ke̱de̱ŋ tɔwe̱ ane̱ŋ‑ɔ, ne̱ Farisii awuye‑o na Sadukii awuye‑o a le̱e̱ ba kɔ, ne̱ baa
        ke‑ro,
      sbs: 0.5945
      gen_sec: 8.6
      ref_sec: 5.92
      cer: 0.3333
      wer: 0.8235
    bible_00179:
      source: bible
      text: Ɔɔ tɔwe̱ ane̱ŋ, a le̱e̱ fe̱yɛ saŋ ke̱maa mɔ Wuribware̱-a‑kya-ane̱-yɔwe̱ a ateese kigyibe̱e̱‑ɔ,
        Romanyi gominaa i lee bamo̱ ne̱ oo tii bamo̱ tiikpa‑ɔ ɔko̱ a ɔ sa bamo̱.]
      sbs: 0.5933
      gen_sec: 14.72
      ref_sec: 13.02
      cer: 0.3304
      wer: 0.9643
    bible_00180:
      source: bible
      text: Ne̱ ɔko̱ ya yaa fo̱ iwurekpa a ɔ ya gyi ase̱ŋ bo̱ da fo̱ na ɔ bɔ fo̱ ko̱kɔ, ne̱ mò̱ e̱ kpa
        fo̱ kaare̱ a ɔ kɔɔre̱, taa fo̱ waagya bo̱ tii mò̱ se̱ na ɔ taa nare̱.
      sbs: 0.6428
      gen_sec: 15.32
      ref_sec: 10.92
      cer: 0.21
      wer: 0.5385
    bible_00181:
      source: bible
      text: Mo̱ e̱ ko̱re̱ ke̱bware̱ko̱re̱ fe̱yɛ ane̱ nyaŋpe̱ Yeesuu Kristoo yure mo̱ne̱ pɛɛɛ.
      sbs: 0.5873
      gen_sec: 5.8
      ref_sec: 9.78
      cer: 0.2857
      wer: 0.8333
    bible_00182:
      source: bible
      text: “Mo̱nꞌ nu mo̱ne̱ e̱ye̱e̱ na mo̱nꞌ kiŋŋi le̱e̱ mo̱ne̱ e̱bɔye̱‑rɔ, a le̱e̱ fe̱yɛ Wuribware̱
        se̱ a kuwure‑o a tɔ‑rɔ.”
      sbs: 0.5345
      gen_sec: 10.16
      ref_sec: 5.44
      cer: 0.3099
      wer: 0.7895
    bible_00183:
      source: bible
      text: ‘A tiri fe̱yɛ bo̱ taa mo̱, dimaadi mò̱ gyi‑o, bo̱ waa abɔye̱waapo̱ ke̱sare̱e̱‑rɔ, na bo̱
        da mo̱ bo̱ me̱ra kiyii kpare̱-abɛɛ‑rɔ se̱, na ke̱mo̱ kake sase̱po̱‑ɔ na n kyiŋŋi le̱e̱ lowi‑ro.’
        ”
      sbs: 0.5571
      gen_sec: 13.44
      ref_sec: 12.66
      cer: 0.2
      wer: 0.9677
    bible_00184:
      source: bible
      text: Ne̱ ase̱sɛ adusunoo na anyɔ‑ɔ a kiŋŋi ba Yeesuu ase̱, na bamo̱ akatɔ a gyi. Ne̱ baa bo̱ tɔwe̱
        gywii mò̱ fe̱yɛ, “Ane̱ nyaŋpe̱, ane̱ a ya ba fo̱ ke̱nyare̱ bo̱ tɔwe̱ ase̱ŋ‑ɔ, ibrisi gbaa a bu
        ane̱.”
      sbs: 0.6064
      gen_sec: 17.92
      ref_sec: 14.46
      cer: 0.186
      wer: 0.6053
    bible_00185:
      source: bible
      text: Bɛɛɛ fo̱ sa a ase̱sɛ mɔ ne̱ bo̱ ye̱re̱ mfe̱e̱‑ɔ tɔwe̱ ke̱bɔye̱ ne̱ mo̱ a gyi ke̱mo̱ ke̱pɔ
        saŋ ne̱ baa yaa mo̱ maŋ abre̱sɛ‑ɔ akatɔ‑rɔ.
      sbs: 0.5924
      gen_sec: 13.72
      ref_sec: 8.52
      cer: 0.2588
      wer: 0.7308
    bible_00186:
      source: bible
      text: Kayo̱wɔre̱ ke̱be̱gya ko̱ i ŋu ase̱ŋ, amɔ abe̱gya ne̱ a saŋ‑ɔ pɛɛɛ i ŋu ase̱ŋ ne̱e̱. Fe̱yɛ
        bamo̱ ya kyo̱rɔ kayo̱wɔre̱‑ɔ ke̱be̱gya ko̱, amɔ abe̱gya ne̱ aa saŋ‑ɔ pɛɛɛ akatɔ a gyi.
      sbs: 0.592
      gen_sec: 14.16
      ref_sec: 11.98
      cer: 0.3162
      wer: 0.6875
    bible_00187:
      source: bible
      text: Ne̱ ŋkee oo suŋ bamo̱ bo̱ kyo̱ŋwe̱ e̱maŋ se̱ fe̱yɛ bo̱ ya tɔwe̱ Wuribware̱ a kuwure‑o‑ro ase̱ŋ,
        na bo̱ kya alɔpo̱.
      sbs: 0.6218
      gen_sec: 9.52
      ref_sec: 8.34
      cer: 0.2763
      wer: 0.7143
    bible_00188:
      source: bible
      text: Amo̱se̱ se̱‑ɔ, mo̱ e̱ tɔwe̱ mo̱ i gywii mo̱ne̱ fe̱yɛ ɔke̱maa ne̱ mò̱ e̱ ko̱re̱ Wuribware̱
        ɔ kpa ko̱tɔko̱, ne̱ mò̱ ya kɔɔre̱ Wuribware̱ gyi mò̱ kakpo̱nɔ‑rɔ fe̱yɛ ɔɔ kyɔ nya ke̱tɔ‑ɔ, Wuribware̱
        mɔ e̱ sa mò̱ ke̱mo̱.
      sbs: 0.5783
      gen_sec: 18.88
      ref_sec: 13.38
      cer: 0.3529
      wer: 0.8947
    bible_00189:
      source: bible
      text: Ane̱ŋ se̱‑ɔ, Wuribware̱ e̱ yɔwe̱ mo̱ne̱ ase̱ŋ a ɔ sa mo̱ne̱, na mo̱ne̱ maŋ mɔ kii ke̱taakpaŋ.
        Mo̱ i gyi mo̱ne̱ kase̱ŋtiŋ fe̱yɛ mo̱ne̱ maa lɛɛ ŋu mo̱, amɔ saŋ a fo̱ fe̱yɛ m ba, ne̱ mo̱ne̱ e̱
        tɔwe̱ fe̱yɛ,
      sbs: 0.5599
      gen_sec: 15.08
      ref_sec: 14.66
      cer: 0.2441
      wer: 0.6
    bible_00190:
      source: bible
      text: Ne̱ purisii awuye‑o a ya tɔwe̱ gywii Roma awuye ase̱ŋgyipo̱‑ɔ. Bamo̱ a nu fe̱yɛ Pɔɔl na Silas
        gye̱ Roma maŋ agyi ne̱e̱‑ɔ,† ne̱ kufu a nya bamo̱, a le̱e̱ fe̱yɛ baa waa bamo̱ bo̱rɔkraa.
      sbs: 0.5906
      gen_sec: 13.76
      ref_sec: 12.58
      cer: 0.1825
      wer: 0.5588
    bible_00191:
      source: bible
      text: A le̱e̱ fe̱yɛ a du ne̱e̱ fe̱yɛ mo̱ gyi mɔ a wu, ne̱ ɔɔ be̱e̱ kyiŋŋi le̱e̱ lowi‑ro‑o. Ɔɔ dɛɛ
        fo̱, amaa mbe̱yɔmɔ, mo̱ a ŋu mò̱.’ Ne̱ baa le̱e̱ ba gyi akatɔ.
      sbs: 0.6152
      gen_sec: 15.16
      ref_sec: 11.8
      cer: 0.2979
      wer: 0.6061
    bible_00192:
      source: bible
      text: Kisi Mɔlɔk suŋkpa ne̱ mo̱ne̱ a so̱rɔ,
      sbs: 0.5718
      gen_sec: 3.04
      ref_sec: 6.72
      cer: 0.1923
      wer: 0.7143
    bible_00193:
      source: bible
      text: Mfaanɛɛ ne̱ ane̱ fɔŋfɔŋ a bo̱ gyii ke̱kpa ne̱ Wuribware̱ e̱ kpa ane̱‑ɔ. Ne̱ bo̱ le̱e̱ ane̱ŋ
        ne̱ ɔ kpa ane̱ ase̱ŋ‑ɔ se̱‑ɔ, ane̱ a taa ane̱ e̱ye̱e̱ bo̱ dɔŋŋɔ mò̱ se̱.
      sbs: 0.5845
      gen_sec: 9.76
      ref_sec: 11.42
      cer: 0.2647
      wer: 0.7812
    bible_00194:
      source: bible
      text: Ne̱ baa bo̱rɔ kyo̱ŋ Firigiya na Galatiya e̱swe̱e̱re̱ se̱, a le̱e̱ fe̱yɛ Wuribware̱ a kufwiiŋe
        timaa‑o mo̱ŋ sa bamo̱ kpa fe̱yɛ bo̱ tɔwe̱ abware̱se̱ŋ swe̱e̱re̱ amo̱ pɛɛɛ ne̱ ba te̱e̱ ɛ Asiya‑o
        si.
      sbs: 0.5791
      gen_sec: 12.8
      ref_sec: 14.66
      cer: 0.6364
      wer: 0.9394
    bible_00195:
      source: bible
      text: Ne̱ Yeesuu a tɔwe̱ gywii mò̱ fe̱yɛ, “Tɔwe̱ ke̱tɔ ne̱ fo̱ e̱ kpa‑ɔ gywii mo̱.”
      sbs: 0.5826
      gen_sec: 7.12
      ref_sec: 3.72
      cer: 0.2917
      wer: 0.7333
    bible_00196:
      source: bible
      text: Ne̱ bo̱ yɛ Peetroo na Yohanee na ɔnyare̱‑ɔ le̱e̱ se̱ŋgyikpa a ke̱kyaŋ‑ɔ‑rɔ. Bamo̱ a le̱e̱
        kawu‑o, ne̱ agye̱ŋkpɛɛpo̱‑ɔ na abre̱sɛ‑ɔ wo̱re̱ wo̱re̱ a le̱e̱ ba tɔwe̱ fe̱yɛ,
      sbs: 0.6088
      gen_sec: 14.48
      ref_sec: 10.38
      cer: 0.3063
      wer: 0.8519
    bible_00197:
      source: bible
      text: Ane̱ e̱ fa fe̱yɛ mo̱ne̱ nyi ane̱ŋ ne̱ ane̱ a kra mo̱ne̱ fe̱yɛ ane̱ŋ ne̱ se̱sɛ e̱ kra mò̱
        gyi‑ana‑ɔ.
      sbs: 0.5776
      gen_sec: 8.4
      ref_sec: 6.12
      cer: 0.2295
      wer: 0.7
    bible_00198:
      source: bible
      text: A saŋ a tiri fe̱yɛ ŋ yɔ mo̱ kpa‑ɔ ndɔɔ na nyaŋe̱ na kraye̱, a le̱e̱ fe̱yɛ bamo̱ e̱ kpa a bo̱
        mɔɔ Wuribware̱ a akyaamɛɛ‑ɔ, Yɛro̱salɛm maŋ‑nɔ ne̱ ba mɔɔ bamo̱. Ne̱ mo̱ saŋ‑ɔ mo̱ŋ tɛɛ fo̱ fe̱yɛ
        ŋ yɔ mfe̱ŋ.’ ”
      sbs: 0.6214
      gen_sec: 22.64
      ref_sec: 14.86
      cer: 0.3759
      wer: 0.8095
    bible_00199:
      source: bible
      text: Saŋ amo̱ ase̱sɛ bwe̱e̱tɔ maa se̱ ba nu abware̱se̱ŋ, na ba kɔɔre̱ ba gyi.
      sbs: 0.5977
      gen_sec: 6.72
      ref_sec: 5.72
      cer: 0.1633
      wer: 0.6429
