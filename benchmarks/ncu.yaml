    bible_00172:
      source: bible
      text: Mo̱ a nu fe̱yɛ fo̱ gyi‑ana‑ɔ bo̱ko̱ a gya kase̱ŋtiŋ a e̱kpa‑ɔ se̱ fe̱yɛ ane̱ŋ ne̱ ane̱ se̱
