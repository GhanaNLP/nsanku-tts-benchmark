  entries:
    bible_00000:
      source: bible
      text: Mo̱ne̱ i ŋu mbo̱gya na de̱e̱kpa na e̱bɔɔre̱e̱ bwe̱e̱tɔ.
      sbs: 0.6936
      gen_sec: 2.72
      ref_sec: 4.72
