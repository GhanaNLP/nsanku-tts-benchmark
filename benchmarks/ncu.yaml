      text: Amo̱se̱‑ɔ ne̱ asoogyaa‑o a te̱ŋŋe̱ ife ne̱ kako̱re̱e̱gyii de‑ro‑o, ne̱ kako̱re̱e̱gyii‑o a
        se̱re̱ ka yii.
      sbs: 0.6508
      gen_sec: 6.88
      ref_sec: 7.52
      cer: 0.2059
      wer: 1.0
    bible_00017:
      source: bible
      text: Mfe̱ŋ ne̱ baa gyiiri bamo̱ e̱ko̱re̱e̱‑ɔ bo̱ be̱ya ke̱pare̱‑ɔ kideŋbe si, ne̱ baa yɔwe̱ ke̱tɔ
        ke̱maa, ne̱ baa gya Yeesuu si.
      sbs: 0.6859
      gen_sec: 8.24
      ref_sec: 8.94
      cer: 0.0122
      wer: 0.0476
    bible_00018:
      source: bible
      text: Fe̱yɛ ane̱ŋ ne̱ fo̱ fɔŋfɔŋ a ŋu‑o, a mo̱ŋ kyɔ ŋke kudu ŋnyɔ ne̱e̱ fe̱yɛ mo̱ a yɔ Yɛro̱salɛm
        a ŋ ya suŋ Wuribware̱ mò̱ suŋkpa mfe̱ŋ.
      sbs: 0.6704
      gen_sec: 7.52
      ref_sec: 8.7
      cer: 0.191
      wer: 0.6296
    bible_00019:
      source: bible
      text: Ne̱ Simeyɔŋ a yure bamo̱, ne̱ ɔɔ tɔwe̱ gywii Mariya fe̱yɛ,
      sbs: 0.6588
      gen_sec: 3.68
      ref_sec: 3.74
      cer: 0.0732
      wer: 0.3636
    bible_00020:
      source: bible
      text: Ne̱ Yeesuu a buruwaa tɔwe̱ gywii lamaŋ ne̱ ba nu mò̱ ase̱ŋ‑ɔ fe̱yɛ, “Mo̱ne̱ ya ŋu awo̱re̱
        a le̱e̱ kyɔwe̱ twɛɛkpa, amɔ mo̱ne̱ yɛ bware̱ e̱ kpa a ɔ ba, na kase̱ŋtiŋ ɔ ba.
      sbs: 0.6383
      gen_sec: 11.68
      ref_sec: 12.52
      cer: 0.0721
      wer: 0.1471
    bible_00021:
      source: bible
      text: Wuribware̱ so̱so̱ a ke̱laŋŋe̱rɔ‑ɔ e̱ laŋŋe̱ bamo̱ se̱, na bamo̱ aa Yeesuu e̱ tɔwe̱ ane̱ŋ ne̱
        a ya saŋ kafwe̱e̱ fe̱yɛ o wu Yɛro̱salɛm maŋ‑nɔ ane̱ŋ ne̱ Wuribware̱ a kra fe̱yɛ o wu‑o.
      sbs: 0.6496
      gen_sec: 11.2
      ref_sec: 13.04
      cer: 0.0331
      wer: 0.2727
    bible_00022:
      source: bible
      text: Saŋ ne̱ ane̱ a fo̱ Roma maŋ‑nɔ‑ɔ, ne̱ baa sa Pɔɔl kpa fe̱yɛ ɔ ya kye̱na mfe̱ŋ ne̱ ɔ kpa‑ɔ,
        amaa baa lee soogyaanyi ko̱ ne̱ ɔ de̱e̱re̱ mò̱ se̱, na ɔ ma nya se̱re̱‑ɔ.
      sbs: 0.6822
      gen_sec: 11.84
      ref_sec: 10.76
      cer: 0.0667
      wer: 0.2286
    bible_00023:
      source: bible
      text: Mò̱ duŋ maa fwii, ne̱ ɔ mo̱ŋ de ɔko̱ do̱ŋdaa.
      sbs: 0.6437
      gen_sec: 3.52
      ref_sec: 3.44
      cer: 0.2069
      wer: 0.7
    bible_00024:
      source: bible
      text: Saŋ ne̱ Feesitus a ba Kaye̱sare̱ya maŋ‑nɔ bo̱ gyi mfe̱ŋ a swe̱e̱re̱‑ɔ se̱ kigominaa‑o, ke̱mo̱
        ŋke nsa ne̱ ɔɔ le̱e̱ mfe̱ŋ yɔ Yɛro̱salɛm maŋ‑nɔ na ɔ ya ka Yudaa awuye agye̱ŋkpɛɛpo̱‑ɔ kanɔ.
      sbs: 0.6643
      gen_sec: 13.28
      ref_sec: 12.44
      cer: 0.0231
      wer: 0.1875
    bible_00025:
      source: bible
      text: Ne̱ ke̱yaafɔre̱ nyɔse̱po̱‑ɔ a ba mò̱ nyaŋpe̱‑ɔ akatɔ‑rɔ, ne̱ ɔɔ tɔwe̱ gywii mò̱ fe̱yɛ, ‘Mo̱
        nyaŋpe̱, ke̱e̱ siidii ŋkpe̱ŋ alafa anyɔ ne̱ fo̱ a taa bo̱ sa mo̱‑ɔ. Ŋkee be̱e̱ ke̱e̱ siidii ŋkpe̱ŋ
        alafa anyɔ ne̱ mo̱ a nya bo̱ tii si‑o.’
      sbs: 0.6519
      gen_sec: 16.24
      ref_sec: 13.7
      cer: 0.1879
      wer: 0.4048
    bible_00026:
      source: bible
      text: N gye̱ ane̱ŋ, bamo̱ akatɔ i buŋŋi a bo̱ ŋu atɔ,
      sbs: 0.7585
      gen_sec: 5.36
      ref_sec: 5.92
      cer: 0.129
      wer: 0.5455
    bible_00027:
      source: bible
      text: na bo̱ da mo̱ paara, na bo̱ mɔɔ mo̱. Amaa ke̱mo̱ ŋke nsa, mo̱ i kyiŋŋi a n le̱e̱ lowi‑ro.”
      sbs: 0.7339
      gen_sec: 7.12
      ref_sec: 5.8
      cer: 0.1964
      wer: 0.45
    bible_00028:
      source: bible
      text: Mo̱ne̱ ne̱ ako̱ŋ e̱ mɔɔ mo̱ne̱ mbe̱yɔmɔ‑ɔ, mo̱ne̱ de ŋyure,
      sbs: 0.6613
      gen_sec: 3.44
      ref_sec: 4.3
      cer: 0.1622
      wer: 0.4
    bible_00029:
      source: bible
      text: Ɔke̱maa maa taare̱ a o gyiiri amo̱‑ɔ ikii. Amo̱se̱ se̱‑ɔ mo̱nꞌ yuri e̱ye̱e̱, na mo̱ne̱ ma
        waa ke̱bɔye̱ ko̱.
      sbs: 0.695
      gen_sec: 6.32
      ref_sec: 7.06
      cer: 0.058
      wer: 0.3158
    bible_00030:
      source: bible
      text: Mo̱ e̱ kpa fe̱yɛ mo̱nꞌ lee mo̱ne̱ e̱ye̱e̱ le̱e̱ ase̱ŋ‑nɔ. Mbe̱yɔmɔ ɔnyare̱ ne̱ ɔ mo̱ŋ tɛɛ
        waare̱e̱‑ɔ, ane̱ nyaŋpe̱ a asuŋ‑o tiri mò̱, ne̱ ɔ le̱ŋ e̱ye̱e̱ fe̱yɛ ɔ waa ke̱tɔ ne̱ ki i gyi
        ane̱ nyaŋpe̱ akatɔ‑ɔ.
      sbs: 0.6473
      gen_sec: 12.32
      ref_sec: 13.52
      cer: 0.2403
      wer: 0.9211
    bible_00031:
      source: bible
      text: Amaa sa fo̱ kakye̱na‑rɔ na ke̱tɔ ke̱maa ne̱ fo̱ e̱ kaapo̱‑ɔ se̱. De̱e̱ kya se̱ gya e̱kpa mɔ
        se̱ keŋkeŋ, a le̱e̱ fe̱yɛ fo̱ ya waa ane̱ŋ, fo̱ e̱ mo̱rɔwe̱ fo̱ fɔŋfɔŋ e̱ye̱e̱ na bamo̱ ne̱ bo̱
        gya fo̱ kanɔ se̱‑ɔ.
      sbs: 0.6723
      gen_sec: 12.56
      ref_sec: 12.88
      cer: 0.0
      wer: 0.0
    bible_00032:
      source: bible
      text: A be̱e̱ a mo̱ŋ gye̱ fe̱yɛ ɔkye̱e̱ se̱ ne̱ Wuribware̱ a twe̱e̱ ɔnyare̱. Amaa ɔnyare̱ se̱ ne̱
        ɔɔ twe̱e̱ ɔkye̱e̱.
      sbs: 0.7058
      gen_sec: 6.24
      ref_sec: 6.24
      cer: 0.087
      wer: 0.45
    bible_00033:
      source: bible
      text: Ane̱ se̱sɛ dimaadi, ane̱ a gye̱ kaye̱‑rɔ ase̱sɛ‑ɔ se̱‑ɔ, ane̱ du ne̱e̱ fe̱yɛ mò̱ ne̱ ɔɔ le̱e̱
        e̱se̱‑rɔ ba‑ɔ. Bamo̱ ne̱ bo̱ gye̱ Wuribware̱ se̱ ase̱sɛ‑ɔ du ne̱e̱ fe̱yɛ mò̱ ne̱ ɔɔ le̱e̱ Wuribware̱
        se̱‑ɔ.
      sbs: 0.6789
      gen_sec: 12.8
      ref_sec: 13.28
      cer: 0.0244
      wer: 0.0857
    bible_00034:
      source: bible
      text: Ne̱ baa taa kawo̱re̱taa ko̱ bo̱ me̱ra Yeesuu aŋu si. Gominaa‑o a kyo̱rɛɛ kamo̱ se̱ fe̱yɛ,
        “Mo̱nꞌ ke̱e̱ Yeesuu, Yudaa awuye owure‑o.”
      sbs: 0.6357
      gen_sec: 8.88
      ref_sec: 12.76
      cer: 0.1333
      wer: 0.5455
    bible_00035:
      source: bible
      text: Ne̱ ɔɔ waa kakpo̱nɔ tɔwe̱ abware̱se̱ŋ ke̱bware̱ko̱re̱kyaŋ‑ɔ‑rɔ mfe̱ŋ. Saŋ ne̱ Prisikila na
        Akwila a nu mò̱ ase̱ŋ ne̱ ɔ tɔwe̱‑ɔ, ne̱ baa yaa mò̱ bamo̱ lɔŋ‑nɔ ya kaapo̱ mò̱ Wuribware̱
        a e̱kpa‑ɔ‑rɔ kyɛɛkyɛɛ.
      sbs: 0.6398
      gen_sec: 29.92
      ref_sec: 13.2
      cer: 1.7234
      wer: 3.4545
    bible_00036:
      source: bible
      text: Amo̱se̱ se̱‑ɔ, ane̱ i de ateese gyisɛ na atɔ buŋsɛ, a baare sa ane̱.
      sbs: 0.629
      gen_sec: 5.28
      ref_sec: 5.16
      cer: 0.1304
      wer: 0.5
    bible_00037:
      source: bible
      text: Amo̱se̱‑ɔ n gye̱ bamo̱ ne̱ bo̱ mo̱ŋ gye̱ e̱bɔye̱ awaapo̱‑ɔ se̱ ne̱ mo̱ a ba, amaa bamo̱ ne̱
        bo̱ gye̱ e̱bɔye̱ awaapo̱‑ɔ se̱ ne̱ mo̱ a ba, na m bo̱ tɔwe̱ gywii bamo̱ fe̱yɛ bo̱ nu bamo̱ e̱ye̱e̱
        kiŋŋi le̱e̱ bamo̱ e̱bɔye̱‑rɔ.”
      sbs: 0.6739
      gen_sec: 12.08
      ref_sec: 14.16
      cer: 0.3657
      wer: 0.4286
    bible_00038:
      source: bible
      text: Ane̱ŋ ne̱ ke̱kpa e̱ waa a ke̱ ba bamo̱ mbo̱ŋtɔ‑rɔ se̱, ne̱ ŋ yɛ fo̱ sa kanɔ a bo̱ yɔwe̱ ane̱ŋ
        a atɔ‑ɔ. Na bo̱ nya mfɛɛre̱ timaa abɛɛ se̱, na bo̱ lee mme‑ro kpa abɛɛ, na bamo̱ ko̱kɔɔre̱gyi
        nya waa ko̱kyɔ.
      sbs: 0.6636
      gen_sec: 14.56
      ref_sec: 10.3
      cer: 0.0602
      wer: 0.2857
    bible_00039:
      source: bible
      text: Ne̱ mo̱ne̱ a mɔɔ mò̱ ne̱ ɔɔ kaapo̱ ane̱ kpa ne̱ ane̱ e̱ gya se̱, na ane̱ nya ŋkpa na kukyure
        ne̱ a mo̱ŋ de kɛɛ‑ɔ. Amaa Wuribware̱ a kyiŋŋi mò̱ le̱e̱ lowi‑ro, ne̱ ane̱ pɛɛɛ a ŋu.
      sbs: 0.688
      gen_sec: 12.32
      ref_sec: 12.44
      cer: 0.0526
      wer: 0.1842
    bible_00040:
      source: bible
      text: Ke̱tɔ ne̱ ŋ nyi mbe̱yɔmɔ‑ɔ gye̱ kafwe̱e̱ ko̱ ne̱e̱.
      sbs: 0.6397
      gen_sec: 2.8
      ref_sec: 3.28
      cer: 0.3438
      wer: 0.8889
    bible_00041:
      source: bible
      text: Hare̱e̱ ba te̱ŋ fo̱ ko̱twe̱e̱tu bɛɛɛ bo̱ mo̱ŋ te̱ŋ ooo, a mo̱ŋ gye̱ atɔ ne̱ a tiri‑o. Ke̱tɔ
        ne̱ ki tiri‑o e̱ gye̱ fe̱yɛ fo̱ gya Wuribware̱ a mbraa‑ɔ se̱.
      sbs: 0.7345
      gen_sec: 10.56
      ref_sec: 8.96
      cer: 0.0515
      wer: 0.1667
    bible_00042:
      source: bible
      text: Ne̱ Yeesuu a kya se̱ bise fe̱yɛ, “Nte̱tɔ se̱ ne̱ mo̱ne̱ e̱ te̱e̱ mo̱ ɛ ‘Mo̱ nyaŋpe̱, mo̱ nyaŋpe̱,’
        na mo̱ne̱ mɔ mo̱ne̱ maa waa ke̱tɔ ne̱ mo̱ e̱ tɔwe̱ mo̱ i gywii mo̱ne̱‑ɔ ne̱e̱?
      sbs: 0.6508
      gen_sec: 10.24
      ref_sec: 10.3
      cer: 0.1048
      wer: 0.3143
    bible_00043:
      source: bible
      text: Mo̱ŋ kyo̱rɛɛ atɔ mɔ bo̱ waa mo̱ne̱ ipeere ne̱e̱. Amaa mo̱ a waa ne̱e̱ a m bo̱ yii mo̱ne̱ se̱
        fe̱yɛ mo̱ gyi‑ana ne̱ mo̱ e̱ kpa bamo̱ ase̱ŋ bwe̱e̱tɔ‑ɔ.
      sbs: 0.7025
      gen_sec: 9.6
      ref_sec: 8.6
      cer: 0.0645
      wer: 0.3
    bible_00044:
      source: bible
      text: Amo̱ kamɛɛ‑rɔ‑ɔ, ne̱ Yeesuu agyase̱po̱‑ɔ a ba mò̱ ase̱ keri si to̱ŋ ko̱ bo̱ bise mò̱ fe̱yɛ,
        “Nte̱tɔ se̱ ne̱ ane̱ mo̱ŋ taare̱ gya ibrisi amo̱‑ɔ ne̱e̱?”
      sbs: 0.643
      gen_sec: 9.84
      ref_sec: 11.54
      cer: 0.0316
      wer: 0.1111
    bible_00045:
      source: bible
      text: N gye̱ e̱paso̱wa adunyɔ ne̱ bo̱ de ba sɔɔ nte̱ye̱te̱ye̱ ŋnyɔ‑ɔ ɔɔɔ? Amaa mo̱ e̱ tɔwe̱ mo̱
        i gywii mo̱ne̱ fe̱yɛ kako̱ŋko̱ gbaa maa wu na mo̱ne̱ se̱ Wuribware̱ mo̱ŋ sure.
      sbs: 0.6338
      gen_sec: 11.44
      ref_sec: 9.8
      cer: 0.0536
      wer: 0.1613
    bible_00046:
      source: bible
      text: Kaye̱ ŋke‑o, ne̱ maŋ abre̱sɛ‑ɔ na Wuribware̱ alɔŋŋɔpo̱ abre̱sɛ‑ɔ na Wuribware̱ mbraa akaapo̱po̱‑ɔ
        a bo̱ gyaŋŋe̱, ne̱ baa baa Yeesuu bamo̱ akatɔ‑rɔ.
      sbs: 0.6314
      gen_sec: 12.16
      ref_sec: 12.08
      cer: 0.0762
      wer: 0.0909
    bible_00047:
      source: bible
      text: Ne̱ ane̱ŋ ne̱ Simeyɔŋ a tɔwe̱ bo̱ le̱e̱ kayaagyi‑o si‑o a kpe̱ŋ kayaagyi‑o mò̱ se̱ na mò̱
        nyi e̱ye̱e̱.
      sbs: 0.6406
      gen_sec: 7.28
      ref_sec: 7.38
      cer: 0.1212
      wer: 0.3158
    bible_00048:
      source: bible
      text: Ne̱ mò̱ aa mò̱ agyase̱po̱ amo̱ a kyo̱ŋ be̱e̱ yɔ kamaŋgyii ko̱ se̱.
      sbs: 0.6822
      gen_sec: 2.72
      ref_sec: 4.54
      cer: 0.1667
      wer: 0.8462
    bible_00049:
      source: bible
      text: Ne̱ baa tɔwe̱ abware̱se̱ŋ gywii mò̱ aa mò̱ lɔŋ‑nɔ awuye pɛɛɛ.
      sbs: 0.6551
      gen_sec: 4.08
      ref_sec: 3.34
      cer: 0.1395
      wer: 0.3636
    bible_00050:
      source: bible
      text: Amaa Peetroo na Yohanee a be̱ŋŋaa bamo̱ ne̱e̱ fe̱yɛ, “To, mbe̱yɔmɔ mo̱ne̱ fɔŋfɔŋ lee ke̱mo̱
        ne̱ ki bware Wuribware̱ ase̱‑ɔ, ane̱ bu mo̱ne̱, bɛɛɛ ane̱ bu Wuribware̱?
      sbs: 0.7367
      gen_sec: 12.72
      ref_sec: 11.16
      cer: 0.0265
      wer: 0.2593
    bible_00051:
      source: bible
      text: Atɔ mɔ a gye̱ ane̱ŋ‑ɔ se̱‑ɔ, a mo̱ŋ bware fe̱yɛ mo̱nꞌ kaapo̱ mo̱ne̱ e̱ye̱e̱. Abre̱sɛ ya tɔwe̱
        fe̱yɛ, “Yiisi kafo̱ŋfwe̱e̱ e̱ gye̱ ne̱ ɔ sa a bodobodoo pɛɛɛ tiŋ.”
      sbs: 0.7068
      gen_sec: 8.96
      ref_sec: 9.58
      cer: 0.0583
      wer: 0.2069
    bible_00052:
      source: bible
      text: O de mò̱ gyi‑ana mbregyii ana ne̱ Wuribware̱ a lee fe̱yɛ bo̱ kii mò̱ akyaamɛɛ bo̱ko̱, na
        bo̱ de̱e̱ tɔwe̱ ase̱ŋ ne̱ o lee ɔ kaapo̱ bamo̱‑ɔ gywii ase̱sɛ‑ɔ.
      sbs: 0.6824
      gen_sec: 9.68
      ref_sec: 11.58
      cer: 0.0583
      wer: 0.1379
    bible_00053:
      source: bible
      text: Ne̱ ɔɔ gye̱ bamo̱ ke̱gye̱ŋkpɛɛ yaa Kanaŋ swe̱e̱re̱ se̱, ne̱ oo kpuri nsuro nsunoo ase̱sɛ ne̱
        bo̱ te mfe̱ŋ‑ɔ, ne̱ ɔɔ taa bamo̱ swe̱e̱re̱ bo̱ kii ane̱ ade̱daapo̱‑ɔ lee.
      sbs: 0.6687
      gen_sec: 9.84
      ref_sec: 11.22
      cer: 0.2
      wer: 0.5517
    bible_00054:
      source: bible
      text: Ne̱ mò̱ ko̱dɔɔ a ɔde̱e̱re̱se̱po̱‑ɔ a be̱ŋŋaa mò̱ fe̱yɛ, ‘Mo̱ nyaŋpe̱, yɔwe̱ ke̱mo̱. Sa ke̱mo̱
        kasu ko̱ŋko̱ kpeŋ. Mo̱ i kwii a m bo̱ muruwaa ke̱mo̱ na n swii e̱naate̱ igyini bo̱ waa‑rɔ.
      sbs: 0.7277
      gen_sec: 13.44
      ref_sec: 14.84
      cer: 0.0684
      wer: 0.3636
    bible_00055:
      source: bible
      text: Bo̱ le̱e̱ fe̱yɛ Wuribware̱ mo̱ŋ te̱e̱ ane̱ ne̱e̱ fe̱yɛ ane̱ bo̱ waa kakye̱e̱kpa bɛɛɛ kanyare̱kpa.
        Amaa ɔɔ te̱e̱ ane̱ fe̱yɛ ane̱ bo̱ kii ase̱sɛ timaa ne̱ bo̱ mo̱ŋ de iyisi‑o.
      sbs: 0.6593
      gen_sec: 10.08
      ref_sec: 9.92
      cer: 0.0351
      wer: 0.1
    bible_00056:
      source: bible
      text: Ase̱sɛ mɔ, n gye̱ sa ne̱ baa bwe̱e̱ fe̱yɛ ane̱ŋ ne̱ mo̱ne̱ e̱ fa‑ɔ. Mbe̱yɔmɔ saŋ a gye̱ gye̱gyaye̱
        ne̱e̱, kyɔwe̱ mo̱ŋ tɛɛ daŋ.
      sbs: 0.6883
      gen_sec: 9.2
      ref_sec: 7.74
      cer: 0.0886
      wer: 0.375
    bible_00057:
      source: bible
      text: Ke̱tɔ se̱ ne̱ a mo̱ŋ waa bamo̱ kɔne̱ pɛɛɛ‑ɔ e̱ gye̱ fe̱yɛ mò̱ a tɔwe̱ fe̱yɛ bo̱ maa lɛɛ ŋu
        mò̱‑ɔ. Ne̱ baa yaa mò̱ ya bo̱ fo̱ mò̱ ko̱re̱e̱ ase̱.
      sbs: 0.6749
      gen_sec: 9.28
      ref_sec: 9.36
      cer: 0.1163
      wer: 0.4194
    bible_00058:
      source: bible
      text: Ne̱ Wuribware̱ alɔŋŋɔpo̱ abre̱sɛ‑ɔ na agyaŋŋe̱po̱‑ɔ pɛɛɛ a buwi kpa kanɔte̱ŋ ne̱ ba ye̱re̱
        se̱ na Yeesuu gyi ke̱pɔ a bo̱ nya mɔɔ mò̱‑ɔ.
      sbs: 0.6417
      gen_sec: 9.04
      ref_sec: 13.1
      cer: 0.0319
      wer: 0.3333
    bible_00059:
      source: bible
      text: Ape̱nnapo̱ amo̱ e̱ tɔwe̱ kaye̱‑rɔ ase̱ŋ wo̱re̱ ne̱e̱, a le̱e̱ fe̱yɛ bo̱ gye̱ kaye̱‑rɔ ase̱sɛ
        ne̱e̱. Ne̱ kaye̱‑rɔ ase̱sɛ gya bamo̱ ase̱ŋ se̱.
      sbs: 0.704
      gen_sec: 6.8
      ref_sec: 8.22
      cer: 0.0233
      wer: 0.087
    bible_00060:
      source: bible
