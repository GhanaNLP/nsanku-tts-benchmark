        le̱e̱ lowi‑ro, amɔ se̱sɛ‑ɔ e̱ nya kayo̱wɔre̱ po̱pwɛɛ, na mò̱ kra be̱e̱ bo̱ kye̱na kamo̱‑rɔ.
