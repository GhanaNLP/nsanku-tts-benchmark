    bible_00149:
      source: bible
      text: Asɔre̱e̱ asɔre̱e̱ ne̱ a bo̱ Asiya swe̱e̱re̱ se̱‑ɔ awuye e̱ ka mo̱ne̱ kanɔ. Akwila na Prisikila
        na asɔre̱e̱ agyi ne̱ ba gyaŋŋe̱ bamo̱ aye̱ ba waa asɔre̱e̱‑ɔ de ane̱ nyaŋpe̱ ba ka mo̱ne̱ kanɔ.
