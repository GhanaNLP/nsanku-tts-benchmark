      sbs: 0.7599
      gen_sec: 15.5
      ref_sec: 13.7
      cer: 0.1275
      wer: 0.5238
    bible_00026:
      source: bible
      text: N gye̱ ane̱ŋ, bamo̱ akatɔ i buŋŋi a bo̱ ŋu atɔ,
      sbs: 0.6879
