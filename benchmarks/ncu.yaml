  entries:
    bible_00000:
      source: bible
      text: Mo̱ne̱ i ŋu mbo̱gya na de̱e̱kpa na e̱bɔɔre̱e̱ bwe̱e̱tɔ.
      sbs: 0.66
      gen_sec: 3.75
      ref_sec: 4.72
      cer: 0.3056
      wer: 0.6667
    bible_00001:
      source: bible
      text: Kukyure kake ko̱ be̱e̱ ne̱ Yeesuu a be̱e̱ yɔ ke̱bware̱ko̱re̱kyaŋ‑nɔ ya kaapo̱ abware̱se̱ŋ.
        Saŋ amo̱‑ɔ ɔnyare̱ ko̱ mɔ bo̱ mfe̱ŋ na mò̱ kigyisesare̱e̱ a wu.
      sbs: 0.7408
      gen_sec: 11.43
      ref_sec: 13.68
      cer: 0.0476
      wer: 0.16
    bible_00002:
      source: bible
      text: Ne̱ Ɔbɔnsam ne̱ bo̱ be̱e̱ ba te̱e̱ mò̱ ɛ Ɔkyɔrɔpo̱‑ɔ a ba mò̱ ase̱. Ne̱ ɔ yɛ, “Fo̱ i nyi
        fe̱yɛ Wuribware̱ mò̱ gyi‑o e̱ gye̱ fo̱ kase̱ŋtiŋ, amo̱ fe̱raa sa a abu mɔ buruwi bodobodoo sa
        fo̱ a fo̱ gyi.”
      sbs: 0.6757
      gen_sec: 13.56
      ref_sec: 13.76
      cer: 0.1587
      wer: 0.3415
    bible_00003:
      source: bible
      text: Se̱sɛ ne̱ Wuribware̱ a kufwiiŋe‑o te mò̱ kakpo̱nɔ‑rɔ‑ɔ e̱ taare̱ a o nu atɔ mɔ pɛɛɛ kaase̱,
        amaa ɔko̱ ne̱ mò̱ kufwiiŋe‑o mo̱ŋ te mò̱‑rɔ‑ɔ maa taare̱ a o ŋu ke̱tɔ ne̱ ke̱ bo̱ ane̱ŋ a se̱sɛ‑ɔ
        kakpo̱nɔ‑rɔ‑ɔ.
      sbs: 0.7489
      gen_sec: 15.61
      ref_sec: 12.54
      cer: 0.1111
      wer: 0.4474
    bible_00004:
      source: bible
      text: Mo̱ e̱ tɔwe̱ mo̱ i gywii mo̱ne̱ fe̱yɛ fo̱ i di tiikpa mfe̱ŋ ane̱ŋ‑aaa bo̱ fo̱ saŋ ne̱ fo̱
        e̱ ka fo̱ ko̱kɔ a fo̱ lo̱we̱‑ɔ, na paso̱wa gbaa mo̱ŋ saŋ‑ɔ.”
      sbs: 0.7644
      gen_sec: 10.33
      ref_sec: 11.62
      cer: 0.0978
      wer: 0.1935
    bible_00005:
      source: bible
      text: Saŋ ne̱ Yeesuu e̱ tɔwe̱ amo̱‑ɔ, ne̱ kabɔɔ ko̱ a le̱e̱ Yayerus a lɔŋ‑ɔ‑rɔ bo̱ tɔwe̱ gywii Yayerus
        fe̱yɛ, “Fo̱ kakye̱e̱sɛɛ‑ɔ a wu, amo̱se̱‑ɔ fo̱ ma lɛɛ sa a ɔkaapo̱po̱‑ɔ kpo̱ne̱ mò̱ e̱ye̱e̱.”
      sbs: 0.7114
      gen_sec: 13.56
      ref_sec: 14.06
      cer: 0.0667
      wer: 0.1818
    bible_00006:
      source: bible
      text: Ne̱ Yeesuu yɛ, “Mo̱ne̱ ya ko̱re̱ Wuribware̱ atɔ, mo̱ne̱ e̱ nya ke̱tɔ ne̱ mo̱ne̱ e̱ kpa‑ɔ.
        Mo̱ne̱ ya buwi kpa Wuribware̱ a e̱kpa‑ɔ, mo̱ne̱ i ŋu ke̱tɔ ne̱ mo̱ne̱ e̱ kpa‑ɔ. Mo̱ne̱ ya ye̱re̱
        kawu te̱e̱ mò̱, ɔ taye̱ po̱ne̱‑ɔ, na mo̱nꞌ nya lweero.
      sbs: 0.8047
      gen_sec: 16.72
      ref_sec: 14.48
      cer: 0.0805
      wer: 0.1591
    bible_00007:
      source: bible
      text: Ne̱ agyase̱po̱ anyɔ amo̱ a ya waa ane̱ŋ ne̱ Yeesuu a tɔwe̱ gywii bamo̱ fe̱yɛ bo̱ waa‑ɔ.
      sbs: 0.7178
      gen_sec: 6.14
      ref_sec: 6.42
      cer: 0.0847
      wer: 0.1176
    bible_00008:
      source: bible
      text: Amaa ke̱tɔ ko̱ e̱ bo̱‑rɔ na ko̱ kyɔ ne̱ mo̱ne̱ e̱ kpa fe̱raa, amɔ mo̱nꞌ lɔŋŋɔ mfe̱ŋ ne̱ maŋ
        agyi e̱ gyaŋŋe̱ ba waa mbraa ba sa maŋ‑ɔ.
      sbs: 0.7185
      gen_sec: 9.73
      ref_sec: 9.98
      cer: 0.0575
      wer: 0.2143
    bible_00009:
      source: bible
      text: Amo̱ fe̱raa, bamo̱ ne̱ bo̱ mo̱ŋ gye̱ Yudaa awuye‑o a nu ane̱ŋ‑ɔ, ne̱ baa kyo̱rɔ ke̱tɔ ne̱
        Wuribware̱ a tɔwe̱‑ɔ. Ne̱ bamo̱ ne̱ Wuribware̱ a kyɔ lee fe̱yɛ bo̱ nya ŋkpa na kukyure ne̱ a mo̱ŋ
        de kɛɛ‑ɔ a kii Yeesuu akɔɔre̱gyipo̱.
      sbs: 0.7319
      gen_sec: 16.72
      ref_sec: 12.4
      cer: 0.3576
      wer: 0.381
    bible_00010:
      source: bible
      text: Bo̱ le̱e̱ fe̱yɛ ɔke̱maa ne̱ o bu mò̱ e̱ye̱e̱ ke̱dabe̱‑ɔ, mò̱ ne̱ Wuribware̱ e̱ baa kaase̱.
        Ne̱ ɔke̱maa mɔ ne̱ ɔ baa mò̱ e̱ye̱e̱ kaase̱‑ɔ, Wuribware̱ e̱ sa mò̱ ke̱dabe̱.”
      sbs: 0.7765
      gen_sec: 11.18
      ref_sec: 11.36
      cer: 0.0971
      wer: 0.4667
    bible_00011:
      source: bible
      text: Mo̱ne̱ a mo̱ŋ taare̱ ba kase̱ŋtiŋ bo̱ kra kaye̱‑rɔ atɔ timaa‑o, e̱me̱ne̱ ne̱ Wuribware̱ e̱
        waa na ɔ taa so̱so̱ a atɔ timaa kase̱ŋtiŋ‑o bo̱ sa mo̱ne̱ a mo̱nꞌ kra?
      sbs: 0.7318
      gen_sec: 11.86
      ref_sec: 9.82
      cer: 0.0561
      wer: 0.2
    bible_00012:
      source: bible
      text: Amo̱se̱‑ɔ, mbe̱yɔmɔ, mo̱nꞌ nare̱ me̱naŋ me̱naŋ ya tɔwe̱ gywii mò̱ agyase̱po̱‑ɔ fe̱yɛ Wuribware̱
        a kyiŋŋi mò̱ le̱e̱ lowi‑ro, ne̱ mbe̱yɔmɔ ɔ gye̱ bamo̱ ŋkpɛɛ o yii Galile̱ya swe̱e̱re̱ se̱. Mfe̱ŋ‑ɔ
        ba ŋu mò̱. Mo̱ ase̱ŋ a lo̱we̱.”
      sbs: 0.6779
      gen_sec: 16.8
      ref_sec: 14.02
      cer: 0.0878
      wer: 0.2432
    bible_00013:
      source: bible
      text: Ane̱ Kristoo ayaa‑rɔ aye̱re̱po̱ fe̱raa, m be̱e̱ mo̱ e̱ tɔwe̱ fe̱yɛ ane̱ de te̱maa bwe̱e̱tɔ,
        ne̱ ane̱ e̱ yo̱rɔwe̱ bwe̱e̱tɔ fe̱yɛ ane̱ yɔwe̱ ane̱ ŋyo̱wɔre̱ bo̱ sii swe̱e̱re̱ mɔ se̱, na ane̱
        yɔ pe̱ ane̱ nyaŋpe̱ Yeesuu ase̱.
      sbs: 0.7352
      gen_sec: 15.27
      ref_sec: 13.92
      cer: 0.0429
      wer: 0.1053
    bible_00014:
      source: bible
      text: Bamo̱ ya waa amo̱‑ɔ, ba nya ko̱tɔko̱ a bo̱ bo̱ be̱ya sa bamo̱ e̱ye̱e̱, n gye̱ atanne̱ fe̱raa
        ne̱e̱, amaa a gye̱ kapo̱tɛɛ ne̱ ba ye̱re̱ se̱ a bo̱ bo̱ nya ŋkpa na kukyure ne̱ a mo̱ŋ de kɛɛ‑ɔ
        kase̱ŋtiŋ.
      sbs: 0.723
      gen_sec: 14.07
      ref_sec: 13.18
      cer: 0.0472
      wer: 0.1
    bible_00015:
      source: bible
      text: Saŋ ne̱ bo̱ maa se̱ ba saŋŋe̱ kuruma‑o, ne̱ mò̱ wuye‑ana a bise fe̱yɛ, “Nte̱tɔ se̱ ne̱ mo̱ne̱
        e̱ saŋŋe̱ kuruma‑o?”
      sbs: 0.7047
      gen_sec: 8.45
      ref_sec: 5.78
      cer: 0.1944
      wer: 0.3333
    bible_00016:
      source: bible
      text: Amo̱se̱‑ɔ ne̱ asoogyaa‑o a te̱ŋŋe̱ ife ne̱ kako̱re̱e̱gyii de‑ro‑o, ne̱ kako̱re̱e̱gyii‑o a
        se̱re̱ ka yii.
      sbs: 0.7107
      gen_sec: 7.59
      ref_sec: 7.52
      cer: 0.3382
      wer: 0.6
    bible_00017:
      source: bible
      text: Mfe̱ŋ ne̱ baa gyiiri bamo̱ e̱ko̱re̱e̱‑ɔ bo̱ be̱ya ke̱pare̱‑ɔ kideŋbe si, ne̱ baa yɔwe̱ ke̱tɔ
        ke̱maa, ne̱ baa gya Yeesuu si.
      sbs: 0.747
      gen_sec: 8.87
      ref_sec: 8.94
      cer: 0.061
      wer: 0.1429
    bible_00018:
      source: bible
      text: Fe̱yɛ ane̱ŋ ne̱ fo̱ fɔŋfɔŋ a ŋu‑o, a mo̱ŋ kyɔ ŋke kudu ŋnyɔ ne̱e̱ fe̱yɛ mo̱ a yɔ Yɛro̱salɛm
        a ŋ ya suŋ Wuribware̱ mò̱ suŋkpa mfe̱ŋ.
      sbs: 0.742
      gen_sec: 10.5
      ref_sec: 8.7
      cer: 0.0337
      wer: 0.2222
    bible_00019:
      source: bible
      text: Ne̱ Simeyɔŋ a yure bamo̱, ne̱ ɔɔ tɔwe̱ gywii Mariya fe̱yɛ,
      sbs: 0.6759
      gen_sec: 4.35
      ref_sec: 3.74
      cer: 0.2195
      wer: 0.5455
    bible_00020:
      source: bible
      text: Ne̱ Yeesuu a buruwaa tɔwe̱ gywii lamaŋ ne̱ ba nu mò̱ ase̱ŋ‑ɔ fe̱yɛ, “Mo̱ne̱ ya ŋu awo̱re̱
        a le̱e̱ kyɔwe̱ twɛɛkpa, amɔ mo̱ne̱ yɛ bware̱ e̱ kpa a ɔ ba, na kase̱ŋtiŋ ɔ ba.
      sbs: 0.7394
      gen_sec: 12.29
      ref_sec: 12.52
      cer: 0.036
      wer: 0.1176
    bible_00021:
      source: bible
      text: Wuribware̱ so̱so̱ a ke̱laŋŋe̱rɔ‑ɔ e̱ laŋŋe̱ bamo̱ se̱, na bamo̱ aa Yeesuu e̱ tɔwe̱ ane̱ŋ ne̱
        a ya saŋ kafwe̱e̱ fe̱yɛ o wu Yɛro̱salɛm maŋ‑nɔ ane̱ŋ ne̱ Wuribware̱ a kra fe̱yɛ o wu‑o.
      sbs: 0.7377
      gen_sec: 13.74
      ref_sec: 13.04
      cer: 0.0
      wer: 0.0
    bible_00022:
      source: bible
      text: Saŋ ne̱ ane̱ a fo̱ Roma maŋ‑nɔ‑ɔ, ne̱ baa sa Pɔɔl kpa fe̱yɛ ɔ ya kye̱na mfe̱ŋ ne̱ ɔ kpa‑ɔ,
        amaa baa lee soogyaanyi ko̱ ne̱ ɔ de̱e̱re̱ mò̱ se̱, na ɔ ma nya se̱re̱‑ɔ.
      sbs: 0.7739
      gen_sec: 11.78
      ref_sec: 10.76
      cer: 0.0952
      wer: 0.2286
    bible_00023:
      source: bible
      text: Mò̱ duŋ maa fwii, ne̱ ɔ mo̱ŋ de ɔko̱ do̱ŋdaa.
      sbs: 0.7195
      gen_sec: 3.41
      ref_sec: 3.44
      cer: 0.1724
      wer: 0.7
    bible_00024:
      source: bible
      text: Saŋ ne̱ Feesitus a ba Kaye̱sare̱ya maŋ‑nɔ bo̱ gyi mfe̱ŋ a swe̱e̱re̱‑ɔ se̱ kigominaa‑o, ke̱mo̱
        ŋke nsa ne̱ ɔɔ le̱e̱ mfe̱ŋ yɔ Yɛro̱salɛm maŋ‑nɔ na ɔ ya ka Yudaa awuye agye̱ŋkpɛɛpo̱‑ɔ kanɔ.
      sbs: 0.681
      gen_sec: 14.76
      ref_sec: 12.44
      cer: 0.1154
      wer: 0.3438
    bible_00025:
      source: bible
      text: Ne̱ ke̱yaafɔre̱ nyɔse̱po̱‑ɔ a ba mò̱ nyaŋpe̱‑ɔ akatɔ‑rɔ, ne̱ ɔɔ tɔwe̱ gywii mò̱ fe̱yɛ, ‘Mo̱
        nyaŋpe̱, ke̱e̱ siidii ŋkpe̱ŋ alafa anyɔ ne̱ fo̱ a taa bo̱ sa mo̱‑ɔ. Ŋkee be̱e̱ ke̱e̱ siidii ŋkpe̱ŋ
        alafa anyɔ ne̱ mo̱ a nya bo̱ tii si‑o.’
      sbs: 0.7166
      gen_sec: 17.15
      ref_sec: 13.7
      cer: 0.0604
      wer: 0.1905
    bible_00026:
      source: bible
      text: N gye̱ ane̱ŋ, bamo̱ akatɔ i buŋŋi a bo̱ ŋu atɔ,
      sbs: 0.709
      gen_sec: 3.67
      ref_sec: 5.92
      cer: 0.2903
      wer: 0.5455
    bible_00027:
      source: bible
      text: na bo̱ da mo̱ paara, na bo̱ mɔɔ mo̱. Amaa ke̱mo̱ ŋke nsa, mo̱ i kyiŋŋi a n le̱e̱ lowi‑ro.”
      sbs: 0.7696
      gen_sec: 6.57
      ref_sec: 5.8
      cer: 0.1786
      wer: 0.35
    bible_00028:
      source: bible
      text: Mo̱ne̱ ne̱ ako̱ŋ e̱ mɔɔ mo̱ne̱ mbe̱yɔmɔ‑ɔ, mo̱ne̱ de ŋyure,
      sbs: 0.6873
      gen_sec: 4.27
      ref_sec: 4.3
      cer: 0.1081
      wer: 0.3
    bible_00029:
      source: bible
      text: Ɔke̱maa maa taare̱ a o gyiiri amo̱‑ɔ ikii. Amo̱se̱ se̱‑ɔ mo̱nꞌ yuri e̱ye̱e̱, na mo̱ne̱ ma
        waa ke̱bɔye̱ ko̱.
      sbs: 0.7087
      gen_sec: 7.34
      ref_sec: 7.06
      cer: 0.2899
      wer: 0.5789
    bible_00030:
      source: bible
      text: Mo̱ e̱ kpa fe̱yɛ mo̱nꞌ lee mo̱ne̱ e̱ye̱e̱ le̱e̱ ase̱ŋ‑nɔ. Mbe̱yɔmɔ ɔnyare̱ ne̱ ɔ mo̱ŋ tɛɛ
        waare̱e̱‑ɔ, ane̱ nyaŋpe̱ a asuŋ‑o tiri mò̱, ne̱ ɔ le̱ŋ e̱ye̱e̱ fe̱yɛ ɔ waa ke̱tɔ ne̱ ki i gyi
        ane̱ nyaŋpe̱ akatɔ‑ɔ.
      sbs: 0.7534
      gen_sec: 14.67
      ref_sec: 13.52
      cer: 0.1085
      wer: 0.2632
    bible_00031:
      source: bible
      text: Amaa sa fo̱ kakye̱na‑rɔ na ke̱tɔ ke̱maa ne̱ fo̱ e̱ kaapo̱‑ɔ se̱. De̱e̱ kya se̱ gya e̱kpa mɔ
        se̱ keŋkeŋ, a le̱e̱ fe̱yɛ fo̱ ya waa ane̱ŋ, fo̱ e̱ mo̱rɔwe̱ fo̱ fɔŋfɔŋ e̱ye̱e̱ na bamo̱ ne̱ bo̱
        gya fo̱ kanɔ se̱‑ɔ.
      sbs: 0.7189
      gen_sec: 14.33
      ref_sec: 12.88
      cer: 0.1094
      wer: 0.2439
    bible_00032:
      source: bible
      text: A be̱e̱ a mo̱ŋ gye̱ fe̱yɛ ɔkye̱e̱ se̱ ne̱ Wuribware̱ a twe̱e̱ ɔnyare̱. Amaa ɔnyare̱ se̱ ne̱
        ɔɔ twe̱e̱ ɔkye̱e̱.
      sbs: 0.7177
      gen_sec: 7.25
      ref_sec: 6.24
      cer: 0.0435
      wer: 0.2
    bible_00033:
      source: bible
      text: Ane̱ se̱sɛ dimaadi, ane̱ a gye̱ kaye̱‑rɔ ase̱sɛ‑ɔ se̱‑ɔ, ane̱ du ne̱e̱ fe̱yɛ mò̱ ne̱ ɔɔ le̱e̱
        e̱se̱‑rɔ ba‑ɔ. Bamo̱ ne̱ bo̱ gye̱ Wuribware̱ se̱ ase̱sɛ‑ɔ du ne̱e̱ fe̱yɛ mò̱ ne̱ ɔɔ le̱e̱ Wuribware̱
        se̱‑ɔ.
      sbs: 0.7275
      gen_sec: 13.73
      ref_sec: 13.28
      cer: 0.0325
      wer: 0.1143
    bible_00034:
      source: bible
      text: Ne̱ baa taa kawo̱re̱taa ko̱ bo̱ me̱ra Yeesuu aŋu si. Gominaa‑o a kyo̱rɛɛ kamo̱ se̱ fe̱yɛ,
        “Mo̱nꞌ ke̱e̱ Yeesuu, Yudaa awuye owure‑o.”
      sbs: 0.6754
      gen_sec: 9.81
      ref_sec: 12.76
      cer: 0.1
      wer: 0.4091
    bible_00035:
      source: bible
      text: Ne̱ ɔɔ waa kakpo̱nɔ tɔwe̱ abware̱se̱ŋ ke̱bware̱ko̱re̱kyaŋ‑ɔ‑rɔ mfe̱ŋ. Saŋ ne̱ Prisikila na
        Akwila a nu mò̱ ase̱ŋ ne̱ ɔ tɔwe̱‑ɔ, ne̱ baa yaa mò̱ bamo̱ lɔŋ‑nɔ ya kaapo̱ mò̱ Wuribware̱
        a e̱kpa‑ɔ‑rɔ kyɛɛkyɛɛ.
      sbs: 0.7217
      gen_sec: 16.21
      ref_sec: 13.2
      cer: 0.0355
      wer: 0.1515
    bible_00036:
      source: bible
      text: Amo̱se̱ se̱‑ɔ, ane̱ i de ateese gyisɛ na atɔ buŋsɛ, a baare sa ane̱.
      sbs: 0.7148
      gen_sec: 5.12
      ref_sec: 5.16
      cer: 0.1087
      wer: 0.5
    bible_00037:
      source: bible
      text: Amo̱se̱‑ɔ n gye̱ bamo̱ ne̱ bo̱ mo̱ŋ gye̱ e̱bɔye̱ awaapo̱‑ɔ se̱ ne̱ mo̱ a ba, amaa bamo̱ ne̱
        bo̱ gye̱ e̱bɔye̱ awaapo̱‑ɔ se̱ ne̱ mo̱ a ba, na m bo̱ tɔwe̱ gywii bamo̱ fe̱yɛ bo̱ nu bamo̱ e̱ye̱e̱
        kiŋŋi le̱e̱ bamo̱ e̱bɔye̱‑rɔ.”
      sbs: 0.7392
      gen_sec: 14.59
      ref_sec: 14.16
      cer: 0.0224
      wer: 0.0714
    bible_00038:
      source: bible
      text: Ane̱ŋ ne̱ ke̱kpa e̱ waa a ke̱ ba bamo̱ mbo̱ŋtɔ‑rɔ se̱, ne̱ ŋ yɛ fo̱ sa kanɔ a bo̱ yɔwe̱ ane̱ŋ
        a atɔ‑ɔ. Na bo̱ nya mfɛɛre̱ timaa abɛɛ se̱, na bo̱ lee mme‑ro kpa abɛɛ, na bamo̱ ko̱kɔɔre̱gyi
        nya waa ko̱kyɔ.
      sbs: 0.71
      gen_sec: 14.93
      ref_sec: 10.3
      cer: 0.0827
      wer: 0.1429
    bible_00039:
      source: bible
      text: Ne̱ mo̱ne̱ a mɔɔ mò̱ ne̱ ɔɔ kaapo̱ ane̱ kpa ne̱ ane̱ e̱ gya se̱, na ane̱ nya ŋkpa na kukyure
        ne̱ a mo̱ŋ de kɛɛ‑ɔ. Amaa Wuribware̱ a kyiŋŋi mò̱ le̱e̱ lowi‑ro, ne̱ ane̱ pɛɛɛ a ŋu.
      sbs: 0.7483
      gen_sec: 12.71
      ref_sec: 12.44
      cer: 0.0526
      wer: 0.0789
    bible_00040:
      source: bible
      text: Ke̱tɔ ne̱ ŋ nyi mbe̱yɔmɔ‑ɔ gye̱ kafwe̱e̱ ko̱ ne̱e̱.
      sbs: 0.7025
      gen_sec: 3.41
      ref_sec: 3.28
      cer: 0.25
      wer: 0.5556
    bible_00041:
      source: bible
      text: Hare̱e̱ ba te̱ŋ fo̱ ko̱twe̱e̱tu bɛɛɛ bo̱ mo̱ŋ te̱ŋ ooo, a mo̱ŋ gye̱ atɔ ne̱ a tiri‑o. Ke̱tɔ
        ne̱ ki tiri‑o e̱ gye̱ fe̱yɛ fo̱ gya Wuribware̱ a mbraa‑ɔ se̱.
      sbs: 0.7698
      gen_sec: 10.67
      ref_sec: 8.96
      cer: 0.0619
      wer: 0.1333
    bible_00042:
      source: bible
      text: Ne̱ Yeesuu a kya se̱ bise fe̱yɛ, “Nte̱tɔ se̱ ne̱ mo̱ne̱ e̱ te̱e̱ mo̱ ɛ ‘Mo̱ nyaŋpe̱, mo̱ nyaŋpe̱,’
        na mo̱ne̱ mɔ mo̱ne̱ maa waa ke̱tɔ ne̱ mo̱ e̱ tɔwe̱ mo̱ i gywii mo̱ne̱‑ɔ ne̱e̱?
      sbs: 0.7578
      gen_sec: 11.35
      ref_sec: 10.3
      cer: 0.0476
      wer: 0.1429
    bible_00043:
      source: bible
      text: Mo̱ŋ kyo̱rɛɛ atɔ mɔ bo̱ waa mo̱ne̱ ipeere ne̱e̱. Amaa mo̱ a waa ne̱e̱ a m bo̱ yii mo̱ne̱ se̱
        fe̱yɛ mo̱ gyi‑ana ne̱ mo̱ e̱ kpa bamo̱ ase̱ŋ bwe̱e̱tɔ‑ɔ.
      sbs: 0.7316
      gen_sec: 9.98
      ref_sec: 8.6
      cer: 0.0968
      wer: 0.2667
    bible_00044:
      source: bible
      text: Amo̱ kamɛɛ‑rɔ‑ɔ, ne̱ Yeesuu agyase̱po̱‑ɔ a ba mò̱ ase̱ keri si to̱ŋ ko̱ bo̱ bise mò̱ fe̱yɛ,
        “Nte̱tɔ se̱ ne̱ ane̱ mo̱ŋ taare̱ gya ibrisi amo̱‑ɔ ne̱e̱?”
      sbs: 0.6705
      gen_sec: 10.41
      ref_sec: 11.54
      cer: 0.1789
      wer: 0.2222
    bible_00045:
      source: bible
      text: N gye̱ e̱paso̱wa adunyɔ ne̱ bo̱ de ba sɔɔ nte̱ye̱te̱ye̱ ŋnyɔ‑ɔ ɔɔɔ? Amaa mo̱ e̱ tɔwe̱ mo̱
        i gywii mo̱ne̱ fe̱yɛ kako̱ŋko̱ gbaa maa wu na mo̱ne̱ se̱ Wuribware̱ mo̱ŋ sure.
      sbs: 0.7218
      gen_sec: 11.86
      ref_sec: 9.8
      cer: 0.1607
      wer: 0.3871
    bible_00046:
      source: bible
      text: Kaye̱ ŋke‑o, ne̱ maŋ abre̱sɛ‑ɔ na Wuribware̱ alɔŋŋɔpo̱ abre̱sɛ‑ɔ na Wuribware̱ mbraa akaapo̱po̱‑ɔ
        a bo̱ gyaŋŋe̱, ne̱ baa baa Yeesuu bamo̱ akatɔ‑rɔ.
      sbs: 0.785
      gen_sec: 12.12
      ref_sec: 12.08
      cer: 0.1048
      wer: 0.1818
    bible_00047:
      source: bible
      text: Ne̱ ane̱ŋ ne̱ Simeyɔŋ a tɔwe̱ bo̱ le̱e̱ kayaagyi‑o si‑o a kpe̱ŋ kayaagyi‑o mò̱ se̱ na mò̱
        nyi e̱ye̱e̱.
      sbs: 0.7033
      gen_sec: 7.25
      ref_sec: 7.38
      cer: 0.1212
      wer: 0.2632
    bible_00048:
      source: bible
      text: Ne̱ mò̱ aa mò̱ agyase̱po̱ amo̱ a kyo̱ŋ be̱e̱ yɔ kamaŋgyii ko̱ se̱.
      sbs: 0.6877
      gen_sec: 4.35
      ref_sec: 4.54
      cer: 0.0476
      wer: 0.1538
    bible_00049:
      source: bible
      text: Ne̱ baa tɔwe̱ abware̱se̱ŋ gywii mò̱ aa mò̱ lɔŋ‑nɔ awuye pɛɛɛ.
      sbs: 0.6728
      gen_sec: 4.69
      ref_sec: 3.34
      cer: 0.2093
      wer: 0.7273
    bible_00050:
      source: bible
      text: Amaa Peetroo na Yohanee a be̱ŋŋaa bamo̱ ne̱e̱ fe̱yɛ, “To, mbe̱yɔmɔ mo̱ne̱ fɔŋfɔŋ lee ke̱mo̱
        ne̱ ki bware Wuribware̱ ase̱‑ɔ, ane̱ bu mo̱ne̱, bɛɛɛ ane̱ bu Wuribware̱?
      sbs: 0.7684
      gen_sec: 12.63
      ref_sec: 11.16
      cer: 0.0265
      wer: 0.1111
    bible_00051:
      source: bible
      text: Atɔ mɔ a gye̱ ane̱ŋ‑ɔ se̱‑ɔ, a mo̱ŋ bware fe̱yɛ mo̱nꞌ kaapo̱ mo̱ne̱ e̱ye̱e̱. Abre̱sɛ ya tɔwe̱
        fe̱yɛ, “Yiisi kafo̱ŋfwe̱e̱ e̱ gye̱ ne̱ ɔ sa a bodobodoo pɛɛɛ tiŋ.”
      sbs: 0.7642
      gen_sec: 11.26
      ref_sec: 9.58
      cer: 0.0777
      wer: 0.2069
    bible_00052:
      source: bible
      text: O de mò̱ gyi‑ana mbregyii ana ne̱ Wuribware̱ a lee fe̱yɛ bo̱ kii mò̱ akyaamɛɛ bo̱ko̱, na
        bo̱ de̱e̱ tɔwe̱ ase̱ŋ ne̱ o lee ɔ kaapo̱ bamo̱‑ɔ gywii ase̱sɛ‑ɔ.
      sbs: 0.7516
      gen_sec: 10.84
      ref_sec: 11.58
      cer: 0.068
      wer: 0.2414
    bible_00053:
      source: bible
      text: Ne̱ ɔɔ gye̱ bamo̱ ke̱gye̱ŋkpɛɛ yaa Kanaŋ swe̱e̱re̱ se̱, ne̱ oo kpuri nsuro nsunoo ase̱sɛ ne̱
        bo̱ te mfe̱ŋ‑ɔ, ne̱ ɔɔ taa bamo̱ swe̱e̱re̱ bo̱ kii ane̱ ade̱daapo̱‑ɔ lee.
      sbs: 0.7421
      gen_sec: 11.86
      ref_sec: 11.22
      cer: 0.1455
      wer: 0.4138
    bible_00054:
      source: bible
      text: Ne̱ mò̱ ko̱dɔɔ a ɔde̱e̱re̱se̱po̱‑ɔ a be̱ŋŋaa mò̱ fe̱yɛ, ‘Mo̱ nyaŋpe̱, yɔwe̱ ke̱mo̱. Sa ke̱mo̱
        kasu ko̱ŋko̱ kpeŋ. Mo̱ i kwii a m bo̱ muruwaa ke̱mo̱ na n swii e̱naate̱ igyini bo̱ waa‑rɔ.
      sbs: 0.7552
      gen_sec: 13.31
      ref_sec: 14.84
      cer: 0.1197
      wer: 0.4545
    bible_00055:
      source: bible
      text: Bo̱ le̱e̱ fe̱yɛ Wuribware̱ mo̱ŋ te̱e̱ ane̱ ne̱e̱ fe̱yɛ ane̱ bo̱ waa kakye̱e̱kpa bɛɛɛ kanyare̱kpa.
        Amaa ɔɔ te̱e̱ ane̱ fe̱yɛ ane̱ bo̱ kii ase̱sɛ timaa ne̱ bo̱ mo̱ŋ de iyisi‑o.
      sbs: 0.743
      gen_sec: 12.2
      ref_sec: 9.92
      cer: 0.2456
      wer: 0.3333
    bible_00056:
      source: bible
      text: Ase̱sɛ mɔ, n gye̱ sa ne̱ baa bwe̱e̱ fe̱yɛ ane̱ŋ ne̱ mo̱ne̱ e̱ fa‑ɔ. Mbe̱yɔmɔ saŋ a gye̱ gye̱gyaye̱
        ne̱e̱, kyɔwe̱ mo̱ŋ tɛɛ daŋ.
      sbs: 0.7384
      gen_sec: 8.62
      ref_sec: 7.74
      cer: 0.0127
      wer: 0.0417
    bible_00057:
      source: bible
      text: Ke̱tɔ se̱ ne̱ a mo̱ŋ waa bamo̱ kɔne̱ pɛɛɛ‑ɔ e̱ gye̱ fe̱yɛ mò̱ a tɔwe̱ fe̱yɛ bo̱ maa lɛɛ ŋu
        mò̱‑ɔ. Ne̱ baa yaa mò̱ ya bo̱ fo̱ mò̱ ko̱re̱e̱ ase̱.
      sbs: 0.73
      gen_sec: 9.3
      ref_sec: 9.36
      cer: 0.0465
      wer: 0.1613
    bible_00058:
      source: bible
      text: Ne̱ Wuribware̱ alɔŋŋɔpo̱ abre̱sɛ‑ɔ na agyaŋŋe̱po̱‑ɔ pɛɛɛ a buwi kpa kanɔte̱ŋ ne̱ ba ye̱re̱
        se̱ na Yeesuu gyi ke̱pɔ a bo̱ nya mɔɔ mò̱‑ɔ.
      sbs: 0.7041
      gen_sec: 10.33
      ref_sec: 13.1
      cer: 0.0638
      wer: 0.5
    bible_00059:
      source: bible
      text: Ape̱nnapo̱ amo̱ e̱ tɔwe̱ kaye̱‑rɔ ase̱ŋ wo̱re̱ ne̱e̱, a le̱e̱ fe̱yɛ bo̱ gye̱ kaye̱‑rɔ ase̱sɛ
        ne̱e̱. Ne̱ kaye̱‑rɔ ase̱sɛ gya bamo̱ ase̱ŋ se̱.
      sbs: 0.7691
      gen_sec: 9.39
      ref_sec: 8.22
      cer: 0.0116
      wer: 0.0435
    bible_00060:
      source: bible
      text: Ke̱mo̱ kaye̱ ŋke‑o ne̱ baa fo̱ Kaye̱sare̱ya maŋ‑nɔ kyɔ ya to̱ fe̱yɛ Kooniiliyus na mò̱ ko̱we̱bɛɛ‑ana
        na mò̱ nyare̱‑ana ne̱ ɔɔ te̱e̱‑ɔ a waa siraa bo̱ te bo̱ gywii mò̱.
      sbs: 0.7582
      gen_sec: 12.2
      ref_sec: 11.52
      cer: 0.1607
      wer: 0.3667
    bible_00061:
      source: bible
      text: Daabii, fo̱ e̱ tɔwe̱ a fo̱ gywii mò̱ ne̱e̱ fe̱yɛ, ‘Kyo̱ŋ ya de̱ŋa mo̱ ateese, na fo̱ taa
        baa mo̱ pwɛɛ, ne̱ mo̱ ya gyi lo̱we̱, na ŋkee fo̱ dɛɛ nya kpa ya waa fo̱ fɔŋfɔŋ ateese.’
      sbs: 0.7528
      gen_sec: 12.46
      ref_sec: 11.58
      cer: 0.0885
      wer: 0.2703
    bible_00062:
      source: bible
      text: Ne̱ ako̱ŋ a ba Igyipiti na Kanaŋ e̱swe̱e̱re̱ se̱, ne̱ baa ŋu ase̱ŋ bwe̱e̱tɔ. Ne̱ ane̱ ade̱daapo̱‑ɔ
        a kpa ateese kpo̱ne̱.
      sbs: 0.7746
      gen_sec: 8.79
      ref_sec: 9.02
      cer: 0.0253
      wer: 0.1429
    bible_00063:
      source: bible
      text: Ŋke nsi amo̱ adaŋpo̱kye̱e̱ na atrapo̱ i ŋu ase̱ŋ ne̱e̱ fɛɛ.
      sbs: 0.687
      gen_sec: 4.61
      ref_sec: 5.3
      cer: 0.175
      wer: 0.3636
    bible_00064:
      source: bible
      text: Mo̱ i gyi mo̱ne̱ kase̱ŋtiŋ fe̱yɛ mo̱ne̱ maa lɛɛ ŋu mo̱ mfaanɛɛ, amɔ saŋ a fo̱ fe̱yɛ m ba,
        ne̱ mo̱ne̱ e̱ tɔwe̱ fe̱yɛ,
      sbs: 0.7614
      gen_sec: 8.19
      ref_sec: 8.1
      cer: 0.0405
      wer: 0.125
    bible_00065:
      source: bible
      text: fo̱ maa sa a mo̱ kayo̱wɔre̱ gyo ke̱gye̱raŋta‑rɔ.
      sbs: 0.6944
      gen_sec: 3.41
      ref_sec: 3.6
      cer: 0.1515
      wer: 0.75
    bible_00066:
      source: bible
      text: Saŋ amo̱‑ɔ, ne̱ Yeesuu agyase̱po̱‑ɔ a ba mò̱ ase̱. Ne̱ baa bise mò̱ fe̱yɛ, “Nsɛ e̱ gye̱
        bre̱sɛ Wuribware̱ se̱ a kuwure‑o‑ro?”
