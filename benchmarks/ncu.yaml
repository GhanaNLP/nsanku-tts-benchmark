      wer: 0.0857
    bible_00124:
      source: bible
      text: Ne̱ Yudas a ya twe̱e̱ atanne̱‑ɔ bo̱ be̱ya swe̱e̱re̱ Wuribware̱ suŋkpa. Ne̱ ɔɔ le̱e̱ mfe̱ŋ
        ya kya mò̱ e̱ye̱e̱ fe, ne̱ oo wu.
      sbs: 0.6635
      gen_sec: 10.72
      ref_sec: 10.24
      cer: 0.0256
      wer: 0.1304
    bible_00125:
      source: bible
      text: Ane̱ maa kpa a kitiri kra mo̱ne̱, na a taare̱ kya bo̱ko̱ mɔ‑rɔ, amaa ane̱ e̱ kpa fe̱yɛ ɔke̱maa
        nya mò̱ ke̱be̱gya‑ɔ ne̱e̱.
      sbs: 0.7387
      gen_sec: 9.12
      ref_sec: 7.92
      cer: 0.038
      wer: 0.2174
    bible_00126:
      source: bible
      text: Kake nsiŋ ne̱ mo̱ a waa mfɛɛre̱ fe̱yɛ m mo̱rɔwe̱ mo̱ne̱‑ɔ,
      sbs: 0.6451
      gen_sec: 4.32
      ref_sec: 3.02
      cer: 0.0
      wer: 0.1818
    bible_00127:
      source: bible
      text: Amɔ ase̱ŋ ne̱ ane̱ a ye̱re̱ ayaa‑rɔ ane̱ e̱ tɔwe̱. Ne̱ Wuribware̱ a kufwiiŋe timaa ne̱ Wuribware̱
        i ke bamo̱ ne̱ ba gya mò̱ kanɔ se̱‑ɔ, e̱ de̱ŋ ɔ be̱e̱ ɔ ye̱re̱ ase̱ŋ amo̱ ayaa‑rɔ.”
      sbs: 0.673
      gen_sec: 11.92
      ref_sec: 12.8
      cer: 0.0172
      wer: 0.0571
    bible_00128:
      source: bible
      text: ne̱ mo̱ akatɔ a gyi mo̱ e̱ tɔwe̱ fo̱ kuŋu si ase̱ŋ.
      sbs: 0.7076
      gen_sec: 4.24
      ref_sec: 3.72
      cer: 0.0938
      wer: 0.25
    bible_00129:
      source: bible
      text: Ne̱ Peetroo yɛ, “Ke̱e̱ ɛ, ane̱ a yɔwe̱ ke̱tɔ ke̱maa ane̱ gya fo̱ se̱‑ɔ, nte̱tɔ ne̱ ane̱ e̱
        nya?”
      sbs: 0.637
      gen_sec: 7.36
      ref_sec: 5.7
      cer: 0.0526
      wer: 0.0526
    bible_00130:
      source: bible
      text: Na ba gyaŋŋe̱ Wuribware̱ suŋkpa‑ɔ kabuno kake ke̱maa, na ba gyaŋŋe̱ ba gyi abɛɛ aye̱ kakatɔgyi‑ro
        na kakpo̱nɔyuri‑ro.
      sbs: 0.6837
      gen_sec: 11.28
      ref_sec: 7.18
      cer: 0.0
      wer: 0.0
    bible_00131:
      source: bible
      text: Ŋkee bamo̱ ne̱ bo̱ gye̱ mò̱ ŋkpɛɛ na bamo̱ ne̱ bo̱ gya mò̱ se̱‑ɔ a le̱e̱ ba fɛɛ‑rɔ ne̱e̱
        fe̱yɛ,
      sbs: 0.6302
      gen_sec: 6.64
      ref_sec: 7.56
      cer: 0.0172
      wer: 0.05
    bible_00132:
      source: bible
      text: Fe̱yɛ ane̱ŋ ne̱ baa kyo̱rɛɛ bo̱ le̱e̱ Yeesuu kuŋu si abware̱se̱ŋ wo̱re̱‑ɔ‑rɔ‑ɔ,
      sbs: 0.718
      gen_sec: 4.8
      ref_sec: 5.48
      cer: 0.0
      wer: 0.0
    bible_00133:
      source: bible
      text: Ne̱ Yeesuu a tɔwe̱ bo̱ gye̱ kɛɛ fe̱yɛ, “To, ɔke̱maa ne̱ ɔɔ kpa atɔ timaa bo̱ dɔŋŋɔ abɛɛ se̱‑ɔ,
        ne̱ Wuribware̱ ase̱ fe̱raa ɔ gye̱ otiripo̱ ne̱e̱‑ɔ, o du ne̱e̱ fe̱yɛ atɔ wuye amo̱ ne̱ ɔ mo̱ŋ
        de mfɛɛre̱‑ɔ.”
      sbs: 0.6532
      gen_sec: 14.72
      ref_sec: 14.08
      cer: 0.0153
      wer: 0.0256
    bible_00134:
      source: bible
      text: Mo̱ e̱ ko̱re̱ ke̱bware̱ko̱re̱ fe̱yɛ ane̱ nyaŋpe̱ Yeesuu Kristoo yure mo̱ne̱.
      sbs: 0.7516
      gen_sec: 6.08
      ref_sec: 4.44
      cer: 0.0192
      wer: 0.0909
    bible_00135:
      source: bible
      text: Ne̱ oo fuwi ywe̱e̱, ne̱ ɔɔ ye̱re̱ mò̱ ayaa se̱, ne̱ ɔɔ le̱e̱ ɔ naa. Ne̱ mò̱ aa bamo̱ a lwee
        Wuribware̱ suŋkpa kabuno, na ɔ naa na o fuwi ɔ ywe̱e̱, na ɔ kyo̱rɔ Wuribware̱.
      sbs: 0.6677
      gen_sec: 13.2
      ref_sec: 9.22
      cer: 0.0818
      wer: 0.2222
    bible_00136:
      source: bible
      text: Na mo̱nꞌ yure bamo̱ ne̱ bamo̱ fe̱raa ba da mo̱ne̱ yii‑o, na mo̱nꞌ ko̱re̱ ke̱bware̱ko̱re̱ sa
        bamo̱ ne̱ ba waa mo̱ne̱ bo̱rɔkraa‑ɔ.
      sbs: 0.6849
      gen_sec: 8.4
      ref_sec: 7.84
      cer: 0.0357
      wer: 0.1364
    bible_00137:
      source: bible
      text: Saŋ ne̱ Yeesuu a tɔwe̱ amo̱‑ɔ pɛɛɛ lo̱we̱‑ɔ, ne̱ ɔɔ le̱e̱ Galile̱ya swe̱e̱re̱ se̱ yɔ Yude̱ya
        swe̱e̱re̱ se̱ a ke̱be̱gya ne̱ ke̱ bo̱ Yo̱o̱daŋ bo̱ŋ nno̱ŋ a bo̱ŋbe̱‑ɔ se̱‑ɔ.
      sbs: 0.6729
      gen_sec: 10.0
      ref_sec: 14.22
      cer: 0.0667
      wer: 0.2414
    bible_00138:
      source: bible
      text: Kyɔwe̱ a lo̱we̱‑ɔ, ne̱ ko̱dɔɔ‑ɔ wuye‑o a tɔwe̱ gywii mò̱ ke̱paafo̱wɔ bre̱sɛ fe̱yɛ, ‘Te̱e̱
        mo̱ apafo̱wɔ‑ɔ pɛɛɛ bo̱ gyaŋŋe̱ na fo̱ ka bamo̱ ko̱kɔ. Na fo̱ ka bamo̱ ne̱ baa sii kamɛɛ yɔ mo̱
        ko̱dɔɔ‑ɔ‑rɔ ko̱kɔ pwɛɛ na fo̱ dɛɛ ka bamo̱ ne̱ baa gye̱ ŋkpɛɛ yɔ‑ɔ.’
      sbs: 0.6455
      gen_sec: 18.64
      ref_sec: 14.24
      cer: 0.0909
      wer: 0.2128
    bible_00139:
      source: bible
      text: Mò̱ ne̱ nde̱ se̱ awuye pɛɛɛ e̱ kɔɔre̱ a bo̱ gyi.”
      sbs: 0.6184
      gen_sec: 3.6
      ref_sec: 3.36
      cer: 0.0333
      wer: 0.2727
    bible_00140:
      source: bible
      text: Mo̱ e̱ kaapo̱ mo̱ne̱ ane̱ŋ ne̱ ɔko̱ ne̱ ɔ ba mo̱ ase̱ a o nu mo̱ ase̱ŋ, ne̱ o bu amo̱‑ɔ du‑o.
      sbs: 0.6956
      gen_sec: 6.8
      ref_sec: 6.6
      cer: 0.0755
      wer: 0.1818
    bible_00141:
      source: bible
      text: Ne̱ soogyaa ɔgye̱ŋkpɛɛpo̱‑ɔ yɛ, “Mo̱ a ka atanne̱ dabe̱ pwɛɛ ne̱ mo̱ a dɛɛ kii Roma maŋ kigyi.”
      sbs: 0.7027
      gen_sec: 12.88
      ref_sec: 6.78
      cer: 0.0308
      wer: 0.1111
    bible_00142:
      source: bible
      text: Ne̱ Pɔɔl na Silas a bo̱rɔ Amfipolis na Apoloniya e̱maŋ‑nɔ, ne̱ baa ba Tisalonikaa maŋ‑nɔ.
      sbs: 0.6992
      gen_sec: 6.96
      ref_sec: 8.8
      cer: 0.0149
      wer: 0.0667
    bible_00143:
      source: bible
      text: A le̱e̱ fe̱yɛ ɔko̱ ne̱ ɔ kpa a ɔ nya mò̱ e̱ye̱e̱ le̱e̱ lowi ase̱‑ɔ, lowi e̱ nya mò̱ nsu
        pɛɛɛ. Ɔko̱ mɔ ne̱ o kperi mo̱ se̱ na o wu‑o e̱ nya ŋkpa na kukyure ne̱ a mo̱ŋ de kɛɛ‑ɔ.
      sbs: 0.688
      gen_sec: 12.8
      ref_sec: 11.24
      cer: 0.0278
      wer: 0.0732
    bible_00144:
      source: bible
      text: Ne̱ Simɔŋ yɛ, “Yooo, ɔkaapo̱po̱, tɔwe̱ gywii mo̱.”
      sbs: 0.7133
      gen_sec: 5.44
      ref_sec: 4.04
      cer: 0.0
      wer: 0.0
    bible_00145:
      source: bible
      text: Kanye na mpase̱ pɛɛɛ ane̱ e̱ ko̱re̱ Wuribware̱ fe̱yɛ ane̱ aa mo̱ne̱ a be̱e̱ ŋu abɛɛ, na ane̱
        nya sa mo̱ne̱ ke̱tɔ ne̱ ke̱ saŋ ki tiri fe̱yɛ mo̱nꞌ nya, na mo̱nꞌ taare̱ kɔɔre̱ Kristoo gyi lo̱we̱‑ɔ.
      sbs: 0.7289
      gen_sec: 11.36
      ref_sec: 14.12
      cer: 0.0233
      wer: 0.0811
    bible_00146:
      source: bible
      text: Ke̱tɔ se̱ ne̱ n de itee na akpare̱ mo̱ e̱ tɔwe̱ ase̱ŋ mo̱ i gywii lamaŋ‑ɔ e̱ gye̱ fe̱yɛ bo̱
        de akatɔ, amaa bo̱ mo̱ŋ ke̱e̱, ne̱ bo̱ de e̱se̱bɔ, amaa bo̱ maa nu ase̱ŋ.
      sbs: 0.6463
      gen_sec: 12.64
      ref_sec: 14.26
      cer: 0.0388
      wer: 0.0857
    bible_00147:
      source: bible
      text: Ne̱ amo̱ e̱ gye̱ fe̱yɛ kaye̱ mɔ‑rɔ dooo ne̱ ane̱ i de te̱maa Kristoo si, amo̱ fe̱raa ane̱
        ase̱ŋ e̱ waa e̱wɛɛ a a kyo̱ŋ ɔke̱maa kaye̱ mɔ‑rɔ.
      sbs: 0.7455
      gen_sec: 11.2
      ref_sec: 11.18
      cer: 0.0
      wer: 0.0
    bible_00148:
      source: bible
      text: Ŋ yɛ, fo̱ ya ŋu kiyii ko̱ a swɛɛ agyi timaa, a kaapo̱ ne̱e̱ fe̱yɛ kiyii‑o bo̱ daŋ. Ne̱ fo̱
        ya ŋu kiyii suyo ko̱ mɔ a swɛɛ agyi preepreesɛ, a kaapo̱ ne̱e̱ fe̱yɛ kiyii amo̱ mo̱ŋ bo̱ daŋ.
        Kiyii agyi ne̱ bo̱ de ba pini kiyii suyo ne̱ ke̱ gye̱‑ɔ.
      sbs: 0.6676
      gen_sec: 18.48
      ref_sec: 14.72
      cer: 0.0248
      wer: 0.0588
    bible_00149:
      source: bible
      text: Asɔre̱e̱ asɔre̱e̱ ne̱ a bo̱ Asiya swe̱e̱re̱ se̱‑ɔ awuye e̱ ka mo̱ne̱ kanɔ. Akwila na Prisikila
        na asɔre̱e̱ agyi ne̱ ba gyaŋŋe̱ bamo̱ aye̱ ba waa asɔre̱e̱‑ɔ de ane̱ nyaŋpe̱ ba ka mo̱ne̱ kanɔ.
      sbs: 0.7372
      gen_sec: 12.64
      ref_sec: 14.98
      cer: 0.0156
      wer: 0.1176
    bible_00150:
      source: bible
      text: Ne̱ ɔɔ tɔwe̱ keŋkeŋ fe̱yɛ, “Ko̱so̱ ye̱re̱ fo̱ ayaa se̱.” Mfe̱ŋ ne̱ ke̱gyabɔɔ amo̱ a ko̱so̱
        fuwi ywe̱e̱, ne̱ ɔɔ nare̱ mò̱ ayaa se̱ ɔ kaa.
      sbs: 0.6735
      gen_sec: 12.96
      ref_sec: 7.86
      cer: 0.0952
      wer: 0.2692
    bible_00151:
      source: bible
      text: Ne̱ Wuribware̱ kabɔɔ amo̱ a be̱ŋŋaa mò̱ ɛ, “Wuribware̱ akatɔ a gyi fo̱ ke̱bware̱ko̱re̱ na
        ke̱dame̱naŋsɛ ne̱ fo̱ e̱ waa atiripo̱‑ɔ se̱, ne̱ ɔ kpa a ɔ be̱ŋŋaa fo̱.
      sbs: 0.63
      gen_sec: 11.36
      ref_sec: 9.0
      cer: 0.0467
      wer: 0.1379
    bible_00152:
      source: bible
      text: Amo̱se̱‑ɔ to̱ŋ ke̱maa ne̱ fo̱ kapo̱tɛɛ da‑ɔ, fo̱ mfɛɛre̱ e̱ ya dɔŋŋɔ kamo̱ se̱ mfe̱ŋ.”
      sbs: 0.6961
      gen_sec: 6.16
      ref_sec: 5.68
      cer: 0.0556
      wer: 0.2
    bible_00153:
      source: bible
      text: Ne̱ Pɔɔl fɔŋfɔŋ e̱ kpa fe̱yɛ ɔ yɔ lamaŋ amo̱ akatɔ‑rɔ mfe̱ŋ ya sa se̱ŋsa gywii ase̱sɛ‑ɔ, amaa
        bamo̱ ne̱ ba kɔɔre̱ Yeesuu ba gyi‑o mo̱ŋ sure.
      sbs: 0.66
      gen_sec: 9.92
      ref_sec: 9.26
      cer: 0.0102
      wer: 0.1111
    bible_00154:
      source: bible
      text: Bo̱ le̱e̱ fe̱yɛ mo̱ne̱ bwe̱e̱tɔ a fa mfɛɛre̱ fe̱yɛ mo̱nꞌ gyiiri mò̱ ke̱se̱bɔ, ne̱ mo̱ne̱
        a gya mò̱ le̱e̱ mo̱ne̱ asɔre̱e̱‑ɔ‑rɔ. Ne̱ mbe̱yɔmɔ mo̱ a ŋu fe̱yɛ mò̱ ke̱se̱bɔgyiiri ne̱ mo̱ne̱
        a gyiiri mò̱‑ɔ a baare.
      sbs: 0.6908
      gen_sec: 13.76
      ref_sec: 13.3
      cer: 0.053
      wer: 0.2778
    bible_00155:
      source: bible
      text: Ne̱ baa kaapo̱ mò̱ bamo̱ Igyipiti awuye kanyiase̱ŋ, ne̱ oo kii se̱sɛ dabe̱ mò̱ se̱ŋsa na
        asuŋ waasɛ‑rɔ.
      sbs: 0.6614
      gen_sec: 7.12
      ref_sec: 8.3
      cer: 0.0548
      wer: 0.2778
    bible_00156:
      source: bible
      text: Ane̱ e̱ kyo̱rɛɛ amo̱‑ɔ ne̱e̱ a ane̱ kakatɔgyi‑o ma lo̱we̱ daa.
      sbs: 0.6947
      gen_sec: 3.84
      ref_sec: 4.02
      cer: 0.075
      wer: 0.1818
    bible_00157:
      source: bible
      text: Amo̱se̱ se̱‑ɔ, ke̱tɔ ne̱ mo̱ e̱ ka mo̱ne̱ ase̱ŋ ke̱mo̱ se̱‑ɔ ne̱e̱. Suŋno mo̱ne̱ ya gye̱ ŋkpɛɛ
        tɔwe̱ fe̱yɛ mo̱ne̱ e̱ kpa a mo̱nꞌ sa atanne̱. Kase̱ŋtiŋ si mɔ ne̱ mo̱ne̱ a gye̱ ŋkpɛɛ e̱sa.
      sbs: 0.6883
      gen_sec: 10.88
      ref_sec: 12.06
      cer: 0.0522
      wer: 0.1429
    bible_00158:
      source: bible
      text: Amo̱ fe̱raa ne̱ Yeesuu a tɔwe̱ gywii mò̱ fe̱yɛ, “Ko̱so̱, nare̱ dame̱naŋsɛ. Ane̱ŋ ne̱ fo̱
        a kɔɔre̱ mo̱ gyi‑o si ne̱ fo̱ a kpaare̱.”
      sbs: 0.6491
      gen_sec: 9.44
      ref_sec: 8.56
      cer: 0.0366
      wer: 0.125
    bible_00159:
      source: bible
      text: Amo̱se̱ ne̱ owure‑o a te̱e̱ ane̱ŋ a ke̱yaafɔre̱ amo̱. Ne̱ ɔɔ tɔwe̱ gywii mò̱ fe̱yɛ, ‘Kuŋurole̱ŋ
        wuye ke̱yaafɔre̱ e̱ gye̱ fo̱. Ko̱kɔ ne̱ fo̱ de mo̱‑ɔ kyɔ bwe̱e̱tɔ bɛɛɛ? Amaa fo̱ a ko̱re̱ mo̱
        fe̱yɛ ŋ nyite fo̱‑ɔ se̱‑ɔ, mo̱ a taa fo̱ ko̱kɔ amo̱ bo̱ ke fo̱.
      sbs: 0.6455
      gen_sec: 16.56
      ref_sec: 14.76
      cer: 0.0191
      wer: 0.1042
    bible_00160:
      source: bible
      text: Hare̱e̱ gbaa fo̱ ya ko̱re̱ ke̱bware̱ko̱re̱, ne̱ fo̱ a sa aŋsɛ nɛɛnɛɛ, fo̱ se̱ŋsa‑ɔ mo̱ŋ kya
        fo̱ bɛɛko̱‑ana asɔre̱e̱ agyi‑o‑ro.
      sbs: 0.7301
      gen_sec: 8.24
      ref_sec: 10.14
      cer: 0.0122
      wer: 0.05
    bible_00161:
      source: bible
      text: Amaa Pɔɔl a yɔ swe̱e̱re̱ mfe̱ŋ, ne̱ ɔɔ ya di ke̱yaafɔre̱ amo̱ se̱, ne̱ oo powi mò̱, ne̱ ɔ
        yɛ, “Mo̱ne̱ ma sa a a tiri mo̱ne̱ na ɔ ke̱e̱!”
      sbs: 0.6453
      gen_sec: 10.8
      ref_sec: 8.56
      cer: 0.0488
      wer: 0.1667
    bible_00162:
      source: bible
      text: Amɔ leŋpoo ɔkɔɔre̱po̱ bre̱sɛ ko̱ ne̱ o de atanne̱, ne̱ ba te̱e̱ mò̱ ɛ Sakiiyus‑o bo̱ maŋ‑ɔ‑rɔ
        mfe̱ŋ.
      sbs: 0.6981
      gen_sec: 7.68
      ref_sec: 10.78
      cer: 0.0455
      wer: 0.1667
    bible_00163:
      source: bible
      text: Ne̱ Yeesuu a tɔwe̱ gywii soogyaa amo̱ fe̱yɛ, “Nare̱ pe̱, na ke̱tɔ ne̱ fo̱ a kɔɔre̱ gyi‑o e̱
        waa a ke̱ sa fo̱.”
      sbs: 0.6423
      gen_sec: 9.6
      ref_sec: 5.38
      cer: 0.058
      wer: 0.3043
    bible_00164:
      source: bible
      text: Ne̱ ŋkee ɔ yɛ ɔke̱maa ma lɛɛ so̱rɔ tɔso̱rɔ bo̱ kyo̱ŋ kabuno‑o mfe̱ŋ.
      sbs: 0.6439
      gen_sec: 4.88
      ref_sec: 5.66
      cer: 0.0426
      wer: 0.3077
    bible_00165:
      source: bible
      text: Ntɔ se̱ ne̱ mo̱ne̱ mo̱ŋ nu ase̱ŋ amo̱ kaase̱‑ɔ ne̱e̱? Mo̱nꞌ nu fe̱yɛ ke̱tɔ ne̱ se̱sɛ i gyi‑o
        i lwee mò̱ kanɔ‑rɔ ne̱e̱ na ko̱ yɔ mò̱ kame‑ro na ŋkee ɔ kɔɔ bo̱ twe̱e̱.
      sbs: 0.6741
      gen_sec: 10.56
      ref_sec: 11.18
      cer: 0.068
      wer: 0.2059
    bible_00166:
      source: bible
      text: Saŋ amo̱‑ɔ, ne̱ Hɛrɔd ne̱ ɔ gye̱ Galile̱ya swe̱e̱re̱ se̱ owure‑o a nu Yeesuu ase̱ŋ na ane̱ŋ
        ne̱ ɔɔ waa akpe̱ŋe̱ye̱e̱tɔ bwe̱e̱tɔ‑ɔ.
      sbs: 0.7155
      gen_sec: 8.32
      ref_sec: 9.76
      cer: 0.0581
      wer: 0.1818
    bible_00167:
      source: bible
      text: Mo̱ne̱ ma sa a mo̱ne̱ akatɔ gyi fe̱yɛ ibrisi a bu mo̱ne̱, amaa mo̱nꞌ sa a mo̱ne̱ akatɔ gyi
        bwe̱e̱tɔ fe̱yɛ Wuribware̱ a kyo̱rɛɛ mo̱ne̱ anyare̱ bo̱ be̱ya so̱so̱.”
      sbs: 0.6578
      gen_sec: 10.8
      ref_sec: 8.5
      cer: 0.0187
      wer: 0.069
    bible_00168:
      source: bible
      text: Bamo̱ ya pure se̱sɛ, kifuniŋ ne̱ ki de ayeegyi na abowii ne̱ baa pure, ne̱ mò̱ ya be̱e̱ kyiŋŋi
        le̱e̱ lowi‑ro, amɔ se̱sɛ‑ɔ e̱ nya kayo̱wɔre̱ po̱pwɛɛ, na mò̱ kra be̱e̱ bo̱ kye̱na kamo̱‑rɔ.
      sbs: 0.6958
      gen_sec: 13.04
      ref_sec: 14.12
      cer: 0.0565
      wer: 0.2059
    bible_00169:
      source: bible
      text: Ŋke mfe̱ne̱ ko̱ kamɛɛ‑ɔ, ne̱ Yeesuu a yɔ maŋ ko̱ ne̱ ba te̱e̱ ɛ Nayiŋ‑o‑ro. Amɔ saŋ amo̱‑ɔ
        mò̱ agyase̱po̱‑ɔ na ase̱sɛ biribiri gya mò̱ se̱.
      sbs: 0.707
