        nya sa mo̱ne̱ ke̱tɔ ne̱ ke̱ saŋ ki tiri fe̱yɛ mo̱nꞌ nya, na mo̱nꞌ taare̱ kɔɔre̱ Kristoo gyi lo̱we̱‑ɔ.
      sbs: 0.5944
      gen_sec: 14.96
      ref_sec: 14.12
      cer: 0.1783
      wer: 0.7568
    bible_00146:
      source: bible
      text: Ke̱tɔ se̱ ne̱ n de itee na akpare̱ mo̱ e̱ tɔwe̱ ase̱ŋ mo̱ i gywii lamaŋ‑ɔ e̱ gye̱ fe̱yɛ bo̱
        de akatɔ, amaa bo̱ mo̱ŋ ke̱e̱, ne̱ bo̱ de e̱se̱bɔ, amaa bo̱ maa nu ase̱ŋ.
      sbs: 0.6227
      gen_sec: 12.08
      ref_sec: 14.26
      cer: 0.2233
      wer: 0.5714
    bible_00147:
      source: bible
      text: Ne̱ amo̱ e̱ gye̱ fe̱yɛ kaye̱ mɔ‑rɔ dooo ne̱ ane̱ i de te̱maa Kristoo si, amo̱ fe̱raa ane̱
        ase̱ŋ e̱ waa e̱wɛɛ a a kyo̱ŋ ɔke̱maa kaye̱ mɔ‑rɔ.
      sbs: 0.5775
      gen_sec: 11.08
      ref_sec: 11.18
      cer: 0.2444
      wer: 0.6786
    bible_00148:
      source: bible
      text: Ŋ yɛ, fo̱ ya ŋu kiyii ko̱ a swɛɛ agyi timaa, a kaapo̱ ne̱e̱ fe̱yɛ kiyii‑o bo̱ daŋ. Ne̱ fo̱
        ya ŋu kiyii suyo ko̱ mɔ a swɛɛ agyi preepreesɛ, a kaapo̱ ne̱e̱ fe̱yɛ kiyii amo̱ mo̱ŋ bo̱ daŋ.
        Kiyii agyi ne̱ bo̱ de ba pini kiyii suyo ne̱ ke̱ gye̱‑ɔ.
      sbs: 0.6369
      gen_sec: 19.92
      ref_sec: 14.72
      cer: 0.1056
      wer: 0.6275
    bible_00149:
      source: bible
      text: Asɔre̱e̱ asɔre̱e̱ ne̱ a bo̱ Asiya swe̱e̱re̱ se̱‑ɔ awuye e̱ ka mo̱ne̱ kanɔ. Akwila na Prisikila
        na asɔre̱e̱ agyi ne̱ ba gyaŋŋe̱ bamo̱ aye̱ ba waa asɔre̱e̱‑ɔ de ane̱ nyaŋpe̱ ba ka mo̱ne̱ kanɔ.
      sbs: 0.6191
      gen_sec: 14.64
      ref_sec: 14.98
      cer: 0.1016
      wer: 0.6176
    bible_00150:
      source: bible
      text: Ne̱ ɔɔ tɔwe̱ keŋkeŋ fe̱yɛ, “Ko̱so̱ ye̱re̱ fo̱ ayaa se̱.” Mfe̱ŋ ne̱ ke̱gyabɔɔ amo̱ a ko̱so̱
        fuwi ywe̱e̱, ne̱ ɔɔ nare̱ mò̱ ayaa se̱ ɔ kaa.
      sbs: 0.5536
      gen_sec: 11.84
      ref_sec: 7.86
      cer: 0.1786
      wer: 0.7692
    bible_00151:
      source: bible
      text: Ne̱ Wuribware̱ kabɔɔ amo̱ a be̱ŋŋaa mò̱ ɛ, “Wuribware̱ akatɔ a gyi fo̱ ke̱bware̱ko̱re̱ na
        ke̱dame̱naŋsɛ ne̱ fo̱ e̱ waa atiripo̱‑ɔ se̱, ne̱ ɔ kpa a ɔ be̱ŋŋaa fo̱.
      sbs: 0.5434
      gen_sec: 12.52
      ref_sec: 9.0
      cer: 0.1121
      wer: 0.6897
    bible_00152:
      source: bible
      text: Amo̱se̱‑ɔ to̱ŋ ke̱maa ne̱ fo̱ kapo̱tɛɛ da‑ɔ, fo̱ mfɛɛre̱ e̱ ya dɔŋŋɔ kamo̱ se̱ mfe̱ŋ.”
      sbs: 0.589
      gen_sec: 7.08
      ref_sec: 5.68
      cer: 0.2593
      wer: 0.8667
    bible_00153:
      source: bible
      text: Ne̱ Pɔɔl fɔŋfɔŋ e̱ kpa fe̱yɛ ɔ yɔ lamaŋ amo̱ akatɔ‑rɔ mfe̱ŋ ya sa se̱ŋsa gywii ase̱sɛ‑ɔ, amaa
        bamo̱ ne̱ ba kɔɔre̱ Yeesuu ba gyi‑o mo̱ŋ sure.
      sbs: 0.5894
      gen_sec: 10.4
      ref_sec: 9.26
      cer: 0.1122
      wer: 0.5556
    bible_00154:
      source: bible
      text: Bo̱ le̱e̱ fe̱yɛ mo̱ne̱ bwe̱e̱tɔ a fa mfɛɛre̱ fe̱yɛ mo̱nꞌ gyiiri mò̱ ke̱se̱bɔ, ne̱ mo̱ne̱
        a gya mò̱ le̱e̱ mo̱ne̱ asɔre̱e̱‑ɔ‑rɔ. Ne̱ mbe̱yɔmɔ mo̱ a ŋu fe̱yɛ mò̱ ke̱se̱bɔgyiiri ne̱ mo̱ne̱
        a gyiiri mò̱‑ɔ a baare.
      sbs: 0.595
      gen_sec: 15.04
      ref_sec: 13.3
      cer: 0.25
      wer: 0.75
    bible_00155:
      source: bible
      text: Ne̱ baa kaapo̱ mò̱ bamo̱ Igyipiti awuye kanyiase̱ŋ, ne̱ oo kii se̱sɛ dabe̱ mò̱ se̱ŋsa na
        asuŋ waasɛ‑rɔ.
      sbs: 0.5581
      gen_sec: 7.8
      ref_sec: 8.3
      cer: 0.2466
      wer: 0.7222
    bible_00156:
      source: bible
      text: Ane̱ e̱ kyo̱rɛɛ amo̱‑ɔ ne̱e̱ a ane̱ kakatɔgyi‑o ma lo̱we̱ daa.
      sbs: 0.5843
      gen_sec: 4.76
      ref_sec: 4.02
      cer: 0.225
      wer: 1.1818
    bible_00157:
      source: bible
      text: Amo̱se̱ se̱‑ɔ, ke̱tɔ ne̱ mo̱ e̱ ka mo̱ne̱ ase̱ŋ ke̱mo̱ se̱‑ɔ ne̱e̱. Suŋno mo̱ne̱ ya gye̱ ŋkpɛɛ
        tɔwe̱ fe̱yɛ mo̱ne̱ e̱ kpa a mo̱nꞌ sa atanne̱. Kase̱ŋtiŋ si mɔ ne̱ mo̱ne̱ a gye̱ ŋkpɛɛ e̱sa.
      sbs: 0.5914
      gen_sec: 14.52
      ref_sec: 12.06
      cer: 0.1565
      wer: 0.8
    bible_00158:
      source: bible
      text: Amo̱ fe̱raa ne̱ Yeesuu a tɔwe̱ gywii mò̱ fe̱yɛ, “Ko̱so̱, nare̱ dame̱naŋsɛ. Ane̱ŋ ne̱ fo̱
        a kɔɔre̱ mo̱ gyi‑o si ne̱ fo̱ a kpaare̱.”
      sbs: 0.6318
      gen_sec: 10.64
      ref_sec: 8.56
      cer: 0.122
      wer: 0.75
    bible_00159:
      source: bible
      text: Amo̱se̱ ne̱ owure‑o a te̱e̱ ane̱ŋ a ke̱yaafɔre̱ amo̱. Ne̱ ɔɔ tɔwe̱ gywii mò̱ fe̱yɛ, ‘Kuŋurole̱ŋ
        wuye ke̱yaafɔre̱ e̱ gye̱ fo̱. Ko̱kɔ ne̱ fo̱ de mo̱‑ɔ kyɔ bwe̱e̱tɔ bɛɛɛ? Amaa fo̱ a ko̱re̱ mo̱
        fe̱yɛ ŋ nyite fo̱‑ɔ se̱‑ɔ, mo̱ a taa fo̱ ko̱kɔ amo̱ bo̱ ke fo̱.
      sbs: 0.5993
      gen_sec: 18.32
      ref_sec: 14.76
      cer: 0.2357
      wer: 0.7917
    bible_00160:
      source: bible
      text: Hare̱e̱ gbaa fo̱ ya ko̱re̱ ke̱bware̱ko̱re̱, ne̱ fo̱ a sa aŋsɛ nɛɛnɛɛ, fo̱ se̱ŋsa‑ɔ mo̱ŋ kya
        fo̱ bɛɛko̱‑ana asɔre̱e̱ agyi‑o‑ro.
      sbs: 0.5834
      gen_sec: 8.96
      ref_sec: 10.14
      cer: 0.2073
      wer: 0.8
    bible_00161:
      source: bible
      text: Amaa Pɔɔl a yɔ swe̱e̱re̱ mfe̱ŋ, ne̱ ɔɔ ya di ke̱yaafɔre̱ amo̱ se̱, ne̱ oo powi mò̱, ne̱ ɔ
        yɛ, “Mo̱ne̱ ma sa a a tiri mo̱ne̱ na ɔ ke̱e̱!”
      sbs: 0.6654
      gen_sec: 13.6
      ref_sec: 8.56
      cer: 0.2317
      wer: 0.8
    bible_00162:
      source: bible
      text: Amɔ leŋpoo ɔkɔɔre̱po̱ bre̱sɛ ko̱ ne̱ o de atanne̱, ne̱ ba te̱e̱ mò̱ ɛ Sakiiyus‑o bo̱ maŋ‑ɔ‑rɔ
        mfe̱ŋ.
      sbs: 0.576
      gen_sec: 9.48
      ref_sec: 10.78
      cer: 0.2424
      wer: 1.0
    bible_00163:
      source: bible
      text: Ne̱ Yeesuu a tɔwe̱ gywii soogyaa amo̱ fe̱yɛ, “Nare̱ pe̱, na ke̱tɔ ne̱ fo̱ a kɔɔre̱ gyi‑o e̱
        waa a ke̱ sa fo̱.”
      sbs: 0.5914
      gen_sec: 9.32
      ref_sec: 5.38
      cer: 0.1884
      wer: 0.7391
    bible_00164:
      source: bible
      text: Ne̱ ŋkee ɔ yɛ ɔke̱maa ma lɛɛ so̱rɔ tɔso̱rɔ bo̱ kyo̱ŋ kabuno‑o mfe̱ŋ.
      sbs: 0.5751
      gen_sec: 5.8
      ref_sec: 5.66
      cer: 0.2553
      wer: 0.7692
    bible_00165:
      source: bible
      text: Ntɔ se̱ ne̱ mo̱ne̱ mo̱ŋ nu ase̱ŋ amo̱ kaase̱‑ɔ ne̱e̱? Mo̱nꞌ nu fe̱yɛ ke̱tɔ ne̱ se̱sɛ i gyi‑o
        i lwee mò̱ kanɔ‑rɔ ne̱e̱ na ko̱ yɔ mò̱ kame‑ro na ŋkee ɔ kɔɔ bo̱ twe̱e̱.
      sbs: 0.5771
      gen_sec: 12.16
      ref_sec: 11.18
      cer: 0.3107
      wer: 0.8824
    bible_00166:
      source: bible
      text: Saŋ amo̱‑ɔ, ne̱ Hɛrɔd ne̱ ɔ gye̱ Galile̱ya swe̱e̱re̱ se̱ owure‑o a nu Yeesuu ase̱ŋ na ane̱ŋ
        ne̱ ɔɔ waa akpe̱ŋe̱ye̱e̱tɔ bwe̱e̱tɔ‑ɔ.
      sbs: 0.593
      gen_sec: 9.76
      ref_sec: 9.76
      cer: 0.1977
      wer: 0.5909
    bible_00167:
      source: bible
      text: Mo̱ne̱ ma sa a mo̱ne̱ akatɔ gyi fe̱yɛ ibrisi a bu mo̱ne̱, amaa mo̱nꞌ sa a mo̱ne̱ akatɔ gyi
        bwe̱e̱tɔ fe̱yɛ Wuribware̱ a kyo̱rɛɛ mo̱ne̱ anyare̱ bo̱ be̱ya so̱so̱.”
      sbs: 0.5828
      gen_sec: 13.12
      ref_sec: 8.5
      cer: 0.1589
      wer: 0.6897
    bible_00168:
      source: bible
      text: Bamo̱ ya pure se̱sɛ, kifuniŋ ne̱ ki de ayeegyi na abowii ne̱ baa pure, ne̱ mò̱ ya be̱e̱ kyiŋŋi
        le̱e̱ lowi‑ro, amɔ se̱sɛ‑ɔ e̱ nya kayo̱wɔre̱ po̱pwɛɛ, na mò̱ kra be̱e̱ bo̱ kye̱na kamo̱‑rɔ.
      sbs: 0.6402
      gen_sec: 14.28
      ref_sec: 14.12
      cer: 0.2258
      wer: 0.8529
    bible_00169:
      source: bible
      text: Ŋke mfe̱ne̱ ko̱ kamɛɛ‑ɔ, ne̱ Yeesuu a yɔ maŋ ko̱ ne̱ ba te̱e̱ ɛ Nayiŋ‑o‑ro. Amɔ saŋ amo̱‑ɔ
        mò̱ agyase̱po̱‑ɔ na ase̱sɛ biribiri gya mò̱ se̱.
      sbs: 0.5885
      gen_sec: 9.88
      ref_sec: 12.0
      cer: 0.2747
      wer: 0.6923
    bible_00170:
      source: bible
      text: Ane̱ pɛɛɛ a ŋu Yeesuu amo̱ ne̱ mo̱ e̱ tɔwe̱ mò̱ ase̱ŋ‑ɔ mò̱ kikyiŋŋi le̱e̱ lowi‑ro kamɛɛ‑rɔ.
      sbs: 0.577
      gen_sec: 6.48
      ref_sec: 6.02
      cer: 0.1311
      wer: 0.6471
    bible_00171:
      source: bible
      text: “Ɔko̱ mo̱ŋ tɛɛ ŋu, ɔko̱ mo̱ŋ tɛɛ nu, ɔko̱ mo̱ŋ tɛɛ pini
      sbs: 0.5757
      gen_sec: 6.2
      ref_sec: 3.64
      cer: 0.1714
      wer: 0.4167
    bible_00172:
      source: bible
      text: Mo̱ a nu fe̱yɛ fo̱ gyi‑ana‑ɔ bo̱ko̱ a gya kase̱ŋtiŋ a e̱kpa‑ɔ se̱ fe̱yɛ ane̱ŋ ne̱ ane̱ se̱
        ne̱ ɔ bo̱ so̱so̱‑ɔ a de̱ŋ kaapo̱ fe̱yɛ ane̱ gya se̱‑ɔ, mo̱ akatɔ a gyi amo̱ se̱ fɛɛ.
      sbs: 0.5717
      gen_sec: 12.96
      ref_sec: 13.2
      cer: 0.213
      wer: 0.6389
    bible_00173:
      source: bible
      text: Ke̱mo̱ kaye̱ ŋke‑o, ne̱ Roma awuye ase̱ŋgyipo̱‑ɔ a suŋ purisii awuye ya tɔwe̱ gywii ɔde̱e̱re̱se̱po̱‑ɔ
        ɛ, “Sa a anyare̱ amo̱ kpa a bo̱ nare̱.”
      sbs: 0.5872
      gen_sec: 10.52
      ref_sec: 7.5
      cer: 0.2766
      wer: 0.5
    bible_00174:
      source: bible
      text: Amo̱se̱‑ɔ mbe̱yɔmɔ, mo̱ ko̱so̱bɛɛ‑ana, ane̱ e̱ kpa fe̱yɛ mo̱nꞌ ŋu ane̱ŋ ne̱ Wuribware̱ ke̱kpa
        a suŋ kusuŋ asɔre̱e̱ awuye ne̱ bo̱ bo̱ Makedoniya swe̱e̱re̱ se̱‑ɔ ŋkpo̱nɔ‑rɔ‑ɔ.
      sbs: 0.5883
      gen_sec: 13.8
      ref_sec: 12.32
      cer: 0.2586
      wer: 0.8462
    bible_00175:
      source: bible
      text: A le̱e̱ fe̱yɛ mo̱, dimaadi mò̱ gyi‑o, de kukyure kake‑o gbaa e̱le̱ŋ.”
      sbs: 0.6185
      gen_sec: 6.28
      ref_sec: 4.52
      cer: 0.2444
      wer: 1.0833
    bible_00176:
      source: bible
      text: Amaa mbe̱yɔmɔ ane̱ a nu fe̱yɛ bo̱ko̱ bo̱ mo̱ne̱‑rɔ, ne̱ bo̱ de wo̱rɔgya. Bo̱ maa waa asuŋ
        ke̱maa, amɔ ase̱sɛ ase̱ŋ‑nɔ ke̱nare̱ lweero dooo.
      sbs: 0.5913
      gen_sec: 12.4
      ref_sec: 10.36
      cer: 0.1828
      wer: 0.8333
    bible_00177:
      source: bible
      text: Mo̱ e̱ sa se̱ŋsa mo̱ i gywii mo̱ne̱ ne̱e̱ fe̱yɛ mo̱ne̱ a gye̱ mo̱ gyi‑ana‑ɔ. Ane̱ a tɛɛ buŋŋi
        ane̱ ŋkpo̱nɔ‑rɔ kpa mo̱ne̱‑ɔ, mo̱ne̱ mɔ, mo̱nꞌ buŋŋi mo̱ne̱ ŋkpo̱nɔ‑rɔ kpa ane̱.
      sbs: 0.6097
      gen_sec: 13.36
      ref_sec: 10.6
      cer: 0.2091
      wer: 0.9032
    bible_00178:
      source: bible
      text: Mò̱ ke̱de̱ŋ tɔwe̱ ane̱ŋ‑ɔ, ne̱ Farisii awuye‑o na Sadukii awuye‑o a le̱e̱ ba kɔ, ne̱ baa
        ke‑ro,
      sbs: 0.599
      gen_sec: 8.76
      ref_sec: 5.92
      cer: 0.1905
      wer: 0.7647
    bible_00179:
      source: bible
      text: Ɔɔ tɔwe̱ ane̱ŋ, a le̱e̱ fe̱yɛ saŋ ke̱maa mɔ Wuribware̱-a‑kya-ane̱-yɔwe̱ a ateese kigyibe̱e̱‑ɔ,
        Romanyi gominaa i lee bamo̱ ne̱ oo tii bamo̱ tiikpa‑ɔ ɔko̱ a ɔ sa bamo̱.]
      sbs: 0.5653
      gen_sec: 14.08
      ref_sec: 13.02
      cer: 0.1826
      wer: 1.1429
    bible_00180:
      source: bible
      text: Ne̱ ɔko̱ ya yaa fo̱ iwurekpa a ɔ ya gyi ase̱ŋ bo̱ da fo̱ na ɔ bɔ fo̱ ko̱kɔ, ne̱ mò̱ e̱ kpa
        fo̱ kaare̱ a ɔ kɔɔre̱, taa fo̱ waagya bo̱ tii mò̱ se̱ na ɔ taa nare̱.
      sbs: 0.6318
      gen_sec: 11.96
      ref_sec: 10.92
      cer: 0.19
      wer: 0.6154
    bible_00181:
      source: bible
      text: Mo̱ e̱ ko̱re̱ ke̱bware̱ko̱re̱ fe̱yɛ ane̱ nyaŋpe̱ Yeesuu Kristoo yure mo̱ne̱ pɛɛɛ.
      sbs: 0.5878
      gen_sec: 6.08
      ref_sec: 9.78
      cer: 0.2143
      wer: 0.8333
    bible_00182:
      source: bible
      text: “Mo̱nꞌ nu mo̱ne̱ e̱ye̱e̱ na mo̱nꞌ kiŋŋi le̱e̱ mo̱ne̱ e̱bɔye̱‑rɔ, a le̱e̱ fe̱yɛ Wuribware̱
        se̱ a kuwure‑o a tɔ‑rɔ.”
      sbs: 0.5623
      gen_sec: 8.44
      ref_sec: 5.44
      cer: 0.1831
      wer: 1.0526
    bible_00183:
      source: bible
      text: ‘A tiri fe̱yɛ bo̱ taa mo̱, dimaadi mò̱ gyi‑o, bo̱ waa abɔye̱waapo̱ ke̱sare̱e̱‑rɔ, na bo̱
        da mo̱ bo̱ me̱ra kiyii kpare̱-abɛɛ‑rɔ se̱, na ke̱mo̱ kake sase̱po̱‑ɔ na n kyiŋŋi le̱e̱ lowi‑ro.’
        ”
      sbs: 0.6044
      gen_sec: 15.72
      ref_sec: 12.66
      cer: 0.175
      wer: 0.7742
    bible_00184:
      source: bible
      text: Ne̱ ase̱sɛ adusunoo na anyɔ‑ɔ a kiŋŋi ba Yeesuu ase̱, na bamo̱ akatɔ a gyi. Ne̱ baa bo̱ tɔwe̱
        gywii mò̱ fe̱yɛ, “Ane̱ nyaŋpe̱, ane̱ a ya ba fo̱ ke̱nyare̱ bo̱ tɔwe̱ ase̱ŋ‑ɔ, ibrisi gbaa a bu
        ane̱.”
      sbs: 0.6178
      gen_sec: 14.28
      ref_sec: 14.46
      cer: 0.2093
      wer: 0.5526
    bible_00185:
      source: bible
      text: Bɛɛɛ fo̱ sa a ase̱sɛ mɔ ne̱ bo̱ ye̱re̱ mfe̱e̱‑ɔ tɔwe̱ ke̱bɔye̱ ne̱ mo̱ a gyi ke̱mo̱ ke̱pɔ
        saŋ ne̱ baa yaa mo̱ maŋ abre̱sɛ‑ɔ akatɔ‑rɔ.
      sbs: 0.5981
      gen_sec: 11.6
      ref_sec: 8.52
      cer: 0.2471
      wer: 0.7308
    bible_00186:
      source: bible
      text: Kayo̱wɔre̱ ke̱be̱gya ko̱ i ŋu ase̱ŋ, amɔ abe̱gya ne̱ a saŋ‑ɔ pɛɛɛ i ŋu ase̱ŋ ne̱e̱. Fe̱yɛ
        bamo̱ ya kyo̱rɔ kayo̱wɔre̱‑ɔ ke̱be̱gya ko̱, amɔ abe̱gya ne̱ aa saŋ‑ɔ pɛɛɛ akatɔ a gyi.
      sbs: 0.6381
      gen_sec: 6.72
      ref_sec: 11.98
      cer: 0.5556
      wer: 0.8125
    bible_00187:
      source: bible
      text: Ne̱ ŋkee oo suŋ bamo̱ bo̱ kyo̱ŋwe̱ e̱maŋ se̱ fe̱yɛ bo̱ ya tɔwe̱ Wuribware̱ a kuwure‑o‑ro ase̱ŋ,
        na bo̱ kya alɔpo̱.
      sbs: 0.615
      gen_sec: 7.96
      ref_sec: 8.34
      cer: 0.25
      wer: 0.8095
    bible_00188:
      source: bible
      text: Amo̱se̱ se̱‑ɔ, mo̱ e̱ tɔwe̱ mo̱ i gywii mo̱ne̱ fe̱yɛ ɔke̱maa ne̱ mò̱ e̱ ko̱re̱ Wuribware̱
        ɔ kpa ko̱tɔko̱, ne̱ mò̱ ya kɔɔre̱ Wuribware̱ gyi mò̱ kakpo̱nɔ‑rɔ fe̱yɛ ɔɔ kyɔ nya ke̱tɔ‑ɔ, Wuribware̱
        mɔ e̱ sa mò̱ ke̱mo̱.
      sbs: 0.5958
      gen_sec: 13.32
      ref_sec: 13.38
      cer: 0.2206
      wer: 0.8158
    bible_00189:
      source: bible
