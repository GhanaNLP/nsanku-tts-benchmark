      sbs: 0.582
      gen_sec: 2.64
      ref_sec: 5.74
      cer: 0.1471
      wer: 0.5
    bible_00114:
      source: bible
      text: 'Ɛɛpɩzɩɣ ɛtasɩ labʋ kɩwɛɛkɩm: ɛ-Caa lɛ Ɛsɔ.'
