    bible_00016:
      source: bible
      text: Mansaŋ Ɛsɔ ɛzɩma mbʋ́ eyeba nɛ mɔyɔɔdʋʋ kʋnʋmɩŋ ndɩ ndɩ nɛ pɩkɩlɩ mɩtɩŋa payɩ yɔ.
      sbs: 0.593
      gen_sec: 9.36
      ref_sec: 5.38
      cer: 0.2154
      wer: 0.4667
    bible_00017:
      source: bible
      text: Ŋgʋ́, kʋjɔʋ ŋgʋ́ Fezuu Kiɖeɖeu lakɩ paa weyi se pʋwazɩ ɖatɩŋa payɩ yɔ, ŋ́gʋ́ wɩlɩɣna se kɩwɛ
        ɛ-cɔlɔ.
      sbs: 0.6176
      gen_sec: 6.88
      ref_sec: 7.24
      cer: 0.2667
      wer: 0.6111
    bible_00018:
      source: bible
      text: Ḿbʋ́ eyeki nɛ ɩtɛzɩ pɩʋ nɛ ɩwɛɛ cɩɖɩcɩɖɩ nɛ paanaɣ kawanaɣ nakɛyɛ mɩ-yɔɔ ɖa-Caa Ɛsɔ ɛsɩndaa
        puwiye nɖɩ́ ɖa-Kɩpaɣlʋ Yesu nɛ ɛ-ñɩma tɩŋa payɩ pɔkɔŋ yɔ.
      sbs: 0.6279
      gen_sec: 11.2
      ref_sec: 13.6
      cer: 0.1538
      wer: 0.5769
    bible_00019:
      source: bible
      text: Ɛnʋ yekina nɛ ɩɖaŋ se ɩkɔŋ sʋʋ Ɛsɔ koboyaɣ taa.
      sbs: 0.647
      gen_sec: 3.52
      ref_sec: 3.06
      cer: 0.1351
      wer: 0.7
    bible_00020:
      source: bible
      text: Ḿbʋ́ ɖɔɖɔ Leevi liɖe taa tʋ nɔɔyʋ kɛwɛ Ciiprɩ ɛjaɖɛ taa, payaɣ-ɩ se Yozɛɛfʋ.
      sbs: 0.6491
      gen_sec: 8.08
      ref_sec: 5.54
      cer: 0.1525
      wer: 0.6429
    bible_00021:
      source: bible
      text: 'Pʋ-yɔɔ Daaviidi tasɩ maʋ ɖoli lɛɛɖɛ se: ‹Ña Kɩpaɣlʋ, ŋŋyeki ña-ñɩnʋ.'
      sbs: 0.6559
      gen_sec: 5.04
      ref_sec: 6.9
      cer: 0.1923
      wer: 0.9091
    bible_00022:
      source: bible
      text: Peeɖe ɛha nɔɔ se mbá pasɩm lɩm yaʋ yɔ, pacalɩ falʋʋ pɩ-taa nɛ paya nɛ palɩɩ kidiiliŋ yɔɔ
        nɛ piyele lɛlaa ñɔñɔkɔyɩnɩ kpoŋgbolonaa yaa mɛlɛ hɔɔlasɩ nɛ patɩŋ pa-wayɩ.
      sbs: 0.6139
      gen_sec: 13.52
      ref_sec: 11.12
      cer: 0.0763
      wer: 0.3448
    bible_00023:
      source: bible
      text: Yee kewiyaɣ nakɛyɛ ɛwɛɛ nɛ ka-taa ñɩma youni ɖama yɔ, kaalaɣzɩɣ yɔkʋʋ.
      sbs: 0.6233
      gen_sec: 4.24
      ref_sec: 4.52
      cer: 0.2679
      wer: 0.8333
    bible_00024:
      source: bible
      text: '» Ɛlɛ́, Yesu heyi-wɛ se: «Yee ḿbʋ́ ɩla mbʋ́ Abraham laba yɔ.'
      sbs: 0.5553
      gen_sec: 13.36
      ref_sec: 14.18
      cer: 2.375
      wer: 3.1818
    bible_00025:
      source: bible
      text: 'Ɛlɛ́, mantañɩnɩ se mamanɩ ñɔ-yɔɔ nɛ mala nabʋyʋ: maacɛyɩɣ-ŋ se ŋlabɩ-m mbʋ́ pʋwɛ ɖeu yɔ.'
      sbs: 0.6542
      gen_sec: 6.64
      ref_sec: 6.34
      cer: 0.1515
      wer: 0.7333
    bible_00026:
      source: bible
      text: Ɛlɛ́, weyi ɛkpɛzɩɣ ɛyáa ɛsɩndaa se pɩtɛkɛ mantɩnɩ-ɩ yɔ, mɔnkɔŋ kpɛzʋʋ ɖɔɖɔ Ɛsɔ tiyiyaa ɛsɩndaa
        se pɩtɛkɛ mantɩnɩ-ɩ.
      sbs: 0.6313
      gen_sec: 8.48
      ref_sec: 6.86
      cer: 0.0435
      wer: 0.1667
    bible_00027:
      source: bible
      text: Ɛlɛ́, ɛlakɩ mbá paba ñetisiɣ pa-tɩ yɔ lootiye.
      sbs: 0.6839
      gen_sec: 4.16
      ref_sec: 3.04
      cer: 0.5714
      wer: 1.25
    bible_00028:
      source: bible
      text: Piyeba pɩlaʋ kpɛɖɛ.
      sbs: 0.7469
      gen_sec: 2.8
      ref_sec: 3.28
      cer: 0.125
      wer: 0.6667
    bible_00029:
      source: bible
      text: 'Pilaatɩ nɩ ḿbʋ́ lɛ, sɔɔndʋ tɛzɩ-ɩ kpaʋ nɛ ɛpɩsɩ ɛsʋʋ nɛ ɛpɔzɩ Yesu se: «Ñɛ-tɛ le?'
      sbs: 0.5714
      gen_sec: 6.08
      ref_sec: 7.42
      cer: 0.1695
      wer: 0.5
    bible_00030:
      source: bible
      text: 'Toovenim lɛ, meheyiɣ-mɩ se: paa le posusuu Laŋhɛzɩyɛ Tɔm yɔ, pɔkɔŋ kɛdʋʋ mbʋ́ halʋ ɛnɛ ɛlabɩ
        mɔ-yɔɔ yɔ pʋ-tɔm nɛ ɛyáa ɛtaasɔɔ ɛ-yɔɔ kaʋ.'
      sbs: 0.633
      gen_sec: 11.44
      ref_sec: 9.3
      cer: 0.1442
      wer: 0.2917
    bible_00031:
      source: bible
      text: Yuda ñɩma pɔzʋʋ se pala hama lakasɩ nɛ pana nɛ pʋcɔ petisi, Grɛɛkɩ ñɩma ñañɩnɩɣ lɔŋsɩnɖɛ
        se pʋcɔ.
      sbs: 0.6199
      gen_sec: 7.76
      ref_sec: 6.14
      cer: 0.0897
      wer: 0.2222
    bible_00032:
      source: bible
      text: Ḿbʋ́ yebina nɛ ñɔɔsɩ ñawɩɣ nabɛyɛ nɛ sʋlʋm ñakʋʋ lɛlaa.
      sbs: 0.6791
      gen_sec: 2.96
      ref_sec: 3.44
      cer: 0.2045
      wer: 0.6
    bible_00033:
      source: bible
      text: Pʋwayɩ lɛ, mana kpɩnɛ naɖɩyɛ, ɖɩlɩɣaɣnɩ teŋgu taa.
      sbs: 0.6595
      gen_sec: 3.84
      ref_sec: 3.86
      cer: 0.175
      wer: 0.625
    bible_00034:
      source: bible
      text: Yee ɛha nɔɔyʋ se ɛsɩnɩ lɛlaa yɔ, pʋwɛɛ se ɛsɩnɩ-wɛ nɛ ɖoŋ weyi Ɛsɔ ha-ɩ yɔ.
      sbs: 0.6379
      gen_sec: 6.72
      ref_sec: 4.46
      cer: 0.0
      wer: 0.0
    bible_00035:
      source: bible
      text: 'Pʋkɔma pɩɖɛɛ Pɔɔlɩ lɛ, ɛpɩsɩnɩ pɛlɛ ɛnʋ ɛ-yɔɔ nɛ eholini eleeu weyi ɛwɛ ɛ-wayɩ yɔ se: «Yesu
        Krɩstʋ ɖoŋ taa lɛ, meheyiɣ-ŋ se ŋse pɛlɛ ɛnʋ ɛ-wayɩ!'
      sbs: 0.6045
      gen_sec: 10.88
      ref_sec: 10.48
      cer: 0.156
      wer: 0.3704
    bible_00036:
      source: bible
      text: Yee mɩ-taa nabɛyɛ ɛyɔɔdʋʋ kʋnʋmɩŋ ndɩ ndɩ yɔ, pɛwɛɛ naalɛ yaa naadozo, pataaɖɛɛ pʋ-yɔɔ.
      sbs: 0.6493
      gen_sec: 6.0
      ref_sec: 7.08
      cer: 0.087
      wer: 0.4286
    bible_00037:
      source: bible
      text: 'Peeɖe ɛ́lɛ́ ñɔpɔzɩ-ɩ se: «Ña lɛ Yuda ñɩma wiyaʋ sɔsɔ naa we?'
      sbs: 0.6593
      gen_sec: 4.4
      ref_sec: 5.24
      cer: 0.2093
      wer: 0.75
    bible_00038:
      source: bible
      text: Mbʋ́ pʋyɔɔ yɔ, ɛ-maɣmaɣ ɛsɔɔlɩ-mɩ se ɩsɔɔlɩ-m nɛ ɩwɛnɩ lidaʋ se ɛ-cɔlɔ malɩnaa.
      sbs: 0.6621
      gen_sec: 6.08
      ref_sec: 5.5
      cer: 0.15
      wer: 0.5385
    bible_00039:
      source: bible
      text: Ɛkɛ Krɩstʋ tʋmlaɖʋ mɩ-cɔlɔ, ɛlakɩ mbʋ́ pʋpɔzʋʋ yɔ.
      sbs: 0.6626
      gen_sec: 3.28
      ref_sec: 3.56
      cer: 0.0
      wer: 0.0
    bible_00040:
      source: bible
      text: Nabʋyʋ kɛwɛɛ nɛ pʋcɔ Ɛsɔ la kedeŋa, ɖɩnɩ pʋ-tɔm nɛ ɖɩna-pʋ nɛ ɖɛ-ɛsɛ nɛ ɖɩcɔnɩ-pʋ kpem, ɖitukuni-pʋ
        nɛ ɖe-nesi.
      sbs: 0.6307
      gen_sec: 10.0
      ref_sec: 7.84
      cer: 0.1786
      wer: 0.4737
    bible_00041:
      source: bible
      text: 'Ɛlɛ́, Pɩyɛ heyi-kɛ se: «Mɛnfɛyɩnɩ liidiye yaa sika, ɛlɛ́, mahaɣ-ŋ mbʋ́ mɛwɛna yɔ: Nazarɛɛtɩ
        tʋ Yesu Krɩstʋ ɖoŋ taa lɛ, kʋyɩ ŋɖɔ!'
      sbs: 0.6297
      gen_sec: 11.6
      ref_sec: 10.0
      cer: 0.0957
      wer: 0.3182
    bible_00042:
      source: bible
      text: Ḿbá kɛɖɛnɩ ma nɛ ɩ nɔɔ nɛ powolo paɖaŋ-ɖʋ Trowaasɩ tɛtʋ taa.
      sbs: 0.6705
      gen_sec: 3.44
      ref_sec: 3.48
      cer: 0.0
      wer: 0.5833
    bible_00043:
      source: bible
      text: Mbʋ́ pʋyɔɔ yɔ, ɖɩnawa se ɛyáa kizi ŋgbɛyɛ nɖɩ́ ŋwɛ ɖɩ-taa yɔ ɖɩ-tɔm paa le.
      sbs: 0.6492
      gen_sec: 4.48
      ref_sec: 5.14
      cer: 0.1091
      wer: 0.4667
    bible_00044:
      source: bible
      text: '» Halʋ ɛnʋ ecosi-i se: «Kɩpaɣlʋ!'
      sbs: 0.5827
      gen_sec: 2.32
      ref_sec: 3.22
      cer: 0.3636
      wer: 0.8
    bible_00045:
      source: bible
      text: '» Ḿbʋ́ ɖɔɖɔ pɛtɛm tɔɔnaɣ tɔɔʋ lɛ, ɛkpaɣ sʋlʋm nɛ caɖaɣ nɛ ɛtɔ se: «Sʋlʋm caɖaɣ kanɛ lɛ nɔɔ
        haʋ kɩfam mbʋ́ pɩtɩŋnɩ man-calɩm yɔɔ nɛ pʋwɛɛ yɔ.'
      sbs: 0.489
      gen_sec: 31.92
      ref_sec: 10.04
      cer: 0.8571
      wer: 1.6667
    bible_00046:
      source: bible
      text: Ŋgʋ́, ma-maɣmaɣ mɛntɛkɛ weyi ɛtasɩ Ɛsɔ paɣtʋ yɔ.
      sbs: 0.6634
      gen_sec: 3.04
      ref_sec: 3.26
      cer: 0.1081
      wer: 0.5
    bible_00047:
      source: bible
      text: '› Ɛlɛ́, ecosuu-mɩ se: ‹Mantasɩ ɖenɖe ɩlɩnaa yɔ.'
      sbs: 0.6547
      gen_sec: 4.4
      ref_sec: 12.66
      cer: 0.2424
      wer: 0.5714
    bible_00048:
      source: bible
      text: Pɛwɛ ɛzɩ tɩɩnzɩ nzɩ́ sɩɩcakɩ lone kʋɖʋmɖɩyɛ taa yɔ.
      sbs: 0.6295
      gen_sec: 4.08
      ref_sec: 3.1
      cer: 0.0244
      wer: 0.1111
    bible_00049:
      source: bible
      text: Mentendiɣ Ɛsɔ se eyele nɛ nɔɔ kʋɖʋmaɣ ŋgá pɩtɩŋnɩ lidaʋ ŋgʋ́ ɖɩwɛnɩ yɔ kʋ-yɔɔ nɛ ɖɩla yɔ,
        kasɩnɩ-ŋ nɛ ŋtɩlɩ ñɩm kɩbam mbʋ́ pɩtɩŋa payɩ ɖɩwɛnɩ ɖa nɛ Krɩstʋ ɖɛ-kpɛndʋʋ taa yɔ.
      sbs: 0.6419
      gen_sec: 11.28
      ref_sec: 11.84
      cer: 0.1185
      wer: 0.4062
    bible_00050:
      source: bible
      text: Ɛlɛ́, Ɛsɔ koboyaɣ nɛ e-ɖoŋ peyele nɛ ñɔsɩ nasɩyɩ ñɛyɩ ɖɩɣa ŋ́gá ka-taa.
      sbs: 0.6251
      gen_sec: 5.28
      ref_sec: 4.82
      cer: 0.0755
      wer: 0.3077
    bible_00051:
      source: bible
      text: '» Ɛyɔɔdɩ ḿbʋ́ lɛ, ɛtasɩ se: «Đɛ-ɛgbaɣdʋ Lazaarɩ ɖou, ɛlɛ́, mowoki menfezi-i.'
      sbs: 0.5546
      gen_sec: 27.2
      ref_sec: 5.84
      cer: 2.037
      wer: 1.9091
    bible_00052:
      source: bible
      text: Ɛlɛ́, ɩɖʋ mɩ-taa se Krɩstʋ lɛ Kɩpaɣlʋ nɛ ɩɖʋ-ɩ hɩɖɛ.
      sbs: 0.6381
      gen_sec: 4.08
      ref_sec: 3.84
      cer: 0.2368
      wer: 0.4
    bible_00053:
      source: bible
      text: Kpaagbaa ḿbʋ́ lɛ, kɔkɔɖɛ naɖɩyɛ lɩɩnɩ ɛsɔdaa ɛzɩ heɣlim sɔsɔm makʋʋ yɔ nɛ ɖisu ɖɩɣa ŋgá
        ka-taa paawɛɛ yɔ katɩŋa.
      sbs: 0.6398
      gen_sec: 8.32
      ref_sec: 6.38
      cer: 0.1011
      wer: 0.65
    bible_00054:
      source: bible
      text: Ɛnʋ lɛ ɖiyiyu weyi ɛcɔŋnɩ mɩ-yɔɔ yɔ.
      sbs: 0.6692
      gen_sec: 2.08
      ref_sec: 3.96
      cer: 0.1786
      wer: 0.2857
    bible_00055:
      source: bible
      text: Ɛlɛ́, yee ɖiheyi ɖa-kɩwɛɛkɩm yɔ, Ɛsɔ kpeɣiɣ-ɖʋ-pʋ nɛ ɛñalɩ ɖa-kɩdɛkɛdɩm tɩŋa.
      sbs: 0.6653
      gen_sec: 8.56
      ref_sec: 4.86
      cer: 0.2712
      wer: 0.6364
    bible_00056:
      source: bible
      text: Pasʋ pɩlaʋ taa lɛ, pamaɣnɩ evebu nɔɔyʋ caɣ pa-nɩwaŋ yɔɔ.
      sbs: 0.6284
      gen_sec: 4.32
      ref_sec: 3.4
      cer: 0.1136
      wer: 0.7
    bible_00057:
      source: bible
      text: 'Đɩsɛ-mɩ: ɖa-Caa Ɛsɔ ɛlabɩ-mɩ lootiye nɛ ɛhɛzɩ mɩ-laŋa!'
      sbs: 0.6336
      gen_sec: 5.04
      ref_sec: 5.16
      cer: 0.0244
      wer: 0.5
    bible_00058:
      source: bible
      text: Yesu lɩnɩ kpɩyʋʋ taa nɛ etii lɛ, abalʋ nɔɔyʋ tɩlɩʋnɩ pɩlaŋ taa nɛ ewolo ɛ-cɔlɔ.
      sbs: 0.6549
      gen_sec: 7.84
      ref_sec: 5.42
      cer: 0.2419
      wer: 0.6
    bible_00059:
      source: bible
      text: 'Ɛlɛ́, Yuda ñɩma pazɩ kubusi mabʋ se: «Yee ŋyebi abalʋ ɛnʋ yɔ, ŋtɛkɛ Room wiyaʋ sɔsɔ ɛgbaɣdʋ!'
      sbs: 0.5713
      gen_sec: 7.36
      ref_sec: 6.82
      cer: 0.1429
      wer: 0.3529
    bible_00060:
      source: bible
      text: 'Pekpeɣlaa lɛ, eheyi-wɛ se: «Man-taabalaa!'
      sbs: 0.6768
      gen_sec: 4.08
      ref_sec: 3.88
      cer: 0.0968
      wer: 1.0
    bible_00061:
      source: bible
      text: Nabɛyɛ wokaɣnɩ abalʋ nɔɔyʋ paa ɖooye nɛ pacaɣzɩɣ Ɛsɔ ɖɩɣa nɔnɔɔ ŋgá payaɣ se Nɔnɔɔ Đeu Ñɩŋga
        yɔ ka-taa se ɛsʋlʋmɩ mbá pasʋʋ yɔ liidiye.
      sbs: 0.6336
      gen_sec: 10.56
      ref_sec: 8.72
      cer: 0.1193
      wer: 0.44
    bible_00062:
      source: bible
      text: Pɩlɛdaa lɛ, Yesu nɛ ɛ-tɔmkpɛlɩkɩyaa hiu nɛ naalɛ pacaɣ tɔɔnaɣ ɖɩtɔɔyɛ.
      sbs: 0.6673
      gen_sec: 5.28
      ref_sec: 4.48
      cer: 0.0526
      wer: 0.8182
    bible_00063:
      source: bible
      text: Ɩla ḿbʋ́ ɖɔɖɔ awiya nɛ ñʋndɩnaa patɩŋa payɩ pɔ-yɔɔ nɛ ɖɩpɩzɩ ɖɩcaɣ wezuu laŋhɛzɩyɛ taa fɛɛɛ
        nɛ ɖɩña Ɛsɔ camɩyɛ nɛ ɖɩla mbʋ́ pʋmʋnaa yɔ.
      sbs: 0.6408
      gen_sec: 8.24
      ref_sec: 10.24
      cer: 0.1121
      wer: 0.4
    bible_00064:
      source: bible
      text: Đɔɖɔ lɛ, Ɛsɔ weyi efezi Kɩpaɣlʋ nɛ sɩm taa yɔ, ɛkɔŋ-ɖʋ fezuu ɖɔɖɔ nɛ e-ɖoŋ.
      sbs: 0.6411
      gen_sec: 6.56
      ref_sec: 5.76
      cer: 0.2143
      wer: 0.5333
    bible_00065:
      source: bible
      text: Pʋwayɩ lɛ, Yesu yebi-wɛ peeɖe nɛ ewolo Betaanii nɛ ɛsʋʋ.
      sbs: 0.6407
      gen_sec: 4.24
      ref_sec: 3.96
      cer: 0.0682
      wer: 0.3
    bible_00066:
      source: bible
      text: Ɛlɛ́, heɣlim ḿbʋ́ pʋwɛnɩ pɩmakɩ ɖoŋ ḿbʋ́ nɛ ɖɩtɛzɩ lɔʋ liu se ɖɔ-tɔm tɛma.
      sbs: 0.6043
      gen_sec: 5.12
      ref_sec: 4.66
      cer: 0.1636
      wer: 0.6429
    bible_00067:
      source: bible
      text: 'Patanɩ-wɛ tɔm hʋyaa sɔsaa cɔlɔ lɛ, cɔjɔnaa ñʋʋdʋ pazɩ-wɛ tɔm pɔzʋʋ se: «Đikizini-mɩ kpem
        se ɩtaatasɩ wɩlʋʋ nɛ abalʋ ɛnʋ ɛ-nɔɔ lɛ, ɛbɛ ɩlaba yɔ?'
      sbs: 0.6222
      gen_sec: 11.92
      ref_sec: 10.16
      cer: 0.0909
      wer: 0.44
    bible_00068:
      source: bible
      text: Ɛzɩma kpem ɖɩpɩzɩɣ ɖɩsa Ɛsɔ mɩ-yɔɔ laŋhʋlʋmɩyɛ nɖɩ́ iyeba nɛ ɖɩwɛnɩ ɛ-ɛsɩndaa yɔ ɖɩ-yɔɔ?
      sbs: 0.6284
      gen_sec: 5.84
      ref_sec: 4.62
      cer: 0.0143
      wer: 0.1429
    bible_00069:
      source: bible
      text: 'Peeɖe manɩɣ puholuuni ɛsɔdaa ɖoŋ se: «Lɛɛlɛɛyɔ, ñʋʋ yabʋ alɩwaatʋ talaa!'
      sbs: 0.6115
      gen_sec: 5.6
      ref_sec: 6.26
      cer: 0.1379
      wer: 0.7273
    bible_00070:
      source: bible
      text: 'Ɛlɛ́, Yesu heyi-wɛ se: «Alɩwaatʋ tatalɩda se mowolo peeɖe.'
      sbs: 0.6394
      gen_sec: 4.4
      ref_sec: 4.74
      cer: 0.0682
      wer: 0.3333
    bible_00071:
      source: bible
      text: Pɩkɛdaa lɛ, ɛna lelu kʋñɔndʋ nɔɔyʋ woni liidiye pɔɔyɩsɩ cikpesi naalɛ nɛ ɛɖʋ.
      sbs: 0.6562
      gen_sec: 5.28
      ref_sec: 5.28
      cer: 0.2063
      wer: 0.7692
    bible_00072:
      source: bible
      text: 'Ńdʋ́ lɛ se: «Iheyi Siiyɔɔ ñɩma se: ɩcɔnɩ ɩna, mi-wiyaʋ sɔsɔ kɔŋ!'
      sbs: 0.7091
      gen_sec: 6.08
      ref_sec: 5.68
      cer: 0.087
      wer: 0.25
    bible_00073:
      source: bible
      text: Ńdʋ́ ɖɛ-ɛgbaɣdʋ Epafraasɩ weyi ɖa nɛ ɩ ɖɩlakɩ tʋmɩyɛ yɔ, ɛwɩlɩ-mɩ.
      sbs: 0.6317
      gen_sec: 3.84
      ref_sec: 4.12
      cer: 0.1373
      wer: 0.9091
    bible_00074:
      source: bible
      text: Mbʋ́ pʋyɔɔ yɔ, Yeruusalɛm ñɩma tɩŋa na keɣlee se ḿbá labɩnɩ hama lakasɩ ńzɩ́.
      sbs: 0.6606
      gen_sec: 4.4
      ref_sec: 5.88
      cer: 0.1167
      wer: 0.5
    bible_00075:
      source: bible
      text: Ɩtɛm naʋ mɩ-maɣmaɣ se Ɛsɔ lɩzɩ-m mɩ-hɛkʋ taa cɩnɛ kajalaɣ alɩwaatʋ taa se mowolo meheyi mbá
        pɛtɛkɛ Yuda ñɩma yɔ Laŋhɛzɩyɛ Tɔm nɛ pɛwɛnɩ lidaʋ Yesu yɔɔ.
      sbs: 0.6522
      gen_sec: 10.08
      ref_sec: 9.8
      cer: 0.1157
      wer: 0.2963
    bible_00076:
      source: bible
      text: 'Peeɖe powobi Yohanɛɛsɩ cɔlɔ nɛ pɔpɔzɩ-ɩ se: «Wɩlɩyʋ!'
      sbs: 0.6563
      gen_sec: 3.68
      ref_sec: 4.26
      cer: 0.2927
      wer: 0.5
    bible_00077:
      source: bible
      text: Weyi ɛ́lɛ́ lakɩ kɩwɛɛkɩm yɔ, ɛɛɖɔŋ Ɛsɔ paɣtʋ yɔɔ.
      sbs: 0.6474
      gen_sec: 2.8
      ref_sec: 3.04
      cer: 0.1622
      wer: 0.4444
    bible_00078:
      source: bible
      text: Ekem eleeu nɔɔyʋ nɛ ɛcɔʋ ɛtɩyɩɣ nɛ eheyiɣ ɛyáa mbʋ́ pʋkɔŋ labʋ yɔ nɛ ɛkɔŋnɩ ɛ-caanaa liidiye
        sakɩyɛ.
      sbs: 0.6646
      gen_sec: 8.72
      ref_sec: 7.04
      cer: 0.0875
      wer: 0.2222
    bible_00079:
      source: bible
      text: Pʋ-yɔɔ lɛ, taabalaa, paa ɖɩnɩɣ siziŋ nɛ ɖɩtɔkɩ kʋñɔmɩŋ yɔ, ɖa-laŋɩyɛ hɛnɩ-mɩ mi-lidaʋ wɛnaʋ
        yɔɔ.
      sbs: 0.6508
      gen_sec: 8.48
      ref_sec: 6.62
      cer: 0.1486
      wer: 0.7333
    bible_00080:
      source: bible
      text: Paa ḿbʋ́ yɔ, ɛnɩwa se pɩwɩɣ Lazaarɩ lɛ, ɛtasɩ caɣʋ kɩyakɩŋ naalɛ ɖenɖe ɛɛwɛɛ yɔ.
      sbs: 0.6607
      gen_sec: 6.16
      ref_sec: 6.08
      cer: 0.129
      wer: 0.3333
    bible_00081:
      source: bible
      text: 'Peeɖe lɔŋsɩnɖaa mbá pɛkɛ Epikuri nɛ Sitoyiisi pa-aŋgba taa ñɩma yɔ, powobi Pɔɔlɩ cɔlɔ nɛ
        pa nɛ ɩ pɔyɔɔdʋʋ nɛ pa-taa lɛlaa tɔŋ se: «Abalʋ kɔkɔɖɛ yaɖʋ ɛnɛ, se we ɛyɔɔdʋʋ yee?'
      sbs: 0.621
      gen_sec: 12.72
      ref_sec: 11.6
      cer: 0.097
      wer: 0.3125
    bible_00082:
      source: bible
      text: Pɩlabɩ kɩyakɩŋ kagbaanzɩ lɛ, cɔjɔnaa ñʋʋdʋ Anaanɩyaasɩ nɛ ɛjaɖɛ taa sɔsaa nabɛyɛ nɛ tɔm loluyu
        Tɛrtuluusi patalɩ Sezaaree wiyaʋ sɔsɔ Feliksɩ tɛ se pakʋyɩ Pɔɔlɩ yɔɔ.
      sbs: 0.6804
      gen_sec: 12.4
      ref_sec: 11.26
      cer: 0.1241
      wer: 0.5385
    bible_00083:
      source: bible
      text: Pʋbʋ, sɔɔndʋ ɛɛkpaɣ-mɩ nɛ mi-koyindinaa nabʋyʋ taa.
      sbs: 0.6252
      gen_sec: 5.04
      ref_sec: 3.32
      cer: 0.0732
      wer: 0.7143
    bible_00084:
      source: bible
      text: Pɔɔlɩ susaa se pakam Krɩstʋ kaamaŋkaɣ yɔɔ.
      sbs: 0.6838
      gen_sec: 5.04
      ref_sec: 4.3
      cer: 0.3143
      wer: 0.8571
    bible_00085:
      source: bible
      text: Ɩla ɛzɩ ma yɔ, mbʋ́ pʋyɔɔ yɔ, ma-maɣmaɣ malakɩ ɛzɩ Krɩstʋ yɔ.
      sbs: 0.7008
      gen_sec: 5.52
      ref_sec: 5.26
      cer: 0.0222
      wer: 0.25
    bible_00086:
      source: bible
      text: Feliksɩ caɣaɣ se pɩla Yuda ñɩma leleŋ lɛ, eyele Pɔɔlɩ salaka taa ḿbʋ́.
      sbs: 0.6237
      gen_sec: 7.04
      ref_sec: 6.26
      cer: 0.2182
      wer: 0.6154
    bible_00087:
      source: bible
      text: Ŋgʋ́, pɩɩwɛɛ se mɩ-ɛsɛ ɛñɩŋ nɛ ɩɖɔɔnɩ weyi ɛlabɩ lakasɩ ńzɩ́ yɔ mɩ-ŋgbɛyɛ taa.
      sbs: 0.6382
      gen_sec: 5.92
      ref_sec: 5.36
      cer: 0.1864
      wer: 0.7143
    bible_00088:
      source: bible
      text: Pʋwɛɛ se mowolo palabɩ-m lɩm sɔʋ sɔnzɩ nɛ mentendi Kɩpaɣlʋ nɛ ɛñalɩ-m man-kɩwɛɛkɩm.
      sbs: 0.5756
      gen_sec: 6.72
      ref_sec: 7.28
      cer: 0.1045
      wer: 0.5385
    bible_00089:
      source: bible
      text: '» Peeɖe ɛ-tɔmkpɛlɩkɩyaa taa lɛlʋ weyi payaɣ se Andree nɛ ɛkɛ Siimɔɔ Pɩyɛ neu yɔ, eheyi-i
        se: «Abalɩbɩɣa nakɛyɛ wɛ cɩnɛ, kɛwɛnɩ tindine hɔɔlasɩ kagbaanzɩ nɛ kpakpasɩ naalɛ.'
      sbs: 0.5611
      gen_sec: 9.2
      ref_sec: 11.06
      cer: 0.7132
      wer: 1.0
    bible_00090:
      source: bible
      text: 'Cɔjɔnaa sɔsaa nɛ Ɛsɔ ɖɩɣa yɔɔ ɖaŋɩyaa pana-ɩ lɛ, pamakɩ kobusi se: «Kam-ɩ kaamaŋkaɣ yɔɔ!'
      sbs: 0.5681
      gen_sec: 7.28
      ref_sec: 7.66
      cer: 0.0294
      wer: 0.4
    bible_00091:
      source: bible
      text: › Yee nɔɔyʋ ɛwɛ ka-taa nɛ ɛñɩnɩɣ laŋhɛzɩyɛ yɔ, mɩ-laŋhɛzɩyɛ tɔm wɛɣ ɛ-cɔlɔ.
      sbs: 0.6547
      gen_sec: 5.12
      ref_sec: 4.24
      cer: 0.0877
      wer: 0.3333
    bible_00092:
      source: bible
      text: 'Peeɖe pukuluu ɛ-lɩmaɣza wena awɛ mɛsaɣ tɛɛ yɔ a-yɔɔ nɛ ɛpa ɛ-ɛsɛ nɛ tɛtʋ nɛ ɛsa Ɛsɔ nɛ ɛkaɖɩ
        kpayɩ se: «Toovenim, Ɛsɔ wɛ mɩ-hɛkʋ taa.'
      sbs: 0.6032
      gen_sec: 11.92
      ref_sec: 11.4
      cer: 0.12
      wer: 0.3077
    bible_00093:
      source: bible
      text: Đooo lɛ, ḿbʋ́ ɖɔɖɔ ɩlakaɣ alɩwaatʋ ndʋ́ ɩɩwɛ kɩwɛɛkɩm ḿbʋ́ pɩ-taa yɔ.
      sbs: 0.6322
      gen_sec: 5.36
      ref_sec: 4.08
      cer: 0.1346
      wer: 0.25
    bible_00094:
      source: bible
      text: '» Yesu cosi-wɛ nɛ eduuye taa se: «Meheyiɣ-mɩ se: ɩñaɣ pana nɛ ɩtɩŋnɩ ɖɛɛmɛnɖɛɛ taa nɛ ɩsʋʋ
        nɛ ihiɣ wezuu.'
      sbs: 0.6045
      gen_sec: 5.92
      ref_sec: 7.28
      cer: 0.5696
      wer: 0.7895
    bible_00095:
      source: bible
      text: Ɛlɛ́, manɖaŋaa ɖɔɖɔ se paa sɩm yɔ, mansɩ Kɩpaɣlʋ Yesu yɔɔ Yeruusalɛm.
      sbs: 0.6542
      gen_sec: 5.04
      ref_sec: 5.76
      cer: 0.1667
      wer: 0.6667
    bible_00096:
      source: bible
      text: Yee ɖa-maɣmaɣ ɖɩmaɣzaa nɛ ɖɩtɩlɩ ɖa-tɩ nɛ pʋcɔ yɔ, Ɛsɔ ɛɛhʋʋnɩ-ɖʋ.
      sbs: 0.6467
      gen_sec: 5.12
      ref_sec: 5.1
      cer: 0.1765
      wer: 0.8182
    bible_00097:
      source: bible
      text: Ɛlɛ́, yee nɔɔyʋ ɛɖɔŋ ɖoó taa yɔ, putuuluu-i, mbʋ́ pʋyɔɔ yɔ, ɛfɛyɩnɩ ñalɩmɩyɛ.
      sbs: 0.6576
      gen_sec: 7.44
      ref_sec: 4.74
      cer: 0.1579
      wer: 0.4615
    bible_00098:
      source: bible
      text: Ŋgʋ́, lɔŋsɩnɖɛ tɔm ɖisusuu ɛyáa mbá papɩ Ɛsɔ nʋmɔʋ taa siŋŋ yɔ.
      sbs: 0.6676
      gen_sec: 4.48
      ref_sec: 4.62
      cer: 0.0408
      wer: 0.1667
    bible_00099:
      source: bible
      text: Sɔɔndʋ kpaɣaɣ-wɛ se mɛlɛ ɛtaakɔɔ kuyoni ɛwasɩ nasɩyɩ.
      sbs: 0.6296
      gen_sec: 4.88
      ref_sec: 3.12
      cer: 0.1364
      wer: 0.75
    bible_00100:
      source: bible
      text: Mbʋ́ pʋyɔɔ yɔ, Kɩpaɣlʋ cɔŋnɩ mbá patʋʋzɩ ɛ-ɛsɩndaa yɔ pɔ-yɔɔ.
      sbs: 0.6218
      gen_sec: 4.4
      ref_sec: 3.76
      cer: 0.0851
      wer: 0.3
    bible_00101:
      source: bible
      text: Yesu tɛm ɛ-tɔmkpɛlɩkɩyaa yɔɔ Ɛsɔ tenduu ḿbʋ́ lɛ, ɛ nɛ wɛ powolo pɛtɛzɩ lɔmʋʋ ŋgʋ́ payaɣ se
        Sedrɔɔ yɔ nɛ pasʋʋ kaɖaɣ ŋgá kɛwɛ peeɖe yɔ ka-taa.
      sbs: 0.6397
      gen_sec: 8.88
      ref_sec: 8.54
      cer: 0.1101
      wer: 0.2222
    bible_00102:
      source: bible
      text: Ɩtɔzɩ se ɛkɔŋ-mɩ hɛyʋʋ ñɩm mbʋ́ ɛñɔɔzaa nɛ ɛɖaŋnɩ ɛ-ñɩma yɔ.
      sbs: 0.5507
      gen_sec: 4.24
      ref_sec: 4.3
      cer: 0.1304
      wer: 0.6364
    bible_00103:
      source: bible
      text: Maakpa halaa nɛ abalaa nɛ mɔhɔkɩ-wɛ nɛ manɖʋ salaka.
      sbs: 0.6225
      gen_sec: 3.12
      ref_sec: 4.46
      cer: 0.0952
      wer: 0.3333
    bible_00104:
      source: bible
      text: Powoba lɛ, ɛlɩzɩ pa-taa ɛyáa hiu nɛ naalɛ se pɛkɛ e-tiyiyaa.
      sbs: 0.6375
      gen_sec: 4.72
      ref_sec: 4.66
      cer: 0.087
      wer: 0.4545
    bible_00105:
      source: bible
      text: Fɛstuusi cosi-wɛ se Pɔɔlɩ wɛ salaka taa Sezaaree.
      sbs: 0.6932
      gen_sec: 3.68
      ref_sec: 3.2
      cer: 0.35
      wer: 1.0
    bible_00106:
      source: bible
      text: Pɩkɛdaa lɛ, pɩlabɩ-ɩ liii nɛ ɛlɩɩnɩ ɖɩ-yɔɔ ɖooo ɛsɔdaa kuduyuu naadozo ñɩŋgʋ taa nɛ etii
        ɛfalɩ tataa.
      sbs: 0.678
      gen_sec: 7.44
      ref_sec: 6.42
      cer: 0.0617
      wer: 0.3529
    bible_00107:
      source: bible
      text: 'Alɩwaatʋ talɩɣ lɛ, ɛlabɩ-pʋ: ekpeɣliɣ mbʋ́ pɩtɩŋa payɩ pʋwɛ ɛsɔdaa nɛ tataa yɔ wiyaʋ kʋɖʋm
        koŋ tɛɛ.'
      sbs: 0.6193
      gen_sec: 9.28
      ref_sec: 8.64
      cer: 0.1026
      wer: 0.4118
    bible_00108:
      source: bible
      text: Ɛlɛ́, Room sɔɔja sɔsɔ kizini-wɛ, mbʋ́ pʋyɔɔ yɔ, e-liu wɛɛ se ɛya Pɔɔlɩ ñʋʋ.
      sbs: 0.6271
      gen_sec: 6.4
      ref_sec: 5.08
      cer: 0.0556
      wer: 0.2143
    bible_00109:
      source: bible
      text: Pʋ-yɔɔ lɛ, pʋwɛɛ se ɖa ɖɔɖɔ ɖɩsɩ ɖa-taabalaa yɔɔ.
      sbs: 0.7272
      gen_sec: 3.04
      ref_sec: 3.6
      cer: 0.0811
      wer: 0.2222
    bible_00110:
      source: bible
      text: Yesu ha tɔɔnaɣ samaɣ sɔsɔɔ nɛ kɔtɔɔ.
      sbs: 0.6501
      gen_sec: 4.0
      ref_sec: 3.58
      cer: 0.069
      wer: 0.2857
    bible_00111:
      source: bible
      text: Ŋgʋ́, Yesu taatɩtalɩda tɛtʋ taa, ɛlɛ́, ɛɛwɛ ɖenɖe Maarta kakatɩ-ɩ yɔ ḿbʋ́.
      sbs: 0.6453
      gen_sec: 5.76
      ref_sec: 5.44
      cer: 0.2909
      wer: 0.75
    bible_00112:
      source: bible
      text: Ɩsɛɛ mbá patɩŋa payɩ pɛkɛ Ɛsɔ ñɩma pa nɛ Krɩstʋ Yesu pɛ-kpɛndʋʋ taa yɔ.
      sbs: 0.6222
      gen_sec: 5.2
      ref_sec: 4.6
      cer: 0.0536
      wer: 0.2857
    bible_00113:
      source: bible
      text: Peeɖe Siimɔɔ nɛ ɛ-taabalaa papazɩ-ɩ ñɩnʋʋ.
      sbs: 0.5761
      gen_sec: 4.64
      ref_sec: 5.74
      cer: 0.2647
      wer: 1.0
    bible_00114:
      source: bible
      text: 'Ɛɛpɩzɩɣ ɛtasɩ labʋ kɩwɛɛkɩm: ɛ-Caa lɛ Ɛsɔ.'
      sbs: 0.6289
      gen_sec: 4.24
      ref_sec: 3.16
      cer: 0.1818
      wer: 0.7143
    bible_00115:
      source: bible
      text: 'Ɛlɛ́, ɛcaɣ nɛ ɛmaɣzɩ ɛ-taa se: ‹Mala ɛzɩma lee?'
      sbs: 0.6564
      gen_sec: 3.6
      ref_sec: 9.38
      cer: 0.0909
      wer: 0.5556
    bible_00116:
      source: bible
      text: Mɛwɛ tanɩm taa yaa mɛwɛnɩ sakɩyɛ yɔ, mansɩm man-tɩ ɖɔkʋʋ.
      sbs: 0.6115
      gen_sec: 4.88
      ref_sec: 4.76
      cer: 0.0667
      wer: 0.2
    bible_00117:
      source: bible
      text: Paa sɩm yɔ, mansɩkɩ ñɔ-yɔɔ!
      sbs: 0.6307
      gen_sec: 2.0
      ref_sec: 11.84
      cer: 0.25
      wer: 0.8
    bible_00118:
      source: bible
      text: 'Mbʋ́ pʋyɔɔ yɔ, paɖʋ tɩ-taa se: «Nɔ weyi ɛmakɩ mɩla yɔ, paahɔkʋʋ ɛ-nɔɔ se ɛtaatɔɔ.'
      sbs: 0.6527
      gen_sec: 6.48
      ref_sec: 7.34
      cer: 0.0678
      wer: 0.4
    bible_00119:
      source: bible
      text: 'Kɩyakʋ ŋgʋ́ Yesu tukaɣ aduwa yɔ, kɩ-ɖanaɣ yɔɔ eheyi ɛ-tɔmkpɛlɩkɩyaa se: «Đɩtɛzɩ teŋgu kidiiliŋ
        lɛɛkʋ yɔɔ.'
      sbs: 0.6423
      gen_sec: 8.96
      ref_sec: 7.5
      cer: 0.0843
      wer: 0.5
    bible_00120:
      source: bible
      text: Ɛ-taa ɛɛhʋlʋmʋʋnɩ kɩdɛkɛdɩm, ɛlɛ́, toovenim ɛ-taa hʋlʋmʋʋna.
      sbs: 0.6744
      gen_sec: 5.12
      ref_sec: 4.5
      cer: 0.0417
      wer: 0.1429
    bible_00121:
      source: bible
      text: Maarkɩ nɛ Aristaarkɩ nɛ Demaasɩ nɛ Luka mbá ma nɛ wɛ ɖɩlakɩ tʋmɩyɛ kʋɖʋmɖɩyɛ yɔ, pɛsɛ-ŋ ɖɔɖɔ.
      sbs: 0.6219
      gen_sec: 7.6
      ref_sec: 8.36
      cer: 0.1351
      wer: 0.8235
    bible_00122:
      source: bible
      text: Đa-Caa Ɛsɔ maɣmaɣ nɛ ɖa-Kɩpaɣlʋ Yesu pɔñɔɔzɩ ɖa-nʋmɔʋ nɛ ɖɩpɩzɩ ɖɩtalɩ-mɩ!
      sbs: 0.6388
      gen_sec: 6.8
      ref_sec: 5.52
      cer: 0.1017
      wer: 0.6364
    bible_00123:
      source: bible
      text: Yesu laba nɛ lɩm pɩsɩ sʋlʋm Kana tɛtʋ taa.
      sbs: 0.7255
      gen_sec: 4.0
      ref_sec: 5.18
      cer: 0.2121
      wer: 0.6667
    bible_00124:
      source: bible
      text: Ɛlɛ́, halʋ ɛnʋ ese nɛ ɛsʋʋ lakʋ taa ɖenɖe Ɛsɔ kɔñɔɔzɩ-ɩ ɖɩjaɣyɛ se pɔcɔnɩ ɛ-yɔɔ kɩyakɩŋ kutoku
        nɛ nasɩlɛ nɛ nɩɩnʋwa nɛ hiu yɔ.
      sbs: 0.6463
      gen_sec: 8.96
      ref_sec: 8.94
      cer: 0.102
      wer: 0.375
    bible_00125:
      source: bible
      text: Mbʋ́ pʋyɔɔ yɔ, ḿbʋ́ pʋmʋnaa se pɛhɛyɩ tʋmlaɖʋ ɛ-tʋmɩyɛ yɔɔ.
      sbs: 0.6674
      gen_sec: 4.4
      ref_sec: 3.64
      cer: 0.0667
      wer: 0.9
    bible_00126:
      source: bible
      text: Yesu ɖɔɔnɩ aleewaa abalʋ nɔɔyʋ wayɩ.
      sbs: 0.5977
      gen_sec: 2.08
      ref_sec: 4.44
      cer: 0.0333
      wer: 0.1667
    bible_00127:
      source: bible
      text: Peeɖe ɖɩɖaŋnɩ Kɩpaɣlʋ Yesu Krɩstʋ se ɛkɔɔ ɛya ɖa-ñʋʋ.
      sbs: 0.5648
      gen_sec: 6.24
      ref_sec: 3.22
      cer: 0.2791
      wer: 0.8889
    bible_00128:
      source: bible
      text: Pɩkɛdaa lɛ, Maarɩɩ kpaɣ tɩlaaɖɩ ŋgʋ́ palabɩnɩ naarɩ nɛ petesidi kɩ-taa pʋyʋ yɔ ɛzɩ litri hɔɔlʋʋ
        yɔ nɛ ɛpɩyɩ Yesu naŋgbanzɩ yɔɔ.
      sbs: 0.6383
      gen_sec: 9.68
      ref_sec: 7.54
      cer: 0.1373
      wer: 0.5
    bible_00129:
      source: bible
      text: Nakʋyʋ wiye Ɛsɔ tiyi abalʋ nɔɔyʋ, payaɣ-ɩ se Yohanɛɛsɩ.
      sbs: 0.5996
      gen_sec: 5.12
      ref_sec: 4.0
      cer: 0.1364
      wer: 0.3333
    bible_00130:
      source: bible
      text: Pʋwɛɛ se pʋdʋ ɛha ɛzaɣ́tʋ siɣ́ye nɛ ɛla mbʋ́ pʋwɛ ɖeu yɔ.
      sbs: 0.6402
      gen_sec: 3.68
      ref_sec: 3.48
      cer: 0.1667
      wer: 0.3333
    bible_00131:
      source: bible
      text: 'Peeɖe eheyi-wɛ se: «Ma lɛ, mɛnkɛ Yuda tʋ, palʋlɩ-m Taarsɩ Siliisii ɛjaɖɛ taa.'
      sbs: 0.6641
      gen_sec: 6.4
      ref_sec: 9.0
      cer: 0.2241
      wer: 0.6923
    bible_00132:
      source: bible
      text: Yee ḿbʋ́ Ɛsɔ ɛsɔɔlɩ-ɖʋ yɔ, pʋwɛɛ se ɖa ɖɔɖɔ ɖɩsɔɔlɩ ɖama.
      sbs: 0.6265
      gen_sec: 4.88
      ref_sec: 4.0
      cer: 0.186
      wer: 0.6364
    bible_00133:
      source: bible
      text: Yohanɛɛsɩ ɛnʋ, esuwaɣ toko ŋgʋ́ palʋnɩ kpaŋnɔ siɣá naalɛ tʋ hʋndʋ yɔ.
      sbs: 0.5606
      gen_sec: 5.2
      ref_sec: 3.92
      cer: 0.1818
      wer: 0.75
    bible_00134:
      source: bible
      text: Pʋcɔ ewolo Galilee lɛ, pɩɩwɛɛ se ɛtɩŋnɩ Samaarɩɩ egeetiye taa.
      sbs: 0.6637
      gen_sec: 6.16
      ref_sec: 4.3
      cer: 0.2549
      wer: 0.6
    bible_00135:
      source: bible
      text: Halɩ ɖɩɩlaba kʋñɔŋ siŋŋ nɛ pʋcɔ ɖɩlɩzɩ kpɩyʋʋ cikpeluu ŋgʋ́ palɩzɩɣnɩ ɛyáa yɔ.
      sbs: 0.6346
      gen_sec: 5.12
      ref_sec: 4.5
      cer: 0.1094
      wer: 0.2308
    bible_00136:
      source: bible
      text: 'Peeɖe pɩɖɩɣzɩ-wɛ yem ɖɩɣ ɖɩɣ nɛ pɔtɔŋ se: «Ɛzɩ ɛyáa panɛ pɛtɛkɛ Galilee ñɩma patɩŋa na?'
      sbs: 0.6118
      gen_sec: 6.08
      ref_sec: 6.44
      cer: 0.1618
      wer: 0.375
    bible_00137:
      source: bible
      text: Paa ḿbʋ́ yɔ, mbá panɩ tɔm ńdʋ́ yɔ, pa-taa sakɩyɛ tisi-tʋ nɛ pɔsɔzɩ lɛlaa yɔɔ nɛ pɛtɛzɩ
        ɖɔʋ.
      sbs: 0.6436
      gen_sec: 8.56
      ref_sec: 6.48
      cer: 0.1493
      wer: 0.3333
    bible_00138:
      source: bible
      text: Krɩstʋ ŋgbɛyɛ taa ñɩma mbá Ɛsɔ lɩzɩ Babilooni ɖɔɖɔ ɛzɩ mɩ yɔ nɛ Maarkɩ weyi ɛkɛ man-pɩɣa
        yɔ, pɛsɛ-mɩ.
      sbs: 0.6482
      gen_sec: 6.16
      ref_sec: 6.44
      cer: 0.1013
      wer: 0.6316
    bible_00139:
      source: bible
      text: Yesu na ɛyáa samaɣ ḿbʋ́ lɛ, ɛkpa piyaɣ nakɛyɛ yɔɔ nɛ ɛcaɣ.
      sbs: 0.6354
      gen_sec: 4.0
      ref_sec: 3.32
      cer: 0.0455
      wer: 0.0833
    bible_00140:
      source: bible
      text: 'Toovenim lɛ, meheyiɣ-ŋ se: paɖʋ-ŋ-kɛ yɔ, ŋwɛɣ peeɖe ḿbʋ́ ka ka nɛ pʋkɔɔ pɩsɩɩnɩ kɩyakʋ ŋgʋ́
        ŋhɛyɩ ña-kɩmɩyɛ tɩŋa payɩ nɛ pɩtakazɩ paa koba yɔ.'
      sbs: 0.6122
      gen_sec: 10.96
      ref_sec: 9.02
      cer: 0.1574
      wer: 0.52
    bible_00141:
      source: bible
      text: Ḿbʋ́ yekina nɛ pɩtɩŋnɩ lidaʋ ŋgʋ́ ɩwɛna yɔ kʋ-yɔɔ nɛ Krɩstʋ wɛɛ mɩ-laŋa taa nɛ ɩtɛzɩ pɩʋ
        sɔɔlɩm taa siŋŋ.
      sbs: 0.6487
      gen_sec: 6.96
      ref_sec: 6.84
      cer: 0.0864
      wer: 0.15
    bible_00142:
      source: bible
      text: 'Paba nɩ ḿbʋ́ lɛ, pa nɛ wɛ pɛkpɛndɩ patɩŋa nɛ pɛsɛɛ Ɛsɔ se: «Caabiyuu!'
      sbs: 0.6452
      gen_sec: 4.96
      ref_sec: 5.58
      cer: 0.2353
      wer: 0.4286
    bible_00143:
      source: bible
      text: 'Peeɖe palɩzɩ Yesu tiyiyaa ḿbá pɛ-hɛkʋ taa nɛ pɔpɔzɩ-wɛ se: «A-ɖoŋ taa yaa a-hɩɖɛ taa ɩlaba
        nɛ abalʋ ɛnʋ ɛ-yɔɔ cɛ?'
      sbs: 0.67
      gen_sec: 9.84
      ref_sec: 8.42
      cer: 0.1176
      wer: 0.4762
    bible_00144:
      source: bible
      text: Pɛɖɛɣaɣ lɛ, ŋgbɛyɛ taa ñɩma cɛlɩ-wɛ mbʋ́ pʋpɔzʋʋ-wɛ pa-nʋmɔʋ ɖɔm taa yɔ.
      sbs: 0.6736
      gen_sec: 5.2
      ref_sec: 4.58
      cer: 0.1273
      wer: 0.6667
    bible_00145:
      source: bible
      text: Pɩkɛdaa lɛ, tɛtʋ tɩñamsɩ siŋŋ nɛ pɩkpɛndɩnɩ salaka kuduyuu nɛ kʋ-nɔnɔsɩ tɩŋa tɩtʋlɩ yem nɛ
        yoŋgbasɩ nzɩ́ paaɖɩ salaka tɩnaa tɩŋa yɔ sɩtɩcɛbʋ.
      sbs: 0.5917
      gen_sec: 11.6
      ref_sec: 9.76
      cer: 0.0783
      wer: 0.5217
    bible_00146:
      source: bible
      text: Yee nɔɔyʋ ɛtɔm se ɛwɛ ñalɩmɩyɛ taa nɛ ɛpaɖɩɣ ɛ-taabalaa yɔ, pɩwɩlɩɣ se ɛwɛ cɩkpɛndʋʋ taa
        tam.
      sbs: 0.6704
      gen_sec: 5.84
      ref_sec: 5.92
      cer: 0.1216
      wer: 0.4118
    bible_00147:
      source: bible
      text: E-Fezuu Kiɖeɖeu ŋgʋ́ ɛha-ɖʋ yɔ, ŋ́gʋ́ wɩlɩɣnɩ-ɖʋ se ɖa nɛ ɩ ɖɩwɛ ɖama taa.
      sbs: 0.618
      gen_sec: 5.76
      ref_sec: 5.4
      cer: 0.1887
      wer: 0.4286
    bible_00148:
      source: bible
      text: Tɩ-taa ɩmɩzɩɣ ɖama nɛ paa weyi ekpe ɛ-tɛ nɛ iyele men-ɖeke.
      sbs: 0.6767
      gen_sec: 3.76
      ref_sec: 3.84
      cer: 0.0667
      wer: 0.3636
    bible_00149:
      source: bible
      text: Paa ɩtana-ɩ yɔ, ɩwɛnɩ lidaʋ ɛ-yɔɔ nɛ mɩ-laŋa hʋlʋmɩ siŋŋ, pɩfɛyɩ yɔɔdʋʋ.
      sbs: 0.5469
      gen_sec: 6.0
      ref_sec: 5.22
      cer: 0.1636
      wer: 0.5
    bible_00150:
      source: bible
      text: '-Peheyi Farɩsɩ ñɩma se: «Yesu tɔmkpɛlɩkɩyaa kɩlɩ Yohanɛɛsɩ ñɩma ɖɔʋ.'
      sbs: 0.6829
      gen_sec: 5.2
      ref_sec: 6.52
      cer: 0.1273
      wer: 0.5
    bible_00151:
      source: bible
      text: '» Lɛlaa se: «Ɛzɩma kɩwɛɛkɩm laɖʋ pɩzɩɣ ɛla hama lakasɩ ḿbʋ́?'
      sbs: 0.6325
      gen_sec: 3.28
      ref_sec: 13.34
      cer: 0.8889
      wer: 1.0
    bible_00152:
      source: bible
      text: Panɩ tɔm ńdʋ́ ḿbʋ́ lɛ, pa-taa sɔsaa calɩ lɔyʋʋ kʋɖʋm kʋɖʋm nɛ pɛɖɛɛ patɩŋa payɩ nɛ piyele
        halʋ ɛnʋ e-ɖeke koŋ Yesu ɛsɩndaa.
      sbs: 0.6365
      gen_sec: 8.16
      ref_sec: 8.74
      cer: 0.0632
      wer: 0.2174
    bible_00153:
      source: bible
      text: Mbʋ́ pʋyɔɔ yɔ, ɛjaɖɛ ńɖɩ́ ɖɩ-taa ñɩma laŋa wɛ kpɩzɩŋ nɛ.
      sbs: 0.6676
      gen_sec: 3.76
      ref_sec: 4.28
      cer: 0.2195
      wer: 0.7273
    bible_00154:
      source: bible
      text: Yee toovenim se ɛnʋ ɛhanɩ-ŋ-pʋ lɛ, pɩlabɩ ɛzɩma ŋkʋndʋʋnɩ-pʋ ɛzɩ pataha-ŋ-pʋ kɩhaʋ yɔ?
      sbs: 0.6051
      gen_sec: 6.8
      ref_sec: 6.02
      cer: 0.0746
      wer: 0.6923
    bible_00155:
      source: bible
      text: Paa ɩtɛm sɩm tɔm ndʋ́ meheyiɣ-mɩ yɔ camɩyɛ yɔ, me-liu wɛɛ se mɔntɔzɩ-mɩ-tʋ.
      sbs: 0.662
      gen_sec: 5.04
      ref_sec: 5.14
      cer: 0.1607
      wer: 0.6923
    bible_00156:
      source: bible
      text: '› Peeɖe mɔnpɔzaa se: ‹Kɩpaɣlʋ!'
      sbs: 0.5952
      gen_sec: 1.84
      ref_sec: 3.9
      cer: 0.0909
      wer: 0.5
    bible_00157:
      source: bible
      text: Ŋ́gʋ́ lɛ taŋga nɛ mɩnʋʋ nɛ nɩɩnʋwa nɛ hiu nɛ loɖo.
      sbs: 0.6405
      gen_sec: 4.32
      ref_sec: 5.8
      cer: 0.027
      wer: 0.0909
    bible_00158:
      source: bible
      text: 'Mankʋyʋʋ manpɩsɩ man-caa cɔlɔ nɛ meheyi-i se: caa!'
      sbs: 0.6842
      gen_sec: 4.16
      ref_sec: 3.18
      cer: 0.2564
      wer: 0.75
    bible_00159:
      source: bible
      text: Pʋ-yɔɔ lɛ, mɩ nɛ Yesu Krɩstʋ mɩ-kpɛndʋʋ ɛwɛɛ ḿbʋ́ ɛzɩ Fezuu Kiɖeɖeu ŋ́gʋ́ kɩwɩlʋʋ-mɩ yɔ.
      sbs: 0.6377
      gen_sec: 7.28
      ref_sec: 5.18
      cer: 0.0606
      wer: 0.2667
    bible_00160:
      source: bible
      text: Ñɔ-lɔŋsɩnɖɛ yɔɔ pɩtɩŋnaa nɛ pɛlɛɣzɩ wɛtʋ sakɩyɛ ɛjaɖɛ ɖɩnɛ ɖɩ-taa se piɖeni-ɖɩ.
      sbs: 0.5584
      gen_sec: 29.76
      ref_sec: 4.12
      cer: 3.2656
      wer: 2.0833
    bible_00161:
      source: bible
      text: Lɛɛlɛɛyɔ, manawa se mbá mɩ mɩtɩŋa payɩ mɔnkɔm mɩ-hɛkʋ taa nɛ monsusi Ɛsɔ Kewiyaɣ tɔm yɔ,
        mɩ-taa nɔɔyʋ ɛɛtasɩɣ naʋ mɛ-ɛsɩbiye taa kaʋ.
      sbs: 0.6122
      gen_sec: 13.44
      ref_sec: 12.14
      cer: 0.0952
      wer: 0.3478
    bible_00162:
      source: bible
      text: Maapɔzʋʋ nɔɔyʋ se ɛlabɩ-m mbʋ́ pʋmʋnaa se palabɩ-m tɩ-yɔɔ yɔ.
      sbs: 0.6331
      gen_sec: 3.76
      ref_sec: 3.18
      cer: 0.0213
      wer: 0.2
    bible_00163:
      source: bible
      text: Pɔɔlɩ nɩ ḿbʋ́ lɛ, ɛsʋʋ ɛ-cɔlɔ nɛ ɛtɩnɩ ɛ-yɔɔ nesi nɛ ɛsɛɛ Ɛsɔ nɛ ɛ-yɔɔ cɛ.
      sbs: 0.6824
      gen_sec: 6.24
      ref_sec: 5.78
      cer: 0.0755
      wer: 0.3125
    bible_00164:
      source: bible
      text: Ɛ́lɛ́ kɔma lɛ, Feliksɩ heyi-i se ɛkɛdɩ-ɩ Krɩstʋ Yesu yɔɔ lidaʋ wɛnaʋ tɔm.
      sbs: 0.7303
      gen_sec: 5.68
      ref_sec: 5.3
      cer: 0.2364
      wer: 0.6154
    bible_00165:
      source: bible
      text: Tasɩ-kʋ yebu pɩnaɣ kanɛ nɛ mohuyi kɩ-tɛɛ nɛ manɖʋ huɖe nɛ mana.
      sbs: 0.6309
      gen_sec: 5.84
      ref_sec: 3.94
      cer: 0.1837
      wer: 0.6667
    bible_00166:
      source: bible
      text: Me-liu wɛɛ ɖɔɖɔ se halaa esuu wondu ɛzɩma mbʋ́ pʋmʋnaa yɔ, pataaɖɛlɛsɩ niye, pataakɩlɩ pa-tɩ
        canʋʋ.
      sbs: 0.6637
      gen_sec: 8.16
      ref_sec: 8.54
      cer: 0.141
      wer: 0.5
    bible_00167:
      source: bible
      text: Pʋwɛɛ kpem se ɖɩlɛɣzɩ ɖɛ-wɛtʋ.
      sbs: 0.6281
      gen_sec: 2.48
      ref_sec: 3.1
      cer: 0.1667
      wer: 1.2
    bible_00168:
      source: bible
      text: Đooo lɔŋ, ɩɩkpaɣ alɩwaatʋ siŋŋ nɛ ɩla ɛzɩ mbá paañaŋ Ɛsɔ yɔ palakʋʋ mbʋ́ pe-liu wɛɛ yɔ.
      sbs: 0.641
      gen_sec: 7.12
      ref_sec: 5.9
      cer: 0.1045
      wer: 0.3529
    bible_00169:
      source: bible
      text: Kɩyakʋ kɩhɛzʋʋ talaa lɛ, pasʋʋ Yuda ñɩma Ɛsɔ ɖɩsɛyɛ taa nɛ pacaɣ.
      sbs: 0.6569
      gen_sec: 4.56
      ref_sec: 3.74
      cer: 0.0962
      wer: 0.25
    bible_00170:
      source: bible
      text: 'Peeɖe ɛkʋyaa nɛ ɛpɔzɩ-ɩ se: «Đɔ-kɔɔ, pɛwɛ le tɛ?'
      sbs: 0.6858
      gen_sec: 3.84
      ref_sec: 4.5
      cer: 0.2941
      wer: 0.6667
    bible_00171:
      source: bible
      text: Ɛsɔ kɔŋ-m haʋ ɖɔɖɔ koboyaɣ ŋgá ɛkɔŋ lɩzʋʋ nɛ ɛwɩlɩ-ɖʋ yɔ.
      sbs: 0.6885
      gen_sec: 3.04
      ref_sec: 4.16
      cer: 0.1818
      wer: 0.6364
    bible_00172:
      source: bible
      text: Pʋ-yɔɔ ɖɩlɩzɩɣ kʋ-tɔm ńdʋ́ tɩ-tɔbʋʋ mbá Ɛsɔ ha-wɛ-kʋ yɔ.
      sbs: 0.5851
      gen_sec: 6.16
      ref_sec: 3.14
      cer: 0.1463
      wer: 0.8889
    bible_00173:
      source: bible
      text: 'Mbʋ́ pʋwɛɛ yɔ lɛ se: ɩɖɔ camɩyɛ ɛzɩ Krɩstʋ Laŋhɛzɩyɛ Tɔm pɔzʋʋ yɔ.'
      sbs: 0.65
      gen_sec: 4.8
      ref_sec: 4.66
      cer: 0.0784
      wer: 0.1538
    bible_00174:
      source: bible
      text: Yee ḿbʋ́ lɛ, ɛzɩma ɖɩɩpɩzɩɣ ɖɩhʋʋ kedeŋa yɔɔ cɩnɛ tɔm yɔ?
      sbs: 0.6492
      gen_sec: 3.84
      ref_sec: 4.32
      cer: 0.0909
      wer: 0.4545
    bible_00175:
      source: bible
      text: Nɛ weyi ɛ́lɛ́ woba sukuli yɔ?
      sbs: 0.5432
      gen_sec: 1.68
      ref_sec: 3.92
      cer: 0.1905
      wer: 0.3333
    bible_00176:
      source: bible
      text: Ɛlɛ́, Fezuu Kiɖeɖeu tii kɩwɛɛ patɩŋa pɔ-yɔɔ nɛ papazɩ yɔɔdʋʋ kʋnʋmɩŋ ndɩ ndɩ weyi kɩha-wɛ
        ɖoŋ se pɔyɔɔdɩ yɔ.
      sbs: 0.5991
      gen_sec: 8.32
      ref_sec: 6.76
      cer: 0.1529
      wer: 0.4737
    bible_00177:
      source: bible
      text: Patalɩ Room nɛ pɩla kɩyakɩŋ naadozo lɛ, Pɔɔlɩ yaa Yuda ñɩma ñʋndɩnaa mbá pɛwɛ peeɖe yɔ
        ɛ-tɛ.
      sbs: 0.5768
      gen_sec: 10.96
      ref_sec: 5.76
      cer: 0.4384
      wer: 0.7647
    bible_00178:
      source: bible
      text: Lɛɛlɛɛyɔ, manɖʋzʋʋ mɩtɩŋa payɩ Ɛsɔ nɛ e-lootiye tɔm pe-nesi taa.
      sbs: 0.6233
      gen_sec: 5.04
      ref_sec: 6.42
      cer: 0.098
      wer: 0.5
    bible_00179:
      source: bible
      text: 'Pɩkɛdaa lɛ, Siimɔɔ Pɩyɛ heyi-wɛ se: «Mowoki mankpa kpakpasɩ.'
      sbs: 0.6415
      gen_sec: 5.44
      ref_sec: 4.62
      cer: 0.1489
      wer: 0.7778
    bible_00180:
      source: bible
      text: Tʋma wena ŋlakɩ yɔ, apaɣlaa kpem, pɩfɛyɩ yɔɔdʋʋ!
      sbs: 0.621
      gen_sec: 3.76
      ref_sec: 5.2
      cer: 0.1842
      wer: 0.625
    bible_00181:
      source: bible
      text: Ńdʋ́ lɛ se ɖooo lɔŋ Kɩpaɣlʋ yabɩ Izrɛɛlɩ ñɩma ñʋʋ Ejiptɩ ɛjaɖɛ taa.
      sbs: 0.6598
      gen_sec: 4.24
      ref_sec: 5.26
      cer: 0.2453
      wer: 0.5385
    bible_00182:
