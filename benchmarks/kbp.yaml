      sbs: 0.6599
      gen_sec: 9.36
      ref_sec: 6.42
      cer: 0.0741
      wer: 0.2353
    bible_00107:
      source: bible
      text: 'Alɩwaatʋ talɩɣ lɛ, ɛlabɩ-pʋ: ekpeɣliɣ mbʋ́ pɩtɩŋa payɩ pʋwɛ ɛsɔdaa nɛ tataa yɔ wiyaʋ kʋɖʋm
        koŋ tɛɛ.'
      sbs: 0.6205
      gen_sec: 24.56
      ref_sec: 8.64
      cer: 2.1538
      wer: 2.7059
    bible_00108:
      source: bible
      text: Ɛlɛ́, Room sɔɔja sɔsɔ kizini-wɛ, mbʋ́ pʋyɔɔ yɔ, e-liu wɛɛ se ɛya Pɔɔlɩ ñʋʋ.
      sbs: 0.5943
      gen_sec: 24.88
      ref_sec: 5.08
      cer: 3.3333
      wer: 3.0714
    bible_00109:
      source: bible
      text: Pʋ-yɔɔ lɛ, pʋwɛɛ se ɖa ɖɔɖɔ ɖɩsɩ ɖa-taabalaa yɔɔ.
      sbs: 0.6594
      gen_sec: 4.08
      ref_sec: 3.6
      cer: 0.4865
      wer: 0.8889
    bible_00110:
      source: bible
      text: Yesu ha tɔɔnaɣ samaɣ sɔsɔɔ nɛ kɔtɔɔ.
      sbs: 0.5901
      gen_sec: 6.48
      ref_sec: 3.58
      cer: 0.0345
      wer: 0.1429
    bible_00111:
      source: bible
      text: Ŋgʋ́, Yesu taatɩtalɩda tɛtʋ taa, ɛlɛ́, ɛɛwɛ ɖenɖe Maarta kakatɩ-ɩ yɔ ḿbʋ́.
      sbs: 0.6915
      gen_sec: 5.04
      ref_sec: 5.44
      cer: 0.6364
      wer: 0.9167
    bible_00112:
      source: bible
      text: Ɩsɛɛ mbá patɩŋa payɩ pɛkɛ Ɛsɔ ñɩma pa nɛ Krɩstʋ Yesu pɛ-kpɛndʋʋ taa yɔ.
      sbs: 0.6424
      gen_sec: 24.32
      ref_sec: 4.6
      cer: 0.8393
      wer: 0.9286
    bible_00113:
      source: bible
      text: Peeɖe Siimɔɔ nɛ ɛ-taabalaa papazɩ-ɩ ñɩnʋʋ.
      sbs: 0.5627
      gen_sec: 0.96
      ref_sec: 5.74
      cer: 0.9118
      wer: 0.8333
    bible_00114:
      source: bible
      text: 'Ɛɛpɩzɩɣ ɛtasɩ labʋ kɩwɛɛkɩm: ɛ-Caa lɛ Ɛsɔ.'
      sbs: 0.6242
      gen_sec: 18.08
      ref_sec: 3.16
      cer: 3.1515
      wer: 4.0
    bible_00115:
      source: bible
      text: 'Ɛlɛ́, ɛcaɣ nɛ ɛmaɣzɩ ɛ-taa se: ‹Mala ɛzɩma lee?'
      sbs: 0.6584
      gen_sec: 7.12
      ref_sec: 9.38
      cer: 0.0909
      wer: 0.3333
    bible_00116:
      source: bible
      text: Mɛwɛ tanɩm taa yaa mɛwɛnɩ sakɩyɛ yɔ, mansɩm man-tɩ ɖɔkʋʋ.
      sbs: 0.6903
      gen_sec: 5.28
      ref_sec: 4.76
      cer: 0.1333
      wer: 0.7
    bible_00117:
      source: bible
      text: Paa sɩm yɔ, mansɩkɩ ñɔ-yɔɔ!
      sbs: 0.6154
      gen_sec: 10.88
      ref_sec: 11.84
      cer: 5.6
      wer: 5.6
    bible_00118:
      source: bible
      text: 'Mbʋ́ pʋyɔɔ yɔ, paɖʋ tɩ-taa se: «Nɔ weyi ɛmakɩ mɩla yɔ, paahɔkʋʋ ɛ-nɔɔ se ɛtaatɔɔ.'
      sbs: 0.6083
      gen_sec: 14.24
      ref_sec: 7.34
      cer: 2.8983
      wer: 3.8667
    bible_00119:
      source: bible
      text: 'Kɩyakʋ ŋgʋ́ Yesu tukaɣ aduwa yɔ, kɩ-ɖanaɣ yɔɔ eheyi ɛ-tɔmkpɛlɩkɩyaa se: «Đɩtɛzɩ teŋgu kidiiliŋ
        lɛɛkʋ yɔɔ.'
      sbs: 0.7075
      gen_sec: 8.0
      ref_sec: 7.5
      cer: 0.4217
      wer: 0.8125
    bible_00120:
      source: bible
      text: Ɛ-taa ɛɛhʋlʋmʋʋnɩ kɩdɛkɛdɩm, ɛlɛ́, toovenim ɛ-taa hʋlʋmʋʋna.
      sbs: 0.6753
      gen_sec: 6.0
      ref_sec: 4.5
      cer: 0.1458
      wer: 0.8571
    bible_00121:
      source: bible
      text: Maarkɩ nɛ Aristaarkɩ nɛ Demaasɩ nɛ Luka mbá ma nɛ wɛ ɖɩlakɩ tʋmɩyɛ kʋɖʋmɖɩyɛ yɔ, pɛsɛ-ŋ ɖɔɖɔ.
      sbs: 0.6202
      gen_sec: 8.8
      ref_sec: 8.36
      cer: 0.4595
      wer: 0.8235
    bible_00122:
      source: bible
      text: Đa-Caa Ɛsɔ maɣmaɣ nɛ ɖa-Kɩpaɣlʋ Yesu pɔñɔɔzɩ ɖa-nʋmɔʋ nɛ ɖɩpɩzɩ ɖɩtalɩ-mɩ!
      sbs: 0.5981
      gen_sec: 10.8
      ref_sec: 5.52
      cer: 1.7119
      wer: 2.2727
    bible_00123:
      source: bible
      text: Yesu laba nɛ lɩm pɩsɩ sʋlʋm Kana tɛtʋ taa.
      sbs: 0.586
      gen_sec: 5.36
      ref_sec: 5.18
      cer: 0.8485
      wer: 1.0
    bible_00124:
      source: bible
      text: Ɛlɛ́, halʋ ɛnʋ ese nɛ ɛsʋʋ lakʋ taa ɖenɖe Ɛsɔ kɔñɔɔzɩ-ɩ ɖɩjaɣyɛ se pɔcɔnɩ ɛ-yɔɔ kɩyakɩŋ kutoku
        nɛ nasɩlɛ nɛ nɩɩnʋwa nɛ hiu yɔ.
      sbs: 0.6478
      gen_sec: 8.24
      ref_sec: 8.94
      cer: 0.6633
      wer: 0.9167
    bible_00125:
      source: bible
      text: Mbʋ́ pʋyɔɔ yɔ, ḿbʋ́ pʋmʋnaa se pɛhɛyɩ tʋmlaɖʋ ɛ-tʋmɩyɛ yɔɔ.
      sbs: 0.5705
      gen_sec: 10.96
      ref_sec: 3.64
      cer: 1.6444
      wer: 2.3
    bible_00126:
      source: bible
      text: Yesu ɖɔɔnɩ aleewaa abalʋ nɔɔyʋ wayɩ.
      sbs: 0.5825
      gen_sec: 11.36
      ref_sec: 4.44
      cer: 3.5
      wer: 3.8333
    bible_00127:
      source: bible
      text: Peeɖe ɖɩɖaŋnɩ Kɩpaɣlʋ Yesu Krɩstʋ se ɛkɔɔ ɛya ɖa-ñʋʋ.
      sbs: 0.6576
      gen_sec: 6.4
      ref_sec: 3.22
      cer: 0.2093
      wer: 0.5556
    bible_00128:
      source: bible
      text: Pɩkɛdaa lɛ, Maarɩɩ kpaɣ tɩlaaɖɩ ŋgʋ́ palabɩnɩ naarɩ nɛ petesidi kɩ-taa pʋyʋ yɔ ɛzɩ litri hɔɔlʋʋ
        yɔ nɛ ɛpɩyɩ Yesu naŋgbanzɩ yɔɔ.
      sbs: 0.6445
      gen_sec: 13.36
      ref_sec: 7.54
      cer: 0.4706
      wer: 0.7273
    bible_00129:
      source: bible
      text: Nakʋyʋ wiye Ɛsɔ tiyi abalʋ nɔɔyʋ, payaɣ-ɩ se Yohanɛɛsɩ.
      sbs: 0.6615
      gen_sec: 2.72
      ref_sec: 4.0
      cer: 0.7273
      wer: 1.0
    bible_00130:
      source: bible
      text: Pʋwɛɛ se pʋdʋ ɛha ɛzaɣ́tʋ siɣ́ye nɛ ɛla mbʋ́ pʋwɛ ɖeu yɔ.
      sbs: 0.5618
      gen_sec: 20.96
      ref_sec: 3.48
      cer: 5.4048
      wer: 2.5
    bible_00131:
      source: bible
      text: 'Peeɖe eheyi-wɛ se: «Ma lɛ, mɛnkɛ Yuda tʋ, palʋlɩ-m Taarsɩ Siliisii ɛjaɖɛ taa.'
      sbs: 0.6891
      gen_sec: 7.52
      ref_sec: 9.0
      cer: 0.4655
      wer: 1.0
    bible_00132:
      source: bible
      text: Yee ḿbʋ́ Ɛsɔ ɛsɔɔlɩ-ɖʋ yɔ, pʋwɛɛ se ɖa ɖɔɖɔ ɖɩsɔɔlɩ ɖama.
      sbs: 0.7038
      gen_sec: 5.6
      ref_sec: 4.0
      cer: 0.093
      wer: 0.0909
    bible_00133:
      source: bible
      text: Yohanɛɛsɩ ɛnʋ, esuwaɣ toko ŋgʋ́ palʋnɩ kpaŋnɔ siɣá naalɛ tʋ hʋndʋ yɔ.
      sbs: 0.6464
      gen_sec: 4.16
      ref_sec: 3.92
      cer: 0.6545
      wer: 0.8333
    bible_00134:
      source: bible
      text: Pʋcɔ ewolo Galilee lɛ, pɩɩwɛɛ se ɛtɩŋnɩ Samaarɩɩ egeetiye taa.
      sbs: 0.6371
      gen_sec: 19.52
      ref_sec: 4.3
      cer: 3.7451
      wer: 4.3
    bible_00135:
      source: bible
      text: Halɩ ɖɩɩlaba kʋñɔŋ siŋŋ nɛ pʋcɔ ɖɩlɩzɩ kpɩyʋʋ cikpeluu ŋgʋ́ palɩzɩɣnɩ ɛyáa yɔ.
      sbs: 0.562
      gen_sec: 29.6
      ref_sec: 4.5
      cer: 2.1719
      wer: 3.3077
    bible_00136:
      source: bible
      text: 'Peeɖe pɩɖɩɣzɩ-wɛ yem ɖɩɣ ɖɩɣ nɛ pɔtɔŋ se: «Ɛzɩ ɛyáa panɛ pɛtɛkɛ Galilee ñɩma patɩŋa na?'
      sbs: 0.6225
      gen_sec: 6.0
      ref_sec: 6.44
      cer: 0.5
      wer: 0.6875
    bible_00137:
      source: bible
      text: Paa ḿbʋ́ yɔ, mbá panɩ tɔm ńdʋ́ yɔ, pa-taa sakɩyɛ tisi-tʋ nɛ pɔsɔzɩ lɛlaa yɔɔ nɛ pɛtɛzɩ
        ɖɔʋ.
      sbs: 0.6733
      gen_sec: 6.64
      ref_sec: 6.48
      cer: 0.4328
      wer: 0.7222
    bible_00138:
      source: bible
      text: Krɩstʋ ŋgbɛyɛ taa ñɩma mbá Ɛsɔ lɩzɩ Babilooni ɖɔɖɔ ɛzɩ mɩ yɔ nɛ Maarkɩ weyi ɛkɛ man-pɩɣa
        yɔ, pɛsɛ-mɩ.
      sbs: 0.6559
      gen_sec: 6.4
      ref_sec: 6.44
      cer: 0.3165
      wer: 0.5263
    bible_00139:
      source: bible
      text: Yesu na ɛyáa samaɣ ḿbʋ́ lɛ, ɛkpa piyaɣ nakɛyɛ yɔɔ nɛ ɛcaɣ.
      sbs: 0.6475
      gen_sec: 7.04
      ref_sec: 3.32
      cer: 0.1364
      wer: 0.4167
    bible_00140:
      source: bible
      text: 'Toovenim lɛ, meheyiɣ-ŋ se: paɖʋ-ŋ-kɛ yɔ, ŋwɛɣ peeɖe ḿbʋ́ ka ka nɛ pʋkɔɔ pɩsɩɩnɩ kɩyakʋ ŋgʋ́
        ŋhɛyɩ ña-kɩmɩyɛ tɩŋa payɩ nɛ pɩtakazɩ paa koba yɔ.'
      sbs: 0.6035
      gen_sec: 11.2
      ref_sec: 9.02
      cer: 0.5
      wer: 0.72
    bible_00141:
      source: bible
      text: Ḿbʋ́ yekina nɛ pɩtɩŋnɩ lidaʋ ŋgʋ́ ɩwɛna yɔ kʋ-yɔɔ nɛ Krɩstʋ wɛɛ mɩ-laŋa taa nɛ ɩtɛzɩ pɩʋ
        sɔɔlɩm taa siŋŋ.
      sbs: 0.674
      gen_sec: 4.0
      ref_sec: 6.84
      cer: 0.5062
      wer: 0.6
    bible_00142:
      source: bible
      text: 'Paba nɩ ḿbʋ́ lɛ, pa nɛ wɛ pɛkpɛndɩ patɩŋa nɛ pɛsɛɛ Ɛsɔ se: «Caabiyuu!'
      sbs: 0.6632
      gen_sec: 7.04
      ref_sec: 5.58
      cer: 0.2353
      wer: 0.7857
    bible_00143:
      source: bible
      text: 'Peeɖe palɩzɩ Yesu tiyiyaa ḿbá pɛ-hɛkʋ taa nɛ pɔpɔzɩ-wɛ se: «A-ɖoŋ taa yaa a-hɩɖɛ taa ɩlaba
        nɛ abalʋ ɛnʋ ɛ-yɔɔ cɛ?'
      sbs: 0.69
      gen_sec: 7.28
      ref_sec: 8.42
      cer: 0.5059
      wer: 0.619
    bible_00144:
      source: bible
      text: Pɛɖɛɣaɣ lɛ, ŋgbɛyɛ taa ñɩma cɛlɩ-wɛ mbʋ́ pʋpɔzʋʋ-wɛ pa-nʋmɔʋ ɖɔm taa yɔ.
      sbs: 0.6639
      gen_sec: 6.64
      ref_sec: 4.58
      cer: 0.8909
      wer: 1.1667
    bible_00145:
      source: bible
      text: Pɩkɛdaa lɛ, tɛtʋ tɩñamsɩ siŋŋ nɛ pɩkpɛndɩnɩ salaka kuduyuu nɛ kʋ-nɔnɔsɩ tɩŋa tɩtʋlɩ yem nɛ
        yoŋgbasɩ nzɩ́ paaɖɩ salaka tɩnaa tɩŋa yɔ sɩtɩcɛbʋ.
      sbs: 0.6622
      gen_sec: 10.96
      ref_sec: 9.76
      cer: 0.5043
      wer: 0.8696
    bible_00146:
      source: bible
      text: Yee nɔɔyʋ ɛtɔm se ɛwɛ ñalɩmɩyɛ taa nɛ ɛpaɖɩɣ ɛ-taabalaa yɔ, pɩwɩlɩɣ se ɛwɛ cɩkpɛndʋʋ taa
        tam.
      sbs: 0.6788
      gen_sec: 12.16
      ref_sec: 5.92
      cer: 0.7703
      wer: 0.8235
    bible_00147:
      source: bible
      text: E-Fezuu Kiɖeɖeu ŋgʋ́ ɛha-ɖʋ yɔ, ŋ́gʋ́ wɩlɩɣnɩ-ɖʋ se ɖa nɛ ɩ ɖɩwɛ ɖama taa.
      sbs: 0.6627
      gen_sec: 3.68
      ref_sec: 5.4
      cer: 0.6792
      wer: 1.0
    bible_00148:
      source: bible
      text: Tɩ-taa ɩmɩzɩɣ ɖama nɛ paa weyi ekpe ɛ-tɛ nɛ iyele men-ɖeke.
      sbs: 0.5897
      gen_sec: 20.0
      ref_sec: 3.84
      cer: 4.4222
      wer: 2.5455
    bible_00149:
      source: bible
      text: Paa ɩtana-ɩ yɔ, ɩwɛnɩ lidaʋ ɛ-yɔɔ nɛ mɩ-laŋa hʋlʋmɩ siŋŋ, pɩfɛyɩ yɔɔdʋʋ.
      sbs: 0.6511
      gen_sec: 8.0
      ref_sec: 5.22
      cer: 0.5818
      wer: 0.9167
    bible_00150:
      source: bible
      text: '-Peheyi Farɩsɩ ñɩma se: «Yesu tɔmkpɛlɩkɩyaa kɩlɩ Yohanɛɛsɩ ñɩma ɖɔʋ.'
      sbs: 0.6423
      gen_sec: 8.0
      ref_sec: 6.52
      cer: 0.1455
      wer: 0.6
    bible_00151:
      source: bible
      text: '» Lɛlaa se: «Ɛzɩma kɩwɛɛkɩm laɖʋ pɩzɩɣ ɛla hama lakasɩ ḿbʋ́?'
      sbs: 0.6603
      gen_sec: 5.44
      ref_sec: 13.34
      cer: 0.1111
      wer: 0.3
    bible_00152:
      source: bible
      text: Panɩ tɔm ńdʋ́ ḿbʋ́ lɛ, pa-taa sɔsaa calɩ lɔyʋʋ kʋɖʋm kʋɖʋm nɛ pɛɖɛɛ patɩŋa payɩ nɛ piyele
        halʋ ɛnʋ e-ɖeke koŋ Yesu ɛsɩndaa.
      sbs: 0.6708
      gen_sec: 13.04
      ref_sec: 8.74
      cer: 0.2632
      wer: 0.4783
    bible_00153:
      source: bible
      text: Mbʋ́ pʋyɔɔ yɔ, ɛjaɖɛ ńɖɩ́ ɖɩ-taa ñɩma laŋa wɛ kpɩzɩŋ nɛ.
      sbs: 0.5838
      gen_sec: 12.72
      ref_sec: 4.28
      cer: 0.561
      wer: 0.6364
    bible_00154:
      source: bible
      text: Yee toovenim se ɛnʋ ɛhanɩ-ŋ-pʋ lɛ, pɩlabɩ ɛzɩma ŋkʋndʋʋnɩ-pʋ ɛzɩ pataha-ŋ-pʋ kɩhaʋ yɔ?
      sbs: 0.6428
      gen_sec: 7.52
      ref_sec: 6.02
      cer: 0.6716
      wer: 0.9231
    bible_00155:
      source: bible
      text: Paa ɩtɛm sɩm tɔm ndʋ́ meheyiɣ-mɩ yɔ camɩyɛ yɔ, me-liu wɛɛ se mɔntɔzɩ-mɩ-tʋ.
      sbs: 0.6404
      gen_sec: 10.56
      ref_sec: 5.14
      cer: 0.1607
      wer: 0.3846
    bible_00156:
      source: bible
      text: '› Peeɖe mɔnpɔzaa se: ‹Kɩpaɣlʋ!'
      sbs: 0.6413
      gen_sec: 4.88
      ref_sec: 3.9
      cer: 0.6364
      wer: 1.75
    bible_00157:
      source: bible
      text: Ŋ́gʋ́ lɛ taŋga nɛ mɩnʋʋ nɛ nɩɩnʋwa nɛ hiu nɛ loɖo.
      sbs: 0.6091
      gen_sec: 18.08
      ref_sec: 5.8
      cer: 3.2973
      wer: 2.7273
    bible_00158:
      source: bible
      text: 'Mankʋyʋʋ manpɩsɩ man-caa cɔlɔ nɛ meheyi-i se: caa!'
      sbs: 0.6769
      gen_sec: 5.04
      ref_sec: 3.18
      cer: 0.4359
      wer: 0.625
    bible_00159:
      source: bible
      text: Pʋ-yɔɔ lɛ, mɩ nɛ Yesu Krɩstʋ mɩ-kpɛndʋʋ ɛwɛɛ ḿbʋ́ ɛzɩ Fezuu Kiɖeɖeu ŋ́gʋ́ kɩwɩlʋʋ-mɩ yɔ.
      sbs: 0.6629
      gen_sec: 4.96
      ref_sec: 5.18
      cer: 0.5606
      wer: 0.8
    bible_00160:
      source: bible
      text: Ñɔ-lɔŋsɩnɖɛ yɔɔ pɩtɩŋnaa nɛ pɛlɛɣzɩ wɛtʋ sakɩyɛ ɛjaɖɛ ɖɩnɛ ɖɩ-taa se piɖeni-ɖɩ.
      sbs: 0.6251
      gen_sec: 5.68
      ref_sec: 4.12
      cer: 0.375
      wer: 0.5833
    bible_00161:
      source: bible
      text: Lɛɛlɛɛyɔ, manawa se mbá mɩ mɩtɩŋa payɩ mɔnkɔm mɩ-hɛkʋ taa nɛ monsusi Ɛsɔ Kewiyaɣ tɔm yɔ,
        mɩ-taa nɔɔyʋ ɛɛtasɩɣ naʋ mɛ-ɛsɩbiye taa kaʋ.
      sbs: 0.6117
      gen_sec: 11.92
      ref_sec: 12.14
      cer: 0.4286
      wer: 0.8261
    bible_00162:
      source: bible
      text: Maapɔzʋʋ nɔɔyʋ se ɛlabɩ-m mbʋ́ pʋmʋnaa se palabɩ-m tɩ-yɔɔ yɔ.
      sbs: 0.5911
      gen_sec: 4.64
      ref_sec: 3.18
      cer: 0.6596
      wer: 0.8
    bible_00163:
      source: bible
      text: Pɔɔlɩ nɩ ḿbʋ́ lɛ, ɛsʋʋ ɛ-cɔlɔ nɛ ɛtɩnɩ ɛ-yɔɔ nesi nɛ ɛsɛɛ Ɛsɔ nɛ ɛ-yɔɔ cɛ.
      sbs: 0.5684
      gen_sec: 32.0
      ref_sec: 5.78
      cer: 2.1698
      wer: 1.375
    bible_00164:
      source: bible
      text: Ɛ́lɛ́ kɔma lɛ, Feliksɩ heyi-i se ɛkɛdɩ-ɩ Krɩstʋ Yesu yɔɔ lidaʋ wɛnaʋ tɔm.
      sbs: 0.516
      gen_sec: 24.32
      ref_sec: 5.3
      cer: 4.3273
      wer: 2.0769
    bible_00165:
      source: bible
      text: Tasɩ-kʋ yebu pɩnaɣ kanɛ nɛ mohuyi kɩ-tɛɛ nɛ manɖʋ huɖe nɛ mana.
      sbs: 0.6649
      gen_sec: 4.24
      ref_sec: 3.94
      cer: 0.4286
      wer: 0.8333
    bible_00166:
      source: bible
      text: Me-liu wɛɛ ɖɔɖɔ se halaa esuu wondu ɛzɩma mbʋ́ pʋmʋnaa yɔ, pataaɖɛlɛsɩ niye, pataakɩlɩ pa-tɩ
        canʋʋ.
      sbs: 0.5578
      gen_sec: 24.64
      ref_sec: 8.54
      cer: 2.1667
      wer: 3.5
    bible_00167:
      source: bible
      text: Pʋwɛɛ kpem se ɖɩlɛɣzɩ ɖɛ-wɛtʋ.
      sbs: 0.6204
      gen_sec: 2.88
      ref_sec: 3.1
      cer: 0.0833
      wer: 0.6
    bible_00168:
      source: bible
      text: Đooo lɔŋ, ɩɩkpaɣ alɩwaatʋ siŋŋ nɛ ɩla ɛzɩ mbá paañaŋ Ɛsɔ yɔ palakʋʋ mbʋ́ pe-liu wɛɛ yɔ.
      sbs: 0.5769
      gen_sec: 27.68
      ref_sec: 5.9
      cer: 3.9552
      wer: 3.7059
    bible_00169:
      source: bible
      text: Kɩyakʋ kɩhɛzʋʋ talaa lɛ, pasʋʋ Yuda ñɩma Ɛsɔ ɖɩsɛyɛ taa nɛ pacaɣ.
      sbs: 0.6918
      gen_sec: 6.0
      ref_sec: 3.74
      cer: 0.3846
      wer: 0.6667
    bible_00170:
      source: bible
      text: 'Peeɖe ɛkʋyaa nɛ ɛpɔzɩ-ɩ se: «Đɔ-kɔɔ, pɛwɛ le tɛ?'
      sbs: 0.6815
      gen_sec: 6.64
      ref_sec: 4.5
      cer: 0.1471
      wer: 0.5556
    bible_00171:
      source: bible
      text: Ɛsɔ kɔŋ-m haʋ ɖɔɖɔ koboyaɣ ŋgá ɛkɔŋ lɩzʋʋ nɛ ɛwɩlɩ-ɖʋ yɔ.
      sbs: 0.5633
      gen_sec: 23.84
      ref_sec: 4.16
      cer: 4.8864
      wer: 4.0909
    bible_00172:
      source: bible
      text: Pʋ-yɔɔ ɖɩlɩzɩɣ kʋ-tɔm ńdʋ́ tɩ-tɔbʋʋ mbá Ɛsɔ ha-wɛ-kʋ yɔ.
      sbs: 0.6215
      gen_sec: 3.04
      ref_sec: 3.14
      cer: 0.6829
      wer: 1.0
    bible_00173:
      source: bible
      text: 'Mbʋ́ pʋwɛɛ yɔ lɛ se: ɩɖɔ camɩyɛ ɛzɩ Krɩstʋ Laŋhɛzɩyɛ Tɔm pɔzʋʋ yɔ.'
      sbs: 0.6851
      gen_sec: 5.84
      ref_sec: 4.66
      cer: 0.0588
      wer: 0.1538
    bible_00174:
      source: bible
      text: Yee ḿbʋ́ lɛ, ɛzɩma ɖɩɩpɩzɩɣ ɖɩhʋʋ kedeŋa yɔɔ cɩnɛ tɔm yɔ?
      sbs: 0.6685
      gen_sec: 6.48
      ref_sec: 4.32
      cer: 0.8182
      wer: 1.0
    bible_00175:
      source: bible
      text: Nɛ weyi ɛ́lɛ́ woba sukuli yɔ?
      sbs: 0.5874
      gen_sec: 9.44
      ref_sec: 3.92
      cer: 3.5238
      wer: 2.3333
    bible_00176:
      source: bible
      text: Ɛlɛ́, Fezuu Kiɖeɖeu tii kɩwɛɛ patɩŋa pɔ-yɔɔ nɛ papazɩ yɔɔdʋʋ kʋnʋmɩŋ ndɩ ndɩ weyi kɩha-wɛ
        ɖoŋ se pɔyɔɔdɩ yɔ.
      sbs: 0.6248
      gen_sec: 11.28
      ref_sec: 6.76
      cer: 0.2235
      wer: 0.2632
    bible_00177:
      source: bible
      text: Patalɩ Room nɛ pɩla kɩyakɩŋ naadozo lɛ, Pɔɔlɩ yaa Yuda ñɩma ñʋndɩnaa mbá pɛwɛ peeɖe yɔ
        ɛ-tɛ.
      sbs: 0.6701
      gen_sec: 6.0
      ref_sec: 5.76
      cer: 0.5753
      wer: 0.9412
    bible_00178:
      source: bible
      text: Lɛɛlɛɛyɔ, manɖʋzʋʋ mɩtɩŋa payɩ Ɛsɔ nɛ e-lootiye tɔm pe-nesi taa.
      sbs: 0.6363
      gen_sec: 22.4
      ref_sec: 6.42
      cer: 0.8431
      wer: 1.0
    bible_00179:
      source: bible
      text: 'Pɩkɛdaa lɛ, Siimɔɔ Pɩyɛ heyi-wɛ se: «Mowoki mankpa kpakpasɩ.'
      sbs: 0.5987
      gen_sec: 18.56
      ref_sec: 4.62
      cer: 3.0213
      wer: 4.3333
    bible_00180:
      source: bible
      text: Tʋma wena ŋlakɩ yɔ, apaɣlaa kpem, pɩfɛyɩ yɔɔdʋʋ!
      sbs: 0.6312
      gen_sec: 17.12
      ref_sec: 5.2
      cer: 1.7105
      wer: 2.625
    bible_00181:
      source: bible
      text: Ńdʋ́ lɛ se ɖooo lɔŋ Kɩpaɣlʋ yabɩ Izrɛɛlɩ ñɩma ñʋʋ Ejiptɩ ɛjaɖɛ taa.
      sbs: 0.6488
      gen_sec: 4.24
      ref_sec: 5.26
      cer: 0.7547
      wer: 1.0
    bible_00182:
      source: bible
      text: Yee paapɛdɩ-kʋ, kɩtaaɖɛɛ ɛzɩ kɩyakɩŋ nasidozo tʋmɩyɛ liidiye yɔ nɛ patayɩ kʋñɔndɩnaa naa
        we?
      sbs: 0.619
      gen_sec: 10.32
      ref_sec: 5.96
      cer: 0.5921
      wer: 0.8571
    bible_00183:
      source: bible
      text: Ɛlɛ́, Sɔɔjanaa ñʋʋdʋ Lisiyaasɩ tɩkɔm ɛlɛɣ-ɩ nɛ ɖoŋ ɖe-nesi taa nɛ eheyi-ɖʋ se ɖɩkɔɔ ñɔ-cɔlɔ.
      sbs: 0.5808
      gen_sec: 25.68
      ref_sec: 6.8
      cer: 1.9859
      wer: 3.0
    bible_00184:
      source: bible
      text: Weyi ɛ́lɛ́ tisiɣ se ɛsɩm Ɛsɔ Pɩyalʋ yɔ, ɛsɩm ɖɔɖɔ Caa Ɛsɔ.
      sbs: 0.6613
      gen_sec: 6.08
      ref_sec: 4.66
      cer: 0.3256
      wer: 0.5
    bible_00185:
      source: bible
      text: Mbʋ́ pʋyɔɔ yɔ, weyi ɛtɔkɩ nɛ ɛñɔɔ yem nɛ ɛtamaɣzɩ camɩyɛ se ɛna mbʋ́ Kɩpaɣlʋ tomnaɣ kɛwa
        yɔ, mbʋ́ ɛtɔkɩ nɛ ɛñɔʋ yɔ, ḿbʋ́ kʋʋnɩ ɛ-maɣmaɣ ɛ-tɔm.
      sbs: 0.6377
      gen_sec: 14.48
      ref_sec: 11.1
      cer: 0.6698
      wer: 0.8889
    bible_00186:
      source: bible
      text: '› Meheyiɣ-mɩ se ḿbʋ́ ɖɔɖɔ pʋwɛɛ: yee kɩwɛɛkɩm laɖʋ kʋɖʋm nɔɔyʋ ɛlɛɣzɩ wɛtʋ yɔ, Ɛsɔ tiyiyaa
        laŋa hʋlʋmʋʋ ɖeu.'
      sbs: 0.6386
      gen_sec: 12.16
      ref_sec: 7.62
      cer: 0.1667
      wer: 0.2778
    bible_00187:
      source: bible
      text: Ma lɛ, malakɩ-mɩ lɩm sɔʋ sɔnzɩ, ɛnʋ lɛ, ɛkɔŋ-mɩ labʋ sɔnzɩ nɛ Fezuu Kiɖeɖeu ɖoŋ.
      sbs: 0.6101
      gen_sec: 7.68
      ref_sec: 6.42
      cer: 0.8
      wer: 0.9333
    bible_00188:
      source: bible
      text: Ɛlɛ́, ɖɩsɩm se alɩwaatʋ ndʋ́ Yesu Krɩstʋ pɩsɩɣ ɛkɔɔ nɛ pana-ɩ yɔ, ɖɩwɛɣ ɛzɩ ɛwɛʋ yɔ, mbʋ́
        pʋyɔɔ yɔ, ɖɩnaɣ-ɩ ɛzɩ ɛwɛʋ yɔ.
      sbs: 0.6359
      gen_sec: 18.48
      ref_sec: 10.32
      cer: 0.6591
      wer: 0.7826
    bible_00189:
      source: bible
      text: » Peeɖe Zaacee titiba nɛ ɛ nɛ Yesu powolo ɛ-tɛ nɛ ɛmʋ-ɩ nɛ laŋhʋlʋmɩyɛ.
      sbs: 0.64
      gen_sec: 5.84
      ref_sec: 6.44
      cer: 0.7037
      wer: 0.8462
    bible_00190:
      source: bible
      text: 'Piyeki nɛ pɛhɛzɩnɩ pa-tʋma: pɔkɔŋ-wɛ hɛyʋʋ a-yɔɔ.'
      sbs: 0.6403
      gen_sec: 6.0
      ref_sec: 4.24
      cer: 0.5
      wer: 0.8571
    bible_00191:
      source: bible
      text: Ɛsɔ ɛlabɩ-mɩ lootiye!
      sbs: 0.608
      gen_sec: 8.48
      ref_sec: 6.48
      cer: 1.7647
      wer: 3.0
    bible_00192:
      source: bible
      text: 'Pɔɔlɩ tasɩ yɔɔdʋʋ se: «Pʋ-yɔɔ mankpaɣ nʋmɔʋ nɛ mɔnkɔɔ mɔñɔtɩnɩ Damaasɩ.'
