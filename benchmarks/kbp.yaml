      gen_sec: 3.36
      ref_sec: 3.12
      cer: 0.2273
      wer: 0.875
    bible_00100:
      source: bible
      text: Mbʋ́ pʋyɔɔ yɔ, Kɩpaɣlʋ cɔŋnɩ mbá patʋʋzɩ ɛ-ɛsɩndaa yɔ pɔ-yɔɔ.
