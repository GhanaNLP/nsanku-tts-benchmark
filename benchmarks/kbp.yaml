      gen_sec: 6.56
      ref_sec: 9.84
      cer: 0.7009
      wer: 0.9545
    bible_00194:
      source: bible
      text: Ɩtaapɔzɩ mɩ-tɩ tɔm natʋyʋ pʋ-yɔɔ nɛ pʋkɔɔ piliɣti-mɩ.
      sbs: 0.6092
      gen_sec: 20.0
      ref_sec: 4.82
      cer: 2.3333
      wer: 3.375
