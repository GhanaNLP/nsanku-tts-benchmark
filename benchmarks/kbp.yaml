      gen_sec: 4.56
      ref_sec: 4.62
      cer: 0.1224
      wer: 0.4167
    bible_00099:
      source: bible
      text: Sɔɔndʋ kpaɣaɣ-wɛ se mɛlɛ ɛtaakɔɔ kuyoni ɛwasɩ nasɩyɩ.
