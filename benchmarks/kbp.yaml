      gen_sec: 12.88
      ref_sec: 7.5
      cer: 0.1205
      wer: 0.6875
    bible_00120:
      source: bible
      text: Ɛ-taa ɛɛhʋlʋmʋʋnɩ kɩdɛkɛdɩm, ɛlɛ́, toovenim ɛ-taa hʋlʋmʋʋna.
