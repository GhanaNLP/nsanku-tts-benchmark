      ref_sec: 6.02
      cer: 0.1461
      wer: 0.625
    bible_00060:
      source: bible
      text: Ɛhye ati bɛzɔ bɛ nwo kpalɛ na bɛyɛ bɛ nye gyɛlɛmgbɛɛnye, na bɛahola bɛayɛ nzɛlɛlɛ.
      sbs: 0.6476
      gen_sec: 5.48
      ref_sec: 5.16
      cer: 0.1515
      wer: 0.4
    bible_00061:
      source: bible
