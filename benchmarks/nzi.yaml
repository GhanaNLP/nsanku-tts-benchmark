      ref_sec: 4.08
      cer: 0.0909
      wer: 0.9091
    bible_00054:
      source: bible
      text: ’ Na ɔ ze vɛlɛle ye sonvolɛma ne mɔ na ɔzele bɛ kɛ, ‘Bɛha bɛ nwo na bɛhɔva tɛladeɛ kpalɛ bɛrawula
