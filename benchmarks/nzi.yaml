      sbs: 0.6736
      gen_sec: 6.32
      ref_sec: 9.32
      cer: 0.2
      wer: 0.5556
    bible_00058:
      source: bible
      text: Awuke biala mɔɔ bɛkɛwolo nu la, bɛlumua bɛze kɛ, ‘Nyamenle anzonudwolɛ ɛha awuke ye anu amra.
      sbs: 0.6665
      gen_sec: 6.24
      ref_sec: 6.48
      cer: 0.1351
      wer: 0.3125
    bible_00059:
      source: bible
      text: Na ɛnee yɛ anyelazo, yɛ anyelielɛ anzɛɛ abɔtile mɔɔ yɛfa yɛtu yɛ nloa anu wɔ mekɛ mɔɔ yɛ Awulae
