      sbs: 0.6677
      gen_sec: 6.52
      ref_sec: 8.62
      cer: 0.1538
      wer: 0.5455
    bible_00071:
      source: bible
      text: Ɔluakɛ, tɛ menli a yɛ nee bɛ ɛlɛko a; sunsum nu tumivolɛma, ewiade arelemgbunli anzɛɛ maanlebuvoma,
        ewiade amra mɔɔ sie ɛnɛ mekɛ ye awozinli nu amra, yɛɛ sunsum nu anwuma ɛlɔnema amumuyɛ yɛɛ yɛ
