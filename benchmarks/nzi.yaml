      ref_sec: 5.28
      cer: 0.0909
      wer: 0.3
    bible_00093:
      source: bible
      text: Na saa Nyamenle ɛtɛdwazole Kelaese a, ɛnee bɛ diedi ne le mgbane na bɛtɛte bɛ ɛtane ne mɔ
