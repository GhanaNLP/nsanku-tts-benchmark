      ref_sec: 7.2
      cer: 0.092
      wer: 0.4091
    bible_00068:
      source: bible
      text: Gyisɛse vi ɛkɛ ne la ɔ nee ye ɛdoavolɛma ne ziale rale ye sua zo.
      sbs: 0.6572
      gen_sec: 4.24
      ref_sec: 4.18
      cer: 0.14
      wer: 0.4667
    bible_00069:
      source: bible
      text: Nɔhalɛ, meka meahile bɛ kɛ bɛnyia bɛ ahatualɛ bɛwie.
