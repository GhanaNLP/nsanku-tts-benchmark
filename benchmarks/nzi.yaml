      cer: 0.007
      wer: 0.0233
    bible_00082:
      source: bible
      text: Ɔbɔle nolo ɔhilele menli ne kɛ, “Sonla ne mɔɔ li me nzi ɛlɛba la lɛ tumi tɛla me.
