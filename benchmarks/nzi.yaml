      sbs: 0.6702
      gen_sec: 7.79
      ref_sec: 9.34
      cer: 0.2
      wer: 0.5714
    bible_00079:
      source: bible
      text: Na bɛ nee kpavolɛ ne hɔle sua nu arɛlekyekyelɛ nu mɔɔ ɛnee ɔte kpɔkɛ bɔkɔɔ a.
      sbs: 0.6354
      gen_sec: 5.08
      ref_sec: 4.7
      cer: 0.2131
      wer: 0.75
    bible_00080:
      source: bible
      text: Yɛze kɛ Nyamenle mɔɔ dwazole Awulae Gyisɛse rale ngoane nu la badwazo yɛ aboka Gyisɛse anwo,
        na yeava yɛ nee bɛ yeahɔ ɔ nyunlu ɛkɛ.
      sbs: 0.6841
      gen_sec: 8.6
      ref_sec: 8.2
      cer: 0.2
      wer: 0.52
    bible_00081:
      source: bible
      text: Saa menle bɛ nwo lɔ wɔ nwonane nu bɔbɔ a, me nee bɛ wɔ lɔ wɔ sunsum nu, na melua Awulae Gyisɛse
        duma nu mebua sonla zɔhane mɔɔ ɛbɔ munzule ɛbɛla ɛhye la ndɛne kɛ asɛɛ me nee bɛ a wɔ lɔ la.
      sbs: 0.7029
      gen_sec: 11.8
      ref_sec: 11.0
      cer: 0.1259
      wer: 0.5349
    bible_00082:
      source: bible
      text: Ɔbɔle nolo ɔhilele menli ne kɛ, “Sonla ne mɔɔ li me nzi ɛlɛba la lɛ tumi tɛla me.
      sbs: 0.6885
      gen_sec: 5.08
      ref_sec: 4.7
      cer: 0.1639
      wer: 0.5
    bible_00083:
      source: bible
      text: Ɔluakɛ Nyamenle su ne de Kelaese sonlabaka ne nu, na kɛmɔ yemɔ a ɔbo sunsum nu arelemgbunli
        nee tumivolɛma anwo zo la, bɛ nee ye ɛyɛ ko na bɛli munli.
      sbs: 0.6775
      gen_sec: 9.72
      ref_sec: 8.38
      cer: 0.1102
      wer: 0.5333
    bible_00084:
      source: bible
      text: Tumi ɛhye mɔɔ ɛlɛdi gyima wɔ yɛmɛ mɔɔ yɛdie ye yɛdi la anu la, yemɔ ala a le anwosesebɛ bedevinli
        ne mɔɔ Nyamenle vale dwazole Kelaese vile ewule nu, na ɔvale ye ɔdɛnlanle ɔ sa fema zo wɔ anwuma
        la.
      sbs: 0.696
      gen_sec: 12.41
      ref_sec: 11.98
      cer: 0.109
      wer: 0.35
    bible_00085:
      source: bible
      text: Gyisɛse kile kɛ Nyamenle anyunlunyia ne wienyi kpole si de la.
      sbs: 0.6012
      gen_sec: 4.24
      ref_sec: 3.34
      cer: 0.0588
      wer: 0.1818
    bible_00086:
      source: bible
      text: 'Ngakyile mɔɔ wɔ bɛdabɛ mɔɔ bɛle Nyamenle amra nee bɛdabɛ mɔɔ bɛle Abɔnsam amra la avinli
        la ɛne: awie biala mɔɔ ɛmbɔ ɛbɛla kpalɛ anzɛɛ ɛngulo ɔ diema la ɛnle Nyamenle ara.'
      sbs: 0.6771
      gen_sec: 10.61
      ref_sec: 13.68
      cer: 0.1159
      wer: 0.3125
    bible_00087:
      source: bible
      text: Sɛlɛvolɛ Kpanyinli ne nee ɔ sa zo ne mɔ manle bɛvɛlɛle mgbanyima ayia, na bɛdule menli kɛ
        bɛhɔye ɛzoanvolɛma ne wɔ efiade ne bɛrɛla.
      sbs: 0.6889
      gen_sec: 8.68
      ref_sec: 8.94
      cer: 0.0748
      wer: 0.4167
    bible_00088:
      source: bible
      text: Ninyɛne nwiɔ ɛhye yɛɛ ɔwɔ kɛ bɛyɛ a, yɛɛ eza ɔnle kɛ bɛbu bɛ nye bɛgua alumua ɛdeɛ ne mɔ azo.
      sbs: 0.6737
      gen_sec: 5.96
      ref_sec: 6.8
      cer: 0.0704
      wer: 0.2381
    bible_00089:
      source: bible
      text: Na Gyisɛse buale bɛ kɛ, “Asoo bɛtɛkengale mɔɔ Devidi yɛle wɔ mekɛ mɔɔ ɛhɔne hunle ye nee ye
        menli ne mɔ la?
      sbs: 0.6687
      gen_sec: 6.92
      ref_sec: 6.34
      cer: 0.0723
      wer: 0.2273
    bible_00090:
      source: bible
      text: Raalɛ mɔɔ bɛtɛgyale ye la dwenledwenle Awulae gyima ne anwo, ɔluakɛ ɔkpondɛ kɛ ɔtu ye sonlabaka
        ne nee ye ɛkɛla ne ɔmaa Nyamenle; na awuvolɛ raalɛ dwenledwenle ewiade ninyɛne nwo, ɔluakɛ ɔkpondɛ
