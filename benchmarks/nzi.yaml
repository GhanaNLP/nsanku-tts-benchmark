      gen_sec: 9.12
      ref_sec: 9.34
      cer: 0.0211
      wer: 0.0952
    bible_00079:
      source: bible
      text: Na bɛ nee kpavolɛ ne hɔle sua nu arɛlekyekyelɛ nu mɔɔ ɛnee ɔte kpɔkɛ bɔkɔɔ a.
      sbs: 0.6689
      gen_sec: 4.96
      ref_sec: 4.7
      cer: 0.0164
      wer: 0.375
    bible_00080:
      source: bible
      text: Yɛze kɛ Nyamenle mɔɔ dwazole Awulae Gyisɛse rale ngoane nu la badwazo yɛ aboka Gyisɛse anwo,
        na yeava yɛ nee bɛ yeahɔ ɔ nyunlu ɛkɛ.
      sbs: 0.7013
      gen_sec: 7.6
      ref_sec: 8.2
      cer: 0.0476
      wer: 0.24
    bible_00081:
      source: bible
      text: Saa menle bɛ nwo lɔ wɔ nwonane nu bɔbɔ a, me nee bɛ wɔ lɔ wɔ sunsum nu, na melua Awulae Gyisɛse
        duma nu mebua sonla zɔhane mɔɔ ɛbɔ munzule ɛbɛla ɛhye la ndɛne kɛ asɛɛ me nee bɛ a wɔ lɔ la.
      sbs: 0.6312
      gen_sec: 14.72
      ref_sec: 11.0
      cer: 0.021
      wer: 0.3488
    bible_00082:
      source: bible
      text: Ɔbɔle nolo ɔhilele menli ne kɛ, “Sonla ne mɔɔ li me nzi ɛlɛba la lɛ tumi tɛla me.
      sbs: 0.6779
      gen_sec: 6.08
      ref_sec: 4.7
      cer: 0.0984
      wer: 0.7778
    bible_00083:
      source: bible
      text: Ɔluakɛ Nyamenle su ne de Kelaese sonlabaka ne nu, na kɛmɔ yemɔ a ɔbo sunsum nu arelemgbunli
