      wer: 0.2414
    bible_00094:
      source: bible
      text: Bɛ nee me badɛnla me ɛkponle nwo, bɛali debie na bɛanlo wɔ me Belemgbunlililɛ ne anu, na bɛbadɛnlɛdɛnla
