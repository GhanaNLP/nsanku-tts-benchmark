      ref_sec: 7.72
      cer: 0.0658
      wer: 0.4286
    bible_00055:
      source: bible
      text: Sonla zɛhae ɛnde ninyɛne ɛhye mɔ abo; bɛle ɔ nye zo ɛzɛlɛ edwɛkɛ, ɔboalekɛ kyesɛ sunsum nu
