      ref_sec: 4.84
      cer: 0.0625
      wer: 0.375
    bible_00005:
      source: bible
      text: Ɔ ti enrinli le fufule nwohyee kɛ boane ndɛkɛ, nwohyee kɛ ezukɔtweaba, yɛɛ ɔ nye ma sɔ kɛ
