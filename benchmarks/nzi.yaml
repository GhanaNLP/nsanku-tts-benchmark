      wer: 0.125
    bible_00097:
      source: bible
      text: Yɛdayɛ noko yɛle bɛtɛɛ wɔ Kelaese ati, na ɔlua Nyamenle tumi ne azo yɛ nee ye badɛnla na yɛ
