      ref_sec: 6.02
      cer: 0.0899
      wer: 0.2917
    bible_00060:
      source: bible
      text: Ɛhye ati bɛzɔ bɛ nwo kpalɛ na bɛyɛ bɛ nye gyɛlɛmgbɛɛnye, na bɛahola bɛayɛ nzɛlɛlɛ.
      sbs: 0.6782
      gen_sec: 5.84
      ref_sec: 5.16
      cer: 0.0152
      wer: 0.1333
    bible_00061:
      source: bible
      text: Dasevolɛma ne mɔ yeyele bɛ adɛladeɛ manle kpavolɛ bie mɔɔ bɛfɛlɛ ye Sɔɔlo la lɛle.
      sbs: 0.7089
      gen_sec: 5.84
      ref_sec: 6.26
      cer: 0.0448
      wer: 0.1333
    bible_00062:
      source: bible
      text: 'Gyisɛse buale bɛ kɛ, “Meka nɔhalɛ ne meahile bɛ: Bɛlile kpanwo ne na bɛ ko yile la ati yɛɛ
        bɛlɛkpondɛ me bo zo a, na tɛ kɛ asɛɛ bɛdele me nwanwane gyima mgbole mɔɔ menyɛle la abo la ati
        ɔ.'
      sbs: 0.6419
      gen_sec: 14.24
      ref_sec: 13.08
      cer: 0.0417
      wer: 0.25
    bible_00063:
      source: bible
      text: Medi me nwo daselɛ yɛɛ Selɛ ne mɔɔ zoanle me la di me nwo daselɛ.
      sbs: 0.6522
      gen_sec: 4.32
      ref_sec: 3.52
      cer: 0.06
      wer: 0.1333
    bible_00064:
      source: bible
      text: Na ɔzɛlɛle kɛ, “Egya!
      sbs: 0.7234
      gen_sec: 2.8
      ref_sec: 6.26
      cer: 0.0
      wer: 0.0
    bible_00065:
      source: bible
      text: Nyamenle kpɔmanvolɛma mɔɔ hanle ɛlolɛ ɛhye mɔɔ le bɛ ɛdeɛ la anwo edwɛkɛ dole ɛkɛ ne la nleɛnleanle
        nu, na bɛkpondɛle ngoanelielɛ ɛhye mɔɔ Nyamenle bava amaa bɛ la anu.
      sbs: 0.6852
      gen_sec: 10.48
      ref_sec: 11.24
      cer: 0.0219
      wer: 0.1667
    bible_00066:
      source: bible
      text: Dahuu yɛte Gyisɛse ewule ne nyane wɔ yɛ sonlabaka ye anu, amaa menli anwu ye ngoane ne noko
        wɔ yɛ sonlabaka ye anu.
      sbs: 0.6879
      gen_sec: 7.84
      ref_sec: 6.78
      cer: 0.033
      wer: 0.1304
    bible_00067:
      source: bible
      text: Mekɛ mɔɔ bɛkɛyia nu la saa awie mɔ baha aneɛ ngakyile a, bɛmaa menli nwiɔ anzɛɛ yebo zolɛ
        la, menli nsa ɛdendɛ.
      sbs: 0.7038
      gen_sec: 8.4
      ref_sec: 7.2
      cer: 0.069
      wer: 0.3182
    bible_00068:
      source: bible
      text: Gyisɛse vi ɛkɛ ne la ɔ nee ye ɛdoavolɛma ne ziale rale ye sua zo.
      sbs: 0.6806
      gen_sec: 4.4
      ref_sec: 4.18
      cer: 0.04
      wer: 0.3333
    bible_00069:
      source: bible
      text: Nɔhalɛ, meka meahile bɛ kɛ bɛnyia bɛ ahatualɛ bɛwie.
      sbs: 0.6601
      gen_sec: 4.24
      ref_sec: 3.04
      cer: 0.0476
      wer: 0.2222
    bible_00070:
      source: bible
      text: Ɔluakɛ Abɔnsam ɛdwu ɛra bɛ nwo lɔ, na ɛya kpole wɔ ye nuhua, ɔboalekɛ ɔze kɛ ye mekɛ ɛha ekyi
        bie ala.
      sbs: 0.6834
      gen_sec: 7.68
      ref_sec: 8.62
      cer: 0.1026
      wer: 0.4091
    bible_00071:
      source: bible
      text: Ɔluakɛ, tɛ menli a yɛ nee bɛ ɛlɛko a; sunsum nu tumivolɛma, ewiade arelemgbunli anzɛɛ maanlebuvoma,
        ewiade amra mɔɔ sie ɛnɛ mekɛ ye awozinli nu amra, yɛɛ sunsum nu anwuma ɛlɔnema amumuyɛ yɛɛ yɛ
        nee bɛ ɛlɛko a.
      sbs: 0.639
      gen_sec: 15.84
      ref_sec: 12.44
      cer: 0.1867
      wer: 0.6842
    bible_00072:
      source: bible
      text: Aleɛ muanle nwolɛ la, Gyisɛse nee ye ɛdoavolɛma bulu nee nwiɔ ne rale.
      sbs: 0.6575
      gen_sec: 5.2
      ref_sec: 3.8
      cer: 0.125
      wer: 0.5385
    bible_00073:
      source: bible
      text: “Saa ɛ diema fo wɔ a, tea ye, na saa ɔnu ɔ nwo a, fa ye ɛtane kyɛ ye.
      sbs: 0.6712
      gen_sec: 5.6
      ref_sec: 4.88
      cer: 0.1087
      wer: 0.4737
    bible_00074:
      source: bible
      text: Saa bɛte konle nee nzakadolɛ nganeɛ a, bɛmmasulo; ɔwɔ kɛ ninyɛne ɛhye mɔ dumua sisi, na bɛngile
