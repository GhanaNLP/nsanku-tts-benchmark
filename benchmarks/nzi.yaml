      gen_sec: 6.96
      ref_sec: 6.54
      cer: 0.1163
      wer: 0.3684
    bible_00053:
      source: bible
      text: Nyamenle tumi ne rale Gyisɛse anwo zo na ɔyɛle wuleravolɛma ayile.
      sbs: 0.6529
      gen_sec: 4.16
      ref_sec: 4.08
      cer: 0.0727
      wer: 0.1818
    bible_00054:
      source: bible
      text: ’ Na ɔ ze vɛlɛle ye sonvolɛma ne mɔ na ɔzele bɛ kɛ, ‘Bɛha bɛ nwo na bɛhɔva tɛladeɛ kpalɛ bɛrawula
