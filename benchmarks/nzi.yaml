      gen_sec: 6.2
      ref_sec: 6.48
      cer: 0.2027
      wer: 0.5625
    bible_00059:
      source: bible
      text: Na ɛnee yɛ anyelazo, yɛ anyelielɛ anzɛɛ abɔtile mɔɔ yɛfa yɛtu yɛ nloa anu wɔ mekɛ mɔɔ yɛ Awulae
