      ref_sec: 9.32
      cer: 0.1375
      wer: 0.6111
    bible_00058:
      source: bible
      text: Awuke biala mɔɔ bɛkɛwolo nu la, bɛlumua bɛze kɛ, ‘Nyamenle anzonudwolɛ ɛha awuke ye anu amra.
