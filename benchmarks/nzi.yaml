      gen_sec: 6.72
      ref_sec: 7.22
      cer: 0.0588
      wer: 0.2273
    bible_00092:
      source: bible
      text: Bɛnlea boɛ wɔ nindavoma anwo; menli ɛhye mɔ ɛhakyi ahwea mɔɔ nganlɛ ala a bɛkulo kɛ bɛbɔ bɛ
