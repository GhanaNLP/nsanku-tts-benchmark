      ref_sec: 6.7
      cer: 0.1059
      wer: 0.3636
    bible_00056:
      source: bible
      text: Ɛhɛe, yɛɛ eza mebahɔ zolɛ meali fɛlɛko, ɔluakɛ meze kɛ ɔlua bɛmɛ bɛ nzɛlɛlɛ nee Gyisɛse Kelaese
