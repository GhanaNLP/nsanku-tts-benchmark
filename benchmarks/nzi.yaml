      source: bible
      text: Belemgbunli Hɛlɔdo dele ɛhye mɔ anwo bie, ɔluakɛ Gyisɛse nganeɛ ɛdwu ɛleka biala, na menli
        ɛlɛkeha kɛ, “Dwɔn Sɔnevolɛ ne ɛzia ɛra ngoane nu bieko, yemɔti a ɔkola ɔyɛ nwanwane ninyɛne ɛhye
        mɔ a.
      sbs: 0.6735
      gen_sec: 14.4
      ref_sec: 14.32
      cer: 0.0779
      wer: 0.2941
    jw_00000:
