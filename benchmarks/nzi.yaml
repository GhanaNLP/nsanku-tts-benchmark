      ref_sec: 6.26
      cer: 0.1333
      wer: 0.5
    bible_00065:
      source: bible
      text: Nyamenle kpɔmanvolɛma mɔɔ hanle ɛlolɛ ɛhye mɔɔ le bɛ ɛdeɛ la anwo edwɛkɛ dole ɛkɛ ne la nleɛnleanle
