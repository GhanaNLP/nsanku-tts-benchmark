      n: 100
    jw:
      sbs: 0.6467
      cer: 0.2193
      n: 100
  entries:
    bible_00000:
      source: bible
      text: Yemɔti memaa bɛva ye bɛzie kɔkpula mekɛ mɔɔ bɛ nee ye kɛhɔ la.
      sbs: 0.5954
      gen_sec: 5.2
      ref_sec: 3.76
      cer: 0.1633
      wer: 0.6923
    bible_00001:
      source: bible
      text: Ndɛndɛ ne ala mboaneneavolɛma ne hɔle na bɛhɔnwunle Mɛle nee Dwosefi nee adɔma ne kɛ ɔla mboane
        adidi ɛlɛka nu.
      sbs: 0.6151
      gen_sec: 10.32
      ref_sec: 7.34
      cer: 0.1209
      wer: 0.65
    bible_00002:
      source: bible
      text: Ewiade ye anu ɛleka biala mɔɔ menli kɛbɔ Edwɛkpa ne nolo la, bɛkɛha debie mɔɔ raalɛ ye ɛyɛ
        la bɛkɛva bɛkɛhakye ye.
      sbs: 0.602
      gen_sec: 8.56
      ref_sec: 6.66
      cer: 0.2198
      wer: 0.7273
    bible_00003:
      source: bible
      text: Bɛnlea boɛ na awie anva mɛlɛbɛla nee adalɛ nrɛlɛbɛ mɔɔ bɛlua ewiade amaamuo zo bɛhyehyɛ, nee
        mɔɔ vi awozinli ewiade ye sunsum nu tumima ɛkɛ ne na ɔnvi Kelaese ɛkɛ ne la anyɛ bɛ ngɛkɛlɛ.
      sbs: 0.5769
      gen_sec: 15.8
      ref_sec: 10.14
      cer: 0.1879
      wer: 0.7429
    bible_00004:
      source: bible
      text: Menfɛta kɛ ɛkɛvɛlɛ me ɛ ra bɔbɔ; fa me yɛ wɔ ɛkpama ne mɔ anu ko.
      sbs: 0.619
      gen_sec: 6.04
      ref_sec: 4.84
      cer: 0.1875
      wer: 0.6875
    bible_00005:
      source: bible
      text: Ɔ ti enrinli le fufule nwohyee kɛ boane ndɛkɛ, nwohyee kɛ ezukɔtweaba, yɛɛ ɔ nye ma sɔ kɛ
        senle; ɔ gyakɛ anwo ta kɛ ayera mɔɔ bɛdu nu na bɛhwi nwolɛ la, na ɔ ne dielie kɛ azule mɔɔ lua
        awolɛ zo la.
      sbs: 0.6176
      gen_sec: 22.48
      ref_sec: 13.8
      cer: 0.1667
      wer: 0.6744
    bible_00006:
      source: bible
      text: Na saa awie ɛnle asɔne ne anu mɔɔ kɛhola kɛhile mɔɔ bɛlɛka la abo a ɛnee ahenle mɔɔ ka aneɛ
        ngakyile ne la ɛyɛ koonwu na ɔdendɛ ɔhile ɔ nwo nee Nyamenle.
      sbs: 0.5829
      gen_sec: 13.44
      ref_sec: 7.78
      cer: 0.2149
      wer: 0.5625
    bible_00007:
      source: bible
      text: Me afoa nu ɛdeɛ, menleɛnlea edwɛkɛ ne anu la menwu kɛ ɔtɛyɛle debie mɔɔ maa ɔfɛta ewule a.
      sbs: 0.6174
      gen_sec: 7.96
      ref_sec: 5.36
      cer: 0.169
      wer: 0.8889
    bible_00008:
      source: bible
      text: Bɛmaa zɛhae subane ne mɔɔ ɛnee Kelaese Gyisɛse lɛ la ɛvinde bɛ ɛbɛla nu.
      sbs: 0.5841
      gen_sec: 7.12
      ref_sec: 4.0
      cer: 0.1724
      wer: 0.6429
    bible_00009:
      source: bible
      text: O me mra ngakula, medi bɛ nwo nyane, na mete ye wɔ me nwonane nu kɛ raalɛ mɔɔ ɛvo awolɛ zo
        la, na ɔbahɔ zo zɔhane kɔkpula mekɛ mɔɔ bɛkɛnyia Kelaese su ne wɔ bɛ nu la.
      sbs: 0.573
      gen_sec: 14.72
      ref_sec: 9.24
      cer: 0.2381
      wer: 0.7027
    bible_00010:
      source: bible
      text: Zɔhane ati yelɛma ɛha bɛ nwo aze bɔkɔɔ ɛmaa bɛ hu mɔ, kɛmɔ asɔne ne yɛ maa Kelaese la.
      sbs: 0.5909
      gen_sec: 8.04
      ref_sec: 4.34
      cer: 0.0909
      wer: 0.6316
    bible_00011:
      source: bible
      text: Na awie biala hɔle ɔ nzi kɛ ɔkɔ yeamaa bɛadia ye wɔ ɔdaye ye abusua sua zo.
      sbs: 0.6053
      gen_sec: 7.16
      ref_sec: 4.62
      cer: 0.2586
      wer: 0.6471
    bible_00012:
      source: bible
      text: Kɛkala, saa bɛbɔ ɛbɛla kpalɛ na bɛammaa debie biala anwunlonwunla bɛ a, bɛle ɔ mra mraalɛ.
      sbs: 0.6405
      gen_sec: 8.0
      ref_sec: 6.36
      cer: 0.1389
      wer: 0.75
    bible_00013:
      source: bible
      text: Bɛwula Nyamenle konle tɛladeɛ ne mɔ amuala na bɛahola bɛagyinla Abɔnsam agyiba ne mɔ anloa.
      sbs: 0.6053
      gen_sec: 7.92
      ref_sec: 4.98
      cer: 0.2105
      wer: 0.6
    bible_00014:
      source: bible
      text: ” Na bɛgyakyile bɛ asawu ne mɔ ɛkɛ ne na bɛ nee ye hɔle.
      sbs: 0.5988
      gen_sec: 5.28
      ref_sec: 3.38
      cer: 0.1463
      wer: 0.6154
    bible_00015:
      source: bible
      text: Mekɛ ne anu, sane nee ɛhɔne rale Yigyibiti nee Keena maanle ne mɔ anu, manle ɔyɛle abodelɛ
        kpalɛ, mɔɔ ɛnee yɛ nlenya mɔ ɛnnyia aleɛ wɔ ɛleka biala a.
      sbs: 0.6041
      gen_sec: 12.28
      ref_sec: 9.98
      cer: 0.1624
      wer: 0.6552
    bible_00016:
      source: bible
      text: Meyɛ ɛhye mɔ amuala wɔ Edwɛkpa ne ati, amaa meanyia nwolɛ nyilalɛ ne bie.
      sbs: 0.608
      gen_sec: 6.32
      ref_sec: 4.28
      cer: 0.2586
      wer: 0.7143
    bible_00017:
      source: bible
      text: Ndɛnebuavolɛ ɛhye ɛnzulo Nyamenle yɛɛ ɔmbu sonla biala.
      sbs: 0.5968
      gen_sec: 6.36
      ref_sec: 3.46
      cer: 0.3617
      wer: 0.875
    bible_00018:
      source: bible
      text: Bɛrale la nlɛne nwiɔ ne yiyile tetɛkɛɛ mɔɔ ɛnee asɛɛ bɛwie sia a.
      sbs: 0.6293
      gen_sec: 5.68
      ref_sec: 5.0
      cer: 0.25
      wer: 0.6923
    bible_00019:
      source: bible
      text: Zɔhane ati bɛboa bɛ nwo ngoko, kɛmɔ kɛkala bɛlɛyɛ ye la na bɛmaa bɛ nwo anwosesebɛ.
      sbs: 0.6154
      gen_sec: 7.48
      ref_sec: 5.44
      cer: 0.1515
      wer: 0.6875
    bible_00020:
      source: bible
      text: Nyamenle Edwɛkɛ ne se, “Ɔwɔ kɛ bɛmaa bɛ nwo te, ɔboalekɛ mele nwuanzanwuanza.
      sbs: 0.6045
      gen_sec: 7.52
      ref_sec: 5.54
      cer: 0.1967
      wer: 0.6923
    bible_00021:
      source: bible
      text: Zɔhane ati saa ɛbɔ ɛ ti aze ɛmaa me, ɛsonle me a, ye kɔsɔɔti bayɛ wɔ ɛdeɛ.
      sbs: 0.5632
      gen_sec: 7.84
      ref_sec: 6.18
      cer: 0.1818
      wer: 0.7647
    bible_00022:
      source: bible
      text: ’ Na ɔbuale ye kɛ, ‘Ɛ diema ne ɛzia ɛra sua nu, na ɛ ze ɛmaa bɛhu ɛnlankɛ ralɛ kyenlera ne
        mɔɔ ɛwie dɔ la yɛɛ bɛlɛdie bɛ nye a, ɔboalekɛ ɔ sa ɛha ye, ɔ nwo kɔlɔnwo, ɔte kpɔkɛ.
      sbs: 0.615
      gen_sec: 15.72
      ref_sec: 13.96
      cer: 0.2422
      wer: 0.8205
    bible_00023:
      source: bible
      text: Alehyenlɛ nee aledwolɛ muala ɛnee ɔluolua azie ne nee awoka ne mɔ azo ɔteɛdea nuhua na ɔfa
        awolɛ ɔpepɛ ɔ nwo.
      sbs: 0.5682
      gen_sec: 13.08
      ref_sec: 7.42
      cer: 0.2614
      wer: 0.8095
    bible_00024:
      source: bible
      text: Kɔ na kɔdɔne ninyɛne mɔɔ ɛlɛ la amuala, na kyɛ ezukoa ne maa ehyianvolɛma na ɛkɛnyia anwonyia
        wɔ anwuma, na akee bɛla badoa me bo zo.
      sbs: 0.6153
      gen_sec: 10.92
      ref_sec: 10.06
      cer: 0.1333
      wer: 0.3846
    bible_00025:
      source: bible
      text: Nrenya ne dwazole na ɔhɔle sua nu.
      sbs: 0.607
      gen_sec: 3.92
      ref_sec: 7.42
      cer: 0.2222
      wer: 0.8571
    bible_00026:
      source: bible
      text: Ɛhye ati, saa yɛlɛ mɔɔ yɛdi nee mɔɔ yɛkeda la a, bɛmaa yɛ nye ɛzɔ yɛ nwo.
      sbs: 0.5773
      gen_sec: 7.2
      ref_sec: 4.38
      cer: 0.2778
      wer: 0.7059
    bible_00027:
      source: bible
      text: Noko saa raalɛ ka ɔ nwo aze, ɔbɔ mɔdenle ɔtɛnla diedi, ɛhulolɛ nee anwondelɛ nu a, ɔlua mralɛ
        ɛwolɛ ti bɛkɛlie ye ngoane.
      sbs: 0.6074
      gen_sec: 13.68
      ref_sec: 9.6
      cer: 0.2105
      wer: 0.913
    bible_00028:
      source: bible
      text: Sitivin buale kɛ, “Mediema mrenya nee egya mɔ, bɛdie me!
      sbs: 0.5919
      gen_sec: 6.64
      ref_sec: 4.36
      cer: 0.1628
      wer: 0.6
    bible_00029:
      source: bible
      text: Bɛwa yɛ amonle a, yɛyila bɛ; bɛyɛ yɛ kpɔdekpɔde a, yɛkponle zolɛ.
      sbs: 0.6068
      gen_sec: 6.88
      ref_sec: 4.28
      cer: 0.14
      wer: 0.5833
    bible_00030:
      source: bible
      text: Na mendele kɛ ɔle Wulomunli la ati menvale sogyama mengɔnliele ye.
      sbs: 0.6095
      gen_sec: 5.84
      ref_sec: 5.1
      cer: 0.2182
      wer: 0.7273
    bible_00031:
      source: bible
      text: Kelaese a gyi yɛ ti mɔɔ yɛ nwonane ye nvɛyeba ne mɔ amuala sosɔ ye na ɔmaa biala yɛ ye gyima
        kɛmɔ ɔfɛta la, na nwonane ne nyi ɛhulolɛ nu a.
      sbs: 0.6024
      gen_sec: 11.24
      ref_sec: 8.22
      cer: 0.243
      wer: 0.7097
    bible_00032:
      source: bible
      text: Mɛla kilehilevolɛma bie mɔɔ vi Gyɛlusalɛm rale la hanle kɛ, “Mbɔnsam kpanyinli ne mɔɔ bɛfɛlɛ
        ye Biyɛlezɛbɛle la wɔ ɔ nwo, na yemɔ yɛɛ ɔmaa ye tumi mɔɔ ɔfa ɔtu mbɔnsam a.
      sbs: 0.5639
      gen_sec: 13.72
      ref_sec: 9.9
      cer: 0.209
      wer: 0.6562
    bible_00033:
      source: bible
      text: Ɔluakɛ meka meahile bɛ, ɔvi ɛnɛ mɔɔ kɔ la menrɛnlo vanye ma nu nzule bieko kɔkpula kɛ Nyamenle
        Belemgbunlililɛ ne kɛra la.
      sbs: 0.6002
      gen_sec: 10.2
      ref_sec: 7.62
      cer: 0.1919
      wer: 0.8182
    bible_00034:
      source: bible
      text: Kɛmɔ ɛnee menli dɔɔnwo anye la Mɛzaya ne ɛralɛ zo la, bɛdwenlenle kɛ bekezɛ yemɔ a le Dwɔn.
      sbs: 0.5913
      gen_sec: 8.48
      ref_sec: 9.36
      cer: 0.2083
      wer: 0.7778
    bible_00035:
      source: bible
      text: Na Zakeɛse dwazole na ɔhanle ɔhilele Awulae kɛ, “Awulae, mebabu me ninyɛne mɔɔ melɛ la anu
        nwiɔ na meava ko meamaa ehyianvolɛma, na saa meli awie ndunlumi a, mebadua ye kakɛ mɔnwo nna.
      sbs: 0.6081
      gen_sec: 16.52
      ref_sec: 14.62
      cer: 0.1712
      wer: 0.7879
    bible_00036:
      source: bible
      text: Na yɛmɛ, yɛle alehyenlɛ nu amra, yemɔti bɛmaa yɛzie yɛ nye gyɛlɛmgbɛɛnye na yɛva diedi nee
        ɛhulolɛ yɛyɛ bulalɛ enyinlike yɛbutu yɛ kɛnra azo, na yɛva yɛ ngoane ɛnyianlɛ nwo anyelazo yɛhakyi
        bulalɛ kyɛlɛ yɛzoa.
      sbs: 0.5804
      gen_sec: 17.44
      ref_sec: 10.98
      cer: 0.1579
      wer: 0.6
    bible_00037:
      source: bible
      text: Bɛnwunle amaneɛ wɔ bɛdabɛ bɛ menli asa anu, kɛmɔ Dwuuma yɛle ala la.
      sbs: 0.6093
      gen_sec: 7.28
      ref_sec: 3.94
      cer: 0.1667
      wer: 0.8462
    bible_00038:
      source: bible
      text: Ɔdɔle bɛ bolɛ ɛsesebɛ.
      sbs: 0.5589
      gen_sec: 2.84
      ref_sec: 7.3
      cer: 0.2778
      wer: 1.0
    bible_00039:
      source: bible
      text: Ɔluakɛ mete wɔ ɛhulolɛ mɔɔ ɛlɛ ye wɔ Nyamenle menli ne anwo nee diedi mɔɔ ɛlɛ ye wɔ Awulae
        Gyisɛse anu la nganeɛ.
      sbs: 0.5858
      gen_sec: 8.6
      ref_sec: 6.18
      cer: 0.3333
      wer: 0.7826
    bible_00040:
      source: bible
      text: Bɛze kɛ mekɛ mɔɔ ɛnee bɛnze Nyamenle la, awie mɔ vale adenle bie azo manle bɛzɔle mmonle mɔɔ
        ɛndendɛ la.
      sbs: 0.5791
      gen_sec: 8.24
      ref_sec: 5.82
      cer: 0.1928
      wer: 0.55
    bible_00041:
      source: bible
      text: Bɛdabɛ mɔɔ bɛha la biala ɛlɛbɔ ye ɛbɛla mɔɔ hyia ye la, na yegyakyi mɔɔ Gyisɛse Kelaese kpondɛ
        kɛ ɔyɛ la.
      sbs: 0.5512
      gen_sec: 9.52
      ref_sec: 5.54
      cer: 0.1084
      wer: 0.619
    bible_00042:
      source: bible
      text: Yɛmɛ yɛɛ Nyamenle ɛlua ye Sunsum ne azo ɛye fealeranu debie zɛhae ɛhile yɛ a, ɔluakɛ Sunsum
        ne fedevede ninyɛne kɔsɔɔti anu, bɔbɔ kɛ Nyamenle ngyehyɛlɛ ne kuma ne kuloonwu si de la.
      sbs: 0.589
      gen_sec: 14.92
      ref_sec: 10.78
      cer: 0.1849
      wer: 0.9091
    bible_00043:
      source: bible
      text: Saa bɛyɛ ye zɔhane na bɛanva bɛ rɛle bɛanzɔ awie a, bɛdabɛ mɔɔ bɛwɔ amozi na bɛnle diedima
        la kɛbu bɛ bie.
      sbs: 0.0
      cer: 1.0
      wer: 1.0
      failed: no usable audio
    bible_00044:
      source: bible
      text: Bɛzonle Nyamenle mɔɔ bɔle anwuma, azɛlɛ, nyevile, nee azule muala la.
      sbs: 0.5537
      gen_sec: 7.12
      ref_sec: 4.36
      cer: 0.2
      wer: 0.8182
    bible_00045:
      source: bible
      text: Bɛdabɛ bɛze amaneɛ mɔɔ yɛnwunle ye nee aholoba mɔɔ bɛbɔle yɛ wɔ Felepae kolaa na yɛara Tɛsalonaeka
        la.
      sbs: 0.603
      gen_sec: 7.56
      ref_sec: 5.28
      cer: 0.1786
      wer: 0.5
    bible_00046:
      source: bible
      text: Mɔɔ lumua la zele kɛ, ‘Medɔ me azɛlɛ bie na ɔwɔ kɛ mekɔnea.
      sbs: 0.6344
      gen_sec: 6.12
      ref_sec: 6.94
      cer: 0.1136
      wer: 0.6154
    bible_00047:
      source: bible
      text: Nrenya ne mɔɔ ɔlua ɔ nwo zo bɛyɛle nwanwane gyima kpole zɛhae la ɛnee ɛli ɛvolɛ mɔɔ bo abulanla.
      sbs: 0.6147
      gen_sec: 9.08
      ref_sec: 5.52
      cer: 0.1818
      wer: 0.7895
    bible_00048:
      source: bible
      text: Deɛ mɔɔ yemɔti Nyamenle Ara ne rale la a le kɛ ɔbazɛkye Abɔnsam gyima biala mɔɔ yeli la.
      sbs: 0.6216
      gen_sec: 8.32
      ref_sec: 7.08
      cer: 0.1429
      wer: 0.5556
    bible_00049:
      source: bible
      text: Ninyɛne ɛhye mɔ ati Nyamenle ɛya ne bara bɛdabɛ mɔɔ bɛandie ɔ ne la anwo zo.
      sbs: 0.5778
      gen_sec: 6.44
      ref_sec: 3.6
      cer: 0.3667
      wer: 0.8125
    bible_00050:
      source: bible
      text: Mekɛ ne anu ɛnee Dwuu mgbanyima ne mɔ ɛlɛkpondɛ ye ɛsesebɛ wɔ ɛvoyia ne abo, na bɛbizale kɛ,
        “Ɔwɔ nienwu?
      sbs: 0.5528
      gen_sec: 10.4
      ref_sec: 6.88
      cer: 0.2683
      wer: 0.8
    bible_00051:
      source: bible
      text: ” Zɔhane ati sogyama ne pɛle nyɛma ne mɔɔ lɛ ɛlɛne ekyi ne la anu na bɛmanle ɔhɔle.
      sbs: 0.5723
      gen_sec: 7.64
      ref_sec: 5.26
      cer: 0.1562
      wer: 0.7059
    bible_00052:
      source: bible
      text: ” Aleɛ hyenle nwonlomɔ mangyee ne la, ɛzoanvolɛma ne hɔle Ɛzonlenlɛ Sua ne anu na bɛbɔle ɔ
        bo kɛ bɛkilehile.
      sbs: 0.6044
      gen_sec: 9.48
      ref_sec: 6.54
      cer: 0.314
      wer: 0.6316
    bible_00053:
      source: bible
      text: Nyamenle tumi ne rale Gyisɛse anwo zo na ɔyɛle wuleravolɛma ayile.
      sbs: 0.5612
      gen_sec: 5.8
      ref_sec: 4.08
      cer: 0.1091
      wer: 1.0
    bible_00054:
      source: bible
      text: ’ Na ɔ ze vɛlɛle ye sonvolɛma ne mɔ na ɔzele bɛ kɛ, ‘Bɛha bɛ nwo na bɛhɔva tɛladeɛ kpalɛ bɛrawula
        ye.
      sbs: 0.6254
      gen_sec: 10.4
      ref_sec: 7.72
      cer: 0.1711
      wer: 0.7143
    bible_00055:
      source: bible
      text: Sonla zɛhae ɛnde ninyɛne ɛhye mɔ abo; bɛle ɔ nye zo ɛzɛlɛ edwɛkɛ, ɔboalekɛ kyesɛ sunsum nu
        ala na bɛade ɔ bo.
      sbs: 0.6072
      gen_sec: 10.44
      ref_sec: 6.7
      cer: 0.2941
      wer: 0.8636
    bible_00056:
      source: bible
      text: Ɛhɛe, yɛɛ eza mebahɔ zolɛ meali fɛlɛko, ɔluakɛ meze kɛ ɔlua bɛmɛ bɛ nzɛlɛlɛ nee Gyisɛse Kelaese
        Sunsum ne moalɛ zo mebavi efiade ɛke.
      sbs: 0.5587
      gen_sec: 11.8
      ref_sec: 7.92
      cer: 0.1869
      wer: 0.8333
    bible_00057:
      source: bible
      text: Ɔluakɛ menea a ɔnwie nrɛlɛbɛ yɛ kɛ melɛ pilizanli melɛkɔ na menlɛ ɔ nwo ɛzonledonlɛ kpalɛ
        biala a.
      sbs: 0.6239
      gen_sec: 9.16
      ref_sec: 9.32
      cer: 0.1625
      wer: 0.6667
    bible_00058:
      source: bible
