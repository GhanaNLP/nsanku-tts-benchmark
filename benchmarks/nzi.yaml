      ref_sec: 6.78
      cer: 0.1758
      wer: 0.6522
    bible_00067:
      source: bible
      text: Mekɛ mɔɔ bɛkɛyia nu la saa awie mɔ baha aneɛ ngakyile a, bɛmaa menli nwiɔ anzɛɛ yebo zolɛ
