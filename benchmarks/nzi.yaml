      sbs: 0.6587
      gen_sec: 8.08
      ref_sec: 7.72
      cer: 0.0789
      wer: 0.7143
    bible_00055:
      source: bible
      text: Sonla zɛhae ɛnde ninyɛne ɛhye mɔ abo; bɛle ɔ nye zo ɛzɛlɛ edwɛkɛ, ɔboalekɛ kyesɛ sunsum nu
        ala na bɛade ɔ bo.
      sbs: 0.7065
      gen_sec: 7.04
      ref_sec: 6.7
      cer: 0.0941
      wer: 0.3182
    bible_00056:
      source: bible
      text: Ɛhɛe, yɛɛ eza mebahɔ zolɛ meali fɛlɛko, ɔluakɛ meze kɛ ɔlua bɛmɛ bɛ nzɛlɛlɛ nee Gyisɛse Kelaese
        Sunsum ne moalɛ zo mebavi efiade ɛke.
      sbs: 0.6857
      gen_sec: 10.64
      ref_sec: 7.92
      cer: 0.0467
      wer: 0.2917
    bible_00057:
      source: bible
      text: Ɔluakɛ menea a ɔnwie nrɛlɛbɛ yɛ kɛ melɛ pilizanli melɛkɔ na menlɛ ɔ nwo ɛzonledonlɛ kpalɛ
