      cer: 0.075
      wer: 0.1818
    bible_00098:
      source: bible
      text: ’ Atɔfolɛ nrenya ne a le mɔɔ gya atɔfolɛ ne la, saa atɔfolɛ nrenya ne agɔnwo ne mɔɔ gyi ahane
