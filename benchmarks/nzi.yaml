      sbs: 0.6834
      gen_sec: 7.72
      ref_sec: 7.5
      cer: 0.086
      wer: 0.3333
    bible_00075:
      source: bible
      text: Gyisɛse wule manle yɛ amaa ɔba a, saa yɛwu o, yɛde ngoane nu o, yɛ nee ye adɛnla.
      sbs: 0.6957
      gen_sec: 5.16
      ref_sec: 5.08
      cer: 0.1167
      wer: 0.3889
    bible_00076:
      source: bible
      text: Bɛdwenle ninyɛne mɔɔ wɔ anwuma lɔ la anwo na bɛgyakyi mɔɔ wɔ azɛlɛ ye azo la.
      sbs: 0.6873
      gen_sec: 5.08
      ref_sec: 4.0
      cer: 0.1148
      wer: 0.4375
    bible_00077:
      source: bible
      text: Melɛsiane ye meamaa yeara ɛ nwo lɔ bieko, na fa ye kɛ medame ɔ.
      sbs: 0.6969
      gen_sec: 4.12
      ref_sec: 3.68
      cer: 0.1667
      wer: 0.7143
    bible_00078:
      source: bible
      text: Nyamenle kpɔmanvolɛma alane ɛhye mɔ le ɛtane ewiade ye ɛdeɛ, yemɔti bɛka ewiade ye edwɛkɛ,
