      gen_sec: 7.36
      ref_sec: 5.26
      cer: 0.0469
      wer: 0.2941
    bible_00052:
      source: bible
      text: ” Aleɛ hyenle nwonlomɔ mangyee ne la, ɛzoanvolɛma ne hɔle Ɛzonlenlɛ Sua ne anu na bɛbɔle ɔ
