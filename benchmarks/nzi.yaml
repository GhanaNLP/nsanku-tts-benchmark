      sbs: 0.7063
      gen_sec: 14.28
      ref_sec: 12.04
      cer: 0.0909
      wer: 0.6579
    bible_00091:
      source: bible
      text: Boni a ye ɛhanlɛ ɛnyɛ se a, kɛ ɛse awie kɛ, ‘Bɛva wɔ ɛtane ne mɔ bɛhyɛ wɔ’, anzɛɛ ‘Dwazo na
        tia?
      sbs: 0.68
      gen_sec: 5.92
      ref_sec: 7.22
      cer: 0.0882
      wer: 0.4545
    bible_00092:
      source: bible
      text: Bɛnlea boɛ wɔ nindavoma anwo; menli ɛhye mɔ ɛhakyi ahwea mɔɔ nganlɛ ala a bɛkulo kɛ bɛbɔ bɛ
        nwo a.
