      ref_sec: 3.6
      cer: 0.0333
      wer: 0.0625
    bible_00050:
      source: bible
      text: Mekɛ ne anu ɛnee Dwuu mgbanyima ne mɔ ɛlɛkpondɛ ye ɛsesebɛ wɔ ɛvoyia ne abo, na bɛbizale kɛ,
        “Ɔwɔ nienwu?
      sbs: 0.677
      gen_sec: 8.24
      ref_sec: 6.88
      cer: 0.0122
      wer: 0.05
    bible_00051:
      source: bible
