      cer: 0.3333
      wer: 0.875
    bible_00117:
      source: bible
      text: Mena dɔɔ te mee kpila e ɛ gyaŋ na ɔ kaa yako ŋon da kekyaabii man nombia na waa do ŋon kakyeŋ.
