      cer: 0.213
      wer: 0.5357
    bible_00131:
      source: bible
      text: Mberem na ŋolo mɔ ne gyae waa mo deise wɔlɛɛ kpookpoo kolosi, yaa ŋolo mɔ kyaa keŋ waa lese
