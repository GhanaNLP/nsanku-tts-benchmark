      wer: 0.6486
    bible_00113:
      source: bible
      text: Mɛɛ yako ŋon ɛ ke nyii nyiaa, kɛŋa pou deŋele kewɔŋ gyae ke kɔŋ ɛmɛɛ gyɛŋ balaŋ kɛwɔ dɔɔ.
