      cer: 0.0213
      wer: 0.1111
    bible_00099:
      source: bible
      text: Ɛ na ŋere balaŋ baŋ Wurubuarɛ ba mo wɔ do ɛ nyiŋmaa man nyi yaa kɛɛ be dɔɔ nɛ ya, mɔna ɛ yela
