      wer: 0.9545
    bible_00118:
      source: bible
      text: Me tebia Aberaham duuluŋ man bia, na ɛmɛɛ baŋ ɛ te yɛɛ Iseraetenawɔ ya te ɛ ne yee Wurubuarɛ
