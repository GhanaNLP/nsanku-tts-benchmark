      wer: 1.0
    bible_00111:
      source: bible
      text: Ɛmɛɛ gbagba ɛ kyaɔ na ɛ naɔ na ɛ naabia na ɛ loŋtona na ɛ gyoona ne gyae la baa lese ŋon fa,
