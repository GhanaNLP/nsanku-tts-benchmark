      cer: 0.1264
      wer: 0.3793
    bible_00150:
      source: bible
      text: Nombia ŋenaŋ gyae ka lese ɔ konɔɔ man nombia ŋan pou weesɛɛ nɛ debɔɔ, na waa buŋ som Wurubuarɛ
