      wer: 0.8947
    bible_00149:
      source: bible
      text: Debaŋ keŋ me kyaa ɛ gyaŋ nɛ, ma te gyae nyi maa gyeŋ kolo kpu na Yesu Kristo na ɔ yeŋ keŋ
