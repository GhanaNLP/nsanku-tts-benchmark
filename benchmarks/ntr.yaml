      cer: 0.0833
      wer: 0.1538
    bible_00066:
      source: bible
      text: Ɔ te gyae nyi waa gyu Gyudia tɛɛle man ya, nawolo nyi Gyudatena kegyiise baŋ be kyaa botɔɔ
