      sbs: 0.702
      gen_sec: 7.44
      ref_sec: 6.2
      cer: 0.1667
      wer: 0.3571
    bible_00101:
      source: bible
      text: Koa, baa tisina ŋon ateta ateta kɔŋ botɔɔ keŋ ɛ kena diyem kekpaakekpaa.
      sbs: 0.6409
