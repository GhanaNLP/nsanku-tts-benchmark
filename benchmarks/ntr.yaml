      cer: 0.2393
      wer: 0.5758
    bible_00152:
      source: bible
      text: Te ɔ see daa saere na dɛɛ som de Gbeŋgyoo Wurubuarɛ ŋon ɔ yɛɛ ɔ Wurubuarɛ na ɔ kya e nɛ.
