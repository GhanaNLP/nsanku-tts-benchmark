      wer: 0.1818
    bible_00080:
      source: bible
      text: Nawolo nyi ŋon ne tale la yɛɛ abɔɔ burum kela mena keŋ dɛɛ bɔɔse yaa dɛɛ gyueŋ lee ɔ doŋ keŋ
