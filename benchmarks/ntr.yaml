      cer: 0.1475
      wer: 0.4375
    bible_00072:
      source: bible
      text: Nawolo nyi baŋ be gyae baa tale yɛɛ mena tɔ neŋ kom ya, mɔna Wurubuarɛ ne gyae la waa tɔ neŋ
