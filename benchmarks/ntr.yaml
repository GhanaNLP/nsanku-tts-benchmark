      cer: 0.0758
      wer: 0.3333
    bible_00059:
      source: bible
      text: Balaŋ benaŋ yɛna balaŋ baŋ bɔɔ yoo di wonembukum ŋon na bane ŋon bɔɔ maa wonembukum ŋonaŋ
