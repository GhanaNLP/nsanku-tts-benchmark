      cer: 0.0413
      wer: 0.1429
    bible_00097:
      source: bible
      text: Bi nɛ e kɛ yo nyɔguɛ ɔ fɔ ɔ, a fɔ lɛ kɛkɛ; se bi nɛ yo odehe ɔ fɔ ɔ, Mawu wo e he si.
