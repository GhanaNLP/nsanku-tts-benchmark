      wer: 0.225
    bible_00096:
      source: bible
      text: se nɔ nɛ maa nu nyu nɛ imi ma ha lɛ ɔ, kuma be lɛ yee hu gblegbleegble. Ejakaa nyu nɛ ma ha
        lɛ ɔ ma plɛ nyu hɛngmɛ nɛ baa nyu nɛ haa nɔ wami kɛ yaa neneene ngɛ e mi.”
      sbs: 0.7129
