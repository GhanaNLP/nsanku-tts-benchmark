      cer: 0.0303
      wer: 0.0833
    bible_00025:
      source: bible
      text: Ngɛ mlaa a blɔ fa mi ɔ, i plɛ pee nɔ gbogboe, konɛ ma hi wami mi ha Mawu mohu. I kɛ Kristo
