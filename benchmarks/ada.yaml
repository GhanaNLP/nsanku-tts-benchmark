      ref_sec: 12.98
      cer: 0.1212
      wer: 0.3478
    bible_00086:
      source: bible
      text: To kɛ na muɔ, kɛ na bi nɛ a sã a la zu ji níhi nɛ a kɛ fĩaa nihi nɛ ble a he ɔ a nɔ, nɛ a
