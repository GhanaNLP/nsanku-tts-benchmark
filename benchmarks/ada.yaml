      sbs: 0.6275
      gen_sec: 6.88
      ref_sec: 4.72
    '103':
      text: Ejakaa Nyɔmtsɛ ɔ buu dali a he, nɛ ke a fa kue ha lɛ ɔ, e nuɔ.
      sbs: 0.594
      gen_sec: 7.28
      ref_sec: 4.9
    '105':
