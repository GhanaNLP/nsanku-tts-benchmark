      sbs: 0.6393
      gen_sec: 3.27
      ref_sec: 4.98
    '139':
      text: “Nyɛɛ ba! Nyɛ ba hyɛ nyumu ko nɛ de mi níhi tsuo nɛ i pee hyɛ. Anɛ pi lɛ ji Kristo ɔ lo?”
      sbs: 0.6718
      gen_sec: 4.53
      ref_sec: 6.2
    '140':
      text: Melki bi ɔ, Adi bi ɔ, Kosam bi ɔ, Elmadam bi ɔ, Er bi ɔ,
      sbs: 0.7327
      gen_sec: 2.12
      ref_sec: 6.82
    '147':
      text: Lɔ ɔ he ɔ, Paulo ye jeha, kɛ nyɔhiɔ ekpa ngɛ lejɛ ɔ, nɛ e kɛ tsɔɔ ni ɔmɛ Mawu munyu ɔ.
      sbs: 0.6531
      gen_sec: 4.4
      ref_sec: 5.68
    '150':
      text: Yuda bi ɔmɛ a nɔkɔtɔma ko ngɛ nɛ a tsɛɛ lɛ Nikodemo. Farisi no ji lɛ.
      sbs: 0.6695
      gen_sec: 2.93
      ref_sec: 4.74
    '151':
      text: “I ngɛ nyɛ ní nɛ ɔmɛ dee, bɔ nɛ pee nɛ nyɛ ko ngmɛɛ nyɛ hemi kɛ yemi ɔ he.
      sbs: 0.6925
      gen_sec: 3.35
      ref_sec: 4.04
    '152':
      text: Benɛ Maria nu enɛ ɔ, e te si pam, nɛ e je kpo esɔ, nɛ e kɛ Yesu ya kpe.
      sbs: 0.6478
      gen_sec: 3.4
      ref_sec: 6.18
    '153':
      text: Niinɛ, kunya yemi nɛ ɔ nɛ haa ni ɔmɛ a nya kpɛɛ a he ɔ, Simon je sisi kɛ.
      sbs: 0.6208
      gen_sec: 3.23
      ref_sec: 4.18
    '155':
      text: Dloomi, mɔbɔ nami, kɛ he jɔmi nɛ je Tsɛ Mawu ɔ, kɛ Kristo Yesu, wa Nyɔmtsɛ ɔ dɛ mi ɔ ha mo!
      sbs: 0.6481
      gen_sec: 4.32
      ref_sec: 6.78
    '156':
      text: kɛ lɛ dami. A hlaa kaa a wo e nya tso kpɛ, konɛ e de nɔ́ ko nɛ sɛ́, nɛ a kɛ po e nya.
      sbs: 0.6715
      gen_sec: 4.22
      ref_sec: 8.02
    '158':
      text: A maa fia lɛ kpa, nɛ a maa gbe lɛ. Se ligbi etɛ se ɔ, e maa te si kɛ ba wami mi ekohu.”
      sbs: 0.6675
      gen_sec: 4.28
      ref_sec: 6.36
    '159':
      text: Nɔ nɛ tsɛ nyɛ ɔ, anɔkualetsɛ ji lɛ; nɛ e maa pee hulɔ.
      sbs: 0.6465
      gen_sec: 2.62
      ref_sec: 3.86
    '163':
      text: nɛ a te si ngɔ wo e nyɔmtsɛ ɔ kɛ nɔ nɛ a pɔ lɛ nu ɔ.’
      sbs: 0.6653
      gen_sec: 2.31
      ref_sec: 5.08
    '164':
      text: Tsɔɔ yalɔyi ɔmɛ ní nɛ ɔmɛ, konɛ nɔ ko nɔ ko kó tu a he munyu yaya.
      sbs: 0.6763
      gen_sec: 3.14
      ref_sec: 3.8
    '165':
      text: A ha hwɔ, nɛ a sɔle kɛ hla nikɔtɔmahi, nɛ a tu mɛ ngɔ wo Nyɔmtsɛ ɔ nɛ a he ye ɔ dɛ mi.
      sbs: 0.6298
      gen_sec: 4.0
      ref_sec: 5.38
    '167':
      text: Ejakaa benɛ Abraham kɛ Melkizedek kpe ɔ, Levi ngɛ e nɛ̃ Abraham mi mi kɛ mwɔɔ.
      sbs: 0.6371
      gen_sec: 3.57
      ref_sec: 6.84
    '168':
      text: “Lɔ ɔ he ɔ, kɛ wai ngmɔtsɛ ɔ maa pee apaa yeli ɔmɛ kɛɛ?
      sbs: 0.6974
      gen_sec: 2.45
      ref_sec: 3.88
    '172':
      text: Se Yesu na a juɛmi ɔ momo. Lɔ ɔ he ɔ, e de mɛ ke,
      sbs: 0.6584
      gen_sec: 1.63
      ref_sec: 3.68
    '179':
      text: (Anɔkuale mi ɔ, Yesu nitsɛ sɔle we nɔ ko, se e kaseli ɔmɛ mohu lɛ a sɔle nihi.)
      sbs: 0.6512
      gen_sec: 3.72
      ref_sec: 6.12
    '181':
