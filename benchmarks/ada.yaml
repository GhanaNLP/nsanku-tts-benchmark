      ref_sec: 7.0
      cer: 0.0317
      wer: 0.125
    bible_00082:
      source: bible
      text: Mɛni he je nɛ o ngɛ tsle toe? Tee si nɛ o ha a sɔle mo ngɛ Nyɔmtsɛ ɔ biɛ mi, nɛ o kpa Mawu
