      gen_sec: 5.63
      ref_sec: 6.7
      cer: 0.1111
      wer: 0.2222
    bible_00073:
      source: bible
      text: E fɔɔ si paa kaa nɔ nɛ nɔ kuɔ lɛ gbaa nɔ nɛ ngɛ e sisi.
