      ref_sec: 5.98
      cer: 0.0357
      wer: 0.0769
    bible_00098:
      source: bible
      text: Se ke Mawu dɛ mi nɛ e je ɔ, nyɛ be Mawu nɔ nyɛe maa ye. Nyɛ ko ba pee nyɛ he kaa nihi nɛ a
        kɛ Mawu ngɛ ta hwue!”
