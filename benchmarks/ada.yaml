      sbs: 0.668
      gen_sec: 8.32
      ref_sec: 8.58
      cer: 0.0632
      wer: 0.2333
    bible_00090:
      source: bible
      text: Nyɛ hlaa ngmami ɔmɛ a mi, ejakaa nyɛ susuɔ kaa a mi nyɛ ma na neneene wami ngɛ; nɛ lɔ ɔmɛ
        nɔuu yeɔ ye he odase.
      sbs: 0.7234
      gen_sec: 7.6
      ref_sec: 8.76
      cer: 0.0843
      wer: 0.3077
    bible_00091:
      source: bible
      text: ejakaa lɛ nitsɛ e ye odase ke, “A bui gbalɔ ngɛ lɛ nitsɛ e ma mi.”
