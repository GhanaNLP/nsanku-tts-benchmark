      sbs: 0.6089
      gen_sec: 5.8
      ref_sec: 4.68
    '486':
      text: Se benɛ i ná le kaa a so e yi nɔ nɛ a maa gbe lɛ ɔ,
      sbs: 0.5373
      gen_sec: 5.2
      ref_sec: 3.22
    '487':
