      cer: 0.0278
      wer: 0.037
    bible_00026:
      source: bible
      text: Se kɛ̃ ɔ, bɔ nɛ pee nɛ munyu ɔ ko gbɛ fĩa fuu ko hu ngɛ ma a mi he je ɔ, nyɛ ha waa bɔ mɛ
