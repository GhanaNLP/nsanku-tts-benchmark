      sbs: 0.6998
      gen_sec: 4.43
      ref_sec: 5.32
    '491':
      text: Yuda bi ɔmɛ bi lɛ ke, “Mo nɛ o na we jeha nyingmi enuɔ po ɔ, o na Abraham lo?”
      sbs: 0.6835
      gen_sec: 4.28
      ref_sec: 5.8
    '492':
