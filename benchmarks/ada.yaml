      sbs: 0.62
      gen_sec: 4.56
      ref_sec: 3.08
    '182':
      text: Enɛ ɔ se ɔ, Yuda bi ɔmɛ ngɛ nyami ligbi yee ngɛ Yerusalem, nɛ Yesu ya lejɛ ɔ.
      sbs: 0.6474
      gen_sec: 8.16
      ref_sec: 5.8
    '183':
      text: Mawu dloo Stefano saminya, nɛ e ha lɛ he wami nɛ e kɛ pee nyakpɛ ní nguanguahi ngɛ ma a mi.
      sbs: 0.5789
      gen_sec: 9.32
      ref_sec: 5.56
    '185':
      text: Jehanɛ, i nu gbi ko nɛ de mi ke, ‘Petro, tee si, gbee eko nɛ o ye!’
      sbs: 0.6136
      gen_sec: 7.48
      ref_sec: 4.54
    '188':
