      ref_sec: 8.58
      cer: 0.0316
      wer: 0.2333
    bible_00090:
      source: bible
      text: Nyɛ hlaa ngmami ɔmɛ a mi, ejakaa nyɛ susuɔ kaa a mi nyɛ ma na neneene wami ngɛ; nɛ lɔ ɔmɛ
