      gen_sec: 3.62
      ref_sec: 4.82
    '438':
      text: Kɛkɛ nɛ nyumu ɔ nitsɛ de mɛ ke, “Imi ji lɛ.”
      sbs: 0.6661
      gen_sec: 2.72
      ref_sec: 4.0
    '440':
