      sbs: 0.6152
      gen_sec: 5.6
      ref_sec: 4.78
    '215':
      text: Se Petro he nɔ ke, “Awetsɛ, pi a ti nɔ kake ji mi!”
      sbs: 0.5834
      gen_sec: 6.12
      ref_sec: 4.32
    '216':
