      gen_sec: 3.0
      ref_sec: 4.68
      cer: 0.02
      wer: 0.3158
    bible_00084:
      source: bible
      text: Lɔ ɔ he ɔ, moo tsɔ nihi kɛ ya Yopa, nɛ o ya kpee Simon nɛ a tsɛɛ lɛ Petro hulɔ ɔ kɛ ba.
      sbs: 0.6016
      gen_sec: 3.81
      ref_sec: 6.52
      cer: 0.1475
      wer: 0.4167
    bible_00085:
      source: bible
      text: Mawu ngɔɛ blema bi ɔmɛ a he ngɔ ki mɛ, se mohu e ngɔ nyu kpekpemi kɛ kpata yayami peeli ɔmɛ
        a hɛ mi. Noa nɛ fiɛ ke a ye dami sane ɔ, e kɛ ni kpaago kpa komɛ pɛ lɛ Mawu he a yi wami.
