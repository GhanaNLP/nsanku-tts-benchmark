      ref_sec: 8.66
      cer: 0.1222
      wer: 0.3529
    bible_00094:
      source: bible
      text: Benɛ a kpale ya lejɛ ɔ si enyɔne ɔ, Yosef je e he si ngɔ ha e nyɛmimɛ ɔmɛ, nɛ Egipt matsɛ
        ɔ hu ba le Yosef weku ɔ.
