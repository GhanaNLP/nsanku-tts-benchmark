      wer: 0.1923
    bible_00089:
      source: bible
      text: Benɛ Farisi bi ɔmɛ nu nɛ ma kpekpemi ɔ ngɛ Yesu he munyu tue kusikusi ɔ, a kɛ osɔfo nikɔtɔma
