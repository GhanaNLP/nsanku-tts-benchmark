      text: Wa nu nɛ e de ke, Yesu, Nazaret no ɔ, maa ku sɔlemi we nɛ ɔ, nɛ e ma tsake blɔ nyahi nɛ Mose
        ngɔ ha wɔ ɔ.”
      sbs: 0.6864
      gen_sec: 9.12
      ref_sec: 6.7
      cer: 0.1918
      wer: 0.3929
    bible_00028:
      source: bible
      text: Lɔ ɔ he ɔ, awenyɛ nɛ i suɔ! I kpa mo pɛɛ, nyɛ ha nɛ waa suɔ wa sibi. Nɔ́ nɛ i ngɛ ngmae nɛ
        ɔ, pi mlaa he, se mohu mlaa a nɛ a wo wɔ kɛ je sisije ɔ.
      sbs: 0.6843
      gen_sec: 12.96
      ref_sec: 12.38
      cer: 0.0909
      wer: 0.2683
    bible_00029:
      source: bible
      text: Pi kaa anɔkuale ɔ nɛ nyɛ li nɛ i ngɛ nyɛ womi nɛ ɔ ngmae. Dɛbi! Akɛnɛ nyɛ le anɔkuale ɔ, lɔ
        ɔ he mohu nɛ i ngɛ nyɛ womi ɔ ngmae ɔ nɛ; nɛ nyɛ le hu kaa anɔkuale ɔ, lakpa be mi.
      sbs: 0.7013
      gen_sec: 12.64
      ref_sec: 13.44
      cer: 0.0635
      wer: 0.1136
    bible_00030:
      source: bible
      text: Ni ɔmɛ nɛ ngɛ nyɛ hɛ mi hae ɔ, nyɛ bu kaa a suɔ nyɛ; a be nyɛ he juɛmi kpakpa. A ngɛ hlae
        nɛ a puɛ i kɛ nyɛ wa kpɛti, konɛ nyɛ gbo mɛ mohu a he dengme.
      sbs: 0.6604
      gen_sec: 29.68
      ref_sec: 9.38
      cer: 1.9439
      wer: 2.45
    bible_00031:
      source: bible
      text: Nyɛ ma de ekohu ke, ‘Waa kɛ mo lɛ ye ní, nɛ waa kɛ mo lɛ nu ní; o tsɔɔ ní ngɛ wa magbɛ ɔmɛ
        a nɔ.’
      sbs: 0.7046
      gen_sec: 7.28
      ref_sec: 6.82
      cer: 0.0308
      wer: 0.0741
    bible_00032:
      source: bible
      text: Kristo he ɔ, wa plɛ kuasiahi, se nyɛɛ lɛɛ nyɛ ba pee ní leli! Wa gbɔjɔ, se nyɛɛ lɛɛ nyɛ he
        mi ba wa nyɛ! Nyɛ hɛ mi ba nyami, se wɔɔ lɛɛ wa hɛ mi pue si.
      sbs: 0.7006
      gen_sec: 12.56
      ref_sec: 11.14
      cer: 0.0185
      wer: 0.1579
    bible_00033:
      source: bible
      text: ejakaa Mawu Ope ɔ pee ní nguanguahi ha mi.
      sbs: 0.6424
      gen_sec: 3.44
      ref_sec: 3.06
      cer: 0.1818
      wer: 0.8889
    bible_00034:
      source: bible
      text: Se bɔ nɛ ba nɛ e ngɛ nɔ hyɛe amlɔ nɛ ɔ, lɔ ɔ lɛɛ wa li; nɛ nɔmlɔ nɛ ha nɛ e bɔni nɔ́ hyɛmi
        ɔ hu wa li lɛ. Nyɛ bi lɛ; e wa nɛ lɛ nitsɛ e ma nyɛ je munyu nya.”
      sbs: 0.6588
      gen_sec: 12.24
      ref_sec: 10.54
      cer: 0.0755
      wer: 0.1333
    bible_00035:
      source: bible
      text: A pee ja niinɛ, nɛ a ngɔ sika a kɛ mane asafo nikɔtɔma amɛ kɛ gu Barnaba kɛ Saulo a nine nɔ.
      sbs: 0.665
      gen_sec: 8.0
      ref_sec: 7.7
      cer: 0.1449
      wer: 0.3636
    bible_00036:
      source: bible
      text: Ejakaa ngmami ɔ deɔ ke, “Osɔfo ji mo kɛ yaa neneene kaa Melkizedek pɛ.”
      sbs: 0.6117
      gen_sec: 6.8
      ref_sec: 5.08
      cer: 0.0926
      wer: 0.5
    bible_00037:
      source: bible
      text: Yi nikɔtɔma amɛ ɔ, o kɛ mɛ nɛ hi si kaa mo nitsɛ o nyɛmɛ, nɛ o kɛ yihewi ɔmɛ nɛ hi si kaa
        o nyɛmiyihi; se hyɛ nɛ yakayaka fiɛmi kó ba je mi.
      sbs: 0.6239
      gen_sec: 10.48
      ref_sec: 9.98
      cer: 0.0784
      wer: 0.3143
    bible_00038:
      source: bible
      text: Lɔ ɔ he ɔ, a ya to Yesu gbogboe ɔ ngɛ lejɛ ɔ, ejakaa yɔkɔ ɔ he kɛ we, nɛ jehanɛ ɔ hu, jamɛ
        a ligbi ɔ nɛ a dlaa he kɛ haa Hejɔɔmi ligbi ɔ nɛ.
      sbs: 0.7224
      gen_sec: 11.36
      ref_sec: 12.04
      cer: 0.0303
      wer: 0.0811
    bible_00039:
      source: bible
      text: Se a ti ni komɛ pue nɔ kɛ ho nɛ a ya sɛɛ níhi nɛ Yesu pee ɔ ha Farisi bi ɔmɛ.
      sbs: 0.6888
      gen_sec: 5.12
      ref_sec: 5.2
      cer: 0.0909
      wer: 0.2273
    bible_00040:
      source: bible
      text: Yuda bi komɛ nɛ yee Mawu gbeye ngɛ Yerusalem jamɛ a be ɔ mi. A je je ma amɛ tsuo a mi.
      sbs: 0.6243
      gen_sec: 6.32
      ref_sec: 5.68
      cer: 0.0317
      wer: 0.1818
    bible_00041:
      source: bible
      text: Anɛ nyɛ li kaa yayami peeli be blɔ nya ko ngɛ Mawu matsɛ yemi ɔ mi lo? Nyɛ ko sisi nyɛ he!
        Yaholi, loo amaga jali, loo gba puɛli, loo nyumuhi kɛ yihi sɔuu nɛ kɛ a sibi peeɔ yakayaka ní,
      sbs: 0.6943
      gen_sec: 14.72
      ref_sec: 13.24
      cer: 0.0432
      wer: 0.2195
    bible_00042:
      source: bible
      text: Benɛ bɔfo ɔmɛ si to hyɛli ɔmɛ, nɛ a kpale kɛ ho hiɔwe ya a, to hyɛli ɔmɛ de a he ke, “Nyɛ
        ha nɛ waa ya Betlehem, nɛ wa ya hyɛ nɔ́ nɛ ba, nɛ Nyɔmtsɛ ɔ je tsɔɔ wɔ nɛ ɔ.”
      sbs: 0.673
      gen_sec: 11.76
      ref_sec: 12.18
      cer: 0.1034
      wer: 0.1628
    bible_00043:
      source: bible
      text: Tsɛ te nɛ ngɛ nyɛ kpɛti, nɛ ke e bi bi lɛ abolo nɛ e ma ha lɛ tɛ? Aloo ke e bi lɛ lo, nɛ e
        maa ngɔ sinɔ ngɔ pee lo ngɔ ha lɛ?
      sbs: 0.6506
      gen_sec: 10.56
      ref_sec: 9.38
      cer: 0.0698
      wer: 0.1667
    bible_00044:
      source: bible
      text: Se Natanael bi Filipo ke, “Anɛ nɔ́ kpakpa ko maa je Nazaret lo?”
      sbs: 0.675
      gen_sec: 4.8
      ref_sec: 4.34
      cer: 0.0638
      wer: 0.3846
    bible_00045:
      source: bible
      text: Nɔ nɛ heɔ Bi ɔ yeɔ ɔ, e nine su neneene wami ɔ nɔ; se nɔ tsuaa nɔ nɛ bui Bi ɔ tue ɔ, e be
        neneene wami nae. Mawu maa gbla e tue mohu.
      sbs: 0.6595
      gen_sec: 11.28
      ref_sec: 12.54
      cer: 0.117
      wer: 0.3714
    bible_00046:
      source: bible
      text: Pohu ngmami ɔ nɛ de ke e sa nɛ e te si kɛ je gbeje ɔ, a nui sisi kɛ mwɔɔ.
      sbs: 0.6753
      gen_sec: 6.24
      ref_sec: 4.96
      cer: 0.0588
      wer: 0.0952
    bible_00047:
      source: bible
      text: Ma ya nɔ ma fĩa kɛ̃, pohu se nami ko be he. Jehanɛ lɛɛ nɔ́ nɛ he munyu nɛ ma tu ji bɔ nɛ Nyɔmtsɛ
        Yesu Kristo je e he kpo tsɔɔ mi, kɛ e suɔmi nya níhi nɛ e tsɔɔ ke ma pee.
      sbs: 0.6958
      gen_sec: 11.28
      ref_sec: 10.36
      cer: 0.0579
      wer: 0.2045
    bible_00048:
      source: bible
      text: Nyɛɛ ngɔ nyɛ he ngɔ mɛtɛ lɛ, nɛ nyɛɛ ngɔ nyɛ he kɛ ha lɛ kulaa. Nyɛ ha nɛ nyɛ hemi kɛ yemi
        ɔ mi nɛ wa kaa bɔ nɛ a tsɔɔ nyɛ ɔ, nɛ nyɛɛ na Mawu si daa.
      sbs: 0.6832
      gen_sec: 10.8
      ref_sec: 8.68
      cer: 0.0472
      wer: 0.175
    bible_00049:
      source: bible
      text: Kikɛ nɛ ɔ nyɛ be yi! Nɛ nyɛ ngɔ Mumi Klɔuklɔu ɔ kɛ je sisi ɔ, jehanɛ lɛɛ nyɛɛ kɛ he lo maa
        gbe nya.
      sbs: 0.7143
      gen_sec: 6.56
      ref_sec: 5.86
      cer: 0.0417
      wer: 0.12
    bible_00050:
      source: bible
      text: E ko pee nɔ ko nɛ tsake e tsui kɛ we. Ke pi ja a, e ma wo e he nɔ, nɛ Mawu maa gbla e tue
        kaa bɔ nɛ e pee Abosiami ɔ.
      sbs: 0.666
      gen_sec: 10.0
      ref_sec: 7.68
      cer: 0.05
      wer: 0.1765
    bible_00051:
      source: bible
      text: Yesu he nɔ ke, “I tuɔ munyu paa kɛ haa nɔ tsuaa nɔ. Daa nɛ ɔ, i tsɔɔ ní ngɛ kpe he ɔmɛ, kɛ
        sɔlemi we ɔ he nɛ Yuda bi kulaa kpee ngɛ ɔ, nɛ i de we nɔ́ ko nɔ́ ko ngɛ laami mi gblee.
      sbs: 0.7127
      gen_sec: 14.72
      ref_sec: 14.32
      cer: 0.1048
      wer: 0.2128
    bible_00052:
      source: bible
      text: Kikɛmɛ a okadi nɛ ɔ nɛ e to mɛ ɔ he nɛ ma kpekpemi ɔ ya kpee lɛ ɔ nɛ.
      sbs: 0.6776
      gen_sec: 5.12
      ref_sec: 4.66
      cer: 0.0612
      wer: 0.1
    bible_00053:
      source: bible
      text: Nɔ ko hu be dee ke, ‘O nɛ, e ngɛ hiɛ ɔ;’ aloo, ‘E ngɛ lejɛ ɔ’; ejakaa Mawu matsɛ yemi ɔ, nyɛ
        mi lɛ e ngɛ.”
      sbs: 0.7101
      gen_sec: 8.16
      ref_sec: 8.84
      cer: 0.0735
      wer: 0.3333
    bible_00054:
      source: bible
      text: Jehanɛ ɔ, osɔfo nɔkɔtɔma pe kulaa a nyɔguɛ ɔmɛ a ti nɔ kake, nɔ nɛ Petro po e tue ɔ weku no
        bi Petro ke, “Anɛ i nɛ o kɛ lɛ ngɛ abɔɔ ɔ mi lo?”
      sbs: 0.6696
      gen_sec: 10.96
      ref_sec: 9.2
      cer: 0.03
      wer: 0.1389
    bible_00055:
      source: bible
      text: Benɛ ni ɔmɛ nu munyu nɛ ɔ, e hao mɛ wawɛɛ, nɛ a bi Petro kɛ bɔfo kpa amɛ nɛ piɛ e he ɔ ke,
        “Wa nyɛmimɛ, kɛ wa maa pee kɛɛ?”
      sbs: 0.7137
      gen_sec: 9.04
      ref_sec: 9.26
      cer: 0.0706
      wer: 0.25
    bible_00056:
      source: bible
      text: Jamɛ a be ɔ mi ɔ, Kaisare Augusto fa ke a kane nihi tsuo nɛ ngɛ Roma nɔ yemi he ɔ, nɛ a ngma
        a biɛ.
      sbs: 0.7444
      gen_sec: 8.8
      ref_sec: 8.24
      cer: 0.0423
      wer: 0.3462
    bible_00057:
      source: bible
      text: Se imi lɛɛ i na kaa e pee we nɔ́ ko nɛ sa gbenɔ. Akɛnɛ lɛ nitsɛ e ngɔ e sane ɔ kɛ ha Roma
        matsɛ ɔ he je ɔ, i ma nya si kaa a ngɔ lɛ kɛ ya ha Roma matsɛ ɔ.
      sbs: 0.6607
      gen_sec: 12.64
      ref_sec: 10.1
      cer: 0.0654
      wer: 0.25
    bible_00058:
      source: bible
      text: Nyɛɛ hyɛ mɔmɔhi nɛ ngɛ puɛe ha; a tsu we ní, nɛ a kpɛ we tade hulɔ. Se i ngɛ nyɛ dee ke, Matsɛ
        Salomo kɛ e ní babauu ɔ, lɛ tete po e be miaa we kaa mɔmɔ nɛ ɔmɛ a kpɛti kake.
      sbs: 0.6517
      gen_sec: 14.72
      ref_sec: 12.88
      cer: 0.0887
      wer: 0.3182
    bible_00059:
      source: bible
      text: Jehanɛ, nyɛ nyumu kuyo ɔmɛ, kɛ yalɔyi ɔmɛ ɔ, i ngɛ dee ke e maa hi ha nyɛ ke nyɛ maa ya nɔ
        maa hi si kikɛ nɛ ɔ kaa bɔ nɛ imi hu i ngɛ ɔ.
      sbs: 0.6526
      gen_sec: 10.8
      ref_sec: 9.86
      cer: 0.0833
      wer: 0.2432
    bible_00060:
      source: bible
      text: Osɔfo nɔkɔtɔma pe kulaa a bi Stefano ke, “Anɛ munyu nɛ ɔmɛ ngɛ mi ja lo?”
      sbs: 0.6355
      gen_sec: 6.48
      ref_sec: 4.46
      cer: 0.0741
      wer: 0.25
    bible_00061:
      source: bible
      text: Nyɛɛ lɛɛ nyɛ tsɔ kɛ ya Yohane ngɔ, nɛ e ye anɔkuale ɔ he odase.
      sbs: 0.7109
      gen_sec: 5.28
      ref_sec: 4.0
      cer: 0.0213
      wer: 0.0667
    bible_00062:
      source: bible
      text: Benɛ i kɛ nyɛ ngɛ, nɛ e fi mi tete ɔ, i hɛwi nyɛ ti nɔ ko nɔ ko; nyɛmimɛ nɛ je Makedonia kɛ
        ba a ba ha mi nɔ́ tsuaa nɔ́ nɛ hia mi. I pee we tlomi ngɛ nyɛ kuɛ nɔ. Nɛ kɛ je mwɔnɛ ɔ kɛ yaa
        a hu i hyɛ we nyɛ yemi kɛ buami ko blɔ.
      sbs: 0.6491
      gen_sec: 14.8
      ref_sec: 14.86
      cer: 0.0573
      wer: 0.1639
    bible_00063:
      source: bible
      text: Ejakaa Mumi ɔ bɛ a ti nɔ ko nɔ lolo; se a sɔle mɛ ngɛ Nyɔmtsɛ Yesu biɛ mi kɛkɛ.
      sbs: 0.6702
      gen_sec: 4.56
      ref_sec: 4.76
      cer: 0.0862
      wer: 0.4
    bible_00064:
      source: bible
      text: Mose nɛ ɔ nɛ e kɛ Israel ma kpekpemi ɔ nɛ ji wa nɛmɛ ɔmɛ hi nga a nɔ ɔ nɛ. Lɛ nɛ e kɛ Mawu
        bɔfo ɔ tu munyu ngɛ Sinai yo ɔ he; nɛ lɛ nɔuu nɛ e ngɔ Mawu sɛ gbi nɛ wami ngɛ mi ɔ ba ha wɔ.
      sbs: 0.7062
      gen_sec: 14.8
      ref_sec: 12.04
      cer: 0.0077
      wer: 0.0385
    bible_00065:
      source: bible
      text: Hejɔɔmi ligbi nɛ nyɛɛ se ɔ, ma a tsuo tu kɛ ba, nɛ a ba bu Nyɔmtsɛ ɔ munyu ɔ tue.
      sbs: 0.6524
      gen_sec: 6.88
      ref_sec: 5.22
      cer: 0.0517
      wer: 0.1429
    bible_00066:
      source: bible
      text: Dloomi, mɔbɔ nami, kɛ he jɔmi nɛ je Tsɛ Mawu ɔ, kɛ Tsɛ ɔ Bi Nyɔmtsɛ Yesu Kristo dɛ mi ɔ kɛ
        wɔ nɛ hi si ngɛ anɔkuale kɛ suɔmi mi.
      sbs: 0.6487
      gen_sec: 9.92
      ref_sec: 10.66
      cer: 0.0426
      wer: 0.0645
    bible_00067:
      source: bible
      text: Nɔ tsuaa nɔ nɛ hyɛ lɛ nitsɛ e ní peepee. Ke e hi ɔ, e ma nyɛ maa fĩa ngɔ fɔ nɔ, nɛ e be hiae
        kaa e maa ngɔ e he ngɔ to nɔ kpa he;
      sbs: 0.6888
      gen_sec: 10.08
      ref_sec: 8.2
      cer: 0.1124
      wer: 0.2703
    bible_00068:
      source: bible
      text: Se nihi tsuo nɛ he lɛ atuu, nɛ a he lɛ ye ɔ, e ha mɛ blɔ nya kaa a ba pee Mawu bimɛ.
      sbs: 0.7091
      gen_sec: 5.52
      ref_sec: 6.9
      cer: 0.069
      wer: 0.2083
    bible_00069:
      source: bible
      text: Amlɔ ɔ nɔuu ɔ, e bɔni nɔ́ hyɛmi, nɛ e nyɛɛ Yesu se, nɛ e ngɛ Mawu yi jee. Benɛ nimli kpekpemi
        ɔ na nɔ́ nɛ ba a, mɛ tsuo a je Mawu yi.
      sbs: 0.6995
      gen_sec: 11.92
      ref_sec: 11.84
      cer: 0.1413
      wer: 0.3235
    bible_00070:
      source: bible
      text: Se Paulo de asafoatsɛ ɔ, kɛ ta buli ɔmɛ ke, “Ke lɛ mi ní tsuli ɔmɛ je lɛ ɔ mi lɛɛ nyɛ be je
        mi tlɔe.”
      sbs: 0.6587
      gen_sec: 7.2
      ref_sec: 6.24
      cer: 0.0423
      wer: 0.1538
    bible_00071:
      source: bible
      text: Timoteo, hyɛ mo nitsɛ o he nɔ saminya; nɔ́ nɛ o ngɛ tsɔɔe ɔ hu hyɛ nɔ bɔ nɛ sa. Ejakaa ke
        o pee ja a, o ma he mo nitsɛ o yi wami, kɛ nihi nɛ buɔ mo tue ɔ hulɔ.
      sbs: 0.6596
      gen_sec: 11.84
      ref_sec: 13.28
      cer: 0.0991
      wer: 0.3571
    bible_00072:
      source: bible
      text: Wa mlaa a nya a, Mose fa ke, ‘Yo kaa kikɛ nɛ ɔ, a fia lɛ tɛ nɛ e gbo.’ Moo lɛɛ kɛ o ngɛ dee
        kɛɛ?”
      sbs: 0.6443
      gen_sec: 6.8
      ref_sec: 6.7
      cer: 0.0476
      wer: 0.0741
    bible_00073:
      source: bible
      text: E fɔɔ si paa kaa nɔ nɛ nɔ kuɔ lɛ gbaa nɔ nɛ ngɛ e sisi.
      sbs: 0.6806
      gen_sec: 4.32
      ref_sec: 4.4
      cer: 0.0769
      wer: 0.1875
    bible_00074:
      source: bible
      text: Yuda bi ɔmɛ nɛ ba Maria ngɔ ɔ, a ti nihi babauu na nɔ nɛ Yesu pee ɔ, nɛ a he lɛ ye.
      sbs: 0.7104
      gen_sec: 7.2
      ref_sec: 6.54
      cer: 0.0517
      wer: 0.1739
    bible_00075:
      source: bible
      text: Se ke wa he nile buɔ wɔ fɔ ɔ, wa le kaa Mawu kle pe wa he nile ɔ, nɛ e le nɔ́ tsuaa nɔ́ hulɔ.
      sbs: 0.7308
      gen_sec: 7.92
      ref_sec: 6.84
      cer: 0.0794
      wer: 0.3077
    bible_00076:
      source: bible
      text: Paulo hla kaa e kɛ Timoteo nɛ ya; lɔ ɔ he ɔ, e po lɛ. E pee ja ejakaa Yuda bi tsuo nɛ ngɛ
        lejɛ ɔ kpokpa a nɔ ɔ le kaa Timoteo tsɛ ɔ Hela no ji lɛ.
      sbs: 0.7042
      gen_sec: 14.32
      ref_sec: 10.06
      cer: 0.0577
      wer: 0.1026
    bible_00077:
      source: bible
      text: Kɛkɛ nɛ Yesu ba kɛ̃ abolo ɔ, nɛ e ngɔ ha mɛ. Nɛ e ha mɛ lo ɔ hulɔ.
      sbs: 0.6495
      gen_sec: 5.6
      ref_sec: 5.06
      cer: 0.0682
      wer: 0.1579
    bible_00078:
      source: bible
      text: Mlaa tsɔɔli ɔmɛ, kɛ Farisi bi ɔmɛ ngɔ yo ko nɛ ya ngɛ ajuama bɔe nɛ a nu lɛ kɛ ba, nɛ a kɛ
        lɛ ba da ma a tsuo hɛ mi.
      sbs: 0.6469
      gen_sec: 8.88
      ref_sec: 9.3
      cer: 0.0244
      wer: 0.1875
    bible_00079:
      source: bible
      text: Se kɛ̃ ɔ, i kpa nyɛ pɛɛ, nyɛ na tsui! Nyɛ ti nɔ ko nɔ ko be gboe. Lɛ ɔ kɛkɛ nɛ ma bɔ wɔ.
      sbs: 0.7237
      gen_sec: 6.8
      ref_sec: 6.84
      cer: 0.0862
      wer: 0.32
    bible_00080:
      source: bible
      text: Ma mi bi ɔmɛ a ti nihi babauu he Yesu ye, lɔ ɔ he ɔ, a bi ke, “Anɛ Mesia a nɛ maa ba a ma
        nyɛ to okadi pe nɔmlɔ nɛ ɔ lo?”
      sbs: 0.6329
      gen_sec: 10.16
      ref_sec: 9.7
      cer: 0.0244
      wer: 0.2059
    bible_00081:
      source: bible
      text: Yuda bi ɔmɛ bi Yesu ke, “Ke wa de ke Samaria no ji mo, nɛ mumi yayami ngɛ o mi ɔ, wa tɔ lo?”
