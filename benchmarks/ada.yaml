      gen_sec: 5.38
      ref_sec: 4.68
      cer: 0.06
      wer: 0.1579
    bible_00084:
      source: bible
      text: Lɔ ɔ he ɔ, moo tsɔ nihi kɛ ya Yopa, nɛ o ya kpee Simon nɛ a tsɛɛ lɛ Petro hulɔ ɔ kɛ ba.
      sbs: 0.6729
      gen_sec: 6.49
      ref_sec: 6.52
      cer: 0.0984
      wer: 0.1667
    bible_00085:
      source: bible
      text: Mawu ngɔɛ blema bi ɔmɛ a he ngɔ ki mɛ, se mohu e ngɔ nyu kpekpemi kɛ kpata yayami peeli ɔmɛ
        a hɛ mi. Noa nɛ fiɛ ke a ye dami sane ɔ, e kɛ ni kpaago kpa komɛ pɛ lɛ Mawu he a yi wami.
      sbs: 0.6983
      gen_sec: 13.82
      ref_sec: 12.98
      cer: 0.0682
      wer: 0.2391
    bible_00086:
      source: bible
      text: To kɛ na muɔ, kɛ na bi nɛ a sã a la zu ji níhi nɛ a kɛ fĩaa nihi nɛ ble a he ɔ a nɔ, nɛ a
