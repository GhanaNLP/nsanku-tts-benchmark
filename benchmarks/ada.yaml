      cer: 0.2063
      wer: 0.5385
    bible_00076:
      source: bible
      text: Paulo hla kaa e kɛ Timoteo nɛ ya; lɔ ɔ he ɔ, e po lɛ. E pee ja ejakaa Yuda bi tsuo nɛ ngɛ
