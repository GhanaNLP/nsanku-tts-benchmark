      ref_sec: 11.66
      cer: 0.1209
      wer: 0.3333
    bible_00087:
      source: bible
      text: Kaseli ɔmɛ de ke, “Nyɔmtsɛ, hyɛ! Klaate enyɔ ngɛ hiɛ ɔ!”
