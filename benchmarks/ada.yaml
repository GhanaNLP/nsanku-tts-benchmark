      ref_sec: 5.14
    '24':
      text: Yuda bi ɔmɛ nu kikɛmɛ a nyumu nɛ ɔ, nɛ jinɛ a
      sbs: 0.6507
      gen_sec: 1.98
      ref_sec: 3.26
    '35':
      text: A pee ja niinɛ, nɛ a ngɔ sika a kɛ mane asafo nikɔtɔma amɛ kɛ gu Barnaba kɛ Saulo a nine nɔ.
      sbs: 0.6351
      gen_sec: 4.74
      ref_sec: 7.7
    '36':
      text: Ejakaa ngmami ɔ deɔ ke, “Osɔfo ji mo kɛ yaa neneene kaa Melkizedek pɛ.”
      sbs: 0.6222
      gen_sec: 3.55
      ref_sec: 5.08
    '39':
      text: Se a ti ni komɛ pue nɔ kɛ ho nɛ a ya sɛɛ níhi nɛ Yesu pee ɔ ha Farisi bi ɔmɛ.
      sbs: 0.6508
      gen_sec: 3.57
      ref_sec: 5.2
    '40':
      text: Yuda bi komɛ nɛ yee Mawu gbeye ngɛ Yerusalem jamɛ a be ɔ mi. A je je ma amɛ tsuo a mi.
      sbs: 0.6102
      gen_sec: 4.18
      ref_sec: 5.68
    '44':
      text: Se Natanael bi Filipo ke, “Anɛ nɔ́ kpakpa ko maa je Nazaret lo?”
      sbs: 0.664
      gen_sec: 3.16
      ref_sec: 4.34
    '46':
      text: Pohu ngmami ɔ nɛ de ke e sa nɛ e te si kɛ je gbeje ɔ, a nui sisi kɛ mwɔɔ.
      sbs: 0.6142
      gen_sec: 3.28
      ref_sec: 4.96
    '49':
      text: Kikɛ nɛ ɔ nyɛ be yi! Nɛ nyɛ ngɔ Mumi Klɔuklɔu ɔ kɛ je sisi ɔ, jehanɛ lɛɛ nyɛɛ kɛ he lo maa
        gbe nya.
      sbs: 0.6221
      gen_sec: 4.71
      ref_sec: 5.86
    '52':
      text: Kikɛmɛ a okadi nɛ ɔ nɛ e to mɛ ɔ he nɛ ma kpekpemi ɔ ya kpee lɛ ɔ nɛ.
      sbs: 0.6771
      gen_sec: 3.53
      ref_sec: 4.66
    '60':
      text: Osɔfo nɔkɔtɔma pe kulaa a bi Stefano ke, “Anɛ munyu nɛ ɔmɛ ngɛ mi ja lo?”
      sbs: 0.6419
      gen_sec: 3.46
      ref_sec: 4.46
    '61':
      text: Nyɛɛ lɛɛ nyɛ tsɔ kɛ ya Yohane ngɔ, nɛ e ye anɔkuale ɔ he odase.
      sbs: 0.6892
      gen_sec: 3.22
      ref_sec: 4.0
    '63':
      text: Ejakaa Mumi ɔ bɛ a ti nɔ ko nɔ lolo; se a sɔle mɛ ngɛ Nyɔmtsɛ Yesu biɛ mi kɛkɛ.
      sbs: 0.627
      gen_sec: 3.62
      ref_sec: 4.76
    '65':
      text: Hejɔɔmi ligbi nɛ nyɛɛ se ɔ, ma a tsuo tu kɛ ba, nɛ a ba bu Nyɔmtsɛ ɔ munyu ɔ tue.
      sbs: 0.63
      gen_sec: 3.76
      ref_sec: 5.22
    '68':
      text: Se nihi tsuo nɛ he lɛ atuu, nɛ a he lɛ ye ɔ, e ha mɛ blɔ nya kaa a ba pee Mawu bimɛ.
      sbs: 0.6499
      gen_sec: 3.95
      ref_sec: 6.9
    '73':
      text: E fɔɔ si paa kaa nɔ nɛ nɔ kuɔ lɛ gbaa nɔ nɛ ngɛ e sisi.
      sbs: 0.6407
      gen_sec: 2.68
      ref_sec: 4.4
    '74':
      text: Yuda bi ɔmɛ nɛ ba Maria ngɔ ɔ, a ti nihi babauu na nɔ nɛ Yesu pee ɔ, nɛ a he lɛ ye.
      sbs: 0.6694
      gen_sec: 4.03
      ref_sec: 6.54
    '77':
      text: Kɛkɛ nɛ Yesu ba kɛ̃ abolo ɔ, nɛ e ngɔ ha mɛ. Nɛ e ha mɛ lo ɔ hulɔ.
      sbs: 0.6247
      gen_sec: 2.84
      ref_sec: 5.06
    '79':
      text: Se kɛ̃ ɔ, i kpa nyɛ pɛɛ, nyɛ na tsui! Nyɛ ti nɔ ko nɔ ko be gboe. Lɛ ɔ kɛkɛ nɛ ma bɔ wɔ.
      sbs: 0.6497
      gen_sec: 4.28
      ref_sec: 6.84
    '81':
      text: Yuda bi ɔmɛ bi Yesu ke, “Ke wa de ke Samaria no ji mo, nɛ mumi yayami ngɛ o mi ɔ, wa tɔ lo?”
      sbs: 0.6495
      gen_sec: 4.25
      ref_sec: 7.0
    '83':
      text: Kuasiahi! Mawu nɛ pee kpo nɔ je ɔ, pi lɛ nɔuu nɛ pee mi mi je ɔ hulɔ ɔ?
      sbs: 0.6922
      gen_sec: 3.0
      ref_sec: 4.68
    '84':
      text: Lɔ ɔ he ɔ, moo tsɔ nihi kɛ ya Yopa, nɛ o ya kpee Simon nɛ a tsɛɛ lɛ Petro hulɔ ɔ kɛ ba.
      sbs: 0.6016
      gen_sec: 3.81
      ref_sec: 6.52
    '87':
      text: Kaseli ɔmɛ de ke, “Nyɔmtsɛ, hyɛ! Klaate enyɔ ngɛ hiɛ ɔ!”
      sbs: 0.66
      gen_sec: 2.45
      ref_sec: 4.34
    '91':
      text: ejakaa lɛ nitsɛ e ye odase ke, “A bui gbalɔ ngɛ lɛ nitsɛ e ma mi.”
      sbs: 0.706
      gen_sec: 2.78
      ref_sec: 4.72
    '103':
      text: Ejakaa Nyɔmtsɛ ɔ buu dali a he, nɛ ke a fa kue ha lɛ ɔ, e nuɔ.
      sbs: 0.6382
      gen_sec: 2.18
      ref_sec: 4.9
    '105':
      text: Wami ngɛ Munyu ɔ mi, nɛ wami nɛ ɔ ngɔ la ba ha nimli adesahi.
      sbs: 0.6493
      gen_sec: 2.97
      ref_sec: 4.88
    '110':
      text: Kristo hé nyɛ kɛ jua wawɛ; nyɛ ko pee nyɛ he nimli a nyɔguɛhi.
      sbs: 0.6885
      gen_sec: 1.94
      ref_sec: 3.94
    '111':
      text: Yesu pee okadi kpahi fuu ngɛ e kaseli ɔmɛ a hɛ mi nɛ a ngmɛ́ ngɛ womi nɛ ɔ mi.
      sbs: 0.6571
      gen_sec: 3.65
      ref_sec: 5.6
    '114':
      text: Kɛkɛ nɛ Abosiami ngɔ lɛ kɛ ya hiɔwe, nɛ e kɛ je nɛ ɔ mi matsɛ yemi ɔmɛ tsuo tsɔɔ lɛ hɛngmɛfia.
      sbs: 0.6411
      gen_sec: 4.31
      ref_sec: 7.7
    '115':
      text: Ye nyɛmimɛ, i kpa nyɛ pɛɛ, nyɛɛ kase mi. Nyɛ le, sa a, i ngɛ kaa nyɛ. Nyɛ pee we mi yayami
        ko.
      sbs: 0.6152
      gen_sec: 4.17
      ref_sec: 8.08
    '128':
      text: Gabriel hɛɛ sɛ gbi kɛ ha yiheyo ko nɛ a bi e si ha Yosef, Matsɛ David nina a kake. Yiheyo
        ɔ biɛ ji Maria.
      sbs: 0.6227
      gen_sec: 5.28
      ref_sec: 7.84
    '133':
      text: Maria de ke, “Nyɔmtsɛ ɔ mawayo ji mi; bɔ nɛ o de ɔ, e ba mi ja.” Kɛkɛ nɛ bɔfo ɔ si lɛ.
      sbs: 0.6574
      gen_sec: 3.97
      ref_sec: 8.48
    '135':
      text: Kornelio he nɔ ke, “Mwɔnɛ ɔ ji ligbi eywiɛ, maa pee gbɔkuɛ ngmlɛ etɛ ɔ, i ngɛ sɔlee
      sbs: 0.6795
      gen_sec: 3.92
      ref_sec: 6.38
    '136':
      text: Nihi tsuo nɛ sɛ ye hlami kɛ ba a, juli, kɛ ojo fiali ji mɛ; nɛ to ɔmɛ bui mɛ tue.
      sbs: 0.6678
      gen_sec: 4.01
      ref_sec: 6.04
    '137':
      text: ejakaa nyɛ yi wami hemi ɔ nɛ e he nɛ nyɛ heɔ Mawu yeɔ ɔ, nyɛ nine maa su nɔ.
      sbs: 0.6589
      gen_sec: 3.5
      ref_sec: 4.98
    '139':
      text: “Nyɛɛ ba! Nyɛ ba hyɛ nyumu ko nɛ de mi níhi tsuo nɛ i pee hyɛ. Anɛ pi lɛ ji Kristo ɔ lo?”
      sbs: 0.6743
      gen_sec: 4.17
      ref_sec: 6.2
    '140':
      text: Melki bi ɔ, Adi bi ɔ, Kosam bi ɔ, Elmadam bi ɔ, Er bi ɔ,
      sbs: 0.6447
      gen_sec: 0.77
      ref_sec: 6.82
    '147':
      text: Lɔ ɔ he ɔ, Paulo ye jeha, kɛ nyɔhiɔ ekpa ngɛ lejɛ ɔ, nɛ e kɛ tsɔɔ ni ɔmɛ Mawu munyu ɔ.
      sbs: 0.6663
      gen_sec: 3.79
      ref_sec: 5.68
    '150':
      text: Yuda bi ɔmɛ a nɔkɔtɔma ko ngɛ nɛ a tsɛɛ lɛ Nikodemo. Farisi no ji lɛ.
      sbs: 0.6867
      gen_sec: 3.59
      ref_sec: 4.74
    '151':
      text: “I ngɛ nyɛ ní nɛ ɔmɛ dee, bɔ nɛ pee nɛ nyɛ ko ngmɛɛ nyɛ hemi kɛ yemi ɔ he.
      sbs: 0.6501
      gen_sec: 0.34
      ref_sec: 4.04
    '152':
      text: Benɛ Maria nu enɛ ɔ, e te si pam, nɛ e je kpo esɔ, nɛ e kɛ Yesu ya kpe.
      sbs: 0.6754
      gen_sec: 3.39
      ref_sec: 6.18
    '153':
      text: Niinɛ, kunya yemi nɛ ɔ nɛ haa ni ɔmɛ a nya kpɛɛ a he ɔ, Simon je sisi kɛ.
      sbs: 0.6253
      gen_sec: 3.52
      ref_sec: 4.18
    '155':
      text: Dloomi, mɔbɔ nami, kɛ he jɔmi nɛ je Tsɛ Mawu ɔ, kɛ Kristo Yesu, wa Nyɔmtsɛ ɔ dɛ mi ɔ ha mo!
      sbs: 0.6524
      gen_sec: 4.5
      ref_sec: 6.78
    '156':
      text: kɛ lɛ dami. A hlaa kaa a wo e nya tso kpɛ, konɛ e de nɔ́ ko nɛ sɛ́, nɛ a kɛ po e nya.
      sbs: 0.6737
      gen_sec: 4.17
      ref_sec: 8.02
    '158':
      text: A maa fia lɛ kpa, nɛ a maa gbe lɛ. Se ligbi etɛ se ɔ, e maa te si kɛ ba wami mi ekohu.”
      sbs: 0.6577
      gen_sec: 4.41
      ref_sec: 6.36
    '159':
      text: Nɔ nɛ tsɛ nyɛ ɔ, anɔkualetsɛ ji lɛ; nɛ e maa pee hulɔ.
      sbs: 0.6442
      gen_sec: 2.41
      ref_sec: 3.86
    '163':
      text: nɛ a te si ngɔ wo e nyɔmtsɛ ɔ kɛ nɔ nɛ a pɔ lɛ nu ɔ.’
      sbs: 0.646
      gen_sec: 2.45
      ref_sec: 5.08
    '164':
      text: Tsɔɔ yalɔyi ɔmɛ ní nɛ ɔmɛ, konɛ nɔ ko nɔ ko kó tu a he munyu yaya.
      sbs: 0.6624
      gen_sec: 3.33
      ref_sec: 3.8
    '165':
      text: A ha hwɔ, nɛ a sɔle kɛ hla nikɔtɔmahi, nɛ a tu mɛ ngɔ wo Nyɔmtsɛ ɔ nɛ a he ye ɔ dɛ mi.
      sbs: 0.6341
      gen_sec: 3.9
      ref_sec: 5.38
    '167':
      text: Ejakaa benɛ Abraham kɛ Melkizedek kpe ɔ, Levi ngɛ e nɛ̃ Abraham mi mi kɛ mwɔɔ.
      sbs: 0.6227
      gen_sec: 3.96
      ref_sec: 6.84
    '168':
      text: “Lɔ ɔ he ɔ, kɛ wai ngmɔtsɛ ɔ maa pee apaa yeli ɔmɛ kɛɛ?
      sbs: 0.6914
      gen_sec: 2.52
      ref_sec: 3.88
    '172':
      text: Se Yesu na a juɛmi ɔ momo. Lɔ ɔ he ɔ, e de mɛ ke,
      sbs: 0.6528
      gen_sec: 1.69
      ref_sec: 3.68
    '179':
      text: (Anɔkuale mi ɔ, Yesu nitsɛ sɔle we nɔ ko, se e kaseli ɔmɛ mohu lɛ a sɔle nihi.)
      sbs: 0.6691
      gen_sec: 3.36
      ref_sec: 6.12
    '181':
      text: “Imi ji wai tso nitsɛ ɔ, nɛ Tsaatsɛ ji ngmɔtsɛ.
      sbs: 0.7046
      gen_sec: 2.51
      ref_sec: 3.08
    '182':
      text: Enɛ ɔ se ɔ, Yuda bi ɔmɛ ngɛ nyami ligbi yee ngɛ Yerusalem, nɛ Yesu ya lejɛ ɔ.
      sbs: 0.6475
      gen_sec: 3.62
      ref_sec: 5.8
    '183':
      text: Mawu dloo Stefano saminya, nɛ e ha lɛ he wami nɛ e kɛ pee nyakpɛ ní nguanguahi ngɛ ma a mi.
      sbs: 0.6123
      gen_sec: 4.36
      ref_sec: 5.56
    '185':
      text: Jehanɛ, i nu gbi ko nɛ de mi ke, ‘Petro, tee si, gbee eko nɛ o ye!’
      sbs: 0.6625
      gen_sec: 2.82
      ref_sec: 4.54
    '188':
      text: Nimli kpekpemi ɔ a ti nɔ kake de Yesu ke, “Tsɔɔlɔ, de ye nyɛmi ɔ nɛ e kɛ mi nɛ dla gbosi ní
        ɔ.”
      sbs: 0.7377
      gen_sec: 3.55
      ref_sec: 6.88
    '189':
      text: Se mohu ɔ, nyɛ ha nɛ nyɛ je mi bami he nɛ tsɔ kaa bɔ nɛ nɔ nɛ tsɛ nyɛ ɔ ngɛ klɔuklɔu ɔ.
      sbs: 0.6418
      gen_sec: 3.79
      ref_sec: 5.2
    '191':
      text: Yesu he nɔ ke, “Nɔ nɛ i ngɛ pee nɛ ɔ, amlɔ nɛ ɔ, o nui sisi; se pee se ɔ, o ma ba le.”
      sbs: 0.6672
      gen_sec: 3.64
      ref_sec: 7.16
    '195':
      text: Wa biɔ nyɛ hɛ mi nyɛɛli ɔmɛ, kɛ ni klɔuklɔu ɔmɛ tsuo. Ni nɛmɛ nɛ je Italia a hu ke a biɔ nyɛ.
      sbs: 0.6647
      gen_sec: 4.44
      ref_sec: 5.98
    '199':
      text: Kɛ ba lɛ kɛɛ nɛ a ha mi he blɔ nguaa nɛ ɔ, kaa ye Nyɔmtsɛ ɔ nyɛ ma ba slaa mi?
      sbs: 0.6671
      gen_sec: 3.57
      ref_sec: 5.0
    '200':
      text: Kristo he odase nɛ nyɛ ngɛ yee ɔ ba he si wawɛɛ nɛ nihi na.
      sbs: 0.6356
      gen_sec: 2.6
      ref_sec: 3.0
    '203':
      text: Ke nyɛ pee nɔ́ nɛ i de nyɛ ke nyɛɛ pee ɔ, lɔ ɔ lɛɛ ye huɛmɛ ji nyɛ.
      sbs: 0.6732
      gen_sec: 2.49
      ref_sec: 4.1
    '205':
      text: Asafoatsɛ ɔ na Aleksandria lɛ ko ngɛ hiɛ ɔ nɛ yaa Italia, nɛ e je wɔ ngɔ wo mi.
      sbs: 0.6253
      gen_sec: 3.67
      ref_sec: 4.7
    '207':
      text: Abraham to e tsui si, nɛ e nine su nɔ́ nɛ Mawu ke e ma ha lɛ ɔ nɔ.
      sbs: 0.6606
      gen_sec: 2.31
      ref_sec: 4.3
    '209':
      text: Je ɔ sɛ́ nimli nɛ ɔmɛ! A wo lalaalo ngɛ nga kplanaa nɔ, kɛ yohi a nɔ. A hi tɛ puɔhi, kɛ muɔhi
        a mi.
      sbs: 0.642
      gen_sec: 4.46
      ref_sec: 7.68
    '211':
      text: Biɛ kpakpa nɛ a wo nyɛ ɔ, anɛ pi mɛ nɛ a gbeɔ he guɛ ɔ?
      sbs: 0.6996
      gen_sec: 2.58
      ref_sec: 4.78
    '215':
      text: Se Petro he nɔ ke, “Awetsɛ, pi a ti nɔ kake ji mi!”
      sbs: 0.6386
      gen_sec: 1.83
      ref_sec: 4.32
    '218':
      text: Kristo ngɛ loko a bɔ níhi tsuo, nɛ lɛ nɛ ha nɛ níhi tsuo ngɛ a hanɔ pɛpɛɛpɛ.
      sbs: 0.6406
      gen_sec: 4.02
      ref_sec: 4.14
    '221':
      text: Lɔ ɔ he ɔ, nyɛɛ kɛ kikɛmɛ a munyu nɛ ɔmɛ nɛ wo nyɛ sibi a bua.
      sbs: 0.6534
      gen_sec: 2.82
      ref_sec: 5.42
    '222':
      text: Lɔ ɔ he ɔ, ke wa ngɛ nya mi ngma, kɛ heha ní kɛkɛ ɔ, e hiɛ ha wɔ hluu.
      sbs: 0.6514
      gen_sec: 3.52
      ref_sec: 4.94
    '223':
      text: Tsɛ ɔ nitsɛ kojo we nɔ ko. E ngɔ jamɛ a he blɔ ɔ tsuo kɛ ha Bi ɔ, konɛ Bi ɔ nɛ kojo nihi.
      sbs: 0.6968
      gen_sec: 3.95
      ref_sec: 5.94
    '224':
      text: E ngɛ mi kaa wa ngɛ he lo mi mohu, se kɛ̃ ɔ, wa pee we he lo nya ní.
      sbs: 0.6451
      gen_sec: 2.99
      ref_sec: 3.86
    '225':
      text: Yihi enyɔ maa hi nɔ́ wɛɛe ngɛ he kake; a maa ngɔ nɔ kake kɛ je, nɛ a ma si nɔ kake ngɛ se.
      sbs: 0.6585
      gen_sec: 3.97
      ref_sec: 5.6
    '226':
      text: Ma mi he nɛ a je ɔ, a ngɛ he susue jinɛ a ko na he blɔ nɛ a kpale kɛ ho lejɛ ɔ ya.
      sbs: 0.6218
      gen_sec: 4.07
      ref_sec: 5.46
    '231':
      text: Benɛ e na Petro kɛ Yohane nɛ a yaa sɛ sɔlemi we ɔ, e ba mɛ ní.
      sbs: 0.6156
      gen_sec: 2.73
      ref_sec: 5.02
    '239':
      text: Petro hi Yopa be saii ngɛ lohwe he womi tsopa wolɔ ko nɛ a tsɛɛ lɛ Simon ngɔ.
      sbs: 0.6306
      gen_sec: 3.58
      ref_sec: 7.44
    '242':
      text: i ngɛ womi nɛ ɔ ngmae kɛ ha mo Timoteo, ye bi nitsɛnitsɛ ngɛ hemi kɛ yemi ɔ mi.
      sbs: 0.6577
      gen_sec: 3.54
      ref_sec: 4.36
    '245':
      text: Benɛ tsɔli ɔmɛ kpale kɛ ba a, osɔfo nikɔtɔma amɛ, kɛ Farisi bi ɔmɛ bi mɛ ke, “Mɛni he je nyɛɛ
        kɛ lɛ bɛ ɔ?”
      sbs: 0.623
      gen_sec: 4.84
      ref_sec: 8.06
    '250':
      text: Se a be bi; ejakaa Elizabet ɔ yosa ji lɛ, nɛ mɛ ni enyɔ ɔmɛ tsuo a bwɔ.
      sbs: 0.6308
      gen_sec: 3.23
      ref_sec: 5.78
    '251':
      text: Jamɛ a ligbi ɔ nɔuu ɔ, Pilato kɛ Herode nu huɛ; jinɛ sa a, a kɛ a he yi.
      sbs: 0.661
      gen_sec: 3.29
      ref_sec: 6.64
    '252':
      text: Petro si agbo ɔ, nɛ yiheyo ko nɛ a tsɛɛ lɛ Roda a tu fo kɛ ba.
      sbs: 0.6678
      gen_sec: 2.87
      ref_sec: 4.18
    '255':
      text: Nɔ ko nɔ ko nɛ kó hla kaa e hi ha lɛ nɔ kake too; nɔ tsuaa nɔ nɛ susu e nyɛmi hu he.
      sbs: 0.5817
      gen_sec: 0.44
      ref_sec: 7.7
    '256':
      text: Se Yesu he nɔ ke, “A gbaa ni nɛmɛ nɛ nuɔ Mawu munyu ɔ, nɛ a yeɔ nɔ ɔ mohu!”
      sbs: 0.6544
      gen_sec: 3.24
      ref_sec: 5.42
    '262':
      text: Nyɛ he nyɛ sibi atuu ngɛ nyɛ wehi a mi, nɛ nyɛ ko de ke nɔ́ nɛ ɔ peemi wa tsɔ.
      sbs: 0.6517
      gen_sec: 3.96
      ref_sec: 4.14
    '265':
      text: Anɛ nyɛ kaii we kaa benɛ i kɛ nyɛ ngɛ ɔ, i de nyɛ kikɛmɛ a ní nɛ ɔmɛ tsuo lo?
      sbs: 0.6413
      gen_sec: 3.67
      ref_sec: 4.8
    '268':
      text: Benɛ e nu nihi babauu a he nɛ a bee ɔ, e bi ke, “Mɛni ba?”
      sbs: 0.6723
      gen_sec: 2.65
      ref_sec: 4.28
    '270':
      text: Se a maa bu akɔtaa ha Mawu, nɔ nɛ dla e he ngɔ to nɛ e maa kojo hɛ kali, kɛ ni gbogboehi tsuo
        ɔ.
      sbs: 0.6603
      gen_sec: 4.51
      ref_sec: 7.3
    '274':
      text: Nɛ nyu nɔuu, nyu kpekpemi ɔ a kɛ kpata jamɛ a be ɔ mi je ɔ hɛ mi.
      sbs: 0.6545
      gen_sec: 2.69
      ref_sec: 4.56
    '282':
      text: Ma kpekpemi nɛ ɔ, a gbiɛ mɛ pɛ, ejakaa a li Mose mlaa a.”
      sbs: 0.6745
      gen_sec: 2.92
      ref_sec: 9.94
    '284':
      text: A tsɛɛ tsu mi pomi bo enyɔne ɔ se bo tsu ɔ he klɔuklɔu pe kulaa.
      sbs: 0.6351
      gen_sec: 3.08
      ref_sec: 4.3
    '285':
      text: A bi kɛ ngmlaa ke, “Nubwɔ ko ngɛ we nɛ ɔ mi nɛ a tsɛɛ lɛ Simon Petro lo?”
      sbs: 0.6689
      gen_sec: 3.56
      ref_sec: 4.46
    '288':
      text: Niinɛ, nɔ tsuaa nɔ nɛ hlaa kaa e pee e he Mawu jalɔ nɛ le Kristo Yesu ɔ, a maa wa lɛ yi mi.
      sbs: 0.6582
      gen_sec: 4.53
      ref_sec: 5.48
    '289':
      text: Se benɛ nyumu ɔ nu enɛ ɔ, nu lɛ, ejakaa e ngɛ ní babauu.
      sbs: 0.6424
      gen_sec: 2.23
      ref_sec: 4.54
    '297':
      text: Mɛ ji Simon, nɔ nɛ e wo lɛ biɛ ke Petro hulɔ ɔ, kɛ e nyɛmi Andrea, Yakobo kɛ Yohane, Filipo
        kɛ Bartolomeo,
      sbs: 0.6374
      gen_sec: 5.51
      ref_sec: 9.82
    '298':
      text: Nyɛ ko suɔ je ɔ, loo níhi nɛ ngɛ je ɔ mi ɔ. Ke nɔ ko suɔ je ɔ, lɛɛ e sume Tsɛ ɔ.
      sbs: 0.6656
      gen_sec: 3.32
      ref_sec: 6.32
    '305':
      text: Kɛkɛ nɛ a bɔni a he bimi ke a kpɛti mɛnɔ po maa pee nɔ́ nɛ ɔ.
      sbs: 0.6564
      gen_sec: 0.85
      ref_sec: 8.46
    '307':
      text: “Ma ha nɛ ní leli a nile ma puɛ, nɛ ga leli a ga tsuo maa pee yaka.”
      sbs: 0.6522
      gen_sec: 3.31
      ref_sec: 4.12
    '310':
      text: Lɔ ɔ he ɔ, Yesu kpale de ekohu ke, “I ngɛ nyɛ dee anɔkuale mi ke imi ji to tsu ɔ nya agbo
        ɔ nɛ.
      sbs: 0.6507
      gen_sec: 4.26
      ref_sec: 6.9
    '311':
      text: Festo he nɔ ke, “Hwɔɔ ɔ, ma ha nɛ o ba bu lɛ tue.”
      sbs: 0.7386
      gen_sec: 1.16
      ref_sec: 4.02
    '317':
      text: E nɔ jena a, waa kɛ Paulo ya Yakobo ngɔ. Wa ya na asafo nikɔtɔma amɛ ngɛ lejɛ ɔ.
      sbs: 0.6383
      gen_sec: 4.02
      ref_sec: 5.04
    '319':
      text: Yesu he nɔ ke, “Nɔ́ nɛ adesa nyɛ we peemi ɔ, Mawu lɛɛ e nyɛɔ peeɔ.”
      sbs: 0.654
      gen_sec: 2.71
      ref_sec: 4.92
    '322':
      text: Wɔɔ lɛɛ bɔ nɛ Kristo susuu e yi mi ɔ, jã wɔ hu wa susuu wa yi mi.
      sbs: 0.5811
      gen_sec: 3.13
      ref_sec: 3.8
    '324':
      text: Se nyɛ mohu nyɛ ngɛ nyɛ sibi yayami pee, nɛ nyɛ ngɛ nyɛ sibi sisie, nyɛ nitsɛmɛ nyɛ nyɛmimɛ
        tete po.
      sbs: 0.6303
      gen_sec: 4.95
      ref_sec: 5.84
    '325':
      text: Nyumu ɔ he nɔ ke, “Nyɔmtsɛ, i heɔ yeɔ.” Kɛkɛ nɛ e kpla si ngɛ Yesu hɛ mi.
      sbs: 0.6506
      gen_sec: 3.75
      ref_sec: 6.42
    '327':
      text: Anɔkuale sane ji kaa ke nɔ ko suɔ kaa e maa hyɛ Mawu asafo nɔ ɔ, e na ní tsumi kpakpa.
      sbs: 0.6814
      gen_sec: 1.51
      ref_sec: 5.74
    '335':
      text: ‘E we ɔ nɛ pee we doku,
      sbs: 0.7086
      gen_sec: 1.39
      ref_sec: 3.02
    '336':
      text: Enosh bi ɔ, Set bi ɔ, Adam bi ɔ, Mawu bi ɔ.
      sbs: 0.678
      gen_sec: 0.93
      ref_sec: 7.26
    '338':
      text: Kaseli ɔmɛ ha hwɔ, nɛ a sɔle, nɛ a kɛ a nine pue Barnaba kɛ Saulo a nɔ, nɛ a wo mɛ blɔ.
      sbs: 0.6479
      gen_sec: 3.89
      ref_sec: 5.76
    '340':
      text: Tlukaa a, wo nɔ kɔɔhiɔ ko hia ba kpee mɛ. A tsɛɛ kɔɔhiɔ nɛ ɔ ke, “Omleyi kɛ beleku kɔɔhiɔ.”
      sbs: 0.6949
      gen_sec: 3.46
      ref_sec: 6.46
    '342':
      text: Se ngɛ Nyɔmtsɛ ɔ hɛ mi ɔ, yo be e dɛ he, nɛ nyumu hu be e dɛ he.
      sbs: 0.6377
      gen_sec: 2.93
      ref_sec: 4.08
    '344':
      text: Enɛ ɔ he je ɔ, nyɛ ba pee nɔ hyɛmi nɔ́ ha nihi nɛ he ye ngɛ Makedonia kɛ Akaya tsuo.
      sbs: 0.6379
      gen_sec: 3.99
      ref_sec: 5.56
    '345':
      text: Se ke wɔ nitsɛmɛ wa maa kojo wa he anɔkuale mi kekle ɔ, Mawu be wa tue gblae.
      sbs: 0.6542
      gen_sec: 4.07
      ref_sec: 4.4
    '346':
      text: Nu hu o wui ye yi mi, se lɛɛ e ngɔ nu kɛ e he via kɛ kpa ye nane he.
      sbs: 0.6646
      gen_sec: 3.37
      ref_sec: 4.3
    '352':
      text: Benɛ Yesu ba su Betania a, e na kaa Lazaro ye ligbi eywiɛ momo ngɛ yɔkɔ ɔ mi.
      sbs: 0.6531
      gen_sec: 3.95
      ref_sec: 5.46
    '353':
      text: Makɛ benɛ je mi ngɛ tsɔe ɔ, Yesu ba da si ngɛ wo ɔ nya, se kaseli ɔmɛ yo we lɛ.
      sbs: 0.6274
      gen_sec: 3.97
      ref_sec: 6.3
    '355':
      text: Kɛkɛ nɛ matsɛ ɔ wo e he nɔ, nɛ amlaalo ɔ, kɛ Bernike, kɛ ni kpa amɛ hu te si ja nɔuu.
      sbs: 0.6388
      gen_sec: 3.93
      ref_sec: 5.5
    '360':
      text: Yuda, nɔ nɛ ya tsɔɔ Yesu se blɔ ɔ le lejɛ ɔ, ejakaa Yesu kɛ mɛ pɔɔ kpemi ngɛ lejɛ ɔ.
      sbs: 0.6344
      gen_sec: 4.3
      ref_sec: 5.84
    '361':
      text: Akɛnɛ Hejɔɔmi ligbi nɛ Yesu pɔtɔ zu ɔ nɛ e kɛ tsa nyumu hɛ yuyuilɔ ɔ,
      sbs: 0.632
      gen_sec: 2.9
      ref_sec: 4.88
    '365':
      text: Ye nyɛmimɛ, wa Nyɔmtsɛ Yesu Kristo dloomi ɔ kɛ nyɛ tsuo nɛ hi si. Amen.
      sbs: 0.6238
      gen_sec: 3.15
      ref_sec: 9.9
    '366':
      text: Mɛ tsuo a ye, nɛ a tɔ, nɛ kaseli ɔmɛ bua bibliwi nɛ piɛ ɔ nya ngɔ wo kusii nyɔngma kɛ enyɔ
        mi.
      sbs: 0.6356
      gen_sec: 4.54
      ref_sec: 7.1
    '369':
      text: “Nyɔmtsɛ, jehanɛ lɛɛ o ye o siwo ɔ nɔ;
      sbs: 0.6701
      gen_sec: 1.65
      ref_sec: 3.38
    '373':
      text: Apaa yelɔ ɔ tuɔ fo, ejakaa apaa yelɔ kɛkɛ ji lɛ, nɛ to ɔmɛ a he nɔ dɔɛ lɛ.
      sbs: 0.6937
      gen_sec: 3.67
      ref_sec: 5.26
    '375':
      text: “Niinɛ, i ngɛ nyɛ dee ke, yi nɔ bi nɛ ɔmɛ tsuo be gboe ta nɛ ní nɛ ɔmɛ maa ba mi.
      sbs: 0.6664
      gen_sec: 3.9
      ref_sec: 6.04
    '377':
      text: Ni ɔmɛ kpa ngmlaa ke, “Mawu ko gbi ji nɛ ɔ nɛ; enɛ ɔ lɛɛ pi nɔmlɔ gbi!”
      sbs: 0.615
      gen_sec: 0.75
      ref_sec: 4.56
    '380':
      text: Nyɛ ha waa kɛ hɛdɔ nɛ susu he bɔ nɛ sa, nɛ waa suɔ wa sibi, nɛ waa pee wa sibi kpakpa.
      sbs: 0.6477
      gen_sec: 4.17
      ref_sec: 5.38
    '382':
      text: Se nyɛmimɛ, nyɛɛ lɛɛ pi diblii mi nɛ nyɛ ngɛ nɛ ligbi ɔ ma ba ti nyɛ si kaa julɔ.
      sbs: 0.6185
      gen_sec: 3.74
      ref_sec: 4.82
    '384':
      text: Munyu nɛ i kɛ nyɛ tu ɔ, nyɛ nɛ nya, ejakaa nyɛ bui ye munyu ɔ.
      sbs: 0.6751
      gen_sec: 2.69
      ref_sec: 3.76
    '386':
      text: Amlɔ nɛ ɔ lɛɛ i yaa nɔ nɛ tsɔ mi ɔ ngɔ, se nyɛ ti nɔ ko bi we mi he nɛ i yaa.
      sbs: 0.6662
      gen_sec: 3.46
      ref_sec: 4.26
    '387':
      text: Nyɛɛ na nɔ tsuaa nɔ mɔbɔ kaa bɔ nɛ nyɛ Tsɛ Mawu naa nɔ tsuaa nɔ mɔbɔ ɔ.
      sbs: 0.6712
      gen_sec: 2.9
      ref_sec: 4.46
    '395':
      text: Se Yesu lɛɛ e le mɛ tsuo pɛpɛɛpɛ, lɔ ɔ he ɔ, e kɛ e hɛ fɔɛ a nɔ.
      sbs: 0.6398
      gen_sec: 3.11
      ref_sec: 5.28
    '396':
      text: Imi lɛɛ i le lɛ, ejakaa e ngɔ nɛ i je, nɛ lɛ ji nɔ nɛ tsɔ mi.”
      sbs: 0.6748
      gen_sec: 2.74
      ref_sec: 4.56
    '398':
      text: Lɔ ɔ he ɔ, kaseli ɔmɛ bi a he ke, “Anɛ nɔ ko ba ha lɛ nɔ́ ko nɛ e ye lo?”
      sbs: 0.682
      gen_sec: 3.33
      ref_sec: 5.16
    '400':
      text: Se Yesu de mɛ ke, “Nyɛ nitsɛmɛ nyɛ ha mɛ nɔ́ ko nɛ a ye.”
      sbs: 0.6449
      gen_sec: 2.35
      ref_sec: 3.64
    '401':
      text: “Tsɛ ɔ suɔ mi, ejakaa i suɔ kaa ma ngɔ ye wami kɛ fɔ si, konɛ ma kpale ngɔ.
      sbs: 0.6516
      gen_sec: 3.9
      ref_sec: 5.2
    '403':
      text: Kornelio hyɛ lɛ too; gbeye nu lɛ, nɛ e bi ke, “Nyɔmtsɛ, mɛni sane?”
      sbs: 0.6222
      gen_sec: 3.28
      ref_sec: 5.9
    '406':
      text: Be bɔɔ se ɔ, nyumu ko hu yo Petro, nɛ e de ke, “Mo hu a ti nɔ kake ji mo!”
      sbs: 0.6754
      gen_sec: 2.99
      ref_sec: 6.26
    '407':
      text: Jehanɛ, Petro kɛ Yohane ngɔ a nine pue ni ɔmɛ a nɔ, nɛ a na Mumi Klɔuklɔu ɔ.
      sbs: 0.6536
      gen_sec: 3.66
      ref_sec: 4.52
    '409':
      text: Mumi yayamihi hu je nihi fuu a mi, nɛ a kpa ngmlaa ke, “Mo ji Mawu Bi ɔ nɛ!”
      sbs: 0.6531
      gen_sec: 3.65
      ref_sec: 5.94
    '410':
      text: Nɔ́ nɛ i ngɛ nyɛ ngmae nɛ ɔ, Mawu ji ye we odase kaa i yi lakpa.
      sbs: 0.6503
      gen_sec: 2.99
      ref_sec: 3.32
    '414':
      text: Lɔ ɔ he ɔ, e fɔɔ si paa kaa he jɔɔmi be ko ngɛ ha Mawu ma a nɛ a maa ye.
      sbs: 0.6347
      gen_sec: 3.24
      ref_sec: 6.26
    '415':
      text: Gbi ko de lɛ ke, “Petro, tee si; gbee eko nɛ o ye!”
      sbs: 0.6206
      gen_sec: 2.56
      ref_sec: 4.28
    '418':
      text: Ejakaa i jaje Mawu yi mi tomi ɔ tsuo pɛpɛɛpɛ ngɔ tsɔɔ nyɛ nɛ i laa we nyɛ ba.
      sbs: 0.6532
      gen_sec: 3.6
      ref_sec: 3.38
    '425':
      text: Se kɛ ba si be nɛ ɔ tsuo Kristo asafo ɔmɛ nɛ ngɛ Yudea a li mi hɛ mi kɛ hɛ mi.
      sbs: 0.605
      gen_sec: 3.39
      ref_sec: 4.14
    '429':
      text: Se nɔ́ nɛ pe lɛ tsuo ji kaa e nu Yohane ngɔ wo tsu mi.
      sbs: 0.6854
      gen_sec: 2.47
      ref_sec: 3.36
    '430':
      text: A de enɛ ɔ, konɛ Yesu munyu nɛ e tu kɛ tsɔɔ gbenɔ nɛ e ma gbo ɔ nɛ ba mi.
      sbs: 0.648
      gen_sec: 3.44
      ref_sec: 4.92
    '433':
      text: Nɔ tsuaa nɔ nɛ jajeɔ paa kaa Yesu ɔ, Mawu Bi ji lɛ ɔ, Mawu hii e mi, nɛ lɛ hu e hii Mawu mi.
      sbs: 0.6741
      gen_sec: 3.83
      ref_sec: 6.7
    '434':
      text: A ma de ke, ‘Nyumu nɛ ɔ je mɔ mami sisi, se e nyɛ we nɛ e gbe nya.’
      sbs: 0.6591
      gen_sec: 3.09
      ref_sec: 4.82
    '438':
      text: Kɛkɛ nɛ nyumu ɔ nitsɛ de mɛ ke, “Imi ji lɛ.”
      sbs: 0.6193
      gen_sec: 2.02
      ref_sec: 4.0
    '440':
      text: Benɛ e de enɛ ɔ, mɛ tsuo a muɔ lɛ, ejakaa mɛɛ a le kaa jokuɛ ɔ gbo.
      sbs: 0.6198
      gen_sec: 2.77
      ref_sec: 5.16
    '441':
      text: Se kekleekle ɔ, ja e na amanehlu babauu, nɛ kikɛmɛ a yi nɔ bi nɛ ɔmɛ kua lɛ.
      sbs: 0.6782
      gen_sec: 3.91
      ref_sec: 5.58
    '443':
      text: nɛ i sɛ kaa a tsɛɔ mi o bi hu; ngɔɔ mi kɛ pee o we apaatsɛmɛ ɔmɛ a ti nɔ kake.’
      sbs: 0.6752
      gen_sec: 3.63
      ref_sec: 4.7
    '444':
      text: A ngɛ ngmlaa kpae ke, “Yesu lee! Tsɔɔlɔ lee! Naa wɔ mɔbɔ oo, naa wɔ mɔbɔ!”
      sbs: 0.6316
      gen_sec: 3.6
      ref_sec: 6.36
    '445':
      text: Nyɛ kai bɔ nɛ nyɛ hi si sa a. Benɛ nyɛ ba le Mawu ɔ, nyɛɛ kɛ hɛ mi miami na amanehlu babauu.
      sbs: 0.6481
      gen_sec: 4.27
      ref_sec: 6.28
    '446':
      text: I ngɛ mo ní nɛ ɔmɛ ngmae, se e be kɛe nɛ ma ba o ngɔ.
      sbs: 0.6431
      gen_sec: 2.46
      ref_sec: 3.28
    '451':
      text: Lɔ ɔ he ɔ, nɔ ko be nyɛe ma de ke a sɔle nyɛ kɛ wo ye biɛ mi.
      sbs: 0.6672
      gen_sec: 2.57
      ref_sec: 3.4
    '454':
      text: Se niinɛ, ní nami agbo ji Mawu jami, ke nɔ ko bua jɔ e níhi a he ɔ.
      sbs: 0.6543
      gen_sec: 2.48
      ref_sec: 4.54
    '455':
      text: Yesu de lɛ ke, “O na lɛ momo. Lɛ ji nɔmlɔ nɛ kɛ mo ngɛ munyu tue ɔ nɛ.”
      sbs: 0.5694
      gen_sec: 0.42
      ref_sec: 5.04
    '459':
      text: Se Yesu he nɔ ke, “Koo doo e nya; e pee nɔ nɛ ɔ ngɔ to ye pumi be.
      sbs: 0.6325
      gen_sec: 2.86
      ref_sec: 5.48
    '461':
      text: Jehanɛ hu, sanehi nɛ a kɛ fɔ ye nɔ nɛ ɔ, a be nya nyɛe maa tsɔɔ kaa a ngɛ mi.
      sbs: 0.6617
      gen_sec: 3.57
      ref_sec: 5.06
    '463':
      text: Lɔ ɔ se ɔ, e kɛ mɛ je kpo, nɛ e bi ke, “Tsaatsɛmɛ, kɛ ma pee kɛɛ nɛ́ a he ye yi wami?”
      sbs: 0.6627
      gen_sec: 3.75
      ref_sec: 6.24
    '465':
      text: Sa a, be nɛ nyɛ nitsɛmɛ hu nyɛ ba nyɛ je mi ja a, kikɛmɛ a akɔnɔ nɛ ɔmɛ nɔuu a se nyɛ ya nyɛɛ.
      sbs: 0.6481
      gen_sec: 4.43
      ref_sec: 5.58
    '467':
      text: Ke a fɔ lɛ ɔ, o ma nya, nɛ o ma na bua jɔmi, nɛ nihi babauu ma nya ja nɔuu.
      sbs: 0.5903
      gen_sec: 3.71
      ref_sec: 7.26
    '473':
      text: Nyɛ ko bu lɛ he nyɛlɔ, se mohu nyɛɛ tu munyu ngɔ tsɔɔ lɛ kaa nyɛmi.
      sbs: 0.6472
      gen_sec: 3.3
      ref_sec: 3.3
    '474':
      text: Nɛ akɔnɔ ɔ, ke e ngɔ hɔ ɔ, e fɔɔ yayami, nɛ yayami hu ke e wa a, e fɔɔ gbenɔ.
      sbs: 0.6431
      gen_sec: 3.84
      ref_sec: 6.58
    '478':
      text: Wa ko fiɛ yakayaka fiɛmi kaa bɔ nɛ a ti ni komɛ pee, nɛ nimli akpe nyingmi enyɔ kɛ etɛ gbo
        ligbi kake ɔ.
      sbs: 0.6655
      gen_sec: 5.38
      ref_sec: 5.92
    '480':
      text: Yesu he nɔ ke, “He nɛ nɔ́ gbogboe fɔɔ si ngɛ ɔ, lejɛ ɔ okpokuhi ma bua a he nya ngɛ.”
      sbs: 0.6376
      gen_sec: 3.73
      ref_sec: 8.12
    '481':
      text: Yesu kaseli ɔmɛ ya tsɛ̃ɛ̃ lɛ, nɛ a de ke, “Nyɔmtsɛ, Nyɔmtsɛ! Wa gbo oo!”
      sbs: 0.6075
      gen_sec: 3.14
      ref_sec: 5.74
    '484':
      text: Mlaa nɛ Kristo wo wɔ ji nɔ tsuaa nɔ nɛ suɔ Mawu ɔ, e sa kaa e suɔ e nyɛmi hulɔ.
      sbs: 0.6502
      gen_sec: 3.97
      ref_sec: 6.9
    '485':
      text: Kuasia! Ke o du ní ɔ, ja wu ɔ gbo ngɛ zu mi loko e maa puɛ.
      sbs: 0.6608
      gen_sec: 0.87
      ref_sec: 4.68
    '486':
      text: Se benɛ i ná le kaa a so e yi nɔ nɛ a maa gbe lɛ ɔ,
      sbs: 0.4733
      gen_sec: 2.84
      ref_sec: 3.22
    '487':
      text: E tsɔ nihi kɛ sɛ e hlami kɛ ya Samaria kɔpe ko mi, konɛ a ya dla he ko ngɔ to lɛ.
      sbs: 0.6486
      gen_sec: 3.94
      ref_sec: 4.98
    '488':
      text: Yesaya de enɛ ɔ, ejakaa e na Yesu hɛ mi nyami ɔ ngɛ e hɛ mi lokoo, nɛ e tu he munyu.
      sbs: 0.6255
      gen_sec: 3.82
      ref_sec: 6.88
    '489':
      text: Mɛnɔ ma nyɛ maa ye je ɔ nɔ kunimi? Ja nɔ nɛ heɔ yeɔ kaa Yesu ɔ, Mawu Bi ji lɛ.
      sbs: 0.6731
      gen_sec: 3.81
      ref_sec: 5.32
    '491':
      text: Yuda bi ɔmɛ bi lɛ ke, “Mo nɛ o na we jeha nyingmi enuɔ po ɔ, o na Abraham lo?”
      sbs: 0.6343
      gen_sec: 3.33
      ref_sec: 5.8
    '492':
      text: Yuda ma nimeli ɔmɛ hla lɛ ngɛ lejɛ ɔ; nɛ a bi si ke, “Jije e ngɛ?”
      sbs: 0.6363
      gen_sec: 2.97
      ref_sec: 4.96
    '495':
      text: Yuda kɛ Tamar fɔ Perez, kɛ Zera; nɛ Perez fɔ Hezron, nɛ Hezron fɔ Ram.
      sbs: 0.6413
      gen_sec: 2.17
      ref_sec: 6.38
    '497':
      text: Benɛ Yohane kaseli ɔmɛ ya sɛɛ ní nɛ ɔmɛ tsuo ha lɛ ɔ, e tsɛ a ti ni enyɔ,
      sbs: 0.6859
      gen_sec: 3.07
      ref_sec: 4.56
    '498':
      text: Kɛkɛ nɛ Samaria yo ko ba nyu yɛmi. Yesu de lɛ ke, “Ha mi nyu ɔ eko nɛ ma nu.”
      sbs: 0.6924
      gen_sec: 3.07
      ref_sec: 5.82
    '499':
      text: Ejakaa Mawu Bi ɔ, Hejɔɔmi ligbi ɔ tete nyɔmtsɛ ji lɛ.”
      sbs: 0.6898
      gen_sec: 2.47
      ref_sec: 3.2
    '506':
      text: Benɛ ma a tsuo ngɛ Yesu tue bue ɔ, e de e kaseli ɔmɛ ke,
