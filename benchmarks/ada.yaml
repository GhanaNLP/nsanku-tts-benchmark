      gen_sec: 4.0
      ref_sec: 4.72
      cer: 0.0213
      wer: 0.125
    bible_00092:
      source: bible
      text: Wa nɛ̃ Yakob nɛ ha wɔ kikɛmɛ a vu nɛ ɔ; nɛ lɛ nitsɛ, kɛ e bimɛ, kɛ e lohwehi tsuo nu e mi
        nyu. Anɛ o ngɛ hlae nɛ o tsɔɔ kaa moo o pe Yakob ɔ lo?”
      sbs: 0.7243
      gen_sec: 11.6
      ref_sec: 10.08
      cer: 0.11
      wer: 0.3846
    bible_00093:
      source: bible
      text: Yesu he nɔ ke, “Tse i de nyɛ momo nɛ nyɛ he we yi! Tsaatsɛ he wami nya nɛ i tsuɔ ní nɛ ɔmɛ,
        nɛ níhi nɛ i tsuɔ ɔ yeɔ ye he odase.
      sbs: 0.6896
      gen_sec: 10.56
      ref_sec: 8.66
      cer: 0.0889
      wer: 0.1471
    bible_00094:
      source: bible
      text: Benɛ a kpale ya lejɛ ɔ si enyɔne ɔ, Yosef je e he si ngɔ ha e nyɛmimɛ ɔmɛ, nɛ Egipt matsɛ
        ɔ hu ba le Yosef weku ɔ.
      sbs: 0.6513
      gen_sec: 8.16
      ref_sec: 7.68
      cer: 0.0241
      wer: 0.1034
    bible_00095:
      source: bible
      text: kɛ ya su ligbi nɛ a ngɔ lɛ kɛ ho hiɔwe ya. Loko a ngɔ lɛ kɛ ho hiɔwe ya a, e gu Mumi Klɔuklɔu
        ɔ nɔ nɛ e tsɔɔ bɔfohi nɛ e hla a mlaa nɛ a ye nɔ.
