      gen_sec: 9.73
      ref_sec: 11.66
      cer: 0.0879
      wer: 0.1429
    bible_00087:
      source: bible
      text: Kaseli ɔmɛ de ke, “Nyɔmtsɛ, hyɛ! Klaate enyɔ ngɛ hiɛ ɔ!”
