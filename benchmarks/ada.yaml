      sbs: 0.6635
      gen_sec: 4.51
      ref_sec: 3.38
    '425':
      text: Se kɛ ba si be nɛ ɔ tsuo Kristo asafo ɔmɛ nɛ ngɛ Yudea a li mi hɛ mi kɛ hɛ mi.
      sbs: 0.6755
      gen_sec: 4.41
      ref_sec: 4.14
    '429':
      text: Se nɔ́ nɛ pe lɛ tsuo ji kaa e nu Yohane ngɔ wo tsu mi.
      sbs: 0.6754
      gen_sec: 3.02
      ref_sec: 3.36
    '430':
      text: A de enɛ ɔ, konɛ Yesu munyu nɛ e tu kɛ tsɔɔ gbenɔ nɛ e ma gbo ɔ nɛ ba mi.
      sbs: 0.6903
      gen_sec: 4.13
      ref_sec: 4.92
    '433':
      text: Nɔ tsuaa nɔ nɛ jajeɔ paa kaa Yesu ɔ, Mawu Bi ji lɛ ɔ, Mawu hii e mi, nɛ lɛ hu e hii Mawu mi.
      sbs: 0.6986
      gen_sec: 5.34
      ref_sec: 6.7
    '434':
      text: A ma de ke, ‘Nyumu nɛ ɔ je mɔ mami sisi, se e nyɛ we nɛ e gbe nya.’
