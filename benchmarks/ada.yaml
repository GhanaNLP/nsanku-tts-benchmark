      ref_sec: 6.52
      cer: 0.1475
      wer: 0.375
    bible_00085:
      source: bible
      text: Mawu ngɔɛ blema bi ɔmɛ a he ngɔ ki mɛ, se mohu e ngɔ nyu kpekpemi kɛ kpata yayami peeli ɔmɛ
