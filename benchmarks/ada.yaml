      gen_sec: 10.96
      ref_sec: 10.66
      cer: 0.1064
      wer: 0.3548
    bible_00067:
      source: bible
      text: Nɔ tsuaa nɔ nɛ hyɛ lɛ nitsɛ e ní peepee. Ke e hi ɔ, e ma nyɛ maa fĩa ngɔ fɔ nɔ, nɛ e be hiae
