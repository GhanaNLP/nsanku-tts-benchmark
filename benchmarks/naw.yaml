      sbs: 0.7993
      gen_sec: 7.71
      ref_sec: 7.6
      cer: 0.0
      wer: 0.0
    bible_00148:
      source: bible
      text: Mɛ‐daa ana yɛ mi‐supu ana, fan man tɔwɛ alibi akʋ lɩɩ fanɛ bɩrɩsa ana sʋ.
