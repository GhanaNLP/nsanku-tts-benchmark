      gen_sec: 3.3
      ref_sec: 3.1
      cer: 0.093
      wer: 0.25
    bible_00156:
      source: bible
      text: Ɩ bʋlʋn sa fʋ fɛɛ fʋ maa kɔɔ yɛ mi kebiti’.
