      ref_sec: 6.96
      cer: 0.0
      wer: 0.0
    bible_00145:
      source: bible
      text: Lɩɩ fɛɛ bamʋ gbaa‐gbaa bamʋ bɛɛ tɔwɛ kɩfɔ kɩtaa mʋ nɩɩ fan kɩtaa anɛ.
