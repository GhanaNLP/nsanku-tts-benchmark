      sbs: 0.7733
      gen_sec: 14.34
      ref_sec: 14.42
      cer: 0.0127
      wer: 0.0488
    bible_00121:
      source: bible
      text: Kadɛ lala nɩmʋ tɔ nɩɩ kasɛ sʋ awura bee dii bɛɛ kpɩlɩgɛ, fɛɛ kanan mʋ nɩɩ anyɩn bee dii bɛɛ
