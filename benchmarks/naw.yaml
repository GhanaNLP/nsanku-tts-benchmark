      gen_sec: 3.98
      ref_sec: 3.5
      cer: 0.0426
      wer: 0.0625
    bible_00136:
      source: bible
      text: Fan yɛgɛ a bɩla taa ɩkʋlɩ lala mʋ nɩɩ ɩ kyɔ gaa, nɩɩ afuu bʋlʋnsa ii nin ɩmʋ waa sɩnkaala.
