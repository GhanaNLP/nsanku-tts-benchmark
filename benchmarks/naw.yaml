      gen_sec: 8.77
      ref_sec: 7.8
      cer: 0.0323
      wer: 0.1667
    bible_00122:
      source: bible
      text: Bamʋ nɩɩ ba fwɩɩ bamʋ atɔ bunsa, kɛ ba nyɛ nkpa oyu mʋ abi gyii, kɛ ba bɩla nyɛ ɔkpa bɔla
