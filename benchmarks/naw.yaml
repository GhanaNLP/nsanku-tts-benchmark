      wer: 0.1714
    bible_00143:
      source: bible
      text: Amaa ba maa gyoo naa fʋʋ saŋa kʋ nɩɩ ba wu fɛɛ sɛhn man waa Pɔɔlɩ mʋ, ba kyɛɛgɛ bamʋ nfɛɛrɛ,
