      wer: 0.037
    bible_00119:
      source: bible
      text: Nɩɩ abɩlɩsa adʋnyɔ yɛ ana yɛ atɔ‐kɩɩsa ana mʋ ba muŋa sun Ɩbwaarɛ mʋ nɩɩ ɔ tɛ kuwura‐gya sʋ
