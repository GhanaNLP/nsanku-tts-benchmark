      gen_sec: 5.26
      ref_sec: 6.66
      cer: 0.0167
      wer: 0.0714
    bible_00128:
      source: bible
      text: Nɩɩ ɩ gyɛ kesintin nɩn fɛɛ akʋ lɩɩ kayɩɩ basa yɛ kolu biti mʋ nɩɩ ba sʋ mɛ sʋ, nɩɩ ba sʋ bɛɛ
