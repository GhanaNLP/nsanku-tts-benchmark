      ref_sec: 8.88
      cer: 0.1905
      wer: 0.3333
    bible_00120:
      source: bible
      text: Tʋtɔ mʋ, Pita mʋ nɩɩ Kayaayu Kyɩrɛkyɩrɛ kɩ bɔla mʋ tɔ mʋ lɛɛ bamʋ kɔnɔ yɛ, “Agyankpaapʋ yɛ
        abɩlɩsa, fan taasɛ anɛ ndaga asɩn danbɩrasa mʋ nɩɩ an waa boobi nɩmʋ, nɩɩ kʋtɔ mʋ nɩɩ kɩ yɛgɛ
