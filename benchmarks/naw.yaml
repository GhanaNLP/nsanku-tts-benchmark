      ref_sec: 3.54
      cer: 0.025
      wer: 0.1818
    bible_00131:
      source: bible
      text: Fu wu fɛɛ mʋ kɩkɔɔlɛ‐gyii yɛ mʋ awaasa kpini ɩ gyɛ kʋkʋlʋn nɩn.
