      wer: 0.1786
    bible_00115:
      source: bible
      text: Falɛ atɩntɩnsa akaapʋpʋ anɩmʋ ba du nɩn fɛɛ atiribo mʋ nɩɩ ɩ man sʋ nkyu yɛ abwaarɛ‐wʋlɛ mʋ
