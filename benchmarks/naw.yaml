      gen_sec: 4.3
      ref_sec: 4.38
      cer: 0.0
      wer: 0.0
    bible_00152:
      source: bible
      text: Mɩnɛ ɩ waa nɩɩ odunwura mʋ mee kyula yɛ mʋ asɩn ɩ man bʋrɔn?
