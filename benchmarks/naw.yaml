      text: Kadɛ lala nɩmʋ tɔ nɩɩ kasɛ sʋ awura bee dii bɛɛ kpɩlɩgɛ, fɛɛ kanan mʋ nɩɩ anyɩn bee dii bɛɛ
        kpɩlɩgɛ ɔkyɩɩ‐kyagaa sʋ mʋ.
      sbs: 0.6783
      gen_sec: 7.92
      ref_sec: 7.8
      cer: 0.0108
      wer: 0.0833
    bible_00122:
      source: bible
      text: Bamʋ nɩɩ ba fwɩɩ bamʋ atɔ bunsa, kɛ ba nyɛ nkpa oyu mʋ abi gyii, kɛ ba bɩla nyɛ ɔkpa bɔla
        kewusunɔ mʋ loo kadɛ lala mʋ tɔ mʋ, bamʋ ii gyii ɔkɔn.
      sbs: 0.7178
      gen_sec: 10.0
      ref_sec: 10.96
      cer: 0.0185
      wer: 0.0606
    bible_00123:
      source: bible
      text: Kɛ fan nyiŋi bamʋ nɩɩ bee gyii awʋrʋfɔ mʋ, fɛɛ fanɛ ii gyii kanɩn awʋrʋfɔ maŋa.
      sbs: 0.7245
      gen_sec: 4.72
      ref_sec: 6.58
      cer: 0.0323
      wer: 0.125
    bible_00124:
      source: bible
      text: Lɩɩ mʋ kɩkɔɔlɛ‐gyii nɩmʋ sʋ mʋ, halɩɩ maa wu gbaa mʋ, mʋ kɩkɔɔlɛ‐gyii mʋ kɩ san kɩɩ tɔwɛ anɛ
        yɛ anɛ gbaa anɛ a kɔɔlɛ gyii kanɩn.
      sbs: 0.7119
      gen_sec: 8.32
      ref_sec: 11.14
      cer: 0.0103
      wer: 0.1481
    bible_00125:
      source: bible
      text: Nɩɩ Yesu bwii naa faa Gyɔdan ɔbʋn kpee kɩmʋ benben, opula mʋ nɩɩ Gyɔn kyɩna gyee asa Ɩbwaarɛ
        kekyugyee mʋ.
      sbs: 0.6996
      gen_sec: 6.64
      ref_sec: 7.58
      cer: 0.0706
      wer: 0.1
    bible_00126:
      source: bible
      text: Nɩɩ an lɩɩ tʋtɔ kyaga sʋ natɛ kpee Filipi mʋ nɩɩ kɩ gyɛ Masedoniya kabaafʋn kʋ kadɛ lala,
        nɩɩ tʋtɔ bʋ Roma abi kasɛ.
      sbs: 0.7164
      gen_sec: 8.4
      ref_sec: 10.74
      cer: 0.011
      wer: 0.0417
    bible_00127:
      source: bible
      text: Fan man yɛgɛ akaapʋ‐bi kʋkwɩɩ‐kʋkwɩɩ ɩkʋ ɩ lɛɛ fanɛ lɩɩ kesintin ɔkpa mʋ sʋ.
      sbs: 0.7108
      gen_sec: 4.56
      ref_sec: 6.66
      cer: 0.0167
      wer: 0.4286
    bible_00128:
      source: bible
      text: Nɩɩ ɩ gyɛ kesintin nɩn fɛɛ akʋ lɩɩ kayɩɩ basa yɛ kolu biti mʋ nɩɩ ba sʋ mɛ sʋ, nɩɩ ba sʋ bɛɛ
        tɔwɛ asɩn lɩɩ Krisito sʋ, amaa akʋ bɩrɛ ba taa nfɛɛrɛ danbɩrasa nɩn bɛɛ tɔwɛ Krisito asɩn mʋ.
      sbs: 0.7671
      gen_sec: 12.48
      ref_sec: 14.66
      cer: 0.021
      wer: 0.0976
    bible_00129:
      source: bible
      text: Ɔkʋmaa mʋ nɩɩ ɔ kɔɔlɛ Ɩbwaarɛ ɔtɔwɛpʋ lɩɩ maa gyɛ Ɩbwaarɛ atɔwɛpʋ sʋ mʋ, ee biti ɔ nyɛ kʋkɔka
        mʋ nɩɩ Ɩbwaarɛ ii biti ɔ ka mʋ ɔtɔwɛpʋ mʋ.
      sbs: 0.7026
      gen_sec: 9.04
      ref_sec: 9.06
      cer: 0.0
      wer: 0.069
    bible_00130:
      source: bible
      text: Amaa Pɔɔlɩ man kyula fɛɛ ba taa Maki buu bamʋ n‐yɩɩ.
      sbs: 0.7497
      gen_sec: 3.68
      ref_sec: 3.54
      cer: 0.0
      wer: 0.0
    bible_00131:
      source: bible
      text: Fu wu fɛɛ mʋ kɩkɔɔlɛ‐gyii yɛ mʋ awaasa kpini ɩ gyɛ kʋkʋlʋn nɩn.
      sbs: 0.6843
      gen_sec: 4.0
      ref_sec: 3.58
      cer: 0.0
      wer: 0.0
    bible_00132:
      source: bible
      text: Ɔkʋmaa mʋ nɩɩ ee kisi mʋ bɩrɩsa mʋ gyɛ ɔmɔɔpʋ nɩn, nɩɩ fan nyi yɛ amɔɔpʋ maa man sʋ nkpa kakpaa.
      sbs: 0.7178
      gen_sec: 6.24
      ref_sec: 6.9
      cer: 0.0
      wer: 0.0
    bible_00133:
      source: bible
      text: O sun tɩɩ Banabasi maa Pɔɔlɩ, lɩɩ fɛɛ ee biti o nu abwaarɛsɩn lɩɩ bamʋ asɛ.
      sbs: 0.6953
      gen_sec: 7.04
      ref_sec: 6.42
      cer: 0.0
      wer: 0.0
    bible_00134:
      source: bible
      text: Amaa nɩɩ Kayaayu Kyɩrɛkyɩrɛ mʋ kan ba fanɛ sʋ mʋ, fen biti fan nyɛ ɔlʋn kɛ fan naa tɔwɛ mɛ
        asɩn mʋ Gyerusalem tɔ yɛ Gyudeya kpini yɛ Samariya tɔ, taa naa fʋʋ dulinyaa ɔkaa.
      sbs: 0.6527
      gen_sec: 12.32
      ref_sec: 12.62
      cer: 0.0
      wer: 0.0
    bible_00135:
      source: bible
      text: Nɩɩ kʋtɔ mʋ nɩɩ an biti an baa an gyɛ mʋ ɩ man pɩɩta lɩɩ ifuli.
      sbs: 0.6879
      gen_sec: 4.4
      ref_sec: 3.5
      cer: 0.0213
      wer: 0.0625
    bible_00136:
      source: bible
      text: Fan yɛgɛ a bɩla taa ɩkʋlɩ lala mʋ nɩɩ ɩ kyɔ gaa, nɩɩ afuu bʋlʋnsa ii nin ɩmʋ waa sɩnkaala.
      sbs: 0.7017
      gen_sec: 6.08
      ref_sec: 8.32
      cer: 0.058
      wer: 0.4
    bible_00137:
      source: bible
      text: Nɩɩ bʋlayɩ abuu mʋ nɩɩ i du fɛɛ afʋlɛ‐buu, nɩɩ ɩmʋ kʋkʋlʋn oduu ɩ waa fɛɛ ayu bɔɔta oduu mʋ,
        ɩ lɩɩ sʋsʋ ba tɩyɛ asa sʋ.
      sbs: 0.6383
      gen_sec: 8.32
      ref_sec: 9.14
      cer: 0.0337
      wer: 0.0741
    bible_00138:
      source: bible
      text: N bɩla n tɔwɛ fanɛ yɛ, ɩ bʋpɔɔ sa nyɔɔma fɛɛ o loo baasa ɔbɔ tɔ ɩ kyɔ atɔ wuya o loo Ɩbwaarɛ
        kuwura‐gyii mʋ tɔ.
      sbs: 0.689
      gen_sec: 7.28
      ref_sec: 8.12
      cer: 0.012
      wer: 0.1154
    bible_00139:
      source: bible
      text: Nɩɩ Ɔnyɩrɩpɛ Ɩbwaarɛ kan kyula mʋ, n biti fɛɛ n gyii nkɛ gbɛrɛɛ kʋ fanɛ asɛ.
      sbs: 0.7664
      gen_sec: 4.96
      ref_sec: 5.44
      cer: 0.0
      wer: 0.0
    bible_00140:
      source: bible
      text: Nɩɩ fan kan buu mɛ kɔnɔsa mʋ bɩrɛ, fan gyɛ mɛ kyɛmɩnɛ ana nɩn.
      sbs: 0.648
      gen_sec: 4.56
      ref_sec: 3.24
      cer: 0.0
      wer: 0.1429
    bible_00141:
      source: bible
      text: Ba lɩɩ ndɛndɛmandɛ yɛ nbunɔ kʋkwɩɩ‐kʋkwɩɩ yɛ asa kʋkwɩɩ‐kʋkwɩɩ yɛ ntɔwɛ kʋkwɩɩ‐kʋkwɩɩ ba yɩlɛ
        kuwura‐gya mʋ yɛ Kabʋlʋpʋ mu ansi tɔ.
      sbs: 0.7053
      gen_sec: 8.96
      ref_sec: 10.08
      cer: 0.0
      wer: 0.0
    bible_00142:
      source: bible
      text: Lɩɩ mɛ sʋ, bee biti ba kpiya fanɛ awura yɛ alʋlʋnpʋ ansi tɔ, kɛ fan nyɛ ɔkpa tɔwɛ asɩn danbɩrasa
        mʋ lɩɩ mɛ sʋ sa bamʋ, yɛ bamʋ nɩɩ ba man gyɛ Gyiwu abi mʋ.
      sbs: 0.7178
      gen_sec: 18.64
      ref_sec: 11.34
      cer: 1.0427
      wer: 1.4
    bible_00143:
      source: bible
      text: Amaa ba maa gyoo naa fʋʋ saŋa kʋ nɩɩ ba wu fɛɛ sɛhn man waa Pɔɔlɩ mʋ, ba kyɛɛgɛ bamʋ nfɛɛrɛ,
        nɩɩ ba tɔwɛ yɛ, ɔ gyɛ ɔdakpa kʋ nɩn.
      sbs: 0.7255
      gen_sec: 9.04
      ref_sec: 10.64
      cer: 0.0
      wer: 0.0
    bible_00144:
      source: bible
      text: Lɩɩ fɛɛ asansa mʋ kpini bamʋ lɛɛ nkʋn nɩɩ bee biti, man gyɛ ɩmʋ nɩɩ ɩ gyɛ Yesu Krisito lɛɛ.
      sbs: 0.7708
      gen_sec: 6.4
      ref_sec: 6.96
      cer: 0.0
      wer: 0.0
    bible_00145:
      source: bible
      text: Lɩɩ fɛɛ bamʋ gbaa‐gbaa bamʋ bɛɛ tɔwɛ kɩfɔ kɩtaa mʋ nɩɩ fan kɩtaa anɛ.
      sbs: 0.6053
      gen_sec: 3.12
      ref_sec: 5.4
      cer: 0.8519
      wer: 0.9286
    bible_00146:
      source: bible
      text: Fan su kɛ fan saawʋ kenken lɩɩ awʋrʋfɔ mʋ nɩɩ ii biti ɩ ba fanɛ sʋ mʋ.
      sbs: 0.7021
      gen_sec: 6.0
      ref_sec: 4.3
      cer: 0.0189
      wer: 0.0588
    bible_00147:
      source: bible
      text: Lɩɩ fɛɛ nɩɩ ba kili mʋ, ɩ bʋrɔn sa bamʋ ɩ kyɔ kakyɩɩ abɛɛ kanyɩn biti kayalaga kɩ maa bʋ bamʋ
        tɔ.
      sbs: 0.7409
      gen_sec: 7.12
      ref_sec: 7.6
      cer: 0.0676
      wer: 0.1818
    bible_00148:
      source: bible
      text: Mɛ‐daa ana yɛ mi‐supu ana, fan man tɔwɛ alibi akʋ lɩɩ fanɛ bɩrɩsa ana sʋ.
      sbs: 0.7085
      gen_sec: 5.6
      ref_sec: 4.68
      cer: 0.0
      wer: 0.0
    bible_00149:
      source: bible
      text: Kʋtɔ mʋ nɩɩ bee biti mʋ ɩ gyɛ fɛɛ, ba barɩgɛ fanɛ lɩɩ mɛ asɛ, kɛ fanɛ gbaa fanɛ fan baa fen
        nu bamʋ asɛ.
      sbs: 0.7482
      gen_sec: 6.96
      ref_sec: 7.3
      cer: 0.0
      wer: 0.0
    bible_00150:
      source: bible
      text: Nɩɩ Yesu ɩ gyɛ ɔsa mʋ nɩɩ Ɩbwaarɛ Asɩnkyan yɩlasa mʋ ɩ tɔwɛ yɛ.
      sbs: 0.6964
      gen_sec: 3.84
      ref_sec: 3.88
      cer: 0.0
      wer: 0.1429
    bible_00151:
      source: bible
      text: Amaa ba man wu ɔkʋ mɛ asɛ, nɩɩ n man waa ɩlawʋ ɩkʋ.
      sbs: 0.7835
      gen_sec: 3.6
      ref_sec: 4.38
      cer: 0.0811
      wer: 0.3846
    bible_00152:
      source: bible
      text: Mɩnɛ ɩ waa nɩɩ odunwura mʋ mee kyula yɛ mʋ asɩn ɩ man bʋrɔn?
      sbs: 0.7379
      gen_sec: 3.68
      ref_sec: 4.74
      cer: 0.0652
      wer: 0.2857
    bible_00153:
      source: bible
      text: Lɩɩ alibi ɩkpa kʋkwɩɩ‐kʋkwɩɩ sʋ mʋ, fan baa fan du fɛɛ nbii, amaa fanɛ nfɛɛrɛ tɔ mʋ, fan kaapʋ
        fɛɛ fan dan.
      sbs: 0.7614
      gen_sec: 6.64
      ref_sec: 8.9
      cer: 0.0
      wer: 0.0
    bible_00154:
      source: bible
      text: ” Halɩɩ ba maa tɔwɛ ɩnɩmʋ kamaa gbaa mʋ, ɩ waa ɔlʋn pɔyɩ nɩɩ ba taalɛ gya sakyɔ mʋ yɛ ba man
        waa kɔlɔŋɔ mʋ.
      sbs: 0.6482
      gen_sec: 6.64
      ref_sec: 8.96
      cer: 0.0
      wer: 0.0
    bible_00155:
      source: bible
      text: Lɩɩ fɛɛ Ɔnyɩrɩpɛ Yesu kibwii ba saŋa mʋ ki tee tiri tɔ.
      sbs: 0.6871
      gen_sec: 3.6
      ref_sec: 3.1
      cer: 0.0233
      wer: 0.25
    bible_00156:
      source: bible
      text: Ɩ bʋlʋn sa fʋ fɛɛ fʋ maa kɔɔ yɛ mi kebiti’.
      sbs: 0.7414
      gen_sec: 2.88
      ref_sec: 3.54
      cer: 0.129
      wer: 0.3636
    bible_00157:
      source: bible
      text: Asa ba lɩɩ Gyerusalem kadɛ tɔ yɛ Gyudeya ɩsʋwʋlɛ sʋ yɛ Gyɔdan kabaafʋn kpini ba mʋ asɛ.
      sbs: 0.6806
      gen_sec: 6.08
      ref_sec: 7.0
      cer: 0.0
      wer: 0.1176
    bible_00158:
      source: bible
      text: Nɩɩ Gyɔn lɛɛ kɔnɔ yɛ, “Ɔkʋmaa mʋ nɩɩ ɔ sʋ ɩkaalɛ ɩnyɔ mʋ, ɔ barɩgɛ tɔ sa mʋ tɔmaa mʋ nɩɩ ɔ
        man sʋ, nɩɩ ɔkʋmaa mʋ nɩɩ ɔ sʋ agyitɔ gbaa, ɔ waa kanɩn.
      sbs: 0.6822
      gen_sec: 11.68
      ref_sec: 10.5
      cer: 0.0093
      wer: 0.0286
    bible_00159:
      source: bible
      text: N sʋ ɔkpa fɛɛ n taa mɛ nkpa sa halɩɩ lewu tɔ, kɛ n bɩla bwii nyɛ kɩmʋ.
      sbs: 0.7136
      gen_sec: 4.88
      ref_sec: 4.84
      cer: 0.0196
      wer: 0.1111
    bible_00160:
      source: bible
      text: Mɛ ɩ yɛgɛ nɩɩ ba tɩn mu kumu, amaa o bwii ba nkpa tɔ.
      sbs: 0.7132
      gen_sec: 3.76
      ref_sec: 3.92
      cer: 0.0263
      wer: 0.0714
    bible_00161:
      source: bible
      text: Saŋa mʋ nɩɩ Gyiwu abi Pentekosi kakɛ gyisa maa fʋʋ mʋ, Krisito akɔɔlɛ‐gyipu mʋ kpini ba ba
        sarɛ opula kʋlʋn.
      sbs: 0.6956
      gen_sec: 7.04
      ref_sec: 8.56
      cer: 0.0
      wer: 0.0
    bible_00162:
      source: bible
      text: Fii biti fɛɛ ba bɩla kaapʋ fʋ fɛɛ kɩkɔɔlɛ‐gyii mʋ nɩɩ kɩ man sʋ awaasa mʋ kɩ man sʋ kyaarɛ?
      sbs: 0.7064
      gen_sec: 6.48
      ref_sec: 5.92
      cer: 0.0
      wer: 0.0
    bible_00163:
      source: bible
      text: Lɩɩ fɛɛ ɔkʋmaa nɩmʋ ii biti ɔ ba bɩɩ mɛ.
      sbs: 0.6955
      gen_sec: 2.64
      ref_sec: 3.1
      cer: 0.0
      wer: 0.0
    bible_00164:
      source: bible
      text: N bʋ mɛ n‐yɩɩ nɩn, n man gyɛ ɔkʋ kɩnyɛ, amaa n waa mɛ n‐yɩɩ kɩnyɛ sa ɔkʋmaa nɩmʋ, kɛ n nyɛ‐nyɛ
        asa kʋkyɔ ba be biliŋi Krisito lɛɛ.
      sbs: 0.7652
      gen_sec: 8.4
      ref_sec: 11.74
      cer: 0.0211
      wer: 0.1379
    bible_00165:
      source: bible
      text: Nɩɩ Farasii abi mʋ akʋ ba taasɛ yɛ, “Mɩnɛ ɩ waa nɩɩ fan waa kakɛ fʋʋtɛsa akɛ ikisii?
      sbs: 0.6953
      gen_sec: 6.24
      ref_sec: 6.58
      cer: 0.0
      wer: 0.1111
    bible_00166:
      source: bible
      text: Mʋ agyitɔ‐gyisa mɔɔ ɩ gyɛ ntuntunbi yɛ ŋmasan.
      sbs: 0.6427
      gen_sec: 3.44
      ref_sec: 3.9
      cer: 0.1892
      wer: 1.25
    bible_00167:
      source: bible
      text: Lɩɩ fɛɛ Ɩbwaarɛ kuwura‐gyii mʋ man gyɛ asɩn kɩtɔwɛ, amaa kɩ gyɛ Ɩbwaarɛ ɔlʋn mʋ tɔ atɔ waasa
        nɩn.
      sbs: 0.6462
      gen_sec: 3.12
      ref_sec: 7.38
      cer: 0.8158
      wer: 1.0
    bible_00168:
      source: bible
      text: kɛ kɩmʋ alibi mʋ nɩɩ kɩ waa mʋ, fan ka kɩmʋ kʋkɔ ɩlɩɩ ɩnyɔ sʋ.
      sbs: 0.7271
      gen_sec: 4.16
      ref_sec: 5.04
      cer: 0.0435
      wer: 0.1333
    bible_00169:
      source: bible
      text: ” Tʋtɔ nɩɩ mʋ abɩɩlapʋ mʋ ba piili bɛɛ taasɛ abaa bamʋ tɔ ɔmɔɔ ii biti ɔ waa kanɩn asɩn nɩmʋ?
      sbs: 0.7019
      gen_sec: 6.08
      ref_sec: 6.58
      cer: 0.0282
      wer: 0.3
    bible_00170:
      source: bible
      text: Mi‐bii ana, anɛ dulinyaa tɔ kakyɩna laalaalʋwɛ mʋ kɩ fʋʋ, fɛɛ kanan mʋ nɩɩ fan wʋla nu yɛ
        Krisito okisipu mʋ ii biti ɔ ba mʋ.
      sbs: 0.6932
      gen_sec: 8.4
      ref_sec: 8.08
      cer: 0.0312
      wer: 0.1154
    bible_00171:
      source: bible
      text: N biti fɛɛ fɛn bɩɩ fɛɛ ba tigi anɛ bɩrɩsa Timoti mʋ nɩɩ ba daa kɩtaa tii obu mʋ.
      sbs: 0.7288
      gen_sec: 6.24
      ref_sec: 6.36
      cer: 0.0164
      wer: 0.0526
    bible_00172:
      source: bible
      text: Fan man nyi yɛ Ɩbwaarɛ ɩ sa fanɛ Kayaayu maŋa, nɩɩ ɔ tɛ fanɛ tɔ?
      sbs: 0.7062
      gen_sec: 5.52
      ref_sec: 4.34
      cer: 0.0
      wer: 0.0
    bible_00173:
      source: bible
      text: Ɩ bʋrɔn sa fʋ fɛɛ fʋ maa taa kinsi kʋlʋn loo nkpa kakpaa tɔ, ɩ kyɔ fʋ maa sʋ ansi anyɔ kɛ
        ba taa fʋ tʋʋ awʋrʋfɔ fʋlɔn yen‐yen tɔ.
      sbs: 0.6972
      gen_sec: 8.8
      ref_sec: 9.2
      cer: 0.0412
      wer: 0.1
    bible_00174:
      source: bible
      text: Amaa Pɔɔlɩ maa Banabasi ba sii Antiyoki.
      sbs: 0.7073
      gen_sec: 2.8
      ref_sec: 10.48
      cer: 0.2121
      wer: 0.4286
    bible_00175:
      source: bible
      text: Nɩɩ Kayaayu Kyɩrɛkyɩrɛ mʋ lɛɛ kaapʋ bamʋ, nɩɩ ba tɔwɛ Pɔɔlɩ yɛ ɔ man kpee Gyerusalem.
      sbs: 0.7221
      gen_sec: 6.0
      ref_sec: 6.04
      cer: 0.0
      wer: 0.0
    bible_00176:
      source: bible
      text: Piili lɩɩ bamʋ nɩɩ ba sii kamaa ba mʋ sʋ naa fʋʋ bamʋ nɩɩ ba gyankpaa ba mʋ.
      sbs: 0.6968
      gen_sec: 5.52
      ref_sec: 4.92
      cer: 0.0
      wer: 0.2222
