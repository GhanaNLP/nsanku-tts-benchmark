      cer: 0.0105
      wer: 0.2414
    bible_00165:
      source: bible
      text: Nɩɩ Farasii abi mʋ akʋ ba taasɛ yɛ, “Mɩnɛ ɩ waa nɩɩ fan waa kakɛ fʋʋtɛsa akɛ ikisii?
