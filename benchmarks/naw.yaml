      cer: 0.037
      wer: 0.087
    bible_00118:
      source: bible
      text: Maa kyɩna n bʋ bamʋ asɛ mʋ, kɩtɩɩ mʋ nɩɩ fʋ sa mɛ mʋ, kɩmʋ ɔlʋn tɔ nɩɩ n taa kɩɩ bamʋ sʋ,
