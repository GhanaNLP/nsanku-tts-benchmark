      wer: 0.0741
    bible_00117:
      source: bible
      text: Fan kɩɩ yɛ ɔdan lɩɩ asa mʋ nɩɩ be du fɛɛ igyoonɔ nɩɩ ba gyɛ alibi awaapʋ, nɩɩ ba yɩlɛ kayɩɩ‐wʋlɛ
