      gen_sec: 3.6
      ref_sec: 3.54
      cer: 0.129
      wer: 0.1818
    bible_00157:
      source: bible
      text: Asa ba lɩɩ Gyerusalem kadɛ tɔ yɛ Gyudeya ɩsʋwʋlɛ sʋ yɛ Gyɔdan kabaafʋn kpini ba mʋ asɛ.
      sbs: 0.7711
      gen_sec: 7.38
      ref_sec: 7.0
      cer: 0.0571
      wer: 0.2353
    bible_00158:
      source: bible
      text: Nɩɩ Gyɔn lɛɛ kɔnɔ yɛ, “Ɔkʋmaa mʋ nɩɩ ɔ sʋ ɩkaalɛ ɩnyɔ mʋ, ɔ barɩgɛ tɔ sa mʋ tɔmaa mʋ nɩɩ ɔ
        man sʋ, nɩɩ ɔkʋmaa mʋ nɩɩ ɔ sʋ agyitɔ gbaa, ɔ waa kanɩn.
      sbs: 0.8013
      gen_sec: 10.27
      ref_sec: 10.5
      cer: 0.1028
      wer: 0.2571
    bible_00159:
      source: bible
      text: N sʋ ɔkpa fɛɛ n taa mɛ nkpa sa halɩɩ lewu tɔ, kɛ n bɩla bwii nyɛ kɩmʋ.
