      gen_sec: 6.67
      ref_sec: 6.9
      cer: 0.0541
      wer: 0.1905
    bible_00133:
      source: bible
      text: O sun tɩɩ Banabasi maa Pɔɔlɩ, lɩɩ fɛɛ ee biti o nu abwaarɛsɩn lɩɩ bamʋ asɛ.
      sbs: 0.7751
      gen_sec: 6.4
      ref_sec: 6.42
      cer: 0.0
      wer: 0.0
    bible_00134:
      source: bible
      text: Amaa nɩɩ Kayaayu Kyɩrɛkyɩrɛ mʋ kan ba fanɛ sʋ mʋ, fen biti fan nyɛ ɔlʋn kɛ fan naa tɔwɛ mɛ
