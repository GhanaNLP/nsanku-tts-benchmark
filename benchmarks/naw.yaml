      gen_sec: 5.62
      ref_sec: 5.4
      cer: 0.0185
      wer: 0.0714
    bible_00146:
      source: bible
      text: Fan su kɛ fan saawʋ kenken lɩɩ awʋrʋfɔ mʋ nɩɩ ii biti ɩ ba fanɛ sʋ mʋ.
      sbs: 0.7712
      gen_sec: 4.34
      ref_sec: 4.3
      cer: 0.0
      wer: 0.0
    bible_00147:
      source: bible
      text: Lɩɩ fɛɛ nɩɩ ba kili mʋ, ɩ bʋrɔn sa bamʋ ɩ kyɔ kakyɩɩ abɛɛ kanyɩn biti kayalaga kɩ maa bʋ bamʋ
