      gen_sec: 8.08
      ref_sec: 8.56
      cer: 0.0698
      wer: 0.5
    bible_00162:
      source: bible
      text: Fii biti fɛɛ ba bɩla kaapʋ fʋ fɛɛ kɩkɔɔlɛ‐gyii mʋ nɩɩ kɩ man sʋ awaasa mʋ kɩ man sʋ kyaarɛ?
