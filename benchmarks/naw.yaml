      gen_sec: 9.66
      ref_sec: 10.08
      cer: 0.0189
      wer: 0.0952
    bible_00142:
      source: bible
      text: Lɩɩ mɛ sʋ, bee biti ba kpiya fanɛ awura yɛ alʋlʋnpʋ ansi tɔ, kɛ fan nyɛ ɔkpa tɔwɛ asɩn danbɩrasa
