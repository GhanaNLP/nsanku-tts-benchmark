      ref_sec: 5.44
      cer: 0.0678
      wer: 0.0625
    bible_00140:
      source: bible
      text: Nɩɩ fan kan buu mɛ kɔnɔsa mʋ bɩrɛ, fan gyɛ mɛ kyɛmɩnɛ ana nɩn.
      sbs: 0.7535
      gen_sec: 3.68
      ref_sec: 3.24
      cer: 0.0213
      wer: 0.2143
    bible_00141:
      source: bible
      text: Ba lɩɩ ndɛndɛmandɛ yɛ nbunɔ kʋkwɩɩ‐kʋkwɩɩ yɛ asa kʋkwɩɩ‐kʋkwɩɩ yɛ ntɔwɛ kʋkwɩɩ‐kʋkwɩɩ ba yɩlɛ
