      gen_sec: 9.71
      ref_sec: 11.14
      cer: 0.0103
      wer: 0.037
    bible_00125:
      source: bible
      text: Nɩɩ Yesu bwii naa faa Gyɔdan ɔbʋn kpee kɩmʋ benben, opula mʋ nɩɩ Gyɔn kyɩna gyee asa Ɩbwaarɛ
