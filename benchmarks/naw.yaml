      gen_sec: 12.03
      ref_sec: 12.62
      cer: 0.0444
      wer: 0.1143
    bible_00135:
      source: bible
      text: Nɩɩ kʋtɔ mʋ nɩɩ an biti an baa an gyɛ mʋ ɩ man pɩɩta lɩɩ ifuli.
