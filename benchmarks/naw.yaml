      ref_sec: 4.84
      cer: 0.0196
      wer: 0.0556
    bible_00160:
      source: bible
      text: Mɛ ɩ yɛgɛ nɩɩ ba tɩn mu kumu, amaa o bwii ba nkpa tɔ.
