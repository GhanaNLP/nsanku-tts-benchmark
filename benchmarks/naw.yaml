      gen_sec: 8.18
      ref_sec: 7.58
      cer: 0.0235
      wer: 0.05
    bible_00126:
      source: bible
      text: Nɩɩ an lɩɩ tʋtɔ kyaga sʋ natɛ kpee Filipi mʋ nɩɩ kɩ gyɛ Masedoniya kabaafʋn kʋ kadɛ lala,
