      wer: 0.2857
    bible_00141:
      source: bible
      text: Ba lɩɩ ndɛndɛmandɛ yɛ nbunɔ kʋkwɩɩ‐kʋkwɩɩ yɛ asa kʋkwɩɩ‐kʋkwɩɩ yɛ ntɔwɛ kʋkwɩɩ‐kʋkwɩɩ ba yɩlɛ
