      sbs: 0.7308
      gen_sec: 8.03
      ref_sec: 7.3
      cer: 0.0519
      wer: 0.12
    bible_00150:
      source: bible
      text: Nɩɩ Yesu ɩ gyɛ ɔsa mʋ nɩɩ Ɩbwaarɛ Asɩnkyan yɩlasa mʋ ɩ tɔwɛ yɛ.
