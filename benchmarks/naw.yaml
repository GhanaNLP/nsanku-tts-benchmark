    bible_00116:
      source: bible
      text: Ɩmʋ sʋ n kpan mɛ n‐yɩɩ nɩn n sɩlɛ ntintin naa lʋwɛ, kɛ n nyɛ‐nyɛ nkpa kakɛɛ mʋ nɩɩ Ɩbwaarɛ
