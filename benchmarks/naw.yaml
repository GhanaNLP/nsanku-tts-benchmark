      ref_sec: 9.14
      cer: 0.0
      wer: 0.0741
    bible_00138:
      source: bible
      text: N bɩla n tɔwɛ fanɛ yɛ, ɩ bʋpɔɔ sa nyɔɔma fɛɛ o loo baasa ɔbɔ tɔ ɩ kyɔ atɔ wuya o loo Ɩbwaarɛ
