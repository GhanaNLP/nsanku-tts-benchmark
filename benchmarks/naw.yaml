      ref_sec: 6.58
      cer: 0.0806
      wer: 0.3125
    bible_00124:
      source: bible
      text: Lɩɩ mʋ kɩkɔɔlɛ‐gyii nɩmʋ sʋ mʋ, halɩɩ maa wu gbaa mʋ, mʋ kɩkɔɔlɛ‐gyii mʋ kɩ san kɩɩ tɔwɛ anɛ
