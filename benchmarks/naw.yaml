      gen_sec: 7.15
      ref_sec: 8.12
      cer: 0.0
      wer: 0.0769
    bible_00139:
      source: bible
      text: Nɩɩ Ɔnyɩrɩpɛ Ɩbwaarɛ kan kyula mʋ, n biti fɛɛ n gyii nkɛ gbɛrɛɛ kʋ fanɛ asɛ.
