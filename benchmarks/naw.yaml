      ref_sec: 8.32
      cer: 0.058
      wer: 0.25
    bible_00137:
      source: bible
      text: Nɩɩ bʋlayɩ abuu mʋ nɩɩ i du fɛɛ afʋlɛ‐buu, nɩɩ ɩmʋ kʋkʋlʋn oduu ɩ waa fɛɛ ayu bɔɔta oduu mʋ,
