        waa kɔlɔŋɔ mʋ.
      sbs: 0.7594
      gen_sec: 9.2
      ref_sec: 8.96
      cer: 0.075
      wer: 0.125
    bible_00155:
      source: bible
      text: Lɩɩ fɛɛ Ɔnyɩrɩpɛ Yesu kibwii ba saŋa mʋ ki tee tiri tɔ.
