      cer: 0.0926
      wer: 0.3333
    bible_00123:
      source: bible
      text: Kɛ fan nyiŋi bamʋ nɩɩ bee gyii awʋrʋfɔ mʋ, fɛɛ fanɛ ii gyii kanɩn awʋrʋfɔ maŋa.
