      gen_sec: 9.63
      ref_sec: 10.74
      cer: 0.011
      wer: 0.0417
    bible_00127:
      source: bible
      text: Fan man yɛgɛ akaapʋ‐bi kʋkwɩɩ‐kʋkwɩɩ ɩkʋ ɩ lɛɛ fanɛ lɩɩ kesintin ɔkpa mʋ sʋ.
