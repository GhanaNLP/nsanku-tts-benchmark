      gen_sec: 3.63
      ref_sec: 3.58
      cer: 0.0204
      wer: 0.0769
    bible_00132:
      source: bible
      text: Ɔkʋmaa mʋ nɩɩ ee kisi mʋ bɩrɩsa mʋ gyɛ ɔmɔɔpʋ nɩn, nɩɩ fan nyi yɛ amɔɔpʋ maa man sʋ nkpa kakpaa.
