      gen_sec: 3.84
      ref_sec: 4.74
      cer: 0.1304
      wer: 0.2143
    bible_00153:
      source: bible
      text: Lɩɩ alibi ɩkpa kʋkwɩɩ‐kʋkwɩɩ sʋ mʋ, fan baa fan du fɛɛ nbii, amaa fanɛ nfɛɛrɛ tɔ mʋ, fan kaapʋ
