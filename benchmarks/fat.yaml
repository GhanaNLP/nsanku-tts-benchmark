  entries:
    bible_00000:
      source: bible
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.7004
      gen_sec: 6.98
      ref_sec: 9.1
      cer: 0.0625
      wer: 0.35
    bible_00001:
      source: bible
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.6975
      gen_sec: 2.75
      ref_sec: 3.66
      cer: 0.0
      wer: 0.2857
    bible_00002:
      source: bible
      text: Na obisaa hɔn dɛ, Afotu bɛn na hom dze ma, ma yɛdze mbuae aasan akɛma ɔman yi a wɔaka akyerɛ
        me, dɛ, Yɛ kɔndua a w’egya dze too hɛn do no harhar no?
      sbs: 0.6888
      gen_sec: 10.5
      ref_sec: 13.72
      cer: 0.0455
      wer: 0.1212
    bible_00003:
      source: bible
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.634
      gen_sec: 9.25
      ref_sec: 6.36
      cer: 0.1897
      wer: 0.5
    bible_00004:
      source: bible
      text: 'Judamba afamu dze no mu na Simeonmba egyapadze fi: osiandɛ Judamba kyɛpɛn no dɔɔ so dodow
        ma hɔn: dɛm ntsi Simeonmba nyaa egyapadze wɔ hɔn egyapadze no mu.'
      sbs: 0.6719
      gen_sec: 12.8
      ref_sec: 13.48
      cer: 0.624
      wer: 0.6429
    bible_00005:
      source: bible
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6852
      gen_sec: 3.49
      ref_sec: 3.18
      cer: 0.0294
      wer: 0.2857
    bible_00006:
      source: bible
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.611
      gen_sec: 10.14
      ref_sec: 9.12
      cer: 0.2703
      wer: 0.4211
    bible_00007:
      source: bible
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.6829
      gen_sec: 8.13
      ref_sec: 7.44
      cer: 0.1875
      wer: 0.3125
    bible_00008:
      source: bible
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.7146
      gen_sec: 4.13
      ref_sec: 4.88
      cer: 0.0435
      wer: 0.0909
    bible_00009:
      source: bible
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.6846
      gen_sec: 6.02
      ref_sec: 6.16
      cer: 0.0308
      wer: 0.1429
    bible_00010:
      source: bible
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.6907
      gen_sec: 7.97
      ref_sec: 8.48
      cer: 0.0482
      wer: 0.0952
    bible_00011:
      source: bible
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.717
      gen_sec: 5.73
      ref_sec: 6.68
      cer: 0.05
      wer: 0.1579
    bible_00012:
      source: bible
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.6999
      gen_sec: 8.32
      ref_sec: 10.5
      cer: 0.0337
      wer: 0.1429
    bible_00013:
      source: bible
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.7152
      gen_sec: 5.34
      ref_sec: 6.38
      cer: 0.0357
      wer: 0.0667
    bible_00014:
      source: bible
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.6747
      gen_sec: 3.39
      ref_sec: 4.1
      cer: 0.0526
      wer: 0.2222
    bible_00015:
      source: bible
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7027
      gen_sec: 6.53
      ref_sec: 6.76
      cer: 0.0
      wer: 0.1333
    bible_00016:
      source: bible
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.7053
      gen_sec: 6.98
      ref_sec: 8.48
      cer: 0.0
      wer: 0.0
    bible_00017:
      source: bible
      text: 'Hom ntow ndwom mma Nyankopɔn, hom ntow ayɛyindwom mma ne dzin: Hom mbɔ ɔtsempɔn kwan mma
        nyia ɔtse adze do nam sar do no; Ne dzin nye EWURADZE; na hom ndzi n’enyim ehurusi.'
      sbs: 0.6927
      gen_sec: 11.2
      ref_sec: 13.4
      cer: 0.0075
      wer: 0.0303
    bible_00018:
      source: bible
      text: 'Nyia ɔbɛtsena kurow yi mu no, obowu afona, na ɔkɔm, na ɔyardɔm ano: na nyia obefir edzi na
        ɔakɔtɔ Kaldeafo a woetwa hom ho mu no, ɔbɛtsena ase, na no nkwa bɛyɛ afonam ama no.'
      sbs: 0.716
      gen_sec: 12.1
      ref_sec: 14.96
      cer: 0.0301
      wer: 0.1143
    bible_00019:
      source: bible
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.7066
      gen_sec: 2.5
      ref_sec: 3.16
      cer: 0.0333
      wer: 0.1667
    bible_00020:
      source: bible
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.7027
      gen_sec: 3.81
      ref_sec: 4.36
      cer: 0.0714
      wer: 0.2143
    bible_00021:
      source: bible
      text: Nna Jeremia kasaa kyerɛɛ mbapɔmba nyinara na ɔman no nyinara, dɛ, EWURADZE na ɔsomaa me dɛ
        membɛhyɛ asɛm a hom atse yi nyina ho nkɔm ntsia ofi yi na kurow yi.
      sbs: 0.7089
      gen_sec: 10.62
      ref_sec: 12.98
      cer: 0.008
      wer: 0.0323
    bible_00022:
      source: bible
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.6918
      gen_sec: 3.36
      ref_sec: 3.74
      cer: 0.0
      wer: 0.0
    bible_00023:
      source: bible
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.6946
      gen_sec: 7.84
      ref_sec: 10.44
      cer: 0.0421
      wer: 0.2
    bible_00024:
      source: bible
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.6913
      gen_sec: 6.85
      ref_sec: 8.26
      cer: 0.0143
      wer: 0.1765
    bible_00025:
      source: bible
      text: 'Na Elija see no dɛ, Mma nnsuro; kɔ kɛyɛ dɛ mbrɛ ase no: mbom dzi kan yɛ bi tatar kakra ma
        me, na fa brɛ me, na n’ekyir no ayɛ ɔwo na wo ba dze.'
      sbs: 0.6764
      gen_sec: 9.76
      ref_sec: 12.8
      cer: 0.0294
      wer: 0.0571
    bible_00026:
      source: bible
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.6875
      gen_sec: 3.2
      ref_sec: 5.0
      cer: 0.0
      wer: 0.0
    bible_00027:
      source: bible
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6958
      gen_sec: 5.82
      ref_sec: 7.04
      cer: 0.0
      wer: 0.0
    bible_00028:
      source: bible
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.6994
      gen_sec: 7.36
      ref_sec: 9.74
      cer: 0.0
      wer: 0.0
    bible_00029:
      source: bible
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.7167
      gen_sec: 3.71
      ref_sec: 4.34
      cer: 0.0
      wer: 0.0
    bible_00030:
      source: bible
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6848
      gen_sec: 5.6
      ref_sec: 5.64
      cer: 0.0667
      wer: 0.3077
    bible_00031:
      source: bible
      text: na ɔahyɛ dɛ ɔmbra.
      sbs: 0.7244
      gen_sec: 1.41
      ref_sec: 3.36
      cer: 0.0
      wer: 0.0
    bible_00032:
      source: bible
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.6885
      gen_sec: 3.94
      ref_sec: 3.54
      cer: 0.0263
      wer: 0.1111
    bible_00033:
      source: bible
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.6892
      gen_sec: 8.58
      ref_sec: 11.1
      cer: 0.0435
      wer: 0.08
    bible_00034:
      source: bible
      text: 'Mma hom nnsuro Babilɔnhen a hom suro no no; mma hom nnsuro no, EWURADZE na ɔse: na mowɔ hom
        nkyɛn dɛ mebɛgye hom nkwa, na meyi hom efi ne nsamu.'
      sbs: 0.6648
      gen_sec: 9.7
      ref_sec: 9.78
      cer: 0.0
      wer: 0.0
    bible_00035:
      source: bible
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.726
      gen_sec: 5.7
      ref_sec: 7.62
      cer: 0.0656
      wer: 0.1765
    bible_00036:
      source: bible
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.6393
      gen_sec: 4.26
      ref_sec: 3.74
      cer: 0.0
      wer: 0.0
    bible_00037:
      source: bible
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.7299
      gen_sec: 3.55
      ref_sec: 3.94
      cer: 0.0
      wer: 0.0
    bible_00038:
      source: bible
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6893
      gen_sec: 6.05
      ref_sec: 7.02
      cer: 0.0
      wer: 0.0
    bible_00039:
      source: bible
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.7198
      gen_sec: 1.86
      ref_sec: 3.74
      cer: 0.0
      wer: 0.0
    bible_00040:
      source: bible
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.6959
      gen_sec: 5.22
      ref_sec: 5.94
      cer: 0.0469
      wer: 0.2222
    bible_00041:
      source: bible
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.7431
      gen_sec: 2.66
      ref_sec: 3.26
      cer: 0.125
      wer: 0.2222
    bible_00042:
      source: bible
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.6685
      gen_sec: 5.57
      ref_sec: 9.28
      cer: 0.0635
      wer: 0.4
    bible_00043:
      source: bible
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
