  entries:
    '0':
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.7536
      gen_sec: 7.76
      ref_sec: 9.1
    '1':
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.7648
      gen_sec: 4.16
      ref_sec: 3.66
    '3':
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.7722
      gen_sec: 6.08
      ref_sec: 6.36
    '5':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.7889
      gen_sec: 3.68
      ref_sec: 3.18
    '6':
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.7841
      gen_sec: 7.2
      ref_sec: 9.12
    '7':
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.801
      gen_sec: 7.2
      ref_sec: 7.44
    '8':
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.772
      gen_sec: 4.96
      ref_sec: 4.88
    '9':
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.7795
      gen_sec: 6.16
      ref_sec: 6.16
    '10':
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.7652
      gen_sec: 9.36
      ref_sec: 8.48
    '11':
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.7513
      gen_sec: 6.32
      ref_sec: 6.68
    '12':
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.7841
      gen_sec: 10.4
      ref_sec: 10.5
    '13':
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.7867
      gen_sec: 5.84
      ref_sec: 6.38
    '14':
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.7169
      gen_sec: 3.44
      ref_sec: 4.1
    '15':
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7264
      gen_sec: 5.68
      ref_sec: 6.76
    '16':
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.7369
      gen_sec: 6.88
      ref_sec: 8.48
    '19':
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.7578
      gen_sec: 2.56
      ref_sec: 3.16
    '20':
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.7748
      gen_sec: 4.64
      ref_sec: 4.36
    '22':
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.7105
      gen_sec: 4.4
      ref_sec: 3.74
    '23':
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.7332
      gen_sec: 9.36
      ref_sec: 10.44
    '24':
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.7473
      gen_sec: 6.88
      ref_sec: 8.26
    '26':
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.7797
      gen_sec: 3.92
      ref_sec: 5.0
    '27':
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7038
      gen_sec: 6.0
      ref_sec: 7.04
    '28':
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.7656
      gen_sec: 8.32
      ref_sec: 9.74
    '29':
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.7922
      gen_sec: 4.8
      ref_sec: 4.34
    '30':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.8262
      gen_sec: 6.24
      ref_sec: 5.64
    '32':
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.7015
      gen_sec: 3.28
      ref_sec: 3.54
    '33':
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.7408
      gen_sec: 7.76
      ref_sec: 11.1
    '35':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.7757
      gen_sec: 6.64
      ref_sec: 7.62
    '36':
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.7357
      gen_sec: 3.84
      ref_sec: 3.74
    '37':
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.7735
      gen_sec: 4.0
      ref_sec: 3.94
    '38':
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7273
      gen_sec: 5.92
      ref_sec: 7.02
    '39':
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.7096
      gen_sec: 2.08
      ref_sec: 3.74
    '40':
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.742
      gen_sec: 5.6
      ref_sec: 5.94
    '41':
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.7562
      gen_sec: 3.2
      ref_sec: 3.26
    '42':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.7968
      gen_sec: 8.16
      ref_sec: 9.28
    '43':
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
        dɛ, Hom mma yɛmfa.'
      sbs: 0.8064
      gen_sec: 10.16
      ref_sec: 11.2
    '44':
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.7818
      gen_sec: 3.76
      ref_sec: 4.1
    '46':
      text: 'Na ɔsee dɛ, Tase egyen menaba no: na ɔtasee.'
      sbs: 0.7828
      gen_sec: 4.48
      ref_sec: 4.26
    '47':
      text: Ɔwo, Nyankopɔn, maa nyankom tɔɔ berdzedzeedze.
      sbs: 0.7956
      gen_sec: 4.32
      ref_sec: 3.42
    '48':
      text: Ne nda nyinara mu no woemmfi EWURADZE, hɔn egyanom Nyankopɔn no, n’ekyir dzi no ho emmfir.
      sbs: 0.7548
      gen_sec: 6.88
      ref_sec: 9.06
    '49':
      text: Na ɔdze etsifi mbasu nye anaafo mbasu no maa no.
      sbs: 0.7183
      gen_sec: 3.36
      ref_sec: 3.6
    '50':
      text: 'Na owungyam bi nnyi hɔn wu mu: Na mbom hɔn ahoɔdzen wɔ hɔ pintsinn.'
      sbs: 0.768
      gen_sec: 4.64
      ref_sec: 4.82
    '51':
      text: Woana na osiesie akonkoran n’edziban ma no.
      sbs: 0.7325
      gen_sec: 2.88
      ref_sec: 3.32
    '52':
      text: Ana ɔwo na eyɛ ha nya afonam ma gyataber.
      sbs: 0.7399
      gen_sec: 3.52
      ref_sec: 3.4
    '53':
      text: 'Mber no mu no, Siriahen Hazael sii mu kɔree, na ɔnye Gat kɔkoe, na ɔfae: na Hazael dze sii
        n’enyi do dɛ ɔrokɔfow akɔ Jerusalɛm.'
      sbs: 0.7754
      gen_sec: 11.92
      ref_sec: 13.56
    '54':
      text: Na ma w’ebufuhyew no a ɔwɔ hɛn do no mbɔ adze.
      sbs: 0.7575
      gen_sec: 3.84
      ref_sec: 3.5
    '55':
      text: na ahendzi wɔ Damaskɔs; na Siria nkaa bɛyɛ dɛ.
      sbs: 0.7705
      gen_sec: 3.76
      ref_sec: 4.32
    '56':
      text: Na wɔbɔtotɔ mfuwa wɔ asaase yi a hom ka wɔ ho dɛ, Ɔyɛ amamfo, nyimpa anaa abowa nnyi do; wɔdze
        ahyɛ Kaldeafo nsa no mu.
      sbs: 0.7981
      gen_sec: 8.88
      ref_sec: 11.26
    '57':
      text: Iyi nye Gadmba no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee, nkurow no nye no nkurobaase.
      sbs: 0.7412
      gen_sec: 7.2
      ref_sec: 9.24
    '58':
      text: 'Ɔno na yennkefi wo nkyɛn akɔ ekyir: Ma yennya nkwa, na yɛbɔbɔ wo dzin.'
      sbs: 0.7963
      gen_sec: 5.04
      ref_sec: 5.02
    '59':
      text: Na Josua dze n’enyim butuuw famu, na ɔsɔɔr no, na ɔsee no dɛ, Na mo wura ese n’akowaa dɛn?
      sbs: 0.7906
      gen_sec: 6.8
      ref_sec: 8.24
    '60':
      text: Mbrɛ aboɔdzembo kotoku a ɔhyɛ abo ntamu tse no.
      sbs: 0.7235
      gen_sec: 4.16
      ref_sec: 4.78
    '61':
      text: 'Emumuyɛfo guan wɔ aber a nyimpa biara nntaa hɔn do: Na atseneneefo dze, wɔyɛ ndam dɛ ogyata.'
      sbs: 0.7273
      gen_sec: 6.72
      ref_sec: 8.82
    '62':
      text: 'dɛ abaa a ɔhwee wo no ebu ntsi: na ɔwɔ no ndwow mu na ɔkyerben befir aba.'
      sbs: 0.7478
      gen_sec: 5.92
      ref_sec: 6.62
    '63':
      text: Mbrɛ ɔmansotwenyi sɔ aperper mu ogya ara nye no.
      sbs: 0.7727
      gen_sec: 5.84
      ref_sec: 4.5
    '64':
      text: Ana ɔwo ibotum akyekyer Aberwa na mba no n’ahoma.
      sbs: 0.7506
      gen_sec: 4.32
      ref_sec: 5.08
    '65':
      text: Na ɔatsen ne nsa, na woana na ɔbɔpon mu?
      sbs: 0.803
      gen_sec: 3.28
      ref_sec: 3.26
    '66':
      text: Na dɛtse atɔw atɔw no abɔ mu afemfam ho no?
      sbs: 0.7061
      gen_sec: 4.32
      ref_sec: 3.2
    '67':
      text: 'Nna wɔdze ntampehoma no twee Jeremia baa sor, na woyii no fii mona efiadze no mu: na Jeremia
        tsenaa aweɔmfo abangua no mu.'
      sbs: 0.7882
      gen_sec: 7.92
      ref_sec: 9.2
    '68':
      text: Ma munhu w’awerdzi wɔ hɔn do; na ɔwo na maka m’asɛm akyerɛ wo.
      sbs: 0.7811
      gen_sec: 4.16
      ref_sec: 4.5
    '70':
      text: Na Safan ba Ahikam ne nsa wɔ Jeremia afa, dɛ mma wonnyi no nnhyɛ ɔman no nsa mma wonnku no.
      sbs: 0.7718
      gen_sec: 6.88
      ref_sec: 9.6
    '71':
      text: ma aabɔsom me; na sɛ iyi dza ɔsom bo fi dza ɔyɛ huhuw no mu a.
      sbs: 0.7854
      gen_sec: 5.68
      ref_sec: 4.86
    '72':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.7545
      gen_sec: 9.28
      ref_sec: 10.92
    '73':
      text: 'Dɛ mbrɛ mframa bɔ wusiw kɔ no, dɛmara so na bɔ hɔn kɔ: Dɛ mbrɛ ihua nan wɔ gya enyim no.'
      sbs: 0.7757
      gen_sec: 6.72
      ref_sec: 7.46
    '74':
      text: Anantwisaa kuw no, ɔnye aman anantwimba no enyim.
      sbs: 0.7788
      gen_sec: 3.92
      ref_sec: 3.8
    '75':
      text: Na ɔsoɛree, na ɔnye no sianee kɔr ɔhen no nkyɛn.
      sbs: 0.7851
      gen_sec: 3.76
      ref_sec: 4.08
    '76':
      text: Na ɔwo, mo wura ɔhen, na Israel nyinara enyi da wo do dɛ ebɛkyerɛ hɔn nyia ɔbɛtsena w’ahengua
        do wɔ w’ekyir.
      sbs: 0.7881
      gen_sec: 9.12
      ref_sec: 8.88
    '77':
      text: Nna Asiriahen no dze enyimguase sanee kɔr nankasa n’asaase do.
      sbs: 0.7367
      gen_sec: 4.8
      ref_sec: 6.08
    '78':
      text: Ɔtse dɛ obi a osuo bɔdɔm n’asowa mu.
      sbs: 0.7366
      gen_sec: 3.76
      ref_sec: 3.68
    '80':
      text: 'Mbrɛ EWURADZE se nye yi: Sɛ hom ayeyɛ petsepetsee, na hom dɔɔ so mpo a.'
      sbs: 0.7574
      gen_sec: 5.52
      ref_sec: 5.56
    '81':
      text: Na ɔtsenaa ahemfo ahengua no do.
      sbs: 0.7324
      gen_sec: 2.24
      ref_sec: 3.0
    '82':
      text: Galim babaa, ma wo ndze do tsea mu!
      sbs: 0.7982
      gen_sec: 3.12
      ref_sec: 3.62
    '83':
      text: Nyia medze sar pradada no ayɛ ne fi.
      sbs: 0.7559
      gen_sec: 3.44
      ref_sec: 3.94
    '84':
      text: na hɔn a mehiahia hɔn ho no; na mebɛma osiifo no ayɛ nkaase.
      sbs: 0.7502
      gen_sec: 4.56
      ref_sec: 5.18
    '85':
      text: Na Joas yɛɛ dza ɔtsen wɔ EWURADZE enyiwa do, wɔ ne nda a ɔsɔfo Jehoiada kyerɛkyerɛɛ no wɔ
        mu nyinara.
      sbs: 0.7423
      gen_sec: 7.36
      ref_sec: 8.58
    '87':
      text: Na ɔronnhwɛ afɔrmbukyia, ne nsaano edwuma no, eso n’enyi ronnsɔ dza ne nsatseaba ayɛ, Aserim,
        anaadɛ ewia ehonyi no.
      sbs: 0.793
      gen_sec: 9.84
      ref_sec: 11.84
    '88':
      text: Sen nyimpa beesuon a wotum kyerɛkyerɛ asɛm ase.
      sbs: 0.6857
      gen_sec: 3.36
      ref_sec: 5.02
    '89':
      text: Elkosnyi Nahum n’enyido adzehu nwoma a ɔfa Ninive atsɛmbu ho.
      sbs: 0.7118
      gen_sec: 5.68
      ref_sec: 5.06
    '90':
      text: 'EWURADZE, ɔwo adom w’asaase: Ɔwo edze Jakob egyapadze asan aba.'
      sbs: 0.806
      gen_sec: 5.68
      ref_sec: 5.76
    '91':
      text: 'na medwuruw w’aban dzendzen nyina: na mubotwitwa wo mbɔnsansɛm efi wo nsamu; na innkenya
        sebramufo bio: na mubotwitwa ehonyi.'
      sbs: 0.7406
      gen_sec: 8.88
      ref_sec: 12.12
    '92':
      text: 'Emi dze memmpɛɛ ntsɛm minngyaae dɛ meyɛ oguanhwɛfo dzi w’ekyir: eso memmpɛɛ mbusu da no.'
      sbs: 0.7856
      gen_sec: 6.08
      ref_sec: 7.78
    '93':
      text: 'Nna ɔhen tse awɔwber dan no mu, wɔ bosoom a otsia akron no mu: na mbukyia mu ogya a ɔredzɛw
        taa n’enyim.'
      sbs: 0.7959
      gen_sec: 7.28
      ref_sec: 7.8
    '94':
      text: Ɔwoara nko nye Ɔsorsornyi wɔ asaase nyinara do.
      sbs: 0.8341
      gen_sec: 5.76
      ref_sec: 5.58
    '96':
      text: Aso nyia ɔyɛ nyiyiano no ɔnye Otumfo no bɛham?
      sbs: 0.758
      gen_sec: 4.0
      ref_sec: 4.1
    '97':
      text: Na Omri ne ba Ahab yɛɛ dza omuo wɔ EWURADZE enyim seen hɔn a wodzii n’enyim nyinara.
      sbs: 0.7579
      gen_sec: 5.6
      ref_sec: 6.86
    '99':
      text: Na Aser ebusuakuw mu dze, Misal, Abdon; Helkat nye Rehob nye hɔn ho mfikyisaase, nkurow anan.
      sbs: 0.7807
      gen_sec: 8.96
      ref_sec: 11.58
    '100':
      text: Mbrɛ ɔkwadwefo so da ne mpa do ara nye no.
      sbs: 0.7251
      gen_sec: 3.2
      ref_sec: 3.78
    '101':
      text: Fa hɛn san si yie, ao hɛn nkwagye Nyankopɔn.
      sbs: 0.7974
      gen_sec: 3.68
      ref_sec: 3.16
    '102':
      text: Na iyi ntsi mibehiahia David n’asefo ho, na nnyɛ daa nyina.
      sbs: 0.7578
      gen_sec: 4.32
      ref_sec: 4.88
    '103':
      text: Nna ɔhen Joas kɛfrɛɛ ɔsɔfo Jehoiada, na asɔfo nkaa no, na obisaa hɔn dɛ, Ɔyɛ dɛn ntsi na hom
        mmpempaam ofi no n’agow no yi?
      sbs: 0.7605
      gen_sec: 10.16
      ref_sec: 12.62
    '104':
      text: 'Nyia ɔkata ne mbrato do no, ɔnnkɛyɛ prɔmprɔm: Na obiara a ɔka to gua na ɔpow no, obenya ehumbɔbɔr.'
      sbs: 0.7667
      gen_sec: 8.08
      ref_sec: 8.0
    '106':
      text: Ana woeyi wu no mbobotsen no akyerɛ wo?
      sbs: 0.7196
      gen_sec: 3.04
      ref_sec: 3.66
    '107':
      text: 'Ɔhen dze atsɛmbu ma asaase gyina: Na nyia odzi mboaba no, obutuw no.'
      sbs: 0.7468
      gen_sec: 5.44
      ref_sec: 7.18
    '108':
      text: Ana akɛhɛn esukwankyɛba no korabea.
      sbs: 0.7232
      gen_sec: 2.64
      ref_sec: 3.26
    '109':
      text: Na wɔbɛkaa asɛm yi kyerɛɛ ɔhen no.
      sbs: 0.7135
      gen_sec: 2.88
      ref_sec: 3.68
    '110':
      text: 'na etsetsɛw mu enyame ananaben: mpo sɛ wo ntsɛwee da no ara mu ema ofifir.'
      sbs: 0.7672
      gen_sec: 5.84
      ref_sec: 7.28
    '112':
      text: Mbrɛ enyidzi so mmfata ɔkwasea ara nye no.
      sbs: 0.7829
      gen_sec: 5.44
      ref_sec: 3.3
    '114':
      text: Mbrɛ EWURADZE se nye yi, Wɔdze kurow yi bɛhyɛ Babilɔnhen no dɔm nsa ara ampa, na wɔagye.
      sbs: 0.8176
      gen_sec: 6.88
      ref_sec: 7.48
    '115':
      text: Nokwar befi asaase mu efir; Na tsenenee efi sor ahwɛ famu.
      sbs: 0.7527
      gen_sec: 4.72
      ref_sec: 4.88
    '116':
      text: Na EWURADZE maa ɔtamfo bi soɛree tsiaa Solomon, Edomnyi Hadad a ofi ɔhen n’asefo mu wɔ Edom
        no a.
      sbs: 0.7417
      gen_sec: 7.36
      ref_sec: 9.54
    '117':
      text: Ebɛn asɛm na wɔdze bobua amanaman asomafo no?
      sbs: 0.8053
      gen_sec: 3.76
      ref_sec: 3.62
    '118':
      text: Na asafohen no bo fuuw Jeremia, na wɔhwee no, na wɔdze no kɔtoo efiadze wɔ ɔkyerɛwfo Jonatan
        fie; nna hɔ na wɔdze ayɛ efiadze.
      sbs: 0.7975
      gen_sec: 10.24
      ref_sec: 10.5
    '119':
      text: Dɛ gyama abaa bi him nyia ɔma do no do.
      sbs: 0.7432
      gen_sec: 3.36
      ref_sec: 3.2
    '120':
      text: 'dɛ gyatafɔr wɔ nguan ekuwekuw mu: ɔno a sɛ ɔhɛn mu a, otsiatsia do.'
      sbs: 0.7592
      gen_sec: 5.44
      ref_sec: 5.98
    '122':
      text: Hwɛ, aber a ɔwo nye ɔhen da ho rekasa wɔ hɔ no, mo so mibedzi w’ekyir maba, na mabɛhyɛ wo
        nsɛm no ma.
      sbs: 0.7554
      gen_sec: 7.44
      ref_sec: 9.42
    '123':
      text: Ɔbabanyin na ɔdɔba kor ma me na na m’egya no.
      sbs: 0.7361
      gen_sec: 3.6
      ref_sec: 5.46
    '124':
      text: 'Ao Nyankopɔn kyerɛ w’ahoɔdzen: Kyerɛ wo tum, Ao Nyankopɔn, dza edze agye hɛn no.'
      sbs: 0.7999
      gen_sec: 6.0
      ref_sec: 7.24
    '125':
      text: Nna wogyaa dɛ wɔnye no kasa; osiandɛ woennhu asɛm no.
      sbs: 0.7993
      gen_sec: 3.84
      ref_sec: 3.92
    '126':
      text: Afei Ahija no nkɔdaayɛ ntsi n’enyiwa ayɛ kusukusu na onnhu adze.
      sbs: 0.7272
      gen_sec: 4.96
      ref_sec: 6.98
    '127':
      text: Na Hilkia buae see ɔkyerɛwfo Safan dɛ, Mehu mbra nwoma no wɔ EWURADZE fie.
      sbs: 0.7673
      gen_sec: 7.12
      ref_sec: 8.0
    '128':
      text: Na boka afamu he nye Nkyen Po no, mekyerɛ ɔdze kodu Jordan ewiei.
      sbs: 0.7332
      gen_sec: 5.2
      ref_sec: 6.62
    '129':
      text: 'Tappua asaase no yɛ Manaasɛ dze: na Tappua a ɔwɔ Manaasɛ he do no dze ɔyɛ Efraimmba no dze.'
      sbs: 0.7562
      gen_sec: 6.96
      ref_sec: 8.34
    '130':
      text: Wotwa mu wɔ Nyinsu bɔnsa no mu a wɔdan no bea a mbasu wɔ; Nyew, adɔwnsu dze nhyira kata do.
      sbs: 0.7658
      gen_sec: 7.84
      ref_sec: 8.24
    '131':
      text: 'Na wɔnkyɛ mu kyɛpɛn esuon: Juda ntsena ne he do wɔ kwaamu afamu.'
      sbs: 0.7323
      gen_sec: 4.96
      ref_sec: 6.72
    '132':
      text: 'Naaso wo nda mu dze merennyɛ, osian w’egya David ntsi: na mbom mebɛtsew efi wo ba nsamu.'
      sbs: 0.7544
      gen_sec: 7.12
      ref_sec: 6.76
    '133':
      text: 'Nyia ɔtwer nankasa n’akoma no, ɔkwasea a: Na obiara a ɔnantsew nyansa mu no dze, wɔbɛgye
        no nkwa.'
      sbs: 0.7633
      gen_sec: 7.36
      ref_sec: 8.76
    '134':
      text: Nyia ɔsoɛr anapahema dze ndze kɛse hyira ne nyɛnko no.
      sbs: 0.7261
      gen_sec: 4.24
      ref_sec: 4.7
    '135':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.7899
      gen_sec: 3.6
      ref_sec: 3.18
    '136':
      text: Na ofi hɔ fowee kɔr Debir a nkan no na ne dzin nye Kiriat-Sefer no do.
      sbs: 0.7425
      gen_sec: 5.52
      ref_sec: 9.1
    '137':
      text: Hwɛ, menye wo enya, ɔwo a etse bɔnsa mu e.
      sbs: 0.8223
      gen_sec: 4.4
      ref_sec: 3.4
    '138':
      text: Nna Jeremia see Zedekia dɛ, Aso mepaa mu ka kyerɛ wo a, ana nnyɛ oku ara na woboku me bi?
      sbs: 0.8049
      gen_sec: 8.88
      ref_sec: 7.18
    '139':
      text: Dɛm ntsi afei hom nyiyi Israel ebusuakuw ebusuakuw mu mbanyin duebien, ebusuakuw biara mu
        nyimpa baako.
      sbs: 0.7694
      gen_sec: 8.72
      ref_sec: 9.46
    '140':
      text: Afei, me Nyankopɔn, meserɛ wo, bue w’enyiwa, na kyɛn w’aso wɔ mpaabɔ a wɔbɔ wɔ ha yi do.
      sbs: 0.7879
      gen_sec: 7.6
      ref_sec: 8.14
    '141':
      text: Otwitwa nankasa ne nan, na ɔnom mbusu.
      sbs: 0.7644
      gen_sec: 3.28
      ref_sec: 3.48
    '142':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.7051
      gen_sec: 3.28
      ref_sec: 4.2
    '143':
      text: 'Na Solomon kɔr ne nsamankyir, na wosiee no wɔ n’egya David kurow mu: na ne ba Rehoboam dzii
        hen wɔ n’ananmu.'
      sbs: 0.736
      gen_sec: 8.08
      ref_sec: 11.3
    '145':
      text: Dadze sew dadze ano; Dɛmara so na nyimpa sew ne nyɛnko enyim.
      sbs: 0.7473
      gen_sec: 5.44
      ref_sec: 4.94
    '147':
      text: Afei Zimri no ho nsɛm nkaa no na no nkontompɔ a otwae no, ana wɔnnkyerɛɛw no wɔ Israel ahemfo
        hɔn Mbermunsɛm nwoma no mu?
      sbs: 0.7515
      gen_sec: 10.72
      ref_sec: 11.44
    '148':
      text: Na ɔhwɛɛ ahemfo no nyinara do dze fi Esutsen no ho araa dze kodur Filistiafo asaase do, na
        Egypt ahe do.
      sbs: 0.7357
      gen_sec: 7.84
      ref_sec: 10.56
    '149':
      text: EWURADZE tse ase yi; nna amanaman bɛyɛ esiarfo wɔ no mu.
      sbs: 0.8017
      gen_sec: 4.4
      ref_sec: 3.4
    '150':
      text: 'Dɔm ahemfo guanguan, woguanguan: Na nyia ɔtse fie na ɔkyɛ asadze mu.'
      sbs: 0.7826
      gen_sec: 8.24
      ref_sec: 5.42
    '151':
      text: Ama wo mbɔdɔm tɛkyerɛma eenya ne kyɛpɛn wɔ w’atamfo ho.
      sbs: 0.781
      gen_sec: 4.56
      ref_sec: 3.56
    '152':
      text: Ntsi migyaa hɔn ma wodzii hɔn akomadzen ekyir.
      sbs: 0.747
      gen_sec: 3.52
      ref_sec: 3.26
    '153':
      text: 'Na ɔsee dɛ, Bue boka afamu tokura no: na obuei.'
      sbs: 0.785
      gen_sec: 4.8
      ref_sec: 4.9
    '154':
      text: Na sɛ hom ayɛ dɛ nsoɛ kantankantan, na hom afɔw takaa wɔ hom nsanom mu mpo a.
      sbs: 0.7033
      gen_sec: 6.24
      ref_sec: 6.02
    '155':
      text: Aber a obui faa do, dɛ gyama ofi yafun mu rupue no; Aber a medze mununkum yɛɛ n’akataho.
      sbs: 0.7399
      gen_sec: 7.2
      ref_sec: 7.58
    '156':
      text: Aso emumuyɛ akoradze wɔ emumuyɛ fi no mu.
      sbs: 0.7367
      gen_sec: 3.12
      ref_sec: 3.2
    '157':
      text: Na Reubenmba no hɔn he nye Jordan, nye ne he.
      sbs: 0.7506
      gen_sec: 3.68
      ref_sec: 3.22
    '158':
      text: Na, hwɛ, mber a ɔda ho nye ɔhen no rekasa no, nkɔnhyɛnyi Natan bae.
      sbs: 0.7674
      gen_sec: 5.44
      ref_sec: 5.62
    '159':
      text: Afei hwɛ esuson a meyɛɛ no kaa wo ho no; Odzi efuw dɛ nantwi.
      sbs: 0.7348
      gen_sec: 5.6
      ref_sec: 4.92
    '160':
      text: Israelhen Joahaz ne ba Jehoas n’afe a otsia ebien no mu nna Amazia, Judahen Joas ne ba no,
        hyɛɛ ase dzii hen.
      sbs: 0.7407
      gen_sec: 10.0
      ref_sec: 11.84
    '162':
      text: Dɛm ntsi afei mma hom nngyegye sika wɔ hom amanyimfo hɔ bio, na hom nyi mma ma wɔmfa mpempam
        ofi no n’agow no.
      sbs: 0.718
      gen_sec: 8.64
      ref_sec: 11.32
    '163':
      text: 'Hom mper ngye abɔbɔfo na ehiafo: Hom nhwim hɔn mfi nyimpa bɔn no nsamu.'
      sbs: 0.7825
      gen_sec: 5.36
      ref_sec: 5.7
    '164':
      text: Dɛmara so na abɔbɔfo do ɔhen tsirmɔdzennyi tse.
      sbs: 0.7346
      gen_sec: 4.0
      ref_sec: 3.38
    '165':
      text: Na ɔyɛɛ dza ɔtsen wɔ EWURADZE n’enyiwa do, na ɔnantseew n’egya David n’akwan do, na ɔanndan
        ammfa nkyɛn annkɔ enyimfa anaa abankum.
      sbs: 0.7527
      gen_sec: 8.72
      ref_sec: 11.16
    '166':
      text: Mbrɛ Jeremia tsenaa aweɔmfo abangua no mu nye no.
      sbs: 0.7848
      gen_sec: 4.4
      ref_sec: 5.58
    '167':
      text: na ɔdze n’abasa bubu mbɛtsem no; ɔbɛyɛ dɛ aber a obi ridzi mbɛtsem mpɛpɛw.
      sbs: 0.776
      gen_sec: 6.16
      ref_sec: 6.22
    '168':
      text: Ana ofitsi dɛ wo nda hyɛɛ ase yi ahyɛ anapa do pɛn.
      sbs: 0.7447
      gen_sec: 3.76
      ref_sec: 4.84
    '169':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.772
      gen_sec: 9.76
      ref_sec: 10.92
    '170':
      text: Ngyanka hɔn egya, na ekunafo hɔn sɛndzifo.
      sbs: 0.7717
      gen_sec: 3.6
      ref_sec: 3.42
    '171':
      text: Asɔfo No Hyɛ Hɔn Dwumadzi Ase.
      sbs: 0.702
      gen_sec: 2.64
      ref_sec: 3.66
    '172':
      text: na Memfis banodzifo adwen efura mu; na hɔn a wɔyɛ no mbusuakuw kutuwdo bo no.
      sbs: 0.7755
      gen_sec: 6.16
      ref_sec: 7.5
    '173':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.7889
      gen_sec: 9.12
      ref_sec: 9.28
    '174':
      text: 'Obu mpɔtsibaa dɛ mburonan: Ɔserew nkambaa no huuyɛ.'
      sbs: 0.747
      gen_sec: 5.2
      ref_sec: 5.28
    '175':
      text: Nyew, dɛ mbrɛ gyata no pɔw, na gyata bɔyafo ne ndze.
      sbs: 0.7604
      gen_sec: 4.24
      ref_sec: 5.48
    '176':
      text: Afei nna ɔhen David ayɛ akɔdaa a oedzi mfe pii; ɔwɔ mu dɛ wɔdze atam kataa no do, naaso no
        ho annyɛ no hyew.
      sbs: 0.7612
      gen_sec: 8.96
      ref_sec: 9.2
    '177':
      text: 'Enyena sa a, ogya dum: Na bɔtomkɛka nnyi hɔ a, mansotwe gyaa.'
      sbs: 0.7547
      gen_sec: 5.12
      ref_sec: 6.04
    '178':
      text: Na Ahija tae suoo atar fofor a ɔhyɛ no no mu, na ɔtsetseew mu esinesin duebien.
      sbs: 0.7465
      gen_sec: 7.52
      ref_sec: 7.34
    '180':
      text: Me bepɔw a ewɔ wiramu, medze w’ahodze na w’akoradze nyina bɛma ma wɔaafom afa, na wo nsorɔnsorɔmbea
        no, wɔ bɔn ntsi, wɔ w’ahe nyinara do.
      sbs: 0.8058
      gen_sec: 10.56
      ref_sec: 11.4
    '181':
      text: Kaansa enyitan dze ndaadaa kata noho mpo a.
      sbs: 0.7036
      gen_sec: 3.04
      ref_sec: 3.78
    '182':
      text: 'Ɔtwerɛw bɔnsa mu, na odzi ehurusi wɔ n’ahoɔdzen mu: Opue kehyia akofo a woemia.'
      sbs: 0.7548
      gen_sec: 6.24
      ref_sec: 6.46
    '183':
      text: EWURADZE na ɔse; hom a hom ka dɛ, Woana botum esian aba hɛn do?
      sbs: 0.8044
      gen_sec: 5.28
      ref_sec: 4.62
    '184':
      text: Anaadɛ nyia ɔda hɛn mu frankadua etsifi.
      sbs: 0.7064
      gen_sec: 3.12
      ref_sec: 3.92
    '185':
      text: dɛ mbrɛ ɔsabokwafo tɔ ntentan wɔ ne fe mu.
      sbs: 0.7636
      gen_sec: 3.2
      ref_sec: 3.76
    '186':
      text: 'Na ɔsee Israelhen no dɛ, Fa wo nsa to egyen no do: na ɔdze ne nsa too do.'
      sbs: 0.7847
      gen_sec: 5.36
      ref_sec: 7.32
    '187':
      text: Na ɔbaa dɛ, aber a wowiee ɔman no nyinara twatsia twitwa no, wɔtsenatsenaa hɔn ananmu wɔ nseraban
        no mu ma wɔtsee apɔw ana.
      sbs: 0.7555
      gen_sec: 9.28
      ref_sec: 12.36
    '188':
      text: Makasa prɛko, na murummbua; Nyew, mprɛnu, na moronnkɔ kan bio.
      sbs: 0.7843
      gen_sec: 7.12
      ref_sec: 5.84
    '189':
      text: 'Wo mboanofo tsenaa mu: Ɔwo, Nyankopɔn, na isiesiee abɔbɔfo wɔ w’ayamuyie mu.'
      sbs: 0.796
      gen_sec: 6.48
      ref_sec: 6.3
    '190':
      text: Na Juda mbapɔmba tsee ndzɛmba yinom no, wofii ahemfie fowee baa EWURADZE fie ɔponkɛse fofor
        no ano.
      sbs: 0.7851
      gen_sec: 7.2
      ref_sec: 7.82
    '192':
      text: Nna Farao see no dɛ, Na ebɛnadze na ehia no wɔ me nkyɛn, ma erohwehwɛ dɛ ekɔ wankasa wo man
        mu yi?
      sbs: 0.7651
      gen_sec: 7.28
      ref_sec: 7.9
    '193':
      text: 'Nna wɔfaa Jeremia, na wɔkotoow no kyeen ɔhenba Malkia mona efiadze a ɔwɔ aweɔmfo abanguado
        no mu: na wɔdze ntampehoma gyaagyaa Jeremia siaan mu.'
      sbs: 0.7885
      gen_sec: 10.16
      ref_sec: 12.34
    '194':
      text: Wɔse dɛ, Hom mbra ma yenkruw hɔn ase ma wongyaa dɛ wɔbɛyɛ ɔman; Ama wɔnnkɛkaa Israel dzin
        bio.
      sbs: 0.7896
      gen_sec: 7.6
      ref_sec: 8.02
    '195':
      text: 'Na ɔfowee kɔr ne nkyɛn: na, hwɛ, ɔtse koko no n’etsifi.'
      sbs: 0.7857
      gen_sec: 4.96
      ref_sec: 4.84
    '196':
      text: 'Na wobuaa dɛ, Ahazia no nuanom nye hɛn: na yerisian akɔ ekekyiakyia ɔhen ne mba, na ɔhembaa
        ne mba no.'
      sbs: 0.7631
      gen_sec: 8.08
      ref_sec: 10.94
    '198':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.8143
      gen_sec: 6.48
      ref_sec: 5.64
    '199':
      text: Na Sallum, a ofi Kore, Ebiasaf, na Kora asefo no mu, na no nuanom a wofi n’egya fie.
      sbs: 0.77
      gen_sec: 8.56
      ref_sec: 8.82
    '200':
      text: bɛba dɔm EWURADZE ne dzin tsenabea, bepɔw Zion no do.
      sbs: 0.7831
      gen_sec: 3.92
      ref_sec: 6.32
    '201':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.7118
      gen_sec: 3.44
      ref_sec: 4.2
    '202':
      text: Hɔn a wɔdan wo gya nyina enyi bɔto; hɔn a wofi wo nkyɛn kɔ no, wɔbɛkyerɛw hɔn edzin aka asaase
        ase mba ho.
      sbs: 0.7881
      gen_sec: 7.12
      ref_sec: 8.28
    '203':
      text: Na Adonija n’aponto asefo no nyinara suroi, na wɔsoɛrsoɛree na nyimpa biara faa no kwan kɔree.
      sbs: 0.7433
      gen_sec: 7.12
      ref_sec: 8.48
    '204':
      text: Hom nka nkyerɛ amanaman dɛ wɔreba; hom mma wɔntse no Jerusalɛm.
      sbs: 0.7938
      gen_sec: 4.0
      ref_sec: 4.18
    '205':
      text: sɛ wosi frankaa wɔ mbepɔw do a, hom nhwɛ; na sɛ wɔbɔ akasamu mu a, hom ntsie.
      sbs: 0.7974
      gen_sec: 6.48
      ref_sec: 5.46
    '207':
      text: Na Kohatmba nkaa no nam tontotwe do nyae fii Efraim, Dan, nye Manaasɛ ebusuakuw fa no mu nkurow
        du.
      sbs: 0.7558
      gen_sec: 9.28
      ref_sec: 10.62
    '208':
      text: Iyi nye Benjaminmba no egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7823
      gen_sec: 8.08
      ref_sec: 7.22
    '209':
      text: Na ɔkaa Israelmba mu ebusuakuw esuon a wonnyae nnkyɛɛ hɔn egyapadze.
      sbs: 0.7267
      gen_sec: 5.2
      ref_sec: 5.76
    '210':
      text: Afei Solomon n’edwuma nyinara wosiesiei maa da a wɔtoow EWURADZE ne dan no ne fapem, na okodur
        dɛ wowiei.
      sbs: 0.7576
      gen_sec: 8.88
      ref_sec: 9.0
    '211':
      text: dɛmara so na wobotwitwa hom egu, na hom etwa mu akɔ.
      sbs: 0.756
      gen_sec: 4.24
      ref_sec: 3.46
    '213':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.7733
      gen_sec: 7.44
      ref_sec: 7.62
    '214':
      text: na ɔmaa ahendzi hihimii no nye yi; nyia ɔmaa wiadze yi yɛɛ dɛ sar.
      sbs: 0.7958
      gen_sec: 4.88
      ref_sec: 5.48
    '215':
      text: nye w’ayeforber mu dɔ no ma wo; mbrɛ idzii m’ekyir wɔ sar no do.
      sbs: 0.7782
      gen_sec: 4.96
      ref_sec: 4.9
    '216':
      text: 'Wɔdze ogya ahyew no, woetwa ato famu: W’enyim nkaenyim ntsi wɔasɛɛ.'
      sbs: 0.7877
      gen_sec: 5.12
      ref_sec: 4.74
    '217':
      text: Na aber a Seba ɔhembaa no tsee Solomon ne nka wɔ EWURADZE ne dzin ho no, ɔbaa dɛ ɔdze nsɛmbisa
        dzendzen robɔsɔ no ahwɛ.
      sbs: 0.7423
      gen_sec: 9.6
      ref_sec: 7.86
    '218':
      text: Na wɔdze afona anomu kunkum hɔn; na brampafo na asafohemfo no totoow hɔn gui, na wosii mu
        kɔr Baal fie kurow no mu.
      sbs: 0.7468
      gen_sec: 8.72
      ref_sec: 10.54
    '219':
      text: Naaso ɔpoow nkɔdaa no hɔn afotu a wɔdze maa no no, na ɔnye mberantsɛ a wɔnye no nyinii a afei
        wɔabɛyɛ n’apamfo no no dwenee.
      sbs: 0.7537
      gen_sec: 10.0
      ref_sec: 11.92
    '220':
      text: 'Ɔwo edze hɛn yɛ aperdzi ma hɛn asɔnmufo: Na hɛn atamfo sereserew wɔ hɔnara hɔn mu.'
      sbs: 0.7789
      gen_sec: 6.72
      ref_sec: 7.6
    '221':
      text: anaadɛ poma bɛma nyia ɔnnyɛ dua no no do.
      sbs: 0.7584
      gen_sec: 3.28
      ref_sec: 3.34
    '222':
      text: 'Na asɛm yi maa wɔyɛɛ bɔn: osiandɛ ɔman no kɔree kɔsoom hɔn wɔ Bɛtɛl araa dze kɔr Dan.'
      sbs: 0.7783
      gen_sec: 8.0
      ref_sec: 7.32
    '223':
      text: Obeyi wo wɔ ahohia esia mu; Nyew, dza otsia esuon no mu mpo mbusu bi rennka wo.
      sbs: 0.7611
      gen_sec: 7.2
      ref_sec: 7.56
    '225':
      text: Nna Atalia tsetseew ne ntar mu, na ɔkekaa mu dɛ, Etuatsew o, iyi yɛ etuatsew.
      sbs: 0.7623
      gen_sec: 7.36
      ref_sec: 6.74
    '226':
      text: Woana na ɔwɔ enyiwa a ayɛ kɔɔ?
      sbs: 0.7124
      gen_sec: 2.24
      ref_sec: 3.68
  score: 0.7619
  partial: true
- model: ghananlpcommunity/ghana-tts-72k-ref
  sbs: 0.7627
  num_scored: 200
  uses_reference: true
  entries:
    '0':
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.7513
      gen_sec: 6.96
      ref_sec: 9.1
    '1':
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.7723
      gen_sec: 3.92
      ref_sec: 3.66
    '3':
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.7484
      gen_sec: 5.68
      ref_sec: 6.36
    '5':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.7719
      gen_sec: 3.2
      ref_sec: 3.18
    '6':
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.7772
      gen_sec: 8.0
      ref_sec: 9.12
    '7':
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.7952
      gen_sec: 7.36
      ref_sec: 7.44
    '8':
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.7809
      gen_sec: 4.96
      ref_sec: 4.88
    '9':
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.802
      gen_sec: 6.96
      ref_sec: 6.16
    '10':
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.7629
      gen_sec: 8.4
      ref_sec: 8.48
    '11':
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.7933
      gen_sec: 7.44
      ref_sec: 6.68
    '12':
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.7916
      gen_sec: 10.24
      ref_sec: 10.5
    '13':
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.7631
      gen_sec: 5.6
      ref_sec: 6.38
    '14':
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.7215
      gen_sec: 3.6
      ref_sec: 4.1
    '15':
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7382
      gen_sec: 6.56
      ref_sec: 6.76
    '16':
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.7328
      gen_sec: 6.72
      ref_sec: 8.48
    '19':
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.7773
      gen_sec: 2.32
      ref_sec: 3.16
    '20':
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.7858
      gen_sec: 5.36
      ref_sec: 4.36
    '22':
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.7269
      gen_sec: 4.08
      ref_sec: 3.74
    '23':
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.7209
      gen_sec: 8.16
      ref_sec: 10.44
    '24':
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.7486
      gen_sec: 7.36
      ref_sec: 8.26
    '26':
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.7873
      gen_sec: 4.4
      ref_sec: 5.0
    '27':
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7276
      gen_sec: 6.32
      ref_sec: 7.04
    '28':
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.7417
      gen_sec: 7.68
      ref_sec: 9.74
    '29':
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.779
      gen_sec: 4.88
      ref_sec: 4.34
    '30':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.8165
      gen_sec: 6.4
      ref_sec: 5.64
    '32':
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.6905
      gen_sec: 3.92
      ref_sec: 3.54
    '33':
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.734
      gen_sec: 8.96
      ref_sec: 11.1
    '35':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.7833
      gen_sec: 7.2
      ref_sec: 7.62
    '36':
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.7119
      gen_sec: 3.28
      ref_sec: 3.74
    '37':
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.7864
      gen_sec: 4.16
      ref_sec: 3.94
    '38':
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7545
      gen_sec: 5.84
      ref_sec: 7.02
    '39':
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.7401
      gen_sec: 2.08
      ref_sec: 3.74
    '40':
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.7449
      gen_sec: 6.32
      ref_sec: 5.94
    '41':
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.7418
      gen_sec: 2.96
      ref_sec: 3.26
    '42':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.7969
      gen_sec: 8.64
      ref_sec: 9.28
    '43':
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
        dɛ, Hom mma yɛmfa.'
      sbs: 0.7837
      gen_sec: 9.76
      ref_sec: 11.2
    '44':
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.7557
      gen_sec: 3.2
      ref_sec: 4.1
    '46':
      text: 'Na ɔsee dɛ, Tase egyen menaba no: na ɔtasee.'
      sbs: 0.8011
      gen_sec: 4.48
      ref_sec: 4.26
    '47':
      text: Ɔwo, Nyankopɔn, maa nyankom tɔɔ berdzedzeedze.
      sbs: 0.7855
      gen_sec: 3.68
      ref_sec: 3.42
    '48':
      text: Ne nda nyinara mu no woemmfi EWURADZE, hɔn egyanom Nyankopɔn no, n’ekyir dzi no ho emmfir.
      sbs: 0.7474
      gen_sec: 6.64
      ref_sec: 9.06
    '49':
      text: Na ɔdze etsifi mbasu nye anaafo mbasu no maa no.
      sbs: 0.7219
      gen_sec: 3.76
      ref_sec: 3.6
    '50':
      text: 'Na owungyam bi nnyi hɔn wu mu: Na mbom hɔn ahoɔdzen wɔ hɔ pintsinn.'
      sbs: 0.7939
      gen_sec: 4.64
      ref_sec: 4.82
    '51':
      text: Woana na osiesie akonkoran n’edziban ma no.
      sbs: 0.737
      gen_sec: 2.96
      ref_sec: 3.32
    '52':
      text: Ana ɔwo na eyɛ ha nya afonam ma gyataber.
      sbs: 0.7521
      gen_sec: 4.88
      ref_sec: 3.4
    '53':
      text: 'Mber no mu no, Siriahen Hazael sii mu kɔree, na ɔnye Gat kɔkoe, na ɔfae: na Hazael dze sii
        n’enyi do dɛ ɔrokɔfow akɔ Jerusalɛm.'
      sbs: 0.7631
      gen_sec: 11.92
      ref_sec: 13.56
    '54':
      text: Na ma w’ebufuhyew no a ɔwɔ hɛn do no mbɔ adze.
      sbs: 0.7703
      gen_sec: 4.16
      ref_sec: 3.5
    '55':
      text: na ahendzi wɔ Damaskɔs; na Siria nkaa bɛyɛ dɛ.
      sbs: 0.7785
      gen_sec: 3.84
      ref_sec: 4.32
    '56':
      text: Na wɔbɔtotɔ mfuwa wɔ asaase yi a hom ka wɔ ho dɛ, Ɔyɛ amamfo, nyimpa anaa abowa nnyi do; wɔdze
        ahyɛ Kaldeafo nsa no mu.
      sbs: 0.8078
      gen_sec: 9.36
      ref_sec: 11.26
    '57':
      text: Iyi nye Gadmba no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee, nkurow no nye no nkurobaase.
      sbs: 0.7483
      gen_sec: 6.8
      ref_sec: 9.24
    '58':
      text: 'Ɔno na yennkefi wo nkyɛn akɔ ekyir: Ma yennya nkwa, na yɛbɔbɔ wo dzin.'
      sbs: 0.7987
      gen_sec: 5.2
      ref_sec: 5.02
    '59':
      text: Na Josua dze n’enyim butuuw famu, na ɔsɔɔr no, na ɔsee no dɛ, Na mo wura ese n’akowaa dɛn?
      sbs: 0.7853
      gen_sec: 7.12
      ref_sec: 8.24
    '60':
      text: Mbrɛ aboɔdzembo kotoku a ɔhyɛ abo ntamu tse no.
      sbs: 0.7224
      gen_sec: 4.0
      ref_sec: 4.78
    '61':
      text: 'Emumuyɛfo guan wɔ aber a nyimpa biara nntaa hɔn do: Na atseneneefo dze, wɔyɛ ndam dɛ ogyata.'
      sbs: 0.7357
      gen_sec: 7.76
      ref_sec: 8.82
    '62':
      text: 'dɛ abaa a ɔhwee wo no ebu ntsi: na ɔwɔ no ndwow mu na ɔkyerben befir aba.'
      sbs: 0.784
      gen_sec: 6.24
      ref_sec: 6.62
    '63':
      text: Mbrɛ ɔmansotwenyi sɔ aperper mu ogya ara nye no.
      sbs: 0.7316
      gen_sec: 3.76
      ref_sec: 4.5
    '64':
      text: Ana ɔwo ibotum akyekyer Aberwa na mba no n’ahoma.
      sbs: 0.728
      gen_sec: 3.92
      ref_sec: 5.08
    '65':
      text: Na ɔatsen ne nsa, na woana na ɔbɔpon mu?
      sbs: 0.8198
      gen_sec: 3.44
      ref_sec: 3.26
    '66':
      text: Na dɛtse atɔw atɔw no abɔ mu afemfam ho no?
      sbs: 0.6884
      gen_sec: 3.28
      ref_sec: 3.2
    '67':
      text: 'Nna wɔdze ntampehoma no twee Jeremia baa sor, na woyii no fii mona efiadze no mu: na Jeremia
        tsenaa aweɔmfo abangua no mu.'
      sbs: 0.7818
      gen_sec: 8.08
      ref_sec: 9.2
    '68':
      text: Ma munhu w’awerdzi wɔ hɔn do; na ɔwo na maka m’asɛm akyerɛ wo.
      sbs: 0.7898
      gen_sec: 4.24
      ref_sec: 4.5
    '70':
      text: Na Safan ba Ahikam ne nsa wɔ Jeremia afa, dɛ mma wonnyi no nnhyɛ ɔman no nsa mma wonnku no.
      sbs: 0.8046
      gen_sec: 8.32
      ref_sec: 9.6
    '71':
      text: ma aabɔsom me; na sɛ iyi dza ɔsom bo fi dza ɔyɛ huhuw no mu a.
      sbs: 0.7885
      gen_sec: 5.36
      ref_sec: 4.86
    '72':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.7515
      gen_sec: 8.48
      ref_sec: 10.92
    '73':
      text: 'Dɛ mbrɛ mframa bɔ wusiw kɔ no, dɛmara so na bɔ hɔn kɔ: Dɛ mbrɛ ihua nan wɔ gya enyim no.'
      sbs: 0.8005
      gen_sec: 6.72
      ref_sec: 7.46
    '74':
      text: Anantwisaa kuw no, ɔnye aman anantwimba no enyim.
      sbs: 0.7659
      gen_sec: 3.44
      ref_sec: 3.8
    '75':
      text: Na ɔsoɛree, na ɔnye no sianee kɔr ɔhen no nkyɛn.
      sbs: 0.802
      gen_sec: 5.12
      ref_sec: 4.08
    '76':
      text: Na ɔwo, mo wura ɔhen, na Israel nyinara enyi da wo do dɛ ebɛkyerɛ hɔn nyia ɔbɛtsena w’ahengua
        do wɔ w’ekyir.
      sbs: 0.7719
      gen_sec: 8.08
      ref_sec: 8.88
    '77':
      text: Nna Asiriahen no dze enyimguase sanee kɔr nankasa n’asaase do.
      sbs: 0.7016
      gen_sec: 4.4
      ref_sec: 6.08
    '78':
      text: Ɔtse dɛ obi a osuo bɔdɔm n’asowa mu.
      sbs: 0.7182
      gen_sec: 2.8
      ref_sec: 3.68
    '80':
      text: 'Mbrɛ EWURADZE se nye yi: Sɛ hom ayeyɛ petsepetsee, na hom dɔɔ so mpo a.'
      sbs: 0.7333
      gen_sec: 5.44
      ref_sec: 5.56
    '81':
      text: Na ɔtsenaa ahemfo ahengua no do.
      sbs: 0.7269
      gen_sec: 2.64
      ref_sec: 3.0
    '82':
      text: Galim babaa, ma wo ndze do tsea mu!
      sbs: 0.8036
      gen_sec: 3.28
      ref_sec: 3.62
    '83':
      text: Nyia medze sar pradada no ayɛ ne fi.
      sbs: 0.7257
      gen_sec: 2.64
      ref_sec: 3.94
    '84':
      text: na hɔn a mehiahia hɔn ho no; na mebɛma osiifo no ayɛ nkaase.
      sbs: 0.7504
      gen_sec: 4.48
      ref_sec: 5.18
    '85':
      text: Na Joas yɛɛ dza ɔtsen wɔ EWURADZE enyiwa do, wɔ ne nda a ɔsɔfo Jehoiada kyerɛkyerɛɛ no wɔ
        mu nyinara.
      sbs: 0.7369
      gen_sec: 6.88
      ref_sec: 8.58
    '87':
      text: Na ɔronnhwɛ afɔrmbukyia, ne nsaano edwuma no, eso n’enyi ronnsɔ dza ne nsatseaba ayɛ, Aserim,
        anaadɛ ewia ehonyi no.
      sbs: 0.7955
      gen_sec: 10.16
      ref_sec: 11.84
    '88':
      text: Sen nyimpa beesuon a wotum kyerɛkyerɛ asɛm ase.
      sbs: 0.7092
      gen_sec: 3.44
      ref_sec: 5.02
    '89':
      text: Elkosnyi Nahum n’enyido adzehu nwoma a ɔfa Ninive atsɛmbu ho.
      sbs: 0.7096
      gen_sec: 6.24
      ref_sec: 5.06
    '90':
      text: 'EWURADZE, ɔwo adom w’asaase: Ɔwo edze Jakob egyapadze asan aba.'
      sbs: 0.7926
      gen_sec: 5.76
      ref_sec: 5.76
    '91':
      text: 'na medwuruw w’aban dzendzen nyina: na mubotwitwa wo mbɔnsansɛm efi wo nsamu; na innkenya
        sebramufo bio: na mubotwitwa ehonyi.'
      sbs: 0.7477
      gen_sec: 8.4
      ref_sec: 12.12
    '92':
      text: 'Emi dze memmpɛɛ ntsɛm minngyaae dɛ meyɛ oguanhwɛfo dzi w’ekyir: eso memmpɛɛ mbusu da no.'
      sbs: 0.7886
      gen_sec: 6.08
      ref_sec: 7.78
    '93':
      text: 'Nna ɔhen tse awɔwber dan no mu, wɔ bosoom a otsia akron no mu: na mbukyia mu ogya a ɔredzɛw
        taa n’enyim.'
      sbs: 0.803
      gen_sec: 8.16
      ref_sec: 7.8
    '94':
      text: Ɔwoara nko nye Ɔsorsornyi wɔ asaase nyinara do.
      sbs: 0.7662
      gen_sec: 2.88
      ref_sec: 5.58
    '96':
      text: Aso nyia ɔyɛ nyiyiano no ɔnye Otumfo no bɛham?
      sbs: 0.7217
      gen_sec: 3.6
      ref_sec: 4.1
    '97':
      text: Na Omri ne ba Ahab yɛɛ dza omuo wɔ EWURADZE enyim seen hɔn a wodzii n’enyim nyinara.
      sbs: 0.7621
      gen_sec: 5.92
      ref_sec: 6.86
    '99':
      text: Na Aser ebusuakuw mu dze, Misal, Abdon; Helkat nye Rehob nye hɔn ho mfikyisaase, nkurow anan.
      sbs: 0.7957
      gen_sec: 10.08
      ref_sec: 11.58
    '100':
      text: Mbrɛ ɔkwadwefo so da ne mpa do ara nye no.
      sbs: 0.7284
      gen_sec: 3.2
      ref_sec: 3.78
    '101':
      text: Fa hɛn san si yie, ao hɛn nkwagye Nyankopɔn.
      sbs: 0.7974
      gen_sec: 3.28
      ref_sec: 3.16
    '102':
      text: Na iyi ntsi mibehiahia David n’asefo ho, na nnyɛ daa nyina.
      sbs: 0.7769
      gen_sec: 4.64
      ref_sec: 4.88
    '103':
      text: Nna ɔhen Joas kɛfrɛɛ ɔsɔfo Jehoiada, na asɔfo nkaa no, na obisaa hɔn dɛ, Ɔyɛ dɛn ntsi na hom
        mmpempaam ofi no n’agow no yi?
      sbs: 0.7701
      gen_sec: 9.44
      ref_sec: 12.62
    '104':
      text: 'Nyia ɔkata ne mbrato do no, ɔnnkɛyɛ prɔmprɔm: Na obiara a ɔka to gua na ɔpow no, obenya ehumbɔbɔr.'
      sbs: 0.7496
      gen_sec: 7.92
      ref_sec: 8.0
    '106':
      text: Ana woeyi wu no mbobotsen no akyerɛ wo?
      sbs: 0.7318
      gen_sec: 3.84
      ref_sec: 3.66
    '107':
      text: 'Ɔhen dze atsɛmbu ma asaase gyina: Na nyia odzi mboaba no, obutuw no.'
      sbs: 0.7424
      gen_sec: 5.36
      ref_sec: 7.18
    '108':
      text: Ana akɛhɛn esukwankyɛba no korabea.
      sbs: 0.7313
      gen_sec: 3.04
      ref_sec: 3.26
    '109':
      text: Na wɔbɛkaa asɛm yi kyerɛɛ ɔhen no.
      sbs: 0.7543
      gen_sec: 2.96
      ref_sec: 3.68
    '110':
      text: 'na etsetsɛw mu enyame ananaben: mpo sɛ wo ntsɛwee da no ara mu ema ofifir.'
      sbs: 0.7515
      gen_sec: 6.0
      ref_sec: 7.28
    '112':
      text: Mbrɛ enyidzi so mmfata ɔkwasea ara nye no.
      sbs: 0.723
      gen_sec: 3.6
      ref_sec: 3.3
    '114':
      text: Mbrɛ EWURADZE se nye yi, Wɔdze kurow yi bɛhyɛ Babilɔnhen no dɔm nsa ara ampa, na wɔagye.
      sbs: 0.8177
      gen_sec: 6.56
      ref_sec: 7.48
    '115':
      text: Nokwar befi asaase mu efir; Na tsenenee efi sor ahwɛ famu.
      sbs: 0.7582
      gen_sec: 4.8
      ref_sec: 4.88
    '116':
      text: Na EWURADZE maa ɔtamfo bi soɛree tsiaa Solomon, Edomnyi Hadad a ofi ɔhen n’asefo mu wɔ Edom
        no a.
      sbs: 0.7493
      gen_sec: 7.12
      ref_sec: 9.54
    '117':
      text: Ebɛn asɛm na wɔdze bobua amanaman asomafo no?
      sbs: 0.792
      gen_sec: 3.68
      ref_sec: 3.62
    '118':
      text: Na asafohen no bo fuuw Jeremia, na wɔhwee no, na wɔdze no kɔtoo efiadze wɔ ɔkyerɛwfo Jonatan
        fie; nna hɔ na wɔdze ayɛ efiadze.
      sbs: 0.8073
      gen_sec: 9.6
      ref_sec: 10.5
    '119':
      text: Dɛ gyama abaa bi him nyia ɔma do no do.
      sbs: 0.7615
      gen_sec: 3.6
      ref_sec: 3.2
    '120':
      text: 'dɛ gyatafɔr wɔ nguan ekuwekuw mu: ɔno a sɛ ɔhɛn mu a, otsiatsia do.'
      sbs: 0.7578
      gen_sec: 5.84
      ref_sec: 5.98
    '122':
      text: Hwɛ, aber a ɔwo nye ɔhen da ho rekasa wɔ hɔ no, mo so mibedzi w’ekyir maba, na mabɛhyɛ wo
        nsɛm no ma.
      sbs: 0.7833
      gen_sec: 8.08
      ref_sec: 9.42
    '123':
      text: Ɔbabanyin na ɔdɔba kor ma me na na m’egya no.
      sbs: 0.7311
      gen_sec: 3.76
      ref_sec: 5.46
    '124':
      text: 'Ao Nyankopɔn kyerɛ w’ahoɔdzen: Kyerɛ wo tum, Ao Nyankopɔn, dza edze agye hɛn no.'
      sbs: 0.8018
      gen_sec: 6.24
      ref_sec: 7.24
    '125':
      text: Nna wogyaa dɛ wɔnye no kasa; osiandɛ woennhu asɛm no.
      sbs: 0.7876
      gen_sec: 4.0
      ref_sec: 3.92
    '126':
      text: Afei Ahija no nkɔdaayɛ ntsi n’enyiwa ayɛ kusukusu na onnhu adze.
      sbs: 0.7508
      gen_sec: 6.08
      ref_sec: 6.98
    '127':
      text: Na Hilkia buae see ɔkyerɛwfo Safan dɛ, Mehu mbra nwoma no wɔ EWURADZE fie.
      sbs: 0.7465
      gen_sec: 6.32
      ref_sec: 8.0
    '128':
      text: Na boka afamu he nye Nkyen Po no, mekyerɛ ɔdze kodu Jordan ewiei.
      sbs: 0.7639
      gen_sec: 5.6
      ref_sec: 6.62
    '129':
      text: 'Tappua asaase no yɛ Manaasɛ dze: na Tappua a ɔwɔ Manaasɛ he do no dze ɔyɛ Efraimmba no dze.'
      sbs: 0.7496
      gen_sec: 6.48
      ref_sec: 8.34
    '130':
      text: Wotwa mu wɔ Nyinsu bɔnsa no mu a wɔdan no bea a mbasu wɔ; Nyew, adɔwnsu dze nhyira kata do.
      sbs: 0.7789
      gen_sec: 6.96
      ref_sec: 8.24
    '131':
      text: 'Na wɔnkyɛ mu kyɛpɛn esuon: Juda ntsena ne he do wɔ kwaamu afamu.'
      sbs: 0.7047
      gen_sec: 4.88
      ref_sec: 6.72
    '132':
      text: 'Naaso wo nda mu dze merennyɛ, osian w’egya David ntsi: na mbom mebɛtsew efi wo ba nsamu.'
      sbs: 0.7667
      gen_sec: 6.56
      ref_sec: 6.76
    '133':
      text: 'Nyia ɔtwer nankasa n’akoma no, ɔkwasea a: Na obiara a ɔnantsew nyansa mu no dze, wɔbɛgye
        no nkwa.'
      sbs: 0.745
      gen_sec: 7.04
      ref_sec: 8.76
    '134':
      text: Nyia ɔsoɛr anapahema dze ndze kɛse hyira ne nyɛnko no.
      sbs: 0.7
      gen_sec: 3.68
      ref_sec: 4.7
    '135':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.7849
      gen_sec: 3.52
      ref_sec: 3.18
    '136':
      text: Na ofi hɔ fowee kɔr Debir a nkan no na ne dzin nye Kiriat-Sefer no do.
      sbs: 0.7579
      gen_sec: 6.56
      ref_sec: 9.1
    '137':
      text: Hwɛ, menye wo enya, ɔwo a etse bɔnsa mu e.
      sbs: 0.8201
      gen_sec: 4.24
      ref_sec: 3.4
    '138':
      text: Nna Jeremia see Zedekia dɛ, Aso mepaa mu ka kyerɛ wo a, ana nnyɛ oku ara na woboku me bi?
      sbs: 0.788
      gen_sec: 6.48
      ref_sec: 7.18
    '139':
      text: Dɛm ntsi afei hom nyiyi Israel ebusuakuw ebusuakuw mu mbanyin duebien, ebusuakuw biara mu
        nyimpa baako.
      sbs: 0.7342
      gen_sec: 6.08
      ref_sec: 9.46
    '140':
      text: Afei, me Nyankopɔn, meserɛ wo, bue w’enyiwa, na kyɛn w’aso wɔ mpaabɔ a wɔbɔ wɔ ha yi do.
      sbs: 0.7818
      gen_sec: 7.36
      ref_sec: 8.14
    '141':
      text: Otwitwa nankasa ne nan, na ɔnom mbusu.
      sbs: 0.743
      gen_sec: 3.2
      ref_sec: 3.48
    '142':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.7185
      gen_sec: 3.28
      ref_sec: 4.2
    '143':
      text: 'Na Solomon kɔr ne nsamankyir, na wosiee no wɔ n’egya David kurow mu: na ne ba Rehoboam dzii
        hen wɔ n’ananmu.'
      sbs: 0.7811
      gen_sec: 8.72
      ref_sec: 11.3
    '145':
      text: Dadze sew dadze ano; Dɛmara so na nyimpa sew ne nyɛnko enyim.
      sbs: 0.7372
      gen_sec: 4.48
      ref_sec: 4.94
    '147':
      text: Afei Zimri no ho nsɛm nkaa no na no nkontompɔ a otwae no, ana wɔnnkyerɛɛw no wɔ Israel ahemfo
        hɔn Mbermunsɛm nwoma no mu?
      sbs: 0.7303
      gen_sec: 8.48
      ref_sec: 11.44
    '148':
      text: Na ɔhwɛɛ ahemfo no nyinara do dze fi Esutsen no ho araa dze kodur Filistiafo asaase do, na
        Egypt ahe do.
      sbs: 0.7471
      gen_sec: 7.52
      ref_sec: 10.56
    '149':
      text: EWURADZE tse ase yi; nna amanaman bɛyɛ esiarfo wɔ no mu.
      sbs: 0.8033
      gen_sec: 4.08
      ref_sec: 3.4
    '150':
      text: 'Dɔm ahemfo guanguan, woguanguan: Na nyia ɔtse fie na ɔkyɛ asadze mu.'
      sbs: 0.7956
      gen_sec: 5.68
      ref_sec: 5.42
    '151':
      text: Ama wo mbɔdɔm tɛkyerɛma eenya ne kyɛpɛn wɔ w’atamfo ho.
      sbs: 0.7688
      gen_sec: 4.4
      ref_sec: 3.56
    '152':
      text: Ntsi migyaa hɔn ma wodzii hɔn akomadzen ekyir.
      sbs: 0.7509
      gen_sec: 3.84
      ref_sec: 3.26
    '153':
      text: 'Na ɔsee dɛ, Bue boka afamu tokura no: na obuei.'
      sbs: 0.7881
      gen_sec: 4.32
      ref_sec: 4.9
    '154':
      text: Na sɛ hom ayɛ dɛ nsoɛ kantankantan, na hom afɔw takaa wɔ hom nsanom mu mpo a.
      sbs: 0.718
      gen_sec: 5.44
      ref_sec: 6.02
    '155':
      text: Aber a obui faa do, dɛ gyama ofi yafun mu rupue no; Aber a medze mununkum yɛɛ n’akataho.
      sbs: 0.7526
      gen_sec: 6.4
      ref_sec: 7.58
    '156':
      text: Aso emumuyɛ akoradze wɔ emumuyɛ fi no mu.
      sbs: 0.7462
      gen_sec: 3.68
      ref_sec: 3.2
    '157':
      text: Na Reubenmba no hɔn he nye Jordan, nye ne he.
      sbs: 0.7731
      gen_sec: 3.92
      ref_sec: 3.22
    '158':
      text: Na, hwɛ, mber a ɔda ho nye ɔhen no rekasa no, nkɔnhyɛnyi Natan bae.
      sbs: 0.7571
      gen_sec: 5.28
      ref_sec: 5.62
    '159':
      text: Afei hwɛ esuson a meyɛɛ no kaa wo ho no; Odzi efuw dɛ nantwi.
      sbs: 0.7148
      gen_sec: 4.72
      ref_sec: 4.92
    '160':
      text: Israelhen Joahaz ne ba Jehoas n’afe a otsia ebien no mu nna Amazia, Judahen Joas ne ba no,
        hyɛɛ ase dzii hen.
      sbs: 0.7606
      gen_sec: 10.4
      ref_sec: 11.84
    '162':
      text: Dɛm ntsi afei mma hom nngyegye sika wɔ hom amanyimfo hɔ bio, na hom nyi mma ma wɔmfa mpempam
        ofi no n’agow no.
      sbs: 0.7503
      gen_sec: 8.56
      ref_sec: 11.32
    '163':
      text: 'Hom mper ngye abɔbɔfo na ehiafo: Hom nhwim hɔn mfi nyimpa bɔn no nsamu.'
      sbs: 0.7754
      gen_sec: 5.12
      ref_sec: 5.7
    '164':
      text: Dɛmara so na abɔbɔfo do ɔhen tsirmɔdzennyi tse.
      sbs: 0.7135
      gen_sec: 3.6
      ref_sec: 3.38
    '165':
      text: Na ɔyɛɛ dza ɔtsen wɔ EWURADZE n’enyiwa do, na ɔnantseew n’egya David n’akwan do, na ɔanndan
        ammfa nkyɛn annkɔ enyimfa anaa abankum.
      sbs: 0.7676
      gen_sec: 8.88
      ref_sec: 11.16
    '166':
      text: Mbrɛ Jeremia tsenaa aweɔmfo abangua no mu nye no.
      sbs: 0.7688
      gen_sec: 3.36
      ref_sec: 5.58
    '167':
      text: na ɔdze n’abasa bubu mbɛtsem no; ɔbɛyɛ dɛ aber a obi ridzi mbɛtsem mpɛpɛw.
      sbs: 0.7557
      gen_sec: 5.92
      ref_sec: 6.22
    '168':
      text: Ana ofitsi dɛ wo nda hyɛɛ ase yi ahyɛ anapa do pɛn.
      sbs: 0.7165
      gen_sec: 3.44
      ref_sec: 4.84
    '169':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.7522
      gen_sec: 8.96
      ref_sec: 10.92
    '170':
      text: Ngyanka hɔn egya, na ekunafo hɔn sɛndzifo.
      sbs: 0.8085
      gen_sec: 3.44
      ref_sec: 3.42
    '171':
      text: Asɔfo No Hyɛ Hɔn Dwumadzi Ase.
      sbs: 0.7124
      gen_sec: 2.8
      ref_sec: 3.66
    '172':
      text: na Memfis banodzifo adwen efura mu; na hɔn a wɔyɛ no mbusuakuw kutuwdo bo no.
      sbs: 0.7893
      gen_sec: 6.08
      ref_sec: 7.5
    '173':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.7875
      gen_sec: 8.08
      ref_sec: 9.28
    '174':
      text: 'Obu mpɔtsibaa dɛ mburonan: Ɔserew nkambaa no huuyɛ.'
      sbs: 0.7582
      gen_sec: 4.24
      ref_sec: 5.28
    '175':
      text: Nyew, dɛ mbrɛ gyata no pɔw, na gyata bɔyafo ne ndze.
      sbs: 0.7871
      gen_sec: 4.8
      ref_sec: 5.48
    '176':
      text: Afei nna ɔhen David ayɛ akɔdaa a oedzi mfe pii; ɔwɔ mu dɛ wɔdze atam kataa no do, naaso no
        ho annyɛ no hyew.
      sbs: 0.7567
      gen_sec: 8.64
      ref_sec: 9.2
    '177':
      text: 'Enyena sa a, ogya dum: Na bɔtomkɛka nnyi hɔ a, mansotwe gyaa.'
      sbs: 0.7745
      gen_sec: 5.6
      ref_sec: 6.04
    '178':
      text: Na Ahija tae suoo atar fofor a ɔhyɛ no no mu, na ɔtsetseew mu esinesin duebien.
      sbs: 0.7422
      gen_sec: 6.64
      ref_sec: 7.34
    '180':
      text: Me bepɔw a ewɔ wiramu, medze w’ahodze na w’akoradze nyina bɛma ma wɔaafom afa, na wo nsorɔnsorɔmbea
        no, wɔ bɔn ntsi, wɔ w’ahe nyinara do.
      sbs: 0.82
      gen_sec: 10.96
      ref_sec: 11.4
    '181':
      text: Kaansa enyitan dze ndaadaa kata noho mpo a.
      sbs: 0.716
      gen_sec: 2.8
      ref_sec: 3.78
    '182':
      text: 'Ɔtwerɛw bɔnsa mu, na odzi ehurusi wɔ n’ahoɔdzen mu: Opue kehyia akofo a woemia.'
      sbs: 0.755
      gen_sec: 7.6
      ref_sec: 6.46
    '183':
      text: EWURADZE na ɔse; hom a hom ka dɛ, Woana botum esian aba hɛn do?
      sbs: 0.8117
      gen_sec: 5.6
      ref_sec: 4.62
    '184':
      text: Anaadɛ nyia ɔda hɛn mu frankadua etsifi.
      sbs: 0.7274
      gen_sec: 3.76
      ref_sec: 3.92
    '185':
      text: dɛ mbrɛ ɔsabokwafo tɔ ntentan wɔ ne fe mu.
      sbs: 0.7526
      gen_sec: 3.44
      ref_sec: 3.76
    '186':
      text: 'Na ɔsee Israelhen no dɛ, Fa wo nsa to egyen no do: na ɔdze ne nsa too do.'
      sbs: 0.7706
      gen_sec: 5.68
      ref_sec: 7.32
    '187':
      text: Na ɔbaa dɛ, aber a wowiee ɔman no nyinara twatsia twitwa no, wɔtsenatsenaa hɔn ananmu wɔ nseraban
        no mu ma wɔtsee apɔw ana.
      sbs: 0.7641
      gen_sec: 9.36
      ref_sec: 12.36
    '188':
      text: Makasa prɛko, na murummbua; Nyew, mprɛnu, na moronnkɔ kan bio.
      sbs: 0.7856
      gen_sec: 6.56
      ref_sec: 5.84
    '189':
      text: 'Wo mboanofo tsenaa mu: Ɔwo, Nyankopɔn, na isiesiee abɔbɔfo wɔ w’ayamuyie mu.'
      sbs: 0.7967
      gen_sec: 6.96
      ref_sec: 6.3
    '190':
      text: Na Juda mbapɔmba tsee ndzɛmba yinom no, wofii ahemfie fowee baa EWURADZE fie ɔponkɛse fofor
        no ano.
      sbs: 0.7808
      gen_sec: 6.72
      ref_sec: 7.82
    '192':
      text: Nna Farao see no dɛ, Na ebɛnadze na ehia no wɔ me nkyɛn, ma erohwehwɛ dɛ ekɔ wankasa wo man
        mu yi?
      sbs: 0.7744
      gen_sec: 6.96
      ref_sec: 7.9
    '193':
      text: 'Nna wɔfaa Jeremia, na wɔkotoow no kyeen ɔhenba Malkia mona efiadze a ɔwɔ aweɔmfo abanguado
        no mu: na wɔdze ntampehoma gyaagyaa Jeremia siaan mu.'
      sbs: 0.7905
      gen_sec: 10.72
      ref_sec: 12.34
    '194':
      text: Wɔse dɛ, Hom mbra ma yenkruw hɔn ase ma wongyaa dɛ wɔbɛyɛ ɔman; Ama wɔnnkɛkaa Israel dzin
        bio.
      sbs: 0.8064
      gen_sec: 8.24
      ref_sec: 8.02
    '195':
      text: 'Na ɔfowee kɔr ne nkyɛn: na, hwɛ, ɔtse koko no n’etsifi.'
      sbs: 0.7987
      gen_sec: 4.48
      ref_sec: 4.84
    '196':
      text: 'Na wobuaa dɛ, Ahazia no nuanom nye hɛn: na yerisian akɔ ekekyiakyia ɔhen ne mba, na ɔhembaa
        ne mba no.'
      sbs: 0.7647
      gen_sec: 8.08
      ref_sec: 10.94
    '198':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.8185
      gen_sec: 6.16
      ref_sec: 5.64
    '199':
      text: Na Sallum, a ofi Kore, Ebiasaf, na Kora asefo no mu, na no nuanom a wofi n’egya fie.
      sbs: 0.7833
      gen_sec: 8.8
      ref_sec: 8.82
    '200':
      text: bɛba dɔm EWURADZE ne dzin tsenabea, bepɔw Zion no do.
      sbs: 0.7952
      gen_sec: 3.92
      ref_sec: 6.32
    '201':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.7301
      gen_sec: 3.44
      ref_sec: 4.2
    '202':
      text: Hɔn a wɔdan wo gya nyina enyi bɔto; hɔn a wofi wo nkyɛn kɔ no, wɔbɛkyerɛw hɔn edzin aka asaase
        ase mba ho.
      sbs: 0.8029
      gen_sec: 7.2
      ref_sec: 8.28
    '203':
      text: Na Adonija n’aponto asefo no nyinara suroi, na wɔsoɛrsoɛree na nyimpa biara faa no kwan kɔree.
      sbs: 0.7535
      gen_sec: 6.56
      ref_sec: 8.48
    '204':
      text: Hom nka nkyerɛ amanaman dɛ wɔreba; hom mma wɔntse no Jerusalɛm.
      sbs: 0.8088
      gen_sec: 4.4
      ref_sec: 4.18
    '205':
      text: sɛ wosi frankaa wɔ mbepɔw do a, hom nhwɛ; na sɛ wɔbɔ akasamu mu a, hom ntsie.
      sbs: 0.8116
      gen_sec: 6.32
      ref_sec: 5.46
    '207':
      text: Na Kohatmba nkaa no nam tontotwe do nyae fii Efraim, Dan, nye Manaasɛ ebusuakuw fa no mu nkurow
        du.
      sbs: 0.7719
      gen_sec: 8.72
      ref_sec: 10.62
    '208':
      text: Iyi nye Benjaminmba no egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7451
      gen_sec: 5.04
      ref_sec: 7.22
    '209':
      text: Na ɔkaa Israelmba mu ebusuakuw esuon a wonnyae nnkyɛɛ hɔn egyapadze.
      sbs: 0.7238
      gen_sec: 5.12
      ref_sec: 5.76
    '210':
      text: Afei Solomon n’edwuma nyinara wosiesiei maa da a wɔtoow EWURADZE ne dan no ne fapem, na okodur
        dɛ wowiei.
      sbs: 0.7604
      gen_sec: 7.36
      ref_sec: 9.0
    '211':
      text: dɛmara so na wobotwitwa hom egu, na hom etwa mu akɔ.
      sbs: 0.7232
      gen_sec: 4.48
      ref_sec: 3.46
    '213':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.7794
      gen_sec: 6.56
      ref_sec: 7.62
    '214':
      text: na ɔmaa ahendzi hihimii no nye yi; nyia ɔmaa wiadze yi yɛɛ dɛ sar.
      sbs: 0.7869
      gen_sec: 4.88
      ref_sec: 5.48
    '215':
      text: nye w’ayeforber mu dɔ no ma wo; mbrɛ idzii m’ekyir wɔ sar no do.
      sbs: 0.783
      gen_sec: 4.24
      ref_sec: 4.9
    '216':
      text: 'Wɔdze ogya ahyew no, woetwa ato famu: W’enyim nkaenyim ntsi wɔasɛɛ.'
      sbs: 0.7911
      gen_sec: 5.76
      ref_sec: 4.74
    '217':
      text: Na aber a Seba ɔhembaa no tsee Solomon ne nka wɔ EWURADZE ne dzin ho no, ɔbaa dɛ ɔdze nsɛmbisa
        dzendzen robɔsɔ no ahwɛ.
      sbs: 0.7461
      gen_sec: 8.32
      ref_sec: 7.86
    '218':
      text: Na wɔdze afona anomu kunkum hɔn; na brampafo na asafohemfo no totoow hɔn gui, na wosii mu
        kɔr Baal fie kurow no mu.
      sbs: 0.7473
      gen_sec: 8.72
      ref_sec: 10.54
    '219':
      text: Naaso ɔpoow nkɔdaa no hɔn afotu a wɔdze maa no no, na ɔnye mberantsɛ a wɔnye no nyinii a afei
        wɔabɛyɛ n’apamfo no no dwenee.
      sbs: 0.7483
      gen_sec: 8.24
      ref_sec: 11.92
    '220':
      text: 'Ɔwo edze hɛn yɛ aperdzi ma hɛn asɔnmufo: Na hɛn atamfo sereserew wɔ hɔnara hɔn mu.'
      sbs: 0.7704
      gen_sec: 7.04
      ref_sec: 7.6
    '221':
      text: anaadɛ poma bɛma nyia ɔnnyɛ dua no no do.
      sbs: 0.7756
      gen_sec: 3.76
      ref_sec: 3.34
    '222':
      text: 'Na asɛm yi maa wɔyɛɛ bɔn: osiandɛ ɔman no kɔree kɔsoom hɔn wɔ Bɛtɛl araa dze kɔr Dan.'
      sbs: 0.7584
      gen_sec: 6.4
      ref_sec: 7.32
    '223':
      text: Obeyi wo wɔ ahohia esia mu; Nyew, dza otsia esuon no mu mpo mbusu bi rennka wo.
      sbs: 0.7354
      gen_sec: 6.48
      ref_sec: 7.56
    '225':
      text: Nna Atalia tsetseew ne ntar mu, na ɔkekaa mu dɛ, Etuatsew o, iyi yɛ etuatsew.
      sbs: 0.7603
      gen_sec: 6.64
      ref_sec: 6.74
    '226':
      text: Woana na ɔwɔ enyiwa a ayɛ kɔɔ?
      sbs: 0.7551
      gen_sec: 2.32
      ref_sec: 3.68
  score: 0.7627
  partial: true
- model: KhayaAI/khaya-tts-v2
  sbs: 0.6948
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.7004
      gen_sec: 6.98
      ref_sec: 9.1
    '1':
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.6975
      gen_sec: 2.75
      ref_sec: 3.66
    '3':
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.634
      gen_sec: 9.25
      ref_sec: 6.36
    '5':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6852
      gen_sec: 3.49
      ref_sec: 3.18
    '6':
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.611
      gen_sec: 10.14
      ref_sec: 9.12
    '7':
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.6829
      gen_sec: 8.13
      ref_sec: 7.44
    '8':
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.7146
      gen_sec: 4.13
      ref_sec: 4.88
    '9':
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.6846
      gen_sec: 6.02
      ref_sec: 6.16
    '10':
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.6907
      gen_sec: 7.97
      ref_sec: 8.48
    '11':
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.717
      gen_sec: 5.73
      ref_sec: 6.68
    '12':
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.6999
      gen_sec: 8.32
      ref_sec: 10.5
    '13':
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.7152
      gen_sec: 5.34
      ref_sec: 6.38
    '14':
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.6747
      gen_sec: 3.39
      ref_sec: 4.1
    '15':
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7027
      gen_sec: 6.53
      ref_sec: 6.76
    '16':
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.7053
      gen_sec: 6.98
      ref_sec: 8.48
    '19':
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.7066
      gen_sec: 2.5
      ref_sec: 3.16
    '20':
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.7027
      gen_sec: 3.81
      ref_sec: 4.36
    '22':
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.6918
      gen_sec: 3.36
      ref_sec: 3.74
    '23':
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.6946
      gen_sec: 7.84
      ref_sec: 10.44
    '24':
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.6913
      gen_sec: 6.85
      ref_sec: 8.26
    '26':
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.6875
      gen_sec: 3.2
      ref_sec: 5.0
    '27':
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6958
      gen_sec: 5.82
      ref_sec: 7.04
    '28':
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.6994
      gen_sec: 7.36
      ref_sec: 9.74
    '29':
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.7167
      gen_sec: 3.71
      ref_sec: 4.34
    '30':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6848
      gen_sec: 5.6
      ref_sec: 5.64
    '32':
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.6885
      gen_sec: 3.94
      ref_sec: 3.54
    '33':
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.6892
      gen_sec: 8.58
      ref_sec: 11.1
    '35':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.726
      gen_sec: 5.7
      ref_sec: 7.62
    '36':
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.6393
      gen_sec: 4.26
      ref_sec: 3.74
    '37':
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.7299
      gen_sec: 3.55
      ref_sec: 3.94
    '38':
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6893
      gen_sec: 6.05
      ref_sec: 7.02
    '39':
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.7198
      gen_sec: 1.86
      ref_sec: 3.74
    '40':
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.6959
      gen_sec: 5.22
      ref_sec: 5.94
    '41':
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.7431
      gen_sec: 2.66
      ref_sec: 3.26
    '42':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.6685
      gen_sec: 5.57
      ref_sec: 9.28
    '43':
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
        dɛ, Hom mma yɛmfa.'
      sbs: 0.6855
      gen_sec: 7.74
      ref_sec: 11.2
    '44':
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.7217
      gen_sec: 3.33
      ref_sec: 4.1
    '46':
      text: 'Na ɔsee dɛ, Tase egyen menaba no: na ɔtasee.'
      sbs: 0.7142
      gen_sec: 3.2
      ref_sec: 4.26
    '47':
      text: Ɔwo, Nyankopɔn, maa nyankom tɔɔ berdzedzeedze.
      sbs: 0.7011
      gen_sec: 3.26
      ref_sec: 3.42
    '48':
      text: Ne nda nyinara mu no woemmfi EWURADZE, hɔn egyanom Nyankopɔn no, n’ekyir dzi no ho emmfir.
      sbs: 0.68
      gen_sec: 5.6
      ref_sec: 9.06
    '49':
      text: Na ɔdze etsifi mbasu nye anaafo mbasu no maa no.
      sbs: 0.6903
      gen_sec: 3.84
      ref_sec: 3.6
    '50':
      text: 'Na owungyam bi nnyi hɔn wu mu: Na mbom hɔn ahoɔdzen wɔ hɔ pintsinn.'
      sbs: 0.7089
      gen_sec: 4.45
      ref_sec: 4.82
    '51':
      text: Woana na osiesie akonkoran n’edziban ma no.
      sbs: 0.7044
      gen_sec: 3.17
      ref_sec: 3.32
    '52':
      text: Ana ɔwo na eyɛ ha nya afonam ma gyataber.
      sbs: 0.715
      gen_sec: 3.2
      ref_sec: 3.4
    '53':
      text: 'Mber no mu no, Siriahen Hazael sii mu kɔree, na ɔnye Gat kɔkoe, na ɔfae: na Hazael dze sii
        n’enyi do dɛ ɔrokɔfow akɔ Jerusalɛm.'
      sbs: 0.6947
      gen_sec: 9.28
      ref_sec: 13.56
    '54':
      text: Na ma w’ebufuhyew no a ɔwɔ hɛn do no mbɔ adze.
      sbs: 0.693
      gen_sec: 3.42
      ref_sec: 3.5
    '55':
      text: na ahendzi wɔ Damaskɔs; na Siria nkaa bɛyɛ dɛ.
      sbs: 0.6638
      gen_sec: 3.3
      ref_sec: 4.32
    '56':
      text: Na wɔbɔtotɔ mfuwa wɔ asaase yi a hom ka wɔ ho dɛ, Ɔyɛ amamfo, nyimpa anaa abowa nnyi do; wɔdze
        ahyɛ Kaldeafo nsa no mu.
      sbs: 0.7083
      gen_sec: 8.38
      ref_sec: 11.26
    '57':
      text: Iyi nye Gadmba no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee, nkurow no nye no nkurobaase.
      sbs: 0.6839
      gen_sec: 7.33
      ref_sec: 9.24
    '58':
      text: 'Ɔno na yennkefi wo nkyɛn akɔ ekyir: Ma yennya nkwa, na yɛbɔbɔ wo dzin.'
      sbs: 0.699
      gen_sec: 4.32
      ref_sec: 5.02
    '59':
      text: Na Josua dze n’enyim butuuw famu, na ɔsɔɔr no, na ɔsee no dɛ, Na mo wura ese n’akowaa dɛn?
      sbs: 0.6963
      gen_sec: 5.7
      ref_sec: 8.24
    '60':
      text: Mbrɛ aboɔdzembo kotoku a ɔhyɛ abo ntamu tse no.
      sbs: 0.6837
      gen_sec: 3.42
      ref_sec: 4.78
    '61':
      text: 'Emumuyɛfo guan wɔ aber a nyimpa biara nntaa hɔn do: Na atseneneefo dze, wɔyɛ ndam dɛ ogyata.'
      sbs: 0.6768
      gen_sec: 6.46
      ref_sec: 8.82
    '62':
      text: 'dɛ abaa a ɔhwee wo no ebu ntsi: na ɔwɔ no ndwow mu na ɔkyerben befir aba.'
      sbs: 0.7051
      gen_sec: 5.44
      ref_sec: 6.62
    '63':
      text: Mbrɛ ɔmansotwenyi sɔ aperper mu ogya ara nye no.
      sbs: 0.7058
      gen_sec: 3.26
      ref_sec: 4.5
    '64':
      text: Ana ɔwo ibotum akyekyer Aberwa na mba no n’ahoma.
      sbs: 0.6671
      gen_sec: 3.9
      ref_sec: 5.08
    '65':
      text: Na ɔatsen ne nsa, na woana na ɔbɔpon mu?
      sbs: 0.7207
      gen_sec: 2.82
      ref_sec: 3.26
    '66':
      text: Na dɛtse atɔw atɔw no abɔ mu afemfam ho no?
      sbs: 0.6325
      gen_sec: 3.3
      ref_sec: 3.2
    '67':
      text: 'Nna wɔdze ntampehoma no twee Jeremia baa sor, na woyii no fii mona efiadze no mu: na Jeremia
        tsenaa aweɔmfo abangua no mu.'
      sbs: 0.7082
      gen_sec: 8.77
      ref_sec: 9.2
    '68':
      text: Ma munhu w’awerdzi wɔ hɔn do; na ɔwo na maka m’asɛm akyerɛ wo.
      sbs: 0.6835
      gen_sec: 4.06
      ref_sec: 4.5
    '70':
      text: Na Safan ba Ahikam ne nsa wɔ Jeremia afa, dɛ mma wonnyi no nnhyɛ ɔman no nsa mma wonnku no.
      sbs: 0.6957
      gen_sec: 6.56
      ref_sec: 9.6
    '71':
      text: ma aabɔsom me; na sɛ iyi dza ɔsom bo fi dza ɔyɛ huhuw no mu a.
      sbs: 0.7144
      gen_sec: 4.51
      ref_sec: 4.86
    '72':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.7078
      gen_sec: 8.48
      ref_sec: 10.92
    '73':
      text: 'Dɛ mbrɛ mframa bɔ wusiw kɔ no, dɛmara so na bɔ hɔn kɔ: Dɛ mbrɛ ihua nan wɔ gya enyim no.'
      sbs: 0.7015
      gen_sec: 6.05
      ref_sec: 7.46
    '74':
      text: Anantwisaa kuw no, ɔnye aman anantwimba no enyim.
      sbs: 0.6996
      gen_sec: 3.39
      ref_sec: 3.8
    '75':
      text: Na ɔsoɛree, na ɔnye no sianee kɔr ɔhen no nkyɛn.
      sbs: 0.7224
      gen_sec: 3.36
      ref_sec: 4.08
    '76':
      text: Na ɔwo, mo wura ɔhen, na Israel nyinara enyi da wo do dɛ ebɛkyerɛ hɔn nyia ɔbɛtsena w’ahengua
        do wɔ w’ekyir.
      sbs: 0.5767
      gen_sec: 14.98
      ref_sec: 8.88
    '77':
      text: Nna Asiriahen no dze enyimguase sanee kɔr nankasa n’asaase do.
      sbs: 0.7072
      gen_sec: 4.77
      ref_sec: 6.08
    '78':
      text: Ɔtse dɛ obi a osuo bɔdɔm n’asowa mu.
      sbs: 0.6759
      gen_sec: 2.69
      ref_sec: 3.68
    '80':
      text: 'Mbrɛ EWURADZE se nye yi: Sɛ hom ayeyɛ petsepetsee, na hom dɔɔ so mpo a.'
      sbs: 0.7067
      gen_sec: 4.74
      ref_sec: 5.56
    '81':
      text: Na ɔtsenaa ahemfo ahengua no do.
      sbs: 0.6898
      gen_sec: 2.46
      ref_sec: 3.0
    '82':
      text: Galim babaa, ma wo ndze do tsea mu!
      sbs: 0.7181
      gen_sec: 2.4
      ref_sec: 3.62
    '83':
      text: Nyia medze sar pradada no ayɛ ne fi.
      sbs: 0.6733
      gen_sec: 2.72
      ref_sec: 3.94
    '84':
      text: na hɔn a mehiahia hɔn ho no; na mebɛma osiifo no ayɛ nkaase.
      sbs: 0.7222
      gen_sec: 4.54
      ref_sec: 5.18
    '85':
      text: Na Joas yɛɛ dza ɔtsen wɔ EWURADZE enyiwa do, wɔ ne nda a ɔsɔfo Jehoiada kyerɛkyerɛɛ no wɔ
        mu nyinara.
      sbs: 0.7137
      gen_sec: 6.98
      ref_sec: 8.58
    '87':
      text: Na ɔronnhwɛ afɔrmbukyia, ne nsaano edwuma no, eso n’enyi ronnsɔ dza ne nsatseaba ayɛ, Aserim,
        anaadɛ ewia ehonyi no.
      sbs: 0.6913
      gen_sec: 8.26
      ref_sec: 11.84
    '88':
      text: Sen nyimpa beesuon a wotum kyerɛkyerɛ asɛm ase.
      sbs: 0.6931
      gen_sec: 3.42
      ref_sec: 5.02
    '89':
      text: Elkosnyi Nahum n’enyido adzehu nwoma a ɔfa Ninive atsɛmbu ho.
      sbs: 0.6731
      gen_sec: 4.58
      ref_sec: 5.06
    '90':
      text: 'EWURADZE, ɔwo adom w’asaase: Ɔwo edze Jakob egyapadze asan aba.'
      sbs: 0.6993
      gen_sec: 5.02
      ref_sec: 5.76
    '91':
      text: 'na medwuruw w’aban dzendzen nyina: na mubotwitwa wo mbɔnsansɛm efi wo nsamu; na innkenya
        sebramufo bio: na mubotwitwa ehonyi.'
      sbs: 0.6868
      gen_sec: 9.73
      ref_sec: 12.12
    '92':
      text: 'Emi dze memmpɛɛ ntsɛm minngyaae dɛ meyɛ oguanhwɛfo dzi w’ekyir: eso memmpɛɛ mbusu da no.'
      sbs: 0.7055
      gen_sec: 6.08
      ref_sec: 7.78
    '93':
      text: 'Nna ɔhen tse awɔwber dan no mu, wɔ bosoom a otsia akron no mu: na mbukyia mu ogya a ɔredzɛw
        taa n’enyim.'
      sbs: 0.7118
      gen_sec: 6.88
      ref_sec: 7.8
    '94':
      text: Ɔwoara nko nye Ɔsorsornyi wɔ asaase nyinara do.
      sbs: 0.7246
      gen_sec: 3.68
      ref_sec: 5.58
    '96':
      text: Aso nyia ɔyɛ nyiyiano no ɔnye Otumfo no bɛham?
      sbs: 0.7099
      gen_sec: 3.42
      ref_sec: 4.1
    '97':
      text: Na Omri ne ba Ahab yɛɛ dza omuo wɔ EWURADZE enyim seen hɔn a wodzii n’enyim nyinara.
      sbs: 0.7152
      gen_sec: 5.76
      ref_sec: 6.86
    '99':
      text: Na Aser ebusuakuw mu dze, Misal, Abdon; Helkat nye Rehob nye hɔn ho mfikyisaase, nkurow anan.
      sbs: 0.6809
      gen_sec: 7.26
      ref_sec: 11.58
    '100':
      text: Mbrɛ ɔkwadwefo so da ne mpa do ara nye no.
      sbs: 0.6898
      gen_sec: 3.01
      ref_sec: 3.78
    '101':
      text: Fa hɛn san si yie, ao hɛn nkwagye Nyankopɔn.
      sbs: 0.7215
      gen_sec: 3.33
      ref_sec: 3.16
    '102':
      text: Na iyi ntsi mibehiahia David n’asefo ho, na nnyɛ daa nyina.
      sbs: 0.6998
      gen_sec: 3.94
      ref_sec: 4.88
    '103':
      text: Nna ɔhen Joas kɛfrɛɛ ɔsɔfo Jehoiada, na asɔfo nkaa no, na obisaa hɔn dɛ, Ɔyɛ dɛn ntsi na hom
        mmpempaam ofi no n’agow no yi?
      sbs: 0.6903
      gen_sec: 9.41
      ref_sec: 12.62
    '104':
      text: 'Nyia ɔkata ne mbrato do no, ɔnnkɛyɛ prɔmprɔm: Na obiara a ɔka to gua na ɔpow no, obenya ehumbɔbɔr.'
      sbs: 0.7037
      gen_sec: 7.26
      ref_sec: 8.0
    '106':
      text: Ana woeyi wu no mbobotsen no akyerɛ wo?
      sbs: 0.6637
      gen_sec: 2.85
      ref_sec: 3.66
    '107':
      text: 'Ɔhen dze atsɛmbu ma asaase gyina: Na nyia odzi mboaba no, obutuw no.'
      sbs: 0.6942
      gen_sec: 4.83
      ref_sec: 7.18
    '108':
      text: Ana akɛhɛn esukwankyɛba no korabea.
      sbs: 0.6883
      gen_sec: 2.88
      ref_sec: 3.26
    '109':
      text: Na wɔbɛkaa asɛm yi kyerɛɛ ɔhen no.
      sbs: 0.7176
      gen_sec: 2.62
      ref_sec: 3.68
    '110':
      text: 'na etsetsɛw mu enyame ananaben: mpo sɛ wo ntsɛwee da no ara mu ema ofifir.'
      sbs: 0.6711
      gen_sec: 5.5
      ref_sec: 7.28
    '112':
      text: Mbrɛ enyidzi so mmfata ɔkwasea ara nye no.
      sbs: 0.6991
      gen_sec: 2.94
      ref_sec: 3.3
    '114':
      text: Mbrɛ EWURADZE se nye yi, Wɔdze kurow yi bɛhyɛ Babilɔnhen no dɔm nsa ara ampa, na wɔagye.
      sbs: 0.7157
      gen_sec: 5.44
      ref_sec: 7.48
    '115':
      text: Nokwar befi asaase mu efir; Na tsenenee efi sor ahwɛ famu.
      sbs: 0.5895
      gen_sec: 8.58
      ref_sec: 4.88
    '116':
      text: Na EWURADZE maa ɔtamfo bi soɛree tsiaa Solomon, Edomnyi Hadad a ofi ɔhen n’asefo mu wɔ Edom
        no a.
      sbs: 0.7001
      gen_sec: 7.46
      ref_sec: 9.54
    '117':
      text: Ebɛn asɛm na wɔdze bobua amanaman asomafo no?
      sbs: 0.7164
      gen_sec: 3.68
      ref_sec: 3.62
    '118':
      text: Na asafohen no bo fuuw Jeremia, na wɔhwee no, na wɔdze no kɔtoo efiadze wɔ ɔkyerɛwfo Jonatan
        fie; nna hɔ na wɔdze ayɛ efiadze.
      sbs: 0.7029
      gen_sec: 9.34
      ref_sec: 10.5
    '119':
      text: Dɛ gyama abaa bi him nyia ɔma do no do.
      sbs: 0.724
      gen_sec: 2.85
      ref_sec: 3.2
    '120':
      text: 'dɛ gyatafɔr wɔ nguan ekuwekuw mu: ɔno a sɛ ɔhɛn mu a, otsiatsia do.'
      sbs: 0.7144
      gen_sec: 4.74
      ref_sec: 5.98
    '122':
      text: Hwɛ, aber a ɔwo nye ɔhen da ho rekasa wɔ hɔ no, mo so mibedzi w’ekyir maba, na mabɛhyɛ wo
        nsɛm no ma.
      sbs: 0.6785
      gen_sec: 7.3
      ref_sec: 9.42
    '123':
      text: Ɔbabanyin na ɔdɔba kor ma me na na m’egya no.
      sbs: 0.6724
      gen_sec: 3.01
      ref_sec: 5.46
    '124':
      text: 'Ao Nyankopɔn kyerɛ w’ahoɔdzen: Kyerɛ wo tum, Ao Nyankopɔn, dza edze agye hɛn no.'
      sbs: 0.684
      gen_sec: 5.15
      ref_sec: 7.24
    '125':
      text: Nna wogyaa dɛ wɔnye no kasa; osiandɛ woennhu asɛm no.
      sbs: 0.7105
      gen_sec: 3.81
      ref_sec: 3.92
    '126':
      text: Afei Ahija no nkɔdaayɛ ntsi n’enyiwa ayɛ kusukusu na onnhu adze.
      sbs: 0.6766
      gen_sec: 4.48
      ref_sec: 6.98
    '127':
      text: Na Hilkia buae see ɔkyerɛwfo Safan dɛ, Mehu mbra nwoma no wɔ EWURADZE fie.
      sbs: 0.6984
      gen_sec: 5.6
      ref_sec: 8.0
    '128':
      text: Na boka afamu he nye Nkyen Po no, mekyerɛ ɔdze kodu Jordan ewiei.
      sbs: 0.6786
      gen_sec: 6.88
      ref_sec: 6.62
    '129':
      text: 'Tappua asaase no yɛ Manaasɛ dze: na Tappua a ɔwɔ Manaasɛ he do no dze ɔyɛ Efraimmba no dze.'
      sbs: 0.6976
      gen_sec: 6.5
      ref_sec: 8.34
    '130':
      text: Wotwa mu wɔ Nyinsu bɔnsa no mu a wɔdan no bea a mbasu wɔ; Nyew, adɔwnsu dze nhyira kata do.
      sbs: 0.7004
      gen_sec: 6.24
      ref_sec: 8.24
    '131':
      text: 'Na wɔnkyɛ mu kyɛpɛn esuon: Juda ntsena ne he do wɔ kwaamu afamu.'
      sbs: 0.6467
      gen_sec: 4.48
      ref_sec: 6.72
    '132':
      text: 'Naaso wo nda mu dze merennyɛ, osian w’egya David ntsi: na mbom mebɛtsew efi wo ba nsamu.'
      sbs: 0.6859
      gen_sec: 6.21
      ref_sec: 6.76
    '133':
      text: 'Nyia ɔtwer nankasa n’akoma no, ɔkwasea a: Na obiara a ɔnantsew nyansa mu no dze, wɔbɛgye
        no nkwa.'
      sbs: 0.6981
      gen_sec: 6.46
      ref_sec: 8.76
    '134':
      text: Nyia ɔsoɛr anapahema dze ndze kɛse hyira ne nyɛnko no.
      sbs: 0.6951
      gen_sec: 4.16
      ref_sec: 4.7
    '135':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6798
      gen_sec: 3.78
      ref_sec: 3.18
    '136':
      text: Na ofi hɔ fowee kɔr Debir a nkan no na ne dzin nye Kiriat-Sefer no do.
      sbs: 0.6737
      gen_sec: 5.12
      ref_sec: 9.1
    '137':
      text: Hwɛ, menye wo enya, ɔwo a etse bɔnsa mu e.
      sbs: 0.7129
      gen_sec: 2.75
      ref_sec: 3.4
    '138':
      text: Nna Jeremia see Zedekia dɛ, Aso mepaa mu ka kyerɛ wo a, ana nnyɛ oku ara na woboku me bi?
      sbs: 0.7009
      gen_sec: 6.4
      ref_sec: 7.18
    '139':
      text: Dɛm ntsi afei hom nyiyi Israel ebusuakuw ebusuakuw mu mbanyin duebien, ebusuakuw biara mu
        nyimpa baako.
      sbs: 0.7209
      gen_sec: 7.2
      ref_sec: 9.46
    '140':
      text: Afei, me Nyankopɔn, meserɛ wo, bue w’enyiwa, na kyɛn w’aso wɔ mpaabɔ a wɔbɔ wɔ ha yi do.
      sbs: 0.6914
      gen_sec: 6.02
      ref_sec: 8.14
    '141':
      text: Otwitwa nankasa ne nan, na ɔnom mbusu.
      sbs: 0.644
      gen_sec: 3.97
      ref_sec: 3.48
    '142':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.6675
      gen_sec: 3.46
      ref_sec: 4.2
    '143':
      text: 'Na Solomon kɔr ne nsamankyir, na wosiee no wɔ n’egya David kurow mu: na ne ba Rehoboam dzii
        hen wɔ n’ananmu.'
      sbs: 0.7063
      gen_sec: 7.58
      ref_sec: 11.3
    '145':
      text: Dadze sew dadze ano; Dɛmara so na nyimpa sew ne nyɛnko enyim.
      sbs: 0.6991
      gen_sec: 5.98
      ref_sec: 4.94
    '147':
      text: Afei Zimri no ho nsɛm nkaa no na no nkontompɔ a otwae no, ana wɔnnkyerɛɛw no wɔ Israel ahemfo
        hɔn Mbermunsɛm nwoma no mu?
      sbs: 0.6944
      gen_sec: 8.45
      ref_sec: 11.44
    '148':
      text: Na ɔhwɛɛ ahemfo no nyinara do dze fi Esutsen no ho araa dze kodur Filistiafo asaase do, na
        Egypt ahe do.
      sbs: 0.6954
      gen_sec: 7.55
      ref_sec: 10.56
    '149':
      text: EWURADZE tse ase yi; nna amanaman bɛyɛ esiarfo wɔ no mu.
      sbs: 0.7211
      gen_sec: 3.65
      ref_sec: 3.4
    '150':
      text: 'Dɔm ahemfo guanguan, woguanguan: Na nyia ɔtse fie na ɔkyɛ asadze mu.'
      sbs: 0.6982
      gen_sec: 4.67
      ref_sec: 5.42
    '151':
      text: Ama wo mbɔdɔm tɛkyerɛma eenya ne kyɛpɛn wɔ w’atamfo ho.
      sbs: 0.6941
      gen_sec: 4.0
      ref_sec: 3.56
    '152':
      text: Ntsi migyaa hɔn ma wodzii hɔn akomadzen ekyir.
      sbs: 0.6748
      gen_sec: 3.33
      ref_sec: 3.26
    '153':
      text: 'Na ɔsee dɛ, Bue boka afamu tokura no: na obuei.'
      sbs: 0.6907
      gen_sec: 3.01
      ref_sec: 4.9
    '154':
      text: Na sɛ hom ayɛ dɛ nsoɛ kantankantan, na hom afɔw takaa wɔ hom nsanom mu mpo a.
      sbs: 0.6399
      gen_sec: 0.25
      ref_sec: 6.02
    '155':
      text: Aber a obui faa do, dɛ gyama ofi yafun mu rupue no; Aber a medze mununkum yɛɛ n’akataho.
      sbs: 0.6976
      gen_sec: 6.5
      ref_sec: 7.58
    '156':
      text: Aso emumuyɛ akoradze wɔ emumuyɛ fi no mu.
      sbs: 0.7319
      gen_sec: 3.17
      ref_sec: 3.2
    '157':
      text: Na Reubenmba no hɔn he nye Jordan, nye ne he.
      sbs: 0.7081
      gen_sec: 3.04
      ref_sec: 3.22
    '158':
      text: Na, hwɛ, mber a ɔda ho nye ɔhen no rekasa no, nkɔnhyɛnyi Natan bae.
      sbs: 0.6827
      gen_sec: 4.93
      ref_sec: 5.62
    '159':
      text: Afei hwɛ esuson a meyɛɛ no kaa wo ho no; Odzi efuw dɛ nantwi.
      sbs: 0.7215
      gen_sec: 4.42
      ref_sec: 4.92
    '160':
      text: Israelhen Joahaz ne ba Jehoas n’afe a otsia ebien no mu nna Amazia, Judahen Joas ne ba no,
        hyɛɛ ase dzii hen.
      sbs: 0.713
      gen_sec: 8.29
      ref_sec: 11.84
    '162':
      text: Dɛm ntsi afei mma hom nngyegye sika wɔ hom amanyimfo hɔ bio, na hom nyi mma ma wɔmfa mpempam
        ofi no n’agow no.
      sbs: 0.6723
      gen_sec: 7.58
      ref_sec: 11.32
    '163':
      text: 'Hom mper ngye abɔbɔfo na ehiafo: Hom nhwim hɔn mfi nyimpa bɔn no nsamu.'
      sbs: 0.6946
      gen_sec: 4.83
      ref_sec: 5.7
    '164':
      text: Dɛmara so na abɔbɔfo do ɔhen tsirmɔdzennyi tse.
      sbs: 0.684
      gen_sec: 3.46
      ref_sec: 3.38
    '165':
      text: Na ɔyɛɛ dza ɔtsen wɔ EWURADZE n’enyiwa do, na ɔnantseew n’egya David n’akwan do, na ɔanndan
        ammfa nkyɛn annkɔ enyimfa anaa abankum.
      sbs: 0.718
      gen_sec: 9.54
      ref_sec: 11.16
    '166':
      text: Mbrɛ Jeremia tsenaa aweɔmfo abangua no mu nye no.
      sbs: 0.7221
      gen_sec: 3.52
      ref_sec: 5.58
    '167':
      text: na ɔdze n’abasa bubu mbɛtsem no; ɔbɛyɛ dɛ aber a obi ridzi mbɛtsem mpɛpɛw.
      sbs: 0.6935
      gen_sec: 5.41
      ref_sec: 6.22
    '168':
      text: Ana ofitsi dɛ wo nda hyɛɛ ase yi ahyɛ anapa do pɛn.
      sbs: 0.6939
      gen_sec: 4.03
      ref_sec: 4.84
    '169':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.7037
      gen_sec: 8.48
      ref_sec: 10.92
    '170':
      text: Ngyanka hɔn egya, na ekunafo hɔn sɛndzifo.
      sbs: 0.7066
      gen_sec: 3.26
      ref_sec: 3.42
    '171':
      text: Asɔfo No Hyɛ Hɔn Dwumadzi Ase.
      sbs: 0.6652
      gen_sec: 2.27
      ref_sec: 3.66
    '172':
      text: na Memfis banodzifo adwen efura mu; na hɔn a wɔyɛ no mbusuakuw kutuwdo bo no.
      sbs: 0.7106
      gen_sec: 5.47
      ref_sec: 7.5
    '173':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.6622
      gen_sec: 5.7
      ref_sec: 9.28
    '174':
      text: 'Obu mpɔtsibaa dɛ mburonan: Ɔserew nkambaa no huuyɛ.'
      sbs: 0.689
      gen_sec: 3.97
      ref_sec: 5.28
    '175':
      text: Nyew, dɛ mbrɛ gyata no pɔw, na gyata bɔyafo ne ndze.
      sbs: 0.7067
      gen_sec: 3.52
      ref_sec: 5.48
    '176':
      text: Afei nna ɔhen David ayɛ akɔdaa a oedzi mfe pii; ɔwɔ mu dɛ wɔdze atam kataa no do, naaso no
        ho annyɛ no hyew.
      sbs: 0.7018
      gen_sec: 7.71
      ref_sec: 9.2
    '177':
      text: 'Enyena sa a, ogya dum: Na bɔtomkɛka nnyi hɔ a, mansotwe gyaa.'
      sbs: 0.6682
      gen_sec: 4.19
      ref_sec: 6.04
    '178':
      text: Na Ahija tae suoo atar fofor a ɔhyɛ no no mu, na ɔtsetseew mu esinesin duebien.
      sbs: 0.7058
      gen_sec: 6.02
      ref_sec: 7.34
    '180':
      text: Me bepɔw a ewɔ wiramu, medze w’ahodze na w’akoradze nyina bɛma ma wɔaafom afa, na wo nsorɔnsorɔmbea
        no, wɔ bɔn ntsi, wɔ w’ahe nyinara do.
      sbs: 0.7045
      gen_sec: 8.9
      ref_sec: 11.4
    '181':
      text: Kaansa enyitan dze ndaadaa kata noho mpo a.
      sbs: 0.7061
      gen_sec: 3.01
      ref_sec: 3.78
    '182':
      text: 'Ɔtwerɛw bɔnsa mu, na odzi ehurusi wɔ n’ahoɔdzen mu: Opue kehyia akofo a woemia.'
      sbs: 0.7044
      gen_sec: 5.63
      ref_sec: 6.46
    '183':
      text: EWURADZE na ɔse; hom a hom ka dɛ, Woana botum esian aba hɛn do?
      sbs: 0.6829
      gen_sec: 4.58
      ref_sec: 4.62
    '184':
      text: Anaadɛ nyia ɔda hɛn mu frankadua etsifi.
      sbs: 0.6807
      gen_sec: 3.33
      ref_sec: 3.92
    '185':
      text: dɛ mbrɛ ɔsabokwafo tɔ ntentan wɔ ne fe mu.
      sbs: 0.6876
      gen_sec: 3.3
      ref_sec: 3.76
    '186':
      text: 'Na ɔsee Israelhen no dɛ, Fa wo nsa to egyen no do: na ɔdze ne nsa too do.'
      sbs: 0.7132
      gen_sec: 4.83
      ref_sec: 7.32
    '187':
      text: Na ɔbaa dɛ, aber a wowiee ɔman no nyinara twatsia twitwa no, wɔtsenatsenaa hɔn ananmu wɔ nseraban
        no mu ma wɔtsee apɔw ana.
      sbs: 0.6922
      gen_sec: 9.44
      ref_sec: 12.36
    '188':
      text: Makasa prɛko, na murummbua; Nyew, mprɛnu, na moronnkɔ kan bio.
      sbs: 0.6899
      gen_sec: 4.64
      ref_sec: 5.84
    '189':
      text: 'Wo mboanofo tsenaa mu: Ɔwo, Nyankopɔn, na isiesiee abɔbɔfo wɔ w’ayamuyie mu.'
      sbs: 0.712
      gen_sec: 5.22
      ref_sec: 6.3
    '190':
      text: Na Juda mbapɔmba tsee ndzɛmba yinom no, wofii ahemfie fowee baa EWURADZE fie ɔponkɛse fofor
        no ano.
      sbs: 0.7125
      gen_sec: 7.36
      ref_sec: 7.82
    '192':
      text: Nna Farao see no dɛ, Na ebɛnadze na ehia no wɔ me nkyɛn, ma erohwehwɛ dɛ ekɔ wankasa wo man
        mu yi?
      sbs: 0.7112
      gen_sec: 6.91
      ref_sec: 7.9
    '193':
      text: 'Nna wɔfaa Jeremia, na wɔkotoow no kyeen ɔhenba Malkia mona efiadze a ɔwɔ aweɔmfo abanguado
        no mu: na wɔdze ntampehoma gyaagyaa Jeremia siaan mu.'
      sbs: 0.7096
      gen_sec: 10.75
      ref_sec: 12.34
    '194':
      text: Wɔse dɛ, Hom mbra ma yenkruw hɔn ase ma wongyaa dɛ wɔbɛyɛ ɔman; Ama wɔnnkɛkaa Israel dzin
        bio.
      sbs: 0.6876
      gen_sec: 6.34
      ref_sec: 8.02
    '195':
      text: 'Na ɔfowee kɔr ne nkyɛn: na, hwɛ, ɔtse koko no n’etsifi.'
      sbs: 0.7067
      gen_sec: 3.68
      ref_sec: 4.84
    '196':
      text: 'Na wobuaa dɛ, Ahazia no nuanom nye hɛn: na yerisian akɔ ekekyiakyia ɔhen ne mba, na ɔhembaa
        ne mba no.'
      sbs: 0.6986
      gen_sec: 7.17
      ref_sec: 10.94
    '198':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6918
      gen_sec: 5.31
      ref_sec: 5.64
    '199':
      text: Na Sallum, a ofi Kore, Ebiasaf, na Kora asefo no mu, na no nuanom a wofi n’egya fie.
      sbs: 0.6828
      gen_sec: 6.34
      ref_sec: 8.82
    '200':
      text: bɛba dɔm EWURADZE ne dzin tsenabea, bepɔw Zion no do.
      sbs: 0.7016
      gen_sec: 4.38
      ref_sec: 6.32
    '201':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.672
      gen_sec: 3.62
      ref_sec: 4.2
    '202':
      text: Hɔn a wɔdan wo gya nyina enyi bɔto; hɔn a wofi wo nkyɛn kɔ no, wɔbɛkyerɛw hɔn edzin aka asaase
        ase mba ho.
      sbs: 0.7101
      gen_sec: 7.46
      ref_sec: 8.28
    '203':
      text: Na Adonija n’aponto asefo no nyinara suroi, na wɔsoɛrsoɛree na nyimpa biara faa no kwan kɔree.
      sbs: 0.7061
      gen_sec: 6.98
      ref_sec: 8.48
    '204':
      text: Hom nka nkyerɛ amanaman dɛ wɔreba; hom mma wɔntse no Jerusalɛm.
      sbs: 0.6821
      gen_sec: 4.83
      ref_sec: 4.18
    '205':
      text: sɛ wosi frankaa wɔ mbepɔw do a, hom nhwɛ; na sɛ wɔbɔ akasamu mu a, hom ntsie.
      sbs: 0.6782
      gen_sec: 5.57
      ref_sec: 5.46
    '207':
      text: Na Kohatmba nkaa no nam tontotwe do nyae fii Efraim, Dan, nye Manaasɛ ebusuakuw fa no mu nkurow
        du.
      sbs: 0.6873
      gen_sec: 7.39
      ref_sec: 10.62
    '208':
      text: Iyi nye Benjaminmba no egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6806
      gen_sec: 5.25
      ref_sec: 7.22
    '209':
      text: Na ɔkaa Israelmba mu ebusuakuw esuon a wonnyae nnkyɛɛ hɔn egyapadze.
      sbs: 0.7072
      gen_sec: 5.28
      ref_sec: 5.76
    '210':
      text: Afei Solomon n’edwuma nyinara wosiesiei maa da a wɔtoow EWURADZE ne dan no ne fapem, na okodur
        dɛ wowiei.
      sbs: 0.713
      gen_sec: 7.39
      ref_sec: 9.0
    '211':
      text: dɛmara so na wobotwitwa hom egu, na hom etwa mu akɔ.
      sbs: 0.6749
      gen_sec: 3.84
      ref_sec: 3.46
    '213':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.7249
      gen_sec: 5.57
      ref_sec: 7.62
    '214':
      text: na ɔmaa ahendzi hihimii no nye yi; nyia ɔmaa wiadze yi yɛɛ dɛ sar.
      sbs: 0.7281
      gen_sec: 4.32
      ref_sec: 5.48
    '215':
      text: nye w’ayeforber mu dɔ no ma wo; mbrɛ idzii m’ekyir wɔ sar no do.
      sbs: 0.6698
      gen_sec: 4.29
      ref_sec: 4.9
    '216':
      text: 'Wɔdze ogya ahyew no, woetwa ato famu: W’enyim nkaenyim ntsi wɔasɛɛ.'
      sbs: 0.686
      gen_sec: 4.26
      ref_sec: 4.74
    '217':
      text: Na aber a Seba ɔhembaa no tsee Solomon ne nka wɔ EWURADZE ne dzin ho no, ɔbaa dɛ ɔdze nsɛmbisa
        dzendzen robɔsɔ no ahwɛ.
      sbs: 0.6938
      gen_sec: 8.13
      ref_sec: 7.86
    '218':
      text: Na wɔdze afona anomu kunkum hɔn; na brampafo na asafohemfo no totoow hɔn gui, na wosii mu
        kɔr Baal fie kurow no mu.
      sbs: 0.6793
      gen_sec: 8.45
      ref_sec: 10.54
    '219':
      text: Naaso ɔpoow nkɔdaa no hɔn afotu a wɔdze maa no no, na ɔnye mberantsɛ a wɔnye no nyinii a afei
        wɔabɛyɛ n’apamfo no no dwenee.
      sbs: 0.7114
      gen_sec: 8.67
      ref_sec: 11.92
    '220':
      text: 'Ɔwo edze hɛn yɛ aperdzi ma hɛn asɔnmufo: Na hɛn atamfo sereserew wɔ hɔnara hɔn mu.'
      sbs: 0.6904
      gen_sec: 6.4
      ref_sec: 7.6
    '221':
      text: anaadɛ poma bɛma nyia ɔnnyɛ dua no no do.
      sbs: 0.7253
      gen_sec: 3.1
      ref_sec: 3.34
    '222':
      text: 'Na asɛm yi maa wɔyɛɛ bɔn: osiandɛ ɔman no kɔree kɔsoom hɔn wɔ Bɛtɛl araa dze kɔr Dan.'
      sbs: 0.7321
      gen_sec: 6.5
      ref_sec: 7.32
    '223':
      text: Obeyi wo wɔ ahohia esia mu; Nyew, dza otsia esuon no mu mpo mbusu bi rennka wo.
      sbs: 0.7014
      gen_sec: 5.18
      ref_sec: 7.56
    '225':
      text: Nna Atalia tsetseew ne ntar mu, na ɔkekaa mu dɛ, Etuatsew o, iyi yɛ etuatsew.
      sbs: 0.6953
      gen_sec: 5.31
      ref_sec: 6.74
    '226':
      text: Woana na ɔwɔ enyiwa a ayɛ kɔɔ?
      sbs: 0.7109
      gen_sec: 2.3
      ref_sec: 3.68
  score: 0.6948
  partial: true
- model: k2-fsa/OmniVoice-ref
  sbs: 0.733
  num_scored: 200
  uses_reference: true
  entries:
    '0':
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.7319
      gen_sec: 7.95
      ref_sec: 9.1
    '1':
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.6946
      gen_sec: 3.28
      ref_sec: 3.66
    '3':
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.7421
      gen_sec: 6.35
      ref_sec: 6.36
    '5':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.7452
      gen_sec: 3.67
      ref_sec: 3.18
    '6':
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.7503
      gen_sec: 7.98
      ref_sec: 9.12
    '7':
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.7529
      gen_sec: 8.56
      ref_sec: 7.44
    '8':
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.7541
      gen_sec: 5.08
      ref_sec: 4.88
    '9':
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.7553
      gen_sec: 6.96
      ref_sec: 6.16
    '10':
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.7662
      gen_sec: 8.89
      ref_sec: 8.48
    '11':
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.7652
      gen_sec: 6.64
      ref_sec: 6.68
    '12':
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.7535
      gen_sec: 9.34
      ref_sec: 10.5
    '13':
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.7341
      gen_sec: 6.09
      ref_sec: 6.38
    '14':
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.701
      gen_sec: 4.05
      ref_sec: 4.1
    '15':
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.736
      gen_sec: 7.16
      ref_sec: 6.76
    '16':
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.7527
      gen_sec: 7.71
      ref_sec: 8.48
    '19':
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.7491
      gen_sec: 2.98
      ref_sec: 3.16
    '20':
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.7556
      gen_sec: 4.76
      ref_sec: 4.36
    '22':
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.7203
      gen_sec: 4.04
      ref_sec: 3.74
    '23':
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.7443
      gen_sec: 9.96
      ref_sec: 10.44
    '24':
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.7426
      gen_sec: 7.64
      ref_sec: 8.26
    '26':
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.7129
      gen_sec: 3.36
      ref_sec: 5.0
    '27':
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7181
      gen_sec: 6.5
      ref_sec: 7.04
    '28':
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.7325
      gen_sec: 8.62
      ref_sec: 9.74
    '29':
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.7418
      gen_sec: 4.45
      ref_sec: 4.34
    '30':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.7319
      gen_sec: 6.44
      ref_sec: 5.64
    '32':
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.7069
      gen_sec: 4.08
      ref_sec: 3.54
    '33':
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.7353
      gen_sec: 10.0
      ref_sec: 11.1
    '35':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.7437
      gen_sec: 6.67
      ref_sec: 7.62
    '36':
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.751
      gen_sec: 4.36
      ref_sec: 3.74
    '37':
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.7539
      gen_sec: 4.24
      ref_sec: 3.94
    '38':
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7084
      gen_sec: 6.59
      ref_sec: 7.02
    '39':
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.7152
      gen_sec: 2.07
      ref_sec: 3.74
    '40':
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.7339
      gen_sec: 6.38
      ref_sec: 5.94
    '41':
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.7196
      gen_sec: 3.56
      ref_sec: 3.26
    '42':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.7592
      gen_sec: 6.87
      ref_sec: 9.28
    '43':
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
        dɛ, Hom mma yɛmfa.'
      sbs: 0.7492
      gen_sec: 8.9
      ref_sec: 11.2
    '44':
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.7484
      gen_sec: 3.92
      ref_sec: 4.1
    '46':
      text: 'Na ɔsee dɛ, Tase egyen menaba no: na ɔtasee.'
      sbs: 0.7671
      gen_sec: 3.58
      ref_sec: 4.26
    '47':
      text: Ɔwo, Nyankopɔn, maa nyankom tɔɔ berdzedzeedze.
      sbs: 0.7461
      gen_sec: 3.93
      ref_sec: 3.42
    '48':
      text: Ne nda nyinara mu no woemmfi EWURADZE, hɔn egyanom Nyankopɔn no, n’ekyir dzi no ho emmfir.
      sbs: 0.7374
      gen_sec: 7.44
      ref_sec: 9.06
    '49':
      text: Na ɔdze etsifi mbasu nye anaafo mbasu no maa no.
      sbs: 0.7189
      gen_sec: 4.2
      ref_sec: 3.6
    '50':
      text: 'Na owungyam bi nnyi hɔn wu mu: Na mbom hɔn ahoɔdzen wɔ hɔ pintsinn.'
      sbs: 0.7387
      gen_sec: 5.04
      ref_sec: 4.82
    '51':
      text: Woana na osiesie akonkoran n’edziban ma no.
      sbs: 0.7164
      gen_sec: 3.88
      ref_sec: 3.32
    '52':
      text: Ana ɔwo na eyɛ ha nya afonam ma gyataber.
      sbs: 0.7213
      gen_sec: 3.56
      ref_sec: 3.4
    '53':
      text: 'Mber no mu no, Siriahen Hazael sii mu kɔree, na ɔnye Gat kɔkoe, na ɔfae: na Hazael dze sii
        n’enyi do dɛ ɔrokɔfow akɔ Jerusalɛm.'
      sbs: 0.7341
      gen_sec: 10.29
      ref_sec: 13.56
    '54':
      text: Na ma w’ebufuhyew no a ɔwɔ hɛn do no mbɔ adze.
      sbs: 0.7439
      gen_sec: 3.7
      ref_sec: 3.5
    '55':
      text: na ahendzi wɔ Damaskɔs; na Siria nkaa bɛyɛ dɛ.
      sbs: 0.7314
      gen_sec: 4.0
      ref_sec: 4.32
    '56':
      text: Na wɔbɔtotɔ mfuwa wɔ asaase yi a hom ka wɔ ho dɛ, Ɔyɛ amamfo, nyimpa anaa abowa nnyi do; wɔdze
        ahyɛ Kaldeafo nsa no mu.
      sbs: 0.7576
      gen_sec: 9.88
      ref_sec: 11.26
    '57':
      text: Iyi nye Gadmba no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee, nkurow no nye no nkurobaase.
      sbs: 0.7463
      gen_sec: 8.09
      ref_sec: 9.24
    '58':
      text: 'Ɔno na yennkefi wo nkyɛn akɔ ekyir: Ma yennya nkwa, na yɛbɔbɔ wo dzin.'
      sbs: 0.7534
      gen_sec: 5.8
      ref_sec: 5.02
    '59':
      text: Na Josua dze n’enyim butuuw famu, na ɔsɔɔr no, na ɔsee no dɛ, Na mo wura ese n’akowaa dɛn?
      sbs: 0.7362
      gen_sec: 7.4
      ref_sec: 8.24
    '60':
      text: Mbrɛ aboɔdzembo kotoku a ɔhyɛ abo ntamu tse no.
      sbs: 0.687
      gen_sec: 3.98
      ref_sec: 4.78
    '61':
      text: 'Emumuyɛfo guan wɔ aber a nyimpa biara nntaa hɔn do: Na atseneneefo dze, wɔyɛ ndam dɛ ogyata.'
      sbs: 0.7359
      gen_sec: 7.88
      ref_sec: 8.82
    '62':
      text: 'dɛ abaa a ɔhwee wo no ebu ntsi: na ɔwɔ no ndwow mu na ɔkyerben befir aba.'
      sbs: 0.7449
      gen_sec: 5.84
      ref_sec: 6.62
    '63':
      text: Mbrɛ ɔmansotwenyi sɔ aperper mu ogya ara nye no.
      sbs: 0.7403
      gen_sec: 3.65
      ref_sec: 4.5
    '64':
      text: Ana ɔwo ibotum akyekyer Aberwa na mba no n’ahoma.
      sbs: 0.7047
      gen_sec: 4.17
      ref_sec: 5.08
    '65':
      text: Na ɔatsen ne nsa, na woana na ɔbɔpon mu?
      sbs: 0.737
      gen_sec: 3.33
      ref_sec: 3.26
    '66':
      text: Na dɛtse atɔw atɔw no abɔ mu afemfam ho no?
      sbs: 0.6769
      gen_sec: 3.68
      ref_sec: 3.2
    '67':
      text: 'Nna wɔdze ntampehoma no twee Jeremia baa sor, na woyii no fii mona efiadze no mu: na Jeremia
        tsenaa aweɔmfo abangua no mu.'
      sbs: 0.7422
      gen_sec: 10.25
      ref_sec: 9.2
    '68':
      text: Ma munhu w’awerdzi wɔ hɔn do; na ɔwo na maka m’asɛm akyerɛ wo.
      sbs: 0.7385
      gen_sec: 4.91
      ref_sec: 4.5
    '70':
      text: Na Safan ba Ahikam ne nsa wɔ Jeremia afa, dɛ mma wonnyi no nnhyɛ ɔman no nsa mma wonnku no.
      sbs: 0.7626
      gen_sec: 7.58
      ref_sec: 9.6
    '71':
      text: ma aabɔsom me; na sɛ iyi dza ɔsom bo fi dza ɔyɛ huhuw no mu a.
      sbs: 0.7182
      gen_sec: 5.04
      ref_sec: 4.86
    '72':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.7557
      gen_sec: 9.64
      ref_sec: 10.92
    '73':
      text: 'Dɛ mbrɛ mframa bɔ wusiw kɔ no, dɛmara so na bɔ hɔn kɔ: Dɛ mbrɛ ihua nan wɔ gya enyim no.'
      sbs: 0.7445
      gen_sec: 7.09
      ref_sec: 7.46
    '74':
      text: Anantwisaa kuw no, ɔnye aman anantwimba no enyim.
      sbs: 0.7499
      gen_sec: 4.28
      ref_sec: 3.8
    '75':
      text: Na ɔsoɛree, na ɔnye no sianee kɔr ɔhen no nkyɛn.
      sbs: 0.7361
      gen_sec: 3.93
      ref_sec: 4.08
    '76':
      text: Na ɔwo, mo wura ɔhen, na Israel nyinara enyi da wo do dɛ ebɛkyerɛ hɔn nyia ɔbɛtsena w’ahengua
        do wɔ w’ekyir.
      sbs: 0.7433
      gen_sec: 8.9
      ref_sec: 8.88
    '77':
      text: Nna Asiriahen no dze enyimguase sanee kɔr nankasa n’asaase do.
      sbs: 0.7102
      gen_sec: 5.4
      ref_sec: 6.08
    '78':
      text: Ɔtse dɛ obi a osuo bɔdɔm n’asowa mu.
      sbs: 0.6937
      gen_sec: 3.01
      ref_sec: 3.68
    '80':
      text: 'Mbrɛ EWURADZE se nye yi: Sɛ hom ayeyɛ petsepetsee, na hom dɔɔ so mpo a.'
      sbs: 0.7141
      gen_sec: 5.96
      ref_sec: 5.56
    '81':
      text: Na ɔtsenaa ahemfo ahengua no do.
      sbs: 0.7007
      gen_sec: 2.68
      ref_sec: 3.0
    '82':
      text: Galim babaa, ma wo ndze do tsea mu!
      sbs: 0.7619
      gen_sec: 3.0
      ref_sec: 3.62
    '83':
      text: Nyia medze sar pradada no ayɛ ne fi.
      sbs: 0.7038
      gen_sec: 3.16
      ref_sec: 3.94
    '84':
      text: na hɔn a mehiahia hɔn ho no; na mebɛma osiifo no ayɛ nkaase.
      sbs: 0.7048
      gen_sec: 4.78
      ref_sec: 5.18
    '85':
      text: Na Joas yɛɛ dza ɔtsen wɔ EWURADZE enyiwa do, wɔ ne nda a ɔsɔfo Jehoiada kyerɛkyerɛɛ no wɔ
        mu nyinara.
      sbs: 0.7427
      gen_sec: 8.6
      ref_sec: 8.58
    '87':
      text: Na ɔronnhwɛ afɔrmbukyia, ne nsaano edwuma no, eso n’enyi ronnsɔ dza ne nsatseaba ayɛ, Aserim,
        anaadɛ ewia ehonyi no.
      sbs: 0.7601
      gen_sec: 9.35
      ref_sec: 11.84
    '88':
      text: Sen nyimpa beesuon a wotum kyerɛkyerɛ asɛm ase.
      sbs: 0.7073
      gen_sec: 4.18
      ref_sec: 5.02
    '89':
      text: Elkosnyi Nahum n’enyido adzehu nwoma a ɔfa Ninive atsɛmbu ho.
      sbs: 0.7044
      gen_sec: 5.44
      ref_sec: 5.06
    '90':
      text: 'EWURADZE, ɔwo adom w’asaase: Ɔwo edze Jakob egyapadze asan aba.'
      sbs: 0.7172
      gen_sec: 5.39
      ref_sec: 5.76
    '91':
      text: 'na medwuruw w’aban dzendzen nyina: na mubotwitwa wo mbɔnsansɛm efi wo nsamu; na innkenya
        sebramufo bio: na mubotwitwa ehonyi.'
      sbs: 0.7362
      gen_sec: 10.62
      ref_sec: 12.12
    '92':
      text: 'Emi dze memmpɛɛ ntsɛm minngyaae dɛ meyɛ oguanhwɛfo dzi w’ekyir: eso memmpɛɛ mbusu da no.'
      sbs: 0.7812
      gen_sec: 7.07
      ref_sec: 7.78
    '93':
      text: 'Nna ɔhen tse awɔwber dan no mu, wɔ bosoom a otsia akron no mu: na mbukyia mu ogya a ɔredzɛw
        taa n’enyim.'
      sbs: 0.7472
      gen_sec: 7.91
      ref_sec: 7.8
    '94':
      text: Ɔwoara nko nye Ɔsorsornyi wɔ asaase nyinara do.
      sbs: 0.7425
      gen_sec: 3.75
      ref_sec: 5.58
    '96':
      text: Aso nyia ɔyɛ nyiyiano no ɔnye Otumfo no bɛham?
      sbs: 0.7216
      gen_sec: 4.08
      ref_sec: 4.1
    '97':
      text: Na Omri ne ba Ahab yɛɛ dza omuo wɔ EWURADZE enyim seen hɔn a wodzii n’enyim nyinara.
      sbs: 0.7319
      gen_sec: 6.52
      ref_sec: 6.86
    '99':
      text: Na Aser ebusuakuw mu dze, Misal, Abdon; Helkat nye Rehob nye hɔn ho mfikyisaase, nkurow anan.
      sbs: 0.7333
      gen_sec: 7.78
      ref_sec: 11.58
    '100':
      text: Mbrɛ ɔkwadwefo so da ne mpa do ara nye no.
      sbs: 0.7111
      gen_sec: 3.49
      ref_sec: 3.78
    '101':
      text: Fa hɛn san si yie, ao hɛn nkwagye Nyankopɔn.
      sbs: 0.7426
      gen_sec: 3.73
      ref_sec: 3.16
    '102':
      text: Na iyi ntsi mibehiahia David n’asefo ho, na nnyɛ daa nyina.
      sbs: 0.734
      gen_sec: 5.08
      ref_sec: 4.88
    '103':
      text: Nna ɔhen Joas kɛfrɛɛ ɔsɔfo Jehoiada, na asɔfo nkaa no, na obisaa hɔn dɛ, Ɔyɛ dɛn ntsi na hom
        mmpempaam ofi no n’agow no yi?
      sbs: 0.7322
      gen_sec: 10.24
      ref_sec: 12.62
    '104':
      text: 'Nyia ɔkata ne mbrato do no, ɔnnkɛyɛ prɔmprɔm: Na obiara a ɔka to gua na ɔpow no, obenya ehumbɔbɔr.'
      sbs: 0.7247
      gen_sec: 8.2
      ref_sec: 8.0
    '106':
      text: Ana woeyi wu no mbobotsen no akyerɛ wo?
      sbs: 0.7072
      gen_sec: 3.21
      ref_sec: 3.66
    '107':
      text: 'Ɔhen dze atsɛmbu ma asaase gyina: Na nyia odzi mboaba no, obutuw no.'
      sbs: 0.717
      gen_sec: 5.66
      ref_sec: 7.18
    '108':
      text: Ana akɛhɛn esukwankyɛba no korabea.
      sbs: 0.683
      gen_sec: 3.28
      ref_sec: 3.26
    '109':
      text: Na wɔbɛkaa asɛm yi kyerɛɛ ɔhen no.
      sbs: 0.734
      gen_sec: 2.9
      ref_sec: 3.68
    '110':
      text: 'na etsetsɛw mu enyame ananaben: mpo sɛ wo ntsɛwee da no ara mu ema ofifir.'
      sbs: 0.7193
      gen_sec: 6.16
      ref_sec: 7.28
    '112':
      text: Mbrɛ enyidzi so mmfata ɔkwasea ara nye no.
      sbs: 0.7196
      gen_sec: 3.76
      ref_sec: 3.3
    '114':
      text: Mbrɛ EWURADZE se nye yi, Wɔdze kurow yi bɛhyɛ Babilɔnhen no dɔm nsa ara ampa, na wɔagye.
      sbs: 0.7675
      gen_sec: 7.48
      ref_sec: 7.48
    '115':
      text: Nokwar befi asaase mu efir; Na tsenenee efi sor ahwɛ famu.
      sbs: 0.7408
      gen_sec: 4.9
      ref_sec: 4.88
    '116':
      text: Na EWURADZE maa ɔtamfo bi soɛree tsiaa Solomon, Edomnyi Hadad a ofi ɔhen n’asefo mu wɔ Edom
        no a.
      sbs: 0.7323
      gen_sec: 7.63
      ref_sec: 9.54
    '117':
      text: Ebɛn asɛm na wɔdze bobua amanaman asomafo no?
      sbs: 0.7444
      gen_sec: 3.84
      ref_sec: 3.62
    '118':
      text: Na asafohen no bo fuuw Jeremia, na wɔhwee no, na wɔdze no kɔtoo efiadze wɔ ɔkyerɛwfo Jonatan
        fie; nna hɔ na wɔdze ayɛ efiadze.
      sbs: 0.7581
      gen_sec: 10.55
      ref_sec: 10.5
    '119':
      text: Dɛ gyama abaa bi him nyia ɔma do no do.
      sbs: 0.7175
      gen_sec: 3.28
      ref_sec: 3.2
    '120':
      text: 'dɛ gyatafɔr wɔ nguan ekuwekuw mu: ɔno a sɛ ɔhɛn mu a, otsiatsia do.'
      sbs: 0.7308
      gen_sec: 5.45
      ref_sec: 5.98
    '122':
      text: Hwɛ, aber a ɔwo nye ɔhen da ho rekasa wɔ hɔ no, mo so mibedzi w’ekyir maba, na mabɛhyɛ wo
        nsɛm no ma.
      sbs: 0.7207
      gen_sec: 7.6
      ref_sec: 9.42
    '123':
      text: Ɔbabanyin na ɔdɔba kor ma me na na m’egya no.
      sbs: 0.7247
      gen_sec: 3.64
      ref_sec: 5.46
    '124':
      text: 'Ao Nyankopɔn kyerɛ w’ahoɔdzen: Kyerɛ wo tum, Ao Nyankopɔn, dza edze agye hɛn no.'
      sbs: 0.7946
      gen_sec: 6.55
      ref_sec: 7.24
    '125':
      text: Nna wogyaa dɛ wɔnye no kasa; osiandɛ woennhu asɛm no.
      sbs: 0.7543
      gen_sec: 4.52
      ref_sec: 3.92
    '126':
      text: Afei Ahija no nkɔdaayɛ ntsi n’enyiwa ayɛ kusukusu na onnhu adze.
      sbs: 0.7088
      gen_sec: 5.39
      ref_sec: 6.98
    '127':
      text: Na Hilkia buae see ɔkyerɛwfo Safan dɛ, Mehu mbra nwoma no wɔ EWURADZE fie.
      sbs: 0.7365
      gen_sec: 6.4
      ref_sec: 8.0
    '128':
      text: Na boka afamu he nye Nkyen Po no, mekyerɛ ɔdze kodu Jordan ewiei.
      sbs: 0.7577
      gen_sec: 5.54
      ref_sec: 6.62
    '129':
      text: 'Tappua asaase no yɛ Manaasɛ dze: na Tappua a ɔwɔ Manaasɛ he do no dze ɔyɛ Efraimmba no dze.'
      sbs: 0.7379
      gen_sec: 7.04
      ref_sec: 8.34
    '130':
      text: Wotwa mu wɔ Nyinsu bɔnsa no mu a wɔdan no bea a mbasu wɔ; Nyew, adɔwnsu dze nhyira kata do.
      sbs: 0.7282
      gen_sec: 6.9
      ref_sec: 8.24
    '131':
      text: 'Na wɔnkyɛ mu kyɛpɛn esuon: Juda ntsena ne he do wɔ kwaamu afamu.'
      sbs: 0.7376
      gen_sec: 5.01
      ref_sec: 6.72
    '132':
      text: 'Naaso wo nda mu dze merennyɛ, osian w’egya David ntsi: na mbom mebɛtsew efi wo ba nsamu.'
      sbs: 0.7404
      gen_sec: 7.2
      ref_sec: 6.76
    '133':
      text: 'Nyia ɔtwer nankasa n’akoma no, ɔkwasea a: Na obiara a ɔnantsew nyansa mu no dze, wɔbɛgye
        no nkwa.'
      sbs: 0.7332
      gen_sec: 8.2
      ref_sec: 8.76
    '134':
      text: Nyia ɔsoɛr anapahema dze ndze kɛse hyira ne nyɛnko no.
      sbs: 0.687
      gen_sec: 4.76
      ref_sec: 4.7
    '135':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.7282
      gen_sec: 3.7
      ref_sec: 3.18
    '136':
      text: Na ofi hɔ fowee kɔr Debir a nkan no na ne dzin nye Kiriat-Sefer no do.
      sbs: 0.7378
      gen_sec: 5.37
      ref_sec: 9.1
    '137':
      text: Hwɛ, menye wo enya, ɔwo a etse bɔnsa mu e.
      sbs: 0.7577
      gen_sec: 3.36
      ref_sec: 3.4
    '138':
      text: Nna Jeremia see Zedekia dɛ, Aso mepaa mu ka kyerɛ wo a, ana nnyɛ oku ara na woboku me bi?
      sbs: 0.73
      gen_sec: 6.56
      ref_sec: 7.18
    '139':
      text: Dɛm ntsi afei hom nyiyi Israel ebusuakuw ebusuakuw mu mbanyin duebien, ebusuakuw biara mu
        nyimpa baako.
      sbs: 0.7021
      gen_sec: 9.12
      ref_sec: 9.46
    '140':
      text: Afei, me Nyankopɔn, meserɛ wo, bue w’enyiwa, na kyɛn w’aso wɔ mpaabɔ a wɔbɔ wɔ ha yi do.
      sbs: 0.7544
      gen_sec: 6.87
      ref_sec: 8.14
    '141':
      text: Otwitwa nankasa ne nan, na ɔnom mbusu.
      sbs: 0.712
      gen_sec: 3.08
      ref_sec: 3.48
    '142':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.6964
      gen_sec: 3.5
      ref_sec: 4.2
    '143':
      text: 'Na Solomon kɔr ne nsamankyir, na wosiee no wɔ n’egya David kurow mu: na ne ba Rehoboam dzii
        hen wɔ n’ananmu.'
      sbs: 0.7319
      gen_sec: 9.08
      ref_sec: 11.3
    '145':
      text: Dadze sew dadze ano; Dɛmara so na nyimpa sew ne nyɛnko enyim.
      sbs: 0.7404
      gen_sec: 5.1
      ref_sec: 4.94
    '147':
      text: Afei Zimri no ho nsɛm nkaa no na no nkontompɔ a otwae no, ana wɔnnkyerɛɛw no wɔ Israel ahemfo
        hɔn Mbermunsɛm nwoma no mu?
      sbs: 0.7341
      gen_sec: 9.81
      ref_sec: 11.44
    '148':
      text: Na ɔhwɛɛ ahemfo no nyinara do dze fi Esutsen no ho araa dze kodur Filistiafo asaase do, na
        Egypt ahe do.
      sbs: 0.7369
      gen_sec: 8.78
      ref_sec: 10.56
    '149':
      text: EWURADZE tse ase yi; nna amanaman bɛyɛ esiarfo wɔ no mu.
      sbs: 0.7349
      gen_sec: 4.54
      ref_sec: 3.4
    '150':
      text: 'Dɔm ahemfo guanguan, woguanguan: Na nyia ɔtse fie na ɔkyɛ asadze mu.'
      sbs: 0.7588
      gen_sec: 5.92
      ref_sec: 5.42
    '151':
      text: Ama wo mbɔdɔm tɛkyerɛma eenya ne kyɛpɛn wɔ w’atamfo ho.
      sbs: 0.7231
      gen_sec: 3.96
      ref_sec: 3.56
    '152':
      text: Ntsi migyaa hɔn ma wodzii hɔn akomadzen ekyir.
      sbs: 0.7298
      gen_sec: 4.16
      ref_sec: 3.26
    '153':
      text: 'Na ɔsee dɛ, Bue boka afamu tokura no: na obuei.'
      sbs: 0.7592
      gen_sec: 4.0
      ref_sec: 4.9
    '154':
      text: Na sɛ hom ayɛ dɛ nsoɛ kantankantan, na hom afɔw takaa wɔ hom nsanom mu mpo a.
      sbs: 0.7176
      gen_sec: 6.18
      ref_sec: 6.02
    '155':
      text: Aber a obui faa do, dɛ gyama ofi yafun mu rupue no; Aber a medze mununkum yɛɛ n’akataho.
      sbs: 0.73
      gen_sec: 7.07
      ref_sec: 7.58
    '156':
      text: Aso emumuyɛ akoradze wɔ emumuyɛ fi no mu.
      sbs: 0.6814
      gen_sec: 3.27
      ref_sec: 3.2
    '157':
      text: Na Reubenmba no hɔn he nye Jordan, nye ne he.
      sbs: 0.7459
      gen_sec: 3.82
      ref_sec: 3.22
    '158':
      text: Na, hwɛ, mber a ɔda ho nye ɔhen no rekasa no, nkɔnhyɛnyi Natan bae.
      sbs: 0.7466
      gen_sec: 5.6
      ref_sec: 5.62
    '159':
      text: Afei hwɛ esuson a meyɛɛ no kaa wo ho no; Odzi efuw dɛ nantwi.
      sbs: 0.7226
      gen_sec: 4.87
      ref_sec: 4.92
    '160':
      text: Israelhen Joahaz ne ba Jehoas n’afe a otsia ebien no mu nna Amazia, Judahen Joas ne ba no,
        hyɛɛ ase dzii hen.
      sbs: 0.763
      gen_sec: 8.85
      ref_sec: 11.84
    '162':
      text: Dɛm ntsi afei mma hom nngyegye sika wɔ hom amanyimfo hɔ bio, na hom nyi mma ma wɔmfa mpempam
        ofi no n’agow no.
      sbs: 0.736
      gen_sec: 9.14
      ref_sec: 11.32
    '163':
      text: 'Hom mper ngye abɔbɔfo na ehiafo: Hom nhwim hɔn mfi nyimpa bɔn no nsamu.'
      sbs: 0.726
      gen_sec: 5.84
      ref_sec: 5.7
    '164':
      text: Dɛmara so na abɔbɔfo do ɔhen tsirmɔdzennyi tse.
      sbs: 0.7135
      gen_sec: 4.12
      ref_sec: 3.38
    '165':
      text: Na ɔyɛɛ dza ɔtsen wɔ EWURADZE n’enyiwa do, na ɔnantseew n’egya David n’akwan do, na ɔanndan
        ammfa nkyɛn annkɔ enyimfa anaa abankum.
      sbs: 0.7425
      gen_sec: 10.81
      ref_sec: 11.16
    '166':
      text: Mbrɛ Jeremia tsenaa aweɔmfo abangua no mu nye no.
      sbs: 0.7297
      gen_sec: 4.36
      ref_sec: 5.58
    '167':
      text: na ɔdze n’abasa bubu mbɛtsem no; ɔbɛyɛ dɛ aber a obi ridzi mbɛtsem mpɛpɛw.
      sbs: 0.7183
      gen_sec: 5.73
      ref_sec: 6.22
    '168':
      text: Ana ofitsi dɛ wo nda hyɛɛ ase yi ahyɛ anapa do pɛn.
      sbs: 0.7269
      gen_sec: 4.32
      ref_sec: 4.84
    '169':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.7285
      gen_sec: 9.64
      ref_sec: 10.92
    '170':
      text: Ngyanka hɔn egya, na ekunafo hɔn sɛndzifo.
      sbs: 0.7232
      gen_sec: 3.73
      ref_sec: 3.42
    '171':
      text: Asɔfo No Hyɛ Hɔn Dwumadzi Ase.
      sbs: 0.6971
      gen_sec: 2.57
      ref_sec: 3.66
    '172':
      text: na Memfis banodzifo adwen efura mu; na hɔn a wɔyɛ no mbusuakuw kutuwdo bo no.
      sbs: 0.7177
      gen_sec: 6.22
      ref_sec: 7.5
    '173':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.752
      gen_sec: 6.84
      ref_sec: 9.28
    '174':
      text: 'Obu mpɔtsibaa dɛ mburonan: Ɔserew nkambaa no huuyɛ.'
      sbs: 0.7043
      gen_sec: 3.91
      ref_sec: 5.28
    '175':
      text: Nyew, dɛ mbrɛ gyata no pɔw, na gyata bɔyafo ne ndze.
      sbs: 0.7379
      gen_sec: 4.4
      ref_sec: 5.48
    '176':
      text: Afei nna ɔhen David ayɛ akɔdaa a oedzi mfe pii; ɔwɔ mu dɛ wɔdze atam kataa no do, naaso no
        ho annyɛ no hyew.
      sbs: 0.7492
      gen_sec: 8.67
      ref_sec: 9.2
    '177':
      text: 'Enyena sa a, ogya dum: Na bɔtomkɛka nnyi hɔ a, mansotwe gyaa.'
      sbs: 0.7048
      gen_sec: 5.08
      ref_sec: 6.04
    '178':
      text: Na Ahija tae suoo atar fofor a ɔhyɛ no no mu, na ɔtsetseew mu esinesin duebien.
      sbs: 0.7252
      gen_sec: 6.6
      ref_sec: 7.34
    '180':
      text: Me bepɔw a ewɔ wiramu, medze w’ahodze na w’akoradze nyina bɛma ma wɔaafom afa, na wo nsorɔnsorɔmbea
        no, wɔ bɔn ntsi, wɔ w’ahe nyinara do.
      sbs: 0.7639
      gen_sec: 11.32
      ref_sec: 11.4
    '181':
      text: Kaansa enyitan dze ndaadaa kata noho mpo a.
      sbs: 0.7225
      gen_sec: 3.59
      ref_sec: 3.78
    '182':
      text: 'Ɔtwerɛw bɔnsa mu, na odzi ehurusi wɔ n’ahoɔdzen mu: Opue kehyia akofo a woemia.'
      sbs: 0.7172
      gen_sec: 6.74
      ref_sec: 6.46
    '183':
      text: EWURADZE na ɔse; hom a hom ka dɛ, Woana botum esian aba hɛn do?
      sbs: 0.7564
      gen_sec: 5.13
      ref_sec: 4.62
    '184':
      text: Anaadɛ nyia ɔda hɛn mu frankadua etsifi.
      sbs: 0.6965
      gen_sec: 3.64
      ref_sec: 3.92
    '185':
      text: dɛ mbrɛ ɔsabokwafo tɔ ntentan wɔ ne fe mu.
      sbs: 0.7135
      gen_sec: 3.27
      ref_sec: 3.76
    '186':
      text: 'Na ɔsee Israelhen no dɛ, Fa wo nsa to egyen no do: na ɔdze ne nsa too do.'
      sbs: 0.759
      gen_sec: 5.8
      ref_sec: 7.32
    '187':
      text: Na ɔbaa dɛ, aber a wowiee ɔman no nyinara twatsia twitwa no, wɔtsenatsenaa hɔn ananmu wɔ nseraban
        no mu ma wɔtsee apɔw ana.
      sbs: 0.7578
      gen_sec: 10.38
      ref_sec: 12.36
    '188':
      text: Makasa prɛko, na murummbua; Nyew, mprɛnu, na moronnkɔ kan bio.
      sbs: 0.6994
      gen_sec: 5.01
      ref_sec: 5.84
    '189':
      text: 'Wo mboanofo tsenaa mu: Ɔwo, Nyankopɔn, na isiesiee abɔbɔfo wɔ w’ayamuyie mu.'
      sbs: 0.7412
      gen_sec: 6.18
      ref_sec: 6.3
    '190':
      text: Na Juda mbapɔmba tsee ndzɛmba yinom no, wofii ahemfie fowee baa EWURADZE fie ɔponkɛse fofor
        no ano.
      sbs: 0.7312
      gen_sec: 8.39
      ref_sec: 7.82
    '192':
      text: Nna Farao see no dɛ, Na ebɛnadze na ehia no wɔ me nkyɛn, ma erohwehwɛ dɛ ekɔ wankasa wo man
        mu yi?
      sbs: 0.7664
      gen_sec: 7.82
      ref_sec: 7.9
    '193':
      text: 'Nna wɔfaa Jeremia, na wɔkotoow no kyeen ɔhenba Malkia mona efiadze a ɔwɔ aweɔmfo abanguado
        no mu: na wɔdze ntampehoma gyaagyaa Jeremia siaan mu.'
      sbs: 0.7566
      gen_sec: 12.32
      ref_sec: 12.34
    '194':
      text: Wɔse dɛ, Hom mbra ma yenkruw hɔn ase ma wongyaa dɛ wɔbɛyɛ ɔman; Ama wɔnnkɛkaa Israel dzin
        bio.
      sbs: 0.7524
      gen_sec: 7.79
      ref_sec: 8.02
    '195':
      text: 'Na ɔfowee kɔr ne nkyɛn: na, hwɛ, ɔtse koko no n’etsifi.'
      sbs: 0.7708
      gen_sec: 4.6
      ref_sec: 4.84
    '196':
      text: 'Na wobuaa dɛ, Ahazia no nuanom nye hɛn: na yerisian akɔ ekekyiakyia ɔhen ne mba, na ɔhembaa
        ne mba no.'
      sbs: 0.7372
      gen_sec: 8.41
      ref_sec: 10.94
    '198':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.7425
      gen_sec: 6.45
      ref_sec: 5.64
    '199':
      text: Na Sallum, a ofi Kore, Ebiasaf, na Kora asefo no mu, na no nuanom a wofi n’egya fie.
      sbs: 0.7378
      gen_sec: 6.84
      ref_sec: 8.82
    '200':
      text: bɛba dɔm EWURADZE ne dzin tsenabea, bepɔw Zion no do.
      sbs: 0.7141
      gen_sec: 4.64
      ref_sec: 6.32
    '201':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.7064
      gen_sec: 3.31
      ref_sec: 4.2
    '202':
      text: Hɔn a wɔdan wo gya nyina enyi bɔto; hɔn a wofi wo nkyɛn kɔ no, wɔbɛkyerɛw hɔn edzin aka asaase
        ase mba ho.
      sbs: 0.7386
      gen_sec: 8.73
      ref_sec: 8.28
    '203':
      text: Na Adonija n’aponto asefo no nyinara suroi, na wɔsoɛrsoɛree na nyimpa biara faa no kwan kɔree.
      sbs: 0.731
      gen_sec: 8.02
      ref_sec: 8.48
    '204':
      text: Hom nka nkyerɛ amanaman dɛ wɔreba; hom mma wɔntse no Jerusalɛm.
      sbs: 0.7387
      gen_sec: 5.34
      ref_sec: 4.18
    '205':
      text: sɛ wosi frankaa wɔ mbepɔw do a, hom nhwɛ; na sɛ wɔbɔ akasamu mu a, hom ntsie.
      sbs: 0.718
      gen_sec: 6.36
      ref_sec: 5.46
    '207':
      text: Na Kohatmba nkaa no nam tontotwe do nyae fii Efraim, Dan, nye Manaasɛ ebusuakuw fa no mu nkurow
        du.
      sbs: 0.736
      gen_sec: 8.44
      ref_sec: 10.62
    '208':
      text: Iyi nye Benjaminmba no egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7245
      gen_sec: 5.71
      ref_sec: 7.22
    '209':
      text: Na ɔkaa Israelmba mu ebusuakuw esuon a wonnyae nnkyɛɛ hɔn egyapadze.
      sbs: 0.7061
      gen_sec: 6.08
      ref_sec: 5.76
    '210':
      text: Afei Solomon n’edwuma nyinara wosiesiei maa da a wɔtoow EWURADZE ne dan no ne fapem, na okodur
        dɛ wowiei.
      sbs: 0.7514
      gen_sec: 8.78
      ref_sec: 9.0
    '211':
      text: dɛmara so na wobotwitwa hom egu, na hom etwa mu akɔ.
      sbs: 0.6913
      gen_sec: 4.33
      ref_sec: 3.46
    '213':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.7644
      gen_sec: 6.72
      ref_sec: 7.62
    '214':
      text: na ɔmaa ahendzi hihimii no nye yi; nyia ɔmaa wiadze yi yɛɛ dɛ sar.
      sbs: 0.7455
      gen_sec: 5.4
      ref_sec: 5.48
    '215':
      text: nye w’ayeforber mu dɔ no ma wo; mbrɛ idzii m’ekyir wɔ sar no do.
      sbs: 0.7425
      gen_sec: 4.91
      ref_sec: 4.9
    '216':
      text: 'Wɔdze ogya ahyew no, woetwa ato famu: W’enyim nkaenyim ntsi wɔasɛɛ.'
      sbs: 0.7267
      gen_sec: 5.66
      ref_sec: 4.74
    '217':
      text: Na aber a Seba ɔhembaa no tsee Solomon ne nka wɔ EWURADZE ne dzin ho no, ɔbaa dɛ ɔdze nsɛmbisa
        dzendzen robɔsɔ no ahwɛ.
      sbs: 0.731
      gen_sec: 9.79
      ref_sec: 7.86
    '218':
      text: Na wɔdze afona anomu kunkum hɔn; na brampafo na asafohemfo no totoow hɔn gui, na wosii mu
        kɔr Baal fie kurow no mu.
      sbs: 0.7476
      gen_sec: 9.57
      ref_sec: 10.54
    '219':
      text: Naaso ɔpoow nkɔdaa no hɔn afotu a wɔdze maa no no, na ɔnye mberantsɛ a wɔnye no nyinii a afei
        wɔabɛyɛ n’apamfo no no dwenee.
      sbs: 0.7324
      gen_sec: 10.28
      ref_sec: 11.92
    '220':
      text: 'Ɔwo edze hɛn yɛ aperdzi ma hɛn asɔnmufo: Na hɛn atamfo sereserew wɔ hɔnara hɔn mu.'
      sbs: 0.7348
      gen_sec: 6.98
      ref_sec: 7.6
    '221':
      text: anaadɛ poma bɛma nyia ɔnnyɛ dua no no do.
      sbs: 0.7231
      gen_sec: 3.33
      ref_sec: 3.34
    '222':
      text: 'Na asɛm yi maa wɔyɛɛ bɔn: osiandɛ ɔman no kɔree kɔsoom hɔn wɔ Bɛtɛl araa dze kɔr Dan.'
      sbs: 0.7653
      gen_sec: 7.01
      ref_sec: 7.32
    '223':
      text: Obeyi wo wɔ ahohia esia mu; Nyew, dza otsia esuon no mu mpo mbusu bi rennka wo.
      sbs: 0.6929
      gen_sec: 6.58
      ref_sec: 7.56
    '225':
      text: Nna Atalia tsetseew ne ntar mu, na ɔkekaa mu dɛ, Etuatsew o, iyi yɛ etuatsew.
      sbs: 0.7164
      gen_sec: 6.52
      ref_sec: 6.74
    '226':
      text: Woana na ɔwɔ enyiwa a ayɛ kɔɔ?
      sbs: 0.7215
      gen_sec: 2.54
      ref_sec: 3.68
  score: 0.733
  partial: true
- model: ghananlpcommunity/ghana-tts-36k-noref
  sbs: 0.6863
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.6927
      gen_sec: 8.64
      ref_sec: 9.1
    '1':
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.6561
      gen_sec: 3.76
      ref_sec: 3.66
    '3':
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.6744
      gen_sec: 6.56
      ref_sec: 6.36
    '5':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6842
      gen_sec: 2.64
      ref_sec: 3.18
    '6':
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.6889
      gen_sec: 7.92
      ref_sec: 9.12
    '7':
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.6684
      gen_sec: 8.16
      ref_sec: 7.44
    '8':
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.7126
      gen_sec: 4.8
      ref_sec: 4.88
    '9':
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.688
      gen_sec: 6.0
      ref_sec: 6.16
    '10':
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.7819
      gen_sec: 9.76
      ref_sec: 8.48
    '11':
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.7342
      gen_sec: 5.68
      ref_sec: 6.68
    '12':
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.7075
      gen_sec: 9.2
      ref_sec: 10.5
    '13':
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.7597
      gen_sec: 6.08
      ref_sec: 6.38
    '14':
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.6386
      gen_sec: 2.96
      ref_sec: 4.1
    '15':
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.701
      gen_sec: 6.8
      ref_sec: 6.76
    '16':
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.6108
      gen_sec: 6.4
      ref_sec: 8.48
    '19':
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.6813
      gen_sec: 1.84
      ref_sec: 3.16
    '20':
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.7189
      gen_sec: 4.56
      ref_sec: 4.36
    '22':
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.634
      gen_sec: 4.08
      ref_sec: 3.74
    '23':
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.6899
      gen_sec: 9.12
      ref_sec: 10.44
    '24':
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.7141
      gen_sec: 6.32
      ref_sec: 8.26
    '26':
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.6841
      gen_sec: 3.36
      ref_sec: 5.0
    '27':
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6583
      gen_sec: 6.08
      ref_sec: 7.04
    '28':
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.6515
      gen_sec: 6.32
      ref_sec: 9.74
    '29':
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.6837
      gen_sec: 9.12
      ref_sec: 4.34
    '30':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.7289
      gen_sec: 5.84
      ref_sec: 5.64
    '32':
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.6385
      gen_sec: 3.12
      ref_sec: 3.54
    '33':
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.6825
      gen_sec: 8.24
      ref_sec: 11.1
    '35':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.6534
      gen_sec: 5.68
      ref_sec: 7.62
    '36':
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.6378
      gen_sec: 3.52
      ref_sec: 3.74
    '37':
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.7147
      gen_sec: 3.76
      ref_sec: 3.94
    '38':
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6898
      gen_sec: 5.76
      ref_sec: 7.02
    '39':
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.7115
      gen_sec: 1.2
      ref_sec: 3.74
    '40':
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.7179
      gen_sec: 6.0
      ref_sec: 5.94
    '41':
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.6792
      gen_sec: 3.76
      ref_sec: 3.26
    '42':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.6538
      gen_sec: 6.8
      ref_sec: 9.28
    '43':
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
        dɛ, Hom mma yɛmfa.'
      sbs: 0.7196
      gen_sec: 11.6
      ref_sec: 11.2
    '44':
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.648
      gen_sec: 3.68
      ref_sec: 4.1
    '46':
      text: 'Na ɔsee dɛ, Tase egyen menaba no: na ɔtasee.'
      sbs: 0.6516
      gen_sec: 3.68
      ref_sec: 4.26
    '47':
      text: Ɔwo, Nyankopɔn, maa nyankom tɔɔ berdzedzeedze.
      sbs: 0.7363
      gen_sec: 3.84
      ref_sec: 3.42
    '48':
      text: Ne nda nyinara mu no woemmfi EWURADZE, hɔn egyanom Nyankopɔn no, n’ekyir dzi no ho emmfir.
      sbs: 0.6737
      gen_sec: 6.88
      ref_sec: 9.06
    '49':
      text: Na ɔdze etsifi mbasu nye anaafo mbasu no maa no.
      sbs: 0.6837
      gen_sec: 3.44
      ref_sec: 3.6
    '50':
      text: 'Na owungyam bi nnyi hɔn wu mu: Na mbom hɔn ahoɔdzen wɔ hɔ pintsinn.'
      sbs: 0.6589
      gen_sec: 4.72
      ref_sec: 4.82
    '51':
      text: Woana na osiesie akonkoran n’edziban ma no.
      sbs: 0.7002
      gen_sec: 2.64
      ref_sec: 3.32
    '52':
      text: Ana ɔwo na eyɛ ha nya afonam ma gyataber.
      sbs: 0.7031
      gen_sec: 2.08
      ref_sec: 3.4
    '53':
      text: 'Mber no mu no, Siriahen Hazael sii mu kɔree, na ɔnye Gat kɔkoe, na ɔfae: na Hazael dze sii
        n’enyi do dɛ ɔrokɔfow akɔ Jerusalɛm.'
      sbs: 0.6775
      gen_sec: 12.08
      ref_sec: 13.56
    '54':
      text: Na ma w’ebufuhyew no a ɔwɔ hɛn do no mbɔ adze.
      sbs: 0.6423
      gen_sec: 2.56
      ref_sec: 3.5
    '55':
      text: na ahendzi wɔ Damaskɔs; na Siria nkaa bɛyɛ dɛ.
      sbs: 0.7027
      gen_sec: 3.04
      ref_sec: 4.32
    '56':
      text: Na wɔbɔtotɔ mfuwa wɔ asaase yi a hom ka wɔ ho dɛ, Ɔyɛ amamfo, nyimpa anaa abowa nnyi do; wɔdze
        ahyɛ Kaldeafo nsa no mu.
      sbs: 0.7038
      gen_sec: 8.64
      ref_sec: 11.26
    '57':
      text: Iyi nye Gadmba no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee, nkurow no nye no nkurobaase.
      sbs: 0.6743
      gen_sec: 6.96
      ref_sec: 9.24
    '58':
      text: 'Ɔno na yennkefi wo nkyɛn akɔ ekyir: Ma yennya nkwa, na yɛbɔbɔ wo dzin.'
      sbs: 0.729
      gen_sec: 8.64
      ref_sec: 5.02
    '59':
      text: Na Josua dze n’enyim butuuw famu, na ɔsɔɔr no, na ɔsee no dɛ, Na mo wura ese n’akowaa dɛn?
      sbs: 0.7113
      gen_sec: 7.2
      ref_sec: 8.24
    '60':
      text: Mbrɛ aboɔdzembo kotoku a ɔhyɛ abo ntamu tse no.
      sbs: 0.6605
      gen_sec: 3.28
      ref_sec: 4.78
    '61':
      text: 'Emumuyɛfo guan wɔ aber a nyimpa biara nntaa hɔn do: Na atseneneefo dze, wɔyɛ ndam dɛ ogyata.'
      sbs: 0.7009
      gen_sec: 7.36
      ref_sec: 8.82
    '62':
      text: 'dɛ abaa a ɔhwee wo no ebu ntsi: na ɔwɔ no ndwow mu na ɔkyerben befir aba.'
      sbs: 0.6468
      gen_sec: 5.92
      ref_sec: 6.62
    '63':
      text: Mbrɛ ɔmansotwenyi sɔ aperper mu ogya ara nye no.
      sbs: 0.6861
      gen_sec: 2.56
      ref_sec: 4.5
    '64':
      text: Ana ɔwo ibotum akyekyer Aberwa na mba no n’ahoma.
      sbs: 0.6709
      gen_sec: 3.52
      ref_sec: 5.08
    '65':
      text: Na ɔatsen ne nsa, na woana na ɔbɔpon mu?
      sbs: 0.68
      gen_sec: 1.6
      ref_sec: 3.26
    '66':
      text: Na dɛtse atɔw atɔw no abɔ mu afemfam ho no?
      sbs: 0.6857
      gen_sec: 2.64
      ref_sec: 3.2
    '67':
      text: 'Nna wɔdze ntampehoma no twee Jeremia baa sor, na woyii no fii mona efiadze no mu: na Jeremia
        tsenaa aweɔmfo abangua no mu.'
      sbs: 0.6874
      gen_sec: 9.36
      ref_sec: 9.2
    '68':
      text: Ma munhu w’awerdzi wɔ hɔn do; na ɔwo na maka m’asɛm akyerɛ wo.
      sbs: 0.6064
      gen_sec: 4.08
      ref_sec: 4.5
    '70':
      text: Na Safan ba Ahikam ne nsa wɔ Jeremia afa, dɛ mma wonnyi no nnhyɛ ɔman no nsa mma wonnku no.
      sbs: 0.6574
      gen_sec: 6.24
      ref_sec: 9.6
    '71':
      text: ma aabɔsom me; na sɛ iyi dza ɔsom bo fi dza ɔyɛ huhuw no mu a.
      sbs: 0.6632
      gen_sec: 4.32
      ref_sec: 4.86
    '72':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.6921
      gen_sec: 8.24
      ref_sec: 10.92
    '73':
      text: 'Dɛ mbrɛ mframa bɔ wusiw kɔ no, dɛmara so na bɔ hɔn kɔ: Dɛ mbrɛ ihua nan wɔ gya enyim no.'
      sbs: 0.6874
      gen_sec: 6.56
      ref_sec: 7.46
    '74':
      text: Anantwisaa kuw no, ɔnye aman anantwimba no enyim.
      sbs: 0.6964
      gen_sec: 3.6
      ref_sec: 3.8
    '75':
      text: Na ɔsoɛree, na ɔnye no sianee kɔr ɔhen no nkyɛn.
      sbs: 0.7349
      gen_sec: 3.12
      ref_sec: 4.08
    '76':
      text: Na ɔwo, mo wura ɔhen, na Israel nyinara enyi da wo do dɛ ebɛkyerɛ hɔn nyia ɔbɛtsena w’ahengua
        do wɔ w’ekyir.
      sbs: 0.7004
      gen_sec: 6.24
      ref_sec: 8.88
    '77':
      text: Nna Asiriahen no dze enyimguase sanee kɔr nankasa n’asaase do.
      sbs: 0.7157
      gen_sec: 4.88
      ref_sec: 6.08
    '78':
      text: Ɔtse dɛ obi a osuo bɔdɔm n’asowa mu.
      sbs: 0.694
      gen_sec: 2.24
      ref_sec: 3.68
    '80':
      text: 'Mbrɛ EWURADZE se nye yi: Sɛ hom ayeyɛ petsepetsee, na hom dɔɔ so mpo a.'
      sbs: 0.7558
      gen_sec: 5.36
      ref_sec: 5.56
    '81':
      text: Na ɔtsenaa ahemfo ahengua no do.
      sbs: 0.6328
      gen_sec: 1.76
      ref_sec: 3.0
    '82':
      text: Galim babaa, ma wo ndze do tsea mu!
      sbs: 0.6884
      gen_sec: 2.48
      ref_sec: 3.62
    '83':
      text: Nyia medze sar pradada no ayɛ ne fi.
      sbs: 0.683
      gen_sec: 3.28
      ref_sec: 3.94
    '84':
      text: na hɔn a mehiahia hɔn ho no; na mebɛma osiifo no ayɛ nkaase.
      sbs: 0.7016
      gen_sec: 5.28
      ref_sec: 5.18
    '85':
      text: Na Joas yɛɛ dza ɔtsen wɔ EWURADZE enyiwa do, wɔ ne nda a ɔsɔfo Jehoiada kyerɛkyerɛɛ no wɔ
        mu nyinara.
      sbs: 0.6918
      gen_sec: 12.16
      ref_sec: 8.58
    '87':
      text: Na ɔronnhwɛ afɔrmbukyia, ne nsaano edwuma no, eso n’enyi ronnsɔ dza ne nsatseaba ayɛ, Aserim,
        anaadɛ ewia ehonyi no.
      sbs: 0.7195
      gen_sec: 9.68
      ref_sec: 11.84
    '88':
      text: Sen nyimpa beesuon a wotum kyerɛkyerɛ asɛm ase.
      sbs: 0.6085
      gen_sec: 3.6
      ref_sec: 5.02
    '89':
      text: Elkosnyi Nahum n’enyido adzehu nwoma a ɔfa Ninive atsɛmbu ho.
      sbs: 0.7051
      gen_sec: 5.04
      ref_sec: 5.06
    '90':
      text: 'EWURADZE, ɔwo adom w’asaase: Ɔwo edze Jakob egyapadze asan aba.'
      sbs: 0.7148
      gen_sec: 5.44
      ref_sec: 5.76
    '91':
      text: 'na medwuruw w’aban dzendzen nyina: na mubotwitwa wo mbɔnsansɛm efi wo nsamu; na innkenya
        sebramufo bio: na mubotwitwa ehonyi.'
      sbs: 0.7564
      gen_sec: 9.04
      ref_sec: 12.12
    '92':
      text: 'Emi dze memmpɛɛ ntsɛm minngyaae dɛ meyɛ oguanhwɛfo dzi w’ekyir: eso memmpɛɛ mbusu da no.'
      sbs: 0.7678
      gen_sec: 8.96
      ref_sec: 7.78
    '93':
      text: 'Nna ɔhen tse awɔwber dan no mu, wɔ bosoom a otsia akron no mu: na mbukyia mu ogya a ɔredzɛw
        taa n’enyim.'
      sbs: 0.7019
      gen_sec: 7.44
      ref_sec: 7.8
    '94':
      text: Ɔwoara nko nye Ɔsorsornyi wɔ asaase nyinara do.
      sbs: 0.6022
      gen_sec: 3.36
      ref_sec: 5.58
    '96':
      text: Aso nyia ɔyɛ nyiyiano no ɔnye Otumfo no bɛham?
      sbs: 0.6998
      gen_sec: 2.72
      ref_sec: 4.1
    '97':
      text: Na Omri ne ba Ahab yɛɛ dza omuo wɔ EWURADZE enyim seen hɔn a wodzii n’enyim nyinara.
      sbs: 0.7247
      gen_sec: 5.92
      ref_sec: 6.86
    '99':
      text: Na Aser ebusuakuw mu dze, Misal, Abdon; Helkat nye Rehob nye hɔn ho mfikyisaase, nkurow anan.
      sbs: 0.7353
      gen_sec: 10.24
      ref_sec: 11.58
    '100':
      text: Mbrɛ ɔkwadwefo so da ne mpa do ara nye no.
      sbs: 0.5375
      gen_sec: 2.4
      ref_sec: 3.78
    '101':
      text: Fa hɛn san si yie, ao hɛn nkwagye Nyankopɔn.
      sbs: 0.6895
      gen_sec: 3.04
      ref_sec: 3.16
    '102':
      text: Na iyi ntsi mibehiahia David n’asefo ho, na nnyɛ daa nyina.
      sbs: 0.7284
      gen_sec: 4.96
      ref_sec: 4.88
    '103':
      text: Nna ɔhen Joas kɛfrɛɛ ɔsɔfo Jehoiada, na asɔfo nkaa no, na obisaa hɔn dɛ, Ɔyɛ dɛn ntsi na hom
        mmpempaam ofi no n’agow no yi?
      sbs: 0.672
      gen_sec: 10.48
      ref_sec: 12.62
    '104':
      text: 'Nyia ɔkata ne mbrato do no, ɔnnkɛyɛ prɔmprɔm: Na obiara a ɔka to gua na ɔpow no, obenya ehumbɔbɔr.'
      sbs: 0.6648
      gen_sec: 7.68
      ref_sec: 8.0
    '106':
      text: Ana woeyi wu no mbobotsen no akyerɛ wo?
      sbs: 0.6982
      gen_sec: 2.56
      ref_sec: 3.66
    '107':
      text: 'Ɔhen dze atsɛmbu ma asaase gyina: Na nyia odzi mboaba no, obutuw no.'
      sbs: 0.6776
      gen_sec: 4.8
      ref_sec: 7.18
    '108':
      text: Ana akɛhɛn esukwankyɛba no korabea.
      sbs: 0.6489
      gen_sec: 1.92
      ref_sec: 3.26
    '109':
      text: Na wɔbɛkaa asɛm yi kyerɛɛ ɔhen no.
      sbs: 0.8157
      gen_sec: 4.0
      ref_sec: 3.68
    '110':
      text: 'na etsetsɛw mu enyame ananaben: mpo sɛ wo ntsɛwee da no ara mu ema ofifir.'
      sbs: 0.6711
      gen_sec: 5.44
      ref_sec: 7.28
    '112':
      text: Mbrɛ enyidzi so mmfata ɔkwasea ara nye no.
      sbs: 0.6857
      gen_sec: 3.52
      ref_sec: 3.3
    '114':
      text: Mbrɛ EWURADZE se nye yi, Wɔdze kurow yi bɛhyɛ Babilɔnhen no dɔm nsa ara ampa, na wɔagye.
      sbs: 0.6319
      gen_sec: 6.72
      ref_sec: 7.48
    '115':
      text: Nokwar befi asaase mu efir; Na tsenenee efi sor ahwɛ famu.
      sbs: 0.6965
      gen_sec: 4.56
      ref_sec: 4.88
    '116':
      text: Na EWURADZE maa ɔtamfo bi soɛree tsiaa Solomon, Edomnyi Hadad a ofi ɔhen n’asefo mu wɔ Edom
        no a.
      sbs: 0.7161
      gen_sec: 8.8
      ref_sec: 9.54
    '117':
      text: Ebɛn asɛm na wɔdze bobua amanaman asomafo no?
      sbs: 0.7062
      gen_sec: 3.12
      ref_sec: 3.62
    '118':
      text: Na asafohen no bo fuuw Jeremia, na wɔhwee no, na wɔdze no kɔtoo efiadze wɔ ɔkyerɛwfo Jonatan
        fie; nna hɔ na wɔdze ayɛ efiadze.
      sbs: 0.7091
      gen_sec: 8.4
      ref_sec: 10.5
    '119':
      text: Dɛ gyama abaa bi him nyia ɔma do no do.
      sbs: 0.691
      gen_sec: 3.36
      ref_sec: 3.2
    '120':
      text: 'dɛ gyatafɔr wɔ nguan ekuwekuw mu: ɔno a sɛ ɔhɛn mu a, otsiatsia do.'
      sbs: 0.6875
      gen_sec: 4.64
      ref_sec: 5.98
    '122':
      text: Hwɛ, aber a ɔwo nye ɔhen da ho rekasa wɔ hɔ no, mo so mibedzi w’ekyir maba, na mabɛhyɛ wo
        nsɛm no ma.
      sbs: 0.688
      gen_sec: 7.44
      ref_sec: 9.42
    '123':
      text: Ɔbabanyin na ɔdɔba kor ma me na na m’egya no.
      sbs: 0.7013
      gen_sec: 3.04
      ref_sec: 5.46
    '124':
      text: 'Ao Nyankopɔn kyerɛ w’ahoɔdzen: Kyerɛ wo tum, Ao Nyankopɔn, dza edze agye hɛn no.'
      sbs: 0.733
      gen_sec: 5.44
      ref_sec: 7.24
    '125':
      text: Nna wogyaa dɛ wɔnye no kasa; osiandɛ woennhu asɛm no.
      sbs: 0.5996
      gen_sec: 3.52
      ref_sec: 3.92
    '126':
      text: Afei Ahija no nkɔdaayɛ ntsi n’enyiwa ayɛ kusukusu na onnhu adze.
      sbs: 0.6684
      gen_sec: 4.64
      ref_sec: 6.98
    '127':
      text: Na Hilkia buae see ɔkyerɛwfo Safan dɛ, Mehu mbra nwoma no wɔ EWURADZE fie.
      sbs: 0.7045
      gen_sec: 5.12
      ref_sec: 8.0
    '128':
      text: Na boka afamu he nye Nkyen Po no, mekyerɛ ɔdze kodu Jordan ewiei.
      sbs: 0.6472
      gen_sec: 4.32
      ref_sec: 6.62
    '129':
      text: 'Tappua asaase no yɛ Manaasɛ dze: na Tappua a ɔwɔ Manaasɛ he do no dze ɔyɛ Efraimmba no dze.'
      sbs: 0.7387
      gen_sec: 5.76
      ref_sec: 8.34
    '130':
      text: Wotwa mu wɔ Nyinsu bɔnsa no mu a wɔdan no bea a mbasu wɔ; Nyew, adɔwnsu dze nhyira kata do.
      sbs: 0.7385
      gen_sec: 6.56
      ref_sec: 8.24
    '131':
      text: 'Na wɔnkyɛ mu kyɛpɛn esuon: Juda ntsena ne he do wɔ kwaamu afamu.'
      sbs: 0.6385
      gen_sec: 4.64
      ref_sec: 6.72
    '132':
      text: 'Naaso wo nda mu dze merennyɛ, osian w’egya David ntsi: na mbom mebɛtsew efi wo ba nsamu.'
      sbs: 0.745
      gen_sec: 5.92
      ref_sec: 6.76
    '133':
      text: 'Nyia ɔtwer nankasa n’akoma no, ɔkwasea a: Na obiara a ɔnantsew nyansa mu no dze, wɔbɛgye
        no nkwa.'
      sbs: 0.7033
      gen_sec: 6.88
      ref_sec: 8.76
    '134':
      text: Nyia ɔsoɛr anapahema dze ndze kɛse hyira ne nyɛnko no.
      sbs: 0.6646
      gen_sec: 3.2
      ref_sec: 4.7
    '135':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6762
      gen_sec: 2.72
      ref_sec: 3.18
    '136':
      text: Na ofi hɔ fowee kɔr Debir a nkan no na ne dzin nye Kiriat-Sefer no do.
      sbs: 0.6544
      gen_sec: 5.12
      ref_sec: 9.1
    '137':
      text: Hwɛ, menye wo enya, ɔwo a etse bɔnsa mu e.
      sbs: 0.6499
      gen_sec: 3.76
      ref_sec: 3.4
    '138':
      text: Nna Jeremia see Zedekia dɛ, Aso mepaa mu ka kyerɛ wo a, ana nnyɛ oku ara na woboku me bi?
      sbs: 0.6638
      gen_sec: 7.6
      ref_sec: 7.18
    '139':
      text: Dɛm ntsi afei hom nyiyi Israel ebusuakuw ebusuakuw mu mbanyin duebien, ebusuakuw biara mu
        nyimpa baako.
      sbs: 0.7277
      gen_sec: 7.36
      ref_sec: 9.46
    '140':
      text: Afei, me Nyankopɔn, meserɛ wo, bue w’enyiwa, na kyɛn w’aso wɔ mpaabɔ a wɔbɔ wɔ ha yi do.
      sbs: 0.6824
      gen_sec: 6.32
      ref_sec: 8.14
    '141':
      text: Otwitwa nankasa ne nan, na ɔnom mbusu.
      sbs: 0.7415
      gen_sec: 2.8
      ref_sec: 3.48
    '142':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.6986
      gen_sec: 2.4
      ref_sec: 4.2
    '143':
      text: 'Na Solomon kɔr ne nsamankyir, na wosiee no wɔ n’egya David kurow mu: na ne ba Rehoboam dzii
        hen wɔ n’ananmu.'
      sbs: 0.6968
      gen_sec: 7.52
      ref_sec: 11.3
    '145':
      text: Dadze sew dadze ano; Dɛmara so na nyimpa sew ne nyɛnko enyim.
      sbs: 0.7085
      gen_sec: 4.8
      ref_sec: 4.94
    '147':
      text: Afei Zimri no ho nsɛm nkaa no na no nkontompɔ a otwae no, ana wɔnnkyerɛɛw no wɔ Israel ahemfo
        hɔn Mbermunsɛm nwoma no mu?
      sbs: 0.7262
      gen_sec: 9.92
      ref_sec: 11.44
    '148':
      text: Na ɔhwɛɛ ahemfo no nyinara do dze fi Esutsen no ho araa dze kodur Filistiafo asaase do, na
        Egypt ahe do.
      sbs: 0.671
      gen_sec: 6.88
      ref_sec: 10.56
    '149':
      text: EWURADZE tse ase yi; nna amanaman bɛyɛ esiarfo wɔ no mu.
      sbs: 0.6712
      gen_sec: 3.36
      ref_sec: 3.4
    '150':
      text: 'Dɔm ahemfo guanguan, woguanguan: Na nyia ɔtse fie na ɔkyɛ asadze mu.'
      sbs: 0.6986
      gen_sec: 5.84
      ref_sec: 5.42
    '151':
      text: Ama wo mbɔdɔm tɛkyerɛma eenya ne kyɛpɛn wɔ w’atamfo ho.
      sbs: 0.6204
      gen_sec: 4.0
      ref_sec: 3.56
    '152':
      text: Ntsi migyaa hɔn ma wodzii hɔn akomadzen ekyir.
      sbs: 0.662
      gen_sec: 3.28
      ref_sec: 3.26
    '153':
      text: 'Na ɔsee dɛ, Bue boka afamu tokura no: na obuei.'
      sbs: 0.679
      gen_sec: 4.0
      ref_sec: 4.9
    '154':
      text: Na sɛ hom ayɛ dɛ nsoɛ kantankantan, na hom afɔw takaa wɔ hom nsanom mu mpo a.
      sbs: 0.7004
      gen_sec: 5.6
      ref_sec: 6.02
    '155':
      text: Aber a obui faa do, dɛ gyama ofi yafun mu rupue no; Aber a medze mununkum yɛɛ n’akataho.
      sbs: 0.7034
      gen_sec: 7.28
      ref_sec: 7.58
    '156':
      text: Aso emumuyɛ akoradze wɔ emumuyɛ fi no mu.
      sbs: 0.7167
      gen_sec: 3.28
      ref_sec: 3.2
    '157':
      text: Na Reubenmba no hɔn he nye Jordan, nye ne he.
      sbs: 0.6938
      gen_sec: 2.64
      ref_sec: 3.22
    '158':
      text: Na, hwɛ, mber a ɔda ho nye ɔhen no rekasa no, nkɔnhyɛnyi Natan bae.
      sbs: 0.642
      gen_sec: 4.8
      ref_sec: 5.62
    '159':
      text: Afei hwɛ esuson a meyɛɛ no kaa wo ho no; Odzi efuw dɛ nantwi.
      sbs: 0.6988
      gen_sec: 4.08
      ref_sec: 4.92
    '160':
      text: Israelhen Joahaz ne ba Jehoas n’afe a otsia ebien no mu nna Amazia, Judahen Joas ne ba no,
        hyɛɛ ase dzii hen.
      sbs: 0.6742
      gen_sec: 11.52
      ref_sec: 11.84
    '162':
      text: Dɛm ntsi afei mma hom nngyegye sika wɔ hom amanyimfo hɔ bio, na hom nyi mma ma wɔmfa mpempam
        ofi no n’agow no.
      sbs: 0.7317
      gen_sec: 8.64
      ref_sec: 11.32
    '163':
      text: 'Hom mper ngye abɔbɔfo na ehiafo: Hom nhwim hɔn mfi nyimpa bɔn no nsamu.'
      sbs: 0.6868
      gen_sec: 5.2
      ref_sec: 5.7
    '164':
      text: Dɛmara so na abɔbɔfo do ɔhen tsirmɔdzennyi tse.
      sbs: 0.7327
      gen_sec: 3.44
      ref_sec: 3.38
    '165':
      text: Na ɔyɛɛ dza ɔtsen wɔ EWURADZE n’enyiwa do, na ɔnantseew n’egya David n’akwan do, na ɔanndan
        ammfa nkyɛn annkɔ enyimfa anaa abankum.
      sbs: 0.6686
      gen_sec: 8.0
      ref_sec: 11.16
    '166':
      text: Mbrɛ Jeremia tsenaa aweɔmfo abangua no mu nye no.
      sbs: 0.5854
      gen_sec: 3.84
      ref_sec: 5.58
    '167':
      text: na ɔdze n’abasa bubu mbɛtsem no; ɔbɛyɛ dɛ aber a obi ridzi mbɛtsem mpɛpɛw.
      sbs: 0.6942
      gen_sec: 4.72
      ref_sec: 6.22
    '168':
      text: Ana ofitsi dɛ wo nda hyɛɛ ase yi ahyɛ anapa do pɛn.
      sbs: 0.6548
      gen_sec: 3.2
      ref_sec: 4.84
    '169':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.6128
      gen_sec: 9.2
      ref_sec: 10.92
    '170':
      text: Ngyanka hɔn egya, na ekunafo hɔn sɛndzifo.
      sbs: 0.6622
      gen_sec: 2.96
      ref_sec: 3.42
    '171':
      text: Asɔfo No Hyɛ Hɔn Dwumadzi Ase.
      sbs: 0.6428
      gen_sec: 2.24
      ref_sec: 3.66
    '172':
      text: na Memfis banodzifo adwen efura mu; na hɔn a wɔyɛ no mbusuakuw kutuwdo bo no.
      sbs: 0.6588
      gen_sec: 4.96
      ref_sec: 7.5
    '173':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.7907
      gen_sec: 7.84
      ref_sec: 9.28
    '174':
      text: 'Obu mpɔtsibaa dɛ mburonan: Ɔserew nkambaa no huuyɛ.'
      sbs: 0.6328
      gen_sec: 3.76
      ref_sec: 5.28
    '175':
      text: Nyew, dɛ mbrɛ gyata no pɔw, na gyata bɔyafo ne ndze.
      sbs: 0.6712
      gen_sec: 3.2
      ref_sec: 5.48
    '176':
      text: Afei nna ɔhen David ayɛ akɔdaa a oedzi mfe pii; ɔwɔ mu dɛ wɔdze atam kataa no do, naaso no
        ho annyɛ no hyew.
      sbs: 0.7377
      gen_sec: 7.44
      ref_sec: 9.2
    '177':
      text: 'Enyena sa a, ogya dum: Na bɔtomkɛka nnyi hɔ a, mansotwe gyaa.'
      sbs: 0.6781
      gen_sec: 5.04
      ref_sec: 6.04
    '178':
      text: Na Ahija tae suoo atar fofor a ɔhyɛ no no mu, na ɔtsetseew mu esinesin duebien.
      sbs: 0.6962
      gen_sec: 6.32
      ref_sec: 7.34
    '180':
      text: Me bepɔw a ewɔ wiramu, medze w’ahodze na w’akoradze nyina bɛma ma wɔaafom afa, na wo nsorɔnsorɔmbea
        no, wɔ bɔn ntsi, wɔ w’ahe nyinara do.
      sbs: 0.679
      gen_sec: 11.12
      ref_sec: 11.4
    '181':
      text: Kaansa enyitan dze ndaadaa kata noho mpo a.
      sbs: 0.6419
      gen_sec: 4.0
      ref_sec: 3.78
    '182':
      text: 'Ɔtwerɛw bɔnsa mu, na odzi ehurusi wɔ n’ahoɔdzen mu: Opue kehyia akofo a woemia.'
      sbs: 0.7114
      gen_sec: 5.92
      ref_sec: 6.46
    '183':
      text: EWURADZE na ɔse; hom a hom ka dɛ, Woana botum esian aba hɛn do?
      sbs: 0.736
      gen_sec: 4.8
      ref_sec: 4.62
    '184':
      text: Anaadɛ nyia ɔda hɛn mu frankadua etsifi.
      sbs: 0.6359
      gen_sec: 2.72
      ref_sec: 3.92
    '185':
      text: dɛ mbrɛ ɔsabokwafo tɔ ntentan wɔ ne fe mu.
      sbs: 0.6676
      gen_sec: 3.36
      ref_sec: 3.76
    '186':
      text: 'Na ɔsee Israelhen no dɛ, Fa wo nsa to egyen no do: na ɔdze ne nsa too do.'
      sbs: 0.6769
      gen_sec: 4.56
      ref_sec: 7.32
    '187':
      text: Na ɔbaa dɛ, aber a wowiee ɔman no nyinara twatsia twitwa no, wɔtsenatsenaa hɔn ananmu wɔ nseraban
        no mu ma wɔtsee apɔw ana.
      sbs: 0.7089
      gen_sec: 7.92
      ref_sec: 12.36
    '188':
      text: Makasa prɛko, na murummbua; Nyew, mprɛnu, na moronnkɔ kan bio.
      sbs: 0.7765
      gen_sec: 6.32
      ref_sec: 5.84
    '189':
      text: 'Wo mboanofo tsenaa mu: Ɔwo, Nyankopɔn, na isiesiee abɔbɔfo wɔ w’ayamuyie mu.'
      sbs: 0.7287
      gen_sec: 7.04
      ref_sec: 6.3
    '190':
      text: Na Juda mbapɔmba tsee ndzɛmba yinom no, wofii ahemfie fowee baa EWURADZE fie ɔponkɛse fofor
        no ano.
      sbs: 0.6699
      gen_sec: 6.8
      ref_sec: 7.82
    '192':
      text: Nna Farao see no dɛ, Na ebɛnadze na ehia no wɔ me nkyɛn, ma erohwehwɛ dɛ ekɔ wankasa wo man
        mu yi?
      sbs: 0.7127
      gen_sec: 7.04
      ref_sec: 7.9
    '193':
      text: 'Nna wɔfaa Jeremia, na wɔkotoow no kyeen ɔhenba Malkia mona efiadze a ɔwɔ aweɔmfo abanguado
        no mu: na wɔdze ntampehoma gyaagyaa Jeremia siaan mu.'
      sbs: 0.6724
      gen_sec: 9.92
      ref_sec: 12.34
    '194':
      text: Wɔse dɛ, Hom mbra ma yenkruw hɔn ase ma wongyaa dɛ wɔbɛyɛ ɔman; Ama wɔnnkɛkaa Israel dzin
        bio.
      sbs: 0.6275
      gen_sec: 6.4
      ref_sec: 8.02
    '195':
      text: 'Na ɔfowee kɔr ne nkyɛn: na, hwɛ, ɔtse koko no n’etsifi.'
      sbs: 0.62
      gen_sec: 5.36
      ref_sec: 4.84
    '196':
      text: 'Na wobuaa dɛ, Ahazia no nuanom nye hɛn: na yerisian akɔ ekekyiakyia ɔhen ne mba, na ɔhembaa
        ne mba no.'
      sbs: 0.688
      gen_sec: 8.4
      ref_sec: 10.94
    '198':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6496
      gen_sec: 5.44
      ref_sec: 5.64
    '199':
      text: Na Sallum, a ofi Kore, Ebiasaf, na Kora asefo no mu, na no nuanom a wofi n’egya fie.
      sbs: 0.6768
      gen_sec: 8.32
      ref_sec: 8.82
    '200':
      text: bɛba dɔm EWURADZE ne dzin tsenabea, bepɔw Zion no do.
      sbs: 0.7147
      gen_sec: 3.28
      ref_sec: 6.32
    '201':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.6824
      gen_sec: 2.08
      ref_sec: 4.2
    '202':
      text: Hɔn a wɔdan wo gya nyina enyi bɔto; hɔn a wofi wo nkyɛn kɔ no, wɔbɛkyerɛw hɔn edzin aka asaase
        ase mba ho.
      sbs: 0.6399
      gen_sec: 6.48
      ref_sec: 8.28
    '203':
      text: Na Adonija n’aponto asefo no nyinara suroi, na wɔsoɛrsoɛree na nyimpa biara faa no kwan kɔree.
      sbs: 0.5971
      gen_sec: 6.16
      ref_sec: 8.48
    '204':
      text: Hom nka nkyerɛ amanaman dɛ wɔreba; hom mma wɔntse no Jerusalɛm.
      sbs: 0.7082
      gen_sec: 5.04
      ref_sec: 4.18
    '205':
      text: sɛ wosi frankaa wɔ mbepɔw do a, hom nhwɛ; na sɛ wɔbɔ akasamu mu a, hom ntsie.
      sbs: 0.7074
      gen_sec: 6.64
      ref_sec: 5.46
    '207':
      text: Na Kohatmba nkaa no nam tontotwe do nyae fii Efraim, Dan, nye Manaasɛ ebusuakuw fa no mu nkurow
        du.
      sbs: 0.6891
      gen_sec: 9.28
      ref_sec: 10.62
    '208':
      text: Iyi nye Benjaminmba no egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6534
      gen_sec: 4.4
      ref_sec: 7.22
    '209':
      text: Na ɔkaa Israelmba mu ebusuakuw esuon a wonnyae nnkyɛɛ hɔn egyapadze.
      sbs: 0.6569
      gen_sec: 4.96
      ref_sec: 5.76
    '210':
      text: Afei Solomon n’edwuma nyinara wosiesiei maa da a wɔtoow EWURADZE ne dan no ne fapem, na okodur
        dɛ wowiei.
      sbs: 0.7168
      gen_sec: 6.48
      ref_sec: 9.0
    '211':
      text: dɛmara so na wobotwitwa hom egu, na hom etwa mu akɔ.
      sbs: 0.7027
      gen_sec: 3.28
      ref_sec: 3.46
    '213':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.6932
      gen_sec: 6.0
      ref_sec: 7.62
    '214':
      text: na ɔmaa ahendzi hihimii no nye yi; nyia ɔmaa wiadze yi yɛɛ dɛ sar.
      sbs: 0.7357
      gen_sec: 4.96
      ref_sec: 5.48
    '215':
      text: nye w’ayeforber mu dɔ no ma wo; mbrɛ idzii m’ekyir wɔ sar no do.
      sbs: 0.6616
      gen_sec: 3.36
      ref_sec: 4.9
    '216':
      text: 'Wɔdze ogya ahyew no, woetwa ato famu: W’enyim nkaenyim ntsi wɔasɛɛ.'
      sbs: 0.637
      gen_sec: 4.64
      ref_sec: 4.74
    '217':
      text: Na aber a Seba ɔhembaa no tsee Solomon ne nka wɔ EWURADZE ne dzin ho no, ɔbaa dɛ ɔdze nsɛmbisa
        dzendzen robɔsɔ no ahwɛ.
      sbs: 0.6757
      gen_sec: 7.2
      ref_sec: 7.86
    '218':
      text: Na wɔdze afona anomu kunkum hɔn; na brampafo na asafohemfo no totoow hɔn gui, na wosii mu
        kɔr Baal fie kurow no mu.
      sbs: 0.6942
      gen_sec: 8.0
      ref_sec: 10.54
    '219':
      text: Naaso ɔpoow nkɔdaa no hɔn afotu a wɔdze maa no no, na ɔnye mberantsɛ a wɔnye no nyinii a afei
        wɔabɛyɛ n’apamfo no no dwenee.
      sbs: 0.675
      gen_sec: 10.64
      ref_sec: 11.92
    '220':
      text: 'Ɔwo edze hɛn yɛ aperdzi ma hɛn asɔnmufo: Na hɛn atamfo sereserew wɔ hɔnara hɔn mu.'
      sbs: 0.6807
      gen_sec: 5.28
      ref_sec: 7.6
    '221':
      text: anaadɛ poma bɛma nyia ɔnnyɛ dua no no do.
      sbs: 0.7468
      gen_sec: 2.16
      ref_sec: 3.34
    '222':
      text: 'Na asɛm yi maa wɔyɛɛ bɔn: osiandɛ ɔman no kɔree kɔsoom hɔn wɔ Bɛtɛl araa dze kɔr Dan.'
      sbs: 0.6651
      gen_sec: 7.12
      ref_sec: 7.32
    '223':
      text: Obeyi wo wɔ ahohia esia mu; Nyew, dza otsia esuon no mu mpo mbusu bi rennka wo.
      sbs: 0.721
      gen_sec: 5.52
      ref_sec: 7.56
    '225':
      text: Nna Atalia tsetseew ne ntar mu, na ɔkekaa mu dɛ, Etuatsew o, iyi yɛ etuatsew.
      sbs: 0.7208
      gen_sec: 8.0
      ref_sec: 6.74
    '226':
      text: Woana na ɔwɔ enyiwa a ayɛ kɔɔ?
      sbs: 0.7254
      gen_sec: 2.72
      ref_sec: 3.68
  score: 0.6863
  partial: true
- model: facebook/mms-tts-aka
  sbs: 0.7053
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.6875
      gen_sec: 8.64
      ref_sec: 9.1
    '1':
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.7074
      gen_sec: 3.39
      ref_sec: 3.66
    '3':
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.7205
      gen_sec: 6.11
      ref_sec: 6.36
    '5':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.714
      gen_sec: 3.55
      ref_sec: 3.18
    '6':
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.7136
      gen_sec: 8.91
      ref_sec: 9.12
    '7':
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.7171
      gen_sec: 7.44
      ref_sec: 7.44
    '8':
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.6968
      gen_sec: 3.97
      ref_sec: 4.88
    '9':
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.7251
      gen_sec: 6.16
      ref_sec: 6.16
    '10':
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.7287
      gen_sec: 9.06
      ref_sec: 8.48
    '11':
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.7058
      gen_sec: 6.06
      ref_sec: 6.68
    '12':
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.7311
      gen_sec: 9.76
      ref_sec: 10.5
    '13':
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.7179
      gen_sec: 5.46
      ref_sec: 6.38
    '14':
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.6639
      gen_sec: 3.6
      ref_sec: 4.1
    '15':
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7021
      gen_sec: 6.9
      ref_sec: 6.76
    '16':
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.6989
      gen_sec: 6.83
      ref_sec: 8.48
    '19':
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.6813
      gen_sec: 2.46
      ref_sec: 3.16
    '20':
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.731
      gen_sec: 4.42
      ref_sec: 4.36
    '22':
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.6804
      gen_sec: 3.68
      ref_sec: 3.74
    '23':
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.7248
      gen_sec: 10.06
      ref_sec: 10.44
    '24':
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.7079
      gen_sec: 6.82
      ref_sec: 8.26
    '26':
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.7184
      gen_sec: 3.47
      ref_sec: 5.0
    '27':
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6854
      gen_sec: 6.16
      ref_sec: 7.04
    '28':
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.7054
      gen_sec: 6.86
      ref_sec: 9.74
    '29':
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.7046
      gen_sec: 4.4
      ref_sec: 4.34
    '30':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.7016
      gen_sec: 6.82
      ref_sec: 5.64
    '32':
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.6524
      gen_sec: 3.9
      ref_sec: 3.54
    '33':
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.7374
      gen_sec: 9.97
      ref_sec: 11.1
    '35':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.7201
      gen_sec: 5.28
      ref_sec: 7.62
    '36':
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.6849
      gen_sec: 4.14
      ref_sec: 3.74
    '37':
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.7359
      gen_sec: 4.19
      ref_sec: 3.94
    '38':
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6882
      gen_sec: 5.62
      ref_sec: 7.02
    '39':
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.6904
      gen_sec: 2.13
      ref_sec: 3.74
    '40':
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.7133
      gen_sec: 6.45
      ref_sec: 5.94
    '41':
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.7235
      gen_sec: 3.22
      ref_sec: 3.26
    '42':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.7427
      gen_sec: 7.28
      ref_sec: 9.28
    '43':
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
        dɛ, Hom mma yɛmfa.'
      sbs: 0.725
      gen_sec: 9.09
      ref_sec: 11.2
    '44':
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.7023
      gen_sec: 3.87
      ref_sec: 4.1
    '46':
      text: 'Na ɔsee dɛ, Tase egyen menaba no: na ɔtasee.'
      sbs: 0.7141
      gen_sec: 4.11
      ref_sec: 4.26
    '47':
      text: Ɔwo, Nyankopɔn, maa nyankom tɔɔ berdzedzeedze.
      sbs: 0.6848
      gen_sec: 2.85
      ref_sec: 3.42
    '48':
      text: Ne nda nyinara mu no woemmfi EWURADZE, hɔn egyanom Nyankopɔn no, n’ekyir dzi no ho emmfir.
      sbs: 0.7194
      gen_sec: 6.72
      ref_sec: 9.06
    '49':
      text: Na ɔdze etsifi mbasu nye anaafo mbasu no maa no.
      sbs: 0.7186
      gen_sec: 3.92
      ref_sec: 3.6
    '50':
      text: 'Na owungyam bi nnyi hɔn wu mu: Na mbom hɔn ahoɔdzen wɔ hɔ pintsinn.'
      sbs: 0.6965
      gen_sec: 5.33
      ref_sec: 4.82
    '51':
      text: Woana na osiesie akonkoran n’edziban ma no.
      sbs: 0.7018
      gen_sec: 4.0
      ref_sec: 3.32
    '52':
      text: Ana ɔwo na eyɛ ha nya afonam ma gyataber.
      sbs: 0.6862
      gen_sec: 3.6
      ref_sec: 3.4
    '53':
      text: 'Mber no mu no, Siriahen Hazael sii mu kɔree, na ɔnye Gat kɔkoe, na ɔfae: na Hazael dze sii
        n’enyi do dɛ ɔrokɔfow akɔ Jerusalɛm.'
      sbs: 0.7375
      gen_sec: 10.06
      ref_sec: 13.56
    '54':
      text: Na ma w’ebufuhyew no a ɔwɔ hɛn do no mbɔ adze.
      sbs: 0.6933
      gen_sec: 3.86
      ref_sec: 3.5
    '55':
      text: na ahendzi wɔ Damaskɔs; na Siria nkaa bɛyɛ dɛ.
      sbs: 0.694
      gen_sec: 4.19
      ref_sec: 4.32
    '56':
      text: Na wɔbɔtotɔ mfuwa wɔ asaase yi a hom ka wɔ ho dɛ, Ɔyɛ amamfo, nyimpa anaa abowa nnyi do; wɔdze
        ahyɛ Kaldeafo nsa no mu.
      sbs: 0.7275
      gen_sec: 10.27
      ref_sec: 11.26
    '57':
      text: Iyi nye Gadmba no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee, nkurow no nye no nkurobaase.
      sbs: 0.6821
      gen_sec: 6.45
      ref_sec: 9.24
    '58':
      text: 'Ɔno na yennkefi wo nkyɛn akɔ ekyir: Ma yennya nkwa, na yɛbɔbɔ wo dzin.'
      sbs: 0.7197
      gen_sec: 6.35
      ref_sec: 5.02
    '59':
      text: Na Josua dze n’enyim butuuw famu, na ɔsɔɔr no, na ɔsee no dɛ, Na mo wura ese n’akowaa dɛn?
      sbs: 0.7167
      gen_sec: 7.74
      ref_sec: 8.24
    '60':
      text: Mbrɛ aboɔdzembo kotoku a ɔhyɛ abo ntamu tse no.
      sbs: 0.6957
      gen_sec: 4.02
      ref_sec: 4.78
    '61':
      text: 'Emumuyɛfo guan wɔ aber a nyimpa biara nntaa hɔn do: Na atseneneefo dze, wɔyɛ ndam dɛ ogyata.'
      sbs: 0.7129
      gen_sec: 7.97
      ref_sec: 8.82
    '62':
      text: 'dɛ abaa a ɔhwee wo no ebu ntsi: na ɔwɔ no ndwow mu na ɔkyerben befir aba.'
      sbs: 0.7472
      gen_sec: 6.67
      ref_sec: 6.62
    '63':
      text: Mbrɛ ɔmansotwenyi sɔ aperper mu ogya ara nye no.
      sbs: 0.7146
      gen_sec: 4.11
      ref_sec: 4.5
    '64':
      text: Ana ɔwo ibotum akyekyer Aberwa na mba no n’ahoma.
      sbs: 0.694
      gen_sec: 3.89
      ref_sec: 5.08
    '65':
      text: Na ɔatsen ne nsa, na woana na ɔbɔpon mu?
      sbs: 0.7151
      gen_sec: 3.58
      ref_sec: 3.26
    '66':
      text: Na dɛtse atɔw atɔw no abɔ mu afemfam ho no?
      sbs: 0.6992
      gen_sec: 3.73
      ref_sec: 3.2
    '67':
      text: 'Nna wɔdze ntampehoma no twee Jeremia baa sor, na woyii no fii mona efiadze no mu: na Jeremia
        tsenaa aweɔmfo abangua no mu.'
      sbs: 0.7132
      gen_sec: 9.57
      ref_sec: 9.2
    '68':
      text: Ma munhu w’awerdzi wɔ hɔn do; na ɔwo na maka m’asɛm akyerɛ wo.
      sbs: 0.6781
      gen_sec: 4.58
      ref_sec: 4.5
    '70':
      text: Na Safan ba Ahikam ne nsa wɔ Jeremia afa, dɛ mma wonnyi no nnhyɛ ɔman no nsa mma wonnku no.
      sbs: 0.6825
      gen_sec: 5.97
      ref_sec: 9.6
    '71':
      text: ma aabɔsom me; na sɛ iyi dza ɔsom bo fi dza ɔyɛ huhuw no mu a.
      sbs: 0.7053
      gen_sec: 5.36
      ref_sec: 4.86
    '72':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.7141
      gen_sec: 7.73
      ref_sec: 10.92
    '73':
      text: 'Dɛ mbrɛ mframa bɔ wusiw kɔ no, dɛmara so na bɔ hɔn kɔ: Dɛ mbrɛ ihua nan wɔ gya enyim no.'
      sbs: 0.699
      gen_sec: 6.93
      ref_sec: 7.46
    '74':
      text: Anantwisaa kuw no, ɔnye aman anantwimba no enyim.
      sbs: 0.7059
      gen_sec: 4.08
      ref_sec: 3.8
    '75':
      text: Na ɔsoɛree, na ɔnye no sianee kɔr ɔhen no nkyɛn.
      sbs: 0.7194
      gen_sec: 3.82
      ref_sec: 4.08
    '76':
      text: Na ɔwo, mo wura ɔhen, na Israel nyinara enyi da wo do dɛ ebɛkyerɛ hɔn nyia ɔbɛtsena w’ahengua
        do wɔ w’ekyir.
      sbs: 0.7196
      gen_sec: 8.03
      ref_sec: 8.88
    '77':
      text: Nna Asiriahen no dze enyimguase sanee kɔr nankasa n’asaase do.
      sbs: 0.7106
      gen_sec: 5.01
      ref_sec: 6.08
    '78':
      text: Ɔtse dɛ obi a osuo bɔdɔm n’asowa mu.
      sbs: 0.6759
      gen_sec: 3.18
      ref_sec: 3.68
    '80':
      text: 'Mbrɛ EWURADZE se nye yi: Sɛ hom ayeyɛ petsepetsee, na hom dɔɔ so mpo a.'
      sbs: 0.6748
      gen_sec: 5.97
      ref_sec: 5.56
    '81':
      text: Na ɔtsenaa ahemfo ahengua no do.
      sbs: 0.6799
      gen_sec: 2.5
      ref_sec: 3.0
    '82':
      text: Galim babaa, ma wo ndze do tsea mu!
      sbs: 0.7418
      gen_sec: 2.93
      ref_sec: 3.62
    '83':
      text: Nyia medze sar pradada no ayɛ ne fi.
      sbs: 0.6865
      gen_sec: 2.86
      ref_sec: 3.94
    '84':
      text: na hɔn a mehiahia hɔn ho no; na mebɛma osiifo no ayɛ nkaase.
      sbs: 0.6928
      gen_sec: 5.01
      ref_sec: 5.18
    '85':
      text: Na Joas yɛɛ dza ɔtsen wɔ EWURADZE enyiwa do, wɔ ne nda a ɔsɔfo Jehoiada kyerɛkyerɛɛ no wɔ
        mu nyinara.
      sbs: 0.712
      gen_sec: 6.5
      ref_sec: 8.58
    '87':
      text: Na ɔronnhwɛ afɔrmbukyia, ne nsaano edwuma no, eso n’enyi ronnsɔ dza ne nsatseaba ayɛ, Aserim,
        anaadɛ ewia ehonyi no.
      sbs: 0.683
      gen_sec: 8.56
      ref_sec: 11.84
    '88':
      text: Sen nyimpa beesuon a wotum kyerɛkyerɛ asɛm ase.
      sbs: 0.6827
      gen_sec: 3.54
      ref_sec: 5.02
    '89':
      text: Elkosnyi Nahum n’enyido adzehu nwoma a ɔfa Ninive atsɛmbu ho.
      sbs: 0.6739
      gen_sec: 5.12
      ref_sec: 5.06
    '90':
      text: 'EWURADZE, ɔwo adom w’asaase: Ɔwo edze Jakob egyapadze asan aba.'
      sbs: 0.6684
      gen_sec: 4.99
      ref_sec: 5.76
    '91':
      text: 'na medwuruw w’aban dzendzen nyina: na mubotwitwa wo mbɔnsansɛm efi wo nsamu; na innkenya
        sebramufo bio: na mubotwitwa ehonyi.'
      sbs: 0.6866
      gen_sec: 9.38
      ref_sec: 12.12
    '92':
      text: 'Emi dze memmpɛɛ ntsɛm minngyaae dɛ meyɛ oguanhwɛfo dzi w’ekyir: eso memmpɛɛ mbusu da no.'
      sbs: 0.7151
      gen_sec: 8.02
      ref_sec: 7.78
    '93':
      text: 'Nna ɔhen tse awɔwber dan no mu, wɔ bosoom a otsia akron no mu: na mbukyia mu ogya a ɔredzɛw
        taa n’enyim.'
      sbs: 0.7081
      gen_sec: 9.55
      ref_sec: 7.8
    '94':
      text: Ɔwoara nko nye Ɔsorsornyi wɔ asaase nyinara do.
      sbs: 0.715
      gen_sec: 3.31
      ref_sec: 5.58
    '96':
      text: Aso nyia ɔyɛ nyiyiano no ɔnye Otumfo no bɛham?
      sbs: 0.7242
      gen_sec: 3.9
      ref_sec: 4.1
    '97':
      text: Na Omri ne ba Ahab yɛɛ dza omuo wɔ EWURADZE enyim seen hɔn a wodzii n’enyim nyinara.
      sbs: 0.72
      gen_sec: 6.48
      ref_sec: 6.86
    '99':
      text: Na Aser ebusuakuw mu dze, Misal, Abdon; Helkat nye Rehob nye hɔn ho mfikyisaase, nkurow anan.
      sbs: 0.7132
      gen_sec: 8.77
      ref_sec: 11.58
    '100':
      text: Mbrɛ ɔkwadwefo so da ne mpa do ara nye no.
      sbs: 0.6875
      gen_sec: 3.31
      ref_sec: 3.78
    '101':
      text: Fa hɛn san si yie, ao hɛn nkwagye Nyankopɔn.
      sbs: 0.713
      gen_sec: 3.04
      ref_sec: 3.16
    '102':
      text: Na iyi ntsi mibehiahia David n’asefo ho, na nnyɛ daa nyina.
      sbs: 0.7502
      gen_sec: 5.63
      ref_sec: 4.88
    '103':
      text: Nna ɔhen Joas kɛfrɛɛ ɔsɔfo Jehoiada, na asɔfo nkaa no, na obisaa hɔn dɛ, Ɔyɛ dɛn ntsi na hom
        mmpempaam ofi no n’agow no yi?
      sbs: 0.7234
      gen_sec: 9.9
      ref_sec: 12.62
    '104':
      text: 'Nyia ɔkata ne mbrato do no, ɔnnkɛyɛ prɔmprɔm: Na obiara a ɔka to gua na ɔpow no, obenya ehumbɔbɔr.'
      sbs: 0.7123
      gen_sec: 7.9
      ref_sec: 8.0
    '106':
      text: Ana woeyi wu no mbobotsen no akyerɛ wo?
      sbs: 0.675
      gen_sec: 2.69
      ref_sec: 3.66
    '107':
      text: 'Ɔhen dze atsɛmbu ma asaase gyina: Na nyia odzi mboaba no, obutuw no.'
      sbs: 0.7126
      gen_sec: 5.6
      ref_sec: 7.18
    '108':
      text: Ana akɛhɛn esukwankyɛba no korabea.
      sbs: 0.694
      gen_sec: 2.54
      ref_sec: 3.26
    '109':
      text: Na wɔbɛkaa asɛm yi kyerɛɛ ɔhen no.
      sbs: 0.7366
      gen_sec: 2.7
      ref_sec: 3.68
    '110':
      text: 'na etsetsɛw mu enyame ananaben: mpo sɛ wo ntsɛwee da no ara mu ema ofifir.'
      sbs: 0.6976
      gen_sec: 6.0
      ref_sec: 7.28
    '112':
      text: Mbrɛ enyidzi so mmfata ɔkwasea ara nye no.
      sbs: 0.6882
      gen_sec: 2.88
      ref_sec: 3.3
    '114':
      text: Mbrɛ EWURADZE se nye yi, Wɔdze kurow yi bɛhyɛ Babilɔnhen no dɔm nsa ara ampa, na wɔagye.
      sbs: 0.7104
      gen_sec: 6.1
      ref_sec: 7.48
    '115':
      text: Nokwar befi asaase mu efir; Na tsenenee efi sor ahwɛ famu.
      sbs: 0.7133
      gen_sec: 5.47
      ref_sec: 4.88
    '116':
      text: Na EWURADZE maa ɔtamfo bi soɛree tsiaa Solomon, Edomnyi Hadad a ofi ɔhen n’asefo mu wɔ Edom
        no a.
      sbs: 0.7104
      gen_sec: 8.32
      ref_sec: 9.54
    '117':
      text: Ebɛn asɛm na wɔdze bobua amanaman asomafo no?
      sbs: 0.7106
      gen_sec: 4.02
      ref_sec: 3.62
    '118':
      text: Na asafohen no bo fuuw Jeremia, na wɔhwee no, na wɔdze no kɔtoo efiadze wɔ ɔkyerɛwfo Jonatan
        fie; nna hɔ na wɔdze ayɛ efiadze.
      sbs: 0.7041
      gen_sec: 10.42
      ref_sec: 10.5
    '119':
      text: Dɛ gyama abaa bi him nyia ɔma do no do.
      sbs: 0.6869
      gen_sec: 2.96
      ref_sec: 3.2
    '120':
      text: 'dɛ gyatafɔr wɔ nguan ekuwekuw mu: ɔno a sɛ ɔhɛn mu a, otsiatsia do.'
      sbs: 0.7205
      gen_sec: 5.78
      ref_sec: 5.98
    '122':
      text: Hwɛ, aber a ɔwo nye ɔhen da ho rekasa wɔ hɔ no, mo so mibedzi w’ekyir maba, na mabɛhyɛ wo
        nsɛm no ma.
      sbs: 0.7155
      gen_sec: 7.33
      ref_sec: 9.42
    '123':
      text: Ɔbabanyin na ɔdɔba kor ma me na na m’egya no.
      sbs: 0.6879
      gen_sec: 3.52
      ref_sec: 5.46
    '124':
      text: 'Ao Nyankopɔn kyerɛ w’ahoɔdzen: Kyerɛ wo tum, Ao Nyankopɔn, dza edze agye hɛn no.'
      sbs: 0.6777
      gen_sec: 5.44
      ref_sec: 7.24
    '125':
      text: Nna wogyaa dɛ wɔnye no kasa; osiandɛ woennhu asɛm no.
      sbs: 0.6804
      gen_sec: 3.7
      ref_sec: 3.92
    '126':
      text: Afei Ahija no nkɔdaayɛ ntsi n’enyiwa ayɛ kusukusu na onnhu adze.
      sbs: 0.7099
      gen_sec: 5.12
      ref_sec: 6.98
    '127':
      text: Na Hilkia buae see ɔkyerɛwfo Safan dɛ, Mehu mbra nwoma no wɔ EWURADZE fie.
      sbs: 0.7286
      gen_sec: 6.62
      ref_sec: 8.0
    '128':
      text: Na boka afamu he nye Nkyen Po no, mekyerɛ ɔdze kodu Jordan ewiei.
      sbs: 0.7161
      gen_sec: 5.25
      ref_sec: 6.62
    '129':
      text: 'Tappua asaase no yɛ Manaasɛ dze: na Tappua a ɔwɔ Manaasɛ he do no dze ɔyɛ Efraimmba no dze.'
      sbs: 0.7104
      gen_sec: 7.33
      ref_sec: 8.34
    '130':
      text: Wotwa mu wɔ Nyinsu bɔnsa no mu a wɔdan no bea a mbasu wɔ; Nyew, adɔwnsu dze nhyira kata do.
      sbs: 0.7117
      gen_sec: 7.58
      ref_sec: 8.24
    '131':
      text: 'Na wɔnkyɛ mu kyɛpɛn esuon: Juda ntsena ne he do wɔ kwaamu afamu.'
      sbs: 0.7095
      gen_sec: 5.23
      ref_sec: 6.72
    '132':
      text: 'Naaso wo nda mu dze merennyɛ, osian w’egya David ntsi: na mbom mebɛtsew efi wo ba nsamu.'
      sbs: 0.715
      gen_sec: 7.25
      ref_sec: 6.76
    '133':
      text: 'Nyia ɔtwer nankasa n’akoma no, ɔkwasea a: Na obiara a ɔnantsew nyansa mu no dze, wɔbɛgye
        no nkwa.'
      sbs: 0.7024
      gen_sec: 7.73
      ref_sec: 8.76
    '134':
      text: Nyia ɔsoɛr anapahema dze ndze kɛse hyira ne nyɛnko no.
      sbs: 0.67
      gen_sec: 4.03
      ref_sec: 4.7
    '135':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6953
      gen_sec: 3.22
      ref_sec: 3.18
    '136':
      text: Na ofi hɔ fowee kɔr Debir a nkan no na ne dzin nye Kiriat-Sefer no do.
      sbs: 0.7421
      gen_sec: 6.59
      ref_sec: 9.1
    '137':
      text: Hwɛ, menye wo enya, ɔwo a etse bɔnsa mu e.
      sbs: 0.6812
      gen_sec: 2.99
      ref_sec: 3.4
    '138':
      text: Nna Jeremia see Zedekia dɛ, Aso mepaa mu ka kyerɛ wo a, ana nnyɛ oku ara na woboku me bi?
      sbs: 0.7269
      gen_sec: 7.41
      ref_sec: 7.18
    '139':
      text: Dɛm ntsi afei hom nyiyi Israel ebusuakuw ebusuakuw mu mbanyin duebien, ebusuakuw biara mu
        nyimpa baako.
      sbs: 0.7329
      gen_sec: 8.11
      ref_sec: 9.46
    '140':
      text: Afei, me Nyankopɔn, meserɛ wo, bue w’enyiwa, na kyɛn w’aso wɔ mpaabɔ a wɔbɔ wɔ ha yi do.
      sbs: 0.716
      gen_sec: 6.03
      ref_sec: 8.14
    '141':
      text: Otwitwa nankasa ne nan, na ɔnom mbusu.
      sbs: 0.6717
      gen_sec: 3.47
      ref_sec: 3.48
    '142':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.6712
      gen_sec: 3.28
      ref_sec: 4.2
    '143':
      text: 'Na Solomon kɔr ne nsamankyir, na wosiee no wɔ n’egya David kurow mu: na ne ba Rehoboam dzii
        hen wɔ n’ananmu.'
      sbs: 0.7102
      gen_sec: 7.41
      ref_sec: 11.3
    '145':
      text: Dadze sew dadze ano; Dɛmara so na nyimpa sew ne nyɛnko enyim.
      sbs: 0.6772
      gen_sec: 4.35
      ref_sec: 4.94
    '147':
      text: Afei Zimri no ho nsɛm nkaa no na no nkontompɔ a otwae no, ana wɔnnkyerɛɛw no wɔ Israel ahemfo
        hɔn Mbermunsɛm nwoma no mu?
      sbs: 0.7068
      gen_sec: 8.83
      ref_sec: 11.44
    '148':
      text: Na ɔhwɛɛ ahemfo no nyinara do dze fi Esutsen no ho araa dze kodur Filistiafo asaase do, na
        Egypt ahe do.
      sbs: 0.7135
      gen_sec: 7.87
      ref_sec: 10.56
    '149':
      text: EWURADZE tse ase yi; nna amanaman bɛyɛ esiarfo wɔ no mu.
      sbs: 0.7025
      gen_sec: 3.73
      ref_sec: 3.4
    '150':
      text: 'Dɔm ahemfo guanguan, woguanguan: Na nyia ɔtse fie na ɔkyɛ asadze mu.'
      sbs: 0.7158
      gen_sec: 5.57
      ref_sec: 5.42
    '151':
      text: Ama wo mbɔdɔm tɛkyerɛma eenya ne kyɛpɛn wɔ w’atamfo ho.
      sbs: 0.6902
      gen_sec: 4.21
      ref_sec: 3.56
    '152':
      text: Ntsi migyaa hɔn ma wodzii hɔn akomadzen ekyir.
      sbs: 0.6756
      gen_sec: 3.84
      ref_sec: 3.26
    '153':
      text: 'Na ɔsee dɛ, Bue boka afamu tokura no: na obuei.'
      sbs: 0.6977
      gen_sec: 4.11
      ref_sec: 4.9
    '154':
      text: Na sɛ hom ayɛ dɛ nsoɛ kantankantan, na hom afɔw takaa wɔ hom nsanom mu mpo a.
      sbs: 0.6789
      gen_sec: 6.66
      ref_sec: 6.02
    '155':
      text: Aber a obui faa do, dɛ gyama ofi yafun mu rupue no; Aber a medze mununkum yɛɛ n’akataho.
      sbs: 0.6811
      gen_sec: 6.94
      ref_sec: 7.58
    '156':
      text: Aso emumuyɛ akoradze wɔ emumuyɛ fi no mu.
      sbs: 0.7195
      gen_sec: 3.18
      ref_sec: 3.2
    '157':
      text: Na Reubenmba no hɔn he nye Jordan, nye ne he.
      sbs: 0.7223
      gen_sec: 3.06
      ref_sec: 3.22
    '158':
      text: Na, hwɛ, mber a ɔda ho nye ɔhen no rekasa no, nkɔnhyɛnyi Natan bae.
      sbs: 0.6889
      gen_sec: 5.23
      ref_sec: 5.62
    '159':
      text: Afei hwɛ esuson a meyɛɛ no kaa wo ho no; Odzi efuw dɛ nantwi.
      sbs: 0.6874
      gen_sec: 4.4
      ref_sec: 4.92
    '160':
      text: Israelhen Joahaz ne ba Jehoas n’afe a otsia ebien no mu nna Amazia, Judahen Joas ne ba no,
        hyɛɛ ase dzii hen.
      sbs: 0.7433
      gen_sec: 9.73
      ref_sec: 11.84
    '162':
      text: Dɛm ntsi afei mma hom nngyegye sika wɔ hom amanyimfo hɔ bio, na hom nyi mma ma wɔmfa mpempam
        ofi no n’agow no.
      sbs: 0.7259
      gen_sec: 8.66
      ref_sec: 11.32
    '163':
      text: 'Hom mper ngye abɔbɔfo na ehiafo: Hom nhwim hɔn mfi nyimpa bɔn no nsamu.'
      sbs: 0.6731
      gen_sec: 5.18
      ref_sec: 5.7
    '164':
      text: Dɛmara so na abɔbɔfo do ɔhen tsirmɔdzennyi tse.
      sbs: 0.7147
      gen_sec: 4.24
      ref_sec: 3.38
    '165':
      text: Na ɔyɛɛ dza ɔtsen wɔ EWURADZE n’enyiwa do, na ɔnantseew n’egya David n’akwan do, na ɔanndan
        ammfa nkyɛn annkɔ enyimfa anaa abankum.
      sbs: 0.7279
      gen_sec: 10.08
      ref_sec: 11.16
    '166':
      text: Mbrɛ Jeremia tsenaa aweɔmfo abangua no mu nye no.
      sbs: 0.7025
      gen_sec: 3.55
      ref_sec: 5.58
    '167':
      text: na ɔdze n’abasa bubu mbɛtsem no; ɔbɛyɛ dɛ aber a obi ridzi mbɛtsem mpɛpɛw.
      sbs: 0.7158
      gen_sec: 6.14
      ref_sec: 6.22
    '168':
      text: Ana ofitsi dɛ wo nda hyɛɛ ase yi ahyɛ anapa do pɛn.
      sbs: 0.7098
      gen_sec: 3.95
      ref_sec: 4.84
    '169':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.7094
      gen_sec: 8.35
      ref_sec: 10.92
    '170':
      text: Ngyanka hɔn egya, na ekunafo hɔn sɛndzifo.
      sbs: 0.6806
      gen_sec: 3.07
      ref_sec: 3.42
    '171':
      text: Asɔfo No Hyɛ Hɔn Dwumadzi Ase.
      sbs: 0.6816
      gen_sec: 2.54
      ref_sec: 3.66
    '172':
      text: na Memfis banodzifo adwen efura mu; na hɔn a wɔyɛ no mbusuakuw kutuwdo bo no.
      sbs: 0.6895
      gen_sec: 6.22
      ref_sec: 7.5
    '173':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.7178
      gen_sec: 6.56
      ref_sec: 9.28
    '174':
      text: 'Obu mpɔtsibaa dɛ mburonan: Ɔserew nkambaa no huuyɛ.'
      sbs: 0.6795
      gen_sec: 4.03
      ref_sec: 5.28
    '175':
      text: Nyew, dɛ mbrɛ gyata no pɔw, na gyata bɔyafo ne ndze.
      sbs: 0.707
      gen_sec: 3.98
      ref_sec: 5.48
    '176':
      text: Afei nna ɔhen David ayɛ akɔdaa a oedzi mfe pii; ɔwɔ mu dɛ wɔdze atam kataa no do, naaso no
        ho annyɛ no hyew.
      sbs: 0.7078
      gen_sec: 8.59
      ref_sec: 9.2
    '177':
      text: 'Enyena sa a, ogya dum: Na bɔtomkɛka nnyi hɔ a, mansotwe gyaa.'
      sbs: 0.7093
      gen_sec: 5.23
      ref_sec: 6.04
    '178':
      text: Na Ahija tae suoo atar fofor a ɔhyɛ no no mu, na ɔtsetseew mu esinesin duebien.
      sbs: 0.7182
      gen_sec: 7.17
      ref_sec: 7.34
    '180':
      text: Me bepɔw a ewɔ wiramu, medze w’ahodze na w’akoradze nyina bɛma ma wɔaafom afa, na wo nsorɔnsorɔmbea
        no, wɔ bɔn ntsi, wɔ w’ahe nyinara do.
      sbs: 0.7017
      gen_sec: 10.21
      ref_sec: 11.4
    '181':
      text: Kaansa enyitan dze ndaadaa kata noho mpo a.
      sbs: 0.7231
      gen_sec: 3.87
      ref_sec: 3.78
    '182':
      text: 'Ɔtwerɛw bɔnsa mu, na odzi ehurusi wɔ n’ahoɔdzen mu: Opue kehyia akofo a woemia.'
      sbs: 0.6911
      gen_sec: 6.9
      ref_sec: 6.46
    '183':
      text: EWURADZE na ɔse; hom a hom ka dɛ, Woana botum esian aba hɛn do?
      sbs: 0.701
      gen_sec: 6.38
      ref_sec: 4.62
    '184':
      text: Anaadɛ nyia ɔda hɛn mu frankadua etsifi.
      sbs: 0.7144
      gen_sec: 3.74
      ref_sec: 3.92
    '185':
      text: dɛ mbrɛ ɔsabokwafo tɔ ntentan wɔ ne fe mu.
      sbs: 0.7025
      gen_sec: 2.94
      ref_sec: 3.76
    '186':
      text: 'Na ɔsee Israelhen no dɛ, Fa wo nsa to egyen no do: na ɔdze ne nsa too do.'
      sbs: 0.6933
      gen_sec: 5.42
      ref_sec: 7.32
    '187':
      text: Na ɔbaa dɛ, aber a wowiee ɔman no nyinara twatsia twitwa no, wɔtsenatsenaa hɔn ananmu wɔ nseraban
        no mu ma wɔtsee apɔw ana.
      sbs: 0.7175
      gen_sec: 8.45
      ref_sec: 12.36
    '188':
      text: Makasa prɛko, na murummbua; Nyew, mprɛnu, na moronnkɔ kan bio.
      sbs: 0.7116
      gen_sec: 4.7
      ref_sec: 5.84
    '189':
      text: 'Wo mboanofo tsenaa mu: Ɔwo, Nyankopɔn, na isiesiee abɔbɔfo wɔ w’ayamuyie mu.'
      sbs: 0.722
      gen_sec: 5.95
      ref_sec: 6.3
    '190':
      text: Na Juda mbapɔmba tsee ndzɛmba yinom no, wofii ahemfie fowee baa EWURADZE fie ɔponkɛse fofor
        no ano.
      sbs: 0.6948
      gen_sec: 7.3
      ref_sec: 7.82
    '192':
      text: Nna Farao see no dɛ, Na ebɛnadze na ehia no wɔ me nkyɛn, ma erohwehwɛ dɛ ekɔ wankasa wo man
        mu yi?
      sbs: 0.7074
      gen_sec: 6.94
      ref_sec: 7.9
    '193':
      text: 'Nna wɔfaa Jeremia, na wɔkotoow no kyeen ɔhenba Malkia mona efiadze a ɔwɔ aweɔmfo abanguado
        no mu: na wɔdze ntampehoma gyaagyaa Jeremia siaan mu.'
      sbs: 0.7088
      gen_sec: 10.43
      ref_sec: 12.34
    '194':
      text: Wɔse dɛ, Hom mbra ma yenkruw hɔn ase ma wongyaa dɛ wɔbɛyɛ ɔman; Ama wɔnnkɛkaa Israel dzin
        bio.
      sbs: 0.7155
      gen_sec: 7.97
      ref_sec: 8.02
    '195':
      text: 'Na ɔfowee kɔr ne nkyɛn: na, hwɛ, ɔtse koko no n’etsifi.'
      sbs: 0.7035
      gen_sec: 3.79
      ref_sec: 4.84
    '196':
      text: 'Na wobuaa dɛ, Ahazia no nuanom nye hɛn: na yerisian akɔ ekekyiakyia ɔhen ne mba, na ɔhembaa
        ne mba no.'
      sbs: 0.6996
      gen_sec: 6.98
      ref_sec: 10.94
    '198':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6881
      gen_sec: 6.99
      ref_sec: 5.64
    '199':
      text: Na Sallum, a ofi Kore, Ebiasaf, na Kora asefo no mu, na no nuanom a wofi n’egya fie.
      sbs: 0.7118
      gen_sec: 7.34
      ref_sec: 8.82
    '200':
      text: bɛba dɔm EWURADZE ne dzin tsenabea, bepɔw Zion no do.
      sbs: 0.6889
      gen_sec: 3.9
      ref_sec: 6.32
    '201':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.6683
      gen_sec: 3.38
      ref_sec: 4.2
    '202':
      text: Hɔn a wɔdan wo gya nyina enyi bɔto; hɔn a wofi wo nkyɛn kɔ no, wɔbɛkyerɛw hɔn edzin aka asaase
        ase mba ho.
      sbs: 0.6918
      gen_sec: 8.18
      ref_sec: 8.28
    '203':
      text: Na Adonija n’aponto asefo no nyinara suroi, na wɔsoɛrsoɛree na nyimpa biara faa no kwan kɔree.
      sbs: 0.7211
      gen_sec: 6.78
      ref_sec: 8.48
    '204':
      text: Hom nka nkyerɛ amanaman dɛ wɔreba; hom mma wɔntse no Jerusalɛm.
      sbs: 0.6995
      gen_sec: 5.23
      ref_sec: 4.18
    '205':
      text: sɛ wosi frankaa wɔ mbepɔw do a, hom nhwɛ; na sɛ wɔbɔ akasamu mu a, hom ntsie.
      sbs: 0.6966
      gen_sec: 6.48
      ref_sec: 5.46
    '207':
      text: Na Kohatmba nkaa no nam tontotwe do nyae fii Efraim, Dan, nye Manaasɛ ebusuakuw fa no mu nkurow
        du.
      sbs: 0.7142
      gen_sec: 9.15
      ref_sec: 10.62
    '208':
      text: Iyi nye Benjaminmba no egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7007
      gen_sec: 5.41
      ref_sec: 7.22
    '209':
      text: Na ɔkaa Israelmba mu ebusuakuw esuon a wonnyae nnkyɛɛ hɔn egyapadze.
      sbs: 0.711
      gen_sec: 5.46
      ref_sec: 5.76
    '210':
      text: Afei Solomon n’edwuma nyinara wosiesiei maa da a wɔtoow EWURADZE ne dan no ne fapem, na okodur
        dɛ wowiei.
      sbs: 0.7344
      gen_sec: 9.76
      ref_sec: 9.0
    '211':
      text: dɛmara so na wobotwitwa hom egu, na hom etwa mu akɔ.
      sbs: 0.7559
      gen_sec: 6.9
      ref_sec: 3.46
    '213':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.7289
      gen_sec: 5.89
      ref_sec: 7.62
    '214':
      text: na ɔmaa ahendzi hihimii no nye yi; nyia ɔmaa wiadze yi yɛɛ dɛ sar.
      sbs: 0.6983
      gen_sec: 4.08
      ref_sec: 5.48
    '215':
      text: nye w’ayeforber mu dɔ no ma wo; mbrɛ idzii m’ekyir wɔ sar no do.
      sbs: 0.6791
      gen_sec: 4.74
      ref_sec: 4.9
    '216':
      text: 'Wɔdze ogya ahyew no, woetwa ato famu: W’enyim nkaenyim ntsi wɔasɛɛ.'
      sbs: 0.7097
      gen_sec: 6.06
      ref_sec: 4.74
    '217':
      text: Na aber a Seba ɔhembaa no tsee Solomon ne nka wɔ EWURADZE ne dzin ho no, ɔbaa dɛ ɔdze nsɛmbisa
        dzendzen robɔsɔ no ahwɛ.
      sbs: 0.7128
      gen_sec: 9.3
      ref_sec: 7.86
    '218':
      text: Na wɔdze afona anomu kunkum hɔn; na brampafo na asafohemfo no totoow hɔn gui, na wosii mu
        kɔr Baal fie kurow no mu.
      sbs: 0.7124
      gen_sec: 9.84
      ref_sec: 10.54
    '219':
      text: Naaso ɔpoow nkɔdaa no hɔn afotu a wɔdze maa no no, na ɔnye mberantsɛ a wɔnye no nyinii a afei
        wɔabɛyɛ n’apamfo no no dwenee.
      sbs: 0.7223
      gen_sec: 10.26
      ref_sec: 11.92
    '220':
      text: 'Ɔwo edze hɛn yɛ aperdzi ma hɛn asɔnmufo: Na hɛn atamfo sereserew wɔ hɔnara hɔn mu.'
      sbs: 0.678
      gen_sec: 6.37
      ref_sec: 7.6
    '221':
      text: anaadɛ poma bɛma nyia ɔnnyɛ dua no no do.
      sbs: 0.7552
      gen_sec: 5.07
      ref_sec: 3.34
    '222':
      text: 'Na asɛm yi maa wɔyɛɛ bɔn: osiandɛ ɔman no kɔree kɔsoom hɔn wɔ Bɛtɛl araa dze kɔr Dan.'
      sbs: 0.7161
      gen_sec: 6.62
      ref_sec: 7.32
    '223':
      text: Obeyi wo wɔ ahohia esia mu; Nyew, dza otsia esuon no mu mpo mbusu bi rennka wo.
      sbs: 0.6735
      gen_sec: 5.41
      ref_sec: 7.56
    '225':
      text: Nna Atalia tsetseew ne ntar mu, na ɔkekaa mu dɛ, Etuatsew o, iyi yɛ etuatsew.
      sbs: 0.6891
      gen_sec: 5.78
      ref_sec: 6.74
    '226':
      text: Woana na ɔwɔ enyiwa a ayɛ kɔɔ?
      sbs: 0.7348
      gen_sec: 2.85
      ref_sec: 3.68
  score: 0.7053
  partial: true
- model: ghananlpcommunity/ghana-tts-72k-noref
  sbs: 0.6743
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.7397
      gen_sec: 7.28
      ref_sec: 9.1
    '1':
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.7029
      gen_sec: 3.04
      ref_sec: 3.66
    '3':
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.6827
      gen_sec: 6.24
      ref_sec: 6.36
    '5':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6882
      gen_sec: 2.16
      ref_sec: 3.18
    '6':
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.6771
      gen_sec: 8.0
      ref_sec: 9.12
    '7':
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.6984
      gen_sec: 6.8
      ref_sec: 7.44
    '8':
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.7004
      gen_sec: 4.0
      ref_sec: 4.88
    '9':
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.6478
      gen_sec: 5.36
      ref_sec: 6.16
    '10':
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.7677
      gen_sec: 9.12
      ref_sec: 8.48
    '11':
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.6896
      gen_sec: 5.84
      ref_sec: 6.68
    '12':
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.647
      gen_sec: 9.36
      ref_sec: 10.5
    '13':
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.7394
      gen_sec: 6.32
      ref_sec: 6.38
    '14':
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.6624
      gen_sec: 4.32
      ref_sec: 4.1
    '15':
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6687
      gen_sec: 6.88
      ref_sec: 6.76
    '16':
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.6787
      gen_sec: 5.76
      ref_sec: 8.48
    '19':
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.665
      gen_sec: 1.6
      ref_sec: 3.16
    '20':
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.638
      gen_sec: 4.24
      ref_sec: 4.36
    '22':
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.6086
      gen_sec: 3.92
      ref_sec: 3.74
    '23':
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.6374
      gen_sec: 10.96
      ref_sec: 10.44
    '24':
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.6557
      gen_sec: 7.2
      ref_sec: 8.26
    '26':
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.656
      gen_sec: 4.16
      ref_sec: 5.0
    '27':
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6114
      gen_sec: 7.92
      ref_sec: 7.04
    '28':
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.6868
      gen_sec: 7.68
      ref_sec: 9.74
    '29':
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.6585
      gen_sec: 2.96
      ref_sec: 4.34
    '30':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6178
      gen_sec: 5.6
      ref_sec: 5.64
    '32':
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.7166
      gen_sec: 3.6
      ref_sec: 3.54
    '33':
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.6956
      gen_sec: 8.56
      ref_sec: 11.1
    '35':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.6717
      gen_sec: 6.96
      ref_sec: 7.62
    '36':
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.6547
      gen_sec: 2.64
      ref_sec: 3.74
    '37':
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.6754
      gen_sec: 5.2
      ref_sec: 3.94
    '38':
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6869
      gen_sec: 4.56
      ref_sec: 7.02
    '39':
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.6135
      gen_sec: 1.52
      ref_sec: 3.74
    '40':
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.6531
      gen_sec: 7.2
      ref_sec: 5.94
    '41':
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.6455
      gen_sec: 3.44
      ref_sec: 3.26
    '42':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.7107
      gen_sec: 6.64
      ref_sec: 9.28
    '43':
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
        dɛ, Hom mma yɛmfa.'
      sbs: 0.6589
      gen_sec: 9.68
      ref_sec: 11.2
    '44':
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.6446
      gen_sec: 3.6
      ref_sec: 4.1
    '46':
      text: 'Na ɔsee dɛ, Tase egyen menaba no: na ɔtasee.'
      sbs: 0.6943
      gen_sec: 3.44
      ref_sec: 4.26
    '47':
      text: Ɔwo, Nyankopɔn, maa nyankom tɔɔ berdzedzeedze.
      sbs: 0.7789
      gen_sec: 3.92
      ref_sec: 3.42
    '48':
      text: Ne nda nyinara mu no woemmfi EWURADZE, hɔn egyanom Nyankopɔn no, n’ekyir dzi no ho emmfir.
      sbs: 0.6548
      gen_sec: 6.48
      ref_sec: 9.06
    '49':
      text: Na ɔdze etsifi mbasu nye anaafo mbasu no maa no.
      sbs: 0.7024
      gen_sec: 3.12
      ref_sec: 3.6
    '50':
      text: 'Na owungyam bi nnyi hɔn wu mu: Na mbom hɔn ahoɔdzen wɔ hɔ pintsinn.'
      sbs: 0.6622
      gen_sec: 4.72
      ref_sec: 4.82
    '51':
      text: Woana na osiesie akonkoran n’edziban ma no.
      sbs: 0.7263
      gen_sec: 2.72
      ref_sec: 3.32
    '52':
      text: Ana ɔwo na eyɛ ha nya afonam ma gyataber.
      sbs: 0.66
      gen_sec: 2.8
      ref_sec: 3.4
    '53':
      text: 'Mber no mu no, Siriahen Hazael sii mu kɔree, na ɔnye Gat kɔkoe, na ɔfae: na Hazael dze sii
        n’enyi do dɛ ɔrokɔfow akɔ Jerusalɛm.'
      sbs: 0.6453
      gen_sec: 10.88
      ref_sec: 13.56
    '54':
      text: Na ma w’ebufuhyew no a ɔwɔ hɛn do no mbɔ adze.
      sbs: 0.6779
      gen_sec: 2.88
      ref_sec: 3.5
    '55':
      text: na ahendzi wɔ Damaskɔs; na Siria nkaa bɛyɛ dɛ.
      sbs: 0.6772
      gen_sec: 3.36
      ref_sec: 4.32
    '56':
      text: Na wɔbɔtotɔ mfuwa wɔ asaase yi a hom ka wɔ ho dɛ, Ɔyɛ amamfo, nyimpa anaa abowa nnyi do; wɔdze
        ahyɛ Kaldeafo nsa no mu.
      sbs: 0.6573
      gen_sec: 9.28
      ref_sec: 11.26
    '57':
      text: Iyi nye Gadmba no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee, nkurow no nye no nkurobaase.
      sbs: 0.6347
      gen_sec: 5.84
      ref_sec: 9.24
    '58':
      text: 'Ɔno na yennkefi wo nkyɛn akɔ ekyir: Ma yennya nkwa, na yɛbɔbɔ wo dzin.'
      sbs: 0.6869
      gen_sec: 5.52
      ref_sec: 5.02
    '59':
      text: Na Josua dze n’enyim butuuw famu, na ɔsɔɔr no, na ɔsee no dɛ, Na mo wura ese n’akowaa dɛn?
      sbs: 0.7176
      gen_sec: 7.28
      ref_sec: 8.24
    '60':
      text: Mbrɛ aboɔdzembo kotoku a ɔhyɛ abo ntamu tse no.
      sbs: 0.6299
      gen_sec: 3.52
      ref_sec: 4.78
    '61':
      text: 'Emumuyɛfo guan wɔ aber a nyimpa biara nntaa hɔn do: Na atseneneefo dze, wɔyɛ ndam dɛ ogyata.'
      sbs: 0.6059
      gen_sec: 8.08
      ref_sec: 8.82
    '62':
      text: 'dɛ abaa a ɔhwee wo no ebu ntsi: na ɔwɔ no ndwow mu na ɔkyerben befir aba.'
      sbs: 0.6977
      gen_sec: 6.8
      ref_sec: 6.62
    '63':
      text: Mbrɛ ɔmansotwenyi sɔ aperper mu ogya ara nye no.
      sbs: 0.6474
      gen_sec: 3.6
      ref_sec: 4.5
    '64':
      text: Ana ɔwo ibotum akyekyer Aberwa na mba no n’ahoma.
      sbs: 0.6575
      gen_sec: 3.84
      ref_sec: 5.08
    '65':
      text: Na ɔatsen ne nsa, na woana na ɔbɔpon mu?
      sbs: 0.6737
      gen_sec: 2.8
      ref_sec: 3.26
    '66':
      text: Na dɛtse atɔw atɔw no abɔ mu afemfam ho no?
      sbs: 0.6744
      gen_sec: 3.44
      ref_sec: 3.2
    '67':
      text: 'Nna wɔdze ntampehoma no twee Jeremia baa sor, na woyii no fii mona efiadze no mu: na Jeremia
        tsenaa aweɔmfo abangua no mu.'
      sbs: 0.6655
      gen_sec: 7.92
      ref_sec: 9.2
    '68':
      text: Ma munhu w’awerdzi wɔ hɔn do; na ɔwo na maka m’asɛm akyerɛ wo.
      sbs: 0.6735
      gen_sec: 4.24
      ref_sec: 4.5
    '70':
      text: Na Safan ba Ahikam ne nsa wɔ Jeremia afa, dɛ mma wonnyi no nnhyɛ ɔman no nsa mma wonnku no.
      sbs: 0.7039
      gen_sec: 7.84
      ref_sec: 9.6
    '71':
      text: ma aabɔsom me; na sɛ iyi dza ɔsom bo fi dza ɔyɛ huhuw no mu a.
      sbs: 0.6339
      gen_sec: 4.4
      ref_sec: 4.86
    '72':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.7169
      gen_sec: 8.72
      ref_sec: 10.92
    '73':
      text: 'Dɛ mbrɛ mframa bɔ wusiw kɔ no, dɛmara so na bɔ hɔn kɔ: Dɛ mbrɛ ihua nan wɔ gya enyim no.'
      sbs: 0.7081
      gen_sec: 5.84
      ref_sec: 7.46
    '74':
      text: Anantwisaa kuw no, ɔnye aman anantwimba no enyim.
      sbs: 0.6793
      gen_sec: 3.52
      ref_sec: 3.8
    '75':
      text: Na ɔsoɛree, na ɔnye no sianee kɔr ɔhen no nkyɛn.
      sbs: 0.7032
      gen_sec: 3.44
      ref_sec: 4.08
    '76':
      text: Na ɔwo, mo wura ɔhen, na Israel nyinara enyi da wo do dɛ ebɛkyerɛ hɔn nyia ɔbɛtsena w’ahengua
        do wɔ w’ekyir.
      sbs: 0.75
      gen_sec: 8.0
      ref_sec: 8.88
    '77':
      text: Nna Asiriahen no dze enyimguase sanee kɔr nankasa n’asaase do.
      sbs: 0.6887
      gen_sec: 4.16
      ref_sec: 6.08
    '78':
      text: Ɔtse dɛ obi a osuo bɔdɔm n’asowa mu.
      sbs: 0.6255
      gen_sec: 2.96
      ref_sec: 3.68
    '80':
      text: 'Mbrɛ EWURADZE se nye yi: Sɛ hom ayeyɛ petsepetsee, na hom dɔɔ so mpo a.'
      sbs: 0.6545
      gen_sec: 4.96
      ref_sec: 5.56
    '81':
      text: Na ɔtsenaa ahemfo ahengua no do.
      sbs: 0.6696
      gen_sec: 1.68
      ref_sec: 3.0
    '82':
      text: Galim babaa, ma wo ndze do tsea mu!
      sbs: 0.6341
      gen_sec: 2.56
      ref_sec: 3.62
    '83':
      text: Nyia medze sar pradada no ayɛ ne fi.
      sbs: 0.7176
      gen_sec: 2.72
      ref_sec: 3.94
    '84':
      text: na hɔn a mehiahia hɔn ho no; na mebɛma osiifo no ayɛ nkaase.
      sbs: 0.6375
      gen_sec: 4.64
      ref_sec: 5.18
    '85':
      text: Na Joas yɛɛ dza ɔtsen wɔ EWURADZE enyiwa do, wɔ ne nda a ɔsɔfo Jehoiada kyerɛkyerɛɛ no wɔ
        mu nyinara.
      sbs: 0.6369
      gen_sec: 8.16
      ref_sec: 8.58
    '87':
      text: Na ɔronnhwɛ afɔrmbukyia, ne nsaano edwuma no, eso n’enyi ronnsɔ dza ne nsatseaba ayɛ, Aserim,
        anaadɛ ewia ehonyi no.
      sbs: 0.7235
      gen_sec: 10.56
      ref_sec: 11.84
    '88':
      text: Sen nyimpa beesuon a wotum kyerɛkyerɛ asɛm ase.
      sbs: 0.6994
      gen_sec: 2.56
      ref_sec: 5.02
    '89':
      text: Elkosnyi Nahum n’enyido adzehu nwoma a ɔfa Ninive atsɛmbu ho.
      sbs: 0.7092
      gen_sec: 6.56
      ref_sec: 5.06
    '90':
      text: 'EWURADZE, ɔwo adom w’asaase: Ɔwo edze Jakob egyapadze asan aba.'
      sbs: 0.7113
      gen_sec: 4.96
      ref_sec: 5.76
    '91':
      text: 'na medwuruw w’aban dzendzen nyina: na mubotwitwa wo mbɔnsansɛm efi wo nsamu; na innkenya
        sebramufo bio: na mubotwitwa ehonyi.'
      sbs: 0.6495
      gen_sec: 8.08
      ref_sec: 12.12
    '92':
      text: 'Emi dze memmpɛɛ ntsɛm minngyaae dɛ meyɛ oguanhwɛfo dzi w’ekyir: eso memmpɛɛ mbusu da no.'
      sbs: 0.6683
      gen_sec: 7.2
      ref_sec: 7.78
    '93':
      text: 'Nna ɔhen tse awɔwber dan no mu, wɔ bosoom a otsia akron no mu: na mbukyia mu ogya a ɔredzɛw
        taa n’enyim.'
      sbs: 0.6629
      gen_sec: 8.24
      ref_sec: 7.8
    '94':
      text: Ɔwoara nko nye Ɔsorsornyi wɔ asaase nyinara do.
      sbs: 0.6126
      gen_sec: 2.88
      ref_sec: 5.58
    '96':
      text: Aso nyia ɔyɛ nyiyiano no ɔnye Otumfo no bɛham?
      sbs: 0.706
      gen_sec: 3.04
      ref_sec: 4.1
    '97':
      text: Na Omri ne ba Ahab yɛɛ dza omuo wɔ EWURADZE enyim seen hɔn a wodzii n’enyim nyinara.
      sbs: 0.6603
      gen_sec: 6.8
      ref_sec: 6.86
    '99':
      text: Na Aser ebusuakuw mu dze, Misal, Abdon; Helkat nye Rehob nye hɔn ho mfikyisaase, nkurow anan.
      sbs: 0.6288
      gen_sec: 10.24
      ref_sec: 11.58
    '100':
      text: Mbrɛ ɔkwadwefo so da ne mpa do ara nye no.
      sbs: 0.6651
      gen_sec: 2.32
      ref_sec: 3.78
    '101':
      text: Fa hɛn san si yie, ao hɛn nkwagye Nyankopɔn.
      sbs: 0.6631
      gen_sec: 3.28
      ref_sec: 3.16
    '102':
      text: Na iyi ntsi mibehiahia David n’asefo ho, na nnyɛ daa nyina.
      sbs: 0.6961
      gen_sec: 4.0
      ref_sec: 4.88
    '103':
      text: Nna ɔhen Joas kɛfrɛɛ ɔsɔfo Jehoiada, na asɔfo nkaa no, na obisaa hɔn dɛ, Ɔyɛ dɛn ntsi na hom
        mmpempaam ofi no n’agow no yi?
      sbs: 0.6514
      gen_sec: 7.52
      ref_sec: 12.62
    '104':
      text: 'Nyia ɔkata ne mbrato do no, ɔnnkɛyɛ prɔmprɔm: Na obiara a ɔka to gua na ɔpow no, obenya ehumbɔbɔr.'
      sbs: 0.6758
      gen_sec: 8.24
      ref_sec: 8.0
    '106':
      text: Ana woeyi wu no mbobotsen no akyerɛ wo?
      sbs: 0.6892
      gen_sec: 2.32
      ref_sec: 3.66
    '107':
      text: 'Ɔhen dze atsɛmbu ma asaase gyina: Na nyia odzi mboaba no, obutuw no.'
      sbs: 0.6869
      gen_sec: 4.96
      ref_sec: 7.18
    '108':
      text: Ana akɛhɛn esukwankyɛba no korabea.
      sbs: 0.6915
      gen_sec: 2.16
      ref_sec: 3.26
    '109':
      text: Na wɔbɛkaa asɛm yi kyerɛɛ ɔhen no.
      sbs: 0.6412
      gen_sec: 2.64
      ref_sec: 3.68
    '110':
      text: 'na etsetsɛw mu enyame ananaben: mpo sɛ wo ntsɛwee da no ara mu ema ofifir.'
      sbs: 0.659
      gen_sec: 5.68
      ref_sec: 7.28
    '112':
      text: Mbrɛ enyidzi so mmfata ɔkwasea ara nye no.
      sbs: 0.6689
      gen_sec: 2.08
      ref_sec: 3.3
    '114':
      text: Mbrɛ EWURADZE se nye yi, Wɔdze kurow yi bɛhyɛ Babilɔnhen no dɔm nsa ara ampa, na wɔagye.
      sbs: 0.7273
      gen_sec: 6.88
      ref_sec: 7.48
    '115':
      text: Nokwar befi asaase mu efir; Na tsenenee efi sor ahwɛ famu.
      sbs: 0.6426
      gen_sec: 5.28
      ref_sec: 4.88
    '116':
      text: Na EWURADZE maa ɔtamfo bi soɛree tsiaa Solomon, Edomnyi Hadad a ofi ɔhen n’asefo mu wɔ Edom
        no a.
      sbs: 0.6227
      gen_sec: 10.72
      ref_sec: 9.54
    '117':
      text: Ebɛn asɛm na wɔdze bobua amanaman asomafo no?
      sbs: 0.6677
      gen_sec: 3.12
      ref_sec: 3.62
    '118':
      text: Na asafohen no bo fuuw Jeremia, na wɔhwee no, na wɔdze no kɔtoo efiadze wɔ ɔkyerɛwfo Jonatan
        fie; nna hɔ na wɔdze ayɛ efiadze.
      sbs: 0.636
      gen_sec: 9.2
      ref_sec: 10.5
    '119':
      text: Dɛ gyama abaa bi him nyia ɔma do no do.
      sbs: 0.6959
      gen_sec: 2.64
      ref_sec: 3.2
    '120':
      text: 'dɛ gyatafɔr wɔ nguan ekuwekuw mu: ɔno a sɛ ɔhɛn mu a, otsiatsia do.'
      sbs: 0.6806
      gen_sec: 4.96
      ref_sec: 5.98
    '122':
      text: Hwɛ, aber a ɔwo nye ɔhen da ho rekasa wɔ hɔ no, mo so mibedzi w’ekyir maba, na mabɛhyɛ wo
        nsɛm no ma.
      sbs: 0.6158
      gen_sec: 6.64
      ref_sec: 9.42
    '123':
      text: Ɔbabanyin na ɔdɔba kor ma me na na m’egya no.
      sbs: 0.7049
      gen_sec: 3.44
      ref_sec: 5.46
    '124':
      text: 'Ao Nyankopɔn kyerɛ w’ahoɔdzen: Kyerɛ wo tum, Ao Nyankopɔn, dza edze agye hɛn no.'
      sbs: 0.6142
      gen_sec: 4.56
      ref_sec: 7.24
    '125':
      text: Nna wogyaa dɛ wɔnye no kasa; osiandɛ woennhu asɛm no.
      sbs: 0.6727
      gen_sec: 3.76
      ref_sec: 3.92
    '126':
      text: Afei Ahija no nkɔdaayɛ ntsi n’enyiwa ayɛ kusukusu na onnhu adze.
      sbs: 0.7104
      gen_sec: 4.48
      ref_sec: 6.98
    '127':
      text: Na Hilkia buae see ɔkyerɛwfo Safan dɛ, Mehu mbra nwoma no wɔ EWURADZE fie.
      sbs: 0.6711
      gen_sec: 4.8
      ref_sec: 8.0
    '128':
      text: Na boka afamu he nye Nkyen Po no, mekyerɛ ɔdze kodu Jordan ewiei.
      sbs: 0.6404
      gen_sec: 3.76
      ref_sec: 6.62
    '129':
      text: 'Tappua asaase no yɛ Manaasɛ dze: na Tappua a ɔwɔ Manaasɛ he do no dze ɔyɛ Efraimmba no dze.'
      sbs: 0.6564
      gen_sec: 7.84
      ref_sec: 8.34
    '130':
      text: Wotwa mu wɔ Nyinsu bɔnsa no mu a wɔdan no bea a mbasu wɔ; Nyew, adɔwnsu dze nhyira kata do.
      sbs: 0.7346
      gen_sec: 7.76
      ref_sec: 8.24
    '131':
      text: 'Na wɔnkyɛ mu kyɛpɛn esuon: Juda ntsena ne he do wɔ kwaamu afamu.'
      sbs: 0.6594
      gen_sec: 3.92
      ref_sec: 6.72
    '132':
      text: 'Naaso wo nda mu dze merennyɛ, osian w’egya David ntsi: na mbom mebɛtsew efi wo ba nsamu.'
      sbs: 0.6094
      gen_sec: 6.88
      ref_sec: 6.76
    '133':
      text: 'Nyia ɔtwer nankasa n’akoma no, ɔkwasea a: Na obiara a ɔnantsew nyansa mu no dze, wɔbɛgye
        no nkwa.'
      sbs: 0.6469
      gen_sec: 8.0
      ref_sec: 8.76
    '134':
      text: Nyia ɔsoɛr anapahema dze ndze kɛse hyira ne nyɛnko no.
      sbs: 0.6725
      gen_sec: 3.12
      ref_sec: 4.7
    '135':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6887
      gen_sec: 2.24
      ref_sec: 3.18
    '136':
      text: Na ofi hɔ fowee kɔr Debir a nkan no na ne dzin nye Kiriat-Sefer no do.
      sbs: 0.6761
      gen_sec: 5.6
      ref_sec: 9.1
    '137':
      text: Hwɛ, menye wo enya, ɔwo a etse bɔnsa mu e.
      sbs: 0.6972
      gen_sec: 3.2
      ref_sec: 3.4
    '138':
      text: Nna Jeremia see Zedekia dɛ, Aso mepaa mu ka kyerɛ wo a, ana nnyɛ oku ara na woboku me bi?
      sbs: 0.7217
      gen_sec: 9.12
      ref_sec: 7.18
    '139':
      text: Dɛm ntsi afei hom nyiyi Israel ebusuakuw ebusuakuw mu mbanyin duebien, ebusuakuw biara mu
        nyimpa baako.
      sbs: 0.6885
      gen_sec: 8.64
      ref_sec: 9.46
    '140':
      text: Afei, me Nyankopɔn, meserɛ wo, bue w’enyiwa, na kyɛn w’aso wɔ mpaabɔ a wɔbɔ wɔ ha yi do.
      sbs: 0.7019
      gen_sec: 5.36
      ref_sec: 8.14
    '141':
      text: Otwitwa nankasa ne nan, na ɔnom mbusu.
      sbs: 0.7208
      gen_sec: 5.2
      ref_sec: 3.48
    '142':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.6849
      gen_sec: 2.8
      ref_sec: 4.2
    '143':
      text: 'Na Solomon kɔr ne nsamankyir, na wosiee no wɔ n’egya David kurow mu: na ne ba Rehoboam dzii
        hen wɔ n’ananmu.'
      sbs: 0.5738
      gen_sec: 8.72
      ref_sec: 11.3
    '145':
      text: Dadze sew dadze ano; Dɛmara so na nyimpa sew ne nyɛnko enyim.
      sbs: 0.7179
      gen_sec: 4.16
      ref_sec: 4.94
    '147':
      text: Afei Zimri no ho nsɛm nkaa no na no nkontompɔ a otwae no, ana wɔnnkyerɛɛw no wɔ Israel ahemfo
        hɔn Mbermunsɛm nwoma no mu?
      sbs: 0.7135
      gen_sec: 10.64
      ref_sec: 11.44
    '148':
      text: Na ɔhwɛɛ ahemfo no nyinara do dze fi Esutsen no ho araa dze kodur Filistiafo asaase do, na
        Egypt ahe do.
      sbs: 0.7116
      gen_sec: 7.76
      ref_sec: 10.56
    '149':
      text: EWURADZE tse ase yi; nna amanaman bɛyɛ esiarfo wɔ no mu.
      sbs: 0.7237
      gen_sec: 3.76
      ref_sec: 3.4
    '150':
      text: 'Dɔm ahemfo guanguan, woguanguan: Na nyia ɔtse fie na ɔkyɛ asadze mu.'
      sbs: 0.6647
      gen_sec: 5.12
      ref_sec: 5.42
    '151':
      text: Ama wo mbɔdɔm tɛkyerɛma eenya ne kyɛpɛn wɔ w’atamfo ho.
      sbs: 0.706
      gen_sec: 3.28
      ref_sec: 3.56
    '152':
      text: Ntsi migyaa hɔn ma wodzii hɔn akomadzen ekyir.
      sbs: 0.6769
      gen_sec: 2.56
      ref_sec: 3.26
    '153':
      text: 'Na ɔsee dɛ, Bue boka afamu tokura no: na obuei.'
      sbs: 0.648
      gen_sec: 6.56
      ref_sec: 4.9
    '154':
      text: Na sɛ hom ayɛ dɛ nsoɛ kantankantan, na hom afɔw takaa wɔ hom nsanom mu mpo a.
      sbs: 0.6324
      gen_sec: 5.2
      ref_sec: 6.02
    '155':
      text: Aber a obui faa do, dɛ gyama ofi yafun mu rupue no; Aber a medze mununkum yɛɛ n’akataho.
      sbs: 0.7605
      gen_sec: 8.72
      ref_sec: 7.58
    '156':
      text: Aso emumuyɛ akoradze wɔ emumuyɛ fi no mu.
      sbs: 0.7205
      gen_sec: 3.12
      ref_sec: 3.2
    '157':
      text: Na Reubenmba no hɔn he nye Jordan, nye ne he.
      sbs: 0.5706
      gen_sec: 2.0
      ref_sec: 3.22
    '158':
      text: Na, hwɛ, mber a ɔda ho nye ɔhen no rekasa no, nkɔnhyɛnyi Natan bae.
      sbs: 0.6612
      gen_sec: 4.16
      ref_sec: 5.62
    '159':
      text: Afei hwɛ esuson a meyɛɛ no kaa wo ho no; Odzi efuw dɛ nantwi.
      sbs: 0.7066
      gen_sec: 4.08
      ref_sec: 4.92
    '160':
      text: Israelhen Joahaz ne ba Jehoas n’afe a otsia ebien no mu nna Amazia, Judahen Joas ne ba no,
        hyɛɛ ase dzii hen.
      sbs: 0.7019
      gen_sec: 9.92
      ref_sec: 11.84
    '162':
      text: Dɛm ntsi afei mma hom nngyegye sika wɔ hom amanyimfo hɔ bio, na hom nyi mma ma wɔmfa mpempam
        ofi no n’agow no.
      sbs: 0.6391
      gen_sec: 9.2
      ref_sec: 11.32
    '163':
      text: 'Hom mper ngye abɔbɔfo na ehiafo: Hom nhwim hɔn mfi nyimpa bɔn no nsamu.'
      sbs: 0.6361
      gen_sec: 5.84
      ref_sec: 5.7
    '164':
      text: Dɛmara so na abɔbɔfo do ɔhen tsirmɔdzennyi tse.
      sbs: 0.6761
      gen_sec: 3.04
      ref_sec: 3.38
    '165':
      text: Na ɔyɛɛ dza ɔtsen wɔ EWURADZE n’enyiwa do, na ɔnantseew n’egya David n’akwan do, na ɔanndan
        ammfa nkyɛn annkɔ enyimfa anaa abankum.
      sbs: 0.7287
      gen_sec: 7.92
      ref_sec: 11.16
    '166':
      text: Mbrɛ Jeremia tsenaa aweɔmfo abangua no mu nye no.
      sbs: 0.6697
      gen_sec: 3.84
      ref_sec: 5.58
    '167':
      text: na ɔdze n’abasa bubu mbɛtsem no; ɔbɛyɛ dɛ aber a obi ridzi mbɛtsem mpɛpɛw.
      sbs: 0.6615
      gen_sec: 4.48
      ref_sec: 6.22
    '168':
      text: Ana ofitsi dɛ wo nda hyɛɛ ase yi ahyɛ anapa do pɛn.
      sbs: 0.6829
      gen_sec: 3.76
      ref_sec: 4.84
    '169':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.6702
      gen_sec: 9.84
      ref_sec: 10.92
    '170':
      text: Ngyanka hɔn egya, na ekunafo hɔn sɛndzifo.
      sbs: 0.6983
      gen_sec: 2.88
      ref_sec: 3.42
    '171':
      text: Asɔfo No Hyɛ Hɔn Dwumadzi Ase.
      sbs: 0.6434
      gen_sec: 2.16
      ref_sec: 3.66
    '172':
      text: na Memfis banodzifo adwen efura mu; na hɔn a wɔyɛ no mbusuakuw kutuwdo bo no.
      sbs: 0.7119
      gen_sec: 6.4
      ref_sec: 7.5
    '173':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.6946
      gen_sec: 7.84
      ref_sec: 9.28
    '174':
      text: 'Obu mpɔtsibaa dɛ mburonan: Ɔserew nkambaa no huuyɛ.'
      sbs: 0.6446
      gen_sec: 4.56
      ref_sec: 5.28
    '175':
      text: Nyew, dɛ mbrɛ gyata no pɔw, na gyata bɔyafo ne ndze.
      sbs: 0.7312
      gen_sec: 4.24
      ref_sec: 5.48
    '176':
      text: Afei nna ɔhen David ayɛ akɔdaa a oedzi mfe pii; ɔwɔ mu dɛ wɔdze atam kataa no do, naaso no
        ho annyɛ no hyew.
      sbs: 0.6837
      gen_sec: 8.16
      ref_sec: 9.2
    '177':
      text: 'Enyena sa a, ogya dum: Na bɔtomkɛka nnyi hɔ a, mansotwe gyaa.'
      sbs: 0.6506
      gen_sec: 5.76
      ref_sec: 6.04
    '178':
      text: Na Ahija tae suoo atar fofor a ɔhyɛ no no mu, na ɔtsetseew mu esinesin duebien.
      sbs: 0.6763
      gen_sec: 5.76
      ref_sec: 7.34
    '180':
      text: Me bepɔw a ewɔ wiramu, medze w’ahodze na w’akoradze nyina bɛma ma wɔaafom afa, na wo nsorɔnsorɔmbea
        no, wɔ bɔn ntsi, wɔ w’ahe nyinara do.
      sbs: 0.6537
      gen_sec: 10.32
      ref_sec: 11.4
    '181':
      text: Kaansa enyitan dze ndaadaa kata noho mpo a.
      sbs: 0.7036
      gen_sec: 2.48
      ref_sec: 3.78
    '182':
      text: 'Ɔtwerɛw bɔnsa mu, na odzi ehurusi wɔ n’ahoɔdzen mu: Opue kehyia akofo a woemia.'
      sbs: 0.6842
      gen_sec: 5.76
      ref_sec: 6.46
    '183':
      text: EWURADZE na ɔse; hom a hom ka dɛ, Woana botum esian aba hɛn do?
      sbs: 0.6878
      gen_sec: 5.92
      ref_sec: 4.62
    '184':
      text: Anaadɛ nyia ɔda hɛn mu frankadua etsifi.
      sbs: 0.6241
      gen_sec: 3.2
      ref_sec: 3.92
    '185':
      text: dɛ mbrɛ ɔsabokwafo tɔ ntentan wɔ ne fe mu.
      sbs: 0.6846
      gen_sec: 2.48
      ref_sec: 3.76
    '186':
      text: 'Na ɔsee Israelhen no dɛ, Fa wo nsa to egyen no do: na ɔdze ne nsa too do.'
      sbs: 0.5674
      gen_sec: 5.6
      ref_sec: 7.32
    '187':
      text: Na ɔbaa dɛ, aber a wowiee ɔman no nyinara twatsia twitwa no, wɔtsenatsenaa hɔn ananmu wɔ nseraban
        no mu ma wɔtsee apɔw ana.
      sbs: 0.6948
      gen_sec: 9.2
      ref_sec: 12.36
    '188':
      text: Makasa prɛko, na murummbua; Nyew, mprɛnu, na moronnkɔ kan bio.
      sbs: 0.7723
      gen_sec: 7.76
      ref_sec: 5.84
    '189':
      text: 'Wo mboanofo tsenaa mu: Ɔwo, Nyankopɔn, na isiesiee abɔbɔfo wɔ w’ayamuyie mu.'
      sbs: 0.671
      gen_sec: 4.48
      ref_sec: 6.3
    '190':
      text: Na Juda mbapɔmba tsee ndzɛmba yinom no, wofii ahemfie fowee baa EWURADZE fie ɔponkɛse fofor
        no ano.
      sbs: 0.6439
      gen_sec: 6.72
      ref_sec: 7.82
    '192':
      text: Nna Farao see no dɛ, Na ebɛnadze na ehia no wɔ me nkyɛn, ma erohwehwɛ dɛ ekɔ wankasa wo man
        mu yi?
      sbs: 0.6599
      gen_sec: 6.48
      ref_sec: 7.9
    '193':
      text: 'Nna wɔfaa Jeremia, na wɔkotoow no kyeen ɔhenba Malkia mona efiadze a ɔwɔ aweɔmfo abanguado
        no mu: na wɔdze ntampehoma gyaagyaa Jeremia siaan mu.'
      sbs: 0.7163
      gen_sec: 10.08
      ref_sec: 12.34
    '194':
      text: Wɔse dɛ, Hom mbra ma yenkruw hɔn ase ma wongyaa dɛ wɔbɛyɛ ɔman; Ama wɔnnkɛkaa Israel dzin
        bio.
      sbs: 0.6403
      gen_sec: 8.08
      ref_sec: 8.02
    '195':
      text: 'Na ɔfowee kɔr ne nkyɛn: na, hwɛ, ɔtse koko no n’etsifi.'
      sbs: 0.5895
      gen_sec: 3.76
      ref_sec: 4.84
    '196':
      text: 'Na wobuaa dɛ, Ahazia no nuanom nye hɛn: na yerisian akɔ ekekyiakyia ɔhen ne mba, na ɔhembaa
        ne mba no.'
      sbs: 0.6216
      gen_sec: 7.68
      ref_sec: 10.94
    '198':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6336
      gen_sec: 6.32
      ref_sec: 5.64
    '199':
      text: Na Sallum, a ofi Kore, Ebiasaf, na Kora asefo no mu, na no nuanom a wofi n’egya fie.
      sbs: 0.5965
      gen_sec: 8.0
      ref_sec: 8.82
    '200':
      text: bɛba dɔm EWURADZE ne dzin tsenabea, bepɔw Zion no do.
      sbs: 0.7041
      gen_sec: 3.84
      ref_sec: 6.32
    '201':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.6315
      gen_sec: 2.96
      ref_sec: 4.2
    '202':
      text: Hɔn a wɔdan wo gya nyina enyi bɔto; hɔn a wofi wo nkyɛn kɔ no, wɔbɛkyerɛw hɔn edzin aka asaase
        ase mba ho.
      sbs: 0.6586
      gen_sec: 6.4
      ref_sec: 8.28
    '203':
      text: Na Adonija n’aponto asefo no nyinara suroi, na wɔsoɛrsoɛree na nyimpa biara faa no kwan kɔree.
      sbs: 0.689
      gen_sec: 6.0
      ref_sec: 8.48
    '204':
      text: Hom nka nkyerɛ amanaman dɛ wɔreba; hom mma wɔntse no Jerusalɛm.
      sbs: 0.7081
      gen_sec: 4.24
      ref_sec: 4.18
    '205':
      text: sɛ wosi frankaa wɔ mbepɔw do a, hom nhwɛ; na sɛ wɔbɔ akasamu mu a, hom ntsie.
      sbs: 0.707
      gen_sec: 6.72
      ref_sec: 5.46
    '207':
      text: Na Kohatmba nkaa no nam tontotwe do nyae fii Efraim, Dan, nye Manaasɛ ebusuakuw fa no mu nkurow
        du.
      sbs: 0.658
      gen_sec: 7.84
      ref_sec: 10.62
    '208':
      text: Iyi nye Benjaminmba no egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.7016
      gen_sec: 3.68
      ref_sec: 7.22
    '209':
      text: Na ɔkaa Israelmba mu ebusuakuw esuon a wonnyae nnkyɛɛ hɔn egyapadze.
      sbs: 0.6511
      gen_sec: 5.04
      ref_sec: 5.76
    '210':
      text: Afei Solomon n’edwuma nyinara wosiesiei maa da a wɔtoow EWURADZE ne dan no ne fapem, na okodur
        dɛ wowiei.
      sbs: 0.7105
      gen_sec: 5.92
      ref_sec: 9.0
    '211':
      text: dɛmara so na wobotwitwa hom egu, na hom etwa mu akɔ.
      sbs: 0.7259
      gen_sec: 3.76
      ref_sec: 3.46
    '213':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.7375
      gen_sec: 6.64
      ref_sec: 7.62
    '214':
      text: na ɔmaa ahendzi hihimii no nye yi; nyia ɔmaa wiadze yi yɛɛ dɛ sar.
      sbs: 0.6844
      gen_sec: 4.08
      ref_sec: 5.48
    '215':
      text: nye w’ayeforber mu dɔ no ma wo; mbrɛ idzii m’ekyir wɔ sar no do.
      sbs: 0.6957
      gen_sec: 4.4
      ref_sec: 4.9
    '216':
      text: 'Wɔdze ogya ahyew no, woetwa ato famu: W’enyim nkaenyim ntsi wɔasɛɛ.'
      sbs: 0.6759
      gen_sec: 5.04
      ref_sec: 4.74
    '217':
      text: Na aber a Seba ɔhembaa no tsee Solomon ne nka wɔ EWURADZE ne dzin ho no, ɔbaa dɛ ɔdze nsɛmbisa
        dzendzen robɔsɔ no ahwɛ.
      sbs: 0.6863
      gen_sec: 9.28
      ref_sec: 7.86
    '218':
      text: Na wɔdze afona anomu kunkum hɔn; na brampafo na asafohemfo no totoow hɔn gui, na wosii mu
        kɔr Baal fie kurow no mu.
      sbs: 0.7368
      gen_sec: 7.68
      ref_sec: 10.54
    '219':
      text: Naaso ɔpoow nkɔdaa no hɔn afotu a wɔdze maa no no, na ɔnye mberantsɛ a wɔnye no nyinii a afei
        wɔabɛyɛ n’apamfo no no dwenee.
      sbs: 0.683
      gen_sec: 7.04
      ref_sec: 11.92
    '220':
      text: 'Ɔwo edze hɛn yɛ aperdzi ma hɛn asɔnmufo: Na hɛn atamfo sereserew wɔ hɔnara hɔn mu.'
      sbs: 0.6206
      gen_sec: 6.96
      ref_sec: 7.6
    '221':
      text: anaadɛ poma bɛma nyia ɔnnyɛ dua no no do.
      sbs: 0.5529
      gen_sec: 4.16
      ref_sec: 3.34
    '222':
      text: 'Na asɛm yi maa wɔyɛɛ bɔn: osiandɛ ɔman no kɔree kɔsoom hɔn wɔ Bɛtɛl araa dze kɔr Dan.'
      sbs: 0.6725
      gen_sec: 8.0
      ref_sec: 7.32
    '223':
      text: Obeyi wo wɔ ahohia esia mu; Nyew, dza otsia esuon no mu mpo mbusu bi rennka wo.
      sbs: 0.7195
      gen_sec: 7.12
      ref_sec: 7.56
    '225':
      text: Nna Atalia tsetseew ne ntar mu, na ɔkekaa mu dɛ, Etuatsew o, iyi yɛ etuatsew.
      sbs: 0.6961
      gen_sec: 6.88
      ref_sec: 6.74
    '226':
      text: Woana na ɔwɔ enyiwa a ayɛ kɔɔ?
      sbs: 0.715
      gen_sec: 1.76
      ref_sec: 3.68
  score: 0.6743
  partial: true
- model: Google/gemini-3.1-flash-tts-preview-universal
  sbs: 0.6261
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.6276
      gen_sec: 8.68
      ref_sec: 9.1
    '1':
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.5951
      gen_sec: 3.84
      ref_sec: 3.66
    '3':
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.5924
      gen_sec: 7.28
      ref_sec: 6.36
    '5':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6252
      gen_sec: 4.64
      ref_sec: 3.18
    '6':
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.6073
      gen_sec: 9.0
      ref_sec: 9.12
    '7':
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.6742
      gen_sec: 10.4
      ref_sec: 7.44
    '8':
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.6486
      gen_sec: 6.08
      ref_sec: 4.88
    '9':
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.5877
      gen_sec: 7.68
      ref_sec: 6.16
    '10':
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.6194
      gen_sec: 10.4
      ref_sec: 8.48
    '11':
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.5649
      gen_sec: 7.44
      ref_sec: 6.68
    '12':
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.6049
      gen_sec: 9.44
      ref_sec: 10.5
    '13':
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.6574
      gen_sec: 5.88
      ref_sec: 6.38
    '14':
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.6169
      gen_sec: 5.04
      ref_sec: 4.1
    '15':
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.5784
      gen_sec: 9.24
      ref_sec: 6.76
    '16':
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.6262
      gen_sec: 9.04
      ref_sec: 8.48
    '19':
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.6352
      gen_sec: 3.88
      ref_sec: 3.16
    '20':
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.6233
      gen_sec: 5.64
      ref_sec: 4.36
    '22':
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.6358
      gen_sec: 4.76
      ref_sec: 3.74
    '23':
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.6639
      gen_sec: 9.36
      ref_sec: 10.44
    '24':
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.629
      gen_sec: 8.12
      ref_sec: 8.26
    '26':
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.6842
      gen_sec: 4.96
      ref_sec: 5.0
    '27':
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6386
      gen_sec: 9.52
      ref_sec: 7.04
    '28':
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.624
      gen_sec: 8.96
      ref_sec: 9.74
    '29':
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.6119
      gen_sec: 5.08
      ref_sec: 4.34
    '30':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6114
      gen_sec: 8.24
      ref_sec: 5.64
    '32':
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.6512
      gen_sec: 4.6
      ref_sec: 3.54
    '33':
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.6263
      gen_sec: 9.16
      ref_sec: 11.1
    '35':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.6478
      gen_sec: 7.88
      ref_sec: 7.62
    '36':
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.5841
      gen_sec: 5.08
      ref_sec: 3.74
    '37':
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.6286
      gen_sec: 5.68
      ref_sec: 3.94
    '38':
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.5757
      gen_sec: 8.8
      ref_sec: 7.02
    '39':
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.587
      gen_sec: 3.04
      ref_sec: 3.74
    '40':
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.6139
      gen_sec: 6.6
      ref_sec: 5.94
    '41':
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.6276
      gen_sec: 4.24
      ref_sec: 3.26
    '42':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.6543
      gen_sec: 7.96
      ref_sec: 9.28
    '43':
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
        dɛ, Hom mma yɛmfa.'
      sbs: 0.6047
      gen_sec: 10.72
      ref_sec: 11.2
    '44':
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.5972
      gen_sec: 4.84
      ref_sec: 4.1
    '46':
      text: 'Na ɔsee dɛ, Tase egyen menaba no: na ɔtasee.'
      sbs: 0.6896
      gen_sec: 5.76
      ref_sec: 4.26
    '47':
      text: Ɔwo, Nyankopɔn, maa nyankom tɔɔ berdzedzeedze.
      sbs: 0.5712
      gen_sec: 4.52
      ref_sec: 3.42
    '48':
      text: Ne nda nyinara mu no woemmfi EWURADZE, hɔn egyanom Nyankopɔn no, n’ekyir dzi no ho emmfir.
      sbs: 0.6308
      gen_sec: 8.2
      ref_sec: 9.06
    '49':
      text: Na ɔdze etsifi mbasu nye anaafo mbasu no maa no.
      sbs: 0.6693
      gen_sec: 7.28
      ref_sec: 3.6
    '50':
      text: 'Na owungyam bi nnyi hɔn wu mu: Na mbom hɔn ahoɔdzen wɔ hɔ pintsinn.'
      sbs: 0.581
      gen_sec: 6.48
      ref_sec: 4.82
    '51':
      text: Woana na osiesie akonkoran n’edziban ma no.
      sbs: 0.5929
      gen_sec: 4.84
      ref_sec: 3.32
    '52':
      text: Ana ɔwo na eyɛ ha nya afonam ma gyataber.
      sbs: 0.6675
      gen_sec: 4.8
      ref_sec: 3.4
    '53':
      text: 'Mber no mu no, Siriahen Hazael sii mu kɔree, na ɔnye Gat kɔkoe, na ɔfae: na Hazael dze sii
        n’enyi do dɛ ɔrokɔfow akɔ Jerusalɛm.'
      sbs: 0.6143
      gen_sec: 10.8
      ref_sec: 13.56
    '54':
      text: Na ma w’ebufuhyew no a ɔwɔ hɛn do no mbɔ adze.
      sbs: 0.6024
      gen_sec: 4.76
      ref_sec: 3.5
    '55':
      text: na ahendzi wɔ Damaskɔs; na Siria nkaa bɛyɛ dɛ.
      sbs: 0.6381
      gen_sec: 5.32
      ref_sec: 4.32
    '56':
      text: Na wɔbɔtotɔ mfuwa wɔ asaase yi a hom ka wɔ ho dɛ, Ɔyɛ amamfo, nyimpa anaa abowa nnyi do; wɔdze
        ahyɛ Kaldeafo nsa no mu.
      sbs: 0.603
      gen_sec: 12.12
      ref_sec: 11.26
    '57':
      text: Iyi nye Gadmba no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee, nkurow no nye no nkurobaase.
      sbs: 0.6186
      gen_sec: 8.4
      ref_sec: 9.24
    '58':
      text: 'Ɔno na yennkefi wo nkyɛn akɔ ekyir: Ma yennya nkwa, na yɛbɔbɔ wo dzin.'
      sbs: 0.6059
      gen_sec: 8.44
      ref_sec: 5.02
    '59':
      text: Na Josua dze n’enyim butuuw famu, na ɔsɔɔr no, na ɔsee no dɛ, Na mo wura ese n’akowaa dɛn?
      sbs: 0.5887
      gen_sec: 9.96
      ref_sec: 8.24
    '60':
      text: Mbrɛ aboɔdzembo kotoku a ɔhyɛ abo ntamu tse no.
      sbs: 0.6106
      gen_sec: 5.24
      ref_sec: 4.78
    '61':
      text: 'Emumuyɛfo guan wɔ aber a nyimpa biara nntaa hɔn do: Na atseneneefo dze, wɔyɛ ndam dɛ ogyata.'
      sbs: 0.5871
      gen_sec: 9.52
      ref_sec: 8.82
    '62':
      text: 'dɛ abaa a ɔhwee wo no ebu ntsi: na ɔwɔ no ndwow mu na ɔkyerben befir aba.'
      sbs: 0.6395
      gen_sec: 9.92
      ref_sec: 6.62
    '63':
      text: Mbrɛ ɔmansotwenyi sɔ aperper mu ogya ara nye no.
      sbs: 0.5846
      gen_sec: 4.52
      ref_sec: 4.5
    '64':
      text: Ana ɔwo ibotum akyekyer Aberwa na mba no n’ahoma.
      sbs: 0.6331
      gen_sec: 5.68
      ref_sec: 5.08
    '65':
      text: Na ɔatsen ne nsa, na woana na ɔbɔpon mu?
      sbs: 0.6095
      gen_sec: 5.16
      ref_sec: 3.26
    '66':
      text: Na dɛtse atɔw atɔw no abɔ mu afemfam ho no?
      sbs: 0.5995
      gen_sec: 4.64
      ref_sec: 3.2
    '67':
      text: 'Nna wɔdze ntampehoma no twee Jeremia baa sor, na woyii no fii mona efiadze no mu: na Jeremia
        tsenaa aweɔmfo abangua no mu.'
      sbs: 0.6087
      gen_sec: 11.12
      ref_sec: 9.2
    '68':
      text: Ma munhu w’awerdzi wɔ hɔn do; na ɔwo na maka m’asɛm akyerɛ wo.
      sbs: 0.6229
      gen_sec: 6.48
      ref_sec: 4.5
    '70':
      text: Na Safan ba Ahikam ne nsa wɔ Jeremia afa, dɛ mma wonnyi no nnhyɛ ɔman no nsa mma wonnku no.
      sbs: 0.7016
      gen_sec: 11.68
      ref_sec: 9.6
    '71':
      text: ma aabɔsom me; na sɛ iyi dza ɔsom bo fi dza ɔyɛ huhuw no mu a.
      sbs: 0.5885
      gen_sec: 6.04
      ref_sec: 4.86
    '72':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.636
      gen_sec: 9.68
      ref_sec: 10.92
    '73':
      text: 'Dɛ mbrɛ mframa bɔ wusiw kɔ no, dɛmara so na bɔ hɔn kɔ: Dɛ mbrɛ ihua nan wɔ gya enyim no.'
      sbs: 0.5634
      gen_sec: 8.08
      ref_sec: 7.46
    '74':
      text: Anantwisaa kuw no, ɔnye aman anantwimba no enyim.
      sbs: 0.6129
      gen_sec: 5.04
      ref_sec: 3.8
    '75':
      text: Na ɔsoɛree, na ɔnye no sianee kɔr ɔhen no nkyɛn.
      sbs: 0.6246
      gen_sec: 6.04
      ref_sec: 4.08
    '76':
      text: Na ɔwo, mo wura ɔhen, na Israel nyinara enyi da wo do dɛ ebɛkyerɛ hɔn nyia ɔbɛtsena w’ahengua
        do wɔ w’ekyir.
      sbs: 0.6809
      gen_sec: 9.12
      ref_sec: 8.88
    '77':
      text: Nna Asiriahen no dze enyimguase sanee kɔr nankasa n’asaase do.
      sbs: 0.6205
      gen_sec: 6.16
      ref_sec: 6.08
    '78':
      text: Ɔtse dɛ obi a osuo bɔdɔm n’asowa mu.
      sbs: 0.6113
      gen_sec: 3.56
      ref_sec: 3.68
    '80':
      text: 'Mbrɛ EWURADZE se nye yi: Sɛ hom ayeyɛ petsepetsee, na hom dɔɔ so mpo a.'
      sbs: 0.5861
      gen_sec: 7.56
      ref_sec: 5.56
    '81':
      text: Na ɔtsenaa ahemfo ahengua no do.
      sbs: 0.6145
      gen_sec: 3.48
      ref_sec: 3.0
    '82':
      text: Galim babaa, ma wo ndze do tsea mu!
      sbs: 0.6112
      gen_sec: 3.8
      ref_sec: 3.62
    '83':
      text: Nyia medze sar pradada no ayɛ ne fi.
      sbs: 0.6087
      gen_sec: 2.72
      ref_sec: 3.94
    '84':
      text: na hɔn a mehiahia hɔn ho no; na mebɛma osiifo no ayɛ nkaase.
      sbs: 0.6099
      gen_sec: 5.96
      ref_sec: 5.18
    '85':
      text: Na Joas yɛɛ dza ɔtsen wɔ EWURADZE enyiwa do, wɔ ne nda a ɔsɔfo Jehoiada kyerɛkyerɛɛ no wɔ
        mu nyinara.
      sbs: 0.6226
      gen_sec: 7.28
      ref_sec: 8.58
    '87':
      text: Na ɔronnhwɛ afɔrmbukyia, ne nsaano edwuma no, eso n’enyi ronnsɔ dza ne nsatseaba ayɛ, Aserim,
        anaadɛ ewia ehonyi no.
      sbs: 0.6274
      gen_sec: 14.8
      ref_sec: 11.84
    '88':
      text: Sen nyimpa beesuon a wotum kyerɛkyerɛ asɛm ase.
      sbs: 0.5941
      gen_sec: 4.56
      ref_sec: 5.02
    '89':
      text: Elkosnyi Nahum n’enyido adzehu nwoma a ɔfa Ninive atsɛmbu ho.
      sbs: 0.6092
      gen_sec: 5.52
      ref_sec: 5.06
    '90':
      text: 'EWURADZE, ɔwo adom w’asaase: Ɔwo edze Jakob egyapadze asan aba.'
      sbs: 0.6307
      gen_sec: 6.72
      ref_sec: 5.76
    '91':
      text: 'na medwuruw w’aban dzendzen nyina: na mubotwitwa wo mbɔnsansɛm efi wo nsamu; na innkenya
        sebramufo bio: na mubotwitwa ehonyi.'
      sbs: 0.6568
      gen_sec: 8.48
      ref_sec: 12.12
    '92':
      text: 'Emi dze memmpɛɛ ntsɛm minngyaae dɛ meyɛ oguanhwɛfo dzi w’ekyir: eso memmpɛɛ mbusu da no.'
      sbs: 0.6297
      gen_sec: 8.92
      ref_sec: 7.78
    '93':
      text: 'Nna ɔhen tse awɔwber dan no mu, wɔ bosoom a otsia akron no mu: na mbukyia mu ogya a ɔredzɛw
        taa n’enyim.'
      sbs: 0.621
      gen_sec: 10.32
      ref_sec: 7.8
    '94':
      text: Ɔwoara nko nye Ɔsorsornyi wɔ asaase nyinara do.
      sbs: 0.6251
      gen_sec: 4.36
      ref_sec: 5.58
    '96':
      text: Aso nyia ɔyɛ nyiyiano no ɔnye Otumfo no bɛham?
      sbs: 0.6329
      gen_sec: 5.64
      ref_sec: 4.1
    '97':
      text: Na Omri ne ba Ahab yɛɛ dza omuo wɔ EWURADZE enyim seen hɔn a wodzii n’enyim nyinara.
      sbs: 0.6888
      gen_sec: 9.08
      ref_sec: 6.86
    '99':
      text: Na Aser ebusuakuw mu dze, Misal, Abdon; Helkat nye Rehob nye hɔn ho mfikyisaase, nkurow anan.
      sbs: 0.6498
      gen_sec: 10.76
      ref_sec: 11.58
    '100':
      text: Mbrɛ ɔkwadwefo so da ne mpa do ara nye no.
      sbs: 0.602
      gen_sec: 4.32
      ref_sec: 3.78
    '101':
      text: Fa hɛn san si yie, ao hɛn nkwagye Nyankopɔn.
      sbs: 0.6363
      gen_sec: 6.12
      ref_sec: 3.16
    '102':
      text: Na iyi ntsi mibehiahia David n’asefo ho, na nnyɛ daa nyina.
      sbs: 0.6321
      gen_sec: 5.2
      ref_sec: 4.88
    '103':
      text: Nna ɔhen Joas kɛfrɛɛ ɔsɔfo Jehoiada, na asɔfo nkaa no, na obisaa hɔn dɛ, Ɔyɛ dɛn ntsi na hom
        mmpempaam ofi no n’agow no yi?
      sbs: 0.6094
      gen_sec: 10.36
      ref_sec: 12.62
    '104':
      text: 'Nyia ɔkata ne mbrato do no, ɔnnkɛyɛ prɔmprɔm: Na obiara a ɔka to gua na ɔpow no, obenya ehumbɔbɔr.'
      sbs: 0.6765
      gen_sec: 11.64
      ref_sec: 8.0
    '106':
      text: Ana woeyi wu no mbobotsen no akyerɛ wo?
      sbs: 0.6092
      gen_sec: 3.72
      ref_sec: 3.66
    '107':
      text: 'Ɔhen dze atsɛmbu ma asaase gyina: Na nyia odzi mboaba no, obutuw no.'
      sbs: 0.6798
      gen_sec: 9.92
      ref_sec: 7.18
    '108':
      text: Ana akɛhɛn esukwankyɛba no korabea.
      sbs: 0.6362
      gen_sec: 3.68
      ref_sec: 3.26
    '109':
      text: Na wɔbɛkaa asɛm yi kyerɛɛ ɔhen no.
      sbs: 0.6388
      gen_sec: 2.76
      ref_sec: 3.68
    '110':
      text: 'na etsetsɛw mu enyame ananaben: mpo sɛ wo ntsɛwee da no ara mu ema ofifir.'
      sbs: 0.5866
      gen_sec: 6.48
      ref_sec: 7.28
    '112':
      text: Mbrɛ enyidzi so mmfata ɔkwasea ara nye no.
      sbs: 0.6116
      gen_sec: 5.36
      ref_sec: 3.3
    '114':
      text: Mbrɛ EWURADZE se nye yi, Wɔdze kurow yi bɛhyɛ Babilɔnhen no dɔm nsa ara ampa, na wɔagye.
      sbs: 0.6149
      gen_sec: 6.36
      ref_sec: 7.48
    '115':
      text: Nokwar befi asaase mu efir; Na tsenenee efi sor ahwɛ famu.
      sbs: 0.6142
      gen_sec: 5.6
      ref_sec: 4.88
    '116':
      text: Na EWURADZE maa ɔtamfo bi soɛree tsiaa Solomon, Edomnyi Hadad a ofi ɔhen n’asefo mu wɔ Edom
        no a.
      sbs: 0.6598
      gen_sec: 11.68
      ref_sec: 9.54
    '117':
      text: Ebɛn asɛm na wɔdze bobua amanaman asomafo no?
      sbs: 0.6251
      gen_sec: 4.68
      ref_sec: 3.62
    '118':
      text: Na asafohen no bo fuuw Jeremia, na wɔhwee no, na wɔdze no kɔtoo efiadze wɔ ɔkyerɛwfo Jonatan
        fie; nna hɔ na wɔdze ayɛ efiadze.
      sbs: 0.5925
      gen_sec: 11.36
      ref_sec: 10.5
    '119':
      text: Dɛ gyama abaa bi him nyia ɔma do no do.
      sbs: 0.6331
      gen_sec: 3.52
      ref_sec: 3.2
    '120':
      text: 'dɛ gyatafɔr wɔ nguan ekuwekuw mu: ɔno a sɛ ɔhɛn mu a, otsiatsia do.'
      sbs: 0.634
      gen_sec: 6.96
      ref_sec: 5.98
    '122':
      text: Hwɛ, aber a ɔwo nye ɔhen da ho rekasa wɔ hɔ no, mo so mibedzi w’ekyir maba, na mabɛhyɛ wo
        nsɛm no ma.
      sbs: 0.6266
      gen_sec: 8.76
      ref_sec: 9.42
    '123':
      text: Ɔbabanyin na ɔdɔba kor ma me na na m’egya no.
      sbs: 0.6489
      gen_sec: 4.32
      ref_sec: 5.46
    '124':
      text: 'Ao Nyankopɔn kyerɛ w’ahoɔdzen: Kyerɛ wo tum, Ao Nyankopɔn, dza edze agye hɛn no.'
      sbs: 0.7252
      gen_sec: 14.12
      ref_sec: 7.24
    '125':
      text: Nna wogyaa dɛ wɔnye no kasa; osiandɛ woennhu asɛm no.
      sbs: 0.631
      gen_sec: 4.12
      ref_sec: 3.92
    '126':
      text: Afei Ahija no nkɔdaayɛ ntsi n’enyiwa ayɛ kusukusu na onnhu adze.
      sbs: 0.6222
      gen_sec: 5.28
      ref_sec: 6.98
    '127':
      text: Na Hilkia buae see ɔkyerɛwfo Safan dɛ, Mehu mbra nwoma no wɔ EWURADZE fie.
      sbs: 0.6153
      gen_sec: 6.92
      ref_sec: 8.0
    '128':
      text: Na boka afamu he nye Nkyen Po no, mekyerɛ ɔdze kodu Jordan ewiei.
      sbs: 0.6591
      gen_sec: 6.2
      ref_sec: 6.62
    '129':
      text: 'Tappua asaase no yɛ Manaasɛ dze: na Tappua a ɔwɔ Manaasɛ he do no dze ɔyɛ Efraimmba no dze.'
      sbs: 0.6475
      gen_sec: 8.32
      ref_sec: 8.34
    '130':
      text: Wotwa mu wɔ Nyinsu bɔnsa no mu a wɔdan no bea a mbasu wɔ; Nyew, adɔwnsu dze nhyira kata do.
      sbs: 0.5908
      gen_sec: 8.6
      ref_sec: 8.24
    '131':
      text: 'Na wɔnkyɛ mu kyɛpɛn esuon: Juda ntsena ne he do wɔ kwaamu afamu.'
      sbs: 0.6356
      gen_sec: 3.2
      ref_sec: 6.72
    '132':
      text: 'Naaso wo nda mu dze merennyɛ, osian w’egya David ntsi: na mbom mebɛtsew efi wo ba nsamu.'
      sbs: 0.6448
      gen_sec: 8.72
      ref_sec: 6.76
    '133':
      text: 'Nyia ɔtwer nankasa n’akoma no, ɔkwasea a: Na obiara a ɔnantsew nyansa mu no dze, wɔbɛgye
        no nkwa.'
      sbs: 0.6798
      gen_sec: 13.24
      ref_sec: 8.76
    '134':
      text: Nyia ɔsoɛr anapahema dze ndze kɛse hyira ne nyɛnko no.
      sbs: 0.6202
      gen_sec: 5.48
      ref_sec: 4.7
    '135':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6231
      gen_sec: 3.6
      ref_sec: 3.18
    '136':
      text: Na ofi hɔ fowee kɔr Debir a nkan no na ne dzin nye Kiriat-Sefer no do.
      sbs: 0.639
      gen_sec: 7.24
      ref_sec: 9.1
    '137':
      text: Hwɛ, menye wo enya, ɔwo a etse bɔnsa mu e.
      sbs: 0.672
      gen_sec: 5.84
      ref_sec: 3.4
    '138':
      text: Nna Jeremia see Zedekia dɛ, Aso mepaa mu ka kyerɛ wo a, ana nnyɛ oku ara na woboku me bi?
      sbs: 0.6283
      gen_sec: 7.6
      ref_sec: 7.18
    '139':
      text: Dɛm ntsi afei hom nyiyi Israel ebusuakuw ebusuakuw mu mbanyin duebien, ebusuakuw biara mu
        nyimpa baako.
      sbs: 0.633
      gen_sec: 9.96
      ref_sec: 9.46
    '140':
      text: Afei, me Nyankopɔn, meserɛ wo, bue w’enyiwa, na kyɛn w’aso wɔ mpaabɔ a wɔbɔ wɔ ha yi do.
      sbs: 0.6246
      gen_sec: 9.6
      ref_sec: 8.14
    '141':
      text: Otwitwa nankasa ne nan, na ɔnom mbusu.
      sbs: 0.6266
      gen_sec: 3.92
      ref_sec: 3.48
    '142':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.6694
      gen_sec: 5.4
      ref_sec: 4.2
    '143':
      text: 'Na Solomon kɔr ne nsamankyir, na wosiee no wɔ n’egya David kurow mu: na ne ba Rehoboam dzii
        hen wɔ n’ananmu.'
      sbs: 0.6372
      gen_sec: 9.12
      ref_sec: 11.3
    '145':
      text: Dadze sew dadze ano; Dɛmara so na nyimpa sew ne nyɛnko enyim.
      sbs: 0.608
      gen_sec: 6.64
      ref_sec: 4.94
    '147':
      text: Afei Zimri no ho nsɛm nkaa no na no nkontompɔ a otwae no, ana wɔnnkyerɛɛw no wɔ Israel ahemfo
        hɔn Mbermunsɛm nwoma no mu?
      sbs: 0.6114
      gen_sec: 9.84
      ref_sec: 11.44
    '148':
      text: Na ɔhwɛɛ ahemfo no nyinara do dze fi Esutsen no ho araa dze kodur Filistiafo asaase do, na
        Egypt ahe do.
      sbs: 0.6186
      gen_sec: 8.92
      ref_sec: 10.56
    '149':
      text: EWURADZE tse ase yi; nna amanaman bɛyɛ esiarfo wɔ no mu.
      sbs: 0.618
      gen_sec: 5.88
      ref_sec: 3.4
    '150':
      text: 'Dɔm ahemfo guanguan, woguanguan: Na nyia ɔtse fie na ɔkyɛ asadze mu.'
      sbs: 0.6546
      gen_sec: 9.12
      ref_sec: 5.42
    '151':
      text: Ama wo mbɔdɔm tɛkyerɛma eenya ne kyɛpɛn wɔ w’atamfo ho.
      sbs: 0.6287
      gen_sec: 4.72
      ref_sec: 3.56
    '152':
      text: Ntsi migyaa hɔn ma wodzii hɔn akomadzen ekyir.
      sbs: 0.5994
      gen_sec: 4.56
      ref_sec: 3.26
    '153':
      text: 'Na ɔsee dɛ, Bue boka afamu tokura no: na obuei.'
      sbs: 0.6542
      gen_sec: 5.12
      ref_sec: 4.9
    '154':
      text: Na sɛ hom ayɛ dɛ nsoɛ kantankantan, na hom afɔw takaa wɔ hom nsanom mu mpo a.
      sbs: 0.593
      gen_sec: 6.72
      ref_sec: 6.02
    '155':
      text: Aber a obui faa do, dɛ gyama ofi yafun mu rupue no; Aber a medze mununkum yɛɛ n’akataho.
      sbs: 0.6185
      gen_sec: 8.28
      ref_sec: 7.58
    '156':
      text: Aso emumuyɛ akoradze wɔ emumuyɛ fi no mu.
      sbs: 0.5961
      gen_sec: 5.52
      ref_sec: 3.2
    '157':
      text: Na Reubenmba no hɔn he nye Jordan, nye ne he.
      sbs: 0.6826
      gen_sec: 4.28
      ref_sec: 3.22
    '158':
      text: Na, hwɛ, mber a ɔda ho nye ɔhen no rekasa no, nkɔnhyɛnyi Natan bae.
      sbs: 0.6083
      gen_sec: 6.76
      ref_sec: 5.62
    '159':
      text: Afei hwɛ esuson a meyɛɛ no kaa wo ho no; Odzi efuw dɛ nantwi.
      sbs: 0.6169
      gen_sec: 6.04
      ref_sec: 4.92
    '160':
      text: Israelhen Joahaz ne ba Jehoas n’afe a otsia ebien no mu nna Amazia, Judahen Joas ne ba no,
        hyɛɛ ase dzii hen.
      sbs: 0.6167
      gen_sec: 12.84
      ref_sec: 11.84
    '162':
      text: Dɛm ntsi afei mma hom nngyegye sika wɔ hom amanyimfo hɔ bio, na hom nyi mma ma wɔmfa mpempam
        ofi no n’agow no.
      sbs: 0.6249
      gen_sec: 8.72
      ref_sec: 11.32
    '163':
      text: 'Hom mper ngye abɔbɔfo na ehiafo: Hom nhwim hɔn mfi nyimpa bɔn no nsamu.'
      sbs: 0.5988
      gen_sec: 7.4
      ref_sec: 5.7
    '164':
      text: Dɛmara so na abɔbɔfo do ɔhen tsirmɔdzennyi tse.
      sbs: 0.6235
      gen_sec: 5.16
      ref_sec: 3.38
    '165':
      text: Na ɔyɛɛ dza ɔtsen wɔ EWURADZE n’enyiwa do, na ɔnantseew n’egya David n’akwan do, na ɔanndan
        ammfa nkyɛn annkɔ enyimfa anaa abankum.
      sbs: 0.6494
      gen_sec: 10.0
      ref_sec: 11.16
    '166':
      text: Mbrɛ Jeremia tsenaa aweɔmfo abangua no mu nye no.
      sbs: 0.6725
      gen_sec: 6.56
      ref_sec: 5.58
    '167':
      text: na ɔdze n’abasa bubu mbɛtsem no; ɔbɛyɛ dɛ aber a obi ridzi mbɛtsem mpɛpɛw.
      sbs: 0.5901
      gen_sec: 6.88
      ref_sec: 6.22
    '168':
      text: Ana ofitsi dɛ wo nda hyɛɛ ase yi ahyɛ anapa do pɛn.
      sbs: 0.6198
      gen_sec: 4.48
      ref_sec: 4.84
    '169':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.6255
      gen_sec: 9.48
      ref_sec: 10.92
    '170':
      text: Ngyanka hɔn egya, na ekunafo hɔn sɛndzifo.
      sbs: 0.6118
      gen_sec: 5.24
      ref_sec: 3.42
    '171':
      text: Asɔfo No Hyɛ Hɔn Dwumadzi Ase.
      sbs: 0.6344
      gen_sec: 3.32
      ref_sec: 3.66
    '172':
      text: na Memfis banodzifo adwen efura mu; na hɔn a wɔyɛ no mbusuakuw kutuwdo bo no.
      sbs: 0.6092
      gen_sec: 7.68
      ref_sec: 7.5
    '173':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.6694
      gen_sec: 7.28
      ref_sec: 9.28
    '174':
      text: 'Obu mpɔtsibaa dɛ mburonan: Ɔserew nkambaa no huuyɛ.'
      sbs: 0.6344
      gen_sec: 5.28
      ref_sec: 5.28
    '175':
      text: Nyew, dɛ mbrɛ gyata no pɔw, na gyata bɔyafo ne ndze.
      sbs: 0.6132
      gen_sec: 4.6
      ref_sec: 5.48
    '176':
      text: Afei nna ɔhen David ayɛ akɔdaa a oedzi mfe pii; ɔwɔ mu dɛ wɔdze atam kataa no do, naaso no
        ho annyɛ no hyew.
      sbs: 0.6048
      gen_sec: 10.08
      ref_sec: 9.2
    '177':
      text: 'Enyena sa a, ogya dum: Na bɔtomkɛka nnyi hɔ a, mansotwe gyaa.'
      sbs: 0.6379
      gen_sec: 6.52
      ref_sec: 6.04
    '178':
      text: Na Ahija tae suoo atar fofor a ɔhyɛ no no mu, na ɔtsetseew mu esinesin duebien.
      sbs: 0.5987
      gen_sec: 7.24
      ref_sec: 7.34
    '180':
      text: Me bepɔw a ewɔ wiramu, medze w’ahodze na w’akoradze nyina bɛma ma wɔaafom afa, na wo nsorɔnsorɔmbea
        no, wɔ bɔn ntsi, wɔ w’ahe nyinara do.
      sbs: 0.5928
      gen_sec: 11.96
      ref_sec: 11.4
    '181':
      text: Kaansa enyitan dze ndaadaa kata noho mpo a.
      sbs: 0.6184
      gen_sec: 4.24
      ref_sec: 3.78
    '182':
      text: 'Ɔtwerɛw bɔnsa mu, na odzi ehurusi wɔ n’ahoɔdzen mu: Opue kehyia akofo a woemia.'
      sbs: 0.616
      gen_sec: 8.88
      ref_sec: 6.46
    '183':
      text: EWURADZE na ɔse; hom a hom ka dɛ, Woana botum esian aba hɛn do?
      sbs: 0.5603
      gen_sec: 5.92
      ref_sec: 4.62
    '184':
      text: Anaadɛ nyia ɔda hɛn mu frankadua etsifi.
      sbs: 0.606
      gen_sec: 4.24
      ref_sec: 3.92
    '185':
      text: dɛ mbrɛ ɔsabokwafo tɔ ntentan wɔ ne fe mu.
      sbs: 0.614
      gen_sec: 4.6
      ref_sec: 3.76
    '186':
      text: 'Na ɔsee Israelhen no dɛ, Fa wo nsa to egyen no do: na ɔdze ne nsa too do.'
      sbs: 0.6196
      gen_sec: 7.24
      ref_sec: 7.32
    '187':
      text: Na ɔbaa dɛ, aber a wowiee ɔman no nyinara twatsia twitwa no, wɔtsenatsenaa hɔn ananmu wɔ nseraban
        no mu ma wɔtsee apɔw ana.
      sbs: 0.6314
      gen_sec: 11.48
      ref_sec: 12.36
    '188':
      text: Makasa prɛko, na murummbua; Nyew, mprɛnu, na moronnkɔ kan bio.
      sbs: 0.6999
      gen_sec: 8.16
      ref_sec: 5.84
    '189':
      text: 'Wo mboanofo tsenaa mu: Ɔwo, Nyankopɔn, na isiesiee abɔbɔfo wɔ w’ayamuyie mu.'
      sbs: 0.7069
      gen_sec: 10.96
      ref_sec: 6.3
    '190':
      text: Na Juda mbapɔmba tsee ndzɛmba yinom no, wofii ahemfie fowee baa EWURADZE fie ɔponkɛse fofor
        no ano.
      sbs: 0.6551
      gen_sec: 10.8
      ref_sec: 7.82
    '192':
      text: Nna Farao see no dɛ, Na ebɛnadze na ehia no wɔ me nkyɛn, ma erohwehwɛ dɛ ekɔ wankasa wo man
        mu yi?
      sbs: 0.6271
      gen_sec: 9.0
      ref_sec: 7.9
    '193':
      text: 'Nna wɔfaa Jeremia, na wɔkotoow no kyeen ɔhenba Malkia mona efiadze a ɔwɔ aweɔmfo abanguado
        no mu: na wɔdze ntampehoma gyaagyaa Jeremia siaan mu.'
      sbs: 0.6923
      gen_sec: 14.48
      ref_sec: 12.34
    '194':
      text: Wɔse dɛ, Hom mbra ma yenkruw hɔn ase ma wongyaa dɛ wɔbɛyɛ ɔman; Ama wɔnnkɛkaa Israel dzin
        bio.
      sbs: 0.6299
      gen_sec: 9.92
      ref_sec: 8.02
    '195':
      text: 'Na ɔfowee kɔr ne nkyɛn: na, hwɛ, ɔtse koko no n’etsifi.'
      sbs: 0.5751
      gen_sec: 6.56
      ref_sec: 4.84
    '196':
      text: 'Na wobuaa dɛ, Ahazia no nuanom nye hɛn: na yerisian akɔ ekekyiakyia ɔhen ne mba, na ɔhembaa
        ne mba no.'
      sbs: 0.7099
      gen_sec: 13.52
      ref_sec: 10.94
    '198':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6743
      gen_sec: 9.16
      ref_sec: 5.64
    '199':
      text: Na Sallum, a ofi Kore, Ebiasaf, na Kora asefo no mu, na no nuanom a wofi n’egya fie.
      sbs: 0.6842
      gen_sec: 9.08
      ref_sec: 8.82
    '200':
      text: bɛba dɔm EWURADZE ne dzin tsenabea, bepɔw Zion no do.
      sbs: 0.616
      gen_sec: 5.96
      ref_sec: 6.32
    '201':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.647
      gen_sec: 4.48
      ref_sec: 4.2
    '202':
      text: Hɔn a wɔdan wo gya nyina enyi bɔto; hɔn a wofi wo nkyɛn kɔ no, wɔbɛkyerɛw hɔn edzin aka asaase
        ase mba ho.
      sbs: 0.6081
      gen_sec: 9.36
      ref_sec: 8.28
    '203':
      text: Na Adonija n’aponto asefo no nyinara suroi, na wɔsoɛrsoɛree na nyimpa biara faa no kwan kɔree.
      sbs: 0.6163
      gen_sec: 8.52
      ref_sec: 8.48
    '204':
      text: Hom nka nkyerɛ amanaman dɛ wɔreba; hom mma wɔntse no Jerusalɛm.
      sbs: 0.6404
      gen_sec: 5.28
      ref_sec: 4.18
    '205':
      text: sɛ wosi frankaa wɔ mbepɔw do a, hom nhwɛ; na sɛ wɔbɔ akasamu mu a, hom ntsie.
      sbs: 0.5912
      gen_sec: 8.56
      ref_sec: 5.46
    '207':
      text: Na Kohatmba nkaa no nam tontotwe do nyae fii Efraim, Dan, nye Manaasɛ ebusuakuw fa no mu nkurow
        du.
      sbs: 0.6929
      gen_sec: 9.16
      ref_sec: 10.62
    '208':
      text: Iyi nye Benjaminmba no egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6239
      gen_sec: 5.8
      ref_sec: 7.22
    '209':
      text: Na ɔkaa Israelmba mu ebusuakuw esuon a wonnyae nnkyɛɛ hɔn egyapadze.
      sbs: 0.6182
      gen_sec: 6.52
      ref_sec: 5.76
    '210':
      text: Afei Solomon n’edwuma nyinara wosiesiei maa da a wɔtoow EWURADZE ne dan no ne fapem, na okodur
        dɛ wowiei.
      sbs: 0.6207
      gen_sec: 9.68
      ref_sec: 9.0
    '211':
      text: dɛmara so na wobotwitwa hom egu, na hom etwa mu akɔ.
      sbs: 0.5846
      gen_sec: 5.72
      ref_sec: 3.46
    '213':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.6625
      gen_sec: 9.0
      ref_sec: 7.62
    '214':
      text: na ɔmaa ahendzi hihimii no nye yi; nyia ɔmaa wiadze yi yɛɛ dɛ sar.
      sbs: 0.6093
      gen_sec: 7.12
      ref_sec: 5.48
    '215':
      text: nye w’ayeforber mu dɔ no ma wo; mbrɛ idzii m’ekyir wɔ sar no do.
      sbs: 0.624
      gen_sec: 7.6
      ref_sec: 4.9
    '216':
      text: 'Wɔdze ogya ahyew no, woetwa ato famu: W’enyim nkaenyim ntsi wɔasɛɛ.'
      sbs: 0.6517
      gen_sec: 8.64
      ref_sec: 4.74
    '217':
      text: Na aber a Seba ɔhembaa no tsee Solomon ne nka wɔ EWURADZE ne dzin ho no, ɔbaa dɛ ɔdze nsɛmbisa
        dzendzen robɔsɔ no ahwɛ.
      sbs: 0.6139
      gen_sec: 10.2
      ref_sec: 7.86
    '218':
      text: Na wɔdze afona anomu kunkum hɔn; na brampafo na asafohemfo no totoow hɔn gui, na wosii mu
        kɔr Baal fie kurow no mu.
      sbs: 0.6377
      gen_sec: 10.96
      ref_sec: 10.54
    '219':
      text: Naaso ɔpoow nkɔdaa no hɔn afotu a wɔdze maa no no, na ɔnye mberantsɛ a wɔnye no nyinii a afei
        wɔabɛyɛ n’apamfo no no dwenee.
      sbs: 0.6399
      gen_sec: 11.6
      ref_sec: 11.92
    '220':
      text: 'Ɔwo edze hɛn yɛ aperdzi ma hɛn asɔnmufo: Na hɛn atamfo sereserew wɔ hɔnara hɔn mu.'
      sbs: 0.5765
      gen_sec: 7.6
      ref_sec: 7.6
    '221':
      text: anaadɛ poma bɛma nyia ɔnnyɛ dua no no do.
      sbs: 0.6187
      gen_sec: 5.2
      ref_sec: 3.34
    '222':
      text: 'Na asɛm yi maa wɔyɛɛ bɔn: osiandɛ ɔman no kɔree kɔsoom hɔn wɔ Bɛtɛl araa dze kɔr Dan.'
      sbs: 0.6361
      gen_sec: 7.2
      ref_sec: 7.32
    '223':
      text: Obeyi wo wɔ ahohia esia mu; Nyew, dza otsia esuon no mu mpo mbusu bi rennka wo.
      sbs: 0.6182
      gen_sec: 7.52
      ref_sec: 7.56
    '225':
      text: Nna Atalia tsetseew ne ntar mu, na ɔkekaa mu dɛ, Etuatsew o, iyi yɛ etuatsew.
      sbs: 0.5986
      gen_sec: 7.72
      ref_sec: 6.74
    '226':
      text: Woana na ɔwɔ enyiwa a ayɛ kɔɔ?
      sbs: 0.6257
      gen_sec: 3.2
      ref_sec: 3.68
  score: 0.6261
  partial: true
- model: Google/gemini-3.1-flash-tts-preview
  sbs: 0.6284
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.658
      gen_sec: 8.72
      ref_sec: 9.1
    '1':
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.6029
      gen_sec: 4.08
      ref_sec: 3.66
    '3':
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.6193
      gen_sec: 6.64
      ref_sec: 6.36
    '5':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.5961
      gen_sec: 3.52
      ref_sec: 3.18
    '6':
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.6074
      gen_sec: 9.44
      ref_sec: 9.12
    '7':
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.6455
      gen_sec: 9.08
      ref_sec: 7.44
    '8':
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.6247
      gen_sec: 6.2
      ref_sec: 4.88
    '9':
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.6308
      gen_sec: 7.72
      ref_sec: 6.16
    '10':
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.6071
      gen_sec: 9.76
      ref_sec: 8.48
    '11':
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.6563
      gen_sec: 6.04
      ref_sec: 6.68
    '12':
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.6384
      gen_sec: 10.68
      ref_sec: 10.5
    '13':
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.6557
      gen_sec: 7.08
      ref_sec: 6.38
    '14':
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.6176
      gen_sec: 4.84
      ref_sec: 4.1
    '15':
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6166
      gen_sec: 7.88
      ref_sec: 6.76
    '16':
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.6546
      gen_sec: 9.48
      ref_sec: 8.48
    '19':
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.6005
      gen_sec: 3.52
      ref_sec: 3.16
    '20':
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.7054
      gen_sec: 5.76
      ref_sec: 4.36
    '22':
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.5657
      gen_sec: 6.44
      ref_sec: 3.74
    '23':
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.6103
      gen_sec: 9.24
      ref_sec: 10.44
    '24':
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.6528
      gen_sec: 8.68
      ref_sec: 8.26
    '26':
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.6545
      gen_sec: 4.52
      ref_sec: 5.0
    '27':
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6279
      gen_sec: 7.76
      ref_sec: 7.04
    '28':
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.6222
      gen_sec: 9.0
      ref_sec: 9.74
    '29':
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.6238
      gen_sec: 5.68
      ref_sec: 4.34
    '30':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6284
      gen_sec: 7.4
      ref_sec: 5.64
    '32':
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.5963
      gen_sec: 3.48
      ref_sec: 3.54
    '33':
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.6356
      gen_sec: 11.48
      ref_sec: 11.1
    '35':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.6848
      gen_sec: 7.52
      ref_sec: 7.62
    '36':
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.5625
      gen_sec: 4.4
      ref_sec: 3.74
    '37':
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.6534
      gen_sec: 5.16
      ref_sec: 3.94
    '38':
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6181
      gen_sec: 7.08
      ref_sec: 7.02
    '39':
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.6078
      gen_sec: 3.32
      ref_sec: 3.74
    '40':
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.6189
      gen_sec: 7.12
      ref_sec: 5.94
    '41':
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.6402
      gen_sec: 3.84
      ref_sec: 3.26
    '42':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.7133
      gen_sec: 10.76
      ref_sec: 9.28
    '43':
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
        dɛ, Hom mma yɛmfa.'
      sbs: 0.6508
      gen_sec: 11.8
      ref_sec: 11.2
    '44':
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.6385
      gen_sec: 4.76
      ref_sec: 4.1
    '46':
      text: 'Na ɔsee dɛ, Tase egyen menaba no: na ɔtasee.'
      sbs: 0.675
      gen_sec: 5.68
      ref_sec: 4.26
    '47':
      text: Ɔwo, Nyankopɔn, maa nyankom tɔɔ berdzedzeedze.
      sbs: 0.5684
      gen_sec: 5.6
      ref_sec: 3.42
    '48':
      text: Ne nda nyinara mu no woemmfi EWURADZE, hɔn egyanom Nyankopɔn no, n’ekyir dzi no ho emmfir.
      sbs: 0.6615
      gen_sec: 7.44
      ref_sec: 9.06
    '49':
      text: Na ɔdze etsifi mbasu nye anaafo mbasu no maa no.
      sbs: 0.6362
      gen_sec: 4.04
      ref_sec: 3.6
    '50':
      text: 'Na owungyam bi nnyi hɔn wu mu: Na mbom hɔn ahoɔdzen wɔ hɔ pintsinn.'
      sbs: 0.6596
      gen_sec: 5.76
      ref_sec: 4.82
    '51':
      text: Woana na osiesie akonkoran n’edziban ma no.
      sbs: 0.633
      gen_sec: 3.28
      ref_sec: 3.32
    '52':
      text: Ana ɔwo na eyɛ ha nya afonam ma gyataber.
      sbs: 0.6374
      gen_sec: 3.72
      ref_sec: 3.4
    '53':
      text: 'Mber no mu no, Siriahen Hazael sii mu kɔree, na ɔnye Gat kɔkoe, na ɔfae: na Hazael dze sii
        n’enyi do dɛ ɔrokɔfow akɔ Jerusalɛm.'
      sbs: 0.6183
      gen_sec: 11.36
      ref_sec: 13.56
    '54':
      text: Na ma w’ebufuhyew no a ɔwɔ hɛn do no mbɔ adze.
      sbs: 0.6052
      gen_sec: 3.92
      ref_sec: 3.5
    '55':
      text: na ahendzi wɔ Damaskɔs; na Siria nkaa bɛyɛ dɛ.
      sbs: 0.6014
      gen_sec: 5.08
      ref_sec: 4.32
    '56':
      text: Na wɔbɔtotɔ mfuwa wɔ asaase yi a hom ka wɔ ho dɛ, Ɔyɛ amamfo, nyimpa anaa abowa nnyi do; wɔdze
        ahyɛ Kaldeafo nsa no mu.
      sbs: 0.6171
      gen_sec: 10.52
      ref_sec: 11.26
    '57':
      text: Iyi nye Gadmba no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee, nkurow no nye no nkurobaase.
      sbs: 0.6128
      gen_sec: 7.92
      ref_sec: 9.24
    '58':
      text: 'Ɔno na yennkefi wo nkyɛn akɔ ekyir: Ma yennya nkwa, na yɛbɔbɔ wo dzin.'
      sbs: 0.614
      gen_sec: 6.64
      ref_sec: 5.02
    '59':
      text: Na Josua dze n’enyim butuuw famu, na ɔsɔɔr no, na ɔsee no dɛ, Na mo wura ese n’akowaa dɛn?
      sbs: 0.6224
      gen_sec: 8.44
      ref_sec: 8.24
    '60':
      text: Mbrɛ aboɔdzembo kotoku a ɔhyɛ abo ntamu tse no.
      sbs: 0.5998
      gen_sec: 5.04
      ref_sec: 4.78
    '61':
      text: 'Emumuyɛfo guan wɔ aber a nyimpa biara nntaa hɔn do: Na atseneneefo dze, wɔyɛ ndam dɛ ogyata.'
      sbs: 0.5942
      gen_sec: 8.8
      ref_sec: 8.82
    '62':
      text: 'dɛ abaa a ɔhwee wo no ebu ntsi: na ɔwɔ no ndwow mu na ɔkyerben befir aba.'
      sbs: 0.6328
      gen_sec: 7.76
      ref_sec: 6.62
    '63':
      text: Mbrɛ ɔmansotwenyi sɔ aperper mu ogya ara nye no.
      sbs: 0.6148
      gen_sec: 4.2
      ref_sec: 4.5
    '64':
      text: Ana ɔwo ibotum akyekyer Aberwa na mba no n’ahoma.
      sbs: 0.6346
      gen_sec: 4.6
      ref_sec: 5.08
    '65':
      text: Na ɔatsen ne nsa, na woana na ɔbɔpon mu?
      sbs: 0.6439
      gen_sec: 4.8
      ref_sec: 3.26
    '66':
      text: Na dɛtse atɔw atɔw no abɔ mu afemfam ho no?
      sbs: 0.6396
      gen_sec: 4.6
      ref_sec: 3.2
    '67':
      text: 'Nna wɔdze ntampehoma no twee Jeremia baa sor, na woyii no fii mona efiadze no mu: na Jeremia
        tsenaa aweɔmfo abangua no mu.'
      sbs: 0.5974
      gen_sec: 9.84
      ref_sec: 9.2
    '68':
      text: Ma munhu w’awerdzi wɔ hɔn do; na ɔwo na maka m’asɛm akyerɛ wo.
      sbs: 0.6703
      gen_sec: 4.36
      ref_sec: 4.5
    '70':
      text: Na Safan ba Ahikam ne nsa wɔ Jeremia afa, dɛ mma wonnyi no nnhyɛ ɔman no nsa mma wonnku no.
      sbs: 0.6058
      gen_sec: 7.32
      ref_sec: 9.6
    '71':
      text: ma aabɔsom me; na sɛ iyi dza ɔsom bo fi dza ɔyɛ huhuw no mu a.
      sbs: 0.6059
      gen_sec: 6.4
      ref_sec: 4.86
    '72':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.6358
      gen_sec: 9.36
      ref_sec: 10.92
    '73':
      text: 'Dɛ mbrɛ mframa bɔ wusiw kɔ no, dɛmara so na bɔ hɔn kɔ: Dɛ mbrɛ ihua nan wɔ gya enyim no.'
      sbs: 0.6381
      gen_sec: 8.56
      ref_sec: 7.46
    '74':
      text: Anantwisaa kuw no, ɔnye aman anantwimba no enyim.
      sbs: 0.6154
      gen_sec: 5.28
      ref_sec: 3.8
    '75':
      text: Na ɔsoɛree, na ɔnye no sianee kɔr ɔhen no nkyɛn.
      sbs: 0.616
      gen_sec: 4.52
      ref_sec: 4.08
    '76':
      text: Na ɔwo, mo wura ɔhen, na Israel nyinara enyi da wo do dɛ ebɛkyerɛ hɔn nyia ɔbɛtsena w’ahengua
        do wɔ w’ekyir.
      sbs: 0.6253
      gen_sec: 10.32
      ref_sec: 8.88
    '77':
      text: Nna Asiriahen no dze enyimguase sanee kɔr nankasa n’asaase do.
      sbs: 0.621
      gen_sec: 6.16
      ref_sec: 6.08
    '78':
      text: Ɔtse dɛ obi a osuo bɔdɔm n’asowa mu.
      sbs: 0.6109
      gen_sec: 3.76
      ref_sec: 3.68
    '80':
      text: 'Mbrɛ EWURADZE se nye yi: Sɛ hom ayeyɛ petsepetsee, na hom dɔɔ so mpo a.'
      sbs: 0.6753
      gen_sec: 6.36
      ref_sec: 5.56
    '81':
      text: Na ɔtsenaa ahemfo ahengua no do.
      sbs: 0.5909
      gen_sec: 3.32
      ref_sec: 3.0
    '82':
      text: Galim babaa, ma wo ndze do tsea mu!
      sbs: 0.6126
      gen_sec: 3.28
      ref_sec: 3.62
    '83':
      text: Nyia medze sar pradada no ayɛ ne fi.
      sbs: 0.628
      gen_sec: 2.72
      ref_sec: 3.94
    '84':
      text: na hɔn a mehiahia hɔn ho no; na mebɛma osiifo no ayɛ nkaase.
      sbs: 0.6274
      gen_sec: 6.32
      ref_sec: 5.18
    '85':
      text: Na Joas yɛɛ dza ɔtsen wɔ EWURADZE enyiwa do, wɔ ne nda a ɔsɔfo Jehoiada kyerɛkyerɛɛ no wɔ
        mu nyinara.
      sbs: 0.6166
      gen_sec: 8.0
      ref_sec: 8.58
    '87':
      text: Na ɔronnhwɛ afɔrmbukyia, ne nsaano edwuma no, eso n’enyi ronnsɔ dza ne nsatseaba ayɛ, Aserim,
        anaadɛ ewia ehonyi no.
      sbs: 0.588
      gen_sec: 9.96
      ref_sec: 11.84
    '88':
      text: Sen nyimpa beesuon a wotum kyerɛkyerɛ asɛm ase.
      sbs: 0.6063
      gen_sec: 4.28
      ref_sec: 5.02
    '89':
      text: Elkosnyi Nahum n’enyido adzehu nwoma a ɔfa Ninive atsɛmbu ho.
      sbs: 0.6139
      gen_sec: 5.72
      ref_sec: 5.06
    '90':
      text: 'EWURADZE, ɔwo adom w’asaase: Ɔwo edze Jakob egyapadze asan aba.'
      sbs: 0.6163
      gen_sec: 5.76
      ref_sec: 5.76
    '91':
      text: 'na medwuruw w’aban dzendzen nyina: na mubotwitwa wo mbɔnsansɛm efi wo nsamu; na innkenya
        sebramufo bio: na mubotwitwa ehonyi.'
      sbs: 0.6497
      gen_sec: 10.32
      ref_sec: 12.12
    '92':
      text: 'Emi dze memmpɛɛ ntsɛm minngyaae dɛ meyɛ oguanhwɛfo dzi w’ekyir: eso memmpɛɛ mbusu da no.'
      sbs: 0.6011
      gen_sec: 6.16
      ref_sec: 7.78
    '93':
      text: 'Nna ɔhen tse awɔwber dan no mu, wɔ bosoom a otsia akron no mu: na mbukyia mu ogya a ɔredzɛw
        taa n’enyim.'
      sbs: 0.5967
      gen_sec: 10.08
      ref_sec: 7.8
    '94':
      text: Ɔwoara nko nye Ɔsorsornyi wɔ asaase nyinara do.
      sbs: 0.6422
      gen_sec: 5.04
      ref_sec: 5.58
    '96':
      text: Aso nyia ɔyɛ nyiyiano no ɔnye Otumfo no bɛham?
      sbs: 0.6198
      gen_sec: 5.28
      ref_sec: 4.1
    '97':
      text: Na Omri ne ba Ahab yɛɛ dza omuo wɔ EWURADZE enyim seen hɔn a wodzii n’enyim nyinara.
      sbs: 0.6526
      gen_sec: 7.8
      ref_sec: 6.86
    '99':
      text: Na Aser ebusuakuw mu dze, Misal, Abdon; Helkat nye Rehob nye hɔn ho mfikyisaase, nkurow anan.
      sbs: 0.6866
      gen_sec: 11.56
      ref_sec: 11.58
    '100':
      text: Mbrɛ ɔkwadwefo so da ne mpa do ara nye no.
      sbs: 0.6162
      gen_sec: 3.12
      ref_sec: 3.78
    '101':
      text: Fa hɛn san si yie, ao hɛn nkwagye Nyankopɔn.
      sbs: 0.6377
      gen_sec: 5.4
      ref_sec: 3.16
    '102':
      text: Na iyi ntsi mibehiahia David n’asefo ho, na nnyɛ daa nyina.
      sbs: 0.6024
      gen_sec: 5.0
      ref_sec: 4.88
    '103':
      text: Nna ɔhen Joas kɛfrɛɛ ɔsɔfo Jehoiada, na asɔfo nkaa no, na obisaa hɔn dɛ, Ɔyɛ dɛn ntsi na hom
        mmpempaam ofi no n’agow no yi?
      sbs: 0.605
      gen_sec: 10.56
      ref_sec: 12.62
    '104':
      text: 'Nyia ɔkata ne mbrato do no, ɔnnkɛyɛ prɔmprɔm: Na obiara a ɔka to gua na ɔpow no, obenya ehumbɔbɔr.'
      sbs: 0.6103
      gen_sec: 9.8
      ref_sec: 8.0
    '106':
      text: Ana woeyi wu no mbobotsen no akyerɛ wo?
      sbs: 0.6076
      gen_sec: 3.44
      ref_sec: 3.66
    '107':
      text: 'Ɔhen dze atsɛmbu ma asaase gyina: Na nyia odzi mboaba no, obutuw no.'
      sbs: 0.6149
      gen_sec: 6.04
      ref_sec: 7.18
    '108':
      text: Ana akɛhɛn esukwankyɛba no korabea.
      sbs: 0.6682
      gen_sec: 2.84
      ref_sec: 3.26
    '109':
      text: Na wɔbɛkaa asɛm yi kyerɛɛ ɔhen no.
      sbs: 0.6402
      gen_sec: 2.8
      ref_sec: 3.68
    '110':
      text: 'na etsetsɛw mu enyame ananaben: mpo sɛ wo ntsɛwee da no ara mu ema ofifir.'
      sbs: 0.5945
      gen_sec: 7.92
      ref_sec: 7.28
    '112':
      text: Mbrɛ enyidzi so mmfata ɔkwasea ara nye no.
      sbs: 0.6384
      gen_sec: 3.48
      ref_sec: 3.3
    '114':
      text: Mbrɛ EWURADZE se nye yi, Wɔdze kurow yi bɛhyɛ Babilɔnhen no dɔm nsa ara ampa, na wɔagye.
      sbs: 0.6251
      gen_sec: 7.84
      ref_sec: 7.48
    '115':
      text: Nokwar befi asaase mu efir; Na tsenenee efi sor ahwɛ famu.
      sbs: 0.588
      gen_sec: 6.44
      ref_sec: 4.88
    '116':
      text: Na EWURADZE maa ɔtamfo bi soɛree tsiaa Solomon, Edomnyi Hadad a ofi ɔhen n’asefo mu wɔ Edom
        no a.
      sbs: 0.6241
      gen_sec: 9.16
      ref_sec: 9.54
    '117':
      text: Ebɛn asɛm na wɔdze bobua amanaman asomafo no?
      sbs: 0.6269
      gen_sec: 4.28
      ref_sec: 3.62
    '118':
      text: Na asafohen no bo fuuw Jeremia, na wɔhwee no, na wɔdze no kɔtoo efiadze wɔ ɔkyerɛwfo Jonatan
        fie; nna hɔ na wɔdze ayɛ efiadze.
      sbs: 0.5966
      gen_sec: 12.72
      ref_sec: 10.5
    '119':
      text: Dɛ gyama abaa bi him nyia ɔma do no do.
      sbs: 0.6514
      gen_sec: 3.56
      ref_sec: 3.2
    '120':
      text: 'dɛ gyatafɔr wɔ nguan ekuwekuw mu: ɔno a sɛ ɔhɛn mu a, otsiatsia do.'
      sbs: 0.6166
      gen_sec: 5.88
      ref_sec: 5.98
    '122':
      text: Hwɛ, aber a ɔwo nye ɔhen da ho rekasa wɔ hɔ no, mo so mibedzi w’ekyir maba, na mabɛhyɛ wo
        nsɛm no ma.
      sbs: 0.6779
      gen_sec: 7.68
      ref_sec: 9.42
    '123':
      text: Ɔbabanyin na ɔdɔba kor ma me na na m’egya no.
      sbs: 0.6065
      gen_sec: 4.08
      ref_sec: 5.46
    '124':
      text: 'Ao Nyankopɔn kyerɛ w’ahoɔdzen: Kyerɛ wo tum, Ao Nyankopɔn, dza edze agye hɛn no.'
      sbs: 0.6994
      gen_sec: 12.8
      ref_sec: 7.24
    '125':
      text: Nna wogyaa dɛ wɔnye no kasa; osiandɛ woennhu asɛm no.
      sbs: 0.6329
      gen_sec: 4.2
      ref_sec: 3.92
    '126':
      text: Afei Ahija no nkɔdaayɛ ntsi n’enyiwa ayɛ kusukusu na onnhu adze.
      sbs: 0.6278
      gen_sec: 5.8
      ref_sec: 6.98
    '127':
      text: Na Hilkia buae see ɔkyerɛwfo Safan dɛ, Mehu mbra nwoma no wɔ EWURADZE fie.
      sbs: 0.6964
      gen_sec: 8.36
      ref_sec: 8.0
    '128':
      text: Na boka afamu he nye Nkyen Po no, mekyerɛ ɔdze kodu Jordan ewiei.
      sbs: 0.6312
      gen_sec: 6.04
      ref_sec: 6.62
    '129':
      text: 'Tappua asaase no yɛ Manaasɛ dze: na Tappua a ɔwɔ Manaasɛ he do no dze ɔyɛ Efraimmba no dze.'
      sbs: 0.6407
      gen_sec: 8.0
      ref_sec: 8.34
    '130':
      text: Wotwa mu wɔ Nyinsu bɔnsa no mu a wɔdan no bea a mbasu wɔ; Nyew, adɔwnsu dze nhyira kata do.
      sbs: 0.6752
      gen_sec: 10.96
      ref_sec: 8.24
    '131':
      text: 'Na wɔnkyɛ mu kyɛpɛn esuon: Juda ntsena ne he do wɔ kwaamu afamu.'
      sbs: 0.5994
      gen_sec: 5.88
      ref_sec: 6.72
    '132':
      text: 'Naaso wo nda mu dze merennyɛ, osian w’egya David ntsi: na mbom mebɛtsew efi wo ba nsamu.'
      sbs: 0.6105
      gen_sec: 8.32
      ref_sec: 6.76
    '133':
      text: 'Nyia ɔtwer nankasa n’akoma no, ɔkwasea a: Na obiara a ɔnantsew nyansa mu no dze, wɔbɛgye
        no nkwa.'
      sbs: 0.6154
      gen_sec: 9.2
      ref_sec: 8.76
    '134':
      text: Nyia ɔsoɛr anapahema dze ndze kɛse hyira ne nyɛnko no.
      sbs: 0.6011
      gen_sec: 5.64
      ref_sec: 4.7
    '135':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6275
      gen_sec: 4.08
      ref_sec: 3.18
    '136':
      text: Na ofi hɔ fowee kɔr Debir a nkan no na ne dzin nye Kiriat-Sefer no do.
      sbs: 0.6388
      gen_sec: 8.16
      ref_sec: 9.1
    '137':
      text: Hwɛ, menye wo enya, ɔwo a etse bɔnsa mu e.
      sbs: 0.5909
      gen_sec: 5.6
      ref_sec: 3.4
    '138':
      text: Nna Jeremia see Zedekia dɛ, Aso mepaa mu ka kyerɛ wo a, ana nnyɛ oku ara na woboku me bi?
      sbs: 0.6454
      gen_sec: 9.0
      ref_sec: 7.18
    '139':
      text: Dɛm ntsi afei hom nyiyi Israel ebusuakuw ebusuakuw mu mbanyin duebien, ebusuakuw biara mu
        nyimpa baako.
      sbs: 0.6169
      gen_sec: 8.8
      ref_sec: 9.46
    '140':
      text: Afei, me Nyankopɔn, meserɛ wo, bue w’enyiwa, na kyɛn w’aso wɔ mpaabɔ a wɔbɔ wɔ ha yi do.
      sbs: 0.6356
      gen_sec: 7.84
      ref_sec: 8.14
    '141':
      text: Otwitwa nankasa ne nan, na ɔnom mbusu.
      sbs: 0.6387
      gen_sec: 3.64
      ref_sec: 3.48
    '142':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.6286
      gen_sec: 3.76
      ref_sec: 4.2
    '143':
      text: 'Na Solomon kɔr ne nsamankyir, na wosiee no wɔ n’egya David kurow mu: na ne ba Rehoboam dzii
        hen wɔ n’ananmu.'
      sbs: 0.6516
      gen_sec: 8.88
      ref_sec: 11.3
    '145':
      text: Dadze sew dadze ano; Dɛmara so na nyimpa sew ne nyɛnko enyim.
      sbs: 0.6603
      gen_sec: 5.68
      ref_sec: 4.94
    '147':
      text: Afei Zimri no ho nsɛm nkaa no na no nkontompɔ a otwae no, ana wɔnnkyerɛɛw no wɔ Israel ahemfo
        hɔn Mbermunsɛm nwoma no mu?
      sbs: 0.659
      gen_sec: 9.96
      ref_sec: 11.44
    '148':
      text: Na ɔhwɛɛ ahemfo no nyinara do dze fi Esutsen no ho araa dze kodur Filistiafo asaase do, na
        Egypt ahe do.
      sbs: 0.6397
      gen_sec: 10.24
      ref_sec: 10.56
    '149':
      text: EWURADZE tse ase yi; nna amanaman bɛyɛ esiarfo wɔ no mu.
      sbs: 0.6298
      gen_sec: 5.24
      ref_sec: 3.4
    '150':
      text: 'Dɔm ahemfo guanguan, woguanguan: Na nyia ɔtse fie na ɔkyɛ asadze mu.'
      sbs: 0.5958
      gen_sec: 7.24
      ref_sec: 5.42
    '151':
      text: Ama wo mbɔdɔm tɛkyerɛma eenya ne kyɛpɛn wɔ w’atamfo ho.
      sbs: 0.6046
      gen_sec: 4.24
      ref_sec: 3.56
    '152':
      text: Ntsi migyaa hɔn ma wodzii hɔn akomadzen ekyir.
      sbs: 0.5964
      gen_sec: 3.92
      ref_sec: 3.26
    '153':
      text: 'Na ɔsee dɛ, Bue boka afamu tokura no: na obuei.'
      sbs: 0.6418
      gen_sec: 6.04
      ref_sec: 4.9
    '154':
      text: Na sɛ hom ayɛ dɛ nsoɛ kantankantan, na hom afɔw takaa wɔ hom nsanom mu mpo a.
      sbs: 0.5829
      gen_sec: 6.44
      ref_sec: 6.02
    '155':
      text: Aber a obui faa do, dɛ gyama ofi yafun mu rupue no; Aber a medze mununkum yɛɛ n’akataho.
      sbs: 0.6322
      gen_sec: 8.52
      ref_sec: 7.58
    '156':
      text: Aso emumuyɛ akoradze wɔ emumuyɛ fi no mu.
      sbs: 0.628
      gen_sec: 4.12
      ref_sec: 3.2
    '157':
      text: Na Reubenmba no hɔn he nye Jordan, nye ne he.
      sbs: 0.6849
      gen_sec: 3.88
      ref_sec: 3.22
    '158':
      text: Na, hwɛ, mber a ɔda ho nye ɔhen no rekasa no, nkɔnhyɛnyi Natan bae.
      sbs: 0.6098
      gen_sec: 7.6
      ref_sec: 5.62
    '159':
      text: Afei hwɛ esuson a meyɛɛ no kaa wo ho no; Odzi efuw dɛ nantwi.
      sbs: 0.6187
      gen_sec: 6.64
      ref_sec: 4.92
    '160':
      text: Israelhen Joahaz ne ba Jehoas n’afe a otsia ebien no mu nna Amazia, Judahen Joas ne ba no,
        hyɛɛ ase dzii hen.
      sbs: 0.6506
      gen_sec: 11.4
      ref_sec: 11.84
    '162':
      text: Dɛm ntsi afei mma hom nngyegye sika wɔ hom amanyimfo hɔ bio, na hom nyi mma ma wɔmfa mpempam
        ofi no n’agow no.
      sbs: 0.62
      gen_sec: 10.24
      ref_sec: 11.32
    '163':
      text: 'Hom mper ngye abɔbɔfo na ehiafo: Hom nhwim hɔn mfi nyimpa bɔn no nsamu.'
      sbs: 0.6199
      gen_sec: 7.56
      ref_sec: 5.7
    '164':
      text: Dɛmara so na abɔbɔfo do ɔhen tsirmɔdzennyi tse.
      sbs: 0.6154
      gen_sec: 4.68
      ref_sec: 3.38
    '165':
      text: Na ɔyɛɛ dza ɔtsen wɔ EWURADZE n’enyiwa do, na ɔnantseew n’egya David n’akwan do, na ɔanndan
        ammfa nkyɛn annkɔ enyimfa anaa abankum.
      sbs: 0.6322
      gen_sec: 12.16
      ref_sec: 11.16
    '166':
      text: Mbrɛ Jeremia tsenaa aweɔmfo abangua no mu nye no.
      sbs: 0.5946
      gen_sec: 5.04
      ref_sec: 5.58
    '167':
      text: na ɔdze n’abasa bubu mbɛtsem no; ɔbɛyɛ dɛ aber a obi ridzi mbɛtsem mpɛpɛw.
      sbs: 0.6194
      gen_sec: 6.92
      ref_sec: 6.22
    '168':
      text: Ana ofitsi dɛ wo nda hyɛɛ ase yi ahyɛ anapa do pɛn.
      sbs: 0.6204
      gen_sec: 3.88
      ref_sec: 4.84
    '169':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.6459
      gen_sec: 9.72
      ref_sec: 10.92
    '170':
      text: Ngyanka hɔn egya, na ekunafo hɔn sɛndzifo.
      sbs: 0.6019
      gen_sec: 4.36
      ref_sec: 3.42
    '171':
      text: Asɔfo No Hyɛ Hɔn Dwumadzi Ase.
      sbs: 0.6094
      gen_sec: 3.24
      ref_sec: 3.66
    '172':
      text: na Memfis banodzifo adwen efura mu; na hɔn a wɔyɛ no mbusuakuw kutuwdo bo no.
      sbs: 0.6328
      gen_sec: 4.16
      ref_sec: 7.5
    '173':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.6885
      gen_sec: 11.96
      ref_sec: 9.28
    '174':
      text: 'Obu mpɔtsibaa dɛ mburonan: Ɔserew nkambaa no huuyɛ.'
      sbs: 0.6458
      gen_sec: 5.84
      ref_sec: 5.28
    '175':
      text: Nyew, dɛ mbrɛ gyata no pɔw, na gyata bɔyafo ne ndze.
      sbs: 0.6756
      gen_sec: 5.32
      ref_sec: 5.48
    '176':
      text: Afei nna ɔhen David ayɛ akɔdaa a oedzi mfe pii; ɔwɔ mu dɛ wɔdze atam kataa no do, naaso no
        ho annyɛ no hyew.
      sbs: 0.649
      gen_sec: 11.8
      ref_sec: 9.2
    '177':
      text: 'Enyena sa a, ogya dum: Na bɔtomkɛka nnyi hɔ a, mansotwe gyaa.'
      sbs: 0.6314
      gen_sec: 6.64
      ref_sec: 6.04
    '178':
      text: Na Ahija tae suoo atar fofor a ɔhyɛ no no mu, na ɔtsetseew mu esinesin duebien.
      sbs: 0.6253
      gen_sec: 8.04
      ref_sec: 7.34
    '180':
      text: Me bepɔw a ewɔ wiramu, medze w’ahodze na w’akoradze nyina bɛma ma wɔaafom afa, na wo nsorɔnsorɔmbea
        no, wɔ bɔn ntsi, wɔ w’ahe nyinara do.
      sbs: 0.6119
      gen_sec: 11.0
      ref_sec: 11.4
    '181':
      text: Kaansa enyitan dze ndaadaa kata noho mpo a.
      sbs: 0.6304
      gen_sec: 4.08
      ref_sec: 3.78
    '182':
      text: 'Ɔtwerɛw bɔnsa mu, na odzi ehurusi wɔ n’ahoɔdzen mu: Opue kehyia akofo a woemia.'
      sbs: 0.6097
      gen_sec: 7.48
      ref_sec: 6.46
    '183':
      text: EWURADZE na ɔse; hom a hom ka dɛ, Woana botum esian aba hɛn do?
      sbs: 0.6008
      gen_sec: 6.24
      ref_sec: 4.62
    '184':
      text: Anaadɛ nyia ɔda hɛn mu frankadua etsifi.
      sbs: 0.605
      gen_sec: 3.36
      ref_sec: 3.92
    '185':
      text: dɛ mbrɛ ɔsabokwafo tɔ ntentan wɔ ne fe mu.
      sbs: 0.611
      gen_sec: 3.8
      ref_sec: 3.76
    '186':
      text: 'Na ɔsee Israelhen no dɛ, Fa wo nsa to egyen no do: na ɔdze ne nsa too do.'
      sbs: 0.6579
      gen_sec: 6.96
      ref_sec: 7.32
    '187':
      text: Na ɔbaa dɛ, aber a wowiee ɔman no nyinara twatsia twitwa no, wɔtsenatsenaa hɔn ananmu wɔ nseraban
        no mu ma wɔtsee apɔw ana.
      sbs: 0.6339
      gen_sec: 11.2
      ref_sec: 12.36
    '188':
      text: Makasa prɛko, na murummbua; Nyew, mprɛnu, na moronnkɔ kan bio.
      sbs: 0.6668
      gen_sec: 7.32
      ref_sec: 5.84
    '189':
      text: 'Wo mboanofo tsenaa mu: Ɔwo, Nyankopɔn, na isiesiee abɔbɔfo wɔ w’ayamuyie mu.'
      sbs: 0.62
      gen_sec: 5.76
      ref_sec: 6.3
    '190':
      text: Na Juda mbapɔmba tsee ndzɛmba yinom no, wofii ahemfie fowee baa EWURADZE fie ɔponkɛse fofor
        no ano.
      sbs: 0.6095
      gen_sec: 8.16
      ref_sec: 7.82
    '192':
      text: Nna Farao see no dɛ, Na ebɛnadze na ehia no wɔ me nkyɛn, ma erohwehwɛ dɛ ekɔ wankasa wo man
        mu yi?
      sbs: 0.6181
      gen_sec: 8.84
      ref_sec: 7.9
    '193':
      text: 'Nna wɔfaa Jeremia, na wɔkotoow no kyeen ɔhenba Malkia mona efiadze a ɔwɔ aweɔmfo abanguado
        no mu: na wɔdze ntampehoma gyaagyaa Jeremia siaan mu.'
      sbs: 0.6077
      gen_sec: 13.2
      ref_sec: 12.34
    '194':
      text: Wɔse dɛ, Hom mbra ma yenkruw hɔn ase ma wongyaa dɛ wɔbɛyɛ ɔman; Ama wɔnnkɛkaa Israel dzin
        bio.
      sbs: 0.5898
      gen_sec: 10.96
      ref_sec: 8.02
    '195':
      text: 'Na ɔfowee kɔr ne nkyɛn: na, hwɛ, ɔtse koko no n’etsifi.'
      sbs: 0.6347
      gen_sec: 6.32
      ref_sec: 4.84
    '196':
      text: 'Na wobuaa dɛ, Ahazia no nuanom nye hɛn: na yerisian akɔ ekekyiakyia ɔhen ne mba, na ɔhembaa
        ne mba no.'
      sbs: 0.6535
      gen_sec: 10.16
      ref_sec: 10.94
    '198':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6645
      gen_sec: 8.16
      ref_sec: 5.64
    '199':
      text: Na Sallum, a ofi Kore, Ebiasaf, na Kora asefo no mu, na no nuanom a wofi n’egya fie.
      sbs: 0.6572
      gen_sec: 8.08
      ref_sec: 8.82
    '200':
      text: bɛba dɔm EWURADZE ne dzin tsenabea, bepɔw Zion no do.
      sbs: 0.6305
      gen_sec: 5.84
      ref_sec: 6.32
    '201':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.6241
      gen_sec: 4.32
      ref_sec: 4.2
    '202':
      text: Hɔn a wɔdan wo gya nyina enyi bɔto; hɔn a wofi wo nkyɛn kɔ no, wɔbɛkyerɛw hɔn edzin aka asaase
        ase mba ho.
      sbs: 0.6017
      gen_sec: 8.64
      ref_sec: 8.28
    '203':
      text: Na Adonija n’aponto asefo no nyinara suroi, na wɔsoɛrsoɛree na nyimpa biara faa no kwan kɔree.
      sbs: 0.6177
      gen_sec: 8.32
      ref_sec: 8.48
    '204':
      text: Hom nka nkyerɛ amanaman dɛ wɔreba; hom mma wɔntse no Jerusalɛm.
      sbs: 0.6689
      gen_sec: 5.28
      ref_sec: 4.18
    '205':
      text: sɛ wosi frankaa wɔ mbepɔw do a, hom nhwɛ; na sɛ wɔbɔ akasamu mu a, hom ntsie.
      sbs: 0.6112
      gen_sec: 6.56
      ref_sec: 5.46
    '207':
      text: Na Kohatmba nkaa no nam tontotwe do nyae fii Efraim, Dan, nye Manaasɛ ebusuakuw fa no mu nkurow
        du.
      sbs: 0.6374
      gen_sec: 10.76
      ref_sec: 10.62
    '208':
      text: Iyi nye Benjaminmba no egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6038
      gen_sec: 6.48
      ref_sec: 7.22
    '209':
      text: Na ɔkaa Israelmba mu ebusuakuw esuon a wonnyae nnkyɛɛ hɔn egyapadze.
      sbs: 0.64
      gen_sec: 5.88
      ref_sec: 5.76
    '210':
      text: Afei Solomon n’edwuma nyinara wosiesiei maa da a wɔtoow EWURADZE ne dan no ne fapem, na okodur
        dɛ wowiei.
      sbs: 0.6485
      gen_sec: 10.48
      ref_sec: 9.0
    '211':
      text: dɛmara so na wobotwitwa hom egu, na hom etwa mu akɔ.
      sbs: 0.6431
      gen_sec: 5.0
      ref_sec: 3.46
    '213':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.6451
      gen_sec: 7.56
      ref_sec: 7.62
    '214':
      text: na ɔmaa ahendzi hihimii no nye yi; nyia ɔmaa wiadze yi yɛɛ dɛ sar.
      sbs: 0.6224
      gen_sec: 6.92
      ref_sec: 5.48
    '215':
      text: nye w’ayeforber mu dɔ no ma wo; mbrɛ idzii m’ekyir wɔ sar no do.
      sbs: 0.5995
      gen_sec: 5.64
      ref_sec: 4.9
    '216':
      text: 'Wɔdze ogya ahyew no, woetwa ato famu: W’enyim nkaenyim ntsi wɔasɛɛ.'
      sbs: 0.6199
      gen_sec: 6.88
      ref_sec: 4.74
    '217':
      text: Na aber a Seba ɔhembaa no tsee Solomon ne nka wɔ EWURADZE ne dzin ho no, ɔbaa dɛ ɔdze nsɛmbisa
        dzendzen robɔsɔ no ahwɛ.
      sbs: 0.6181
      gen_sec: 10.2
      ref_sec: 7.86
    '218':
      text: Na wɔdze afona anomu kunkum hɔn; na brampafo na asafohemfo no totoow hɔn gui, na wosii mu
        kɔr Baal fie kurow no mu.
      sbs: 0.6315
      gen_sec: 9.6
      ref_sec: 10.54
    '219':
      text: Naaso ɔpoow nkɔdaa no hɔn afotu a wɔdze maa no no, na ɔnye mberantsɛ a wɔnye no nyinii a afei
        wɔabɛyɛ n’apamfo no no dwenee.
      sbs: 0.6302
      gen_sec: 9.32
      ref_sec: 11.92
    '220':
      text: 'Ɔwo edze hɛn yɛ aperdzi ma hɛn asɔnmufo: Na hɛn atamfo sereserew wɔ hɔnara hɔn mu.'
      sbs: 0.6001
      gen_sec: 7.6
      ref_sec: 7.6
    '221':
      text: anaadɛ poma bɛma nyia ɔnnyɛ dua no no do.
      sbs: 0.6449
      gen_sec: 3.56
      ref_sec: 3.34
    '222':
      text: 'Na asɛm yi maa wɔyɛɛ bɔn: osiandɛ ɔman no kɔree kɔsoom hɔn wɔ Bɛtɛl araa dze kɔr Dan.'
      sbs: 0.6405
      gen_sec: 7.44
      ref_sec: 7.32
    '223':
      text: Obeyi wo wɔ ahohia esia mu; Nyew, dza otsia esuon no mu mpo mbusu bi rennka wo.
      sbs: 0.6566
      gen_sec: 7.92
      ref_sec: 7.56
    '225':
      text: Nna Atalia tsetseew ne ntar mu, na ɔkekaa mu dɛ, Etuatsew o, iyi yɛ etuatsew.
      sbs: 0.6609
      gen_sec: 7.16
      ref_sec: 6.74
    '226':
      text: Woana na ɔwɔ enyiwa a ayɛ kɔɔ?
      sbs: 0.6484
      gen_sec: 3.88
      ref_sec: 3.68
  score: 0.6284
  partial: true
- model: k2-fsa/OmniVoice-design
  sbs: 0.6622
  num_scored: 198
  uses_reference: false
  entries:
    '0':
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.6399
      gen_sec: 5.16
      ref_sec: 9.1
    '1':
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.6669
      gen_sec: 1.88
      ref_sec: 3.66
    '3':
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.6846
      gen_sec: 3.62
      ref_sec: 6.36
    '5':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6825
      gen_sec: 2.16
      ref_sec: 3.18
    '6':
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.6759
      gen_sec: 5.09
      ref_sec: 9.12
    '7':
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.629
      gen_sec: 5.58
      ref_sec: 7.44
    '8':
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.6796
      gen_sec: 2.88
      ref_sec: 4.88
    '9':
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.657
      gen_sec: 4.02
      ref_sec: 6.16
    '10':
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.6289
      gen_sec: 6.54
      ref_sec: 8.48
    '11':
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.6869
      gen_sec: 3.65
      ref_sec: 6.68
    '12':
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.696
      gen_sec: 6.29
      ref_sec: 10.5
    '13':
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.678
      gen_sec: 3.74
      ref_sec: 6.38
    '14':
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.6584
      gen_sec: 2.37
      ref_sec: 4.1
    '15':
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6555
      gen_sec: 4.35
      ref_sec: 6.76
    '16':
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.6864
      gen_sec: 4.77
      ref_sec: 8.48
    '19':
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.67
      gen_sec: 1.93
      ref_sec: 3.16
    '20':
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.6708
      gen_sec: 2.75
      ref_sec: 4.36
    '22':
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.6639
      gen_sec: 2.48
      ref_sec: 3.74
    '23':
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.6727
      gen_sec: 6.22
      ref_sec: 10.44
    '24':
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.6617
      gen_sec: 4.9
      ref_sec: 8.26
    '26':
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.7567
      gen_sec: 1.22
      ref_sec: 5.0
    '27':
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6768
      gen_sec: 3.95
      ref_sec: 7.04
    '28':
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.6613
      gen_sec: 5.13
      ref_sec: 9.74
    '29':
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.6732
      gen_sec: 3.02
      ref_sec: 4.34
    '30':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6824
      gen_sec: 4.04
      ref_sec: 5.64
    '32':
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.6458
      gen_sec: 2.34
      ref_sec: 3.54
    '33':
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.6377
      gen_sec: 6.42
      ref_sec: 11.1
    '35':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.6991
      gen_sec: 4.08
      ref_sec: 7.62
    '36':
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.6489
      gen_sec: 2.62
      ref_sec: 3.74
    '37':
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.7008
      gen_sec: 2.62
      ref_sec: 3.94
    '38':
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6764
      gen_sec: 4.23
      ref_sec: 7.02
    '39':
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.6508
      gen_sec: 1.76
      ref_sec: 3.74
    '40':
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.6985
      gen_sec: 4.0
      ref_sec: 5.94
    '41':
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.684
      gen_sec: 1.96
      ref_sec: 3.26
    '42':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.684
      gen_sec: 4.33
      ref_sec: 9.28
    '43':
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
        dɛ, Hom mma yɛmfa.'
      sbs: 0.6982
      gen_sec: 6.68
      ref_sec: 11.2
    '44':
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.6963
      gen_sec: 2.48
      ref_sec: 4.1
    '46':
      text: 'Na ɔsee dɛ, Tase egyen menaba no: na ɔtasee.'
      sbs: 0.5187
      gen_sec: 2.76
      ref_sec: 4.26
    '47':
      text: Ɔwo, Nyankopɔn, maa nyankom tɔɔ berdzedzeedze.
      sbs: 0.6772
      gen_sec: 2.81
      ref_sec: 3.42
    '48':
      text: Ne nda nyinara mu no woemmfi EWURADZE, hɔn egyanom Nyankopɔn no, n’ekyir dzi no ho emmfir.
      sbs: 0.6232
      gen_sec: 5.05
      ref_sec: 9.06
    '49':
      text: Na ɔdze etsifi mbasu nye anaafo mbasu no maa no.
      sbs: 0.6931
      gen_sec: 2.24
      ref_sec: 3.6
    '50':
      text: 'Na owungyam bi nnyi hɔn wu mu: Na mbom hɔn ahoɔdzen wɔ hɔ pintsinn.'
      sbs: 0.6892
      gen_sec: 3.42
      ref_sec: 4.82
    '51':
      text: Woana na osiesie akonkoran n’edziban ma no.
      sbs: 0.6737
      gen_sec: 0.45
      ref_sec: 3.32
    '52':
      text: Ana ɔwo na eyɛ ha nya afonam ma gyataber.
      sbs: 0.6613
      gen_sec: 2.13
      ref_sec: 3.4
    '53':
      text: 'Mber no mu no, Siriahen Hazael sii mu kɔree, na ɔnye Gat kɔkoe, na ɔfae: na Hazael dze sii
        n’enyi do dɛ ɔrokɔfow akɔ Jerusalɛm.'
      sbs: 0.6295
      gen_sec: 6.49
      ref_sec: 13.56
    '54':
      text: Na ma w’ebufuhyew no a ɔwɔ hɛn do no mbɔ adze.
      sbs: 0.67
      gen_sec: 1.83
      ref_sec: 3.5
    '55':
      text: na ahendzi wɔ Damaskɔs; na Siria nkaa bɛyɛ dɛ.
      sbs: 0.6659
      gen_sec: 2.45
      ref_sec: 4.32
    '56':
      text: Na wɔbɔtotɔ mfuwa wɔ asaase yi a hom ka wɔ ho dɛ, Ɔyɛ amamfo, nyimpa anaa abowa nnyi do; wɔdze
        ahyɛ Kaldeafo nsa no mu.
      sbs: 0.6312
      gen_sec: 6.56
      ref_sec: 11.26
    '57':
      text: Iyi nye Gadmba no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee, nkurow no nye no nkurobaase.
      sbs: 0.6687
      gen_sec: 5.11
      ref_sec: 9.24
    '58':
      text: 'Ɔno na yennkefi wo nkyɛn akɔ ekyir: Ma yennya nkwa, na yɛbɔbɔ wo dzin.'
      sbs: 0.6573
      gen_sec: 3.21
      ref_sec: 5.02
    '59':
      text: Na Josua dze n’enyim butuuw famu, na ɔsɔɔr no, na ɔsee no dɛ, Na mo wura ese n’akowaa dɛn?
      sbs: 0.6872
      gen_sec: 4.87
      ref_sec: 8.24
    '60':
      text: Mbrɛ aboɔdzembo kotoku a ɔhyɛ abo ntamu tse no.
      sbs: 0.653
      gen_sec: 2.11
      ref_sec: 4.78
    '61':
      text: 'Emumuyɛfo guan wɔ aber a nyimpa biara nntaa hɔn do: Na atseneneefo dze, wɔyɛ ndam dɛ ogyata.'
      sbs: 0.6582
      gen_sec: 4.66
      ref_sec: 8.82
    '62':
      text: 'dɛ abaa a ɔhwee wo no ebu ntsi: na ɔwɔ no ndwow mu na ɔkyerben befir aba.'
      sbs: 0.6955
      gen_sec: 3.43
      ref_sec: 6.62
    '63':
      text: Mbrɛ ɔmansotwenyi sɔ aperper mu ogya ara nye no.
      sbs: 0.6803
      gen_sec: 2.34
      ref_sec: 4.5
    '64':
      text: Ana ɔwo ibotum akyekyer Aberwa na mba no n’ahoma.
      sbs: 0.6936
      gen_sec: 0.41
      ref_sec: 5.08
    '65':
      text: Na ɔatsen ne nsa, na woana na ɔbɔpon mu?
      sbs: 0.688
      gen_sec: 2.09
      ref_sec: 3.26
    '66':
      text: Na dɛtse atɔw atɔw no abɔ mu afemfam ho no?
      sbs: 0.685
      gen_sec: 2.31
      ref_sec: 3.2
    '67':
      text: 'Nna wɔdze ntampehoma no twee Jeremia baa sor, na woyii no fii mona efiadze no mu: na Jeremia
        tsenaa aweɔmfo abangua no mu.'
      sbs: 0.4729
      gen_sec: 6.84
      ref_sec: 9.2
    '68':
      text: Ma munhu w’awerdzi wɔ hɔn do; na ɔwo na maka m’asɛm akyerɛ wo.
      sbs: 0.6666
      gen_sec: 3.18
      ref_sec: 4.5
    '70':
      text: Na Safan ba Ahikam ne nsa wɔ Jeremia afa, dɛ mma wonnyi no nnhyɛ ɔman no nsa mma wonnku no.
      sbs: 0.6733
      gen_sec: 4.7
      ref_sec: 9.6
    '71':
      text: ma aabɔsom me; na sɛ iyi dza ɔsom bo fi dza ɔyɛ huhuw no mu a.
      sbs: 0.6492
      gen_sec: 2.85
      ref_sec: 4.86
    '72':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.5616
      gen_sec: 6.92
      ref_sec: 10.92
    '73':
      text: 'Dɛ mbrɛ mframa bɔ wusiw kɔ no, dɛmara so na bɔ hɔn kɔ: Dɛ mbrɛ ihua nan wɔ gya enyim no.'
      sbs: 0.6548
      gen_sec: 4.59
      ref_sec: 7.46
    '74':
      text: Anantwisaa kuw no, ɔnye aman anantwimba no enyim.
      sbs: 0.6479
      gen_sec: 2.71
      ref_sec: 3.8
    '75':
      text: Na ɔsoɛree, na ɔnye no sianee kɔr ɔhen no nkyɛn.
      sbs: 0.6952
      gen_sec: 2.5
      ref_sec: 4.08
    '76':
      text: Na ɔwo, mo wura ɔhen, na Israel nyinara enyi da wo do dɛ ebɛkyerɛ hɔn nyia ɔbɛtsena w’ahengua
        do wɔ w’ekyir.
      sbs: 0.6609
      gen_sec: 5.31
      ref_sec: 8.88
    '77':
      text: Nna Asiriahen no dze enyimguase sanee kɔr nankasa n’asaase do.
      sbs: 0.6706
      gen_sec: 2.92
      ref_sec: 6.08
    '78':
      text: Ɔtse dɛ obi a osuo bɔdɔm n’asowa mu.
      sbs: 0.6697
      gen_sec: 1.89
      ref_sec: 3.68
    '80':
      text: 'Mbrɛ EWURADZE se nye yi: Sɛ hom ayeyɛ petsepetsee, na hom dɔɔ so mpo a.'
      sbs: 0.6464
      gen_sec: 3.47
      ref_sec: 5.56
    '81':
      text: Na ɔtsenaa ahemfo ahengua no do.
      sbs: 0.6536
      gen_sec: 1.62
      ref_sec: 3.0
    '82':
      text: Galim babaa, ma wo ndze do tsea mu!
      sbs: 0.5565
      gen_sec: 2.2
      ref_sec: 3.62
    '83':
      text: Nyia medze sar pradada no ayɛ ne fi.
      sbs: 0.652
      gen_sec: 1.61
      ref_sec: 3.94
    '84':
      text: na hɔn a mehiahia hɔn ho no; na mebɛma osiifo no ayɛ nkaase.
      sbs: 0.6572
      gen_sec: 3.07
      ref_sec: 5.18
    '85':
      text: Na Joas yɛɛ dza ɔtsen wɔ EWURADZE enyiwa do, wɔ ne nda a ɔsɔfo Jehoiada kyerɛkyerɛɛ no wɔ
        mu nyinara.
      sbs: 0.7029
      gen_sec: 5.15
      ref_sec: 8.58
    '87':
      text: Na ɔronnhwɛ afɔrmbukyia, ne nsaano edwuma no, eso n’enyi ronnsɔ dza ne nsatseaba ayɛ, Aserim,
        anaadɛ ewia ehonyi no.
      sbs: 0.623
      gen_sec: 6.78
      ref_sec: 11.84
    '88':
      text: Sen nyimpa beesuon a wotum kyerɛkyerɛ asɛm ase.
      sbs: 0.6175
      gen_sec: 2.18
      ref_sec: 5.02
    '89':
      text: Elkosnyi Nahum n’enyido adzehu nwoma a ɔfa Ninive atsɛmbu ho.
      sbs: 0.6484
      gen_sec: 2.62
      ref_sec: 5.06
    '90':
      text: 'EWURADZE, ɔwo adom w’asaase: Ɔwo edze Jakob egyapadze asan aba.'
      sbs: 0.6044
      gen_sec: 4.0
      ref_sec: 5.76
    '91':
      text: 'na medwuruw w’aban dzendzen nyina: na mubotwitwa wo mbɔnsansɛm efi wo nsamu; na innkenya
        sebramufo bio: na mubotwitwa ehonyi.'
      sbs: 0.6277
      gen_sec: 6.86
      ref_sec: 12.12
    '92':
      text: 'Emi dze memmpɛɛ ntsɛm minngyaae dɛ meyɛ oguanhwɛfo dzi w’ekyir: eso memmpɛɛ mbusu da no.'
      sbs: 0.7084
      gen_sec: 4.5
      ref_sec: 7.78
    '93':
      text: 'Nna ɔhen tse awɔwber dan no mu, wɔ bosoom a otsia akron no mu: na mbukyia mu ogya a ɔredzɛw
        taa n’enyim.'
      sbs: 0.6786
      gen_sec: 4.92
      ref_sec: 7.8
    '94':
      text: Ɔwoara nko nye Ɔsorsornyi wɔ asaase nyinara do.
      sbs: 0.6487
      gen_sec: 2.95
      ref_sec: 5.58
    '96':
      text: Aso nyia ɔyɛ nyiyiano no ɔnye Otumfo no bɛham?
      sbs: 0.6838
      gen_sec: 2.07
      ref_sec: 4.1
    '97':
      text: Na Omri ne ba Ahab yɛɛ dza omuo wɔ EWURADZE enyim seen hɔn a wodzii n’enyim nyinara.
      sbs: 0.6879
      gen_sec: 4.09
      ref_sec: 6.86
    '99':
      text: Na Aser ebusuakuw mu dze, Misal, Abdon; Helkat nye Rehob nye hɔn ho mfikyisaase, nkurow anan.
      sbs: 0.6123
      gen_sec: 5.38
      ref_sec: 11.58
    '100':
      text: Mbrɛ ɔkwadwefo so da ne mpa do ara nye no.
      sbs: 0.5708
      gen_sec: 1.6
      ref_sec: 3.78
    '101':
      text: Fa hɛn san si yie, ao hɛn nkwagye Nyankopɔn.
      sbs: 0.6697
      gen_sec: 2.23
      ref_sec: 3.16
    '102':
      text: Na iyi ntsi mibehiahia David n’asefo ho, na nnyɛ daa nyina.
      sbs: 0.6695
      gen_sec: 2.52
      ref_sec: 4.88
    '103':
      text: Nna ɔhen Joas kɛfrɛɛ ɔsɔfo Jehoiada, na asɔfo nkaa no, na obisaa hɔn dɛ, Ɔyɛ dɛn ntsi na hom
        mmpempaam ofi no n’agow no yi?
      sbs: 0.6449
      gen_sec: 6.46
      ref_sec: 12.62
    '104':
      text: 'Nyia ɔkata ne mbrato do no, ɔnnkɛyɛ prɔmprɔm: Na obiara a ɔka to gua na ɔpow no, obenya ehumbɔbɔr.'
      sbs: 0.6867
      gen_sec: 5.02
      ref_sec: 8.0
    '106':
      text: Ana woeyi wu no mbobotsen no akyerɛ wo?
      sbs: 0.6773
      gen_sec: 2.04
      ref_sec: 3.66
    '107':
      text: 'Ɔhen dze atsɛmbu ma asaase gyina: Na nyia odzi mboaba no, obutuw no.'
      sbs: 0.6571
      gen_sec: 3.92
      ref_sec: 7.18
    '108':
      text: Ana akɛhɛn esukwankyɛba no korabea.
      sbs: 0.6433
      gen_sec: 1.94
      ref_sec: 3.26
    '110':
      text: 'na etsetsɛw mu enyame ananaben: mpo sɛ wo ntsɛwee da no ara mu ema ofifir.'
      sbs: 0.6773
      gen_sec: 3.97
      ref_sec: 7.28
    '112':
      text: Mbrɛ enyidzi so mmfata ɔkwasea ara nye no.
      sbs: 0.6636
      gen_sec: 2.03
      ref_sec: 3.3
    '114':
      text: Mbrɛ EWURADZE se nye yi, Wɔdze kurow yi bɛhyɛ Babilɔnhen no dɔm nsa ara ampa, na wɔagye.
      sbs: 0.675
      gen_sec: 3.85
      ref_sec: 7.48
    '115':
      text: Nokwar befi asaase mu efir; Na tsenenee efi sor ahwɛ famu.
      sbs: 0.6439
      gen_sec: 3.51
      ref_sec: 4.88
    '116':
      text: Na EWURADZE maa ɔtamfo bi soɛree tsiaa Solomon, Edomnyi Hadad a ofi ɔhen n’asefo mu wɔ Edom
        no a.
      sbs: 0.6621
      gen_sec: 5.27
      ref_sec: 9.54
    '117':
      text: Ebɛn asɛm na wɔdze bobua amanaman asomafo no?
      sbs: 0.7031
      gen_sec: 2.42
      ref_sec: 3.62
    '118':
      text: Na asafohen no bo fuuw Jeremia, na wɔhwee no, na wɔdze no kɔtoo efiadze wɔ ɔkyerɛwfo Jonatan
        fie; nna hɔ na wɔdze ayɛ efiadze.
      sbs: 0.6578
      gen_sec: 7.16
      ref_sec: 10.5
    '119':
      text: Dɛ gyama abaa bi him nyia ɔma do no do.
      sbs: 0.7051
      gen_sec: 1.89
      ref_sec: 3.2
    '120':
      text: 'dɛ gyatafɔr wɔ nguan ekuwekuw mu: ɔno a sɛ ɔhɛn mu a, otsiatsia do.'
      sbs: 0.7119
      gen_sec: 3.39
      ref_sec: 5.98
    '122':
      text: Hwɛ, aber a ɔwo nye ɔhen da ho rekasa wɔ hɔ no, mo so mibedzi w’ekyir maba, na mabɛhyɛ wo
        nsɛm no ma.
      sbs: 0.6736
      gen_sec: 4.52
      ref_sec: 9.42
    '123':
      text: Ɔbabanyin na ɔdɔba kor ma me na na m’egya no.
      sbs: 0.6583
      gen_sec: 1.91
      ref_sec: 5.46
    '124':
      text: 'Ao Nyankopɔn kyerɛ w’ahoɔdzen: Kyerɛ wo tum, Ao Nyankopɔn, dza edze agye hɛn no.'
      sbs: 0.6362
      gen_sec: 3.88
      ref_sec: 7.24
    '125':
      text: Nna wogyaa dɛ wɔnye no kasa; osiandɛ woennhu asɛm no.
      sbs: 0.6624
      gen_sec: 2.61
      ref_sec: 3.92
    '126':
      text: Afei Ahija no nkɔdaayɛ ntsi n’enyiwa ayɛ kusukusu na onnhu adze.
      sbs: 0.6654
      gen_sec: 2.98
      ref_sec: 6.98
    '127':
      text: Na Hilkia buae see ɔkyerɛwfo Safan dɛ, Mehu mbra nwoma no wɔ EWURADZE fie.
      sbs: 0.6641
      gen_sec: 3.87
      ref_sec: 8.0
    '128':
      text: Na boka afamu he nye Nkyen Po no, mekyerɛ ɔdze kodu Jordan ewiei.
      sbs: 0.6717
      gen_sec: 3.07
      ref_sec: 6.62
    '129':
      text: 'Tappua asaase no yɛ Manaasɛ dze: na Tappua a ɔwɔ Manaasɛ he do no dze ɔyɛ Efraimmba no dze.'
      sbs: 0.6798
      gen_sec: 4.76
      ref_sec: 8.34
    '130':
      text: Wotwa mu wɔ Nyinsu bɔnsa no mu a wɔdan no bea a mbasu wɔ; Nyew, adɔwnsu dze nhyira kata do.
      sbs: 0.6789
      gen_sec: 4.51
      ref_sec: 8.24
    '131':
      text: 'Na wɔnkyɛ mu kyɛpɛn esuon: Juda ntsena ne he do wɔ kwaamu afamu.'
      sbs: 0.6558
      gen_sec: 3.05
      ref_sec: 6.72
    '132':
      text: 'Naaso wo nda mu dze merennyɛ, osian w’egya David ntsi: na mbom mebɛtsew efi wo ba nsamu.'
      sbs: 0.6495
      gen_sec: 4.84
      ref_sec: 6.76
    '133':
      text: 'Nyia ɔtwer nankasa n’akoma no, ɔkwasea a: Na obiara a ɔnantsew nyansa mu no dze, wɔbɛgye
        no nkwa.'
      sbs: 0.6542
      gen_sec: 4.86
      ref_sec: 8.76
    '134':
      text: Nyia ɔsoɛr anapahema dze ndze kɛse hyira ne nyɛnko no.
      sbs: 0.6304
      gen_sec: 2.64
      ref_sec: 4.7
    '135':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6857
      gen_sec: 2.28
      ref_sec: 3.18
    '136':
      text: Na ofi hɔ fowee kɔr Debir a nkan no na ne dzin nye Kiriat-Sefer no do.
      sbs: 0.6521
      gen_sec: 3.44
      ref_sec: 9.1
    '138':
      text: Nna Jeremia see Zedekia dɛ, Aso mepaa mu ka kyerɛ wo a, ana nnyɛ oku ara na woboku me bi?
      sbs: 0.6785
      gen_sec: 4.87
      ref_sec: 7.18
    '139':
      text: Dɛm ntsi afei hom nyiyi Israel ebusuakuw ebusuakuw mu mbanyin duebien, ebusuakuw biara mu
        nyimpa baako.
      sbs: 0.6827
      gen_sec: 5.09
      ref_sec: 9.46
    '140':
      text: Afei, me Nyankopɔn, meserɛ wo, bue w’enyiwa, na kyɛn w’aso wɔ mpaabɔ a wɔbɔ wɔ ha yi do.
      sbs: 0.6758
      gen_sec: 4.14
      ref_sec: 8.14
    '141':
      text: Otwitwa nankasa ne nan, na ɔnom mbusu.
      sbs: 0.6836
      gen_sec: 1.9
      ref_sec: 3.48
    '142':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.656
      gen_sec: 1.95
      ref_sec: 4.2
    '143':
      text: 'Na Solomon kɔr ne nsamankyir, na wosiee no wɔ n’egya David kurow mu: na ne ba Rehoboam dzii
        hen wɔ n’ananmu.'
      sbs: 0.6854
      gen_sec: 5.24
      ref_sec: 11.3
    '145':
      text: Dadze sew dadze ano; Dɛmara so na nyimpa sew ne nyɛnko enyim.
      sbs: 0.6685
      gen_sec: 2.96
      ref_sec: 4.94
    '147':
      text: Afei Zimri no ho nsɛm nkaa no na no nkontompɔ a otwae no, ana wɔnnkyerɛɛw no wɔ Israel ahemfo
        hɔn Mbermunsɛm nwoma no mu?
      sbs: 0.6914
      gen_sec: 5.66
      ref_sec: 11.44
    '148':
      text: Na ɔhwɛɛ ahemfo no nyinara do dze fi Esutsen no ho araa dze kodur Filistiafo asaase do, na
        Egypt ahe do.
      sbs: 0.6327
      gen_sec: 6.22
      ref_sec: 10.56
    '149':
      text: EWURADZE tse ase yi; nna amanaman bɛyɛ esiarfo wɔ no mu.
      sbs: 0.6833
      gen_sec: 2.73
      ref_sec: 3.4
    '150':
      text: 'Dɔm ahemfo guanguan, woguanguan: Na nyia ɔtse fie na ɔkyɛ asadze mu.'
      sbs: 0.6837
      gen_sec: 3.6
      ref_sec: 5.42
    '151':
      text: Ama wo mbɔdɔm tɛkyerɛma eenya ne kyɛpɛn wɔ w’atamfo ho.
      sbs: 0.6801
      gen_sec: 2.63
      ref_sec: 3.56
    '152':
      text: Ntsi migyaa hɔn ma wodzii hɔn akomadzen ekyir.
      sbs: 0.6688
      gen_sec: 2.45
      ref_sec: 3.26
    '153':
      text: 'Na ɔsee dɛ, Bue boka afamu tokura no: na obuei.'
      sbs: 0.5645
      gen_sec: 2.88
      ref_sec: 4.9
    '154':
      text: Na sɛ hom ayɛ dɛ nsoɛ kantankantan, na hom afɔw takaa wɔ hom nsanom mu mpo a.
      sbs: 0.6694
      gen_sec: 2.79
      ref_sec: 6.02
    '155':
      text: Aber a obui faa do, dɛ gyama ofi yafun mu rupue no; Aber a medze mununkum yɛɛ n’akataho.
      sbs: 0.6539
      gen_sec: 4.69
      ref_sec: 7.58
    '156':
      text: Aso emumuyɛ akoradze wɔ emumuyɛ fi no mu.
      sbs: 0.669
      gen_sec: 2.03
      ref_sec: 3.2
    '157':
      text: Na Reubenmba no hɔn he nye Jordan, nye ne he.
      sbs: 0.7096
      gen_sec: 2.27
      ref_sec: 3.22
    '158':
      text: Na, hwɛ, mber a ɔda ho nye ɔhen no rekasa no, nkɔnhyɛnyi Natan bae.
      sbs: 0.6421
      gen_sec: 0.56
      ref_sec: 5.62
    '159':
      text: Afei hwɛ esuson a meyɛɛ no kaa wo ho no; Odzi efuw dɛ nantwi.
      sbs: 0.646
      gen_sec: 1.84
      ref_sec: 4.92
    '160':
      text: Israelhen Joahaz ne ba Jehoas n’afe a otsia ebien no mu nna Amazia, Judahen Joas ne ba no,
        hyɛɛ ase dzii hen.
      sbs: 0.6452
      gen_sec: 5.95
      ref_sec: 11.84
    '162':
      text: Dɛm ntsi afei mma hom nngyegye sika wɔ hom amanyimfo hɔ bio, na hom nyi mma ma wɔmfa mpempam
        ofi no n’agow no.
      sbs: 0.6671
      gen_sec: 6.09
      ref_sec: 11.32
    '163':
      text: 'Hom mper ngye abɔbɔfo na ehiafo: Hom nhwim hɔn mfi nyimpa bɔn no nsamu.'
      sbs: 0.681
      gen_sec: 3.69
      ref_sec: 5.7
    '164':
      text: Dɛmara so na abɔbɔfo do ɔhen tsirmɔdzennyi tse.
      sbs: 0.6711
      gen_sec: 2.63
      ref_sec: 3.38
    '165':
      text: Na ɔyɛɛ dza ɔtsen wɔ EWURADZE n’enyiwa do, na ɔnantseew n’egya David n’akwan do, na ɔanndan
        ammfa nkyɛn annkɔ enyimfa anaa abankum.
      sbs: 0.6598
      gen_sec: 7.39
      ref_sec: 11.16
    '166':
      text: Mbrɛ Jeremia tsenaa aweɔmfo abangua no mu nye no.
      sbs: 0.6836
      gen_sec: 2.47
      ref_sec: 5.58
    '167':
      text: na ɔdze n’abasa bubu mbɛtsem no; ɔbɛyɛ dɛ aber a obi ridzi mbɛtsem mpɛpɛw.
      sbs: 0.7079
      gen_sec: 3.21
      ref_sec: 6.22
    '168':
      text: Ana ofitsi dɛ wo nda hyɛɛ ase yi ahyɛ anapa do pɛn.
      sbs: 0.6585
      gen_sec: 2.52
      ref_sec: 4.84
    '169':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.6494
      gen_sec: 5.76
      ref_sec: 10.92
    '170':
      text: Ngyanka hɔn egya, na ekunafo hɔn sɛndzifo.
      sbs: 0.6818
      gen_sec: 2.25
      ref_sec: 3.42
    '171':
      text: Asɔfo No Hyɛ Hɔn Dwumadzi Ase.
      sbs: 0.6309
      gen_sec: 1.77
      ref_sec: 3.66
    '172':
      text: na Memfis banodzifo adwen efura mu; na hɔn a wɔyɛ no mbusuakuw kutuwdo bo no.
      sbs: 0.6632
      gen_sec: 3.85
      ref_sec: 7.5
    '173':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.6621
      gen_sec: 3.76
      ref_sec: 9.28
    '174':
      text: 'Obu mpɔtsibaa dɛ mburonan: Ɔserew nkambaa no huuyɛ.'
      sbs: 0.7571
      gen_sec: 1.6
      ref_sec: 5.28
    '175':
      text: Nyew, dɛ mbrɛ gyata no pɔw, na gyata bɔyafo ne ndze.
      sbs: 0.6571
      gen_sec: 2.81
      ref_sec: 5.48
    '176':
      text: Afei nna ɔhen David ayɛ akɔdaa a oedzi mfe pii; ɔwɔ mu dɛ wɔdze atam kataa no do, naaso no
        ho annyɛ no hyew.
      sbs: 0.6589
      gen_sec: 5.35
      ref_sec: 9.2
    '177':
      text: 'Enyena sa a, ogya dum: Na bɔtomkɛka nnyi hɔ a, mansotwe gyaa.'
      sbs: 0.6484
      gen_sec: 3.02
      ref_sec: 6.04
    '178':
      text: Na Ahija tae suoo atar fofor a ɔhyɛ no no mu, na ɔtsetseew mu esinesin duebien.
      sbs: 0.6691
      gen_sec: 3.89
      ref_sec: 7.34
    '180':
      text: Me bepɔw a ewɔ wiramu, medze w’ahodze na w’akoradze nyina bɛma ma wɔaafom afa, na wo nsorɔnsorɔmbea
        no, wɔ bɔn ntsi, wɔ w’ahe nyinara do.
      sbs: 0.6607
      gen_sec: 6.39
      ref_sec: 11.4
    '181':
      text: Kaansa enyitan dze ndaadaa kata noho mpo a.
      sbs: 0.4663
      gen_sec: 2.8
      ref_sec: 3.78
    '182':
      text: 'Ɔtwerɛw bɔnsa mu, na odzi ehurusi wɔ n’ahoɔdzen mu: Opue kehyia akofo a woemia.'
      sbs: 0.6644
      gen_sec: 3.79
      ref_sec: 6.46
    '183':
      text: EWURADZE na ɔse; hom a hom ka dɛ, Woana botum esian aba hɛn do?
      sbs: 0.6428
      gen_sec: 3.16
      ref_sec: 4.62
    '184':
      text: Anaadɛ nyia ɔda hɛn mu frankadua etsifi.
      sbs: 0.6512
      gen_sec: 2.07
      ref_sec: 3.92
    '185':
      text: dɛ mbrɛ ɔsabokwafo tɔ ntentan wɔ ne fe mu.
      sbs: 0.6573
      gen_sec: 2.14
      ref_sec: 3.76
    '186':
      text: 'Na ɔsee Israelhen no dɛ, Fa wo nsa to egyen no do: na ɔdze ne nsa too do.'
      sbs: 0.6611
      gen_sec: 3.72
      ref_sec: 7.32
    '187':
      text: Na ɔbaa dɛ, aber a wowiee ɔman no nyinara twatsia twitwa no, wɔtsenatsenaa hɔn ananmu wɔ nseraban
        no mu ma wɔtsee apɔw ana.
      sbs: 0.6219
      gen_sec: 6.12
      ref_sec: 12.36
    '188':
      text: Makasa prɛko, na murummbua; Nyew, mprɛnu, na moronnkɔ kan bio.
      sbs: 0.6508
      gen_sec: 3.27
      ref_sec: 5.84
    '189':
      text: 'Wo mboanofo tsenaa mu: Ɔwo, Nyankopɔn, na isiesiee abɔbɔfo wɔ w’ayamuyie mu.'
      sbs: 0.6714
      gen_sec: 4.04
      ref_sec: 6.3
    '190':
      text: Na Juda mbapɔmba tsee ndzɛmba yinom no, wofii ahemfie fowee baa EWURADZE fie ɔponkɛse fofor
        no ano.
      sbs: 0.6498
      gen_sec: 6.24
      ref_sec: 7.82
    '192':
      text: Nna Farao see no dɛ, Na ebɛnadze na ehia no wɔ me nkyɛn, ma erohwehwɛ dɛ ekɔ wankasa wo man
        mu yi?
      sbs: 0.6116
      gen_sec: 5.58
      ref_sec: 7.9
    '193':
      text: 'Nna wɔfaa Jeremia, na wɔkotoow no kyeen ɔhenba Malkia mona efiadze a ɔwɔ aweɔmfo abanguado
        no mu: na wɔdze ntampehoma gyaagyaa Jeremia siaan mu.'
      sbs: 0.7176
      gen_sec: 9.0
      ref_sec: 12.34
    '194':
      text: Wɔse dɛ, Hom mbra ma yenkruw hɔn ase ma wongyaa dɛ wɔbɛyɛ ɔman; Ama wɔnnkɛkaa Israel dzin
        bio.
      sbs: 0.6228
      gen_sec: 5.05
      ref_sec: 8.02
    '195':
      text: 'Na ɔfowee kɔr ne nkyɛn: na, hwɛ, ɔtse koko no n’etsifi.'
      sbs: 0.6928
      gen_sec: 2.77
      ref_sec: 4.84
    '196':
      text: 'Na wobuaa dɛ, Ahazia no nuanom nye hɛn: na yerisian akɔ ekekyiakyia ɔhen ne mba, na ɔhembaa
        ne mba no.'
      sbs: 0.6697
      gen_sec: 4.97
      ref_sec: 10.94
    '198':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6568
      gen_sec: 4.01
      ref_sec: 5.64
    '199':
      text: Na Sallum, a ofi Kore, Ebiasaf, na Kora asefo no mu, na no nuanom a wofi n’egya fie.
      sbs: 0.6454
      gen_sec: 4.72
      ref_sec: 8.82
    '200':
      text: bɛba dɔm EWURADZE ne dzin tsenabea, bepɔw Zion no do.
      sbs: 0.549
      gen_sec: 3.36
      ref_sec: 6.32
    '201':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.7563
      gen_sec: 1.09
      ref_sec: 4.2
    '202':
      text: Hɔn a wɔdan wo gya nyina enyi bɔto; hɔn a wofi wo nkyɛn kɔ no, wɔbɛkyerɛw hɔn edzin aka asaase
        ase mba ho.
      sbs: 0.6282
      gen_sec: 5.46
      ref_sec: 8.28
    '203':
      text: Na Adonija n’aponto asefo no nyinara suroi, na wɔsoɛrsoɛree na nyimpa biara faa no kwan kɔree.
      sbs: 0.6643
      gen_sec: 4.58
      ref_sec: 8.48
    '204':
      text: Hom nka nkyerɛ amanaman dɛ wɔreba; hom mma wɔntse no Jerusalɛm.
      sbs: 0.6593
      gen_sec: 3.17
      ref_sec: 4.18
    '205':
      text: sɛ wosi frankaa wɔ mbepɔw do a, hom nhwɛ; na sɛ wɔbɔ akasamu mu a, hom ntsie.
      sbs: 0.6473
      gen_sec: 3.52
      ref_sec: 5.46
    '207':
      text: Na Kohatmba nkaa no nam tontotwe do nyae fii Efraim, Dan, nye Manaasɛ ebusuakuw fa no mu nkurow
        du.
      sbs: 0.677
      gen_sec: 5.07
      ref_sec: 10.62
    '208':
      text: Iyi nye Benjaminmba no egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6798
      gen_sec: 3.59
      ref_sec: 7.22
    '209':
      text: Na ɔkaa Israelmba mu ebusuakuw esuon a wonnyae nnkyɛɛ hɔn egyapadze.
      sbs: 0.6643
      gen_sec: 3.35
      ref_sec: 5.76
    '210':
      text: Afei Solomon n’edwuma nyinara wosiesiei maa da a wɔtoow EWURADZE ne dan no ne fapem, na okodur
        dɛ wowiei.
      sbs: 0.7389
      gen_sec: 6.48
      ref_sec: 9.0
    '211':
      text: dɛmara so na wobotwitwa hom egu, na hom etwa mu akɔ.
      sbs: 0.6516
      gen_sec: 2.6
      ref_sec: 3.46
    '213':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.6992
      gen_sec: 4.28
      ref_sec: 7.62
    '214':
      text: na ɔmaa ahendzi hihimii no nye yi; nyia ɔmaa wiadze yi yɛɛ dɛ sar.
      sbs: 0.6985
      gen_sec: 3.16
      ref_sec: 5.48
    '215':
      text: nye w’ayeforber mu dɔ no ma wo; mbrɛ idzii m’ekyir wɔ sar no do.
      sbs: 0.6531
      gen_sec: 3.45
      ref_sec: 4.9
    '216':
      text: 'Wɔdze ogya ahyew no, woetwa ato famu: W’enyim nkaenyim ntsi wɔasɛɛ.'
      sbs: 0.6461
      gen_sec: 3.67
      ref_sec: 4.74
    '217':
      text: Na aber a Seba ɔhembaa no tsee Solomon ne nka wɔ EWURADZE ne dzin ho no, ɔbaa dɛ ɔdze nsɛmbisa
        dzendzen robɔsɔ no ahwɛ.
      sbs: 0.6965
      gen_sec: 6.36
      ref_sec: 7.86
    '218':
      text: Na wɔdze afona anomu kunkum hɔn; na brampafo na asafohemfo no totoow hɔn gui, na wosii mu
        kɔr Baal fie kurow no mu.
      sbs: 0.576
      gen_sec: 7.0
      ref_sec: 10.54
    '219':
      text: Naaso ɔpoow nkɔdaa no hɔn afotu a wɔdze maa no no, na ɔnye mberantsɛ a wɔnye no nyinii a afei
        wɔabɛyɛ n’apamfo no no dwenee.
      sbs: 0.6949
      gen_sec: 5.98
      ref_sec: 11.92
    '220':
      text: 'Ɔwo edze hɛn yɛ aperdzi ma hɛn asɔnmufo: Na hɛn atamfo sereserew wɔ hɔnara hɔn mu.'
      sbs: 0.6848
      gen_sec: 3.72
      ref_sec: 7.6
    '221':
      text: anaadɛ poma bɛma nyia ɔnnyɛ dua no no do.
      sbs: 0.6773
      gen_sec: 2.17
      ref_sec: 3.34
    '222':
      text: 'Na asɛm yi maa wɔyɛɛ bɔn: osiandɛ ɔman no kɔree kɔsoom hɔn wɔ Bɛtɛl araa dze kɔr Dan.'
      sbs: 0.6754
      gen_sec: 4.19
      ref_sec: 7.32
    '223':
      text: Obeyi wo wɔ ahohia esia mu; Nyew, dza otsia esuon no mu mpo mbusu bi rennka wo.
      sbs: 0.6666
      gen_sec: 3.71
      ref_sec: 7.56
    '225':
      text: Nna Atalia tsetseew ne ntar mu, na ɔkekaa mu dɛ, Etuatsew o, iyi yɛ etuatsew.
      sbs: 0.6756
      gen_sec: 3.86
      ref_sec: 6.74
    '226':
      text: Woana na ɔwɔ enyiwa a ayɛ kɔɔ?
      sbs: 0.6805
      gen_sec: 1.49
      ref_sec: 3.68
  score: 0.6622
  partial: true
- model: k2-fsa/OmniVoice-noref
  sbs: 0.6614
  num_scored: 197
  uses_reference: false
  entries:
    '0':
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.6646
      gen_sec: 5.06
      ref_sec: 9.1
    '1':
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.6515
      gen_sec: 2.08
      ref_sec: 3.66
    '3':
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.6949
      gen_sec: 3.62
      ref_sec: 6.36
    '5':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.7568
      gen_sec: 1.37
      ref_sec: 3.18
    '6':
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.6742
      gen_sec: 5.17
      ref_sec: 9.12
    '7':
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.6557
      gen_sec: 5.34
      ref_sec: 7.44
    '8':
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.6992
      gen_sec: 2.69
      ref_sec: 4.88
    '9':
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.665
      gen_sec: 4.05
      ref_sec: 6.16
    '10':
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.6524
      gen_sec: 5.82
      ref_sec: 8.48
    '11':
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.702
      gen_sec: 3.9
      ref_sec: 6.68
    '12':
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.6682
      gen_sec: 6.22
      ref_sec: 10.5
    '13':
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.6816
      gen_sec: 3.58
      ref_sec: 6.38
    '14':
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.6335
      gen_sec: 2.28
      ref_sec: 4.1
    '15':
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6762
      gen_sec: 3.66
      ref_sec: 6.76
    '16':
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.6939
      gen_sec: 5.14
      ref_sec: 8.48
    '20':
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.6934
      gen_sec: 2.98
      ref_sec: 4.36
    '22':
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.6502
      gen_sec: 2.31
      ref_sec: 3.74
    '23':
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.6765
      gen_sec: 6.16
      ref_sec: 10.44
    '24':
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.6957
      gen_sec: 4.85
      ref_sec: 8.26
    '27':
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6618
      gen_sec: 3.84
      ref_sec: 7.04
    '28':
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.6535
      gen_sec: 4.97
      ref_sec: 9.74
    '29':
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.6666
      gen_sec: 2.72
      ref_sec: 4.34
    '30':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6682
      gen_sec: 4.2
      ref_sec: 5.64
    '32':
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.6485
      gen_sec: 2.33
      ref_sec: 3.54
    '33':
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.6461
      gen_sec: 5.86
      ref_sec: 11.1
    '35':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.7041
      gen_sec: 4.37
      ref_sec: 7.62
    '36':
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.6455
      gen_sec: 2.76
      ref_sec: 3.74
    '37':
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.6974
      gen_sec: 2.46
      ref_sec: 3.94
    '38':
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6719
      gen_sec: 3.87
      ref_sec: 7.02
    '39':
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.64
      gen_sec: 2.04
      ref_sec: 3.74
    '40':
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.7034
      gen_sec: 4.29
      ref_sec: 5.94
    '41':
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.6774
      gen_sec: 2.16
      ref_sec: 3.26
    '42':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.7052
      gen_sec: 3.72
      ref_sec: 9.28
    '43':
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
        dɛ, Hom mma yɛmfa.'
      sbs: 0.4846
      gen_sec: 6.68
      ref_sec: 11.2
    '44':
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.6935
      gen_sec: 2.59
      ref_sec: 4.1
    '46':
      text: 'Na ɔsee dɛ, Tase egyen menaba no: na ɔtasee.'
      sbs: 0.7063
      gen_sec: 2.4
      ref_sec: 4.26
    '47':
      text: Ɔwo, Nyankopɔn, maa nyankom tɔɔ berdzedzeedze.
      sbs: 0.6553
      gen_sec: 2.22
      ref_sec: 3.42
    '48':
      text: Ne nda nyinara mu no woemmfi EWURADZE, hɔn egyanom Nyankopɔn no, n’ekyir dzi no ho emmfir.
      sbs: 0.6746
      gen_sec: 5.51
      ref_sec: 9.06
    '49':
      text: Na ɔdze etsifi mbasu nye anaafo mbasu no maa no.
      sbs: 0.7012
      gen_sec: 2.31
      ref_sec: 3.6
    '50':
      text: 'Na owungyam bi nnyi hɔn wu mu: Na mbom hɔn ahoɔdzen wɔ hɔ pintsinn.'
      sbs: 0.6818
      gen_sec: 3.65
      ref_sec: 4.82
    '51':
      text: Woana na osiesie akonkoran n’edziban ma no.
      sbs: 0.6792
      gen_sec: 2.64
      ref_sec: 3.32
    '52':
      text: Ana ɔwo na eyɛ ha nya afonam ma gyataber.
      sbs: 0.5191
      gen_sec: 2.6
      ref_sec: 3.4
    '53':
      text: 'Mber no mu no, Siriahen Hazael sii mu kɔree, na ɔnye Gat kɔkoe, na ɔfae: na Hazael dze sii
        n’enyi do dɛ ɔrokɔfow akɔ Jerusalɛm.'
      sbs: 0.573
      gen_sec: 7.6
      ref_sec: 13.56
    '54':
      text: Na ma w’ebufuhyew no a ɔwɔ hɛn do no mbɔ adze.
      sbs: 0.7062
      gen_sec: 2.18
      ref_sec: 3.5
    '55':
      text: na ahendzi wɔ Damaskɔs; na Siria nkaa bɛyɛ dɛ.
      sbs: 0.6961
      gen_sec: 2.44
      ref_sec: 4.32
    '56':
      text: Na wɔbɔtotɔ mfuwa wɔ asaase yi a hom ka wɔ ho dɛ, Ɔyɛ amamfo, nyimpa anaa abowa nnyi do; wɔdze
        ahyɛ Kaldeafo nsa no mu.
      sbs: 0.6325
      gen_sec: 6.69
      ref_sec: 11.26
    '57':
      text: Iyi nye Gadmba no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee, nkurow no nye no nkurobaase.
      sbs: 0.6598
      gen_sec: 4.68
      ref_sec: 9.24
    '58':
      text: 'Ɔno na yennkefi wo nkyɛn akɔ ekyir: Ma yennya nkwa, na yɛbɔbɔ wo dzin.'
      sbs: 0.695
      gen_sec: 3.79
      ref_sec: 5.02
    '59':
      text: Na Josua dze n’enyim butuuw famu, na ɔsɔɔr no, na ɔsee no dɛ, Na mo wura ese n’akowaa dɛn?
      sbs: 0.6604
      gen_sec: 4.4
      ref_sec: 8.24
    '60':
      text: Mbrɛ aboɔdzembo kotoku a ɔhyɛ abo ntamu tse no.
      sbs: 0.6806
      gen_sec: 2.37
      ref_sec: 4.78
    '61':
      text: 'Emumuyɛfo guan wɔ aber a nyimpa biara nntaa hɔn do: Na atseneneefo dze, wɔyɛ ndam dɛ ogyata.'
      sbs: 0.6583
      gen_sec: 4.73
      ref_sec: 8.82
    '62':
      text: 'dɛ abaa a ɔhwee wo no ebu ntsi: na ɔwɔ no ndwow mu na ɔkyerben befir aba.'
      sbs: 0.6716
      gen_sec: 3.72
      ref_sec: 6.62
    '63':
      text: Mbrɛ ɔmansotwenyi sɔ aperper mu ogya ara nye no.
      sbs: 0.6873
      gen_sec: 2.32
      ref_sec: 4.5
    '64':
      text: Ana ɔwo ibotum akyekyer Aberwa na mba no n’ahoma.
      sbs: 0.6478
      gen_sec: 2.13
      ref_sec: 5.08
    '65':
      text: Na ɔatsen ne nsa, na woana na ɔbɔpon mu?
      sbs: 0.6781
      gen_sec: 0.34
      ref_sec: 3.26
    '66':
      text: Na dɛtse atɔw atɔw no abɔ mu afemfam ho no?
      sbs: 0.6747
      gen_sec: 2.07
      ref_sec: 3.2
    '67':
      text: 'Nna wɔdze ntampehoma no twee Jeremia baa sor, na woyii no fii mona efiadze no mu: na Jeremia
        tsenaa aweɔmfo abangua no mu.'
      sbs: 0.6305
      gen_sec: 6.9
      ref_sec: 9.2
    '68':
      text: Ma munhu w’awerdzi wɔ hɔn do; na ɔwo na maka m’asɛm akyerɛ wo.
      sbs: 0.6764
      gen_sec: 2.71
      ref_sec: 4.5
    '70':
      text: Na Safan ba Ahikam ne nsa wɔ Jeremia afa, dɛ mma wonnyi no nnhyɛ ɔman no nsa mma wonnku no.
      sbs: 0.6579
      gen_sec: 3.98
      ref_sec: 9.6
    '71':
      text: ma aabɔsom me; na sɛ iyi dza ɔsom bo fi dza ɔyɛ huhuw no mu a.
      sbs: 0.6575
      gen_sec: 2.81
      ref_sec: 4.86
    '72':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.6515
      gen_sec: 6.34
      ref_sec: 10.92
    '73':
      text: 'Dɛ mbrɛ mframa bɔ wusiw kɔ no, dɛmara so na bɔ hɔn kɔ: Dɛ mbrɛ ihua nan wɔ gya enyim no.'
      sbs: 0.6423
      gen_sec: 3.93
      ref_sec: 7.46
    '74':
      text: Anantwisaa kuw no, ɔnye aman anantwimba no enyim.
      sbs: 0.6846
      gen_sec: 2.59
      ref_sec: 3.8
    '75':
      text: Na ɔsoɛree, na ɔnye no sianee kɔr ɔhen no nkyɛn.
      sbs: 0.6808
      gen_sec: 2.28
      ref_sec: 4.08
    '76':
      text: Na ɔwo, mo wura ɔhen, na Israel nyinara enyi da wo do dɛ ebɛkyerɛ hɔn nyia ɔbɛtsena w’ahengua
        do wɔ w’ekyir.
      sbs: 0.7041
      gen_sec: 5.66
      ref_sec: 8.88
    '77':
      text: Nna Asiriahen no dze enyimguase sanee kɔr nankasa n’asaase do.
      sbs: 0.669
      gen_sec: 3.19
      ref_sec: 6.08
    '78':
      text: Ɔtse dɛ obi a osuo bɔdɔm n’asowa mu.
      sbs: 0.741
      gen_sec: 1.35
      ref_sec: 3.68
    '80':
      text: 'Mbrɛ EWURADZE se nye yi: Sɛ hom ayeyɛ petsepetsee, na hom dɔɔ so mpo a.'
      sbs: 0.6422
      gen_sec: 3.65
      ref_sec: 5.56
    '81':
      text: Na ɔtsenaa ahemfo ahengua no do.
      sbs: 0.5562
      gen_sec: 2.16
      ref_sec: 3.0
    '82':
      text: Galim babaa, ma wo ndze do tsea mu!
      sbs: 0.5519
      gen_sec: 2.2
      ref_sec: 3.62
    '83':
      text: Nyia medze sar pradada no ayɛ ne fi.
      sbs: 0.6308
      gen_sec: 1.63
      ref_sec: 3.94
    '84':
      text: na hɔn a mehiahia hɔn ho no; na mebɛma osiifo no ayɛ nkaase.
      sbs: 0.6603
      gen_sec: 2.96
      ref_sec: 5.18
    '85':
      text: Na Joas yɛɛ dza ɔtsen wɔ EWURADZE enyiwa do, wɔ ne nda a ɔsɔfo Jehoiada kyerɛkyerɛɛ no wɔ
        mu nyinara.
      sbs: 0.6562
      gen_sec: 5.26
      ref_sec: 8.58
    '87':
      text: Na ɔronnhwɛ afɔrmbukyia, ne nsaano edwuma no, eso n’enyi ronnsɔ dza ne nsatseaba ayɛ, Aserim,
        anaadɛ ewia ehonyi no.
      sbs: 0.636
      gen_sec: 6.09
      ref_sec: 11.84
    '88':
      text: Sen nyimpa beesuon a wotum kyerɛkyerɛ asɛm ase.
      sbs: 0.677
      gen_sec: 0.76
      ref_sec: 5.02
    '89':
      text: Elkosnyi Nahum n’enyido adzehu nwoma a ɔfa Ninive atsɛmbu ho.
      sbs: 0.6416
      gen_sec: 2.91
      ref_sec: 5.06
    '90':
      text: 'EWURADZE, ɔwo adom w’asaase: Ɔwo edze Jakob egyapadze asan aba.'
      sbs: 0.5979
      gen_sec: 4.0
      ref_sec: 5.76
    '91':
      text: 'na medwuruw w’aban dzendzen nyina: na mubotwitwa wo mbɔnsansɛm efi wo nsamu; na innkenya
        sebramufo bio: na mubotwitwa ehonyi.'
      sbs: 0.6405
      gen_sec: 7.26
      ref_sec: 12.12
    '92':
      text: 'Emi dze memmpɛɛ ntsɛm minngyaae dɛ meyɛ oguanhwɛfo dzi w’ekyir: eso memmpɛɛ mbusu da no.'
      sbs: 0.6707
      gen_sec: 4.27
      ref_sec: 7.78
    '93':
      text: 'Nna ɔhen tse awɔwber dan no mu, wɔ bosoom a otsia akron no mu: na mbukyia mu ogya a ɔredzɛw
        taa n’enyim.'
      sbs: 0.6574
      gen_sec: 4.58
      ref_sec: 7.8
    '94':
      text: Ɔwoara nko nye Ɔsorsornyi wɔ asaase nyinara do.
      sbs: 0.6433
      gen_sec: 3.08
      ref_sec: 5.58
    '96':
      text: Aso nyia ɔyɛ nyiyiano no ɔnye Otumfo no bɛham?
      sbs: 0.6647
      gen_sec: 2.25
      ref_sec: 4.1
    '97':
      text: Na Omri ne ba Ahab yɛɛ dza omuo wɔ EWURADZE enyim seen hɔn a wodzii n’enyim nyinara.
      sbs: 0.6822
      gen_sec: 3.66
      ref_sec: 6.86
    '99':
      text: Na Aser ebusuakuw mu dze, Misal, Abdon; Helkat nye Rehob nye hɔn ho mfikyisaase, nkurow anan.
      sbs: 0.6737
      gen_sec: 4.87
      ref_sec: 11.58
    '100':
      text: Mbrɛ ɔkwadwefo so da ne mpa do ara nye no.
      sbs: 0.6805
      gen_sec: 1.78
      ref_sec: 3.78
    '101':
      text: Fa hɛn san si yie, ao hɛn nkwagye Nyankopɔn.
      sbs: 0.6691
      gen_sec: 2.14
      ref_sec: 3.16
    '102':
      text: Na iyi ntsi mibehiahia David n’asefo ho, na nnyɛ daa nyina.
      sbs: 0.6688
      gen_sec: 2.82
      ref_sec: 4.88
    '103':
      text: Nna ɔhen Joas kɛfrɛɛ ɔsɔfo Jehoiada, na asɔfo nkaa no, na obisaa hɔn dɛ, Ɔyɛ dɛn ntsi na hom
        mmpempaam ofi no n’agow no yi?
      sbs: 0.5917
      gen_sec: 6.33
      ref_sec: 12.62
    '104':
      text: 'Nyia ɔkata ne mbrato do no, ɔnnkɛyɛ prɔmprɔm: Na obiara a ɔka to gua na ɔpow no, obenya ehumbɔbɔr.'
      sbs: 0.7479
      gen_sec: 1.34
      ref_sec: 8.0
    '106':
      text: Ana woeyi wu no mbobotsen no akyerɛ wo?
      sbs: 0.6751
      gen_sec: 0.48
      ref_sec: 3.66
    '107':
      text: 'Ɔhen dze atsɛmbu ma asaase gyina: Na nyia odzi mboaba no, obutuw no.'
      sbs: 0.6656
      gen_sec: 3.33
      ref_sec: 7.18
    '108':
      text: Ana akɛhɛn esukwankyɛba no korabea.
      sbs: 0.6486
      gen_sec: 1.83
      ref_sec: 3.26
    '109':
      text: Na wɔbɛkaa asɛm yi kyerɛɛ ɔhen no.
      sbs: 0.7074
      gen_sec: 1.83
      ref_sec: 3.68
    '110':
      text: 'na etsetsɛw mu enyame ananaben: mpo sɛ wo ntsɛwee da no ara mu ema ofifir.'
      sbs: 0.6382
      gen_sec: 3.73
      ref_sec: 7.28
    '112':
      text: Mbrɛ enyidzi so mmfata ɔkwasea ara nye no.
      sbs: 0.6753
      gen_sec: 2.22
      ref_sec: 3.3
    '114':
      text: Mbrɛ EWURADZE se nye yi, Wɔdze kurow yi bɛhyɛ Babilɔnhen no dɔm nsa ara ampa, na wɔagye.
      sbs: 0.6579
      gen_sec: 4.59
      ref_sec: 7.48
    '115':
      text: Nokwar befi asaase mu efir; Na tsenenee efi sor ahwɛ famu.
      sbs: 0.6457
      gen_sec: 2.8
      ref_sec: 4.88
    '116':
      text: Na EWURADZE maa ɔtamfo bi soɛree tsiaa Solomon, Edomnyi Hadad a ofi ɔhen n’asefo mu wɔ Edom
        no a.
      sbs: 0.6427
      gen_sec: 5.22
      ref_sec: 9.54
    '117':
      text: Ebɛn asɛm na wɔdze bobua amanaman asomafo no?
      sbs: 0.7283
      gen_sec: 2.66
      ref_sec: 3.62
    '118':
      text: Na asafohen no bo fuuw Jeremia, na wɔhwee no, na wɔdze no kɔtoo efiadze wɔ ɔkyerɛwfo Jonatan
        fie; nna hɔ na wɔdze ayɛ efiadze.
      sbs: 0.6545
      gen_sec: 7.15
      ref_sec: 10.5
    '119':
      text: Dɛ gyama abaa bi him nyia ɔma do no do.
      sbs: 0.7104
      gen_sec: 1.71
      ref_sec: 3.2
    '120':
      text: 'dɛ gyatafɔr wɔ nguan ekuwekuw mu: ɔno a sɛ ɔhɛn mu a, otsiatsia do.'
      sbs: 0.6828
      gen_sec: 3.46
      ref_sec: 5.98
    '122':
      text: Hwɛ, aber a ɔwo nye ɔhen da ho rekasa wɔ hɔ no, mo so mibedzi w’ekyir maba, na mabɛhyɛ wo
        nsɛm no ma.
      sbs: 0.6862
      gen_sec: 4.69
      ref_sec: 9.42
    '123':
      text: Ɔbabanyin na ɔdɔba kor ma me na na m’egya no.
      sbs: 0.6713
      gen_sec: 2.16
      ref_sec: 5.46
    '124':
      text: 'Ao Nyankopɔn kyerɛ w’ahoɔdzen: Kyerɛ wo tum, Ao Nyankopɔn, dza edze agye hɛn no.'
      sbs: 0.6404
      gen_sec: 3.72
      ref_sec: 7.24
    '125':
      text: Nna wogyaa dɛ wɔnye no kasa; osiandɛ woennhu asɛm no.
      sbs: 0.7036
      gen_sec: 1.79
      ref_sec: 3.92
    '126':
      text: Afei Ahija no nkɔdaayɛ ntsi n’enyiwa ayɛ kusukusu na onnhu adze.
      sbs: 0.6402
      gen_sec: 3.13
      ref_sec: 6.98
    '127':
      text: Na Hilkia buae see ɔkyerɛwfo Safan dɛ, Mehu mbra nwoma no wɔ EWURADZE fie.
      sbs: 0.6573
      gen_sec: 3.83
      ref_sec: 8.0
    '128':
      text: Na boka afamu he nye Nkyen Po no, mekyerɛ ɔdze kodu Jordan ewiei.
      sbs: 0.6659
      gen_sec: 2.81
      ref_sec: 6.62
    '129':
      text: 'Tappua asaase no yɛ Manaasɛ dze: na Tappua a ɔwɔ Manaasɛ he do no dze ɔyɛ Efraimmba no dze.'
      sbs: 0.7053
      gen_sec: 4.52
      ref_sec: 8.34
    '130':
      text: Wotwa mu wɔ Nyinsu bɔnsa no mu a wɔdan no bea a mbasu wɔ; Nyew, adɔwnsu dze nhyira kata do.
      sbs: 0.6666
      gen_sec: 4.71
      ref_sec: 8.24
    '131':
      text: 'Na wɔnkyɛ mu kyɛpɛn esuon: Juda ntsena ne he do wɔ kwaamu afamu.'
      sbs: 0.6549
      gen_sec: 3.14
      ref_sec: 6.72
    '132':
      text: 'Naaso wo nda mu dze merennyɛ, osian w’egya David ntsi: na mbom mebɛtsew efi wo ba nsamu.'
      sbs: 0.673
      gen_sec: 4.39
      ref_sec: 6.76
    '133':
      text: 'Nyia ɔtwer nankasa n’akoma no, ɔkwasea a: Na obiara a ɔnantsew nyansa mu no dze, wɔbɛgye
        no nkwa.'
      sbs: 0.6773
      gen_sec: 4.79
      ref_sec: 8.76
    '134':
      text: Nyia ɔsoɛr anapahema dze ndze kɛse hyira ne nyɛnko no.
      sbs: 0.6463
      gen_sec: 2.84
      ref_sec: 4.7
    '135':
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6874
      gen_sec: 2.0
      ref_sec: 3.18
    '136':
      text: Na ofi hɔ fowee kɔr Debir a nkan no na ne dzin nye Kiriat-Sefer no do.
      sbs: 0.6547
      gen_sec: 2.1
      ref_sec: 9.1
    '137':
      text: Hwɛ, menye wo enya, ɔwo a etse bɔnsa mu e.
      sbs: 0.6758
      gen_sec: 2.13
      ref_sec: 3.4
    '138':
      text: Nna Jeremia see Zedekia dɛ, Aso mepaa mu ka kyerɛ wo a, ana nnyɛ oku ara na woboku me bi?
      sbs: 0.6621
      gen_sec: 4.43
      ref_sec: 7.18
    '139':
      text: Dɛm ntsi afei hom nyiyi Israel ebusuakuw ebusuakuw mu mbanyin duebien, ebusuakuw biara mu
        nyimpa baako.
      sbs: 0.6612
      gen_sec: 5.84
      ref_sec: 9.46
    '140':
      text: Afei, me Nyankopɔn, meserɛ wo, bue w’enyiwa, na kyɛn w’aso wɔ mpaabɔ a wɔbɔ wɔ ha yi do.
      sbs: 0.6794
      gen_sec: 4.32
      ref_sec: 8.14
    '141':
      text: Otwitwa nankasa ne nan, na ɔnom mbusu.
      sbs: 0.6719
      gen_sec: 2.17
      ref_sec: 3.48
    '142':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.616
      gen_sec: 0.71
      ref_sec: 4.2
    '143':
      text: 'Na Solomon kɔr ne nsamankyir, na wosiee no wɔ n’egya David kurow mu: na ne ba Rehoboam dzii
        hen wɔ n’ananmu.'
      sbs: 0.614
      gen_sec: 5.98
      ref_sec: 11.3
    '145':
      text: Dadze sew dadze ano; Dɛmara so na nyimpa sew ne nyɛnko enyim.
      sbs: 0.6856
      gen_sec: 3.04
      ref_sec: 4.94
    '147':
      text: Afei Zimri no ho nsɛm nkaa no na no nkontompɔ a otwae no, ana wɔnnkyerɛɛw no wɔ Israel ahemfo
        hɔn Mbermunsɛm nwoma no mu?
      sbs: 0.5994
      gen_sec: 7.06
      ref_sec: 11.44
    '148':
      text: Na ɔhwɛɛ ahemfo no nyinara do dze fi Esutsen no ho araa dze kodur Filistiafo asaase do, na
        Egypt ahe do.
      sbs: 0.6239
      gen_sec: 5.92
      ref_sec: 10.56
    '149':
      text: EWURADZE tse ase yi; nna amanaman bɛyɛ esiarfo wɔ no mu.
      sbs: 0.6745
      gen_sec: 3.08
      ref_sec: 3.4
    '150':
      text: 'Dɔm ahemfo guanguan, woguanguan: Na nyia ɔtse fie na ɔkyɛ asadze mu.'
      sbs: 0.6872
      gen_sec: 3.58
      ref_sec: 5.42
    '151':
      text: Ama wo mbɔdɔm tɛkyerɛma eenya ne kyɛpɛn wɔ w’atamfo ho.
      sbs: 0.6779
      gen_sec: 1.12
      ref_sec: 3.56
    '152':
      text: Ntsi migyaa hɔn ma wodzii hɔn akomadzen ekyir.
      sbs: 0.6665
      gen_sec: 2.31
      ref_sec: 3.26
    '153':
      text: 'Na ɔsee dɛ, Bue boka afamu tokura no: na obuei.'
      sbs: 0.5276
      gen_sec: 2.88
      ref_sec: 4.9
    '154':
      text: Na sɛ hom ayɛ dɛ nsoɛ kantankantan, na hom afɔw takaa wɔ hom nsanom mu mpo a.
      sbs: 0.652
      gen_sec: 3.66
      ref_sec: 6.02
    '155':
      text: Aber a obui faa do, dɛ gyama ofi yafun mu rupue no; Aber a medze mununkum yɛɛ n’akataho.
      sbs: 0.6223
      gen_sec: 4.56
      ref_sec: 7.58
    '156':
      text: Aso emumuyɛ akoradze wɔ emumuyɛ fi no mu.
      sbs: 0.6713
      gen_sec: 2.27
      ref_sec: 3.2
    '157':
      text: Na Reubenmba no hɔn he nye Jordan, nye ne he.
      sbs: 0.6813
      gen_sec: 2.12
      ref_sec: 3.22
    '158':
      text: Na, hwɛ, mber a ɔda ho nye ɔhen no rekasa no, nkɔnhyɛnyi Natan bae.
      sbs: 0.6762
      gen_sec: 3.28
      ref_sec: 5.62
    '159':
      text: Afei hwɛ esuson a meyɛɛ no kaa wo ho no; Odzi efuw dɛ nantwi.
      sbs: 0.6431
      gen_sec: 3.08
      ref_sec: 4.92
    '160':
      text: Israelhen Joahaz ne ba Jehoas n’afe a otsia ebien no mu nna Amazia, Judahen Joas ne ba no,
        hyɛɛ ase dzii hen.
      sbs: 0.6394
      gen_sec: 5.92
      ref_sec: 11.84
    '162':
      text: Dɛm ntsi afei mma hom nngyegye sika wɔ hom amanyimfo hɔ bio, na hom nyi mma ma wɔmfa mpempam
        ofi no n’agow no.
      sbs: 0.6354
      gen_sec: 5.11
      ref_sec: 11.32
    '164':
      text: Dɛmara so na abɔbɔfo do ɔhen tsirmɔdzennyi tse.
      sbs: 0.661
      gen_sec: 2.43
      ref_sec: 3.38
    '165':
      text: Na ɔyɛɛ dza ɔtsen wɔ EWURADZE n’enyiwa do, na ɔnantseew n’egya David n’akwan do, na ɔanndan
        ammfa nkyɛn annkɔ enyimfa anaa abankum.
      sbs: 0.6961
      gen_sec: 6.76
      ref_sec: 11.16
    '166':
      text: Mbrɛ Jeremia tsenaa aweɔmfo abangua no mu nye no.
      sbs: 0.6782
      gen_sec: 2.6
      ref_sec: 5.58
    '167':
      text: na ɔdze n’abasa bubu mbɛtsem no; ɔbɛyɛ dɛ aber a obi ridzi mbɛtsem mpɛpɛw.
      sbs: 0.6863
      gen_sec: 3.76
      ref_sec: 6.22
    '168':
      text: Ana ofitsi dɛ wo nda hyɛɛ ase yi ahyɛ anapa do pɛn.
      sbs: 0.6671
      gen_sec: 2.61
      ref_sec: 4.84
    '169':
      text: Na Hadad nyaa enyimnyam kɛse wɔ Farao enyim, ma ɔdze nankasa ne yer no nua, ɔhembaa Tafenes
        no nua, maa no ayewar.
      sbs: 0.5672
      gen_sec: 5.9
      ref_sec: 10.92
    '170':
      text: Ngyanka hɔn egya, na ekunafo hɔn sɛndzifo.
      sbs: 0.6941
      gen_sec: 2.4
      ref_sec: 3.42
    '171':
      text: Asɔfo No Hyɛ Hɔn Dwumadzi Ase.
      sbs: 0.5825
      gen_sec: 2.12
      ref_sec: 3.66
    '172':
      text: na Memfis banodzifo adwen efura mu; na hɔn a wɔyɛ no mbusuakuw kutuwdo bo no.
      sbs: 0.6683
      gen_sec: 4.01
      ref_sec: 7.5
    '173':
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.6337
      gen_sec: 3.94
      ref_sec: 9.28
    '174':
      text: 'Obu mpɔtsibaa dɛ mburonan: Ɔserew nkambaa no huuyɛ.'
      sbs: 0.7105
      gen_sec: 2.23
      ref_sec: 5.28
    '175':
      text: Nyew, dɛ mbrɛ gyata no pɔw, na gyata bɔyafo ne ndze.
      sbs: 0.6777
      gen_sec: 2.66
      ref_sec: 5.48
    '176':
      text: Afei nna ɔhen David ayɛ akɔdaa a oedzi mfe pii; ɔwɔ mu dɛ wɔdze atam kataa no do, naaso no
        ho annyɛ no hyew.
      sbs: 0.6534
      gen_sec: 4.96
      ref_sec: 9.2
    '177':
      text: 'Enyena sa a, ogya dum: Na bɔtomkɛka nnyi hɔ a, mansotwe gyaa.'
      sbs: 0.6651
      gen_sec: 3.28
      ref_sec: 6.04
    '178':
      text: Na Ahija tae suoo atar fofor a ɔhyɛ no no mu, na ɔtsetseew mu esinesin duebien.
      sbs: 0.666
      gen_sec: 3.89
      ref_sec: 7.34
    '180':
      text: Me bepɔw a ewɔ wiramu, medze w’ahodze na w’akoradze nyina bɛma ma wɔaafom afa, na wo nsorɔnsorɔmbea
        no, wɔ bɔn ntsi, wɔ w’ahe nyinara do.
      sbs: 0.6474
      gen_sec: 8.1
      ref_sec: 11.4
    '181':
      text: Kaansa enyitan dze ndaadaa kata noho mpo a.
      sbs: 0.6174
      gen_sec: 2.8
      ref_sec: 3.78
    '182':
      text: 'Ɔtwerɛw bɔnsa mu, na odzi ehurusi wɔ n’ahoɔdzen mu: Opue kehyia akofo a woemia.'
      sbs: 0.6743
      gen_sec: 4.33
      ref_sec: 6.46
    '183':
      text: EWURADZE na ɔse; hom a hom ka dɛ, Woana botum esian aba hɛn do?
      sbs: 0.6475
      gen_sec: 3.22
      ref_sec: 4.62
    '184':
      text: Anaadɛ nyia ɔda hɛn mu frankadua etsifi.
      sbs: 0.6346
      gen_sec: 2.48
      ref_sec: 3.92
    '185':
      text: dɛ mbrɛ ɔsabokwafo tɔ ntentan wɔ ne fe mu.
      sbs: 0.5378
      gen_sec: 1.26
      ref_sec: 3.76
    '186':
      text: 'Na ɔsee Israelhen no dɛ, Fa wo nsa to egyen no do: na ɔdze ne nsa too do.'
      sbs: 0.7657
      gen_sec: 4.28
      ref_sec: 7.32
    '187':
      text: Na ɔbaa dɛ, aber a wowiee ɔman no nyinara twatsia twitwa no, wɔtsenatsenaa hɔn ananmu wɔ nseraban
        no mu ma wɔtsee apɔw ana.
      sbs: 0.6384
      gen_sec: 6.59
      ref_sec: 12.36
    '188':
      text: Makasa prɛko, na murummbua; Nyew, mprɛnu, na moronnkɔ kan bio.
      sbs: 0.6428
      gen_sec: 2.73
      ref_sec: 5.84
    '189':
      text: 'Wo mboanofo tsenaa mu: Ɔwo, Nyankopɔn, na isiesiee abɔbɔfo wɔ w’ayamuyie mu.'
      sbs: 0.6212
      gen_sec: 4.17
      ref_sec: 6.3
    '190':
      text: Na Juda mbapɔmba tsee ndzɛmba yinom no, wofii ahemfie fowee baa EWURADZE fie ɔponkɛse fofor
        no ano.
      sbs: 0.645
      gen_sec: 5.63
      ref_sec: 7.82
    '192':
      text: Nna Farao see no dɛ, Na ebɛnadze na ehia no wɔ me nkyɛn, ma erohwehwɛ dɛ ekɔ wankasa wo man
        mu yi?
      sbs: 0.6747
      gen_sec: 4.37
      ref_sec: 7.9
    '193':
      text: 'Nna wɔfaa Jeremia, na wɔkotoow no kyeen ɔhenba Malkia mona efiadze a ɔwɔ aweɔmfo abanguado
        no mu: na wɔdze ntampehoma gyaagyaa Jeremia siaan mu.'
      sbs: 0.6497
      gen_sec: 8.88
      ref_sec: 12.34
    '194':
      text: Wɔse dɛ, Hom mbra ma yenkruw hɔn ase ma wongyaa dɛ wɔbɛyɛ ɔman; Ama wɔnnkɛkaa Israel dzin
        bio.
      sbs: 0.6549
      gen_sec: 5.17
      ref_sec: 8.02
    '195':
      text: 'Na ɔfowee kɔr ne nkyɛn: na, hwɛ, ɔtse koko no n’etsifi.'
      sbs: 0.7137
      gen_sec: 2.49
      ref_sec: 4.84
    '196':
      text: 'Na wobuaa dɛ, Ahazia no nuanom nye hɛn: na yerisian akɔ ekekyiakyia ɔhen ne mba, na ɔhembaa
        ne mba no.'
      sbs: 0.6764
      gen_sec: 5.23
      ref_sec: 10.94
    '198':
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6652
      gen_sec: 3.96
      ref_sec: 5.64
    '199':
      text: Na Sallum, a ofi Kore, Ebiasaf, na Kora asefo no mu, na no nuanom a wofi n’egya fie.
      sbs: 0.6582
      gen_sec: 4.66
      ref_sec: 8.82
    '200':
      text: bɛba dɔm EWURADZE ne dzin tsenabea, bepɔw Zion no do.
      sbs: 0.6678
      gen_sec: 3.36
      ref_sec: 6.32
    '201':
      text: Ana ɔnam w’anosɛm do na ɔkɔrpɔn ma noho do.
      sbs: 0.686
      gen_sec: 1.27
      ref_sec: 4.2
    '202':
      text: Hɔn a wɔdan wo gya nyina enyi bɔto; hɔn a wofi wo nkyɛn kɔ no, wɔbɛkyerɛw hɔn edzin aka asaase
        ase mba ho.
      sbs: 0.6541
      gen_sec: 6.13
      ref_sec: 8.28
    '203':
      text: Na Adonija n’aponto asefo no nyinara suroi, na wɔsoɛrsoɛree na nyimpa biara faa no kwan kɔree.
      sbs: 0.668
      gen_sec: 4.93
      ref_sec: 8.48
    '204':
      text: Hom nka nkyerɛ amanaman dɛ wɔreba; hom mma wɔntse no Jerusalɛm.
      sbs: 0.6779
      gen_sec: 3.07
      ref_sec: 4.18
    '205':
      text: sɛ wosi frankaa wɔ mbepɔw do a, hom nhwɛ; na sɛ wɔbɔ akasamu mu a, hom ntsie.
      sbs: 0.6714
      gen_sec: 3.91
      ref_sec: 5.46
    '207':
      text: Na Kohatmba nkaa no nam tontotwe do nyae fii Efraim, Dan, nye Manaasɛ ebusuakuw fa no mu nkurow
        du.
      sbs: 0.6404
      gen_sec: 5.73
      ref_sec: 10.62
    '208':
      text: Iyi nye Benjaminmba no egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6896
      gen_sec: 3.72
      ref_sec: 7.22
    '209':
      text: Na ɔkaa Israelmba mu ebusuakuw esuon a wonnyae nnkyɛɛ hɔn egyapadze.
      sbs: 0.6531
      gen_sec: 3.23
      ref_sec: 5.76
    '210':
      text: Afei Solomon n’edwuma nyinara wosiesiei maa da a wɔtoow EWURADZE ne dan no ne fapem, na okodur
        dɛ wowiei.
      sbs: 0.6521
      gen_sec: 6.48
      ref_sec: 9.0
    '211':
      text: dɛmara so na wobotwitwa hom egu, na hom etwa mu akɔ.
      sbs: 0.6673
      gen_sec: 2.84
      ref_sec: 3.46
    '213':
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.6685
      gen_sec: 4.46
      ref_sec: 7.62
    '214':
      text: na ɔmaa ahendzi hihimii no nye yi; nyia ɔmaa wiadze yi yɛɛ dɛ sar.
      sbs: 0.6708
      gen_sec: 3.21
      ref_sec: 5.48
    '215':
      text: nye w’ayeforber mu dɔ no ma wo; mbrɛ idzii m’ekyir wɔ sar no do.
      sbs: 0.6858
      gen_sec: 3.26
      ref_sec: 4.9
    '216':
      text: 'Wɔdze ogya ahyew no, woetwa ato famu: W’enyim nkaenyim ntsi wɔasɛɛ.'
      sbs: 0.6691
      gen_sec: 3.39
      ref_sec: 4.74
    '217':
      text: Na aber a Seba ɔhembaa no tsee Solomon ne nka wɔ EWURADZE ne dzin ho no, ɔbaa dɛ ɔdze nsɛmbisa
        dzendzen robɔsɔ no ahwɛ.
      sbs: 0.6995
      gen_sec: 6.19
      ref_sec: 7.86
    '218':
      text: Na wɔdze afona anomu kunkum hɔn; na brampafo na asafohemfo no totoow hɔn gui, na wosii mu
        kɔr Baal fie kurow no mu.
      sbs: 0.4714
      gen_sec: 7.0
      ref_sec: 10.54
    '219':
      text: Naaso ɔpoow nkɔdaa no hɔn afotu a wɔdze maa no no, na ɔnye mberantsɛ a wɔnye no nyinii a afei
        wɔabɛyɛ n’apamfo no no dwenee.
      sbs: 0.692
      gen_sec: 6.15
      ref_sec: 11.92
    '220':
      text: 'Ɔwo edze hɛn yɛ aperdzi ma hɛn asɔnmufo: Na hɛn atamfo sereserew wɔ hɔnara hɔn mu.'
      sbs: 0.6535
      gen_sec: 4.02
      ref_sec: 7.6
    '221':
      text: anaadɛ poma bɛma nyia ɔnnyɛ dua no no do.
      sbs: 0.6821
      gen_sec: 1.96
      ref_sec: 3.34
    '222':
      text: 'Na asɛm yi maa wɔyɛɛ bɔn: osiandɛ ɔman no kɔree kɔsoom hɔn wɔ Bɛtɛl araa dze kɔr Dan.'
      sbs: 0.6961
      gen_sec: 4.38
      ref_sec: 7.32
    '223':
      text: Obeyi wo wɔ ahohia esia mu; Nyew, dza otsia esuon no mu mpo mbusu bi rennka wo.
      sbs: 0.6146
      gen_sec: 4.13
      ref_sec: 7.56
    '225':
      text: Nna Atalia tsetseew ne ntar mu, na ɔkekaa mu dɛ, Etuatsew o, iyi yɛ etuatsew.
      sbs: 0.6562
      gen_sec: 4.16
      ref_sec: 6.74
    '226':
      text: Woana na ɔwɔ enyiwa a ayɛ kɔɔ?
      sbs: 0.6922
      gen_sec: 1.53
      ref_sec: 3.68
  score: 0.6614
