  entries:
    bible_00000:
      source: bible
      text: Obiara n’enyi nnyɛ dzen dɛ ɔbɔbɔ no nkenyan; Na sɛ dɛm a, woana koraa nye nyia obotum emi
        m’enyim gyina?
      sbs: 0.6399
      gen_sec: 5.16
      ref_sec: 9.1
      cer: 0.1
      wer: 0.3
    bible_00001:
      source: bible
      text: Nyew, ebɛyɛ dɛ nyia ɔda epo finimfin.
      sbs: 0.6669
      gen_sec: 1.88
      ref_sec: 3.66
      cer: 0.1724
      wer: 0.5714
    bible_00002:
      source: bible
      text: Na obisaa hɔn dɛ, Afotu bɛn na hom dze ma, ma yɛdze mbuae aasan akɛma ɔman yi a wɔaka akyerɛ
        me, dɛ, Yɛ kɔndua a w’egya dze too hɛn do no harhar no?
      sbs: 0.6031
      gen_sec: 7.76
      ref_sec: 13.72
      cer: 0.2545
      wer: 0.5152
    bible_00003:
      source: bible
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.6846
      gen_sec: 3.62
      ref_sec: 6.36
      cer: 0.1207
      wer: 0.5714
    bible_00004:
      source: bible
      text: 'Judamba afamu dze no mu na Simeonmba egyapadze fi: osiandɛ Judamba kyɛpɛn no dɔɔ so dodow
        ma hɔn: dɛm ntsi Simeonmba nyaa egyapadze wɔ hɔn egyapadze no mu.'
      sbs: 0.6554
      gen_sec: 8.25
      ref_sec: 13.48
      cer: 0.08
      wer: 0.25
    bible_00005:
      source: bible
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6825
      gen_sec: 2.16
      ref_sec: 3.18
      cer: 0.0882
      wer: 0.4286
    bible_00006:
      source: bible
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.6759
      gen_sec: 5.09
      ref_sec: 9.12
      cer: 0.1622
      wer: 0.4737
    bible_00007:
      source: bible
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.629
      gen_sec: 5.58
      ref_sec: 7.44
      cer: 0.075
      wer: 0.25
    bible_00008:
      source: bible
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.6796
      gen_sec: 2.88
      ref_sec: 4.88
      cer: 0.0435
      wer: 0.2727
    bible_00009:
      source: bible
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.657
      gen_sec: 4.02
      ref_sec: 6.16
      cer: 0.1231
      wer: 0.4286
    bible_00010:
      source: bible
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.6289
      gen_sec: 6.54
      ref_sec: 8.48
      cer: 0.1205
      wer: 0.381
    bible_00011:
      source: bible
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.6869
      gen_sec: 3.65
      ref_sec: 6.68
      cer: 0.1667
      wer: 0.3158
    bible_00012:
      source: bible
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.696
      gen_sec: 6.29
      ref_sec: 10.5
      cer: 0.1124
      wer: 0.3333
    bible_00013:
      source: bible
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.678
      gen_sec: 3.74
      ref_sec: 6.38
      cer: 0.0536
      wer: 0.4667
    bible_00014:
      source: bible
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.6584
      gen_sec: 2.37
      ref_sec: 4.1
      cer: 0.1579
      wer: 0.2222
    bible_00015:
      source: bible
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6555
      gen_sec: 4.35
      ref_sec: 6.76
      cer: 0.1493
      wer: 0.5333
    bible_00016:
      source: bible
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.6864
      gen_sec: 4.77
      ref_sec: 8.48
      cer: 0.1507
      wer: 0.3889
    bible_00017:
      source: bible
      text: 'Hom ntow ndwom mma Nyankopɔn, hom ntow ayɛyindwom mma ne dzin: Hom mbɔ ɔtsempɔn kwan mma
        nyia ɔtse adze do nam sar do no; Ne dzin nye EWURADZE; na hom ndzi n’enyim ehurusi.'
      sbs: 0.6291
      gen_sec: 8.11
      ref_sec: 13.4
      cer: 0.1716
      wer: 0.4242
    bible_00018:
      source: bible
      text: 'Nyia ɔbɛtsena kurow yi mu no, obowu afona, na ɔkɔm, na ɔyardɔm ano: na nyia obefir edzi na
        ɔakɔtɔ Kaldeafo a woetwa hom ho mu no, ɔbɛtsena ase, na no nkwa bɛyɛ afonam ama no.'
      sbs: 0.6503
      gen_sec: 9.96
      ref_sec: 14.96
      cer: 0.1579
      wer: 0.5714
    bible_00019:
      source: bible
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.67
      gen_sec: 1.93
      ref_sec: 3.16
      cer: 0.1333
      wer: 0.6667
    bible_00020:
      source: bible
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.6708
      gen_sec: 2.75
      ref_sec: 4.36
      cer: 0.0714
      wer: 0.1429
    bible_00021:
      source: bible
      text: Nna Jeremia kasaa kyerɛɛ mbapɔmba nyinara na ɔman no nyinara, dɛ, EWURADZE na ɔsomaa me dɛ
        membɛhyɛ asɛm a hom atse yi nyina ho nkɔm ntsia ofi yi na kurow yi.
      sbs: 0.6286
      gen_sec: 9.38
      ref_sec: 12.98
      cer: 0.088
      wer: 0.2581
    bible_00022:
      source: bible
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.6639
      gen_sec: 2.48
      ref_sec: 3.74
      cer: 0.0833
      wer: 0.4
    bible_00023:
      source: bible
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.6727
      gen_sec: 6.22
      ref_sec: 10.44
      cer: 0.1684
      wer: 0.6
    bible_00024:
      source: bible
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.6617
      gen_sec: 4.9
      ref_sec: 8.26
      cer: 0.1714
      wer: 0.5294
    bible_00025:
      source: bible
      text: 'Na Elija see no dɛ, Mma nnsuro; kɔ kɛyɛ dɛ mbrɛ ase no: mbom dzi kan yɛ bi tatar kakra ma
        me, na fa brɛ me, na n’ekyir no ayɛ ɔwo na wo ba dze.'
      sbs: 0.7306
      gen_sec: 8.16
      ref_sec: 12.8
      cer: 1.0
      wer: 1.0
    bible_00026:
      source: bible
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.7567
      gen_sec: 1.22
      ref_sec: 5.0
      cer: 1.0
      wer: 1.0
    bible_00027:
      source: bible
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6768
      gen_sec: 3.95
      ref_sec: 7.04
      cer: 0.0794
      wer: 0.2667
    bible_00028:
      source: bible
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
      sbs: 0.6613
      gen_sec: 5.13
      ref_sec: 9.74
      cer: 0.012
      wer: 0.2941
    bible_00029:
      source: bible
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
      sbs: 0.6732
      gen_sec: 3.02
      ref_sec: 4.34
      cer: 0.1463
      wer: 0.6667
    bible_00030:
      source: bible
      text: Nna Jeremia see no dɛ, EWURADZE mmfrɛɛ wo dzin Pasur, na mbom Magor-misabib.
      sbs: 0.6824
      gen_sec: 4.04
      ref_sec: 5.64
      cer: 0.15
      wer: 0.5385
    bible_00031:
      source: bible
      text: na ɔahyɛ dɛ ɔmbra.
      sbs: 0.6887
      gen_sec: 1.34
      ref_sec: 3.36
      cer: 0.1429
      wer: 0.25
    bible_00032:
      source: bible
      text: Ana ɔwo ibotum edze ntampehoma ahyɛ no hwen mu?
      sbs: 0.6458
      gen_sec: 2.34
      ref_sec: 3.54
      cer: 0.2895
      wer: 0.8889
    bible_00033:
      source: bible
      text: 'Na asɛm a osian ntsi ma ɔmaa ne nsa do tsiaa ɔhen no nye yi: Solomon sii Millo, na osisiiw
        n’egya David kurow ho etokur.'
      sbs: 0.6377
      gen_sec: 6.42
      ref_sec: 11.1
      cer: 0.163
      wer: 0.56
    bible_00034:
      source: bible
      text: 'Mma hom nnsuro Babilɔnhen a hom suro no no; mma hom nnsuro no, EWURADZE na ɔse: na mowɔ hom
        nkyɛn dɛ mebɛgye hom nkwa, na meyi hom efi ne nsamu.'
      sbs: 0.6201
      gen_sec: 7.85
      ref_sec: 9.78
      cer: 0.0545
      wer: 0.2
    bible_00035:
      source: bible
      text: Na wɔkɔree, na wɔkɔr ɔbaa huhunyi bi a ne dzin dze Rahab ne fie, na wɔkɔsoɛɛ hɔ.
      sbs: 0.6991
      gen_sec: 4.08
      ref_sec: 7.62
      cer: 0.1967
      wer: 0.4118
    bible_00036:
      source: bible
      text: Na nyimpa akakaben mboanofo no rohwehwɛ mo nkwa.
      sbs: 0.6489
      gen_sec: 2.62
      ref_sec: 3.74
      cer: 0.125
      wer: 0.625
    bible_00037:
      source: bible
      text: Na ɔdze kor kesii Bɛtɛl, na ɔdze kor so kesii Dan.
      sbs: 0.7008
      gen_sec: 2.62
      ref_sec: 3.94
      cer: 0.0526
      wer: 0.1818
    bible_00038:
      source: bible
      text: Iyi nye Judamba ebusuakuw no hɔn egyapadze dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6764
      gen_sec: 4.23
      ref_sec: 7.02
      cer: 0.1719
      wer: 0.3077
    bible_00039:
      source: bible
      text: Na wowiee asaase no mu kyɛ.
      sbs: 0.6508
      gen_sec: 1.76
      ref_sec: 3.74
      cer: 0.0952
      wer: 0.1667
    bible_00040:
      source: bible
      text: Na aber a odur ɔhen n’enyim no, ɔbɔɔ no mu adze dze n’enyim boom famu wɔ ɔhen n’enyim.
      sbs: 0.6985
      gen_sec: 4.0
      ref_sec: 5.94
      cer: 0.1094
      wer: 0.3889
    bible_00041:
      source: bible
      text: Mbrɛ Jehu sii sɛɛ Baal fii Israel nye no.
      sbs: 0.684
      gen_sec: 1.96
      ref_sec: 3.26
      cer: 0.0938
      wer: 0.3333
    bible_00042:
      source: bible
      text: 'Ebɛka dɛ, Wɔabɔbɔ me, na annka me; Wɔabor me, naaso manntse: Ebɛn aber na mibenyan?'
      sbs: 0.684
      gen_sec: 4.33
      ref_sec: 9.28
      cer: 0.1587
      wer: 0.6
    bible_00043:
      source: bible
      text: 'Yɛ hɔn etsitsir dɛ Oreb na Zeeb; Nyew, hɔn mbapɔmba nyinara dɛ Zeba na Zalmunna: Hɔn a wɔsee
        dɛ, Hom mma yɛmfa.'
      sbs: 0.6982
      gen_sec: 6.68
      ref_sec: 11.2
      cer: 1.0
      wer: 1.0
    bible_00044:
      source: bible
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.6963
      gen_sec: 2.48
      ref_sec: 4.1
      cer: 0.0541
      wer: 0.1
    bible_00045:
      source: bible
      text: Na ɔbaa dɛ, nsɛm yi ekyir no, ɔbaa ofiwura no ne babanyin yaree; na ne yarba no mu yɛɛ dzen
        dodoodow, ma ahom biara annka no mu.
      sbs: 0.6773
      gen_sec: 6.53
      ref_sec: 11.4
      cer: 0.134
      wer: 0.4815
    bible_00046:
      source: bible
      text: 'Na ɔsee dɛ, Tase egyen menaba no: na ɔtasee.'
      sbs: 0.5187
      gen_sec: 2.76
      ref_sec: 4.26
      cer: 1.0
      wer: 1.0
    bible_00047:
      source: bible
      text: Ɔwo, Nyankopɔn, maa nyankom tɔɔ berdzedzeedze.
      sbs: 0.6772
      gen_sec: 2.81
      ref_sec: 3.42
      cer: 0.0789
      wer: 0.3333
    bible_00048:
      source: bible
      text: Ne nda nyinara mu no woemmfi EWURADZE, hɔn egyanom Nyankopɔn no, n’ekyir dzi no ho emmfir.
      sbs: 0.6232
      gen_sec: 5.05
      ref_sec: 9.06
      cer: 0.0845
      wer: 0.4375
    bible_00049:
      source: bible
