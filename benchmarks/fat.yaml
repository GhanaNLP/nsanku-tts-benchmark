      text: Jesus Christ Yɛ Mboa  President Camille N. Johnson ne Kasaa  Wiadze Mfɛndzanan Relief Society
        President  Yebotum nye Agyenkwa no abɔ mu aboa dze honam mu nye sunsum mu mboa ama hɔn a wohia—na
        wɔ kwan no mu no yeenya hɛn ankasa hɛn mboa.
      sbs: 0.5393
      gen_sec: 18.56
      ref_sec: 5.42
      cer: 0.0745
      wer: 0.2558
    lds_00035:
      source: lds
      text: Nda kakra ekyir ara, n’anyɛnkofo too nsa frɛɛ no dɛ wɔnkɔhwɛ sene bi a ɔnnyɛ.
      sbs: 0.5571
      gen_sec: 6.16
      ref_sec: 4.66
      cer: 0.0667
      wer: 0.2667
    lds_00036:
      source: lds
      text: Kaa Dza Ohia Papaapa  President M. Russell Ballard ne Kasaa  Asomafo Duebien no hɔn Quorum
        ne President n’Ananmu-gyinanyi  Dza ohia papaapa nye hɛn nkitahodzi a yɛnye Ɔsor Egya na No Dɔba,
        hɛn ebusua ebusua, na hɛn fipamfo wɔ, na yɛrema Ewuradze no Sunsum ama hɛn kwankyerɛ.
      sbs: 0.5547
      gen_sec: 17.6
      ref_sec: 12.14
      cer: 0.1553
      wer: 0.4565
    lds_00037:
      source: lds
      text: Mukodurii no, migyaa moho too anhwea no do a, nna maberɛ ara yie.
      sbs: 0.6475
      gen_sec: 4.96
      ref_sec: 4.66
      cer: 0.1
      wer: 0.5385
    lds_00038:
      source: lds
      text: Akomayaw na abagura ho nsɛm a onnkopue dawurbɔ nkraataa enyim anaa ɔrenntahye da ho.
      sbs: 0.6032
      gen_sec: 6.16
      ref_sec: 8.06
      cer: 0.1429
      wer: 0.7143
    lds_00039:
      source: lds
      text: Mfe pii a abɛsen no hɛn ebusua kumabaa no nna yɛrokɔ akɔhwɛ sene ayɛ hɛn ebusua ewimbir fie
        nhyiamu.
      sbs: 0.6467
      gen_sec: 7.36
      ref_sec: 4.92
      cer: 0.1235
      wer: 0.5263
    lds_00040:
      source: lds
      text: Nna Ɔanom kuraba wenwen no ano na Ɔasɔw amandzehu nyinara ama sɛ yenu hɛnho a yennhu amandze.
      sbs: 0.5858
      gen_sec: 6.24
      ref_sec: 6.82
      cer: 0.0921
      wer: 0.4706
    lds_00041:
      source: lds
      text: Dɛm Anglo-French kasafua no fi Tsetse French kasafua relever, anaa dɛ “ma do,” nna fi Latin
        kasafua relevare mu, anaa “ma do bio.”  Nuambanyin na nkyerɛbaa, Jesus Christ yɛ mboa.
      sbs: 0.4777
      gen_sec: 15.52
      ref_sec: 5.38
      cer: 0.1606
      wer: 0.5667
    lds_00042:
      source: lds
      text: '“Na nyia owui no firii bae: nda mu atam kyekyer ne nan nye ne nsa, na duukuu kyekyer n’enyim.'
      sbs: 0.6214
      gen_sec: 6.4
      ref_sec: 6.68
      cer: 0.0571
      wer: 0.1053
    lds_00043:
      source: lds
      text: Okenyaan hɛn!
      sbs: 0.5628
      gen_sec: 0.72
      ref_sec: 3.26
      cer: 0.4545
      wer: 0.5
    lds_00044:
      source: lds
      text: Nyimpa nyina akyɛdze yi dze dza oye ho tsiboa, pɛ dɛ ebɔdɔ na wɔadɔ wo ba.
      sbs: 0.64
      gen_sec: 5.12
      ref_sec: 11.56
      cer: 0.0877
      wer: 0.3125
    lds_00045:
      source: lds
      text: Nna ɔpɛ dɛ wonuma no ntsɛmara, naaso nna n’ebusua mu mba nkaa no nnyɛ krado.
      sbs: 0.6103
      gen_sec: 6.32
      ref_sec: 5.66
      cer: 0.1525
      wer: 0.7333
    lds_00046:
      source: lds
      text: Yɛresan akɔ hɛn ayɛdzefo a wɔwɔ akyɛdze mfatoho no ho a, ohia dɛ yɛkaa dɛ akyɛdze nko nnkyerɛ
        dɛ ebɔwea wɔ talent no ho.
      sbs: 0.6154
      gen_sec: 8.32
      ref_sec: 9.7
      cer: 0.0737
      wer: 0.4167
    lds_00047:
      source: lds
      text: 'Hom mu binom bɔdwen dɛ: “Na yeregya mbanana ɛ?'
      sbs: 0.614
      gen_sec: 3.28
      ref_sec: 3.48
      cer: 0.5429
      wer: 0.6667
    lds_00048:
      source: lds
      text: Na kwan kor a dɛm botum aba nye yɛbɛyɛ Jesus Christ N’Asɔr a ɔwɔ hɔ ma Nda a Odzi Ekyir Ahotseweefo
        asɔrmba pa na ɔnam asɔfodzi krɔnkrɔn no do wɔasɔw hɛn ano wɔ temple.
      sbs: 0.6481
      gen_sec: 13.44
      ref_sec: 11.2
      cer: 0.5639
      wer: 0.8235
    lds_00049:
      source: lds
      text: Ɔwɔ mu dɛ tsetseber no nna temple wɔ hɔ, na Jesus Christ n’asɛmpa ne Nsanananmu no, temple
        ne nsii ayɛ nkɔnhyɛfo nyina ofitsi Nkɔnhyɛnyi Joseph Smith do hɔn ehiadze a ɔkrɔn koraa no mu
        kor ama hɔn.
      sbs: 0.5715
      gen_sec: 15.36
      ref_sec: 13.38
      cer: 0.1146
      wer: 0.3514
