      sbs: 0.6561
      gen_sec: 3.76
      ref_sec: 3.66
      cer: 0.0
      wer: 0.0
    bible_00002:
      source: bible
      text: Na obisaa hɔn dɛ, Afotu bɛn na hom dze ma, ma yɛdze mbuae aasan akɛma ɔman yi a wɔaka akyerɛ
        me, dɛ, Yɛ kɔndua a w’egya dze too hɛn do no harhar no?
      sbs: 0.7008
      gen_sec: 10.4
      ref_sec: 13.72
      cer: 0.1
      wer: 0.2424
    bible_00003:
      source: bible
      text: Na aka kakrabaabi na ebufuhyew no abɔ adze, na n’ebufuw adan ayɛ hɔn sɛɛe.
      sbs: 0.6744
      gen_sec: 6.56
      ref_sec: 6.36
      cer: 0.1034
      wer: 0.5714
    bible_00004:
      source: bible
      text: 'Judamba afamu dze no mu na Simeonmba egyapadze fi: osiandɛ Judamba kyɛpɛn no dɔɔ so dodow
        ma hɔn: dɛm ntsi Simeonmba nyaa egyapadze wɔ hɔn egyapadze no mu.'
      sbs: 0.7168
      gen_sec: 11.68
      ref_sec: 13.48
      cer: 0.624
      wer: 0.6429
    bible_00005:
      source: bible
      text: Aso wɔbɛka w’adɔyɛ akyerɛ wɔ adakamona mu?
      sbs: 0.6842
      gen_sec: 2.64
      ref_sec: 3.18
      cer: 0.0294
      wer: 0.1429
    bible_00006:
      source: bible
      text: Obobu Bɛt-semes a ɔwɔ Egypt asaase do no n’edum no; na ɔdze gya ahyew Egypt abosom efi no
        nyina.
      sbs: 0.6889
      gen_sec: 7.92
      ref_sec: 9.12
      cer: 0.0135
      wer: 0.0526
    bible_00007:
      source: bible
      text: 'Ɔsor so sosɔɔw wɔ Nyankopɔn enyim: Sinai noara mpo wosoow wɔ Nyankopɔn, Israel Nyankopɔn
        no enyim.'
      sbs: 0.6684
      gen_sec: 8.16
      ref_sec: 7.44
      cer: 0.0625
      wer: 0.3125
    bible_00008:
      source: bible
      text: Nna Solomon kaa dɛ, EWURADZE ase dɛ, ɔbɛtsena sum kebii mu.
      sbs: 0.7126
      gen_sec: 4.8
      ref_sec: 4.88
      cer: 0.0652
      wer: 0.2727
    bible_00009:
      source: bible
      text: Na Netania ba Ismael nye mbarimba baawɔtwe fii Karea nsa kɔr Ammonmba no nkyɛn.
      sbs: 0.688
      gen_sec: 6.0
      ref_sec: 6.16
      cer: 0.0308
      wer: 0.2857
    bible_00010:
      source: bible
      text: Dɛm ntsi afei, meserɛ wo, bra, ma memma wo akwankyerɛ, ma edze agye wankasa woho nkwa, na
        wo ba Solomon nkwa.
      sbs: 0.7819
      gen_sec: 9.76
      ref_sec: 8.48
      cer: 0.0
      wer: 0.0952
    bible_00011:
      source: bible
      text: Na sɛ eka hɛn asɛm yi kyerɛ a, ɔnodze, yennkedzi so wɔ wo ntam a ama yɛaka yi ho.
      sbs: 0.7342
      gen_sec: 5.68
      ref_sec: 6.68
      cer: 0.0667
      wer: 0.2632
    bible_00012:
      source: bible
      text: 'Mpo ber a Elnatan na Delaia na Gemaria totɔe serɛɛ ɔhen no dɛ nkyɛ mma ɔnnhyew nwoma mbobɔwee
        no: oenntsie hɔn.'
      sbs: 0.7075
      gen_sec: 9.2
      ref_sec: 10.5
      cer: 0.1236
      wer: 0.4286
    bible_00013:
      source: bible
      text: Na Josua sanee, na Israel nyinara ka no ho, baa nseraban no mu wɔ Gilgal.
      sbs: 0.7597
      gen_sec: 6.08
      ref_sec: 6.38
      cer: 0.0
      wer: 0.1333
    bible_00014:
      source: bible
      text: bɛnantsew hɔn bosom dzin mu nkorkor, na hɛn dze.
      sbs: 0.6386
      gen_sec: 2.96
      ref_sec: 4.1
      cer: 0.1053
      wer: 0.3333
    bible_00015:
      source: bible
      text: Kyɛfa a otsia esuon no bae maa Danmba ebusuakuw dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.701
      gen_sec: 6.8
      ref_sec: 6.76
      cer: 0.1045
      wer: 0.3333
    bible_00016:
      source: bible
      text: Na ɔyɛɛ mbeambea sorɔnsorɔm do adan, na ɔhyɛɛ ɔman no mu binom a wommfi Levimba mu no asɔfo.
      sbs: 0.6108
      gen_sec: 6.4
      ref_sec: 8.48
      cer: 0.1233
      wer: 0.3333
    bible_00017:
      source: bible
      text: 'Hom ntow ndwom mma Nyankopɔn, hom ntow ayɛyindwom mma ne dzin: Hom mbɔ ɔtsempɔn kwan mma
        nyia ɔtse adze do nam sar do no; Ne dzin nye EWURADZE; na hom ndzi n’enyim ehurusi.'
      sbs: 0.7022
      gen_sec: 13.36
      ref_sec: 13.4
      cer: 0.306
      wer: 0.4545
    bible_00018:
      source: bible
      text: 'Nyia ɔbɛtsena kurow yi mu no, obowu afona, na ɔkɔm, na ɔyardɔm ano: na nyia obefir edzi na
        ɔakɔtɔ Kaldeafo a woetwa hom ho mu no, ɔbɛtsena ase, na no nkwa bɛyɛ afonam ama no.'
      sbs: 0.6494
      gen_sec: 14.16
      ref_sec: 14.96
      cer: 0.0752
      wer: 0.2571
    bible_00019:
      source: bible
      text: Nyankopɔn ne tsenabea nyɛ hɛndze no.
      sbs: 0.6813
      gen_sec: 1.84
      ref_sec: 3.16
      cer: 0.0333
      wer: 0.1667
    bible_00020:
      source: bible
      text: Na ɔsee dɛ, Dɛ mbrɛ hom nsɛm yi tse no ara, wɔmma ɔnyɛ hɔ.
      sbs: 0.7189
      gen_sec: 4.56
      ref_sec: 4.36
      cer: 0.0476
      wer: 0.1429
    bible_00021:
      source: bible
      text: Nna Jeremia kasaa kyerɛɛ mbapɔmba nyinara na ɔman no nyinara, dɛ, EWURADZE na ɔsomaa me dɛ
        membɛhyɛ asɛm a hom atse yi nyina ho nkɔm ntsia ofi yi na kurow yi.
      sbs: 0.6696
      gen_sec: 10.48
      ref_sec: 12.98
      cer: 0.032
      wer: 0.1613
    bible_00022:
      source: bible
      text: Mbrɛ gyata a ɔropɔw, na osisi a origyam tse no.
      sbs: 0.634
      gen_sec: 4.08
      ref_sec: 3.74
      cer: 0.0
      wer: 0.2
    bible_00023:
      source: bible
      text: Ana adze yi mo wura ɔhen na ɔyɛe, na annda no edzi annkyerɛ wo nkowaa nyia ɔbɛtsena mo wura
        ɔhen n’ahengua do wɔ n’ekyir a?
      sbs: 0.6899
      gen_sec: 9.12
      ref_sec: 10.44
      cer: 0.0947
      wer: 0.36
    bible_00024:
      source: bible
      text: 'Asodzi afɔr sika, na bɔn ho afɔr sika no dze, wɔammfa ammba Ewuradzefie: ɔyɛ asɔfo no dze.'
      sbs: 0.7141
      gen_sec: 6.32
      ref_sec: 8.26
      cer: 0.1286
      wer: 0.4706
    bible_00025:
      source: bible
      text: 'Na Elija see no dɛ, Mma nnsuro; kɔ kɛyɛ dɛ mbrɛ ase no: mbom dzi kan yɛ bi tatar kakra ma
        me, na fa brɛ me, na n’ekyir no ayɛ ɔwo na wo ba dze.'
      sbs: 0.6415
      gen_sec: 10.88
      ref_sec: 12.8
      cer: 0.0392
      wer: 0.1143
    bible_00026:
      source: bible
      text: Na Silonfo mu; abakan Asaia, na ne mba.
      sbs: 0.6841
      gen_sec: 3.36
      ref_sec: 5.0
      cer: 0.1379
      wer: 0.25
    bible_00027:
      source: bible
      text: Kyɛfa a otsia esia no bae maa Naftalimba no dɛ mbrɛ hɔn ebusua ebusua tsetsee.
      sbs: 0.6583
      gen_sec: 6.08
      ref_sec: 7.04
      cer: 0.0794
      wer: 0.1333
    bible_00028:
      source: bible
      text: Levifo nkurow a ɔwɔ Israelmba hɔn enyadze mu nyinara yɛ nkurow eduanan awɔtwe nye no ho mfikyisaase.
