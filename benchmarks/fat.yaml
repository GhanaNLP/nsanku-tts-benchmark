      ref_sec: 11.1
      cer: 0.087
      wer: 0.24
    bible_00034:
      source: bible
      text: 'Mma hom nnsuro Babilɔnhen a hom suro no no; mma hom nnsuro no, EWURADZE na ɔse: na mowɔ hom
