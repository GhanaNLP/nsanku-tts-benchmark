      sbs: 0.6855
      gen_sec: 7.74
      ref_sec: 11.2
      cer: 0.0706
      wer: 0.1364
    bible_00044:
      source: bible
      text: na woetsiw hɔn dɛ mbepɔw do ntsɛw wɔ mframa mu.
      sbs: 0.7217
      gen_sec: 3.33
      ref_sec: 4.1
      cer: 0.0541
      wer: 0.2
    bible_00045:
      source: bible
      text: Na ɔbaa dɛ, nsɛm yi ekyir no, ɔbaa ofiwura no ne babanyin yaree; na ne yarba no mu yɛɛ dzen
