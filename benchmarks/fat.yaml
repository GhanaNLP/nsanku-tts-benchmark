      gen_sec: 4.97
      ref_sec: 9.74
      cer: 0.0602
      wer: 0.4706
    bible_00029:
      source: bible
      text: Na ɔbaa dɛ adze kyee no, Pasur tuu Jeremia fii dua mu.
