    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.7395
      gen_sec: 6.48
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.7496
      gen_sec: 3.12
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.7058
      gen_sec: 16.24
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.7259
      gen_sec: 6.0
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.661
      gen_sec: 7.2
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.6629
      gen_sec: 7.92
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.7391
      gen_sec: 5.28
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.6443
      gen_sec: 6.32
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.6967
      gen_sec: 3.44
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.6753
      gen_sec: 6.08
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.7551
      gen_sec: 11.92
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.6929
      gen_sec: 6.16
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.6526
      gen_sec: 1.52
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.7549
      gen_sec: 5.6
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.7028
      gen_sec: 5.84
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.7048
      gen_sec: 6.88
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.6965
      gen_sec: 6.72
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.6532
      gen_sec: 4.24
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.6332
      gen_sec: 7.92
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.6478
      gen_sec: 3.84
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.7232
      gen_sec: 3.6
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.6689
      gen_sec: 6.32
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.6403
      gen_sec: 2.56
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.6489
      gen_sec: 3.84
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.6262
      gen_sec: 7.12
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.6412
      gen_sec: 4.08
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.6852
      gen_sec: 5.36
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.7098
      gen_sec: 5.6
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.6746
      gen_sec: 7.68
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.7393
      gen_sec: 8.24
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.6858
      gen_sec: 5.76
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.7092
      gen_sec: 9.04
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.6913
      gen_sec: 3.36
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.7294
      gen_sec: 5.68
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.6553
      gen_sec: 7.84
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.7023
      gen_sec: 6.56
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.6983
      gen_sec: 3.84
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.6516
      gen_sec: 9.2
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.6753
      gen_sec: 9.92
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.6012
      gen_sec: 9.84
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.7133
      gen_sec: 3.92
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.7068
      gen_sec: 5.52
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.6871
      gen_sec: 8.32
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.7204
      gen_sec: 2.8
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.6512
      gen_sec: 7.36
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.6927
      gen_sec: 8.08
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.6836
      gen_sec: 4.08
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.6615
      gen_sec: 8.08
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.7337
      gen_sec: 7.84
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.7062
      gen_sec: 6.32
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.6817
      gen_sec: 4.16
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.7417
      gen_sec: 7.84
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.6809
      gen_sec: 6.56
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.6921
      gen_sec: 2.88
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.706
      gen_sec: 3.52
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.7219
      gen_sec: 7.28
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.6888
      gen_sec: 6.96
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.6538
      gen_sec: 6.64
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.659
      gen_sec: 8.8
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.6931
      gen_sec: 2.8
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.7371
      gen_sec: 8.48
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.7077
      gen_sec: 4.24
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.6329
      gen_sec: 9.6
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.7241
      gen_sec: 5.76
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.6671
      gen_sec: 6.56
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.709
      gen_sec: 6.08
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.7612
      gen_sec: 2.64
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.7279
      gen_sec: 9.84
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.6769
      gen_sec: 3.04
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.7299
      gen_sec: 6.4
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.7209
      gen_sec: 5.76
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.6797
      gen_sec: 5.44
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.7134
      gen_sec: 3.36
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.6294
      gen_sec: 8.88
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.67
      gen_sec: 9.68
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.7099
      gen_sec: 4.72
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.6899
      gen_sec: 1.36
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.6413
      gen_sec: 8.16
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7338
      gen_sec: 3.04
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.6735
      gen_sec: 6.8
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.6734
      gen_sec: 7.04
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.7313
      gen_sec: 10.24
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.721
      gen_sec: 5.52
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.6826
      gen_sec: 7.6
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.7199
      gen_sec: 5.52
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.7032
      gen_sec: 5.2
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.7222
      gen_sec: 4.48
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.6465
      gen_sec: 8.4
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.6587
      gen_sec: 5.12
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.6679
      gen_sec: 3.92
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.6696
      gen_sec: 6.8
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.6651
      gen_sec: 5.76
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.7574
      gen_sec: 5.68
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.6568
      gen_sec: 10.0
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.6949
      gen_sec: 9.52
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.7123
      gen_sec: 6.64
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.6489
      gen_sec: 6.16
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.7536
      gen_sec: 7.28
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.7503
      gen_sec: 3.44
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.713
      gen_sec: 4.32
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.6236
      gen_sec: 5.92
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.6331
      gen_sec: 6.56
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.7051
      gen_sec: 3.6
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.6056
      gen_sec: 6.56
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.6283
      gen_sec: 7.44
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.7152
      gen_sec: 6.24
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.6359
      gen_sec: 3.92
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.6571
      gen_sec: 10.08
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.6979
      gen_sec: 11.28
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.718
      gen_sec: 3.28
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.7187
      gen_sec: 4.24
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.6653
      gen_sec: 6.72
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.6697
      gen_sec: 4.32
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.7145
      gen_sec: 6.32
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.6709
      gen_sec: 2.56
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.7221
      gen_sec: 8.0
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.6928
      gen_sec: 4.16
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.6149
      gen_sec: 5.28
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.6783
      gen_sec: 5.76
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.6605
      gen_sec: 8.16
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.6338
      gen_sec: 2.88
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.6434
      gen_sec: 5.68
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.7323
      gen_sec: 9.76
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.6637
      gen_sec: 8.72
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.695
      gen_sec: 6.56
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.6789
      gen_sec: 6.08
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.7218
      gen_sec: 9.12
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.7294
      gen_sec: 3.68
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.7395
      gen_sec: 9.92
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.7406
      gen_sec: 4.48
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.7438
      gen_sec: 12.64
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.6711
      gen_sec: 7.2
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.6456
      gen_sec: 4.32
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.7293
      gen_sec: 8.4
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.6755
      gen_sec: 10.88
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.6797
      gen_sec: 2.24
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.6316
      gen_sec: 3.76
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.6391
      gen_sec: 8.4
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.6701
      gen_sec: 5.2
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.7061
      gen_sec: 6.08
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.7201
      gen_sec: 5.2
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.6666
      gen_sec: 7.6
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.7019
      gen_sec: 5.92
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.7421
      gen_sec: 7.12
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.7239
      gen_sec: 5.2
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.6804
      gen_sec: 6.56
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.6307
      gen_sec: 1.28
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.6375
      gen_sec: 4.64
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.6867
      gen_sec: 8.72
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.7391
      gen_sec: 5.84
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.6703
      gen_sec: 2.56
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.6911
      gen_sec: 10.96
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.673
      gen_sec: 7.68
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.6485
      gen_sec: 5.68
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.6527
      gen_sec: 1.68
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.7169
      gen_sec: 7.92
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.6383
      gen_sec: 7.04
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.6896
      gen_sec: 4.56
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7439
      gen_sec: 4.56
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.73
      gen_sec: 4.16
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.6947
      gen_sec: 3.28
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.7234
      gen_sec: 4.8
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.747
      gen_sec: 8.8
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.702
      gen_sec: 7.12
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.6639
      gen_sec: 5.36
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.7014
      gen_sec: 4.24
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.682
      gen_sec: 5.36
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.6293
      gen_sec: 5.12
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.701
      gen_sec: 3.68
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.6239
      gen_sec: 6.88
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.7197
      gen_sec: 5.44
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.6711
      gen_sec: 7.04
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.6841
      gen_sec: 4.08
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.663
      gen_sec: 7.28
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.6614
      gen_sec: 6.24
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.6913
      gen_sec: 6.24
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.6459
      gen_sec: 4.64
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.6832
      gen_sec: 3.44
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.6884
      gen_sec: 8.0
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.633
      gen_sec: 7.44
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.7076
      gen_sec: 6.96
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.6512
      gen_sec: 10.64
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.7142
      gen_sec: 4.88
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.6965
      gen_sec: 4.4
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.7068
      gen_sec: 4.88
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.6931
      gen_sec: 6.64
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.6953
      gen_sec: 6.8
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.6793
      gen_sec: 6.64
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.7668
      gen_sec: 6.64
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.703
      gen_sec: 3.92
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.7116
      gen_sec: 4.96
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.6719
      gen_sec: 6.8
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.7032
      gen_sec: 9.6
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.6756
      gen_sec: 7.52
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.6235
      gen_sec: 6.4
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.6477
      gen_sec: 4.8
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.6338
      gen_sec: 9.68
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.6888
      gen_sec: 4.32
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.6885
      gen_sec: 7.2
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.6812
      gen_sec: 11.68
      ref_sec: 9.02
  score: 0.6877
  partial: true
- model: ghananlpcommunity/tekyerema-tts-twi
  sbs: 0.7462
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.7428
      gen_sec: 6.91
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.7508
      gen_sec: 3.87
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.7302
      gen_sec: 12.02
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.782
      gen_sec: 5.22
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.7571
      gen_sec: 6.02
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.7104
      gen_sec: 7.28
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.7289
      gen_sec: 4.85
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.7563
      gen_sec: 6.9
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.7827
      gen_sec: 3.34
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.7384
      gen_sec: 5.44
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.7855
      gen_sec: 8.82
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.7009
      gen_sec: 6.1
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.7792
      gen_sec: 4.35
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.7969
      gen_sec: 5.5
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.7256
      gen_sec: 6.18
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.7149
      gen_sec: 7.38
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.7278
      gen_sec: 7.54
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.5812
      gen_sec: 4.54
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7446
      gen_sec: 9.22
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.7305
      gen_sec: 4.02
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.754
      gen_sec: 4.03
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.7592
      gen_sec: 7.06
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.8186
      gen_sec: 3.74
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.7883
      gen_sec: 3.36
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.7225
      gen_sec: 7.09
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.7151
      gen_sec: 6.29
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.7316
      gen_sec: 6.66
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.7985
      gen_sec: 7.14
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.7479
      gen_sec: 8.75
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.7705
      gen_sec: 6.77
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.7527
      gen_sec: 6.27
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.7085
      gen_sec: 9.17
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.7531
      gen_sec: 4.05
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.8032
      gen_sec: 5.23
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.7048
      gen_sec: 7.28
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.725
      gen_sec: 6.56
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.7844
      gen_sec: 5.17
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.7048
      gen_sec: 7.97
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.7757
      gen_sec: 9.38
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.778
      gen_sec: 8.59
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.7282
      gen_sec: 3.81
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.733
      gen_sec: 5.23
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.7168
      gen_sec: 6.27
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.7169
      gen_sec: 5.01
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.77
      gen_sec: 8.13
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.7814
      gen_sec: 6.82
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.7405
      gen_sec: 4.74
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.7402
      gen_sec: 7.5
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.7541
      gen_sec: 8.03
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.738
      gen_sec: 5.95
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.7838
      gen_sec: 4.35
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.7848
      gen_sec: 5.76
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.7234
      gen_sec: 6.46
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.7396
      gen_sec: 2.83
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.7556
      gen_sec: 3.87
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.7396
      gen_sec: 5.9
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.7819
      gen_sec: 6.0
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.7735
      gen_sec: 6.54
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.7129
      gen_sec: 7.81
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.6184
      gen_sec: 3.89
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.7682
      gen_sec: 8.37
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.7124
      gen_sec: 4.58
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.7561
      gen_sec: 4.69
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.7535
      gen_sec: 4.85
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.7136
      gen_sec: 6.34
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.7502
      gen_sec: 6.51
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.7606
      gen_sec: 4.0
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.7674
      gen_sec: 8.37
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.7409
      gen_sec: 3.79
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.785
      gen_sec: 6.02
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.802
      gen_sec: 6.46
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.7511
      gen_sec: 5.44
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.7352
      gen_sec: 3.89
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.7587
      gen_sec: 9.58
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7513
      gen_sec: 9.87
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.7412
      gen_sec: 5.44
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.7809
      gen_sec: 2.02
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.7225
      gen_sec: 8.7
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7783
      gen_sec: 3.94
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.7145
      gen_sec: 7.73
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.7898
      gen_sec: 5.62
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.7439
      gen_sec: 7.49
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.7867
      gen_sec: 5.86
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.7576
      gen_sec: 5.76
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.7688
      gen_sec: 6.43
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.7408
      gen_sec: 5.01
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.7647
      gen_sec: 6.0
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.7005
      gen_sec: 8.14
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.7498
      gen_sec: 5.46
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.7366
      gen_sec: 5.22
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.7194
      gen_sec: 7.79
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.7598
      gen_sec: 6.06
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.7476
      gen_sec: 5.98
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.7777
      gen_sec: 10.69
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.7938
      gen_sec: 8.83
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.795
      gen_sec: 4.98
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.7262
      gen_sec: 5.18
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.7785
      gen_sec: 5.55
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.7193
      gen_sec: 3.06
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.7465
      gen_sec: 4.88
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.7366
      gen_sec: 4.34
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.7801
      gen_sec: 6.26
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.7227
      gen_sec: 4.48
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.7688
      gen_sec: 5.3
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.7467
      gen_sec: 6.4
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.7751
      gen_sec: 5.97
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.7867
      gen_sec: 4.26
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.7155
      gen_sec: 8.75
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.731
      gen_sec: 9.22
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7579
      gen_sec: 3.7
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.7923
      gen_sec: 4.3
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.7342
      gen_sec: 9.66
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.5726
      gen_sec: 5.38
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.7418
      gen_sec: 6.5
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.6299
      gen_sec: 2.93
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.7933
      gen_sec: 7.87
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.7309
      gen_sec: 4.45
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.6087
      gen_sec: 3.81
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.7207
      gen_sec: 4.34
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.763
      gen_sec: 8.46
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.7767
      gen_sec: 3.62
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.7821
      gen_sec: 6.69
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.725
      gen_sec: 8.66
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.7324
      gen_sec: 8.0
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.7237
      gen_sec: 5.92
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.7417
      gen_sec: 5.79
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.7568
      gen_sec: 7.81
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.7632
      gen_sec: 3.36
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.7793
      gen_sec: 7.82
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.7352
      gen_sec: 4.32
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.7735
      gen_sec: 8.94
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.732
      gen_sec: 6.03
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.7282
      gen_sec: 5.14
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.7201
      gen_sec: 8.48
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.7291
      gen_sec: 8.94
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.6732
      gen_sec: 2.16
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.769
      gen_sec: 4.14
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.7992
      gen_sec: 7.57
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.7758
      gen_sec: 4.11
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.753
      gen_sec: 6.5
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.7819
      gen_sec: 4.13
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.7621
      gen_sec: 7.09
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.7667
      gen_sec: 6.54
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.8242
      gen_sec: 7.65
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.7471
      gen_sec: 5.68
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.748
      gen_sec: 6.59
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.6626
      gen_sec: 1.26
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.7755
      gen_sec: 5.54
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.6943
      gen_sec: 7.95
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.7622
      gen_sec: 5.92
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.7236
      gen_sec: 2.91
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.7392
      gen_sec: 9.65
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.7383
      gen_sec: 6.9
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.716
      gen_sec: 6.67
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.6973
      gen_sec: 2.53
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.7546
      gen_sec: 6.53
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.7124
      gen_sec: 6.35
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.74
      gen_sec: 3.66
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7286
      gen_sec: 4.05
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.7336
      gen_sec: 3.49
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.5905
      gen_sec: 3.18
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.7567
      gen_sec: 4.18
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.7911
      gen_sec: 8.5
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.7879
      gen_sec: 5.97
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.7115
      gen_sec: 7.49
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.7594
      gen_sec: 5.07
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.7996
      gen_sec: 5.54
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.7484
      gen_sec: 5.06
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.7639
      gen_sec: 5.07
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.7537
      gen_sec: 6.21
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.7582
      gen_sec: 5.55
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.7828
      gen_sec: 5.73
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.8028
      gen_sec: 4.13
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.7504
      gen_sec: 6.34
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.7372
      gen_sec: 5.95
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.791
      gen_sec: 5.2
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.7434
      gen_sec: 4.83
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.693
      gen_sec: 3.42
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.763
      gen_sec: 9.38
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.7355
      gen_sec: 4.34
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.7339
      gen_sec: 7.38
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7396
      gen_sec: 8.4
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.7682
      gen_sec: 3.5
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.7531
      gen_sec: 4.72
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.7349
      gen_sec: 4.99
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.7854
      gen_sec: 5.34
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.7722
      gen_sec: 5.52
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7535
      gen_sec: 5.15
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.773
      gen_sec: 7.17
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.7687
      gen_sec: 3.98
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.7481
      gen_sec: 6.88
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.7583
      gen_sec: 6.58
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.7175
      gen_sec: 8.83
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.7863
      gen_sec: 8.72
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.756
      gen_sec: 6.93
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.6884
      gen_sec: 4.99
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.7574
      gen_sec: 6.93
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.7061
      gen_sec: 4.58
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.7661
      gen_sec: 5.47
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7243
      gen_sec: 8.1
      ref_sec: 9.02
  score: 0.7462
  partial: true
- model: multilingual-tts/VITS-OpenBible-Twi-Asante
  sbs: 0.7465
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.7259
      gen_sec: 7.49
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.7419
      gen_sec: 5.52
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.7311
      gen_sec: 13.24
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.7459
      gen_sec: 7.4
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.7681
      gen_sec: 8.26
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.7001
      gen_sec: 8.17
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.7519
      gen_sec: 6.28
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.7547
      gen_sec: 7.71
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.799
      gen_sec: 5.1
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.7561
      gen_sec: 7.5
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.7992
      gen_sec: 10.74
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.7339
      gen_sec: 8.68
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.7818
      gen_sec: 2.79
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.8094
      gen_sec: 6.1
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.7004
      gen_sec: 6.43
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.7044
      gen_sec: 7.8
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.7285
      gen_sec: 8.22
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.5378
      gen_sec: 4.9
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7406
      gen_sec: 10.64
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.7495
      gen_sec: 6.13
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.7747
      gen_sec: 5.42
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.7566
      gen_sec: 8.05
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.7986
      gen_sec: 4.68
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.7691
      gen_sec: 3.97
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.7441
      gen_sec: 8.21
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.7684
      gen_sec: 5.84
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.7469
      gen_sec: 6.46
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.7842
      gen_sec: 7.8
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.7641
      gen_sec: 9.9
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.7184
      gen_sec: 8.39
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.7552
      gen_sec: 7.01
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.7249
      gen_sec: 10.66
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.7478
      gen_sec: 4.08
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.7927
      gen_sec: 5.35
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.7251
      gen_sec: 10.09
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.7029
      gen_sec: 6.55
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.7476
      gen_sec: 6.91
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.7251
      gen_sec: 9.07
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.7742
      gen_sec: 10.64
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.7853
      gen_sec: 10.32
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.7432
      gen_sec: 4.6
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.7254
      gen_sec: 5.09
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.7102
      gen_sec: 8.08
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.7319
      gen_sec: 5.61
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.7492
      gen_sec: 9.36
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.772
      gen_sec: 8.09
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.743
      gen_sec: 5.76
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.7468
      gen_sec: 7.62
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.7431
      gen_sec: 9.85
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.7336
      gen_sec: 6.66
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.7827
      gen_sec: 5.02
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.7607
      gen_sec: 7.9
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.7384
      gen_sec: 7.27
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.7527
      gen_sec: 3.12
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.8082
      gen_sec: 5.38
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.7251
      gen_sec: 6.42
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.7938
      gen_sec: 8.82
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.8027
      gen_sec: 8.72
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.731
      gen_sec: 9.31
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.5689
      gen_sec: 4.6
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.7665
      gen_sec: 8.75
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.7578
      gen_sec: 5.84
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.7441
      gen_sec: 5.84
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.7661
      gen_sec: 7.0
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.6915
      gen_sec: 7.09
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.7562
      gen_sec: 6.72
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.7909
      gen_sec: 6.34
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.7442
      gen_sec: 11.55
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.7504
      gen_sec: 4.4
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.755
      gen_sec: 7.52
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.7979
      gen_sec: 6.24
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.7619
      gen_sec: 6.93
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.7447
      gen_sec: 3.62
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.7549
      gen_sec: 9.86
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.74
      gen_sec: 10.38
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.7383
      gen_sec: 5.79
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.7866
      gen_sec: 2.69
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.7422
      gen_sec: 11.09
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7623
      gen_sec: 4.77
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.6893
      gen_sec: 7.9
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.7347
      gen_sec: 6.58
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.7573
      gen_sec: 8.02
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.7758
      gen_sec: 6.37
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.7436
      gen_sec: 7.33
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.7678
      gen_sec: 7.5
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.7631
      gen_sec: 7.21
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.7845
      gen_sec: 6.27
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.7319
      gen_sec: 8.68
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.7193
      gen_sec: 6.86
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.7341
      gen_sec: 5.14
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.7151
      gen_sec: 8.23
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.7813
      gen_sec: 7.14
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.7391
      gen_sec: 6.83
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.766
      gen_sec: 9.92
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.7796
      gen_sec: 8.99
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.7472
      gen_sec: 6.91
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.7464
      gen_sec: 6.26
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.8084
      gen_sec: 8.16
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.723
      gen_sec: 3.53
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.7061
      gen_sec: 5.77
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.7298
      gen_sec: 4.48
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.7941
      gen_sec: 7.48
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.73
      gen_sec: 5.48
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.7359
      gen_sec: 7.84
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.7613
      gen_sec: 5.61
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.7204
      gen_sec: 6.42
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.7835
      gen_sec: 5.56
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.7172
      gen_sec: 8.79
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.7301
      gen_sec: 10.12
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7748
      gen_sec: 4.93
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.7954
      gen_sec: 4.85
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.7348
      gen_sec: 8.48
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.5932
      gen_sec: 4.8
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.7733
      gen_sec: 7.18
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.5525
      gen_sec: 4.55
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.7955
      gen_sec: 8.87
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.7437
      gen_sec: 5.61
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.5736
      gen_sec: 5.25
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.7057
      gen_sec: 5.19
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.7352
      gen_sec: 8.07
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.775
      gen_sec: 4.19
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.7698
      gen_sec: 7.26
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.7337
      gen_sec: 10.38
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.7318
      gen_sec: 9.18
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.7523
      gen_sec: 7.72
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.7469
      gen_sec: 6.37
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.7807
      gen_sec: 12.81
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.7686
      gen_sec: 4.67
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.7693
      gen_sec: 7.02
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.743
      gen_sec: 5.41
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.7721
      gen_sec: 10.1
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.7373
      gen_sec: 8.02
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.7426
      gen_sec: 7.77
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.6964
      gen_sec: 8.66
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.7175
      gen_sec: 8.2
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.7964
      gen_sec: 3.59
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.7746
      gen_sec: 4.99
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.7895
      gen_sec: 8.56
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.7722
      gen_sec: 3.81
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.7535
      gen_sec: 7.21
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.7581
      gen_sec: 5.68
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.7655
      gen_sec: 7.49
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.7356
      gen_sec: 7.77
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.8311
      gen_sec: 8.48
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.774
      gen_sec: 5.67
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.7553
      gen_sec: 7.73
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.7459
      gen_sec: 2.51
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.7696
      gen_sec: 5.4
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.7325
      gen_sec: 9.89
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.7466
      gen_sec: 7.29
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.7522
      gen_sec: 3.67
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.7419
      gen_sec: 10.98
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.7509
      gen_sec: 8.68
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.7112
      gen_sec: 7.58
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.7792
      gen_sec: 3.07
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.7352
      gen_sec: 6.87
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.7109
      gen_sec: 7.29
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.7226
      gen_sec: 3.58
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.744
      gen_sec: 5.33
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.7266
      gen_sec: 3.76
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.5184
      gen_sec: 3.88
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.733
      gen_sec: 5.02
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.7719
      gen_sec: 9.64
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.7875
      gen_sec: 7.93
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.7418
      gen_sec: 6.75
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.734
      gen_sec: 4.64
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.7662
      gen_sec: 6.37
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.7354
      gen_sec: 6.43
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.7542
      gen_sec: 5.55
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.7559
      gen_sec: 8.08
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.743
      gen_sec: 5.9
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.7754
      gen_sec: 6.72
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.8171
      gen_sec: 6.06
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.7607
      gen_sec: 8.77
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.7551
      gen_sec: 6.8
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.7855
      gen_sec: 5.93
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.7138
      gen_sec: 5.75
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.6371
      gen_sec: 4.12
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.768
      gen_sec: 10.05
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.7421
      gen_sec: 5.4
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.7479
      gen_sec: 8.91
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7198
      gen_sec: 8.44
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.8099
      gen_sec: 4.83
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.7513
      gen_sec: 5.23
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.7631
      gen_sec: 6.8
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.7855
      gen_sec: 7.86
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.7796
      gen_sec: 8.05
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7309
      gen_sec: 4.31
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.7616
      gen_sec: 7.65
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.7706
      gen_sec: 4.02
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.7449
      gen_sec: 7.59
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.7514
      gen_sec: 6.03
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.7362
      gen_sec: 9.75
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.7767
      gen_sec: 9.0
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.7819
      gen_sec: 7.38
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.7113
      gen_sec: 6.03
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.789
      gen_sec: 8.07
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.7382
      gen_sec: 4.67
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.7487
      gen_sec: 7.69
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.723
      gen_sec: 8.87
      ref_sec: 9.02
  score: 0.7465
  partial: true
- model: ghananlpcommunity/stable-twi-tts
  sbs: 0.6757
  num_scored: 106
  uses_reference: false
  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.7001
      gen_sec: 5.09
      ref_sec: 7.14
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.6968
      gen_sec: 6.57
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.7132
      gen_sec: 5.0
      ref_sec: 5.7
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.6732
      gen_sec: 5.67
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.6817
      gen_sec: 8.77
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.6408
      gen_sec: 6.21
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.6802
      gen_sec: 1.54
      ref_sec: 4.56
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.6793
      gen_sec: 5.96
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.6361
      gen_sec: 3.4
      ref_sec: 3.1
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.6773
      gen_sec: 3.39
      ref_sec: 4.04
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.6683
      gen_sec: 6.99
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.6514
      gen_sec: 2.65
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.6416
      gen_sec: 2.5
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.6733
      gen_sec: 6.57
      ref_sec: 7.42
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.6588
      gen_sec: 6.08
      ref_sec: 6.5
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.6833
      gen_sec: 6.78
      ref_sec: 5.62
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.6614
      gen_sec: 3.13
      ref_sec: 3.26
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.6778
      gen_sec: 6.25
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.6891
      gen_sec: 3.8
      ref_sec: 4.2
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.6728
      gen_sec: 9.66
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.674
      gen_sec: 6.59
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.6852
      gen_sec: 3.23
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.6966
      gen_sec: 4.46
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.655
      gen_sec: 5.28
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.6799
      gen_sec: 3.45
      ref_sec: 4.24
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.6633
      gen_sec: 5.47
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.6955
      gen_sec: 3.66
      ref_sec: 4.86
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.7055
      gen_sec: 5.55
      ref_sec: 4.32
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.6819
      gen_sec: 2.6
      ref_sec: 3.38
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.6738
      gen_sec: 5.07
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.6952
      gen_sec: 6.55
      ref_sec: 5.58
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.6477
      gen_sec: 5.76
      ref_sec: 9.26
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.6464
      gen_sec: 4.14
      ref_sec: 6.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.708
      gen_sec: 4.97
      ref_sec: 4.22
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.7013
      gen_sec: 5.22
      ref_sec: 7.26
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.6999
      gen_sec: 5.97
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.6763
      gen_sec: 4.71
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.6605
      gen_sec: 3.48
      ref_sec: 3.36
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.6993
      gen_sec: 3.0
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.6618
      gen_sec: 5.93
      ref_sec: 7.62
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.7028
      gen_sec: 7.41
      ref_sec: 8.9
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.655
      gen_sec: 5.2
      ref_sec: 5.94
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.6896
      gen_sec: 5.82
      ref_sec: 6.48
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.6421
      gen_sec: 3.68
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.6532
      gen_sec: 3.1
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.6657
      gen_sec: 6.06
      ref_sec: 7.24
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.677
      gen_sec: 5.2
      ref_sec: 6.34
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.6783
      gen_sec: 3.63
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.6928
      gen_sec: 4.63
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.7
      gen_sec: 5.89
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.6792
      gen_sec: 2.12
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.6656
      gen_sec: 3.7
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.6642
      gen_sec: 3.31
      ref_sec: 4.6
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.6886
      gen_sec: 5.33
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.6479
      gen_sec: 4.01
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.6843
      gen_sec: 4.19
      ref_sec: 5.02
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7046
      gen_sec: 2.86
      ref_sec: 3.3
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.6016
      gen_sec: 4.81
      ref_sec: 4.04
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.6706
      gen_sec: 3.22
      ref_sec: 3.52
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.6661
      gen_sec: 5.77
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.6926
      gen_sec: 3.07
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.6986
      gen_sec: 6.11
      ref_sec: 6.7
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.6822
      gen_sec: 7.17
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.6979
      gen_sec: 5.29
      ref_sec: 7.32
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.6828
      gen_sec: 7.09
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.685
      gen_sec: 2.95
      ref_sec: 4.2
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.6821
      gen_sec: 5.35
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.6801
      gen_sec: 3.76
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.677
      gen_sec: 6.35
      ref_sec: 8.12
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.6786
      gen_sec: 1.39
      ref_sec: 4.34
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.6606
      gen_sec: 3.12
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.6543
      gen_sec: 5.29
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.695
      gen_sec: 3.52
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.6793
      gen_sec: 5.71
      ref_sec: 7.8
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.6667
      gen_sec: 4.33
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.673
      gen_sec: 7.52
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.6549
      gen_sec: 5.32
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.6564
      gen_sec: 1.7
      ref_sec: 3.04
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.6704
      gen_sec: 5.34
      ref_sec: 5.98
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.6708
      gen_sec: 1.49
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.6684
      gen_sec: 5.06
      ref_sec: 6.68
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.6788
      gen_sec: 3.12
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.6831
      gen_sec: 3.17
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.6622
      gen_sec: 2.64
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.6941
      gen_sec: 2.3
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.6608
      gen_sec: 2.59
      ref_sec: 3.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.674
      gen_sec: 5.94
      ref_sec: 5.62
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.654
      gen_sec: 4.56
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.6722
      gen_sec: 4.09
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.6846
      gen_sec: 3.61
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.6707
      gen_sec: 6.36
      ref_sec: 14.16
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.6836
      gen_sec: 5.6
      ref_sec: 5.14
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.6824
      gen_sec: 6.04
      ref_sec: 5.86
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.6465
      gen_sec: 3.16
      ref_sec: 3.14
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.7076
      gen_sec: 3.03
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.7085
      gen_sec: 3.72
      ref_sec: 5.22
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.6983
      gen_sec: 5.76
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.6463
      gen_sec: 4.96
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.6592
      gen_sec: 2.96
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.7065
      gen_sec: 7.5
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.7018
      gen_sec: 2.74
      ref_sec: 5.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.6602
      gen_sec: 4.99
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.6548
      gen_sec: 6.79
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.6906
      gen_sec: 7.78
      ref_sec: 6.46
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.6595
      gen_sec: 3.89
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.6888
      gen_sec: 4.5
      ref_sec: 4.6
  score: 0.6757
  partial: true
- model: ghananlpcommunity/F5-TTS-OpenBible-Twi-Asante-ref
  sbs: 0.744
  num_scored: 200
  uses_reference: true
  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.7586
      gen_sec: 6.11
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.772
      gen_sec: 2.92
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.7092
      gen_sec: 7.42
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.7678
      gen_sec: 3.9
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.7686
      gen_sec: 4.19
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.7302
      gen_sec: 5.38
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.7451
      gen_sec: 3.56
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.7278
      gen_sec: 4.83
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.7936
      gen_sec: 2.83
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.7243
      gen_sec: 4.68
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.7415
      gen_sec: 6.06
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.744
      gen_sec: 4.89
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.7607
      gen_sec: 1.6
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.7793
      gen_sec: 4.39
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.666
      gen_sec: 3.85
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.7168
      gen_sec: 5.61
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.7279
      gen_sec: 5.32
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.5844
      gen_sec: 2.83
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7456
      gen_sec: 6.25
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.7256
      gen_sec: 3.22
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.7928
      gen_sec: 3.17
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.7824
      gen_sec: 4.98
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.8029
      gen_sec: 2.38
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.7571
      gen_sec: 2.28
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.7381
      gen_sec: 5.27
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.7898
      gen_sec: 3.22
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.734
      gen_sec: 4.59
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.7781
      gen_sec: 5.27
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.7448
      gen_sec: 6.5
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.7427
      gen_sec: 5.38
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.7666
      gen_sec: 4.68
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.7131
      gen_sec: 7.23
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.7914
      gen_sec: 2.49
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.8015
      gen_sec: 3.85
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.7393
      gen_sec: 5.96
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.727
      gen_sec: 4.78
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.7452
      gen_sec: 3.61
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.7135
      gen_sec: 5.81
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.7771
      gen_sec: 7.38
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.7521
      gen_sec: 5.51
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.759
      gen_sec: 2.43
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.7286
      gen_sec: 3.46
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.7293
      gen_sec: 5.27
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.7274
      gen_sec: 2.92
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.7522
      gen_sec: 6.06
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.6978
      gen_sec: 5.08
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.7383
      gen_sec: 3.51
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.7402
      gen_sec: 5.23
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.7638
      gen_sec: 6.65
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.7653
      gen_sec: 4.98
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.7548
      gen_sec: 3.46
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.7612
      gen_sec: 4.25
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.7246
      gen_sec: 4.39
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.734
      gen_sec: 2.14
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.7661
      gen_sec: 3.17
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.7176
      gen_sec: 4.34
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.7816
      gen_sec: 5.13
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.7987
      gen_sec: 5.42
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.6831
      gen_sec: 4.78
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.606
      gen_sec: 2.73
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.7262
      gen_sec: 6.15
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.7561
      gen_sec: 3.22
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.7457
      gen_sec: 4.25
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.7408
      gen_sec: 3.95
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.7428
      gen_sec: 4.53
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.7266
      gen_sec: 4.19
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.7907
      gen_sec: 2.98
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.7878
      gen_sec: 6.84
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.7373
      gen_sec: 2.73
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.7577
      gen_sec: 4.74
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.7764
      gen_sec: 4.34
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.7307
      gen_sec: 4.0
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.7776
      gen_sec: 2.98
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.7475
      gen_sec: 6.89
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7463
      gen_sec: 6.25
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.7513
      gen_sec: 4.19
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.7448
      gen_sec: 1.7
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.7475
      gen_sec: 6.55
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7433
      gen_sec: 2.77
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.7058
      gen_sec: 5.51
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.7838
      gen_sec: 4.39
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.7486
      gen_sec: 6.01
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.7627
      gen_sec: 4.53
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.7185
      gen_sec: 4.68
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.759
      gen_sec: 4.93
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.7435
      gen_sec: 3.85
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.803
      gen_sec: 4.39
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.7104
      gen_sec: 6.4
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.7524
      gen_sec: 3.61
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.7436
      gen_sec: 3.11
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.7318
      gen_sec: 5.02
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.7863
      gen_sec: 4.25
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.7498
      gen_sec: 4.59
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.7355
      gen_sec: 7.57
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.759
      gen_sec: 6.84
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.774
      gen_sec: 4.1
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.7336
      gen_sec: 2.87
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.7913
      gen_sec: 4.05
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.7213
      gen_sec: 2.49
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.7448
      gen_sec: 3.36
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.7168
      gen_sec: 3.22
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.7402
      gen_sec: 4.44
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.7828
      gen_sec: 3.56
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.7503
      gen_sec: 4.05
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.7163
      gen_sec: 3.56
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.7579
      gen_sec: 3.7
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.7537
      gen_sec: 2.68
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.7203
      gen_sec: 6.99
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.7348
      gen_sec: 6.25
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7601
      gen_sec: 2.77
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.7649
      gen_sec: 3.17
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.7072
      gen_sec: 6.15
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.5699
      gen_sec: 3.46
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.7921
      gen_sec: 5.66
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.5484
      gen_sec: 2.73
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.7972
      gen_sec: 6.15
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.735
      gen_sec: 2.98
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.5942
      gen_sec: 2.92
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.7227
      gen_sec: 3.66
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.7742
      gen_sec: 4.74
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.768
      gen_sec: 2.49
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.728
      gen_sec: 4.59
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.7499
      gen_sec: 6.89
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.7369
      gen_sec: 6.3
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.718
      gen_sec: 4.74
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.7625
      gen_sec: 4.49
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.7515
      gen_sec: 5.96
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.7607
      gen_sec: 2.73
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.7985
      gen_sec: 5.61
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.7507
      gen_sec: 2.62
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.738
      gen_sec: 6.55
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.7425
      gen_sec: 4.3
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.7404
      gen_sec: 3.85
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.7409
      gen_sec: 5.61
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.7433
      gen_sec: 6.3
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.7704
      gen_sec: 1.6
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.7679
      gen_sec: 2.49
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.7344
      gen_sec: 6.01
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.7515
      gen_sec: 2.58
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.785
      gen_sec: 5.38
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.7982
      gen_sec: 3.46
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.7425
      gen_sec: 5.02
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.7797
      gen_sec: 4.93
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.7263
      gen_sec: 5.08
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.7621
      gen_sec: 3.75
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.7696
      gen_sec: 4.39
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.7227
      gen_sec: 1.41
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.7426
      gen_sec: 3.95
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.7402
      gen_sec: 6.55
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.7599
      gen_sec: 4.89
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.7814
      gen_sec: 1.79
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.7197
      gen_sec: 7.57
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.77
      gen_sec: 5.23
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.7289
      gen_sec: 5.23
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.7787
      gen_sec: 1.65
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.7222
      gen_sec: 4.78
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.7373
      gen_sec: 5.08
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.7001
      gen_sec: 2.34
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7225
      gen_sec: 3.11
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.716
      gen_sec: 2.28
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.5597
      gen_sec: 2.14
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.6992
      gen_sec: 2.43
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.7631
      gen_sec: 6.15
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.765
      gen_sec: 4.89
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.7237
      gen_sec: 3.95
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.7471
      gen_sec: 3.02
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.7533
      gen_sec: 3.85
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.7451
      gen_sec: 3.75
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.7439
      gen_sec: 2.92
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.747
      gen_sec: 5.08
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.771
      gen_sec: 4.1
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.7824
      gen_sec: 4.78
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.7406
      gen_sec: 2.92
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.7388
      gen_sec: 6.06
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.7549
      gen_sec: 4.05
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.7775
      gen_sec: 4.05
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.7305
      gen_sec: 3.66
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.6168
      gen_sec: 2.87
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.7527
      gen_sec: 6.15
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.7573
      gen_sec: 3.07
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.7332
      gen_sec: 5.32
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7261
      gen_sec: 5.57
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.7853
      gen_sec: 2.38
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.7562
      gen_sec: 3.46
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.8004
      gen_sec: 3.41
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.7806
      gen_sec: 4.3
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.7781
      gen_sec: 4.15
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7274
      gen_sec: 3.11
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.7804
      gen_sec: 5.17
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.8149
      gen_sec: 2.28
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.7306
      gen_sec: 4.34
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.7687
      gen_sec: 4.68
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.725
      gen_sec: 5.91
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.7676
      gen_sec: 5.81
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.7809
      gen_sec: 4.3
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.7166
      gen_sec: 3.81
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.7453
      gen_sec: 5.02
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.7309
      gen_sec: 3.22
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.7213
      gen_sec: 4.15
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7221
      gen_sec: 5.57
      ref_sec: 9.02
