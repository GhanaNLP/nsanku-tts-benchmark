  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.7355
      gen_sec: 7.04
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.797
      gen_sec: 3.52
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.7608
      gen_sec: 12.48
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.7959
      gen_sec: 4.48
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.7548
      gen_sec: 5.84
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.7403
      gen_sec: 6.88
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.757
      gen_sec: 4.4
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.7536
      gen_sec: 5.52
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.7987
      gen_sec: 3.36
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.7803
      gen_sec: 6.24
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.8273
      gen_sec: 10.56
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.7071
      gen_sec: 5.84
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.7385
      gen_sec: 2.0
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.8032
      gen_sec: 5.04
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.6961
      gen_sec: 4.48
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.7025
      gen_sec: 6.56
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.7281
      gen_sec: 5.84
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.5995
      gen_sec: 3.92
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7464
      gen_sec: 7.92
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.7336
      gen_sec: 3.12
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.7697
      gen_sec: 3.52
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.7814
      gen_sec: 6.32
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.7841
      gen_sec: 2.96
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.6923
      gen_sec: 2.72
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.7219
      gen_sec: 6.32
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.7622
      gen_sec: 4.24
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.773
      gen_sec: 5.92
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.8044
      gen_sec: 6.4
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.7681
      gen_sec: 6.8
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.7934
      gen_sec: 6.08
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.7274
      gen_sec: 5.36
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.7149
      gen_sec: 8.24
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.7552
      gen_sec: 3.44
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.812
      gen_sec: 5.12
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.7109
      gen_sec: 6.64
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.7231
      gen_sec: 5.84
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.8012
      gen_sec: 4.4
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.6995
      gen_sec: 7.2
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.8119
      gen_sec: 9.52
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.7529
      gen_sec: 6.56
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.7278
      gen_sec: 3.36
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.7203
      gen_sec: 4.56
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.7234
      gen_sec: 6.24
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.7222
      gen_sec: 4.16
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.7589
      gen_sec: 7.6
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.7104
      gen_sec: 6.08
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.7377
      gen_sec: 4.16
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.7505
      gen_sec: 6.64
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.7549
      gen_sec: 7.04
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.7697
      gen_sec: 5.84
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.8088
      gen_sec: 3.92
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.7958
      gen_sec: 5.12
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.7372
      gen_sec: 5.84
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.755
      gen_sec: 2.96
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.7642
      gen_sec: 4.32
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.7609
      gen_sec: 6.8
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.8011
      gen_sec: 6.72
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.7864
      gen_sec: 6.96
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.7242
      gen_sec: 6.96
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.6346
      gen_sec: 3.04
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.7677
      gen_sec: 8.32
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.7655
      gen_sec: 4.88
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.779
      gen_sec: 4.96
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.763
      gen_sec: 4.32
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.7642
      gen_sec: 5.6
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.7183
      gen_sec: 5.36
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.7849
      gen_sec: 4.8
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.7957
      gen_sec: 8.16
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.7566
      gen_sec: 3.68
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.7821
      gen_sec: 6.08
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.8069
      gen_sec: 5.44
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.7438
      gen_sec: 5.44
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.7797
      gen_sec: 3.28
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.7532
      gen_sec: 9.52
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7368
      gen_sec: 7.52
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.7618
      gen_sec: 4.72
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.7647
      gen_sec: 2.16
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.7246
      gen_sec: 7.36
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7734
      gen_sec: 3.6
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.7091
      gen_sec: 5.68
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.7928
      gen_sec: 5.36
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.7568
      gen_sec: 8.16
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.8154
      gen_sec: 5.36
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.7504
      gen_sec: 6.0
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.7807
      gen_sec: 6.32
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.7538
      gen_sec: 6.0
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.8053
      gen_sec: 4.8
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.7173
      gen_sec: 9.76
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.7522
      gen_sec: 4.96
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.7491
      gen_sec: 3.6
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.7066
      gen_sec: 5.92
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.7777
      gen_sec: 5.92
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.7431
      gen_sec: 6.0
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.7963
      gen_sec: 9.44
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.7846
      gen_sec: 8.32
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.7549
      gen_sec: 4.32
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.8023
      gen_sec: 4.72
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.7929
      gen_sec: 5.6
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.7176
      gen_sec: 2.8
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.7641
      gen_sec: 4.0
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.7487
      gen_sec: 3.84
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.7723
      gen_sec: 5.52
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.8018
      gen_sec: 4.0
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.7803
      gen_sec: 5.28
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.7807
      gen_sec: 4.32
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.7668
      gen_sec: 5.04
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.7824
      gen_sec: 4.24
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.7269
      gen_sec: 8.16
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.728
      gen_sec: 7.36
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7849
      gen_sec: 3.68
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.795
      gen_sec: 4.0
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.7267
      gen_sec: 7.36
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.5995
      gen_sec: 4.16
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.7904
      gen_sec: 6.16
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.6132
      gen_sec: 3.52
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.7733
      gen_sec: 6.32
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.7283
      gen_sec: 3.6
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.6062
      gen_sec: 3.76
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.7348
      gen_sec: 4.48
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.7972
      gen_sec: 6.4
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.8034
      gen_sec: 3.68
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.7665
      gen_sec: 7.12
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.7272
      gen_sec: 7.92
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.7403
      gen_sec: 8.72
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.732
      gen_sec: 5.44
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.7449
      gen_sec: 5.52
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.7331
      gen_sec: 6.48
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.7572
      gen_sec: 4.0
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.7831
      gen_sec: 6.4
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.7311
      gen_sec: 4.16
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.7968
      gen_sec: 8.08
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.7464
      gen_sec: 5.68
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.74
      gen_sec: 5.04
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.7034
      gen_sec: 7.28
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.7291
      gen_sec: 7.6
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.7386
      gen_sec: 2.16
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.762
      gen_sec: 3.6
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.7387
      gen_sec: 7.68
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.789
      gen_sec: 4.24
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.788
      gen_sec: 6.0
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.8059
      gen_sec: 4.0
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.7766
      gen_sec: 7.84
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.795
      gen_sec: 5.36
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.7575
      gen_sec: 6.4
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.7629
      gen_sec: 5.04
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.7679
      gen_sec: 5.76
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.7196
      gen_sec: 1.84
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.8011
      gen_sec: 4.72
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.7279
      gen_sec: 7.2
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.7884
      gen_sec: 5.28
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.7273
      gen_sec: 2.32
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.7348
      gen_sec: 9.12
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.7918
      gen_sec: 5.84
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.7104
      gen_sec: 6.08
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.7343
      gen_sec: 2.24
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.74
      gen_sec: 5.84
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.7199
      gen_sec: 6.16
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.7052
      gen_sec: 2.8
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7403
      gen_sec: 3.68
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.7339
      gen_sec: 2.88
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.6173
      gen_sec: 2.72
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.747
      gen_sec: 2.88
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.8066
      gen_sec: 8.16
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.8004
      gen_sec: 6.8
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.7149
      gen_sec: 4.72
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.7253
      gen_sec: 4.0
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.723
      gen_sec: 5.04
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.7439
      gen_sec: 5.12
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.7713
      gen_sec: 5.04
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.7568
      gen_sec: 5.92
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.778
      gen_sec: 5.12
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.7886
      gen_sec: 6.0
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.7155
      gen_sec: 3.36
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.7516
      gen_sec: 5.92
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.7328
      gen_sec: 5.68
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.799
      gen_sec: 5.04
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.7685
      gen_sec: 4.08
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.7101
      gen_sec: 3.2
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.7493
      gen_sec: 6.56
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.7559
      gen_sec: 3.68
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.7312
      gen_sec: 6.96
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7211
      gen_sec: 7.68
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.7999
      gen_sec: 3.36
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.776
      gen_sec: 4.32
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.7993
      gen_sec: 4.56
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.7996
      gen_sec: 4.72
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.8049
      gen_sec: 5.68
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7328
      gen_sec: 3.68
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.7922
      gen_sec: 6.16
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.749
      gen_sec: 3.36
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.7334
      gen_sec: 5.52
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.7769
      gen_sec: 5.04
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.7212
      gen_sec: 8.24
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.6858
      gen_sec: 24.64
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.7692
      gen_sec: 5.12
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.6746
      gen_sec: 4.48
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.7937
      gen_sec: 7.2
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.729
      gen_sec: 4.0
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.7781
      gen_sec: 4.72
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7331
      gen_sec: 8.8
      ref_sec: 9.02
  score: 0.753
  partial: true
- model: ghananlpcommunity/ghana-tts-36k-ref
  sbs: 0.7392
  num_scored: 200
  uses_reference: true
  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.7424
      gen_sec: 6.72
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.7596
      gen_sec: 3.2
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.7358
      gen_sec: 12.24
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.796
      gen_sec: 4.96
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.7403
      gen_sec: 5.76
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.7033
      gen_sec: 6.08
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.7094
      gen_sec: 4.64
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.7422
      gen_sec: 6.0
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.8014
      gen_sec: 3.28
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.7846
      gen_sec: 6.16
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.781
      gen_sec: 8.72
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.7048
      gen_sec: 6.0
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.7021
      gen_sec: 2.0
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.7916
      gen_sec: 4.96
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.6814
      gen_sec: 4.32
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.692
      gen_sec: 6.24
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.7161
      gen_sec: 6.08
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.6093
      gen_sec: 3.76
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7085
      gen_sec: 6.88
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.7087
      gen_sec: 3.68
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.75
      gen_sec: 4.0
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.7697
      gen_sec: 6.56
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.7996
      gen_sec: 3.28
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.6854
      gen_sec: 2.96
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.6902
      gen_sec: 8.48
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.7402
      gen_sec: 4.4
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.7196
      gen_sec: 5.36
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.777
      gen_sec: 5.44
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.7689
      gen_sec: 7.12
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.7822
      gen_sec: 6.8
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.7322
      gen_sec: 5.44
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.6869
      gen_sec: 8.8
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.7493
      gen_sec: 3.04
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.7866
      gen_sec: 4.4
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.6893
      gen_sec: 6.88
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.7082
      gen_sec: 5.76
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.779
      gen_sec: 4.0
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.6944
      gen_sec: 6.72
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.7857
      gen_sec: 8.56
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.7338
      gen_sec: 6.72
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.6984
      gen_sec: 3.28
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.7192
      gen_sec: 4.56
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.7002
      gen_sec: 6.16
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.7096
      gen_sec: 4.16
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.745
      gen_sec: 7.04
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.6883
      gen_sec: 6.64
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.7327
      gen_sec: 4.24
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.7177
      gen_sec: 6.32
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.7452
      gen_sec: 7.84
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.7508
      gen_sec: 5.52
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.8014
      gen_sec: 4.0
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.7911
      gen_sec: 4.56
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.7308
      gen_sec: 5.36
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.7512
      gen_sec: 2.88
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.7209
      gen_sec: 3.52
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.729
      gen_sec: 5.28
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.7962
      gen_sec: 6.96
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.7625
      gen_sec: 6.32
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.702
      gen_sec: 6.08
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.6458
      gen_sec: 2.96
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.7402
      gen_sec: 7.68
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.7411
      gen_sec: 4.96
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.7632
      gen_sec: 4.96
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.7365
      gen_sec: 4.56
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.7535
      gen_sec: 6.72
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.7214
      gen_sec: 5.6
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.7693
      gen_sec: 3.6
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.7862
      gen_sec: 8.32
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.7254
      gen_sec: 3.36
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.7729
      gen_sec: 5.76
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.8153
      gen_sec: 5.2
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.7299
      gen_sec: 5.36
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.7703
      gen_sec: 3.6
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.7376
      gen_sec: 8.56
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7347
      gen_sec: 7.76
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.735
      gen_sec: 5.2
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.77
      gen_sec: 2.24
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.7086
      gen_sec: 7.84
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7518
      gen_sec: 3.36
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.6899
      gen_sec: 6.4
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.7823
      gen_sec: 5.28
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.7391
      gen_sec: 7.76
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.7991
      gen_sec: 5.36
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.7386
      gen_sec: 5.52
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.75
      gen_sec: 5.92
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.729
      gen_sec: 5.6
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.7995
      gen_sec: 4.96
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.7018
      gen_sec: 8.48
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.7496
      gen_sec: 4.4
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.7542
      gen_sec: 3.44
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.7
      gen_sec: 6.32
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.7504
      gen_sec: 5.36
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.7331
      gen_sec: 5.36
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.7732
      gen_sec: 9.6
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.7578
      gen_sec: 7.04
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.739
      gen_sec: 4.08
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.802
      gen_sec: 5.44
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.7719
      gen_sec: 4.96
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.7129
      gen_sec: 2.72
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.7757
      gen_sec: 4.0
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.7343
      gen_sec: 4.48
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.7707
      gen_sec: 5.6
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.7996
      gen_sec: 4.24
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.7691
      gen_sec: 4.96
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.7813
      gen_sec: 4.4
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.7695
      gen_sec: 6.08
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.7382
      gen_sec: 3.44
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.7121
      gen_sec: 7.68
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.7355
      gen_sec: 8.0
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.75
      gen_sec: 3.44
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.7935
      gen_sec: 3.68
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.716
      gen_sec: 6.96
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.6062
      gen_sec: 4.4
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.7676
      gen_sec: 6.16
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.6362
      gen_sec: 2.96
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.7824
      gen_sec: 6.72
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.728
      gen_sec: 3.44
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.5982
      gen_sec: 4.56
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.7231
      gen_sec: 4.08
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.7763
      gen_sec: 6.24
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.799
      gen_sec: 3.76
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.7549
      gen_sec: 6.24
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.7154
      gen_sec: 8.32
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.7066
      gen_sec: 7.68
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.7206
      gen_sec: 5.52
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.7111
      gen_sec: 5.2
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.7104
      gen_sec: 6.24
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.7531
      gen_sec: 3.6
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.7717
      gen_sec: 6.32
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.6896
      gen_sec: 3.6
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.7949
      gen_sec: 8.16
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.7413
      gen_sec: 5.76
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.7162
      gen_sec: 4.4
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.6827
      gen_sec: 6.96
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.7159
      gen_sec: 7.28
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.7347
      gen_sec: 2.16
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.7152
      gen_sec: 3.28
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.7256
      gen_sec: 7.76
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.7567
      gen_sec: 3.76
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.7678
      gen_sec: 5.6
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.7904
      gen_sec: 3.84
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.7578
      gen_sec: 6.96
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.775
      gen_sec: 5.12
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.7386
      gen_sec: 6.4
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.7589
      gen_sec: 5.2
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.7424
      gen_sec: 5.28
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.6834
      gen_sec: 1.44
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.7966
      gen_sec: 4.96
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.7026
      gen_sec: 6.56
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.7906
      gen_sec: 5.52
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.7229
      gen_sec: 2.4
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.7429
      gen_sec: 9.68
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.7811
      gen_sec: 6.24
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.6938
      gen_sec: 5.68
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.7067
      gen_sec: 2.08
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.7191
      gen_sec: 6.64
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.7045
      gen_sec: 6.32
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.7121
      gen_sec: 3.2
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7221
      gen_sec: 3.6
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.714
      gen_sec: 2.8
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.6028
      gen_sec: 2.72
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.7194
      gen_sec: 2.96
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.7976
      gen_sec: 8.0
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.7931
      gen_sec: 5.92
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.7409
      gen_sec: 5.6
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.7152
      gen_sec: 4.32
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.7252
      gen_sec: 4.96
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.7236
      gen_sec: 4.24
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.7252
      gen_sec: 4.08
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.7483
      gen_sec: 6.16
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.7492
      gen_sec: 5.12
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.7786
      gen_sec: 5.28
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.7105
      gen_sec: 3.28
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.7295
      gen_sec: 5.92
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.715
      gen_sec: 5.12
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.8036
      gen_sec: 5.44
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.7613
      gen_sec: 4.16
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.7069
      gen_sec: 3.36
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.7503
      gen_sec: 6.96
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.7043
      gen_sec: 3.04
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.7242
      gen_sec: 6.64
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7293
      gen_sec: 8.32
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.8158
      gen_sec: 3.6
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.755
      gen_sec: 4.4
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.7861
      gen_sec: 4.64
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.7865
      gen_sec: 4.88
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.7913
      gen_sec: 5.84
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7258
      gen_sec: 3.68
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.7773
      gen_sec: 6.48
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.724
      gen_sec: 3.2
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.6957
      gen_sec: 4.72
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.7602
      gen_sec: 5.36
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.7051
      gen_sec: 7.68
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.773
      gen_sec: 6.88
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.7749
      gen_sec: 6.16
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.6721
      gen_sec: 4.4
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.7605
      gen_sec: 7.28
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.7124
      gen_sec: 3.36
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.7549
      gen_sec: 4.8
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7041
      gen_sec: 8.24
      ref_sec: 9.02
  score: 0.7392
  partial: true
- model: KhayaAI/khaya-tts-v2
  sbs: 0.6939
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.7006
      gen_sec: 6.08
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.7232
      gen_sec: 3.04
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.6737
      gen_sec: 10.24
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.6982
      gen_sec: 4.58
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.693
      gen_sec: 5.02
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.6832
      gen_sec: 6.78
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.6821
      gen_sec: 4.0
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.7022
      gen_sec: 5.54
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.7587
      gen_sec: 2.94
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.7145
      gen_sec: 5.73
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.7094
      gen_sec: 7.94
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.6552
      gen_sec: 5.98
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.7043
      gen_sec: 1.98
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.7088
      gen_sec: 4.77
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.6808
      gen_sec: 4.67
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.6551
      gen_sec: 6.69
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.6914
      gen_sec: 6.08
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.6486
      gen_sec: 3.3
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.6787
      gen_sec: 7.39
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.6804
      gen_sec: 3.58
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.7249
      gen_sec: 3.23
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.7047
      gen_sec: 6.24
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.7262
      gen_sec: 3.01
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.6637
      gen_sec: 2.75
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.6779
      gen_sec: 6.5
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.6726
      gen_sec: 3.58
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.6909
      gen_sec: 5.38
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.7187
      gen_sec: 6.11
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.6887
      gen_sec: 7.58
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.6871
      gen_sec: 6.14
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.6914
      gen_sec: 5.54
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.6739
      gen_sec: 8.74
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.6779
      gen_sec: 2.69
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.7132
      gen_sec: 4.29
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.6657
      gen_sec: 7.46
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.6735
      gen_sec: 5.7
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.723
      gen_sec: 4.38
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.676
      gen_sec: 7.65
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.7225
      gen_sec: 8.74
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.6989
      gen_sec: 6.3
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.6693
      gen_sec: 2.78
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.6836
      gen_sec: 4.45
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.6733
      gen_sec: 6.24
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.6948
      gen_sec: 3.74
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.6974
      gen_sec: 7.01
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.6717
      gen_sec: 5.41
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.6788
      gen_sec: 3.39
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.6822
      gen_sec: 6.34
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.6924
      gen_sec: 8.42
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.7146
      gen_sec: 5.31
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.7248
      gen_sec: 3.84
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.7408
      gen_sec: 4.54
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.6913
      gen_sec: 5.09
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.7158
      gen_sec: 2.72
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.6989
      gen_sec: 3.65
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.6786
      gen_sec: 5.15
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.7234
      gen_sec: 5.7
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.7009
      gen_sec: 5.18
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.6783
      gen_sec: 6.18
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.6562
      gen_sec: 3.17
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.7012
      gen_sec: 6.94
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.6984
      gen_sec: 4.58
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.7074
      gen_sec: 4.67
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.6944
      gen_sec: 4.67
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.7082
      gen_sec: 5.82
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.6799
      gen_sec: 5.12
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.7116
      gen_sec: 3.2
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.7124
      gen_sec: 8.45
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.6935
      gen_sec: 2.78
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.7068
      gen_sec: 5.47
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.7299
      gen_sec: 5.09
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.6796
      gen_sec: 5.06
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.7125
      gen_sec: 3.68
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.6846
      gen_sec: 7.84
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.68
      gen_sec: 7.39
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.7001
      gen_sec: 4.67
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.7021
      gen_sec: 1.95
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.6773
      gen_sec: 7.42
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.6984
      gen_sec: 2.98
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.6579
      gen_sec: 6.72
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.7231
      gen_sec: 5.18
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.6959
      gen_sec: 6.37
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.7133
      gen_sec: 5.18
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.6836
      gen_sec: 5.5
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.6938
      gen_sec: 5.54
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.6894
      gen_sec: 4.38
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.7222
      gen_sec: 5.25
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.6702
      gen_sec: 7.55
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.683
      gen_sec: 4.35
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.7113
      gen_sec: 3.81
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.674
      gen_sec: 5.98
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.6974
      gen_sec: 4.45
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.704
      gen_sec: 5.25
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.6929
      gen_sec: 8.9
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.6996
      gen_sec: 7.2
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.7152
      gen_sec: 4.9
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.7049
      gen_sec: 3.84
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.7123
      gen_sec: 5.12
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.679
      gen_sec: 2.75
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.7004
      gen_sec: 4.22
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.6829
      gen_sec: 4.16
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.7043
      gen_sec: 5.66
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.7061
      gen_sec: 4.0
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.7092
      gen_sec: 5.06
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.7127
      gen_sec: 4.51
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.7333
      gen_sec: 4.74
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.6803
      gen_sec: 3.01
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.6788
      gen_sec: 7.81
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.6779
      gen_sec: 7.94
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.6895
      gen_sec: 2.94
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.7218
      gen_sec: 3.49
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.6857
      gen_sec: 7.04
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.6501
      gen_sec: 3.97
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.7134
      gen_sec: 5.79
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.6495
      gen_sec: 3.1
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.7345
      gen_sec: 7.1
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.6897
      gen_sec: 3.55
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.6435
      gen_sec: 3.78
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.684
      gen_sec: 4.45
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.7062
      gen_sec: 5.47
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.7248
      gen_sec: 2.94
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.6925
      gen_sec: 4.64
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.6665
      gen_sec: 7.74
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.7038
      gen_sec: 8.26
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.6943
      gen_sec: 5.63
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.6783
      gen_sec: 5.18
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.6841
      gen_sec: 6.27
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.7009
      gen_sec: 3.62
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.7203
      gen_sec: 6.56
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.7146
      gen_sec: 3.84
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.7049
      gen_sec: 8.06
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.6777
      gen_sec: 5.44
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.6858
      gen_sec: 5.28
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.6622
      gen_sec: 7.01
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.671
      gen_sec: 7.07
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.7043
      gen_sec: 2.02
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.6885
      gen_sec: 3.01
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.657
      gen_sec: 6.88
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.6931
      gen_sec: 2.94
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.6976
      gen_sec: 6.24
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.6926
      gen_sec: 3.58
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.7142
      gen_sec: 6.21
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.7097
      gen_sec: 5.38
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.6844
      gen_sec: 5.47
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.6922
      gen_sec: 4.32
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.6866
      gen_sec: 5.09
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.6559
      gen_sec: 1.38
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.7205
      gen_sec: 4.54
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.6996
      gen_sec: 8.35
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.7102
      gen_sec: 6.02
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.6631
      gen_sec: 2.56
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.6656
      gen_sec: 8.48
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.7016
      gen_sec: 6.34
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.6738
      gen_sec: 6.08
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.7037
      gen_sec: 2.08
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.6858
      gen_sec: 5.38
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.657
      gen_sec: 6.3
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.6896
      gen_sec: 2.75
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.6932
      gen_sec: 3.87
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.6854
      gen_sec: 3.07
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.6785
      gen_sec: 2.72
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.6919
      gen_sec: 2.85
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.7111
      gen_sec: 7.01
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.707
      gen_sec: 5.18
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.6562
      gen_sec: 5.09
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.6756
      gen_sec: 3.87
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.6858
      gen_sec: 4.29
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.6886
      gen_sec: 4.64
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.703
      gen_sec: 3.42
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.6869
      gen_sec: 5.6
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.702
      gen_sec: 4.48
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.732
      gen_sec: 5.79
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.6838
      gen_sec: 3.23
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.7003
      gen_sec: 6.34
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.6793
      gen_sec: 4.93
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.7134
      gen_sec: 4.58
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.6898
      gen_sec: 4.03
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.7385
      gen_sec: 3.17
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.6898
      gen_sec: 7.14
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.6963
      gen_sec: 3.65
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.6862
      gen_sec: 6.02
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.6759
      gen_sec: 7.36
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.7237
      gen_sec: 2.91
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.6907
      gen_sec: 3.94
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.7124
      gen_sec: 4.03
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.7088
      gen_sec: 4.9
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.7097
      gen_sec: 5.86
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.69
      gen_sec: 3.97
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.7086
      gen_sec: 5.34
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.7039
      gen_sec: 2.69
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.6842
      gen_sec: 5.41
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.7068
      gen_sec: 5.44
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.6665
      gen_sec: 7.68
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.6886
      gen_sec: 6.94
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.7127
      gen_sec: 5.06
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.6585
      gen_sec: 4.32
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.7114
      gen_sec: 6.82
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.7111
      gen_sec: 3.9
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.6984
      gen_sec: 4.74
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.6791
      gen_sec: 7.3
      ref_sec: 9.02
  score: 0.6939
  partial: true
- model: walusungungulube/Spark-TTS-0.5B-twi-ewe-dagbani-ref
  sbs: 0.751
  num_scored: 200
  uses_reference: true
  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.76
      gen_sec: 7.36
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.8036
      gen_sec: 3.76
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.7746
      gen_sec: 15.84
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.7184
      gen_sec: 5.7
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.7667
      gen_sec: 7.62
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.764
      gen_sec: 7.04
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.7589
      gen_sec: 5.62
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.8147
      gen_sec: 7.3
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.7379
      gen_sec: 4.42
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.7629
      gen_sec: 7.98
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.762
      gen_sec: 12.72
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.7337
      gen_sec: 7.36
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.7232
      gen_sec: 1.66
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.7661
      gen_sec: 6.18
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.7434
      gen_sec: 5.84
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.7557
      gen_sec: 9.06
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.8037
      gen_sec: 10.84
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.6316
      gen_sec: 4.4
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7459
      gen_sec: 10.1
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.7836
      gen_sec: 5.0
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.8262
      gen_sec: 5.24
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.7225
      gen_sec: 6.92
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.6759
      gen_sec: 3.36
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.6872
      gen_sec: 3.44
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.7817
      gen_sec: 7.88
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.7919
      gen_sec: 4.8
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.7657
      gen_sec: 6.66
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.7147
      gen_sec: 8.04
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.7244
      gen_sec: 9.44
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.7507
      gen_sec: 8.34
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.7921
      gen_sec: 8.06
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.7797
      gen_sec: 12.2
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.7567
      gen_sec: 4.18
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.7429
      gen_sec: 6.8
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.7465
      gen_sec: 9.24
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.7675
      gen_sec: 8.66
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.7135
      gen_sec: 7.02
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.7764
      gen_sec: 8.08
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.709
      gen_sec: 10.54
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.7586
      gen_sec: 9.26
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.7669
      gen_sec: 4.52
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.737
      gen_sec: 5.64
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.7514
      gen_sec: 7.3
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.757
      gen_sec: 4.82
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.8187
      gen_sec: 9.12
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.7178
      gen_sec: 8.14
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.7376
      gen_sec: 6.44
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.7967
      gen_sec: 8.48
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.7201
      gen_sec: 9.52
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.7534
      gen_sec: 5.62
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.7405
      gen_sec: 2.72
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.7322
      gen_sec: 6.92
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.7706
      gen_sec: 8.3
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.7913
      gen_sec: 5.88
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.74
      gen_sec: 3.74
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.7564
      gen_sec: 6.5
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.7621
      gen_sec: 8.06
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.804
      gen_sec: 8.68
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.7311
      gen_sec: 8.26
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.6232
      gen_sec: 4.28
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.7907
      gen_sec: 11.08
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.7458
      gen_sec: 5.0
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.7074
      gen_sec: 9.32
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.7185
      gen_sec: 6.42
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.7194
      gen_sec: 8.04
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.7667
      gen_sec: 6.8
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.8015
      gen_sec: 4.48
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.7617
      gen_sec: 9.04
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.794
      gen_sec: 3.16
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.7453
      gen_sec: 7.5
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.761
      gen_sec: 7.18
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.7636
      gen_sec: 7.24
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.7469
      gen_sec: 4.62
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.7816
      gen_sec: 9.54
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7839
      gen_sec: 11.52
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.7469
      gen_sec: 5.66
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.7114
      gen_sec: 2.04
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.7788
      gen_sec: 9.68
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7974
      gen_sec: 3.68
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.7668
      gen_sec: 7.9
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.7323
      gen_sec: 6.78
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.7753
      gen_sec: 10.14
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.7726
      gen_sec: 6.78
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.7401
      gen_sec: 6.34
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.8336
      gen_sec: 7.68
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.7438
      gen_sec: 5.6
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.744
      gen_sec: 6.16
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.7378
      gen_sec: 9.48
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.7254
      gen_sec: 3.68
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.7242
      gen_sec: 6.16
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.7415
      gen_sec: 6.34
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.8363
      gen_sec: 9.12
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.7381
      gen_sec: 7.06
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.7403
      gen_sec: 12.0
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.7527
      gen_sec: 9.94
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.7332
      gen_sec: 5.34
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.7292
      gen_sec: 4.36
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.7744
      gen_sec: 6.84
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.7484
      gen_sec: 4.42
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.7323
      gen_sec: 5.02
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.733
      gen_sec: 5.18
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.746
      gen_sec: 5.66
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.7566
      gen_sec: 4.36
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.7244
      gen_sec: 6.32
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.7353
      gen_sec: 6.54
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.7761
      gen_sec: 9.08
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.7847
      gen_sec: 6.32
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.7166
      gen_sec: 8.44
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.7765
      gen_sec: 10.72
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7819
      gen_sec: 3.74
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.7294
      gen_sec: 4.72
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.7755
      gen_sec: 10.52
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.7281
      gen_sec: 4.76
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.7492
      gen_sec: 7.5
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.6222
      gen_sec: 4.6
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.7581
      gen_sec: 12.18
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.7623
      gen_sec: 4.94
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.6899
      gen_sec: 4.26
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.7357
      gen_sec: 5.26
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.7611
      gen_sec: 7.04
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.6982
      gen_sec: 3.66
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.7932
      gen_sec: 7.56
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.7329
      gen_sec: 8.48
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.7879
      gen_sec: 11.1
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.7821
      gen_sec: 7.9
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.7801
      gen_sec: 7.14
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.7532
      gen_sec: 7.4
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.7358
      gen_sec: 4.96
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.7455
      gen_sec: 9.38
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.7884
      gen_sec: 5.82
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.735
      gen_sec: 14.4
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.7937
      gen_sec: 6.7
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.7848
      gen_sec: 6.94
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.7946
      gen_sec: 6.66
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.7972
      gen_sec: 10.18
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.7201
      gen_sec: 3.84
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.768
      gen_sec: 5.42
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.7313
      gen_sec: 9.36
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.7788
      gen_sec: 5.34
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.74
      gen_sec: 6.98
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.7848
      gen_sec: 4.52
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.7566
      gen_sec: 7.72
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.7266
      gen_sec: 7.66
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.75
      gen_sec: 7.1
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.8042
      gen_sec: 6.16
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.8343
      gen_sec: 6.42
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.7247
      gen_sec: 2.1
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.7808
      gen_sec: 8.2
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.7941
      gen_sec: 11.06
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.7587
      gen_sec: 6.72
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.7245
      gen_sec: 2.06
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.7553
      gen_sec: 11.52
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.6835
      gen_sec: 7.16
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.7362
      gen_sec: 7.04
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.753
      gen_sec: 2.58
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.8021
      gen_sec: 7.28
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.7416
      gen_sec: 7.02
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.4829
      gen_sec: 0.08
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.751
      gen_sec: 5.04
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.7632
      gen_sec: 3.66
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.6676
      gen_sec: 3.24
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.7625
      gen_sec: 4.32
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.761
      gen_sec: 10.74
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.7562
      gen_sec: 8.18
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.7513
      gen_sec: 7.38
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.7218
      gen_sec: 4.18
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.714
      gen_sec: 5.92
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.7648
      gen_sec: 5.6
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.7676
      gen_sec: 5.46
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.7359
      gen_sec: 6.76
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.818
      gen_sec: 7.9
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.7774
      gen_sec: 7.5
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.7231
      gen_sec: 3.28
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.7543
      gen_sec: 8.44
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.7429
      gen_sec: 6.54
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.7292
      gen_sec: 6.44
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.7117
      gen_sec: 5.46
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.5843
      gen_sec: 5.64
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.8039
      gen_sec: 9.54
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.7654
      gen_sec: 3.88
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.7634
      gen_sec: 7.5
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7745
      gen_sec: 8.68
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.7557
      gen_sec: 3.82
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.7665
      gen_sec: 5.1
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.724
      gen_sec: 5.14
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.7519
      gen_sec: 5.86
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.7618
      gen_sec: 8.46
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7648
      gen_sec: 5.38
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.7704
      gen_sec: 6.94
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.7366
      gen_sec: 3.16
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.7544
      gen_sec: 6.3
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.7589
      gen_sec: 8.14
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.7392
      gen_sec: 9.24
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.738
      gen_sec: 9.26
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.7811
      gen_sec: 6.82
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.7282
      gen_sec: 4.96
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.7563
      gen_sec: 10.12
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.738
      gen_sec: 5.4
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.7461
      gen_sec: 4.52
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7431
      gen_sec: 8.56
      ref_sec: 9.02
