    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.6261
      gen_sec: 5.04
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.6026
      gen_sec: 17.84
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.6093
      gen_sec: 7.12
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.6674
      gen_sec: 8.56
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.6247
      gen_sec: 8.64
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.6614
      gen_sec: 6.72
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.6289
      gen_sec: 7.2
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.6695
      gen_sec: 4.64
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.6102
      gen_sec: 8.24
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.6539
      gen_sec: 16.08
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.6348
      gen_sec: 8.32
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.6356
      gen_sec: 2.84
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.6386
      gen_sec: 6.24
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.6054
      gen_sec: 6.04
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.6048
      gen_sec: 9.84
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.6051
      gen_sec: 8.64
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.5765
      gen_sec: 5.12
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.6677
      gen_sec: 12.48
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.6124
      gen_sec: 5.24
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.6442
      gen_sec: 5.32
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.6317
      gen_sec: 9.04
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.6608
      gen_sec: 4.52
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.6238
      gen_sec: 3.52
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.6129
      gen_sec: 8.96
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.6524
      gen_sec: 5.96
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.6111
      gen_sec: 7.76
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.6182
      gen_sec: 10.48
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.6008
      gen_sec: 12.24
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.6122
      gen_sec: 8.4
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.6109
      gen_sec: 6.84
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.613
      gen_sec: 12.96
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.6351
      gen_sec: 4.48
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.6724
      gen_sec: 6.92
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.6143
      gen_sec: 8.52
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.6035
      gen_sec: 8.96
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.6411
      gen_sec: 7.28
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.5974
      gen_sec: 10.04
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.6391
      gen_sec: 12.44
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.6349
      gen_sec: 9.56
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.6313
      gen_sec: 4.52
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.6
      gen_sec: 6.28
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.604
      gen_sec: 8.84
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.5874
      gen_sec: 6.32
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.6206
      gen_sec: 9.68
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.5917
      gen_sec: 7.88
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.5793
      gen_sec: 5.4
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.6248
      gen_sec: 8.88
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.6532
      gen_sec: 11.32
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.5863
      gen_sec: 7.68
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.6059
      gen_sec: 5.92
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.6262
      gen_sec: 7.64
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.5912
      gen_sec: 8.24
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.6385
      gen_sec: 4.12
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.6365
      gen_sec: 6.04
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.6177
      gen_sec: 7.04
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.66
      gen_sec: 9.28
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.6222
      gen_sec: 9.6
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.6455
      gen_sec: 10.68
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.5922
      gen_sec: 4.52
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.6911
      gen_sec: 11.36
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.623
      gen_sec: 6.36
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.6546
      gen_sec: 5.88
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.6627
      gen_sec: 6.52
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.5999
      gen_sec: 9.0
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.6013
      gen_sec: 6.68
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.6593
      gen_sec: 6.0
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.6405
      gen_sec: 13.44
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.602
      gen_sec: 4.96
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.5992
      gen_sec: 8.68
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.6359
      gen_sec: 7.56
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.6361
      gen_sec: 8.4
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.6334
      gen_sec: 5.28
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.6595
      gen_sec: 12.04
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.6371
      gen_sec: 11.92
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.6147
      gen_sec: 7.04
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.6191
      gen_sec: 2.88
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.6077
      gen_sec: 10.32
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.6067
      gen_sec: 4.36
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.5865
      gen_sec: 10.16
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.6416
      gen_sec: 6.28
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.6091
      gen_sec: 10.64
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.6657
      gen_sec: 8.32
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.6138
      gen_sec: 7.64
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.6694
      gen_sec: 8.56
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.6552
      gen_sec: 8.28
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.6174
      gen_sec: 7.72
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.5878
      gen_sec: 10.64
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.5865
      gen_sec: 6.28
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.6195
      gen_sec: 5.12
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.6082
      gen_sec: 10.64
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.597
      gen_sec: 7.2
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.6467
      gen_sec: 7.88
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.6106
      gen_sec: 13.04
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.6148
      gen_sec: 9.48
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.6389
      gen_sec: 7.16
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.6235
      gen_sec: 6.56
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.6124
      gen_sec: 8.56
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.6248
      gen_sec: 3.8
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.6044
      gen_sec: 5.16
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.629
      gen_sec: 6.28
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.6344
      gen_sec: 8.36
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.6435
      gen_sec: 6.0
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.5799
      gen_sec: 7.32
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.6077
      gen_sec: 8.84
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.6916
      gen_sec: 6.88
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.6677
      gen_sec: 5.32
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.608
      gen_sec: 10.72
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.6386
      gen_sec: 8.96
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.6264
      gen_sec: 4.72
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.6141
      gen_sec: 5.64
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.6295
      gen_sec: 9.16
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.5321
      gen_sec: 5.96
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.61
      gen_sec: 9.04
      ref_sec: 5.18
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.6443
      gen_sec: 10.2
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.6265
      gen_sec: 4.88
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.5578
      gen_sec: 6.08
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.6011
      gen_sec: 6.68
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.6258
      gen_sec: 8.08
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.6262
      gen_sec: 4.72
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.6732
      gen_sec: 8.16
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.5935
      gen_sec: 9.8
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.617
      gen_sec: 11.52
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.6104
      gen_sec: 7.56
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.6159
      gen_sec: 8.36
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.6308
      gen_sec: 9.56
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.6182
      gen_sec: 5.48
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.6352
      gen_sec: 9.08
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.6333
      gen_sec: 5.08
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.6264
      gen_sec: 10.88
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.6405
      gen_sec: 7.4
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.6105
      gen_sec: 9.52
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.6132
      gen_sec: 10.64
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.6145
      gen_sec: 10.72
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.6261
      gen_sec: 3.08
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.6684
      gen_sec: 5.6
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.5608
      gen_sec: 10.32
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.6469
      gen_sec: 5.36
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.6279
      gen_sec: 10.16
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.6184
      gen_sec: 5.52
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.6518
      gen_sec: 9.52
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.6425
      gen_sec: 9.52
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.6312
      gen_sec: 9.16
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.631
      gen_sec: 7.68
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.6083
      gen_sec: 8.0
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.6291
      gen_sec: 2.16
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.6451
      gen_sec: 6.84
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.6099
      gen_sec: 9.44
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.5747
      gen_sec: 6.84
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.626
      gen_sec: 4.72
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.6216
      gen_sec: 12.8
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.6121
      gen_sec: 9.24
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.6147
      gen_sec: 8.32
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.6324
      gen_sec: 2.96
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.5856
      gen_sec: 8.68
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.587
      gen_sec: 8.64
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.6529
      gen_sec: 4.44
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.6186
      gen_sec: 5.96
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.6294
      gen_sec: 5.36
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.6021
      gen_sec: 4.0
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.6112
      gen_sec: 4.72
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.617
      gen_sec: 10.96
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.6336
      gen_sec: 8.44
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.6204
      gen_sec: 7.88
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.6017
      gen_sec: 5.6
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.6165
      gen_sec: 5.56
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.5984
      gen_sec: 8.08
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.6134
      gen_sec: 5.56
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.604
      gen_sec: 8.48
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.5981
      gen_sec: 8.08
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.6258
      gen_sec: 7.52
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.6142
      gen_sec: 4.36
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.636
      gen_sec: 9.0
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.6283
      gen_sec: 7.64
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.6709
      gen_sec: 6.88
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.5814
      gen_sec: 6.2
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.6118
      gen_sec: 4.64
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.6155
      gen_sec: 11.36
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.6326
      gen_sec: 5.76
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.6199
      gen_sec: 10.88
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.6092
      gen_sec: 12.32
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.6446
      gen_sec: 4.72
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.6301
      gen_sec: 5.36
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.6607
      gen_sec: 5.36
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.6339
      gen_sec: 8.0
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.6256
      gen_sec: 7.36
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.6055
      gen_sec: 6.4
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.619
      gen_sec: 7.96
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.6454
      gen_sec: 4.64
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.6348
      gen_sec: 8.28
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.6396
      gen_sec: 7.88
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.6073
      gen_sec: 11.12
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.5949
      gen_sec: 11.2
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.6033
      gen_sec: 7.44
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.616
      gen_sec: 7.08
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.6109
      gen_sec: 10.2
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.6672
      gen_sec: 6.48
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.6259
      gen_sec: 5.32
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.6751
      gen_sec: 12.16
      ref_sec: 9.02
  score: 0.6232
  partial: true
- model: Google/gemini-3.1-flash-tts-preview
  sbs: 0.6265
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.6232
      gen_sec: 8.64
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.6362
      gen_sec: 5.24
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.5898
      gen_sec: 16.56
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.6318
      gen_sec: 6.12
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.653
      gen_sec: 9.04
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.6039
      gen_sec: 7.8
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.6837
      gen_sec: 8.44
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.6294
      gen_sec: 7.04
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.6695
      gen_sec: 4.52
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.6283
      gen_sec: 7.88
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.6931
      gen_sec: 13.24
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.6303
      gen_sec: 7.24
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.642
      gen_sec: 3.36
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.6272
      gen_sec: 6.84
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.6079
      gen_sec: 6.56
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.6046
      gen_sec: 8.6
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.6145
      gen_sec: 8.88
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.581
      gen_sec: 4.88
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.6388
      gen_sec: 10.2
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.6316
      gen_sec: 5.96
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.5862
      gen_sec: 5.12
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.6542
      gen_sec: 7.16
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.6677
      gen_sec: 5.48
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.5994
      gen_sec: 4.76
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.6281
      gen_sec: 8.16
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.6422
      gen_sec: 4.48
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.6294
      gen_sec: 7.84
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.6401
      gen_sec: 8.2
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.6104
      gen_sec: 10.68
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.6147
      gen_sec: 8.04
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.6627
      gen_sec: 7.92
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.6119
      gen_sec: 13.4
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.6513
      gen_sec: 4.6
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.6095
      gen_sec: 6.28
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.6177
      gen_sec: 9.0
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.6161
      gen_sec: 7.72
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.6426
      gen_sec: 6.48
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.586
      gen_sec: 9.8
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.6137
      gen_sec: 12.76
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.6828
      gen_sec: 9.44
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.5902
      gen_sec: 5.16
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.6118
      gen_sec: 6.84
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.6047
      gen_sec: 7.88
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.6051
      gen_sec: 5.4
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.609
      gen_sec: 10.88
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.6088
      gen_sec: 7.64
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.6449
      gen_sec: 6.84
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.6298
      gen_sec: 8.12
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.6258
      gen_sec: 10.36
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.6346
      gen_sec: 7.16
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.5945
      gen_sec: 8.24
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.6321
      gen_sec: 6.92
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.6136
      gen_sec: 8.24
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.6525
      gen_sec: 4.76
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.6454
      gen_sec: 5.48
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.6084
      gen_sec: 8.08
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.6362
      gen_sec: 9.36
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.6328
      gen_sec: 8.68
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.5965
      gen_sec: 9.52
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.5945
      gen_sec: 4.64
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.6265
      gen_sec: 11.24
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.666
      gen_sec: 6.92
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.6457
      gen_sec: 7.0
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.6157
      gen_sec: 6.2
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.6286
      gen_sec: 8.6
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.6137
      gen_sec: 7.0
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.6631
      gen_sec: 7.36
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.637
      gen_sec: 10.16
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.6444
      gen_sec: 5.48
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.6058
      gen_sec: 8.56
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.6285
      gen_sec: 7.52
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.6114
      gen_sec: 7.28
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.6419
      gen_sec: 6.36
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.6803
      gen_sec: 10.84
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.6133
      gen_sec: 9.64
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.6367
      gen_sec: 6.32
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.6149
      gen_sec: 3.44
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.6042
      gen_sec: 10.24
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.6398
      gen_sec: 3.84
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.5951
      gen_sec: 8.92
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.6477
      gen_sec: 6.52
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.6238
      gen_sec: 10.12
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.6176
      gen_sec: 7.0
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.6174
      gen_sec: 7.04
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.6383
      gen_sec: 7.88
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.6646
      gen_sec: 8.28
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.6207
      gen_sec: 7.64
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.5926
      gen_sec: 12.24
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.5906
      gen_sec: 6.56
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.6436
      gen_sec: 5.64
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.6041
      gen_sec: 8.64
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.687
      gen_sec: 7.68
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.6228
      gen_sec: 8.16
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.6055
      gen_sec: 14.0
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.6032
      gen_sec: 10.84
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.611
      gen_sec: 7.28
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.6834
      gen_sec: 7.6
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.62
      gen_sec: 7.92
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.619
      gen_sec: 4.12
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.618
      gen_sec: 5.92
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.6101
      gen_sec: 6.44
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.628
      gen_sec: 6.76
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.6425
      gen_sec: 5.6
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.6113
      gen_sec: 6.84
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.6215
      gen_sec: 7.92
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.6519
      gen_sec: 8.48
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.6695
      gen_sec: 4.8
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.6138
      gen_sec: 11.52
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.6173
      gen_sec: 10.56
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.6303
      gen_sec: 4.8
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.6426
      gen_sec: 5.24
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.6332
      gen_sec: 9.84
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.5619
      gen_sec: 5.28
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.6469
      gen_sec: 8.08
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.5995
      gen_sec: 4.04
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.6265
      gen_sec: 10.84
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.6425
      gen_sec: 6.04
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.5532
      gen_sec: 5.8
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.6128
      gen_sec: 6.04
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.6349
      gen_sec: 9.0
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.6637
      gen_sec: 5.0
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.6765
      gen_sec: 8.6
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.5832
      gen_sec: 11.72
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.6445
      gen_sec: 11.48
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.6108
      gen_sec: 8.0
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.5861
      gen_sec: 8.72
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.6347
      gen_sec: 11.44
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.6475
      gen_sec: 4.84
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.6362
      gen_sec: 8.36
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.6052
      gen_sec: 5.76
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.6257
      gen_sec: 12.84
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.6016
      gen_sec: 7.48
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.6162
      gen_sec: 8.72
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.6144
      gen_sec: 9.44
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.6286
      gen_sec: 9.96
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.6646
      gen_sec: 3.16
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.6104
      gen_sec: 5.24
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.5992
      gen_sec: 9.6
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.6639
      gen_sec: 5.84
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.6511
      gen_sec: 9.08
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.6064
      gen_sec: 5.36
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.674
      gen_sec: 10.8
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.6657
      gen_sec: 8.8
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.6548
      gen_sec: 8.16
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.6072
      gen_sec: 6.4
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.5948
      gen_sec: 7.56
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.6166
      gen_sec: 2.32
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.658
      gen_sec: 7.4
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.6145
      gen_sec: 9.96
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.6401
      gen_sec: 7.68
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.6145
      gen_sec: 3.92
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.6127
      gen_sec: 13.2
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.6128
      gen_sec: 7.72
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.6023
      gen_sec: 7.84
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.6272
      gen_sec: 2.64
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.6422
      gen_sec: 7.56
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.6383
      gen_sec: 9.0
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.6627
      gen_sec: 5.08
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.6378
      gen_sec: 6.36
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.6392
      gen_sec: 4.44
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.5669
      gen_sec: 4.52
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.6044
      gen_sec: 4.88
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.5861
      gen_sec: 11.44
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.6583
      gen_sec: 10.52
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.6175
      gen_sec: 7.0
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.6019
      gen_sec: 6.44
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.6421
      gen_sec: 6.2
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.6145
      gen_sec: 6.68
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.6532
      gen_sec: 5.32
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.6274
      gen_sec: 7.88
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.66
      gen_sec: 7.72
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.6124
      gen_sec: 8.12
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.6298
      gen_sec: 4.84
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.6309
      gen_sec: 9.96
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.6074
      gen_sec: 8.08
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.6593
      gen_sec: 6.84
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.6151
      gen_sec: 5.56
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.6046
      gen_sec: 5.6
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.6621
      gen_sec: 11.16
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.6119
      gen_sec: 5.68
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.6095
      gen_sec: 9.32
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.6069
      gen_sec: 12.76
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.6412
      gen_sec: 4.36
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.6244
      gen_sec: 6.48
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.6125
      gen_sec: 5.28
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.6183
      gen_sec: 9.04
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.6327
      gen_sec: 9.96
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.6052
      gen_sec: 5.56
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.6428
      gen_sec: 8.04
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.6115
      gen_sec: 4.56
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.6362
      gen_sec: 7.6
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.6267
      gen_sec: 8.2
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.6007
      gen_sec: 10.2
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.6431
      gen_sec: 11.0
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.658
      gen_sec: 7.64
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.615
      gen_sec: 5.4
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.6384
      gen_sec: 8.6
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.6438
      gen_sec: 5.96
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.6413
      gen_sec: 6.8
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.5921
      gen_sec: 11.12
      ref_sec: 9.02
  score: 0.6265
  partial: true
- model: k2-fsa/OmniVoice-design
  sbs: 0.6671
  num_scored: 197
  uses_reference: false
  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.6542
      gen_sec: 4.52
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.6816
      gen_sec: 2.7
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.6044
      gen_sec: 8.33
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.6978
      gen_sec: 4.06
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.6381
      gen_sec: 4.31
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.6714
      gen_sec: 5.55
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.7484
      gen_sec: 2.18
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.6981
      gen_sec: 4.42
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.7084
      gen_sec: 2.48
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.6642
      gen_sec: 4.7
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.6503
      gen_sec: 6.26
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.6513
      gen_sec: 4.31
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.6563
      gen_sec: 0.81
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.6822
      gen_sec: 3.69
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.6669
      gen_sec: 3.58
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.6257
      gen_sec: 5.34
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.6605
      gen_sec: 5.28
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.6383
      gen_sec: 2.77
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.6038
      gen_sec: 6.8
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.6716
      gen_sec: 2.96
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.6928
      gen_sec: 2.43
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.6802
      gen_sec: 4.72
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.6998
      gen_sec: 2.25
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.6679
      gen_sec: 2.49
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.6439
      gen_sec: 4.74
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.6844
      gen_sec: 2.89
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.6854
      gen_sec: 4.24
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.6714
      gen_sec: 5.0
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.6566
      gen_sec: 6.77
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.6213
      gen_sec: 6.04
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.6396
      gen_sec: 4.64
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.6321
      gen_sec: 7.61
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.6971
      gen_sec: 1.51
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.6785
      gen_sec: 3.58
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.6276
      gen_sec: 5.71
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.6628
      gen_sec: 4.64
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.684
      gen_sec: 3.63
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.6388
      gen_sec: 5.47
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.6688
      gen_sec: 6.91
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.6636
      gen_sec: 5.25
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.6771
      gen_sec: 2.54
      ref_sec: 3.32
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.6507
      gen_sec: 4.9
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.6729
      gen_sec: 2.91
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.6426
      gen_sec: 6.39
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.6868
      gen_sec: 4.73
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.6537
      gen_sec: 2.95
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.669
      gen_sec: 4.9
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.6314
      gen_sec: 6.62
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.6768
      gen_sec: 4.96
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.6847
      gen_sec: 2.9
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.6693
      gen_sec: 3.87
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.6696
      gen_sec: 4.23
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.6865
      gen_sec: 2.01
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.6861
      gen_sec: 2.62
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.6655
      gen_sec: 4.03
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.6869
      gen_sec: 5.2
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.6403
      gen_sec: 5.43
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.631
      gen_sec: 4.77
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.6278
      gen_sec: 2.77
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.513
      gen_sec: 4.98
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.6795
      gen_sec: 3.27
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.698
      gen_sec: 3.81
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.7079
      gen_sec: 3.66
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.6595
      gen_sec: 4.76
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.6521
      gen_sec: 3.87
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.6692
      gen_sec: 0.79
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.6206
      gen_sec: 7.41
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.6825
      gen_sec: 2.64
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.6586
      gen_sec: 4.59
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.6759
      gen_sec: 4.29
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.6927
      gen_sec: 4.11
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.6786
      gen_sec: 3.08
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.6563
      gen_sec: 7.48
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.6471
      gen_sec: 6.61
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.699
      gen_sec: 4.33
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.6855
      gen_sec: 1.63
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.5988
      gen_sec: 6.77
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7154
      gen_sec: 2.46
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.6771
      gen_sec: 5.12
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.6909
      gen_sec: 4.13
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.656
      gen_sec: 5.33
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.6644
      gen_sec: 3.99
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.6834
      gen_sec: 4.23
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.6802
      gen_sec: 4.73
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.6788
      gen_sec: 3.78
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.6995
      gen_sec: 4.1
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.6382
      gen_sec: 5.34
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.6748
      gen_sec: 3.59
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.6661
      gen_sec: 3.37
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.6436
      gen_sec: 4.95
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.6623
      gen_sec: 3.65
      ref_sec: 6.16
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.6381
      gen_sec: 7.28
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.6561
      gen_sec: 6.48
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.7036
      gen_sec: 3.87
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.6637
      gen_sec: 2.74
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.7488
      gen_sec: 2.88
      ref_sec: 11.78
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.6923
      gen_sec: 2.83
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.6718
      gen_sec: 3.02
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.6887
      gen_sec: 4.32
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.6758
      gen_sec: 3.1
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.6744
      gen_sec: 4.02
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.67
      gen_sec: 3.16
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.715
      gen_sec: 3.17
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.6867
      gen_sec: 0.79
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.6526
      gen_sec: 7.13
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.6744
      gen_sec: 6.21
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7143
      gen_sec: 2.39
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.6925
      gen_sec: 3.05
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.6624
      gen_sec: 6.4
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.6262
      gen_sec: 3.27
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.6922
      gen_sec: 5.02
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.6358
      gen_sec: 2.21
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.7002
      gen_sec: 6.21
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.6913
      gen_sec: 2.61
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.6317
      gen_sec: 2.87
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.6814
      gen_sec: 3.47
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.6781
      gen_sec: 4.6
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.6896
      gen_sec: 2.15
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.6648
      gen_sec: 4.54
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.6148
      gen_sec: 7.14
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.7166
      gen_sec: 4.63
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.6788
      gen_sec: 4.16
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.6666
      gen_sec: 4.31
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.6518
      gen_sec: 5.74
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.7217
      gen_sec: 2.81
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.6856
      gen_sec: 5.31
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.6902
      gen_sec: 2.65
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.6735
      gen_sec: 6.1
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.6521
      gen_sec: 4.35
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.6805
      gen_sec: 4.02
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.6624
      gen_sec: 6.06
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.6593
      gen_sec: 6.04
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.7026
      gen_sec: 1.58
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.5151
      gen_sec: 3.24
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.6656
      gen_sec: 5.54
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.6815
      gen_sec: 2.15
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.638
      gen_sec: 5.34
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.692
      gen_sec: 3.0
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.6854
      gen_sec: 5.49
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.6832
      gen_sec: 4.6
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.6733
      gen_sec: 4.68
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.6362
      gen_sec: 3.56
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.6673
      gen_sec: 4.48
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.6608
      gen_sec: 1.64
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.675
      gen_sec: 3.92
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.6598
      gen_sec: 6.3
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.6919
      gen_sec: 4.94
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.6591
      gen_sec: 0.47
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.6244
      gen_sec: 8.09
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.6981
      gen_sec: 5.14
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.677
      gen_sec: 5.13
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.6424
      gen_sec: 0.54
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.6991
      gen_sec: 4.53
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.6437
      gen_sec: 4.9
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.6517
      gen_sec: 2.29
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.6731
      gen_sec: 2.75
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.655
      gen_sec: 2.57
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.6387
      gen_sec: 2.01
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.6506
      gen_sec: 2.46
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.6712
      gen_sec: 5.69
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.6587
      gen_sec: 4.82
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.646
      gen_sec: 4.06
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.6575
      gen_sec: 2.73
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.674
      gen_sec: 3.83
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.6625
      gen_sec: 3.86
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.6656
      gen_sec: 3.03
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.685
      gen_sec: 4.48
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.6533
      gen_sec: 3.72
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.686
      gen_sec: 4.42
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.673
      gen_sec: 2.67
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.6709
      gen_sec: 5.51
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.6713
      gen_sec: 3.82
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.635
      gen_sec: 3.63
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.6733
      gen_sec: 3.62
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.6668
      gen_sec: 2.72
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.684
      gen_sec: 6.17
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.6806
      gen_sec: 3.0
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.6845
      gen_sec: 5.18
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.6443
      gen_sec: 6.08
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.6543
      gen_sec: 0.36
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.7077
      gen_sec: 3.53
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.6472
      gen_sec: 3.35
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.6549
      gen_sec: 4.0
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.6759
      gen_sec: 4.34
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.6859
      gen_sec: 2.87
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.6696
      gen_sec: 4.36
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.6947
      gen_sec: 2.42
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.6683
      gen_sec: 3.67
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.6915
      gen_sec: 4.32
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.6577
      gen_sec: 6.27
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.6572
      gen_sec: 5.85
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.6441
      gen_sec: 4.45
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.6558
      gen_sec: 3.94
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.6558
      gen_sec: 4.91
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.6696
      gen_sec: 3.12
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.6754
      gen_sec: 3.57
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.6498
      gen_sec: 5.56
      ref_sec: 9.02
  score: 0.6671
  partial: true
- model: ghananlpcommunity/nano-twi
  sbs: 0.5489
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.6334
      gen_sec: 5.59
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.5397
      gen_sec: 3.77
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.5951
      gen_sec: 9.88
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.549
      gen_sec: 4.19
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.5827
      gen_sec: 6.03
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.5591
      gen_sec: 7.67
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.5468
      gen_sec: 4.01
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.5077
      gen_sec: 5.18
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.5659
      gen_sec: 3.52
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.5722
      gen_sec: 6.03
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.6167
      gen_sec: 8.05
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.538
      gen_sec: 6.57
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.5888
      gen_sec: 2.71
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.6034
      gen_sec: 4.83
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.4929
      gen_sec: 4.06
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.5527
      gen_sec: 7.93
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.5492
      gen_sec: 6.74
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.5213
      gen_sec: 3.1
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.5902
      gen_sec: 8.61
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.4912
      gen_sec: 3.48
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.5435
      gen_sec: 4.14
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.5278
      gen_sec: 5.54
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.5553
      gen_sec: 2.5
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.5742
      gen_sec: 2.95
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.5582
      gen_sec: 5.88
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.5469
      gen_sec: 2.91
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.5066
      gen_sec: 4.91
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.5419
      gen_sec: 5.56
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.5072
      gen_sec: 6.78
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.556
      gen_sec: 6.68
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.57
      gen_sec: 5.74
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.5789
      gen_sec: 8.5
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.5571
      gen_sec: 2.59
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.5723
      gen_sec: 4.5
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.5301
      gen_sec: 6.13
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.5362
      gen_sec: 5.28
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.5979
      gen_sec: 4.33
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.5754
      gen_sec: 6.76
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.5074
      gen_sec: 8.38
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.5535
      gen_sec: 7.23
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.5629
      gen_sec: 2.59
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.5705
      gen_sec: 4.67
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.4973
      gen_sec: 5.49
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.5242
      gen_sec: 3.07
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.5616
      gen_sec: 9.72
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.4711
      gen_sec: 6.44
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.5359
      gen_sec: 4.02
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.5248
      gen_sec: 5.93
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.5954
      gen_sec: 8.28
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.5556
      gen_sec: 5.53
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.5722
      gen_sec: 4.86
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.5443
      gen_sec: 4.57
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.5608
      gen_sec: 5.8
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.6241
      gen_sec: 2.58
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.5119
      gen_sec: 3.12
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.5291
      gen_sec: 4.55
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.5389
      gen_sec: 6.05
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.4907
      gen_sec: 6.75
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.5449
      gen_sec: 5.91
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.5335
      gen_sec: 2.67
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.5885
      gen_sec: 7.7
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.5893
      gen_sec: 4.03
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.4893
      gen_sec: 4.41
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.5727
      gen_sec: 4.9
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.5803
      gen_sec: 5.41
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.5146
      gen_sec: 4.7
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.5308
      gen_sec: 3.18
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.5405
      gen_sec: 7.27
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.5699
      gen_sec: 3.91
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.547
      gen_sec: 5.29
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.5384
      gen_sec: 4.71
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.5439
      gen_sec: 5.27
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.5644
      gen_sec: 4.26
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.5728
      gen_sec: 8.36
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.5912
      gen_sec: 8.65
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.5533
      gen_sec: 4.82
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.5134
      gen_sec: 1.95
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.5269
      gen_sec: 6.78
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.5333
      gen_sec: 2.68
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.5087
      gen_sec: 5.79
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.5297
      gen_sec: 5.07
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.5578
      gen_sec: 7.13
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.4752
      gen_sec: 5.36
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.5377
      gen_sec: 5.38
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.5461
      gen_sec: 5.33
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.527
      gen_sec: 4.99
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.5289
      gen_sec: 4.38
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.5386
      gen_sec: 6.69
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.5164
      gen_sec: 3.87
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.5146
      gen_sec: 2.96
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.5659
      gen_sec: 6.81
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.5123
      gen_sec: 5.41
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.557
      gen_sec: 4.99
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.5551
      gen_sec: 8.74
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.5237
      gen_sec: 7.56
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.5574
      gen_sec: 4.82
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.554
      gen_sec: 4.68
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.5789
      gen_sec: 4.26
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.5846
      gen_sec: 2.94
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.4739
      gen_sec: 3.24
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.5111
      gen_sec: 3.13
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.5684
      gen_sec: 5.57
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.5041
      gen_sec: 3.61
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.5246
      gen_sec: 4.57
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.5333
      gen_sec: 3.8
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.6048
      gen_sec: 5.47
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.5274
      gen_sec: 3.13
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.5773
      gen_sec: 8.6
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.5689
      gen_sec: 7.26
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.5549
      gen_sec: 2.68
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.5519
      gen_sec: 3.52
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.5598
      gen_sec: 7.43
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.49
      gen_sec: 3.66
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.564
      gen_sec: 6.23
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.5693
      gen_sec: 4.2
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.5672
      gen_sec: 7.11
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.582
      gen_sec: 3.22
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.5244
      gen_sec: 3.05
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.5488
      gen_sec: 4.3
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.5143
      gen_sec: 5.13
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.5823
      gen_sec: 3.38
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.5684
      gen_sec: 6.19
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.4951
      gen_sec: 7.45
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.5438
      gen_sec: 6.85
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.5067
      gen_sec: 4.98
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.5412
      gen_sec: 4.85
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.4875
      gen_sec: 6.88
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.6259
      gen_sec: 3.7
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.5037
      gen_sec: 6.23
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.6029
      gen_sec: 3.99
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.5315
      gen_sec: 6.85
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.5476
      gen_sec: 4.52
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.5748
      gen_sec: 4.63
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.5654
      gen_sec: 6.43
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.5457
      gen_sec: 6.9
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.6305
      gen_sec: 2.71
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.6221
      gen_sec: 2.99
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.5445
      gen_sec: 7.8
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.594
      gen_sec: 3.09
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.5364
      gen_sec: 5.75
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.5118
      gen_sec: 4.11
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.5392
      gen_sec: 5.26
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.4984
      gen_sec: 5.33
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.502
      gen_sec: 5.39
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.5962
      gen_sec: 5.58
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.5483
      gen_sec: 5.08
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.5299
      gen_sec: 1.42
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.5877
      gen_sec: 4.97
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.5485
      gen_sec: 7.06
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.5189
      gen_sec: 4.86
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.5575
      gen_sec: 2.0
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.5519
      gen_sec: 8.0
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.5103
      gen_sec: 5.4
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.5158
      gen_sec: 5.61
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.5886
      gen_sec: 2.73
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.5146
      gen_sec: 5.46
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.5829
      gen_sec: 6.79
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.5696
      gen_sec: 3.08
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.5283
      gen_sec: 3.84
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.6014
      gen_sec: 3.11
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.6288
      gen_sec: 2.55
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.5642
      gen_sec: 2.72
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.5454
      gen_sec: 6.91
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.5473
      gen_sec: 5.02
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.572
      gen_sec: 5.04
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.5213
      gen_sec: 4.14
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.5227
      gen_sec: 4.24
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.5589
      gen_sec: 4.49
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.5566
      gen_sec: 3.88
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.4953
      gen_sec: 5.46
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.5619
      gen_sec: 5.68
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.5289
      gen_sec: 5.06
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.5501
      gen_sec: 3.74
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.5383
      gen_sec: 6.55
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.5315
      gen_sec: 4.47
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.6021
      gen_sec: 4.52
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.4835
      gen_sec: 3.33
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.5241
      gen_sec: 3.15
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.5329
      gen_sec: 6.52
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.4843
      gen_sec: 3.48
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.5488
      gen_sec: 7.32
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.5666
      gen_sec: 7.19
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.5296
      gen_sec: 2.47
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.6216
      gen_sec: 4.35
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.5904
      gen_sec: 4.57
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.5885
      gen_sec: 4.5
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.5986
      gen_sec: 5.17
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.5381
      gen_sec: 3.84
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.5384
      gen_sec: 5.71
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.5224
      gen_sec: 2.4
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.5636
      gen_sec: 6.29
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.5388
      gen_sec: 4.83
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.5274
      gen_sec: 5.78
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.5784
      gen_sec: 6.73
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.5579
      gen_sec: 5.92
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.5464
      gen_sec: 3.74
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.5816
      gen_sec: 6.15
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.5166
      gen_sec: 3.24
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.5586
      gen_sec: 4.97
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.5671
      gen_sec: 7.19
      ref_sec: 9.02
  score: 0.5489
  partial: true
- model: k2-fsa/OmniVoice-noref
  sbs: 0.6675
  num_scored: 197
  uses_reference: false
  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.6701
      gen_sec: 4.74
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.6807
      gen_sec: 2.66
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.677
      gen_sec: 9.28
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.68
      gen_sec: 3.66
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.6329
      gen_sec: 3.8
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.6729
      gen_sec: 5.4
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.6826
      gen_sec: 2.69
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.7067
      gen_sec: 4.18
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.7047
      gen_sec: 2.42
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.6715
      gen_sec: 4.85
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.6735
      gen_sec: 6.24
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.6427
      gen_sec: 4.13
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.801
      gen_sec: 1.26
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.7164
      gen_sec: 3.95
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.6663
      gen_sec: 3.36
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.6643
      gen_sec: 5.2
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.664
      gen_sec: 4.65
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.6289
      gen_sec: 2.48
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.6405
      gen_sec: 7.12
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.6754
      gen_sec: 3.54
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.6854
      gen_sec: 2.51
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.6721
      gen_sec: 4.77
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.6862
      gen_sec: 2.44
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.6819
      gen_sec: 2.22
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.6688
      gen_sec: 5.18
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.6906
      gen_sec: 2.9
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.7081
      gen_sec: 4.75
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.6782
      gen_sec: 5.54
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.6909
      gen_sec: 6.72
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.6727
      gen_sec: 5.48
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.675
      gen_sec: 4.21
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.64
      gen_sec: 7.61
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.6959
      gen_sec: 1.75
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.6557
      gen_sec: 3.87
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.6425
      gen_sec: 5.65
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.6441
      gen_sec: 4.57
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.686
      gen_sec: 3.31
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.6646
      gen_sec: 6.06
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.6854
      gen_sec: 6.06
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.676
      gen_sec: 5.56
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.6604
      gen_sec: 2.37
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.6574
      gen_sec: 3.09
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.6702
      gen_sec: 5.01
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.7062
      gen_sec: 3.02
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.5994
      gen_sec: 6.04
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.683
      gen_sec: 4.2
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.5528
      gen_sec: 4.0
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.6662
      gen_sec: 4.82
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.6298
      gen_sec: 7.68
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.6804
      gen_sec: 4.55
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.7012
      gen_sec: 2.98
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.676
      gen_sec: 3.57
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.6783
      gen_sec: 3.89
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.6835
      gen_sec: 2.37
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.6693
      gen_sec: 2.95
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.6633
      gen_sec: 4.43
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.6918
      gen_sec: 5.07
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.6772
      gen_sec: 4.72
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.6417
      gen_sec: 4.76
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.6211
      gen_sec: 2.7
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.719
      gen_sec: 4.85
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.6739
      gen_sec: 3.02
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.6992
      gen_sec: 3.52
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.6951
      gen_sec: 3.42
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.6575
      gen_sec: 4.4
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.6627
      gen_sec: 4.08
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.6882
      gen_sec: 2.76
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.6401
      gen_sec: 7.56
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.6672
      gen_sec: 2.67
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.6831
      gen_sec: 4.3
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.6552
      gen_sec: 4.18
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.6864
      gen_sec: 4.02
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.6795
      gen_sec: 2.82
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.6388
      gen_sec: 7.14
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.559
      gen_sec: 7.12
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.687
      gen_sec: 3.85
      ref_sec: 4.54
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.6457
      gen_sec: 6.88
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.6858
      gen_sec: 2.61
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.6498
      gen_sec: 4.63
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.6872
      gen_sec: 4.41
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.6346
      gen_sec: 5.89
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.6564
      gen_sec: 4.4
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.6867
      gen_sec: 4.28
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.6941
      gen_sec: 4.72
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.6706
      gen_sec: 3.69
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.6696
      gen_sec: 4.23
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.6396
      gen_sec: 5.58
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.6803
      gen_sec: 3.47
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.6602
      gen_sec: 2.77
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.6698
      gen_sec: 5.55
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.6759
      gen_sec: 3.89
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.6983
      gen_sec: 4.27
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.6507
      gen_sec: 8.42
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.6559
      gen_sec: 6.72
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.691
      gen_sec: 3.8
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.677
      gen_sec: 2.86
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.6481
      gen_sec: 4.04
      ref_sec: 11.78
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.6877
      gen_sec: 3.29
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.6839
      gen_sec: 2.76
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.6829
      gen_sec: 4.75
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.6894
      gen_sec: 3.45
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.6746
      gen_sec: 3.69
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.6857
      gen_sec: 3.32
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.74
      gen_sec: 2.82
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.7029
      gen_sec: 2.42
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.6738
      gen_sec: 7.22
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.6721
      gen_sec: 6.41
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.6942
      gen_sec: 2.39
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.676
      gen_sec: 2.99
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.6604
      gen_sec: 6.97
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.6244
      gen_sec: 3.42
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.6889
      gen_sec: 5.32
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.6243
      gen_sec: 2.5
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.6651
      gen_sec: 5.48
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.6813
      gen_sec: 2.63
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.6238
      gen_sec: 3.06
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.688
      gen_sec: 3.65
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.6524
      gen_sec: 4.74
      ref_sec: 5.76
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.6709
      gen_sec: 4.56
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.6199
      gen_sec: 6.97
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.6791
      gen_sec: 6.62
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.6747
      gen_sec: 4.32
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.6711
      gen_sec: 4.64
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.6703
      gen_sec: 5.51
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.6996
      gen_sec: 2.96
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.6541
      gen_sec: 5.9
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.6788
      gen_sec: 2.53
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.6635
      gen_sec: 5.78
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.6556
      gen_sec: 3.66
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.6978
      gen_sec: 3.96
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.6058
      gen_sec: 6.04
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.6546
      gen_sec: 6.03
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.6742
      gen_sec: 0.72
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.5055
      gen_sec: 3.24
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.6556
      gen_sec: 5.43
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.6813
      gen_sec: 2.33
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.689
      gen_sec: 4.61
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.6901
      gen_sec: 3.19
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.6787
      gen_sec: 0.66
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.6635
      gen_sec: 4.55
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.6759
      gen_sec: 4.25
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.6377
      gen_sec: 3.79
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.6809
      gen_sec: 4.19
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.6589
      gen_sec: 1.67
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.6771
      gen_sec: 3.83
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.6303
      gen_sec: 6.65
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.6883
      gen_sec: 4.42
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.6513
      gen_sec: 1.8
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.6045
      gen_sec: 8.0
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.6877
      gen_sec: 4.87
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.672
      gen_sec: 4.44
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.7148
      gen_sec: 0.42
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.6951
      gen_sec: 4.97
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.6344
      gen_sec: 4.81
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.6764
      gen_sec: 0.83
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.6582
      gen_sec: 2.89
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.6482
      gen_sec: 2.11
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.4336
      gen_sec: 2.76
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.6666
      gen_sec: 2.29
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.6773
      gen_sec: 5.22
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.6733
      gen_sec: 4.68
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.6529
      gen_sec: 4.14
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.6511
      gen_sec: 3.13
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.6638
      gen_sec: 3.81
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.6548
      gen_sec: 3.28
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.6536
      gen_sec: 2.88
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.7093
      gen_sec: 4.54
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.6901
      gen_sec: 3.84
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.6911
      gen_sec: 4.46
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.6936
      gen_sec: 2.99
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.6913
      gen_sec: 5.87
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.6669
      gen_sec: 3.73
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.6632
      gen_sec: 3.92
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.6813
      gen_sec: 3.24
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.66
      gen_sec: 2.55
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.661
      gen_sec: 5.81
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.6708
      gen_sec: 2.68
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.6651
      gen_sec: 5.09
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.6525
      gen_sec: 5.68
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.6963
      gen_sec: 2.28
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.7068
      gen_sec: 3.38
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.671
      gen_sec: 3.39
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.6729
      gen_sec: 4.16
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.6864
      gen_sec: 4.71
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.6979
      gen_sec: 2.89
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.6747
      gen_sec: 4.87
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.6784
      gen_sec: 2.38
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.6647
      gen_sec: 3.6
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.6784
      gen_sec: 3.87
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.6582
      gen_sec: 5.55
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.6586
      gen_sec: 6.02
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.691
      gen_sec: 4.26
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.5987
      gen_sec: 0.53
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.5521
      gen_sec: 6.04
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.6743
      gen_sec: 3.11
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.7013
      gen_sec: 3.97
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.6266
      gen_sec: 6.28
      ref_sec: 9.02
  score: 0.6675
  partial: true
- model: walusungungulube/Spark-TTS-0.5B-twi-ewe-dagbani-noref
  sbs: 0.7445
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Ɔbɛdii hene no, na wadi mfeɛ aduasa nnum, na ɔdii hene mfirinhyia aduonu nnum wɔ Yerusalem.
      sbs: 0.7782
      gen_sec: 8.72
      ref_sec: 7.14
    '1':
      text: 'Na Manoa ka kyerɛɛ AWURADE bɔfoɔ no sɛ: Wo din de sɛn?'
      sbs: 0.712
      gen_sec: 22.6
      ref_sec: 3.08
    '2':
      text: Na Konania nso ne ne nuanom Semaia, Netanel, Hasabia, Yeiel ne Yosabad, Lewifoɔ asafohene
        no yii Twam nnwan mpemnum ne anantwie ahanum maa Lewifoɔ no.
      sbs: 0.7794
      gen_sec: 15.86
      ref_sec: 14.58
    '3':
      text: Na afoforɔ bi nso yɛɛ adwuma sɛ atwerɛfoɔ, mpanimfoɔ ne aponoanohwɛfoɔ.
      sbs: 0.6865
      gen_sec: 11.44
      ref_sec: 3.82
    '4':
      text: 'Na wɔrefiri adie no, Yehosafat gyinae na ɔkaa sɛ: Yuda ne Yerusalemfoɔ, montie me.'
      sbs: 0.7559
      gen_sec: 7.2
      ref_sec: 7.52
    '5':
      text: 'Ɛnna Amasia bisaa Nyankopɔn nipa no sɛ: Na ɛdeɛn na yɛnyɛ dwetikɛseɛ ɔha a mede ama Israel
        asafo no?'
      sbs: 0.7647
      gen_sec: 10.68
      ref_sec: 7.48
    '6':
      text: Afei, me Nyankopɔn, ma w’aniwa mmue ɛ, na yɛ aso ma ɛha yi mpaebɔ.
      sbs: 0.7803
      gen_sec: 5.88
      ref_sec: 5.7
    '7':
      text: Na adeɛ biara a AWURADE Nyankopɔn agye de ama yɛn sɛ yɛnni soɔ no, ɛno na yɛbɛfa adi soɔ.
      sbs: 0.7828
      gen_sec: 7.92
      ref_sec: 5.52
    '8':
      text: Ɛberɛ a wɔhyɛɛ mo so no, mosu frɛɛ me na megyee mo.
      sbs: 0.773
      gen_sec: 11.1
      ref_sec: 3.04
    '10':
      text: Ntotorobɛntohyɛnfoɔ ne nnwomtofoɔ no nyinaa bɔɔ mu too dwom de kamfoo Awurade, daa no ase.
      sbs: 0.7466
      gen_sec: 11.48
      ref_sec: 5.7
    '11':
      text: Yehoram nuanom mmarima a na wɔyɛ Yehosafat mmammarima foforɔ bi no ne Asaria, Yehiel, Sakaria,
        Asaria, Mikael ne Sefatia.
      sbs: 0.7639
      gen_sec: 13.32
      ref_sec: 8.4
    '13':
      text: Ɛnyɛ wo so na mebaa nnɛ, na mmom efie a ɛne me di ako no so na Onyankopɔn aka sɛ menyɛ ntɛm.
      sbs: 0.7835
      gen_sec: 7.0
      ref_sec: 7.68
    '14':
      text: Na ne ba Manase bɛdii n’adeɛ.
      sbs: 0.6885
      gen_sec: 5.68
      ref_sec: 4.56
    '16':
      text: Ɔduruu ɔbarima no ho no, ɔbisaa no sɛ, “Wo na wokaa biribi kyerɛɛ me yere no anaa?
      sbs: 0.7539
      gen_sec: 6.22
      ref_sec: 10.16
    '17':
      text: Enti obiara a ɔpɛ sɛ ɔyɛ wiase adamfoɔ no gyina hɔ sɛ Nyankopɔn tamfo.
      sbs: 0.7161
      gen_sec: 16.5
      ref_sec: 5.34
    '18':
      text: Na wammrɛ ne ho ase AWURADE anim sɛdeɛ n’agya Manase brɛɛ ne ho aseɛ no, na ɔno Amon maa mfomsoɔ
        dɔɔso.
      sbs: 0.7073
      gen_sec: 9.02
      ref_sec: 6.96
    '19':
      text: Na asɔfoɔ no antumi anhyɛne AWURADE dan no mu, ɛfiri sɛ na AWURADE animuonyam no ayɛ AWURADE
        dan no ma.
      sbs: 0.7727
      gen_sec: 9.12
      ref_sec: 6.82
    '20':
      text: Ɛne Onyankopɔn a ɔka me ho no nnni asie, na wansɛe wo.
      sbs: 0.6373
      gen_sec: 4.5
      ref_sec: 3.1
    '21':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7362
      gen_sec: 40.68
      ref_sec: 9.56
    '22':
      text: Na Yudafoɔ boaboaa wɔn ano sɛ wɔrebɛhwehwɛ AWURADE hɔ mmoa.
      sbs: 0.7817
      gen_sec: 7.68
      ref_sec: 4.04
    '23':
      text: 'Na afei adɛn na moka kyerɛ me sɛ: Ɛdeɛn na ɛreyɛ woɔ, yi?'
      sbs: 0.8105
      gen_sec: 6.32
      ref_sec: 4.7
    '24':
      text: “Ɔsɔfopanin Amaria bɛyɛ mo panin, na ɔkasa a obi nka bi bio wɔ nsɛm a ɛfa Awurade ho nyinaa.
      sbs: 0.7698
      gen_sec: 10.28
      ref_sec: 5.72
    '25':
      text: Ne babarima Hesekia na ɔdii nʼadeɛ sɛ ɔhene.
      sbs: 0.7017
      gen_sec: 6.82
      ref_sec: 4.64
    '26':
      text: Ano korɔ no ara mu na nkamfo ne nnome firi ba.
      sbs: 0.7093
      gen_sec: 3.26
      ref_sec: 3.52
    '27':
      text: Bosome a ɛtɔ so mmiɛnsa no mu na wɔfirii akuakuo no aseɛ, na bosome a ɛtɔ so nson no mu na
        wɔwieeɛ.
      sbs: 0.7656
      gen_sec: 9.4
      ref_sec: 7.42
    '28':
      text: Ɔyɛ ɔbaa bi a ɔfiri Dan mmammaa mu ba, na n’agya yɛ Tironi.
      sbs: 0.7158
      gen_sec: 14.78
      ref_sec: 4.72
    '29':
      text: 'Ɛfiri sɛ wɔaka ntankɛseɛ agu deɛ wamma AWURADE nkyɛn Mispa no so sɛ: Kum na wɔnku no.'
      sbs: 0.774
      gen_sec: 8.08
      ref_sec: 6.06
    '31':
      text: Efraimfoɔ ntuanofoɔ no buaa sɛ, “Gileadfoɔ nyɛ nnipa biara sɛ adwanefoɔ a wɔfiri Efraim ne
        Manase.
      sbs: 0.7316
      gen_sec: 20.72
      ref_sec: 6.5
    '32':
      text: Wɔyɛɛ wɔn adwene sɛ wɔbɛgya Awurade, wɔn agyanom Onyankopɔn Asɔredan no, na wɔasom Asera afɔrebukyia
        no ne ahoni no mmom.
      sbs: 0.6937
      gen_sec: 15.06
      ref_sec: 6.22
    '35':
      text: Asɔfoɔ no deɛ, na Ɛpo no ankasa mu nsuo na na wɔde hohoro wɔn ho, na wɔmmfa dwaresɛn no mu
        nsuo no bi.
      sbs: 0.7343
      gen_sec: 8.36
      ref_sec: 5.62
    '36':
      text: 'Na ɔka kyerɛɛ ne teaseɛnamkafoɔ no sɛ: Dane w’ani na fa me firi ɛdɔm yi mu, na mapira.'
      sbs: 0.7451
      gen_sec: 7.44
      ref_sec: 6.94
    '37':
      text: Na Ɔhene Salomo de anantwie mpemaduonu mmienu ne nnwan mpemha aduonu bɔɔ okum afɔdeɛ, na ɔhene
        ne ɔman no nyinaa dwiraa Nyankopɔn fie no ho.
      sbs: 0.7639
      gen_sec: 13.08
      ref_sec: 10.42
    '38':
      text: 'Na ɔsɔfoɔ no kaa sɛ: Monnku no wɔ AWURADE fie.'
      sbs: 0.7564
      gen_sec: 3.26
      ref_sec: 3.26
    '39':
      text: Yefta bisaa wɔn sɛ, “Ɛnyɛ mo na motane me, pamoo me firii mʼagya fie no?
      sbs: 0.7656
      gen_sec: 5.46
      ref_sec: 5.0
    '41':
      text: Na ɔhene no ne ne mmapɔmma ne badwa no nyinaa atu agyina wɔ Yerusalem sɛ wɔbɛdi Twam bosome
        a ɛtɔ so mmienu no so.
      sbs: 0.7802
      gen_sec: 7.96
      ref_sec: 7.64
    '43':
      text: Yehoahas dii mfeɛ aduonu mmiɛnsa na ɔbɛdii hene, na ɔdii hene abosome mmiɛnsa wɔ Yerusalem.
      sbs: 0.7212
      gen_sec: 9.6
      ref_sec: 6.38
    '44':
      text: Yehoiada maa Yoas ɔyerenom baanu a ɔne wɔn wowoo mmammarima ne mmammaa.
      sbs: 0.6961
      gen_sec: 9.36
      ref_sec: 4.2
    '45':
      text: Na Misraimhene no tuu no adeɛ so Yerusalem, na ɔgyee asase no apeatoɔ dwetɛ dwetikɛseɛ ɔha
        ne sika dwetikɛseɛ.
      sbs: 0.7362
      gen_sec: 12.12
      ref_sec: 8.84
    '46':
      text: Nanso, na Awurade mpɛ sɛ ɔsɛe Dawid ahennie nnidisoɔ, ɛfiri sɛ, na ɔne Dawid ayɛ apam ahyɛ
        bɔ sɛ, nʼasefoɔ bɛkɔ so adi ɔhene afebɔɔ.
      sbs: 0.7288
      gen_sec: 33.7
      ref_sec: 8.08
    '47':
      text: Na Sebulon antu Kitronfoɔ ne Nahalolfoɔ; na Kanaanfoɔ no tenaa wɔn mu, na wɔmaa wɔde ɔsom
        adwuma yii toɔ.
      sbs: 0.8141
      gen_sec: 11.04
      ref_sec: 8.62
    '48':
      text: Na AWURADE tiee Hesekia, na ɔsaa ɔman no yadeɛ.
      sbs: 0.7537
      gen_sec: 3.82
      ref_sec: 3.32
    '49':
      text: Na ne ba Yotam dii ɔhene fie no so, na ɔbuu asase no so man no atɛn.
      sbs: 0.7093
      gen_sec: 11.98
      ref_sec: 5.26
    '50':
      text: Na wɔamfiri ɔhene mmara asɛm a ɛda asɔfoɔ ne Lewifoɔ no soɔ no ho, nsɛm nyinaa ne akoradeɛ
        no fam.
      sbs: 0.7707
      gen_sec: 10.14
      ref_sec: 7.46
    '51':
      text: Onipa tenenee adesrɛ a emu yɛ den tumi yɛ nnoɔma bebree.
      sbs: 0.7589
      gen_sec: 7.98
      ref_sec: 4.24
    '54':
      text: 'Na Samson ka kyerɛɛ no sɛ: Sɛ wɔde nhomamono nson a ɛnwoeɛ kyekyere me a, ɛnneɛ mɛhodwo,
        na mayɛ sɛ onipa biara.'
      sbs: 0.836
      gen_sec: 9.94
      ref_sec: 8.1
    '55':
      text: Yɛde nnareka to ɔpɔnkɔ anom sɛdeɛ ɔbɛtie yɛn na yɛatumi ama wakɔ baabiara a yɛpɛ sɛ ɔkɔ.
      sbs: 0.729
      gen_sec: 7.84
      ref_sec: 6.12
    '56':
      text: Na wɔwiee Seirfoɔ no, wɔboaa wɔn ho wɔn ho kunkumm wɔn ho wɔn ho.
      sbs: 0.7541
      gen_sec: 5.26
      ref_sec: 4.86
    '57':
      text: Kerubim yi ntaban a wɔatrɛ mu no yɛ basafa du, na wɔgyinagyina wɔn nan so, na wɔn anim hwɛ
        ɛdan no.
      sbs: 0.7571
      gen_sec: 9.32
      ref_sec: 8.2
    '58':
      text: Na ogyaframa no resɔre afiri afɔrebukyia no so akɔ soro no, AWURADE bɔfoɔ no foro faa afɔrebukyia
        no so gyaframa no mu kɔɔ soro.
      sbs: 0.7404
      gen_sec: 24.32
      ref_sec: 6.72
    '60':
      text: Ɔbɔɔ mpaeɛ frɛɛ Awurade, maa ɔsaa no yadeɛ daa nsɛnkyerɛnneɛ nwanwasoɔ bi adi kyerɛɛ no.
      sbs: 0.7187
      gen_sec: 21.36
      ref_sec: 4.74
    '61':
      text: Mika buaa sɛ, “Wobisa sɛ ɛdeɛn na worehwehwɛ a na wokyerɛ sɛn?
      sbs: 0.7847
      gen_sec: 5.16
      ref_sec: 3.46
    '63':
      text: Nʼanimuonyam hyetaeɛ, ɛfiri sɛ, Awurade boaa no yie kɔsii sɛ ɔnyaa tumi kɛseɛ.
      sbs: 0.6856
      gen_sec: 15.04
      ref_sec: 4.32
    '64':
      text: 'Anaasɛ mosusu sɛ atwerɛ no kasa kwa, sɛ: Ɔtwe ne honhom a ɔte yɛn mu no ho ninkunu?'
      sbs: 0.8086
      gen_sec: 8.24
      ref_sec: 7.72
    '65':
      text: Na ne na din de Yehoadan a ɔfiri Yerusalem.
      sbs: 0.694
      gen_sec: 9.9
      ref_sec: 3.38
    '66':
      text: Na da a ɛtɔ so nson no ɔka kyerɛɛ no, ɛfiri sɛ na ɔha no.
      sbs: 0.8314
      gen_sec: 4.12
      ref_sec: 4.32
    '68':
      text: Na AWURADE abufuo dɛre tiaa Israel, na ɔtɔnee wɔn hyɛɛ Filistifoɔ ne Amonfoɔ nsa.
      sbs: 0.8223
      gen_sec: 7.42
      ref_sec: 5.38
    '69':
      text: Mpaeɛ biara a wɔbɛbɔ wɔ ha no, mɛtie, ɛfiri sɛ, mayi saa Asɔredan yi asi hɔ sɛ me fie daa
        daa.
      sbs: 0.775
      gen_sec: 8.36
      ref_sec: 5.58
    '70':
      text: 'Na Barak ka kyerɛɛ no sɛ: Sɛ wo ne me bɛkɔ a, ɛnneɛ mɛkɔ; na sɛ wo ne me renkɔ a, ɛnneɛ merenkɔ.'
      sbs: 0.8694
      gen_sec: 10.36
      ref_sec: 7.76
    '71':
      text: Na Amonfoɔ no maa no dwetɛ dwetikɛseɛ ɔha ne ayuo kor mpemdu ne atokoɔ nso mpemdu afe no mu.
      sbs: 0.7045
      gen_sec: 21.62
      ref_sec: 9.26
    '72':
      text: Na wɔde ogya totoo Twam dwan no sɛdeɛ amammerɛ teɛ.
      sbs: 0.6664
      gen_sec: 4.12
      ref_sec: 3.48
    '73':
      text: Ɛnna Israel mma no su frɛɛ AWURADE, na AWURADE maa ɔgyefoɔ bi so maa wɔn, Gera ba Ehud, Benyaminni
        a ɔyɛ abenkumma no.
      sbs: 0.7963
      gen_sec: 10.48
      ref_sec: 8.62
    '75':
      text: Ɛno na Salomo kɔɔ Esion-geber ne Elot mpoano wɔ Edom asase so.
      sbs: 0.7227
      gen_sec: 15.44
      ref_sec: 6.22
    '76':
      text: Ɔne wʼadwumfoɔ ne wɔn a me wura Dawid a ɔyɛ wʼagya no yii wɔn no bɛyɛ adwuma.
      sbs: 0.7243
      gen_sec: 6.38
      ref_sec: 4.22
    '78':
      text: Na Israelfoɔ no kɔɔ so yɛɛ deɛ ɛyɛ AWURADE ani so bɔne; nso na Ehud awu.
      sbs: 0.7605
      gen_sec: 7.0
      ref_sec: 4.22
    '79':
      text: Wɔfifiri akyirikyiri te sɛ Lebo Hamat a ɛwɔ atifi fam kɔsi Misraim asuwa anafoɔ fam no.
      sbs: 0.7224
      gen_sec: 7.18
      ref_sec: 5.26
    '80':
      text: Na ɔne no pam sɛ wɔbɛyeyɛ ahyɛn akɔ Tarsis, na wɔpempam ahyɛn no Esion-geber.
      sbs: 0.7205
      gen_sec: 11.66
      ref_sec: 7.26
    '81':
      text: 'Na ɔka kyerɛɛ wɔn sɛ: Odidifoɔ mu na aduane firi baeɛ.'
      sbs: 0.7522
      gen_sec: 9.5
      ref_sec: 3.78
    '82':
      text: Afei, asɔfoɔ no kunkumm mpapo no sɛ bɔne ho afɔrebɔ, de wɔn mogya petee afɔrebukyia no so,
        sɛ bɔne ho mpatadeɛ maa Israel nyinaa.
      sbs: 0.7455
      gen_sec: 9.94
      ref_sec: 8.0
    '83':
      text: Na Israel hene no sakyeraa ne ho, na ɔkɔɔ dɔm no mu.
      sbs: 0.7402
      gen_sec: 3.68
      ref_sec: 3.32
    '85':
      text: Adekyeɛ mu no, nnipa no tuaa nhema sii afɔrebukyia, na wɔbɔɔ ɔhyeɛ ne asomdwoeɛ afɔdeɛ.
      sbs: 0.7766
      gen_sec: 9.56
      ref_sec: 5.58
    '86':
      text: Ɔhene Ahas wuiɛ no, wɔsiee no wɔ Yerusalem, nanso wɔansie no wɔ adehyeɛ amusieeɛ.
      sbs: 0.7261
      gen_sec: 8.0
      ref_sec: 4.72
    '87':
      text: Na ɔde ayɛyɛdeɛ no kɔmaa Moabhene Eglon; nso na Eglon yɛ onipa brane pa ara.
      sbs: 0.7381
      gen_sec: 9.52
      ref_sec: 5.7
    '88':
      text: Na yɛn mu biara bɛma wo nnwetɛbena kilogram dumienu ne fa.
      sbs: 0.7019
      gen_sec: 9.44
      ref_sec: 3.36
    '89':
      text: 'Ɛnna Israel hene no boaboaa adiyifoɔ no ano hyiaeɛ, nnipa ahanan, na ɔka kyerɛɛ wɔn sɛ: Yɛnkɔ
        Ramot-gilead nkɔko, anaasɛ mennyae?'
      sbs: 0.7658
      gen_sec: 20.2
      ref_sec: 9.82
    '90':
      text: 'Na Usia tii n’agyanom wɔ asamando, na wɔsiee no n’agyanom nkyɛn ahemfo asieeɛ asase no so,
        na wɔkaa sɛ: Ɔyaree kwata.'
      sbs: 0.7916
      gen_sec: 13.82
      ref_sec: 9.56
    '91':
      text: Na wɔde ntampehoma foforɔ mmienu kyekyeree no, na wɔde no foro firii ɔbotan no mu.
      sbs: 0.7753
      gen_sec: 6.88
      ref_sec: 4.54
    '92':
      text: Filistifoɔ aba sɛ wɔrebɛkye wo!
      sbs: 0.7211
      gen_sec: 8.84
      ref_sec: 5.5
    '93':
      text: Na asɔfoɔ no kunkumm wɔn, na wɔde wɔn mogya no yɛɛ bɔne ho afɔdeɛ guu afɔrebukyia no ho sɛ
        wɔde repata ama Israel nyinaa.
      sbs: 0.709
      gen_sec: 26.6
      ref_sec: 8.78
    '94':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7612
      gen_sec: 7.32
      ref_sec: 3.3
    '95':
      text: Nanso ɔhyeɛ afɔdeɛ ne asomdwoeɛ afɔdeɛ ho sradeɛ ne ahwiesa a ɛka ɔhyeɛ afɔdeɛ no ho dɔɔso
        bebree.
      sbs: 0.7233
      gen_sec: 8.32
      ref_sec: 7.62
    '96':
      text: Sika a wɔgyegyee no Awurade Asɔredan no mu no, wɔde ama sohwɛfoɔ ne adwumayɛfoɔ no.
      sbs: 0.7114
      gen_sec: 11.48
      ref_sec: 4.14
    '97':
      text: Na yei kɔɔ so ara kɔsii sɛ, mfeɛ mmienu awieeɛ no, n’ayamdeɛ firii adie yadeɛ no ara mu, na
        ɔwuu yea kɛseɛ mu.
      sbs: 0.7867
      gen_sec: 10.46
      ref_sec: 8.9
    '98':
      text: Ɛwom, saa asɔredan yi yɛ fɛ deɛ, nanso ɛbɛyɛ atantanneɛ ama wɔn a wɔtwa mu hɔ no.
      sbs: 0.75
      gen_sec: 7.66
      ref_sec: 5.0
    '99':
      text: Na Samson siane kɔɔ Timna, na ɔkɔhunuu ɔbaa bi wɔ Timna a ɔyɛ Filistifoɔ mmammaa no bi.
      sbs: 0.7724
      gen_sec: 7.58
      ref_sec: 5.94
    '100':
      text: Na wɔsiane dii n’akyi, na wɔkɔfaa Yordan atwareeɛ a wɔde kɔ Moab no, na wɔamma obiara antwa.
      sbs: 0.7966
      gen_sec: 7.34
      ref_sec: 6.74
    '101':
      text: Na afei, mo adefoɔ e, mo amanehunu a ɛreba mo soɔ nti, monsu na mommɔ bena!
      sbs: 0.7954
      gen_sec: 6.78
      ref_sec: 6.48
    '102':
      text: Na ɔsane sii Awurade afɔrebukyia no, bɔɔ asomdwoeɛ afɔdeɛ ne aseda afɔdeɛ wɔ so.
      sbs: 0.7282
      gen_sec: 10.06
      ref_sec: 4.64
    '104':
      text: Ɛnna Hilkia ne wɔn a ɔhene somaa wɔn no kɔɔ Odiyifoɔbaa Hulda a ɔyɛ Hasra ba Tikwat ba Salum
        ntadehwɛfoɔ yere no nkyɛn.
      sbs: 0.7041
      gen_sec: 24.44
      ref_sec: 10.26
    '106':
      text: Sikakɔkɔɔ amapa bɛyɛ nkariboɔ tɔno aduonu mmiɛnsa na wɔde guu so.
      sbs: 0.6878
      gen_sec: 10.0
      ref_sec: 3.5
    '107':
      text: Wɔmaa Yoas Onyankopɔn mmara nwoma no bi daa no adi sɛ ɔhene.
      sbs: 0.7049
      gen_sec: 5.96
      ref_sec: 3.58
    '108':
      text: Ɛnna asomafoɔ no sene firii kuro mu kɔɔ kuro mu, Efraim ne Manase asase so de kɔsii Sebulon
        tɔnn.
      sbs: 0.7365
      gen_sec: 12.88
      ref_sec: 7.24
    '109':
      text: 'Na ɔka kyerɛɛ no sɛ: Mete sɛ wo, na me man te sɛ wo man, me ne wo bɛkɔ ɔsa no.'
      sbs: 0.7646
      gen_sec: 7.4
      ref_sec: 6.16
    '112':
      text: Ɛnna Yefta ne Gilead mpanimfoɔ no sii mu baeɛ, na ɔman no de no sii wɔn ti ne ɔsafohene.
      sbs: 0.8054
      gen_sec: 9.24
      ref_sec: 6.34
    '114':
      text: Yosia ahennie ho nsɛm nkaeɛ ne nʼahofama sɛdeɛ Awurade mmara teɛ no, firi ahyɛaseɛ kɔsi awieeɛ
        no, wɔatwerɛ agu Israel ne Yuda Ahemfo Nwoma mu.
      sbs: 0.7156
      gen_sec: 11.22
      ref_sec: 10.96
    '115':
      text: Afei Israelfoɔ su frɛɛ Awurade sɛ, “Yɛayɛ bɔne atia wo, ɛfiri sɛ yɛatwe yɛn ho afiri yɛn Onyankopɔn
        ho na yɛasom Baal ahoni.
      sbs: 0.7447
      gen_sec: 12.22
      ref_sec: 8.0
    '116':
      text: Saa fie yi mu nnipa kɔɔ so yɛɛ asɔfoɔ maa Dan abusuakuo kɔsii Otukorɔ berɛ.
      sbs: 0.7636
      gen_sec: 5.22
      ref_sec: 4.68
    '117':
      text: nkukuo, nsofi, ɛnam nnarewa ne nneɛma a ɛkeka ho nyinaa.
      sbs: 0.6924
      gen_sec: 17.92
      ref_sec: 4.0
    '118':
      text: Afei, Nun babarima Yosua, Awurade ɔsomfoɔ wuiɛ a na wadi mfirinhyia ɔha ne edu.
      sbs: 0.761
      gen_sec: 6.58
      ref_sec: 11.78
    '119':
      text: Na wɔntena ɔhene no ho n’adifire ne ne muba mu.
      sbs: 0.7142
      gen_sec: 2.96
      ref_sec: 3.52
    '120':
      text: Ɔyɛɛ dwaresɛn edu a wɔkora nsuo a wɔde hohoro afɔrebɔdeɛ ho.
      sbs: 0.7013
      gen_sec: 4.54
      ref_sec: 3.7
    '121':
      text: Na Bet-semesfoɔ ne Bet-anatfoɔ no de ɔsom adwuma yii wɔn toɔ.
      sbs: 0.7328
      gen_sec: 13.62
      ref_sec: 4.6
    '122':
      text: Anammɔn baako biara mu no, na anantwie sɛso nsia wɔ so a wɔagu ama afra nsukoradeɛ no.
      sbs: 0.7586
      gen_sec: 6.16
      ref_sec: 5.5
    '124':
      text: Ɔde awɛmfoɔ no twaa ɔhene no ho hyiaeɛ a wɔayɛ wɔn akodeɛ krado.
      sbs: 0.7626
      gen_sec: 7.68
      ref_sec: 3.76
    '125':
      text: Monnsuro Asiriahene anaa nʼakodɔm kɛseɛ no, na yɛwɔ tumi a ɛso wɔ yɛn afa.
      sbs: 0.7123
      gen_sec: 7.28
      ref_sec: 4.74
    '126':
      text: Na akodɔm no dodoɔ yɛ ɔpehasa ne nson ne ahanum a wɔn nyinaa nim de.
      sbs: 0.7397
      gen_sec: 7.0
      ref_sec: 4.48
    '127':
      text: Na Yuda kɔfaa Gasa ne ne hyeɛ ne Askelon ne ne hyeɛ ne Ekron ne ne hyeɛ.
      sbs: 0.7533
      gen_sec: 14.42
      ref_sec: 5.02
    '128':
      text: Woyɛ no yie; ahonhommɔne nso gye di, na wɔn ho popo.
      sbs: 0.8427
      gen_sec: 4.52
      ref_sec: 4.52
    '131':
      text: Na Yehoram dii n’agya adeɛ na n’ahennie gyinaa pintinn no, ɔde nkrantɛ kunkumm ne nuammarimanom
        nyinaa ne Israel mmapɔmma mu binom nso.
      sbs: 0.8032
      gen_sec: 13.06
      ref_sec: 9.88
    '132':
      text: Na Benyamin atɔfoɔ a wɔtotɔɔ da no nyinaa yɛ mmarima mpemaduonu nnum a wɔtwe nkrantɛ; yeinom
        nyinaa yɛ mmarima akofoɔ.
      sbs: 0.8203
      gen_sec: 8.2
      ref_sec: 7.0
    '133':
      text: Na ɔbarima yi deɛ, monnyɛ no nkwaseadeɛ a ɛte sɛɛ.
      sbs: 0.7389
      gen_sec: 6.64
      ref_sec: 3.3
    '134':
      text: Ɛfiri odiyifoɔ Samuel berɛ so no, wɔnnii Twam Afahyɛ sei da.
      sbs: 0.7456
      gen_sec: 3.84
      ref_sec: 3.32
    '135':
      text: Na Ahas boaboaa Nyankopɔn fie nnwinneɛ ano, na ɔtwitwaa Nyankopɔn fie nnwinneɛ no mu, na ɔtotoo
        AWURADE fie apono no mu.
      sbs: 0.7658
      gen_sec: 10.24
      ref_sec: 8.6
    '137':
      text: Mo deɛ, ɛnyɛ mo ara na ɛso deda mo soɔ AWURADE mo Nyankopɔn anim?
      sbs: 0.6091
      gen_sec: 8.78
      ref_sec: 4.04
    '138':
      text: Ɔbaa no de mmirika kɔɔ ne kunu nkyɛn kɔbɔɔ no amaneɛ sɛ, “Onyankopɔn onipa bi yii ne ho adi
        kyerɛɛ me.
      sbs: 0.7419
      gen_sec: 7.74
      ref_sec: 5.18
    '139':
      text: Na wanyɛ deɛ ɛtene AWURADE ani so sɛ n’agya Dawid.
      sbs: 0.6298
      gen_sec: 13.22
      ref_sec: 3.0
    '140':
      text: Amorifoɔ no nso twaa Yordan kɔɔ atɔeɛ fam kɔto hyɛɛ Yuda, Benyamin ne Efraim so, Israelfoɔ
        kɔɔ ahokyere kɛseɛ mu.
      sbs: 0.7509
      gen_sec: 9.28
      ref_sec: 7.6
    '141':
      text: Na ɔsu guu ne so nnanson no a apontoɔ no gu soɔ no nyinaa.
      sbs: 0.7825
      gen_sec: 3.78
      ref_sec: 3.52
    '142':
      text: Yosia ahennie afe a ɛtɔ so dunwɔtwe so na wɔdii Twam yi.
      sbs: 0.6745
      gen_sec: 4.78
      ref_sec: 3.28
    '143':
      text: Nanso Amonfoɔ hene antie Yefta nsɛm a ɔsoma maa wɔkɔka kyerɛɛ no no.
      sbs: 0.7155
      gen_sec: 22.58
      ref_sec: 4.54
    '144':
      text: Wɔmaa wɔn ntadeɛ ne mpaboa sɛ wɔnhyɛ ne nnuane pii ne nsuo, de ngo guguu wɔn apirakuro mu.
      sbs: 0.7159
      gen_sec: 6.32
      ref_sec: 5.76
    '145':
      text: “Fa atokoɔ, ngo ne nsã a wokaa ho asɛm no bra.
      sbs: 0.7214
      gen_sec: 4.86
      ref_sec: 3.22
    '146':
      text: Monnye AWURADE mo Nyankopɔn nni, na mobɛtim, na monnye n’adiyifoɔ no nni, na mobɛdi yie.
      sbs: 0.779
      gen_sec: 18.16
      ref_sec: 6.7
    '147':
      text: Ɛnna wɔsiesiee ɔsom no, na asɔfoɔ no gyinagyinaa wɔn agyinaeɛ, na Lewifoɔ no nso wowɔ wɔn
        nkyekyɛmu mu, sɛdeɛ ɔhene hyɛeɛ no.
      sbs: 0.7721
      gen_sec: 11.48
      ref_sec: 9.1
    '149':
      text: Na ɔwɔ mmammarima aduasa a na wɔtenatena mfunumu mma aduasa soɔ na wɔwɔ nkuro aduasa a wɔfrɛ
        no Yair nkuro de bɛsi nnɛ.
      sbs: 0.7819
      gen_sec: 11.82
      ref_sec: 10.1
    '152':
      text: Ɔnam ɔno ara ne pɛ so na ɔde ne nokwasɛm woo yɛn, sɛ yɛnyɛ n’abɔdeɛ no mu adekan bi.
      sbs: 0.8006
      gen_sec: 7.22
      ref_sec: 7.32
    '153':
      text: Na asɔfoɔ no hyenhyɛnee ntotorobɛnto, wɔn ntentensoɔ, na Israel nyinaa gyinagyina hɔ.
      sbs: 0.7327
      gen_sec: 22.1
      ref_sec: 6.32
    '154':
      text: Na ɔsomaa adiyifoɔ maa wɔbaa wɔn mu sɛ wɔmmɛsane wɔn mmra AWURADE nkyɛn, na wɔdii wɔn adanseɛ,
        nanso wɔantie.
      sbs: 0.7436
      gen_sec: 7.96
      ref_sec: 8.52
    '156':
      text: Efraim abusuakuo no boaboaa akodɔm ano twa kɔɔ Safon.
      sbs: 0.735
      gen_sec: 4.76
      ref_sec: 3.34
    '157':
      text: Saa ɛberɛ no na Amonfoɔ asraadɔm aboa wɔn ho ano wɔ Gilead, sɛ wɔrekɔto ahyɛ Israel akodɔm
        so wɔ Mispa.
      sbs: 0.751
      gen_sec: 13.16
      ref_sec: 6.18
    '158':
      text: Na osuo antɔ asase so mfeɛ mmiɛnsa ne abosome nsia.
      sbs: 0.7026
      gen_sec: 15.94
      ref_sec: 4.2
    '159':
      text: Wɔbɔɔ nnua dwumfoɔ ne adansifoɔ paa, tɔɔ aboɔ a wɔatwa a wɔde bɛsiesie afasuo no ne nnua a
        wɔde bɛyɛ nsamsoɔ ne mpunan.
      sbs: 0.7512
      gen_sec: 9.68
      ref_sec: 7.9
    '160':
      text: Ahasia dii mfeɛ aduanan mmienu na ɔbɛdii hene, na ɔdii hene afe baako wɔ Yerusalem.
      sbs: 0.743
      gen_sec: 7.38
      ref_sec: 7.02
    '163':
      text: Na ɔwɔ mmammarima aduanan ne mmanana aduasa a wɔtenaa mfunumu aduɔson soɔ.
      sbs: 0.8111
      gen_sec: 8.64
      ref_sec: 5.56
    '164':
      text: Na wɔreyi sika a wɔde aba AWURADE fie no, Ɔsɔfoɔ Hilkia hunuu AWURADE mmara nwoma a ɔnam Mose
        so de maeɛ no.
      sbs: 0.7764
      gen_sec: 11.14
      ref_sec: 8.12
    '166':
      text: Na ne mma no ne ɛtoɔ dodoɔ a wɔgyee no no, ne Nyankopɔn fie asiesie no, hwɛ, wɔatwerɛ no Ahemfo
        Nwoma Nkyerɛaseɛ no mu.
      sbs: 0.754
      gen_sec: 21.06
      ref_sec: 8.98
    '167':
      text: Na ne ba Amasia bɛdii n’adeɛ.
      sbs: 0.7211
      gen_sec: 9.0
      ref_sec: 4.34
    '168':
      text: Na me nuanom, yeinom nyinaa akyiri no, monnka ntam!
      sbs: 0.7377
      gen_sec: 11.8
      ref_sec: 4.18
    '169':
      text: Enti afei, monkeka mo bɔne nkyerɛ mo ho mo ho, na mommobɔ mpaeɛ mma mo ho mo ho sɛdeɛ ɛbɛyɛ
        a, wɔbɛsa mo yadeɛ.
      sbs: 0.742
      gen_sec: 10.02
      ref_sec: 8.26
    '170':
      text: Na Yehoiada bɔɔ akora, na wanyini pa ara no, ɔwui.
      sbs: 0.7117
      gen_sec: 11.28
      ref_sec: 3.8
    '172':
      text: Ɔde apono ano ahwɛfoɔ no sisii Awurade Asɔredan apono ano, sɛdeɛ wɔremma wɔn a wɔn ho nte
        no nkɔ mu.
      sbs: 0.702
      gen_sec: 8.68
      ref_sec: 5.84
    '173':
      text: Saa mmarima yi frɛfrɛɛ wɔn mfɛfoɔ Lewifoɔ, na wɔdwiraa wɔn ho.
      sbs: 0.7424
      gen_sec: 5.22
      ref_sec: 3.16
    '174':
      text: Na Israelfoɔ no tenaa Kanaanfoɔ, Hetifoɔ ne Amorifoɔ ne Perisifoɔ ne Hewifoɔ ne Yebusifoɔ
        no mu.
      sbs: 0.8087
      gen_sec: 11.12
      ref_sec: 7.8
    '175':
      text: Wɔbɔɔ asomdwoeɛ afɔdeɛ, na ɔmanfoɔ kaa wɔn bɔne kyerɛɛ Awurade, wɔn agyanom Onyankopɔn.
      sbs: 0.7253
      gen_sec: 7.34
      ref_sec: 4.58
    '176':
      text: Me nuanom, sɛ obi ka sɛ, “Mewɔ gyidie” na ɔnni gyidie no ho dwuma a, mfasoɔ bɛn na ɛwɔ soɔ?
      sbs: 0.7362
      gen_sec: 17.12
      ref_sec: 6.72
    '177':
      text: 'Na Yehosafat ka kyerɛɛ Israel hene no sɛ: Mesrɛ wo, kɔbisa AWURADE ansa.'
      sbs: 0.7145
      gen_sec: 11.42
      ref_sec: 5.14
    '178':
      text: 'Na Israelfoɔ kaa sɛ: Momma yɛnnwane, na yɛntwe wɔn mfiri kuro no mu mmra atempɔn so.'
      sbs: 0.8143
      gen_sec: 5.62
      ref_sec: 5.74
    '179':
      text: Na wɔkɔkaa saa kyerɛɛ no.
      sbs: 0.7052
      gen_sec: 5.66
      ref_sec: 5.44
    '180':
      text: Babiloniafoɔ no kunkumm Yuda mmabunu maa mpo, wɔtaa wɔn kɔɔ Asɔredan no mu.
      sbs: 0.7085
      gen_sec: 16.42
      ref_sec: 4.9
    '182':
      text: Ɛnyɛ wone yɛn Nyankopɔn a wotuu asase yi sofoɔ firii wo man Israel anim na wode maa wo dɔfo
        Abraham asefoɔ sɛ wɔntena so daa?
      sbs: 0.7552
      gen_sec: 16.74
      ref_sec: 9.46
    '183':
      text: Ɔyɛɛ abosonsom asɔreeɛ wɔ Yuda nkuro nyinaa so a wɔbɔ afɔdeɛ wɔ hɔ ma anyame foforɔ no.
      sbs: 0.7267
      gen_sec: 8.04
      ref_sec: 5.18
    '184':
      text: Ɛfiri ano kɔsi ano yɛ basafa nnum.
      sbs: 0.6685
      gen_sec: 6.7
      ref_sec: 3.04
    '185':
      text: Na ɔman no nyinaa kɔɔ Baal fie kɔdwirii gui, na n’afɔrebukyia ne n’ahoni no, wɔbubui, na Baal
        sɔfoɔ Matan nso, wɔkumm no afɔrebukyia no anim.
      sbs: 0.7505
      gen_sec: 10.9
      ref_sec: 10.88
    '186':
      text: Huram brɛɛ no ahyɛn a ɔno ankasa mpanimfoɔ hwɛ so, na emu adwumayɛfoɔ yɛ wɔn a wɔnim adwuma
        yie.
      sbs: 0.7265
      gen_sec: 12.22
      ref_sec: 5.98
    '187':
      text: Na bosome a ɛtɔ so nson no da a ɛtɔ so aduonu mmiɛnsa no, ɔgyaa ɔman no kwan maa wɔkɔɔ wɔn
        afie.
      sbs: 0.7119
      gen_sec: 16.72
      ref_sec: 5.78
    '189':
      text: Na ne ba Hesekia bɛdii n’adeɛ.
      sbs: 0.6833
      gen_sec: 7.6
      ref_sec: 4.28
    '190':
      text: Na afei monyi mma busufoɔ a wɔwɔ Gibea no mmra na yɛnku wɔn, na yɛnyi bɔne no mfiri Israel.
      sbs: 0.8108
      gen_sec: 9.52
      ref_sec: 6.68
    '191':
      text: Na anigyeɛ kɛseɛ baa Yerusalem; anigyeɛ a ɛfiri Dawid ba Salomo berɛ so ebi mmaa Yerusalem
        saa da.
      sbs: 0.7422
      gen_sec: 7.5
      ref_sec: 6.5
    '192':
      text: AWURADE Nyankopɔn, nnane deɛ woasra no no ani.
      sbs: 0.7445
      gen_sec: 6.12
      ref_sec: 3.88
    '194':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7777
      gen_sec: 3.8
      ref_sec: 3.84
    '196':
      text: Na Yehosafat nyaa ahodeɛ ne animuonyam bebree.
      sbs: 0.7577
      gen_sec: 2.62
      ref_sec: 3.96
    '199':
      text: Na Salomo wiee AWURADE fie ne ɔhene fie no.
      sbs: 0.5933
      gen_sec: 8.26
      ref_sec: 3.44
    '200':
      text: Wɔfirii Efraim a wɔn nhini muni dii Amalek soɔ.
      sbs: 0.7194
      gen_sec: 9.16
      ref_sec: 3.26
    '201':
      text: Afei, nso, nneɛma a ɔhene Ahas tasee wɔ ɛberɛ a na ɔyɛ asoɔden, na ɔtoo asɔredan no mu no
        nso, yɛakɔgye ne nyinaa.
      sbs: 0.7445
      gen_sec: 11.1
      ref_sec: 7.36
    '202':
      text: Wɔn nyinaa ani gyeeɛ, ɛfiri sɛ, na Awurade ne Dawid, Salomo ne nkurɔfoɔ Israelfoɔ adi no yie.
      sbs: 0.7283
      gen_sec: 9.58
      ref_sec: 5.26
    '203':
      text: Na ɔde sika kataa ɛdan no mpuna, aponnwa, n’afasuo ne n’apono ntanta no ho.
      sbs: 0.7003
      gen_sec: 18.36
      ref_sec: 5.62
    '204':
      text: Enti, anuanom, monya abodwokyɛre nkɔduru da a Awurade bɛba.
      sbs: 0.805
      gen_sec: 5.16
      ref_sec: 4.28
    '205':
      text: Nnipa a wɔyɛɛ adwuma wɔ mo mfuo mu no, montuaa wɔn ka enti wɔresi apinie.
      sbs: 0.7095
      gen_sec: 11.92
      ref_sec: 5.48
    '206':
      text: Ne berɛ so na Edom tee atua firii Yuda nsa aseɛ, na wɔkɔsii wɔn so hene.
      sbs: 0.7547
      gen_sec: 6.0
      ref_sec: 6.16
    '208':
      text: Anuanom, monngugu ahome nntiatia mo ho, na wɔammu mo atɛn.
      sbs: 0.7177
      gen_sec: 36.52
      ref_sec: 5.76
    '210':
      text: Ɛberɛ biara a Israelfoɔ bɛkɔ ɔko no, Awurade ko tia wɔn ma wɔdi nkoguo, sɛdeɛ ɔhyɛɛ bɔ no.
      sbs: 0.7114
      gen_sec: 7.08
      ref_sec: 14.16
    '211':
      text: 'Na Manoa ka kyerɛɛ ne yere sɛ: Wuo na yɛrebɛwuwuo, sɛ yɛahunu Onyankopɔn yi.'
      sbs: 0.792
      gen_sec: 5.7
      ref_sec: 4.6
    '212':
      text: Aboɔdemmoɔ a ɛyɛ fɛ ne sikakɔkɔɔ a ɛfiri Parwaim na wɔde siesiee Asɔredan no afasuo ho.
      sbs: 0.7585
      gen_sec: 10.56
      ref_sec: 5.14
    '213':
      text: Ahonhommɔne nso gye di saa ara na wɔn ho popo wɔ suro mu.
      sbs: 0.7673
      gen_sec: 7.18
      ref_sec: 3.78
    '214':
      text: Na Israelfoɔ no nso firii hɔ berɛ no mu kɔɔ wɔn mmusuakuo ne wɔn mmusua mu, na wɔfirii hɔ
        kɔɔ wɔn agyapadeɛ ho.
      sbs: 0.8162
      gen_sec: 7.74
      ref_sec: 6.66
    '215':
      text: Ɔwɔ akuafoɔ ne bobeturoyɛfoɔ, mmepɔ so ne Karmel so, ɛfiri sɛ na ɔpɛ kua.
      sbs: 0.7513
      gen_sec: 7.78
      ref_sec: 5.86
    '217':
      text: Afei, da bi anadwo, Awurade yii ne ho adi kyerɛɛ Salomo, na ɔka kyerɛɛ no sɛ.
      sbs: 0.7766
      gen_sec: 5.6
      ref_sec: 4.36
    '218':
      text: Ɔworɔɔ nʼahentadeɛ no guu nkyɛn baabi sɛdeɛ atamfoɔ no renhunu no.
      sbs: 0.6894
      gen_sec: 6.8
      ref_sec: 3.32
    '219':
      text: Israelfoɔ no bisaa deɛ ɛyɛeɛ a saa awudisɛm yi siiɛ.
      sbs: 0.5671
      gen_sec: 6.7
      ref_sec: 3.14
    '222':
      text: 'Na ɔman no nyinaa sɔre gyinaa sɛ ɔbarima baako kaa sɛ: Yɛn mu biara renkɔ ntomadan mu, na
        yɛn mu biara remmane ne fie.'
      sbs: 0.7771
      gen_sec: 11.86
      ref_sec: 7.96
    '223':
      text: Na Hesekia kaa sɛ wɔmmɔ ɔhyeɛ afɔdeɛ afɔrebukyia no so.
      sbs: 0.8028
      gen_sec: 4.38
      ref_sec: 4.14
    '224':
      text: Na sɛ mowɔ nitanmmɔne ne mansotwe mo akoma mu a, ɛnneɛ monnhoahoa mo ho, na monnni atorɔ nntia
        nokorɛ.
      sbs: 0.7441
      gen_sec: 7.52
      ref_sec: 11.38
    '226':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7515
      gen_sec: 16.4
      ref_sec: 9.02
    '227':
      text: Mekaa sɛ, Meremmu mʼapam a me ne mo ayɛ no so.
      sbs: 0.7487
      gen_sec: 3.66
      ref_sec: 3.82
    '228':
      text: Na Yehoiada waree yerenom baanu maa no, na ɔwoo mmammarima ne mmammaa.
      sbs: 0.7589
      gen_sec: 14.66
      ref_sec: 5.22
    '229':
      text: Ɛsɛ sɛ nnipa a aka no di Awurade mmara so, na wɔtenatena afikyire.
      sbs: 0.7016
      gen_sec: 13.64
      ref_sec: 3.46
    '230':
      text: ’ Afei, Ao Awurade, Israel Onyankopɔn, di saa bɔ a woahyɛ wo ɔsomfoɔ Dawid no so.
      sbs: 0.7501
      gen_sec: 13.26
      ref_sec: 3.98
    '231':
      text: 'Wɔn a wɔfiri Kohat abusua mu no ne: Amasai babarima Mahat ne Asaria babarima Yoɛl.'
      sbs: 0.7443
      gen_sec: 18.88
      ref_sec: 5.5
    '232':
      text: Na Israelfoɔ no de ayɛyɛdeɛ nam ne so kɔmaa Moabhene Eglon.
      sbs: 0.7693
      gen_sec: 5.92
      ref_sec: 3.84
    '233':
      text: Ɔsɔfoɔ no kaa sɛ, “Monkɔ no asomdwoeɛ mu, ɛfiri sɛ, Awurade bɛdi mo anim wɔ mo akwantuo no
        mu.
      sbs: 0.7515
      gen_sec: 6.58
      ref_sec: 9.2
    '234':
      text: Na ahyɛn no bobɔe, na wɔantumi ankɔ Tarsis.
      sbs: 0.7971
      gen_sec: 4.34
      ref_sec: 5.74
    '235':
      text: 'Na ɔka kyerɛɛ no sɛ: Sɛ wode me tirinwi mpɛsɛmpɛsɛ nson de fra ntomaban nwono a.'
      sbs: 0.7536
      gen_sec: 17.34
      ref_sec: 6.74
    '236':
      text: Ɛberɛ a saa akofoɔ yi duruu Efraim bepɔ asase so no, wɔkɔɔ Mika fie kɔdaa hɔ anadwo no.
      sbs: 0.7552
      gen_sec: 7.4
      ref_sec: 5.36
    '237':
      text: Na ɔtotoo aban atentene nso ɛserɛ so, na ɔtutuu mmura pii, ɛfiri sɛ na ɔwɔ mmoakuo bebree
        mpaperɛ ne asaseta so.
      sbs: 0.7426
      gen_sec: 11.94
      ref_sec: 9.16
    '238':
      text: Nanso, ɛrekɔ nʼasetena awieeɛ no, ɔhene Yehosafat ne Israelhene Ahasia a ne tirim yɛ den no
        kaa wɔn ho bɔɔ mu.
      sbs: 0.7308
      gen_sec: 10.6
      ref_sec: 6.46
    '239':
      text: Afei, Ehud totoo apono no mu foroo agyanan dan no, faa ne nsuseneeɛ no mu dwane kɔeɛ.
      sbs: 0.7533
      gen_sec: 7.42
      ref_sec: 4.9
    '242':
      text: Ɛnna wɔkumm Twam Dwan no bosome a ɛtɔ so mmienu no da a ɛtɔ so dunan no.
      sbs: 0.7491
      gen_sec: 5.56
      ref_sec: 4.76
    '243':
      text: Baabi a ɔsii abosonsom asɔreeɛ, sisii Asera afɔrebukyia ne ahoni ansa na ɔrenu ne ho no nso
        ka ho.
      sbs: 0.7452
      gen_sec: 18.82
      ref_sec: 6.74
    '246':
      text: AWURADE temmufoɔ no ɔmmu Israelfoɔ ne Amonfoɔ ntam atɛn nnɛ.
      sbs: 0.7394
      gen_sec: 10.1
      ref_sec: 5.12
    '247':
      text: Na wɔkaa sɛ, “Adɛn enti na ɛsɛ sɛ Asiria ahemfo bɛba ha abɛnya nsuo bebree?
      sbs: 0.7324
      gen_sec: 7.18
      ref_sec: 4.6
    '248':
      text: Na Sikri, Efraim dɔmmarima bi, kumm ɔhene ba Maaseia ne ahemfie bapɔmma Asrikam ne Elkana
        a ɔdi ɔhene akyire.
      sbs: 0.7323
      gen_sec: 16.42
      ref_sec: 9.02
