      sbs: 0.5947
      gen_sec: 5.4
      ref_sec: 6.38
      cer: 0.1625
      wer: 0.4737
    bible_00167:
      source: bible
      text: Ka Yisa daa labsi n‑yɛli ba, “Ka bɔ n niŋi ka yarima za'asiri Naawunni zaaligu, ya yaadima
