      cer: 0.0125
      wer: 0.0588
    bible_00159:
      source: bible
      text: Ti yi ti yɛli, ni, ti ka la tumbeeri, ti yɔmsiri la ti maŋŋa ka yɛlimaŋni ka ti ni.
      sbs: 0.6648
      gen_sec: 4.22
      ref_sec: 4.94
      cer: 0.0164
      wer: 0.0526
    bible_00160:
      source: bible
      text: Ka ban daa kɔŋŋi yam la daa ti yɛli ba taaba, ni, ‘Ya ku ti ti kpaam ka ti niŋi ti firiladima
