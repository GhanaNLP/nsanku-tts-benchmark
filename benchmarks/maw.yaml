      cer: 0.1509
      wer: 0.4138
    bible_00140:
      source: bible
      text: Ninvugseeba ban daa bɛ tooni, ni seeba gba ban daa bɛ nyaaŋŋa n‑dɔli maa daa piili n‑kpalimna
