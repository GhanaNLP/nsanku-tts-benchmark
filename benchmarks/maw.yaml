      text: Yan di kyɛ ka ya veelim yiiri la ya sutura bɔbri ni, hoo zugu paaŋŋu bee salima bansi ni nangɔkɔrisi
        ni kyinkyinveela soobu;
      sbs: 0.6609
      gen_sec: 7.6
      ref_sec: 9.28
      cer: 0.05
      wer: 0.2174
    bible_00149:
      source: bible
      text: Ka Yisa daa gyɛrigi n‑yɛli “Ninvugŋɔni n lee n‑nyɛ daabsɔ ŋɔn mari yɛm ni yɛdda? - ka u dugma
        zaŋŋi u yiri maa fukumsi n‑niŋi u nuu ni, ni u basiri mɔnni n‑tiri ba, mɔnni basibu saha.
      sbs: 0.6789
      gen_sec: 15.12
      ref_sec: 13.58
      cer: 0.0949
      wer: 0.3889
    bible_00150:
      source: bible
      text: Tɔ, m mabiisi, n ya teaai ya la man ŋɔn daa mooli lahabasuŋŋu maa n‑ti ya seem. Lahabaari
        wa ka ya daa deaai, ka lahabaari maa zugu ka ya kpalim n‑zɛ yummu.
      sbs: 0.7229
      gen_sec: 11.36
      ref_sec: 14.1
      cer: 0.0169
      wer: 0.0625
    bible_00151:
      source: bible
      text: Kirisita siri ku toaai n‑lɔ nangbanyinni ni Sintaani; bee, yɛdda daana ku toaai n‑nyɛ ŋɔn
        za'asi yɛdda niŋbu la taraana.
      sbs: 0.6065
      gen_sec: 11.28
      ref_sec: 8.72
      cer: 13.5579
      wer: 22.05
    bible_00152:
      source: bible
      text: Ka sɔkam daa nya u kyɛnni maa ka pɛ'ari Naawunni,
      sbs: 0.656
      gen_sec: 4.16
      ref_sec: 3.76
      cer: 0.1316
      wer: 0.3
    bible_00153:
      source: bible
      text: Dizugu n daa mɔ'asiri ya la bisim, pa dikpeema; dama ya daa bu sa'ai ditibsa diibu. Halli
        ni zuna ya na ku toaai n‑deaai ninvugkura diibu,
      sbs: 0.6309
      gen_sec: 8.96
      ref_sec: 10.74
      cer: 0.0566
      wer: 0.2692
    bible_00154:
      source: bible
      text: Dinŋɔ nyaaŋŋa ka Yisa daa kyɛ ba m‑bakki n‑yi Gyɛrusalɛm timpuuni n‑kyaŋŋi nti paai Bɛtani
        tinkpaŋŋa n‑gbɛa.
      sbs: 0.6841
      gen_sec: 6.56
      ref_sec: 9.94
      cer: 0.046
      wer: 0.2353
    bible_00155:
      source: bible
      text: 'Di laa m‑boonni sɔ ya Ba, duniya wa puuni: ya Ba yinni m bɛ ni n‑ti ya, ka ŋɔn mun bɛ la
        saazugu.'
      sbs: 0.6907
      gen_sec: 7.36
      ref_sec: 7.44
      cer: 0.029
      wer: 0.087
    bible_00156:
      source: bible
      text: dama ya yi ti bari n‑zaani ya beebu ni, ti Dugma zugu, di nin kyɛ ka ti leebi ban vu.
      sbs: 0.7026
      gen_sec: 4.8
      ref_sec: 6.06
      cer: 0.0
      wer: 0.2
    bible_00157:
      source: bible
      text: N daa zoomiya, neesim ŋɔn daa neaai pampam la zugu, ka n nyaandɔliba maa daa dari ma n‑kyaŋŋi
        nti paai Damasikusi.
      sbs: 0.6992
      gen_sec: 11.52
      ref_sec: 7.74
      cer: 0.0778
      wer: 0.2857
    bible_00158:
      source: bible
      text: Lala ti yɛ nyɛ di duniya naari daari; malaakadima la nin gamsi ninvugbeeri la ninvugsuma la
        puuni
      sbs: 0.5912
      gen_sec: 18.32
      ref_sec: 7.02
      cer: 0.8
      wer: 1.1176
    bible_00159:
      source: bible
      text: Ti yi ti yɛli, ni, ti ka la tumbeeri, ti yɔmsiri la ti maŋŋa ka yɛlimaŋni ka ti ni.
      sbs: 0.6518
      gen_sec: 5.44
      ref_sec: 4.94
      cer: 0.0164
      wer: 0.0526
    bible_00160:
      source: bible
      text: Ka ban daa kɔŋŋi yam la daa ti yɛli ba taaba, ni, ‘Ya ku ti ti kpaam ka ti niŋi ti firiladima
        maa ni? - Dama ti dina n kpiira.’
      sbs: 0.6027
      gen_sec: 30.56
      ref_sec: 8.14
      cer: 5.033
      wer: 6.069
    bible_00161:
      source: bible
      text: M‑paasi ya gyeeŋŋu zugu, ya mari nirilim n‑tiri taaba, ka din paasi bunseelli kam zaa nyɛ
        la wurilim.
      sbs: 0.6657
      gen_sec: 8.08
      ref_sec: 6.62
      cer: 0.0633
      wer: 0.3889
    bible_00162:
      source: bible
      text: Ba pam daa niŋi Yisa yɛdda, ni Griika pɔ'akpamma m‑paasi, ka ba dɔppa gba daa bu kɔŋŋi yɛdda
        niŋbu.
      sbs: 0.7028
      gen_sec: 8.24
      ref_sec: 8.16
      cer: 0.0658
      wer: 0.3158
    bible_00163:
      source: bible
      text: Di daa ti paai kurigu anu saha, ka u daa laa n‑yi na n‑kpɛ daa ni ka seeba kpalim n‑zɛya ka
        ka tuma. Ka u daa yɛli ba, ni, ‘Bɔ n niŋi ka ya kpalim n‑zɛ kpa yɔriyɔri, halli ni zaanoori saha
        wa?’
      sbs: 0.6682
      gen_sec: 14.8
      ref_sec: 14.8
      cer: 0.0288
      wer: 0.1395
    bible_00164:
      source: bible
      text: Dama ya mi wulisigu seaa tin daa zaŋŋi n‑wulisi ya, hoo ti Dugma Yisa ŋɔn zaali ti seem la.
      sbs: 0.6268
      gen_sec: 5.84
      ref_sec: 6.54
      cer: 0.0286
      wer: 0.1053
    bible_00165:
      source: bible
      text: Ka dɔsɔ daa kyɛ Yisa saani na nti yɛli u, ni, “N Karimba, tunsuŋŋu bɔ ka n nin tum ka deaai
        nyɔvuri kan ka naari?”
      sbs: 0.659
      gen_sec: 8.88
      ref_sec: 7.46
      cer: 0.0595
      wer: 0.24
    bible_00166:
      source: bible
      text: Halli ni zuna ti kpiiri la kɔm ni kɔnyuuri, n‑ka bunyeera, ka laa n‑nyari mugsigu ti gyiliŋŋu
        la puuni.
      sbs: 0.6346
      gen_sec: 8.56
      ref_sec: 6.38
      cer: 0.025
      wer: 0.2105
    bible_00167:
      source: bible
      text: Ka Yisa daa labsi n‑yɛli ba, “Ka bɔ n niŋi ka yarima za'asiri Naawunni zaaligu, ya yaadima
        kaari dɔligu zugu?
      sbs: 0.6897
      gen_sec: 7.04
      ref_sec: 7.22
      cer: 0.0357
      wer: 0.35
    bible_00168:
      source: bible
      text: Ka Piita ŋɔn daa na kur tɔ'asiri yɛttɔ'a wa, Naawunni Sii Kasi maa daa kpɛ ban wumni u yɛla
        maa zaa sufu ni.
      sbs: 0.6437
      gen_sec: 7.04
      ref_sec: 9.16
      cer: 0.0732
      wer: 0.1304
    bible_00169:
      source: bible
      text: Ka ya yi ti nya ka pɛbsigu zeeri n‑yiiri nuzaa ya'ari na, ya nin yɛli, ni, wɔligu nin niŋi,
        ka di siri nin niŋi.
      sbs: 0.6223
      gen_sec: 10.48
      ref_sec: 7.76
      cer: 0.0366
      wer: 0.1667
    bible_00170:
      source: bible
      text: Ii! - u siri daa pun yiisi ti zibsim yiiko ni na, ka zaŋŋi ti n‑taasi u Biwuttigu naam ni
        na.
      sbs: 0.6733
      gen_sec: 8.24
      ref_sec: 7.06
      cer: 0.1176
      wer: 0.2
    bible_00171:
      source: bible
      text: Halli tirima kɔkɔ n ka soori ni ti di pɔ'a ŋɔn nyɛ yɛddaniŋna, ka kyɛ ka u dɔli ti ti gyiliŋŋu
        ni, bee? - hoo tuumuseeba la ŋɔn tumni seem, ni ti Dugma tunzɔppa la, ni Siifasi gba.
      sbs: 0.6825
      gen_sec: 11.2
      ref_sec: 13.44
      cer: 0.1037
      wer: 0.2973
    bible_00172:
      source: bible
      text: Lala zugu, m mabiisi, ya kpaŋŋma ya mansi sahakam zaa n‑sakkri ti Dugma Naawunni booligu,
        dama ŋɔna n yiisi ya. Ya kyɛ ka u yɛla zɛ suŋŋa ya saani. Ya yi niŋi lala ya ku laa n‑labi nyaaŋŋa.
      sbs: 0.6751
      gen_sec: 15.84
      ref_sec: 12.98
      cer: 0.0139
      wer: 0.1053
    bible_00173:
      source: bible
      text: Dizugu man mun bu zɔri zoaa la ni hoo ŋɔn zɔri yɔriyɔri; m bu zabri hoo ŋɔn buuri pɛsigu.
      sbs: 0.6586
      gen_sec: 6.64
      ref_sec: 7.08
      cer: 0.1014
      wer: 0.3684
    bible_00174:
      source: bible
      text: Ka u daa doaai n‑kyaŋŋi n‑ti zinni Nazarɛti tiŋŋa ni. Ka dinŋɔ daa kyɛ ka di siri daa niŋi
        hoo anabidima ŋɔn daa tɔ'asi seem n‑zaali la, ni#:-
      sbs: 0.6552
      gen_sec: 11.44
      ref_sec: 11.46
      cer: 0.0377
      wer: 0.1429
    bible_00175:
      source: bible
      text: Tɔ; di nyaaŋŋa ka u yi daa booli u niriba maa na nti yɛli ba, ni, ‘Kyuu maa saha paaya, amaa
        man daa zuusi seeba la bu sumsi ni ba di kyuu maa.
      sbs: 0.6846
      gen_sec: 10.88
      ref_sec: 8.82
      cer: 0.0476
      wer: 0.1515
    bible_00176:
      source: bible
      text: 'Di yi nyɛ la: ni, ti ka tama Kirisita ni, di yi pa la duniya wa ni kɔkɔa, dinŋɔna ti wahala
        gaari sɔkam zaa dinni.'
      sbs: 0.744
      gen_sec: 7.28
      ref_sec: 8.2
      cer: 0.1294
      wer: 0.32
    bible_00177:
      source: bible
      text: Ti sɔbi kanŋɔ ni ti zaa sufumaasim leebi bummunni zaa.
      sbs: 0.6661
      gen_sec: 4.64
      ref_sec: 4.18
      cer: 0.0682
      wer: 0.3
    bible_00178:
      source: bible
      text: Amaa Pɔla daa yɛli ti, di saha maa, ni, “Wula zugu ka ya niŋni lala? Ya kumni n‑sa'amni la
        n sufu. Man mun niŋi siri ni n kyaŋŋi Gyɛrusalɛm ka ba ti zaŋŋi ma n‑lɔ - halli ba yi ku ma gba
        - n Dugma Yisa yuuri zugu.”
      sbs: 0.6845
      gen_sec: 16.16
      ref_sec: 14.26
      cer: 0.0195
      wer: 0.2609
    bible_00179:
      source: bible
      text: Ka u nyaandɔliba maa boosi u, “Ti dugma, yani zii nla?” Ka u yɛli ba “Bunkpiiŋŋu ŋɔn bɛ luginseaa,
        bɛni ka zuusi la'amni taaba m‑bɛ ni.”
      sbs: 0.6285
      gen_sec: 10.88
      ref_sec: 13.46
      cer: 0.07
      wer: 0.3077
    bible_00180:
      source: bible
      text: Ba daa kur gɔsiri ni, halli ka u ti kpɛ sangbana ni. Di saha maa ka niriba ayi daa gbirigi
        n‑zaani ba saani, niriba maa mun neema daa pɛligiya ni, nyain!
      sbs: 0.6616
      gen_sec: 11.44
      ref_sec: 11.94
      cer: 0.0085
      wer: 0.0323
    bible_00181:
      source: bible
      text: Di daa gyɛri pɔ'aba maa pam n‑ŋma ba yam; ka dizugu ba daa zɔ n‑yi gballi maa ni na. Dabeem
        ŋɔn daa mari ba pam la zugu, ba daa bu yɛli sɔ seelli.
      sbs: 0.6233
      gen_sec: 12.64
      ref_sec: 10.54
      cer: 0.0467
      wer: 0.1818
    bible_00182:
      source: bible
      text: Ka Sintaani daa laa n‑zaŋŋi u n‑kyaŋŋi Gyɛrusalɛm timpuuni ka zaŋŋi u n‑du n‑tɔm Naawunni
        Gyeeŋŋu Yiri saazugu sa, ka Sintaani yɛli, “I yi siri nyɛ la Naawunni biiya, i ku zaŋŋi i maŋŋa
        m‑basi tiŋŋa?
      sbs: 0.6281
      gen_sec: 16.4
      ref_sec: 14.0
      cer: 0.0584
      wer: 0.1944
    bible_00183:
      source: bible
      text: Ya bu mi di gbinni? - ni, bunseela an kpeeri ninsaala noori, u puuri ka a kpeera, ka gatti
        n‑yi bangyira zii la ni.
      sbs: 0.6373
      gen_sec: 10.96
      ref_sec: 7.16
      cer: 0.0706
      wer: 0.1304
    bible_00184:
      source: bible
      text: Ka Ilizabɛti dɔ'am saha ŋɔn daa ti paai, u daa dɔ'ai bidibga.
      sbs: 0.6878
      gen_sec: 4.8
      ref_sec: 3.96
      cer: 0.1087
      wer: 0.3333
    bible_00185:
      source: bible
      text: Ya zɔma n‑yi zina tuma ni; dama tumbeeri zaa pa la nira ningbiŋŋu puuni yɛttɔ'a, na'ala zina
        tuma nyɛ lala; amaa ŋɔn niŋi zina tuma zaa niŋni lala tumbeeri u toori ningbiŋŋu ni.
      sbs: 0.7049
      gen_sec: 12.4
      ref_sec: 14.2
      cer: 0.0362
      wer: 0.1212
    bible_00186:
      source: bible
      text: ni, ka mun bu laa n‑sum ni u gba kyɛ Yisa saani na. Amaa u kur yɛlim yɛttɔ'aseesi ŋɔn ya yɛli,
        ka u baara maa kpaŋŋi.
      sbs: 0.6682
      gen_sec: 8.0
      ref_sec: 10.54
      cer: 0.0465
      wer: 0.1154
    bible_00187:
      source: bible
      text: Ti laa n‑ya tum la ti mabisɔ m‑paasi ba zugu; ti daa pun nya ka doo wa tumni nimmoosi sahakam,
        ka pampaŋŋɔ u niŋi ya yɛdda pam, ka dizugu u ya tum n‑gaari lala.
      sbs: 0.6894
      gen_sec: 11.12
      ref_sec: 13.48
      cer: 0.0417
      wer: 0.2059
    bible_00188:
      source: bible
      text: Ka n‑zaŋŋi m‑paasi ti mammaŋŋa kpamsigu zugu, ti mari sufupeelli Taituusi yɛla zugu, dama
        u sufu daa maaya, yan daa ti u sufudoaa la zugu.
      sbs: 0.6694
      gen_sec: 8.16
      ref_sec: 10.24
      cer: 0.0556
      wer: 0.2
    bible_00189:
      source: bible
      text: Ammi, ya bu nya ka ba la'asiri niimbisi anu n‑koosiri la'abisi ayi? Amaa Naawunni na zi n‑tam
        halli niimbila yinni yɛla.
      sbs: 0.6612
      gen_sec: 10.24
      ref_sec: 10.1
      cer: 0.086
      wer: 0.4762
    bible_00190:
      source: bible
      text: dama Naawunni pa la ŋɔn burimna, amaa ŋɔn maanna.
      sbs: 0.6961
      gen_sec: 3.84
      ref_sec: 3.84
      cer: 0.1026
      wer: 0.6667
    bible_00191:
      source: bible
      text: Hoo din pun sɔbi n‑dooli seem zaŋŋi n‑kyaŋŋi ninvugsɔ ŋɔn tisiri la, ni#:-
      sbs: 0.6671
      gen_sec: 4.96
      ref_sec: 5.36
      cer: 0.1071
      wer: 0.4615
    bible_00192:
      source: bible
      text: Naawunni wurilim piini ni u sufudoaa bɛ ya saani, n‑kyɛ ka ya mi ti Dugma Naawunni ni ti Dugma
        Yisa Masiiya yɛla wa, halli zaa.
      sbs: 0.6802
      gen_sec: 9.52
      ref_sec: 9.42
      cer: 0.0101
      wer: 0.16
    bible_00193:
      source: bible
      text: Tɔ; ka Naawunni daa kyɛ ka tuumudima maa daa tumni alahazibu tuma pam niriba maa saani n‑wulisiri
        u gyirima. Ba zaa daa kur la'amni la NaaSulɛmaana Leeŋŋa maa maasim ni.
      sbs: 0.7003
      gen_sec: 13.2
      ref_sec: 13.06
      cer: 0.0222
      wer: 0.1333
    bible_00194:
      source: bible
      text: Amaa ba yi ku toaai n‑gbaai ba mansi, ba dim pɔ'aba, bee, n‑kuli dɔppa. Ya yi niŋi lala di
        veela n‑gaari ya kyɛ ka pɔ'aba bee dɔppa yɛla ti mugsi ya.
      sbs: 0.7034
      gen_sec: 10.0
      ref_sec: 10.94
      cer: 0.0826
      wer: 0.2258
    bible_00195:
      source: bible
      text: Lala daa kyɛ ka anabi la yɛligu la ti niŋi yɛlimaŋni, ni#:-
      sbs: 0.6809
      gen_sec: 4.16
      ref_sec: 4.58
      cer: 0.0
      wer: 0.0
    bible_00196:
      source: bible
      text: Halli ŋɔn daa paai Room na sahanseaa la, u daa bɔ n ziiya ni nimmoaa, halli nti nya ma.
      sbs: 0.5725
      gen_sec: 10.24
      ref_sec: 6.3
      cer: 6.1212
      wer: 6.1053
    bible_00197:
      source: bible
      text: 'Tɔ: i sunzɔ bɛ la n saani; ŋɔn gba ka Naawunni yiisi n‑niŋi u dinni ka ŋɔna ni u biisi gba
        puusiri i ni suŋŋasuŋŋa.'
      sbs: 0.6404
      gen_sec: 9.84
      ref_sec: 13.98
      cer: 0.046
      wer: 0.16
    bible_00198:
      source: bible
      text: 'Ka n daa boosi n‑yɛli, ‘Ŋɔni nla, n dugma?’, ka u labsi n‑yɛli ma, ni, ‘Mani Yisa, Nazarɛti
        nira la: mani ka i namsiri maa.’'
      sbs: 0.5806
      gen_sec: 29.84
      ref_sec: 8.98
      cer: 0.0118
      wer: 0.04
    bible_00199:
      source: bible
      text: Ka ŋɔn daa yɛli nŋɔ n‑naai la, u daa wulisi ba u nuusi ni u nɔba.
      sbs: 0.6918
      gen_sec: 4.0
      ref_sec: 4.22
