      cer: 0.1081
      wer: 0.6
    bible_00032:
      source: bible
      text: Ka dinŋɔna ya dɔli wurilim sɔya, ka bɔ Sii maa piini; ka kan daŋŋi tooni la nyɛ la anabitiri
