      sbs: 0.6209
      gen_sec: 5.48
      ref_sec: 7.06
      cer: 1.0
      wer: 1.0
    bible_00171:
      source: bible
      text: Halli tirima kɔkɔ n ka soori ni ti di pɔ'a ŋɔn nyɛ yɛddaniŋna, ka kyɛ ka u dɔli ti ti gyiliŋŋu
        ni, bee? - hoo tuumuseeba la ŋɔn tumni seem, ni ti Dugma tunzɔppa la, ni Siifasi gba.
