      gen_sec: 9.88
      ref_sec: 13.44
      cer: 0.1333
      wer: 0.3784
    bible_00172:
      source: bible
      text: Lala zugu, m mabiisi, ya kpaŋŋma ya mansi sahakam zaa n‑sakkri ti Dugma Naawunni booligu,
        dama ŋɔna n yiisi ya. Ya kyɛ ka u yɛla zɛ suŋŋa ya saani. Ya yi niŋi lala ya ku laa n‑labi nyaaŋŋa.
