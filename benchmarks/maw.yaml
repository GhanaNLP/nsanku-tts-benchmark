      cer: 0.114
      wer: 0.2667
    bible_00043:
      source: bible
      text: Ya wumma yaa! Ti yɛtti ya ti Dugma zugu, ni, ya kyɛ ka ba karim gbaŋŋu wa n‑ti ti mabiisi
