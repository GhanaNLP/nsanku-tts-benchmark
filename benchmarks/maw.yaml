      ref_sec: 7.76
      cer: 0.0787
      wer: 0.2222
    bible_00029:
      source: bible
      text: Niriba nin ti yɛli ya, ni, ‘Nnya kpa sa!’, bee, ‘Nnya kpa wa!’ - yan di kyaŋŋi, ya mun di
