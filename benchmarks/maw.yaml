      gen_sec: 12.4
      ref_sec: 13.86
      cer: 0.0432
      wer: 0.1667
    bible_00049:
      source: bible
      text: Ŋɔn butti ni ŋɔn yɔ'ari koom la zaa tumni la tumni yinni, ka ti Dugma nin yɔ ba zaa hoo ban
