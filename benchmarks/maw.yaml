      gen_sec: 10.65
      ref_sec: 12.98
      cer: 0.0139
      wer: 0.0526
    bible_00173:
      source: bible
      text: Dizugu man mun bu zɔri zoaa la ni hoo ŋɔn zɔri yɔriyɔri; m bu zabri hoo ŋɔn buuri pɛsigu.
      sbs: 0.6213
      gen_sec: 4.8
      ref_sec: 7.08
      cer: 0.087
      wer: 0.3684
    bible_00174:
      source: bible
      text: Ka u daa doaai n‑kyaŋŋi n‑ti zinni Nazarɛti tiŋŋa ni. Ka dinŋɔ daa kyɛ ka di siri daa niŋi
        hoo anabidima ŋɔn daa tɔ'asi seem n‑zaali la, ni#:-
      sbs: 0.6351
      gen_sec: 7.92
      ref_sec: 11.46
      cer: 0.1132
      wer: 0.2143
    bible_00175:
      source: bible
      text: Tɔ; di nyaaŋŋa ka u yi daa booli u niriba maa na nti yɛli ba, ni, ‘Kyuu maa saha paaya, amaa
        man daa zuusi seeba la bu sumsi ni ba di kyuu maa.
      sbs: 0.6298
      gen_sec: 8.28
      ref_sec: 8.82
      cer: 1.0
      wer: 1.0
    bible_00176:
      source: bible
      text: 'Di yi nyɛ la: ni, ti ka tama Kirisita ni, di yi pa la duniya wa ni kɔkɔa, dinŋɔna ti wahala
        gaari sɔkam zaa dinni.'
      sbs: 0.655
      gen_sec: 6.17
      ref_sec: 8.2
      cer: 0.0706
      wer: 0.24
    bible_00177:
      source: bible
      text: Ti sɔbi kanŋɔ ni ti zaa sufumaasim leebi bummunni zaa.
      sbs: 0.6546
      gen_sec: 2.9
      ref_sec: 4.18
      cer: 0.0682
      wer: 0.3
    bible_00178:
      source: bible
      text: Amaa Pɔla daa yɛli ti, di saha maa, ni, “Wula zugu ka ya niŋni lala? Ya kumni n‑sa'amni la
        n sufu. Man mun niŋi siri ni n kyaŋŋi Gyɛrusalɛm ka ba ti zaŋŋi ma n‑lɔ - halli ba yi ku ma gba
        - n Dugma Yisa yuuri zugu.”
      sbs: 0.6202
      gen_sec: 11.08
      ref_sec: 14.26
      cer: 0.0325
      wer: 0.3696
    bible_00179:
      source: bible
      text: Ka u nyaandɔliba maa boosi u, “Ti dugma, yani zii nla?” Ka u yɛli ba “Bunkpiiŋŋu ŋɔn bɛ luginseaa,
        bɛni ka zuusi la'amni taaba m‑bɛ ni.”
      sbs: 0.5941
      gen_sec: 8.0
      ref_sec: 13.46
      cer: 0.09
      wer: 0.3462
    bible_00180:
      source: bible
      text: Ba daa kur gɔsiri ni, halli ka u ti kpɛ sangbana ni. Di saha maa ka niriba ayi daa gbirigi
        n‑zaani ba saani, niriba maa mun neema daa pɛligiya ni, nyain!
      sbs: 0.6476
      gen_sec: 8.75
      ref_sec: 11.94
      cer: 0.0256
      wer: 0.129
    bible_00181:
      source: bible
      text: Di daa gyɛri pɔ'aba maa pam n‑ŋma ba yam; ka dizugu ba daa zɔ n‑yi gballi maa ni na. Dabeem
        ŋɔn daa mari ba pam la zugu, ba daa bu yɛli sɔ seelli.
      sbs: 0.6571
      gen_sec: 7.12
      ref_sec: 10.54
      cer: 0.1028
      wer: 0.1818
    bible_00182:
      source: bible
      text: Ka Sintaani daa laa n‑zaŋŋi u n‑kyaŋŋi Gyɛrusalɛm timpuuni ka zaŋŋi u n‑du n‑tɔm Naawunni
        Gyeeŋŋu Yiri saazugu sa, ka Sintaani yɛli, “I yi siri nyɛ la Naawunni biiya, i ku zaŋŋi i maŋŋa
        m‑basi tiŋŋa?
      sbs: 0.6254
      gen_sec: 10.12
      ref_sec: 14.0
      cer: 0.0195
      wer: 0.0833
    bible_00183:
      source: bible
      text: Ya bu mi di gbinni? - ni, bunseela an kpeeri ninsaala noori, u puuri ka a kpeera, ka gatti
        n‑yi bangyira zii la ni.
      sbs: 0.621
      gen_sec: 5.96
      ref_sec: 7.16
      cer: 0.0824
      wer: 0.3043
    bible_00184:
      source: bible
      text: Ka Ilizabɛti dɔ'am saha ŋɔn daa ti paai, u daa dɔ'ai bidibga.
      sbs: 0.6785
      gen_sec: 3.02
      ref_sec: 3.96
      cer: 0.1739
      wer: 0.4167
    bible_00185:
      source: bible
      text: Ya zɔma n‑yi zina tuma ni; dama tumbeeri zaa pa la nira ningbiŋŋu puuni yɛttɔ'a, na'ala zina
        tuma nyɛ lala; amaa ŋɔn niŋi zina tuma zaa niŋni lala tumbeeri u toori ningbiŋŋu ni.
      sbs: 0.653
      gen_sec: 9.66
      ref_sec: 14.2
      cer: 0.0362
      wer: 0.1212
    bible_00186:
      source: bible
      text: ni, ka mun bu laa n‑sum ni u gba kyɛ Yisa saani na. Amaa u kur yɛlim yɛttɔ'aseesi ŋɔn ya yɛli,
        ka u baara maa kpaŋŋi.
      sbs: 0.6511
      gen_sec: 5.76
      ref_sec: 10.54
      cer: 0.0581
      wer: 0.1923
    bible_00187:
      source: bible
      text: Ti laa n‑ya tum la ti mabisɔ m‑paasi ba zugu; ti daa pun nya ka doo wa tumni nimmoosi sahakam,
        ka pampaŋŋɔ u niŋi ya yɛdda pam, ka dizugu u ya tum n‑gaari lala.
      sbs: 0.6595
      gen_sec: 8.43
      ref_sec: 13.48
      cer: 0.0583
      wer: 0.1471
    bible_00188:
      source: bible
      text: Ka n‑zaŋŋi m‑paasi ti mammaŋŋa kpamsigu zugu, ti mari sufupeelli Taituusi yɛla zugu, dama
        u sufu daa maaya, yan daa ti u sufudoaa la zugu.
      sbs: 0.6302
      gen_sec: 8.4
      ref_sec: 10.24
      cer: 0.0926
      wer: 0.4
    bible_00189:
      source: bible
      text: Ammi, ya bu nya ka ba la'asiri niimbisi anu n‑koosiri la'abisi ayi? Amaa Naawunni na zi n‑tam
