      sbs: 0.6411
      gen_sec: 6.28
      ref_sec: 8.72
      cer: 0.0737
      wer: 0.2
    bible_00152:
      source: bible
      text: Ka sɔkam daa nya u kyɛnni maa ka pɛ'ari Naawunni,
      sbs: 0.6428
      gen_sec: 2.39
      ref_sec: 3.76
      cer: 0.0526
      wer: 0.2
    bible_00153:
      source: bible
      text: Dizugu n daa mɔ'asiri ya la bisim, pa dikpeema; dama ya daa bu sa'ai ditibsa diibu. Halli
