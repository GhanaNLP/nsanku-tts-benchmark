      sbs: 0.5999
      gen_sec: 5.34
      ref_sec: 9.16
      cer: 0.0488
      wer: 0.1739
    bible_00169:
      source: bible
      text: Ka ya yi ti nya ka pɛbsigu zeeri n‑yiiri nuzaa ya'ari na, ya nin yɛli, ni, wɔligu nin niŋi,
