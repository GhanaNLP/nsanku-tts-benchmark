      sbs: 0.6594
      gen_sec: 5.62
      ref_sec: 6.62
      cer: 0.0
      wer: 0.0
    bible_00162:
      source: bible
      text: Ba pam daa niŋi Yisa yɛdda, ni Griika pɔ'akpamma m‑paasi, ka ba dɔppa gba daa bu kɔŋŋi yɛdda
