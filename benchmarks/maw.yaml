      gen_sec: 4.59
      ref_sec: 6.54
      cer: 0.0286
      wer: 0.1579
    bible_00165:
      source: bible
      text: Ka dɔsɔ daa kyɛ Yisa saani na nti yɛli u, ni, “N Karimba, tunsuŋŋu bɔ ka n nin tum ka deaai
