      ref_sec: 7.36
      cer: 0.075
      wer: 0.2917
    bible_00050:
      source: bible
      text: Zaadaari kum yisigri saha ba ku ti laa n‑diri pɔ'aba bee n‑kunni dɔppa, ba ti ya n‑ŋmanni
