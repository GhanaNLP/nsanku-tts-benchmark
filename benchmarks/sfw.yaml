      gen_sec: 4.0
      ref_sec: 7.5
      cer: 0.8571
      wer: 0.95
    jw_00063:
      source: jw
      text: Nningyein beni yeɛ Yehowa nate so maa yenwu ye kyɛ, yenye gye yɛnwo ɔ?
