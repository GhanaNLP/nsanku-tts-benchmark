      gen_sec: 8.8
      ref_sec: 9.32
      cer: 0.6022
      wer: 1.0
    jw_00043:
      source: jw
      text: BƆ ƆMAA YENWU KYƐ ƐNNƐ KOSO, YEHOWA NYƐ NYEYEMUƐ Ɔ
