      sbs: 0.6807
      gen_sec: 4.24
      ref_sec: 5.92
      cer: 0.4595
      wer: 0.7895
    jw_00022:
      source: jw
      text: MMERƐ BƆ W’ADWENE YƐ WƆ KYƐ YEHOWA NDWENE WƆNWO NE
