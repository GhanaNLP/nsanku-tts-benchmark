      gen_sec: 14.0
      ref_sec: 14.99
      cer: 0.456
      wer: 0.8936
    jw_00010:
      source: jw
      text: KYƐBƆ YEHOWA SE YƐ NE, ƆBO Y’ADWENE NE YƐ NDEASEƐ SO
