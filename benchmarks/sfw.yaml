      text: ENYA YENWO ATEE KƆ WƆ NYUNU
      sbs: 0.6465
      gen_sec: 1.84
      ref_sec: 3.11
      cer: 0.9545
      wer: 1.3333
    jw_00058:
      source: jw
      text: Yehowa Boka Ye Mmenia Maa Bɛte Bible Nabo
