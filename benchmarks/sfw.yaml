      gen_sec: 0.88
      ref_sec: 3.3
      cer: 0.8125
      wer: 1.0
    jw_00024:
      source: jw
      text: Yɛ ebie bɔ mmenia de wɔ di ɔ. Boka adwuma bɔ bɛyɛ ye wɔ Ahennie Asa so ne. Sɛ bɛfa adwuma
