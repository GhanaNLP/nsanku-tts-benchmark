      gen_sec: 4.64
      ref_sec: 3.73
      cer: 0.8966
      wer: 2.4
    jw_00019:
      source: jw
      text: Bɛbɔ bayɛ mbanyi bɔ bɛwɔ y’asafo nu ne, yɛkɔyɛ sɛɛ ne yaboka bɛ?
