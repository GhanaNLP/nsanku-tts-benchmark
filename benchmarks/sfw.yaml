      gen_sec: 8.4
      ref_sec: 7.02
      cer: 0.08
      wer: 0.9444
    jw_00012:
      source: jw
      text: BƆ YETI YEƐ YASI GYINAYƐƐ KYƐ YƐKƆSÕ YEHOWA Ɔ
