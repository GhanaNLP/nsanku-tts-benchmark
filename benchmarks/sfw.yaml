      gen_sec: 3.2
      ref_sec: 5.27
      cer: 0.3929
      wer: 0.625
    jw_00042:
      source: jw
      text: Ɔkɔboka yɛ maa yɛkɔyere yenwo yɛkɔkenga Bible ne kyẽa biala, yɛkɔdwenedwene yenwo, na yafa
