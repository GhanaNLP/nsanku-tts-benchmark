      gen_sec: 8.24
      ref_sec: 4.6
      cer: 0.881
      wer: 1.5833
    jw_00048:
      source: jw
      text: BƆ ƆHƆLESO WƆ M’ASETENA NU WƆ FINLAND Ɔ
