      gen_sec: 1.04
      ref_sec: 3.4
      cer: 0.8286
      wer: 1.0
    bible_00097:
      source: bible
      text: AWURADE kɔsɛkye aseɛ.
      sbs: 0.6249
      gen_sec: 3.36
      ref_sec: 3.02
      cer: 1.7222
      wer: 2.0
    bible_00098:
      source: bible
      text: Okotu komini kyɛ laleɛ, bengonwu ye ko; ye boso komini kyɛ kɔngɔen nyekyire.
      sbs: 0.6251
      gen_sec: 6.16
      ref_sec: 4.66
      cer: 0.7213
      wer: 1.6154
    bible_00099:
      source: bible
      text: 'Aporowaa biala nne ye nwo kyɛ nyamesom nu mvealeɛ nu dwirɛ ne ɔte piri: Nyameɛ lale ye nwo
        ali anwoɔnaen nu.'
      sbs: 0.5788
      gen_sec: 19.44
      ref_sec: 10.24
      cer: 1.5581
      wer: 2.8571
    jw_00000:
      source: jw
      text: b Sɛ ɛpena suahu pee bɔ ɔfa sɔ dwirɛ he anwo a, nea Nhoma a Yehowa Adansefo De Yɛ Nhwehwɛmu
        nanu. Ekonwu ye wɔ edwirɛti bɔ yenwa “ Abɔfo ” nabo.
      sbs: 0.6327
      gen_sec: 5.6
      ref_sec: 14.58
      cer: 0.6606
      wer: 0.9655
    jw_00001:
      source: jw
      text: Sɛ Ɛkyɛ Nikye A, Ɔkɔmaa Wɔnye Kɔgye Paa
