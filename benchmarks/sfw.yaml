      gen_sec: 17.52
      ref_sec: 14.99
      cer: 0.1319
      wer: 0.5319
    jw_00010:
      source: jw
      text: KYƐBƆ YEHOWA SE YƐ NE, ƆBO Y’ADWENE NE YƐ NDEASEƐ SO
