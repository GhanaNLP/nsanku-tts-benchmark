      gen_sec: 8.88
      ref_sec: 8.87
      cer: 0.3465
      wer: 1.1739
    jw_00006:
      source: jw
      text: mmerɛ bɔ ɛpena kyɛ ɛkɔso di nahorɛ ma Yehowa ne?
