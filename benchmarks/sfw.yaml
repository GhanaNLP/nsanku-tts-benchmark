      gen_sec: 12.32
      ref_sec: 4.12
      cer: 1.5429
      wer: 1.4545
    jw_00008:
      source: jw
      text: Sɛ yɛte edwirɛ bo a, sɛɛ yeɛ ɔkɔboka yɛ mmerɛ bɔ nningyein asesã wɔ y’asetena nu ne?
