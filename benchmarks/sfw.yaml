      gen_sec: 8.16
      ref_sec: 7.6
      cer: 0.2029
      wer: 1.4286
    jw_00056:
      source: jw
      text: SƐƐ YEƐ ƐKƆYE EDWIRƐ HEMƆ NOA Ɔ?
