      gen_sec: 2.88
      ref_sec: 4.69
      cer: 0.3871
      wer: 1.25
    jw_00034:
      source: jw
      text: Ɛwɛnelɛ Waen bɔ ɔwale afoɛ he ne, ato wɔ boase akenga nu anaa? Sɛ ahora ayɛ sɔ a, yede sɛɛ
