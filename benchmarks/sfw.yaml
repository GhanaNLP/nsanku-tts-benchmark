      gen_sec: 6.72
      ref_sec: 10.62
      cer: 0.4554
      wer: 0.7812
    jw_00030:
      source: jw
      text: BƆ ƆKƆBOKA WƆ MAA EKOSŨA NIKYEE YÉ Ɔ
