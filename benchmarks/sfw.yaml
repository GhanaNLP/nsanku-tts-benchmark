      gen_sec: 7.04
      ref_sec: 4.62
      cer: 0.7755
      wer: 2.2727
    jw_00053:
      source: jw
      text: Mvasoɛ beni yeɛ yekonya yekofi Yesu wue naso kyẽabie ɔ?
      sbs: 0.6203
      gen_sec: 1.12
      ref_sec: 6.59
      cer: 1.0
      wer: 1.0
    jw_00054:
      source: jw
      text: BOKA ALIEMAAMƆ BƆ BAHA SUA NU NE
