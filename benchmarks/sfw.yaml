      gen_sec: 6.08
      ref_sec: 6.47
      cer: 0.4898
      wer: 1.7692
    jw_00020:
      source: jw
      text: Ndeaseɛ bɔ yele ye kyɛ Yehowa kɔla anwumvoinnwunɛ ali, na wabua ndɛen turoloo mmerɛ bɔ otingye
