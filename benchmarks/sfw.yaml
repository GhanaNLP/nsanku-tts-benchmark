      sbs: 0.6633
      gen_sec: 9.04
      ref_sec: 10.31
      cer: 0.3306
      wer: 0.8889
    jw_00021:
      source: jw
      text: Edwirɛ beni yeɛ Nyameɛ ahã bɔ ɔmaa yenya gyidie kyɛ nningyein bɔ wahyɛ yenwo bɔ ne kɔwa nu
