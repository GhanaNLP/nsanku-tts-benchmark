      gen_sec: 3.28
      ref_sec: 3.47
      cer: 0.7419
      wer: 1.0
    jw_00049:
      source: jw
      text: SƐ EHŨ KƆSO NEA PONOGRAFI A, NZU YEƐ ƐKƆHORA KƆYƐ Ɔ?
