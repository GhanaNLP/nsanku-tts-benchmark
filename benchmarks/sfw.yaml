      gen_sec: 4.48
      ref_sec: 4.6
      cer: 1.0
      wer: 1.0
    jw_00011:
      source: jw
      text: Yehowa se aworabɔlɛ bɔ yedi ne mukoraati, yeti yekonwu kyɛbɔ ɔboka yɛ maa y’ahone tɔ ye kunu
