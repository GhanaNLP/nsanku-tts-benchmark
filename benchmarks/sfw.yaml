      ref_sec: 3.9
      cer: 0.4848
      wer: 1.0
    jw_00016:
      source: jw
      text: Yeti kyẽa foforɛ bɔ ekosua nikyee ne, ɛyɛ a drɔ bɔ asua ne to berɛ. Sɛ ɛyɛ sɔ a, nningyein
