      gen_sec: 5.52
      ref_sec: 5.77
      cer: 0.7647
      wer: 1.75
    jw_00059:
      source: jw
      text: Yɛkɔyɛ sɛɛ né yafa Yehowa yayɛ yɛ Nyɔbotaen?
      sbs: 0.6828
      gen_sec: 5.52
      ref_sec: 4.17
      cer: 0.7778
      wer: 1.25
    jw_00060:
      source: jw
      text: NZU YEƐ YESUA YEFI AFUTUE BƆ ƆPƐ YEBO BƆ . . .
      sbs: 0.6634
      gen_sec: 5.04
      ref_sec: 3.71
      cer: 0.9375
      wer: 1.1111
    jw_00061:
      source: jw
      text: YERE WƆNWO KYƐ ƐKƆHƆSO KOGYINA PINDINN
      sbs: 0.6566
      gen_sec: 4.88
      ref_sec: 3.97
      cer: 0.9394
      wer: 3.0
    jw_00062:
      source: jw
      text: Nningyein beni yeɛ odikyɛ yɛyere yɛnwo kyɛ yɛkɔyɛ ɔ, na nzu yeɛ ɔnzɛkyɛ yɛmaa yɛ wora fi ye
        llé ɔ?
