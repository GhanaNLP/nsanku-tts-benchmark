      gen_sec: 4.88
      ref_sec: 5.12
      cer: 1.275
      wer: 2.1818
    jw_00050:
      source: jw
      text: YƐKƆYƐ SƐƐ NÉ YAYƐ KRISTONIƐ BƆ WANYI WƆ SUNZUM NU Ɔ?
      sbs: 0.6217
      gen_sec: 6.48
      ref_sec: 4.41
      cer: 1.2143
      wer: 2.0909
    jw_00051:
      source: jw
      text: Nningyein benimɔ anu yeɛ odikyɛ yɛnea yé, na yangɔ nzɔhwɛ nu ɔ?
      sbs: 0.654
      gen_sec: 6.4
      ref_sec: 4.53
      cer: 0.64
      wer: 1.5833
    jw_00052:
      source: jw
      text: BƆ YETI YEƐ ODIKYƐ YEKYIRE OBUO YƐMA ALIEMAA MMRASUA NEMƆ Ɔ
