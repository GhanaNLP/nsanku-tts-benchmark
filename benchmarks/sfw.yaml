      gen_sec: 5.28
      ref_sec: 5.2
      cer: 0.6774
      wer: 1.0
    jw_00002:
      source: jw
      text: BƐBƆ BƐNEA YAREFOƐ ANAA AWOROWAA NE, BƆ ƆMAA ƆYƐ SE KYƐ BƐNYE KƆHƆSO KƆGYE Ɔ
      sbs: 0.6646
      gen_sec: 7.52
      ref_sec: 7.93
      cer: 0.5246
      wer: 1.4667
    jw_00003:
      source: jw
      text: KURO ALIEMAAMƆ DWIRƐ, NA SÕ BƐ WƆFOƐ
      sbs: 0.6755
      gen_sec: 5.28
      ref_sec: 4.04
      cer: 1.0345
      wer: 1.4286
    jw_00004:
      source: jw
      text: Nzu yeɛ ɔkɔboka yɛ maa yɛkɔɔyɛ Kristofoɛ bɔ bɛbɔ bɛnwo mmɔden ɔ?
      sbs: 0.6453
      gen_sec: 6.72
      ref_sec: 4.91
      cer: 0.5962
      wer: 1.8333
    jw_00005:
      source: jw
      text: Yekonwu mmerɛ bɔ odikyɛ yɛkã Bible adesua nwo dwirɛ yekyire mmenia, ɔne mmerɛ bɔ odikyɛ yɛto
        yɛsa yɛfrɛ bɛ maa bɛba adesua ɔ.
      sbs: 0.6022
      gen_sec: 8.4
      ref_sec: 8.87
      cer: 0.4752
      wer: 0.913
    jw_00006:
      source: jw
      text: mmerɛ bɔ ɛpena kyɛ ɛkɔso di nahorɛ ma Yehowa ne?
      sbs: 0.6596
      gen_sec: 6.24
      ref_sec: 3.78
      cer: 0.5263
      wer: 1.3
    jw_00007:
      source: jw
      text: Fa Nyameɛ Afutue Bɔ Ɔfa Nzãa Nwo Ne Bɔ Wɔ Bra
      sbs: 0.6886
      gen_sec: 3.12
      ref_sec: 4.12
      cer: 0.4286
      wer: 0.5455
    jw_00008:
      source: jw
      text: Sɛ yɛte edwirɛ bo a, sɛɛ yeɛ ɔkɔboka yɛ mmerɛ bɔ nningyein asesã wɔ y’asetena nu ne?
      sbs: 0.6417
      gen_sec: 8.48
      ref_sec: 6.21
      cer: 0.4923
      wer: 1.0
    jw_00009:
      source: jw
      text: Aliemaa bɔ ɔkɔyɛ kyaaman wɔ dapɛen afia adesua nabo ne, ɛyɛ a ɔfa afutue ma bɛbɔ bɛyɛ asuafoɛ
        dwumadie ne. Yeti sɛ sona ne yɛ ye dwumadie ne a, ɔfa yenye di yesi nea kyɛ, akwangyerɛ bɔ ɔfa
        ye dwumadie nanwo ne, ɔyɛ ye sɔ pɛpɛɛpɛ anaa.
      sbs: 0.6681
      gen_sec: 13.2
      ref_sec: 14.99
      cer: 0.3077
      wer: 0.5532
    jw_00010:
      source: jw
      text: KYƐBƆ YEHOWA SE YƐ NE, ƆBO Y’ADWENE NE YƐ NDEASEƐ SO
      sbs: 0.6817
      gen_sec: 6.4
      ref_sec: 4.6
      cer: 0.975
      wer: 1.6364
    jw_00011:
      source: jw
      text: Yehowa se aworabɔlɛ bɔ yedi ne mukoraati, yeti yekonwu kyɛbɔ ɔboka yɛ maa y’ahone tɔ ye kunu
        ɔ.
      sbs: 0.6105
      gen_sec: 16.88
      ref_sec: 7.02
      cer: 1.8133
      wer: 3.0
    jw_00012:
      source: jw
      text: BƆ YETI YEƐ YASI GYINAYƐƐ KYƐ YƐKƆSÕ YEHOWA Ɔ
      sbs: 0.617
      gen_sec: 14.16
      ref_sec: 3.3
      cer: 1.7297
      wer: 3.5556
    jw_00013:
      source: jw
      text: Yekonwu mvasoɛ bɔ yenya yefi honhom nu paradise naso, ɔne kyɛbɔ yɛkɔboka mmenia maa bɛ koso
        bɛkɔwa nu bie ɔ.
      sbs: 0.7027
      gen_sec: 3.92
      ref_sec: 9.21
      cer: 0.7011
      wer: 0.9
    jw_00014:
      source: jw
      text: Bible ne mma edwirɛ he anwo mmuayɛɛ. Nakoso sɛ yɛnea edwirɛ biemɔ bɔ ɔwɔ Bible nanu a, ɔmaa
        yenwu bɔ yeti yeɛ ebia besili sɔ gyinayɛɛ ne ɔ.
      sbs: 0.6878
      gen_sec: 10.32
      ref_sec: 12.42
      cer: 0.3119
      wer: 0.9286
    jw_00015:
      source: jw
      text: SUESUA KYƐBƆ YEHOWA SI NWU ANWUMVOIN NE
      sbs: 0.6607
      gen_sec: 4.8
      ref_sec: 3.9
      cer: 0.9394
      wer: 1.4286
    jw_00016:
      source: jw
      text: Yeti kyẽa foforɛ bɔ ekosua nikyee ne, ɛyɛ a drɔ bɔ asua ne to berɛ. Sɛ ɛyɛ sɔ a, nningyein
        bɔ ɛkɔkae ne, ɔkɔyɛ wɔ nwanwa.
      sbs: 0.6696
      gen_sec: 11.68
      ref_sec: 11.12
      cer: 0.8352
      wer: 1.1923
    jw_00017:
      source: jw
      text: mmerɛ bɔ asafo ne ama yɛ akwangyerɛ bie ne?
