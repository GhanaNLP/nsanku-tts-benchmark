      ref_sec: 3.78
      cer: 0.8333
      wer: 1.0
    jw_00040:
      source: jw
      text: Gyidie bɔ yele ye wɔ Yehowa ahyehyɛdeɛ nanu ne, yɛkɔyɛ sɛɛ ne yahɔso yamaa nu ayɛ se?
