      ref_sec: 3.73
      cer: 0.8438
      wer: 1.0
    jw_00046:
      source: jw
      text: Nzu Yeɛ Ɔkɔboka Wɔ Maa Wɔnye Kɔgye Mmerɛ Bɔ Ɛnwondɛ Yehowa Ne?
      sbs: 0.6757
      gen_sec: 0.96
      ref_sec: 5.12
      cer: 0.7
      wer: 0.8333
    jw_00047:
      source: jw
      text: YEHOWA MANE YƐ ANWOSERƐ MMERƐ PO BƆ NÉ YƐ WORA ABƆ NE
