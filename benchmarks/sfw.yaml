      gen_sec: 15.68
      ref_sec: 3.3
      cer: 4.9189
      wer: 3.7778
    jw_00013:
      source: jw
      text: Yekonwu mvasoɛ bɔ yenya yefi honhom nu paradise naso, ɔne kyɛbɔ yɛkɔboka mmenia maa bɛ koso
