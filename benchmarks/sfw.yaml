      gen_sec: 3.28
      ref_sec: 3.11
      cer: 1.0
      wer: 1.0
    jw_00055:
      source: jw
      text: Anwokeka bɔ Yesu fayɛle asɛnga adwuma ne, yɛkɔnea atee nna bɔ yɛkɔfaso yekosuesua ɔ.
