    bible_00199:
      source: bible
      text: Ɔ sanlɩn kɛ ɛmɔ muonun 'ba sɛlɛ Nyanmɩan bɛ bʋka yɛ́. Ɛbɛlɛ nɩn anun, Nyanmɩan 'ba tie menian
        dɔʋn mmʋtʋɛ'n mɔ bɛ lɛ yɔ bɛ man yɛ́'n. Ɔ 'di junman sɔ'n man yɛ́ ɔ man menian dɔʋn da yɩ́ asɩ.
      sbs: 0.7853
      gen_sec: 11.76
      ref_sec: 13.42
      cer: 0.0441
