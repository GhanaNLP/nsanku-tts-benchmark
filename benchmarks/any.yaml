      sbs: 0.6282
      gen_sec: 8.32
      ref_sec: 7.92
      cer: 0.2718
      wer: 0.8276
    bible_00167:
      source: bible
      text: '“Ɛsɛ anɩɛ''n fi anwunno ɔ kɔ te biekun. Yɩ́ nwan: ‘Like mɔ Nyanmɩan nwan ɔ tɩ kpa''n, n''ɛ
        bu yɩ́ kɛ ɔ tɩ man kpa.’'
      sbs: 0.6235
      gen_sec: 2.22
      ref_sec: 7.22
      cer: 0.6842
      wer: 0.96
    bible_00168:
      source: bible
      text: Ɛhɩka ati, ɛnwanndie'n mɔ mɩɩn nwanndi'n, mɩ́n nyɩn wɔ lɩka kʋn. N dɩ kɛ sʋanlan m'ɔ lɛ kʋn
        ngondin ɔ. Mɩn ndʋ man mɩ́n kɔtɔlɛ dɩɛ nɩn anwʋnman nun.
      sbs: 0.6214
      gen_sec: 8.13
      ref_sec: 8.58
      cer: 0.1545
      wer: 0.5862
    bible_00169:
      source: bible
      text: Kɛmɔ bɛ tɩ mân ɛhɩ anun menian'n, nunhan ɛjɔlɛ ala yɛ̂ bɛ kan ɔ. Mɔ bɛ kɔ han'n kʋsʋ yɛ̂ menian'n-mɔ
