    bible_00134:
      source: bible
      text: Menian'n-mɔ ninnge'n-mɔ mɔ bɛ kɔ nwun yɩ́'n, sɛ bɛ kan yɩ́ nwʋn ɛjɔlɛ bɛ kele yɛ́ a, yɛ de
