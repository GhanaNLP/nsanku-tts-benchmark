  entries:
    bible_00000:
      source: bible
      text: Balasua m'ɔ kɔ ja bian'n, ɔ nʋn yɩ́ hun bɛ wɔ nun dede yɩ́ hun wu. Sɛ ɔ wu a, ɔ le atɩn ɔ
        kʋala kɛ ɔ ja belenzua m'ɔ kulo ɔ. Nan kʋsʋ, ɔ le man atɩn kɛ ɔ ja belenzua m'ɔ falɩ man yɩ́ nwʋn
        manlɩn man Kilisi ɔ.
      sbs: 0.8029
      gen_sec: 16.83
      ref_sec: 13.94
      cer: 0.0276
      wer: 0.0392
    bible_00001:
      source: bible
      text: 'Ɛhɩ, bian''n nwunlin kɛ dɔɛ''n mɔ Zozi hanlɩn kɛ: “Kɔ awulo nán wɔ́ wa nɩn anwʋn a sa.” Dɔɛ
        sɔ nɩn asʋ yɛ̂ yɩ́ wa nɩn anwʋn salɩ ɔ. Ɔ fi mɛlɛ sɔ''n, ɔ nʋn yɩ́ awulo amma''n-mɔ kʋalaa bɛ
        kɔ le Zozi bɛ kɔ li.'
      sbs: 0.7217
      gen_sec: 16.61
      ref_sec: 12.86
      cer: 0.0643
      wer: 0.1957
    bible_00002:
      source: bible
      text: Anɩn bian kʋn wɔ Betanin kulo nɩn asʋ, bɛ fɛlɛ yɩ́ Lazaa. Lazaa sɔ'n nʋn yɩ́ nianman mmalasua
        nnyuan yɛ̂ bɛ tɩ Betanin ɛbɛlɛ ɔ. Kʋn li Mali yɛ̂ kʋn kʋsʋ li Maatɩ.
      sbs: 0.7135
      gen_sec: 12.0
      ref_sec: 10.96
      cer: 0.0248
      wer: 0.0909
    bible_00003:
      source: bible
      text: 'Kaan cɛ, sʋanlan kʋn kɔ a kɔ tʋ bɛ́. Yɩ́ nwan: “Ɛmɔ nɩ́an, menian''n-mɔ mɔ ɛmɔ gualɩ bɛ́
        fiadɩ''n, bɛ gua Nyanmɩan awulo ɛlɔ, bɛ lɛ kekele menian''n-mɔ ninnge.”'
      sbs: 0.7928
      gen_sec: 10.99
      ref_sec: 10.72
      cer: 0.0721
      wer: 0.1379
    bible_00004:
      source: bible
      text: Bɛ́ nun bie fɩ́ɩ́ mmian man like anwʋn. Afɩ, bɛ́ kʋalaa mɔ bɛ le ebo anaan sua'n, bɛ tɔnɩn
        yɩ́ bɛ fa yɩ́ esika'n
      sbs: 0.8035
      gen_sec: 9.15
      ref_sec: 8.56
      cer: 0.0256
      wer: 0.0417
    bible_00005:
      source: bible
      text: Ɔ sanlɩn kɛ kanga mɔ yɛ́ Mɩn kɔ fɛlɛ yɩ́'n, anɩn yɛ́ Mɩn a man ɔ'a nyan fanwʋndi. Sʋanlan
        kʋsʋ m'ɔ di yɩ́ ti anwʋn mɔ yɛ́ Mɩn kɔ fɛlɛ yɩ́'n, anɩn ɔ'a kaci yɛ́ Mɩn kanga.
      sbs: 0.8128
      gen_sec: 11.3
      ref_sec: 10.64
      cer: 0.0
      wer: 0.0
    bible_00006:
      source: bible
      text: Nan mɩɩn kan sɔ mɩn kele ɛmɔ, yɩ́ dɩɛ cɩan mɔ bɛ 'yɔ ɛmɔ sɔ'n, anɩn ɛmɔ kacɩ kɛ n ganlɩn n
        gelelɩ ɛmɔ. M'an ngan m'an ngele man ɛmɔ daba, afɩ anɩn mɩn nʋn ɛmɔ y'ɔ san ɔ.
      sbs: 0.6961
      gen_sec: 14.59
      ref_sec: 13.18
      cer: 0.0167
      wer: 0.1538
    bible_00007:
      source: bible
      text: Ɛnɛ nʋn ɛnɛ, bɛ 'kɩnnga Moyizɩ mala kalata'n-mɔ a, bɛ tɩ kɛ menian mɔ b'a hyɩ bɛ́ ajʋnlɩn
        ɔ.
      sbs: 0.8207
      gen_sec: 7.28
      ref_sec: 6.5
      cer: 0.0606
      wer: 0.1579
    bible_00008:
      source: bible
      text: Afɩ, sʋanlan m'ɔ nne Baa'n nni man'n, anɩn sʋanlan sɔ'n, ɔ nne man Sɩɛ'n kʋsʋ nni man. Nan
        sʋanlan m'ɔ de Baa'n di'n, anɩn ɔ de Sɩɛ'n kʋsʋ di.
      sbs: 0.7936
      gen_sec: 9.12
      ref_sec: 8.8
      cer: 0.0202
      wer: 0.0345
    bible_00009:
      source: bible
      text: Ɛmɔ kácɩ kɛ sʋanlan biala, sɛ ɔ tɩ kanga o, sɛ ɔ tɩ man kanga o, yɩ́ junman kpa m'ɔ kɔ li'n,
        ɔ 'nyan yɩ́ nwʋn ahatua m'ɔ fata'n yɛ́ Mɩn asa nun.
      sbs: 0.8193
      gen_sec: 10.58
      ref_sec: 10.02
      cer: 0.0909
      wer: 0.1818
    bible_00010:
      source: bible
      text: 'Mɔ Pɩɛlɩ tɩlɩ ɛjɔlɛ sɔ''n, ɔ kɔ su akpʋlʋwa. Yɩ́ nwan: “Zozi sɔ''n, mɩn nzɩ man yɩ́.”'
      sbs: 0.7439
      gen_sec: 6.72
      ref_sec: 6.32
      cer: 0.0714
      wer: 0.1765
    bible_00011:
      source: bible
      text: 'Mali jʋnlɩn kɛ sʋanlan''n m''ɔ di tola nɩn anun junman nɩn ɔ. Yɩ́ nwan: “Yɛmɩnlɩn, sɛ wɔ́
        yɛ̂ a yɩ yɩ́ ɛwa a, anɩn kele mɩ́n lɩka mɔ ɛ sielɩ yɩ́''n maan n gɔ́ n vá.”'
      sbs: 0.7066
      gen_sec: 10.4
      ref_sec: 11.42
      cer: 0.0818
      wer: 0.1944
    bible_00012:
      source: bible
      text: Kɛmɔ ɛmɔ nne man sʋanlan'n mɔ Sɩɛ'n sʋanlɩn yɩ́'n nni man'n, ɔ man ɛmɔ nva man yɩ́ ɛjɔlɛ'n
        bɛ nzie man.
      sbs: 0.7585
      gen_sec: 7.44
      ref_sec: 6.32
      cer: 0.0811
      wer: 0.2381
    bible_00013:
      source: bible
      text: Nan ɔ tɩ mala wɔ ɛmɔ afian ɛwa, sɛ bɛ 'di *Pakɩ biala a, bɛ́ mɔ bɛ kɔ gua bɛ́ fiadɩ'n, mɩn
        yɩ kʋn. Yɩ́ ti, asʋ ɛmɔ kulo kɛ mɩn yaci Zufʋ'n-mɔ belemgbin nɩn ɔ?”
      sbs: 0.6046
      gen_sec: 9.95
      ref_sec: 11.78
      cer: 0.1101
      wer: 0.1667
    bible_00014:
      source: bible
      text: 'Ɛhɩ a, bɛ tɩ ɛbɛlɛ kaan mɔ ɔ ''kɔ bie''n, Zozi ''tʋ yɩ́ nyɩn nɩan an, menian dɔʋn kpa lɛ
        ba yɩ́ nwʋn, nán ɔ''a bisa Filipʋ kɛ: “Filipʋ, ninhan yɛ̂ yɛ ''nyan like yɛ to yɛ man menian nwala
        ɛhɩ di ɔ?”'
      sbs: 0.6951
      gen_sec: 12.18
      ref_sec: 12.16
      cer: 0.2015
      wer: 0.3023
    bible_00015:
      source: bible
      text: Ɛmɔ tɩ Nyanmɩan anwʋntɩɛ mma, yɩ́ ti, nán man bɛ tɩ satɩlɩfʋɛ nyɔlɩɛ fɩ́ɩ́, anaan basa-basa
        ɛyɔlɛ ɔ nʋn anyɩnbʋlʋ bɔbɔ ɛmɔ afian ɛlɔ.
      sbs: 0.8012
      gen_sec: 10.08
      ref_sec: 9.56
      cer: 0.0
      wer: 0.0
    bible_00016:
      source: bible
      text: Ɛmɔ a nɩan yɛ́ nʋn yɛ́ Mɩn asɩtanlan sɔ nɩn asʋ. Ɛhɩka ati yɛ̂ bɛ helelɩ ɛmɔ ahʋlʋwa kpa tɛmʋn
        mɔ ɛmɔ lelɩ Nyanmɩan Anʋan Ɛjɔlɛ'n bɛ lili nɩn ɔ. Nan kʋsʋ Wawɛ Nwannzan-nwannzan nɩn a man ɛmɔ
        le fɛ elie.
      sbs: 0.7949
      gen_sec: 15.84
      ref_sec: 14.1
      cer: 0.0
      wer: 0.0488
    bible_00017:
      source: bible
      text: Mɔ Zakali yuelɩ Nyanmɩan awulo nɩn anun junman'n di'n, ɔ kɔ sa kɔ hɔ yɩ́ kulo.
      sbs: 0.8213
      gen_sec: 5.2
      ref_sec: 4.44
      cer: 0.0
      wer: 0.0
    bible_00018:
      source: bible
      text: Mɔ mmɔfʋɛ nnyuan'n lili yɛ́ Mɩn anwʋn adanzɩɛ bɛ hanlɩn yɩ́ nʋan ɛjɔlɛ'n yuelɩ'n, bɛ kɔ sa
        bɛ kɔ hɔ Zoluzalɛmʋn. Mɔ bɛ 'kɔ'n, bɛ bɔlɩ Ɛjɔlɛkpa'n Samali kulo dɔʋn asʋ bɛ hele menian'n-mɔ.
      sbs: 0.796
      gen_sec: 14.59
      ref_sec: 13.14
      cer: 0.0288
      wer: 0.0588
    bible_00019:
      source: bible
      text: Ɛjɔlɛkpa nɩn ati, sɛ mɩɩn nwun yalɛ ɛmɔ dunman nun an, nán bɛ man bɛ́ nwʋn bubu bɛ́. Nan ɔ
        tɩ ɛmɔ anunminnyanmʋn wɔ Nyanmɩan anyunnun.
      sbs: 0.8391
      gen_sec: 9.36
      ref_sec: 8.48
      cer: 0.0
      wer: 0.0
    bible_00020:
      source: bible
      text: 'Ɛjɔlɛ kpɔlɛ kʋn yɛ̂ n dɩanlɩn nun n ganlɩn yɩ́ bɛ́ afian ɛbɛlɛ ɔ. Mɩ́n nwan: ‘Ewuetinnge
        nɩn ati yɛ̂ ɔ man ɛnɛ ɛmɔ lɛ bua mɩ́n ndɛɛ ɔ!’”'
      sbs: 0.8307
      gen_sec: 10.26
      ref_sec: 9.86
      cer: 0.0312
      wer: 0.1034
    bible_00021:
      source: bible
      text: Mɩn yɔ ajʋnlɩn kɛ ɛmɔ nwun yɩ́ kɛ yɛ de Kilisi yɛ di.
      sbs: 0.8233
      gen_sec: 3.9
      ref_sec: 3.16
      cer: 0.0
      wer: 0.0
    bible_00022:
      source: bible
      text: 'Zase kɔ jinlan yɛ́ Mɩn anyunnun, yɩ́ nwan: “Yɛmɩnlɩn, tie! Mɩn ''bu mɩ́n nwʋn ninnge nɩn
        anun mɩn tu yɩ́ ebue mɩn man ehianfʋɛ''n-mɔ. Sɛ n nili sʋanlan bie ndunlunmun an, mɩn ''bɔ yɩ́
        nwʋn fâ nnan mɩn man yɩ́.”'
      sbs: 0.729
      gen_sec: 12.24
      ref_sec: 13.32
      cer: 0.1074
      wer: 0.175
    bible_00023:
      source: bible
      text: 'Zufʋ''n-mɔ fɛtɩ sɔ''n kʋsʋ, cɩan m''ɔ li sian''n yɛ̂ ɔ tɩ fɛtɩ''n cɩan kpili kpa nɩn ɔ. Cɩan
        sɔ''n, Zozi jasʋlɩ jinlanlɩn menian''n-mɔ kʋalaa afian an, yɩ́ nwan: “Sʋanlan mɔ nzuhoe lɛ kun
        yɩ́''n, ɔ bála mɩ́n nwʋn ɔ bála a nʋn nzue.'
