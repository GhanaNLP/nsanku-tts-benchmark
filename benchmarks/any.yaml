      cer: 0.0367
      wer: 0.1111
    bible_00014:
      source: bible
      text: 'Ɛhɩ a, bɛ tɩ ɛbɛlɛ kaan mɔ ɔ ''kɔ bie''n, Zozi ''tʋ yɩ́ nyɩn nɩan an, menian dɔʋn kpa lɛ
        ba yɩ́ nwʋn, nán ɔ''a bisa Filipʋ kɛ: “Filipʋ, ninhan yɛ̂ yɛ ''nyan like yɛ to yɛ man menian nwala
        ɛhɩ di ɔ?”'
      sbs: 0.6895
      gen_sec: 14.48
      ref_sec: 12.16
      cer: 0.0299
      wer: 0.1163
    bible_00015:
      source: bible
      text: Ɛmɔ tɩ Nyanmɩan anwʋntɩɛ mma, yɩ́ ti, nán man bɛ tɩ satɩlɩfʋɛ nyɔlɩɛ fɩ́ɩ́, anaan basa-basa
        ɛyɔlɛ ɔ nʋn anyɩnbʋlʋ bɔbɔ ɛmɔ afian ɛlɔ.
      sbs: 0.7619
      gen_sec: 9.52
      ref_sec: 9.56
      cer: 0.0196
      wer: 0.125
    bible_00016:
      source: bible
      text: Ɛmɔ a nɩan yɛ́ nʋn yɛ́ Mɩn asɩtanlan sɔ nɩn asʋ. Ɛhɩka ati yɛ̂ bɛ helelɩ ɛmɔ ahʋlʋwa kpa tɛmʋn
        mɔ ɛmɔ lelɩ Nyanmɩan Anʋan Ɛjɔlɛ'n bɛ lili nɩn ɔ. Nan kʋsʋ Wawɛ Nwannzan-nwannzan nɩn a man ɛmɔ
        le fɛ elie.
      sbs: 0.7686
      gen_sec: 13.04
      ref_sec: 14.1
      cer: 0.026
      wer: 0.0732
    bible_00017:
      source: bible
      text: Mɔ Zakali yuelɩ Nyanmɩan awulo nɩn anun junman'n di'n, ɔ kɔ sa kɔ hɔ yɩ́ kulo.
      sbs: 0.7335
      gen_sec: 6.08
      ref_sec: 4.44
      cer: 0.0345
      wer: 0.1875
    bible_00018:
      source: bible
      text: Mɔ mmɔfʋɛ nnyuan'n lili yɛ́ Mɩn anwʋn adanzɩɛ bɛ hanlɩn yɩ́ nʋan ɛjɔlɛ'n yuelɩ'n, bɛ kɔ sa
        bɛ kɔ hɔ Zoluzalɛmʋn. Mɔ bɛ 'kɔ'n, bɛ bɔlɩ Ɛjɔlɛkpa'n Samali kulo dɔʋn asʋ bɛ hele menian'n-mɔ.
      sbs: 0.7015
      gen_sec: 12.48
      ref_sec: 13.14
      cer: 0.0072
      wer: 0.0294
    bible_00019:
      source: bible
      text: Ɛjɔlɛkpa nɩn ati, sɛ mɩɩn nwun yalɛ ɛmɔ dunman nun an, nán bɛ man bɛ́ nwʋn bubu bɛ́. Nan ɔ
        tɩ ɛmɔ anunminnyanmʋn wɔ Nyanmɩan anyunnun.
      sbs: 0.7835
      gen_sec: 8.0
      ref_sec: 8.48
      cer: 0.0194
      wer: 0.0769
    bible_00020:
      source: bible
      text: 'Ɛjɔlɛ kpɔlɛ kʋn yɛ̂ n dɩanlɩn nun n ganlɩn yɩ́ bɛ́ afian ɛbɛlɛ ɔ. Mɩ́n nwan: ‘Ewuetinnge
        nɩn ati yɛ̂ ɔ man ɛnɛ ɛmɔ lɛ bua mɩ́n ndɛɛ ɔ!’”'
      sbs: 0.7757
      gen_sec: 9.92
      ref_sec: 9.86
      cer: 0.0312
      wer: 0.0345
    bible_00021:
      source: bible
      text: Mɩn yɔ ajʋnlɩn kɛ ɛmɔ nwun yɩ́ kɛ yɛ de Kilisi yɛ di.
      sbs: 0.771
      gen_sec: 3.84
      ref_sec: 3.16
      cer: 0.0256
      wer: 0.0769
    bible_00022:
      source: bible
      text: 'Zase kɔ jinlan yɛ́ Mɩn anyunnun, yɩ́ nwan: “Yɛmɩnlɩn, tie! Mɩn ''bu mɩ́n nwʋn ninnge nɩn
        anun mɩn tu yɩ́ ebue mɩn man ehianfʋɛ''n-mɔ. Sɛ n nili sʋanlan bie ndunlunmun an, mɩn ''bɔ yɩ́
        nwʋn fâ nnan mɩn man yɩ́.”'
      sbs: 0.6131
      gen_sec: 23.92
      ref_sec: 13.32
      cer: 0.5772
      wer: 0.9
    bible_00023:
      source: bible
      text: 'Zufʋ''n-mɔ fɛtɩ sɔ''n kʋsʋ, cɩan m''ɔ li sian''n yɛ̂ ɔ tɩ fɛtɩ''n cɩan kpili kpa nɩn ɔ. Cɩan
        sɔ''n, Zozi jasʋlɩ jinlanlɩn menian''n-mɔ kʋalaa afian an, yɩ́ nwan: “Sʋanlan mɔ nzuhoe lɛ kun
        yɩ́''n, ɔ bála mɩ́n nwʋn ɔ bála a nʋn nzue.'
      sbs: 0.6919
      gen_sec: 16.88
      ref_sec: 13.94
      cer: 0.0503
      wer: 0.2791
    bible_00024:
      source: bible
      text: Ɔ wɔ ɛbɛlɛ dede a, cɩan kʋn Nyanmɩan kɔ yɩ sʋanlan kʋn asɩɛ nɩn asʋ ɛwa kɛ ɔ lí adanzɩɛ. Sʋanlan
        sɔ'n, bɛ fɛlɛ yɩ́ Zʋan.
      sbs: 0.7226
      gen_sec: 9.2
      ref_sec: 8.18
      cer: 0.0225
      wer: 0.0769
    bible_00025:
      source: bible
      text: 'Yɛ́ kʋalaa yɛ kɔ fin asɩ. Mɩn ''tie a, anɩn anɩɛ kʋn lɛ bisa mɩ́n Ebele anɩɛ nɩn anun kɛ:
        ‘Sɔlʋ, Sɔlʋ, nzukɛ ati yɛ̂ ɛ lɛ kele mɩ́n ahʋlʋwa ɔ? Ɛ ngɔ hʋala man mɩ́n nʋn kpɩnmgbɩn.’'
      sbs: 0.7785
      gen_sec: 12.64
      ref_sec: 13.1
      cer: 0.0159
      wer: 0.0263
    bible_00026:
      source: bible
      text: Mɔ bɛ yɩlɩ menian nsʋ sɔ'n-mɔ'n, bɛ kɔ fa bɛ́ bɛ kɔ hele mmɔfʋɛ'n-mɔ. Mmɔfʋɛ'n-mɔ kɔ fa bɛ́
        sa bɛ kɔ fua bɛ́ ti sʋ bɛ kɔ sɛlɛ Nyanmɩan bɛ kɔ man bɛ́.
      sbs: 0.7008
      gen_sec: 9.84
      ref_sec: 11.16
      cer: 0.0388
      wer: 0.0606
    bible_00027:
      source: bible
      text: 'Ɛlɛhʋn kʋn, yɛ́ Mɩn bɔfʋɛ''n kʋn kɔ han kɔ hele Filipʋ kɛ: “Filipʋ, jasʋ kɔ Ngʋa ɛlɔ, fa
        atɩn''n m''ɔ fi Zoluzalɛmʋn ɔ tʋlʋ kɔ Gaza''n. Atɩn sɔ''n tɩ fuaan.”'
      sbs: 0.6764
      gen_sec: 11.52
      ref_sec: 12.26
      cer: 0.0183
      wer: 0.0667
    bible_00028:
      source: bible
      text: Yɩ́ ti, ɛmɔ héle bɛ́ maan bɛ nwún yɩ́ kɛ ɛmɔ kulo bɛ́ sakpa. Yɩ́ dɩɛ anɩn asɔnɩn mma'n-mɔ
        tɩ yɩ́ bʋ kɛ yɛ nva man ɛmɔ yɛ ndu man yɛ́ nʋan nun mgban.
      sbs: 0.7723
      gen_sec: 10.64
      ref_sec: 12.54
      cer: 0.0291
      wer: 0.1471
    bible_00029:
      source: bible
      text: Ɛnalɛ'n mɔ ɔ'a lɔ kpa'n, bɛ fá bɛ bála, bɛ hún yɩ́ maan yɛ tʋ́n ndutue alɩɛ.
      sbs: 0.7002
      gen_sec: 6.4
      ref_sec: 3.88
      cer: 0.0
      wer: 0.1176
    bible_00030:
      source: bible
      text: Mɩ́n dɩɛ, sɛ ɛmɔ bua mɩ́n ndɛɛ o, anaan menian'n-mɔ bua mɩ́n ndɛɛ o, ɛhɩ fɩ́ɩ́ nvalɩ man mɩ́n
        nwʋn. Ɛsɛ bɔbɔ, mɩ́n muonun mɩn mmua man mɩ́n nwʋn ndɛɛ
      sbs: 0.7648
      gen_sec: 10.4
      ref_sec: 9.8
      cer: 0.0571
      wer: 0.2667
    bible_00031:
      source: bible
      text: Sɛ alʋacɩcɩɛ sʋanlan wɔ awulo sɔ nɩn anun an, ɛmɔ alʋacɩcɩɛ'n 'kan yɩ́. Sɛ ɔ tɩ man sɔ a,
        ɛmɔ alʋacɩcɩɛ'n 'ka ɛmɔ ɛlɔ.
      sbs: 0.706
      gen_sec: 15.76
      ref_sec: 7.84
      cer: 0.6628
      wer: 1.0417
    bible_00032:
      source: bible
      text: Afɩ ɛtɛ ngacile'n kʋalaa fi esika anyɩnbʋlʋ'n. Menian mmie-mɔ anyɩn a bʋlʋ esika'n dede b'a
        yaci bɛ́ dedi'n b'a tʋ mʋa, b'a fa bɛ́ nwʋn b'a wula emian ngacile dɔʋn anun.
      sbs: 0.7655
      gen_sec: 11.6
      ref_sec: 10.16
      cer: 0.024
      wer: 0.129
    bible_00033:
      source: bible
      text: nán menian'n-mɔ kʋalaa anyɩn a sɔ Baa'n kɛ bɛ́ nyɩn sɔ Sɩɛ'n. Sʋanlan mɔ yɩ́ nyɩn nzɔ man
        Baa'n, anɩn yɩ́ nyɩn nzɔ man Sɩɛ'n m'ɔ sʋanlɩn Baa'n.
      sbs: 0.706
      gen_sec: 8.72
      ref_sec: 9.92
      cer: 0.0686
      wer: 0.2143
    bible_00034:
      source: bible
      text: Mɩɩn kan yɩ́ ananhɔlɛ mɩn kele ɛmɔ kɛ ɛmɔ lɛ 'ba sun bɛ́ nyɩn ɛmʋɩn bɛ yɩ awɔ́lɛ. Nan eyuadɩ
        amma'n-mɔ mɔ bɛ nne man mɩ́n bɛ nni man'n, bɛ 'ba li fɛ. Ɛmɔ alʋa 'ba bɔ bɛ́ nwʋn, nan kʋsʋ ɛmɔ
        alʋabɔ'n 'ba kaci fɛ elie.
      sbs: 0.6905
      gen_sec: 16.4
      ref_sec: 14.58
      cer: 0.0265
      wer: 0.1489
    bible_00035:
      source: bible
      text: Sʋanlan m'ɔ bu yɩ́ nwʋn kɛ ɔ sɩ like'n, anɩn ɔ nzɩ ɔ ngua man yɩ́ bʋ kpa kɛ ɔ fata kɛ ɔ sɩ́
        yɩ́'n.
      sbs: 0.777
      gen_sec: 8.0
      ref_sec: 6.28
      cer: 0.0769
      wer: 0.08
    bible_00036:
      source: bible
      text: 'Zozi nwan: “Pɩɛlɩ, mɩɩn kan yɩ́ ananhɔlɛ mɩn kele wɔ́ kɛ ɛnɛ, ɔ nʋn dede mɔ akɔ''n ''bɔ''n,
        ɛ kan yɩ́ kpɛ̂ nsan kɛ ɛ nzɩ man mɩ́n”'
      sbs: 0.7312
      gen_sec: 9.36
      ref_sec: 7.8
      cer: 0.0465
      wer: 0.3929
    bible_00037:
      source: bible
      text: Menian mmie-mɔ, bɛ fɛlɩ Nyanmɩan kpa, bɛ kɔ hɔ kɔ fa Etiɛnɩn fuin'n bɛ kɔ yɩ awɔ́lɛ bɛ kɔ
        hɔ kɔ sie yɩ́.
      sbs: 0.7176
      gen_sec: 7.6
      ref_sec: 7.54
      cer: 0.04
      wer: 0.087
    bible_00038:
      source: bible
      text: 'Ɔ lalɩ jʋnlɩnlɩn an, ɔ kɔ se yɩ́ nwʋn kɛ: ‘Anɩn mɩn ''yɔ yɩ́ sɛ? N nne man lɩka mɔ mɩn ''sie
        mɩ́n ebo nɩn asʋ ninnge nɩn ɔ.’'
      sbs: 0.7063
      gen_sec: 8.08
      ref_sec: 7.22
      cer: 0.0361
      wer: 0.069
    bible_00039:
      source: bible
      text: “Divɩn baka'n y'ɔ le mɩ́n, yɛ̂ mɩ́n sa mma'n-mɔ y'ɔ le ɛmɔ. Nunhan mɔ ɔ'a fa yɩ́ nwʋn ɔ'a
        bɔ mɩ́n, m'ɔ nʋn mɩ́n tɩ daa, mɔ mɩ́n kʋsʋ mɩn nʋn yɩ́ tɩ'n, ɔ 'yɔ nyɔlɩɛ kpa dɔʋn. Afɩ sɛ n nnʋn
        man nun an, ɛmɔ ngʋala man like kpa fɩ́ɩ́ yɔ.
      sbs: 0.7047
      gen_sec: 14.0
      ref_sec: 13.66
      cer: 0.0458
      wer: 0.3462
    bible_00040:
      source: bible
      text: 'Zozi nwan: “Like kʋnmgba cein ɛhɩ mɔ m''an yɔ''n, ɔ''a sin ɛmɔ anwʋn. Ɛjɔlɛ sɔ nɩn a lɔ ɛmɔ
        ngasi. Cɩan daa ɛmɔ bɔ sʋ.'
      sbs: 0.7022
      gen_sec: 8.72
      ref_sec: 7.88
      cer: 0.0732
      wer: 0.32
    bible_00041:
      source: bible
      text: Nan sʋanlan fʋfɔlɛ y'ɔ di mɩ́n nwʋn adanzɩɛ ɔ. Yɛ̂ mɩn sɩ kɛ mɩ́n nwʋn ɛjɔlɛ'n m'ɔ hanlɩn'n
        tɩ ananhɔlɛ.
      sbs: 0.6927
      gen_sec: 6.64
      ref_sec: 4.98
      cer: 0.0
      wer: 0.1
    bible_00042:
      source: bible
      text: Yɩ́ ti, sɛ Satan ngʋa'n-mɔ lɛ yɔ bɛ́ nwʋn kɛ bɛ tɩ ngʋa kpa a, ɛhɩ nzin man yɛ́ nwʋn fɩ́ɩ́
        sʋa. Nan ayuelɩɛ cɩan nɩn anun yɛ̂ bɛ 'nyan bɛ́ nyɔlɩɛ'n-mɔ anwʋn ahatua ɔ.
      sbs: 0.7792
      gen_sec: 11.2
      ref_sec: 11.62
      cer: 0.0172
      wer: 0.1143
    bible_00043:
      source: bible
      text: “Sian dɩɛ, mɩn sɩ kɛ ɛmɔ mɔ m'an tanlan ɛmɔ afian m'an bɔ Nyanmɩan Belemgbin Mân nɩn anwʋn
        ɛjɔlɛ m'an hele ɛmɔ'n, ɛmɔ lɛ ngɔ nwun man mɩ́n nyunnun kʋ́n.
      sbs: 0.7408
      gen_sec: 10.8
      ref_sec: 8.74
      cer: 0.0177
      wer: 0.0667
    bible_00044:
      source: bible
      text: Ɛhɩka ati, ɔ fi cɩan mɔ yɛ tɩlɩ ɛmɔ angan'n, cɩan daa yɛ yɔ asɔnɩn yɛ man ɛmɔ. Yɛ lɛ sɛlɛ
        Nyanmɩan kɛ ɔ mán yɩ́ Wawɛ'n héle ɛmɔ ngɛlɛ kpa ɔ mán ɛmɔ nyán ajʋnlɩn bɛ nwún like m'ɔ kulo kɛ
        ɛmɔ yɔ'n kpa bɔkɔɔ.
      sbs: 0.7366
      gen_sec: 14.64
      ref_sec: 14.9
      cer: 0.0596
      wer: 0.4348
    bible_00045:
      source: bible
      text: Asɔnɩn'n tɩ kɛ yɩ́ nwʋnnaan yɛ̂ ɔ tɩ kɛ Asɔnɩn nɩn ati. Ɔ wɔ eyuadɩ'n lɩka kʋalaatin. Yɩ́
        yɛ̂ ɔ yɩ Asɔnɩn'n kpa bɔkɔɔ ɔ.
      sbs: 0.7801
      gen_sec: 7.68
      ref_sec: 13.12
      cer: 0.0233
      wer: 0.08
    bible_00046:
      source: bible
      text: Ɛmɔ jʋnlɩn kɛ ɛmɔ ɛlɔ yɛ̂ Nyanmɩan ɛjɔlɛ'n bɔlɩ yɩ́ bʋ ɔ? Anaan ɛmɔ jʋnlɩn kɛ ɛmɔ ngʋnmɩn
        ala yɛ̂ b'a tɩ Nyanmɩan ɛjɔlɛ nɩn ɔ?
      sbs: 0.7791
      gen_sec: 8.0
      ref_sec: 8.34
      cer: 0.0
      wer: 0.0
    bible_00047:
      source: bible
      text: Mɩ́n mma-mɔ, mɩn di ɛmɔ anwʋn yalɛ biekun. Ɛmɔ anwʋn yalɛ'n mɔ mɩɩn di'n, ɔ nʋn balasua mɔ
        yɩ́ kʋ a han yɩ́'n dɩɛ tɩ kʋn. Mɩn 'bɔ ɛmɔ anwʋn mɔndɩnlɩn dede ɛmɔ nanndɩ Kilisi atɩn dɩɛ nɩn
        asʋ.
      sbs: 0.7516
      gen_sec: 11.76
      ref_sec: 12.48
      cer: 0.0288
      wer: 0.1795
    bible_00048:
      source: bible
      text: Nan Nyanmɩan a nwun mɩ́n nwʋn anwunnvoe. Afɩ mɩ́n mɔ n dɩ ɛtɛfʋɛ'n-mɔ kʋalaa anun kpain'n
        dunman nun, bɛ́ mɔ bɛ 'ba le Zozi Kilisi bɛ di bɛ nyan ngʋan m'ɔ le man ayuelɩɛ'n, bɛ 'ba nwun
        yɩ́ kɛ Zozi Kilisi si abʋtalɛ kpa.
      sbs: 0.7637
      gen_sec: 15.76
      ref_sec: 13.46
      cer: 0.0186
      wer: 0.0909
    bible_00049:
      source: bible
      text: 'Zozi nwan: “Sɛ ɛ kulo mɩ́n an, anɩn nɩan mɩ́n mmʋa mma''n-mɔ asʋ.”'
      sbs: 0.693
      gen_sec: 4.8
      ref_sec: 4.34
      cer: 0.0682
      wer: 0.2308
    bible_00050:
      source: bible
      text: Anɩn Zozi wula taladɩɛ nnyuan, kʋn wɔ yɩ́ bʋ yɛ̂ kʋn wɔ sʋ. Zozi fi tɔbɩlɩ nɩn anwʋn ɔ kɔ
        jasʋ, ɔ kɔ yɩ yɩ́ anwunno taladɩɛ'n m'ɔ wula sʋ'n kɔ gua yɩ́ ɛbɛlɛ, ɔ kɔ ha yɩ́ bʋ dɩɛ'n. Ɔ kɔ
        fa duku kʋn ɔ kɔ kpɛ yɩ́ bʋ.
      sbs: 0.7224
      gen_sec: 13.92
      ref_sec: 13.44
      cer: 0.0068
      wer: 0.02
    bible_00051:
      source: bible
      text: 'Zozi nʋn yɩ́ menian bulu nʋn nnyuan''n kɔ tɩ bɛ́ nwʋn. Ɔ kɔ han hɔ hele bɛ́ kɛ: “Yaa, yɛ
        lɛ kɔ Zoluzalɛmʋn o! Ɛjɔlɛ''n kʋalaa mɔ mgbɔmanfʋɛ''n-mɔ hanlɩn m''ɔ tʋ de Mân Baa''n, ɛbɛlɛ yɛ̂
        ɔ ''kpɩn sʋ ɔ.'
      sbs: 0.7142
      gen_sec: 13.6
      ref_sec: 12.86
      cer: 0.0438
      wer: 0.15
    bible_00052:
      source: bible
      text: Afɩ mɩɩn kan mɩn kele ɛmɔ kɛ, ɔ fi ɛnɛ m'ɔ kɔ'n, mɩn ngɔ nʋn man nzan fɩ́ɩ́ kʋ́n dede ɔ 'ju
        Nyanmɩan belemgbin elie'n tɛmʋn.”
      sbs: 0.6923
      gen_sec: 9.04
      ref_sec: 7.4
      cer: 0.0562
      wer: 0.3077
    bible_00053:
      source: bible
      text: Anwunno nʋn asɩ'n kʋala kɛ bɛ kpɛ nun bɛ sɩn ndɛ-ndɛ tala mala nɩn anun ɛjɔlɛ kpɔlɛ sin kaan
        sʋa.
      sbs: 0.679
      gen_sec: 7.04
      ref_sec: 6.94
      cer: 0.04
      wer: 0.15
    bible_00054:
      source: bible
      text: Sɛ kʋsʋ tɛmʋn mɔ bɛ fɛlɛlɩ mɩ́n mgbain'n-mɔ aja sʋ'n, bɛ́ nwan m'an yɔ like ɛtɛ, yɩ́ ti y'ɔ
        man m'an nyan amannɩɛ a, anɩn ɛmɔ mɔ bɛ gua ɛwa'n, bɛ hán.
      sbs: 0.6891
      gen_sec: 11.2
      ref_sec: 9.7
      cer: 0.1442
      wer: 0.5312
    bible_00055:
      source: bible
      text: Sɛ y'a han Nyanmɩan Anʋan Ɛjɔlɛ'n nán ɔ su mma a, ɛmɔ jʋnlɩn kɛ mɔ yɛ lɛ kpʋnndɛ yɩ́ ɛmɔ ɛlɔ'n
        sʋnlɩn sʋnman ɔ?
      sbs: 0.769
      gen_sec: 6.24
      ref_sec: 7.08
      cer: 0.1098
      wer: 0.2917
    bible_00056:
      source: bible
      text: 'Zozi nwan: “Mɩɩn kan yɩ́ ananhɔlɛ mɩn kele ɛmɔ kɛ sɛ ɛmɔ a nni man *Mân Baa nɩn anwʋnnaan''n,
        ɛsɛ sɛ ɛmɔ a nnʋn man yɩ́ moja nɩn an, anɩn ɛmɔ le man ngʋan.'
      sbs: 0.7005
      gen_sec: 12.96
      ref_sec: 11.18
      cer: 0.0536
      wer: 0.1176
    bible_00057:
      source: bible
      text: Sʋanlan sɔ'n nyɔlɩɛ nɩn anwʋn epinnian'n mɔ ɛmɔ a pinnin yɩ́'n, bɛ mán ɔ lí sɔ.
      sbs: 0.763
      gen_sec: 5.2
      ref_sec: 4.64
      cer: 0.1552
      wer: 0.1875
    bible_00058:
      source: bible
      text: '“Nan Nyanmɩan''n m''ɔ wɔ anwunno''n dɩɛ, nan sua mɔ kulo menian''n-mɔ kɔ si nɩn anun yɛ̂
        ɔ da ɔ. Kɛ Nyanmɩan kpɔmanfʋɛ''n hanlɩn yɩ́''n, ɔ hanlɩn kɛ Nyanmɩan nwan:'
      sbs: 0.6701
      gen_sec: 10.4
      ref_sec: 9.48
      cer: 0.0261
      wer: 0.1034
    bible_00059:
      source: bible
      text: 'Ɛmɔ mgbafɛlɛ''n-mɔ kʋsʋ, ɛmɔ bɛ́bɛlɛ bɛ́ nwʋn asɩ bɛ mán mgbain''n-mɔ. Afɩ mɩɩn kan mɩn kele
        ɛmɔ kʋalaa kɛ bɛ bɛ́bɛlɛ bɛ́ nwʋn asɩ bɛ mán bɛ́ nwʋn. Ɔ sanlɩn kɛ b''a hɛlɛ wɔ Ɛhɛlɛ Ɛjɔlɛ nɩn
        anun kɛ:'
      sbs: 0.7285
      gen_sec: 15.12
      ref_sec: 12.44
      cer: 0.007
      wer: 0.0513
    bible_00060:
      source: bible
      text: Mɩɩn kan yɩ́ ananhɔlɛ mɩn kele ɛmɔ kɛ, sʋanlan biala m'ɔ kɔ le sʋanlan mɔ n gɔ sʋan yɩ́'n,
        anɩn mɩ́n muonun yɛ̂ ɔ'a le mɩ́n ɔ. Yɛ̂ m'ɔ kɔ le mɩ́n'n, anɩn ɔ tɩ kɛ sʋanlan'n m'ɔ sʋanlɩn mɩ́n'n
        yɛ̂ ɔ'a le yɩ́ ɔ.”
      sbs: 0.695
      gen_sec: 14.32
      ref_sec: 11.88
      cer: 0.0429
      wer: 0.2444
    bible_00061:
      source: bible
      text: Bɛ 'kɩkan ɛhɩ a, anɩn Sɔlʋ lɛ di junman'n tunmin sʋ ɔ kɔ yɩ́ nyunnun cɩan daa. Zufʋ'n-mɔ mɔ
        bɛ wɔ Damasɩ'n nnwun man ɛjɔlɛ mɔ bɛ kan ɔ. Afɩ Sɔlʋ kele nun maan bɛ nwun yɩ́ kɛ Zozi tɩ *Kilisi,
        Izalayɛ Belemgbin Ngʋandefʋɛ.
      sbs: 0.7133
      gen_sec: 15.52
      ref_sec: 14.56
      cer: 0.0305
      wer: 0.1364
    bible_00062:
      source: bible
      text: Bɛ́ muonun bɛ kɔ a kɔ tʋ Pɔlʋ nʋn Silasɩ. Bɛ kɔ li bɛ́ mgbata. M'ɔ yuelɩ'n, bɛ kɔ yɩ bɛ́ fi
        fiadɩ sua nɩn anun bɛ kɔ bʋtʋ bɛ́ kɛ bɛ fi kulo nɩn asʋ bɛ tú.
      sbs: 0.7237
      gen_sec: 11.36
      ref_sec: 10.0
      cer: 0.0374
      wer: 0.0526
    bible_00063:
      source: bible
      text: Bɛ́ kʋalaa mɔ bɛ kɔ tʋ ɛmɔ'n, ɛmɔ síke bɛ́ kanlanman. Afɩ menian mmie-mɔ yɔlɩ sɔ bɛ sikelɩ
        nyanmɩansʋ mmɔfʋɛ kʋsʋ b'a nnwun man nun.
      sbs: 0.7062
      gen_sec: 9.92
      ref_sec: 7.78
      cer: 0.07
      wer: 0.4
    bible_00064:
      source: bible
      text: 'Zozi kɔ han kɔ hele bɛ́ kɛ: “Sɛ ɛjɔlɛ''n tɩ sʋa a, anɩn ɛmɔ túa m''ɔ tɩ belemgbin dɩɛ''n
        bɛ mán yɩ́, nunhan kʋsʋ m''ɔ tɩ Nyanmɩan dɩɛ''n, ɛmɔ túa bɛ mán Nyanmɩan.”'
      sbs: 0.6973
      gen_sec: 10.72
      ref_sec: 10.02
      cer: 0.0357
      wer: 0.2121
    bible_00065:
      source: bible
      text: Nyanmɩan tɛɛyɩfʋɛ kʋn kɔ fa atɩn sɔ'n. Ɔ hɔlɩ dede mɔ yɩ́ nyɩn bɔlɩ bian'n mɔ b'a li yɩ́ awue
        nɩn ala a, ɔ kɔ sɩn ahanmɩan, yɛ̂ ɔ kɔ hɔ.
      sbs: 0.6943
      gen_sec: 11.84
      ref_sec: 8.44
      cer: 0.2604
      wer: 0.3871
    bible_00066:
      source: bible
      text: Sɛ ɔ nɩan yɩ́ nyɩn nɩn anun nán ɔ kɔ a, ɛbɛlɛ ala, anɩn yɩ́ lʋa a fi kɛ ɔ kpɩn ɔ tɩ yɩ́'n.
      sbs: 0.7231
      gen_sec: 6.32
      ref_sec: 5.42
      cer: 0.0167
      wer: 0.0417
    bible_00067:
      source: bible
      text: 'Mɔ Zozi nwunlin kɛ bɛ lɛ kpʋnndɛ bɛ bisa yɩ́ ɛjɔlɛ''n, ɔ kɔ se bɛ́ kɛ: “Kɛmɔ m''an han kɛ:
        ‘Ɔ ngɔ hyɛ man ɛmɔ lɛ mma nnwun man mɩ́n kʋ́n, ɛsɛ ɔ cɛ kaan an, ɛmɔ ''ba nwun mɩ́n biekun,’ yɩ́
        ti yɛ̂ ɛmɔ lɛ bisa bɛ́ nwʋn kosuan''n?'
      sbs: 0.6798
      gen_sec: 16.0
      ref_sec: 13.44
      cer: 0.0265
      wer: 0.12
    bible_00068:
      source: bible
      text: Nyanmɩan Kpili tɩ wawɛ. Yɩ́ ti, bɛ́ mɔ bɛ sʋ yɩ́'n, ɔ fata kɛ bɛ sʋ yɩ́ wawɛ nun nʋn ananhɔlɛ
        nun.”
      sbs: 0.6925
      gen_sec: 6.88
      ref_sec: 6.68
      cer: 0.0
      wer: 0.0
    bible_00069:
      source: bible
      text: 'Ɛhɩ, kɛmɔ mala nɩn asʋ kpain''n kulo kɛ ɔ bu yɩ́ nwʋn bɩ nɩn ati, ɔ kɔ bisa Zozi kɛ: “Anɩn
        nwan lɩlɩ yɛ̂ ɔ tɩ mɩ́n manngʋn''n?”'
      sbs: 0.7254
      gen_sec: 9.04
      ref_sec: 8.64
      cer: 0.0115
      wer: 0.0357
    bible_00070:
      source: bible
      text: 'Pɩɛlɩ kɔ fɛlɛ yɩ́ kɔ bisa yɩ́ kɛ: “Safila, asʋ gua sʋa yɛ̂ ɛmɔ tɔnɩnlɩn ɛmɔ asɩɛ nɩn ɔ?”'
      sbs: 0.6917
      gen_sec: 7.68
      ref_sec: 6.18
      cer: 0.0
      wer: 0.0
    bible_00071:
      source: bible
      text: Bɛ sulo Zufʋ mgbain'n-mɔ, yɩ́ ti yɛ̂ ɔ man bɛ lɛ kan kɛ bɛ nzɩ man nɩn ɔ. Afɩ Zufʋ mgbain'n-mɔ
        nwan sʋanlan m'ɔ kɔ se kɛ Zozi tɩ *Kilisi'n, bɛ 'fʋan yɩ́ bɛ́ asɔnɩn sua nɩn anun.
      sbs: 0.6953
      gen_sec: 10.72
      ref_sec: 11.22
      cer: 0.0403
      wer: 0.1579
    bible_00072:
      source: bible
      text: Ɔ 'sie Izalayɛ amma'n-mɔ mɛlɛ biala. Yɩ́ mɛlɛ'n le man ayuelɩɛ.”
      sbs: 0.6779
      gen_sec: 4.64
      ref_sec: 4.1
      cer: 0.0217
      wer: 0.0909
    bible_00073:
      source: bible
      text: 'Yɛ́ Mɩn nwan: “Akʋa kpa''n m''ɔ sɩ ngɛlɛ''n y''ɔ le benin? Yɩ́ y''ɔ le nunhan''n mɔ yɩ́ mɩn''n
        ''fa yɩ́ awulo''n wula yɩ́ sa nun kɛ ɔ nɩ́an sʋ, ɛsɛ tɛmʋn''n ju a, ɔ mán yɩ́ manngʋn''n-mɔ alɩɛ.'
      sbs: 0.7195
      gen_sec: 12.0
      ref_sec: 11.78
      cer: 0.0924
      wer: 0.3684
    bible_00074:
      source: bible
      text: 'Cɩan kʋn eyua dɔɛ nsan, ɔ kɔ nwun like kʋn kɛ ɛlalɩɛ nun. Ɔ ''nɩan an, anɩn nyanmɩansʋ bɔfʋɛ''n
        kʋn lɛ wʋlʋ yɩ́ awulo ɛbɛlɛ. Ɔ wʋlʋlɩ a, yɩ́ nwan: “Kɔɔnɛyɩ!”'
      sbs: 0.7137
      gen_sec: 12.56
      ref_sec: 11.2
      cer: 0.0179
      wer: 0.0968
    bible_00075:
      source: bible
      text: Menian mɔ bɛ mmu man Nyanmɩan Kpili tunmin'n like fɩ́ɩ́ mɔ ninnge ɛtɛ mɔ anwʋnnaan'n kulo'n
        yɛ̂ cɩan daa bɛ yɔ'n, bɛ́ yɛ̂ Nyanmɩan 'tua bɛ́ kalɛ nɩn ɔ.
      sbs: 0.6907
      gen_sec: 11.44
      ref_sec: 9.3
      cer: 0.0636
      wer: 0.3103
    bible_00076:
      source: bible
      text: Mɔ anɩn Zufʋ'n-mɔ 'ba li bɛ́ fɛtɩ'n mɔ bɛ fɛlɛ yɩ́ *Pakɩ'n, Zozi sɩ kɛ dɔɛ'n mɔ ɔ 'fa jasʋ
        asɩ ɛwa kɔ yɩ́ Sɩ anwʋn ɛlɔ nɩn a ju. Yɩ́ mɛlɛ kaan'n m'ɔ lili yɩ́ asɩɛ nɩn asʋ ɛwa'n, ɔ hulolɩ
        yɩ́ menian'n-mɔ dede ɔ juli yɩ́ ayuelɩɛ.
      sbs: 0.6797
      gen_sec: 15.44
      ref_sec: 12.22
      cer: 0.0258
      wer: 0.1224
    bible_00077:
      source: bible
      text: Sʋanlan m'ɔ tɩ man bʋa ɛnɩanfʋɛ kpa'n, mɔ yɩ́ dɩɛ ɔ kan mmʋa'n-mɔ ɔ kpʋnndɛ yɩ́ esika'n, sɛ
        ɔ nwun kɛ bedi'n lɛ ba a, ɔ yaci mmʋa'n-mɔ ɛbɛlɛ nwanndi maan bedi'n wʋlʋ bɛ́ nun ɔ cɩ bie ɔ bɔ
        bɛ́ asanndɩɛ.
      sbs: 0.7003
      gen_sec: 13.36
      ref_sec: 11.94
      cer: 0.049
      wer: 0.1905
    bible_00078:
      source: bible
      text: Sʋanlan fɩ́ɩ́ ngaci man nzan fʋfɔlɛ ngua man kpolo kotoku daba nun. Sɛ ɔ yɔ yɩ́ sɔ a, kpolo
        kotoku'n 'te, nzan'n 'butu, anɩn kpolo kotoku nɩn a yɔ mgban.
      sbs: 0.7173
      gen_sec: 10.88
      ref_sec: 13.12
      cer: 0.0268
      wer: 0.1
    bible_00079:
      source: bible
      text: Yɩ́ sɔ ati yɛ̂ yɩ́ sɩ nʋn yɩ́ nin nwan ɔ tɩ man batʋnman nán bɛ bísa yɩ́ nɩn ɔ.
      sbs: 0.6583
      gen_sec: 4.56
      ref_sec: 3.76
      cer: 0.0185
      wer: 0.25
    bible_00080:
      source: bible
      text: Balasua kʋsʋ m'ɔ ngulo man kɛ ɔ cɩcɩ yɩ́ ti sʋ'n, anɩn ɔ tɩ́tɩ. Nan kʋsʋ ɔ tɩ anyunnunguasɩɛ
        man balasua kʋn kɛ ɔ kpá anaan ɔ tɩ́tɩ yɩ́ ti'n. Yɩ́ sɔ ati, ɔ cɩ́cɩ sʋ.
      sbs: 0.7739
      gen_sec: 12.08
      ref_sec: 12.68
      cer: 0.0776
      wer: 0.2222
    bible_00081:
      source: bible
      text: Tɛmʋn mɔ Zozi 'kan ɛjɔlɛ ɛhɩ-mɔ ɔ kekele menian'n-mɔ ninnge'n, anɩn ɔ wɔ Kapɛɛnawɔmʋn, Zufʋ'n-mɔ
        asɔnɩn sua nɩn anun.
      sbs: 0.6751
      gen_sec: 8.64
      ref_sec: 7.82
      cer: 0.0112
      wer: 0.0526
    bible_00082:
      source: bible
      text: “Kpafɛlɛ kaan kʋn wɔ ɛwa, ɔ le *ɔlɩzʋ kpaʋn nnun nʋn ejue nnyuan. Nan kʋsʋ menian nwala ɛhɩ,
        nzukɛ yɛ̂ ɔ 'sa yɩ́ yɔ ɔ?”
      sbs: 0.6667
      gen_sec: 9.36
      ref_sec: 7.34
      cer: 0.0353
      wer: 0.24
    bible_00083:
      source: bible
      text: 'Nan kʋsʋ meninsʋnman nɩn anun, menian dɔʋn lelɩ yɩ́ lili. Bɛ́ nwan: “Cɩan mɔ Kilisi''n kɔ
        a''n, asʋ ɔ ''yɔ asinbɛnwʋn ninnge m''ɔ tala sʋanlan ɛhɩ dɩɛ''n-mɔ ɔ?”'
      sbs: 0.6782
      gen_sec: 9.76
      ref_sec: 9.84
      cer: 0.0442
      wer: 0.2143
    bible_00084:
      source: bible
      text: Asʋ ɛmɔ nnwun man kɛ sɛ sʋanlan kʋn wu menian'n-mɔ kʋalaa ati a, ɔ tɩ kpa tala kɛ mân bɔndɩn'n
        kɔ bɔ ɔ?”
      sbs: 0.7003
      gen_sec: 6.96
      ref_sec: 6.32
      cer: 0.1316
      wer: 0.2609
    bible_00085:
      source: bible
      text: 'Sɔlʋ kɔ fin asɩ. Ɔ ''tie a, anɩɛ bie nwan: “Sɔlʋ, Sɔlʋ, nzukɛ ati yɛ̂ ɛ lɛ kele mɩ́n ahʋlʋwa
        ɔ?”'
      sbs: 0.6854
      gen_sec: 8.32
      ref_sec: 7.62
      cer: 0.0
      wer: 0.0952
    bible_00086:
      source: bible
      text: Like biala mɔ ɛ le yɩ́'n tɩ mɩ́n dɩɛ, mɩ́n kʋsʋ mɩ́n dɩɛ'n kʋalaa tɩ wɔ́ dɩɛ. Bɛ nwun mɩ́n
        anunminnyanmʋn'n wɔ bɛ́ nun.
      sbs: 0.6742
      gen_sec: 8.0
      ref_sec: 6.96
      cer: 0.0361
      wer: 0.125
    bible_00087:
      source: bible
      text: 'Mɔ nzalafʋ''n-mɔ hɔlɩ juli Zozi anwʋn ɛlɔ''n, yɩ́ nwan: “Mɩn nʋn ɛmɔ yɛ ''tanlan mɛlɛ kaan
        biekun kʋalaaka nán m''an hɔ sʋanlan''n m''ɔ sʋanlɩn mɩ́n nɩn anwʋn ɛlɔ.'
      sbs: 0.6778
      gen_sec: 10.56
      ref_sec: 8.62
      cer: 0.094
      wer: 0.3571
    bible_00088:
      source: bible
      text: 'Nyanmɩansʋ bɔfʋɛ benin yɛ̂ cɩan kʋn Nyanmɩan a han a hele yɩ́ kɛ:'
      sbs: 0.722
      gen_sec: 4.56
      ref_sec: 3.5
      cer: 0.04
      wer: 0.3077
    bible_00089:
      source: bible
      text: '“Mɔ Moyizɩ hanlɩn sɔ''n, nunhan''n m''ɔ lɛ bʋ yɩ́ manngʋn''n tua se Moyizɩ kɛ:'
      sbs: 0.7113
      gen_sec: 5.52
      ref_sec: 8.66
      cer: 0.0943
      wer: 0.4286
    bible_00090:
      source: bible
      text: Ɛhɩka ati, ɛmɔ mɔ bɛ tɩ man Zufʋ'n, ɛmɔ tɩ man nyɔfʋɛ anaan menian mgban kʋ́n. Nan sian dɩɛ,
        ɛmɔ tɩ Nyanmɩan anwʋntɩɛ mma kpa bɔkɔɔ, ɛmɔ di yɩ́ afilie'n bie.
      sbs: 0.7701
      gen_sec: 11.12
      ref_sec: 11.02
      cer: 0.0769
      wer: 0.2903
    bible_00091:
      source: bible
      text: Mɩn kulo kɛ ɛmɔ tɩ kɛ yɛ́ nianman Timote mɔ bɛ tʋlɩ yɩ́ fiadɩ'n, b'a yɩ yɩ́. Sɛ ɔ ba tʋ mɩ́n
        ndɛ a, mɩ́n nʋn yɩ́ yɛ 'ba a a nɩan ɛmɔ abʋsʋ.
      sbs: 0.6849
      gen_sec: 10.56
      ref_sec: 8.3
      cer: 0.0323
      wer: 0.0882
    bible_00092:
      source: bible
      text: Sʋanlan m'ɔ lɛ kan anɩɛ ngacile ngacile'n, anɩn ɔ lɛ kan maan yɩ́ ngʋnmɩn yɩ́ dedi'n kɔ yɩ́
        nyunnun. Nan sʋanlan m'ɔ lɛ di Nyanmɩan kpɔman'n, ɔ kan ɛjɔlɛ'n ɔ man bɛ́ kʋalaa mɔ bɛ wɔ asɔnɩn
        nɩn anun'n dedi'n kɔ yɩ́ nyunnun.
      sbs: 0.7717
      gen_sec: 13.92
      ref_sec: 13.12
      cer: 0.0368
      wer: 0.093
    bible_00093:
      source: bible
      text: Ɛhɩ, Zozi kɔ sa kɔ hɔ Galile mân nɩn anun. Wawɛ Nwannzan-nwannzan'n tunmin'n jin yɩ́ nzin.
        Galile mân nɩn anun lɩka biala, bɛ bɔ yɩ́ dunman.
      sbs: 0.7506
      gen_sec: 10.96
      ref_sec: 8.58
      cer: 0.0095
      wer: 0.0385
    bible_00094:
      source: bible
      text: Ahɩn'n mɔ mɩɩn bisa ɛmɔ'n, mɩ́n muonun, mɩ́n Pɔlʋ, n ne mɩ́n sa yɛ̂ m'an hɛlɛ ɔ. Kɛ mɩn sannyɩn
        mɩ́n kalata'n-mɔ kʋalaa nɩn anɩn, kɛ mɩn kpɩn mɩn kɛlɛ yɩ́ nɩn anɩn.
      sbs: 0.773
      gen_sec: 10.72
      ref_sec: 10.14
      cer: 0.0435
      wer: 0.1818
    bible_00095:
      source: bible
      text: 'Mɔ tɛɛyɩfʋɛ kpain''n hanlɩn sɔ''n, Pɩɛlɩ nʋn mmɔfʋɛ''n-mɔ kɔ bua bɛ́ kɛ: “Ɔ sɛ kɛ yɛ bú Nyanmɩan
        yɛ tála kulo menian''n-mɔ.'
      sbs: 0.6811
      gen_sec: 8.48
      ref_sec: 7.42
      cer: 0.046
      wer: 0.0909
    bible_00096:
      source: bible
      text: Ɔ sanlɩn kɛ yɩ́ dunman nun ati, Zufʋ'n-mɔ dɔʋn nzi man bɛ́ sʋ kʋ́n, nan Zozi yɛ̂ bɛ de yɩ́
        bɛ di ɔ.
      sbs: 0.6907
      gen_sec: 7.36
      ref_sec: 5.86
      cer: 0.0149
      wer: 0.0435
    bible_00097:
      source: bible
      text: 'Ɔ kɔ fa kɔ tʋ bɛ́ nyunnun kɛ: “Ɛmɔ a fa sʋanlan ɛhɩ a bɛlɛ mɩ́n kɛ ɔ kele menian''n-mɔ atɩn
        ɛtɛ. Ɛmɔ anyunnun ɛwa, m''an bisa yɩ́ kosuan. Mɩn nnwun man ɛtɛ fɩ́ɩ́ mɔ ɔ''a yɔ, mɔ yɩ́ ti yɛ̂
        ɛmɔ a tʋn yɩ́ ɛsʋan''n.'
      sbs: 0.6478
      gen_sec: 13.92
      ref_sec: 11.94
      cer: 0.0352
      wer: 0.1087
    bible_00098:
      source: bible
      text: 'Yɩ́ ti, yɛ nzulo man yɩ́ nzin. Yɛ kʋala yɩ́ kan kɛ:'
      sbs: 0.7341
      gen_sec: 4.08
      ref_sec: 3.1
      cer: 0.0294
      wer: 0.0833
    bible_00099:
      source: bible
      text: 'Zozi nwan: “Sɛ ɔ tɩ kɛ ɛ sɩ like''n mɔ Nyanmɩan fa ce menian, ɛsɛ sɛ ɛ sɩ sʋanlan''n m''ɔ
        lɛ sɛlɛ wɔ́ nzue nɩn an, ahan wɔ́ lɩlɩ wɔ́ yɛ̂ ɛ ''sɛlɛ yɩ́ maan ɔ man wɔ́ ngʋan nzue fɛ m''ɔ
        nzɩsan man lé ɔ.”'
      sbs: 0.6534
      gen_sec: 12.32
      ref_sec: 14.4
      cer: 0.0746
      wer: 0.1957
    bible_00100:
      source: bible
      text: Ɔ sanlɩn kɛ yɛ́ Nyanmɩan'n kʋsʋ tɩ sɩ̂n m'ɔ jue kun sʋanlan ɔ.
      sbs: 0.6865
      gen_sec: 3.52
      ref_sec: 5.94
      cer: 0.0222
      wer: 0.0769
    bible_00101:
      source: bible
      text: Nan sʋanlan m'ɔ kɔ sɩn anʋan nɩn anun'n, yɩ́ yɛ̂ ɔ tɩ bʋa ɛnɩanfʋɛ kpa nɩn ɔ.
      sbs: 0.6967
      gen_sec: 4.64
      ref_sec: 3.8
      cer: 0.0545
      wer: 0.0588
    bible_00102:
      source: bible
      text: 'Mɔ alɩ́ɛ hɩnlɩn''n, Zozi kɔ tɩ yɩ́ nwʋn kɔ hɔ ahanmɩan lɩka mɔ sʋanlan fɩ́ɩ́ nnʋn man''n.
        Meninsʋnman kɔ kpʋnndɛ yɩ́. Nan mɔ bɛ nwunlin yɩ́''n, bɛ́ nwan: “Yɛ ''sɛlɛ wɔ́, n''ɛ kɔ lɩka fɩ́ɩ́
        kʋ́n.”'
      sbs: 0.6638
      gen_sec: 14.24
      ref_sec: 11.82
      cer: 0.0231
      wer: 0.1389
    bible_00103:
      source: bible
      text: Asannan nán dedi'n tɛmʋn a ju sʋ'n, anɩn yɛ wɔ mala nɩn asa abʋ. Anɩn yɛ lɛ nwʋnndɛ dedi'n
        m'ɔ di kɛ bɛ yɩ bɛ kele'n
      sbs: 0.7638
      gen_sec: 7.36
      ref_sec: 7.94
      cer: 0.0476
      wer: 0.2308
    bible_00104:
      source: bible
      text: Nan sʋanlan kʋsʋ mɔ yɩ́ nyɩn sɔ Nyanmɩan Anʋan Ɛjɔlɛ'n, anɩn ɔ tɩ sʋanlan m'ɔ kulo Nyanmɩan
        sakpa. Ɛbɛlɛ yɛ̂ yɛ nwun yɩ́ kɛ y'a fa yɛ́ nwʋn y'a bɔ Nyanmɩan ɔ.
      sbs: 0.6869
      gen_sec: 12.16
      ref_sec: 9.88
      cer: 0.0948
      wer: 0.2188
    bible_00105:
      source: bible
      text: Sian dɩɛ, ɛbɛlɛ y'ɔ lɛ nwʋnndɛ maan Nyanmɩan fa yɩ́ mgbɔfʋɛ'n-mɔ gua yɩ́ ja abʋ kɛ bia mɔ
        belemgbin sesie yɩ́ ja sʋ ɔ.
      sbs: 0.6916
      gen_sec: 7.52
      ref_sec: 6.86
      cer: 0.023
      wer: 0.2083
    bible_00106:
      source: bible
      text: Kɛ ɛmɔ anan-mɔ lili mannan nɩn ɛwâ nɩn asʋ ɛlɔ'n, anun bɛ halɩ ɛbɛlɛ ɔ? Ɔ yɔlɩ dede bɛ́ kʋalaa
        bɛ yuelɩ wu.
      sbs: 0.73
      gen_sec: 7.44
      ref_sec: 7.34
      cer: 0.0633
      wer: 0.2174
    bible_00107:
      source: bible
      text: 'Ɛlɛhʋn kʋn, anɩn bɛ lɛ cɩ ɛhɔɛ bɛ yɔ asɔnɩn. Ɛhɩ a, Wawɛ Nwannzan-nwannzan''n kɔ han kɔ hele
        bɛ́ kɛ: “Ɛmɔ síe Baanabasɩ nʋn Sɔlʋ ahanmɩan maan bɛ lí junman''n mɔ yɩ́ ti yɛ̂ m''an fɛlɛ bɛ́''n.”'
      sbs: 0.685
      gen_sec: 12.8
      ref_sec: 13.04
      cer: 0.0221
      wer: 0.1351
    bible_00108:
      source: bible
      text: Anianman-mɔ, ɛmɔ síe bɛ́ nwʋn ye, bɛ tíla bɛ́ dedi nɩn anun sɛlɛ kpa. Ɛmɔ tíla bɛ́ ahʋnlɩn,
        nán bɛ man bɛ́ nwʋn bubu bɛ́.
      sbs: 0.7669
      gen_sec: 7.92
      ref_sec: 7.84
      cer: 0.0349
      wer: 0.12
    bible_00109:
      source: bible
      text: “Zozi anwʋn ɛjɔlɛ yɛ̂ anɩn Davidi lɛ kan ɔ. Yɛ́ mɔ yɛ gua ɛwa'n, yɛ́ kʋalaa yɛ di adanzɩɛ
        kɛ Nyanmɩan a man Zozi fi ewue nun a tinnge.
      sbs: 0.7389
      gen_sec: 9.04
      ref_sec: 8.04
      cer: 0.0306
      wer: 0.1034
    bible_00110:
      source: bible
      text: Mmelenzua nʋn mmalasua dɔʋn kpa kɔ le yɛ́ Mɩn bɛ kɔ li, bɛ kɔ bʋka daba dɩɛ'n-mɔ asʋ.
      sbs: 0.6957
      gen_sec: 6.0
      ref_sec: 6.36
      cer: 0.0317
      wer: 0.1111
    bible_00111:
      source: bible
      text: Mɔ Zozi bisalɩ bɛ́ kosuan sɔ'n, bɛ kɔ jejinlan, bɛ́ nyunnun kunngoun.
      sbs: 0.6749
      gen_sec: 5.04
      ref_sec: 4.38
      cer: 0.0769
      wer: 0.4167
    bible_00112:
      source: bible
      text: Afɩ mɔ yɛ hɔlɩ juli Masedʋanɩn mân nun ɛlɔ'n, y'a nnyan man alaje sin kaan sʋa. Yɛ 'kaci ɛwa,
        ɛfɛ, yɛ 'sɩn ɛwa, ɛfɛ. Mmie-mɔ nʋn yɛ la mannzʋan sʋ, yɛ́ kunnun tɩtɩ yɛ́.
      sbs: 0.7753
      gen_sec: 13.2
      ref_sec: 12.94
      cer: 0.0833
      wer: 0.2941
    bible_00113:
      source: bible
      text: Bɛ kɔ yɔ yɩ́ sɔ sakpa. Bɛ kɔ yɩ Baanabasɩ nʋn Sɔlʋ kɛ bɛ fá acɛdɩɛ sɔ'n-mɔ, bɛ hɔ́ fá mán
        Zude mân nɩn anun ɛlɔ asɔnɩn nɩn asʋ mgbain'n-mɔ.
      sbs: 0.7072
      gen_sec: 10.24
      ref_sec: 11.62
      cer: 0.0198
      wer: 0.0667
    bible_00114:
      source: bible
      text: 'Zʋan nwan: “Nán bɛ di bɛ́ tunmin nɩn anzin bɛ laka menian''n-mɔ bɛ de bɛ́ esika, nan ɛmɔ
        lí bɛ́ ahatua nɩn anwʋn fɛ bɛ fá yɩ́ sɔ.”'
      sbs: 0.6951
      gen_sec: 9.84
      ref_sec: 9.36
      cer: 0.1429
      wer: 0.4286
    bible_00115:
      source: bible
      text: Nyanmɩan hanlɩn ndâ yɛ́ nan Abalahamʋn anyunnun kɛ
      sbs: 0.7213
      gen_sec: 2.96
      ref_sec: 3.14
      cer: 0.0238
      wer: 0.125
    bible_00116:
      source: bible
      text: Mân ɛhɩ anun menian mɔ bɛ le tunmin'n fɩ́ɩ́ a nnwun man ngɛlɛ sɔ'n. Sɛ ɔ tɩ kɛ bɛ nwunlin
        yɩ́ a, ahan b'a mmʋbɔ man yɛ́ Mɩn m'ɔ le anunminnyanmʋn'n kʋlʋwa nɩn asʋ.
      sbs: 0.7696
      gen_sec: 11.28
      ref_sec: 11.64
      cer: 0.0508
      wer: 0.3235
    bible_00117:
      source: bible
      text: Ɛbɛlɛ nɩn anun, ɔ nanndɩ Nyanmɩan Kpili ɔ nʋn yɛ́ Mɩn Zozi Kilisi anwunnvoe nɩn asʋ, ɛmɔ 'ba
        wula yɛ́ Mɩn Zozi anunminnyanmʋn, yɩ́ kʋsʋ, ɔ 'ba wula ɛmɔ bie.
      sbs: 0.7793
      gen_sec: 10.96
      ref_sec: 11.68
      cer: 0.0
      wer: 0.0
    bible_00118:
      source: bible
      text: 'B''a hɛlɛ wɔ Ɛhɛlɛ Ɛjɔlɛ nɩn anun kɛ:'
      sbs: 0.7756
      gen_sec: 3.04
      ref_sec: 10.9
      cer: 0.0
      wer: 0.0
    bible_00119:
      source: bible
      text: Sʋanlan sɔ'n, ɔ yɔ́ bɛ́ mɔ bɛ si yɛ́ sʋ nɩn anun kʋn, sunmin tɛmʋn mɔ Zʋan sɔnɩnlɩn yɛ́ Mɩn
        Zozi, m'ɔ sɩsɩnlɩn kulo kulo'n-mɔ asʋ, dede ɔ juli cɩan m'ɔ fʋlɩ hɔlɩ nyanmɩansʋ'n.”
      sbs: 0.7152
      gen_sec: 11.52
      ref_sec: 11.06
      cer: 0.0551
      wer: 0.1471
    bible_00120:
      source: bible
      text: Sɛ ɛtɛfʋɛ ɛhɩ m'ɔ di ɛjɔlɛ'n kʋala kɛ ɔ di sʋanlan ɛjɔlɛ maan yɩ́ kunnun jɔ a, asʋ Nyanmɩan
        lɩlɩ yɛ̂ yɩ́ mma'n-mɔ sun fɛlɛ yɩ́ kɔngɔɛ nʋn eyue a, ɔ nni man bɛ́ ɛjɔlɛ mman man bɛ́ ɔ? Asʋ
        ɔ 'cɛ nán ɔ'a bʋka bɛ́ ɔ?
      sbs: 0.6989
      gen_sec: 14.56
      ref_sec: 14.4
      cer: 0.0338
      wer: 0.2128
    bible_00121:
      source: bible
      text: M'ɔ hanlɩn sɔ yuelɩ'n, ɔ nʋn Kɔɔnɛyɩ bɛ le ɛjʋjɔlɛ dede bɛ kɔ wʋlʋ awulo. Ɔ 'ju ɛbɛlɛ a, menian
        dɔʋn kpa a yia.
      sbs: 0.7199
      gen_sec: 7.76
      ref_sec: 8.08
      cer: 0.0247
      wer: 0.1667
    bible_00122:
      source: bible
      text: 'Mmie-mɔ kʋsʋ nwan: “Yɩ́ m''ɔ tikelɩ anyɩnsinlinwafʋɛ nɩn anyɩn''n, ahan ɔ yɔlɩ maan Lazaa
        a wu man”'
      sbs: 0.6874
      gen_sec: 6.96
      ref_sec: 6.66
      cer: 0.0822
      wer: 0.1765
    bible_00123:
      source: bible
      text: Afɩ b'a wʋ ɛmɔ fʋfɔlɛ. Awɔlɛ sɔ'n fi man kulo sʋanlan, nan ɔ fi ɛmɔ Asɩ Nyanmɩan Kpili. Ɔ
        nanndɩ yɩ́ Nʋan Ɛjɔlɛ'n m'ɔ wɔ ɛbɛlɛ dahuu nɩn asʋ y'ɔ man ɛmɔ a nyan ngʋan fʋfɔlɛ ɔ.
      sbs: 0.7039
      gen_sec: 12.8
      ref_sec: 11.14
      cer: 0.0233
      wer: 0.1351
    bible_00124:
      source: bible
      text: Ɛkpɔ'n m'ɔ la fatule nnyuan nɩn afian'n, Kilisi a wu kʋlʋwa nɩn asʋ ɔ'a nunnun yɩ́ bʋsʋ. Ewue'n
        m'ɔ wuli kʋlʋwa nɩn asʋ nɩn ati, ɔ'a han fatule nnyuan'n, ɔ'a bɔ nun, ɛsɛ ɔ'a sesie bɛ́ nʋn Nyanmɩan
        bɛ́ afian.
      sbs: 0.7404
      gen_sec: 14.88
      ref_sec: 14.32
      cer: 0.0067
      wer: 0.175
    bible_00125:
      source: bible
      text: Asʋ yɛ́ mgbain'n-mɔ nunhan kʋn anaan Falisifʋɛ'n-mɔ nunhan kʋn lelɩ yɩ́ ɔ lili man ɔ?
      sbs: 0.7006
      gen_sec: 5.76
      ref_sec: 5.94
      cer: 0.0938
      wer: 0.2
    bible_00126:
      source: bible
      text: Melea dɩɛ y'ɔ le Mena. Mena dɩɛ y'ɔ le Matata. Matata dɩɛ y'ɔ le Natan. Natan dɩɛ y'ɔ le Davidi.
      sbs: 0.7058
      gen_sec: 9.2
      ref_sec: 7.6
      cer: 0.0725
      wer: 0.15
    bible_00127:
      source: bible
      text: Mɔ yɛ juli Puzɔlʋ ɛbɛlɛ'n, yɛ kɔ nwun anianman mmie-mɔ. Bɛ́ nwan yɛ lí mɔlɛ kʋn bɛ́ nwʋn ɛbɛlɛ.
        Anɩn kɛ yɛ kpɩnlɩn yɛ yɔlɩ mɔ yɛ juli Lɔmʋn ɛlɔ nɩn anɩn.
      sbs: 0.7099
      gen_sec: 9.36
      ref_sec: 8.64
      cer: 0.0263
      wer: 0.0938
    bible_00128:
      source: bible
      text: 'Ɛhɩ a, belemgbin Agilipa kɔ han kɔ hele Fɛsɩtusi kɛ: “Sɛ nán kɛ sʋanlan sɔ''n nwan bɛ nʋn
        yɩ́ hɔ́ Sezaa aja sʋ a, ahan ɔ di kɛ bɛ yaci yɩ́ nun.”'
      sbs: 0.6921
      gen_sec: 9.92
      ref_sec: 13.04
      cer: 0.0392
      wer: 0.0938
    bible_00129:
      source: bible
      text: 'Mɔ Zufʋ''n-mɔ tɩlɩ ɛjɔlɛ sɔ''n, bɛ́ nwan: “Wɔ́ ejian mɔ ɛ jin ɛbɛlɛ''n, nzu sʋanlan dɩɛ y''ɔ
        le wɔ́?”'
      sbs: 0.7037
      gen_sec: 8.08
      ref_sec: 5.56
      cer: 0.1538
      wer: 0.5263
    bible_00130:
      source: bible
      text: 'M''ɔ lili kɔ yɔ ɛlɛnyuan kʋn''n, Pɔlʋ kɔ han kɔ hele Baanabasɩ kɛ: “Kulo''n-mɔ kʋalaatin
        mɔ yɛ sɩnlɩn sʋ yɛ hanlɩn yɛ́ Mɩn Anʋan Ɛjɔlɛ''n, yɛ hɔ́ sʋ yɛ fófua anianman''n-mɔ anwʋn.”'
      sbs: 0.6656
      gen_sec: 12.32
      ref_sec: 11.18
      cer: 0.0543
      wer: 0.125
    bible_00131:
      source: bible
      text: Tu bɛ́ fʋɔ kɛ bɛ yɔ́ nyɔlɩɛ kpa, bɛ mán ye ɛyɔlɛ'n tɩ́ bɛ́ kpa, bɛ yɔ́ ahunnunye, ɛsɛ bɛ bʋ́ka
        ɛhɩnlɩn-mɔ.
      sbs: 0.7721
      gen_sec: 7.44
      ref_sec: 6.84
      cer: 0.0137
      wer: 0.0455
    bible_00132:
      source: bible
      text: Ɔ sanlɩn kɛ, ninnge ngacile ngacile'n mɔ ɔ lɛ kan yɩ́ nwʋn ɛjɔlɛ ɛ kele yɛ́'n, yɛ kulo kɛ
        ɛ tu yɩ́ bʋ.”
      sbs: 0.6957
      gen_sec: 7.2
      ref_sec: 6.24
      cer: 0.0417
      wer: 0.1739
    bible_00133:
      source: bible
      text: Ɛmɔ nɩ́an kɛ daba anɩn Izalayɛ amma'n-mɔ yɔ yɩ́'n. Bɛ́ mɔ bɛ kɔ li naan'n mɔ bɛ kɔ fa bɛ kɔ
        yɩ tɛɛ Nyanmɩan mʋcɩa nɩn asʋ bɛ kɔ man yɩ́'n, anɩn bɛ nʋn yɩ́ a yɔ kʋn.
      sbs: 0.7716
      gen_sec: 10.08
      ref_sec: 10.38
      cer: 0.0175
      wer: 0.0526
    bible_00134:
      source: bible
      text: Menian'n-mɔ ninnge'n-mɔ mɔ bɛ kɔ nwun yɩ́'n, sɛ bɛ kan yɩ́ nwʋn ɛjɔlɛ bɛ kele yɛ́ a, yɛ de
        yɛ di. Nyanmɩan dɩɛ'n m'ɔ kan'n tala bɛ́ dɩɛ'n. Afɩ, Nyanmɩan muonun di adanzɩɛ kɛ Zozi tɩ yɩ́
        Wa.
      sbs: 0.7004
      gen_sec: 12.56
      ref_sec: 12.7
      cer: 0.0455
      wer: 0.1842
    bible_00135:
      source: bible
      text: Sɛ yɛ́ nyɩn sɔ Nyanmɩan, yɛ yɔ like m'ɔ kɔ hele yɛ́ kɛ yɛ yɔ́ nɩn an, anɩn yɛ sɩ Nyanmɩan
        sakpa.
      sbs: 0.6877
      gen_sec: 6.32
      ref_sec: 5.84
      cer: 0.0
      wer: 0.0
    bible_00136:
      source: bible
      text: M'ɔ fi ewue nun tinngelɩ'n, yɩ́ menian'n-mɔ kacɩlɩ ɛjɔlɛ sɔ'n m'ɔ hanlɩn'n. Ɔ man bɛ lelɩ
        *Ɛhɛlɛ Ɛjɔlɛ'n nʋn mɔ Zozi hanlɩn'n bɛ lili.
      sbs: 0.6839
      gen_sec: 8.88
      ref_sec: 8.08
      cer: 0.1237
      wer: 0.5
    bible_00137:
      source: bible
      text: “Mɩɩn kacɩ ɛmɔ kɛ bɛ lɛ 'ba hele ɛmɔ ahʋlʋwa, yɩ́ dɩɛ sɛ mɛlɛ'n ju sʋ a, anɩn ɛmɔ mminlin
        man bɛ́ dedi'n.
      sbs: 0.6533
      gen_sec: 8.88
      ref_sec: 5.9
      cer: 0.1081
      wer: 0.5217
    bible_00138:
      source: bible
      text: '“Nan mɔ bɛ yɔlɩ sɔ''n, Nyanmɩan kɔ kaci yɩ́ nzin kɔ si bɛ́. Ɔ kɔ yaci bɛ́ maan bɛ kɔ sɔ anwunno
        ɛlɔ ninnge''n-mɔ, kɛ b''a kpɩn b''a hɛlɛ wɔ Nyanmɩan mgbɔmanfʋɛ''n-mɔ kalata nɩn anun''n kɛ:'
      sbs: 0.6903
      gen_sec: 11.92
      ref_sec: 11.36
      cer: 0.084
      wer: 0.25
    bible_00139:
      source: bible
      text: 'Mɔ Pilatɩ tɩlɩ ɛjɔlɛ sɔ''n, yɩ́ nwan: “Apii, ananhɔlɛ''n y''ɔ le nzu?”'
      sbs: 0.7092
      gen_sec: 5.12
      ref_sec: 4.68
      cer: 0.087
      wer: 0.0833
    bible_00140:
      source: bible
      text: Sɛ ɛ kekele anianman'n-mɔ ninnge ɛhɩ-mɔ a, ɛ 'ba kaci Zozi Kilisi akʋa kpa. Dedi nɩn anwʋn
        ngehele kpa'n mɔ ɛ nanndɩ sʋ'n y'ɔ tɩ wɔ́ ɛkala nɩn alɩɛ ɔ.
      sbs: 0.7617
      gen_sec: 9.92
      ref_sec: 10.04
      cer: 0.0364
      wer: 0.1333
    bible_00141:
      source: bible
      text: Yɛ̂ sɛ ɛmɔ nwun kɛ anwʋnman fi ngʋa ɔ fita kɔ sɔlɔ a, anɩn ɛmɔ nwan wawa'n lɛ ba kpɩn. Sakpa
        kʋsʋ, ɔ kpɩn.
      sbs: 0.7067
      gen_sec: 8.4
      ref_sec: 7.96
      cer: 0.0649
      wer: 0.2083
    bible_00142:
      source: bible
      text: Ɛsɛ, ɔ nanndɩ ɛmɔ dedi nɩn asʋ, ɔ mán Kilisi tánlan ɛmɔ ahʋnlɩn nɩn anun. Mɩn sɛlɛ yɩ́ kɛ
        ɔ mán ɛmɔ sɔ́ ndɩan bɛ tánlan Kilisi ehulo nɩn anun sɛlɛ kpa.
      sbs: 0.77
      gen_sec: 10.24
      ref_sec: 9.34
      cer: 0.0263
      wer: 0.0312
    bible_00143:
      source: bible
      text: Ɔ 'ba, ɔ 'kun kpafʋ sɔ'n-mɔ ɔ fa yɩ́ ebo'n ɔ wula menian nvʋfɔlɛ asa nun.”
      sbs: 0.7008
      gen_sec: 5.36
      ref_sec: 4.38
      cer: 0.04
      wer: 0.125
    bible_00144:
      source: bible
      text: Menian'n mmie-mɔ fi abalabɔ atɩn kpa nɩn asʋ b'a jasʋ b'a fa bɛ́ nwʋn b'a wula ɛjɔlɛ mgban-mgban'n-mɔ
        anun.
      sbs: 0.7615
      gen_sec: 6.72
      ref_sec: 6.76
      cer: 0.0253
      wer: 0.1053
    bible_00145:
      source: bible
      text: Mɩn nʋn ɛmɔ yɛ lɛ njʋjɔ man dɔʋn kʋ́n. Ɔ sanlɩn kɛ mân ɛhɩ asʋ kpain'n lɛ ba. Ɔ le man tunmin
        fɩ́ɩ́ wɔ mɩ́n sʋ.
      sbs: 0.6979
      gen_sec: 7.28
      ref_sec: 6.24
      cer: 0.0385
      wer: 0.1538
    bible_00146:
      source: bible
      text: Bɛ́ mɔ bɛ bɔlɩ asanndɩɛ'n, lɩka mɔ bɛ kɔ sɩn'n, bɛ bɔ Ɛjɔlɛkpa bɛ kele menian'n-mɔ.
      sbs: 0.7138
      gen_sec: 5.52
      ref_sec: 5.2
      cer: 0.0333
      wer: 0.1875
    bible_00147:
      source: bible
      text: Cɩan'n mɔ yɛ́ Mɩn Zozi 'yɩ yɩ nwʋn kele'n, Nyanmɩan yɛ̂ ɔ 'kele ɔ. Nyanmɩan sɔ'n, yɩ́ ngʋnmɩn
        cein y'ɔ tɩ Belemgbin ɔ, ɔ tɩ salɩɛ baka, ɔ tɩ mmelemgbin'n-mɔ Belemgbin, ɔ tɩ mɩnlɩan'n-mɔ Amɩn.
      sbs: 0.7935
      gen_sec: 12.0
      ref_sec: 13.18
      cer: 0.146
      wer: 0.3143
    bible_00148:
      source: bible
      text: Nyanmɩan Kpili bɔlɩ Sodɔmʋn nʋn Gomɔɔ kulo'n-mɔ abʋsʋ. Ɔ tʋlɩ bɛ́ nun sɩ̂n dede bɛ tɔlɩ nzʋan.
        Ɔ'a yɔ bɛ́ sɔ maan bɛ nwun yɩ́ kɛ menian mɔ bɛ́ nyɩn nzɔ man yɩ́'n, kɛ bɛ́ ayuelɩɛ'n yue yɩ́ nɩn
        anɩn.
      sbs: 0.7052
      gen_sec: 14.24
      ref_sec: 12.4
      cer: 0.0496
      wer: 0.225
    bible_00149:
      source: bible
      text: Ɛhɩ, ɛjɔlɛ'n muonun mɔ Pɔlʋ nʋn Baanabasɩ lɛ kan maan bɛ yacɩ tɛɛ ɛyɩɛ'n, nán yɩ́ nwʋn bie
        yɛ̂ anɩn bɛ lɛ di ɔ.
      sbs: 0.6739
      gen_sec: 8.64
      ref_sec: 7.44
      cer: 0.0617
      wer: 0.1667
    bible_00150:
      source: bible
      text: 'Zozi nwan: “Like''n mɔ mɩɩn yɔ''n, ɛ nyan tɩlɩ man yɩ́ bʋ, nan cɩan bie dede ɛ ''ba tɩ yɩ́
        bʋ.”'
      sbs: 0.698
      gen_sec: 8.64
      ref_sec: 5.54
      cer: 0.0492
      wer: 0.1429
    bible_00151:
      source: bible
      text: Bɛ́ mɔ bɛ le mân ɛhɩ anun ninnge'n, bɛ yɔ́ kɛ bɛ le man like fɩ́ɩ́. Ɔ sanlɩn kɛ mân ɛhɩ mɔ
        yɛ wɔ nun'n, ɔ 'sɩn.
      sbs: 0.7742
      gen_sec: 9.04
      ref_sec: 7.48
      cer: 0.0
      wer: 0.0741
    bible_00152:
      source: bible
      text: Sian dɩɛ, ɔ di kɛ ɛmɔ bɔ bala mɔ Nyanmɩan kulo wɔ ɛmɔ asɩtanlan nɩn anun mɛlɛ mɔ ɛmɔ tɛ wɔ
        asɩɛ nɩn asʋ ɛwa'n. Nan ɔ nni man kɛ ɛmɔ bɔ bala ɛtɛ mɔ anwʋnnaan kulo'n kʋ́n.
      sbs: 0.7394
      gen_sec: 15.36
      ref_sec: 13.1
      cer: 0.0238
      wer: 0.0789
    bible_00153:
      source: bible
      text: 'Ɛhɩ, kɔngɔɛ kʋn, yɛ́ Mɩn kɔ hɩn Pɔlʋ ɛlalɩɛ ɔ kɔ han kɔ hele yɩ́ kɛ: “Pɔlʋ, n''ɛ sulo, nan
        wɔ́ lɩlɩ kan ɛjɔlɛ''n kɔ wɔ́ nyunnun, n''ɛ muan wɔ́ nʋan.'
      sbs: 0.7217
      gen_sec: 12.0
      ref_sec: 10.38
      cer: 0.0505
      wer: 0.129
    bible_00154:
      source: bible
      text: Kɛmɔ afʋɛ daa bɛ kɔ'n, mɔ Zozi lili afʋɛ bulu nʋn nnyuan'n, bɛ nʋn yɩ́ kɔ hɔ fɛtɩ sɔ nɩn elie.
      sbs: 0.7224
      gen_sec: 6.48
      ref_sec: 7.3
      cer: 0.0147
      wer: 0.0476
    bible_00155:
      source: bible
      text: Bɛ́ kʋalaa bɛ le esuan bɛ kɔ tɔ Pɔlʋ nun bɛ kɔ li ngalɩɛ.
      sbs: 0.7129
      gen_sec: 3.92
      ref_sec: 3.96
      cer: 0.0
      wer: 0.0
    bible_00156:
      source: bible
      text: 'Ɛhɩ, Zozi kɔ han kɔ hele yɩ́ menian''n-mɔ kɛ: “Ɔ mgba man yɩ́ nwʋn, ngaa wɔ ɛbɛlɛ mɔ ɔ ''man
        menian''n-mɔ tɔ ɛtɛ nɩn anun ɔ. Nan munnzue hán sʋanlan m''ɔ kɔ man yɩ́ manngʋn kɔ tɔ ɛtɛ nɩn
        anun''n.'
      sbs: 0.7047
      gen_sec: 11.84
      ref_sec: 13.04
      cer: 0.0296
      wer: 0.125
    bible_00157:
      source: bible
      text: Ɛhyɩhyɛ sɔ'n mɔ Nyanmɩan 'ba gua yɩ́ bʋ mân nɩn ayuelɩɛ nun'n y'ɔ le kɛ ɔ 'ba han anwunno
        ɛlɔ nʋn asɩɛ nɩn asʋ ɛwa ninnge'n kʋalaatin bɔ nun ɔ fa bɛ́ wula Kilisi m'ɔ tɩ kpain nɩn asa nun.
      sbs: 0.7465
      gen_sec: 12.64
      ref_sec: 14.28
      cer: 0.0652
      wer: 0.2
    bible_00158:
      source: bible
      text: 'Ɛsɛ Zozi nwan: “Ɔ ngɔ hyɛ man, ɛmɔ lɛ mma nnwun man mɩ́n kʋ́n, ɔ cɛ kaan an, ɛmɔ ''ba nwun
        mɩ́n biekun.”'
      sbs: 0.6796
      gen_sec: 8.08
      ref_sec: 6.0
      cer: 0.0857
      wer: 0.1739
    bible_00159:
      source: bible
      text: “Mɛlɛ sɔ nɩn anun yɛ̂ bɛ wʋlɩ *Moyizɩ ɔ. Moyizɩ tɩ baa belenzua kanlanman kpa. Nyanmɩan kulo
        yɩ́ ɛjɔlɛ. Yɩ́ sɩ-mɔ falɩ yɩ́ fɩalɩ bɛ tɩtɩlɩ yɩ́ dede sala nsan.
      sbs: 0.7209
      gen_sec: 12.0
      ref_sec: 9.86
      cer: 0.0427
      wer: 0.2333
    bible_00160:
      source: bible
      text: 'Zozi tɩ ɛbɛlɛ kaan, ɔ ''nɩan an, Samali balasua kʋn fi Sisaa kɔ a, ɔ lɛ ba a sa yɩ́ nzue.
        Zozi nwan: “Mɩ́n nianman bala, sa nzue kaan maan n nʋ́n.”'
      sbs: 0.6812
      gen_sec: 11.2
      ref_sec: 9.06
      cer: 0.0588
      wer: 0.2188
    bible_00161:
      source: bible
      text: Nan ɛmɔ dɩɛ, ɔ tɩ man sɔ mman man ɛmɔ. Ɛmɔ afian, sʋanlan m'ɔ tɩ kpili'n, ɔ di kɛ ɔ bu yɩ́
        nwʋn kɛ bɛ́ nunhan kaan. M'ɔ li bɛ́ ti'n kʋsʋ, ɔ di kɛ ɔ bu yɩ́ nwʋn kɛ sʋanlan m'ɔ sʋ ɛhɩnlɩn-mɔ.
      sbs: 0.6713
      gen_sec: 15.2
      ref_sec: 11.86
      cer: 0.0388
      wer: 0.1364
    bible_00162:
      source: bible
      text: Elasɩtɩ a ha Kolɩntɩ ɛlɔ yɛ̂ m'an yaci Tolofimʋn Minle ɛlɔ, ɔ sanlɩn kɛ anɩn ɔ ndɩ man akpɔlɛ.
      sbs: 0.7497
      gen_sec: 7.28
      ref_sec: 7.84
      cer: 0.0417
      wer: 0.2105
    bible_00163:
      source: bible
      text: 'Zozi nwan: “Wɔ́ nʋan wɔ sʋ ɛ lɛ kan, belemgbin y''ɔ le mɩ́n. Bɛ wʋlɩ mɩ́n, m malɩ mân nɩn
        anun kɛ mɩn ''ba han ananhɔlɛ nɩn anwʋn ɛjɔlɛ. Ɔ man sʋanlan biala m''ɔ tɩ ananhɔlɛ''n sʋanlan''n,
        ɔ tie ɛjɔlɛ''n mɔ mɩn kan''n.”'
      sbs: 0.7036
      gen_sec: 14.64
      ref_sec: 13.06
      cer: 0.0199
      wer: 0.1163
    bible_00164:
      source: bible
      text: 'Nan m''ɔ walɩ dede m''ɔ ka kaan tʋ bɛ́''n, yɩ́ nwan: “Mɩ́n ɔ, nán bɛ sulo.”'
      sbs: 0.6852
      gen_sec: 7.04
      ref_sec: 4.88
      cer: 0.1111
      wer: 0.1875
    bible_00165:
      source: bible
      text: 'M''ɔ hanlɩn sɔ''n, Pɩɛlɩ kɔ han kɔ hele yɩ́ kɛ: “Munnzue hán wɔ́ nʋn wɔ́ esika''n. Afɩ ɛ
        jʋnlɩn kɛ ɛ kʋala esika fa to Nyanmɩan acɛdɩɛ''n!'
      sbs: 0.6907
      gen_sec: 8.56
      ref_sec: 8.46
      cer: 0.0729
      wer: 0.2222
    bible_00166:
      source: bible
      text: M'ɔ hanlɩn sɔ yuelɩ'n, ɔ kɔ fa yɩ́ sa'n-mɔ anun nʋn yɩ́ nvɩn nɩn anun kafʋan'n kɔ hele bɛ́.
        Mɔ menian'n-mɔ nwunlin yɛ́ Mɩn'n, bɛ lili fɛ kpili kpa.
      sbs: 0.6897
      gen_sec: 10.4
      ref_sec: 7.92
      cer: 0.068
      wer: 0.1724
    bible_00167:
      source: bible
      text: '“Ɛsɛ anɩɛ''n fi anwunno ɔ kɔ te biekun. Yɩ́ nwan: ‘Like mɔ Nyanmɩan nwan ɔ tɩ kpa''n, n''ɛ
        bu yɩ́ kɛ ɔ tɩ man kpa.’'
      sbs: 0.7351
      gen_sec: 7.76
      ref_sec: 7.22
      cer: 0.0526
      wer: 0.12
    bible_00168:
      source: bible
      text: Ɛhɩka ati, ɛnwanndie'n mɔ mɩɩn nwanndi'n, mɩ́n nyɩn wɔ lɩka kʋn. N dɩ kɛ sʋanlan m'ɔ lɛ kʋn
        ngondin ɔ. Mɩn ndʋ man mɩ́n kɔtɔlɛ dɩɛ nɩn anwʋnman nun.
      sbs: 0.7742
      gen_sec: 9.36
      ref_sec: 8.58
      cer: 0.0636
      wer: 0.3448
    bible_00169:
      source: bible
      text: Kɛmɔ bɛ tɩ mân ɛhɩ anun menian'n, nunhan ɛjɔlɛ ala yɛ̂ bɛ kan ɔ. Mɔ bɛ kɔ han'n kʋsʋ yɛ̂ menian'n-mɔ
        tie ɔ.
      sbs: 0.6863
      gen_sec: 7.6
      ref_sec: 7.1
      cer: 0.0263
      wer: 0.1304
    bible_00170:
      source: bible
      text: Ɔ 'ba yɔ sɔ'n, anɩn bian kʋn wɔ kulo sɔ nɩn asʋ ɛbɛlɛ. Bɛ fɛlɛ bian sɔ'n Simʋn. Ɔ yɩ jiliwa
        ɔ man ɔ sin Samali menian'n-mɔ anwʋn. Ɔ bu yɩ́ nwʋn kɛ ɔ tɩ sʋanlan kpili.
      sbs: 0.7113
      gen_sec: 12.88
      ref_sec: 10.8
      cer: 0.0924
      wer: 0.1351
    bible_00171:
      source: bible
      text: '“Yɩ́ nwan: ‘Mɩn tua wɔ́ mɩn *olivʋ ngo balugo abulaa.’'
      sbs: 0.69
      gen_sec: 4.16
      ref_sec: 3.14
      cer: 0.1622
      wer: 0.4
    bible_00172:
      source: bible
      text: Ɛhɔɛ kʋn kɔ kpɩn Ezipiti nʋn Kanaân mân'n kʋalaatin anun. Yɛ́ nan-mɔ nwunlin yalɛ kpa, afɩ
        anɩn bɛ nnyan man like fɩ́ɩ́ bɛ nni man.
      sbs: 0.6936
      gen_sec: 9.28
      ref_sec: 9.02
      cer: 0.2222
      wer: 0.76
    bible_00173:
      source: bible
      text: Afɩ kɩkaala dɩɛ, Mɩ́n Sɩ, anunminnyanmʋn'n mɔ anɩn n ne yɩ́ wɔ́ nwʋn ɛlɔ asannan nán a sesie
        mân'n, maan n nyán yɩ́ kʋnmgba sɔ'n wɔ wɔ́ nyunnun.
      sbs: 0.6869
      gen_sec: 10.08
      ref_sec: 10.02
      cer: 0.0762
      wer: 0.2143
    bible_00174:
      source: bible
      text: Ɛhɩka ati, kɛmɔ Nyanmɩan a nwun yɛ́ nwʋn anwunnvoe, ɔ'a fa junman sɔ'n ɔ'a wula yɛ́ sa nun,
        yɛ le nun anwʋnsɛlɛ.
      sbs: 0.79
      gen_sec: 8.8
      ref_sec: 6.36
      cer: 0.0488
      wer: 0.2273
    bible_00175:
      source: bible
      text: 'Zozi nwan: “Ɛmɔ búbu sua nwannzan-nwannzan ɛhɩ, nan mɩn ''fa cɩan nsan mɩn si.”'
      sbs: 0.6861
      gen_sec: 5.84
      ref_sec: 4.64
      cer: 0.0345
      wer: 0.1429
    bible_00176:
      source: bible
      text: Ɛbɛlɛ ala, Elimasɩ anyɩn'n kɔ sin ɔ kɔ ha awosin nun. Anɩn ɔ lɛ tʋtʋ yɩ́ sa ɔ kpʋnndɛ sʋanlan
        ɔ sɔ yɩ́ sa maan ɔ di yɩ́ taataa.
      sbs: 0.6896
      gen_sec: 8.24
      ref_sec: 9.5
      cer: 0.0543
      wer: 0.2759
    bible_00177:
      source: bible
      text: Ɛhɩ, Zozi fi Nyanmɩan awulo nɩn anun, ɔ kɔ fite kɔ hɔ *Olivʋ bʋka nɩn asʋ.
      sbs: 0.735
      gen_sec: 6.48
      ref_sec: 4.8
      cer: 0.0
      wer: 0.0
    bible_00178:
      source: bible
      text: Dedi nɩn ati, mɛlɛ mɔ bɛ wʋlɩ Moyizɩ'n, yɩ́ sɩ nʋn yɩ́ nin falɩ yɩ́ fɩalɩ dede sala nsan.
        Ɔ sanlɩn kɛ Moyizɩ tɩ baa kanlanman. Yɩ́ ti, yɩ́ sɩ nʋn yɩ́ nin a nzulo man b'a nni man belemgbin'n
        mala nɩn asʋ.
      sbs: 0.7185
      gen_sec: 15.36
      ref_sec: 12.72
      cer: 0.0753
      wer: 0.2791
    bible_00179:
      source: bible
      text: Ɛmɔ mɔ bɛ kulo kɛ bɛ di mala nɩn asʋ'n, ɛjɔlɛ'n m'ɔ wɔ mala nɩn anun'n, asʋ ɛmɔ tɩlɩ man ɔ?
      sbs: 0.7572
      gen_sec: 7.2
      ref_sec: 6.02
      cer: 0.0625
      wer: 0.2381
    bible_00180:
      source: bible
      text: Ɔ sanlɩn kɛ Nyanmɩan Awa Zozi Kilisi mɔ mɩn nʋn Silasɩ nʋn Timote yɛ walɩ hanlɩn yɩ́ nwʋn
        ɛjɔlɛ'n yɛ helelɩ ɛmɔ'n, ɔ tɩ man sʋanlan m'ɔ kan ɛjɔlɛ a, anɩn ɛsɛ ɔ'a kaci yɩ́ nʋan ɔ.
      sbs: 0.7574
      gen_sec: 11.6
      ref_sec: 13.3
      cer: 0.0226
      wer: 0.1081
    bible_00181:
      source: bible
      text: Ɔ 'man ɔ kele yɛ́ atɩn'n m'ɔ man bɛ nyan alʋacɩcɩɛ'n.”
      sbs: 0.7255
      gen_sec: 3.36
      ref_sec: 3.8
      cer: 0.0541
      wer: 0.1818
    bible_00182:
      source: bible
      text: Mɔ bɛ wɔ bɔlɛ́ nɩn anun ɔ nʋn mɔ bɛ 'kpɛ jenvie'n, bɛ sɔnɩnlɩn bɛ́ kʋalaatin ɔ man bɛ nʋn
        Moyizɩ yɔlɩ kʋn.
      sbs: 0.7789
      gen_sec: 6.96
      ref_sec: 7.0
      cer: 0.0256
      wer: 0.087
    bible_00183:
      source: bible
      text: Mɩɩn kan yɩ́ ananhɔlɛ mɩn kele ɛmɔ kɛ mɛlɛ'n lɛ ba, mɛlɛ sɔ nɩn a ju bɔbɔ, mɔ bɛ́ mɔ b'a wu'n,
        bɛ 'ba tɩ Nyanmɩan Awa nɩn anɩn'n. Nan bɛ́ mɔ bɛ kɔ tɩ yɩ́ nɩn'n, bɛ 'nyan nyanmɩansʋ ngʋan'n.
      sbs: 0.7061
      gen_sec: 13.2
      ref_sec: 13.14
      cer: 0.0229
      wer: 0.0732
    bible_00184:
      source: bible
      text: Junman biala mɔ ɛmɔ 'di'n, ɛmɔ yɩ́ bɛ́ kunnun bɛ lí yɩ́ kanlanman kpa. Ɛmɔ lí yɩ́ kɛ bɛ le
        di bɛ man yɛ́ Mɩn, nan nán kulo menian'n-mɔ yɛ̂ ɛmɔ lɛ di man bɛ́ ɔ.
      sbs: 0.7694
      gen_sec: 10.8
      ref_sec: 11.1
      cer: 0.0275
      wer: 0.1667
    bible_00185:
      source: bible
      text: 'Mɔ Zozi hanlɩn sɔ yuelɩ''n, ɔ tɩanlɩn nun sɛlɛ kpa, yɩ́ nwan: “Lazaa, fi ɛlɔ fite!”'
      sbs: 0.6816
      gen_sec: 7.04
      ref_sec: 5.74
      cer: 0.0517
      wer: 0.0625
    bible_00186:
      source: bible
      text: Sian dɩɛ, yɛ́ Mɩn, nɩan yɛ́ ti efua mɔ b'a fua'n, nán man wɔ́ ngʋa'n-mɔ anwʋnsɛlɛ kpa maan
        bɛ hán wɔ́ nʋan ɛjɔlɛ'n.
      sbs: 0.7439
      gen_sec: 8.4
      ref_sec: 8.68
      cer: 0.025
      wer: 0.0435
    bible_00187:
      source: bible
      text: Asannan nán Zozi a a'n, Zʋan hanlɩn helelɩ Izalayɛ mân bɔndɩn'n kɛ bɛ káci bɛ́ abalabɔ'n bɛ
        fá bɛ́ nwʋn bɛ mán Nyanmɩan maan ɔ sɔ́nɩn bɛ́.
      sbs: 0.7647
      gen_sec: 8.56
      ref_sec: 9.32
      cer: 0.0485
      wer: 0.1481
    bible_00188:
      source: bible
      text: M'ɔ tʋ de ehulo'n mɔ ɛmɔ kulo anianman'n-mɔ mɔ bɛ le dedi'n, ɔ njian man kɛ yɛ kɛlɛ ɛmɔ yɩ́
        nwʋn kalata biekun ɔ. Ɔ sanlɩn kɛ Nyanmɩan muonun a hele ɛmɔ kɛ ɛmɔ kpɩ́n bɛ húlo bɛ́ nwʋn'n.
      sbs: 0.7651
