      gen_sec: 14.28
      ref_sec: 13.18
      cer: 0.3917
      wer: 0.5897
    bible_00007:
      source: bible
      text: Ɛnɛ nʋn ɛnɛ, bɛ 'kɩnnga Moyizɩ mala kalata'n-mɔ a, bɛ tɩ kɛ menian mɔ b'a hyɩ bɛ́ ajʋnlɩn
        ɔ.
      sbs: 0.5868
      gen_sec: 7.12
      ref_sec: 6.5
      cer: 0.2879
      wer: 0.8947
    bible_00008:
      source: bible
      text: Afɩ, sʋanlan m'ɔ nne Baa'n nni man'n, anɩn sʋanlan sɔ'n, ɔ nne man Sɩɛ'n kʋsʋ nni man. Nan
        sʋanlan m'ɔ de Baa'n di'n, anɩn ɔ de Sɩɛ'n kʋsʋ di.
      sbs: 0.6118
      gen_sec: 14.68
      ref_sec: 8.8
      cer: 0.303
      wer: 0.7241
    bible_00009:
      source: bible
      text: Ɛmɔ kácɩ kɛ sʋanlan biala, sɛ ɔ tɩ kanga o, sɛ ɔ tɩ man kanga o, yɩ́ junman kpa m'ɔ kɔ li'n,
        ɔ 'nyan yɩ́ nwʋn ahatua m'ɔ fata'n yɛ́ Mɩn asa nun.
      sbs: 0.5976
      gen_sec: 12.12
      ref_sec: 10.02
      cer: 0.2323
      wer: 0.6667
    bible_00010:
      source: bible
      text: 'Mɔ Pɩɛlɩ tɩlɩ ɛjɔlɛ sɔ''n, ɔ kɔ su akpʋlʋwa. Yɩ́ nwan: “Zozi sɔ''n, mɩn nzɩ man yɩ́.”'
      sbs: 0.592
      gen_sec: 9.68
      ref_sec: 6.32
      cer: 0.2857
      wer: 0.6471
    bible_00011:
      source: bible
      text: 'Mali jʋnlɩn kɛ sʋanlan''n m''ɔ di tola nɩn anun junman nɩn ɔ. Yɩ́ nwan: “Yɛmɩnlɩn, sɛ wɔ́
        yɛ̂ a yɩ yɩ́ ɛwa a, anɩn kele mɩ́n lɩka mɔ ɛ sielɩ yɩ́''n maan n gɔ́ n vá.”'
      sbs: 0.5885
      gen_sec: 13.8
      ref_sec: 11.42
      cer: 0.2636
      wer: 0.6389
    bible_00012:
      source: bible
      text: Kɛmɔ ɛmɔ nne man sʋanlan'n mɔ Sɩɛ'n sʋanlɩn yɩ́'n nni man'n, ɔ man ɛmɔ nva man yɩ́ ɛjɔlɛ'n
        bɛ nzie man.
      sbs: 0.6061
      gen_sec: 8.36
      ref_sec: 6.32
      cer: 0.2432
      wer: 0.8571
    bible_00013:
      source: bible
      text: Nan ɔ tɩ mala wɔ ɛmɔ afian ɛwa, sɛ bɛ 'di *Pakɩ biala a, bɛ́ mɔ bɛ kɔ gua bɛ́ fiadɩ'n, mɩn
        yɩ kʋn. Yɩ́ ti, asʋ ɛmɔ kulo kɛ mɩn yaci Zufʋ'n-mɔ belemgbin nɩn ɔ?”
      sbs: 0.5386
      gen_sec: 14.0
      ref_sec: 11.78
      cer: 0.2477
      wer: 0.75
    bible_00014:
      source: bible
      text: 'Ɛhɩ a, bɛ tɩ ɛbɛlɛ kaan mɔ ɔ ''kɔ bie''n, Zozi ''tʋ yɩ́ nyɩn nɩan an, menian dɔʋn kpa lɛ
        ba yɩ́ nwʋn, nán ɔ''a bisa Filipʋ kɛ: “Filipʋ, ninhan yɛ̂ yɛ ''nyan like yɛ to yɛ man menian nwala
        ɛhɩ di ɔ?”'
      sbs: 0.5956
      gen_sec: 17.04
      ref_sec: 12.16
      cer: 0.291
      wer: 0.6279
    bible_00015:
      source: bible
      text: Ɛmɔ tɩ Nyanmɩan anwʋntɩɛ mma, yɩ́ ti, nán man bɛ tɩ satɩlɩfʋɛ nyɔlɩɛ fɩ́ɩ́, anaan basa-basa
        ɛyɔlɛ ɔ nʋn anyɩnbʋlʋ bɔbɔ ɛmɔ afian ɛlɔ.
      sbs: 0.5615
      gen_sec: 14.24
      ref_sec: 9.56
      cer: 0.1078
      wer: 0.4167
    bible_00016:
      source: bible
      text: Ɛmɔ a nɩan yɛ́ nʋn yɛ́ Mɩn asɩtanlan sɔ nɩn asʋ. Ɛhɩka ati yɛ̂ bɛ helelɩ ɛmɔ ahʋlʋwa kpa tɛmʋn
        mɔ ɛmɔ lelɩ Nyanmɩan Anʋan Ɛjɔlɛ'n bɛ lili nɩn ɔ. Nan kʋsʋ Wawɛ Nwannzan-nwannzan nɩn a man ɛmɔ
        le fɛ elie.
      sbs: 0.5799
      gen_sec: 18.76
      ref_sec: 14.1
      cer: 0.2013
      wer: 0.6585
    bible_00017:
      source: bible
      text: Mɔ Zakali yuelɩ Nyanmɩan awulo nɩn anun junman'n di'n, ɔ kɔ sa kɔ hɔ yɩ́ kulo.
      sbs: 0.5902
      gen_sec: 5.44
      ref_sec: 4.44
      cer: 0.1552
      wer: 0.625
    bible_00018:
      source: bible
      text: Mɔ mmɔfʋɛ nnyuan'n lili yɛ́ Mɩn anwʋn adanzɩɛ bɛ hanlɩn yɩ́ nʋan ɛjɔlɛ'n yuelɩ'n, bɛ kɔ sa
        bɛ kɔ hɔ Zoluzalɛmʋn. Mɔ bɛ 'kɔ'n, bɛ bɔlɩ Ɛjɔlɛkpa'n Samali kulo dɔʋn asʋ bɛ hele menian'n-mɔ.
      sbs: 0.6492
      gen_sec: 17.6
      ref_sec: 13.14
      cer: 0.3885
      wer: 0.9412
    bible_00019:
      source: bible
      text: Ɛjɔlɛkpa nɩn ati, sɛ mɩɩn nwun yalɛ ɛmɔ dunman nun an, nán bɛ man bɛ́ nwʋn bubu bɛ́. Nan ɔ
        tɩ ɛmɔ anunminnyanmʋn wɔ Nyanmɩan anyunnun.
      sbs: 0.5949
      gen_sec: 12.44
      ref_sec: 8.48
      cer: 0.2136
      wer: 0.6538
    bible_00020:
      source: bible
      text: 'Ɛjɔlɛ kpɔlɛ kʋn yɛ̂ n dɩanlɩn nun n ganlɩn yɩ́ bɛ́ afian ɛbɛlɛ ɔ. Mɩ́n nwan: ‘Ewuetinnge
        nɩn ati yɛ̂ ɔ man ɛnɛ ɛmɔ lɛ bua mɩ́n ndɛɛ ɔ!’”'
