      sbs: 0.6748
      gen_sec: 8.77
      ref_sec: 10.8
      cer: 0.1765
      wer: 0.5676
    bible_00171:
      source: bible
      text: '“Yɩ́ nwan: ‘Mɩn tua wɔ́ mɩn *olivʋ ngo balugo abulaa.’'
