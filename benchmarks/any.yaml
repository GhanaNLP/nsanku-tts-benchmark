      cer: 0.2013
      wer: 0.625
    bible_00023:
      source: bible
      text: 'Zufʋ''n-mɔ fɛtɩ sɔ''n kʋsʋ, cɩan m''ɔ li sian''n yɛ̂ ɔ tɩ fɛtɩ''n cɩan kpili kpa nɩn ɔ. Cɩan
        sɔ''n, Zozi jasʋlɩ jinlanlɩn menian''n-mɔ kʋalaa afian an, yɩ́ nwan: “Sʋanlan mɔ nzuhoe lɛ kun
