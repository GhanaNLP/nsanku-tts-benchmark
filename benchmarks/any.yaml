      gen_sec: 5.35
      ref_sec: 6.0
      cer: 0.1857
      wer: 0.4348
    bible_00159:
      source: bible
      text: “Mɛlɛ sɔ nɩn anun yɛ̂ bɛ wʋlɩ *Moyizɩ ɔ. Moyizɩ tɩ baa belenzua kanlanman kpa. Nyanmɩan kulo
        yɩ́ ɛjɔlɛ. Yɩ́ sɩ-mɔ falɩ yɩ́ fɩalɩ bɛ tɩtɩlɩ yɩ́ dede sala nsan.
