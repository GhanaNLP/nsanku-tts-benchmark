      sbs: 0.7635
      gen_sec: 6.56
      ref_sec: 6.84
      cer: 0.039
      wer: 0.1429
    bible_00198:
      source: bible
      text: Afɩ, sɛ yɛ́ ahʋnlɩn'n bu yɛ́ fʋɔ biala a, Nyanmɩan tɩ kpili tala yɛ́ ahʋnlɩn'n, ɛsɛ ɔ sɩ like
