      cer: 0.0435
      wer: 0.069
    bible_00177:
      source: bible
      text: Ɛhɩ, Zozi fi Nyanmɩan awulo nɩn anun, ɔ kɔ fite kɔ hɔ *Olivʋ bʋka nɩn asʋ.
