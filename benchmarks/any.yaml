      sbs: 0.6563
      gen_sec: 9.6
      ref_sec: 8.14
      cer: 0.0366
      wer: 0.0909
    bible_00194:
      source: bible
      text: Nán kɛ enwonwunlan mɔ mɩn kulo kɛ mɩn nwonwunlan ɛmɔ ati y'ɔ man mɩɩn kɛlɛ kalata ɛhɩ-mɔ ɔ.
      sbs: 0.6855
      gen_sec: 6.4
