      gen_sec: 4.22
      ref_sec: 6.02
      cer: 0.1094
      wer: 0.3333
    bible_00180:
      source: bible
      text: Ɔ sanlɩn kɛ Nyanmɩan Awa Zozi Kilisi mɔ mɩn nʋn Silasɩ nʋn Timote yɛ walɩ hanlɩn yɩ́ nwʋn
        ɛjɔlɛ'n yɛ helelɩ ɛmɔ'n, ɔ tɩ man sʋanlan m'ɔ kan ɛjɔlɛ a, anɩn ɛsɛ ɔ'a kaci yɩ́ nʋan ɔ.
      sbs: 0.6158
      gen_sec: 9.55
      ref_sec: 13.3
      cer: 0.2105
      wer: 0.7027
    bible_00181:
      source: bible
      text: Ɔ 'man ɔ kele yɛ́ atɩn'n m'ɔ man bɛ nyan alʋacɩcɩɛ'n.”
