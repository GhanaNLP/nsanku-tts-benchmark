      ref_sec: 13.04
      cer: 0.1926
      wer: 0.6
    bible_00157:
      source: bible
      text: Ɛhyɩhyɛ sɔ'n mɔ Nyanmɩan 'ba gua yɩ́ bʋ mân nɩn ayuelɩɛ nun'n y'ɔ le kɛ ɔ 'ba han anwunno
        ɛlɔ nʋn asɩɛ nɩn asʋ ɛwa ninnge'n kʋalaatin bɔ nun ɔ fa bɛ́ wula Kilisi m'ɔ tɩ kpain nɩn asa nun.
