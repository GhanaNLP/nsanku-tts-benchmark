      sbs: 0.6796
      gen_sec: 11.89
      ref_sec: 12.84
    '49':
      text: Esi wova ɖo toa te la, wokpɔ ameha gã aɖe nɔ afi ma nɔ wo lalam.
      sbs: 0.6485
      gen_sec: 5.86
      ref_sec: 5.48
    '50':
