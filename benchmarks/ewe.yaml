      sbs: 0.6046
      gen_sec: 3.6
      ref_sec: 4.68
    '129':
      text: Eva kpɔ dzonu aɖe si xɔ asi ŋutɔ, eya ta eyi ɖadzra nu siwo katã le esi la, eye wòƒle dzonu
