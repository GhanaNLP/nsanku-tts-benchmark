      ref_sec: 10.5
    '168':
      text: '” Yesu ɖo eŋu na wo be: “Miexlẽe kpɔ be ame si wɔ ame le gɔmedzedzea me la, atsu kple asie
        wòwɔ woe oa?'
      sbs: 0.6888
      gen_sec: 8.16
      ref_sec: 9.3
    '169':
      text: Mieɖo ŋku edzi be menyi ame akpe atɔ̃ kple abolo atɔ̃, eye esi susɔ la yɔ kusiwo oa?
      sbs: 0.6759
      gen_sec: 6.88
      ref_sec: 8.12
    '170':
      text: Wotsɔ kpe siwo wofú la wɔ kplɔ̃ ene hena numemevɔsawo.
      sbs: 0.6928
      gen_sec: 4.0
      ref_sec: 3.72
    '171':
      text: Esi gbe la nɔ ɖiɖim alea la, dzidzi ƒo nusrɔ̃la etɔ̃awo, eye wotsyɔ mo anyi kple vɔvɔ̃.
      sbs: 0.6662
      gen_sec: 6.8
      ref_sec: 6.28
    '172':
      text: Xɔ lolo ŋutɔ mebe matu elabe mía Mawu la lolo wu mawu bubuwo katã.
      sbs: 0.71
      gen_sec: 4.64
      ref_sec: 6.4
    '173':
      text: Baba na ame si gblɔ na atikpakpɛ be, ‘Gbɔ agbe!
      sbs: 0.6828
      gen_sec: 2.8
      ref_sec: 3.34
    '174':
      text: Wotsi tsitre ɖe adzɔge henɔ dzodzom nyanyanya kple vɔvɔ̃.
      sbs: 0.6241
      gen_sec: 4.48
      ref_sec: 3.3
    '175':
      text: Ale wòatsɔ vidzĩ si eya ŋutɔ dzi la aɖu le adzame, atsɔ amenɔ la hã akpe ɖe eŋuti.
      sbs: 0.6355
      gen_sec: 6.16
      ref_sec: 8.0
    '176':
      text: Le míaƒe nu vɔ̃wo ta la, wotsɔ yi he to na míawo ŋutɔ, míaƒe fiawo kple míaƒe nunɔlawo, eye
        woɖe aboyo mí.
      sbs: 0.702
      gen_sec: 7.76
      ref_sec: 8.48
    '177':
      text: Ne ame le agbe ƒè geɖee la, nekpɔ dzidzɔ le wo katã me.
      sbs: 0.7296
      gen_sec: 4.08
      ref_sec: 4.8
    '178':
      text: Ame siawo wɔ dɔ le Yehoyakim, si nye Yesua vi kple Yozadak ƒe tɔgbuiyɔvi la ŋɔli.
      sbs: 0.668
      gen_sec: 4.96
      ref_sec: 9.2
    '179':
      text: Le ŋkeke etɔ̃awo me la, ŋutsuwo katã tso Yuda kple Benyamin va kpe ta ɖe Yerusalem.
      sbs: 0.6616
      gen_sec: 5.6
      ref_sec: 7.08
    '180':
      text: eye woɖea gbe abe dzataviwo ene.
      sbs: 0.7337
      gen_sec: 3.04
      ref_sec: 3.14
    '182':
      text: eye wòaɖe gbeƒã nye ʋɔnudɔdrɔ̃ na trɔ̃subɔlawo.
      sbs: 0.7012
      gen_sec: 3.2
      ref_sec: 3.32
    '183':
      text: Esia hã nu dzodzro ko wònye; dɔ vloe.
      sbs: 0.7577
      gen_sec: 3.04
      ref_sec: 3.32
    '184':
      text: Woɖe asi le se si mede na wo la ŋu gɔ̃ xoxo eye wokɔ̀ legba na wo ɖokui.
      sbs: 0.7377
      gen_sec: 5.52
      ref_sec: 7.34
    '185':
      text: Xatus, Xasbneya vie dzra akpa si va ɖe esia yome la ɖo.
      sbs: 0.6661
      gen_sec: 4.88
      ref_sec: 6.4
    '187':
      text: Gbedoxɔmedɔwɔla siwo nɔ Ofel togbɛ dzi la, gbugbɔ gli la ɖo va ɖo Tsigbo ɣedzeƒetɔ la kple
        mɔ la ƒe xɔ tsrala gbɔ.
      sbs: 0.6772
      gen_sec: 8.96
      ref_sec: 9.42
    '190':
      text: ’ Mienya ale si miaɖe dziƒo ƒe nɔnɔme gɔme, gake mietea ŋu dzea si ɣeyiɣiwo ƒe dzesiwo o.
      sbs: 0.7004
      gen_sec: 6.8
      ref_sec: 7.44
    '191':
      text: Ena Israelviwo dome ɖekakpuiwo yi ɖawɔ numemevɔsawo na Aƒetɔ, eye wòna wotsɔ nyitsuwo sa ŋutifafavɔ
        hã nɛ.
      sbs: 0.6945
      gen_sec: 8.8
      ref_sec: 12.84
    '192':
      text: Nɔvi siwo tso Italia hã do gbe na mi.
      sbs: 0.6722
      gen_sec: 2.56
      ref_sec: 3.62
    '193':
      text: 'Esiwo tso Paxat-Moab viŋutsuwo dome: Adna, Xelal, Benaya, Maaseya, Matanya, Bezaleel, Binui
        kple Manase.'
      sbs: 0.8011
      gen_sec: 13.28
      ref_sec: 13.48
    '194':
      text: ” Ke esi ɖekakpui la se nya sia la, edzo kple nuxaxa, elabena enye kesinɔtɔ gã aɖe.
      sbs: 0.7326
      gen_sec: 7.2
      ref_sec: 6.4
    '195':
      text: O Aƒetɔ, ne metsɔ nya ɖe ŋuwò hã la.
      sbs: 0.6615
      gen_sec: 3.6
      ref_sec: 3.1
    '197':
      text: Woɖii ɖe David ƒe du la me, ke womeɖii ɖe fiawo ɖiƒe o.
      sbs: 0.7115
      gen_sec: 4.16
      ref_sec: 7.46
    '198':
      text: 'Tso Pasur ƒe dzidzimeviwo dome: Elioenai, Maaseya, Ismael, Netanel, Yozabad kple Eleasa.'
      sbs: 0.7038
      gen_sec: 8.16
      ref_sec: 10.56
    '199':
      text: Etsɔ wo ɖo mawuwoe, dea ta agu na wo eye wòdoa dzudzɔ na wo.
      sbs: 0.5595
      gen_sec: 3.92
      ref_sec: 5.64
    '200':
      text: Tso gbe aɖe gbe ke, le David kple Asaf ŋɔli la, hɛnɔawo nɔa anyi nyea hadzilawo kplɔlawo,
        ne wole kafukafuhawo kple akpedahawo dzim na Mawu.
      sbs: 0.7364
      gen_sec: 10.88
      ref_sec: 12.74
    '202':
      text: Esia hã nu dzodzro kple yadɔ ko wònye.
      sbs: 0.7074
      gen_sec: 2.4
      ref_sec: 3.26
    '203':
      text: nana be ɖeɖi tea eŋu; elabe menya mɔ si.
      sbs: 0.7666
      gen_sec: 3.12
      ref_sec: 4.12
    '204':
      text: Ke zi atɔ̃lia la, Sanbalat ɖo eƒe dɔla ɖem kple gbedeasi ma ke, eye wòlé agbalẽ si nu wometre
        o la ɖe asi.
      sbs: 0.6922
      gen_sec: 9.12
      ref_sec: 7.82
    '205':
      text: Fesrewo ƒo xlãe kpe ɖe eƒe akpata la ŋuti.
      sbs: 0.6726
      gen_sec: 3.04
      ref_sec: 3.24
    '207':
      text: Nubablaɖaka la le wo ŋgɔ be yeatia teƒe si woatɔ ɖo la na wo.
      sbs: 0.6556
      gen_sec: 4.8
      ref_sec: 5.24
    '208':
      text: Yehowa gblɔ nya siawo na Mose be, “Gblɔ na Israelviwo be, ‘Miawo ŋutɔ miekpɔe be meɖe nye
        lɔlɔ̃nu fia mi tso dziƒo.
      sbs: 0.7511
      gen_sec: 8.96
      ref_sec: 9.38
    '210':
      text: Tete ameha blibo la de asi liʋiliʋĩlilĩ me le Mose kple Aron ŋu.
      sbs: 0.6737
      gen_sec: 5.44
      ref_sec: 5.08
    '212':
      text: Esi wòva la, eya kple Yoram wodo go be yewoaɖakpe Yehu, Nimsi vi, ame si Aƒetɔ si ami na be
        wòatsrɔ̃ Axab ƒe ƒome la.
      sbs: 0.7192
      gen_sec: 9.2
      ref_sec: 11.74
    '213':
      text: Esi wonɔ elalam be wòava yi la, woda adzo ame siwo va to mɔ la dzi yina.
      sbs: 0.7422
      gen_sec: 5.44
      ref_sec: 5.48
    '214':
      text: Enye ame si ɖe Mawu ƒe nɔnɔme tututu fia, eye wòna agbe nuwo katã to eƒe ŋusẽnya la me.
      sbs: 0.6748
      gen_sec: 5.68
      ref_sec: 7.32
    '215':
      text: Betlehemtɔwo kple Netofatɔwo le ame alafa ɖeka kple blaenyi-vɔ-enyi .
      sbs: 0.7644
      gen_sec: 10.64
      ref_sec: 6.02
    '216':
      text: ’ Ne woku lãdzokpẽ he eme didie la, eya ko hafi woalia to la.
      sbs: 0.7003
      gen_sec: 4.16
      ref_sec: 7.44
    '217':
      text: Wo kple nunɔlawo, Levi viwo kple ame siwo katã tso aboyoa me va le Yerusalem lae dze dɔa gɔme.
      sbs: 0.7041
      gen_sec: 6.8
      ref_sec: 9.1
    '218':
      text: Ale ke magblẽ dɔa ɖi koŋ ko atso, be mava kpɔ mi le kɔƒe me?
      sbs: 0.7648
      gen_sec: 4.56
      ref_sec: 5.96
    '219':
      text: Agbledede doa dzidzɔ nɛ ale agble kple waingble geɖewo nɔ esi, le toawo ŋu kple balime afi
        si nukuwo nyona le nyuie.
      sbs: 0.6593
      gen_sec: 9.68
      ref_sec: 9.4
    '221':
      text: 'Egblɔ nam be: “Ge ɖe eme ne nàkpɔ ŋunyɔnuvɔ̃ɖi siwo wɔm wole le afi sia la ɖa.'
      sbs: 0.741
      gen_sec: 6.56
      ref_sec: 5.86
    '222':
      text: Mana la ɖeɖe ko woɖu va se ɖe esime woɖo Kanaan-nyigba ƒe liƒo dzi.
      sbs: 0.6725
      gen_sec: 3.76
      ref_sec: 5.26
    '223':
      text: Mose bu ɖe lilikpo si tsyɔ to la tame la me, eye wònɔ afi ma ŋkeke blaene kple zã blaene.
      sbs: 0.7737
      gen_sec: 7.44
      ref_sec: 9.02
    '224':
      text: Evɔa, ele be woatsɔ nu sia nu si le asinye la nɛ!
      sbs: 0.7201
      gen_sec: 2.56
      ref_sec: 3.02
    '225':
      text: Eya ta wosɔ nu be yewo katã yewoaho aʋa ɖe Yerusalem ŋu aɖadze edzi, ade ʋunyaʋunya eme.
      sbs: 0.6888
      gen_sec: 6.4
      ref_sec: 9.36
    '226':
      text: Kuɖiɖi la nava amegbetɔwo, lãwo kple amegbetɔwo ƒe asinudɔwɔwɔ ɖe sia ɖe dzi.
      sbs: 0.72
      gen_sec: 5.2
      ref_sec: 5.46
    '227':
      text: Ahab, Israel fia, bia Yuda fia, Yehosafat be, “Àte ŋu akpe ɖe ŋunye míaho aʋa ɖe Ramot Gilead
        ŋua?
      sbs: 0.7359
      gen_sec: 8.4
      ref_sec: 8.52
    '228':
      text: eye nàɖo wo ɖi hena wuwugbe.
      sbs: 0.7277
      gen_sec: 2.0
      ref_sec: 3.68
    '229':
      text: Woƒo xlã vɔsamlekpui la hã eye ame sia ame lé aʋawɔnu ɖe asi.
      sbs: 0.6895
      gen_sec: 4.96
      ref_sec: 5.9
    '230':
      text: Tete meda ŋku ɖi, eye kpɔ ɖa, mekpɔ nane si ɖi ame ƒe nɔnɔme.
      sbs: 0.7069
      gen_sec: 4.32
      ref_sec: 5.3
    '232':
      text: “Elabe ale si tsi kple tsikpe dzana.
      sbs: 0.6155
      gen_sec: 2.32
      ref_sec: 3.68
  score: 0.7001
