      sbs: 0.7827
      gen_sec: 4.83
      ref_sec: 3.08
    '65':
      text: siwo katã avɔlɔ̃lawo lɔ̃ aɖaŋutɔe la na wo.
      sbs: 0.7629
      gen_sec: 4.48
      ref_sec: 4.0
    '66':
      text: 'Ale si mianɔ hafi aɖui nye esi: mido miaƒe awuwo, miabla wo dzi kple alidziblaka.'
      sbs: 0.8244
      gen_sec: 8.34
      ref_sec: 6.9
    '70':
      text: “Agbletɔ la ɖo eŋu na wo be, ‘Futɔ aɖe kokokoe wɔ nenem nu sia.
      sbs: 0.7747
      gen_sec: 6.02
      ref_sec: 4.3
    '71':
      text: Noe nàɖe amama eye ŋukpe nava dziwò le ŋutikɔkɔeteƒe.
      sbs: 0.7918
      gen_sec: 5.47
      ref_sec: 5.54
    '72':
      text: Miyi ɖe towo dzi ne miatso atiwo vɛ ne miatsɔ agbugbɔ atu nye gbedoxɔe.
      sbs: 0.8021
      gen_sec: 6.5
      ref_sec: 5.62
    '73':
      text: Mawu wɔ Via wòzu gã wu mawudɔlawo, elabe ŋkɔ si Mawu va tsɔ nɛ la xɔ asi wu mawudɔlawo tɔ.
      sbs: 0.7294
      gen_sec: 8.78
      ref_sec: 10.9
    '75':
      text: Emegbe la, Levitɔ aɖewo wɔ dɔ le Rehum, Bani ƒe vi, te.
      sbs: 0.8003
      gen_sec: 6.0
      ref_sec: 4.88
    '76':
      text: Nunɔla Ezra tia ƒometatɔwo tso aƒekɔ ɖe sia ɖe me heyɔ woƒe ŋkɔwo ɖekaɖeka.
      sbs: 0.763
      gen_sec: 7.02
      ref_sec: 7.24
    '77':
      text: Omer ɖeka nye efa ƒe memama ewolia.
      sbs: 0.7702
      gen_sec: 4.42
      ref_sec: 6.14
    '79':
      text: Barux, Zabai vi, dzra akpa si va ɖe Eser tɔ yome la ɖo va se ɖe nunɔlagã Elyasib ƒe agbo nu.
      sbs: 0.7787
      gen_sec: 9.41
      ref_sec: 10.68
    '80':
      text: Wò ame siwo le Dibon la lũ ta kolikoli.
      sbs: 0.7924
      gen_sec: 3.94
      ref_sec: 4.04
    '81':
      text: Ameawo lala, wogakplɔe gbɔe hafi wogayi mɔzɔzɔ la dzi.
      sbs: 0.7955
      gen_sec: 5.66
      ref_sec: 5.34
    '82':
      text: Woawoe nye Azarya, Yeroxam vi, Ismael, Yehohanan vi, Azarya, Obed vi, Maaseya, Adaya vi kple
        Elisafat, Zixri vi.
      sbs: 0.7846
      gen_sec: 14.19
      ref_sec: 14.68
    '83':
      text: 'Miagblɔ gbe ma gbe be: “Mida akpe na Aƒetɔ!'
      sbs: 0.8032
      gen_sec: 4.45
      ref_sec: 3.7
    '84':
      text: Esi ameawo se sedede sia la, woɖe amedzro siwo katã tsaka wo la le wo dome.
      sbs: 0.7713
      gen_sec: 7.2
      ref_sec: 6.88
    '85':
