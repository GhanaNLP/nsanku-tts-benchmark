- model: ghananlpcommunity/ghana-tts-36k-noref
  sbs: 0.7001
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Mose ɖo nya sia ŋu na Yehowa be, “Ameawo mava Sinai toa dzi o, elabena ède se na wo be womekpɔ
        mɔ ava o.
      sbs: 0.7173
      gen_sec: 8.0
      ref_sec: 9.1
    '2':
      text: Esi Sanebalat se be míele glia ɖom la, eku dzi nɛ.
      sbs: 0.7265
      gen_sec: 4.24
      ref_sec: 5.5
    '3':
      text: ” Nyɔnua kɔ vidzĩa dzoe, eye wòɖakpɔ edzi.
      sbs: 0.7408
      gen_sec: 3.92
      ref_sec: 4.48
    '4':
      text: Fia Dario ɖe gbe be woayi dɔa dzi, eye wowu gbedoxɔa nu.
      sbs: 0.7436
      gen_sec: 4.0
      ref_sec: 6.22
    '5':
      text: Míawo ɖeɖe míatui na Aƒetɔ, Israel ƒe Mawu la abe ale si Persia-fia Kores ɖoe na mí la ene.
      sbs: 0.6974
      gen_sec: 5.76
      ref_sec: 7.74
    '7':
      text: Dzudzɔ de dzi ʋĩi abe dzudzɔti me wòle dodom tso ene; to blibo la le ʋuʋum sesĩe ŋutɔ.
      sbs: 0.6719
      gen_sec: 6.08
      ref_sec: 8.76
    '8':
      text: Eya ta azɔ la miʋu miaƒe nuvɔ̃ me na Aƒetɔ, mia tɔgbuiwo ƒe Mawu la, eye miawɔ eƒe lɔlɔ̃nu.
      sbs: 0.7106
      gen_sec: 7.2
      ref_sec: 9.64
    '9':
      text: Ewɔ ɖeka kple Ahab to via nyɔnuvi ɖeka ɖeɖe me.
      sbs: 0.6943
      gen_sec: 3.6
      ref_sec: 3.54
    '10':
      text: Nuku bubuwo ge ɖe ŋu me, eye ŋu vu tsyɔ wo dzi woku.
      sbs: 0.7018
      gen_sec: 4.96
      ref_sec: 4.04
    '11':
      text: Ɣe ma ɣi la, Gaal, Ebed ƒe vi, ʋu kple nɔviawo yi Sekem eye wòzu ame ŋkutawo dometɔ ɖeka le
        dua me.
      sbs: 0.5926
      gen_sec: 8.8
      ref_sec: 8.72
    '12':
      text: Eɖo Selax tá la ƒe gli si le fia ƒe abɔ kple atrakpui si ɖiɖi tso David ƒe du me, dome la.
      sbs: 0.6516
      gen_sec: 8.24
      ref_sec: 9.14
    '13':
      text: Vi lae tsɔ eƒe nya ƒe ŋusẽ la lé xexeme blibo la ɖe te.
      sbs: 0.6558
      gen_sec: 5.04
      ref_sec: 6.5
    '14':
      text: avifafa kple nublanuiɣli ɖi bobobo; Rahel nɔ avi dzi le viawo ta.
      sbs: 0.6913
      gen_sec: 4.8
      ref_sec: 5.52
    '15':
      text: Megblɔ na wo be miɖo to nye gbe, eye miwɔ nu siwo katã megblɔ na mi la.
      sbs: 0.6595
      gen_sec: 5.44
      ref_sec: 5.9
    '16':
      text: Woatsi ado xoxo abe awu ene.
      sbs: 0.7468
      gen_sec: 3.04
      ref_sec: 3.52
    '17':
      text: Ne èkplɔ mí ɖo la, àkpɔ gome le nu nyui siwo katã Yehowa wɔna na mí la me.
      sbs: 0.7013
      gen_sec: 6.64
      ref_sec: 6.4
    '19':
      text: Migakpa kpeawo kple dɔwɔnu aɖeke o, elabena ne miekpa wo la, womagadze be woawɔ wo ŋu dɔ hena
        vɔsamlekpuiɖiɖi nam o.
      sbs: 0.6683
      gen_sec: 7.92
      ref_sec: 10.74
    '20':
      text: Kpɔ ɖa, àyɔ dukɔ siwo mènya o la vɛ.
      sbs: 0.6456
      gen_sec: 2.88
      ref_sec: 3.78
    '21':
      text: Esi nètsrɔ̃ dukɔ geɖewo ta la, wò hã atsrɔ̃.
      sbs: 0.729
      gen_sec: 3.28
      ref_sec: 4.4
    '22':
      text: Èlɔ̃ dzɔdzɔenyenye, eye nèlé fu ŋutasesẽ, eya ta Mawu.
      sbs: 0.7361
      gen_sec: 4.64
      ref_sec: 4.72
    '23':
      text: Ɖewo ge ɖe kpenyigba dzi, afi si anyi mesɔ gbɔ le o.
      sbs: 0.7381
      gen_sec: 3.92
      ref_sec: 4.32
    '24':
      text: Benui, Xenadad vi, dzra akpa si kplɔe ɖo la ɖo.
      sbs: 0.7526
      gen_sec: 4.4
      ref_sec: 4.34
    '25':
      text: Wotsɔa gliɖolawo kple atikpalawo be woaɖɔ Yehowa ƒe gbedoxɔ la ɖo.
      sbs: 0.6864
      gen_sec: 4.48
      ref_sec: 5.48
    '26':
      text: Eda gbe le dɔlélawo katã ŋu, eye wòde se na wo be womagana amewo nadze si ye o.
      sbs: 0.7203
      gen_sec: 7.12
      ref_sec: 11.8
    '27':
      text: Wosa vɔ geɖe gbe ma gbe kple aseyetsotso gã elabe Mawu na dzidzɔ yɔ ame sia ame ƒe dzime.
      sbs: 0.7247
      gen_sec: 7.12
      ref_sec: 7.4
    '28':
      text: Egblɔ na wo be, “Enyo, maɖe egɔme na mi.
      sbs: 0.6642
      gen_sec: 3.52
      ref_sec: 3.54
    '30':
      text: 'Aƒetɔ gblɔ na Mose kple Aron le Egipte-nyigba dzi be: “Ɣleti sia nanye ɣleti vevitɔ na mi
        le ƒèa me.'
      sbs: 0.6974
      gen_sec: 7.52
      ref_sec: 6.72
    '32':
      text: Esi wònɔ nukua wum la, ɖewo ge ɖe mɔ to, eye xeviwo va fɔ wo mi.
      sbs: 0.7814
      gen_sec: 5.84
      ref_sec: 5.12
    '33':
      text: Aƒetɔ ayra wò dɔwɔwɔwo katã, eye nu ayɔ wò ava taŋ.
      sbs: 0.7478
      gen_sec: 4.4
      ref_sec: 5.1
    '34':
      text: 'Mema hadzilaawo ɖe akpa eve me: akpa gbãtɔ to ɖusime le glia dzi ɖo ta Akɔligbo la gbɔ.'
      sbs: 0.685
      gen_sec: 7.84
      ref_sec: 7.02
    '35':
      text: Aƒetɔ akplɔ ƒoƒoe aƒu wò abe ale si wòwɔ Egiptetɔwo ene.
      sbs: 0.6796
      gen_sec: 3.92
      ref_sec: 6.44
    '36':
      text: Elabe èkɔ amewo ƒe ʋu ɖi.
      sbs: 0.6658
      gen_sec: 1.28
      ref_sec: 3.0
    '37':
      text: Woŋlɔ agbalẽ la kple Aramaik alfabeta ɖe Aramaikgbe me.
      sbs: 0.6885
      gen_sec: 4.16
      ref_sec: 5.04
    '38':
      text: Benyamin kple Xasub dzra akpa si kplɔ nunɔlaawo tɔ ɖo la ɖo.
      sbs: 0.6442
      gen_sec: 4.88
      ref_sec: 5.64
    '39':
      text: Hlɔ̃wo ƒe tatɔwo akpe eve alafa ade nɔ aʋalɔglo siawo nu.
      sbs: 0.6874
      gen_sec: 4.24
      ref_sec: 5.08
    '40':
      text: '” Yesu ɖo eŋu be: “Ɖe miexlẽ nu si David wɔ, esime dɔ wu eya kple eŋutimewo kpɔ oa?'
      sbs: 0.5996
      gen_sec: 23.84
      ref_sec: 7.1
    '41':
      text: Egblɔ nɛ be, “Tso nàkplɔ ɖevi la kple dadaa atrɔ ayi Israelnyigba dzi, elabena ame siwo le
        ɖevi la ƒe agbe yome tim la ku!
      sbs: 0.6996
      gen_sec: 9.6
      ref_sec: 9.66
    '42':
      text: 'Solomo ƒe dɔlawo ƒe dzidzimeviwoe nye: Sotai, Hasoferet, Peruda.'
      sbs: 0.6928
      gen_sec: 7.76
      ref_sec: 6.2
    '43':
      text: 'Yoyada kple viawo si ami nɛ, eye wodo ɣli be: “Fia nenɔ agbe tegbee!'
      sbs: 0.6991
      gen_sec: 5.52
      ref_sec: 6.44
    '44':
      text: Esime Yehu nɔ to hem na Axab ƒe ƒomea la, edo go Yuda-megãwo kple Axazya nɔviŋutsu ƒe viwo,
        ame siwo subɔa Axazya eye wòwu wo.
      sbs: 0.7038
      gen_sec: 9.84
      ref_sec: 12.92
    '45':
      text: Aron nye kɔ kpɔe, eye kpɔ ɖa, Miriam dze anyi.
      sbs: 0.7606
      gen_sec: 3.44
      ref_sec: 4.38
    '47':
      text: Miklã mia ɖokui ɖa tso anyigba la dzi tɔwo kple mia srɔ̃, dukɔ bubu me nyɔnuawo gbɔ.
      sbs: 0.6641
      gen_sec: 5.36
      ref_sec: 7.14
    '48':
      text: Eya ta Yerusalemnɔlawo tsɔ Axazya, Yoram ƒe dɔmlɔea ɖo fiae ɖe eteƒe eye Axazya, Yuda-fia
        Yoram viŋutsu zu fia.
      sbs: 0.6856
      gen_sec: 9.6
      ref_sec: 12.84
    '49':
      text: Esi wova ɖo toa te la, wokpɔ ameha gã aɖe nɔ afi ma nɔ wo lalam.
      sbs: 0.7452
      gen_sec: 5.04
      ref_sec: 5.48
    '50':
      text: Atrakpui ewo le eŋu woflɔna dea edzi.
      sbs: 0.6972
      gen_sec: 2.16
      ref_sec: 3.08
    '51':
      text: Miawo ŋutɔ miekpɔ nu si Yehowa wɔ le Baal Peor kple miaƒe ŋkuwo.
      sbs: 0.7433
      gen_sec: 4.56
      ref_sec: 5.58
    '52':
      text: Ale esia hã ganye bometsitsi kple dagbadagba ɖe yame ko.
      sbs: 0.6711
      gen_sec: 3.76
      ref_sec: 5.38
    '53':
