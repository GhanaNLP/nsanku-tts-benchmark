      gen_sec: 3.58
      ref_sec: 3.96
    '56':
      text: enɔ nam abe waintsetse le gbegbe ene; esi medo go wo fofowo la.
      sbs: 0.7203
      gen_sec: 5.41
      ref_sec: 4.82
    '57':
      text: “ ‘O, wò Betlehem, le Yudanyigba dzi.
      sbs: 0.6739
      gen_sec: 2.69
