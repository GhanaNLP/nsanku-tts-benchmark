  entries:
    '0':
      text: Mose ɖo nya sia ŋu na Yehowa be, “Ameawo mava Sinai toa dzi o, elabena ède se na wo be womekpɔ
        mɔ ava o.
      sbs: 0.7373
      gen_sec: 7.58
      ref_sec: 9.1
    '2':
      text: Esi Sanebalat se be míele glia ɖom la, eku dzi nɛ.
      sbs: 0.6774
      gen_sec: 4.06
      ref_sec: 5.5
    '3':
      text: ” Nyɔnua kɔ vidzĩa dzoe, eye wòɖakpɔ edzi.
      sbs: 0.6909
      gen_sec: 2.69
      ref_sec: 4.48
    '4':
      text: Fia Dario ɖe gbe be woayi dɔa dzi, eye wowu gbedoxɔa nu.
      sbs: 0.727
      gen_sec: 3.81
      ref_sec: 6.22
    '5':
      text: Míawo ɖeɖe míatui na Aƒetɔ, Israel ƒe Mawu la abe ale si Persia-fia Kores ɖoe na mí la ene.
      sbs: 0.6856
      gen_sec: 6.62
      ref_sec: 7.74
    '7':
      text: Dzudzɔ de dzi ʋĩi abe dzudzɔti me wòle dodom tso ene; to blibo la le ʋuʋum sesĩe ŋutɔ.
      sbs: 0.683
      gen_sec: 6.02
      ref_sec: 8.76
    '8':
      text: Eya ta azɔ la miʋu miaƒe nuvɔ̃ me na Aƒetɔ, mia tɔgbuiwo ƒe Mawu la, eye miawɔ eƒe lɔlɔ̃nu.
      sbs: 0.6959
      gen_sec: 6.3
      ref_sec: 9.64
    '9':
      text: Ewɔ ɖeka kple Ahab to via nyɔnuvi ɖeka ɖeɖe me.
      sbs: 0.7381
      gen_sec: 3.33
      ref_sec: 3.54
    '10':
      text: Nuku bubuwo ge ɖe ŋu me, eye ŋu vu tsyɔ wo dzi woku.
      sbs: 0.7697
      gen_sec: 3.04
      ref_sec: 4.04
    '11':
      text: Ɣe ma ɣi la, Gaal, Ebed ƒe vi, ʋu kple nɔviawo yi Sekem eye wòzu ame ŋkutawo dometɔ ɖeka le
        dua me.
      sbs: 0.7132
      gen_sec: 6.98
      ref_sec: 8.72
    '12':
      text: Eɖo Selax tá la ƒe gli si le fia ƒe abɔ kple atrakpui si ɖiɖi tso David ƒe du me, dome la.
      sbs: 0.6935
      gen_sec: 6.34
      ref_sec: 9.14
    '13':
      text: Vi lae tsɔ eƒe nya ƒe ŋusẽ la lé xexeme blibo la ɖe te.
      sbs: 0.6761
      gen_sec: 3.97
      ref_sec: 6.5
    '14':
      text: avifafa kple nublanuiɣli ɖi bobobo; Rahel nɔ avi dzi le viawo ta.
      sbs: 0.743
      gen_sec: 4.51
      ref_sec: 5.52
    '15':
      text: Megblɔ na wo be miɖo to nye gbe, eye miwɔ nu siwo katã megblɔ na mi la.
      sbs: 0.684
      gen_sec: 5.28
      ref_sec: 5.9
    '16':
      text: Woatsi ado xoxo abe awu ene.
      sbs: 0.6796
      gen_sec: 2.21
      ref_sec: 3.52
    '17':
      text: Ne èkplɔ mí ɖo la, àkpɔ gome le nu nyui siwo katã Yehowa wɔna na mí la me.
      sbs: 0.7167
      gen_sec: 5.09
      ref_sec: 6.4
    '19':
      text: Migakpa kpeawo kple dɔwɔnu aɖeke o, elabena ne miekpa wo la, womagadze be woawɔ wo ŋu dɔ hena
        vɔsamlekpuiɖiɖi nam o.
      sbs: 0.7315
      gen_sec: 8.19
      ref_sec: 10.74
    '20':
      text: Kpɔ ɖa, àyɔ dukɔ siwo mènya o la vɛ.
      sbs: 0.6888
      gen_sec: 2.62
      ref_sec: 3.78
    '21':
      text: Esi nètsrɔ̃ dukɔ geɖewo ta la, wò hã atsrɔ̃.
      sbs: 0.6804
      gen_sec: 3.17
      ref_sec: 4.4
    '22':
      text: Èlɔ̃ dzɔdzɔenyenye, eye nèlé fu ŋutasesẽ, eya ta Mawu.
      sbs: 0.7187
      gen_sec: 3.9
      ref_sec: 4.72
    '23':
      text: Ɖewo ge ɖe kpenyigba dzi, afi si anyi mesɔ gbɔ le o.
      sbs: 0.7006
      gen_sec: 3.42
      ref_sec: 4.32
    '24':
      text: Benui, Xenadad vi, dzra akpa si kplɔe ɖo la ɖo.
      sbs: 0.6953
      gen_sec: 3.33
      ref_sec: 4.34
    '25':
      text: Wotsɔa gliɖolawo kple atikpalawo be woaɖɔ Yehowa ƒe gbedoxɔ la ɖo.
      sbs: 0.751
      gen_sec: 4.67
      ref_sec: 5.48
    '26':
      text: Eda gbe le dɔlélawo katã ŋu, eye wòde se na wo be womagana amewo nadze si ye o.
      sbs: 0.7118
      gen_sec: 5.86
      ref_sec: 11.8
    '27':
      text: Wosa vɔ geɖe gbe ma gbe kple aseyetsotso gã elabe Mawu na dzidzɔ yɔ ame sia ame ƒe dzime.
      sbs: 0.7011
      gen_sec: 6.43
      ref_sec: 7.4
    '28':
      text: Egblɔ na wo be, “Enyo, maɖe egɔme na mi.
      sbs: 0.791
      gen_sec: 2.75
      ref_sec: 3.54
    '30':
      text: 'Aƒetɔ gblɔ na Mose kple Aron le Egipte-nyigba dzi be: “Ɣleti sia nanye ɣleti vevitɔ na mi
        le ƒèa me.'
      sbs: 0.6851
      gen_sec: 6.94
      ref_sec: 6.72
    '32':
      text: Esi wònɔ nukua wum la, ɖewo ge ɖe mɔ to, eye xeviwo va fɔ wo mi.
      sbs: 0.7741
      gen_sec: 4.29
      ref_sec: 5.12
    '33':
      text: Aƒetɔ ayra wò dɔwɔwɔwo katã, eye nu ayɔ wò ava taŋ.
      sbs: 0.7143
      gen_sec: 3.81
      ref_sec: 5.1
    '34':
      text: 'Mema hadzilaawo ɖe akpa eve me: akpa gbãtɔ to ɖusime le glia dzi ɖo ta Akɔligbo la gbɔ.'
      sbs: 0.6959
      gen_sec: 6.27
      ref_sec: 7.02
    '35':
      text: Aƒetɔ akplɔ ƒoƒoe aƒu wò abe ale si wòwɔ Egiptetɔwo ene.
      sbs: 0.6956
      gen_sec: 4.06
      ref_sec: 6.44
    '36':
      text: Elabe èkɔ amewo ƒe ʋu ɖi.
      sbs: 0.6794
      gen_sec: 1.92
      ref_sec: 3.0
    '37':
      text: Woŋlɔ agbalẽ la kple Aramaik alfabeta ɖe Aramaikgbe me.
      sbs: 0.688
      gen_sec: 4.03
      ref_sec: 5.04
    '38':
      text: Benyamin kple Xasub dzra akpa si kplɔ nunɔlaawo tɔ ɖo la ɖo.
      sbs: 0.6709
      gen_sec: 4.03
      ref_sec: 5.64
    '39':
      text: Hlɔ̃wo ƒe tatɔwo akpe eve alafa ade nɔ aʋalɔglo siawo nu.
      sbs: 0.7303
      gen_sec: 3.97
      ref_sec: 5.08
    '40':
      text: '” Yesu ɖo eŋu be: “Ɖe miexlẽ nu si David wɔ, esime dɔ wu eya kple eŋutimewo kpɔ oa?'
      sbs: 0.694
      gen_sec: 5.6
      ref_sec: 7.1
    '41':
      text: Egblɔ nɛ be, “Tso nàkplɔ ɖevi la kple dadaa atrɔ ayi Israelnyigba dzi, elabena ame siwo le
        ɖevi la ƒe agbe yome tim la ku!
      sbs: 0.7699
      gen_sec: 8.58
      ref_sec: 9.66
    '42':
      text: 'Solomo ƒe dɔlawo ƒe dzidzimeviwoe nye: Sotai, Hasoferet, Peruda.'
      sbs: 0.697
      gen_sec: 4.58
      ref_sec: 6.2
    '43':
      text: 'Yoyada kple viawo si ami nɛ, eye wodo ɣli be: “Fia nenɔ agbe tegbee!'
      sbs: 0.6964
      gen_sec: 4.74
      ref_sec: 6.44
    '44':
      text: Esime Yehu nɔ to hem na Axab ƒe ƒomea la, edo go Yuda-megãwo kple Axazya nɔviŋutsu ƒe viwo,
        ame siwo subɔa Axazya eye wòwu wo.
      sbs: 0.6922
      gen_sec: 9.18
      ref_sec: 12.92
    '45':
      text: Aron nye kɔ kpɔe, eye kpɔ ɖa, Miriam dze anyi.
      sbs: 0.7141
      gen_sec: 3.01
      ref_sec: 4.38
    '47':
      text: Miklã mia ɖokui ɖa tso anyigba la dzi tɔwo kple mia srɔ̃, dukɔ bubu me nyɔnuawo gbɔ.
      sbs: 0.698
      gen_sec: 5.34
      ref_sec: 7.14
    '48':
      text: Eya ta Yerusalemnɔlawo tsɔ Axazya, Yoram ƒe dɔmlɔea ɖo fiae ɖe eteƒe eye Axazya, Yuda-fia
        Yoram viŋutsu zu fia.
      sbs: 0.6993
      gen_sec: 8.35
      ref_sec: 12.84
    '49':
      text: Esi wova ɖo toa te la, wokpɔ ameha gã aɖe nɔ afi ma nɔ wo lalam.
      sbs: 0.7613
      gen_sec: 4.51
      ref_sec: 5.48
    '50':
      text: Atrakpui ewo le eŋu woflɔna dea edzi.
      sbs: 0.7069
      gen_sec: 2.46
      ref_sec: 3.08
    '51':
      text: Miawo ŋutɔ miekpɔ nu si Yehowa wɔ le Baal Peor kple miaƒe ŋkuwo.
      sbs: 0.7043
      gen_sec: 3.97
      ref_sec: 5.58
    '52':
      text: Ale esia hã ganye bometsitsi kple dagbadagba ɖe yame ko.
      sbs: 0.7667
      gen_sec: 4.45
      ref_sec: 5.38
    '53':
      text: Nenema kee wotsɔa gayibɔ kple akɔbli dɔwɔlawo be woaɖɔ gbedoxɔ la ɖo.
      sbs: 0.7516
      gen_sec: 4.96
      ref_sec: 5.3
    '54':
      text: “Miegado dɔmedzoe na Aƒetɔ le Tabera, Masa kple Kibrot-Hatava hã.
      sbs: 0.6958
      gen_sec: 4.99
      ref_sec: 7.04
    '55':
      text: eye ame siwo ɖea fu na Yuda la, aɖe ɖa.
      sbs: 0.6986
      gen_sec: 2.98
      ref_sec: 3.96
    '56':
      text: enɔ nam abe waintsetse le gbegbe ene; esi medo go wo fofowo la.
      sbs: 0.7181
      gen_sec: 4.45
      ref_sec: 4.82
    '57':
      text: “ ‘O, wò Betlehem, le Yudanyigba dzi.
      sbs: 0.745
      gen_sec: 2.56
      ref_sec: 3.68
    '58':
      text: Yorah ƒe dzidzimeviwo, ame alafa ɖeka kple wuieve .
      sbs: 0.7237
      gen_sec: 3.49
      ref_sec: 4.14
    '59':
      text: Hiã si atu wò la azu ŋɔdzi gã ŋutɔ na fiaɖuƒewo katã le anyigba dzi.
      sbs: 0.6897
      gen_sec: 5.09
      ref_sec: 5.72
    '61':
      text: Esi xɔtulawo ɖo Aƒetɔ ƒe gbedoxɔa gɔme anyi vɔ la, nunɔlawo le woƒe awuwo me lé kpẽwo ɖe asi
        va ɖo ɖi.
      sbs: 0.7026
      gen_sec: 7.2
      ref_sec: 10.14
    '62':
      text: dzata kple nyi dami woanɔ wo nɔewo gbɔ le ŋutifafa me.
      sbs: 0.7575
      gen_sec: 3.78
      ref_sec: 3.98
    '63':
      text: “Elabena mato Egiptenyigba la dzi le zã sia me, eye mawu ŋgɔgbevi ɖe sia ɖe, amewo kple lãwo
        tɔwo siaa.
      sbs: 0.7317
      gen_sec: 7.1
      ref_sec: 7.94
    '64':
      text: Gawu la, woate ŋu aɖu ame ɖeka dzi bɔbɔe.
      sbs: 0.7661
      gen_sec: 2.98
      ref_sec: 3.08
    '65':
      text: siwo katã avɔlɔ̃lawo lɔ̃ aɖaŋutɔe la na wo.
      sbs: 0.7093
      gen_sec: 3.33
      ref_sec: 4.0
    '66':
      text: 'Ale si mianɔ hafi aɖui nye esi: mido miaƒe awuwo, miabla wo dzi kple alidziblaka.'
      sbs: 0.7398
      gen_sec: 5.5
      ref_sec: 6.9
    '70':
      text: “Agbletɔ la ɖo eŋu na wo be, ‘Futɔ aɖe kokokoe wɔ nenem nu sia.
      sbs: 0.7681
      gen_sec: 4.26
      ref_sec: 4.3
    '71':
      text: Noe nàɖe amama eye ŋukpe nava dziwò le ŋutikɔkɔeteƒe.
      sbs: 0.7055
      gen_sec: 4.13
      ref_sec: 5.54
    '72':
      text: Miyi ɖe towo dzi ne miatso atiwo vɛ ne miatsɔ agbugbɔ atu nye gbedoxɔe.
      sbs: 0.7057
      gen_sec: 4.96
      ref_sec: 5.62
    '73':
      text: Mawu wɔ Via wòzu gã wu mawudɔlawo, elabe ŋkɔ si Mawu va tsɔ nɛ la xɔ asi wu mawudɔlawo tɔ.
      sbs: 0.6847
      gen_sec: 6.18
      ref_sec: 10.9
    '75':
      text: Emegbe la, Levitɔ aɖewo wɔ dɔ le Rehum, Bani ƒe vi, te.
      sbs: 0.7132
      gen_sec: 3.87
      ref_sec: 4.88
    '76':
      text: Nunɔla Ezra tia ƒometatɔwo tso aƒekɔ ɖe sia ɖe me heyɔ woƒe ŋkɔwo ɖekaɖeka.
      sbs: 0.7126
      gen_sec: 5.82
      ref_sec: 7.24
    '77':
      text: Omer ɖeka nye efa ƒe memama ewolia.
      sbs: 0.6844
      gen_sec: 2.94
      ref_sec: 6.14
    '79':
      text: Barux, Zabai vi, dzra akpa si va ɖe Eser tɔ yome la ɖo va se ɖe nunɔlagã Elyasib ƒe agbo nu.
      sbs: 0.6957
      gen_sec: 6.85
      ref_sec: 10.68
    '80':
      text: Wò ame siwo le Dibon la lũ ta kolikoli.
      sbs: 0.7438
      gen_sec: 3.01
      ref_sec: 4.04
    '81':
      text: Ameawo lala, wogakplɔe gbɔe hafi wogayi mɔzɔzɔ la dzi.
      sbs: 0.7319
      gen_sec: 3.84
      ref_sec: 5.34
    '82':
      text: Woawoe nye Azarya, Yeroxam vi, Ismael, Yehohanan vi, Azarya, Obed vi, Maaseya, Adaya vi kple
        Elisafat, Zixri vi.
      sbs: 0.6889
      gen_sec: 8.22
      ref_sec: 14.68
    '83':
      text: 'Miagblɔ gbe ma gbe be: “Mida akpe na Aƒetɔ!'
      sbs: 0.7022
      gen_sec: 2.85
      ref_sec: 3.7
    '84':
      text: Esi ameawo se sedede sia la, woɖe amedzro siwo katã tsaka wo la le wo dome.
      sbs: 0.712
      gen_sec: 6.05
      ref_sec: 6.88
    '85':
      text: eye wonaa nuku nuƒãla kple abolo nuɖula.
      sbs: 0.6778
      gen_sec: 2.94
      ref_sec: 5.32
    '86':
      text: Ale Mose gblɔ na Aron be, “Gblɔ na Israelviwo katã be, ‘Miva Yehowa ŋkume, elabena ese miaƒe
        liʋĩliʋĩlilĩ.
      sbs: 0.7314
      gen_sec: 7.26
      ref_sec: 8.34
    '87':
      text: Dadaa gblɔ nɛ be nebia Yohanes Mawutsidetanamela ƒe ta.
      sbs: 0.7763
      gen_sec: 4.32
      ref_sec: 4.12
    '88':
      text: Elabe àŋlɔ wò ɖetugbime ŋukpe be.
      sbs: 0.6803
      gen_sec: 2.37
      ref_sec: 3.06
    '90':
      text: Yoyada bla nu kple dukɔ blibo la kple fia la be yewoanye Aƒetɔ ƒe dukɔ.
      sbs: 0.7039
      gen_sec: 5.15
      ref_sec: 5.6
    '91':
      text: Eya ta ŋutsu agblẽ fofoa kple dadaa ɖi alé ɖe srɔ̃a ŋu ɖikaa, eye wo kple eve la woazu ŋutilã
        ɖeka.
      sbs: 0.7832
      gen_sec: 6.91
      ref_sec: 7.28
    '92':
      text: Nenema ke, wotsɔ waintsetse, gbotitsetse kple agbà ƒomevi vovovowo do agba na woƒe tedziwo
        hetsɔ va Yerusalem le dzudzɔgbe la.
      sbs: 0.7033
      gen_sec: 8.83
      ref_sec: 11.5
    '93':
      text: Miɖi vɔsamlekpuiwo ɖe teƒe siwo mafia mi la ko, eye mava yra mi le teƒe mawo.
      sbs: 0.7532
      gen_sec: 5.5
      ref_sec: 6.24
    '94':
      text: Miɖe asi le wo ŋu.
      sbs: 0.6976
      gen_sec: 1.31
      ref_sec: 4.2
    '95':
      text: Mi gbemelãwo katã kple avemelãwo katã.
      sbs: 0.6949
      gen_sec: 3.26
      ref_sec: 3.0
    '96':
      text: Etsɔ wo dometɔ akpe blaadre wɔ agbatetsɔlawo, ame akpe blaenyi wɔ atitsolawo eye wòtsɔ ame
        akpe etɔ̃ alafa ade wɔ dɔdzikpɔlawoe.
      sbs: 0.7432
      gen_sec: 9.22
      ref_sec: 13.9
    '97':
      text: Asi aɖeke negaka nenem me ma ŋu o; ne wòkae la, woaƒu kpee alo adae; eɖanye ame alo lã o,
        maganɔ agbe o.
      sbs: 0.6912
      gen_sec: 7.94
      ref_sec: 12.36
    '98':
      text: Tete Yoyada kplɔ Yoas doe, ɖɔ fiakuku la nɛ, eye wòtsɔ nubablagbalẽ la de esi.
      sbs: 0.7066
      gen_sec: 5.5
      ref_sec: 7.02
    '99':
      text: Àkpɔe le nyaŋlɔɖiawo me be du sia nye du dzeaglã si ɖea fu na fiawo kple nutometɔwo, teƒe
        si aglãdzedze le tso keke blema ke.
      sbs: 0.6942
      gen_sec: 8.77
      ref_sec: 9.92
    '100':
      text: Yehoram xɔ ƒe blaetɔ̃-vɔ-eve esi wòzu fia.
      sbs: 0.7279
      gen_sec: 3.2
      ref_sec: 3.64
    '101':
      text: Miɖe gbeƒã Yehowa, elabena ewɔ nu dzɔatsuwo.
      sbs: 0.7985
      gen_sec: 3.14
      ref_sec: 3.1
    '102':
      text: Ke Yesu bia wo be, “Miexlẽ nu si Fia David kple eŋutimewo wɔ esi dɔ wu wo la oa?
      sbs: 0.7676
      gen_sec: 5.15
      ref_sec: 6.94
    '103':
      text: Miɖe asi le Mawu ƒe gbedoxɔ si tum wole la ƒe nya me.
      sbs: 0.7006
      gen_sec: 3.74
      ref_sec: 3.58
    '104':
      text: Nɔae nye Yerusa, Zadok vinyɔnu.
      sbs: 0.6884
      gen_sec: 2.34
      ref_sec: 3.28
    '105':
      text: Dzata aɖo Moab ƒe aʋasilawo.
      sbs: 0.7372
      gen_sec: 2.27
      ref_sec: 3.16
    '106':
      text: Hadzilaawo nɔ ha xlãm ɖe me, le woƒe nunɔla Yizraxya ƒe kpɔkplɔ te.
      sbs: 0.6895
      gen_sec: 4.51
      ref_sec: 6.24
    '107':
      text: Eƒe akpata dze ŋgɔ xɔxɔnu kɔtoe tɔ, eye detiwo le domegliawo ƒe akpa eve.
      sbs: 0.7029
      gen_sec: 5.38
      ref_sec: 7.48
    '108':
      text: Medo dɔmedzoe, trɔ megbe de wò vie ya; ke matsɔ lɔlɔ̃ si nu metsina o la.
      sbs: 0.6564
      gen_sec: 4.93
      ref_sec: 6.9
    '109':
      text: Ater dzidzimeviwo, to Hezekia dzi, ame blaasieke-vɔ-enyi .
      sbs: 0.7116
      gen_sec: 4.0
      ref_sec: 4.92
    '110':
      text: Edomtɔwo ƒe aʋakɔwo va ƒo xlã wo; ke le zã me la, wosi wo.
      sbs: 0.7041
      gen_sec: 4.0
      ref_sec: 6.4
    '111':
      text: Aƒetɔ do ŋugbe be yeayra dukɔ la.
      sbs: 0.6932
      gen_sec: 2.59
      ref_sec: 10.88
    '112':
      text: Gbe ma gbe la, Yese ƒe ke la anye aflaga na anyigbadzitɔwo katã.
      sbs: 0.7713
      gen_sec: 4.83
      ref_sec: 4.72
    '113':
      text: Semaya, Sekania ƒe vi, Ɣedzeƒegbo la ŋudzɔla, kplɔe ɖo.
      sbs: 0.7209
      gen_sec: 3.97
      ref_sec: 5.24
    '115':
      text: Woɖo eŋu nɛ be, “Woadzi Kristo la le Betlehem le Yudea, elabena nenema woŋlɔe ɖi to nyagblɔɖila
        la dzi bena.
      sbs: 0.7716
      gen_sec: 7.49
      ref_sec: 9.56
    '116':
      text: woɖe woƒe fulélewo fia le dutoƒo, eye wowɔ esia hã.
      sbs: 0.7157
      gen_sec: 3.62
      ref_sec: 3.94
    '117':
      text: Ɖe nèle didim be yeawu nye hã abe ale si nèwu Egiptetɔ ma etsɔ enea?
      sbs: 0.7218
      gen_sec: 4.96
      ref_sec: 5.44
    '119':
      text: Eyɔ Mose be wòava to la dzi, eye Mose lia to la yi egbɔ.
      sbs: 0.7531
      gen_sec: 4.03
      ref_sec: 4.52
    '120':
      text: “Ɖo sedatikpo siwo tɔgbi nena fofonye David esime wònɔ eƒe fiasã tum la ƒe ɖewo nye hã.
      sbs: 0.7255
      gen_sec: 6.66
      ref_sec: 7.44
    '122':
      text: Dzidzɔseyea tɔtɔ kple avifafa sesẽ la ale gbegbe be womeganya kae nye ka o, eye hoowɔwɔ la
        ɖi de didiƒe ʋĩi.
      sbs: 0.7172
      gen_sec: 8.16
      ref_sec: 13.0
    '123':
      text: Le esiawo megbe la, Yehowa na dɔléle dze Fia Yehoram ƒe dɔmenuwo dzi.
      sbs: 0.7292
      gen_sec: 4.74
      ref_sec: 5.42
    '125':
      text: Matanya, Bakbukya, Obadya, Mesulam, Talmon kple Akub nye agbonudzɔlawo.
      sbs: 0.6735
      gen_sec: 5.28
      ref_sec: 9.38
    '126':
      text: Ŋutsu aɖe, si siti lé asi na la le afi ma.
      sbs: 0.6961
      gen_sec: 3.07
      ref_sec: 4.02
    '127':
      text: Israelviwo ɖo Sinai-to la gbɔ.
      sbs: 0.6965
      gen_sec: 2.05
      ref_sec: 3.7
    '128':
      text: Ewɔla le dzi ɖom ɖe nu si eya ŋutɔ wɔ la ŋu.
      sbs: 0.6711
      gen_sec: 2.91
      ref_sec: 4.68
    '129':
      text: Eva kpɔ dzonu aɖe si xɔ asi ŋutɔ, eya ta eyi ɖadzra nu siwo katã le esi la, eye wòƒle dzonu
        sia.
      sbs: 0.7769
      gen_sec: 7.01
      ref_sec: 7.74
    '131':
      text: Yesu xlɔ̃ nu wo vevie gblɔ be, “Mikpɔ nyuie le Zadukitɔwo kple Farisitɔwo ƒe amɔʋãnu ŋuti.
      sbs: 0.7831
      gen_sec: 5.92
      ref_sec: 6.24
    '132':
      text: Gawu la, eganya ale si wòaɖe nɔnɔmetata vovovowo ɖe nuwo dzi eye wòtoa nu yeyewo hã vɛ.
      sbs: 0.7324
      gen_sec: 6.43
      ref_sec: 7.62
    '134':
      text: Yotam yi edzi be, “Ɖe miewɔ nu dzɔdzɔe ɖe Yerubaal kple eƒe dzidzimeviwo ŋu be mietsɔ Abimelek
        ɖo fia mahã?
      sbs: 0.7006
      gen_sec: 7.36
      ref_sec: 7.64
    '135':
      text: Tete wòkplɔm yi xɔxɔnu ememetɔ la me to anyigbemegbo la nu.
      sbs: 0.692
      gen_sec: 4.13
      ref_sec: 5.46
    '136':
      text: Wo viwo ƒe afã doa Asdod-gbe, ke womete ŋu doa Yuda-gbe o; dukɔ bubuwo ƒe gbe ko wodona.
      sbs: 0.7079
      gen_sec: 5.82
      ref_sec: 9.24
    '137':
      text: Gawu la, Yehoram wɔ nuxeƒewo ɖe Yuda ƒe towo dzi eye wòzi eƒe amewo dzi be woasubɔ legbawo.
      sbs: 0.7324
      gen_sec: 6.5
      ref_sec: 8.26
    '138':
      text: Nunɔlawo ƒe viwo dometɔ aɖewo lé kpẽwo ɖe asi kplɔ wo ɖo.
      sbs: 0.7131
      gen_sec: 3.71
      ref_sec: 5.68
    '139':
      text: Ðe ame siwo katã dzi wòɖu la mado hamelo, asi ahama le eŋuti oa?
      sbs: 0.6669
      gen_sec: 4.8
      ref_sec: 8.52
    '140':
      text: Woatsɔ ga le fia la ƒe gaɖaka me axe fee ɖe dɔ la ta.
      sbs: 0.7087
      gen_sec: 3.9
      ref_sec: 4.78
    '141':
      text: Ame siwo tso Yeriko le ame alafa etɔ̃ kple blaene-vɔ-atɔ̃ .
      sbs: 0.7172
      gen_sec: 4.16
      ref_sec: 4.74
    '142':
      text: Mitsɔm ɖo fiae eye enumake miakpɔ nu si adzɔ ɖe Abimelek dzi!
      sbs: 0.7127
      gen_sec: 4.74
      ref_sec: 4.4
    '144':
      text: Tso mía fofowo ŋɔli ke va se ɖe fifia la, míaƒe nu vɔ̃wo kpe ŋutɔ.
      sbs: 0.6905
      gen_sec: 4.35
      ref_sec: 5.0
    '145':
      text: Ne mieɖo la, miawo ŋutɔ miadzra mia ɖokui kluvi kple kosiwoe na miaƒe futɔwo, ke ame aɖeke
        madi mi be yeaƒle mi o.
      sbs: 0.6943
      gen_sec: 7.94
      ref_sec: 13.58
    '146':
      text: Gbe ɖeka la, Farisitɔwo kple Zadukitɔwo va be yewoado Yesu kpɔ; wobia tso esi be wòana dzesi
        yewo tso dziƒo.
      sbs: 0.7746
      gen_sec: 7.84
      ref_sec: 8.42
    '148':
      text: Ame si wɔa amewo kɔkɔe kple ame siwo wowɔ kɔkɔe la katã nye ƒome ɖeka me nɔlawo.
      sbs: 0.7241
      gen_sec: 5.7
      ref_sec: 7.28
    '149':
      text: Woɖi Ahazia abe fia ene elabena Fia Yehosafat, ame si subɔ Yehowa kple dzi blibo la ƒe tɔgbuiyɔvie.
      sbs: 0.7385
      gen_sec: 7.36
      ref_sec: 8.7
    '150':
      text: menye Yudatɔwo ƒe du sue maxɔŋkɔ aɖe ko nènye o.
      sbs: 0.7792
      gen_sec: 3.55
      ref_sec: 3.46
    '151':
      text: Yesu ɖo eŋu na wo be, “Miawo hã, nu ka ta miaƒe kɔnuwo tsi tsitre ɖe Mawu ƒe sewo ŋuti ɖo?
      sbs: 0.7763
      gen_sec: 5.95
      ref_sec: 6.94
    '152':
      text: “Dziƒofiaɖuƒe la le abe kesinɔnu aɖe si ŋu ame aɖe va ke ɖo le anyigba aɖe me ene.
      sbs: 0.7809
      gen_sec: 6.05
      ref_sec: 6.32
    '153':
      text: Vi nono afe le ƒli ƒe do nu.
      sbs: 0.6462
      gen_sec: 2.05
      ref_sec: 3.34
    '154':
      text: “Megale egblɔm na mi be, dziƒofiaɖuƒe la ɖi dzonusitsala si le dzonu nyuiwo dim be yeaƒle
        adzra la.
      sbs: 0.7748
      gen_sec: 7.07
      ref_sec: 8.48
    '155':
      text: Sefatia ƒe viwo le ame alafa etɔ̃ kple blaadre-vɔ-eve .
      sbs: 0.7225
      gen_sec: 3.9
      ref_sec: 5.4
    '156':
      text: O Israel, togbɔ be nèle gbɔlo wɔm hã la.
      sbs: 0.7147
      gen_sec: 2.78
      ref_sec: 3.2
    '157':
      text: Ame siwo tso Rama kple Geba le ame alafa ade kple blaeve-vɔ-ɖekɛ .
      sbs: 0.7023
      gen_sec: 4.93
      ref_sec: 5.26
    '158':
      text: Dadae nye Yerusa, Zadok ƒe vinyɔnu.
      sbs: 0.7535
      gen_sec: 2.62
      ref_sec: 3.28
    '159':
      text: Abimelek kple eƒe amewo zɔ mɔ le zã me, woma ɖe akpa ene me eye wode xa ɖe teƒe vovovowo ƒo
        xlã dua.
      sbs: 0.7022
      gen_sec: 7.01
      ref_sec: 7.02
    '161':
      text: Etrɔ yi fofoawo de, eye wòfia nu le woƒe ƒuƒoƒe, ke ewɔ nuku na wo ŋutɔ.
      sbs: 0.7782
      gen_sec: 4.86
      ref_sec: 6.28
    '162':
      text: Tete wòkplɔm ɖo ta anyigbeme, eye kpɔ ɖa, agbo aɖe le anyigbeme.
      sbs: 0.7111
      gen_sec: 4.1
      ref_sec: 5.02
    '163':
      text: Esi Siria ƒe aʋakɔ la dzo la, Yoas tsi aba dzi le abi gã si wòxɔ la ta.
      sbs: 0.7438
      gen_sec: 5.31
      ref_sec: 5.48
    '164':
      text: Akpa etɔ̃lia bubu nanɔ fiasã la me, eye akpa etɔ̃lia mamlɛa nanɔ Gɔmeɖoɖogbo la nu.
      sbs: 0.6844
      gen_sec: 6.08
      ref_sec: 9.38
    '165':
      text: Miakpɔ wo le Ziz to la kɔgo le balime si yi ɖe Yeruel gbegbe la ƒe nuwuwu!
      sbs: 0.7457
      gen_sec: 5.06
      ref_sec: 6.54
    '166':
      text: Wowɔ dɔ le gli la ŋu tso Aʋawɔnuxɔ la gbɔ le gli la ƒe dzogoe dzi.
      sbs: 0.7135
      gen_sec: 4.48
      ref_sec: 4.96
    '167':
      text: David ɖo wo be woasa Aƒetɔ ƒe numemevɔsa kple dzidzɔ kple hadzidzi abe ale si woŋlɔ ɖe Mose
        ƒe se la mee ene.
      sbs: 0.6948
      gen_sec: 7.71
      ref_sec: 10.5
    '168':
      text: '” Yesu ɖo eŋu na wo be: “Miexlẽe kpɔ be ame si wɔ ame le gɔmedzedzea me la, atsu kple asie
        wòwɔ woe oa?'
      sbs: 0.6991
      gen_sec: 6.78
      ref_sec: 9.3
    '169':
      text: Mieɖo ŋku edzi be menyi ame akpe atɔ̃ kple abolo atɔ̃, eye esi susɔ la yɔ kusiwo oa?
      sbs: 0.7834
      gen_sec: 5.98
      ref_sec: 8.12
    '170':
      text: Wotsɔ kpe siwo wofú la wɔ kplɔ̃ ene hena numemevɔsawo.
      sbs: 0.7105
      gen_sec: 3.84
      ref_sec: 3.72
    '171':
      text: Esi gbe la nɔ ɖiɖim alea la, dzidzi ƒo nusrɔ̃la etɔ̃awo, eye wotsyɔ mo anyi kple vɔvɔ̃.
      sbs: 0.7866
      gen_sec: 5.66
      ref_sec: 6.28
    '172':
      text: Xɔ lolo ŋutɔ mebe matu elabe mía Mawu la lolo wu mawu bubuwo katã.
      sbs: 0.6877
      gen_sec: 4.86
      ref_sec: 6.4
    '173':
      text: Baba na ame si gblɔ na atikpakpɛ be, ‘Gbɔ agbe!
      sbs: 0.7196
      gen_sec: 3.3
      ref_sec: 3.34
    '174':
      text: Wotsi tsitre ɖe adzɔge henɔ dzodzom nyanyanya kple vɔvɔ̃.
      sbs: 0.7292
      gen_sec: 3.87
      ref_sec: 3.3
    '175':
      text: Ale wòatsɔ vidzĩ si eya ŋutɔ dzi la aɖu le adzame, atsɔ amenɔ la hã akpe ɖe eŋuti.
      sbs: 0.6877
      gen_sec: 5.76
      ref_sec: 8.0
    '176':
      text: Le míaƒe nu vɔ̃wo ta la, wotsɔ yi he to na míawo ŋutɔ, míaƒe fiawo kple míaƒe nunɔlawo, eye
        woɖe aboyo mí.
      sbs: 0.7011
      gen_sec: 6.88
      ref_sec: 8.48
    '177':
      text: Ne ame le agbe ƒè geɖee la, nekpɔ dzidzɔ le wo katã me.
      sbs: 0.7188
      gen_sec: 3.84
      ref_sec: 4.8
    '178':
      text: Ame siawo wɔ dɔ le Yehoyakim, si nye Yesua vi kple Yozadak ƒe tɔgbuiyɔvi la ŋɔli.
      sbs: 0.6947
      gen_sec: 5.66
      ref_sec: 9.2
    '179':
      text: Le ŋkeke etɔ̃awo me la, ŋutsuwo katã tso Yuda kple Benyamin va kpe ta ɖe Yerusalem.
      sbs: 0.6912
      gen_sec: 6.11
      ref_sec: 7.08
    '180':
      text: eye woɖea gbe abe dzataviwo ene.
      sbs: 0.7765
      gen_sec: 2.53
      ref_sec: 3.14
    '182':
      text: eye wòaɖe gbeƒã nye ʋɔnudɔdrɔ̃ na trɔ̃subɔlawo.
      sbs: 0.6811
      gen_sec: 3.58
      ref_sec: 3.32
    '183':
      text: Esia hã nu dzodzro ko wònye; dɔ vloe.
      sbs: 0.7169
      gen_sec: 2.56
      ref_sec: 3.32
    '184':
      text: Woɖe asi le se si mede na wo la ŋu gɔ̃ xoxo eye wokɔ̀ legba na wo ɖokui.
      sbs: 0.7042
      gen_sec: 4.74
      ref_sec: 7.34
    '185':
      text: Xatus, Xasbneya vie dzra akpa si va ɖe esia yome la ɖo.
      sbs: 0.6847
      gen_sec: 4.16
      ref_sec: 6.4
    '187':
      text: Gbedoxɔmedɔwɔla siwo nɔ Ofel togbɛ dzi la, gbugbɔ gli la ɖo va ɖo Tsigbo ɣedzeƒetɔ la kple
        mɔ la ƒe xɔ tsrala gbɔ.
      sbs: 0.7088
      gen_sec: 7.65
      ref_sec: 9.42
    '190':
      text: ’ Mienya ale si miaɖe dziƒo ƒe nɔnɔme gɔme, gake mietea ŋu dzea si ɣeyiɣiwo ƒe dzesiwo o.
      sbs: 0.7883
      gen_sec: 5.95
      ref_sec: 7.44
    '191':
      text: Ena Israelviwo dome ɖekakpuiwo yi ɖawɔ numemevɔsawo na Aƒetɔ, eye wòna wotsɔ nyitsuwo sa ŋutifafavɔ
        hã nɛ.
      sbs: 0.6963
      gen_sec: 7.81
      ref_sec: 12.84
    '192':
      text: Nɔvi siwo tso Italia hã do gbe na mi.
      sbs: 0.7165
      gen_sec: 2.66
      ref_sec: 3.62
    '193':
      text: 'Esiwo tso Paxat-Moab viŋutsuwo dome: Adna, Xelal, Benaya, Maaseya, Matanya, Bezaleel, Binui
        kple Manase.'
      sbs: 0.6804
      gen_sec: 7.78
      ref_sec: 13.48
    '194':
      text: ” Ke esi ɖekakpui la se nya sia la, edzo kple nuxaxa, elabena enye kesinɔtɔ gã aɖe.
      sbs: 0.7807
      gen_sec: 6.24
      ref_sec: 6.4
    '195':
      text: O Aƒetɔ, ne metsɔ nya ɖe ŋuwò hã la.
      sbs: 0.671
      gen_sec: 2.82
      ref_sec: 3.1
    '197':
      text: Woɖii ɖe David ƒe du la me, ke womeɖii ɖe fiawo ɖiƒe o.
      sbs: 0.7094
      gen_sec: 3.68
      ref_sec: 7.46
    '198':
      text: 'Tso Pasur ƒe dzidzimeviwo dome: Elioenai, Maaseya, Ismael, Netanel, Yozabad kple Eleasa.'
      sbs: 0.7125
      gen_sec: 6.75
      ref_sec: 10.56
    '199':
      text: Etsɔ wo ɖo mawuwoe, dea ta agu na wo eye wòdoa dzudzɔ na wo.
      sbs: 0.7446
      gen_sec: 3.87
      ref_sec: 5.64
    '200':
      text: Tso gbe aɖe gbe ke, le David kple Asaf ŋɔli la, hɛnɔawo nɔa anyi nyea hadzilawo kplɔlawo,
        ne wole kafukafuhawo kple akpedahawo dzim na Mawu.
      sbs: 0.6988
      gen_sec: 9.15
      ref_sec: 12.74
    '202':
      text: Esia hã nu dzodzro kple yadɔ ko wònye.
      sbs: 0.7168
      gen_sec: 2.53
      ref_sec: 3.26
    '203':
      text: nana be ɖeɖi tea eŋu; elabe menya mɔ si.
      sbs: 0.7285
      gen_sec: 2.98
      ref_sec: 4.12
    '204':
      text: Ke zi atɔ̃lia la, Sanbalat ɖo eƒe dɔla ɖem kple gbedeasi ma ke, eye wòlé agbalẽ si nu wometre
        o la ɖe asi.
      sbs: 0.7063
      gen_sec: 7.84
      ref_sec: 7.82
    '205':
      text: Fesrewo ƒo xlãe kpe ɖe eƒe akpata la ŋuti.
      sbs: 0.6978
      gen_sec: 2.91
      ref_sec: 3.24
    '207':
      text: Nubablaɖaka la le wo ŋgɔ be yeatia teƒe si woatɔ ɖo la na wo.
      sbs: 0.7235
      gen_sec: 4.61
      ref_sec: 5.24
    '208':
      text: Yehowa gblɔ nya siawo na Mose be, “Gblɔ na Israelviwo be, ‘Miawo ŋutɔ miekpɔe be meɖe nye
        lɔlɔ̃nu fia mi tso dziƒo.
      sbs: 0.7259
      gen_sec: 7.23
      ref_sec: 9.38
    '210':
      text: Tete ameha blibo la de asi liʋiliʋĩlilĩ me le Mose kple Aron ŋu.
      sbs: 0.6847
      gen_sec: 4.35
      ref_sec: 5.08
    '212':
      text: Esi wòva la, eya kple Yoram wodo go be yewoaɖakpe Yehu, Nimsi vi, ame si Aƒetɔ si ami na be
        wòatsrɔ̃ Axab ƒe ƒome la.
      sbs: 0.689
      gen_sec: 8.48
      ref_sec: 11.74
    '213':
      text: Esi wonɔ elalam be wòava yi la, woda adzo ame siwo va to mɔ la dzi yina.
      sbs: 0.7232
      gen_sec: 5.28
      ref_sec: 5.48
    '214':
      text: Enye ame si ɖe Mawu ƒe nɔnɔme tututu fia, eye wòna agbe nuwo katã to eƒe ŋusẽnya la me.
      sbs: 0.7184
      gen_sec: 6.66
      ref_sec: 7.32
    '215':
      text: Betlehemtɔwo kple Netofatɔwo le ame alafa ɖeka kple blaenyi-vɔ-enyi .
      sbs: 0.7111
      gen_sec: 4.93
      ref_sec: 6.02
    '216':
      text: ’ Ne woku lãdzokpẽ he eme didie la, eya ko hafi woalia to la.
      sbs: 0.6979
      gen_sec: 4.22
      ref_sec: 7.44
    '217':
      text: Wo kple nunɔlawo, Levi viwo kple ame siwo katã tso aboyoa me va le Yerusalem lae dze dɔa gɔme.
      sbs: 0.7063
      gen_sec: 6.72
      ref_sec: 9.1
    '218':
      text: Ale ke magblẽ dɔa ɖi koŋ ko atso, be mava kpɔ mi le kɔƒe me?
      sbs: 0.6896
      gen_sec: 4.13
      ref_sec: 5.96
    '219':
      text: Agbledede doa dzidzɔ nɛ ale agble kple waingble geɖewo nɔ esi, le toawo ŋu kple balime afi
        si nukuwo nyona le nyuie.
      sbs: 0.7191
      gen_sec: 7.62
      ref_sec: 9.4
    '221':
      text: 'Egblɔ nam be: “Ge ɖe eme ne nàkpɔ ŋunyɔnuvɔ̃ɖi siwo wɔm wole le afi sia la ɖa.'
      sbs: 0.6874
      gen_sec: 5.47
      ref_sec: 5.86
    '222':
      text: Mana la ɖeɖe ko woɖu va se ɖe esime woɖo Kanaan-nyigba ƒe liƒo dzi.
      sbs: 0.6907
      gen_sec: 4.83
      ref_sec: 5.26
    '223':
      text: Mose bu ɖe lilikpo si tsyɔ to la tame la me, eye wònɔ afi ma ŋkeke blaene kple zã blaene.
      sbs: 0.7386
      gen_sec: 6.27
      ref_sec: 9.02
    '224':
      text: Evɔa, ele be woatsɔ nu sia nu si le asinye la nɛ!
      sbs: 0.7767
      gen_sec: 3.52
      ref_sec: 3.02
    '225':
      text: Eya ta wosɔ nu be yewo katã yewoaho aʋa ɖe Yerusalem ŋu aɖadze edzi, ade ʋunyaʋunya eme.
      sbs: 0.6692
      gen_sec: 6.66
      ref_sec: 9.36
    '226':
      text: Kuɖiɖi la nava amegbetɔwo, lãwo kple amegbetɔwo ƒe asinudɔwɔwɔ ɖe sia ɖe dzi.
      sbs: 0.7129
      gen_sec: 5.44
      ref_sec: 5.46
    '227':
      text: Ahab, Israel fia, bia Yuda fia, Yehosafat be, “Àte ŋu akpe ɖe ŋunye míaho aʋa ɖe Ramot Gilead
        ŋua?
      sbs: 0.7191
      gen_sec: 6.88
      ref_sec: 8.52
    '228':
      text: eye nàɖo wo ɖi hena wuwugbe.
      sbs: 0.6865
      gen_sec: 2.14
      ref_sec: 3.68
    '229':
      text: Woƒo xlã vɔsamlekpui la hã eye ame sia ame lé aʋawɔnu ɖe asi.
      sbs: 0.7006
      gen_sec: 4.32
      ref_sec: 5.9
    '230':
      text: Tete meda ŋku ɖi, eye kpɔ ɖa, mekpɔ nane si ɖi ame ƒe nɔnɔme.
      sbs: 0.699
      gen_sec: 4.38
      ref_sec: 5.3
    '232':
      text: “Elabe ale si tsi kple tsikpe dzana.
      sbs: 0.6989
      gen_sec: 2.5
      ref_sec: 3.68
  score: 0.7163
  partial: true
- model: k2-fsa/OmniVoice-ref
  sbs: 0.7196
  num_scored: 200
  uses_reference: true
  entries:
    '0':
      text: Mose ɖo nya sia ŋu na Yehowa be, “Ameawo mava Sinai toa dzi o, elabena ède se na wo be womekpɔ
        mɔ ava o.
      sbs: 0.7275
      gen_sec: 8.36
      ref_sec: 9.1
    '2':
      text: Esi Sanebalat se be míele glia ɖom la, eku dzi nɛ.
      sbs: 0.6975
      gen_sec: 4.36
      ref_sec: 5.5
    '3':
      text: ” Nyɔnua kɔ vidzĩa dzoe, eye wòɖakpɔ edzi.
      sbs: 0.7491
      gen_sec: 3.76
      ref_sec: 4.48
    '4':
      text: Fia Dario ɖe gbe be woayi dɔa dzi, eye wowu gbedoxɔa nu.
      sbs: 0.7255
      gen_sec: 4.88
      ref_sec: 6.22
    '5':
      text: Míawo ɖeɖe míatui na Aƒetɔ, Israel ƒe Mawu la abe ale si Persia-fia Kores ɖoe na mí la ene.
      sbs: 0.7187
      gen_sec: 7.28
      ref_sec: 7.74
    '7':
      text: Dzudzɔ de dzi ʋĩi abe dzudzɔti me wòle dodom tso ene; to blibo la le ʋuʋum sesĩe ŋutɔ.
      sbs: 0.7209
      gen_sec: 6.96
      ref_sec: 8.76
    '8':
      text: Eya ta azɔ la miʋu miaƒe nuvɔ̃ me na Aƒetɔ, mia tɔgbuiwo ƒe Mawu la, eye miawɔ eƒe lɔlɔ̃nu.
      sbs: 0.7237
      gen_sec: 7.56
      ref_sec: 9.64
    '9':
      text: Ewɔ ɖeka kple Ahab to via nyɔnuvi ɖeka ɖeɖe me.
      sbs: 0.6855
      gen_sec: 4.2
      ref_sec: 3.54
    '10':
      text: Nuku bubuwo ge ɖe ŋu me, eye ŋu vu tsyɔ wo dzi woku.
      sbs: 0.7008
      gen_sec: 4.4
      ref_sec: 4.04
    '11':
      text: Ɣe ma ɣi la, Gaal, Ebed ƒe vi, ʋu kple nɔviawo yi Sekem eye wòzu ame ŋkutawo dometɔ ɖeka le
        dua me.
      sbs: 0.7087
      gen_sec: 8.36
      ref_sec: 8.72
    '12':
      text: Eɖo Selax tá la ƒe gli si le fia ƒe abɔ kple atrakpui si ɖiɖi tso David ƒe du me, dome la.
      sbs: 0.7347
      gen_sec: 7.56
      ref_sec: 9.14
    '13':
      text: Vi lae tsɔ eƒe nya ƒe ŋusẽ la lé xexeme blibo la ɖe te.
      sbs: 0.6973
      gen_sec: 4.68
      ref_sec: 6.5
    '14':
      text: avifafa kple nublanuiɣli ɖi bobobo; Rahel nɔ avi dzi le viawo ta.
      sbs: 0.6936
      gen_sec: 5.8
      ref_sec: 5.52
    '15':
      text: Megblɔ na wo be miɖo to nye gbe, eye miwɔ nu siwo katã megblɔ na mi la.
      sbs: 0.8346
      gen_sec: 6.03
      ref_sec: 5.9
    '16':
      text: Woatsi ado xoxo abe awu ene.
      sbs: 0.6886
      gen_sec: 2.56
      ref_sec: 3.52
    '17':
      text: Ne èkplɔ mí ɖo la, àkpɔ gome le nu nyui siwo katã Yehowa wɔna na mí la me.
      sbs: 0.6967
      gen_sec: 6.24
      ref_sec: 6.4
    '19':
      text: Migakpa kpeawo kple dɔwɔnu aɖeke o, elabena ne miekpa wo la, womagadze be woawɔ wo ŋu dɔ hena
        vɔsamlekpuiɖiɖi nam o.
      sbs: 0.7196
      gen_sec: 10.24
      ref_sec: 10.74
    '20':
      text: Kpɔ ɖa, àyɔ dukɔ siwo mènya o la vɛ.
      sbs: 0.7304
      gen_sec: 3.08
      ref_sec: 3.78
    '21':
      text: Esi nètsrɔ̃ dukɔ geɖewo ta la, wò hã atsrɔ̃.
      sbs: 0.7155
      gen_sec: 3.72
      ref_sec: 4.4
    '22':
      text: Èlɔ̃ dzɔdzɔenyenye, eye nèlé fu ŋutasesẽ, eya ta Mawu.
      sbs: 0.6966
      gen_sec: 4.8
      ref_sec: 4.72
    '23':
      text: Ɖewo ge ɖe kpenyigba dzi, afi si anyi mesɔ gbɔ le o.
      sbs: 0.743
      gen_sec: 4.48
      ref_sec: 4.32
    '24':
      text: Benui, Xenadad vi, dzra akpa si kplɔe ɖo la ɖo.
      sbs: 0.7304
      gen_sec: 4.08
      ref_sec: 4.34
    '25':
      text: Wotsɔa gliɖolawo kple atikpalawo be woaɖɔ Yehowa ƒe gbedoxɔ la ɖo.
      sbs: 0.7319
      gen_sec: 5.6
      ref_sec: 5.48
    '26':
      text: Eda gbe le dɔlélawo katã ŋu, eye wòde se na wo be womagana amewo nadze si ye o.
      sbs: 0.7576
      gen_sec: 6.76
      ref_sec: 11.8
    '27':
      text: Wosa vɔ geɖe gbe ma gbe kple aseyetsotso gã elabe Mawu na dzidzɔ yɔ ame sia ame ƒe dzime.
      sbs: 0.7107
      gen_sec: 7.76
      ref_sec: 7.4
    '28':
      text: Egblɔ na wo be, “Enyo, maɖe egɔme na mi.
      sbs: 0.7203
      gen_sec: 3.4
      ref_sec: 3.54
    '30':
      text: 'Aƒetɔ gblɔ na Mose kple Aron le Egipte-nyigba dzi be: “Ɣleti sia nanye ɣleti vevitɔ na mi
        le ƒèa me.'
      sbs: 0.7319
      gen_sec: 8.24
      ref_sec: 6.72
    '32':
      text: Esi wònɔ nukua wum la, ɖewo ge ɖe mɔ to, eye xeviwo va fɔ wo mi.
      sbs: 0.699
      gen_sec: 5.32
      ref_sec: 5.12
    '33':
      text: Aƒetɔ ayra wò dɔwɔwɔwo katã, eye nu ayɔ wò ava taŋ.
      sbs: 0.7685
      gen_sec: 4.48
      ref_sec: 5.1
    '34':
      text: 'Mema hadzilaawo ɖe akpa eve me: akpa gbãtɔ to ɖusime le glia dzi ɖo ta Akɔligbo la gbɔ.'
      sbs: 0.7392
      gen_sec: 7.19
      ref_sec: 7.02
    '35':
      text: Aƒetɔ akplɔ ƒoƒoe aƒu wò abe ale si wòwɔ Egiptetɔwo ene.
      sbs: 0.724
      gen_sec: 4.56
      ref_sec: 6.44
    '36':
      text: Elabe èkɔ amewo ƒe ʋu ɖi.
      sbs: 0.7086
      gen_sec: 2.28
      ref_sec: 3.0
    '37':
      text: Woŋlɔ agbalẽ la kple Aramaik alfabeta ɖe Aramaikgbe me.
      sbs: 0.6854
      gen_sec: 5.08
      ref_sec: 5.04
    '38':
      text: Benyamin kple Xasub dzra akpa si kplɔ nunɔlaawo tɔ ɖo la ɖo.
      sbs: 0.7167
      gen_sec: 5.36
      ref_sec: 5.64
    '39':
      text: Hlɔ̃wo ƒe tatɔwo akpe eve alafa ade nɔ aʋalɔglo siawo nu.
      sbs: 0.7174
      gen_sec: 5.04
      ref_sec: 5.08
    '40':
      text: '” Yesu ɖo eŋu be: “Ɖe miexlẽ nu si David wɔ, esime dɔ wu eya kple eŋutimewo kpɔ oa?'
      sbs: 0.7197
      gen_sec: 6.31
      ref_sec: 7.1
    '41':
      text: Egblɔ nɛ be, “Tso nàkplɔ ɖevi la kple dadaa atrɔ ayi Israelnyigba dzi, elabena ame siwo le
        ɖevi la ƒe agbe yome tim la ku!
      sbs: 0.7093
      gen_sec: 10.07
      ref_sec: 9.66
    '42':
      text: 'Solomo ƒe dɔlawo ƒe dzidzimeviwoe nye: Sotai, Hasoferet, Peruda.'
      sbs: 0.7063
      gen_sec: 5.84
      ref_sec: 6.2
    '43':
      text: 'Yoyada kple viawo si ami nɛ, eye wodo ɣli be: “Fia nenɔ agbe tegbee!'
      sbs: 0.7256
      gen_sec: 5.06
      ref_sec: 6.44
    '44':
      text: Esime Yehu nɔ to hem na Axab ƒe ƒomea la, edo go Yuda-megãwo kple Axazya nɔviŋutsu ƒe viwo,
        ame siwo subɔa Axazya eye wòwu wo.
      sbs: 0.7241
      gen_sec: 10.88
      ref_sec: 12.92
    '45':
      text: Aron nye kɔ kpɔe, eye kpɔ ɖa, Miriam dze anyi.
      sbs: 0.7268
      gen_sec: 3.94
      ref_sec: 4.38
    '47':
      text: Miklã mia ɖokui ɖa tso anyigba la dzi tɔwo kple mia srɔ̃, dukɔ bubu me nyɔnuawo gbɔ.
      sbs: 0.7456
      gen_sec: 7.24
      ref_sec: 7.14
    '48':
      text: Eya ta Yerusalemnɔlawo tsɔ Axazya, Yoram ƒe dɔmlɔea ɖo fiae ɖe eteƒe eye Axazya, Yuda-fia
        Yoram viŋutsu zu fia.
      sbs: 0.7245
      gen_sec: 9.84
      ref_sec: 12.84
    '49':
      text: Esi wova ɖo toa te la, wokpɔ ameha gã aɖe nɔ afi ma nɔ wo lalam.
      sbs: 0.7074
      gen_sec: 5.32
      ref_sec: 5.48
    '50':
      text: Atrakpui ewo le eŋu woflɔna dea edzi.
      sbs: 0.6632
      gen_sec: 3.4
      ref_sec: 3.08
    '51':
      text: Miawo ŋutɔ miekpɔ nu si Yehowa wɔ le Baal Peor kple miaƒe ŋkuwo.
      sbs: 0.7199
      gen_sec: 5.68
      ref_sec: 5.58
    '52':
      text: Ale esia hã ganye bometsitsi kple dagbadagba ɖe yame ko.
      sbs: 0.7065
      gen_sec: 5.12
      ref_sec: 5.38
    '53':
      text: Nenema kee wotsɔa gayibɔ kple akɔbli dɔwɔlawo be woaɖɔ gbedoxɔ la ɖo.
      sbs: 0.7286
      gen_sec: 6.16
      ref_sec: 5.3
    '54':
      text: “Miegado dɔmedzoe na Aƒetɔ le Tabera, Masa kple Kibrot-Hatava hã.
      sbs: 0.7278
      gen_sec: 5.7
      ref_sec: 7.04
    '55':
      text: eye ame siwo ɖea fu na Yuda la, aɖe ɖa.
      sbs: 0.7387
      gen_sec: 3.32
      ref_sec: 3.96
    '56':
      text: enɔ nam abe waintsetse le gbegbe ene; esi medo go wo fofowo la.
      sbs: 0.7435
      gen_sec: 5.44
      ref_sec: 4.82
    '57':
      text: “ ‘O, wò Betlehem, le Yudanyigba dzi.
      sbs: 0.6963
      gen_sec: 3.16
      ref_sec: 3.68
    '58':
      text: Yorah ƒe dzidzimeviwo, ame alafa ɖeka kple wuieve .
      sbs: 0.7315
      gen_sec: 4.64
      ref_sec: 4.14
    '59':
      text: Hiã si atu wò la azu ŋɔdzi gã ŋutɔ na fiaɖuƒewo katã le anyigba dzi.
      sbs: 0.7386
      gen_sec: 5.75
      ref_sec: 5.72
    '61':
      text: Esi xɔtulawo ɖo Aƒetɔ ƒe gbedoxɔa gɔme anyi vɔ la, nunɔlawo le woƒe awuwo me lé kpẽwo ɖe asi
        va ɖo ɖi.
      sbs: 0.7397
      gen_sec: 8.74
      ref_sec: 10.14
    '62':
      text: dzata kple nyi dami woanɔ wo nɔewo gbɔ le ŋutifafa me.
      sbs: 0.7186
      gen_sec: 4.77
      ref_sec: 3.98
    '63':
      text: “Elabena mato Egiptenyigba la dzi le zã sia me, eye mawu ŋgɔgbevi ɖe sia ɖe, amewo kple lãwo
        tɔwo siaa.
      sbs: 0.7199
      gen_sec: 8.96
      ref_sec: 7.94
    '64':
      text: Gawu la, woate ŋu aɖu ame ɖeka dzi bɔbɔe.
      sbs: 0.7088
      gen_sec: 3.6
      ref_sec: 3.08
    '65':
      text: siwo katã avɔlɔ̃lawo lɔ̃ aɖaŋutɔe la na wo.
      sbs: 0.7813
      gen_sec: 3.72
      ref_sec: 4.0
    '66':
      text: 'Ale si mianɔ hafi aɖui nye esi: mido miaƒe awuwo, miabla wo dzi kple alidziblaka.'
      sbs: 0.7326
      gen_sec: 7.16
      ref_sec: 6.9
    '70':
      text: “Agbletɔ la ɖo eŋu na wo be, ‘Futɔ aɖe kokokoe wɔ nenem nu sia.
      sbs: 0.6926
      gen_sec: 5.36
      ref_sec: 4.3
    '71':
      text: Noe nàɖe amama eye ŋukpe nava dziwò le ŋutikɔkɔeteƒe.
      sbs: 0.7252
      gen_sec: 4.88
      ref_sec: 5.54
    '72':
      text: Miyi ɖe towo dzi ne miatso atiwo vɛ ne miatsɔ agbugbɔ atu nye gbedoxɔe.
      sbs: 0.7209
      gen_sec: 6.32
      ref_sec: 5.62
    '73':
      text: Mawu wɔ Via wòzu gã wu mawudɔlawo, elabe ŋkɔ si Mawu va tsɔ nɛ la xɔ asi wu mawudɔlawo tɔ.
      sbs: 0.7177
      gen_sec: 7.72
      ref_sec: 10.9
    '75':
      text: Emegbe la, Levitɔ aɖewo wɔ dɔ le Rehum, Bani ƒe vi, te.
      sbs: 0.7113
      gen_sec: 4.68
      ref_sec: 4.88
    '76':
      text: Nunɔla Ezra tia ƒometatɔwo tso aƒekɔ ɖe sia ɖe me heyɔ woƒe ŋkɔwo ɖekaɖeka.
      sbs: 0.73
      gen_sec: 6.25
      ref_sec: 7.24
    '77':
      text: Omer ɖeka nye efa ƒe memama ewolia.
      sbs: 0.7429
      gen_sec: 3.2
      ref_sec: 6.14
    '79':
      text: Barux, Zabai vi, dzra akpa si va ɖe Eser tɔ yome la ɖo va se ɖe nunɔlagã Elyasib ƒe agbo nu.
      sbs: 0.7151
      gen_sec: 7.8
      ref_sec: 10.68
    '80':
      text: Wò ame siwo le Dibon la lũ ta kolikoli.
      sbs: 0.6935
      gen_sec: 3.44
      ref_sec: 4.04
    '81':
      text: Ameawo lala, wogakplɔe gbɔe hafi wogayi mɔzɔzɔ la dzi.
      sbs: 0.7098
      gen_sec: 4.91
      ref_sec: 5.34
    '82':
      text: Woawoe nye Azarya, Yeroxam vi, Ismael, Yehohanan vi, Azarya, Obed vi, Maaseya, Adaya vi kple
        Elisafat, Zixri vi.
      sbs: 0.7256
      gen_sec: 9.76
      ref_sec: 14.68
    '83':
      text: 'Miagblɔ gbe ma gbe be: “Mida akpe na Aƒetɔ!'
      sbs: 0.7692
      gen_sec: 3.76
      ref_sec: 3.7
    '84':
      text: Esi ameawo se sedede sia la, woɖe amedzro siwo katã tsaka wo la le wo dome.
      sbs: 0.7277
      gen_sec: 6.52
      ref_sec: 6.88
    '85':
      text: eye wonaa nuku nuƒãla kple abolo nuɖula.
      sbs: 0.7317
      gen_sec: 3.72
      ref_sec: 5.32
    '86':
      text: Ale Mose gblɔ na Aron be, “Gblɔ na Israelviwo katã be, ‘Miva Yehowa ŋkume, elabena ese miaƒe
        liʋĩliʋĩlilĩ.
      sbs: 0.7194
      gen_sec: 9.16
      ref_sec: 8.34
    '87':
      text: Dadaa gblɔ nɛ be nebia Yohanes Mawutsidetanamela ƒe ta.
      sbs: 0.711
      gen_sec: 5.08
      ref_sec: 4.12
    '88':
      text: Elabe àŋlɔ wò ɖetugbime ŋukpe be.
      sbs: 0.728
      gen_sec: 3.08
      ref_sec: 3.06
    '90':
      text: Yoyada bla nu kple dukɔ blibo la kple fia la be yewoanye Aƒetɔ ƒe dukɔ.
      sbs: 0.7097
      gen_sec: 6.24
      ref_sec: 5.6
    '91':
      text: Eya ta ŋutsu agblẽ fofoa kple dadaa ɖi alé ɖe srɔ̃a ŋu ɖikaa, eye wo kple eve la woazu ŋutilã
        ɖeka.
      sbs: 0.7083
      gen_sec: 8.44
      ref_sec: 7.28
    '92':
      text: Nenema ke, wotsɔ waintsetse, gbotitsetse kple agbà ƒomevi vovovowo do agba na woƒe tedziwo
        hetsɔ va Yerusalem le dzudzɔgbe la.
      sbs: 0.7189
      gen_sec: 11.32
      ref_sec: 11.5
    '93':
      text: Miɖi vɔsamlekpuiwo ɖe teƒe siwo mafia mi la ko, eye mava yra mi le teƒe mawo.
      sbs: 0.7246
      gen_sec: 6.72
      ref_sec: 6.24
    '94':
      text: Miɖe asi le wo ŋu.
      sbs: 0.7312
      gen_sec: 2.0
      ref_sec: 4.2
    '95':
      text: Mi gbemelãwo katã kple avemelãwo katã.
      sbs: 0.7287
      gen_sec: 3.6
      ref_sec: 3.0
    '96':
      text: Etsɔ wo dometɔ akpe blaadre wɔ agbatetsɔlawo, ame akpe blaenyi wɔ atitsolawo eye wòtsɔ ame
        akpe etɔ̃ alafa ade wɔ dɔdzikpɔlawoe.
      sbs: 0.729
      gen_sec: 11.4
      ref_sec: 13.9
    '97':
      text: Asi aɖeke negaka nenem me ma ŋu o; ne wòkae la, woaƒu kpee alo adae; eɖanye ame alo lã o,
        maganɔ agbe o.
      sbs: 0.7622
      gen_sec: 8.75
      ref_sec: 12.36
    '98':
      text: Tete Yoyada kplɔ Yoas doe, ɖɔ fiakuku la nɛ, eye wòtsɔ nubablagbalẽ la de esi.
      sbs: 0.7262
      gen_sec: 6.84
      ref_sec: 7.02
    '99':
      text: Àkpɔe le nyaŋlɔɖiawo me be du sia nye du dzeaglã si ɖea fu na fiawo kple nutometɔwo, teƒe
        si aglãdzedze le tso keke blema ke.
      sbs: 0.7314
      gen_sec: 10.88
      ref_sec: 9.92
    '100':
      text: Yehoram xɔ ƒe blaetɔ̃-vɔ-eve esi wòzu fia.
      sbs: 0.7078
      gen_sec: 3.69
      ref_sec: 3.64
    '101':
      text: Miɖe gbeƒã Yehowa, elabena ewɔ nu dzɔatsuwo.
      sbs: 0.7192
      gen_sec: 4.08
      ref_sec: 3.1
    '102':
      text: Ke Yesu bia wo be, “Miexlẽ nu si Fia David kple eŋutimewo wɔ esi dɔ wu wo la oa?
      sbs: 0.7118
      gen_sec: 6.51
      ref_sec: 6.94
    '103':
      text: Miɖe asi le Mawu ƒe gbedoxɔ si tum wole la ƒe nya me.
      sbs: 0.6939
      gen_sec: 4.43
      ref_sec: 3.58
    '104':
      text: Nɔae nye Yerusa, Zadok vinyɔnu.
      sbs: 0.7237
      gen_sec: 2.92
      ref_sec: 3.28
    '105':
      text: Dzata aɖo Moab ƒe aʋasilawo.
      sbs: 0.7243
      gen_sec: 2.68
      ref_sec: 3.16
    '106':
      text: Hadzilaawo nɔ ha xlãm ɖe me, le woƒe nunɔla Yizraxya ƒe kpɔkplɔ te.
      sbs: 0.7224
      gen_sec: 5.92
      ref_sec: 6.24
    '107':
      text: Eƒe akpata dze ŋgɔ xɔxɔnu kɔtoe tɔ, eye detiwo le domegliawo ƒe akpa eve.
      sbs: 0.7254
      gen_sec: 6.48
      ref_sec: 7.48
    '108':
      text: Medo dɔmedzoe, trɔ megbe de wò vie ya; ke matsɔ lɔlɔ̃ si nu metsina o la.
      sbs: 0.7379
      gen_sec: 6.06
      ref_sec: 6.9
    '109':
      text: Ater dzidzimeviwo, to Hezekia dzi, ame blaasieke-vɔ-enyi .
      sbs: 0.7313
      gen_sec: 5.28
      ref_sec: 4.92
    '110':
      text: Edomtɔwo ƒe aʋakɔwo va ƒo xlã wo; ke le zã me la, wosi wo.
      sbs: 0.726
      gen_sec: 4.7
      ref_sec: 6.4
    '111':
      text: Aƒetɔ do ŋugbe be yeayra dukɔ la.
      sbs: 0.708
      gen_sec: 3.0
      ref_sec: 10.88
    '112':
      text: Gbe ma gbe la, Yese ƒe ke la anye aflaga na anyigbadzitɔwo katã.
      sbs: 0.7104
      gen_sec: 5.64
      ref_sec: 4.72
    '113':
      text: Semaya, Sekania ƒe vi, Ɣedzeƒegbo la ŋudzɔla, kplɔe ɖo.
      sbs: 0.7127
      gen_sec: 4.92
      ref_sec: 5.24
    '115':
      text: Woɖo eŋu nɛ be, “Woadzi Kristo la le Betlehem le Yudea, elabena nenema woŋlɔe ɖi to nyagblɔɖila
        la dzi bena.
      sbs: 0.7074
      gen_sec: 9.44
      ref_sec: 9.56
    '116':
      text: woɖe woƒe fulélewo fia le dutoƒo, eye wowɔ esia hã.
      sbs: 0.7182
      gen_sec: 4.56
      ref_sec: 3.94
    '117':
      text: Ɖe nèle didim be yeawu nye hã abe ale si nèwu Egiptetɔ ma etsɔ enea?
      sbs: 0.6818
      gen_sec: 5.92
      ref_sec: 5.44
    '119':
      text: Eyɔ Mose be wòava to la dzi, eye Mose lia to la yi egbɔ.
      sbs: 0.7384
      gen_sec: 4.72
      ref_sec: 4.52
    '120':
      text: “Ɖo sedatikpo siwo tɔgbi nena fofonye David esime wònɔ eƒe fiasã tum la ƒe ɖewo nye hã.
      sbs: 0.7123
      gen_sec: 7.26
      ref_sec: 7.44
    '122':
      text: Dzidzɔseyea tɔtɔ kple avifafa sesẽ la ale gbegbe be womeganya kae nye ka o, eye hoowɔwɔ la
        ɖi de didiƒe ʋĩi.
      sbs: 0.7263
      gen_sec: 9.1
      ref_sec: 13.0
    '123':
      text: Le esiawo megbe la, Yehowa na dɔléle dze Fia Yehoram ƒe dɔmenuwo dzi.
      sbs: 0.7113
      gen_sec: 6.16
      ref_sec: 5.42
    '125':
      text: Matanya, Bakbukya, Obadya, Mesulam, Talmon kple Akub nye agbonudzɔlawo.
      sbs: 0.721
      gen_sec: 6.52
      ref_sec: 9.38
    '126':
      text: Ŋutsu aɖe, si siti lé asi na la le afi ma.
      sbs: 0.7251
      gen_sec: 3.54
      ref_sec: 4.02
    '127':
      text: Israelviwo ɖo Sinai-to la gbɔ.
      sbs: 0.7313
      gen_sec: 2.8
      ref_sec: 3.7
    '128':
      text: Ewɔla le dzi ɖom ɖe nu si eya ŋutɔ wɔ la ŋu.
      sbs: 0.6965
      gen_sec: 3.72
      ref_sec: 4.68
    '129':
      text: Eva kpɔ dzonu aɖe si xɔ asi ŋutɔ, eya ta eyi ɖadzra nu siwo katã le esi la, eye wòƒle dzonu
        sia.
      sbs: 0.7141
      gen_sec: 8.12
      ref_sec: 7.74
    '131':
      text: Yesu xlɔ̃ nu wo vevie gblɔ be, “Mikpɔ nyuie le Zadukitɔwo kple Farisitɔwo ƒe amɔʋãnu ŋuti.
      sbs: 0.7043
      gen_sec: 7.88
      ref_sec: 6.24
    '132':
      text: Gawu la, eganya ale si wòaɖe nɔnɔmetata vovovowo ɖe nuwo dzi eye wòtoa nu yeyewo hã vɛ.
      sbs: 0.7243
      gen_sec: 7.51
      ref_sec: 7.62
    '134':
      text: Yotam yi edzi be, “Ɖe miewɔ nu dzɔdzɔe ɖe Yerubaal kple eƒe dzidzimeviwo ŋu be mietsɔ Abimelek
        ɖo fia mahã?
      sbs: 0.7038
      gen_sec: 9.4
      ref_sec: 7.64
    '135':
      text: Tete wòkplɔm yi xɔxɔnu ememetɔ la me to anyigbemegbo la nu.
      sbs: 0.7162
      gen_sec: 5.32
      ref_sec: 5.46
    '136':
      text: Wo viwo ƒe afã doa Asdod-gbe, ke womete ŋu doa Yuda-gbe o; dukɔ bubuwo ƒe gbe ko wodona.
      sbs: 0.7366
      gen_sec: 7.52
      ref_sec: 9.24
    '137':
      text: Gawu la, Yehoram wɔ nuxeƒewo ɖe Yuda ƒe towo dzi eye wòzi eƒe amewo dzi be woasubɔ legbawo.
      sbs: 0.7304
      gen_sec: 8.0
      ref_sec: 8.26
    '138':
      text: Nunɔlawo ƒe viwo dometɔ aɖewo lé kpẽwo ɖe asi kplɔ wo ɖo.
      sbs: 0.7287
      gen_sec: 4.79
      ref_sec: 5.68
    '139':
      text: Ðe ame siwo katã dzi wòɖu la mado hamelo, asi ahama le eŋuti oa?
      sbs: 0.6941
      gen_sec: 5.56
      ref_sec: 8.52
    '140':
      text: Woatsɔ ga le fia la ƒe gaɖaka me axe fee ɖe dɔ la ta.
      sbs: 0.7025
      gen_sec: 4.48
      ref_sec: 4.78
    '141':
      text: Ame siwo tso Yeriko le ame alafa etɔ̃ kple blaene-vɔ-atɔ̃ .
      sbs: 0.7161
      gen_sec: 4.89
      ref_sec: 4.74
    '142':
      text: Mitsɔm ɖo fiae eye enumake miakpɔ nu si adzɔ ɖe Abimelek dzi!
      sbs: 0.69
      gen_sec: 5.16
      ref_sec: 4.4
    '144':
      text: Tso mía fofowo ŋɔli ke va se ɖe fifia la, míaƒe nu vɔ̃wo kpe ŋutɔ.
      sbs: 0.73
      gen_sec: 5.56
      ref_sec: 5.0
    '145':
      text: Ne mieɖo la, miawo ŋutɔ miadzra mia ɖokui kluvi kple kosiwoe na miaƒe futɔwo, ke ame aɖeke
        madi mi be yeaƒle mi o.
      sbs: 0.7508
      gen_sec: 9.88
      ref_sec: 13.58
    '146':
      text: Gbe ɖeka la, Farisitɔwo kple Zadukitɔwo va be yewoado Yesu kpɔ; wobia tso esi be wòana dzesi
        yewo tso dziƒo.
      sbs: 0.7125
      gen_sec: 9.52
      ref_sec: 8.42
    '148':
      text: Ame si wɔa amewo kɔkɔe kple ame siwo wowɔ kɔkɔe la katã nye ƒome ɖeka me nɔlawo.
      sbs: 0.7136
      gen_sec: 7.0
      ref_sec: 7.28
    '149':
      text: Woɖi Ahazia abe fia ene elabena Fia Yehosafat, ame si subɔ Yehowa kple dzi blibo la ƒe tɔgbuiyɔvie.
      sbs: 0.7267
      gen_sec: 8.8
      ref_sec: 8.7
    '150':
      text: menye Yudatɔwo ƒe du sue maxɔŋkɔ aɖe ko nènye o.
      sbs: 0.6905
      gen_sec: 4.28
      ref_sec: 3.46
    '151':
      text: Yesu ɖo eŋu na wo be, “Miawo hã, nu ka ta miaƒe kɔnuwo tsi tsitre ɖe Mawu ƒe sewo ŋuti ɖo?
      sbs: 0.7007
      gen_sec: 7.52
      ref_sec: 6.94
    '152':
      text: “Dziƒofiaɖuƒe la le abe kesinɔnu aɖe si ŋu ame aɖe va ke ɖo le anyigba aɖe me ene.
      sbs: 0.6954
      gen_sec: 7.04
      ref_sec: 6.32
    '153':
      text: Vi nono afe le ƒli ƒe do nu.
      sbs: 0.6978
      gen_sec: 2.4
      ref_sec: 3.34
    '154':
      text: “Megale egblɔm na mi be, dziƒofiaɖuƒe la ɖi dzonusitsala si le dzonu nyuiwo dim be yeaƒle
        adzra la.
      sbs: 0.7195
      gen_sec: 8.67
      ref_sec: 8.48
    '155':
      text: Sefatia ƒe viwo le ame alafa etɔ̃ kple blaadre-vɔ-eve .
      sbs: 0.7078
      gen_sec: 4.71
      ref_sec: 5.4
    '156':
      text: O Israel, togbɔ be nèle gbɔlo wɔm hã la.
      sbs: 0.7128
      gen_sec: 3.52
      ref_sec: 3.2
    '157':
      text: Ame siwo tso Rama kple Geba le ame alafa ade kple blaeve-vɔ-ɖekɛ .
      sbs: 0.7569
      gen_sec: 5.65
      ref_sec: 5.26
    '158':
      text: Dadae nye Yerusa, Zadok ƒe vinyɔnu.
      sbs: 0.7189
      gen_sec: 3.24
      ref_sec: 3.28
    '159':
      text: Abimelek kple eƒe amewo zɔ mɔ le zã me, woma ɖe akpa ene me eye wode xa ɖe teƒe vovovowo ƒo
        xlã dua.
      sbs: 0.6856
      gen_sec: 8.4
      ref_sec: 7.02
    '161':
      text: Etrɔ yi fofoawo de, eye wòfia nu le woƒe ƒuƒoƒe, ke ewɔ nuku na wo ŋutɔ.
      sbs: 0.6988
      gen_sec: 6.16
      ref_sec: 6.28
    '162':
      text: Tete wòkplɔm ɖo ta anyigbeme, eye kpɔ ɖa, agbo aɖe le anyigbeme.
      sbs: 0.7451
      gen_sec: 5.68
      ref_sec: 5.02
    '163':
      text: Esi Siria ƒe aʋakɔ la dzo la, Yoas tsi aba dzi le abi gã si wòxɔ la ta.
      sbs: 0.7302
      gen_sec: 5.89
      ref_sec: 5.48
    '164':
      text: Akpa etɔ̃lia bubu nanɔ fiasã la me, eye akpa etɔ̃lia mamlɛa nanɔ Gɔmeɖoɖogbo la nu.
      sbs: 0.7399
      gen_sec: 7.2
      ref_sec: 9.38
    '165':
      text: Miakpɔ wo le Ziz to la kɔgo le balime si yi ɖe Yeruel gbegbe la ƒe nuwuwu!
      sbs: 0.7267
      gen_sec: 6.36
      ref_sec: 6.54
    '166':
      text: Wowɔ dɔ le gli la ŋu tso Aʋawɔnuxɔ la gbɔ le gli la ƒe dzogoe dzi.
      sbs: 0.7155
      gen_sec: 5.64
      ref_sec: 4.96
    '167':
      text: David ɖo wo be woasa Aƒetɔ ƒe numemevɔsa kple dzidzɔ kple hadzidzi abe ale si woŋlɔ ɖe Mose
        ƒe se la mee ene.
      sbs: 0.7125
      gen_sec: 9.13
      ref_sec: 10.5
    '168':
      text: '” Yesu ɖo eŋu na wo be: “Miexlẽe kpɔ be ame si wɔ ame le gɔmedzedzea me la, atsu kple asie
        wòwɔ woe oa?'
      sbs: 0.7525
      gen_sec: 8.56
      ref_sec: 9.3
    '169':
      text: Mieɖo ŋku edzi be menyi ame akpe atɔ̃ kple abolo atɔ̃, eye esi susɔ la yɔ kusiwo oa?
      sbs: 0.7063
      gen_sec: 7.08
      ref_sec: 8.12
    '170':
      text: Wotsɔ kpe siwo wofú la wɔ kplɔ̃ ene hena numemevɔsawo.
      sbs: 0.7083
      gen_sec: 4.8
      ref_sec: 3.72
    '171':
      text: Esi gbe la nɔ ɖiɖim alea la, dzidzi ƒo nusrɔ̃la etɔ̃awo, eye wotsyɔ mo anyi kple vɔvɔ̃.
      sbs: 0.7196
      gen_sec: 6.98
      ref_sec: 6.28
    '172':
      text: Xɔ lolo ŋutɔ mebe matu elabe mía Mawu la lolo wu mawu bubuwo katã.
      sbs: 0.7321
      gen_sec: 5.8
      ref_sec: 6.4
    '173':
      text: Baba na ame si gblɔ na atikpakpɛ be, ‘Gbɔ agbe!
      sbs: 0.7291
      gen_sec: 4.08
      ref_sec: 3.34
    '174':
      text: Wotsi tsitre ɖe adzɔge henɔ dzodzom nyanyanya kple vɔvɔ̃.
      sbs: 0.6388
      gen_sec: 5.05
      ref_sec: 3.3
    '175':
      text: Ale wòatsɔ vidzĩ si eya ŋutɔ dzi la aɖu le adzame, atsɔ amenɔ la hã akpe ɖe eŋuti.
      sbs: 0.7317
      gen_sec: 7.08
      ref_sec: 8.0
    '176':
      text: Le míaƒe nu vɔ̃wo ta la, wotsɔ yi he to na míawo ŋutɔ, míaƒe fiawo kple míaƒe nunɔlawo, eye
        woɖe aboyo mí.
      sbs: 0.7176
      gen_sec: 9.0
      ref_sec: 8.48
    '177':
      text: Ne ame le agbe ƒè geɖee la, nekpɔ dzidzɔ le wo katã me.
      sbs: 0.7316
      gen_sec: 4.56
      ref_sec: 4.8
    '178':
      text: Ame siawo wɔ dɔ le Yehoyakim, si nye Yesua vi kple Yozadak ƒe tɔgbuiyɔvi la ŋɔli.
      sbs: 0.7192
      gen_sec: 6.95
      ref_sec: 9.2
    '179':
      text: Le ŋkeke etɔ̃awo me la, ŋutsuwo katã tso Yuda kple Benyamin va kpe ta ɖe Yerusalem.
      sbs: 0.7275
      gen_sec: 7.24
      ref_sec: 7.08
    '180':
      text: eye woɖea gbe abe dzataviwo ene.
      sbs: 0.7124
      gen_sec: 3.0
      ref_sec: 3.14
    '182':
      text: eye wòaɖe gbeƒã nye ʋɔnudɔdrɔ̃ na trɔ̃subɔlawo.
      sbs: 0.6913
      gen_sec: 4.24
      ref_sec: 3.32
    '183':
      text: Esia hã nu dzodzro ko wònye; dɔ vloe.
      sbs: 0.718
      gen_sec: 3.21
      ref_sec: 3.32
    '184':
      text: Woɖe asi le se si mede na wo la ŋu gɔ̃ xoxo eye wokɔ̀ legba na wo ɖokui.
      sbs: 0.75
      gen_sec: 5.88
      ref_sec: 7.34
    '185':
      text: Xatus, Xasbneya vie dzra akpa si va ɖe esia yome la ɖo.
      sbs: 0.7142
      gen_sec: 4.8
      ref_sec: 6.4
    '187':
      text: Gbedoxɔmedɔwɔla siwo nɔ Ofel togbɛ dzi la, gbugbɔ gli la ɖo va ɖo Tsigbo ɣedzeƒetɔ la kple
        mɔ la ƒe xɔ tsrala gbɔ.
      sbs: 0.7188
      gen_sec: 9.69
      ref_sec: 9.42
    '190':
      text: ’ Mienya ale si miaɖe dziƒo ƒe nɔnɔme gɔme, gake mietea ŋu dzea si ɣeyiɣiwo ƒe dzesiwo o.
      sbs: 0.7022
      gen_sec: 7.72
      ref_sec: 7.44
    '191':
      text: Ena Israelviwo dome ɖekakpuiwo yi ɖawɔ numemevɔsawo na Aƒetɔ, eye wòna wotsɔ nyitsuwo sa ŋutifafavɔ
        hã nɛ.
      sbs: 0.7465
      gen_sec: 9.6
      ref_sec: 12.84
    '192':
      text: Nɔvi siwo tso Italia hã do gbe na mi.
      sbs: 0.7003
      gen_sec: 3.24
      ref_sec: 3.62
    '193':
      text: 'Esiwo tso Paxat-Moab viŋutsuwo dome: Adna, Xelal, Benaya, Maaseya, Matanya, Bezaleel, Binui
        kple Manase.'
      sbs: 0.7114
      gen_sec: 9.22
      ref_sec: 13.48
    '194':
      text: ” Ke esi ɖekakpui la se nya sia la, edzo kple nuxaxa, elabena enye kesinɔtɔ gã aɖe.
      sbs: 0.7173
      gen_sec: 7.16
      ref_sec: 6.4
    '195':
      text: O Aƒetɔ, ne metsɔ nya ɖe ŋuwò hã la.
      sbs: 0.7408
      gen_sec: 3.08
      ref_sec: 3.1
    '197':
      text: Woɖii ɖe David ƒe du la me, ke womeɖii ɖe fiawo ɖiƒe o.
      sbs: 0.7407
      gen_sec: 4.72
      ref_sec: 7.46
    '198':
      text: 'Tso Pasur ƒe dzidzimeviwo dome: Elioenai, Maaseya, Ismael, Netanel, Yozabad kple Eleasa.'
      sbs: 0.7243
      gen_sec: 7.96
      ref_sec: 10.56
    '199':
      text: Etsɔ wo ɖo mawuwoe, dea ta agu na wo eye wòdoa dzudzɔ na wo.
      sbs: 0.7371
      gen_sec: 5.16
      ref_sec: 5.64
    '200':
      text: Tso gbe aɖe gbe ke, le David kple Asaf ŋɔli la, hɛnɔawo nɔa anyi nyea hadzilawo kplɔlawo,
        ne wole kafukafuhawo kple akpedahawo dzim na Mawu.
      sbs: 0.7367
      gen_sec: 12.1
      ref_sec: 12.74
    '202':
      text: Esia hã nu dzodzro kple yadɔ ko wònye.
      sbs: 0.7056
      gen_sec: 3.44
      ref_sec: 3.26
    '203':
      text: nana be ɖeɖi tea eŋu; elabe menya mɔ si.
      sbs: 0.7224
      gen_sec: 3.52
      ref_sec: 4.12
    '204':
      text: Ke zi atɔ̃lia la, Sanbalat ɖo eƒe dɔla ɖem kple gbedeasi ma ke, eye wòlé agbalẽ si nu wometre
        o la ɖe asi.
      sbs: 0.7333
      gen_sec: 8.96
      ref_sec: 7.82
    '205':
      text: Fesrewo ƒo xlãe kpe ɖe eƒe akpata la ŋuti.
      sbs: 0.666
      gen_sec: 3.75
      ref_sec: 3.24
    '207':
      text: Nubablaɖaka la le wo ŋgɔ be yeatia teƒe si woatɔ ɖo la na wo.
      sbs: 0.7078
      gen_sec: 5.28
      ref_sec: 5.24
    '208':
      text: Yehowa gblɔ nya siawo na Mose be, “Gblɔ na Israelviwo be, ‘Miawo ŋutɔ miekpɔe be meɖe nye
        lɔlɔ̃nu fia mi tso dziƒo.
      sbs: 0.724
      gen_sec: 9.69
      ref_sec: 9.38
    '210':
      text: Tete ameha blibo la de asi liʋiliʋĩlilĩ me le Mose kple Aron ŋu.
      sbs: 0.7039
      gen_sec: 5.26
      ref_sec: 5.08
    '212':
      text: Esi wòva la, eya kple Yoram wodo go be yewoaɖakpe Yehu, Nimsi vi, ame si Aƒetɔ si ami na be
        wòatsrɔ̃ Axab ƒe ƒome la.
      sbs: 0.7264
      gen_sec: 9.84
      ref_sec: 11.74
    '213':
      text: Esi wonɔ elalam be wòava yi la, woda adzo ame siwo va to mɔ la dzi yina.
      sbs: 0.7354
      gen_sec: 6.12
      ref_sec: 5.48
    '214':
      text: Enye ame si ɖe Mawu ƒe nɔnɔme tututu fia, eye wòna agbe nuwo katã to eƒe ŋusẽnya la me.
      sbs: 0.6764
      gen_sec: 7.48
      ref_sec: 7.32
    '215':
      text: Betlehemtɔwo kple Netofatɔwo le ame alafa ɖeka kple blaenyi-vɔ-enyi .
      sbs: 0.7146
      gen_sec: 6.12
      ref_sec: 6.02
    '216':
      text: ’ Ne woku lãdzokpẽ he eme didie la, eya ko hafi woalia to la.
      sbs: 0.728
      gen_sec: 5.2
      ref_sec: 7.44
    '217':
      text: Wo kple nunɔlawo, Levi viwo kple ame siwo katã tso aboyoa me va le Yerusalem lae dze dɔa gɔme.
      sbs: 0.7338
      gen_sec: 8.2
      ref_sec: 9.1
    '218':
      text: Ale ke magblẽ dɔa ɖi koŋ ko atso, be mava kpɔ mi le kɔƒe me?
      sbs: 0.7546
      gen_sec: 5.03
      ref_sec: 5.96
    '219':
      text: Agbledede doa dzidzɔ nɛ ale agble kple waingble geɖewo nɔ esi, le toawo ŋu kple balime afi
        si nukuwo nyona le nyuie.
      sbs: 0.7221
      gen_sec: 10.2
      ref_sec: 9.4
    '221':
      text: 'Egblɔ nam be: “Ge ɖe eme ne nàkpɔ ŋunyɔnuvɔ̃ɖi siwo wɔm wole le afi sia la ɖa.'
      sbs: 0.7211
      gen_sec: 6.15
      ref_sec: 5.86
    '222':
      text: Mana la ɖeɖe ko woɖu va se ɖe esime woɖo Kanaan-nyigba ƒe liƒo dzi.
      sbs: 0.7192
      gen_sec: 5.84
      ref_sec: 5.26
    '223':
      text: Mose bu ɖe lilikpo si tsyɔ to la tame la me, eye wònɔ afi ma ŋkeke blaene kple zã blaene.
      sbs: 0.7242
      gen_sec: 7.45
      ref_sec: 9.02
    '224':
      text: Evɔa, ele be woatsɔ nu sia nu si le asinye la nɛ!
      sbs: 0.6482
      gen_sec: 4.2
      ref_sec: 3.02
    '225':
      text: Eya ta wosɔ nu be yewo katã yewoaho aʋa ɖe Yerusalem ŋu aɖadze edzi, ade ʋunyaʋunya eme.
      sbs: 0.6937
      gen_sec: 7.76
      ref_sec: 9.36
    '226':
      text: Kuɖiɖi la nava amegbetɔwo, lãwo kple amegbetɔwo ƒe asinudɔwɔwɔ ɖe sia ɖe dzi.
      sbs: 0.7077
      gen_sec: 6.96
      ref_sec: 5.46
    '227':
      text: Ahab, Israel fia, bia Yuda fia, Yehosafat be, “Àte ŋu akpe ɖe ŋunye míaho aʋa ɖe Ramot Gilead
        ŋua?
      sbs: 0.7048
      gen_sec: 8.4
      ref_sec: 8.52
    '228':
      text: eye nàɖo wo ɖi hena wuwugbe.
      sbs: 0.7576
      gen_sec: 2.56
      ref_sec: 3.68
    '229':
      text: Woƒo xlã vɔsamlekpui la hã eye ame sia ame lé aʋawɔnu ɖe asi.
      sbs: 0.7179
      gen_sec: 5.3
      ref_sec: 5.9
    '230':
      text: Tete meda ŋku ɖi, eye kpɔ ɖa, mekpɔ nane si ɖi ame ƒe nɔnɔme.
      sbs: 0.7151
      gen_sec: 4.59
      ref_sec: 5.3
    '232':
      text: “Elabe ale si tsi kple tsikpe dzana.
      sbs: 0.74
      gen_sec: 3.14
      ref_sec: 3.68
  score: 0.7196
