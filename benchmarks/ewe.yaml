      gen_sec: 5.84
      ref_sec: 5.72
    '61':
      text: Esi xɔtulawo ɖo Aƒetɔ ƒe gbedoxɔa gɔme anyi vɔ la, nunɔlawo le woƒe awuwo me lé kpẽwo ɖe asi
