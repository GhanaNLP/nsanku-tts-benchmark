- model: walusungungulube/Spark-TTS-0.5B-twi-ewe-dagbani-noref
  sbs: 0.7581
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Mose ɖo nya sia ŋu na Yehowa be, “Ameawo mava Sinai toa dzi o, elabena ède se na wo be womekpɔ
        mɔ ava o.
      sbs: 0.8048
      gen_sec: 9.44
      ref_sec: 9.1
    '2':
      text: Esi Sanebalat se be míele glia ɖom la, eku dzi nɛ.
      sbs: 0.7388
      gen_sec: 3.98
      ref_sec: 5.5
    '3':
      text: ” Nyɔnua kɔ vidzĩa dzoe, eye wòɖakpɔ edzi.
      sbs: 0.7575
      gen_sec: 6.94
      ref_sec: 4.48
    '4':
      text: Fia Dario ɖe gbe be woayi dɔa dzi, eye wowu gbedoxɔa nu.
      sbs: 0.8083
      gen_sec: 7.12
      ref_sec: 6.22
    '5':
      text: Míawo ɖeɖe míatui na Aƒetɔ, Israel ƒe Mawu la abe ale si Persia-fia Kores ɖoe na mí la ene.
      sbs: 0.7405
      gen_sec: 7.2
      ref_sec: 7.74
    '7':
      text: Dzudzɔ de dzi ʋĩi abe dzudzɔti me wòle dodom tso ene; to blibo la le ʋuʋum sesĩe ŋutɔ.
      sbs: 0.752
      gen_sec: 7.52
      ref_sec: 8.76
    '8':
      text: Eya ta azɔ la miʋu miaƒe nuvɔ̃ me na Aƒetɔ, mia tɔgbuiwo ƒe Mawu la, eye miawɔ eƒe lɔlɔ̃nu.
      sbs: 0.7582
      gen_sec: 7.28
      ref_sec: 9.64
    '9':
      text: Ewɔ ɖeka kple Ahab to via nyɔnuvi ɖeka ɖeɖe me.
      sbs: 0.7099
      gen_sec: 7.6
      ref_sec: 3.54
    '10':
      text: Nuku bubuwo ge ɖe ŋu me, eye ŋu vu tsyɔ wo dzi woku.
      sbs: 0.769
      gen_sec: 5.02
      ref_sec: 4.04
    '11':
      text: Ɣe ma ɣi la, Gaal, Ebed ƒe vi, ʋu kple nɔviawo yi Sekem eye wòzu ame ŋkutawo dometɔ ɖeka le
        dua me.
      sbs: 0.7625
      gen_sec: 9.26
      ref_sec: 8.72
    '12':
      text: Eɖo Selax tá la ƒe gli si le fia ƒe abɔ kple atrakpui si ɖiɖi tso David ƒe du me, dome la.
      sbs: 0.7429
      gen_sec: 7.6
      ref_sec: 9.14
    '13':
      text: Vi lae tsɔ eƒe nya ƒe ŋusẽ la lé xexeme blibo la ɖe te.
      sbs: 0.7082
      gen_sec: 4.68
      ref_sec: 6.5
    '14':
      text: avifafa kple nublanuiɣli ɖi bobobo; Rahel nɔ avi dzi le viawo ta.
      sbs: 0.7325
      gen_sec: 5.4
      ref_sec: 5.52
    '15':
      text: Megblɔ na wo be miɖo to nye gbe, eye miwɔ nu siwo katã megblɔ na mi la.
      sbs: 0.7499
      gen_sec: 6.02
      ref_sec: 5.9
    '16':
      text: Woatsi ado xoxo abe awu ene.
      sbs: 0.7571
      gen_sec: 3.2
      ref_sec: 3.52
    '17':
      text: Ne èkplɔ mí ɖo la, àkpɔ gome le nu nyui siwo katã Yehowa wɔna na mí la me.
      sbs: 0.7647
      gen_sec: 5.96
      ref_sec: 6.4
    '19':
      text: Migakpa kpeawo kple dɔwɔnu aɖeke o, elabena ne miekpa wo la, womagadze be woawɔ wo ŋu dɔ hena
        vɔsamlekpuiɖiɖi nam o.
      sbs: 0.7713
      gen_sec: 9.9
      ref_sec: 10.74
    '20':
      text: Kpɔ ɖa, àyɔ dukɔ siwo mènya o la vɛ.
      sbs: 0.7611
      gen_sec: 2.92
      ref_sec: 3.78
    '21':
      text: Esi nètsrɔ̃ dukɔ geɖewo ta la, wò hã atsrɔ̃.
      sbs: 0.7372
      gen_sec: 6.36
      ref_sec: 4.4
    '22':
      text: Èlɔ̃ dzɔdzɔenyenye, eye nèlé fu ŋutasesẽ, eya ta Mawu.
      sbs: 0.7243
      gen_sec: 9.68
      ref_sec: 4.72
    '23':
      text: Ɖewo ge ɖe kpenyigba dzi, afi si anyi mesɔ gbɔ le o.
      sbs: 0.7527
      gen_sec: 4.02
      ref_sec: 4.32
    '24':
      text: Benui, Xenadad vi, dzra akpa si kplɔe ɖo la ɖo.
      sbs: 0.7821
      gen_sec: 6.94
      ref_sec: 4.34
    '25':
      text: Wotsɔa gliɖolawo kple atikpalawo be woaɖɔ Yehowa ƒe gbedoxɔ la ɖo.
      sbs: 0.8065
      gen_sec: 5.0
      ref_sec: 5.48
    '26':
