      gen_sec: 6.08
      ref_sec: 6.4
    '19':
      text: Migakpa kpeawo kple dɔwɔnu aɖeke o, elabena ne miekpa wo la, womagadze be woawɔ wo ŋu dɔ hena
        vɔsamlekpuiɖiɖi nam o.
      sbs: 0.7388
      gen_sec: 10.64
      ref_sec: 10.74
