      ref_sec: 14.14
      cer: 0.1134
      wer: 0.6667
    bible_00020:
      source: bible
      text: Ba gela a jam a weeni ayen, <<Tama ale ti nidoabilisaŋa ale ti liema a piisi kama, ku a fɛ
        ayen ti ta ŋanbie a dɛ ate ti vua.
      sbs: 0.5964
      gen_sec: 9.6
      ref_sec: 11.76
      cer: 0.2826
      wer: 0.5862
    bible_00021:
      source: bible
      text: Wa jam pai ka ligmɔniŋ a kuri mɛ ŋanta ase ŋanvuta baye la nanlikka noawaaŋa.
      sbs: 0.579
      gen_sec: 6.84
      ref_sec: 8.14
      cer: 0.1129
      wer: 0.5333
    bible_00022:
      source: bible
      text: Yeezu yaa weeni ba ayen, <<Mi Kowa a basi kama ate mi tom tuimaŋsa nna yegayega ate nama nya.
      sbs: 0.5717
      gen_sec: 8.6
      ref_sec: 8.08
      cer: 0.0282
      wer: 0.3684
    bible_00023:
      source: bible
      text: Ba chak kama ase wusum doata ale chak diila, a ta kɔrisa, ate waai meena a yaali wa vaanchoa
        pok.
      sbs: 0.6173
      gen_sec: 9.28
      ref_sec: 8.78
      cer: 0.1467
      wer: 0.55
    bible_00024:
      source: bible
      text: Ti wanyi mɛ la abe kan kpi ka tidek nyiŋŋa.
      sbs: 0.589
      gen_sec: 4.44
      ref_sec: 3.64
      cer: 0.1515
      wer: 0.6
    bible_00025:
      source: bible
      text: Ti lalik kpaansaŋa ale dari ŋandobra.
      sbs: 0.6353
      gen_sec: 5.44
      ref_sec: 3.74
      cer: 0.1613
      wer: 0.8333
    bible_00026:
      source: bible
      text: Keenan demma ale Perizzi demma mɛ jam maa bo ka tɛŋ kala dila po.
      sbs: 0.591
      gen_sec: 5.28
      ref_sec: 5.8
      cer: 0.1569
      wer: 0.6429
    bible_00027:
      source: bible
      text: Alege Yeezu an jam tulisi ba a yaa le ge a koori tɛŋ a pai wa nandub a ŋmarisi tɛŋ.
      sbs: 0.5746
      gen_sec: 9.72
      ref_sec: 7.38
      cer: 0.0635
      wer: 0.25
    bible_00028:
      source: bible
      text: Moosis yaa ta tacheksaŋa meena a nyini Naawen niŋ a jam te Izirali demma meena.
      sbs: 0.6207
      gen_sec: 7.16
      ref_sec: 5.8
      cer: 0.1562
      wer: 0.6
    bible_00029:
      source: bible
      text: Nye ligmɔniŋ baŋsa siye a maŋ nsila siyema ale bo suinum jaligimmu gugottaŋa po a moata garuk
        genni la.
      sbs: 0.5717
      gen_sec: 9.64
      ref_sec: 11.2
      cer: 0.1905
      wer: 0.7368
    bible_00030:
      source: bible
      text: Diipo meena Moosis a dan cheŋ jo viuku po, nuruma meena nyiem jam yiti za kama ba viitaŋa
        nansuiŋtaŋa noa a nya Moosis ate wa ga jo viuku po.
      sbs: 0.5964
      gen_sec: 11.28
      ref_sec: 13.3
      cer: 0.0811
      wer: 0.3448
    bible_00031:
      source: bible
      text: Abram le jam bo juijui la a moata ka Mamre, Amori denɔwa tiib kpieŋsaŋa.
      sbs: 0.6246
      gen_sec: 8.68
      ref_sec: 7.3
      cer: 0.1404
      wer: 0.5714
    bible_00032:
      source: bible
      text: Dila nyiŋ, ku a fɛ kama ayen ni pai jiirim ale zula ale zaab m dek ale ŋmam ŋmam nyeka ale
        chichiiba ase gatta la a jo.
      sbs: 0.5866
      gen_sec: 10.32
      ref_sec: 10.92
      cer: 0.1648
      wer: 0.4444
    bible_00033:
      source: bible
      text: Ni seba mi ale a cheŋ juijui la kama ale suik kuui ale a cheŋ ku jigini la.
      sbs: 0.5508
      gen_sec: 8.44
      ref_sec: 3.96
      cer: 0.193
      wer: 0.5
    bible_00034:
      source: bible
      text: Ni teeri dii ate m weeni ni ayen tomteerɔ an baga a zuak a gaam wa nyɔnɔ la.
      sbs: 0.5912
      gen_sec: 9.32
      ref_sec: 5.5
      cer: 0.0862
      wer: 0.1667
    bible_00035:
      source: bible
      text: Alege tama ale ti Naawenni ale ka bunyi la, m ta siaka kama nalimnyiini ayen ni popolaŋa ale
        mi popolaŋa ka bunyi.
      sbs: 0.6049
      gen_sec: 12.0
      ref_sec: 8.56
      cer: 0.1538
      wer: 0.5455
    bible_00036:
      source: bible
      text: Fi nak ba, alege ba zɛ ayen ba nyiŋsa a dom.
      sbs: 0.6057
      gen_sec: 4.64
      ref_sec: 3.92
      cer: 0.375
      wer: 0.8182
    bible_00037:
      source: bible
      text: Ate wa jam yaali siik daata a pai ligmɔniŋ a taari ti zuk.
      sbs: 0.6012
      gen_sec: 6.28
      ref_sec: 4.32
      cer: 0.1333
      wer: 0.3846
    bible_00038:
      source: bible
      text: Ni be da nina kpaam mɛ m jigi a nyo ni ninaŋa po ate ni a nya.
      sbs: 0.5573
      gen_sec: 5.52
      ref_sec: 4.3
      cer: 0.2444
      wer: 0.6471
    bible_00039:
      source: bible
      text: Mi yaa wom ale wa a pɛ waai ale boro taam wuu la nyiŋ, a weeni ayen, <<Ku ale paari ka bena
        ŋata ale geli.
      sbs: 0.6424
      gen_sec: 8.84
      ref_sec: 10.06
      cer: 0.0779
      wer: 0.36
    bible_00040:
      source: bible
      text: <<A te ŋaaŋbiik sii ale cheen la, juka tiirimu de ale kasim a nye kama Tuka Viuku nansuiŋ
        Naawen niŋ.
      sbs: 0.5972
      gen_sec: 7.8
      ref_sec: 10.68
      cer: 0.1923
      wer: 0.6
    bible_00041:
      source: bible
      text: Alege ku goanti a nye ase ka ba ale ŋmarisi Wen Gbaŋka po dii ayen, <<Waai ale a va sinsaŋŋa
        ale weeni diila, ale vuuk kama ŋa nyiŋ.
      sbs: 0.578
      gen_sec: 13.2
      ref_sec: 13.26
      cer: 0.16
      wer: 0.5357
    bible_00042:
      source: bible
      text: Arama ale Geba tɛŋsaŋa demma a gum chaab a jam ka kobsiyuebi ale pisiye ale wanyi.
      sbs: 0.6039
      gen_sec: 8.56
      ref_sec: 7.34
      cer: 0.1515
      wer: 0.375
    bible_00043:
      source: bible
      text: Nama dek seba ti ale jam sak ni diila kama.
      sbs: 0.5788
      gen_sec: 4.68
      ref_sec: 3.7
      cer: 0.2727
      wer: 0.9
    bible_00044:
      source: bible
      text: Alege fi le nya nidoabili dii ale wa chim nidoa waai ale ta suiyɔgni ale vuusum la, ate mi
        ale te wa vuusum a nyini wa dachaasaŋa jigi kauk meena.
      sbs: 0.5857
      gen_sec: 14.32
      ref_sec: 13.0
      cer: 0.1826
      wer: 0.5
    bible_00045:
      source: bible
      text: Ba a weeni ayen, <Suiyɔgni a boro, suiyɔgni a boro,> alege suiyɔgni a ka.
      sbs: 0.6193
      gen_sec: 7.88
      ref_sec: 7.18
      cer: 0.2593
      wer: 0.8571
    bible_00046:
      source: bible
      text: Ti dan nye nna meena ku a peenti Wen ti Varibasidɔwa sui kama.
      sbs: 0.5943
      gen_sec: 5.6
      ref_sec: 5.2
      cer: 0.2041
      wer: 0.6154
    bible_00047:
      source: bible
      text: '> Fi sui a dan peenti ale mu, sak mu fi suitaŋa ate dila ale basi ate m seba fu abe m diem
        gum du a nya ŋmanteka a nyini fi jigi.'
      sbs: 0.6021
      gen_sec: 10.8
      ref_sec: 11.56
      cer: 0.0737
      wer: 0.2903
    bible_00048:
      source: bible
      text: Ni dan nye dila, wa le vari ni Filistia demma jigi basi.
      sbs: 0.6564
      gen_sec: 4.68
      ref_sec: 4.38
      cer: 0.1628
      wer: 0.6667
    bible_00049:
      source: bible
      text: A nyini Koyat ŋaaŋbisaŋa po, jam ka Uriel ale niŋdeerɔ ale suata kook ale pisiye.
      sbs: 0.6588
      gen_sec: 10.48
      ref_sec: 7.54
      cer: 0.0923
      wer: 0.4667
    bible_00050:
      source: bible
      text: Vuuta titawa ka tintain bibituk ale tintain paasa ale tintain ŋaai ale a nye ase busumbooŋ
        la.
      sbs: 0.6739
      gen_sec: 11.2
      ref_sec: 9.6
      cer: 0.0649
      wer: 0.5294
    bible_00051:
      source: bible
      text: Wa weeni ayen, <<Ni cheŋ a ga dɛ nidek ale a yaali ŋandiin tii ale damasik kaai la abe ni
        tom gela a te baai ale kan ta jaab la.
      sbs: 0.6108
      gen_sec: 12.8
      ref_sec: 12.2
      cer: 0.1368
      wer: 0.5
    bible_00052:
      source: bible
      text: Deevid yaa jam bo tɛŋka ate ba sɛ parisa a gilim la po, dila nyiŋ ka yuei jam le Deevid tɛŋ.
      sbs: 0.5541
      gen_sec: 9.2
      ref_sec: 7.72
      cer: 0.2
      wer: 0.5238
    bible_00053:
      source: bible
      text: Wa jam pai ka siik daata a nye jazaanimu.
      sbs: 0.6373
      gen_sec: 3.24
      ref_sec: 3.78
      cer: 0.2188
      wer: 0.7778
    bible_00054:
      source: bible
      text: Ba zɛri nɔiyeŋka ate ba nye ale Wen la kama.
      sbs: 0.6181
      gen_sec: 4.04
      ref_sec: 3.46
      cer: 0.1471
      wer: 0.5
    bible_00055:
      source: bible
      text: Wabaata nyama ale maa pulim nuruma po la meena a za ba kpi kama kpaliŋ po, ale baai mɛ ale
        weeni ayen kaasuŋ a kan paari ba la mɛ la meena.
      sbs: 0.6323
      gen_sec: 11.96
      ref_sec: 13.82
      cer: 0.1495
      wer: 0.3226
    bible_00056:
      source: bible
      text: Wen a nya ayen, ku la a nya la a nala, ate wa gaari nyaka legini po.
      sbs: 0.6362
      gen_sec: 5.48
      ref_sec: 5.68
      cer: 0.2041
      wer: 0.7059
    bible_00057:
      source: bible
      text: A te waai ale dɛ wa nuruma niŋ a ta ba va gɔnni po la.
      sbs: 0.6258
      gen_sec: 6.2
      ref_sec: 4.54
      cer: 0.0769
      wer: 0.2667
    bible_00058:
      source: bible
      text: A ta va Weleŋsa Chiika a mooli ale pagrim ayen wa ka Wen Nidoabili wa le yiti kum po la nyiŋ,
        wala ale Yeezu Kirisita ti Nyɔnɔwa.
      sbs: 0.5919
      gen_sec: 11.32
      ref_sec: 13.76
      cer: 0.1089
      wer: 0.5556
    bible_00059:
      source: bible
      text: Ka wana ale ta wari ale mi ayen ku a fɛ ayen m tuni?
      sbs: 0.6072
      gen_sec: 5.44
      ref_sec: 5.04
      cer: 0.1842
      wer: 0.5714
    bible_00060:
      source: bible
      text: Ba le daani ni dii nyiŋla ba zɛ waai ale tom mi la.
      sbs: 0.5779
      gen_sec: 5.76
      ref_sec: 3.58
      cer: 0.1316
      wer: 0.3846
    bible_00061:
      source: bible
      text: Waai mɛ abe ale a de jenvaata nyiini alege kan de jaab meena la, ku an magsi ayen wa mɛ biisi
        nwala jigi ase wa a bo wa ka buusa la.
      sbs: 0.6003
      gen_sec: 12.8
      ref_sec: 12.08
      cer: 0.09
      wer: 0.3548
    bible_00062:
      source: bible
      text: Varibasika a nyini ka Naawen jigi.
      sbs: 0.6033
      gen_sec: 3.36
      ref_sec: 3.16
      cer: 0.25
      wer: 0.8333
    bible_00063:
      source: bible
      text: Ku a fɛ ayen ni teeri ayen, nama meena baai ale chim bunyi ale Yeezu Kirisita la, ni ka Wen
        nidoabilisaŋa ni ale ta siaka la nyiŋ.
      sbs: 0.5748
      gen_sec: 11.0
      ref_sec: 10.24
      cer: 0.1188
      wer: 0.3704
    bible_00064:
      source: bible
      text: Pak Wen wa weleŋsa boka jigini po, pak wa wa wenŋmazuk tanjaŋini po.
      sbs: 0.6116
      gen_sec: 6.04
      ref_sec: 5.32
      cer: 0.037
      wer: 0.1538
    bible_00065:
      source: bible
      text: Wom fi tomteerɔwa ale a saalim la ale fi nuruma Izirali ase ba niŋ tuk dela nyiŋ a puusi.
      sbs: 0.6051
      gen_sec: 8.28
      ref_sec: 8.06
      cer: 0.1571
      wer: 0.4737
    bible_00066:
      source: bible
      text: Mi a kan baga a ta nuruma de meena m dega, wanni a ŋmasi pagra a gaam mu kama.
      sbs: 0.6298
      gen_sec: 7.32
      ref_sec: 6.14
      cer: 0.2759
      wer: 0.6316
    bible_00067:
      source: bible
      text: Ba an diem miŋ suik kuui ale a nye ate nuruba a chim wayɔrisima nyam m jigi la.
      sbs: 0.5847
      gen_sec: 7.24
      ref_sec: 6.18
      cer: 0.2131
      wer: 0.5556
    bible_00068:
      source: bible
      text: Dai yeŋ Jonatan yaa weeni waai ale a yik wa kpaliŋ kɔlimaŋa la ayen, <<Te ti gaam taam Filistia
        tugurik tɔŋdɔma ale za juijui limisi a nya la.
      sbs: 0.5985
      gen_sec: 10.8
      ref_sec: 12.16
      cer: 0.1892
      wer: 0.5
    bible_00069:
      source: bible
      text: Vuuk kuui ale dɛ niŋka la, ku a magsi ka tintain munta ale tintain ŋaai ale a nye ase dubuulim
        la ale tintain paata.
      sbs: 0.6026
      gen_sec: 10.96
      ref_sec: 11.12
      cer: 0.0769
      wer: 0.2917
    bible_00070:
      source: bible
      text: Ba jam ta ka nuru baai ate Naab Deevid ale wa nuruma a jam lueri ayen ba a maari Livaima kobsiye
        ale pisiye wa la a jam.
      sbs: 0.635
      gen_sec: 11.4
      ref_sec: 13.94
      cer: 0.086
      wer: 0.2593
    bible_00071:
      source: bible
      text: Ba kan pai ba a nyo chivie po ase ba nin ta chaab ale ba dachaasaŋa nansuiŋku nɔi ya.
      sbs: 0.6043
      gen_sec: 5.92
      ref_sec: 8.66
      cer: 0.1818
      wer: 0.4737
    bible_00072:
      source: bible
      text: Diila m basi kama ate fi chim tɛŋsa yega ko.
      sbs: 0.6074
      gen_sec: 3.64
      ref_sec: 3.76
      cer: 0.0588
      wer: 0.3
    bible_00073:
      source: bible
      text: Ba giŋgeluŋtaŋa ka pein yaani, ti a biisi ka venta.
      sbs: 0.5891
      gen_sec: 4.32
      ref_sec: 3.82
      cer: 0.15
      wer: 0.8
    bible_00074:
      source: bible
      text: Ase Yadadezer nuruma ale ga nya ale Izirali demma a nak yik ba la, ba yaa nye nɔiyeŋ ale Deevid
        a siak te wa.
      sbs: 0.6042
      gen_sec: 11.04
      ref_sec: 9.54
      cer: 0.1071
      wer: 0.4583
    bible_00075:
      source: bible
      text: <<Dila wom mi, nama baai ale a miŋ la.
      sbs: 0.6377
      gen_sec: 3.08
      ref_sec: 3.26
      cer: 0.2308
      wer: 0.3333
    bible_00076:
      source: bible
      text: Ase Deevid ale ga wom kude la, wa yaa tigsi Izirali meena a lo Jodan Benni a jueli, wa jam
        ga moata ba kama, a zaani wa kpaliŋ zaaniŋa a tuk ba nyiŋ.
      sbs: 0.6095
      gen_sec: 14.2
      ref_sec: 12.24
      cer: 0.0885
      wer: 0.2727
    bible_00077:
      source: bible
      text: Naawen ale nye dii ale nala la wa nimbie po.
      sbs: 0.6267
      gen_sec: 4.48
      ref_sec: 3.44
      cer: 0.0882
      wer: 0.2
    bible_00078:
      source: bible
      text: Gedor denɔwa Jeroyam nidoabilisaŋa Joela ale Zebadia mɛ jam boro kama.
      sbs: 0.5903
      gen_sec: 7.16
      ref_sec: 7.78
      cer: 0.2203
      wer: 1.2727
    bible_00079:
      source: bible
      text: Ba le ta dakanni a jam Izirali tigsika jigini la, Yofni ale Fineyas a maa va jam.
      sbs: 0.605
      gen_sec: 6.92
      ref_sec: 7.28
      cer: 0.1587
      wer: 0.4706
    bible_00080:
      source: bible
      text: Viok yaa nyini yeniŋ a gala geŋ a fuk nna balibali ate ba yaa poli ayen nya kude ale deri
        basi kama ate ba nye ba ale poom a yaali dii ayen ba cheŋ la.
      sbs: 0.5617
      gen_sec: 15.8
      ref_sec: 12.3
      cer: 0.069
      wer: 0.3429
    bible_00081:
      source: bible
      text: Be ka ŋaaŋbiik kala ate Wen nye pumpuulimaŋa a te la.
      sbs: 0.5909
      gen_sec: 4.2
      ref_sec: 4.22
      cer: 0.2143
      wer: 0.7273
    bible_00082:
      source: bible
      text: Baai ale a nye ti la ale nye ase ka bɔgtaŋa la, ale baai meena ale ta sebchakka ale ti la.
      sbs: 0.6292
      gen_sec: 8.72
      ref_sec: 7.28
      cer: 0.2059
      wer: 0.5238
    bible_00083:
      source: bible
      text: Deevid yaa jam tigsi Izirali demma meena Jerusalem po ayen wa ta Naawen nɔiyeŋka dakanni a
        jam juijui ate wa gomsi a magsi di la po.
      sbs: 0.5893
      gen_sec: 13.12
      ref_sec: 12.3
      cer: 0.1321
      wer: 0.4231
    bible_00084:
      source: bible
      text: Waai karo a nye wamaŋŋa, wanyi mɛ la a ka.
      sbs: 0.6434
      gen_sec: 4.2
      ref_sec: 3.48
      cer: 0.129
      wer: 0.6
    bible_00085:
      source: bible
      text: Legi a karo, birim jigi a karo ate nuru baata a suk.
      sbs: 0.6052
      gen_sec: 5.76
      ref_sec: 5.08
      cer: 0.1026
      wer: 0.6667
    bible_00086:
      source: bible
      text: Tugurik tɔŋdɔba kobsiyuebi ale jam bo ale wa.
      sbs: 0.6563
      gen_sec: 6.48
      ref_sec: 3.26
      cer: 0.2162
      wer: 0.875
    bible_00087:
      source: bible
      text: Dii ale di sak ayen mi ale a tom fu la ale nna.
      sbs: 0.6133
      gen_sec: 6.36
      ref_sec: 4.32
      cer: 0.0294
      wer: 0.3846
    bible_00088:
      source: bible
      text: Pai tana ŋaye ate ŋa yik ŋa a tanla garuk genni ŋmankpalaŋa zuk ase tintain ŋaai ale ŋa chim
        teerika a te Izirali nidoabilisaŋa.
      sbs: 0.5897
      gen_sec: 12.36
      ref_sec: 12.3
      cer: 0.1635
      wer: 0.6667
    bible_00089:
      source: bible
      text: Wa jam basi ate suŋsuŋka chimmu a vi zaŋŋa zuk a nyini ka kpeglimka a ga paari kpegli kinkala.
      sbs: 0.6105
      gen_sec: 8.48
      ref_sec: 9.3
      cer: 0.12
      wer: 0.4737
    bible_00090:
      source: bible
      text: Baai ale ta siaka ale Yeezu la, a yaa jam waaŋ chaab Judia ale Samaria tɛŋsaŋa meena po.
      sbs: 0.6371
      gen_sec: 8.92
      ref_sec: 6.88
      cer: 0.0145
      wer: 0.0556
    bible_00091:
      source: bible
      text: Ba pai ka daa ŋata a cheŋ a paari ka.
      sbs: 0.6175
      gen_sec: 4.08
      ref_sec: 3.2
      cer: 0.1481
      wer: 0.3
    bible_00092:
      source: bible
      text: Ase nuru ale jam weeni Deevid nuruma wie la, wa yaa tom nuruba ayen ba tu ba, ba jam nyo ba
        ka chivie po nna yegayega.
      sbs: 0.568
      gen_sec: 12.72
      ref_sec: 9.7
      cer: 0.1111
      wer: 0.2692
    bible_00093:
      source: bible
      text: Yasabia ale Jesaiya ale nyini Merari buuni po la ale wa suataŋa ale wa suataŋa bisaŋa a jam
        ka nuruba pisiye.
      sbs: 0.6246
      gen_sec: 12.04
      ref_sec: 14.6
      cer: 0.0795
      wer: 0.2857
    bible_00094:
      source: bible
      text: Ku be ka Wen tomtomiŋ maŋka de nyiŋ ale soa ate mi Pɔɔl yaa chim tomteerɔ.
      sbs: 0.5892
      gen_sec: 7.28
      ref_sec: 5.6
      cer: 0.2414
      wer: 0.625
    bible_00095:
      source: bible
      text: Filistia demma a jam ta ka ganduok, wa yuei jam le Goliat a nyini Gat.
      sbs: 0.6023
      gen_sec: 6.2
