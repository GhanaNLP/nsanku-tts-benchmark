      gen_sec: 9.12
      ref_sec: 7.84
      cer: 0.0563
      wer: 0.1875
    bible_00155:
      source: bible
      text: '>> Sinsaŋŋa de chaab a biisi a magsi chaab ale ka jaabuuri meena wuu ate fi dan ga pai wa
