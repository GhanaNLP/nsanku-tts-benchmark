      sbs: 0.7174
      gen_sec: 12.24
      ref_sec: 12.18
      cer: 0.0345
      wer: 0.1429
    bible_00163:
      source: bible
      text: Ase ba le jam paari Eskol Viaka la, ba yaa jam che tiib naŋ ale yɔn fi gilima sagi.
      sbs: 0.7025
      gen_sec: 7.52
      ref_sec: 8.3
      cer: 0.0794
      wer: 0.2632
    bible_00164:
      source: bible
      text: M ka Piilimka, m be kasim boro kama taam wuu.
      sbs: 0.6125
      gen_sec: 4.08
      ref_sec: 3.58
      cer: 0.0
      wer: 0.0
    bible_00165:
      source: bible
      text: Baai ale velim a te nuruba la kan te ba kali tɛŋka po, kaasuŋ a jam kaasi baai meena ale ka
