      gen_sec: 10.32
      ref_sec: 9.02
      cer: 0.0108
      wer: 0.1538
    bible_00156:
      source: bible
      text: Ŋandiinta ale masa ase yesa a nin kan karo, yaase masim a bo jein peeluk po?
      sbs: 0.8133
      gen_sec: 6.48
      ref_sec: 7.6
      cer: 0.0508
      wer: 0.1875
    bible_00157:
      source: bible
      text: A nyini Jodan beni kori geŋsa, Aruben dɔkku ale Gad dɔkku ale Manasa dɔkku ale kpesi badek
        ale kpaliŋ ale kpaliŋ jaab meena la, jam ka tusa kook ale pisiye .
      sbs: 0.7667
      gen_sec: 17.6
      ref_sec: 13.64
      cer: 0.0403
      wer: 0.2333
    bible_00158:
      source: bible
      text: Ku le nye nɔiyeŋ ale fu ate fi pai ku chim fi yɔma ku nyuvuri po meena?
      sbs: 0.7751
      gen_sec: 7.04
      ref_sec: 6.26
      cer: 0.0741
      wer: 0.2353
    bible_00159:
      source: bible
      text: Wieŋa de a nyini ka waai ale ka nuru weleŋ ale wensie nyɔnɔ ale ge ta Deevid safiika la.
      sbs: 0.6479
      gen_sec: 7.36
      ref_sec: 7.94
      cer: 0.058
      wer: 0.1579
    bible_00160:
      source: bible
      text: Naawen ale weeni ayen, <<Daaŋa a cheena ate naa kpaarɔwa ale gaam cheerɔwa a taam.
      sbs: 0.7233
      gen_sec: 6.64
      ref_sec: 7.52
      cer: 0.0312
      wer: 0.4
    bible_00161:
      source: bible
      text: Deevid ale wa nuruma a jam paari Ziklag ka daa ŋata dai.
      sbs: 0.7472
      gen_sec: 5.2
      ref_sec: 4.94
      cer: 0.0
      wer: 0.0
    bible_00162:
      source: bible
      text: Fi dan pai ŋa meena a gum chaab, kpana chinaŋa, magsika dobrimu jam ka ligbie tusa ŋaye ale
