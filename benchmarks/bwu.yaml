      sbs: 0.7661
      gen_sec: 10.15
      ref_sec: 9.54
      cer: 0.0952
      wer: 0.3333
    bible_00075:
      source: bible
      text: <<Dila wom mi, nama baai ale a miŋ la.
      sbs: 0.764
      gen_sec: 3.58
      ref_sec: 3.26
      cer: 0.3846
      wer: 0.4444
    bible_00076:
      source: bible
      text: Ase Deevid ale ga wom kude la, wa yaa tigsi Izirali meena a lo Jodan Benni a jueli, wa jam
