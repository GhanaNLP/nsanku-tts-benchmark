      sbs: 0.6515
      gen_sec: 11.28
      ref_sec: 12.08
      cer: 0.18
      wer: 0.5484
    bible_00062:
      source: bible
      text: Varibasika a nyini ka Naawen jigi.
      sbs: 0.6903
      gen_sec: 1.84
      ref_sec: 3.16
      cer: 0.0357
      wer: 0.1667
    bible_00063:
      source: bible
      text: Ku a fɛ ayen ni teeri ayen, nama meena baai ale chim bunyi ale Yeezu Kirisita la, ni ka Wen
