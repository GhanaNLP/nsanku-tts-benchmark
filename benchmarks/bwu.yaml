      sbs: 0.6505
      gen_sec: 12.32
      ref_sec: 10.7
      cer: 0.0103
      wer: 0.2
    bible_00153:
      source: bible
      text: Pɔɔl yaa te ba sinsaŋŋa de ayen, <<M doaba, mi nya kama ale ti chelimu a zaani dela a cheŋ
