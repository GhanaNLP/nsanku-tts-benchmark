      sbs: 0.6501
      gen_sec: 9.44
      ref_sec: 13.76
      cer: 0.0297
      wer: 0.2593
    bible_00059:
      source: bible
      text: Ka wana ale ta wari ale mi ayen ku a fɛ ayen m tuni?
      sbs: 0.6831
      gen_sec: 3.2
      ref_sec: 5.04
      cer: 0.1316
      wer: 0.2857
    bible_00060:
      source: bible
      text: Ba le daani ni dii nyiŋla ba zɛ waai ale tom mi la.
      sbs: 0.6949
      gen_sec: 5.52
      ref_sec: 3.58
      cer: 0.0526
      wer: 0.3077
    bible_00061:
      source: bible
      text: Waai mɛ abe ale a de jenvaata nyiini alege kan de jaab meena la, ku an magsi ayen wa mɛ biisi
