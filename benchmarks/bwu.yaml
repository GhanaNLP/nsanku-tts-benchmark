      gen_sec: 7.63
      ref_sec: 6.44
      cer: 0.05
      wer: 0.0667
    bible_00100:
      source: bible
      text: Wa yaa weeni wa chorɔwa Abram ayen, <<Naawen a kasi mu kama ale bisa biam.
      sbs: 0.7517
      gen_sec: 7.22
      ref_sec: 5.68
      cer: 0.0536
      wer: 0.2667
    bible_00101:
      source: bible
      text: Wa tuesi wa suoku nidoabinni Lɔti ale wa ŋantaŋa meena ale nipooma ale nuru yontaŋa.
      sbs: 0.7174
      gen_sec: 8.47
      ref_sec: 8.1
      cer: 0.058
      wer: 0.4
    bible_00102:
      source: bible
      text: Piilim ka danni ni nye tuilum tigsuŋ ale daa ŋayopɔiwa danni mɛ ni ŋman nye tuilum tigsuŋ.
      sbs: 0.7462
      gen_sec: 9.08
      ref_sec: 8.8
      cer: 0.0822
      wer: 0.5882
    bible_00103:
      source: bible
      text: Ba yaa bek Izirali demma a tuesi kpana ale ligmɔniŋ ale gatta.
      sbs: 0.7143
      gen_sec: 6.32
      ref_sec: 4.72
      cer: 0.04
      wer: 0.0833
    bible_00104:
      source: bible
      text: Ester an jam basi ate ba seba wa nuruma yaase wa buuni, dii nyiŋla, Mordekai ale weeni wa
