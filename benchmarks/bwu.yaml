      ref_sec: 5.2
      cer: 0.0816
      wer: 0.2308
    bible_00047:
      source: bible
      text: '> Fi sui a dan peenti ale mu, sak mu fi suitaŋa ate dila ale basi ate m seba fu abe m diem
        gum du a nya ŋmanteka a nyini fi jigi.'
      sbs: 0.7971
      gen_sec: 11.69
      ref_sec: 11.56
      cer: 0.0
      wer: 0.0968
    bible_00048:
      source: bible
      text: Ni dan nye dila, wa le vari ni Filistia demma jigi basi.
      sbs: 0.7068
      gen_sec: 5.21
      ref_sec: 4.38
      cer: 0.093
      wer: 0.25
    bible_00049:
      source: bible
      text: A nyini Koyat ŋaaŋbisaŋa po, jam ka Uriel ale niŋdeerɔ ale suata kook ale pisiye.
      sbs: 0.7551
      gen_sec: 8.28
      ref_sec: 7.54
      cer: 0.0615
      wer: 0.2
    bible_00050:
      source: bible
      text: Vuuta titawa ka tintain bibituk ale tintain paasa ale tintain ŋaai ale a nye ase busumbooŋ
        la.
      sbs: 0.7993
      gen_sec: 9.3
      ref_sec: 9.6
      cer: 0.0519
      wer: 0.4706
    bible_00051:
      source: bible
      text: Wa weeni ayen, <<Ni cheŋ a ga dɛ nidek ale a yaali ŋandiin tii ale damasik kaai la abe ni
        tom gela a te baai ale kan ta jaab la.
      sbs: 0.775
      gen_sec: 11.78
      ref_sec: 12.2
      cer: 0.0421
      wer: 0.2667
    bible_00052:
      source: bible
      text: Deevid yaa jam bo tɛŋka ate ba sɛ parisa a gilim la po, dila nyiŋ ka yuei jam le Deevid tɛŋ.
      sbs: 0.7356
      gen_sec: 8.7
      ref_sec: 7.72
      cer: 0.0286
      wer: 0.1429
    bible_00053:
      source: bible
      text: Wa jam pai ka siik daata a nye jazaanimu.
      sbs: 0.7715
      gen_sec: 3.84
      ref_sec: 3.78
      cer: 0.2188
      wer: 0.5556
    bible_00054:
      source: bible
      text: Ba zɛri nɔiyeŋka ate ba nye ale Wen la kama.
      sbs: 0.7253
      gen_sec: 4.18
      ref_sec: 3.46
      cer: 0.1765
      wer: 0.4
    bible_00055:
      source: bible
      text: Wabaata nyama ale maa pulim nuruma po la meena a za ba kpi kama kpaliŋ po, ale baai mɛ ale
        weeni ayen kaasuŋ a kan paari ba la mɛ la meena.
      sbs: 0.7686
      gen_sec: 12.97
      ref_sec: 13.82
      cer: 0.0187
      wer: 0.0645
    bible_00056:
      source: bible
      text: Wen a nya ayen, ku la a nya la a nala, ate wa gaari nyaka legini po.
      sbs: 0.7726
      gen_sec: 6.06
      ref_sec: 5.68
      cer: 0.0
      wer: 0.3529
    bible_00057:
      source: bible
      text: A te waai ale dɛ wa nuruma niŋ a ta ba va gɔnni po la.
      sbs: 0.7729
      gen_sec: 4.78
      ref_sec: 4.54
      cer: 0.0769
      wer: 0.2667
    bible_00058:
      source: bible
      text: A ta va Weleŋsa Chiika a mooli ale pagrim ayen wa ka Wen Nidoabili wa le yiti kum po la nyiŋ,
        wala ale Yeezu Kirisita ti Nyɔnɔwa.
      sbs: 0.6727
      gen_sec: 12.29
      ref_sec: 13.76
      cer: 0.0495
      wer: 0.1111
    bible_00059:
      source: bible
      text: Ka wana ale ta wari ale mi ayen ku a fɛ ayen m tuni?
      sbs: 0.7295
      gen_sec: 4.52
      ref_sec: 5.04
      cer: 0.1053
      wer: 0.2143
    bible_00060:
      source: bible
      text: Ba le daani ni dii nyiŋla ba zɛ waai ale tom mi la.
      sbs: 0.6868
      gen_sec: 4.61
      ref_sec: 3.58
      cer: 0.0263
      wer: 0.3846
    bible_00061:
      source: bible
      text: Waai mɛ abe ale a de jenvaata nyiini alege kan de jaab meena la, ku an magsi ayen wa mɛ biisi
        nwala jigi ase wa a bo wa ka buusa la.
      sbs: 0.6882
      gen_sec: 11.86
      ref_sec: 12.08
      cer: 0.03
      wer: 0.0968
    bible_00062:
      source: bible
      text: Varibasika a nyini ka Naawen jigi.
      sbs: 0.7727
      gen_sec: 3.33
      ref_sec: 3.16
      cer: 0.0
      wer: 0.0
    bible_00063:
      source: bible
      text: Ku a fɛ ayen ni teeri ayen, nama meena baai ale chim bunyi ale Yeezu Kirisita la, ni ka Wen
