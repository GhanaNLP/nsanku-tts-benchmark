      sbs: 0.763
      gen_sec: 10.36
      ref_sec: 10.74
      cer: 0.0843
      wer: 0.4762
    bible_00114:
      source: bible
      text: M le ŋmarisi Wen yuenni ale wa tɛŋka yuenni a dueni ba nyiŋ.
      sbs: 0.6386
      gen_sec: 6.0
      ref_sec: 5.56
      cer: 0.1489
      wer: 0.2308
    bible_00115:
      source: bible
      text: Ate wa yaa weeni Naawa yenni kpaŋŋa ayen ba kan te wa ŋandiinta ale da buui ate ba a chari
        naawa yenni po la.
      sbs: 0.7319
      gen_sec: 10.54
      ref_sec: 8.42
      cer: 0.0
      wer: 0.0
    bible_00116:
      source: bible
      text: Ba kisi mu nna la kama ayen dii ate ba ŋmarisi Wen Gbaŋka po la a chim wensie.
      sbs: 0.6271
      gen_sec: 7.64
      ref_sec: 6.74
      cer: 0.0667
      wer: 0.3333
    bible_00117:
      source: bible
      text: Nuru waai ale a misi nya buui ale basi ate nuru a nye cheri la, ku a fɛ ate wa mɛ sugri wa
        gattaŋa.
      sbs: 0.7322
      gen_sec: 8.66
      ref_sec: 7.62
      cer: 0.0541
      wer: 0.25
    bible_00118:
      source: bible
      text: Kirisita tigini demma abe a nye tuka ka wala yenni.
      sbs: 0.6664
      gen_sec: 5.24
      ref_sec: 3.82
      cer: 0.0244
      wer: 0.1
    bible_00119:
      source: bible
      text: Ba dachaasaŋa ale yik ba ta ga basi badek tɛŋ po ate m le te ba ko ba.
      sbs: 0.6873
      gen_sec: 6.68
      ref_sec: 6.36
      cer: 0.0385
      wer: 0.3333
    bible_00120:
      source: bible
      text: Waai abe dan zɛri kpaŋŋa de noa, kula nyɔnɔwa a zɛri ka baai ate Wen lueri zaan du la noa.
      sbs: 0.6668
      gen_sec: 8.53
      ref_sec: 8.52
      cer: 0.058
      wer: 0.3
    bible_00121:
      source: bible
      text: Alege nya, ni a pai ni sebchakka a basi ka pimpaasima wie ŋaai ale kan ta kiri la.
      sbs: 0.741
      gen_sec: 8.04
      ref_sec: 6.64
      cer: 0.0635
      wer: 0.3333
    bible_00122:
      source: bible
      text: Wa ale vari baai ale a silim la gebi kaai ale bo ba noaŋa po la jigi a basi.
      sbs: 0.7527
      gen_sec: 7.32
      ref_sec: 7.22
      cer: 0.0351
      wer: 0.0526
    bible_00123:
      source: bible
      text: Ase ba ale jam paari Kidon ŋanta fɔbika jigini la, Uzzaya yaa laari wa nisaŋa ayen wa yik
        dakanni, dii nyiŋla lalisaŋa nyiŋsa ale jam a gɔk.
      sbs: 0.7267
      gen_sec: 13.68
      ref_sec: 13.9
      cer: 0.0631
      wer: 0.4074
    bible_00124:
      source: bible
      text: Ba le ba nam diila a nye se ka nueoŋ ale dom fu ate fi a nam diila.
      sbs: 0.6266
      gen_sec: 6.36
      ref_sec: 5.66
      cer: 0.102
      wer: 0.5556
    bible_00125:
      source: bible
      text: Nuruma ale jam a paari la, Piita yaa deri basi dɛka ale nuruma dii nyiŋla, wa jam a chali
        ka yɔgsum ale baai ale jam maa siak ayen baai ale kan daa Juuba la a gebi ba yoaŋa la.
      sbs: 0.6642
      gen_sec: 16.96
      ref_sec: 13.76
      cer: 0.0074
      wer: 0.1282
    bible_00126:
      source: bible
      text: Miriam ale Aaron a yaa piilim a biisi Moosis a kaasi Kus tɛŋka liewa ate wa jam faari la nyiŋ.
      sbs: 0.7208
      gen_sec: 9.15
      ref_sec: 8.08
      cer: 0.0405
      wer: 0.15
    bible_00127:
      source: bible
      text: Yɔgyɔgla de nuruma ale ba pooma a yaa kaari nna tuotuowa a ta chaab ale ba suataŋa Juuma.
      sbs: 0.7358
      gen_sec: 8.92
      ref_sec: 9.54
      cer: 0.0845
      wer: 0.2222
    bible_00128:
      source: bible
      text: Ase mi nin basi ate Nabal nuruma wanyi mɛ la a bɛ alege ate vari a veenti.
      sbs: 0.7203
      gen_sec: 6.89
      ref_sec: 5.6
      cer: 0.1579
      wer: 0.5294
    bible_00129:
      source: bible
      text: Nama mɛ abe le ta siaka dii ale wa la ale maari ka mi mɛ.
      sbs: 0.6745
      gen_sec: 5.44
      ref_sec: 5.84
      cer: 0.0952
      wer: 0.5333
    bible_00130:
      source: bible
      text: Alege ba an wom ya yaase ba popola a boro, ba goanti va ka badek tuikpanni ale ba popola baataŋa
        ale a yaali diila.
      sbs: 0.755
      gen_sec: 11.01
      ref_sec: 9.68
      cer: 0.0444
      wer: 0.375
    bible_00131:
      source: bible
      text: Wala ale saafiik kaai ale baga a lak Wen Yammu ale wa sebchakka ale suk juijui la ate ti a
        nya.
      sbs: 0.6628
      gen_sec: 9.02
      ref_sec: 8.66
      cer: 0.1486
      wer: 0.4286
    bible_00132:
      source: bible
      text: '>> Ba jam a wom wa kama nalimnyiini dii nyiŋla, wa wakperikaliisaŋa a jam cha ba beni ka
        nna yegayega.'
      sbs: 0.7027
      gen_sec: 9.85
      ref_sec: 6.28
      cer: 0.0633
      wer: 0.2632
    bible_00133:
      source: bible
      text: Pa di a te kaabteerɔwa Eleaza, ni ta di a nyini ni boka jigini a nyini peelim a tɔgri di wa
        niŋ.
      sbs: 0.7495
      gen_sec: 8.89
      ref_sec: 7.6
      cer: 0.0411
      wer: 0.3182
    bible_00134:
      source: bible
      text: Ni da garuk peelita mɛ mi jigi a lik ni chivieŋa.
      sbs: 0.6262
      gen_sec: 4.92
      ref_sec: 3.64
      cer: 0.0526
      wer: 0.5455
    bible_00135:
      source: bible
      text: Fi le poom nak gbaŋ a te baai ale kan ta koba la abe fi pai ŋanta a tagri fi doa.
      sbs: 0.7413
      gen_sec: 7.38
      ref_sec: 7.48
      cer: 0.05
      wer: 0.3333
    bible_00136:
      source: bible
      text: Wamaŋsaŋa de ka ŋaai ate wa puulim a biisi ŋa dipo ate wa biisiteerɔma a ŋmarisi nyo Wen gbaŋka
        po la.
      sbs: 0.6476
      gen_sec: 9.84
      ref_sec: 9.04
      cer: 0.0123
      wer: 0.1429
    bible_00137:
      source: bible
      text: A nyini wala jigini, Sekania nidoabinni Sɛmaiya ate wa a nya Kori Nansuiŋku la a sɛ.
      sbs: 0.6905
      gen_sec: 8.12
      ref_sec: 9.08
      cer: 0.0896
      wer: 0.5
    bible_00138:
      source: bible
      text: Alege tugurik tɔŋdɔma kpagni a kan jam a yaali ayen wa ko Pɔɔl.
      sbs: 0.6225
      gen_sec: 6.2
      ref_sec: 3.5
      cer: 0.1
      wer: 0.2308
    bible_00139:
      source: bible
      text: Mi dan cheem nya mi gauŋ, waai a karo a maari mu, waai a karo a lik mu.
      sbs: 0.7649
      gen_sec: 6.67
      ref_sec: 6.08
      cer: 0.0196
      wer: 0.0556
    bible_00140:
      source: bible
      text: Mi a chiini ba ase ka mi dachaasa la.
      sbs: 0.7641
      gen_sec: 3.62
      ref_sec: 3.16
      cer: 0.0357
      wer: 0.2222
    bible_00141:
      source: bible
      text: Naawen a basi ate bela a kpeeri meena ale basi ate beli naŋsa nyiam a kan chali.
      sbs: 0.743
      gen_sec: 7.94
      ref_sec: 8.06
      cer: 0.0159
      wer: 0.1765
    bible_00142:
      source: bible
      text: Dii nyiŋla Naawen a weeni Moosis kama ayen, <<Weeni Izirali demma ayen, <Ni ka tukpari nyam.
      sbs: 0.7414
      gen_sec: 9.16
      ref_sec: 7.16
      cer: 0.0141
      wer: 0.25
    bible_00143:
      source: bible
      text: Naawen a jam te Deevid ka nak dɛka juijui meena ate wa jam cheŋ la.
      sbs: 0.7052
      gen_sec: 6.37
      ref_sec: 5.6
      cer: 0.0577
      wer: 0.1333
    bible_00144:
      source: bible
      text: Ba le tɛŋzuk de demma a daa bunyi ase mi ale tɛŋka meena demma ale kan daa bunyi diila.
      sbs: 0.6643
      gen_sec: 8.6
      ref_sec: 6.5
      cer: 0.0147
      wer: 0.1579
    bible_00145:
      source: bible
      text: Wen maarɔ waai ale jam saari bayuebiwa la a yaa peeri wa damuniŋka ate mi yaa wom lueluk ale
        ku nyini ligmɔniŋ kuŋkuŋku nyiila ŋanaansiwa ale bo Wen niŋ la a jam.
      sbs: 0.6533
      gen_sec: 16.06
      ref_sec: 14.78
      cer: 0.0462
      wer: 0.3438
    bible_00146:
      source: bible
      text: Daa ŋayopɔi nye biem duisi basika a te kuŋkuŋku a gaari ku.
      sbs: 0.7523
      gen_sec: 5.8
      ref_sec: 5.46
      cer: 0.0426
      wer: 0.25
    bible_00147:
      source: bible
      text: Wa jam pai ka tiita a nye wakperikaliisa nna yegayega ate ŋa cha Samaria demma.
      sbs: 0.6588
      gen_sec: 8.04
      ref_sec: 5.32
      cer: 0.0469
