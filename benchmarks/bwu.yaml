      sbs: 0.7593
      gen_sec: 10.2
      ref_sec: 10.1
      cer: 0.038
      wer: 0.3043
    bible_00106:
      source: bible
      text: Nama dek seba Wen ale a yaali diila kama.
      sbs: 0.6906
      gen_sec: 4.06
      ref_sec: 3.42
      cer: 0.0312
      wer: 0.4444
    bible_00107:
      source: bible
      text: 'Naawen Dii Ale A Dɛ Tugurik Tɔŋdɔma Niŋ La ale weeni diila ale nna: <<Poli yɔgyɔgla!'
      sbs: 0.7459
      gen_sec: 8.13
      ref_sec: 6.3
      cer: 0.0462
      wer: 0.25
    bible_00108:
      source: bible
      text: Ate Pabiika yaa ŋman foli bobi kaai ale saari bunaansiwa.
      sbs: 0.6467
      gen_sec: 5.48
      ref_sec: 4.7
      cer: 0.0
      wer: 0.0
    bible_00109:
      source: bible
      text: Wa diem ayen wa basi ate ka laata a bo fi nɔi po abe suipeentik nuemka a bo fi nɔngbanvaata
