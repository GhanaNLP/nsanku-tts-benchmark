      sbs: 0.6684
      gen_sec: 11.28
      ref_sec: 12.44
      cer: 0.0351
      wer: 0.3103
    bible_00170:
      source: bible
      text: Wen yaa wi tɛŋ kosikka ayen tɛŋ alege a wi nya tii ale chuiri dua jigi yeŋ ka la ayen nyakpiem.
      sbs: 0.7307
      gen_sec: 7.84
      ref_sec: 10.4
      cer: 0.0676
      wer: 0.3333
    bible_00171:
      source: bible
      text: Wa yaa jam tuesi ŋan baai ate ba te wa la a nye bɔgluk ase naabiik la, a salisi ku.
      sbs: 0.7476
      gen_sec: 8.8
      ref_sec: 8.32
      cer: 0.0323
      wer: 0.1
    bible_00172:
      source: bible
      text: Dila nyiŋ Naawen a yaa basi ate ba waaŋ chaab tɛŋka meena zuk ate ba basi tɛŋka sɛka.
      sbs: 0.7481
      gen_sec: 7.04
      ref_sec: 7.96
      cer: 0.0149
      wer: 0.1667
    bible_00173:
