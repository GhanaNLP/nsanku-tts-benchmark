      sbs: 0.7255
      gen_sec: 9.36
      ref_sec: 7.6
      cer: 0.0548
      wer: 0.4091
    bible_00134:
      source: bible
      text: Ni da garuk peelita mɛ mi jigi a lik ni chivieŋa.
