      sbs: 0.7812
      gen_sec: 12.63
      ref_sec: 12.3
      cer: 0.0377
      wer: 0.0769
    bible_00084:
      source: bible
      text: Waai karo a nye wamaŋŋa, wanyi mɛ la a ka.
