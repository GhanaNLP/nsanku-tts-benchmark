      sbs: 0.6545
      gen_sec: 9.92
      ref_sec: 13.0
      cer: 0.0348
      wer: 0.1333
    bible_00045:
      source: bible
      text: Ba a weeni ayen, <Suiyɔgni a boro, suiyɔgni a boro,> alege suiyɔgni a ka.
      sbs: 0.692
      gen_sec: 6.48
      ref_sec: 7.18
      cer: 0.1111
      wer: 0.2143
    bible_00046:
      source: bible
      text: Ti dan nye nna meena ku a peenti Wen ti Varibasidɔwa sui kama.
      sbs: 0.6944
      gen_sec: 4.64
      ref_sec: 5.2
      cer: 0.1224
      wer: 0.3077
    bible_00047:
      source: bible
      text: '> Fi sui a dan peenti ale mu, sak mu fi suitaŋa ate dila ale basi ate m seba fu abe m diem
        gum du a nya ŋmanteka a nyini fi jigi.'
      sbs: 0.6674
      gen_sec: 11.28
      ref_sec: 11.56
      cer: 0.0105
      wer: 0.129
    bible_00048:
      source: bible
      text: Ni dan nye dila, wa le vari ni Filistia demma jigi basi.
      sbs: 0.6385
      gen_sec: 4.16
      ref_sec: 4.38
      cer: 0.0698
      wer: 0.1667
    bible_00049:
      source: bible
      text: A nyini Koyat ŋaaŋbisaŋa po, jam ka Uriel ale niŋdeerɔ ale suata kook ale pisiye.
      sbs: 0.6545
      gen_sec: 5.6
      ref_sec: 7.54
      cer: 0.1077
      wer: 0.4
    bible_00050:
      source: bible
      text: Vuuta titawa ka tintain bibituk ale tintain paasa ale tintain ŋaai ale a nye ase busumbooŋ
        la.
      sbs: 0.7305
      gen_sec: 8.48
      ref_sec: 9.6
      cer: 0.1558
      wer: 0.4706
    bible_00051:
      source: bible
      text: Wa weeni ayen, <<Ni cheŋ a ga dɛ nidek ale a yaali ŋandiin tii ale damasik kaai la abe ni
        tom gela a te baai ale kan ta jaab la.
      sbs: 0.6642
      gen_sec: 9.36
      ref_sec: 12.2
      cer: 0.0632
      wer: 0.3
    bible_00052:
      source: bible
      text: Deevid yaa jam bo tɛŋka ate ba sɛ parisa a gilim la po, dila nyiŋ ka yuei jam le Deevid tɛŋ.
      sbs: 0.6642
      gen_sec: 7.28
      ref_sec: 7.72
      cer: 0.0286
      wer: 0.1429
    bible_00053:
      source: bible
      text: Wa jam pai ka siik daata a nye jazaanimu.
      sbs: 0.6517
      gen_sec: 2.8
      ref_sec: 3.78
      cer: 27.3125
      wer: 1.0
    bible_00054:
      source: bible
      text: Ba zɛri nɔiyeŋka ate ba nye ale Wen la kama.
      sbs: 0.6287
      gen_sec: 2.64
      ref_sec: 3.46
      cer: 0.1765
      wer: 0.3
    bible_00055:
      source: bible
      text: Wabaata nyama ale maa pulim nuruma po la meena a za ba kpi kama kpaliŋ po, ale baai mɛ ale
        weeni ayen kaasuŋ a kan paari ba la mɛ la meena.
      sbs: 0.6675
      gen_sec: 11.68
      ref_sec: 13.82
      cer: 0.0467
      wer: 0.3226
    bible_00056:
      source: bible
      text: Wen a nya ayen, ku la a nya la a nala, ate wa gaari nyaka legini po.
      sbs: 0.6509
      gen_sec: 5.84
      ref_sec: 5.68
      cer: 0.0612
      wer: 0.3529
    bible_00057:
      source: bible
      text: A te waai ale dɛ wa nuruma niŋ a ta ba va gɔnni po la.
      sbs: 0.6675
      gen_sec: 2.72
      ref_sec: 4.54
      cer: 0.1538
      wer: 0.2667
    bible_00058:
      source: bible
      text: A ta va Weleŋsa Chiika a mooli ale pagrim ayen wa ka Wen Nidoabili wa le yiti kum po la nyiŋ,
        wala ale Yeezu Kirisita ti Nyɔnɔwa.
      sbs: 0.6385
      gen_sec: 8.96
      ref_sec: 13.76
      cer: 0.0594
      wer: 0.2222
    bible_00059:
      source: bible
      text: Ka wana ale ta wari ale mi ayen ku a fɛ ayen m tuni?
      sbs: 0.7042
      gen_sec: 3.44
      ref_sec: 5.04
      cer: 0.0526
      wer: 0.1429
    bible_00060:
      source: bible
      text: Ba le daani ni dii nyiŋla ba zɛ waai ale tom mi la.
      sbs: 0.62
      gen_sec: 3.12
      ref_sec: 3.58
      cer: 0.2105
      wer: 0.5385
    bible_00061:
      source: bible
      text: Waai mɛ abe ale a de jenvaata nyiini alege kan de jaab meena la, ku an magsi ayen wa mɛ biisi
        nwala jigi ase wa a bo wa ka buusa la.
      sbs: 0.686
      gen_sec: 7.76
      ref_sec: 12.08
      cer: 0.1
      wer: 0.2258
    bible_00062:
      source: bible
      text: Varibasika a nyini ka Naawen jigi.
      sbs: 0.673
      gen_sec: 1.76
      ref_sec: 3.16
      cer: 0.0
      wer: 0.0
    bible_00063:
      source: bible
      text: Ku a fɛ ayen ni teeri ayen, nama meena baai ale chim bunyi ale Yeezu Kirisita la, ni ka Wen
        nidoabilisaŋa ni ale ta siaka la nyiŋ.
      sbs: 0.6505
      gen_sec: 10.08
      ref_sec: 10.24
      cer: 0.1386
      wer: 0.3333
    bible_00064:
      source: bible
      text: Pak Wen wa weleŋsa boka jigini po, pak wa wa wenŋmazuk tanjaŋini po.
      sbs: 0.6322
      gen_sec: 4.56
      ref_sec: 5.32
      cer: 0.6852
      wer: 0.8462
    bible_00065:
      source: bible
      text: Wom fi tomteerɔwa ale a saalim la ale fi nuruma Izirali ase ba niŋ tuk dela nyiŋ a puusi.
      sbs: 0.6547
      gen_sec: 8.0
      ref_sec: 8.06
      cer: 0.0143
      wer: 0.0526
    bible_00066:
      source: bible
      text: Mi a kan baga a ta nuruma de meena m dega, wanni a ŋmasi pagra a gaam mu kama.
      sbs: 0.6726
      gen_sec: 7.12
      ref_sec: 6.14
      cer: 0.0172
      wer: 0.1053
    bible_00067:
      source: bible
      text: Ba an diem miŋ suik kuui ale a nye ate nuruba a chim wayɔrisima nyam m jigi la.
      sbs: 0.6853
      gen_sec: 5.92
      ref_sec: 6.18
      cer: 0.082
      wer: 0.1667
    bible_00068:
      source: bible
      text: Dai yeŋ Jonatan yaa weeni waai ale a yik wa kpaliŋ kɔlimaŋa la ayen, <<Te ti gaam taam Filistia
        tugurik tɔŋdɔma ale za juijui limisi a nya la.
      sbs: 0.7255
      gen_sec: 10.0
      ref_sec: 12.16
      cer: 0.1081
      wer: 0.3214
    bible_00069:
      source: bible
      text: Vuuk kuui ale dɛ niŋka la, ku a magsi ka tintain munta ale tintain ŋaai ale a nye ase dubuulim
        la ale tintain paata.
      sbs: 0.7018
      gen_sec: 8.32
      ref_sec: 11.12
      cer: 0.1319
      wer: 0.25
    bible_00070:
      source: bible
      text: Ba jam ta ka nuru baai ate Naab Deevid ale wa nuruma a jam lueri ayen ba a maari Livaima kobsiye
        ale pisiye wa la a jam.
      sbs: 0.654
      gen_sec: 9.28
      ref_sec: 13.94
      cer: 0.043
      wer: 0.1852
    bible_00071:
      source: bible
      text: Ba kan pai ba a nyo chivie po ase ba nin ta chaab ale ba dachaasaŋa nansuiŋku nɔi ya.
      sbs: 0.7323
      gen_sec: 7.12
      ref_sec: 8.66
      cer: 0.0455
      wer: 0.3158
    bible_00072:
      source: bible
      text: Diila m basi kama ate fi chim tɛŋsa yega ko.
      sbs: 0.6749
      gen_sec: 3.6
      ref_sec: 3.76
      cer: 0.0294
      wer: 0.4
    bible_00073:
      source: bible
      text: Ba giŋgeluŋtaŋa ka pein yaani, ti a biisi ka venta.
      sbs: 0.6704
      gen_sec: 3.68
      ref_sec: 3.82
      cer: 0.125
      wer: 0.3
    bible_00074:
      source: bible
      text: Ase Yadadezer nuruma ale ga nya ale Izirali demma a nak yik ba la, ba yaa nye nɔiyeŋ ale Deevid
        a siak te wa.
      sbs: 0.6647
      gen_sec: 8.08
      ref_sec: 9.54
      cer: 0.1071
      wer: 0.375
    bible_00075:
      source: bible
      text: <<Dila wom mi, nama baai ale a miŋ la.
      sbs: 0.7587
      gen_sec: 2.8
      ref_sec: 3.26
      cer: 0.3846
      wer: 0.5556
    bible_00076:
      source: bible
      text: Ase Deevid ale ga wom kude la, wa yaa tigsi Izirali meena a lo Jodan Benni a jueli, wa jam
        ga moata ba kama, a zaani wa kpaliŋ zaaniŋa a tuk ba nyiŋ.
      sbs: 0.6305
      gen_sec: 9.6
      ref_sec: 12.24
      cer: 0.2212
      wer: 0.2727
    bible_00077:
      source: bible
      text: Naawen ale nye dii ale nala la wa nimbie po.
      sbs: 0.7126
      gen_sec: 2.8
      ref_sec: 3.44
      cer: 0.0588
      wer: 0.2
    bible_00078:
      source: bible
      text: Gedor denɔwa Jeroyam nidoabilisaŋa Joela ale Zebadia mɛ jam boro kama.
      sbs: 0.7536
      gen_sec: 9.04
      ref_sec: 7.78
      cer: 0.2712
      wer: 0.6364
    bible_00079:
      source: bible
      text: Ba le ta dakanni a jam Izirali tigsika jigini la, Yofni ale Fineyas a maa va jam.
      sbs: 0.7402
      gen_sec: 6.24
      ref_sec: 7.28
      cer: 0.0794
      wer: 0.2353
    bible_00080:
      source: bible
      text: Viok yaa nyini yeniŋ a gala geŋ a fuk nna balibali ate ba yaa poli ayen nya kude ale deri
        basi kama ate ba nye ba ale poom a yaali dii ayen ba cheŋ la.
      sbs: 0.6822
      gen_sec: 10.56
      ref_sec: 12.3
      cer: 0.0345
      wer: 0.1429
    bible_00081:
      source: bible
      text: Be ka ŋaaŋbiik kala ate Wen nye pumpuulimaŋa a te la.
      sbs: 0.665
      gen_sec: 4.0
      ref_sec: 4.22
      cer: 0.1905
      wer: 0.3636
    bible_00082:
      source: bible
      text: Baai ale a nye ti la ale nye ase ka bɔgtaŋa la, ale baai meena ale ta sebchakka ale ti la.
      sbs: 0.7566
      gen_sec: 8.8
      ref_sec: 7.28
      cer: 0.1029
      wer: 0.381
    bible_00083:
      source: bible
      text: Deevid yaa jam tigsi Izirali demma meena Jerusalem po ayen wa ta Naawen nɔiyeŋka dakanni a
        jam juijui ate wa gomsi a magsi di la po.
      sbs: 0.6638
      gen_sec: 10.16
      ref_sec: 12.3
      cer: 0.0377
      wer: 0.1923
    bible_00084:
      source: bible
      text: Waai karo a nye wamaŋŋa, wanyi mɛ la a ka.
      sbs: 0.671
      gen_sec: 3.2
      ref_sec: 3.48
      cer: 0.1613
      wer: 0.7
    bible_00085:
      source: bible
      text: Legi a karo, birim jigi a karo ate nuru baata a suk.
      sbs: 0.7533
      gen_sec: 4.48
      ref_sec: 5.08
      cer: 0.0256
      wer: 0.25
    bible_00086:
      source: bible
      text: Tugurik tɔŋdɔba kobsiyuebi ale jam bo ale wa.
      sbs: 0.7647
      gen_sec: 3.76
      ref_sec: 3.26
      cer: 0.0541
      wer: 0.25
    bible_00087:
      source: bible
      text: Dii ale di sak ayen mi ale a tom fu la ale nna.
      sbs: 0.6769
      gen_sec: 3.12
      ref_sec: 4.32
      cer: 0.0882
      wer: 0.3846
    bible_00088:
      source: bible
      text: Pai tana ŋaye ate ŋa yik ŋa a tanla garuk genni ŋmankpalaŋa zuk ase tintain ŋaai ale ŋa chim
        teerika a te Izirali nidoabilisaŋa.
      sbs: 0.6589
      gen_sec: 8.48
      ref_sec: 12.3
      cer: 0.1154
      wer: 0.5833
    bible_00089:
      source: bible
      text: Wa jam basi ate suŋsuŋka chimmu a vi zaŋŋa zuk a nyini ka kpeglimka a ga paari kpegli kinkala.
      sbs: 0.703
      gen_sec: 6.08
      ref_sec: 9.3
      cer: 0.0933
      wer: 0.3684
    bible_00090:
      source: bible
      text: Baai ale ta siaka ale Yeezu la, a yaa jam waaŋ chaab Judia ale Samaria tɛŋsaŋa meena po.
      sbs: 0.6964
      gen_sec: 6.72
      ref_sec: 6.88
      cer: 0.0435
      wer: 0.0556
    bible_00091:
      source: bible
      text: Ba pai ka daa ŋata a cheŋ a paari ka.
      sbs: 0.6566
      gen_sec: 2.32
      ref_sec: 3.2
      cer: 0.0
      wer: 0.0
    bible_00092:
      source: bible
      text: Ase nuru ale jam weeni Deevid nuruma wie la, wa yaa tom nuruba ayen ba tu ba, ba jam nyo ba
        ka chivie po nna yegayega.
      sbs: 0.6861
      gen_sec: 7.28
      ref_sec: 9.7
      cer: 0.0
      wer: 0.0
    bible_00093:
      source: bible
      text: Yasabia ale Jesaiya ale nyini Merari buuni po la ale wa suataŋa ale wa suataŋa bisaŋa a jam
        ka nuruba pisiye.
      sbs: 0.6465
      gen_sec: 9.92
      ref_sec: 14.6
      cer: 0.0795
      wer: 0.3333
    bible_00094:
      source: bible
      text: Ku be ka Wen tomtomiŋ maŋka de nyiŋ ale soa ate mi Pɔɔl yaa chim tomteerɔ.
      sbs: 0.5847
      gen_sec: 5.36
      ref_sec: 5.6
      cer: 0.1552
      wer: 0.375
    bible_00095:
      source: bible
      text: Filistia demma a jam ta ka ganduok, wa yuei jam le Goliat a nyini Gat.
      sbs: 0.6927
      gen_sec: 6.96
      ref_sec: 6.6
      cer: 0.1296
      wer: 0.2667
    bible_00096:
      source: bible
      text: Moosis ale wom nna la, wa yaa suk wa nimbidiaka dii nyiŋla wa jam a chali ka yɔgsum ale wa
        le nya Wen la.
      sbs: 0.6913
      gen_sec: 6.8
      ref_sec: 8.1
      cer: 0.025
      wer: 0.2917
    bible_00097:
      source: bible
      text: <<Cheŋ Niineve tɛŋ kpieŋka a weeni ba wa dii ate m pai te fu ayen fi weeni ba la.
      sbs: 0.6678
      gen_sec: 5.28
      ref_sec: 7.92
      cer: 0.15
      wer: 0.1579
    bible_00098:
      source: bible
      text: Ba jam gu ba kobaŋa ka Jabes tiib kpiemu kiri ale bobi nɔi daa ŋayopɔi.
      sbs: 0.6573
      gen_sec: 5.2
      ref_sec: 6.78
      cer: 0.1429
      wer: 0.4667
    bible_00099:
      source: bible
      text: '>> Ase Izirali tigsuŋku meena ale diem jam za dula la, naawa yaa viriŋ niak ba.'
      sbs: 0.7107
      gen_sec: 5.52
      ref_sec: 6.44
      cer: 0.05
      wer: 0.2667
    bible_00100:
      source: bible
      text: Wa yaa weeni wa chorɔwa Abram ayen, <<Naawen a kasi mu kama ale bisa biam.
      sbs: 0.6723
      gen_sec: 4.48
      ref_sec: 5.68
      cer: 0.1429
      wer: 0.4
    bible_00101:
      source: bible
      text: Wa tuesi wa suoku nidoabinni Lɔti ale wa ŋantaŋa meena ale nipooma ale nuru yontaŋa.
      sbs: 0.6925
      gen_sec: 6.64
      ref_sec: 8.1
      cer: 0.1014
      wer: 0.3333
    bible_00102:
      source: bible
      text: Piilim ka danni ni nye tuilum tigsuŋ ale daa ŋayopɔiwa danni mɛ ni ŋman nye tuilum tigsuŋ.
      sbs: 0.6442
      gen_sec: 6.24
      ref_sec: 8.8
      cer: 0.4384
      wer: 0.7647
    bible_00103:
      source: bible
      text: Ba yaa bek Izirali demma a tuesi kpana ale ligmɔniŋ ale gatta.
      sbs: 0.7032
      gen_sec: 4.0
      ref_sec: 4.72
      cer: 0.06
      wer: 0.1667
    bible_00104:
      source: bible
      text: Ester an jam basi ate ba seba wa nuruma yaase wa buuni, dii nyiŋla, Mordekai ale weeni wa
        ayen wa kan basi ate ba seba.
      sbs: 0.5811
      gen_sec: 9.6
      ref_sec: 11.08
      cer: 0.25
      wer: 0.8
    bible_00105:
      source: bible
      text: Ate wa yaa niak Abram ayen, <<Wen Dii Ale Bo Wenŋmazuk La a niak Abram, wa ka waai ale nye
        wenzuk ale tɛŋ.
      sbs: 0.727
      gen_sec: 7.2
      ref_sec: 10.1
      cer: 0.0759
      wer: 0.2609
    bible_00106:
      source: bible
      text: Nama dek seba Wen ale a yaali diila kama.
      sbs: 0.6749
      gen_sec: 3.84
      ref_sec: 3.42
      cer: 0.2188
      wer: 0.7778
    bible_00107:
      source: bible
      text: 'Naawen Dii Ale A Dɛ Tugurik Tɔŋdɔma Niŋ La ale weeni diila ale nna: <<Poli yɔgyɔgla!'
      sbs: 0.6094
      gen_sec: 6.88
      ref_sec: 6.3
      cer: 0.2615
      wer: 0.625
    bible_00108:
      source: bible
      text: Ate Pabiika yaa ŋman foli bobi kaai ale saari bunaansiwa.
      sbs: 0.6585
      gen_sec: 4.0
      ref_sec: 4.7
      cer: 0.0638
      wer: 0.3
    bible_00109:
      source: bible
      text: Wa diem ayen wa basi ate ka laata a bo fi nɔi po abe suipeentik nuemka a bo fi nɔngbanvaata
        po.
      sbs: 0.7149
      gen_sec: 7.6
      ref_sec: 8.7
      cer: 0.1216
      wer: 0.3333
    bible_00110:
      source: bible
      text: Fi yik mu kama niŋ ale ŋaaŋ a tara, fi basi ate fi nisa a bo m zuk.
      sbs: 0.634
      gen_sec: 4.88
      ref_sec: 5.24
      cer: 0.0208
      wer: 0.0556
    bible_00111:
      source: bible
      text: Ba jam nak Filistia tugurik tɔŋdɔma dɛ kama, ale tusi ba ta gaam Bet Aven a basi.
      sbs: 0.5779
      gen_sec: 6.64
      ref_sec: 5.56
      cer: 0.3016
      wer: 0.8824
    bible_00112:
      source: bible
      text: Te nuru baai ale magsi ni te ba zula la.
      sbs: 0.6759
      gen_sec: 3.04
      ref_sec: 3.22
      cer: 0.0333
      wer: 0.1
    bible_00113:
      source: bible
      text: Dila Jeyoiachin yaa yeeri wa likka gattaŋa a dueni nakpiak alege ate wa boka po meena wa a
        dɛ ale naawa.
      sbs: 0.6491
      gen_sec: 6.8
      ref_sec: 10.74
      cer: 0.1084
      wer: 0.3333
    bible_00114:
      source: bible
      text: M le ŋmarisi Wen yuenni ale wa tɛŋka yuenni a dueni ba nyiŋ.
      sbs: 0.6115
      gen_sec: 3.68
      ref_sec: 5.56
      cer: 0.3404
      wer: 0.5385
    bible_00115:
      source: bible
      text: Ate wa yaa weeni Naawa yenni kpaŋŋa ayen ba kan te wa ŋandiinta ale da buui ate ba a chari
        naawa yenni po la.
      sbs: 0.6886
      gen_sec: 8.08
      ref_sec: 8.42
      cer: 0.0
      wer: 0.0833
    bible_00116:
      source: bible
      text: Ba kisi mu nna la kama ayen dii ate ba ŋmarisi Wen Gbaŋka po la a chim wensie.
      sbs: 0.6368
      gen_sec: 4.08
      ref_sec: 6.74
      cer: 0.1
      wer: 0.2778
    bible_00117:
      source: bible
      text: Nuru waai ale a misi nya buui ale basi ate nuru a nye cheri la, ku a fɛ ate wa mɛ sugri wa
        gattaŋa.
      sbs: 0.7229
      gen_sec: 6.4
      ref_sec: 7.62
      cer: 0.0676
      wer: 0.2917
    bible_00118:
      source: bible
      text: Kirisita tigini demma abe a nye tuka ka wala yenni.
      sbs: 0.6586
      gen_sec: 3.68
      ref_sec: 3.82
      cer: 0.1463
      wer: 0.2
    bible_00119:
      source: bible
      text: Ba dachaasaŋa ale yik ba ta ga basi badek tɛŋ po ate m le te ba ko ba.
      sbs: 0.7032
      gen_sec: 5.68
      ref_sec: 6.36
      cer: 0.0769
      wer: 0.3889
    bible_00120:
      source: bible
      text: Waai abe dan zɛri kpaŋŋa de noa, kula nyɔnɔwa a zɛri ka baai ate Wen lueri zaan du la noa.
      sbs: 0.6381
      gen_sec: 8.72
      ref_sec: 8.52
      cer: 0.1449
      wer: 0.25
    bible_00121:
      source: bible
      text: Alege nya, ni a pai ni sebchakka a basi ka pimpaasima wie ŋaai ale kan ta kiri la.
