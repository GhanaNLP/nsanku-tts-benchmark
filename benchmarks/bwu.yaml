      gen_sec: 10.88
      ref_sec: 10.96
      cer: 0.5701
      wer: 0.6154
    bible_00152:
      source: bible
      text: Sinsaŋŋa a gumdu kama ayen ŋa sak wakaasima ale ka diila, abe ŋa boro a ta ga paari diipo
