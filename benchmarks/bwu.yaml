      text: Ba jam ta ka nuru baai ate Naab Deevid ale wa nuruma a jam lueri ayen ba a maari Livaima kobsiye
        ale pisiye wa la a jam.
      sbs: 0.6217
      gen_sec: 11.16
      ref_sec: 13.94
      cer: 0.1183
      wer: 0.2593
    bible_00071:
      source: bible
      text: Ba kan pai ba a nyo chivie po ase ba nin ta chaab ale ba dachaasaŋa nansuiŋku nɔi ya.
      sbs: 0.5995
      gen_sec: 7.48
      ref_sec: 8.66
      cer: 0.2273
      wer: 0.5263
    bible_00072:
      source: bible
      text: Diila m basi kama ate fi chim tɛŋsa yega ko.
      sbs: 0.6137
      gen_sec: 4.8
      ref_sec: 3.76
      cer: 0.1176
      wer: 0.7
    bible_00073:
      source: bible
      text: Ba giŋgeluŋtaŋa ka pein yaani, ti a biisi ka venta.
      sbs: 0.6069
      gen_sec: 4.24
      ref_sec: 3.82
      cer: 0.125
      wer: 0.6
    bible_00074:
      source: bible
      text: Ase Yadadezer nuruma ale ga nya ale Izirali demma a nak yik ba la, ba yaa nye nɔiyeŋ ale Deevid
        a siak te wa.
      sbs: 0.6046
      gen_sec: 9.24
      ref_sec: 9.54
      cer: 0.1548
      wer: 0.375
    bible_00075:
      source: bible
      text: <<Dila wom mi, nama baai ale a miŋ la.
      sbs: 0.644
      gen_sec: 4.0
      ref_sec: 3.26
      cer: 0.1154
      wer: 0.5556
    bible_00076:
      source: bible
      text: Ase Deevid ale ga wom kude la, wa yaa tigsi Izirali meena a lo Jodan Benni a jueli, wa jam
        ga moata ba kama, a zaani wa kpaliŋ zaaniŋa a tuk ba nyiŋ.
      sbs: 0.595
      gen_sec: 13.52
      ref_sec: 12.24
      cer: 0.0531
      wer: 0.2727
    bible_00077:
      source: bible
      text: Naawen ale nye dii ale nala la wa nimbie po.
      sbs: 0.6399
      gen_sec: 4.12
      ref_sec: 3.44
      cer: 0.1176
      wer: 0.3
    bible_00078:
      source: bible
      text: Gedor denɔwa Jeroyam nidoabilisaŋa Joela ale Zebadia mɛ jam boro kama.
      sbs: 0.6016
      gen_sec: 8.08
      ref_sec: 7.78
      cer: 0.1864
      wer: 0.8182
    bible_00079:
      source: bible
      text: Ba le ta dakanni a jam Izirali tigsika jigini la, Yofni ale Fineyas a maa va jam.
      sbs: 0.5959
      gen_sec: 6.96
      ref_sec: 7.28
      cer: 0.1111
      wer: 0.5294
    bible_00080:
      source: bible
      text: Viok yaa nyini yeniŋ a gala geŋ a fuk nna balibali ate ba yaa poli ayen nya kude ale deri
        basi kama ate ba nye ba ale poom a yaali dii ayen ba cheŋ la.
      sbs: 0.5679
      gen_sec: 14.4
      ref_sec: 12.3
      cer: 0.0431
      wer: 0.2
    bible_00081:
      source: bible
      text: Be ka ŋaaŋbiik kala ate Wen nye pumpuulimaŋa a te la.
      sbs: 0.605
      gen_sec: 2.84
      ref_sec: 4.22
      cer: 0.6429
      wer: 1.0
    bible_00082:
      source: bible
      text: Baai ale a nye ti la ale nye ase ka bɔgtaŋa la, ale baai meena ale ta sebchakka ale ti la.
      sbs: 0.6124
      gen_sec: 7.96
      ref_sec: 7.28
      cer: 0.1176
      wer: 0.4762
    bible_00083:
      source: bible
      text: Deevid yaa jam tigsi Izirali demma meena Jerusalem po ayen wa ta Naawen nɔiyeŋka dakanni a
        jam juijui ate wa gomsi a magsi di la po.
      sbs: 0.5869
      gen_sec: 11.72
      ref_sec: 12.3
      cer: 0.1038
      wer: 0.4231
    bible_00084:
      source: bible
      text: Waai karo a nye wamaŋŋa, wanyi mɛ la a ka.
      sbs: 0.612
      gen_sec: 4.6
      ref_sec: 3.48
      cer: 0.1613
      wer: 0.5
    bible_00085:
      source: bible
      text: Legi a karo, birim jigi a karo ate nuru baata a suk.
      sbs: 0.6065
      gen_sec: 5.68
      ref_sec: 5.08
      cer: 0.1026
      wer: 0.5833
    bible_00086:
      source: bible
      text: Tugurik tɔŋdɔba kobsiyuebi ale jam bo ale wa.
      sbs: 0.6444
      gen_sec: 4.72
      ref_sec: 3.26
      cer: 0.1351
      wer: 0.625
    bible_00087:
      source: bible
      text: Dii ale di sak ayen mi ale a tom fu la ale nna.
      sbs: 0.6136
      gen_sec: 4.6
      ref_sec: 4.32
      cer: 0.0882
      wer: 0.5385
    bible_00088:
      source: bible
      text: Pai tana ŋaye ate ŋa yik ŋa a tanla garuk genni ŋmankpalaŋa zuk ase tintain ŋaai ale ŋa chim
        teerika a te Izirali nidoabilisaŋa.
      sbs: 0.5969
      gen_sec: 10.96
      ref_sec: 12.3
      cer: 0.1827
      wer: 0.875
    bible_00089:
      source: bible
      text: Wa jam basi ate suŋsuŋka chimmu a vi zaŋŋa zuk a nyini ka kpeglimka a ga paari kpegli kinkala.
      sbs: 0.6635
      gen_sec: 11.16
      ref_sec: 9.3
      cer: 0.1333
      wer: 0.6842
    bible_00090:
      source: bible
      text: Baai ale ta siaka ale Yeezu la, a yaa jam waaŋ chaab Judia ale Samaria tɛŋsaŋa meena po.
      sbs: 0.6243
      gen_sec: 8.2
      ref_sec: 6.88
      cer: 0.1159
      wer: 0.3333
    bible_00091:
      source: bible
      text: Ba pai ka daa ŋata a cheŋ a paari ka.
      sbs: 0.6332
      gen_sec: 3.0
      ref_sec: 3.2
      cer: 0.0741
      wer: 0.4
    bible_00092:
      source: bible
      text: Ase nuru ale jam weeni Deevid nuruma wie la, wa yaa tom nuruba ayen ba tu ba, ba jam nyo ba
        ka chivie po nna yegayega.
      sbs: 0.6232
      gen_sec: 11.2
      ref_sec: 9.7
      cer: 0.1222
      wer: 0.4615
    bible_00093:
      source: bible
      text: Yasabia ale Jesaiya ale nyini Merari buuni po la ale wa suataŋa ale wa suataŋa bisaŋa a jam
        ka nuruba pisiye.
      sbs: 0.6255
      gen_sec: 13.04
      ref_sec: 14.6
      cer: 0.1818
      wer: 0.5714
    bible_00094:
      source: bible
      text: Ku be ka Wen tomtomiŋ maŋka de nyiŋ ale soa ate mi Pɔɔl yaa chim tomteerɔ.
      sbs: 0.592
      gen_sec: 7.44
      ref_sec: 5.6
      cer: 0.1379
      wer: 0.5625
    bible_00095:
      source: bible
      text: Filistia demma a jam ta ka ganduok, wa yuei jam le Goliat a nyini Gat.
      sbs: 0.608
      gen_sec: 7.2
      ref_sec: 6.6
      cer: 0.2037
      wer: 0.4667
    bible_00096:
      source: bible
      text: Moosis ale wom nna la, wa yaa suk wa nimbidiaka dii nyiŋla wa jam a chali ka yɔgsum ale wa
        le nya Wen la.
      sbs: 0.6143
      gen_sec: 9.28
      ref_sec: 8.1
      cer: 0.125
      wer: 0.4167
    bible_00097:
      source: bible
      text: <<Cheŋ Niineve tɛŋ kpieŋka a weeni ba wa dii ate m pai te fu ayen fi weeni ba la.
      sbs: 0.5984
      gen_sec: 7.64
      ref_sec: 7.92
      cer: 0.1167
      wer: 0.5263
    bible_00098:
      source: bible
      text: Ba jam gu ba kobaŋa ka Jabes tiib kpiemu kiri ale bobi nɔi daa ŋayopɔi.
      sbs: 0.5917
      gen_sec: 7.2
      ref_sec: 6.78
      cer: 0.1607
      wer: 0.4667
    bible_00099:
      source: bible
      text: '>> Ase Izirali tigsuŋku meena ale diem jam za dula la, naawa yaa viriŋ niak ba.'
      sbs: 0.6021
      gen_sec: 6.88
      ref_sec: 6.44
      cer: 0.1833
      wer: 0.6
    bible_00100:
      source: bible
      text: Wa yaa weeni wa chorɔwa Abram ayen, <<Naawen a kasi mu kama ale bisa biam.
      sbs: 0.6042
      gen_sec: 8.72
      ref_sec: 5.68
      cer: 0.0714
      wer: 0.2667
    bible_00101:
      source: bible
      text: Wa tuesi wa suoku nidoabinni Lɔti ale wa ŋantaŋa meena ale nipooma ale nuru yontaŋa.
      sbs: 0.6084
      gen_sec: 10.84
      ref_sec: 8.1
      cer: 0.2174
      wer: 0.8
    bible_00102:
      source: bible
      text: Piilim ka danni ni nye tuilum tigsuŋ ale daa ŋayopɔiwa danni mɛ ni ŋman nye tuilum tigsuŋ.
      sbs: 0.6861
      gen_sec: 11.2
      ref_sec: 8.8
      cer: 0.2603
      wer: 1.0588
    bible_00103:
      source: bible
      text: Ba yaa bek Izirali demma a tuesi kpana ale ligmɔniŋ ale gatta.
      sbs: 0.6288
      gen_sec: 6.56
      ref_sec: 4.72
      cer: 0.08
      wer: 0.25
    bible_00104:
      source: bible
      text: Ester an jam basi ate ba seba wa nuruma yaase wa buuni, dii nyiŋla, Mordekai ale weeni wa
        ayen wa kan basi ate ba seba.
      sbs: 0.6418
      gen_sec: 8.68
      ref_sec: 11.08
      cer: 0.1413
      wer: 0.56
    bible_00105:
      source: bible
      text: Ate wa yaa niak Abram ayen, <<Wen Dii Ale Bo Wenŋmazuk La a niak Abram, wa ka waai ale nye
        wenzuk ale tɛŋ.
      sbs: 0.6601
      gen_sec: 9.44
      ref_sec: 10.1
      cer: 0.3544
      wer: 0.5652
    bible_00106:
      source: bible
      text: Nama dek seba Wen ale a yaali diila kama.
      sbs: 0.6122
      gen_sec: 4.52
      ref_sec: 3.42
      cer: 0.0938
      wer: 0.3333
    bible_00107:
      source: bible
      text: 'Naawen Dii Ale A Dɛ Tugurik Tɔŋdɔma Niŋ La ale weeni diila ale nna: <<Poli yɔgyɔgla!'
      sbs: 0.6201
      gen_sec: 8.56
      ref_sec: 6.3
      cer: 0.1231
      wer: 0.5
    bible_00108:
      source: bible
      text: Ate Pabiika yaa ŋman foli bobi kaai ale saari bunaansiwa.
      sbs: 0.5972
      gen_sec: 5.6
      ref_sec: 4.7
      cer: 0.1702
      wer: 0.5
    bible_00109:
      source: bible
      text: Wa diem ayen wa basi ate ka laata a bo fi nɔi po abe suipeentik nuemka a bo fi nɔngbanvaata
        po.
      sbs: 0.6421
      gen_sec: 8.64
      ref_sec: 8.7
      cer: 0.1757
      wer: 0.5238
    bible_00110:
      source: bible
      text: Fi yik mu kama niŋ ale ŋaaŋ a tara, fi basi ate fi nisa a bo m zuk.
      sbs: 0.5988
      gen_sec: 7.24
      ref_sec: 5.24
      cer: 0.125
      wer: 0.3333
    bible_00111:
      source: bible
      text: Ba jam nak Filistia tugurik tɔŋdɔma dɛ kama, ale tusi ba ta gaam Bet Aven a basi.
      sbs: 0.5927
      gen_sec: 7.6
      ref_sec: 5.56
      cer: 0.0952
      wer: 0.3529
    bible_00112:
      source: bible
      text: Te nuru baai ale magsi ni te ba zula la.
      sbs: 0.5526
      gen_sec: 4.32
      ref_sec: 3.22
      cer: 0.2667
      wer: 0.6
    bible_00113:
      source: bible
      text: Dila Jeyoiachin yaa yeeri wa likka gattaŋa a dueni nakpiak alege ate wa boka po meena wa a
        dɛ ale naawa.
      sbs: 0.6266
      gen_sec: 11.92
      ref_sec: 10.74
      cer: 0.1446
      wer: 0.619
    bible_00114:
      source: bible
      text: M le ŋmarisi Wen yuenni ale wa tɛŋka yuenni a dueni ba nyiŋ.
      sbs: 0.5743
      gen_sec: 5.6
      ref_sec: 5.56
      cer: 0.1277
      wer: 0.6923
    bible_00115:
      source: bible
      text: Ate wa yaa weeni Naawa yenni kpaŋŋa ayen ba kan te wa ŋandiinta ale da buui ate ba a chari
        naawa yenni po la.
      sbs: 0.6047
      gen_sec: 9.56
      ref_sec: 8.42
      cer: 0.0235
      wer: 0.0833
    bible_00116:
      source: bible
      text: Ba kisi mu nna la kama ayen dii ate ba ŋmarisi Wen Gbaŋka po la a chim wensie.
      sbs: 0.5945
      gen_sec: 6.4
      ref_sec: 6.74
      cer: 0.1667
      wer: 0.4444
    bible_00117:
      source: bible
      text: Nuru waai ale a misi nya buui ale basi ate nuru a nye cheri la, ku a fɛ ate wa mɛ sugri wa
        gattaŋa.
      sbs: 0.6095
      gen_sec: 11.12
      ref_sec: 7.62
      cer: 0.1351
      wer: 0.375
    bible_00118:
      source: bible
      text: Kirisita tigini demma abe a nye tuka ka wala yenni.
      sbs: 0.5941
      gen_sec: 4.28
      ref_sec: 3.82
      cer: 0.0488
      wer: 0.2
    bible_00119:
      source: bible
      text: Ba dachaasaŋa ale yik ba ta ga basi badek tɛŋ po ate m le te ba ko ba.
      sbs: 0.6187
      gen_sec: 5.68
      ref_sec: 6.36
      cer: 0.0962
      wer: 0.3889
    bible_00120:
      source: bible
      text: Waai abe dan zɛri kpaŋŋa de noa, kula nyɔnɔwa a zɛri ka baai ate Wen lueri zaan du la noa.
      sbs: 0.6044
      gen_sec: 8.68
      ref_sec: 8.52
      cer: 0.1014
      wer: 0.3
    bible_00121:
      source: bible
      text: Alege nya, ni a pai ni sebchakka a basi ka pimpaasima wie ŋaai ale kan ta kiri la.
      sbs: 0.5635
      gen_sec: 7.92
      ref_sec: 6.64
      cer: 0.254
      wer: 0.6667
    bible_00122:
      source: bible
      text: Wa ale vari baai ale a silim la gebi kaai ale bo ba noaŋa po la jigi a basi.
      sbs: 0.6388
      gen_sec: 8.8
      ref_sec: 7.22
      cer: 0.1053
      wer: 0.3158
    bible_00123:
      source: bible
      text: Ase ba ale jam paari Kidon ŋanta fɔbika jigini la, Uzzaya yaa laari wa nisaŋa ayen wa yik
        dakanni, dii nyiŋla lalisaŋa nyiŋsa ale jam a gɔk.
      sbs: 0.5788
      gen_sec: 12.6
      ref_sec: 13.9
      cer: 0.1351
      wer: 0.5185
    bible_00124:
      source: bible
      text: Ba le ba nam diila a nye se ka nueoŋ ale dom fu ate fi a nam diila.
      sbs: 0.5979
      gen_sec: 6.56
      ref_sec: 5.66
      cer: 0.2245
      wer: 0.8333
    bible_00125:
      source: bible
      text: Nuruma ale jam a paari la, Piita yaa deri basi dɛka ale nuruma dii nyiŋla, wa jam a chali
        ka yɔgsum ale baai ale jam maa siak ayen baai ale kan daa Juuba la a gebi ba yoaŋa la.
      sbs: 0.5964
      gen_sec: 15.6
      ref_sec: 13.76
      cer: 0.1037
      wer: 0.2564
    bible_00126:
      source: bible
      text: Miriam ale Aaron a yaa piilim a biisi Moosis a kaasi Kus tɛŋka liewa ate wa jam faari la nyiŋ.
      sbs: 0.6426
      gen_sec: 10.04
      ref_sec: 8.08
      cer: 0.0676
      wer: 0.25
    bible_00127:
      source: bible
      text: Yɔgyɔgla de nuruma ale ba pooma a yaa kaari nna tuotuowa a ta chaab ale ba suataŋa Juuma.
      sbs: 0.5975
      gen_sec: 8.6
      ref_sec: 9.54
      cer: 0.0563
      wer: 0.1667
    bible_00128:
      source: bible
      text: Ase mi nin basi ate Nabal nuruma wanyi mɛ la a bɛ alege ate vari a veenti.
      sbs: 0.6078
      gen_sec: 7.52
      ref_sec: 5.6
      cer: 0.193
      wer: 0.8235
    bible_00129:
      source: bible
      text: Nama mɛ abe le ta siaka dii ale wa la ale maari ka mi mɛ.
      sbs: 0.6278
      gen_sec: 5.12
      ref_sec: 5.84
      cer: 0.1667
      wer: 0.4667
    bible_00130:
      source: bible
      text: Alege ba an wom ya yaase ba popola a boro, ba goanti va ka badek tuikpanni ale ba popola baataŋa
        ale a yaali diila.
      sbs: 0.603
      gen_sec: 10.64
      ref_sec: 9.68
      cer: 0.0444
      wer: 0.4583
    bible_00131:
      source: bible
      text: Wala ale saafiik kaai ale baga a lak Wen Yammu ale wa sebchakka ale suk juijui la ate ti a
        nya.
      sbs: 0.61
      gen_sec: 9.24
      ref_sec: 8.66
      cer: 0.2432
      wer: 0.8095
    bible_00132:
      source: bible
      text: '>> Ba jam a wom wa kama nalimnyiini dii nyiŋla, wa wakperikaliisaŋa a jam cha ba beni ka
        nna yegayega.'
      sbs: 0.6288
      gen_sec: 9.56
      ref_sec: 6.28
      cer: 0.038
      wer: 0.3684
    bible_00133:
      source: bible
      text: Pa di a te kaabteerɔwa Eleaza, ni ta di a nyini ni boka jigini a nyini peelim a tɔgri di wa
        niŋ.
      sbs: 0.6093
      gen_sec: 7.48
      ref_sec: 7.6
      cer: 0.1096
      wer: 0.4091
    bible_00134:
      source: bible
      text: Ni da garuk peelita mɛ mi jigi a lik ni chivieŋa.
      sbs: 0.5831
      gen_sec: 5.4
      ref_sec: 3.64
      cer: 0.1053
      wer: 0.4545
    bible_00135:
      source: bible
      text: Fi le poom nak gbaŋ a te baai ale kan ta koba la abe fi pai ŋanta a tagri fi doa.
      sbs: 0.6047
      gen_sec: 7.72
      ref_sec: 7.48
      cer: 0.0833
      wer: 0.3333
    bible_00136:
      source: bible
      text: Wamaŋsaŋa de ka ŋaai ate wa puulim a biisi ŋa dipo ate wa biisiteerɔma a ŋmarisi nyo Wen gbaŋka
        po la.
      sbs: 0.6021
      gen_sec: 9.48
      ref_sec: 9.04
      cer: 0.0617
      wer: 0.4286
    bible_00137:
      source: bible
      text: A nyini wala jigini, Sekania nidoabinni Sɛmaiya ate wa a nya Kori Nansuiŋku la a sɛ.
      sbs: 0.6388
      gen_sec: 9.28
      ref_sec: 9.08
      cer: 0.0746
      wer: 0.25
    bible_00138:
      source: bible
      text: Alege tugurik tɔŋdɔma kpagni a kan jam a yaali ayen wa ko Pɔɔl.
      sbs: 0.5697
      gen_sec: 5.28
      ref_sec: 3.5
      cer: 0.14
      wer: 0.3846
    bible_00139:
      source: bible
      text: Mi dan cheem nya mi gauŋ, waai a karo a maari mu, waai a karo a lik mu.
      sbs: 0.6409
      gen_sec: 7.44
      ref_sec: 6.08
      cer: 0.0784
      wer: 0.1667
    bible_00140:
      source: bible
      text: Mi a chiini ba ase ka mi dachaasa la.
      sbs: 0.6196
      gen_sec: 3.16
      ref_sec: 3.16
      cer: 0.0714
      wer: 0.3333
    bible_00141:
      source: bible
      text: Naawen a basi ate bela a kpeeri meena ale basi ate beli naŋsa nyiam a kan chali.
      sbs: 0.6021
      gen_sec: 6.8
      ref_sec: 8.06
      cer: 0.2063
      wer: 0.8824
    bible_00142:
      source: bible
      text: Dii nyiŋla Naawen a weeni Moosis kama ayen, <<Weeni Izirali demma ayen, <Ni ka tukpari nyam.
      sbs: 0.6577
      gen_sec: 8.4
      ref_sec: 7.16
      cer: 0.1831
      wer: 0.4375
    bible_00143:
      source: bible
      text: Naawen a jam te Deevid ka nak dɛka juijui meena ate wa jam cheŋ la.
      sbs: 0.6243
      gen_sec: 5.12
      ref_sec: 5.6
      cer: 0.1538
      wer: 0.7333
    bible_00144:
      source: bible
      text: Ba le tɛŋzuk de demma a daa bunyi ase mi ale tɛŋka meena demma ale kan daa bunyi diila.
      sbs: 0.6172
      gen_sec: 7.52
      ref_sec: 6.5
      cer: 0.1029
      wer: 0.3684
    bible_00145:
      source: bible
      text: Wen maarɔ waai ale jam saari bayuebiwa la a yaa peeri wa damuniŋka ate mi yaa wom lueluk ale
        ku nyini ligmɔniŋ kuŋkuŋku nyiila ŋanaansiwa ale bo Wen niŋ la a jam.
      sbs: 0.5874
      gen_sec: 13.24
      ref_sec: 14.78
      cer: 0.0538
      wer: 0.2188
    bible_00146:
      source: bible
      text: Daa ŋayopɔi nye biem duisi basika a te kuŋkuŋku a gaari ku.
