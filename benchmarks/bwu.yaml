      sbs: 0.7257
      gen_sec: 10.75
      ref_sec: 14.6
      cer: 0.0795
      wer: 0.1905
    bible_00094:
      source: bible
      text: Ku be ka Wen tomtomiŋ maŋka de nyiŋ ale soa ate mi Pɔɔl yaa chim tomteerɔ.
      sbs: 0.6955
      gen_sec: 7.25
      ref_sec: 5.6
      cer: 0.0862
      wer: 0.1875
    bible_00095:
      source: bible
