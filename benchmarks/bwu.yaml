      sbs: 0.7432
      gen_sec: 10.92
      ref_sec: 13.94
      cer: 0.0215
      wer: 0.1481
    bible_00071:
      source: bible
      text: Ba kan pai ba a nyo chivie po ase ba nin ta chaab ale ba dachaasaŋa nansuiŋku nɔi ya.
      sbs: 0.8117
      gen_sec: 8.02
      ref_sec: 8.66
      cer: 0.0606
      wer: 0.2105
    bible_00072:
      source: bible
      text: Diila m basi kama ate fi chim tɛŋsa yega ko.
      sbs: 0.739
      gen_sec: 4.18
      ref_sec: 3.76
      cer: 0.0294
      wer: 0.3
    bible_00073:
      source: bible
      text: Ba giŋgeluŋtaŋa ka pein yaani, ti a biisi ka venta.
      sbs: 0.7505
      gen_sec: 5.21
      ref_sec: 3.82
      cer: 0.1
      wer: 0.2
    bible_00074:
      source: bible
      text: Ase Yadadezer nuruma ale ga nya ale Izirali demma a nak yik ba la, ba yaa nye nɔiyeŋ ale Deevid
