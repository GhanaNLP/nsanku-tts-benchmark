      gen_sec: 8.0
      ref_sec: 13.94
      cer: 0.0645
      wer: 0.2222
    bible_00071:
      source: bible
      text: Ba kan pai ba a nyo chivie po ase ba nin ta chaab ale ba dachaasaŋa nansuiŋku nɔi ya.
