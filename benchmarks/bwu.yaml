      gen_sec: 5.04
      ref_sec: 5.38
      cer: 0.0
      wer: 0.0
    bible_00150:
      source: bible
      text: Dila nyiŋla, diipo ate tama wom ni wie la, tama kasim a puusi Wen a te ni ka dila.
      sbs: 0.6583
      gen_sec: 7.44
      ref_sec: 7.92
      cer: 0.0164
      wer: 0.1579
    bible_00151:
      source: bible
      text: Jonatan yaa weeni waai ale a yik wa kpaliŋ kɔlimaŋa la ayen, <<Jam ti ti cheŋ Filistia tugurik
