      sbs: 0.7393
      gen_sec: 9.9
      ref_sec: 10.74
      cer: 0.0482
      wer: 0.1905
    bible_00114:
      source: bible
      text: M le ŋmarisi Wen yuenni ale wa tɛŋka yuenni a dueni ba nyiŋ.
      sbs: 0.6533
      gen_sec: 5.89
      ref_sec: 5.56
      cer: 0.0
      wer: 0.0
    bible_00115:
      source: bible
      text: Ate wa yaa weeni Naawa yenni kpaŋŋa ayen ba kan te wa ŋandiinta ale da buui ate ba a chari
        naawa yenni po la.
      sbs: 0.7817
      gen_sec: 10.41
      ref_sec: 8.42
      cer: 0.0118
      wer: 0.0417
    bible_00116:
      source: bible
      text: Ba kisi mu nna la kama ayen dii ate ba ŋmarisi Wen Gbaŋka po la a chim wensie.
      sbs: 0.6616
      gen_sec: 7.34
      ref_sec: 6.74
      cer: 0.0333
      wer: 0.2222
    bible_00117:
      source: bible
      text: Nuru waai ale a misi nya buui ale basi ate nuru a nye cheri la, ku a fɛ ate wa mɛ sugri wa
        gattaŋa.
      sbs: 0.7662
      gen_sec: 8.96
      ref_sec: 7.62
      cer: 0.0405
      wer: 0.125
    bible_00118:
      source: bible
      text: Kirisita tigini demma abe a nye tuka ka wala yenni.
      sbs: 0.6584
      gen_sec: 4.86
      ref_sec: 3.82
      cer: 0.2439
      wer: 0.5
    bible_00119:
      source: bible
      text: Ba dachaasaŋa ale yik ba ta ga basi badek tɛŋ po ate m le te ba ko ba.
      sbs: 0.7497
      gen_sec: 6.4
      ref_sec: 6.36
      cer: 0.0192
      wer: 0.1667
    bible_00120:
      source: bible
      text: Waai abe dan zɛri kpaŋŋa de noa, kula nyɔnɔwa a zɛri ka baai ate Wen lueri zaan du la noa.
      sbs: 0.6951
      gen_sec: 8.53
      ref_sec: 8.52
      cer: 0.0145
      wer: 0.05
    bible_00121:
      source: bible
      text: Alege nya, ni a pai ni sebchakka a basi ka pimpaasima wie ŋaai ale kan ta kiri la.
      sbs: 0.7547
      gen_sec: 7.68
      ref_sec: 6.64
      cer: 0.0794
      wer: 0.2222
    bible_00122:
      source: bible
      text: Wa ale vari baai ale a silim la gebi kaai ale bo ba noaŋa po la jigi a basi.
      sbs: 0.7696
      gen_sec: 6.83
      ref_sec: 7.22
      cer: 0.0
      wer: 0.0
    bible_00123:
