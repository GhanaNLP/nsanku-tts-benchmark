      sbs: 0.7276
      gen_sec: 13.16
      ref_sec: 12.3
      cer: 0.0377
      wer: 0.2308
    bible_00084:
      source: bible
      text: Waai karo a nye wamaŋŋa, wanyi mɛ la a ka.
