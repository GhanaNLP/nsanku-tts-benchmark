      sbs: 0.8087
      gen_sec: 9.6
      ref_sec: 10.4
      cer: 0.0
      wer: 0.0
    bible_00166:
      source: bible
      text: Ka wana ate mi ale biisi a te abe m te kaamka?
      sbs: 0.7938
      gen_sec: 4.64
      ref_sec: 5.66
      cer: 0.0
      wer: 0.1667
    bible_00167:
      source: bible
      text: Dila nyiŋ, ni yaa be a nye ase Yeezu Kirisita ale ka diila.
      sbs: 0.6419
      gen_sec: 6.0
      ref_sec: 3.88
      cer: 0.0222
      wer: 0.2308
    bible_00168:
      source: bible
      text: Waai mɛ la bi kan ta niiga yaase duŋ buulim a nyini ate ŋa dɛ jaaboa yaase ŋa nyu nyiamoa.
      sbs: 0.7141
      gen_sec: 9.28
      ref_sec: 9.9
      cer: 0.0857
      wer: 0.25
    bible_00169:
      source: bible
      text: Alege tama baai ale poom kan pai yua gebika chim wari la, tama ta yiila kama ayen Wen Chiika
