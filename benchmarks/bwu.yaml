      gen_sec: 4.8
      ref_sec: 3.64
      cer: 0.0526
      wer: 0.1818
    bible_00135:
      source: bible
      text: Fi le poom nak gbaŋ a te baai ale kan ta koba la abe fi pai ŋanta a tagri fi doa.
