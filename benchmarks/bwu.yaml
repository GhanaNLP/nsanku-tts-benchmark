      gen_sec: 4.78
      ref_sec: 5.08
      cer: 0.2308
      wer: 0.4167
    bible_00086:
      source: bible
      text: Tugurik tɔŋdɔba kobsiyuebi ale jam bo ale wa.
      sbs: 0.7085
      gen_sec: 4.52
      ref_sec: 3.26
      cer: 0.2162
      wer: 0.5
    bible_00087:
      source: bible
      text: Dii ale di sak ayen mi ale a tom fu la ale nna.
      sbs: 0.7724
      gen_sec: 4.1
      ref_sec: 4.32
      cer: 0.0
      wer: 0.0
    bible_00088:
      source: bible
      text: Pai tana ŋaye ate ŋa yik ŋa a tanla garuk genni ŋmankpalaŋa zuk ase tintain ŋaai ale ŋa chim
