      gen_sec: 5.08
      ref_sec: 5.08
      cer: 0.0513
      wer: 0.25
    bible_00086:
      source: bible
      text: Tugurik tɔŋdɔba kobsiyuebi ale jam bo ale wa.
      sbs: 0.7519
      gen_sec: 4.66
      ref_sec: 3.26
      cer: 0.0811
      wer: 0.75
    bible_00087:
      source: bible
      text: Dii ale di sak ayen mi ale a tom fu la ale nna.
      sbs: 0.7296
      gen_sec: 4.46
      ref_sec: 4.32
      cer: 0.1471
      wer: 0.4615
    bible_00088:
      source: bible
      text: Pai tana ŋaye ate ŋa yik ŋa a tanla garuk genni ŋmankpalaŋa zuk ase tintain ŋaai ale ŋa chim
