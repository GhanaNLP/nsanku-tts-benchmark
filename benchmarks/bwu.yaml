      gen_sec: 10.24
      ref_sec: 5.32
      cer: 0.0625
      wer: 0.3333
    bible_00148:
      source: bible
      text: Filistia tugurik tɔŋdɔma a jam siti ba kama ale pagrim a nak dɛ Izirali demma.
