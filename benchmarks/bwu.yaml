      gen_sec: 4.11
      ref_sec: 5.6
      cer: 0.0526
      wer: 0.2941
    bible_00129:
      source: bible
      text: Nama mɛ abe le ta siaka dii ale wa la ale maari ka mi mɛ.
      sbs: 0.6738
