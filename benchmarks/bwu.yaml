      sbs: 0.6254
      gen_sec: 9.6
      ref_sec: 14.78
      cer: 0.9385
      wer: 1.0
    bible_00146:
      source: bible
      text: Daa ŋayopɔi nye biem duisi basika a te kuŋkuŋku a gaari ku.
