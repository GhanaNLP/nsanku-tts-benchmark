      gen_sec: 8.48
      ref_sec: 9.98
      cer: 0.0133
      wer: 0.0435
    bible_00154:
      source: bible
      text: Simeyon dɔkku tugurik tɔŋdɔma ale gomsi a magsi kpaliŋ la jam ka tusa ŋayopɔi ale kook .
