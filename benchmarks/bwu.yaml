      gen_sec: 11.18
      ref_sec: 11.08
      cer: 0.0435
      wer: 0.24
    bible_00105:
      source: bible
      text: Ate wa yaa niak Abram ayen, <<Wen Dii Ale Bo Wenŋmazuk La a niak Abram, wa ka waai ale nye
