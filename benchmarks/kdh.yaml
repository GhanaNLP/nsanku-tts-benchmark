      sbs: 0.6716
      gen_sec: 5.2
      ref_sec: 3.58
      cer: 0.0233
      wer: 0.0833
    bible_00086:
      source: bible
      text: Ńdáná sɩsɩ ɩdɛ́ɛ toovonúm fáa wánlám bɩdɩmɛ́rɛ ɩdɩmɛ́ wánlám yɛ nɛ́ adaá?
