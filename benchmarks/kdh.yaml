      sbs: 0.674
      gen_sec: 3.44
      ref_sec: 4.38
      cer: 0.2051
      wer: 0.875
    bible_00163:
      source: bible
      text: Ɩ́kasɩmná Ɩsɔ́ɔ-dɛ́ɛ tɔ́m welesí riké bɩka mínÿiilím mɩ́dɩ, amá, ɩlá wenbí tɩ́nbɔɔzɩ́
