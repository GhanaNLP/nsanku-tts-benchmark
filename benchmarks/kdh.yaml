      gen_sec: 4.08
      ref_sec: 4.24
      cer: 0.0
      wer: 0.0
    bible_00121:
      source: bible
      text: Ɩrʊ́ Biyaalʊ́ wɛná na kʊ yíko Fɛɛzɩrɛ wɩ́rɛ-rɔ.
