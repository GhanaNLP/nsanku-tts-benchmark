      cer: 0.1615
      wer: 0.76
    bible_00141:
      source: bible
      text: 'Baaŋmáa Ɩsɔ́ɔ-dɛ́ɛ Tɔ́m Tákaraɖá-daá sɩsɩ: «Kaalʊrʊya, nyɔ́ɔ́ weení ńdánlʊrʊ́ nɛ́,
        faarɩ!'
      sbs: 0.665
      gen_sec: 7.2
      ref_sec: 7.98
      cer: 0.2154
      wer: 0.6364
    bible_00142:
      source: bible
      text: Yeésu wénɖíi kíɖíím Simɔ́ɔnɩ Faríizi ńnɩ́-dɛ́ɛ ɖaána-daá.
