      cer: 0.1939
      wer: 0.5909
    bible_00005:
      source: bible
      text: 'Lɛlɛɛɖɔ́ nɛ́ kpɩná náádoozo wɛ ná: bɛɛ toovonúm fáa, tamɔ́ɔ, na sɔɔlɩ́m.'
