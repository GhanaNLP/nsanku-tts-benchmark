      cer: 0.2329
      wer: 0.6154
    bible_00091:
      source: bible
      text: Toovonúm Múúsá waava Ɩsɔ́ɔ nɛ́-rɔ gɛ waalɩ́ɩ Mɩ́sɩra laadɔ́ɔ ɩdatánnɩ́ɩ wúro nɩdáárɛ,
