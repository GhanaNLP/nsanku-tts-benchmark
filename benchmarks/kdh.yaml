      gen_sec: 12.16
      ref_sec: 13.4
      cer: 0.1518
      wer: 0.5238
    bible_00088:
      source: bible
      text: Ɩjáárɩ mɩ́dɩ ise bɩlɛ́, mɩ́nyɔ́ɔ́ ɖʊɖɔ iɖi.
