      gen_sec: 5.4
      ref_sec: 9.94
      cer: 0.4878
      wer: 0.7778
    bible_00196:
      source: bible
      text: Wenbí bʊrɔ nɛ́, Ɩsɔ́ɔ weení ɩrɔ gɛ báa ngbetíi wɛ bɩka waala ná báa wé nɛ́, wɔɔzɔ́ɔ́lɩ
        sɩsɩ ɩráa zemina ɩsʊ́ʊ ɩdɛ́ɛ ásícé-daá.
      sbs: 0.5923
      gen_sec: 11.04
      ref_sec: 13.0
      cer: 0.4946
      wer: 1.0
    bible_00197:
      source: bible
      text: » Toovonúm gɛ bɩgɛ́ɛ; amá, bɩdɛkɛ́ɛ bɩrɩ́ŋa bɩ́nvɔɔzɩ kʊ.
      sbs: 0.5319
      gen_sec: 5.04
      ref_sec: 3.78
      cer: 0.439
      wer: 1.5
    bible_00198:
      source: bible
      text: Ɩbá ɩsɛ́ɛ ɖamá kazɔ́ɔ nyazɩ koobíya wɛ́nzɛɛ́ ɖamá nɛ́.
      sbs: 0.6143
      gen_sec: 6.0
      ref_sec: 3.78
      cer: 0.375
      wer: 0.7778
    bible_00199:
      source: bible
      text: Mɔ́ɔ́ mánwɩlɩ́ɩ mɩ́ɩ nɩ́bááwʊ wenkí kɩdaká fɛ́yɩ́ nɛ́.
