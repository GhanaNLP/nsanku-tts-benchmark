      ref_sec: 8.16
      cer: 0.1463
      wer: 0.4706
    bible_00082:
      source: bible
      text: A tɔnʊʊ́-rɔ fɔɔlʊʊ́ nakɩ́rɩ wɛ́nÿɛlɛ́m, tɩɩganáa rɩ́ŋa ɖʊɖɔ wɛ́nÿɛlɛ́m gɛ.
