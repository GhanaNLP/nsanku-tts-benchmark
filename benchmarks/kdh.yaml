      sbs: 0.7138
      gen_sec: 11.12
      ref_sec: 12.5
      cer: 0.17
      wer: 0.5238
    bible_00123:
      source: bible
      text: Wɛɛgɛɛ ná Yeésu wɔ́rɔ́ ɩlɛ́ ɩnʊvɔ́-jɔ́ wénwií bɩka ɩdɛ́ɛ nzʊlʊ́m wéndím Yeésu nʊvɔ́-rɔ.
      sbs: 0.6834
      gen_sec: 7.12
      ref_sec: 7.04
      cer: 0.2031
      wer: 0.5385
    bible_00124:
      source: bible
      text: 'Badaá nɛbɛ́rɛ wɔ́ndɔ́m sɩsɩ: «Ɩsɩ we gɛ ŋmatʊ‑ŋmátʊʊ́ ceení ɩ́ba wánŋmatɩ́ gɛ.'
