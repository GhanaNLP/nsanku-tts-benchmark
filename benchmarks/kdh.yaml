      gen_sec: 9.44
      ref_sec: 9.76
      cer: 0.1395
      wer: 0.5
    bible_00081:
      source: bible
      text: Bɩka ɩsɔ́ɔ́lɩ sɩsɩ bánaazɩ yɩ ɩ́na Ɩsɔ́ɔ-dɛ́ɛ zamɔ́ɔ bɩkɩlɩ ná iɖi niíni alaháácɩ́ wánváa
        kɩ kídénleeri nɛ́.
      sbs: 0.7571
      gen_sec: 8.96
      ref_sec: 8.16
      cer: 0.122
      wer: 0.2353
    bible_00082:
      source: bible
      text: A tɔnʊʊ́-rɔ fɔɔlʊʊ́ nakɩ́rɩ wɛ́nÿɛlɛ́m, tɩɩganáa rɩ́ŋa ɖʊɖɔ wɛ́nÿɛlɛ́m gɛ.
      sbs: 0.7527
      gen_sec: 5.28
      ref_sec: 4.96
      cer: 0.0926
      wer: 0.3
    bible_00083:
      source: bible
