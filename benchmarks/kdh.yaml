      gen_sec: 4.52
      ref_sec: 7.72
      cer: 0.1837
      wer: 0.6667
    bible_00156:
      source: bible
      text: Kezeŋa Ɖacɩrɩ‑cɩrɩ ńga Yeésu sɩ ɩkává tɩndɩnáa nɛ́.
      sbs: 0.7293
      gen_sec: 3.72
      ref_sec: 3.88
      cer: 0.122
      wer: 0.5
    bible_00157:
      source: bible
      text: 'Ńna gɛ zamɔ́ɔ wɔɔbɔ́ɔ́zɩ yɩ sɩsɩ: «Bɩlɛ́ nɛ́, wé gɛ bɩmɔɔ́na ɖɩlá ɖɔ́.'
