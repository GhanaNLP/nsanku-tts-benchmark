      gen_sec: 3.68
      ref_sec: 3.76
      cer: 0.0857
      wer: 0.2857
    bible_00111:
      source: bible
      text: Bɩlɛ́ nɛ́, ɩ́kanɩ́ɩ nɩdáárɛ, mɩ́wɛná Ɩsɔ́ɔ fɔ́ɔ́zɩrɛ bɩcɛzɩ́ cɩcɩ́sɩ birika.
      sbs: 0.6871
      gen_sec: 5.92
      ref_sec: 5.36
      cer: 0.1111
      wer: 0.3
    bible_00112:
      source: bible
