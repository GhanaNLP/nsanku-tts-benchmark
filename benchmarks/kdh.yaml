      sbs: 0.7285
      gen_sec: 11.6
      ref_sec: 9.0
      cer: 0.2667
      wer: 0.5333
    bible_00171:
      source: bible
      text: A ɖádɩtɩŋa ɖáfʊnmaazɩ́ ɖɔ́jɔwʊrɛ-rɔ kazɔ́ɔ, Ɩsɔ́ɔ tángʊ́ʊ ɖɔ́dɔ́m.
