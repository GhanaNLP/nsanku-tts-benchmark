      cer: 0.0706
      wer: 0.2941
    bible_00008:
      source: bible
      text: Méévééri mɩ́ɩ bɩrɩ́ŋa bɩlɛ́ gɛ na a mɩ́ŋmáráana ma, iyuú fɛɛzɩrɛ.
