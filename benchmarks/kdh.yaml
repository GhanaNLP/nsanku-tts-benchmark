      gen_sec: 4.24
      ref_sec: 5.08
      cer: 0.3111
      wer: 0.8571
    bible_00143:
      source: bible
      text: Wʊláázɩ sɩɩwɩ́lɩ nɛ́, bɔ́ndɔɔzɩ́ sɩ gɛ baɖʊ nimíni siɖe.
      sbs: 0.7101
