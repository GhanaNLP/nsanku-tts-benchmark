      gen_sec: 5.2
      ref_sec: 4.86
      cer: 0.1053
      wer: 0.5
    bible_00125:
      source: bible
      text: Bánŋmatɩ́ sɩsɩ, mɩ́dáá naárʊ wɔɔgbɔ́ɔ ɩjaa ɖɛɛlʊ́.
      sbs: 0.7749
      gen_sec: 4.16
      ref_sec: 4.0
      cer: 0.1053
      wer: 0.4286
    bible_00126:
      source: bible
      text: Wenbá barɩ́ŋa bánnɩɩ́ sɩsɩ máálʊ́rʊ Ɩsaáka nɛ́, bɛlɛ́ ɖʊɖɔ sɩ basála kɔdɔ́ŋa gɛ.
      sbs: 0.7058
      gen_sec: 6.64
      ref_sec: 5.36
      cer: 0.1833
      wer: 0.5385
    bible_00127:
      source: bible
      text: Mogoobíya, wahála na suúru-dɛ́ɛ tɔ́m-daá nɛ́, ɩbɛɛŋná anɖébiwá baaŋmatɩná Ɖádʊ́ʊ
        nɔɔ́ nɛ́.
      sbs: 0.7856
      gen_sec: 7.44
      ref_sec: 7.8
      cer: 0.1324
      wer: 0.6667
    bible_00128:
      source: bible
      text: » Bɩdɛ́ɛ sáátɩ, Pétro ɩlɛ́ ɩbá ɩwɛ ɩbamáa tará kɔtɩ́.
      sbs: 0.7848
      gen_sec: 4.8
      ref_sec: 4.6
      cer: 0.1842
      wer: 0.6667
    bible_00129:
      source: bible
      text: Méndiríi mɩ́ɩ ɖɔ́ nɛ́, bɩjɔɔ́ɔ gɛ nyazɩ bónbonáa fééni káwʊ‑káwʊwá lɔwʊtáá nɛ́.
      sbs: 0.705
      gen_sec: 5.52
      ref_sec: 6.28
      cer: 0.2333
      wer: 0.4167
    bible_00130:
      source: bible
      text: Bɩɩga liideé sɩ baɖʊ boboná Ɩsɔ́ɔ-dɛ́ɛ nbá Yerusalɛ́ɛm tɛ́ɛ́dɩ-daá nɛ́-dɛ́ɛ tɔ́m nɛ́,
        mɩ́nyɔ́ɔ́ ɖʊɖɔ ɩlá ńŋɩnáa wenbí máázɩ́ɩ́zɩ Galasíi Koduuzísi nɛ́.
      sbs: 0.7624
      gen_sec: 10.88
      ref_sec: 11.56
      cer: 0.1351
      wer: 0.619
    bible_00131:
      source: bible
      text: » Ngɛ Ɩsɔ́ɔ waalá lɩ́m-daá fanáńdɩ kʊ́bɔńdɩ na kúmuúti ndɩ‑ndɩ, na siḿsi ndɩ‑ndɩ.
      sbs: 0.6961
      gen_sec: 6.48
      ref_sec: 7.32
      cer: 0.1667
      wer: 0.5
    bible_00132:
      source: bible
      text: 'Wɔɔmɔɔná wanbaaráa nɛbɛ́rɛ ńna, ngɛ wɔɔbɔ́ɔ́zɩ wɛ sɩsɩ: «Mɩ́ɩ́mʊ́ Kezeŋa Ɖacɩrɩ‑cɩrɩ ńga
