      ref_sec: 14.7
      cer: 0.1095
      wer: 0.5
    bible_00061:
      source: bible
      text: Ńna gɛ wenbá booyuú bese bɩlɛ́ nɛ́ badaá kʊ́ɖʊḿ woobó ɩtɩ́ tɔ́m ifééri Ɩbrám Éburu
