      gen_sec: 9.72
      ref_sec: 11.46
      cer: 0.1455
      wer: 0.4783
    bible_00135:
      source: bible
      text: Wenbí bʊrɔ nɛ́, bɛlɛ́ barɩ́ŋa banyɩ sɩsɩ ɩjaa kɛ́ɛ Gɩrɛ́ɛkɩ ńnɩ́ gɛ.
      sbs: 0.746
      gen_sec: 4.41
      ref_sec: 4.92
      cer: 0.0612
      wer: 0.25
    bible_00136:
      source: bible
      text: Káma, ɖaána báa wenká wɛná kɛdɛ́ɛ maarʊ́, ngʊ́ weení waama wenbí bɩrɩ́ŋa bʊwɛ nɛ́ gɛ
        Ɩsɔ́ɔ.
      sbs: 0.7338
      gen_sec: 6.0
      ref_sec: 9.94
      cer: 0.1343
      wer: 0.4375
    bible_00137:
      source: bible
      text: tɔ́ɔ, lɛlɛɛɖɔ́ gɛ nyɔ́ɔ́ nyáábá ndáa bɔ́tɩ.
