      cer: 0.2051
      wer: 1.3333
    bible_00145:
      source: bible
      text: 'Sáátɩ wenkí Yaayá-dɛ́ɛ wanbaaráa wɛɛɖɛ́ɛ nɛ́, ngɛ Yeésu wɔɔgbɔ́ɔ wánŋmatɩ́ zamɔ́ɔ
        Yaayá-rɔ sɩsɩ: «Wé gɛ mííbó ɩkɛ́bɛ́ɛŋ tɛɛwʊ́lɔ́ɔ́-daá.'
      sbs: 0.68
      gen_sec: 10.32
      ref_sec: 11.66
      cer: 0.198
      wer: 0.7222
    bible_00146:
      source: bible
      text: Ɩɩ́n, ɖoo nɛ́, mɩ́ɩ́gbɔ́ɔ ɖáámá ɖabata mɩ́nlám wenbí bɩmɔɔ́ɔ wenbá baasɩ Ɩsɔ́ɔ nɛ́,
