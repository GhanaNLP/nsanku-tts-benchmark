      gen_sec: 8.0
      ref_sec: 9.22
      cer: 0.1688
      wer: 0.5
    bible_00115:
      source: bible
      text: Bú-rɔ, kʊ́bɔnɩ́-rɔ, barɩ́ŋa bándɩlɩ́ɩ ma.
