    bible_00171:
      source: bible
      text: Awɔɔ lɛ taa k'a a dɔ a ʊ, Krista a meerbaa da mɔɔ lɛ ʊ mɔɔ n'a bam, gɛɛ lɔ? K'a maam awɔɔ
