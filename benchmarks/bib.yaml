        ʊ kan *Wosocɛ ʊ kɩ, bɩncɛ kʊ zɩɩfʊrɔ haay n''a som kʊ ma ʊ, bɩ mɔɔ n hɔsɩ nyaakʊm da, m a hɩ y.'
