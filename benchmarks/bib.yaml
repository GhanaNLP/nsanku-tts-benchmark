    bible_00164:
      source: bible
      text: Awɔɔ n a dɔ a ʊ, awɔɔ mɛrɔ wɔɔ Krista mɛ vəŋŋəro m na? Mɔɔ yɛrɛ m Krista mɛ vəŋŋə sa m a ba
