  entries:
    bible_00000:
      source: bible
      text: Bala, lɔ kʊ Woso a bir k'an bɩ zu Zuuba ʊ bɩ, a ba b'ʊ soamɩŋŋaʊzaa Zuuba nɔ ʊ. Bɩ, soamɩŋŋaʊzaa
        kʊ Woso a bir sɔ bɩ, a ba b'ʊ Krista lɔ.
      sbs: 0.6366
      gen_sec: 6.84
      ref_sec: 11.8
      cer: 0.3196
      wer: 0.5938
    bible_00001:
      source: bible
      text: Gʊɔɔ gɔsɩnnɔ ta, ŋn'aa *farizɛɛnrɔ yɩ, ŋnɩ hɔ kʊ Yeezuu a ba bɩ dɩnda ŋ nɩ.
      sbs: 0.6682
      gen_sec: 3.47
      ref_sec: 4.86
      cer: 0.2727
      wer: 0.5
    bible_00002:
      source: bible
      text: Bɩ, kʊ mɔɔ ma ŋ ʊ, zɩɩfʊrɔ wɔɔ ɩ dundom zi k'a zɛ bɩ y'a ka, mɔɔ n'a nyɔɔrɛ ɩbɩɩ zi zɔɔ-zɔɔ.
        Mɔɔ hɩ gʊɔɔ kʊ ŋ mim ka ra rɔ wɔɔ m sɔ, kʊ ŋ nɩ bʊr ɩbɩɩ zi, ŋnɩ b'a gumə lemim hɩ.»
      sbs: 0.6854
      gen_sec: 8.94
      ref_sec: 12.58
      cer: 0.225
      wer: 0.6889
    bible_00003:
      source: bible
      text: 'Pol n dɩga dʊdɔkənno wɔɔ ma sɩɩ…, an a hɩ, a ʊ: «M danyɩnɔ, mɔɔ mɩsɩrbaa ba kan noom fu kɩ
        Woso mɩm ʊ, an ta, an her naa ku.»'
      sbs: 0.6415
      gen_sec: 6.83
      ref_sec: 8.58
      cer: 0.2907
      wer: 0.7333
    bible_00004:
      source: bible
      text: Yeezuu n a bɔ, an bʊr Kanaa ʊ Galilee kʊ ʊ. Bɩncɛ bɩ do a hi ba ʊ dɩvɛn bɩ. *Rɔm cir zibəəzaa
        jɩtaarɛ deem ɩ nyɩnta Kapɛrnawum ʊ, a nyɩ bɩ laafɩɩ y.
      sbs: 0.6639
      gen_sec: 7.86
      ref_sec: 12.96
      cer: 0.2385
      wer: 0.6765
    bible_00005:
      source: bible
      text: Woso mɔɔ n'a barɛ m kasɛtɩzaa, kʊ mɔɔ ga a jɩra mɔɔ m ŋʊaarbarɛ m. Kʊ mɔɔ n a ŋʊa kʊ m awɔɔ
        heer kɔ bɩ y'a ka, mɔɔ n m ya m bʊr awɔɔ zi Korɛntɩ ʊ y.
      sbs: 0.5376
      gen_sec: 0.44
      ref_sec: 10.64
      cer: 0.8942
      wer: 0.9744
    bible_00006:
      source: bible
      text: Gɛɛ, mɔɔ kan Barnabas kɩ, wɔɔ y'ʊ ga m ʊ minto kʊ zi ba, ʊ ʊ mɩŋŋɔɔ tʊr m na?
      sbs: 0.6352
      gen_sec: 4.05
      ref_sec: 5.54
      cer: 0.1698
      wer: 0.55
    bible_00007:
      source: bible
      text: Cir bɩ do nyɩnta bʊnyaa, an zambʊ ba wɔɔ do bɩ ma. A paŋŋa ba wɔɔ zɩrɔ wɔɔ ma, an a ka ŋn'a
        a nyɩnɔ poorero gʊr, ŋn'aa ŋ lo kʊ ŋ nɩ gɩnga.
      sbs: 0.6672
      gen_sec: 6.62
      ref_sec: 9.92
      cer: 0.1735
      wer: 0.6176
    bible_00008:
      source: bible
      text: A hɩ mɔɔ nawʊrɛ awɔɔ m, heernyɔɔ nyɩntaŋ ʊ gʊta arzana ʊ, mimbʊnyaabər deem k'a a bɔ a taam
        bɩ tɔ ma, an lɛ da gʊɔɔ tɩrgɔɔ bunɛɛhʊ a yaa nɛɛhʊ rɔ wɔɔ kʊ heerlʊrlɛ zibəə ba ŋ ma rɔ wɔɔ ra.»
      sbs: 0.6937
      gen_sec: 10.65
      ref_sec: 11.16
      cer: 0.2979
      wer: 0.7857
    bible_00009:
      source: bible
      text: Bɩ, gʊɔɔ gʊta sɩra ka ʊ b'ʊ.
      sbs: 0.6559
      gen_sec: 2.0
      ref_sec: 3.64
      cer: 2.1579
      wer: 2.8571
    bible_00010:
      source: bible
      text: Meerbaarɔ nɔɔn duro ba Yeezuu ʊ, k'a a zɛ zaa hɩnka.
      sbs: 0.6135
      gen_sec: 3.2
      ref_sec: 3.76
      cer: 0.8462
      wer: 1.0
    bible_00011:
      source: bible
      text: Gʊaa nɛɛm bɩ do m bɩ, sɛ m sɔ, an ta hɔ bʊnyaa haay m, wɔɔ mɛ b'an ta ʊ, an nɩ dintim kam
        wɔɔ mɩsɩrbaa ma jilli, an nɩ sɛ dam wɔɔ ma haay, sɛhar sɛ y'a so a mɩŋŋa ʊ.
      sbs: 0.6248
      gen_sec: 8.15
      ref_sec: 11.06
      cer: 0.1913
      wer: 0.7381
    bible_00012:
      source: bible
      text: Kʊ durnya bɩ zannɔ n'awɔɔ m, durnya bɩ hɔ k'a so ʊ bɩ ŋʊam. Bɩ durnya bɩ zannɔ bɛɛ n'awɔɔ
        nɩ y. Mɔɔ y'awɔɔ bɔ ʊ durnya nɔ ʊ a hɔ, bɩ y'a ka, durnya n sɔ awɔɔ m.
      sbs: 0.6052
      gen_sec: 1.08
      ref_sec: 10.56
      cer: 0.9369
      wer: 0.9744
    bible_00013:
      source: bible
      text: Lemim bɩ do bɩ, hɔ kʊ Woso a nyaakʊm da biisi tee… bɩ m. Bɩ kɛɛrɛ naa, Woso a hɩnka a gʊɔɔ
        wɔɔ m.
      sbs: 0.6752
      gen_sec: 5.56
      ref_sec: 7.64
      cer: 0.1884
      wer: 0.375
    bible_00014:
      source: bible
      text: K'awɔɔ nɩ zɛm b'a nyiro wɔɔ bʊmbɔrɛ yɩ bɩ, bɩ y'a ka Woso ʊ awɔɔ n sɩra ka.
      sbs: 0.6581
      gen_sec: 3.72
      ref_sec: 4.16
      cer: 0.1887
      wer: 0.6667
    bible_00015:
      source: bible
      text: Zɩ Woso a Nyɩ ŋʊa, an hɔ haay sa, an a zar a wɔ ʊ.
      sbs: 0.6063
      gen_sec: 2.84
      ref_sec: 3.34
      cer: 0.3939
      wer: 0.7333
    bible_00016:
      source: bible
      text: 'Pol n a hɩ, a ʊ: «Hɔɔzaa bɛɛ m mɔɔ nɩ y, Fɛstus mɩŋŋa, sɩra meerbaa mɔɔ n''a bam, hɔɔntaʊrɛ
        m.'
      sbs: 0.6495
      gen_sec: 4.73
      ref_sec: 6.98
      cer: 0.1692
      wer: 0.4762
    bible_00017:
      source: bible
      text: 'A n a nyɩ bɔ ʊ, a ʊ: «Kʊ m a ba lɔ m a jɩ ma, kʊ gʊaa ba ʊ an n''a jɩ dɩndam mɔɔ nɩ?» A n
        Filipi bir, a ʊ, an bɩ nyɩnta a jɩr ʊ.'
      sbs: 0.7267
      gen_sec: 2.15
      ref_sec: 8.04
      cer: 0.8987
      wer: 0.9231
    bible_00018:
      source: bible
      text: Dɔ k'a mɛ bɩ, dʊdɔkənno wɔɔ a dɔmazannɔ nyɔɔ kʊ ŋ n'aa a hɩ lɔnnɔcɛ dɔmazaa bɩ m, kan wɔ saa
        gʊɔɔ wɔɔ ma.
      sbs: 0.681
      gen_sec: 5.65
      ref_sec: 6.82
      cer: 0.1688
      wer: 0.5417
    bible_00019:
      source: bible
      text: K'ɩ ʊ k'ɩ zoro tɔ da zombaa daahan ci b'ʊ, a a ga m, kʊ zoro bɩ do dɔɔraa m busɔrdɩ ku, bɩ
        nyɩnta a ʊ, gʊaa deem taan… lʊ sɔ.
      sbs: 0.6745
      gen_sec: 6.53
      ref_sec: 8.66
      cer: 0.2209
      wer: 0.6452
    bible_00020:
      source: bible
      text: K'a wɔɔ bʊmbɔ jɩnnɔ wɔ ʊ an nya, a zaa kam wɔɔ ʊ kʊ ʊ a zi ba kan heerkoodəbaa kɩ,
      sbs: 0.6652
      gen_sec: 4.05
      ref_sec: 4.98
      cer: 0.2542
      wer: 0.7143
    bible_00021:
      source: bible
      text: Mɔɔ laafɩɩ to awɔɔ m, m nɩ m laafɩɩ karɛ awɔɔ ʊ. Mɔɔ bɩr a karɛ amba durnya n'a kam bɩ nɩ
        y. A b'a ka a heer n a zar gɛɛ, a da n bɔ ʊ y.
      sbs: 0.7104
      gen_sec: 7.22
      ref_sec: 9.02
      cer: 0.2283
      wer: 0.6579
    bible_00022:
      source: bible
      text: Ʊ b'ʊ gʊ ʊ sokʊmarɔ tarɛ ma y, ʊ bɩ yɩ am gʊɔɔ gɔsɩnnɔ kʊ ŋ minkə yarlɛ n nɔ wɔɔ nɩ y. Bɩ,
        an ta ʊ bɩ, ʊ bɩr kʊ heer yom, ʊ bɩr a barɛ ncɩnaaʊ, bala, awɔɔ dɔ a ʊ, Zuuba dɔmɩm y'a zɔm.
      sbs: 0.6887
      gen_sec: 9.69
      ref_sec: 14.28
      cer: 0.2302
      wer: 0.766
    bible_00023:
      source: bible
      text: Wɔɔ kʊ wɔɔ m Zɩɩfʊrɔ, kan do vantɔɔ gʊɔɔ kʊ ŋ nɩ zum zɩɩfʊrɔ wɔɔ lɛrɔ wɔɔ rɔ wɔɔ kɩ, Krɛtɩ
        zannɔ kan Araabɩrɔ kɩ, wɔɔ y'a mam, ŋn'a lɛ bɔm Woso zibəə mɩŋŋa b'ʊ, wɔɔ do lemim m.»
      sbs: 0.7058
      gen_sec: 9.57
      ref_sec: 12.44
      cer: 0.1783
      wer: 0.6154
    bible_00024:
      source: bible
      text: Yeezuu n a gɔdarkʊra busu a zim, an bɔ, an ta bɩncɛ kʊ n n'a birm Minkorgo, n n'a hɩm ma ebree
        lemim m Golgotaa b'ʊ.
      sbs: 0.6439
      gen_sec: 5.79
      ref_sec: 8.78
      cer: 0.1786
      wer: 0.6154
    bible_00025:
      source: bible
      text: Gʊaa k'a n'a bʊnyaa bam bɩ, Zuuba y'a zi bʊnyaa bɩ yawʊra bam nɩ, a bɩr gʊɔɔ jirə bɔrɛ y.
      sbs: 0.6865
      gen_sec: 4.85
      ref_sec: 7.86
      cer: 0.1406
      wer: 0.6
    bible_00026:
      source: bible
      text: Kʊ ŋ bʊr dʊdɔ bɩ ma bɩ, gʊɔɔ kʊ ŋ nɩ mim kam la rɔ wɔɔ, ŋ n mim sɩ gurezaa yɩ, ŋn'a ka ra,
        amba mɔɔ m hɔɔn da ma bɩ nɩ y.
      sbs: 0.5589
      gen_sec: 1.38
      ref_sec: 8.22
      cer: 0.9756
      wer: 0.9706
    bible_00027:
      source: bible
      text: Cir Agripaa bɩ minno nɔɔn duro dɔ mɩŋŋa haay, bɩ y'a ka, mɔɔ m dam ma, m meer ba a lɛɛ kan
        heerkoodəbaa kɩ. Mɔɔ si mɔɔ ʊ, hɔsɩ n ba a mɩm ma sɛɛrɛ y. Bala, minno nɔɔn duro n ba gʊrga k'a
        nyaakʊm da ʊ y.
      sbs: 0.6974
      gen_sec: 10.01
      ref_sec: 14.9
      cer: 0.1241
      wer: 0.5417
    bible_00028:
      source: bible
      text: Woso a ba wɔɔ m mɩŋŋa, a zibəə naa do da wɔɔ wɔ ʊ, bɩ y'a ka wɔɔ bɩr ʊ heer zaar barɛ y.
      sbs: 0.6886
      gen_sec: 4.09
      ref_sec: 6.56
      cer: 0.2459
      wer: 0.4583
    bible_00029:
      source: bible
      text: Yeezuu k'a taa bɩ yɔɔ an a mɩm bɩ gʊm bɩ, a ba a ʊ *sabaa hinni ʊ.
      sbs: 0.6627
      gen_sec: 3.76
      ref_sec: 4.7
      cer: 0.2222
      wer: 0.3889
    bible_00030:
      source: bible
      text: Bɩ, k'a lee ku Galilee ʊ bɩ, Galilee zannɔ wɔɔ a si mɩŋŋa. Nyɩnta ŋ y'a ʊ, ŋnɩ ta Zerizalɛm
        ʊ cibsa bɩ minto. Ŋ mɩŋŋɔɔ hɔ kʊ Yeezuu a ba haay bɩ yɩ sɔ.
      sbs: 0.6624
      gen_sec: 7.97
      ref_sec: 14.48
      cer: 0.1651
      wer: 0.5714
    bible_00031:
      source: bible
      text: Bɩ kʊ zɩɩfʊrɔ wɔɔ n'a bankarɛ *sabaa k'a n'a bam k'a sɩŋŋɩda sa minto bɩ, bɩ yaa bɩ do k'an
        jɩnjɛɛm sɔ bɩ, ŋ Yeezuu bir ʊ.
      sbs: 0.6609
      gen_sec: 6.21
      ref_sec: 11.28
      cer: 0.1724
      wer: 0.4074
    bible_00032:
      source: bible
      text: 'A bɩ busoo ŋʊa y, k''a zerga hɔ k''awɔɔ n ta m bɩ rɛ, bala, Woso a hɩ, a ʊ:'
      sbs: 0.6701
      gen_sec: 3.21
      ref_sec: 4.52
      cer: 0.3404
      wer: 0.75
    bible_00033:
      source: bible
      text: Meerbaa naa do ba ɩbɩɩ nawʊm kan ŋ kɩ, kʊ ŋ n'a da ma, ŋnɩ heer hu yɩ, kʊ ŋʊarɛ n nyɩnta ŋ
        heer ʊ, kʊ ŋ nɩ hɔɔndarɛ mɩŋŋa yɩ, ŋnɩ sɩra ka paan….
      sbs: 0.6801
      gen_sec: 7.78
      ref_sec: 10.08
      cer: 0.3137
      wer: 0.8857
    bible_00034:
      source: bible
      text: '*Farizɛɛnrɔ wɔɔ n''a hɩm kʊ m, ŋ ʊ: «Awɔɔ yɩ, a dɔ a ʊ, a b''a dam ma, a hɔsɩ ba y. K''a
        dɩga gʊɔɔ haay kʊ ŋ nɩ zure a jɛ ʊ!»'
      sbs: 0.6473
      gen_sec: 5.66
      ref_sec: 8.36
      cer: 0.1688
      wer: 0.4545
    bible_00035:
      source: bible
      text: Cɛ bɩ ba ŋ y'a ʊ pɛɛra m, a nɔ n hɩɩya, lɛɛkarɛ hɔ bɩ bir ŋ nawʊm lɛɛ k'an jɩnjɛɛm Woso ma.
        Lɛɛ bɩ do ŋ fɩtɩrɛ bɩ kan mɔrcɩntarahɔ bɩ kɩ, bur kʊ ŋ n'a kam Woso ʊ bɩ kɩ kuntə ʊ.
      sbs: 0.6611
      gen_sec: 9.3
      ref_sec: 11.76
      cer: 0.2
      wer: 0.7273
    bible_00036:
      source: bible
      text: Bɩ kur bɩ, a dʊdɔkənno ka ŋ ʊ an ta, an wosolɛsinnɩsorazaa Sanwɛl ku.
      sbs: 0.6309
      gen_sec: 4.12
      ref_sec: 6.3
      cer: 0.283
      wer: 0.8571
    bible_00037:
      source: bible
      text: Ba naa do n nawʊm, huure jɛzaa bɩ hɛrɛ ma, ʊ lʊr ʊ n nawʊm lɛɛm-lɛɛm, am mɩm nɩfɩ zɛrɛ m.
        Bala, kʊ n bɩ huure bɩ hɛ, gʊɔɔ kʊ ŋ gɩnga rɔ wɔɔ y'a mɩm bɔŋ ʊ mɛ k'a bɩ vɔnm dɔ m, wɔɔ n'ʊ lʊr.
      sbs: 0.6908
      gen_sec: 9.62
      ref_sec: 14.82
      cer: 0.1938
      wer: 0.7021
    bible_00038:
      source: bible
      text: 'Hɔbɩrɛ bɩ dɔmɩm k''a ku bɩ, a a zibəənyɩ nyɔɔ gʊɔɔ k''a ŋ bir hɔbɩrɛ bɩ ma rɔ wɔɔ zi, a ʊ:
        K''a bʊr kɛɛrɛ, n hɔ haay banka, an nya.'
      sbs: 0.6607
      gen_sec: 6.92
      ref_sec: 9.18
      cer: 0.3034
      wer: 0.6774
    bible_00039:
      source: bible
      text: «Mɔɔ heer nyɔɔ, cir Agripaa, kʊ mɔɔ zaa yɩ kʊ m meer ba ɩbɩɩ taa her, kʊ m m gumə mim dɩnda,
        mim haay kʊ zɩɩfʊrɔ mɔɔ a ka wɔɔ ra bɩ minto.
      sbs: 0.6719
      gen_sec: 6.99
      ref_sec: 9.02
      cer: 0.24
      wer: 0.7273
    bible_00040:
      source: bible
      text: 'Farizɛɛnrɔ kʊ ŋ nyɩnta kan kɩ rɔ wɔɔ kʊ ŋ naa ma bɩ, ŋ y''a hɩ, ŋ ʊ: «A hɩ ɩbɩɩ ʊ, bʊʊrɔ
        m wɔɔ m sɔ gɛ?»'
      sbs: 0.7624
      gen_sec: 3.96
      ref_sec: 7.0
      cer: 0.7206
      wer: 0.9286
    bible_00041:
      source: bible
      text: K'a mɔɔ mim si a ʊ, mɔɔ ɩ kan Zɩ kɩ, Zɩ nɩ kan mɔɔ kɩ, bɩ, k'awɔɔ n mɔɔ meerbaa bɩ si, k'a
        si zibəəro nɔɔn duro minto.
      sbs: 0.6336
      gen_sec: 6.01
      ref_sec: 8.98
      cer: 0.284
      wer: 0.6552
    bible_00042:
      source: bible
      text: Gɛɛ dɩga awɔɔ nawʊm hɔ kʊ gʊɔɔ n'a yɩrɛ a mɩm m bɩ ma bala ra? Ncɩnaaʊ bɩ, kʊ gʊaa ʊ Krista
        hɔ n a mɩ fasɩ, k'an a hɔɔn da an a dɔ sɔ a ʊ, Krista y'a so wɔɔ ʊ, amba a a so a zaa ʊ bɩ m.
      sbs: 0.6908
      gen_sec: 9.39
      ref_sec: 13.58
      cer: 0.1825
      wer: 0.7255
    bible_00043:
      source: bible
      text: Pol kan Silas kɩ ta ŋn'aa lee ku Derbe ʊ, ŋnɩ cem ŋnɩ ta Listɩr ʊ. Karɩndanyɩ deem n nɩ b'ʊ,
        a tɔ m Timote, a da bɩ zɩɩfʊ m, an a ba sɩrakarɛzaa, a zɩ bɩ grɛkkɩ m.
      sbs: 0.6648
      gen_sec: 7.95
      ref_sec: 11.76
      cer: 0.1121
      wer: 0.4872
    bible_00044:
      source: bible
      text: Bɩ minto bɩ, mɔɔ y'a yɛrɛ awɔɔ han k'a hɔ bɩ, awɔɔ laafɩɩ minto m. Bala, minkə deem taan…
        bɩ nyaanɩm gʊaa mim ʊ naa ʊ y.»
      sbs: 0.6717
      gen_sec: 6.22
      ref_sec: 8.58
      cer: 0.314
      wer: 0.9259
    bible_00045:
      source: bible
      text: Sɩmɔɔn k'a yɩ kristazibəəzannɔ wɔɔ n'awɔɔ kam gʊɔɔ wɔɔ mim la, ŋnɩ Sɛnt-Ɛspri sim bɩ, a a
        cɩnta k'a busoo ka ŋ ʊ.
      sbs: 0.5944
      gen_sec: 6.02
      ref_sec: 6.48
      cer: 0.131
      wer: 0.5217
    bible_00046:
      source: bible
      text: Mɔɔ y'awɔɔ woo… ŋʊam Yeezuu Krista nɔ ʊ.
      sbs: 0.6954
      gen_sec: 1.32
      ref_sec: 7.44
      cer: 0.6667
      wer: 0.75
    bible_00047:
      source: bible
      text: Sɩra m, mɔɔ ba b'ʊ kan awɔɔ kɩ y, bɩ mɔɔ heer ɩ kan awɔɔ kɩ, m nɩ m heer nyɔɔm k'awɔɔ nɩ jɩnɩm
        kan kʊ kɩ kɔɔkɔɔ a sɩra ka Krista ʊ nɔ ʊ bɩ tɔ ma.
      sbs: 0.6367
      gen_sec: 8.16
      ref_sec: 10.44
      cer: 0.1961
      wer: 0.6842
