    bible_00182:
      source: bible
      text: Sɩra nɔ ʊ, lɛɛ kʊ jɩmbaa n ta ʊ, gʊɔɔ n'a hɔɔn darɛ a mɩŋŋɔɔ ma con bɩ, lɛɛ bɩ do ʊ bɩ, hɔ
        haay woo… yɩm bʊrga, ziro bʊnyaarɔ n nyɩnta ʊ sɔ.
      sbs: 0.6432
      gen_sec: 15.72
      ref_sec: 8.7
      cer: 0.2929
      wer: 0.6471
    bible_00183:
      source: bible
      text: A n bɔkarɛ gʊɔɔ wɩsɩrɔ m Woso mɩm ʊ, durnya naa do gʊɔɔ wɔɔ n a ga m kʊ gʊɔɔ nɔɔn duro n nyɩnta
        kan ŋ kɩ y. Ŋ sɩrakarɛ tɔ ma m, ŋ ba lɛɛ nɩ y, ŋn'ɩ poo sam kan ciro gaa kɩ, ŋn'ɩ wʊtam yaarɔ
        ʊ kan ciro yaarɔ kɩ ʊ.
      sbs: 0.6168
      gen_sec: 15.0
      ref_sec: 14.5
      cer: 0.3444
      wer: 0.7778
    bible_00184:
      source: bible
      text: A n lɛ ka sʊrdaa zɔrɔ lɛɛzaa b'ʊ, a ʊ, an dɔ Pol ma, b'a b'a du y. A b'a ta a gʊaasɩba sɩ
        m tolle, a nyasʊm minto y.
      sbs: 0.5737
      gen_sec: 11.52
      ref_sec: 7.54
      cer: 0.3247
      wer: 0.8667
    bible_00185:
      source: bible
      text: Ɩ tɔ ʊ ɩ bʊr, kʊ nyɛɛm dɔmɩm n bɔkarɛ an a ku. Ebulus kan Pudɛns kɩ, Linus kɩ, Klodɩya kan
        danyɩnɔ kʊ ŋ nɩ naa ʊ haay rɔ wɔɔ k'ɩ yaa darɛ ɩ m.
      sbs: 0.6112
      gen_sec: 15.04
      ref_sec: 10.52
      cer: 0.3235
      wer: 0.8571
    bible_00186:
      source: bible
      text: A ŋʊa mɔɔ nawʊm paan… kʊ m bɩr awɔɔ bire ʊ b'ʊ dɩɩtaa, kʊ m m meerbaa bɩ lʊr m a ba, bala,
        mɔɔ n a dɔ kʊ mɔɔ meer bɩ bam kan awɔɔ kɩ lʊnlɔ y.
      sbs: 0.6359
      gen_sec: 13.28
      ref_sec: 10.32
      cer: 0.3535
      wer: 0.8919
    bible_00187:
      source: bible
      text: A n lɛ da haay bɩ, k'a bɩr kʊ ŋʊam paan…, bala, ŋʊarɛ ɩ hɔ kam mimbʊnyaa yɔɔgʊ ra.
      sbs: 0.5775
      gen_sec: 7.32
      ref_sec: 5.98
      cer: 0.3966
      wer: 0.9474
    bible_00188:
      source: bible
      text: Gʊaa k'a nɩ koor bam biisi bɩ, an a wɔ bɔ koorbaa b'ʊ k'an zi ba an a lɛɛmaa hɔ yɩ, maam bɩ,
        a y'a dam ma an hɔ yɩ, an n'a dam gʊaa k'a lɛ n taa daahan ma han.
      sbs: 0.5974
      gen_sec: 11.48
      ref_sec: 11.18
      cer: 0.2593
      wer: 0.6585
    bible_00189:
      source: bible
      text: 'Bala, n y''a da lɛrɔ wɔɔ duro ʊ, n ʊ: «Ɩ bɩ hɔ du der k''a nɩ hɔyaa zɔm bɩ lɛ ma y.» A hɩ
        awɔɔ ʊ, Woso bɩ kɔ a nawʊm dono ma,'
      sbs: 0.5577
      gen_sec: 11.92
      ref_sec: 8.96
      cer: 0.425
      wer: 0.7647
    bible_00190:
      source: bible
      text: K'a yɛ fɩr k'awɔɔ n'a yɩm bɩ ma, ɩ ʊ, hʊnhʊrlɛ m. Bala, awɔɔ fɩr bɩ yɩrɛ y'a hɩnkarɛ a ʊ,
        Woso ɩ dɩgarɛ awɔɔ ma a nyɩnɔ. Nyɩ ka n ta ʊ, a zɩ bɩr a hʊnhʊrlɛ?
      sbs: 0.6093
      gen_sec: 20.96
      ref_sec: 10.58
      cer: 0.4206
      wer: 0.9211
    bible_00191:
      source: bible
      text: 'Bɩ kʊ wɔɔ ʊ: «Mimbʊnyaa ba wɔɔ ma y», bra wɔɔ n''a barɛ ʊ mɩŋŋɔɔ m, sɩra bɩ wɔɔ nɔ ʊ y.'
      sbs: 0.6903
      gen_sec: 10.84
      ref_sec: 6.54
      cer: 0.5517
      wer: 0.9545
    bible_00192:
      source: bible
      text: Karɩndanyɩnɔ wɔɔ n lɛɛ ka ŋnɩ hɔ k'a nɩ zɛm naa jɩ dɔ hɔɔ y. Bɩ, kʊ ŋ Yeezuu lɛbɔʊrɛ yɩ bɩ,
        ŋ hɔ kʊ ŋ y'a gʊrsɩra ba a minto bɩ tɔ da a nɔ ʊ, bɩ naa ba ŋ y'a ʊ a minto.
      sbs: 0.5711
      gen_sec: 17.08
      ref_sec: 12.46
      cer: 0.3017
      wer: 0.6222
    bible_00193:
      source: bible
      text: Wɔɔ kan kʊ bɩ danyɩnɔ wɔɔ kɩ, wɔɔ yɛ Pol han k'a bɩ ta Zerizalɛm ʊ b'ʊ y.
      sbs: 0.5818
      gen_sec: 6.92
      ref_sec: 4.06
      cer: 0.2692
      wer: 0.7778
    bible_00194:
      source: bible
      text: 'Wosocikarɩnsaambɔɔ gɔsɩnnɔ meerbaa bɩ si, ŋ ʊ: «Karɩnsaamba, ɩ meer ba mɩŋŋa.»'
      sbs: 0.6168
      gen_sec: 8.44
      ref_sec: 4.98
      cer: 0.4098
      wer: 1.0
    bible_00195:
      source: bible
      text: K'a dundo a zi, a jɩm kɔɔkɔɔ sɩrakarɛ nɔ ʊ, a bɩr heer koodə m, a bɩr paŋŋa m.
      sbs: 0.5734
      gen_sec: 8.72
      ref_sec: 5.92
      cer: 0.3818
      wer: 0.6316
    bible_00196:
      source: bible
      text: Naa minto m, wɔɔ nɩ yɛm kɔrɛ ma, ʊ n'ʊ yoŋ ʊ, bala, Woso k'a m mɩsɩr bɩ wɔɔ ta ʊ heer lɛ.
        A m gʊaa haay bʊmbɔrɛzaa, bɩ gʊɔɔ kʊ ŋ sɩra ka rɔ wɔɔ an nɩ ŋ bʊmbɔm.
      sbs: 0.5914
      gen_sec: 15.12
      ref_sec: 12.02
      cer: 0.4054
      wer: 0.775
    bible_00197:
      source: bible
      text: Dɔmɩm biyəə, amba Wosocɛ ʊ gɛɛ har ʊ, ŋ bɩr Yeezuu Krista lemim nyɩnta bɩ dɩndarɛ kan a padarɛ
        kɩ tore y.
      sbs: 0.5846
      gen_sec: 8.2
      ref_sec: 9.8
      cer: 0.2716
      wer: 0.9545
    bible_00198:
      source: bible
      text: Naa tɔ ma bɩ, kʊ wɔɔ ɩ hɔbɩrɛ m kan huu kɩ m, naa a ga m, an wɔɔ bɔ.
      sbs: 0.6258
      gen_sec: 5.84
      ref_sec: 4.86
      cer: 0.4222
      wer: 0.6
    bible_00199:
      source: bible
      text: 'Pɩyɛɛr n zer, an gʊɔɔ wɔɔ zɛ ʊ, an a hɩ, a ʊ: «Mɔɔ ba n nɩ. Mɔɔ awɔɔ n''a karɛ m ma bɩ. Bɔ
        minto y''a ka awɔɔ n bʊr naa ʊ?»'
      sbs: 0.5696
      gen_sec: 11.6
      ref_sec: 9.62
      cer: 0.4359
      wer: 0.7576
