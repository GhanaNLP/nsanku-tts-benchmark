      wer: 0.5135
    bible_00192:
      source: bible
      text: Ɔko‑rɛ ɔko mɛŋ ti taa wu Wurubuaarɛ de ansi kerɛ. Nengyene a kya laarɛ abara ilaa mɔ, i kya
        nyiile yɛɛ Wurubuaarɛ tɛ aye dɔ, ne a nyɛ mɔ-lɛɛ gɛlaarɛꞌ ɔnan a dɛ a kya laarɛ mɔ-ilaa.
