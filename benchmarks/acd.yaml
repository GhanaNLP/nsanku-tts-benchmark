      cer: 0.2561
      wer: 0.8182
    bible_00196:
      source: bible
      text: Mɔ-nanbo mɔ, mɔ, gi kpelegɛ ŋmii mɔ-ayaa dɔ kolɛ mɔ yɛɛ, ‘Nyɛ gisen sa me. I wɔra mɔ, nan
