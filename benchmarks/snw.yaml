      gen_sec: 8.4
      ref_sec: 14.1
      cer: 0.5329
      wer: 0.6129
    bible_00030:
      source: bible
      text: Lɛyɔ lɛbɔmbɔ lɛta di Yesu Kristo leyooto kamɛ. Diwa kaanya.
      sbs: 0.6898
      gen_sec: 5.68
      ref_sec: 9.7
      cer: 0.25
      wer: 0.3
    bible_00031:
      source: bible
      text: Stefano ladiki kanya alɛ, “Bate nii ku babiloo, binu. Yaa ladiki leklekle nɔɔ aatuo ɔwa loo
        Abraham di Mesopotamia kasɔ suoto fiɛ aadie aasifi Haran kasɔ suoto aalaasiɛ.
      sbs: 0.7045
      gen_sec: 14.08
      ref_sec: 14.0
      cer: 0.0657
      wer: 0.2143
    bible_00032:
      source: bible
      text: Abraham lalofo Isak, ni di Isak kafɔɔ lalofo Yakob wɔ nialofo ni Yuda ku babilɛma nɛ.
      sbs: 0.7125
      gen_sec: 6.8
      ref_sec: 7.68
      cer: 0.0
      wer: 0.0
    bible_00033:
      source: bible
      text: Nioso di Yaa ladiki Obi nɔɔ kayi, aaka nwɔ ɔkyɛ lee okyesee, mmle okle aakyakaako ye mindiɛ
        ni sikpile ɔbla.”
      sbs: 0.695
      gen_sec: 8.56
      ref_sec: 11.7
      cer: 0.0
      wer: 0.0
    bible_00034:
      source: bible
      text: ‘Flabatuna falɛ Klekletɛ lɛfɔ nwu abuu di ɔkya kamɛ.’
      sbs: 0.7649
      gen_sec: 7.76
      ref_sec: 4.92
      cer: 0.0
      wer: 0.0
    bible_00035:
      source: bible
      text: Diekye fabale nwɔ ɔlaa buɛtɛ di aba aba fantɔkɔ batii bamuu lɛsaa le fɛɛnya ni ku nle feenu
        nii.
      sbs: 0.6762
      gen_sec: 6.64
      ref_sec: 9.54
      cer: 0.013
      wer: 0.1579
    bible_00036:
      source: bible
      text: Batii ba nikɔbla ni sikpile yi, dikpe ni feediki ma kayi, feesĩ ɔlaa fɛɛta ma di bafũbanutɛ
        bamuu anu. Ni, dibata batii bule nyɛkɛ okpile ɔbla.
      sbs: 0.6977
      gen_sec: 11.36
      ref_sec: 12.58
      cer: 0.0088
      wer: 0.0385
    bible_00037:
      source: bible
      text: Kafɔɔ Yesu labuɛ alɛ, “N-ye nlɛ otii lɛkpankoe, diekye osie owo ledie mi kaamɛ.”
      sbs: 0.6539
      gen_sec: 10.24
      ref_sec: 6.6
      cer: 0.0
      wer: 0.0
    bible_00038:
      source: bible
      text: Diekye fɛ mmle bɛɛbla ɔsanko beekyeko ni osuɔtɔ kamɛ, nkpo oso kafɔɔ di ɔsanko ninlofo osuɔtɔ
        nɛ. Yaa nfũ di asaa ya mmle amuu lekye.
      sbs: 0.686
      gen_sec: 10.88
      ref_sec: 11.28
      cer: 0.0
      wer: 0.0
    bible_00039:
      source: bible
      text: Nioso aakpee otii lakyɛ aalaabudi Yohane disi di leyo katenkɔ.
      sbs: 0.6853
      gen_sec: 5.84
      ref_sec: 5.56
      cer: 0.0385
      wer: 0.3
    bible_00040:
      source: bible
      text: Biye kafɔɔ bilɛ nse otii lɛyɔ suoto nɔɔ ɛɛbla onwii ku sɔnɔkpeetɛ owo, atɔɔbla onwii ku nnwɔɔ
        di suoto sina kamɛ. Kɔkpana Klekle Kukũ lebuɛ alɛ, “Banyɔ lɛma babakple suoto sina sinwii.”
