    bible_00114:
      source: bible
      text: Kafɔɔ bita bukpee ma kufiofa alɛ blasinkakatɛ bata otii kuonwii di Yesu leyooto kamɛ mmle
        okle di ɔlaa wɔ mmle dilaasinkpɛ ni.”
      sbs: 0.646
      gen_sec: 6.74
      ref_sec: 9.56
      cer: 0.0577
      wer: 0.6818
    bible_00115:
      source: bible
      text: Kafɔɔ kuonwii ditabuɛ alɛ nnwɔɔ niɛkpanko nwɔ. Ninfɛ di Petro lakaalɛ nwɔ alɛ, “Saate, nyu
        mmle okle baatii nwu lɛmana fɔ kpinkpĩ beekyi ni!”
      sbs: 0.6395
      gen_sec: 7.67
      ref_sec: 10.22
      cer: 0.0536
      wer: 0.4167
    bible_00116:
      source: bible
      text: Obe wɔ kafɔɔ aalaabuo ni Kaesarea, aakyɛ Yerusalem, ni aalaasɛɛsa bafũbanutɛ ba ninkpe ni
        ninfa nɛ. Ni aafe aasifi Antiokia nɛ.
      sbs: 0.6542
      gen_sec: 6.65
      ref_sec: 10.3
      cer: 0.1359
      wer: 0.619
    bible_00117:
      source: bible
      text: Obe wɔ di Yesu layefe osuku oofe nii, batii kpinwu latikanko nwɔ baamana nwɔ kpinkpĩ baakyi.
      sbs: 0.663
      gen_sec: 4.68
      ref_sec: 6.18
      cer: 0.12
      wer: 0.625
    bible_00118:
      source: bible
      text: Yuda kafɔɔ ku ɔsɔfɔ nɔɔ Tamai lalofo Peres ku Sera, ni di Sera kafɔɔ lalofo Hesron nɛ. Hesron
        kafɔɔ lalofo Aram.
      sbs: 0.6762
      gen_sec: 5.65
      ref_sec: 13.12
      cer: 0.3034
      wer: 0.7619
    bible_00119:
      source: bible
      text: Yaa komiɛ alɛ biabla suoto klekle, mindie di lɛsɔnɔkpee okpile kamɛ kenke.
      sbs: 0.6849
      gen_sec: 3.82
      ref_sec: 6.5
      cer: 0.0164
      wer: 0.4167
    bible_00120:
      source: bible
      text: Obe wɔ di Herode lakpi ni yi, Yaa tɔkyɛntɛ onwii ladiki suoto aatuo Yosef kɔɔlaafɔ kamɛ di
        Egipte.
      sbs: 0.6547
      gen_sec: 5.12
      ref_sec: 9.34
      cer: 0.1139
      wer: 0.8333
    bible_00121:
      source: bible
      text: Yaa wɔ kafɔɔ ninye ni batii otu kamɛ, ladiki aatuo alɛ aafũ ma, aata ma kafɔɔ Ninwuna nɔɔ
        fɛ mmle okle aayɔ aata ni awo kafɔɔ.
      sbs: 0.6409
      gen_sec: 6.97
      ref_sec: 12.98
      cer: 0.0918
      wer: 0.6538
    bible_00122:
      source: bible
      text: Baabuo Kaesarea kaleesɛ. Di obe nwu kamɛ Kornelio ntoosiisa leyo nɔɔ batii basi basoko Petro
        ɔwabee.
      sbs: 0.6361
      gen_sec: 4.87
      ref_sec: 9.32
      cer: 0.1205
      wer: 0.875
    bible_00123:
      source: bible
      text: Diekye bakpisɔfɔ bawo ntookple nkpaamaa batikanko Abonsam.
      sbs: 0.6695
      gen_sec: 3.21
      ref_sec: 4.8
      cer: 0.1373
      wer: 0.8571
    bible_00124:
      source: bible
      text: Batii kpinwu lakye Yudea kasɔ ku Yerusalem okpoo kplɛ baakyɛ ɔfaafuu baalaanu Yohane ɔlaa.
        Baadiki sikpile lɛma baabuɛ ni aakpeesa ma Yaa ntu di Yordan okle kamɛ nɛ.
      sbs: 0.6433
      gen_sec: 8.74
      ref_sec: 11.92
      cer: 0.1103
      wer: 0.6429
    bible_00125:
      source: bible
      text: Ninfɛ di Yesu lakaalɛ ma alɛ, “Bienyu bilɛ mmle okle beelo ni Galilea batii ba mmle oso, mma
        ninle bakpileblatɛ balenke Galilea batii bamuu bule?
      sbs: 0.6702
      gen_sec: 7.54
      ref_sec: 10.96
      cer: 0.0684
      wer: 0.64
    bible_00126:
      source: bible
      text: Kafɔɔ ntɔɔpɛ ɔlaa lɛta Yaa diisi lɛfɔ Simon, alɛ ofũ onu lɛfɔ dilaayu. Alɛ nse fɛɛpɛ feekple
        fɛɛwa ɔkyɛ nii, faakpee babilee suɔtɔbi osie.”
      sbs: 0.6291
      gen_sec: 6.88
      ref_sec: 12.5
      cer: 0.0991
      wer: 0.6667
    bible_00127:
      source: bible
      text: Akpaa nwɔ awako leyo. Abalɛɛ basiɛwo nɔɔ ku leyo nɔɔ batii ansiisa antɔkɔ ma alɛ, ‘Suoto kɔtɛ
        sinyɔɔ mi osie kanya, diekye ntɔɔnya foso nii nwu niayu nii. Biwa biɛbanyakoe suoto lɛyɔɔ!’
      sbs: 0.6679
      gen_sec: 9.75
      ref_sec: 14.5
      cer: 0.0816
      wer: 0.75
    bible_00128:
      source: bible
      text: Ninfɛ di basaateketetɛ nɔɔ nwu lakyako bawo ɔkaalɛ alɛ, owe mɔ kaamɛ lɛma nimabla lɛsaa le
        mmle okle.
      sbs: 0.6745
      gen_sec: 5.34
      ref_sec: 6.86
      cer: 0.0488
      wer: 0.6111
    bible_00129:
      source: bible
      text: Ayi awo sɛmaa, Yuda batii lalɛɛ bawo baabla disibu alɛ babalo Saulo.
      sbs: 0.6899
      gen_sec: 3.61
      ref_sec: 5.1
      cer: 0.1455
      wer: 0.75
    bible_00130:
      source: bible
      text: Ee bitanka di kasɔ, diekye Yaa nkpaa kasekɔ kale. Bitanka kafɔɔ di Yerusalem, diekye nwu ninle
        baka Ɔka nwu okpoo kplɛ nɛ.
      sbs: 0.6847
      gen_sec: 6.12
      ref_sec: 9.98
      cer: 0.134
      wer: 0.6364
    bible_00131:
      source: bible
      text: Nioso obe lele manyumasa ye sɛlaa se mmle, kuntɛ nfɛ biye sĩ kofokofoko bikle kafɔɔ nwaako
        ɔlaa nwu nkpo biefũ ni osie kanya.
      sbs: 0.657
      gen_sec: 6.66
      ref_sec: 12.3
      cer: 0.0891
      wer: 0.8696
    bible_00132:
      source: bible
      text: Yesu layila ni aalɛɛ ma aawako ɔkyɛ nɔɔ, ni aakaalɛ ma alɛ, “Be biomiɛ bilɛ mbla nta ye?”
      sbs: 0.657
      gen_sec: 4.44
      ref_sec: 7.58
      cer: 0.1493
      wer: 0.9444
    bible_00133:
      source: bible
      text: Kafɔɔ biye bilɛ ninkookaa ye lɛsaa lee nimakyakaako ye nii, nle n-ye ni di Yaa suoto, di Yaa
        ɔlaa obuɛ ku otuo kamɛ, lɛɛkpaka ku ayo le kamɛ.
      sbs: 0.6516
      gen_sec: 7.5
      ref_sec: 14.72
      cer: 0.0459
      wer: 0.5
    bible_00134:
      source: bible
      text: “Nse dibawɛ osie fiɛ baatii biene kamawɛ didiki mɔ,
      sbs: 0.6213
      gen_sec: 2.57
      ref_sec: 4.44
      cer: 0.0488
      wer: 0.8889
    bible_00135:
      source: bible
      text: Nunua be feekple fasoko? Taka, faafũ ntu okpeesa amanle nwu. Faalɛɛ nwɔ, aafotofɔ sikpile
        adiki di suoto.’
      sbs: 0.6605
      gen_sec: 5.63
      ref_sec: 9.68
      cer: 0.8452
      wer: 1.0
    bible_00136:
      source: bible
      text: Afiofa ya mmle anyɔ suoto di Mose kufiofa ku Yaa ɔlaa babuɛtɛtɛ asaa otuo nkyɛ nɛ.”
      sbs: 0.657
      gen_sec: 4.44
      ref_sec: 6.6
      cer: 0.1212
      wer: 0.6875
    bible_00137:
      source: bible
      text: Kananfi labawɛ osie, ta nkpo oso bakpɛtɛ banɔɔfo ɔnɔɔfo nwu layɛkɛ alɛ babananfi Paulo mambɛbɛɛ.
        Nioso aatɔkɔ bakpɛtɛ nɔɔ alɛ bakyɛ baalaakpaa nwɔ baatii nwu kamɛ basifiko leyo katenkɔ.
      sbs: 0.6228
      gen_sec: 10.65
      ref_sec: 14.66
      cer: 0.0584
      wer: 0.6897
    bible_00138:
      source: bible
      text: Usia lalofo Yotam, ni di Yotam lalofo Ahas nɛ, ni di Ahas kafɔɔ kolofo Hiskia nɛ.
      sbs: 0.6918
      gen_sec: 3.45
      ref_sec: 10.52
      cer: 0.4603
      wer: 0.625
    bible_00139:
      source: bible
      text: “Bibu ɔlaa wɔ mmle disi binyu. Osuɔtɔ onwii lawɛ babi suɔtɔbi banyɔ banwii. Ni aakyɛ aalaatɔkɔ
        ɔnɔɔfo le alɛ, ‘Obi, kyɛ falaabla ɔkpɛ koofe nii miɛ.’
      sbs: 0.6793
      gen_sec: 7.81
      ref_sec: 12.3
      cer: 0.0948
      wer: 0.6538
    bible_00140:
      source: bible
      text: Nse biekpee okyiini di lɛsaa biene ɔbla suoto, owe nimayila ye di suoto?
      sbs: 0.6647
      gen_sec: 3.64
      ref_sec: 6.74
      cer: 0.1379
      wer: 0.8462
    bible_00141:
      source: bible
      text: Nkpo oso ayee bisiɛ bitoonyu osuku, diekye ami, Otii Obi nwu, mawa di obe wɔ minoonyu osuku
        bitɛɛ nii.”
      sbs: 0.6636
      gen_sec: 5.2
      ref_sec: 8.66
      cer: 0.175
      wer: 0.8421
    bible_00142:
      source: bible
      text: Nse biemufũ nwu bieklee osie kanya, bibawɛ didiki. Se diele nkpo, ni ofũ onu lee nwu lɛbla
        kasakasa.
      sbs: 0.6725
      gen_sec: 5.43
      ref_sec: 7.8
      cer: 0.0886
      wer: 0.7778
    bible_00143:
      source: bible
      text: Nse batii bawo kɔnya wo fɛ afĩi buobuo yi, Yaa wɔ mumbɔmbɔ ni oso dite wo nkpo. Kafɔɔ nse
        buloobuo afĩi yi, ni aye lɛlɛ oso dite nkpo.
      sbs: 0.6802
      gen_sec: 6.75
      ref_sec: 12.46
      cer: 0.0388
      wer: 0.4643
    bible_00144:
      source: bible
      text: Otii wɔ baayɔɔsa ni ofiɛ ntoofũ alenke alɛɛ afosi ana.
      sbs: 0.6393
      gen_sec: 2.95
      ref_sec: 4.02
      cer: 0.1136
      wer: 0.7
    bible_00145:
      source: bible
      text: Diekye kayi ka mmle ninumbe nle dibuusaa di Yaa anu. Nioso di Kɔkpana Klekle Kukũ lebuɛ alɛ,
        “Banumbentɛ bamu disibu di Yaa n-yɔ andiki ma di okũ.”
      sbs: 0.6174
      gen_sec: 8.08
      ref_sec: 11.0
      cer: 0.087
      wer: 0.6296
    bible_00146:
      source: bible
      text: Nkpo oso obe wɔ di Yosef lasɛnkɛ nii, aayɔ Maria aabla ɔsɔfɔ nɔɔ fɛ mmle di Yaa tɔkyɛntɛ nwu
        nkpo latɔkɔ nwɔ nii.
      sbs: 0.6649
      gen_sec: 6.37
      ref_sec: 11.82
      cer: 0.1011
      wer: 0.7826
    bible_00147:
      source: bible
      text: Nkpo oso nunua yi, bitɔɔkyɛ akpaka biɛlaalɛɛ batii lele biɛnya bilɛ bawa ɔsanko ɔyɔ dii kalekɔ
        nwu.’
      sbs: 0.6923
      gen_sec: 5.27
      ref_sec: 9.82
      cer: 0.0864
      wer: 0.5294
    bible_00148:
      source: bible
      text: Ni aayɔ disi nwu nkpo aakpee di bɛɛsi bɛnkɛɛ kamɛ aawako ɔsankobi nwu nkpo nɛ. Ni di ɔsankobi
        nwu nkpo kafɔɔ layɔ disi nwu aakyɛnko ɔya nɛ.
      sbs: 0.6796
      gen_sec: 7.0
      ref_sec: 12.1
      cer: 0.0631
      wer: 0.2963
    bible_00149:
      source: bible
      text: Nse leyo nwu nkpo batii letuna beefũ ye, ni biɛta atoko ɔkyɛ ole lee lɛsɛɛsa dite ninfa. Kafɔɔ
        nse baatuna bafũ ye, ni biɛta atoko ɔkyɛ ole lee nwu nkpo lɛsɛɛsa dikple diwa ɔkyɛ lee.
      sbs: 0.6743
      gen_sec: 9.89
      ref_sec: 14.7
      cer: 0.1042
      wer: 0.8
    bible_00150:
      source: bible
      text: Ni kɔɔfɛɛfɔ nwu labalɛ oklo nwu nɛ. Ditaba wo buamunikĩisa oklo nwu buakyɔɔ kɔfɛɛfɔ nwu anu.
        Nioso buata kɔfɛɛfɔ nwu osuku kuatuka wo kuatɔɔkyɛnko.
      sbs: 0.6534
      gen_sec: 2.84
      ref_sec: 12.5
      cer: 0.8347
      wer: 0.9583
    bible_00151:
      source: bible
      text: Ɛhɛɛ, ntoonyuma nlɛ lakpeesa Stefana leyo batii kafɔɔ Yaa ntu. Mma nkpo kamaa, noosinyuma
        nlɛ lakple lakpeesa batii bamba Yaa ntu.
      sbs: 0.6751
      gen_sec: 6.52
      ref_sec: 12.64
      cer: 0.0566
      wer: 0.6667
    bible_00152:
      source: bible
      text: Mimbuɛ kafɔɔ bilɛ, ‘Nse minsiɛ nkpa di bawa lee obe kamɛ yi, nse biɛbla onwii ku mma bilo
        Yaa ɔlaa babuɛtɛtɛ nwu nkpo.’
      sbs: 0.6693
      gen_sec: 6.01
      ref_sec: 10.42
      cer: 0.0543
      wer: 0.5217
    bible_00153:
      source: bible
      text: Kafɔɔ baakakatɛ baata ni ninwuna kpile ninwii, ninwuna kpile nwu labuɛ alɛ, “N-ye Yesu, n-ye
        kafɔɔ Paulo. Aye mɔ, bawe bile?”
      sbs: 0.6805
      gen_sec: 6.28
      ref_sec: 10.52
      cer: 0.2632
      wer: 0.619
    bible_00154:
      source: bible
      text: Aye bitɔkɔ mi, be biakyɛ bialaanya? Yaa ɔlaa buɛtɛtɛ? Nwaako katɔkɔ ye nii, otii wɔ biakyɛ
        bialaanya ni nlenke bia Yaa ɔlaa buɛtɛtɛ.
      sbs: 0.7178
      gen_sec: 6.52
      ref_sec: 11.82
      cer: 0.2
      wer: 0.4783
    bible_00155:
      source: bible
      text: Ninfɛ baakyako obuɛ kaamɛ lɛma alɛ, “Mmle munan-yɔ bloblo kuonwii bukle ni oso obuɛ ɔlaa wɔ
        mmle?”
      sbs: 0.6603
      gen_sec: 5.24
      ref_sec: 8.32
      cer: 0.0519
      wer: 0.5882
    bible_00156:
      source: bible
      text: abawɛ sifutulɛ kafɔɔ anta mba lɛɛkyakaako lefĩ nii.
      sbs: 0.6554
      gen_sec: 2.48
      ref_sec: 5.52
      cer: 0.2791
      wer: 0.875
    bible_00157:
      source: bible
      text: Nse otii owo diɛyɔ nwu ole di ɔlaa wɔ mmle suoto, ayee bitankyɔɔ nwɔ ɔlaa atoko.
      sbs: 0.6675
      gen_sec: 4.14
      ref_sec: 7.24
      cer: 0.1429
      wer: 0.5625
    bible_00158:
      source: bible
      text: Obe wɔ baalaabuo ni Yerusalem, bafũbanutɛ ku batɔkyɛntɛ ku banɔɔfo lɛma lafũ ma nwaa. Ninfɛ
        di Paulo ku Barnaba latɔkɔ ma asaa ya amuu di Yaa labla aafenko ni di suoto lɛma nɛ.
      sbs: 0.612
      gen_sec: 10.54
      ref_sec: 12.02
      cer: 0.0993
      wer: 0.7273
    bible_00159:
      source: bible
      text: Yaa wɔ ninle ni Saate Yesu Teete, nwɔ buɔtansa ni diesifi ni dinnaa ni kaloo, aye alɛ sɛlaa
        se kobuɛ nii, site nkpo.
      sbs: 0.6584
      gen_sec: 6.06
      ref_sec: 10.52
      cer: 0.1
      wer: 0.6522
    bible_00160:
      source: bible
      text: Ɔlanle faale fiɛ di Yaa lalɛɛfɔ? Diɛbla lɛsalɛsaa. Kafɔɔ nse osuku nkpe fɔ alɛ faadie di sɛlanle
        nwu kamɛ, ni faablako nwu ɔkpɛ.
      sbs: 0.6694
      gen_sec: 6.74
      ref_sec: 11.42
      cer: 0.049
      wer: 0.7826
    bible_00161:
      source: bible
      text: Nse buoole Yaa afiofa, ni buofũ buonu bulɛ buye nwɔ.
      sbs: 0.6697
      gen_sec: 2.69
      ref_sec: 5.6
      cer: 0.122
      wer: 0.3
    bible_00162:
      source: bible
      text: Ninfɛ di Yesu lalɛɛ obisɔ biibii onwii aabayila ma di anu nɛ.
      sbs: 0.671
      gen_sec: 2.99
      ref_sec: 5.14
      cer: 0.1633
      wer: 0.75
    bible_00163:
      source: bible
      text: Nse ɛɛbla fɔ okpile sikuɛnsĩ, di dii ninwii kamɛ, eekple ɛɛwafɔ ɔkyɛ di sikuɛnsĩ nwu nkpo
        kamɛ, ɛɛbatikiti fɔ lekoto, faayɔ fakyɛ nwɔ.”
      sbs: 0.6636
      gen_sec: 7.14
      ref_sec: 11.2
      cer: 0.0654
      wer: 0.5217
    bible_00164:
      source: bible
      text: Kafɔɔ nwaako ɔlaa kule alɛ Yaa lasɛnkɛsa Kristo aakyeko bakpi kamɛ. Nle mmle ninle lɛtaafuɔ
        le ninkotuo alɛ batii ba niekpi bate nii, babasɛnkɛsa ma.
      sbs: 0.6413
      gen_sec: 8.24
      ref_sec: 14.16
      cer: 0.0492
      wer: 0.68
    bible_00165:
      source: bible
      text: Di basa ku basɔfɔ suoto yi, kokpee ma Saate kufiofa ninanle ami omu kufiofa kule ni. Dinaa
        alɛ ɔsanko lesĩ ɔsa.
      sbs: 0.5996
      gen_sec: 5.86
      ref_sec: 9.76
      cer: 0.1477
      wer: 0.7619
    bible_00166:
      source: bible
      text: Diele Beelsebul osie kule. Kafɔɔ Yaa Ninwuna niɛtɛɛ osie kotososa anwuna kpile ndiki baatii
        kamɛ. Nle mmle kotuo alɛ Yaa sɛka kalekɔ ntɔɔwa ye kamɛ kofokofoko.
      sbs: 0.6525
      gen_sec: 9.16
      ref_sec: 13.2
      cer: 0.0687
      wer: 0.5769
    bible_00167:
      source: bible
      text: Nunua, bawe ninle wo osuku onyu, suoto lɛyɔɔ ku lɛkakoto le suoto bubakanta ni se Saate loo
        Yesu lɛwa? Mma ninle aye nɛ.
      sbs: 0.6495
      gen_sec: 5.72
      ref_sec: 11.52
      cer: 0.2021
      wer: 0.8696
    bible_00168:
      source: bible
      text: Kafɔɔ obe wɔ baakyɛ nii, batanya ma! Nioso baakple babatɔkɔ ma alɛ,
      sbs: 0.6812
      gen_sec: 3.3
      ref_sec: 4.9
      cer: 0.0566
      wer: 0.6667
    bible_00169:
      source: bible
      text: Kafɔɔ Farisi batii labuɛ alɛ, “Anwuna kpile ɔka niɛtɔɔ osie nwu akle ootososa anwuna kpile
        andiki.”
      sbs: 0.6245
      gen_sec: 5.01
      ref_sec: 7.88
      cer: 0.2375
      wer: 0.6875
    bible_00170:
      source: bible
      text: Di obe nwu nkpo kamɛ kafɔɔ, Petro lakple aayila aatɔɔpɛ ɔpɛ kokloo kɔnɛɛ. Ni baalaasɛkɛtɛ
        nii nnwɔɔ diale, diabla ma ɔkpɛ osie kanya.
      sbs: 0.6804
      gen_sec: 7.08
      ref_sec: 10.3
      cer: 0.0841
      wer: 0.6522
    bible_00171:
      source: bible
      text: Bilolaa binyu, biɛta anu lee ate kesekese, ta bieye dii le diɛ obe nwu mawo nii.
      sbs: 0.6719
      gen_sec: 4.26
      ref_sec: 6.96
      cer: 0.0968
      wer: 0.875
    bible_00172:
      source: bible
      text: Ni aadiɛ ma aakyɛ sitũ kɛɛkɛ, ni aapɛ akunkyi aapɛ ɔlaa aata Yaa nɛ.
      sbs: 0.6635
      gen_sec: 3.36
      ref_sec: 5.42
      cer: 0.1887
      wer: 0.8571
    bible_00173:
      source: bible
      text: Komiɛ nlɛ kamɛ kakpa ye klekle nlɛ, di lɛkanko di nwu suoto yi, otii biala ɔlaakuu lele atooyibuɛ
        yi, abata nwu nkuntaa.
      sbs: 0.6551
