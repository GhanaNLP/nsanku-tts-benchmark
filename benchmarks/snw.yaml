      sbs: 0.6893
      gen_sec: 10.48
      ref_sec: 12.12
      cer: 0.0095
      wer: 0.0385
    bible_00019:
      source: bible
      text: Yɔ asaatuo ya faanu latuo ni di batii kpinwu anu fatuo batii ba feefũ feenu falɛ beelolaa
