      sbs: 0.6587
      gen_sec: 8.64
      ref_sec: 8.04
      cer: 0.0617
      wer: 0.1111
    bible_00028:
      source: bible
      text: Ɔlaa lɛma lakpɛ Yesu nyaami, ni aakpanko ma anu nɛ. Nfanwu ni baakyako ɔnya nɛ. Ninfɛ baatikanko
