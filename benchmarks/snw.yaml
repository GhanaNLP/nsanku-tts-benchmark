      sbs: 0.7014
      gen_sec: 9.68
      ref_sec: 11.96
      cer: 0.0096
      wer: 0.0417
    bible_00020:
      source: bible
      text: Diɛyɔ ni di obe wɔ di Israel batii ladie ni di Babilon kasɔ suoto di sɛlanle kamɛ, diɛlaase
