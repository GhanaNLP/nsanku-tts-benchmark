      gen_sec: 14.24
      ref_sec: 11.42
      cer: 0.0397
      wer: 0.16
    bible_00017:
      source: bible
      text: Mma ninle, Simon wɔ aata ni leyooto alɛ, Petro ku obilɛma suɔtɔbi Andrea ku Yakobo ku Yohane
        ku Filipo ku Bartolomeo,
      sbs: 0.7258
      gen_sec: 10.48
      ref_sec: 10.92
      cer: 0.0106
      wer: 0.0476
    bible_00018:
      source: bible
      text: Yuda batii bawo niakye ni Asia kasɔ niawɛ ninfa. Nse mma dikaatɛ alɛ manwa ɔkyɛ lɛfɔ ninfũ,
