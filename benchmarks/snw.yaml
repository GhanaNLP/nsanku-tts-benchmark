      sbs: 0.7212
      gen_sec: 12.88
      ref_sec: 12.66
      cer: 0.0265
      wer: 0.1538
    bible_00098:
      source: bible
      text: Lɛyɛntɛle, batii banyɔ banwii ladie,
      sbs: 0.7091
      gen_sec: 3.56
      ref_sec: 3.26
      cer: 0.0667
      wer: 0.6
    bible_00099:
      source: bible
      text: Peleg ote niale Eber, Eber ote niale Sala.
      sbs: 0.7561
      gen_sec: 3.92
      ref_sec: 3.68
      cer: 0.0
      wer: 0.0
    bible_00100:
      source: bible
      text: Nkpo kafɔɔ anan-yɔ kɔsaanwu aatɔɔ nse ɛɛkaalɛ nwɔ kakpaku nɛ.
      sbs: 0.6981
      gen_sec: 5.51
      ref_sec: 4.42
      cer: 0.1
      wer: 0.4
    bible_00101:
      source: bible
      text: aye kafɔɔ minle mi babi suɔtɔbi ku babi sankobi.
      sbs: 0.6574
      gen_sec: 4.52
      ref_sec: 3.2
      cer: 0.0
      wer: 0.0
    bible_00102:
      source: bible
      text: Nkpo oso baakyɛ baalaatikiti ma lekoto, ni baadiki ma leeyo katenkɔ nɛ. Ni baatɔkɔ ma alɛ
        badie di okpoo nwu, baatɔɔkyɛ kakɔ bamba.
      sbs: 0.7411
      gen_sec: 12.0
      ref_sec: 10.24
      cer: 0.0
      wer: 0.0
    bible_00103:
      source: bible
      text: Nwaako biye bilɛ aye ninle Yaa ole Katakɔ. Yaa Ninwuna kafɔɔ nsi ye kaamɛ.
      sbs: 0.7148
      gen_sec: 6.75
      ref_sec: 5.6
      cer: 0.0678
      wer: 0.2857
    bible_00104:
      source: bible
      text: Diekye diɛkaatɛ alɛ Yaa kpɛmblatɛ lɛlɔ. Diekye dikpe ni anwɛ sifutulɛ anta batii bamuu, anle
        saatuotɛ biene, anwɛ otu ɔtɛ kaasɔ.
      sbs: 0.7258
      gen_sec: 11.79
      ref_sec: 11.84
      cer: 0.0481
      wer: 0.1429
    bible_00105:
      source: bible
      text: Ni di bakpɛtɛ banɔɔfo ɔnɔɔfo nwu latɔkɔ Paulo alɛ, “Amii, Roma otii nle. Kafɔɔ ami koto dikudi
        lata fiɛ lekple Roma otii!”
      sbs: 0.7129
      gen_sec: 11.0
      ref_sec: 9.76
      cer: 0.0
      wer: 0.0909
    bible_00106:
      source: bible
      text: Bikusɛkusɛsa Ɔka Dawid sɛka kalekɔ ka nikɔwa ni!
      sbs: 0.6524
      gen_sec: 4.6
      ref_sec: 4.98
      cer: 0.025
      wer: 0.5
    bible_00107:
      source: bible
      text: Obe wɔ baabuo ni okpoo wɔ bɔɔlɛɛ ni Salami, baasifi Yuda batii kasiisakɔ baalaabuɛ Saate ɔlaa
        nwu. Marko Yohane kafɔɔ latikanko ma fɛ kyakaakotɛ.
      sbs: 0.7469
      gen_sec: 13.36
      ref_sec: 11.24
      cer: 0.0252
      wer: 0.125
    bible_00108:
      source: bible
      text: Dikpe nii anle otii wɔ nikofuo ni leyo nɔɔ batii onyu nwaa, anta babi nɔɔ mbu nwɔ nii, mankyɔɔ
        nwɔ ni ɔlaa kotoko.
      sbs: 0.6967
      gen_sec: 10.24
      ref_sec: 10.24
      cer: 0.0899
      wer: 0.1304
    bible_00109:
      source: bible
      text: Yuda batii komiɛ sɛkpɛ se niɛbla ni ɔkpɛ alɛ bɔɔnya. Hela batii kafɔɔ komiɛ ninumbe.
      sbs: 0.6949
      gen_sec: 7.8
      ref_sec: 6.52
      cer: 0.0
      wer: 0.0
    bible_00110:
      source: bible
      text: Lɛsaa le kafɔɔ niabla ma ni nyaami ninle alɛ, aabuɛ alɛ, blɔbasinkple banyɔɔ. Ninfɛ baatikanko
        nwɔ baakpaa nwɔ baalaadunko oklo katũ nɛ.
      sbs: 0.7431
      gen_sec: 12.6
      ref_sec: 13.08
      cer: 0.018
      wer: 0.1364
    bible_00111:
      source: bible
      text: Nioso aakpee bakyakaakotɛ nɔɔ banyɔ, Timoteo ku Erasto, ni baale nwɔ katũ baasifi Makedonia
        nɛ. Ni aakple aasiɛ di Asia ninfa obe kɛkɛɛ aakyakaa nɛ.
      sbs: 0.7313
      gen_sec: 13.6
      ref_sec: 13.64
      cer: 0.0
      wer: 0.0
    bible_00112:
      source: bible
      text: Paulo lasiɛ ninfa obe kɛɛkɛ, ni aasifi aalaafe di Galatia ku Frigia nsɔ suoto nɛ. Ni aatookpee
        bafũbanutɛ ba niawɛ ni ninfa bamuu osie nɛ.
      sbs: 0.7295
      gen_sec: 12.6
      ref_sec: 11.28
      cer: 0.018
      wer: 0.04
    bible_00113:
      source: bible
      text: Nwaako kɔtɔkɔ ye nlɛ Yaa matuna ma wla. Kafɔɔ nse Otii Obi nwu lɛwa, abanya batii ba niefũ
        beenu ni kaasɔ ka mmle?”
      sbs: 0.711
      gen_sec: 10.01
      ref_sec: 10.98
      cer: 0.0449
      wer: 0.1739
    bible_00114:
      source: bible
      text: Kafɔɔ bita bukpee ma kufiofa alɛ blasinkakatɛ bata otii kuonwii di Yesu leyooto kamɛ mmle
        okle di ɔlaa wɔ mmle dilaasinkpɛ ni.”
      sbs: 0.7121
      gen_sec: 11.21
      ref_sec: 9.56
      cer: 0.0096
      wer: 0.1364
    bible_00115:
      source: bible
      text: Kafɔɔ kuonwii ditabuɛ alɛ nnwɔɔ niɛkpanko nwɔ. Ninfɛ di Petro lakaalɛ nwɔ alɛ, “Saate, nyu
        mmle okle baatii nwu lɛmana fɔ kpinkpĩ beekyi ni!”
      sbs: 0.6547
      gen_sec: 12.57
      ref_sec: 10.22
      cer: 0.0089
      wer: 0.125
    bible_00116:
      source: bible
      text: Obe wɔ kafɔɔ aalaabuo ni Kaesarea, aakyɛ Yerusalem, ni aalaasɛɛsa bafũbanutɛ ba ninkpe ni
        ninfa nɛ. Ni aafe aasifi Antiokia nɛ.
      sbs: 0.7419
      gen_sec: 11.4
      ref_sec: 10.3
      cer: 0.0194
      wer: 0.0952
    bible_00117:
      source: bible
      text: Obe wɔ di Yesu layefe osuku oofe nii, batii kpinwu latikanko nwɔ baamana nwɔ kpinkpĩ baakyi.
      sbs: 0.6839
      gen_sec: 8.56
      ref_sec: 6.18
      cer: 0.0133
      wer: 0.0625
    bible_00118:
      source: bible
      text: Yuda kafɔɔ ku ɔsɔfɔ nɔɔ Tamai lalofo Peres ku Sera, ni di Sera kafɔɔ lalofo Hesron nɛ. Hesron
        kafɔɔ lalofo Aram.
      sbs: 0.7354
      gen_sec: 10.2
      ref_sec: 13.12
      cer: 0.0562
      wer: 0.2381
    bible_00119:
      source: bible
      text: Yaa komiɛ alɛ biabla suoto klekle, mindie di lɛsɔnɔkpee okpile kamɛ kenke.
      sbs: 0.7249
      gen_sec: 7.0
      ref_sec: 6.5
      cer: 0.0
      wer: 0.1667
    bible_00120:
      source: bible
      text: Obe wɔ di Herode lakpi ni yi, Yaa tɔkyɛntɛ onwii ladiki suoto aatuo Yosef kɔɔlaafɔ kamɛ di
        Egipte.
      sbs: 0.7079
      gen_sec: 8.92
      ref_sec: 9.34
      cer: 0.0633
      wer: 0.2778
    bible_00121:
      source: bible
      text: Yaa wɔ kafɔɔ ninye ni batii otu kamɛ, ladiki aatuo alɛ aafũ ma, aata ma kafɔɔ Ninwuna nɔɔ
        fɛ mmle okle aayɔ aata ni awo kafɔɔ.
      sbs: 0.736
      gen_sec: 11.24
      ref_sec: 12.98
      cer: 0.0408
      wer: 0.0769
    bible_00122:
      source: bible
      text: Baabuo Kaesarea kaleesɛ. Di obe nwu kamɛ Kornelio ntoosiisa leyo nɔɔ batii basi basoko Petro
        ɔwabee.
      sbs: 0.7191
      gen_sec: 9.4
      ref_sec: 9.32
      cer: 0.1205
      wer: 0.625
    bible_00123:
      source: bible
      text: Diekye bakpisɔfɔ bawo ntookple nkpaamaa batikanko Abonsam.
      sbs: 0.7147
      gen_sec: 5.76
      ref_sec: 4.8
      cer: 0.0
      wer: 0.0
    bible_00124:
      source: bible
      text: Batii kpinwu lakye Yudea kasɔ ku Yerusalem okpoo kplɛ baakyɛ ɔfaafuu baalaanu Yohane ɔlaa.
        Baadiki sikpile lɛma baabuɛ ni aakpeesa ma Yaa ntu di Yordan okle kamɛ nɛ.
      sbs: 0.6567
      gen_sec: 15.05
      ref_sec: 11.92
      cer: 0.0221
      wer: 0.0714
    bible_00125:
      source: bible
      text: Ninfɛ di Yesu lakaalɛ ma alɛ, “Bienyu bilɛ mmle okle beelo ni Galilea batii ba mmle oso, mma
        ninle bakpileblatɛ balenke Galilea batii bamuu bule?
      sbs: 0.6944
      gen_sec: 13.28
      ref_sec: 10.96
      cer: 0.0085
      wer: 0.04
    bible_00126:
      source: bible
      text: Kafɔɔ ntɔɔpɛ ɔlaa lɛta Yaa diisi lɛfɔ Simon, alɛ ofũ onu lɛfɔ dilaayu. Alɛ nse fɛɛpɛ feekple
        fɛɛwa ɔkyɛ nii, faakpee babilee suɔtɔbi osie.”
      sbs: 0.7325
      gen_sec: 12.68
      ref_sec: 12.5
      cer: 0.027
      wer: 0.125
    bible_00127:
      source: bible
      text: Akpaa nwɔ awako leyo. Abalɛɛ basiɛwo nɔɔ ku leyo nɔɔ batii ansiisa antɔkɔ ma alɛ, ‘Suoto kɔtɛ
        sinyɔɔ mi osie kanya, diekye ntɔɔnya foso nii nwu niayu nii. Biwa biɛbanyakoe suoto lɛyɔɔ!’
      sbs: 0.7209
      gen_sec: 16.51
      ref_sec: 14.5
      cer: 0.034
      wer: 0.1562
    bible_00128:
      source: bible
      text: Ninfɛ di basaateketetɛ nɔɔ nwu lakyako bawo ɔkaalɛ alɛ, owe mɔ kaamɛ lɛma nimabla lɛsaa le
        mmle okle.
      sbs: 0.7107
      gen_sec: 9.32
      ref_sec: 6.86
      cer: 0.0122
      wer: 0.1111
    bible_00129:
      source: bible
      text: Ayi awo sɛmaa, Yuda batii lalɛɛ bawo baabla disibu alɛ babalo Saulo.
      sbs: 0.7319
      gen_sec: 6.36
      ref_sec: 5.1
      cer: 0.0364
      wer: 0.1667
    bible_00130:
      source: bible
      text: Ee bitanka di kasɔ, diekye Yaa nkpaa kasekɔ kale. Bitanka kafɔɔ di Yerusalem, diekye nwu ninle
        baka Ɔka nwu okpoo kplɛ nɛ.
      sbs: 0.7642
      gen_sec: 11.11
      ref_sec: 9.98
      cer: 0.0103
      wer: 0.0455
    bible_00131:
      source: bible
      text: Nioso obe lele manyumasa ye sɛlaa se mmle, kuntɛ nfɛ biye sĩ kofokofoko bikle kafɔɔ nwaako
        ɔlaa nwu nkpo biefũ ni osie kanya.
      sbs: 0.6887
      gen_sec: 11.44
      ref_sec: 12.3
      cer: 0.0396
      wer: 0.3043
    bible_00132:
      source: bible
      text: Yesu layila ni aalɛɛ ma aawako ɔkyɛ nɔɔ, ni aakaalɛ ma alɛ, “Be biomiɛ bilɛ mbla nta ye?”
      sbs: 0.7022
      gen_sec: 7.92
      ref_sec: 7.58
      cer: 0.0896
      wer: 0.5556
    bible_00133:
      source: bible
      text: Kafɔɔ biye bilɛ ninkookaa ye lɛsaa lee nimakyakaako ye nii, nle n-ye ni di Yaa suoto, di Yaa
        ɔlaa obuɛ ku otuo kamɛ, lɛɛkpaka ku ayo le kamɛ.
      sbs: 0.7173
      gen_sec: 12.51
      ref_sec: 14.72
      cer: 0.0367
      wer: 0.5
    bible_00134:
      source: bible
      text: “Nse dibawɛ osie fiɛ baatii biene kamawɛ didiki mɔ,
      sbs: 0.6685
      gen_sec: 4.8
      ref_sec: 4.44
      cer: 0.122
      wer: 0.3333
    bible_00135:
      source: bible
      text: Nunua be feekple fasoko? Taka, faafũ ntu okpeesa amanle nwu. Faalɛɛ nwɔ, aafotofɔ sikpile
        adiki di suoto.’
      sbs: 0.7423
      gen_sec: 9.72
      ref_sec: 9.68
      cer: 0.0357
      wer: 0.4706
    bible_00136:
      source: bible
      text: Afiofa ya mmle anyɔ suoto di Mose kufiofa ku Yaa ɔlaa babuɛtɛtɛ asaa otuo nkyɛ nɛ.”
      sbs: 0.6847
      gen_sec: 7.54
      ref_sec: 6.6
      cer: 0.0152
      wer: 0.125
    bible_00137:
      source: bible
      text: Kananfi labawɛ osie, ta nkpo oso bakpɛtɛ banɔɔfo ɔnɔɔfo nwu layɛkɛ alɛ babananfi Paulo mambɛbɛɛ.
        Nioso aatɔkɔ bakpɛtɛ nɔɔ alɛ bakyɛ baalaakpaa nwɔ baatii nwu kamɛ basifiko leyo katenkɔ.
      sbs: 0.68
      gen_sec: 17.23
      ref_sec: 14.66
      cer: 0.039
      wer: 0.1034
    bible_00138:
      source: bible
      text: Usia lalofo Yotam, ni di Yotam lalofo Ahas nɛ, ni di Ahas kafɔɔ kolofo Hiskia nɛ.
      sbs: 0.7324
      gen_sec: 7.32
      ref_sec: 10.52
      cer: 0.0635
      wer: 0.1875
    bible_00139:
      source: bible
      text: “Bibu ɔlaa wɔ mmle disi binyu. Osuɔtɔ onwii lawɛ babi suɔtɔbi banyɔ banwii. Ni aakyɛ aalaatɔkɔ
        ɔnɔɔfo le alɛ, ‘Obi, kyɛ falaabla ɔkpɛ koofe nii miɛ.’
      sbs: 0.745
      gen_sec: 13.44
      ref_sec: 12.3
      cer: 0.0259
      wer: 0.4231
    bible_00140:
      source: bible
      text: Nse biekpee okyiini di lɛsaa biene ɔbla suoto, owe nimayila ye di suoto?
      sbs: 0.6843
      gen_sec: 6.68
      ref_sec: 6.74
      cer: 0.0345
      wer: 0.2308
    bible_00141:
      source: bible
      text: Nkpo oso ayee bisiɛ bitoonyu osuku, diekye ami, Otii Obi nwu, mawa di obe wɔ minoonyu osuku
        bitɛɛ nii.”
      sbs: 0.7169
      gen_sec: 9.32
      ref_sec: 8.66
      cer: 0.0125
      wer: 0.0526
    bible_00142:
      source: bible
      text: Nse biemufũ nwu bieklee osie kanya, bibawɛ didiki. Se diele nkpo, ni ofũ onu lee nwu lɛbla
        kasakasa.
      sbs: 0.6957
      gen_sec: 9.12
      ref_sec: 7.8
      cer: 0.0127
      wer: 0.0556
    bible_00143:
      source: bible
      text: Nse batii bawo kɔnya wo fɛ afĩi buobuo yi, Yaa wɔ mumbɔmbɔ ni oso dite wo nkpo. Kafɔɔ nse
        buloobuo afĩi yi, ni aye lɛlɛ oso dite nkpo.
      sbs: 0.7281
      gen_sec: 11.88
      ref_sec: 12.46
      cer: 0.068
      wer: 0.2143
    bible_00144:
      source: bible
      text: Otii wɔ baayɔɔsa ni ofiɛ ntoofũ alenke alɛɛ afosi ana.
      sbs: 0.698
      gen_sec: 5.05
      ref_sec: 4.02
      cer: 0.0682
      wer: 0.1
    bible_00145:
      source: bible
      text: Diekye kayi ka mmle ninumbe nle dibuusaa di Yaa anu. Nioso di Kɔkpana Klekle Kukũ lebuɛ alɛ,
        “Banumbentɛ bamu disibu di Yaa n-yɔ andiki ma di okũ.”
      sbs: 0.6767
      gen_sec: 13.09
      ref_sec: 11.0
      cer: 0.0348
      wer: 0.2963
    bible_00146:
      source: bible
      text: Nkpo oso obe wɔ di Yosef lasɛnkɛ nii, aayɔ Maria aabla ɔsɔfɔ nɔɔ fɛ mmle di Yaa tɔkyɛntɛ nwu
        nkpo latɔkɔ nwɔ nii.
      sbs: 0.7263
      gen_sec: 10.2
      ref_sec: 11.82
      cer: 0.0
      wer: 0.1304
    bible_00147:
      source: bible
      text: Nkpo oso nunua yi, bitɔɔkyɛ akpaka biɛlaalɛɛ batii lele biɛnya bilɛ bawa ɔsanko ɔyɔ dii kalekɔ
        nwu.’
      sbs: 0.7367
      gen_sec: 9.24
      ref_sec: 9.82
      cer: 0.0247
      wer: 0.1176
    bible_00148:
      source: bible
      text: Ni aayɔ disi nwu nkpo aakpee di bɛɛsi bɛnkɛɛ kamɛ aawako ɔsankobi nwu nkpo nɛ. Ni di ɔsankobi
        nwu nkpo kafɔɔ layɔ disi nwu aakyɛnko ɔya nɛ.
      sbs: 0.7184
      gen_sec: 12.31
      ref_sec: 12.1
      cer: 0.045
      wer: 0.4074
    bible_00149:
      source: bible
      text: Nse leyo nwu nkpo batii letuna beefũ ye, ni biɛta atoko ɔkyɛ ole lee lɛsɛɛsa dite ninfa. Kafɔɔ
        nse baatuna bafũ ye, ni biɛta atoko ɔkyɛ ole lee nwu nkpo lɛsɛɛsa dikple diwa ɔkyɛ lee.
      sbs: 0.7217
      gen_sec: 16.36
      ref_sec: 14.7
      cer: 0.0
      wer: 0.0
    bible_00150:
      source: bible
      text: Ni kɔɔfɛɛfɔ nwu labalɛ oklo nwu nɛ. Ditaba wo buamunikĩisa oklo nwu buakyɔɔ kɔfɛɛfɔ nwu anu.
        Nioso buata kɔfɛɛfɔ nwu osuku kuatuka wo kuatɔɔkyɛnko.
      sbs: 0.7106
      gen_sec: 13.64
      ref_sec: 12.5
      cer: 0.0165
      wer: 0.125
    bible_00151:
      source: bible
      text: Ɛhɛɛ, ntoonyuma nlɛ lakpeesa Stefana leyo batii kafɔɔ Yaa ntu. Mma nkpo kamaa, noosinyuma
        nlɛ lakple lakpeesa batii bamba Yaa ntu.
      sbs: 0.7125
      gen_sec: 12.04
      ref_sec: 12.64
      cer: 0.0
      wer: 0.1905
    bible_00152:
      source: bible
      text: Mimbuɛ kafɔɔ bilɛ, ‘Nse minsiɛ nkpa di bawa lee obe kamɛ yi, nse biɛbla onwii ku mma bilo
        Yaa ɔlaa babuɛtɛtɛ nwu nkpo.’
      sbs: 0.7246
      gen_sec: 10.51
      ref_sec: 10.42
      cer: 0.0326
      wer: 0.1304
    bible_00153:
      source: bible
      text: Kafɔɔ baakakatɛ baata ni ninwuna kpile ninwii, ninwuna kpile nwu labuɛ alɛ, “N-ye Yesu, n-ye
        kafɔɔ Paulo. Aye mɔ, bawe bile?”
      sbs: 0.7314
      gen_sec: 11.19
      ref_sec: 10.52
      cer: 0.0
      wer: 0.0
    bible_00154:
      source: bible
      text: Aye bitɔkɔ mi, be biakyɛ bialaanya? Yaa ɔlaa buɛtɛtɛ? Nwaako katɔkɔ ye nii, otii wɔ biakyɛ
        bialaanya ni nlenke bia Yaa ɔlaa buɛtɛtɛ.
      sbs: 0.7412
      gen_sec: 12.04
      ref_sec: 11.82
      cer: 0.0286
      wer: 0.1304
    bible_00155:
      source: bible
      text: Ninfɛ baakyako obuɛ kaamɛ lɛma alɛ, “Mmle munan-yɔ bloblo kuonwii bukle ni oso obuɛ ɔlaa wɔ
        mmle?”
      sbs: 0.6903
      gen_sec: 8.96
      ref_sec: 8.32
      cer: 0.026
      wer: 0.2941
    bible_00156:
      source: bible
      text: abawɛ sifutulɛ kafɔɔ anta mba lɛɛkyakaako lefĩ nii.
      sbs: 0.6868
      gen_sec: 4.8
      ref_sec: 5.52
      cer: 0.0233
      wer: 0.375
    bible_00157:
      source: bible
      text: Nse otii owo diɛyɔ nwu ole di ɔlaa wɔ mmle suoto, ayee bitankyɔɔ nwɔ ɔlaa atoko.
      sbs: 0.6899
      gen_sec: 7.28
      ref_sec: 7.24
      cer: 0.0317
      wer: 0.25
    bible_00158:
      source: bible
