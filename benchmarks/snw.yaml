      source: bible
      text: Nioso aakpee bakyakaakotɛ nɔɔ banyɔ, Timoteo ku Erasto, ni baale nwɔ katũ baasifi Makedonia
        nɛ. Ni aakple aasiɛ di Asia ninfa obe kɛkɛɛ aakyakaa nɛ.
      sbs: 0.6433
      gen_sec: 6.88
      ref_sec: 13.64
      cer: 0.7
      wer: 0.84
    bible_00112:
      source: bible
      text: Paulo lasiɛ ninfa obe kɛɛkɛ, ni aasifi aalaafe di Galatia ku Frigia nsɔ suoto nɛ. Ni aatookpee
        bafũbanutɛ ba niawɛ ni ninfa bamuu osie nɛ.
      sbs: 0.6249
      gen_sec: 14.28
      ref_sec: 11.28
      cer: 0.2162
      wer: 0.8
    bible_00113:
      source: bible
      text: Nwaako kɔtɔkɔ ye nlɛ Yaa matuna ma wla. Kafɔɔ nse Otii Obi nwu lɛwa, abanya batii ba niefũ
        beenu ni kaasɔ ka mmle?”
      sbs: 0.6318
      gen_sec: 11.28
      ref_sec: 10.98
      cer: 0.2135
      wer: 0.8261
    bible_00114:
      source: bible
      text: Kafɔɔ bita bukpee ma kufiofa alɛ blasinkakatɛ bata otii kuonwii di Yesu leyooto kamɛ mmle
        okle di ɔlaa wɔ mmle dilaasinkpɛ ni.”
      sbs: 0.6114
      gen_sec: 13.44
      ref_sec: 9.56
      cer: 0.1923
      wer: 0.7727
    bible_00115:
      source: bible
      text: Kafɔɔ kuonwii ditabuɛ alɛ nnwɔɔ niɛkpanko nwɔ. Ninfɛ di Petro lakaalɛ nwɔ alɛ, “Saate, nyu
        mmle okle baatii nwu lɛmana fɔ kpinkpĩ beekyi ni!”
      sbs: 0.5744
      gen_sec: 14.2
      ref_sec: 10.22
      cer: 0.3482
      wer: 0.9583
    bible_00116:
      source: bible
      text: Obe wɔ kafɔɔ aalaabuo ni Kaesarea, aakyɛ Yerusalem, ni aalaasɛɛsa bafũbanutɛ ba ninkpe ni
        ninfa nɛ. Ni aafe aasifi Antiokia nɛ.
      sbs: 0.6062
      gen_sec: 12.12
      ref_sec: 10.3
      cer: 0.2621
      wer: 0.7619
    bible_00117:
      source: bible
      text: Obe wɔ di Yesu layefe osuku oofe nii, batii kpinwu latikanko nwɔ baamana nwɔ kpinkpĩ baakyi.
      sbs: 0.5957
      gen_sec: 8.72
      ref_sec: 6.18
      cer: 0.2267
      wer: 0.6875
    bible_00118:
      source: bible
      text: Yuda kafɔɔ ku ɔsɔfɔ nɔɔ Tamai lalofo Peres ku Sera, ni di Sera kafɔɔ lalofo Hesron nɛ. Hesron
        kafɔɔ lalofo Aram.
      sbs: 0.6219
      gen_sec: 10.16
      ref_sec: 13.12
      cer: 0.1685
      wer: 0.8095
    bible_00119:
      source: bible
      text: Yaa komiɛ alɛ biabla suoto klekle, mindie di lɛsɔnɔkpee okpile kamɛ kenke.
      sbs: 0.6331
      gen_sec: 8.68
      ref_sec: 6.5
      cer: 0.1311
      wer: 0.5
    bible_00120:
      source: bible
      text: Obe wɔ di Herode lakpi ni yi, Yaa tɔkyɛntɛ onwii ladiki suoto aatuo Yosef kɔɔlaafɔ kamɛ di
        Egipte.
      sbs: 0.602
      gen_sec: 8.6
      ref_sec: 9.34
      cer: 0.1772
      wer: 0.8889
    bible_00121:
      source: bible
      text: Yaa wɔ kafɔɔ ninye ni batii otu kamɛ, ladiki aatuo alɛ aafũ ma, aata ma kafɔɔ Ninwuna nɔɔ
        fɛ mmle okle aayɔ aata ni awo kafɔɔ.
      sbs: 0.6234
      gen_sec: 15.76
      ref_sec: 12.98
      cer: 0.2551
      wer: 0.7308
    bible_00122:
      source: bible
      text: Baabuo Kaesarea kaleesɛ. Di obe nwu kamɛ Kornelio ntoosiisa leyo nɔɔ batii basi basoko Petro
        ɔwabee.
      sbs: 0.627
      gen_sec: 10.16
      ref_sec: 9.32
      cer: 0.1807
      wer: 0.75
    bible_00123:
      source: bible
      text: Diekye bakpisɔfɔ bawo ntookple nkpaamaa batikanko Abonsam.
      sbs: 0.6166
      gen_sec: 6.4
      ref_sec: 4.8
      cer: 0.2157
      wer: 1.0
    bible_00124:
      source: bible
      text: Batii kpinwu lakye Yudea kasɔ ku Yerusalem okpoo kplɛ baakyɛ ɔfaafuu baalaanu Yohane ɔlaa.
        Baadiki sikpile lɛma baabuɛ ni aakpeesa ma Yaa ntu di Yordan okle kamɛ nɛ.
      sbs: 0.5688
      gen_sec: 16.0
      ref_sec: 11.92
      cer: 0.1618
      wer: 0.8214
    bible_00125:
      source: bible
      text: Ninfɛ di Yesu lakaalɛ ma alɛ, “Bienyu bilɛ mmle okle beelo ni Galilea batii ba mmle oso, mma
        ninle bakpileblatɛ balenke Galilea batii bamuu bule?
      sbs: 0.6432
      gen_sec: 14.08
      ref_sec: 10.96
      cer: 0.1282
      wer: 0.68
    bible_00126:
      source: bible
      text: Kafɔɔ ntɔɔpɛ ɔlaa lɛta Yaa diisi lɛfɔ Simon, alɛ ofũ onu lɛfɔ dilaayu. Alɛ nse fɛɛpɛ feekple
        fɛɛwa ɔkyɛ nii, faakpee babilee suɔtɔbi osie.”
      sbs: 0.6225
      gen_sec: 11.2
      ref_sec: 12.5
      cer: 0.3784
      wer: 0.9167
    bible_00127:
      source: bible
      text: Akpaa nwɔ awako leyo. Abalɛɛ basiɛwo nɔɔ ku leyo nɔɔ batii ansiisa antɔkɔ ma alɛ, ‘Suoto kɔtɛ
        sinyɔɔ mi osie kanya, diekye ntɔɔnya foso nii nwu niayu nii. Biwa biɛbanyakoe suoto lɛyɔɔ!’
      sbs: 0.6327
      gen_sec: 16.04
      ref_sec: 14.5
      cer: 0.1973
      wer: 0.8125
    bible_00128:
      source: bible
      text: Ninfɛ di basaateketetɛ nɔɔ nwu lakyako bawo ɔkaalɛ alɛ, owe mɔ kaamɛ lɛma nimabla lɛsaa le
        mmle okle.
      sbs: 0.5982
      gen_sec: 11.04
      ref_sec: 6.86
      cer: 0.3293
      wer: 1.0
    bible_00129:
      source: bible
      text: Ayi awo sɛmaa, Yuda batii lalɛɛ bawo baabla disibu alɛ babalo Saulo.
      sbs: 0.6606
      gen_sec: 7.12
      ref_sec: 5.1
      cer: 0.2
      wer: 0.8333
    bible_00130:
      source: bible
      text: Ee bitanka di kasɔ, diekye Yaa nkpaa kasekɔ kale. Bitanka kafɔɔ di Yerusalem, diekye nwu ninle
        baka Ɔka nwu okpoo kplɛ nɛ.
      sbs: 0.6446
      gen_sec: 9.04
      ref_sec: 9.98
      cer: 0.2165
      wer: 0.7727
    bible_00131:
      source: bible
      text: Nioso obe lele manyumasa ye sɛlaa se mmle, kuntɛ nfɛ biye sĩ kofokofoko bikle kafɔɔ nwaako
        ɔlaa nwu nkpo biefũ ni osie kanya.
      sbs: 0.6011
      gen_sec: 10.24
      ref_sec: 12.3
      cer: 0.2475
      wer: 0.8696
    bible_00132:
      source: bible
      text: Yesu layila ni aalɛɛ ma aawako ɔkyɛ nɔɔ, ni aakaalɛ ma alɛ, “Be biomiɛ bilɛ mbla nta ye?”
      sbs: 0.6022
      gen_sec: 10.12
      ref_sec: 7.58
      cer: 0.2388
      wer: 0.7222
    bible_00133:
      source: bible
      text: Kafɔɔ biye bilɛ ninkookaa ye lɛsaa lee nimakyakaako ye nii, nle n-ye ni di Yaa suoto, di Yaa
        ɔlaa obuɛ ku otuo kamɛ, lɛɛkpaka ku ayo le kamɛ.
      sbs: 0.5911
      gen_sec: 13.2
      ref_sec: 14.72
      cer: 0.2569
      wer: 0.8214
    bible_00134:
      source: bible
      text: “Nse dibawɛ osie fiɛ baatii biene kamawɛ didiki mɔ,
      sbs: 0.6214
      gen_sec: 6.36
      ref_sec: 4.44
      cer: 0.1707
      wer: 0.7778
    bible_00135:
      source: bible
      text: Nunua be feekple fasoko? Taka, faafũ ntu okpeesa amanle nwu. Faalɛɛ nwɔ, aafotofɔ sikpile
        adiki di suoto.’
      sbs: 0.6047
      gen_sec: 11.16
      ref_sec: 9.68
      cer: 0.1786
      wer: 0.7647
    bible_00136:
      source: bible
      text: Afiofa ya mmle anyɔ suoto di Mose kufiofa ku Yaa ɔlaa babuɛtɛtɛ asaa otuo nkyɛ nɛ.”
      sbs: 0.6005
      gen_sec: 8.76
      ref_sec: 6.6
      cer: 0.1364
      wer: 0.625
    bible_00137:
      source: bible
      text: Kananfi labawɛ osie, ta nkpo oso bakpɛtɛ banɔɔfo ɔnɔɔfo nwu layɛkɛ alɛ babananfi Paulo mambɛbɛɛ.
        Nioso aatɔkɔ bakpɛtɛ nɔɔ alɛ bakyɛ baalaakpaa nwɔ baatii nwu kamɛ basifiko leyo katenkɔ.
      sbs: 0.5884
      gen_sec: 21.8
      ref_sec: 14.66
      cer: 0.2922
      wer: 0.8621
    bible_00138:
      source: bible
      text: Usia lalofo Yotam, ni di Yotam lalofo Ahas nɛ, ni di Ahas kafɔɔ kolofo Hiskia nɛ.
      sbs: 0.6325
      gen_sec: 9.12
      ref_sec: 10.52
      cer: 0.2222
      wer: 0.6875
    bible_00139:
      source: bible
      text: “Bibu ɔlaa wɔ mmle disi binyu. Osuɔtɔ onwii lawɛ babi suɔtɔbi banyɔ banwii. Ni aakyɛ aalaatɔkɔ
        ɔnɔɔfo le alɛ, ‘Obi, kyɛ falaabla ɔkpɛ koofe nii miɛ.’
      sbs: 0.6614
      gen_sec: 15.52
      ref_sec: 12.3
      cer: 0.2328
      wer: 0.8462
    bible_00140:
      source: bible
      text: Nse biekpee okyiini di lɛsaa biene ɔbla suoto, owe nimayila ye di suoto?
      sbs: 0.6332
      gen_sec: 6.32
      ref_sec: 6.74
      cer: 0.3793
      wer: 0.8462
    bible_00141:
      source: bible
      text: Nkpo oso ayee bisiɛ bitoonyu osuku, diekye ami, Otii Obi nwu, mawa di obe wɔ minoonyu osuku
        bitɛɛ nii.”
      sbs: 0.6406
      gen_sec: 10.76
      ref_sec: 8.66
      cer: 0.35
      wer: 1.0
    bible_00142:
      source: bible
      text: Nse biemufũ nwu bieklee osie kanya, bibawɛ didiki. Se diele nkpo, ni ofũ onu lee nwu lɛbla
        kasakasa.
      sbs: 0.5849
      gen_sec: 10.0
      ref_sec: 7.8
      cer: 0.2152
      wer: 0.8889
    bible_00143:
      source: bible
      text: Nse batii bawo kɔnya wo fɛ afĩi buobuo yi, Yaa wɔ mumbɔmbɔ ni oso dite wo nkpo. Kafɔɔ nse
        buloobuo afĩi yi, ni aye lɛlɛ oso dite nkpo.
      sbs: 0.6006
      gen_sec: 12.16
      ref_sec: 12.46
      cer: 0.2524
      wer: 0.6786
    bible_00144:
      source: bible
      text: Otii wɔ baayɔɔsa ni ofiɛ ntoofũ alenke alɛɛ afosi ana.
      sbs: 0.5858
      gen_sec: 9.12
      ref_sec: 4.02
      cer: 0.2273
      wer: 0.8
    bible_00145:
      source: bible
      text: Diekye kayi ka mmle ninumbe nle dibuusaa di Yaa anu. Nioso di Kɔkpana Klekle Kukũ lebuɛ alɛ,
        “Banumbentɛ bamu disibu di Yaa n-yɔ andiki ma di okũ.”
      sbs: 0.5964
      gen_sec: 14.44
      ref_sec: 11.0
      cer: 0.2957
      wer: 0.963
    bible_00146:
      source: bible
      text: Nkpo oso obe wɔ di Yosef lasɛnkɛ nii, aayɔ Maria aabla ɔsɔfɔ nɔɔ fɛ mmle di Yaa tɔkyɛntɛ nwu
        nkpo latɔkɔ nwɔ nii.
      sbs: 0.6134
      gen_sec: 11.56
      ref_sec: 11.82
      cer: 0.2921
      wer: 0.8696
    bible_00147:
      source: bible
      text: Nkpo oso nunua yi, bitɔɔkyɛ akpaka biɛlaalɛɛ batii lele biɛnya bilɛ bawa ɔsanko ɔyɔ dii kalekɔ
        nwu.’
      sbs: 0.7242
      gen_sec: 15.0
      ref_sec: 9.82
      cer: 0.2963
      wer: 0.8824
    bible_00148:
      source: bible
      text: Ni aayɔ disi nwu nkpo aakpee di bɛɛsi bɛnkɛɛ kamɛ aawako ɔsankobi nwu nkpo nɛ. Ni di ɔsankobi
        nwu nkpo kafɔɔ layɔ disi nwu aakyɛnko ɔya nɛ.
      sbs: 0.5963
      gen_sec: 13.88
      ref_sec: 12.1
      cer: 0.2162
      wer: 0.7037
    bible_00149:
      source: bible
      text: Nse leyo nwu nkpo batii letuna beefũ ye, ni biɛta atoko ɔkyɛ ole lee lɛsɛɛsa dite ninfa. Kafɔɔ
        nse baatuna bafũ ye, ni biɛta atoko ɔkyɛ ole lee nwu nkpo lɛsɛɛsa dikple diwa ɔkyɛ lee.
      sbs: 0.6307
      gen_sec: 15.16
      ref_sec: 14.7
      cer: 0.4167
      wer: 0.9714
    bible_00150:
      source: bible
      text: Ni kɔɔfɛɛfɔ nwu labalɛ oklo nwu nɛ. Ditaba wo buamunikĩisa oklo nwu buakyɔɔ kɔfɛɛfɔ nwu anu.
        Nioso buata kɔfɛɛfɔ nwu osuku kuatuka wo kuatɔɔkyɛnko.
      sbs: 0.596
      gen_sec: 12.56
      ref_sec: 12.5
      cer: 0.3058
      wer: 0.9167
    bible_00151:
      source: bible
      text: Ɛhɛɛ, ntoonyuma nlɛ lakpeesa Stefana leyo batii kafɔɔ Yaa ntu. Mma nkpo kamaa, noosinyuma
        nlɛ lakple lakpeesa batii bamba Yaa ntu.
      sbs: 0.6078
      gen_sec: 12.84
      ref_sec: 12.64
      cer: 0.2075
      wer: 0.9048
    bible_00152:
      source: bible
      text: Mimbuɛ kafɔɔ bilɛ, ‘Nse minsiɛ nkpa di bawa lee obe kamɛ yi, nse biɛbla onwii ku mma bilo
        Yaa ɔlaa babuɛtɛtɛ nwu nkpo.’
      sbs: 0.6601
      gen_sec: 10.92
      ref_sec: 10.42
      cer: 0.337
      wer: 0.9565
    bible_00153:
      source: bible
      text: Kafɔɔ baakakatɛ baata ni ninwuna kpile ninwii, ninwuna kpile nwu labuɛ alɛ, “N-ye Yesu, n-ye
        kafɔɔ Paulo. Aye mɔ, bawe bile?”
      sbs: 0.6368
      gen_sec: 13.52
      ref_sec: 10.52
      cer: 0.2105
      wer: 0.7619
    bible_00154:
      source: bible
      text: Aye bitɔkɔ mi, be biakyɛ bialaanya? Yaa ɔlaa buɛtɛtɛ? Nwaako katɔkɔ ye nii, otii wɔ biakyɛ
        bialaanya ni nlenke bia Yaa ɔlaa buɛtɛtɛ.
      sbs: 0.6702
      gen_sec: 13.72
      ref_sec: 11.82
      cer: 0.2381
      wer: 0.7826
    bible_00155:
      source: bible
      text: Ninfɛ baakyako obuɛ kaamɛ lɛma alɛ, “Mmle munan-yɔ bloblo kuonwii bukle ni oso obuɛ ɔlaa wɔ
        mmle?”
      sbs: 0.5891
      gen_sec: 10.72
      ref_sec: 8.32
      cer: 0.2338
      wer: 0.8235
    bible_00156:
      source: bible
      text: abawɛ sifutulɛ kafɔɔ anta mba lɛɛkyakaako lefĩ nii.
      sbs: 0.6035
      gen_sec: 4.68
      ref_sec: 5.52
      cer: 0.1628
      wer: 0.875
    bible_00157:
      source: bible
      text: Nse otii owo diɛyɔ nwu ole di ɔlaa wɔ mmle suoto, ayee bitankyɔɔ nwɔ ɔlaa atoko.
      sbs: 0.5779
      gen_sec: 8.44
      ref_sec: 7.24
      cer: 0.3175
      wer: 0.875
    bible_00158:
      source: bible
      text: Obe wɔ baalaabuo ni Yerusalem, bafũbanutɛ ku batɔkyɛntɛ ku banɔɔfo lɛma lafũ ma nwaa. Ninfɛ
        di Paulo ku Barnaba latɔkɔ ma asaa ya amuu di Yaa labla aafenko ni di suoto lɛma nɛ.
      sbs: 0.5816
      gen_sec: 19.08
      ref_sec: 12.02
      cer: 0.1418
      wer: 0.6061
    bible_00159:
      source: bible
      text: Yaa wɔ ninle ni Saate Yesu Teete, nwɔ buɔtansa ni diesifi ni dinnaa ni kaloo, aye alɛ sɛlaa
        se kobuɛ nii, site nkpo.
      sbs: 0.576
      gen_sec: 10.64
      ref_sec: 10.52
      cer: 0.1667
      wer: 0.5652
    bible_00160:
      source: bible
      text: Ɔlanle faale fiɛ di Yaa lalɛɛfɔ? Diɛbla lɛsalɛsaa. Kafɔɔ nse osuku nkpe fɔ alɛ faadie di sɛlanle
        nwu kamɛ, ni faablako nwu ɔkpɛ.
      sbs: 0.6131
      gen_sec: 12.48
      ref_sec: 11.42
      cer: 0.2451
      wer: 0.8696
    bible_00161:
      source: bible
      text: Nse buoole Yaa afiofa, ni buofũ buonu bulɛ buye nwɔ.
      sbs: 0.6206
      gen_sec: 7.04
      ref_sec: 5.6
      cer: 0.2927
      wer: 0.9
    bible_00162:
      source: bible
      text: Ninfɛ di Yesu lalɛɛ obisɔ biibii onwii aabayila ma di anu nɛ.
      sbs: 0.5849
      gen_sec: 7.76
      ref_sec: 5.14
      cer: 0.1633
      wer: 0.4167
    bible_00163:
      source: bible
      text: Nse ɛɛbla fɔ okpile sikuɛnsĩ, di dii ninwii kamɛ, eekple ɛɛwafɔ ɔkyɛ di sikuɛnsĩ nwu nkpo
        kamɛ, ɛɛbatikiti fɔ lekoto, faayɔ fakyɛ nwɔ.”
      sbs: 0.6539
      gen_sec: 12.04
      ref_sec: 11.2
      cer: 0.3178
      wer: 0.8261
    bible_00164:
      source: bible
      text: Kafɔɔ nwaako ɔlaa kule alɛ Yaa lasɛnkɛsa Kristo aakyeko bakpi kamɛ. Nle mmle ninle lɛtaafuɔ
        le ninkotuo alɛ batii ba niekpi bate nii, babasɛnkɛsa ma.
      sbs: 0.5989
      gen_sec: 13.16
      ref_sec: 14.16
      cer: 0.1885
      wer: 0.88
    bible_00165:
      source: bible
      text: Di basa ku basɔfɔ suoto yi, kokpee ma Saate kufiofa ninanle ami omu kufiofa kule ni. Dinaa
        alɛ ɔsanko lesĩ ɔsa.
      sbs: 0.5724
      gen_sec: 3.4
      ref_sec: 9.76
      cer: 0.8182
      wer: 1.0
    bible_00166:
      source: bible
      text: Diele Beelsebul osie kule. Kafɔɔ Yaa Ninwuna niɛtɛɛ osie kotososa anwuna kpile ndiki baatii
        kamɛ. Nle mmle kotuo alɛ Yaa sɛka kalekɔ ntɔɔwa ye kamɛ kofokofoko.
      sbs: 0.6374
      gen_sec: 16.88
      ref_sec: 13.2
      cer: 0.1756
      wer: 0.7692
    bible_00167:
      source: bible
      text: Nunua, bawe ninle wo osuku onyu, suoto lɛyɔɔ ku lɛkakoto le suoto bubakanta ni se Saate loo
        Yesu lɛwa? Mma ninle aye nɛ.
      sbs: 0.625
      gen_sec: 11.28
      ref_sec: 11.52
      cer: 0.1277
      wer: 0.5652
    bible_00168:
      source: bible
      text: Kafɔɔ obe wɔ baakyɛ nii, batanya ma! Nioso baakple babatɔkɔ ma alɛ,
      sbs: 0.619
      gen_sec: 7.48
      ref_sec: 4.9
      cer: 0.2642
      wer: 1.0
    bible_00169:
      source: bible
      text: Kafɔɔ Farisi batii labuɛ alɛ, “Anwuna kpile ɔka niɛtɔɔ osie nwu akle ootososa anwuna kpile
        andiki.”
      sbs: 0.5686
      gen_sec: 7.08
      ref_sec: 7.88
      cer: 0.4
      wer: 0.9375
    bible_00170:
      source: bible
      text: Di obe nwu nkpo kamɛ kafɔɔ, Petro lakple aayila aatɔɔpɛ ɔpɛ kokloo kɔnɛɛ. Ni baalaasɛkɛtɛ
        nii nnwɔɔ diale, diabla ma ɔkpɛ osie kanya.
      sbs: 0.6327
      gen_sec: 13.0
      ref_sec: 10.3
      cer: 0.2991
      wer: 0.7826
    bible_00171:
      source: bible
      text: Bilolaa binyu, biɛta anu lee ate kesekese, ta bieye dii le diɛ obe nwu mawo nii.
      sbs: 0.6137
      gen_sec: 9.72
      ref_sec: 6.96
      cer: 0.2903
      wer: 1.0
    bible_00172:
      source: bible
      text: Ni aadiɛ ma aakyɛ sitũ kɛɛkɛ, ni aapɛ akunkyi aapɛ ɔlaa aata Yaa nɛ.
      sbs: 0.6129
      gen_sec: 6.04
      ref_sec: 5.42
      cer: 0.3774
      wer: 1.0
    bible_00173:
      source: bible
      text: Komiɛ nlɛ kamɛ kakpa ye klekle nlɛ, di lɛkanko di nwu suoto yi, otii biala ɔlaakuu lele atooyibuɛ
        yi, abata nwu nkuntaa.
      sbs: 0.6369
      gen_sec: 10.48
      ref_sec: 12.04
      cer: 0.2105
      wer: 0.7727
    bible_00174:
      source: bible
      text: Kuntɛ bukpe osuku fɛle Kristo batɔkyɛntɛ alɛ abiesaa loo katika ye di suoto yi,
      sbs: 0.6037
      gen_sec: 7.68
      ref_sec: 6.44
      cer: 0.1538
      wer: 0.6429
    bible_00175:
      source: bible
      text: Nle mmle sɛmaa, Saate nwu ladiki basuɔtɔ afosi akuɛnsĩ basuɔtɔ banyɔ bamba, aakpee ma banyɔ
        banyɔ alɛ bakyɛ sekpoo ku nkpayotũ be kamɛ ɔɔwa ni ɔbakyɛ.
      sbs: 0.6006
      gen_sec: 13.36
      ref_sec: 10.58
      cer: 0.2541
      wer: 0.8462
    bible_00176:
      source: bible
      text: ‘Bilolaa osuku bitɛ bita Saate nwu ɔwabee.
      sbs: 0.6235
      gen_sec: 4.32
      ref_sec: 4.68
      cer: 0.1765
      wer: 0.7143
    bible_00177:
      source: bible
      text: “Lɛ diɛbla fɔɔnya diku biibii le ninsi ni di owo lɛfɔ ninu, kafɔɔ fɔlɔɔnya kawosoku ka ninsi
        fɔ ni leele kamɛ?
      sbs: 0.6057
      gen_sec: 10.44
      ref_sec: 7.84
      cer: 0.1954
      wer: 0.8571
    bible_00178:
      source: bible
      text: Ni di ɔnɔɔfo wɔ mmle lakyɛ bakpɛtɛ banɔɔfo ɔnɔɔfo nwu nfũ alaakaalɛ nwɔ alɛ, “Be falɛ fɔɔblaa?
        Osuɔtɔ wɔ mmle Roma otii ale lo!”
      sbs: 0.619
      gen_sec: 11.8
      ref_sec: 10.48
      cer: 0.38
      wer: 0.9583
    bible_00179:
      source: bible
      text: “Basiɛwo, kɔtɔkɔ ye nlɛ, bitanyɛkɛ batii ba ninlo ni suoto sina, ninni kamaa, lɛsalɛsaa nsinnaa
        ma babakple manfuo ni ɔbla.
      sbs: 0.6221
      gen_sec: 11.88
      ref_sec: 10.22
      cer: 0.2245
      wer: 0.9
    bible_00180:
      source: bible
      text: Otii wɔ ninkakatɛ ni di sele ate ate kamɛ yi, apɛ ɔlaa ata Yaa alɛ aatɔɔ lɛtasaa alɛ aayɔ
        antoodiki sɛlaa se ambuɛ ni kasɔ.
      sbs: 0.5833
      gen_sec: 12.52
      ref_sec: 10.56
      cer: 0.2577
      wer: 0.96
    bible_00181:
      source: bible
      text: Nunua Kristo ntoosifi osi asi di Yaa oletanɛɛkyɛ, oole sɛka di Yaa batɔkyɛntɛ ku situmi se
        ninkpe ni di osi ku basiɛntɛ suoto.
      sbs: 0.6231
      gen_sec: 11.92
      ref_sec: 14.88
      cer: 0.2255
      wer: 0.913
    bible_00182:
      source: bible
      text: Ni baakaalɛ nwɔ alɛ ase ɔka ata ma. Ni di Yaa lata ma Kis obi Saul wɔ niakye ni Benyamin kɔna
        kamɛ, aale sɛka alɛɛ afosi ana nɛ.
      sbs: 0.6007
      gen_sec: 12.56
      ref_sec: 13.52
      cer: 0.1837
      wer: 0.6786
    bible_00183:
      source: bible
      text: Nle mmle oso nnɛɛ diloofee wo kuntɛ suoto loo se mmle sina kɔwɔɔ kɛɛkɛkɛɛkɛ, kafɔɔ buye bulɛ
        ninwuna loo kamɛ nkpa osiɛ kɔbla lɛfɔle obe lele.
      sbs: 0.5998
      gen_sec: 15.92
      ref_sec: 12.4
      cer: 0.3217
      wer: 1.0
    bible_00184:
      source: bible
      text: Di afa nɔɔ ɔbla labla ma ni ɔkpɛ di obe kpinwu kamɛ oso, mankyɔɔ nwɔ ɔlaa atoko.
      sbs: 0.6175
      gen_sec: 8.32
      ref_sec: 6.0
      cer: 0.2258
      wer: 0.7647
    bible_00185:
      source: bible
      text: Kafɔɔ buɔyɔ nwu bublako ɔkpɛ. Buayɔ lɛsaa biala buatika di suoto buɛɛ, mmle okle di Kristo
        ɔlaa biene nwu kakyɛ ni sitũ, kundu ni kakɔ biala.
      sbs: 0.6044
      gen_sec: 12.68
      ref_sec: 13.02
      cer: 0.2589
      wer: 0.8077
    bible_00186:
      source: bible
      text: Ni di Yesu lakaalɛ ma alɛ, “Bloblo akudi asɛ bikle?”
      sbs: 0.6047
      gen_sec: 5.0
      ref_sec: 4.06
      cer: 0.1282
      wer: 0.6
    bible_00187:
      source: bible
      text: Obe wɔ baalɛɛ mi ni lɛka kasale alɛ ndiki ni suoto kanya, kuonwii lɛma ditayila mi kamaa,
        bamuu lɛma baasĩ mi. Yaa atannanfi ma kootoko, ayɔ akyɛ ma.
      sbs: 0.5931
      gen_sec: 11.96
      ref_sec: 12.7
      cer: 0.2308
      wer: 0.8929
    bible_00188:
      source: bible
      text: Nioso bita buyɔ katansa ku dibu buta Yaa kafa ɔka wɔ ninnaa ni kaloo, mananya ni, leete nɔɔ
        ninle ni ɔka. Diwa kaanya.
      sbs: 0.6048
      gen_sec: 10.48
      ref_sec: 10.52
      cer: 0.163
      wer: 0.7391
    bible_00189:
      source: bible
      text: Afɔ yi, obi nii, kpee osie di onwii loo ɔbla kamɛ ku Yesu Kristo sibualɛ se ɛɛta wo ni kamɛ.
      sbs: 0.6371
      gen_sec: 11.72
      ref_sec: 7.92
      cer: 0.1429
      wer: 0.8
    bible_00190:
      source: bible
      text: Diefe ni di ɔlaa biene loo obuɛ kamɛ, ni di Yaa lalɛɛ ye alɛ biawa mimawɛ kalekɔ di Saate
        Yesu Kristo leyooto kamɛ nɛ.
      sbs: 0.5916
      gen_sec: 11.44
      ref_sec: 12.1
      cer: 0.1613
      wer: 0.875
    bible_00191:
      source: bible
      text: Kainan ote niale Enos, Enos ote niale Set,
      sbs: 0.6203
      gen_sec: 4.68
      ref_sec: 3.36
      cer: 0.0303
      wer: 0.625
    bible_00192:
      source: bible
      text: Nni kamaa, Abonsam lakpaa Yesu aasifiko Yerusalem aalaatika nwɔ di Yuda batii Yaa Olekatakɔ
        lɛkya kapiɔ̃piɔ̃kɔ, ni aatɔkɔ nwɔ alɛ, “Nse Yaa obi fale, faayefe fakye ninfũ fasifi kasɔ.
      sbs: 0.5694
      gen_sec: 17.4
      ref_sec: 13.16
      cer: 0.2123
      wer: 0.8621
    bible_00193:
      source: bible
      text: Di Festo lababuo ni sɛka kalekɔ nɔɔ di ayi atiɛ sɛmaa, aadie di Keasarea aakyɛ Yerusalem.
      sbs: 0.6075
      gen_sec: 8.84
      ref_sec: 8.16
      cer: 0.1667
      wer: 0.625
    bible_00194:
      source: bible
      text: Di obe nwu kamɛ yi, Herode wɔ niatoole ni sɛka di Galilea kasɔ suoto lanu Yesu leyooto.
      sbs: 0.6131
      gen_sec: 8.28
      ref_sec: 7.3
      cer: 0.2609
      wer: 0.6471
    bible_00195:
      source: bible
      text: Kafɔɔ kofe nwu nkpo banyuntɛ latɔkɔ bawo alɛ, ‘Nnya kofe saate obi wɔ nimale ni atesaa ninle
        nwɔ mmle nɛ. Biwa biɛta bulo nwɔ di atesaa nɔɔ nwu nkpo akple wo ale!’
      sbs: 0.6139
      gen_sec: 14.48
      ref_sec: 13.38
      cer: 0.2598
      wer: 0.7812
    bible_00196:
      source: bible
      text: Suoto latɔɔyɔɔ ma osie kanya, di lɛsaa nwu labla ma ni ɔkpɛ, batafuo ofũ onu. Ninfɛ di Yesu
        lakaalɛ ma alɛ, “Lelesaa lewo nkpe ye ninfũ?”
      sbs: 0.6109
      gen_sec: 12.8
      ref_sec: 9.66
      cer: 0.1905
      wer: 0.7308
    bible_00197:
      source: bible
      text: Kafɔɔ baakple baayiisa kudu baalenkeesa kɔkasale alɛ, “Pɛ nwɔ sibuɛ fakaasa koowoso suoto!
        Pɛ nwɔ sibuɛ fakaasa koowoso suoto!”
      sbs: 0.5637
      gen_sec: 12.24
      ref_sec: 8.26
      cer: 0.2596
      wer: 0.8947
    bible_00198:
      source: bible
      text: Nioso fiɛ di Yesu mawa nii, Ntu Kpeesatɛ Yohane lawa aabatɔkɔ Israel batii bamuu alɛ, bakyi
        di sikpile lɛma kamɛ, baatika Yaa anu, baakpeesa ma Yaa ntu.
      sbs: 0.6203
      gen_sec: 14.04
      ref_sec: 14.84
      cer: 0.157
      wer: 0.8519
    bible_00199:
      source: bible
      text: “Ee nse koto fututu lefosi nkpe ɔsanko owo, eeyu kunwii, lɛ ambla? Ansɔ kandiɛ anse, anfiɛ
        leyo nɔɔ kamɛ anwolaa kũ nwaa ninaase di obe wɔ ɛɛnya kũ nii.
      sbs: 0.615
      gen_sec: 15.2
      ref_sec: 12.8
      cer: 0.2458
      wer: 0.931
