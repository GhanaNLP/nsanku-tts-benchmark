      cer: 0.2673
      wer: 0.8696
    bible_00132:
      source: bible
      text: Yesu layila ni aalɛɛ ma aawako ɔkyɛ nɔɔ, ni aakaalɛ ma alɛ, “Be biomiɛ bilɛ mbla nta ye?”
      sbs: 0.613
      gen_sec: 10.52
      ref_sec: 7.58
      cer: 0.2239
      wer: 0.7778
    bible_00133:
      source: bible
      text: Kafɔɔ biye bilɛ ninkookaa ye lɛsaa lee nimakyakaako ye nii, nle n-ye ni di Yaa suoto, di Yaa
        ɔlaa obuɛ ku otuo kamɛ, lɛɛkpaka ku ayo le kamɛ.
      sbs: 0.5917
      gen_sec: 13.84
      ref_sec: 14.72
      cer: 0.211
      wer: 0.8929
    bible_00134:
      source: bible
      text: “Nse dibawɛ osie fiɛ baatii biene kamawɛ didiki mɔ,
      sbs: 0.5775
      gen_sec: 4.72
      ref_sec: 4.44
      cer: 0.2683
      wer: 0.7778
    bible_00135:
      source: bible
      text: Nunua be feekple fasoko? Taka, faafũ ntu okpeesa amanle nwu. Faalɛɛ nwɔ, aafotofɔ sikpile
        adiki di suoto.’
      sbs: 0.6675
      gen_sec: 16.44
      ref_sec: 9.68
      cer: 0.25
      wer: 0.8235
    bible_00136:
      source: bible
      text: Afiofa ya mmle anyɔ suoto di Mose kufiofa ku Yaa ɔlaa babuɛtɛtɛ asaa otuo nkyɛ nɛ.”
      sbs: 0.6036
      gen_sec: 7.4
      ref_sec: 6.6
      cer: 0.3182
      wer: 0.875
    bible_00137:
      source: bible
      text: Kananfi labawɛ osie, ta nkpo oso bakpɛtɛ banɔɔfo ɔnɔɔfo nwu layɛkɛ alɛ babananfi Paulo mambɛbɛɛ.
        Nioso aatɔkɔ bakpɛtɛ nɔɔ alɛ bakyɛ baalaakpaa nwɔ baatii nwu kamɛ basifiko leyo katenkɔ.
      sbs: 0.5896
      gen_sec: 16.0
      ref_sec: 14.66
      cer: 0.1234
      wer: 0.7241
    bible_00138:
      source: bible
      text: Usia lalofo Yotam, ni di Yotam lalofo Ahas nɛ, ni di Ahas kafɔɔ kolofo Hiskia nɛ.
      sbs: 0.6316
      gen_sec: 7.6
      ref_sec: 10.52
      cer: 0.1111
      wer: 0.375
    bible_00139:
      source: bible
      text: “Bibu ɔlaa wɔ mmle disi binyu. Osuɔtɔ onwii lawɛ babi suɔtɔbi banyɔ banwii. Ni aakyɛ aalaatɔkɔ
        ɔnɔɔfo le alɛ, ‘Obi, kyɛ falaabla ɔkpɛ koofe nii miɛ.’
      sbs: 0.6639
      gen_sec: 16.2
      ref_sec: 12.3
      cer: 0.1379
      wer: 0.8077
    bible_00140:
      source: bible
      text: Nse biekpee okyiini di lɛsaa biene ɔbla suoto, owe nimayila ye di suoto?
      sbs: 0.6294
      gen_sec: 6.48
      ref_sec: 6.74
      cer: 0.2241
      wer: 0.6923
    bible_00141:
      source: bible
      text: Nkpo oso ayee bisiɛ bitoonyu osuku, diekye ami, Otii Obi nwu, mawa di obe wɔ minoonyu osuku
        bitɛɛ nii.”
      sbs: 0.6626
      gen_sec: 9.92
      ref_sec: 8.66
      cer: 0.3
      wer: 0.8947
    bible_00142:
      source: bible
      text: Nse biemufũ nwu bieklee osie kanya, bibawɛ didiki. Se diele nkpo, ni ofũ onu lee nwu lɛbla
        kasakasa.
      sbs: 0.5762
      gen_sec: 9.72
      ref_sec: 7.8
      cer: 0.2911
      wer: 0.8889
    bible_00143:
      source: bible
      text: Nse batii bawo kɔnya wo fɛ afĩi buobuo yi, Yaa wɔ mumbɔmbɔ ni oso dite wo nkpo. Kafɔɔ nse
        buloobuo afĩi yi, ni aye lɛlɛ oso dite nkpo.
      sbs: 0.5873
      gen_sec: 13.96
      ref_sec: 12.46
      cer: 0.1845
      wer: 0.7143
    bible_00144:
      source: bible
      text: Otii wɔ baayɔɔsa ni ofiɛ ntoofũ alenke alɛɛ afosi ana.
      sbs: 0.6174
      gen_sec: 5.08
      ref_sec: 4.02
      cer: 0.4091
      wer: 1.0
    bible_00145:
      source: bible
      text: Diekye kayi ka mmle ninumbe nle dibuusaa di Yaa anu. Nioso di Kɔkpana Klekle Kukũ lebuɛ alɛ,
        “Banumbentɛ bamu disibu di Yaa n-yɔ andiki ma di okũ.”
      sbs: 0.5772
      gen_sec: 12.96
      ref_sec: 11.0
      cer: 0.1652
      wer: 0.963
    bible_00146:
      source: bible
      text: Nkpo oso obe wɔ di Yosef lasɛnkɛ nii, aayɔ Maria aabla ɔsɔfɔ nɔɔ fɛ mmle di Yaa tɔkyɛntɛ nwu
        nkpo latɔkɔ nwɔ nii.
      sbs: 0.6021
      gen_sec: 10.36
      ref_sec: 11.82
      cer: 0.2135
      wer: 0.7826
    bible_00147:
      source: bible
      text: Nkpo oso nunua yi, bitɔɔkyɛ akpaka biɛlaalɛɛ batii lele biɛnya bilɛ bawa ɔsanko ɔyɔ dii kalekɔ
        nwu.’
      sbs: 0.6456
      gen_sec: 7.72
      ref_sec: 9.82
      cer: 0.1728
      wer: 0.8824
    bible_00148:
      source: bible
      text: Ni aayɔ disi nwu nkpo aakpee di bɛɛsi bɛnkɛɛ kamɛ aawako ɔsankobi nwu nkpo nɛ. Ni di ɔsankobi
        nwu nkpo kafɔɔ layɔ disi nwu aakyɛnko ɔya nɛ.
      sbs: 0.6087
      gen_sec: 13.2
      ref_sec: 12.1
      cer: 0.2342
      wer: 0.9259
    bible_00149:
      source: bible
      text: Nse leyo nwu nkpo batii letuna beefũ ye, ni biɛta atoko ɔkyɛ ole lee lɛsɛɛsa dite ninfa. Kafɔɔ
        nse baatuna bafũ ye, ni biɛta atoko ɔkyɛ ole lee nwu nkpo lɛsɛɛsa dikple diwa ɔkyɛ lee.
      sbs: 0.645
      gen_sec: 14.32
      ref_sec: 14.7
      cer: 0.2014
      wer: 0.6286
    bible_00150:
      source: bible
      text: Ni kɔɔfɛɛfɔ nwu labalɛ oklo nwu nɛ. Ditaba wo buamunikĩisa oklo nwu buakyɔɔ kɔfɛɛfɔ nwu anu.
        Nioso buata kɔfɛɛfɔ nwu osuku kuatuka wo kuatɔɔkyɛnko.
      sbs: 0.6001
      gen_sec: 11.36
      ref_sec: 12.5
      cer: 0.1901
      wer: 0.75
    bible_00151:
      source: bible
      text: Ɛhɛɛ, ntoonyuma nlɛ lakpeesa Stefana leyo batii kafɔɔ Yaa ntu. Mma nkpo kamaa, noosinyuma
        nlɛ lakple lakpeesa batii bamba Yaa ntu.
      sbs: 0.6068
      gen_sec: 13.96
      ref_sec: 12.64
      cer: 0.1415
      wer: 0.7143
    bible_00152:
      source: bible
      text: Mimbuɛ kafɔɔ bilɛ, ‘Nse minsiɛ nkpa di bawa lee obe kamɛ yi, nse biɛbla onwii ku mma bilo
        Yaa ɔlaa babuɛtɛtɛ nwu nkpo.’
      sbs: 0.6299
      gen_sec: 11.56
      ref_sec: 10.42
      cer: 0.2391
      wer: 0.8696
    bible_00153:
      source: bible
      text: Kafɔɔ baakakatɛ baata ni ninwuna kpile ninwii, ninwuna kpile nwu labuɛ alɛ, “N-ye Yesu, n-ye
        kafɔɔ Paulo. Aye mɔ, bawe bile?”
      sbs: 0.632
      gen_sec: 12.12
      ref_sec: 10.52
      cer: 0.2
      wer: 0.7619
    bible_00154:
      source: bible
      text: Aye bitɔkɔ mi, be biakyɛ bialaanya? Yaa ɔlaa buɛtɛtɛ? Nwaako katɔkɔ ye nii, otii wɔ biakyɛ
        bialaanya ni nlenke bia Yaa ɔlaa buɛtɛtɛ.
      sbs: 0.6618
      gen_sec: 16.12
      ref_sec: 11.82
      cer: 0.3048
      wer: 0.8696
    bible_00155:
      source: bible
      text: Ninfɛ baakyako obuɛ kaamɛ lɛma alɛ, “Mmle munan-yɔ bloblo kuonwii bukle ni oso obuɛ ɔlaa wɔ
        mmle?”
      sbs: 0.6314
      gen_sec: 13.2
      ref_sec: 8.32
      cer: 0.2468
      wer: 0.8235
    bible_00156:
      source: bible
      text: abawɛ sifutulɛ kafɔɔ anta mba lɛɛkyakaako lefĩ nii.
      sbs: 0.6053
      gen_sec: 5.84
      ref_sec: 5.52
      cer: 0.1628
      wer: 0.625
    bible_00157:
      source: bible
      text: Nse otii owo diɛyɔ nwu ole di ɔlaa wɔ mmle suoto, ayee bitankyɔɔ nwɔ ɔlaa atoko.
      sbs: 0.5673
      gen_sec: 6.2
      ref_sec: 7.24
      cer: 0.3016
      wer: 0.8125
    bible_00158:
      source: bible
      text: Obe wɔ baalaabuo ni Yerusalem, bafũbanutɛ ku batɔkyɛntɛ ku banɔɔfo lɛma lafũ ma nwaa. Ninfɛ
        di Paulo ku Barnaba latɔkɔ ma asaa ya amuu di Yaa labla aafenko ni di suoto lɛma nɛ.
      sbs: 0.6307
      gen_sec: 15.84
      ref_sec: 12.02
      cer: 0.1702
      wer: 0.7273
    bible_00159:
      source: bible
      text: Yaa wɔ ninle ni Saate Yesu Teete, nwɔ buɔtansa ni diesifi ni dinnaa ni kaloo, aye alɛ sɛlaa
        se kobuɛ nii, site nkpo.
      sbs: 0.6121
      gen_sec: 17.12
      ref_sec: 10.52
      cer: 0.2111
      wer: 0.8696
    bible_00160:
      source: bible
      text: Ɔlanle faale fiɛ di Yaa lalɛɛfɔ? Diɛbla lɛsalɛsaa. Kafɔɔ nse osuku nkpe fɔ alɛ faadie di sɛlanle
        nwu kamɛ, ni faablako nwu ɔkpɛ.
      sbs: 0.6039
      gen_sec: 12.24
      ref_sec: 11.42
      cer: 0.1961
      wer: 0.8696
    bible_00161:
      source: bible
      text: Nse buoole Yaa afiofa, ni buofũ buonu bulɛ buye nwɔ.
      sbs: 0.6749
      gen_sec: 6.84
      ref_sec: 5.6
      cer: 0.3171
      wer: 1.1
    bible_00162:
      source: bible
      text: Ninfɛ di Yesu lalɛɛ obisɔ biibii onwii aabayila ma di anu nɛ.
      sbs: 0.5991
      gen_sec: 6.56
      ref_sec: 5.14
      cer: 0.2041
      wer: 0.75
    bible_00163:
      source: bible
      text: Nse ɛɛbla fɔ okpile sikuɛnsĩ, di dii ninwii kamɛ, eekple ɛɛwafɔ ɔkyɛ di sikuɛnsĩ nwu nkpo
        kamɛ, ɛɛbatikiti fɔ lekoto, faayɔ fakyɛ nwɔ.”
      sbs: 0.6963
      gen_sec: 17.56
      ref_sec: 11.2
      cer: 0.1776
      wer: 0.8696
    bible_00164:
      source: bible
      text: Kafɔɔ nwaako ɔlaa kule alɛ Yaa lasɛnkɛsa Kristo aakyeko bakpi kamɛ. Nle mmle ninle lɛtaafuɔ
        le ninkotuo alɛ batii ba niekpi bate nii, babasɛnkɛsa ma.
      sbs: 0.6185
      gen_sec: 20.44
      ref_sec: 14.16
      cer: 0.1311
      wer: 0.68
    bible_00165:
      source: bible
      text: Di basa ku basɔfɔ suoto yi, kokpee ma Saate kufiofa ninanle ami omu kufiofa kule ni. Dinaa
        alɛ ɔsanko lesĩ ɔsa.
      sbs: 0.5555
      gen_sec: 10.52
      ref_sec: 9.76
      cer: 0.1932
      wer: 0.7619
    bible_00166:
      source: bible
      text: Diele Beelsebul osie kule. Kafɔɔ Yaa Ninwuna niɛtɛɛ osie kotososa anwuna kpile ndiki baatii
        kamɛ. Nle mmle kotuo alɛ Yaa sɛka kalekɔ ntɔɔwa ye kamɛ kofokofoko.
      sbs: 0.6232
      gen_sec: 16.92
      ref_sec: 13.2
      cer: 0.2977
      wer: 1.0
    bible_00167:
      source: bible
      text: Nunua, bawe ninle wo osuku onyu, suoto lɛyɔɔ ku lɛkakoto le suoto bubakanta ni se Saate loo
        Yesu lɛwa? Mma ninle aye nɛ.
      sbs: 0.6289
      gen_sec: 13.56
      ref_sec: 11.52
      cer: 0.1277
      wer: 0.5652
    bible_00168:
      source: bible
      text: Kafɔɔ obe wɔ baakyɛ nii, batanya ma! Nioso baakple babatɔkɔ ma alɛ,
      sbs: 0.6766
      gen_sec: 8.08
      ref_sec: 4.9
      cer: 0.2642
      wer: 1.0
    bible_00169:
      source: bible
      text: Kafɔɔ Farisi batii labuɛ alɛ, “Anwuna kpile ɔka niɛtɔɔ osie nwu akle ootososa anwuna kpile
        andiki.”
      sbs: 0.5915
      gen_sec: 10.12
      ref_sec: 7.88
      cer: 0.15
      wer: 0.75
    bible_00170:
      source: bible
      text: Di obe nwu nkpo kamɛ kafɔɔ, Petro lakple aayila aatɔɔpɛ ɔpɛ kokloo kɔnɛɛ. Ni baalaasɛkɛtɛ
        nii nnwɔɔ diale, diabla ma ɔkpɛ osie kanya.
      sbs: 0.6362
      gen_sec: 13.52
      ref_sec: 10.3
      cer: 0.1402
      wer: 0.6957
    bible_00171:
      source: bible
      text: Bilolaa binyu, biɛta anu lee ate kesekese, ta bieye dii le diɛ obe nwu mawo nii.
      sbs: 0.6511
      gen_sec: 8.04
      ref_sec: 6.96
      cer: 0.0968
      wer: 0.9375
    bible_00172:
      source: bible
      text: Ni aadiɛ ma aakyɛ sitũ kɛɛkɛ, ni aapɛ akunkyi aapɛ ɔlaa aata Yaa nɛ.
      sbs: 0.6216
      gen_sec: 5.8
      ref_sec: 5.42
      cer: 0.1132
      wer: 0.5714
    bible_00173:
      source: bible
      text: Komiɛ nlɛ kamɛ kakpa ye klekle nlɛ, di lɛkanko di nwu suoto yi, otii biala ɔlaakuu lele atooyibuɛ
        yi, abata nwu nkuntaa.
      sbs: 0.6451
      gen_sec: 10.48
      ref_sec: 12.04
      cer: 0.2737
      wer: 0.9545
    bible_00174:
      source: bible
      text: Kuntɛ bukpe osuku fɛle Kristo batɔkyɛntɛ alɛ abiesaa loo katika ye di suoto yi,
      sbs: 0.6014
      gen_sec: 8.2
      ref_sec: 6.44
      cer: 0.1692
      wer: 0.7143
    bible_00175:
      source: bible
      text: Nle mmle sɛmaa, Saate nwu ladiki basuɔtɔ afosi akuɛnsĩ basuɔtɔ banyɔ bamba, aakpee ma banyɔ
        banyɔ alɛ bakyɛ sekpoo ku nkpayotũ be kamɛ ɔɔwa ni ɔbakyɛ.
      sbs: 0.5861
      gen_sec: 14.64
      ref_sec: 10.58
      cer: 0.2049
      wer: 0.6923
    bible_00176:
      source: bible
      text: ‘Bilolaa osuku bitɛ bita Saate nwu ɔwabee.
      sbs: 0.5964
      gen_sec: 5.36
      ref_sec: 4.68
      cer: 0.2059
      wer: 0.7143
    bible_00177:
      source: bible
      text: “Lɛ diɛbla fɔɔnya diku biibii le ninsi ni di owo lɛfɔ ninu, kafɔɔ fɔlɔɔnya kawosoku ka ninsi
        fɔ ni leele kamɛ?
      sbs: 0.6554
      gen_sec: 10.36
      ref_sec: 7.84
      cer: 0.1034
      wer: 0.7619
    bible_00178:
      source: bible
      text: Ni di ɔnɔɔfo wɔ mmle lakyɛ bakpɛtɛ banɔɔfo ɔnɔɔfo nwu nfũ alaakaalɛ nwɔ alɛ, “Be falɛ fɔɔblaa?
        Osuɔtɔ wɔ mmle Roma otii ale lo!”
      sbs: 0.6601
      gen_sec: 11.48
      ref_sec: 10.48
      cer: 0.16
      wer: 0.8333
    bible_00179:
      source: bible
      text: “Basiɛwo, kɔtɔkɔ ye nlɛ, bitanyɛkɛ batii ba ninlo ni suoto sina, ninni kamaa, lɛsalɛsaa nsinnaa
        ma babakple manfuo ni ɔbla.
      sbs: 0.642
      gen_sec: 11.04
      ref_sec: 10.22
      cer: 0.1224
      wer: 0.9
    bible_00180:
      source: bible
      text: Otii wɔ ninkakatɛ ni di sele ate ate kamɛ yi, apɛ ɔlaa ata Yaa alɛ aatɔɔ lɛtasaa alɛ aayɔ
        antoodiki sɛlaa se ambuɛ ni kasɔ.
      sbs: 0.5954
      gen_sec: 11.72
      ref_sec: 10.56
      cer: 0.1649
      wer: 0.8
    bible_00181:
      source: bible
      text: Nunua Kristo ntoosifi osi asi di Yaa oletanɛɛkyɛ, oole sɛka di Yaa batɔkyɛntɛ ku situmi se
        ninkpe ni di osi ku basiɛntɛ suoto.
      sbs: 0.6178
      gen_sec: 12.96
      ref_sec: 14.88
      cer: 0.0784
      wer: 0.5217
    bible_00182:
      source: bible
      text: Ni baakaalɛ nwɔ alɛ ase ɔka ata ma. Ni di Yaa lata ma Kis obi Saul wɔ niakye ni Benyamin kɔna
        kamɛ, aale sɛka alɛɛ afosi ana nɛ.
      sbs: 0.6478
      gen_sec: 14.72
      ref_sec: 13.52
      cer: 0.1633
      wer: 0.8929
    bible_00183:
      source: bible
      text: Nle mmle oso nnɛɛ diloofee wo kuntɛ suoto loo se mmle sina kɔwɔɔ kɛɛkɛkɛɛkɛ, kafɔɔ buye bulɛ
        ninwuna loo kamɛ nkpa osiɛ kɔbla lɛfɔle obe lele.
      sbs: 0.6157
      gen_sec: 15.28
      ref_sec: 12.4
      cer: 0.287
      wer: 0.9615
    bible_00184:
      source: bible
      text: Di afa nɔɔ ɔbla labla ma ni ɔkpɛ di obe kpinwu kamɛ oso, mankyɔɔ nwɔ ɔlaa atoko.
      sbs: 0.6345
      gen_sec: 9.64
      ref_sec: 6.0
      cer: 0.1452
      wer: 0.7647
    bible_00185:
      source: bible
      text: Kafɔɔ buɔyɔ nwu bublako ɔkpɛ. Buayɔ lɛsaa biala buatika di suoto buɛɛ, mmle okle di Kristo
        ɔlaa biene nwu kakyɛ ni sitũ, kundu ni kakɔ biala.
      sbs: 0.6327
      gen_sec: 13.52
      ref_sec: 13.02
      cer: 0.1429
      wer: 0.6154
    bible_00186:
      source: bible
      text: Ni di Yesu lakaalɛ ma alɛ, “Bloblo akudi asɛ bikle?”
      sbs: 0.577
      gen_sec: 5.4
      ref_sec: 4.06
      cer: 0.1026
      wer: 0.4
    bible_00187:
      source: bible
      text: Obe wɔ baalɛɛ mi ni lɛka kasale alɛ ndiki ni suoto kanya, kuonwii lɛma ditayila mi kamaa,
        bamuu lɛma baasĩ mi. Yaa atannanfi ma kootoko, ayɔ akyɛ ma.
      sbs: 0.6344
      gen_sec: 16.0
      ref_sec: 12.7
      cer: 0.1709
      wer: 0.9286
    bible_00188:
      source: bible
      text: Nioso bita buyɔ katansa ku dibu buta Yaa kafa ɔka wɔ ninnaa ni kaloo, mananya ni, leete nɔɔ
        ninle ni ɔka. Diwa kaanya.
      sbs: 0.6116
      gen_sec: 11.12
      ref_sec: 10.52
      cer: 0.0978
      wer: 0.7826
    bible_00189:
      source: bible
      text: Afɔ yi, obi nii, kpee osie di onwii loo ɔbla kamɛ ku Yesu Kristo sibualɛ se ɛɛta wo ni kamɛ.
      sbs: 0.6158
      gen_sec: 9.72
      ref_sec: 7.92
      cer: 0.0714
      wer: 0.65
    bible_00190:
      source: bible
      text: Diefe ni di ɔlaa biene loo obuɛ kamɛ, ni di Yaa lalɛɛ ye alɛ biawa mimawɛ kalekɔ di Saate
        Yesu Kristo leyooto kamɛ nɛ.
      sbs: 0.6027
      gen_sec: 8.64
      ref_sec: 12.1
      cer: 0.1398
      wer: 0.5833
    bible_00191:
      source: bible
      text: Kainan ote niale Enos, Enos ote niale Set,
      sbs: 0.6109
      gen_sec: 5.4
