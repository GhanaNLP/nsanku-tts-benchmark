      sbs: 0.6957
      gen_sec: 10.96
      ref_sec: 12.68
      cer: 0.4819
      wer: 0.5263
    bible_00029:
      source: bible
      text: Diabla ni fɛ lebombo ninwii sɛmaa, osuɔtɔ bamba onwii lakple aabuɛ osie kanya aatika difuɔ
        alɛ, “Ɔlaa ɔnanfi kuonwii nnaa alɛ osuɔtɔ wɔ mmle diele Yesu tikankotɛ, diekye Galilea otii ale!”
