      sbs: 0.6793
      gen_sec: 11.36
      ref_sec: 12.48
      cer: 0.0198
      wer: 0.0385
    bible_00057:
      source: bible
      text: Yesu ku basaateketetɛ nɔɔ lasifi ntɛɛ be niɛtɛɛtɛɛ ni Kaesarea Filipi okpoo. Nfa aakaalɛ ma
