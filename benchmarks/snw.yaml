      gen_sec: 13.52
      ref_sec: 14.62
      cer: 0.223
      wer: 0.2188
    bible_00041:
      source: bible
      text: Ni di Yesu lakaalɛ ma alɛ, “Biika di Kɔkpana Klekle Kukũ kamɛ binya? Beebuɛ alɛ,
      sbs: 0.7353
      gen_sec: 6.56
      ref_sec: 6.7
      cer: 0.0161
      wer: 0.0667
    bible_00042:
      source: bible
      text: Diawa alɛ ofiɛ lapɛ nwɔ aakpi. Nioso basiɛwo nɔɔ lakpeesa nwɔ ntu, baalolaa nwɔ baatɛ di ayo
        ya beetofo beetika ni baawo ninwii kamɛ di osi.
      sbs: 0.7283
      gen_sec: 11.52
      ref_sec: 10.44
      cer: 0.0179
      wer: 0.0769
    bible_00043:
      source: bible
      text: Ku batii ba beenyinka bɛɛtɛ ni kaasɔ ku dibuo alɛ, baawɛ ɔnyɛɛ ɔtɛ.
      sbs: 0.7013
      gen_sec: 5.04
      ref_sec: 6.2
      cer: 0.0377
      wer: 0.1538
    bible_00044:
      source: bible
      text: Babiloo, buomiɛ bulɛ bitofo lɛsaa le di Yaa ntɔɔbla ni di bafũbanutɛ akudi ya amuu ninkpe
        ni di Makedonia ntɛɛ nwu ta sibualɛ nɔɔ oso.
      sbs: 0.6682
      gen_sec: 10.24
      ref_sec: 10.38
      cer: 0.0185
      wer: 0.12
    bible_00045:
      source: bible
      text: Abata batii biene nyila di oletanɛɛkyɛ nɔɔ, anta batii kpile kafɔɔ nyila di ɔmɛtukyɛ nɔɔ.
      sbs: 0.6929
      gen_sec: 6.48
      ref_sec: 6.52
      cer: 0.0137
      wer: 0.0667
    bible_00046:
      source: bible
      text: otii wɔ nikobuɛ alɛ ɛɛbla ni onwii ku Yaa, dikpe nii ansiɛ nkpa fɛ mmle okle di Yesu Kristo
        lasiɛ nii.
      sbs: 0.7005
      gen_sec: 7.76
      ref_sec: 9.14
      cer: 0.0125
      wer: 0.0476
    bible_00047:
      source: bible
      text: Nse biebuo leyo lewo kamɛ yi, biɛsɛɛsa ma bilɛ, ‘Atoko ɔkyɛ ole ninle ye lele.’
      sbs: 0.6835
      gen_sec: 10.24
      ref_sec: 6.42
      cer: 0.0167
      wer: 0.0667
    bible_00048:
      source: bible
      text: Lɛsaa ninwii le niefĩ ni di basaanyuntɛ nwu nkpo suoto diɛta ni Saate lɛma ninle alɛ, bɛɛbla
