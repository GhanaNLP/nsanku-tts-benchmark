      sbs: 0.6914
      gen_sec: 9.84
      ref_sec: 9.38
      cer: 0.0323
      wer: 0.0909
    bible_00049:
      source: bible
      text: “Di obe wɔ diapɛ ni abombo anaasĩ, osuɔtɔ nwu nkpo lakple aadie aakyɛ lɛkpaka, aalaanya basuɔtɔ
        bawo n-yɛ ninfa blɔbla lɛsalɛsaa.
      sbs: 0.6888
      gen_sec: 11.6
      ref_sec: 9.14
      cer: 0.0
      wer: 0.0
    bible_00050:
      source: bible
      text: Bloblo wɔ ninantaka ni, manlɛɛ ni Okpi Diisi Ofe Dii ole bee latɛɛtɛɛ.
      sbs: 0.7012
      gen_sec: 6.96
      ref_sec: 4.64
      cer: 0.0714
      wer: 0.3846
    bible_00051:
      source: bible
      text: Ninfɛ di Yesu latɔkɔ ma alɛ, “Ni aye kafɔɔ batii ba ninoonu sɛlaa kasɔ biekple bile?
      sbs: 0.6886
      gen_sec: 6.16
      ref_sec: 6.34
      cer: 0.0
      wer: 0.0
    bible_00052:
      source: bible
      text: Aawɔɔsa nnle nkuɛnsĩ di Kanaan kasɔ suoto, ni aayɔ ma kasɔ aata Israel batii keekple ma kale
        nɛ.
      sbs: 0.6968
      gen_sec: 8.08
      ref_sec: 8.92
      cer: 0.0649
      wer: 0.3333
    bible_00053:
      source: bible
      text: Nioso, Petro ku Yohane latika ma nnɛɛ di suoto, ni baafũ Yaa Ninwuna Klekle nɛ.
      sbs: 0.7146
      gen_sec: 7.6
      ref_sec: 5.28
      cer: 0.0
      wer: 0.0
    bible_00054:
      source: bible
      text: Yaa wɔ niabuɛ alɛ, “Lɛkpa dikpa ni di ditunu kamɛ” yi, nnwɔɔ kafɔɔ niɛta lɛkpa nɔɔ lɛkpa di
        situ loo kamɛ nɛ, alɛ aata muntofo Yaa lɛkpa di Kristo anu.
      sbs: 0.6804
      gen_sec: 11.52
      ref_sec: 12.52
      cer: 0.0086
      wer: 0.0333
    bible_00055:
      source: bible
      text: Nse batii bamba nkpe osuku manwɛ lɛsaa makyeko ɔkyɛ lee, ni awo bukpe osuku wɔ mmle okle bulenke
        ma bia.
      sbs: 0.6864
      gen_sec: 8.32
      ref_sec: 10.1
      cer: 0.0361
      wer: 0.15
    bible_00056:
      source: bible
      text: Di obe wɔ baawa ni nfũ di ɔlaa wɔ mmle oso yi, ntafenko nwu sɛmaa. Kaleesɛ, ni lata baakpaa
