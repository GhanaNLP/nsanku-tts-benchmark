        wo buobuo!’
      sbs: 0.6581
      gen_sec: 9.12
      ref_sec: 10.76
      cer: 0.2727
      wer: 0.8125
    bible_00070:
      source: bible
      text: Nwaako nse ɛɛnyɔɔ yi, abanya suoto lɛyɔɔ di onwii nwu nkpo suoto anlenkee afosi anaasĩ banaasĩ
        nwu nkpo niebu nii.
      sbs: 0.6316
