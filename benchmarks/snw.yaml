      sbs: 0.6559
      gen_sec: 10.2
      ref_sec: 10.24
      cer: 0.1818
      wer: 0.5333
    bible_00068:
      source: bible
      text: Obe wɔ lakyɛ ni lɛkyɔtɔ, biatɛɛ asaa laklee. Obe wɔ latoofiɛ nii, bianyu mi. Obe wɔ kafɔɔ
        late ni leeyo, biawa biabanyu mi.’
      sbs: 0.6878
      gen_sec: 12.76
      ref_sec: 11.02
      cer: 0.1684
      wer: 0.7826
    bible_00069:
      source: bible
