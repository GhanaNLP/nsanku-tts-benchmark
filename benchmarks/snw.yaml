      sbs: 0.6936
      gen_sec: 11.12
      ref_sec: 14.44
      cer: 0.0328
      wer: 0.0938
    bible_00021:
      source: bible
      text: Ninfɛ di Yesu layɔ kɔnɛɛ aatika di ɔsanko nwu suoto nɛ. Nfanwu, ɔsanko wɔ mmle niataka aayila
        wlɔlɔ, aakyako Yaa ɔtansa nɛ.
      sbs: 0.7086
      gen_sec: 9.6
      ref_sec: 8.62
      cer: 0.051
      wer: 0.1818
    bible_00022:
      source: bible
      text: Ninfɛ di Petro ladie di oklo nwu kamɛ aakyako ɔkyɛ di ntu osi, aatoofe Yesu nfũ nɛ.
      sbs: 0.6662
      gen_sec: 7.76
      ref_sec: 7.24
      cer: 0.0154
      wer: 0.0588
    bible_00023:
      source: bible
      text: Dii tiɛfa, baayɔ oklo akpɛmblasaa awo baayu di ntu kamɛ.
      sbs: 0.6555
      gen_sec: 6.4
      ref_sec: 4.14
      cer: 0.0667
      wer: 0.2
    bible_00024:
      source: bible
      text: Nfanwu, ni baadiɛ asawu lɛma baatɛ, baatikanko nwɔ nɛ.
      sbs: 0.6754
      gen_sec: 5.04
      ref_sec: 5.28
      cer: 0.0465
      wer: 0.2222
    bible_00025:
      source: bible
      text: Mumpɛ Yaa sɛfa diisi lee. Obe lele kafɔɔ nse buɔpɛ ɔlaa munta Yaa, munnyuma ye muntikiti lekokoto
        di bamuu lee disi.
      sbs: 0.699
      gen_sec: 9.68
      ref_sec: 9.82
      cer: 0.0215
      wer: 0.0952
    bible_00026:
      source: bible
      text: Nkpo oso kɔtɔkɔ fɔ nlɛ afɔ ninle Petro di lɛsɔdiki ninle ni difuɔnkpaa. Difuɔnkpaa le mmle
        suoto kamatofo bafũbanutɛ nii dikudi nɛ. Bia kukpi osie dilɔbafuo ma olenkee.
      sbs: 0.6888
      gen_sec: 13.84
      ref_sec: 13.9
      cer: 0.029
      wer: 0.1429
    bible_00027:
      source: bible
      text: Yuda batii tunletɛ onwii lakaalɛ Yesu alɛ, “Saatuotɛ biene, be kabla fiɛ kawɛ nkpa be ninnaa
