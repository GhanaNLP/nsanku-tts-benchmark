      sbs: 0.668
      gen_sec: 12.56
      ref_sec: 13.6
      cer: 0.0625
      wer: 0.2
    bible_00058:
      source: bible
      text: “Kafɔɔ abatɔkɔ ye alɛ, ‘Ninye ye nfũ biekye nii!’
      sbs: 0.7194
      gen_sec: 6.48
      ref_sec: 3.64
      cer: 0.0278
      wer: 0.5556
    bible_00059:
      source: bible
      text: Babiloo, buotikiti ye lekoto bulɛ, biayɔ dibu minta batunletɛ ba nikotuo ye ni asaa ku okyiini
        bɔɔkpaa ye ni di Yaa sisuku suoto bɔɔka ye ni.
      sbs: 0.6875
      gen_sec: 13.2
      ref_sec: 13.62
      cer: 0.0354
      wer: 0.1538
    bible_00060:
      source: bible
      text: N-ye kafɔɔ nlɛ, nse ntoosifi, batii mataka ye di suoto mansamiisa ye, blɔbanya ye nyaami.
        Fɛ mmle okle di ɔkplɛle ntikanko ni bafoso ansamiisa ma nii.
      sbs: 0.7067
      gen_sec: 12.56
      ref_sec: 12.68
      cer: 0.042
      wer: 0.1154
    bible_00061:
      source: bible
      text: Nkpo bate fɛ babisɔ ba ninsi bookpee ni kɔkyɔ di asaa kasunsukɔ nɛ. Bɔɔtɔkɔ dikudi bamba alɛ,
      sbs: 0.6669
      gen_sec: 7.76
      ref_sec: 7.1
      cer: 0.0533
      wer: 0.1765
    bible_00062:
      source: bible
      text: Nioso obe wɔ buanya bulɛ, bulɔbafuo nwɔ ni disibu okyisa, buadiɛ nwɔ, ni buabuɛ bulɛ, “Yaa
        dibiesaa diwa kaanya.”
      sbs: 0.7365
      gen_sec: 10.56
      ref_sec: 9.54
      cer: 0.0114
      wer: 0.1053
    bible_00063:
      source: bible
      text: Nwaako kɔtɔkɔ ye nlɛ, namasinnyi nta be mmle okle diidii diɛlaase di dii le di ami ku aye
        bubanyi ni nta fɔle di Teemi sɛka kalekɔ nwu nkpo kamɛ.”
      sbs: 0.693
      gen_sec: 11.36
      ref_sec: 12.66
      cer: 0.0174
      wer: 0.1034
    bible_00064:
      source: bible
      text: Bisɛɛsa bawo di Yaa lɛbɔmbɔ kamɛ fɛ mmle diesiɛko ni.
      sbs: 0.6836
      gen_sec: 4.72
      ref_sec: 4.28
      cer: 0.0698
      wer: 0.2
    bible_00065:
      source: bible
      text: Suoto siyɔɔ batii ba baatii ntikanko bɔɔnya ni dibuo, ta basi ni nkpa tinini di Yaa anu oso,
      sbs: 0.7303
      gen_sec: 7.2
      ref_sec: 7.44
      cer: 0.0274
      wer: 0.3889
    bible_00066:
      source: bible
      text: Bionyuma bilɛ obe wɔ buawɛ ni di ɔkyɛ lee, buatɔkɔ ye bualesa katũ bulɛ ditikanko le mmle
        okle mawa wo di suoto. Fɛ mmle biye nii, nni nfɛ nikɔwa nɛ.
      sbs: 0.6996
      gen_sec: 11.6
      ref_sec: 12.84
      cer: 0.0603
      wer: 0.2
    bible_00067:
      source: bible
      text: Ninfɛ di Yesu latɔkɔ ma alɛ, “Bitanyɛkɛ. Bitɔɔkyɛ biɛlaatɔkɔ babiloo bilɛ, batɔɔkyɛ Galilea,
        babanyɛɛ ninfa.”
      sbs: 0.7483
      gen_sec: 11.04
      ref_sec: 10.24
      cer: 0.0114
      wer: 0.0667
    bible_00068:
      source: bible
      text: Obe wɔ lakyɛ ni lɛkyɔtɔ, biatɛɛ asaa laklee. Obe wɔ latoofiɛ nii, bianyu mi. Obe wɔ kafɔɔ
        late ni leeyo, biawa biabanyu mi.’
      sbs: 0.7205
      gen_sec: 10.88
      ref_sec: 11.02
      cer: 0.0105
      wer: 0.0435
    bible_00069:
      source: bible
      text: “Nni sɛmma, kokpeelebitɛ bulɛ nwu nkpo kafɔɔ lawa, ni baabuɛ alɛ, ‘Ɔnɔɔfo, Ɔnɔɔfo! Sɛkɛtɛ
        wo buobuo!’
      sbs: 0.7132
      gen_sec: 10.08
      ref_sec: 10.76
      cer: 0.0909
      wer: 0.4375
    bible_00070:
      source: bible
      text: Nwaako nse ɛɛnyɔɔ yi, abanya suoto lɛyɔɔ di onwii nwu nkpo suoto anlenkee afosi anaasĩ banaasĩ
        nwu nkpo niebu nii.
      sbs: 0.6831
      gen_sec: 9.28
      ref_sec: 9.38
      cer: 0.0215
      wer: 0.1
    bible_00071:
      source: bible
      text: Nle mmle oso, buɔkaalɛ munkyeko Tito nfũ osie kanya bulɛ, sifutulɛ ɔkpɛ wɔ mmle kasɔ atookye
        ni kaamɛ lee, aabla ankyɛnko sitũ, anyɛntɛ.
      sbs: 0.7008
      gen_sec: 11.12
      ref_sec: 11.86
      cer: 0.0459
      wer: 0.2174
    bible_00072:
      source: bible
      text: Obe wɔ di Paulo lasiɛ di Atene aasoko ni Silas ku Timoteo yi, diabuo nwɔ suoto obe wɔ aanya
        alɛ okpoo nwu batii lɛyɔ suoto bɛɛta ni afiɔ ɔtɔ, di okpoo nwu kafɔɔ layii ni ku afiɔsaa.
      sbs: 0.7245
      gen_sec: 14.08
      ref_sec: 14.32
      cer: 0.0141
      wer: 0.0541
    bible_00073:
      source: bible
      text: “Kafɔɔ Saate nwu latɔkɔ mi alɛ, ‘Taka, faatɔɔkyɛ, diekye makyesee fɔ fanfa di batii ba ninanle
        ni Yuda batii kamɛ!’ ”
      sbs: 0.6804
      gen_sec: 11.28
      ref_sec: 8.98
      cer: 0.0
      wer: 0.0
    bible_00074:
      source: bible
      text: Banyɔ lɛma baabuo di oklo nwu nkpo kamɛ, ni kɔɔfɛɛfɔ nwu nkpo ladiɛ ɔfɛ nɛ.
      sbs: 0.6503
      gen_sec: 5.92
      ref_sec: 6.16
      cer: 0.1017
      wer: 0.3333
    bible_00075:
      source: bible
      text: ku Yakobo wɔ ninle Alfeo obi ku Tadeo
      sbs: 0.7304
      gen_sec: 3.6
      ref_sec: 5.24
      cer: 0.0333
      wer: 0.125
    bible_00076:
      source: bible
      text: Obe wɔ baasaateketetɛ nwu nkpo lakple baawa nii, baatɔkɔ Yesu asaa ya amuu baabla nii. Ninfɛ
        di Yesu lakpaa lete lama aasifiko okpoo wɔ bɔɔlɛɛ ni Betsaida nɛ.
      sbs: 0.7304
      gen_sec: 11.84
