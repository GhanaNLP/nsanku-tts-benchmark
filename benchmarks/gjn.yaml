      text: ” Kanyɛn na ka nu loŋ nɛ mbe kagbene kaa nɛ e kilgi n yɔ nɛ kagbenejija, ŋkpal manɛ so, e
        daa kɔ asɔ ga.
      sbs: 0.6772
      gen_sec: 5.21
      ref_sec: 8.64
    '6':
      text: Saŋɛ na so kachako Ebɔrɛ beeŋ tiŋi ma alɛ gba ashi luwu to.
      sbs: 0.6603
      gen_sec: 2.94
      ref_sec: 4.7
    '7':
      text: Amoso men sa maŋ kaa fɛ fanɛ menyi gbagba be eleŋ nɛ ketiŋwora so nɛ men nyalɛ nseŋ dii dama
        na.
      sbs: 0.6558
      gen_sec: 4.83
      ref_sec: 7.18
    '8':
      text: Enimu sasopo e daa la Zikri pibinyɛn Amaziya nɛ mo alɛ daa keni benapo ŋgboŋ alfa anyɔ so.
      sbs: 0.6664
      gen_sec: 4.56
      ref_sec: 7.18
    '9':
      text: Gbiti nɛ shuwa nɛ ntishaŋ peper nɛ kusɔ kama nɛ b ta kebɛlso n wora kikɛ la Enyɛnpe Ebɔrɛ
        na peya nna.
      sbs: 0.6438
      gen_sec: 4.9
      ref_sec: 7.46
    '10':
      text: fo kebaawɔtɔ kikɛ to; nseŋ shin nɛ Jerusalɛm be.
      sbs: 0.6673
      gen_sec: 2.69
      ref_sec: 3.86
    '11':
      text: Ndibi koŋwule na be ako nɛ e beeŋ ta m puga edɛ n tɔ eblaŋ n we m moɛ.
      sbs: 0.6438
      gen_sec: 3.32
      ref_sec: 6.64
    '12':
      text: Esa pɔtɛ kama malɛ nɛ e pɛl n sɔ Mosis ŋko Ɛɛrɔn be kushuŋ a shuŋ, b mɔ mo.
      sbs: 0.6659
      gen_sec: 3.48
      ref_sec: 5.7
    '13':
      text: mbe nnɔ naseso na be asheŋ, nɛ e sa maŋ teŋ amo so kikɛ.
      sbs: 0.6965
      gen_sec: 2.19
      ref_sec: 4.26
    '15':
      text: Menyee yɔ abee jeŋgreŋ so nna n ya kaa lara esarga nsaa di abar keche nɛ kenyɛn ndoŋ.
      sbs: 0.6652
      gen_sec: 3.99
      ref_sec: 6.54
    '16':
      text: Eleŋ koŋwule nɛ e beeŋ ta n ji kusɔ kikɛ so kuwura na nɛ e beeŋ ta n chɛrga anyi.
      sbs: 0.6771
      gen_sec: 3.91
      ref_sec: 7.8
    '17':
      text: nseŋ ku kananɛ teku beeŋ baa sa n sa kumo na.
      sbs: 0.6937
      gen_sec: 0.44
      ref_sec: 3.38
    '18':
      text: 'Ade be kaman nɛ Enyɛnpe Ebɔrɛ na kaŋɛ le: “Israɛl be basa, ma e lara menyi fanɛ ma nyɛrbi.'
      sbs: 0.6395
      gen_sec: 4.52
      ref_sec: 6.92
    '21':
      text: Mee fɛ nna fanɛ a daga fanɛ n naŋ shin nɛ Epafrodaites e bɛta n yɔ menyi kutɔ.
      sbs: 0.641
      gen_sec: 3.85
      ref_sec: 6.64
    '22':
      text: nɛ b wɔ lsɔɔ be abee so a pin asheŋ to na.
      sbs: 0.6786
      gen_sec: 1.84
      ref_sec: 3.2
    '23':
      text: Kumo be kaman nɛ b baa tre menyi, “Ebɔrɛ be Basa Cheembi.
      sbs: 0.6792
      gen_sec: 2.35
      ref_sec: 3.64
    '24':
      text: mo e yili kebir abar to n chɔrɔ abar kasha so.
      sbs: 0.6541
      gen_sec: 2.19
      ref_sec: 3.3
    '25':
      text: meeŋ shuli kagbenefuliso fanɛ fo kɔ ekpa.
      sbs: 0.6839
      gen_sec: 2.14
      ref_sec: 3.04
    '27':
      text: B shile nna ŋkpal bumo gbagba ka ki basa nɛ baaŋ mur so.
      sbs: 0.6652
      gen_sec: 2.62
      ref_sec: 3.66
    '28':
      text: E beeŋ kpele kedibi na be ayabi m puga edɛ n wɔl gbaŋgbaŋ to nseŋ ta ako m puga edɛ n daŋɛ
        n ji.
      sbs: 0.6501
      gen_sec: 4.23
      ref_sec: 10.12
    '30':
      text: kusɔ kama nɛ baa sha, kumo nɛ baa wora ma.
      sbs: 0.6795
      gen_sec: 2.0
      ref_sec: 3.18
    '31':
      text: E bee bar anyi mbe kefulto nɛ k bee sa ŋkpa na to nna.
      sbs: 0.6599
      gen_sec: 2.7
      ref_sec: 4.14
    '32':
      text: Fo e shin nɛ teku peper chiŋgeliŋ na baŋɛ to.
      sbs: 0.67
      gen_sec: 2.35
      ref_sec: 3.34
    '33':
      text: Menyee gben ga a fin agbir popɔr, ama menyi alɛ maa gben a yige to.
      sbs: 0.6661
      gen_sec: 3.08
      ref_sec: 4.38
    '34':
      text: 'Kumo e la: Timnaf Sɛrah nɛ k wɔ Efrayim be abee be efuli so na.'
      sbs: 0.6519
      gen_sec: 3.18
      ref_sec: 5.48
    '35':
      text: Mo e daŋ kuŋ anyi ashi anyi be enite kikɛ to ashi efuli kama so nɛ an bɔla n choŋ.
      sbs: 0.641
      gen_sec: 3.99
      ref_sec: 6.58
    '36':
      text: Belubiworapoana ere, men ba nfe nɛ b ji menyi demu!
      sbs: 0.6358
      gen_sec: 3.01
      ref_sec: 4.76
    '38':
      text: Nuso nɛ anyeeŋ wora n tiŋ m pɔr egbal na n loge kabre?
      sbs: 0.6778
      gen_sec: 2.54
      ref_sec: 3.78
    '39':
      text: Gbiti be ndarbi alfa ashe nɛ b daŋ tɔ mbe gbaŋɛturko na be kekama nseŋ tɔ gbaŋɛ kama malɛ
        gbiti be ndarbi kalfa nɛ adunu.
      sbs: 0.6803
      gen_sec: 6.35
      ref_sec: 10.36
    '40':
      text: Ndegboŋana na be alambure to nɛ mbolpɔ fɔlbi nɛ mboe fɔlbi beeŋ ta ŋ ki amo be ejikpa a ji
        afitiri.
      sbs: 0.6506
      gen_sec: 5.12
      ref_sec: 8.88
    '41':
      text: Ma nɛ menyi beeŋ baa wɔtɔ nɛ m baa mɔlga menyi nsaa kuŋ menyi ekpa kama so.
      sbs: 0.6774
      gen_sec: 3.78
      ref_sec: 5.26
    '43':
      text: Bumo be kasawule na dese n ya luri Juda be yiri to ebi be kasawule to nna.
      sbs: 0.4508
      gen_sec: 4.48
      ref_sec: 4.68
    '44':
      text: saŋɛ so nɛ n wɔ ŋkpa to ere; saŋɛ na so mbe alelasheŋ.
      sbs: 0.6693
      gen_sec: 1.99
      ref_sec: 4.78
    '45':
      text: Gbiti nɛ shuwa na bre la fo kakɛ nna.
      sbs: 0.6034
      gen_sec: 1.0
      ref_sec: 3.0
    '47':
      text: Baa nyiŋi fanɛ fo basa e la anyi kikɛ, amoso wu anyi kuwɔr.
      sbs: 0.6395
      gen_sec: 2.82
      ref_sec: 4.92
    '48':
      text: nseŋ pɔr ebu jeŋgreŋ ko nɛ baaŋ baa yili so a keni kudɔ na.
      sbs: 0.6498
      gen_sec: 2.9
      ref_sec: 4.82
    '49':
      text: B daa kɔ ndegboŋ kuduanyɔ nɛ amo be ndewurbi.
      sbs: 0.6911
      gen_sec: 2.43
      ref_sec: 3.66
    '50':
      text: Eyiriana nɛ a wɔ kelargato be esoso be kaba so na ka kini kenu n sa ewura Rehoboam be asheŋ.
      sbs: 0.6826
      gen_sec: 3.77
      ref_sec: 7.22
    '51':
      text: Men baa ta kagbene ŋana asheŋ ŋ kraa kɔ a fin men be kumɔlga kikɛ be kenya.
      sbs: 0.6613
      gen_sec: 3.81
      ref_sec: 5.68
    '52':
      text: Ama ŋkpal eŋinipo na ka la enyiashempo so, e kraa ŋini basa asɔ nɛ mo ere nyi nna.
      sbs: 0.6334
      gen_sec: 4.03
      ref_sec: 7.24
    '53':
      text: Mo alɛ beeŋ naŋ sa menyi yuku bumo be bewura so nɛ men mɔ bumo nɛ esa maaŋ naa nyiŋi bumo
        be asheŋ gba kuraa.
      sbs: 0.6904
      gen_sec: 4.16
      ref_sec: 7.98
    '54':
      text: Enyɛnpetale Ebɔrɛ na bre bee wora kusɔ nɛ k daga nna a ŋini mbe keshi, nsaa ji mbe basa demu
        a lara mbe kecheembiya efuli.
      sbs: 0.6383
      gen_sec: 6.27
      ref_sec: 10.16
    '55':
      text: Ma e daa kɔ asɔbɔya a chɔ esa kama nɛ e juŋkpar ma ashi Jerusalɛm be kade to.
      sbs: 0.6513
      gen_sec: 3.86
      ref_sec: 6.1
    '56':
      text: Ewura Rehoboam e daŋ ta Mahalaf nɛ mo tuto daa la Jerimɔf nɛ e la ewura Deevid pibinyɛn na.
      sbs: 0.6509
      gen_sec: 4.32
      ref_sec: 7.94
    '58':
      text: B daŋ ta asɔbuuso kpɛatoso nna m buu nseŋ ta asɛbta wuso nɛ b tɛ amo n wɔtɔ.
      sbs: 0.6718
      gen_sec: 3.93
      ref_sec: 6.92
    '59':
      text: Manɛ nna nɛ n nio ta ma n deŋi mbe aya so.
      sbs: 0.4624
      gen_sec: 2.48
      ref_sec: 3.46
    '62':
      text: B daŋ nase nde nɛ b pɔr egbal ŋ kulti na atre popɔr nna.
      sbs: 0.6375
      gen_sec: 2.53
      ref_sec: 3.9
    '63':
      text: 'Kumo be kaman nɛ basa na bishi le: “Manɛ nna nɛ anyee kishi nɛ Enyɛnpe Ebɔrɛ na maa wu fanɛ
        anyee kishi?'
      sbs: 0.6612
      gen_sec: 5.34
      ref_sec: 8.36
    '64':
      text: B daŋ pɔɔ bumo so cheche nna hale Itiopiaebi na daa maŋ naŋ tiŋ nɛ b kɔ gba.
      sbs: 0.6595
      gen_sec: 3.88
      ref_sec: 5.84
    '65':
      text: Ma bɔrɛlambu beeŋ baa la kabɔrɛkule be kakpa n sa efuli kama so be basa.
      sbs: 0.6983
      gen_sec: 3.91
      ref_sec: 4.78
    '67':
      text: Israɛl be benapo na bre daŋ bɛta nɛ alenfia nna m ba Joshuwa kutɔ ashi Makɛda be keeyi to.
      sbs: 0.6686
      gen_sec: 4.44
      ref_sec: 6.66
    '68':
      text: Ebɔrɛ ka la mbe basa be ekumpo be asheŋ.
      sbs: 0.6452
      gen_sec: 0.32
      ref_sec: 3.22
    '69':
      text: Saŋkama nɛ men baŋ chɛrga echenakpa, Livaiebi na e naaŋ baa bɔɔ Enyɛnpe be wajɛbu na.
      sbs: 0.6607
      gen_sec: 4.49
      ref_sec: 5.46
    '71':
      text: ki kpakpa na be kaman baa teŋ mo so nna.
      sbs: 0.7895
      gen_sec: 1.09
      ref_sec: 3.04
    '76':
      text: daa maŋ naa kɔ shɛŋ nɛ b kaŋɛ Job na nɛ e nya agbo.
      sbs: 0.6854
      gen_sec: 2.26
      ref_sec: 3.6
    '77':
      text: Ndoŋ e daa la Juda be kelargato be kaseto be kaba so be kasawule be ekar.
      sbs: 0.645
      gen_sec: 3.78
      ref_sec: 5.22
    '79':
      text: Kachɛ nyɔsopo na gba kela koŋwule nɛ b daŋ nite ŋ kulti kade na pɔɛŋ nseŋ bɛta n yɔ bumo keeyi
        to.
      sbs: 0.668
      gen_sec: 4.99
      ref_sec: 7.14
    '80':
      text: Nɛ b kaŋɛ ma fanɛ basa nɛ b bɛta n yɔ Jerusalɛm na wɔ tɔrɔ nɛ awurfoŋ to nna.
      sbs: 0.679
      gen_sec: 3.8
      ref_sec: 5.96
    '81':
      text: Menyi be anya gba daga fanɛ b wushi nna fanɛ kananɛ menyee wushi na.
      sbs: 0.6823
      gen_sec: 3.4
      ref_sec: 4.64
    '82':
      text: nawule be bare nɛ menyee bir; men be mmalga malɛ kikɛ la efɛ nna.
      sbs: 0.6395
      gen_sec: 3.16
      ref_sec: 5.2
    '83':
      text: nɛ men teriana e fule menyi nseŋ pɔɔ menyi so.
      sbs: 0.6542
      gen_sec: 2.32
      ref_sec: 3.78
    '84':
      text: Ebɔrɛ, shin nɛ loŋ be kachɛ na e ki tentembiri plɔ.
      sbs: 0.6615
      gen_sec: 2.35
      ref_sec: 3.88
    '85':
      text: Fo e to anyi, amoso sa maŋ nya agbo ga n wɔtɔ anyi ŋko a nyiŋi anyi be alubi mbaanaayɔ.
      sbs: 0.7233
      gen_sec: 3.7
      ref_sec: 6.8
    '87':
      text: Kumo be kaman nɛ men chɔɔ bumo be agbirana na m mur.
      sbs: 0.6748
      gen_sec: 2.33
      ref_sec: 3.36
    '88':
      text: Men baŋ yige Enyɛnpe na nsaa shuŋ nnyamase na be agbir na bre, e beeŋ kilgi ŋ gberge menyi
        kusoe.
      sbs: 0.6338
      gen_sec: 4.67
      ref_sec: 6.34
    '89':
      text: Kasawule nɛ b ta n sa Dan be yiri to ebi na be asheŋ.
      sbs: 0.576
      gen_sec: 2.18
      ref_sec: 3.94
    '90':
      text: Kekule n fin Ebɔrɛ be kuwɔrwu be asheŋ.
      sbs: 0.6517
      gen_sec: 1.91
      ref_sec: 5.2
    '92':
      text: Efuli na gba be ketre maaŋ naa la Eche nɛ b kini n lɛ.
      sbs: 0.6681
      gen_sec: 2.77
      ref_sec: 4.1
    '93':
      text: Men baa nyi geeŋ fanɛ an ka daŋ ba menyi kutɔ na, mannɛ kafule be mmalga nɛ an daŋ bar.
      sbs: 0.6633
      gen_sec: 4.31
      ref_sec: 6.06
    '94':
      text: Amo nɛ asɔrso nɛ a walɛ ga na nɛ yabra popɔr nɛ ɔlif be ŋku.
      sbs: 0.7307
      gen_sec: 1.97
      ref_sec: 5.48
    '95':
      text: 'Ade be kaman, nɛ Enyɛnpe Ebɔrɛ naŋ kaŋɛ le: “Ma e naa leŋ menyi to a wushi menyi kagbene.'
      sbs: 0.6701
      gen_sec: 4.78
      ref_sec: 6.4
    '96':
      text: Jɛrikoebi daŋ ti egbal nɛ b pɔr ŋ kulti kade na be mbunagboŋana na kikɛ nna ŋkpal Israɛlebi
        na so.
      sbs: 0.6519
      gen_sec: 5.43
      ref_sec: 7.78
    '97':
      text: M maaŋ naaŋ nya agbo n wɔtɔ ma basa a wu bumo kulubi mbaanaayɔ.
      sbs: 0.6825
      gen_sec: 2.61
      ref_sec: 3.94
    '98':
      text: Amaziya daŋ lara mbe kumu nna n yili fanɛ e beeŋ shuŋ Enyɛnpe Ebɔrɛ.
      sbs: 0.6828
      gen_sec: 3.39
      ref_sec: 4.9
    '99':
      text: Le e naaŋ shin nɛ men nanabiana e sa maŋ tiŋ ŋ kaŋɛ an nanabiana fanɛ Enyɛnpe na la Israɛlebi
        nawule be Ebɔrɛ nna.
      sbs: 0.6501
      gen_sec: 5.72
      ref_sec: 8.46
    '100':
      text: Enyɛnpe Ebɔrɛ nɛ e bee ji kuwura Israɛl so.
      sbs: 0.6389
      gen_sec: 1.91
      ref_sec: 3.18
    '101':
      text: Ŋko menyee sha nna nɛ men pal kaman n sa Enyɛnpe Ebɔrɛ?
      sbs: 0.6621
      gen_sec: 2.79
      ref_sec: 3.78
    '103':
      text: Jemanɛ nɛ Enyɛnpe Ebɔrɛ daŋ malga Mosis kutɔ ashi kebeegboŋ nɛ baa tre Sainai na so na, Ɛɛrɔn
        daa kɔ mbinyɛnsobi ana nna.
      sbs: 0.6835
      gen_sec: 6.07
      ref_sec: 8.08
    '105':
      text: N daŋ kur atirbu nɛ baaŋ baa jɔ nchu amo to a wurge ndibi na so nna.
      sbs: 0.6712
      gen_sec: 3.42
      ref_sec: 5.12
    '106':
      text: Anyi be kenishi daŋ pere menyi so ga nɛ an yɛlga ga fanɛ an naŋ wu menyi.
      sbs: 0.6501
      gen_sec: 3.57
      ref_sec: 4.7
    '107':
      text: basa nɛ b shuŋ ŋ gben malɛ bee nya a wushi ndoŋ nna.
      sbs: 0.6592
      gen_sec: 2.58
      ref_sec: 4.44
    '111':
      text: Baa wora fo kagbene be aparsheŋ kanaŋkama nɛ fee sha.
      sbs: 0.6564
      gen_sec: 2.7
      ref_sec: 4.34
    '112':
      text: Jemanɛ nɛ Abija daa ji Juda be efuli so be kuwura na, Jeroboam daa maŋ naŋ nya eleŋ kikɛ.
      sbs: 0.6784
      gen_sec: 4.68
      ref_sec: 6.88
    '115':
      text: Baaŋ purge fanɛ afitiri nɛ a bee nya nchu nɛnɛ.
      sbs: 0.6594
      gen_sec: 2.22
      ref_sec: 3.98
    '116':
      text: Saŋkama anyee chɔrɔ Ebɔrɛ ga ŋkpal kananɛ men sɔ Ebɔrɛ be kubɔya nɛ an daŋ bar menyi na so.
      sbs: 0.6629
      gen_sec: 4.51
      ref_sec: 7.32
    '117':
      text: Fo ndegboŋ cheembiana na be kekama ki fanɛ keshishɛrsawule nna.
      sbs: 0.6451
      gen_sec: 3.78
      ref_sec: 4.7
    '118':
      text: nsaa maŋ naŋ shin nɛ b karga kumo n ti nchɛ so.
      sbs: 0.6608
      gen_sec: 2.2
      ref_sec: 3.22
    '119':
      text: Meeŋ shin nɛ men ta kɔnɔ nɛ n nase nɛ k kɔ tama na.
      sbs: 0.659
      gen_sec: 2.4
      ref_sec: 5.04
    '121':
      text: Ŋkpal manɛ so fo maaŋ tiŋ m pin fanɛ kachipurso peya na ŋko kaaseso peya na e naaŋ wora n
        lar tɔnɔ n sa fo.
      sbs: 0.6651
      gen_sec: 5.53
      ref_sec: 8.22
    '125':
      text: Men tama fanɛ le be ekishi beeŋ tiŋ n shin nɛ n nu menyi be kabɔrɛkule a?
      sbs: 0.6575
      gen_sec: 3.58
      ref_sec: 4.7
    '126':
      text: Nooba e daŋ kɔ n sɔ Kenaaf nɛ ndewurbi nɛ a kulti kumo na nseŋ ta mbe ketre Nooba n nase amo.
      sbs: 0.6479
      gen_sec: 4.75
      ref_sec: 10.52
    '127':
      text: Ajembu burtoso na shi ga n sa anyi nɛ an sulɔ n ya lɛ.
      sbs: 0.641
      gen_sec: 2.68
      ref_sec: 5.8
    '129':
      text: Mɛɛri pibi nɛ Jeems nɛ Josɛf nɛ Judas nɛ Saimɔn bumo da nna a?
      sbs: 0.6762
      gen_sec: 3.18
      ref_sec: 4.84
    '130':
      text: Esa pɔtɛ kama nɛ e pɛl n shuŋ bɔrɛmatapo be kushuŋ b mɔ mo.
      sbs: 0.6516
      gen_sec: 2.66
      ref_sec: 5.22
    '131':
      text: Esa kama maŋ ka nɛ e kaŋɛ fanɛ fo daga kasogberge a?
      sbs: 0.6638
      gen_sec: 2.66
      ref_sec: 4.16
    '132':
      text: 'Le be asheŋ ere nɛ e daŋ kaŋɛ bumo: “Men ba wora men be ashuŋ nɛnɛ ashi kabɔrɛŋana nɛ kashenteŋji
        be ekpa so.'
      sbs: 0.672
      gen_sec: 5.6
      ref_sec: 7.5
    '133':
      text: fanɛ bumo be kusɔ jiso kikɛ; befɔ malɛ maaŋ naŋ nya yabra nɛ fo gben.
      sbs: 0.6745
      gen_sec: 3.33
      ref_sec: 5.76
    '134':
      text: Anyi be alubi so, an du fanɛ afantaŋ wɔlso nɛ afu ber amo n ya lɛ nna.
      sbs: 0.6414
      gen_sec: 3.56
      ref_sec: 5.82
    '135':
      text: 'N daŋ nu Enyɛnpetale Ebɔrɛ na ka kaŋɛ le: “Nwu gboŋgboŋi lela ere kikɛ beeŋ ki alambure nɛ
        esa kikɛ maaŋ naa wɔ amo to.'
      sbs: 0.6598
      gen_sec: 5.93
      ref_sec: 9.14
    '136':
      text: Amoso anyi kikɛ naŋ bɛta n yɔ egbal na be kelɔŋɛ m pɔr to nna.
      sbs: 0.6301
      gen_sec: 2.49
      ref_sec: 4.2
    '139':
