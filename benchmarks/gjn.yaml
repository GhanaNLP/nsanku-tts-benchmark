      text: Esa pɔtɛ kama nɛ e pɛl n shuŋ bɔrɛmatapo be kushuŋ b mɔ mo.
      sbs: 0.6183
      gen_sec: 4.92
      ref_sec: 5.22
    '131':
      text: Esa kama maŋ ka nɛ e kaŋɛ fanɛ fo daga kasogberge a?
      sbs: 0.5837
      gen_sec: 4.6
      ref_sec: 4.16
    '132':
      text: 'Le be asheŋ ere nɛ e daŋ kaŋɛ bumo: “Men ba wora men be ashuŋ nɛnɛ ashi kabɔrɛŋana nɛ kashenteŋji
        be ekpa so.'
      sbs: 0.6215
      gen_sec: 9.96
      ref_sec: 7.5
    '133':
      text: fanɛ bumo be kusɔ jiso kikɛ; befɔ malɛ maaŋ naŋ nya yabra nɛ fo gben.
      sbs: 0.5929
      gen_sec: 7.2
      ref_sec: 5.76
    '134':
      text: Anyi be alubi so, an du fanɛ afantaŋ wɔlso nɛ afu ber amo n ya lɛ nna.
      sbs: 0.6232
      gen_sec: 7.12
      ref_sec: 5.82
    '135':
      text: 'N daŋ nu Enyɛnpetale Ebɔrɛ na ka kaŋɛ le: “Nwu gboŋgboŋi lela ere kikɛ beeŋ ki alambure nɛ
        esa kikɛ maaŋ naa wɔ amo to.'
      sbs: 0.6259
      gen_sec: 7.32
      ref_sec: 9.14
    '136':
      text: Amoso anyi kikɛ naŋ bɛta n yɔ egbal na be kelɔŋɛ m pɔr to nna.
      sbs: 0.6159
      gen_sec: 5.68
      ref_sec: 4.2
    '139':
      text: Joshuwa ka bee taga to Jɛriko na, epul to nɛ e wu kanyɛn ko ka yili mbe anishito a kɔ tokobi
        to.
      sbs: 0.6172
      gen_sec: 7.96
      ref_sec: 8.6
    '142':
      text: nseŋ wora kusɔ nɛ e kaŋɛ kenishipere so na kasonu.
      sbs: 0.6197
      gen_sec: 6.04
      ref_sec: 3.1
    '143':
      text: Kusɔ nɛ eche nɛ e kurge daga fanɛ e wora nna na.
      sbs: 0.6054
      gen_sec: 4.0
      ref_sec: 3.96
    '144':
      text: Basa na be bargato bee shuŋ nna nɛ bargato malɛ e keta bumo be ekpa a yil a kuŋ.
      sbs: 0.6668
      gen_sec: 11.2
      ref_sec: 6.3
    '145':
      text: basa nɛ fo mɔlga na nɛ b bɔla to n dii.
      sbs: 0.6263
      gen_sec: 3.6
      ref_sec: 3.36
    '146':
      text: nseŋ bɛta bumo nɛ eyiriana na kikɛ m ba abar so.
      sbs: 0.6152
      gen_sec: 2.32
      ref_sec: 3.36
    '147':
      text: 'Basa pɔtɛ beeŋ kaŋɛ le kukoko to: ‘N la Enyɛnpe Ebɔrɛ peya nna.'
      sbs: 0.6895
      gen_sec: 6.64
      ref_sec: 5.62
    '149':
      text: be asheŋ lubi e dii efuli nɛ ekama e pin amo.
      sbs: 0.6157
      gen_sec: 5.64
      ref_sec: 6.12
    '150':
      text: A beeŋ baa chicha fanɛ nchu ka bɛ edɛ so a falte na.
      sbs: 0.6112
      gen_sec: 4.68
      ref_sec: 3.44
    '151':
      text: Meeŋ sa fo kanyiasheŋ nɛ nfɛra nseŋ naŋ ta kedamaya nɛ amansherbi n ti fo so.
      sbs: 0.5958
      gen_sec: 7.16
      ref_sec: 5.3
    '153':
      text: Le be alubi ere daa beeŋ tiŋ m bar ma kasogberge.
      sbs: 0.615
      gen_sec: 4.24
      ref_sec: 3.48
    '154':
      text: 'Ndoŋ nna nɛ Pita kaŋɛ Yesu: “Eŋinipo, anyi be kebaawɔ nfe ere nyalɛ ga.'
      sbs: 0.5982
      gen_sec: 4.84
      ref_sec: 6.2
    '155':
      text: Esa nɛ e maŋ yirda Yesu Kristo na malɛ gba bɔ loŋ be esa.
      sbs: 0.6206
      gen_sec: 6.08
      ref_sec: 4.08
    '156':
      text: Enyɛnpe Ebɔrɛ na; nsaa malga emamachisheŋ.
      sbs: 0.5906
      gen_sec: 4.28
      ref_sec: 3.08
    '157':
      text: Amoso Eliaza nɛ Itama nawule e daa la bɔrɛmatapoana jemanɛ nɛ bumo tuto, Ɛɛrɔn daa wɔ ŋkpa
        to na kikɛ.
      sbs: 0.6333
      gen_sec: 9.88
      ref_sec: 7.14
    '158':
      text: Enyɛnpe Ebɔrɛ, bugi awɔlpa to nseŋ gbelge m ba nɛ kufu e pɛ abee nɛ a baa chicha.
      sbs: 0.5875
      gen_sec: 7.88
      ref_sec: 6.92
    '159':
      text: 'Ade kikɛ be kaman nɛ Elihu naŋ kaŋɛ: “Job, fo tama fanɛ fo maŋ wora kulubi kikɛ.'
      sbs: 0.6438
      gen_sec: 10.08
      ref_sec: 6.44
    '160':
      text: Simiɔn be yiri to ebi nɛ b la yiri nyɔsopo nɛ b chige kasawule n sa na be kasawule be kananɛ
        k dese nde.
      sbs: 0.6109
      gen_sec: 8.72
      ref_sec: 8.16
    '161':
      text: nɛ kefitiri bumbuŋ be ajembu lela nɛ baa tre jaspa na.
      sbs: 0.6148
      gen_sec: 6.0
      ref_sec: 3.9
    '162':
      text: Men sa maŋ kaa shuŋ bumo be agbirana, ŋkpal manɛ so, loŋ beeŋ tiŋ m bar menyi luwu.
      sbs: 0.6196
      gen_sec: 6.52
      ref_sec: 5.84
    '163':
      text: Ebɔrɛ baŋ lara efute na, epul to nɛ e wu.
      sbs: 0.6398
      gen_sec: 5.32
      ref_sec: 3.52
    '164':
      text: Teku nɛ baa tre Mɛditerenia na e daa la kasawule na be epeŋitɔrkpa be ekar.
      sbs: 0.5988
      gen_sec: 8.76
      ref_sec: 5.58
    '166':
      text: Amoso Mosis daŋ ta Giliad be kasawule na nna n sa Makiir be kabuna ebi nɛ b chena ndoŋ.
      sbs: 0.6096
      gen_sec: 9.28
      ref_sec: 6.52
    '167':
      text: Bumo koŋwule na malɛ e naaŋ baa yuu kumo kaplɛkama nɛ men ya chena.
      sbs: 0.6059
      gen_sec: 6.4
      ref_sec: 3.7
    '168':
      text: Judaebi na ka keni n wu fanɛ b kulti bumo n wɔtɔ na, nɛ b shu n tre Ebɔrɛ fanɛ e chɛ bumo
        to.
      sbs: 0.6024
      gen_sec: 10.04
      ref_sec: 7.12
    '169':
      text: Nɛ beyu ŋko besugepo daŋ ba fo to kanyɛso.
      sbs: 0.6109
      gen_sec: 4.68
      ref_sec: 3.16
    '170':
      text: Aloŋ nɛ b daa wora kachɛ kama m bɛ abar so hale ya fo nchɛ ashe.
      sbs: 0.601
      gen_sec: 8.56
      ref_sec: 5.56
    '171':
      text: Baa shi kaba kama so nna m ba kaa mel ma so.
      sbs: 0.6145
      gen_sec: 4.16
      ref_sec: 3.34
    '172':
      text: N shu nɛ ma anishi puŋi m puŋi; hale ma eyur to kikɛ bee besa ma.
      sbs: 0.6482
      gen_sec: 7.16
      ref_sec: 5.86
    '174':
      text: Ŋ ka maaŋ tiŋ ŋ kɔ n sa ma kumu ere gba.
      sbs: 0.6058
      gen_sec: 3.56
      ref_sec: 3.1
    '175':
      text: Nɛ mbe asɔbuuso fuli to parr a kpa edɛ.
      sbs: 0.6249
      gen_sec: 4.0
      ref_sec: 3.34
    '176':
      text: ” Kumo be lalaloge, enyiashempo nɛ ewulpo kikɛ sasa nna.
      sbs: 0.6412
      gen_sec: 6.72
      ref_sec: 4.22
    '177':
      text: Dimɛdi ko wɔtɔ nɛ e nu Ebɔrɛ, nɛ mo nawule la Ebɔrɛ ere, ka bɔla edɛ to m malga nseŋ ji efute
        a?
      sbs: 0.5962
      gen_sec: 9.28
      ref_sec: 8.64
    '178':
      text: 'ase a choŋ e sa maŋ kaŋɛ le: ‘Enyɛnpe Ebɔrɛ e nɛfa menyi!'
      sbs: 0.6292
      gen_sec: 3.28
      ref_sec: 4.84
    '179':
      text: Jehohanan e daa la enimu nyɔsopo m bɛ mo so nsaa keni benapo ŋgboŋ alfa anyɔ nɛ aduburwa so.
      sbs: 0.6184
      gen_sec: 9.32
      ref_sec: 7.52
    '180':
      text: Kusɔ kɔnto maa tiŋ a niŋi; b maa karga shɛŋ a ti asɔ nɛ e maŋ wɔtɔ so.
      sbs: 0.6285
      gen_sec: 6.6
      ref_sec: 5.76
    '181':
      text: be kekule nɛ fo maŋ nya kanyiti nsaa fin.
      sbs: 0.6214
      gen_sec: 3.36
      ref_sec: 4.06
    '182':
      text: 'Ama le nɛ Israɛlebi na daŋ kaŋɛ: “Manɛ so nɛ anyi nɛ menyi bee wora kɔnɔkoŋwule be ŋkre?'
      sbs: 0.647
      gen_sec: 9.52
      ref_sec: 6.6
    '183':
      text: ” Ndoŋ nna nɛ b bela ase nɛ b fara kushuŋ na.
      sbs: 0.6525
      gen_sec: 5.48
      ref_sec: 3.46
    '184':
      text: Kebia nɛ b kurge nɛ e laŋɛ maŋ kɔ tɔnɔ kikɛ; e bee shir tentembiri to nna, nɛ b teŋ mo so
        epul to.
      sbs: 0.589
      gen_sec: 9.64
      ref_sec: 7.4
    '185':
      text: Kashenteŋto, ma kenaŋ n sibɛ asheŋ koŋwule ere gbagba n sa menyi maŋ tir ma, kumo be loŋ malɛ
        e naaŋ chɛ menyi to gba.
      sbs: 0.5918
      gen_sec: 9.96
      ref_sec: 8.4
    '186':
      text: Enyɛnpe Ebɔrɛ na ki mbe basa Israɛlebi be ewura.
      sbs: 0.5929
      gen_sec: 4.84
      ref_sec: 3.54
    '188':
      text: Kusɔ nɛ fo kaŋɛ kenishipere so na nɛ baa wora kasonu.
      sbs: 0.5851
      gen_sec: 4.72
      ref_sec: 3.4
    '190':
      text: nɛ mbombi nɛ a wɔlto e ki bumo.
      sbs: 0.6506
      gen_sec: 3.64
      ref_sec: 3.26
    '191':
      text: ” Esa kama maa nyiŋi benyiashempo nɛ bewulpo be asheŋ.
      sbs: 0.5975
      gen_sec: 5.76
      ref_sec: 3.54
    '192':
      text: Amoso, Mosis, bɛta n yɔ n ya nu kusɔ kama nɛ Enyɛnpe, anyi be Ebɔrɛ na kaŋɛ nseŋ ba kaŋɛ anyi.
      sbs: 0.6455
      gen_sec: 9.68
      ref_sec: 7.66
    '193':
      text: Nɛ Okran pibinyɛn Pagiɛl nɛ e shi Ashɛr be yiri to na bar mo peya kachɛ kudukakosopo na.
      sbs: 0.6372
      gen_sec: 10.64
      ref_sec: 7.04
    '194':
      text: An daa naa sha kenaŋ bɛta n yɔ menyi kutɔ nna, ama Setani maŋ yige anyi kikɛ.
      sbs: 0.5848
      gen_sec: 7.44
      ref_sec: 5.76
    '195':
      text: Kusɔ kama nɛ k teŋ n wora kabre nɛ kumo nɛ k beeŋ wora echefoso kikɛ teŋ wora nna ŋ ku so.
      sbs: 0.6418
      gen_sec: 7.88
      ref_sec: 7.08
    '198':
      text: fo maaŋ shuli nɛ b pɔɔ ma so; fo alɛ beeŋ shin nɛ ma, nɛ n la.
      sbs: 0.6223
      gen_sec: 5.12
      ref_sec: 5.06
    '199':
      text: Jerusalɛm ki kelambure nna nɛ ekama maŋ naa wɔ kumo to.
      sbs: 0.6098
      gen_sec: 5.0
      ref_sec: 4.74
    '200':
      text: Men baa wora loŋ bre, Ebɔrɛ maaŋ wu menyi kulubi.
      sbs: 0.6515
      gen_sec: 4.92
      ref_sec: 3.16
    '201':
      text: Kusɔ ko wɔtɔ nɛ esa beeŋ tiŋ ŋ kaŋɛ fanɛ kumo alɛ naa la asheŋ popɔr a?
      sbs: 0.6044
      gen_sec: 5.88
      ref_sec: 4.54
    '202':
      text: be kusɔbɔya gbeyeso gboŋgboŋi na bee nyaŋɛ to.
      sbs: 0.6051
      gen_sec: 4.48
      ref_sec: 3.3
    '203':
      text: Ŋkpal an ka bee wora Enyɛnpe Ebɔrɛ be aparsheŋ so, E kuŋ anyi be ŋkpa ekpa kikɛ so.
      sbs: 0.5987
      gen_sec: 7.68
      ref_sec: 6.34
    '205':
      text: 'Eŋinipo na yɛ: “Shɛŋ shɛŋ maŋ kɔ kifi to!'
      sbs: 0.6126
      gen_sec: 4.04
      ref_sec: 3.14
    '207':
      text: Nɛ kabuna kama nɛ meeŋ lara na e yili kanaŋ kanaŋ so.
      sbs: 0.58
      gen_sec: 5.48
      ref_sec: 3.18
    '208':
      text: Shin nɛ kachɛ na be kachipurso be kechɛkpabi e biri to.
      sbs: 0.658
      gen_sec: 5.24
      ref_sec: 3.8
    '209':
      text: Enyiashempo be mmalga du fanɛ ketirbu chiŋgeliŋ to be nchu.
      sbs: 0.6188
      gen_sec: 5.72
      ref_sec: 3.82
    '210':
      text: Kudur kikɛ maŋ wɔtɔ nɛ k tiŋ n chɛ ebesa nɛ doro nɛ a wɔ fo to ere.
      sbs: 0.5978
      gen_sec: 5.6
      ref_sec: 5.56
    '211':
      text: 'nsaa sha fanɛ durnya to be basa kikɛ e nu nde: “Kaŋɛ basa nɛ b wɔ Jerusalɛm to fanɛ.'
      sbs: 0.618
      gen_sec: 8.72
      ref_sec: 5.6
    '212':
      text: E daa la kanyɛn nɛ baa tre Barakɛl nɛ e shi Buz be kasawule so nseŋ shi Ram be kabuna na pibinyɛn
        nna.
      sbs: 0.6181
      gen_sec: 8.56
      ref_sec: 9.76
    '213':
      text: 'Le nɛ Mosis kaŋɛ a laŋɛ Juda be yiri be kaplɛa so: “Enyɛnpe Ebɔrɛ, nu Juda be yiri to ebi
        be kushu.'
      sbs: 0.6114
      gen_sec: 9.64
      ref_sec: 7.76
    '214':
      text: nɛ b kɔrfɛ menyi nseŋ shin nɛ men dese agbembi so.
      sbs: 0.6189
      gen_sec: 5.24
      ref_sec: 3.56
    '215':
      text: '” Kumo be kaman nɛ ma alɛ sa mo ebɔl nseŋ kaŋɛ mo le: “Kashenteŋ maŋ wɔ kusɔ nɛ fee kaŋɛ
        ere to kikɛ.'
      sbs: 0.5872
      gen_sec: 10.28
      ref_sec: 6.78
    '217':
      text: Nɛ ewura Bɛnhadad shuli kusɔ nɛ Asa kaŋɛ na nseŋ shuŋi mbe benapo nɛ bumo be benimu fanɛ b
        ya kɔ Israɛl be ndegboŋana na.
      sbs: 0.5808
      gen_sec: 10.6
      ref_sec: 9.88
    '219':
      text: 'Nɛ b kaŋɛ: “Mm, anyeeŋ tiŋ.'
      sbs: 0.5872
      gen_sec: 2.88
      ref_sec: 8.5
    '221':
      text: yili saŋɛ be sososo n ya fo kumo be lalaloge.
      sbs: 0.6207
      gen_sec: 5.68
      ref_sec: 3.94
    '222':
      text: E daa lɔlɔ Jehoshafat nna nɛ e tu mo n ya kɔ Ramɔfebi nɛ b wɔ Giliad be kasawule so na kena.
      sbs: 0.6049
      gen_sec: 8.56
      ref_sec: 9.08
    '223':
      text: ashi efuli pɔtɛ ko kutɔ, ama anyi be tama ki fuloŋ; ŋkpal manɛ so, efuli na maŋ tiŋ n chɛ
        to m mɔlga anyi.
      sbs: 0.6352
      gen_sec: 9.96
      ref_sec: 9.04
    '224':
      text: Hale nɛ Kohafebi na luri wajɛbu na to n ya tu bɔrɛmatapoana na nɛ b kraa buu asɔ cheembi na
        gba, baaŋ wu.
      sbs: 0.6052
      gen_sec: 10.04
      ref_sec: 8.72
    '225':
      text: Enyɛnpe na e naa mɔlga bumo; ashi alubiworapoana be enɔ to.
      sbs: 0.6149
      gen_sec: 5.8
      ref_sec: 4.44
    '226':
      text: Bekurgepoana, men gbagba nyi fanɛ anyi be kebɔɔso nɛ an bɔɔ menyi so na maŋ la kebɔɔso fuloŋ.
      sbs: 0.6355
      gen_sec: 9.68
      ref_sec: 7.1
    '227':
      text: Ashɛr be yiri to ebi e daa la yiri nusopo nɛ b chige kasawule na n sa.
      sbs: 0.598
      gen_sec: 8.56
      ref_sec: 5.44
    '228':
      text: Kasawule nɛ b ta n sa Ashɛr be yiri to ebi na be asheŋ.
      sbs: 0.6207
      gen_sec: 5.68
      ref_sec: 4.46
    '229':
      text: Ma ere nɛ ma laŋ to ebi bre beeŋ shuŋ Enyɛnpe Ebɔrɛ na.
      sbs: 0.6213
      gen_sec: 5.48
      ref_sec: 3.74
    '230':
      text: ashi bumo be abee nɛ a wɔtɔ dra dra kikɛ na ase.
      sbs: 0.5503
      gen_sec: 5.16
      ref_sec: 3.12
    '231':
      text: ŋkpal b ka maŋ naa kɔ shɛŋ nɛ b kaŋɛ fo so a?
      sbs: 0.6478
      gen_sec: 4.16
      ref_sec: 3.1
    '232':
      text: E beeŋ foŋ kafoli nna n tre bumo nɛ b nya manaŋ n shi durnya be lalaloge kikɛ m ba fanɛ afu
        na!
      sbs: 0.6164
      gen_sec: 6.96
      ref_sec: 7.52
    '233':
      text: Ŋkpal loŋ so, men baa nyiŋi fanɛ Enyɛnpe menyi be Ebɔrɛ na nawule e la Kashenteŋ be Ebɔrɛ
        nsaa la Kashenteŋjipo.
      sbs: 0.6143
      gen_sec: 9.88
      ref_sec: 8.18
    '234':
      text: Ndoŋ nɛ meeŋ ya dese a di fanɛ bewura.
      sbs: 0.6207
      gen_sec: 3.72
      ref_sec: 3.68
    '235':
      text: N la Hibruw kashenteŋto nna, ŋkpal manɛ so, n tuto nɛ n nio kikɛ la Hibruwebi nna.
      sbs: 0.6248
      gen_sec: 8.32
      ref_sec: 6.38
    '236':
      text: Ama feeŋ wora shruum ŋ kplaŋ anyi nɛ an baa wɔ kasogberge nɛ k shi m pɔɔ anyi so ere to a?
      sbs: 0.6097
      gen_sec: 6.4
      ref_sec: 9.32
    '238':
      text: A daga fanɛ anyi nɛ an kɔ kebɛso ere to be kenimufɛra ere e baa kɔ asheŋ nɛ n teŋ kaŋɛ ere
        be nfɛra loŋ.
      sbs: 0.6179
      gen_sec: 9.4
      ref_sec: 9.56
    '239':
      text: Le be asheŋ ere e naaŋ shin nɛ b nya asɔ nɛ baaŋ fute n yige so kachako so.
      sbs: 0.6228
      gen_sec: 7.68
      ref_sec: 6.42
    '240':
      text: Ebɔrɛ beeŋ yili kusɔ kama nɛ an wora so n ji anyi demu, hale asheŋ lubi ŋko asheŋ lela nɛ
        an wora ashiri to gba.
      sbs: 0.6075
      gen_sec: 9.92
      ref_sec: 10.98
    '241':
      text: nseŋ yili kushu keli nɛ keji eyur be saŋɛ.
      sbs: 0.5993
      gen_sec: 4.04
      ref_sec: 3.36
    '242':
      text: Ebɔrɛ gbagba kutɔ nɛ n nya le be kenyi ere.
      sbs: 0.6424
      gen_sec: 5.24
      ref_sec: 3.22
    '243':
      text: 'Nɛ Yesu kaŋɛ mo: “Men shin nɛ an bela mbia pɔɛŋ.'
      sbs: 0.6156
      gen_sec: 3.04
      ref_sec: 3.34
    '244':
      text: Ndegboŋ kuduashe nɛ amo be ndewurbi e daa wɔ kasawule na so.
      sbs: 0.6207
      gen_sec: 5.56
      ref_sec: 4.24
    '245':
      text: B daŋ pɔr egbalana nna n wɔtɔ amo mbunagboŋ nɛ abersobi ŋ kulti nde na kikɛ n wɔtɔ.
      sbs: 0.6209
      gen_sec: 9.2
      ref_sec: 7.58
    '246':
      text: Baaŋ baa du fanɛ ndibi nɛ Enyɛnpe Ebɔrɛ gbagba duu nna.
      sbs: 0.605
      gen_sec: 5.52
      ref_sec: 3.96
    '247':
      text: Nɛ fanɛ n daŋ foe ekpa wora kusɔ ko nɛ k maŋ niŋi.
      sbs: 0.5974
