        puuni bee ti ni yɛn tooi niŋ shɛm gu ti maŋa. Lala maa be niŋdi ti nyaɣisim.
      sbs: 0.6557
      gen_sec: 14.97
      ref_sec: 18.62
      cer: 0.0697
      wer: 0.2909
    unicef_00005:
      source: unicef
      text: Nsaɣiti ni taɣada nyɛla di ni niŋ dawama ti ʒinɛlipuuni, amaa di ni nyɛ taɣada maa be wuhi
        ti ni di nyɛla di ni viɛli ti ti biɛhigu bee fukumsi zalisi saɣitili. bɔ nlee nye fukumsi zalisi?
      sbs: 0.6399
      gen_sec: 10.77
      ref_sec: 20.29
      cer: 0.1477
      wer: 0.5676
    unicef_00006:
      source: unicef
      text: Saha shɛŋa di niŋdi ba mi ka bi yihi ban labi, ka di nyɛla bin niŋ nimmɔhi tumda tuma la zuɣu.
        Ti ni tooi wuhi ba ti ni bɔhim bin shɛŋa kpe, ka ku ŋmani bi yihi la ban nua. Ka bipuɣiŋ shɛba
        naawuni ni dahim la mi? Saha shɛŋa bi gaŋdi ba mi. Mbɔri ni kpaŋ mmaŋa n tum n yiko tariɣa.
      sbs: 0.6487
      gen_sec: 15.52
      ref_sec: 36.1
      cer: 0.1887
      wer: 0.3968
    unicef_00007:
      source: unicef
      text: Punpɔŋɔ, yɛlim ma, a tiɛh'ya ni jilma bɛni zaŋ jandi paɣaba ni dabba a shukurini? Saha shɛŋa,
        iin, amaa saha shɛŋa dabba ma tiɛh'la bɛni tooi ku yɛli bɛni bɔri shɛm n ti paɣaba, ka paɣaba
        maa simsi ni bɛ ku dɛi li lala
      sbs: 0.6518
      gen_sec: 11.84
      ref_sec: 22.27
      cer: 0.1437
      wer: 0.6364
    unicef_00008:
      source: unicef
      text: N zaɣisirila bindirigu ka chɛni kan tiŋsi n ti zaŋ di n chɛngi bihi n gmaari beti, n ni ʒini
        n tɛhi di zugu n daa tɛhimi ni so soma ka mani mi shɛm maa a maa din koli dirima ka di diri ma
        n gari ni dirili shɛm da baa ayi ŋɔ sunsuuni.
      sbs: 0.6054
      gen_sec: 12.79
      ref_sec: 36.16
      cer: 0.1067
      wer: 0.4259
    unicef_00009:
      source: unicef
      text: Nzonima yɛliya ni di yi niŋ, ka a ka mam bee ka na ʒi n-gɔli paɣa, ni ka doo n nyaa. Amaa
        din niŋdi ma muɣisigu nyɛla, ayi kpuɣi pushɛli ayi bi bɔra, bee ka gbaai STIs. Saha shɛŋa di niŋdi
        ma ka n ka so n ni yɛn yɛliti ka o ni wum ni yɛli shɛm maa ka ku kari ma sariya
      sbs: 0.6021
      gen_sec: 13.91
      ref_sec: 36.67
      cer: 0.0653
      wer: 0.381
    unicef_00010:
      source: unicef
      text: N kuli bɔri mi ni n che diɛma maa zaazaa. Inn, shɛlini yiŋa, n bɔri ni n tooi lɛbi ya bimaŋli
        n sɔŋdi n ma, amaa shɛli ni n zo nima ni kana n ti yɛli ni ti yima n mii ni chaŋ n kpɛrila mʋɣisigu
        ni ka ku lahi ka ni yɛn niŋ shɛm, shɛli di chɛmi ka di ŋmanila nkuli labila nyaaŋa zaazaa
      sbs: 0.6422
      gen_sec: 15.77
      ref_sec: 24.38
      cer: 0.0748
      wer: 0.4308
    unicef_00011:
      source: unicef
      text: N suhu ŋuo ri mi bɛ tiniŋ yɛli ni n zaŋmi n zaɣa niŋ paɣa ni simsi ni o niŋ binyɛri shɛŋa,
        kaman ka a duɣ' ni salinvɔɣu ʒiɛri bɛi ka a sɔŋ ni zahama maa. A tiɛh'ya ni bɛ wumti ma? Amaa
        saha shɛŋa di ŋmanla kaya ni taɣada maa kuɣa ka bɛ zaŋ mali li
      sbs: 0.6721
      gen_sec: 13.55
      ref_sec: 24.26
      cer: 0.086
      wer: 0.3684
    unicef_00013:
      source: unicef
      text: Ka diyi niŋ ka manii be kana n ti shihi galli maa, kadalaa di wuhirimi kamani di kuli ŋmanila
        duu ka a kɔlikɔli nee n guli saha shɛli dabam. Di na ku che ka vi mali ma. N be bɔri ni dabba
        maa baŋ di yɛla, n zo yɛlima mi ni di ni tooi paai bakɔi muni, yɛlimaŋli n nyɛli?
      sbs: 0.6303
      gen_sec: 15.19
      ref_sec: 25.54
      cer: 0.1078
      wer: 0.4667
    unicef_00014:
      source: unicef
      text: N yaɔɔb paɣa daa yɛli ka dabiɛm gbaa ma pam, ni tooi yɛli n yab paɣa ni n je? Binshegu kam
        bɛla di ko ka che niri tɛhiri shɛm, koli nyɛma wula ka n yɛn niŋ. Tɔ n paɣiya mperiba.
      sbs: 0.6369
      gen_sec: 10.04
      ref_sec: 28.48
      cer: 0.1504
      wer: 0.4
    unicef_00015:
      source: unicef
      text: Kaman bɔ, man kuli tɔɣ'sirimi ni zo nima, n wumbi yɛltɔɣa amaa m bɛ zaŋ n zuɣu zaa niŋ dinni.
        Ɛ yɛrimi ni n yi tɔɣ'sir tiri nin palli ni na kuli nya n ni tooi yɛli o n ni bɛ luɣ'shɛli bɛi
        n ni chani shukuru luɣ'shɛli, lala maa bɛ viɛla?
      sbs: 0.657
      gen_sec: 13.06
      ref_sec: 21.18
      cer: 0.1193
      wer: 0.5
    unicef_00016:
      source: unicef
      text: Di chɛmi ka n tamdi binshɛɣu kam yɛla, n kuri saha gbaliŋ niŋdi nahin gbana buɣisi pa Takara
        zuɣu, n min tiɛhi di yɛla, n zo nima larima mi di zuɣu bɛ tiɛhi mi ni bihi bɛi ban ka tuma n niŋdi
        lala binyɛra.
      sbs: 0.6439
      gen_sec: 10.83
      ref_sec: 21.76
      cer: 0.1139
      wer: 0.3636
    unicef_00017:
      source: unicef
      text: N yi wumdi la bachi maa amaa n daa bi tɛhi ni n-ŋɔ n yɛn nyɛli. di ŋmanila n niŋbuna yi pa
        kuli niŋdila di ni bɔri shɛm ka di pa ni mani n yɛrili ni di niŋ, shɛlini hali n min kuli ʒi class
        n be niŋdi shɛli ka di yiɣisira
      sbs: 0.5861
      gen_sec: 11.92
      ref_sec: 18.24
      cer: 0.0719
      wer: 0.3654
    unicef_00018:
      source: unicef
      text: N nye ka so ti ma satarili n niŋ di ka di gmanla o borimi ni o laɣi ma la, o daa koli buhiri
        mi ni o baŋ ni be shɛli polo bɛi ni chɛni shikuru shɛli polo, di daa gbaa ma dabiɛm pam ka che
        n daa zorila dabiɛm ni yɛli n laamba be daa nai dɛy phone maa.
      sbs: 0.5777
      gen_sec: 12.16
      ref_sec: 30.21
      cer: 0.1436
      wer: 0.4167
    unicef_00019:
      source: unicef
      text: N tiɛhi ya ni niriba pam ban be kpe bi mi di yɛla. A ni tooi kana ti yɛli paɣisara ni nachimba
        laɣingu ban be cheechi ŋɔ ni?  Bi ni wum n ti a?  N bɔrimi ni n-zonima sa mali biɛhi suŋ. Ti yɛlima
        zaŋ kpa STIs gba polo? Paɣisara ŋɔ shɛba zɔri dabiɛm ni bi bɔhi bɔhigu.
      sbs: 0.6139
      gen_sec: 15.05
      ref_sec: 33.41
      cer: 0.115
      wer: 0.3966
    unicef_00020:
      source: unicef
      text: "Be yɛromi ni o ko tooi chanŋ shikoru o siɣimi koliga ka doɣmi n tiri dun doŋ saha kam. Bi\
        \ poɣinsi maa pam ko li bɛla lala ka be zaŋ bi dibbisi n tohi sikuruti. \tBei ka bi chaba ka chaŋ\
        \ gmeri bɔlli, n tihiya kali maa ni ku nye sham n ba la."
      sbs: 0.6239
      gen_sec: 12.56
      ref_sec: 36.99
      cer: 0.1713
      wer: 0.6481
    unicef_00021:
      source: unicef
      text: Di ŋmanla n yi sɔɣi n muɣisugu, di so ni n yihi li palo ni, ka chɛ di chɛ ka n ŋmanla chɔɣinsi
        daadam n nyɛma, di chɛmi ka di ŋmanla taɣibu shɛli di bɛ n niŋ gbuna mini n hankali ni ŋmanla
        bilim, ti ya nima maa yɛrimi ni ti tibli n kpɛma, ni ti nima bi pala ni ti nyɛla nagban kpɛini
        nima.
      sbs: 0.629
      gen_sec: 15.31
      ref_sec: 25.6
      cer: 0.1416
      wer: 0.4923
    unicef_00022:
      source: unicef
      text: N ku tooi gbɛhi, n niŋdi ma tɔm ni ntooi zaŋ n zaɣa niŋ shukuruni, lala tooi niŋdi bi puɣin
        shɛbi gba? Di ŋmani la n konko n nyɛma, n yi yihi o polo ni, n daŋ nyɛla ban yɛn yihi ma bɛ daŋ
        ni? Sokam yɛn yɛli mi ni ninvuɣu biɛɣu n nyama domin n ni yɛli yɛl' tɔɣ' biɛri m pa n ŋahabi la
        zuɣu
      sbs: 0.6412
      gen_sec: 15.52
      ref_sec: 28.42
      cer: 0.1449
      wer: 0.4478
    unicef_00023:
      source: unicef
      text: Di ŋmanla n pa bila doo, di mi lahi ŋmanla bia n na nyɛma saha shɛŋa, m paɣaya n ni mali luɣ'shɛli
        palo n ni tooi di fiila, di chɛrimi ka n baŋ ni ka n kɔ nyɛma, M malila bɔhigu zaŋ jandi biɛhigu
        halli, wula ka n yɛn niŋ baŋ din bɔŋɔ nyɛla n dini ka din bɔŋɔ nyɛla n laam bi dina?
      sbs: 0.6425
      gen_sec: 14.87
      ref_sec: 30.91
      cer: 0.181
      wer: 0.5156
    unicef_00024:
      source: unicef
      text: Antirɛ, M piriba, Alaafiɛ biɛni, N tiɛh' ya, shukuru mini yiŋ tuun shɛli din pun biɛni maa
        n ku biɛni, yɛlmaŋli yɛra n tiɛh rili alizam shɛŋa tin yi pun di dokulo din gar' la, zaŋ jandi
        din simsi ni nyin bidibila yi zoori na din ni tu ni a bɛ shɛm
      sbs: 0.623
      gen_sec: 14.09
      ref_sec: 24.96
      cer: 0.1436
      wer: 0.5385
    unicef_00025:
      source: unicef
      text: N tɛhiya ni n yi pa gbaara, bɛhigu dii be tu ni di dɔya pasi hali ni zʋɣʋsaa, di tuu? N yi
        no wahu di be tu ni o che, di tirimami yaa, di ni tooi niŋ ka n ni tooi gbibi pressure viɛnyɛla
        di yi niŋ ka n mali ŋɔ zaa n hankali ni.
      sbs: 0.6262
      gen_sec: 11.45
      ref_sec: 20.93
      cer: 0.1078
      wer: 0.3455
    unicef_00026:
      source: unicef
      text: Niraba pam tiɛh'mi ni paɣa niŋdi a ni bɔri shɛm ka wumdi a yɛltɔɣa dini n nyɛ dabilim. Di
        ŋmanla zo karili dubu, n bɔrimi ni n yɛli n yili kpɛri lan nima ni ka bɛ taali n nyɛli ban dɛi
        yi zaŋ bɛ maŋ kpɛhi yala ni, yɛlmaŋli n nyɛli ni bia gbaa ti doo nyɛla Zali kpana ni bɛ saɣ'ti
        sheli? Ka Yuma a la n simsi ni bia nyɛ ka bɛ naan tooi gbaagi o ti doo?
      sbs: 0.6387
      gen_sec: 8.09
      ref_sec: 36.61
      cer: 0.9283
      wer: 0.975
    unicef_00027:
      source: unicef
      text: Bipola koli nyun nyula dam n tam be tuma yala , n tahiri la zaba na, saha shɛŋa ka bi zaŋ
        be kobbihi zaa niŋ dam nyubuni din di tu di be zaŋ n da bindirigu bei n yor shikuru feesi, di
        zaŋ di vi ni moɣisigu na daŋ puu ni.
      sbs: 0.6064
      gen_sec: 11.82
      ref_sec: 38.14
      cer: 0.0964
      wer: 0.5
    unicef_00028:
      source: unicef
      text: Bɛ zaa niŋdi mi ka di ŋmanla bɛ malila kpɛŋ, a maa m bɛ tiɛh' ni lala n nyɛli bɛ suhurini,
        m bɔrimi ni n nyɛ ninvuɣuso ŋun ni tooi taɣ' lala bin maa, hali di yi nyɛ n yiŋ kɔnkɔ, n suhu
        pa ʒinya punpɔŋɔ
      sbs: 0.6718
      gen_sec: 10.87
      ref_sec: 24.32
      cer: 0.1467
      wer: 0.4783
    unicef_00029:
      source: unicef
      text: N tiɛhi ya ni o ni yɛn dihi tabili ni dabba tu ni bi niŋda ingineenima tuma la, bee fitanima,
        ka paɣaba mi tu ni bi niŋdi adeela tuma bee, viɛlim tuma. iin hi pa lala amaa sokam yɛra mi ni
        lala ka ti niŋdi binyɛhiri ti tiŋgbani ŋɔ ni. N tiɛhi ya ni din n yɛn gbibi ti yaŋɔ.
      sbs: 0.6087
      gen_sec: 15.25
      ref_sec: 27.14
      cer: 0.0817
      wer: 0.4
    unicef_00030:
      source: unicef
      text: Dasiba Kofi, kawula ka a nyɛ dabisili maa di ku tuli la biɛla bee ka laa? Dasiba m-bapira
        iin, wuntaŋ maa mali yaa pam zuŋɔ, di ni dii niŋ ka n chaŋ yi yaŋɔ yaɣi dimbala maa na. A gɔrim
        ŋɔ niŋ ma nyaɣisim pam.
      sbs: 0.6115
      gen_sec: 11.41
      ref_sec: 24.83
      cer: 0.1329
      wer: 0.4444
    unicef_00031:
      source: unicef
      text: N daa bɔ ri ni n yɛli ba ni bi cha la, di zaa yɔli ka bi ku li ti ri ma la satara ŋɔ. a maa
        puŋ puŋɔ di ku li ŋmanla n sɔɣi ma. Di ku ka taa li ni di niŋ da la la. Da ma sɔɣi bu ku taɣi
        li, a tiɛ hi a ni bɔri ni a niŋ shɛm di ŋɛn ɣa?
      sbs: 0.646
      gen_sec: 10.91
      ref_sec: 36.35
      cer: 0.236
      wer: 0.7015
    unicef_00032:
      source: unicef
      text: Antire m-piriba, di so. Di ku nyɛla wumsim biɛla n-ni yi shikuru maa na. iin. Mma di biɛla,
        amaa yɛlimaŋli yɛra, di gbaai ma vi. Niriba ban be ti tiŋkpaŋ ŋɔ yɛra mi di nyɛla di lahinli di
        yi ti niŋ ka bipuɣiŋga yɛn bi paɣa. Amaa bi lahi yɛlimi di tu ni ti sɔɣi li.
      sbs: 0.6449
      gen_sec: 13.79
      ref_sec: 28.16
      cer: 0.096
      wer: 0.375
    unicef_00033:
      source: unicef
      text: N bɔrimi ni n sɔŋ o, amaa dabiɛm n mali ma ni ni yɛli dabba maa ni tuma ka bɔlima yuya. Bo
        ka n ni tooi niŋ, di gmanila n nyɛla bia zaŋ chaŋ be polo, aayi mpiriba bo n lee bala, ninkura
        konko beni n nyɛli, tangalimia n bala?
      sbs: 0.6447
      gen_sec: 11.94
      ref_sec: 23.74
      cer: 0.1071
      wer: 0.48
    unicef_00034:
      source: unicef
      text: Saha shɛli kam n yi chaŋ n gari o kariŋ duu, bee n yi zaŋ tuma, o yɛri la yɛltɔɣa zaŋ chaŋ
        n ni yuunda shɛm. O yɛri la yɛltɔɣa din yɛn che ka n niŋgbuŋ gbaŋ nyiɣiti. O yɛrimi ni mpa biri
        la paɣa yomyom shɛm maa. Ni ka di tu ni mpa zaŋ zaɣa niŋ o ni, ka che m bukunima.
      sbs: 0.6509
      gen_sec: 14.79
      ref_sec: 24.51
      cer: 0.0653
      wer: 0.3968
    unicef_00035:
      source: unicef
      text: Di yi niŋ ka n bi tooi niŋli, ni dini tooi chɛ ka n-bi liɛbi yili yidan paɣa suŋ, ni di gurila
        paɣa ka chɛ ka o za dede, ni do yihirila yɛli biɛri paɣa maa ni, yɛlmaŋli n nyɛ li? Maame, di
        shiri ni chɛ ka n za dede?
      sbs: 0.6313
      gen_sec: 11.11
      ref_sec: 21.38
      cer: 0.057
      wer: 0.36
    unicef_00036:
      source: unicef
      text: Saha shɛŋa wumsim gbaarima ka nti baŋ ni m mini mma na bɛ di alizama yuŋ zaa ha dama n dɔla
        n telephone zuɣu, di yɛliya ni di wuhi so a ni bɛ shɛli bɛi a yiŋ dundɔŋ ni, n tiɛh'ya ni n gbaai
        baŋsim lala yɛltɔɣa maa ni lala san' maa sani tɔ chɛ ka n nya
      sbs: 0.6092
      gen_sec: 13.05
      ref_sec: 29.89
      cer: 0.0947
      wer: 0.3103
    unicef_00037:
      source: unicef
      text: N yi lihi duniya pumpɔŋɔ, ka n yi biniyɛra ka di ahadalichi, ka man fara din be ʒilɛli ŋɔ
        ni, ka mbɔri ni bɔ maligu tili. Di yi niŋ ka buɣisi ni n yɛli mba ba zaŋ kpa lala binɣɛra ŋɔ polo,
        o kuli yɛn yɛlima mi ni chɛla ni ka meei gi nnina kpa bukunima ni ka che hankali kalinsi yɛltɔɣa
        ŋɔ.
      sbs: 0.6346
      gen_sec: 16.46
      ref_sec: 37.95
      cer: 0.095
      wer: 0.4603
    unicef_00038:
      source: unicef
      text: A tiɛh'ya ni a mali lahabali zaŋ jandi a ma maŋ alaafɛi zuɣu? Bɛi taɣibu shɛŋa din taɣ'ri
        a niŋ gbuna maa ni? N bɛ tiɛhi, ti wumdi binyɛra pala zuɣu. A wumli? Amaa ti bɛ mi dinsani n nyɛ
        yɛlmaŋli mini din kuli nyɛ yɛltɔɣa. N nyɛ lala.
      sbs: 0.6025
      gen_sec: 12.8
      ref_sec: 26.37
      cer: 0.0904
      wer: 0.3673
    unicef_00039:
      source: unicef
      text: Di yi pa so Maame, amaa yɛlimaŋli yɛra di ŋmanila binyahiri yi pa kpela yɔɣʋ punpɔŋɔ, di mii
        kuli yila yiŋ tumani na n ni ntizopaɣa Ama. Mba yɛrimami ni n di kpɛri duduhugu ni dɔmini bidibisi
        be tu ni be kpɛri nimaa ni.
      sbs: 0.6638
      gen_sec: 11.41
      ref_sec: 15.94
      cer: 0.157
      wer: 0.6364
    unicef_00040:
      source: unicef
      text: Ni ni be niŋli di yɛn chɛmi ka nti pa paɣa suŋ biɛɣu ni, ni di yɛn chɛmi ka n kuli za n tuhi
        n yidana dama di yɛn yihila daɣiri kam, yɛlimaŋli nyɛli Maame? yɛlimaŋli nyɛli ni di shiri yɛn
        chɛmi ka n zani tuhi n yidana?
      sbs: 0.666
      gen_sec: 12.14
      ref_sec: 20.74
      cer: 0.1317
      wer: 0.4792
    unicef_00041:
      source: unicef
      text: N tɛhiya ni di tu ni n sɔɣi n yɛlmʋɣisira dama n be bɔri ni di gmanila n nyɛla ŋʋn ka yaa,
        di chɛmi ka taɣibu di ni be n niŋgbunani ni n hankalini maa gabiri taba. Niriba ban be n fɔŋni
        yɛliya ni ti kuli nyɛla biyɛrisi, be yɛliya ni nachimba ni paɣasara nyɛla ban kuli bɔri nangbankpeeni.
      sbs: 0.6547
      gen_sec: 13.75
      ref_sec: 25.15
      cer: 0.1372
      wer: 0.4576
    unicef_00042:
      source: unicef
      text: Hali n yi tooi sɔɣ'zo, n ka laɣ'fu din yɛn yo loori zuɣu zaŋ ma paai ti yaŋɔ ashibti tital
        maa ni, biɛhigu chaŋmi ti ŋmani so n taɣ'ri ti ni ti di nyɛ sɔŋsim shɛli tini bɔra di laha ŋmanla
        ashishɛli ninkura kɔnkɔ ni mi, ka di yi niŋ ka n tooi paa ni?
      sbs: 0.6313
      gen_sec: 13.9
      ref_sec: 24.7
      cer: 0.1005
      wer: 0.3273
    unicef_00043:
      source: unicef
      text: Bi niŋsim ŋɔ ŋmanila binyɛra ŋɔ nyɛla din chihira, ka di ka shɛli di yi niŋ ka di muɣisi a,
        bee ka a yi a ko. Di muɣisira ma saha shɛŋa, di ni ŋmani n niŋsim nyɛla gala. Pumpɔŋɔ ka m pa
        yuuni ka di ŋmanila muɣisigu ŋɔ paara la sokam. Ka n di bɔra ni ti yɛli di yɛltɔɣa shikuru pam.
      sbs: 0.5838
      gen_sec: 14.79
      ref_sec: 24.64
      cer: 0.061
      wer: 0.3226
    unicef_00044:
      source: unicef
      text: Dabiɛm ma li ma mi ni di ti niŋ ka n na ʒi classi, ka daa di wuhiya ni m pa li biɣiya paɣa
        maa? di wuhiya ni n pa ni tɔ yi n dɔɣi, wɔyi ka a sa hi dabiɛm tiɛha n ba la,n bi tiɛhi ni n na
        sa ɣi la la ʒiɛ maa ʒi bu
      sbs: 0.6192
      gen_sec: 11.22
      ref_sec: 34.82
      cer: 0.1987
      wer: 0.5345
    unicef_00045:
      source: unicef
      text: O bɔrimi ni o chaŋ S.H.S, amaa o ma yɛliya ni o zooya ka bi nni tooi kuli doo ŋʋn ni tooi
        sɔŋ o. Achiika, o tizodoo ŋʋn dii be tɛhiri amiliya yɛla, be lee kpaŋsiri o ni hali o ni tooi
        yi ni yʋŋ, ka kpaŋ o maŋa ka o mali yaa, ka be che ka yɛltɔɣa shɛli dini muɣisiri o yi poloni.
      sbs: 0.6537
      gen_sec: 15.49
      ref_sec: 23.94
      cer: 0.068
      wer: 0.375
    unicef_00046:
      source: unicef
      text: N yi ku nyula koko shɛli asiba, bee nti pahi bonku bee shinkaafa shɛli wuntaŋni, di yi niŋ
        ka m mali liɣiri. Ka lala n dii nyɛli. Mma tumdi pam, amaa shaha shɛli ti diri la ti yaa ni nyaŋ
        shɛli. Din nye yaa bindirigu la? Kpantekuunga?
      sbs: 0.6461
      gen_sec: 13.18
      ref_sec: 28.8
      cer: 0.0833
      wer: 0.4681
    unicef_00047:
      source: unicef
      text: Di niŋ ma mi ka ʒi karili ŋɔ ka n ʒira. Ti ni tooi tɔɣisi zaŋ chaŋ, ti ni boonda biɛrisuŋ
        yaɣili zaŋ saha shɛŋa din kani na. M-paɣi ya pam n kariŋma. Nni maai ya ni din pa n-ko n ko n
        tiɛhiri zaŋ chaŋ yala ŋɔ zuɣu shɛm ŋɔ.
      sbs: 0.5511
      gen_sec: 11.84
      ref_sec: 19.65
      cer: 0.0788
      wer: 0.3725
    unicef_00048:
      source: unicef
      text: Ti kuli yɛn dila fiila zaŋ kpa tiŋkpansi biɛhigu polo. Shikuru ni binyɛra ni taɣiri tiri bipolla
        ka maan nyini shɛm. Biɛhigu nyɛla din tuhi n tiɛhi ya, amaa saha shɛŋa di bi ŋmani ti mi kpamba
        wumda ti ni yɛri shɛm. Yɛli mma zaŋ kpa di polo.
      sbs: 0.6293
      gen_sec: 12.74
      ref_sec: 27.39
      cer: 0.0582
      wer: 0.2917
    unicef_00049:
      source: unicef
      text: A yɛl' la binshɛɣu zaŋ kpa kpahimbu polo. Amaa yɛlimaŋli yɛra tiŋ zini yuui gi mini adaka
        dihibu ŋmanila yiŋ tuma. Diɛma? wula ka ti daa laafee mini din gu ti dolibu ŋmani diɛma? Ka mani
        ti ni yaari anfoonima ti ya la?
      sbs: 0.6189
      gen_sec: 11.98
      ref_sec: 26.88
      cer: 0.1294
      wer: 0.4884
    unicef_00050:
      source: unicef
      text: O na kuli kuhirimi di yi ti niŋ ka di kana gɔli puuni. O yɛliya biɛrim ŋɔ yaɣiya pam. Ka di
        yi ti niŋ ka mbɔri ni n zali zuliya din dahin shɛli lala ka di yɛn to? Di ŋmani di bie pam. Bɔ
        zuɣu ka bi bɔri li tiri ma? N nyɛri zuɣu biili pam.
      sbs: 0.6276
      gen_sec: 13.14
      ref_sec: 24.7
      cer: 0.0452
      wer: 0.2321
    unicef_00051:
      source: unicef
      text: Ka o yi niŋ o firimiinsi ka o kuli doo din kuli yɛn niŋ ka o yi yiŋa. Mma nyɛla ŋʋn tooi fo,
        amaa n tɛhiya ni o bɛla Adjoa nyaaŋa ashilo ni, mma nyɛla ŋʋn tumdi tuma pam, amaa n naʒin nya
        ka o mali sɔŋsim zaŋchaŋ yiŋ laɣiri dibu polo.
      sbs: 0.6019
      gen_sec: 12.8
      ref_sec: 19.58
      cer: 0.1236
      wer: 0.3654
    unicef_00052:
      source: unicef
      text: Mma n yɛli ni tudu polo ŋuni gba ni di gari lala,ni di tu laa pam. Di ŋmanla yeltɔɣa shɛli
        dim bi naara dama diyi naara, diyi di cheng tiŋ gba. Bo zuɣu kadi ŋmanla n zo nim zaahaza di niŋdiba
        mi? Njɛ nidi ti ŋmanla n maanila laazabu nti yaɣi. M paɣa mani bori ni n lɛbi nursi.
      sbs: 0.6407
      gen_sec: 15.04
      ref_sec: 35.2
      cer: 0.1374
      wer: 0.5763
    unicef_00054:
      source: unicef
      text: N na kuli maani la di shili amaa dini tooi niŋ ka m pahi pala zuɣu farila di zuɣu punpɔŋɔ,
        ti daa pun yɛli maŋ kahigibu yɛltɔɣa ti laɣingu din garila m min nachin naa maa daa di fiila ka
        n yɛli o ti ni ka firila nima shɛm ti pala maa zuɣu.
      sbs: 0.6363
      gen_sec: 13.33
      ref_sec: 22.21
      cer: 0.0378
      wer: 0.2264
    unicef_00055:
      source: unicef
      text: Mma kuhiri saha shɛŋa. O yɛliya ni o ku tooi birigi mba   zaligu o ni nye yili yidana la zuɣu.
        ŋun kam be ti tiŋkpaŋ ŋɔ yɛrimi  ni n yi bi kuli doo pumpɔŋɔ ni n di dihi daŋ maa vi. Bi yɛrila
        kaya ni ta'ada yɛltɔɣa.
      sbs: 0.5915
      gen_sec: 11.34
      ref_sec: 20.35
      cer: 0.0625
      wer: 0.3404
    unicef_00056:
      source: unicef
      text: Kamani wula? n-mini n zɔ nima ndiri fiila, n wum be yɛla amaa ndii be zaŋ n zaɣa niŋ din ni,
        n-mini ni na kuli nyɛ so maa ndiri fiila, di ni tooi niŋ ka n yɛli ba n fɔg ni n-ni ni chani skikuru
        shɛli. Di be niŋ?
      sbs: 0.651
      gen_sec: 11.95
      ref_sec: 16.51
      cer: 0.1039
      wer: 0.4286
    unicef_00057:
      source: unicef
      text: Sokam zaa kuli lami, hali bipuɣinsi ŋɔ shɛba. Di wuhi ya ni bi saɣi ti ni n ŋɔ ka binyara
        kuli yɛn be. Kadaɣila n ŋɔ ka binyara kuli yɛn be? N yabpaɣa yɛliya, ni dabba n nye zuɣuri, ka
        di tu ni paɣaba fɔ bi noli.
      sbs: 0.5799
      gen_sec: 11.62
      ref_sec: 23.94
      cer: 0.0629
      wer: 0.4043
    unicef_00058:
      source: unicef
      text: Shɛlini n mini n zo nima n chani diɛma ni yiɣijɛm dɔmini sarati zʋɣʋ, amaa bidibisi maa be
        maanitila ansarisi di yi ti niŋ ka be zilisi binshiɛɣʋ, be yi di mi be naan ku niŋdi lala, n tizodoo
        mali yee pam, vi ni kuma di yi niŋ ka o baŋ.
      sbs: 0.6177
      gen_sec: 10.71
      ref_sec: 18.05
      cer: 0.1934
      wer: 0.6275
    unicef_00059:
      source: unicef
      text: Antire mpiriba, di so n tɛhiya, shikuru nkuli nyɛli dabisa ŋɔni nni mba sɔŋbu zaŋ chaŋ o biniyara
        maa kɔhibu shitɔɣuni, mba kuli yɛrimi ni n chɛli sabibu sabibu maa ka zaŋ n hankali labi fita
        tali maa ni nbɔhinli viɛnyɛla.
      sbs: 0.642
      gen_sec: 12.43
      ref_sec: 22.08
      cer: 0.1292
      wer: 0.6341
    unicef_00061:
      source: unicef
      text: N di bɔri ni n che diɛma ŋɔ zaa, iin saha shɛŋa yiŋa. Ka  kpaŋ m-maŋa niŋ talahi, ka sɔŋ mma.
        Amaa nzonim ŋɔ boli ma ka ti yi yuŋ tusuɣu, ka n yi chaŋ ka kpe yala ni. Ka be dariɣi n tibili,
        din ŋmani n labimina ti kpalim zaɣi yini.
      sbs: 0.607
      gen_sec: 12.59
      ref_sec: 24.0
      cer: 0.0941
      wer: 0.3462
    unicef_00064:
      source: unicef
      text: O yɛlimi ni o ka piibu. Bɔ zuɣu ka di tu ni m mala? O tiɛhimi ni ŋɔ maa n nye so shɛli din
        yɛn gu ka taɣima. Di ŋmanila saha lan kani n ti ma. Saha shɛŋa kam loori yi kana yiŋa, n tiɛhirimi,
        amii so n kana ni o ti yɛli mba n yɛltɔɣa bee?  N karimba?
      sbs: 0.5945
      gen_sec: 13.29
      ref_sec: 29.38
      cer: 0.0275
      wer: 0.3559
    unicef_00065:
      source: unicef
      text: O dɔɣi la bipuɣiŋga yuuni din gari la, ka bipuɣiŋga ŋɔ daa bi tooi niŋ nyɛvuli o tuuli goli
        ni. Bɔ zuɣu ka ŋɔ na kuli niŋda, di yi niŋ ka so kam baŋ ni di nyɛla din bie? Bipuɣiŋsi pam m-bala,
        ka daɣila bipuɣiŋsi mini bidibisi pam na kuli biɛla yala ŋɔ ni? Bipuɣiŋsi ka tooi nahinda saha
        shɛli kam.
      sbs: 0.6447
      gen_sec: 15.79
      ref_sec: 23.81
      cer: 0.0742
      wer: 0.3607
    unicef_00066:
      source: unicef
      text: Wula ka n yɛn niŋli, di yi niŋ ka ŋuni kam be n kɔbili ni yɛri ma ni n nyɛla yɔli? N bɔra
        ni n dihi a tabili, m-piriba, amaa din niŋ tom pam, di yi niŋ ka di nye yɛlimaŋli. Bee n silimiinsili
        kariŋma. O yɛla to, amaa saha shɛŋa, o yɛra ti ni ti zahim mi zahim kara. Di kpɛhiri ma la dabiɛm
      sbs: 0.6081
      gen_sec: 15.33
      ref_sec: 33.73
      cer: 0.0794
      wer: 0.3692
    unicef_00067:
      source: unicef
      text: Saha shɛŋa di niŋdimami kamani ka bii n lahi nyɛma amaa ka ninkurigu n nyɛma, di ŋmanila so
        waɣinli pam, mba yuunimi ni saha kam n kanna ti sɔŋdi'o o tuma shee, o shitɔɣʋ maani, zaawuni
        kam. Wumsim.
      sbs: 0.6302
      gen_sec: 10.84
      ref_sec: 17.47
      cer: 0.0974
      wer: 0.5
    unicef_00068:
      source: unicef
      text: Zahambu du shɛli din miri ti yiŋ la, n tiɛh'ri mi n ti niŋ chaŋ ni ma ni ka be yɛli n laamba,
        di yi zaya ni n yɛli n laamba, diŋunaa ni yi di fɔla n nɔli ka liɛ be mi n ni yɛn niŋ shɛm, di
        nŋanli bɛ mali la biɛhigu maa ni di chɛ ka ti bɛ zimsim ni
      sbs: 0.6283
      gen_sec: 13.28
      ref_sec: 19.52
      cer: 0.1657
      wer: 0.5
    unicef_00069:
      source: unicef
      text: N ningbungbaŋ niŋdila kamani kpam laasabu, ka n nin-ni pɔrisira, di kurila suli, n lahi kpahimmi
        baŋ ka di ŋmanila mɔrilim kanimina n nyɔɣʋ polo, dabiɛm daa gbaai ma mi dini daa niŋ ka n pili
        biha yibu, wula ka so daa pun be daŋ yɛlima di yɛltɔɣa.
      sbs: 0.593
      gen_sec: 13.6
      ref_sec: 20.86
      cer: 0.0933
      wer: 0.4792
    unicef_00070:
      source: unicef
      text: Yi fɔŋ ni, niriba tihiya ni paɣaba ma li la din tu ni bi niŋ di bɛsha ŋa ka dabi gba ma li
        di ni tu shɛŋa, ka maa ŋmahin li, ti yɛli mɔɣi si ri li yi be yiŋa, di sa tu mi ni ma li dundɔŋ
        ka duɣi bɛi ka bi ko li yɛlima ni n ʒiya bɛi n yi ma
      sbs: 0.6177
      gen_sec: 12.74
      ref_sec: 32.26
      cer: 0.1618
      wer: 0.5873
    unicef_00071:
      source: unicef
      text: N bɔri mi ni n na ɣi shikuru da ma n bɔ mi ni libiɣi nursi bɛ a wuraba paɣa. Niri bi ya li
        ya ni yun pishi a yi ka n tu ni a paɣi ka na yi ko li doo, tɔ a maa ti tiŋ kpaŋɔ ŋɔ na, ha li
        bi zaŋ bihi pam ka bi ko li doo ka bi paɣi la la. A maa n ma ya li ni ka din tu shɛm n ba la,
        ni yi ko niŋ la bi ni yɛn niŋ ka di gbɛba
      sbs: 0.6472
      gen_sec: 15.08
      ref_sec: 30.98
      cer: 0.1339
      wer: 0.5978
    unicef_00072:
      source: unicef
      text: A tɛhiya ni mma ni saɣi kati di fiila ŋɔ? n-suhu kuli Ʒimi di yi niŋ ka n mini a diri di fiila,
        di ŋmanila yɛltɔɣa titali pam. Nbɔri ni ntoi chaŋ shikuru hali di yi ti niŋ ka mpaɣira.
      sbs: 0.6321
      gen_sec: 9.56
      ref_sec: 16.9
      cer: 0.0647
      wer: 0.45
    waxal_00000:
      source: waxal
      text: Niribi.n ʒiya bɛ chanila demostresion ,bɛmi galisiya, ka ŋubila ye liiga yelɔw kapiri shuu,
        ka sɔ jinjam sabinli , ka zaŋ liiga piɛli lɔ ɔ sheeni ka ŋun bala zaŋ dɔɣi tirɔ
      sbs: 0.5687
      gen_sec: 8.91
      ref_sec: 16.99
      cer: 0.1852
      wer: 0.5161
    waxal_00001:
      source: waxal
      text: paɣa mini o bihi ayi n za ayisikirim koha sani ka bɛ zaa ye chinchini nɛma ka di nyɛ yaayɛ
        ka bihi maa nyɛ bidib bili yino ni bipuɣinbia kaa ma ŋɔ gbubi ayisikirim n tiri o bipuɣim bili
        so ŋun be o nuuni ŋɔ
      sbs: 0.6361
      gen_sec: 11.8
      ref_sec: 23.85
      cer: 0.0617
      wer: 0.3111
    waxal_00002:
      source: waxal
      text: lijimanim laɣ' gim ʒɛ moɣini jarabisa nyɛla din ʒɛ bɛ nyɛŋa yino nyɛla ŋɔ ʒɛ ka zaŋ o nuu
        patabi ʒɛya ka so ʒɛ o nyɛŋa tihi gba nyɛla di bɛ bi kuɣigani
      sbs: 0.632
      gen_sec: 8.5
      ref_sec: 16.6
      cer: 0.1102
      wer: 0.4242
    waxal_00003:
      source: waxal
      text: Mɔɣuni n bɔŋɔ ka bini kɔbiri bɛ ni maa ni bini kɔbiri maa guurimi ka loori bɛ bini kɔbiri
        maa sunsuuni ka niriba bɛ loori maa ni ka vobisira yuuni bini kɔbiri maa na ka tihi bɛ mɔɣu maa
        ni.
      sbs: 0.6597
      gen_sec: 9.76
      ref_sec: 16.58
      cer: 0.0872
      wer: 0.3
    waxal_00004:
      source: waxal
      text: salo ŋɔ nyɛla nivuɣibɔgu shɛbi ban galisi be laɣim mi n ʒɛya be mi yi ʒɛya maa shɛbi ʒɛmi
        ka shɛb za zuɣ saa ka do so ʒɛ be sunisuuni ka yɛ kutu sabinli n pa liga pɛli zuɣ ka lo tayi ka
        tayi maa nyɛ zaɣ ʒiɛ ka o tɛi o noli n yɛba yɛtoɣ'
      sbs: 0.6218
      gen_sec: 13.45
      ref_sec: 23.61
      cer: 0.1556
      wer: 0.4821
    waxal_00005:
      source: waxal
      text: paɣ' baayi n ʒɛ kuɣisi zuɣ ka tɛbuya ʒɛ be tuuni be zaa yɛla nɛnpiɛlla tɛbuli maa zuɣ' tabilɛtɛ
        paya kabukunim paya ka kpalɛɛnim paya ka so mi za be tuuni zuɣ saa ka yɛ liga bankomi ka zaŋ o
        nu zaɣiyin pa o nyɛŋaha ka ashɛbitɛ karitɛ paya
      sbs: 0.6423
      gen_sec: 14.15
      ref_sec: 24.06
      cer: 0.1702
      wer: 0.6122
    waxal_00006:
      source: waxal
      text: Palli zuɣu n boŋo sarati nyɛla din niŋ palli ŋo zuɣu moto mini chɛchɛ nyɛla din kirashi taba
        paɣa yino nyɛla ŋun gbubi ŋun nyɛ sarati ŋo n ʒɛya n kuhura do yino nyɛla ŋun kuriya n lihira
        ka yino nyɛ ŋun ŋmaariba Anfooni bihi ayi nyɛla bin kpabi tabi ʒɛya
      sbs: 0.6894
      gen_sec: 14.97
      ref_sec: 24.56
      cer: 0.0784
      wer: 0.2745
    waxal_00007:
      source: waxal
      text: Niraba n nyɛ sarati ka paɣa gbubi o bia n ʒiya ka kuhura ka moto do doo tooni ka doo maa ŋmaaro
        foto ka so kuriya ka kuhura ka shikuru bihi ayi nyaɣa bi baaji n ŋmaari foto
      sbs: 0.627
      gen_sec: 9.38
      ref_sec: 19.02
      cer: 0.0296
      wer: 0.1053
    waxal_00008:
      source: waxal
      text: Jiranbiisa zuɣusaa n boŋo paɣa nyɛla ŋun ʒi kuɣu zuɣu ka yɛ liiga sabinli ka labtop tam o
        tooni ka kolba tam teebuli zuɣu loori nim nyɛla din bɛ jiranbiisa maa gbuni palli zuɣu chɛna loorinima
        ŋo nyɛla zaɣ sabinli ni zaɣ piɛlli
      sbs: 0.5826
      gen_sec: 13.35
      ref_sec: 22.8
      cer: 0.0703
      wer: 0.2791
    waxal_00009:
      source: waxal
      text: Daani n boŋo daa maa ni ka shab ʒiya ka shab mii chɛna shab ʒila anbirɛla nim gbuni ka shab
        ʒi kpakpa gbuni ka do so chɛna ka yɛ daliya pink ka so jinjɛm ŋmaa ka gbubi foon yɛlo o nuuni
        ka pili zipili piɛlli
      sbs: 0.6659
      gen_sec: 11.37
      ref_sec: 19.76
      cer: 0.0123
      wer: 0.0444
    waxal_00010:
      source: waxal
      text: Paɣiba paɣiba so zila mɔri o zuɣu ni ka yɛ liiga sabinli ka so zi dari o zuɣu ni paɣiba maa
        bi shɛba sola chinchina loori piɛlli kanna mi ka loori sabinli gba ziya ka taabo nim donndoya
        ka tihi bɛ bi tooni
      sbs: 0.646
      gen_sec: 11.36
      ref_sec: 18.69
      cer: 0.0307
      wer: 0.1163
    waxal_00011:
      source: waxal
      text: duu puuni ka bin kpulli yili dikpuni teebuli ʒɛla duu maa ni jiŋlaa mini ŋmana ni kapu ka
        di biɛni fulaawa nim biɛla fulaaawa pot ni ʒɛya ka kuɣu shɛli gba ʒɛ teebuli maa gbuni
      sbs: 0.5774
      gen_sec: 9.71
      ref_sec: 16.38
      cer: 0.0493
      wer: 0.2
    waxal_00012:
      source: waxal
      text: do'so m-bari cheche ka loodi bɔɣisinima o m-bari cheche maa shɛli polo di nyaanga ka du'piɛlli
        zaya ka dariga tili li ka o nu'zaa polo mii gba ka du'shɛli mii gba zaya ka di dundoli maa polo
        nyɛ zaɣ'dozim
      sbs: 0.637
      gen_sec: 11.35
      ref_sec: 16.74
      cer: 0.044
      wer: 0.3333
    waxal_00013:
      source: waxal
      text: Paɣasara n kuli ʒi binyahri bi sola chinchina ka doli palli ka ku pobi pobi bi ni ʒi binshaɣu
        maa ka loori nim bɛ bi luɣa zuɣu ka tihi bɛ bi nyaanga palli maa nyɛla pali sabinli laasabu
      sbs: 0.6346
      gen_sec: 10.57
      ref_sec: 16.86
      cer: 0.1014
      wer: 0.3947
    waxal_00014:
      source: waxal
      text: ʒijuŋ puuni n bɔŋɔ ka kuɣi waɣinli ʒa dinni ni zaɣi bihi ayi bɛ peenti laduuŋɔ tampilim kala
        kadi takoro. nya zaɣi karili ka dimi mali kichin ka picha diba yi tabi di kpuni ka teebuli ʒa
        di sunsuuni
      sbs: 0.5608
      gen_sec: 11.66
      ref_sec: 20.85
      cer: 0.1006
      wer: 0.4872
    waxal_00015:
      source: waxal
      text: Kom n boŋo pantuu nim n bɛ kom ŋo puuni di shɛŋa nyɛla zaɣ piɛla ka di shɛŋa nyɛ zaɣ ʒiɛhi
        ka tihi sansa kom ŋo puuni ka yiya bɛ dinni
      sbs: 0.6125
      gen_sec: 7.39
      ref_sec: 19.26
      cer: 0.125
      wer: 0.3226
    waxal_00016:
      source: waxal
      text: Loori nima n pɛ taba bi zooi palli maa zuɣu ka bi shɛba zuɣu ka flaki tamiya ka tooni dini
        maa ka niriba yina ziya ka guhiri so ni o yina bi mi yiɛla kootu sabila.
      sbs: 0.6525
      gen_sec: 8.67
      ref_sec: 17.47
      cer: 0.1102
      wer: 0.3889
    waxal_00017:
      source: waxal
      text: niriba n-laɣim ʒiya m-pe n-gili teebulu teebulu ŋɔ zuɣu bukunima m-paya ka kompiutanima beni
        ka so zaya bɛ tooni n-ye liiga din nyɛ zaɣ' nuɣiso ka wuɣi o nu-u zuɣusaa din mali agogo di puuni
      sbs: 0.6218
      gen_sec: 9.65
      ref_sec: 17.12
      cer: 0.094
      wer: 0.2571
    waxal_00018:
      source: waxal
      text: Ninvuɣi gbaliŋ mbɔŋɔ bi shɛba zila kuɣusi zuɣu kuɣu sabila nyɛli ka shɛba mi zɛ bi yɛanga
        ka so zɛ bi tooni na ka yiɛduhirisi bɛ o tooni ka o diri feela niŋdi yiɛduhirisi maa ni niriba
        ŋɔ shɛba niŋla yee pɔbirisi.
      sbs: 0.6232
      gen_sec: 11.53
      ref_sec: 16.82
      cer: 0.1345
      wer: 0.4286
    waxal_00019:
      source: waxal
      text: Piibu piibu shee salo nyɛla ban laɣim piibu piibu shee gbansabila ni gbanpiɛla ka yɛ liiga
        kɔnkɔba ka ʒi tia gbuni.
      sbs: 0.6384
      gen_sec: 6.51
      ref_sec: 15.16
      cer: 0.0319
      wer: 0.1905
    waxal_00020:
      source: waxal
      text: niraba ka bi ʒɛnʒɛya saa n mi ka kom kpɛba n di bi duri ka daai shɛŋa luhi ka bi va niɛma
        yina n ti paɣara ka shab kpɛ n ʒɛ kom maa ni ka bia chɛna ka doo gba ʒi kom maa sunsuuni shab
        tam duri zuɣu ka du shɛŋa na ʒɛya di bi lu
      sbs: 0.5167
      gen_sec: 10.59
      ref_sec: 20.72
      cer: 0.0585
      wer: 0.1607
    waxal_00021:
      source: waxal
      text: Niraba n ku piɛ n ʒiya ka bi sa tuuta nima tuuta nik maa nyɛla zaɣ ʒiɛhi ka di zuɣusaa nyɛ
        zaɣ piɛla ka do so ʒi tooni na ka gob chinchin piɛlli ka bi sabi sabiri sabila ka so ʒi tuuta
        nim maa puuni ka gobi chinchin ka pili zipili sabinli
      sbs: 0.6447
      gen_sec: 13.83
      ref_sec: 19.5
      cer: 0.0481
      wer: 0.1154
    waxal_00022:
      source: waxal
      text: Bihi be ʒila dariga zuɣu ka kpalaŋsi be bɛ tooni ni jarikan ŋmaa zaɣ'sabinli ŋun bala maa
        ʒi mi ka liɣiri ŋun bala maa ka ŋun bala maa mii pɔri o naba ʒiya.
      sbs: 0.6236
      gen_sec: 8.23
      ref_sec: 15.48
      cer: 0.0656
      wer: 0.303
    waxal_00023:
      source: waxal
      text: Palli n boŋo di soŋla kootaali tihi n saya ŋo ka mori bili dinni salin boɣali ni n boŋo ka
        doo tam di kunkun zuɣu ka shab bɛ boɣali maa puuni
      sbs: 0.6331
      gen_sec: 8.03
      ref_sec: 18.08
      cer: 0.045
      wer: 0.1935
    waxal_00024:
      source: waxal
      text: Salo n laɣam ʒɛ boɣali ni ŋo yino nyɛla ŋun yɛ liiga sabinli ka yino yɛ liiga vakaɣali ka
        zaɣ dozim booi dinni ka tihi bɛ bi nyaanga ka mashin ʒɛ di puuni
      sbs: 0.6433
      gen_sec: 8.58
      ref_sec: 17.92
      cer: 0.123
      wer: 0.4242
    waxal_00025:
      source: waxal
      text: Daapuuni paɣi ziya ka niŋ nyɛ pɔrigu teebulnim ʒɛya nyiŋgo korsii pa teebuli maa zuɣu tihi
        ʒɛyana paɣ' ayi chan dolitaba ka yinɔ niŋ nyɛpɔbirigu
      sbs: 0.6389
      gen_sec: 8.31
      ref_sec: 19.22
      cer: 0.1261
      wer: 0.72
    waxal_00026:
      source: waxal
      text: Teebuli n ʒɛya ŋo laa nyɛla din tam teebuli maa zuɣu ka bindirigu bɛ laa maa puuni gala ata
        nyɛla din bɛni n ti pahi boraadɛ din nyɛ dibanu gba bɛni laa maa ni ni zaham ŋmara ka manʒa nyɛ
        din polli
      sbs: 0.6554
      gen_sec: 11.28
      ref_sec: 15.81
      cer: 0.1346
      wer: 0.3571
    waxal_00027:
      source: waxal
      text: Alepile paaki titali ni m-bɔŋɔ alepile ŋɔ kuli nyɛla zaɣ' titali ka niriba chani di kpiɛbu
        silimiiŋɡa ŋun chani ŋɔ nyɛla ŋun mali zuɣ' viɛŋ ka ye liiɡa sabinli doo ŋun chani ŋɔ nyɛla ŋun
        nyaɣi baaji sabinli ka ɡbubi shɛli o nuu ni
      sbs: 0.5738
      gen_sec: 12.21
      ref_sec: 17.03
      cer: 0.0815
      wer: 0.2045
    waxal_00028:
      source: waxal
      text: paɣaba ayi nyɛla ban ʒiya n tori saɣam paɣa yino nyɛla ŋun gbubi tiligi maa tori saɣam bi
        niraba ayi maa so bi piri namda nima binkobiri nyɛla ban bɛ nimaani binkobiri ŋo so n nyɛ buwa
        ka o nyɛ zaɣ tankpaɣu laasabu ka noo gba bɛ nimaani ka nyɛ zaɣ sabinli
      sbs: 0.6484
      gen_sec: 14.34
      ref_sec: 21.94
      cer: 0.1225
      wer: 0.3269
    waxal_00029:
      source: waxal
      text: Bihi anahi n toori kom moɣali ni bi gbubila boɣati nima n mali toori kom bakɛti dibaayi nyɛla
        zaɣ piɛla ka zaɣ yindi nyɛ zaɣ buluu
      sbs: 0.6371
      gen_sec: 6.85
      ref_sec: 19.84
      cer: 0.0571
      wer: 0.3846
    waxal_00030:
      source: waxal
      text: Nachimbihi n ʒiri kpiimba daa daka ka kpiimba daa daka ŋɔ ka di nyɛ zaɣim nachimbihi ŋɔ shab
        nyɛla ban ye daliya ka di nyɛ zaɣ'sabila ka so ye daliya ka di nyɛ zaɣ'dozim.
      sbs: 0.6668
      gen_sec: 9.36
      ref_sec: 17.76
      cer: 0.0597
      wer: 0.2647
    waxal_00031:
      source: waxal
      text: Namda nim n bɔŋɔ ka bi zaŋli n yili yili namda nim maa nyɛla siɣim bushɛm zaɣ piɛlli biɛni
        zaɣ ʒiɛ biɛni zaɣ vakaɣali zaɣ ŋmari ŋmari ka bi zaŋ tana n soŋ n baɣali li zaɣ ŋmari ŋmari biɛni
        ka zaɣ piɛlli biɛni
      sbs: 0.6593
      gen_sec: 11.42
      ref_sec: 22.96
      cer: 0.0727
      wer: 0.1818
    waxal_00032:
      source: waxal
      text: Paɣiba ayi n-duɣiri bindirigu. Yino ʒila kuɣu zuɣu yino mi bi ʒi kuɣu zuɣu. Ŋmana n-zooi nimaani
        ka zahim pa la' shɛli zuɣu ka buɣim mi gba zaa be nimaani ka bɛ zaŋ kpaam n-tam di zuɣu.
      sbs: 0.6537
      gen_sec: 9.96
      ref_sec: 18.98
      cer: 0.0352
      wer: 0.2703
    waxal_00033:
      source: waxal
      text: Din bɛ Anfooni ŋo ni n nyɛ moɣali ka tihi piɛ n gili moɣali maa n ti pahi ŋarim dibaayi ka
        niraba ata ʒi ŋarim shɛli din baɣa tia maa ni piɛɣu ŋarim shɛli din mii pahari ayi maa ka niraba
        ayi bɛ di puuni n ti pahi piɛɣu
      sbs: 0.6539
      gen_sec: 12.14
      ref_sec: 28.08
      cer: 0.0877
      wer: 0.2245
    waxal_00034:
      source: waxal
      text: Tɔ Kpɛŋɔ maa mee n nya ka amonkaa tam amonkaa zuɣu ka sheba gbibi amonkaa maa ka marafa nima
        be amonkaa maa ni ni kukola ka bɛ gnibi filaaki nima balibu balibu ka sheba ʒi amonkaa maa zuɣusaa.
      sbs: 0.6284
      gen_sec: 10.02
      ref_sec: 20.15
      cer: 0.1623
      wer: 0.3947
    waxal_00035:
      source: waxal
      text: paɣba n bɛ do puuni ka yino ʒɛ kuɣ' zuɣ' kuɣ' maa nyɛla gbabili kuɣ' zaɣ sabinli ka paɣ' saribili
        ʒɛ di zuɣ ka gbabi pɛni ka kpa nɛkpara ka yuni ban ʒɛ yaɣili maa paɣba nyɛ be gbazaa tima bɛnidirinim
        pala paɣ maa ni ʒɛ shɛli maa
      sbs: 0.7018
      gen_sec: 12.1
      ref_sec: 23.45
      cer: 0.1136
      wer: 0.3958
    waxal_00036:
      source: waxal
      text: Silimiinsi n laɣim zaya bɛ piɛla foolii n gbibi kamara nima makuro fooni nima n tamya ŋɔ ka
        bɛ zanzaya sooja nima m biɛni doo yela puloova sabinli ka pili zipil'sabinli.
      sbs: 0.6196
      gen_sec: 8.54
      ref_sec: 17.88
      cer: 0.0584
      wer: 0.5806
    waxal_00037:
      source: waxal
      text: Paɣa n ʒɛya ka ʒi tahali tahali maa puuni shuu polish nim biɛni ni zuɣu saɣarisi ka gbubi
        piɛ bila o nuuni piɛ bili maa gba puuni birash nim biɛni ni shuu polish nima ka gbubi laɣari
      sbs: 0.6334
      gen_sec: 9.9
      ref_sec: 22.02
      cer: 0.0479
      wer: 0.2703
    waxal_00038:
      source: waxal
      text: salo n-laɣim n-zaya ka shɛba ʒiya n-ŋmɛri timpana salo ŋɔ puuni bɛ yuuni-la paɣa ka o wari
        waa paɣa ŋɔ nyɛla ŋun bi ye liiga ka bi piri namda paɣa ŋɔ yiɣila zuɣusaa
      sbs: 0.6191
      gen_sec: 9.49
      ref_sec: 16.46
      cer: 0.0156
      wer: 0.1212
    waxal_00039:
      source: waxal
      text: Country Shelly n ƶa bɛ nyaaŋa ka do so ƶa maik gbuni ka mŋari lunsi ka ga bɛni ka yɛ liga
        piɛli ka paɣa so gba ƶaa wara ka ƶanŋ bɛnyara lo o gbaya ni suhipiɛli ka ƶi bɛni ka maik maa mihi-waya
        nim maa yirina.
      sbs: 0.6007
      gen_sec: 11.2
      ref_sec: 18.65
      cer: 0.2733
      wer: 0.6304
    waxal_00040:
      source: waxal
      text: Paɣaba n ku galisi ʒiya n tiɛ tiɛ bi naba ʒiya ka zaŋ pona din nyɛ tahapona n tam bi naba
        zuɣu ka naanzuwa mini simbiɛlim bɛ di puuni ka bi gahanda la loori karili ʒɛ bi nyaanga
      sbs: 0.5943
      gen_sec: 10.18
      ref_sec: 25.12
      cer: 0.1071
      wer: 0.5
    waxal_00041:
      source: waxal
      text: N ma maa gbubila foon o nuuni ka la n doya ka teegi o nugaŋ bahi ka yɛ yɛnpa n pa o niɛma
        maa zuɣu o dola niɛma zuɣu niɛma maa nyɛla o ni kohari shɛli o lami do niɛma maa zuɣu
      sbs: 0.6363
      gen_sec: 8.8
      ref_sec: 16.36
      cer: 0.1045
      wer: 0.4286
    waxal_00042:
      source: waxal
      text: Salin boɣali ni n boŋo doo n kuriya ka gbuni soobul n toori tankpaɣu niraba ayopoin gba n
        pahi o zuɣu bɛ di puuni ka mashin ʒɛya n vori ko biɛɣu yiri kuligi maa puuni mashin shɛli gba
        lahi ʒɛya n tam dalibo zuɣu ka kom maa ku nyɛla ko biɛɣu n bɛ dinni
      sbs: 0.6655
      gen_sec: 14.38
      ref_sec: 24.6
      cer: 0.0455
      wer: 0.1111
    waxal_00043:
      source: waxal
      text: kootu duu puuni ka ti lihiri ŋɔ ka jaaji ʒi zuɣusaa ka o nu' dirigu zuɣu n-nya paɣaba ni pe
        ka dabba ayi ʒi bɛ sunsuuni ka looya ŋun nyɛ paɣa ʒi be bɛ puuni.
      sbs: 0.617
      gen_sec: 7.92
      ref_sec: 20.52
      cer: 0.0583
      wer: 0.2
    waxal_00044:
      source: waxal
      text: paɣ' mondi banku ka ka bihi ayi za o nuu diirgu lihiro ka tɛɛbuli bɛ o yaɣili ka kuriga nyɛ
        din tam tɛɛbuli maa zuɣ' ka n ma so ʒɛ nyɛŋa maa ka gubichichini ka paɣ' so mini o gba bihi ʒɛ
        luuƒa puuni ha
      sbs: 0.6278
      gen_sec: 11.14
      ref_sec: 15.85
      cer: 0.1169
      wer: 0.3556
    waxal_00045:
      source: waxal
      text: Nachimbi anii n bɛ boɣali puuni ka koma bɛ boɣali puuni ka mashun gba ʒɛya n bɛ boɣali maa
        puuni ka nachimbihi shab yɛ singirɛti nima ka shab yɛ liiga yɛlo ka shab yɛ liiga piɛla ka chɛ
        so gba biɛni n gba zaŋ soobuli toori tankpaɣu
      sbs: 0.6793
      gen_sec: 13.64
      ref_sec: 20.84
      cer: 0.0703
      wer: 0.1702
    waxal_00046:
      source: waxal
      text: Nachimba ayi yino yɛla sitir' sabilinli ka ʒi cheche sabilinli zuɣu ka yino za o nyaaŋga ka
        ye sitir' sabilinli jinjam sabilinli. O zabiri nyɛla zab' sabila.
      sbs: 0.6574
      gen_sec: 9.04
      ref_sec: 15.4
      cer: 0.0873
      wer: 0.4074
    waxal_00047:
      source: waxal
      text: Silmiin paɣa n ʒɛya duduɣugu ni ka yɛ liiga mini jinjɛm duduɣugu shɛli ni o ni ʒɛya maa chɛriti
        yiliyilla zuɣusaa ka o gbubi bindirigu dira o ni diri maa ka binshɛŋa bini mali duɣuri gba zaa
        ʒɛ nimaani
      sbs: 0.6267
      gen_sec: 11.33
      ref_sec: 21.47
      cer: 0.0736
      wer: 0.3077
    waxal_00048:
      source: waxal
      text: Zileli ŋɔ puuni bɛ malila ʒishee sheli n zali so ni o kana ti di fiila niriba maa kuli yela
        niɛn gaba gaba zaɣa sabila biɛni zaɣa tankpaɣu zaɣa chichera biɛni sheba pili zipila sheba bi
        pili zipila paɣaba mini dabba n kuli laɣim choriboi n guhini ŋun yen diba fiila maa diba fiila
        maa.
      sbs: 0.6411
      gen_sec: 13.6
      ref_sec: 26.9
      cer: 0.1652
      wer: 0.5273
    waxal_00049:
      source: waxal
      text: niriba pam m-be duu puuni niriba maa puuni bɛ shɛba dola garo nima zuɣu ka niriba ayi ʒi garo
        nima maa zuɣu bɛ puuni shɛba n-nyɛ dokta ŋun zaŋ nema bɔbi o ni zaa ha ka o ni bi lahi nyari a
        kom ka bɛ kpɛhiri shɛba ka kpɛhiri shɛba wɔɣisigin.
      sbs: 0.641
      gen_sec: 11.93
      ref_sec: 27.71
      cer: 0.0588
      wer: 0.2549
    waxal_00050:
      source: waxal
      text: Dakuɣa n doya ŋɔ be nyɛla ban zaŋ taabo zaŋ pa da kuɣa ŋɔ zuɣu kom n doya ŋɔ da kuɣa maa nyɛla
        din bɛ kom maa ni yili n zaya ŋɔ bi kpɛhila yili maa takoro galaasi liga nim nyɛla din pa mii
        zuɣu yili maa dikpuna nyɛla din kurigi kurigi.
      sbs: 0.6877
      gen_sec: 12.06
      ref_sec: 19.55
      cer: 0.0874
      wer: 0.4038
    waxal_00051:
      source: waxal
      text: so chɛndiba n boŋo so chɛndiba ma ʒirila baaji nima ka paɣaba bɛ bi ni ka linjima nim taɣaba
        zali linjima nim maa nyɛla yino bi puuni ka yɛ liiga buluu mini di jinjɛm
      sbs: 0.6434
      gen_sec: 9.58
      ref_sec: 18.61
      cer: 0.0902
      wer: 0.1471
    waxal_00052:
      source: waxal
      text: Duu m-bɔŋɔ ka teebuli ʒɛya ka di nyɛ zaɣ' piɛlli ka kapu tamya ka kuɣu din kom nyɛ salima
        kom ka di zaya ka fulaawaasi za di ɡbuni
      sbs: 0.6692
      gen_sec: 6.16
      ref_sec: 15.64
      cer: 0.0891
      wer: 0.2857
    waxal_00053:
      source: waxal
      text: Dabba noli n zaya bɛ zooya bɛ yela niɛnpiɛl'waɣala ka niriba ayi pili zipiligu ban za tooni
        maa tiritila binshaɣu wuhiriba ban kpalim bɛ sheba zaŋla bɛ nuhi labisi bɛ nyaanga ka sheba mee
        n zaŋ bɛ nuhi m pa bɛ nyɔɣu zuɣu.
      sbs: 0.6599
      gen_sec: 11.88
      ref_sec: 19.3
      cer: 0.0791
      wer: 0.3023
    waxal_00054:
      source: waxal
      text: Du'viɛli ka kuɣusi zaya ka dufeya pa kuɣusi maa zuɣu ka nyɛ dufeya anu ka teebuli zaya ka
        kopu tam dizuɣu ka filaawaasi gba tam teebuli maa zuɣu.
      sbs: 0.5242
      gen_sec: 6.95
      ref_sec: 19.02
      cer: 0.0431
      wer: 0.25
    waxal_00055:
      source: waxal
      text: Paɣa n ʒi tahapoŋ ʒɛya ka ka tizuɣu piɛlli ka pili zipiligu ka gbubi baskɛti o nuuni ka binyahari
        bɛ dinni binyɛra maa n nyɛ polish nima birash nima ka gbubi laɣari o nuuni tahapoŋ maa ni binyahari
        n bɛ dinni ka di nyɛ bin sabila polish nima
      sbs: 0.6937
      gen_sec: 14.1
      ref_sec: 24.3
      cer: 0.0206
      wer: 0.1042
    waxal_00056:
      source: waxal
      text: Doo mini o bia n ʒiya ka laa tam bi tooni ka bindira bɛ di puuni ni kapu nima ka kom bɛ di
        puuni ka o bia zaŋ bindirigu n niŋ o nolini ka o yaagi o noli ka deegi
      sbs: 0.6512
      gen_sec: 8.32
      ref_sec: 15.69
      cer: 0.0246
      wer: 0.075
    waxal_00057:
      source: waxal
      text: Niriba n zooi zɛya ŋɔ bi mini linjima nima n daari taba bi shɛba gbubi la tuuta nima ma tuuta
        nima maa shɛli nyɛ zaɣi zɛhi ma shɛŋa mi nyɛ zaɣi buluu linjima nima maa pilila zupiliti ka di
        mali nini pɔbirigu daadama maa gba shɛba yiɛla liiga sabila ka bi shɛba yiɛ liiga piɛlla.
      sbs: 0.6303
      gen_sec: 4.39
      ref_sec: 20.64
      cer: 1.0
      wer: 1.0
    waxal_00058:
      source: waxal
      text: Ashibiti puuni m bɔŋɔ ashibiti maa puuni niriba ayi n nyɛ ban bɛ ashibiti maa puuni ashibiti
        maa puuni docta maa nyɛla ŋun yɛ liiga sabinli ka pili zipili buluu ka su nusuri piɛlla o nuuni
        ka o chibiri bara barimaa mi nyɛla pɔlinga.
      sbs: 0.6365
      gen_sec: 13.89
      ref_sec: 22.59
      cer: 0.0585
      wer: 0.2955
    waxal_00059:
      source: waxal
      text: Ninvuɣi shɛba ye la nɛɛn piɛla piɛla n za n zaya ka shɛba mi do n do tiŋa ka ahɛba mi so n
        do gariti zuɣu ka gariti maa nyɛ bini shɛŋa dini golim golim la bini yahari yili yili li.
      sbs: 0.6304
      gen_sec: 9.48
      ref_sec: 16.86
      cer: 0.0935
      wer: 0.6341
    waxal_00060:
      source: waxal
      text: Daani ka Silimiin paɣa ʒɛya ka biri namda piɛla ka nyaɣi baaji sabinli ka ʒɛ loori gbini ka
        loori maa puuni niɛma biɛni niɛn piɛla biɛni ka filaawaasi nima biɛni ka loori maa mali gbali
        piɛla ka tihi biɛni ka bɛ zaŋ baaji nima yili tihi maa.
      sbs: 0.6552
      gen_sec: 14.23
      ref_sec: 24.22
      cer: 0.0464
      wer: 0.1702
    waxal_00061:
      source: waxal
      text: Paɣa n ʒe gbambila gbuni gbambila maa luɣuli zuɣu bɛni piɛlli n ʒeya zaɣi waɣinli n nyɛli
        ka bin sabila sabbi pa di zuɣu ni vɔt paɣa naa sola chinchini o nyɔɣu zuɣu ka yɛ liiga piɛlli
        ka wuɣi o nuu bɔɣu m ma di kpambili maa wolini ka gbubi binchɛra o nu zaa.
      sbs: 0.6287
      gen_sec: 14.42
      ref_sec: 20.03
      cer: 0.1078
      wer: 0.463
    waxal_00062:
      source: waxal
      text: Kaya ni taada wuhubi paɣasara nyɛla ban yina n ʒi binyɛra tahapona ni ka bi zaa gobi chinchina
        chinchina maa shɛŋa kama nyɛla zaɣ vakaɣali ka shɛŋa nyɛ zaɣ dozim ni zaɣ vakaɣali
      sbs: 0.699
      gen_sec: 10.18
      ref_sec: 23.84
