      sbs: 0.8145
      gen_sec: 7.98
      ref_sec: 7.9
    '85':
      text: Ka labisi yi ni niŋdi ba nyɔri shɛli yi liɣiri mini yi chi ni yi wain ni yi kpam zuɣu la ti
