      gen_sec: 6.68
      ref_sec: 5.54
    '13':
      text: ka dabiɛm mini niŋgbuŋ sɔhibu daa paai ma din daa dam n kɔba ni zaa.
      sbs: 0.7684
      gen_sec: 5.36
      ref_sec: 6.32
    '14':
      text: Hɔdia so mi ni Hashum ni Bɛzai ni.
      sbs: 0.8506
