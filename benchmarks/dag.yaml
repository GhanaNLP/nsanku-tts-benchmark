      gen_sec: 4.0
      ref_sec: 4.54
    '204':
      text: Dabisili din pahi pia dali, Ammishadai bia Ahiɛza ŋun daa nyɛ Dan zuliya zuɣulan’ la n-daa
        mali sara.
      sbs: 0.6386
      gen_sec: 8.8
      ref_sec: 7.94
    '205':
      text: Ka o daa boli bipuɣin’ kpɛm’ sani yuli Jɛmaima, ka boli ŋun paya yuli Kɛzia, ka boli ŋun pah’
