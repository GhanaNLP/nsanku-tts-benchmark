      sbs: 0.7568
      gen_sec: 8.68
      ref_sec: 9.16
    '46':
      text: M biɛhigu din ka buchi ŋɔ puuni, n nya binshɛɣukam zaa.
      sbs: 0.7207
      gen_sec: 9.1
      ref_sec: 4.18
    '47':
      text: Di zaa ŋɔ shɛli bi simdi niŋbu, amaa din simdi niŋbu nyɛla wumpaɣibo.
      sbs: 0.7707
      gen_sec: 6.06
      ref_sec: 5.74
    '48':
      text: Ka o daa mali Ɛlat me n-ti Judanima, Naa Amazia kalinsi maa nyaaŋa.
      sbs: 0.7802
      gen_sec: 8.74
      ref_sec: 6.08
    '49':
