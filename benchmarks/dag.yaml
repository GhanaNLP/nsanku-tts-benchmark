      sbs: 0.6929
      gen_sec: 7.2
      ref_sec: 7.38
    '242':
      text: Ka bɔh’ o, “Di luhiya ni nira chɛ ka so kpaŋ Vuhim Dabisili dali?
      sbs: 0.7179
      gen_sec: 4.4
      ref_sec: 11.78
    '243':
