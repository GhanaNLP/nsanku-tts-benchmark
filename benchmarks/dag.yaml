      cer: 0.0769
      wer: 0.2222
    waxal_00064:
      source: waxal
      text: Ashibiti ni n bɔŋɔ, ka barinim doya. barinim ŋɔ sɔ ʒila ɔ garɔ zuɣu ka ye liiga ʒɛɛ ka kpa
