      sbs: 0.7236
      gen_sec: 7.48
      ref_sec: 3.68
    '66':
      text: Ninvuɣ’ biɛri bɛn bi ʒe Naawuni yim ʒiɛmannim’ ŋɔ bɔrila shihirili nyabu, amaa bɛ ku nya shihir’
