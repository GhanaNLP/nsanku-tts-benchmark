      sbs: 0.6905
      gen_sec: 6.6
      ref_sec: 3.66
    '16':
      text: Dinzuɣu ka bɛ daa yɛl’ taba, “Di chɛliya ka ti chee’ li, amaa chɛliya ka ti tola tɛte n-nya
        ŋun yɛn di li.
      sbs: 0.784
      gen_sec: 10.14
      ref_sec: 7.64
    '17':
      text: Dama a yɛliya, ‘M biɛhigu nyɛla din be kasi.
      sbs: 0.7392
      gen_sec: 5.9
      ref_sec: 3.78
    '18':
      text: amaa o ni kari ninvuɣ’ biɛri bɛn’ bihi bahi.
      sbs: 0.7804
      gen_sec: 5.28
      ref_sec: 4.14
    '20':
      text: Bɛ ni daa niŋ kpam ŋmiri zim viɛl’ shɛli ni bɛ zaŋ mali chi sara daa palila bina ayi maa.
      sbs: 0.7417
      gen_sec: 6.86
      ref_sec: 6.66
    '21':
      text: O yaannim’ shɛba n-daa lan nyɛ Hazaaya mini Adaya ni Joyarib ni Zakaria so mi bɛn daa nyɛ
        Shilo daŋ ni niriba la.
      sbs: 0.7637
      gen_sec: 9.44
      ref_sec: 12.16
    '22':
      text: 'Yawɛ ni yɛl’ shɛm m-bɔŋɔ: Ŋuna ŋun nam zuɣusaa ŋɔ.'
      sbs: 0.7651
      gen_sec: 7.36
      ref_sec: 3.24
    '23':
      text: Di saha ka niriba maa zaa daa saɣi ni bɛ lan zaŋm’ daba ayopɔin puhi chuɣu maa yaha.
      sbs: 0.7764
      gen_sec: 7.12
      ref_sec: 7.06
    '24':
      text: Ka ŋuni n-lee ni tooi be Ziɔn a daboli din be kasi la zuɣu?
      sbs: 0.7667
      gen_sec: 7.26
      ref_sec: 5.36
    '26':
      text: Ahia ni Hanan so mi ni Anan ni.
      sbs: 0.7596
      gen_sec: 7.18
      ref_sec: 4.82
    '28':
      text: N daa nyɛla nachimbila, ka pumpɔŋɔ n kurigiya.
      sbs: 0.7681
      gen_sec: 7.64
      ref_sec: 3.4
    '29':
      text: Ka bɛ daa chaŋ ti ŋma li n-zaŋ niŋ pɔŋ ni na ti ti bipuɣiŋga maa, ka o daa zaŋ li nti ti o
        ma.
      sbs: 0.7811
      gen_sec: 6.5
      ref_sec: 6.62
    '30':
      text: Ka ninvuɣ’ so ŋun daa piɛbiri kikaa gba daa kul baɣi ma.
      sbs: 0.7574
      gen_sec: 4.3
      ref_sec: 4.42
    '31':
      text: Nir’ yi chaŋ kumsi ni be yil’ shɛli, di so ni o chaŋ dimma ni nyubu ni be yil’ shɛli.
      sbs: 0.7844
      gen_sec: 7.9
      ref_sec: 6.14
    '32':
      text: O bela nimaani lihiri bɔr’ o ni yɛn gbaai binshɛli di.
      sbs: 0.7358
      gen_sec: 4.86
      ref_sec: 3.56
    '33':
