      sbs: 0.6763
      gen_sec: 4.08
      ref_sec: 5.54
    '258':
      text: Daba, deemiya yi dunia ŋɔ ni duumanim’ noya ni dabeenzɔbo mini ni sɔhibu, ka niŋmiya lala
