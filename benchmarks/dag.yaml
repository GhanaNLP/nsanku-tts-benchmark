      sbs: 0.6916
      gen_sec: 7.84
      ref_sec: 8.1
    '235':
      text: O daa yɛlimi ni ti Duuma yɛliya, “Ijipti tiŋgbɔŋ ni ka n yihi m Bia maa na.
      sbs: 0.6347
      gen_sec: 4.8
      ref_sec: 6.02
    '237':
      text: Ka bɛ daa nya ka Anabi Ilaija mini Anabi Musa puhi zan’ o sani, ka bɛ min’ o tɔɣisiri yɛtɔɣa.
      sbs: 0.7145
      gen_sec: 6.32
      ref_sec: 5.86
    '238':
      text: O daa lan zaŋ daanya mali pumpɔrinchihi kɔtomsi kɔbisinahi n-zaŋ gɔhigɔhi zoligɔnim’ zaŋ lo
        zuɣuri ayi la kulis’ ayi.
      sbs: 0.6394
      gen_sec: 7.92
      ref_sec: 8.2
    '239':
