      gen_sec: 9.1
      ref_sec: 8.78
    '41':
      text: dama bɛn tuhiri ma maa galisiya pam.
      sbs: 0.7544
      gen_sec: 9.22
      ref_sec: 3.02
    '42':
      text: Bɛ daa yi puhi chuɣu maa naai, Ayuba timdimi ka bɛ chaŋ ti mali ba ka bɛ niŋ kasi.
      sbs: 0.8206
      gen_sec: 6.76
      ref_sec: 7.48
    '43':
      text: Amaa bɛ daa sɔɣ’ o, dama bɛ daa yɛlimi, “O nyɛla Jɛhɔshafat ŋun daa jɛmdi Yawɛ ni o suhu zaa
        la yaaŋa.
      sbs: 0.7278
      gen_sec: 8.62
      ref_sec: 8.6
    '45':
      text: Ka bɛ daa yɛli Ɛzra ŋun daa nyɛ zaligubaŋda la ni o zaŋm’ Musa zaligu litaafi shɛli Yawɛ ni
