      sbs: 0.6216
      gen_sec: 3.52
      ref_sec: 3.1
    '127':
      text: 'Amaa bin’ yini ŋɔ ka n naɣ’ kpahim nya: Naawuni nam ninsalinim’ dɛde, amaa tinim’ lee bo
