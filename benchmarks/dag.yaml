      sbs: 0.6518
      gen_sec: 6.96
      ref_sec: 7.62
    '211':
      text: Ka jɛlinsi mini dabiɛm daa kpe Ijiptinim’ maa suhuri ni zaŋ chaŋ bɛ polo.
      sbs: 0.6588
      gen_sec: 6.08
      ref_sec: 5.64
    '212':
      text: Naawuni gbaɣino mini di bidibbina zaa.
