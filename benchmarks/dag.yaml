      sbs: 0.6546
      gen_sec: 2.16
      ref_sec: 3.1
    '219':
      text: Zaŋmiya adiini yila mini Naawuni paɣibu yila ni Yila litaafi ni yila kpaŋsiri taba, ka yilimiya
        yila paɣimi ti Duuma ni yi suhuri zaa.
      sbs: 0.6921
      gen_sec: 9.28
      ref_sec: 12.78
    '220':
      text: ka zaŋ ba tahi na’ so ŋun yɛla mali dabiɛm sani.
      sbs: 0.6921
      gen_sec: 3.12
      ref_sec: 3.4
    '221':
      text: Nyini n-zali bɛ tariga ni nyɛ luɣ’ shɛli ka bɛ ku tooi yaɣi di zuɣu.
      sbs: 0.6283
      gen_sec: 4.8
      ref_sec: 5.18
    '222':
      text: ka chɛ ka yi nya ninvuɣ’ biɛri ni yɛn bahi yoli shɛm.
