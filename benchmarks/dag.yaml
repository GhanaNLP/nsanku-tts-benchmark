  entries:
    '0':
      text: Nyini n-zali tɔrili ni o yiɣimi du zuɣusaa katiŋa.
      sbs: 0.7677
      gen_sec: 7.98
      ref_sec: 3.42
    '2':
      text: Bɛnkam tumdi dimbɔŋɔnim’ kul ku vuui bɛ zaashee.
      sbs: 0.7608
      gen_sec: 5.5
      ref_sec: 6.7
    '3':
      text: Ka Naa Hɛrɔd daa wum lala maa ka yɛli, “N ni daa ŋma Jɔn Baptaizira so zuɣu la n-lan neei
        kum ni na maa.
      sbs: 0.7556
      gen_sec: 9.14
      ref_sec: 6.64
    '4':
      text: A shiri mi, dama di saha bɛ daa pun dɔɣ’ a.
      sbs: 0.8205
      gen_sec: 5.72
      ref_sec: 3.54
    '6':
      text: Bɛ ni yihi kuɣa din daa di buɣim tampuya saɣiri la ni me?
      sbs: 0.8179
      gen_sec: 5.96
      ref_sec: 4.5
    '8':
      text: Pa nyin’ n-nyɛ ŋun su zuliya kam zaa nam fukumsi?
      sbs: 0.7478
      gen_sec: 4.92
      ref_sec: 3.52
    '9':
      text: N chɛ ka baɣisi leei jɛra.
      sbs: 0.7563
      gen_sec: 7.24
      ref_sec: 8.4
    '11':
      text: Ŋuna n-simdi jilima tibu mini yiko subu hal ni saha din ka bahigu.
