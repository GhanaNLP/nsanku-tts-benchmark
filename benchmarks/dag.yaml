      sbs: 0.787
      gen_sec: 6.58
      ref_sec: 3.42
    '51':
      text: A pun wum Asiria naa ni niŋ tiŋgbɔn’ shɛŋa shɛm ni o ni saɣim li zaa shɛm yɛla.
      sbs: 0.7541
      gen_sec: 6.14
      ref_sec: 6.02
    '53':
