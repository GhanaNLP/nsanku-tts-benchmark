      sbs: 0.6708
      gen_sec: 5.44
      ref_sec: 11.9
    '234':
      text: Bɛ daa ti ba situra, ka lan ti ba namdanima mini bindira ni binnyura, ka daa niŋ kpam ʒe bɛ
