      gen_sec: 3.2
      ref_sec: 3.48
    '223':
      text: Bɛ bɔri ni bɛ baŋ n saria karibu soli din tuhi yɛla.
      sbs: 0.6355
      gen_sec: 3.2
      ref_sec: 3.18
    '225':
      text: Di zuɣu ka n timd’ o yi sanna ni o ti yɛli ya ti zaa ni be shɛm, ka di kpaŋsi yi suhuri.
      sbs: 0.6741
      gen_sec: 7.04
      ref_sec: 7.22
    '227':
      text: Di daa lan niŋ tinzunnim’ bɛn daa be Izraɛl tiŋgban’ ni ka kana mini tinzunnim’ bɛn daa be
        Juda tiŋgban’ maa ni zaa nyaɣisim.
      sbs: 0.6434
      gen_sec: 8.24
      ref_sec: 9.14
    '228':
      text: Manaasa yuma daa nyɛla yuun’ pinaayi saha shɛl’ o ni daa di nam.
      sbs: 0.6153
      gen_sec: 3.84
      ref_sec: 4.4
    '229':
      text: Ka o daa lan zaŋ anzinfa din tibisim nyɛ kilɔgiram tusaata ni kɔbisinahi n-chaŋ ti da Izraɛl
