      sbs: 0.74
      gen_sec: 6.9
      ref_sec: 3.74
    '98':
      text: Ka ŋun’ daa yɛl’ o niriba, “Nyamiya, Izraɛlnim’ ŋɔ zooya, ka lan mali yaa gari ti.
      sbs: 0.8129
      gen_sec: 7.54
      ref_sec: 6.7
    '99':
