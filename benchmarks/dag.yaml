      sbs: 0.7077
      gen_sec: 9.92
      ref_sec: 10.84
    '207':
      text: Ka bɛ zaa yino kam daa ti o liɣiri mini salima nintua.
      sbs: 0.6496
      gen_sec: 3.76
      ref_sec: 4.34
    '208':
      text: Ka bɛ bɔh’ o, “Paɣa, bɔ n-niŋ ka a kumda?
      sbs: 0.7098
      gen_sec: 2.96
      ref_sec: 3.08
    '210':
      text: Ka o daa wuhi ya o daalikauli shɛli o ni zali ya ni yi doli, dina n-nyɛ o fukumsi zaligunim’
