      gen_sec: 3.76
      ref_sec: 5.32
    '214':
      text: Ka sandira maa daa damd’ o tooni m-balind’ o yɛra, ‘N dana, na dim’ ma suɣilo, n ni yo a di
        zaa.
      sbs: 0.7381
      gen_sec: 7.6
      ref_sec: 7.6
    '215':
      text: 'Di bemi kaman di ni sabi luɣ’ shɛli polo shɛm la: “Nyin’ gɔgbihira.'
