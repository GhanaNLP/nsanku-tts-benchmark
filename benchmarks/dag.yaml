      sbs: 0.6587
      gen_sec: 4.64
      ref_sec: 7.62
    '247':
      text: Ka Atalia daa dari chɛh’ omaŋmaŋ’ situra, ka kuhi yɛli, “Nyaanyibo!
      sbs: 0.6694
      gen_sec: 5.28
      ref_sec: 5.86
    '248':
      text: Naa Hɛrɔd daa wum Yisa yɛla, dama o yuli daa duya pam.
      sbs: 0.7025
      gen_sec: 4.64
      ref_sec: 3.92
    '250':
      text: ” Man’ Yawɛ n-yɛli lala maa.
      sbs: 0.58
      gen_sec: 1.28
      ref_sec: 4.7
    '251':
      text: Lala ka bɛ daa pun niŋ anabinim’ bɛn daŋ yi tooni la gba alaka.
      sbs: 0.6684
      gen_sec: 4.24
      ref_sec: 3.16
    '252':
      text: O yaannim’ shɛba n-daa nyɛ Mɛshilɛmɔt mini Imɛr.
      sbs: 0.699
      gen_sec: 3.84
      ref_sec: 4.84
    '254':
      text: Amaa bɛ dɔɣila ninsalinim’ niŋ yɛlimuɣisira ni.
      sbs: 0.6457
      gen_sec: 3.6
      ref_sec: 3.76
    '255':
      text: Ka ŋunkam zaŋ naɣilaa bee piɛlah’ ayopɔin kana ni o ti mal’ omaŋ’ kasi, o leerila yi buɣ’
