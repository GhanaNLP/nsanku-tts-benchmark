      gen_sec: 3.54
      ref_sec: 13.76
    '34':
      text: ‘Bɔzuɣu ka yi kul tɔɣisiri n zaligunim’ yɛla sahakam?
      sbs: 0.7238
      gen_sec: 7.46
      ref_sec: 3.54
    '35':
      text: Dimbɔŋɔ zaa nyaaŋa ka Yawɛ daa chɛ ka dɔr’ shɛli din ka tibbu gbaag’ o nyɔri.
      sbs: 0.7525
      gen_sec: 5.8
      ref_sec: 5.3
    '37':
      text: N daa ti a yiko ka a wurim bɛ ni me goma gili tin’ shɛŋa, ka di leei dabari.
      sbs: 0.8091
      gen_sec: 6.42
      ref_sec: 6.08
    '38':
      text: ka zaŋ tiŋgban’ shɛli din ka kulim ti ba ni di nyɛ bɛ biɛhigu shee.
      sbs: 0.7933
      gen_sec: 5.68
      ref_sec: 4.14
    '39':
      text: Ka Izraɛl Naa Ɛhab daa bɔhi Juda Naa Jɛhɔshafat, “A ni pahi n zuɣu ka ti chaŋ ti tuhi Ramɔtigiliadnima?
