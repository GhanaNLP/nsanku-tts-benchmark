      gen_sec: 17.76
      ref_sec: 20.07
      cer: 0.0886
      wer: 0.25
    waxal_00047:
      source: waxal
      text: Dɔbɔ ne pɔgebɔ la lantaa waa gyɛmaa lɛ ka bamine su bonyaayirii, bamine meŋ su bontɛɛtɛɛ kyɛ
