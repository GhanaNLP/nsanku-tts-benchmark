      cer: 0.1901
      wer: 0.4186
    waxal_00038:
      source: waxal
      text: Noba arɛɛ la gyamaa kyɛ ka torata na maŋ koɔra weɛ ka o are a torata kuori nyemɛ eɛ doɔre
