      gen_sec: 1.57
      ref_sec: 3.25
      cer: 0.0
      wer: 0.0
    jw_00004:
      source: jw
      text: A maŋ kyɛrɛɛ fẽẽ ka N nyɛ accident, kyɛbee N maŋ de la a lɔɔre te va boma mine naŋ are?
      sbs: 0.7027
      gen_sec: 5.47
      ref_sec: 8.08
      cer: 0.0923
      wer: 0.381
    jw_00005:
      source: jw
      text: GYOOB YƐLƐ ŊA NA BAŊ SOŊ TEŊ KA TE NYƆGRƆ TE MENNE
      sbs: 0.6437
      gen_sec: 3.3
      ref_sec: 5.44
      cer: 0.0513
      wer: 0.25
    jw_00006:
      source: jw
      text: Bon nanso ka Naaŋmen tere sori teŋ dire dɔgɛɛ
      sbs: 0.7138
      gen_sec: 2.94
      ref_sec: 4.74
      cer: 0.0811
      wer: 0.5556
    jw_00007:
      source: jw
      text: Sobuoŋ ka a Baabole vɛŋ teŋ baŋ peɛlaaŋ ka ka Jehoovaŋ wa di suuri ko te, a ba la seŋ ka te
        vɛŋ ka a dɔnnɔ te?
      sbs: 0.7107
      gen_sec: 6.98
      ref_sec: 8.01
      cer: 0.122
      wer: 0.1481
    jw_00008:
      source: jw
      text: Hulda Da Toɔ̃ Ta La Yɛlɛ Na Oŋ Da De Biŋ O Nimitɔɔreŋ Na
      sbs: 0.7034
      gen_sec: 3.49
      ref_sec: 4.72
      cer: 0.0952
      wer: 0.2143
    jw_00009:
      source: jw
      text: Jehoova da wuli teŋ ka o sereŋ eɛ siri ka o kaa te zu. Yɛlɛ yoŋ aŋ da seŋ ka te e la ka te
