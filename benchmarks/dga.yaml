      gen_sec: 16.0
      ref_sec: 22.28
      cer: 0.0497
      wer: 0.2
    waxal_00037:
      source: waxal
      text: Dɔba mine bayi la zeŋ kaŋa zeŋɛɛ la kyɛ ka kaŋa a are a teɛnɛ o nu a wullo o tɔsoba kaŋ bonkaŋ
        naŋ be a dankyini eŋɛ kyɛ ka kyããne mine meŋ a mare mare a dankyime zaa kpɛlɛŋ a wa golli.
