      gen_sec: 12.0
      ref_sec: 14.46
      cer: 0.0254
      wer: 0.0769
    bible_00015:
      source: bible
      text: Ona la boɔrɔ ka neɛzaa nyɛ faabo a kyɛ wa baŋ a yelmeŋɛ.
