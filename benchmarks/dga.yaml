      cer: 0.1111
      wer: 0.5
    jw_00030:
      source: jw
      text: Mɔɔ kyɛ kanna gama na zaa ba naŋ maŋ iri teŋ de pono korɔ noba na, a maŋ kaa vidiori ane boma
        na zaa ba naŋ maŋ de eŋ jw.org zuŋ na.
