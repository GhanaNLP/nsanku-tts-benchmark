      cer: 0.2963
      wer: 0.8333
    jw_00060:
      source: jw
      text: Ka neɛ kaŋaŋ wa te zie a wa sɔre kawane, wala aŋ seŋ ka te e?
      sbs: 0.708
      gen_sec: 3.9
      ref_sec: 5.82
      cer: 0.0227
      wer: 0.25
    jw_00061:
      source: jw
