      gen_sec: 2.85
      ref_sec: 5.53
      cer: 0.1176
      wer: 0.3
    jw_00016:
      source: jw
      text: Te na zanne nyɛɛ tɛɛtɛɛ naŋ be yelmeŋɛ na te naŋ zanne yi Jehoova zie, ane zirii na Setaana
        ane te dɔndɔnne naŋ ŋmaara na kpakyagaŋ.
      sbs: 0.6962
      gen_sec: 8.64
      ref_sec: 9.61
      cer: 0.0667
      wer: 0.1154
    jw_00017:
      source: jw
      text: Ka ba naŋ yelka Jehoova de la o yuori na ko Yezu, wala ka lɛ wuli?
      sbs: 0.6947
      gen_sec: 4.03
      ref_sec: 6.4
      cer: 0.1224
      wer: 0.25
    jw_00018:
      source: jw
      text: Gyoob Gane Na Na Baŋ Soŋ Boŋ Ka Ho Terɛ Kawaŋ-Sonne
      sbs: 0.7154
      gen_sec: 3.39
      ref_sec: 5.63
      cer: 0.125
      wer: 0.3636
    jw_00019:
      source: jw
      text: NAŊ KYƐNƐ TU PUORE SƆROO EŊƐŊ A TAGRA PEƐLƐ JEHOOVA
