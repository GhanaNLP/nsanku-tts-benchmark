      ref_sec: 5.82
      cer: 0.0
      wer: 0.0
    bible_00028:
      source: bible
      text: “Daana, a piiluu saŋ, fõõ la iri a teŋɛ.
      sbs: 0.6672
      gen_sec: 3.92
      ref_sec: 3.28
      cer: 0.0
      wer: 0.0
    bible_00029:
      source: bible
      text: Bebie ata puoriŋ, a Pɔɔl da boɔle la a Gyuumine nembɛrɛ naŋ da be a be lantaa.
      sbs: 0.6771
      gen_sec: 6.0
      ref_sec: 5.56
      cer: 0.0
      wer: 0.0
    bible_00030:
      source: bible
      text: A Maleke Na Naŋ Taa A Ganlee Yɛlɛ.
      sbs: 0.634
      gen_sec: 2.4
      ref_sec: 3.8
      cer: 0.0769
      wer: 0.125
    bible_00031:
      source: bible
      text: Nɔmmo maŋ taa la teɛretɔroo ne yelzaa kyɛ maŋ di kannyiri ne yelzaa.
      sbs: 0.7159
      gen_sec: 5.36
      ref_sec: 3.94
      cer: 0.0182
      wer: 0.0769
    bible_00032:
      source: bible
      text: N naŋ da wa nyɛ O, N da le vɔgle la muro O gbɛɛ puliŋ a waa ŋa neɛ naŋ kpi.
      sbs: 0.7354
      gen_sec: 5.36
      ref_sec: 5.86
      cer: 0.0377
      wer: 0.0952
    bible_00033:
      source: bible
      text: Ba da te nyɛ la a yaa noɔre kuuri ka ba billi bare, kyɛ ba naŋ da te kpɛ a yaa poɔ, ba da
        ba nyɛ a Daana Yeezu eŋɛ.
      sbs: 0.6889
      gen_sec: 7.36
      ref_sec: 7.96
      cer: 0.1084
      wer: 0.1333
    bible_00034:
      source: bible
      text: A Yeezu naŋ da wa nyɛ a dɔɔ baala ka o gaŋ a be, kyɛ ka O da baŋ ka o gaŋ la a be ka a kɔɔre,
        O da soore la a dɔɔ, “Fo boɔrɔ la ka fo nyɛ laafeɛ be?
      sbs: 0.6647
      gen_sec: 10.16
      ref_sec: 12.62
      cer: 0.0
      wer: 0.0
    bible_00035:
      source: bible
      text: Ba e la a teŋɛzu noba, lɛnso ka bon ba naŋ yele waa a teŋɛzu yɛlɛ, ka a teŋɛzu noba pãã maŋ
        kyɛllɛ wono ba yɛlɛ.
      sbs: 0.7125
      gen_sec: 7.28
      ref_sec: 8.84
      cer: 0.0238
      wer: 0.1923
    bible_00036:
      source: bible
      text: Lɛ la ka o da boɔle o a soore o, ‘Boŋ la ka N wono kyaare ne fo ya?
      sbs: 0.6674
      gen_sec: 5.12
      ref_sec: 4.14
      cer: 0.1522
      wer: 0.2632
    bible_00037:
      source: bible
      text: Yɛ kaa a Izerayɛl biiri nyɛ; a banaŋ naŋ maŋ di a Naaŋmen bagmaale boma, ba ba maŋ waa a Naaŋmen
        bagmaalkuuri laŋne deme be?
      sbs: 0.7224
      gen_sec: 8.24
      ref_sec: 7.62
      cer: 0.0103
      wer: 0.04
    bible_00038:
      source: bible
      text: Kyɛ N na ko la a N dansediribe bayi naŋ su boɔre kparre kpeɛ̃õ ka ba yeli Ŋmen-yelmanna yelyelii
        bebie turi dɔgle kɔɔraayi ne lezaata.
      sbs: 0.6573
      gen_sec: 9.92
      ref_sec: 12.4
      cer: 0.0561
      wer: 0.16
    bible_00039:
      source: bible
      text: Te sɛgrɛ la a yɛlɛ ama ka ka a te kyelloo na paale.
      sbs: 0.7186
      gen_sec: 3.92
      ref_sec: 3.98
      cer: 0.0526
      wer: 0.0769
    bible_00040:
      source: bible
      text: ka ba da de O do ne sazu ne puubu.
      sbs: 0.6798
      gen_sec: 2.72
      ref_sec: 4.84
      cer: 0.0
      wer: 0.0
    bible_00041:
      source: bible
      text: Bonso, neɛ naŋ da waa gbaŋgbaa kyɛ ka ba boɔle o a Daana eŋɛ, so la o meŋɛ a waa a Daana soobo
        aŋa neɛ naŋ da so o meŋɛ a saŋ ba naŋ da boɔle o ka o leɛ a Kirista gbaŋgbaa lɛ.
      sbs: 0.7502
      gen_sec: 11.76
      ref_sec: 13.7
      cer: 0.0
      wer: 0.0
    bible_00042:
      source: bible
      text: A pɛnnoo bebiri kaŋ daare Yeezu naŋ da kyɛnɛ te tu kyi weɛ poɔ, a O potuuribo da kɔɔ la a
        kazuri mine a ŋmeɛnɛ ne ba nuuri ɔɔrɔ.
      sbs: 0.6626
      gen_sec: 8.96
      ref_sec: 10.12
      cer: 0.0102
      wer: 0.069
    bible_00043:
      source: bible
      text: Yɛ gu yɛmenne yi a nensaal-baare zie, a gu yɛmenne yi a yelfa-erebɛ zie, a gu yɛmenne yi a
        banaŋ naŋ maŋ kyerɛ noba eŋgama zie!
      sbs: 0.7843
      gen_sec: 9.12
      ref_sec: 9.92
      cer: 0.0309
      wer: 0.1154
    bible_00044:
      source: bible
      text: 'Azuiŋ la ka ba yeli: “Gɔŋgbire, iri!'
      sbs: 0.6975
      gen_sec: 3.2
      ref_sec: 3.24
      cer: 0.0385
      wer: 0.1429
    bible_00045:
      source: bible
      text: Pampana te ba de a andonɛɛ vooroŋ, kyɛ te de la a Vooroŋ na naŋ yi Naaŋmen zie, ka lɛ vɛŋ
        ka te na toɔ̃ baŋ a kyɔɔtaare na Naaŋmen naŋ ko te.
      sbs: 0.7495
      gen_sec: 8.88
      ref_sec: 9.46
      cer: 0.0
      wer: 0.0
    bible_00046:
      source: bible
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.6702
      gen_sec: 5.84
      ref_sec: 5.94
      cer: 0.0182
      wer: 0.2778
    bible_00047:
      source: bible
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.6612
      gen_sec: 7.04
      ref_sec: 14.94
      cer: 0.0455
      wer: 0.2273
    bible_00048:
      source: bible
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.6647
      gen_sec: 7.44
      ref_sec: 6.46
      cer: 0.0
      wer: 0.0
    bible_00049:
      source: bible
      text: Kyɛ a Gyuumine da erɛ la nyuuri, ka zɔɔŋmareba mine naŋ da be a daa poɔ da wa poɔ ba poɔ a
        soŋ ba ka ba da dɔ̃ɔ̃ a teŋɛ.
      sbs: 0.6598
      gen_sec: 8.56
      ref_sec: 9.82
      cer: 0.0575
      wer: 0.1667
    bible_00050:
      source: bible
      text: Kyɛ o naŋ da woŋ ka Akyilɔ la leɛre o saa Hɛrɔde zu a di a Gyudiya naaloŋ, a Yuzɛb da zoro
        la dabeɛ̃ ka o gaa a be.
      sbs: 0.674
      gen_sec: 7.52
      ref_sec: 8.9
      cer: 0.0476
      wer: 0.1379
    bible_00051:
      source: bible
      text: Yeezu Naŋ Koŋ A Gyɛruzɛlɛm Teŋɛ Yɛlɛ.
      sbs: 0.6623
      gen_sec: 2.88
      ref_sec: 10.58
      cer: 0.0667
      wer: 0.1429
    bible_00052:
      source: bible
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.6581
      gen_sec: 2.32
      ref_sec: 5.8
      cer: 0.0
      wer: 0.0
    bible_00053:
      source: bible
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.7001
      gen_sec: 6.16
      ref_sec: 6.64
      cer: 0.0164
      wer: 0.0526
    bible_00054:
      source: bible
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.713
      gen_sec: 4.24
      ref_sec: 4.32
      cer: 0.0227
      wer: 0.0714
    bible_00055:
      source: bible
      text: Yelmeŋɛ zaa, te naŋ da be yɛ zie, te da daŋ yeli ko yɛ la ka te na nyɛ la dɔgɛɛ; ka a da e
        a lɛ seŋ yɛ naŋ da baŋ.
      sbs: 0.7625
      gen_sec: 7.68
      ref_sec: 9.18
      cer: 0.0
      wer: 0.0
    bible_00056:
      source: bible
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.7228
      gen_sec: 6.48
      ref_sec: 7.02
      cer: 0.0
      wer: 0.0
    bible_00057:
      source: bible
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.7305
      gen_sec: 5.28
      ref_sec: 5.42
      cer: 0.0
      wer: 0.0
    bible_00058:
      source: bible
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.6978
      gen_sec: 6.64
      ref_sec: 7.12
      cer: 0.0556
      wer: 0.2609
    bible_00059:
      source: bible
      text: Tensogɔ koŋ la bebe; ba koŋ la boɔrɔ fentelɛ bee ŋmenaa veɛloŋ, bonso, a Daana Naaŋmen na
        la a ba veɛloŋ kyɛ ka ba di naaloŋ tegitegilɛ.
      sbs: 0.6622
      gen_sec: 10.56
      ref_sec: 10.54
      cer: 0.0
      wer: 0.0
    bible_00060:
      source: bible
      text: Ka a soba ŋa ne o zu wa e fo faa gbɛre boyopoi bebi-yeni poɔ, kyɛ leɛ wa fo zie gbɛre boyopoi
        a wa yeli, ‘N sããɛ la’, a ferɛɛ la ka fo di suuri ko o.
      sbs: 0.7034
      gen_sec: 10.0
      ref_sec: 11.34
      cer: 0.066
      wer: 0.1622
    bible_00061:
      source: bible
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.63
      gen_sec: 6.88
      ref_sec: 5.42
      cer: 0.0
      wer: 0.0
    bible_00062:
      source: bible
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.7027
      gen_sec: 3.84
      ref_sec: 3.44
      cer: 0.0
      wer: 0.0
    bible_00063:
      source: bible
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.6968
      gen_sec: 5.28
      ref_sec: 4.66
      cer: 0.1042
      wer: 0.1765
    bible_00064:
      source: bible
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.7254
      gen_sec: 5.12
      ref_sec: 4.9
      cer: 0.0625
      wer: 0.3333
    bible_00065:
      source: bible
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
      sbs: 0.7217
      gen_sec: 6.0
      ref_sec: 7.08
      cer: 0.0
      wer: 0.0
    bible_00066:
      source: bible
      text: 'Lɛ la ka N da woŋ kɔkɔre kaŋ a saluoni poɔ ka o yele: “N noba, yɛ wa yi o poɔ.'
      sbs: 0.7013
      gen_sec: 6.24
      ref_sec: 6.26
      cer: 0.0
      wer: 0.0
    jw_00000:
      source: jw
      text: TA WA TERƐ SORI KA NEƐZAA VƐNƐ KA SAGEDIIBU HO NAŊ TAA A LAŊNOƆRE PUORUU EŊƐŊ NA SIGRE TEŊƐ
      sbs: 0.6232
