      source: bible
      text: Pampana te ba de a andonɛɛ vooroŋ, kyɛ te de la a Vooroŋ na naŋ yi Naaŋmen zie, ka lɛ vɛŋ
        ka te na toɔ̃ baŋ a kyɔɔtaare na Naaŋmen naŋ ko te.
      sbs: 0.7392
      gen_sec: 8.54
      ref_sec: 9.46
      cer: 0.019
      wer: 0.0303
    bible_00046:
      source: bible
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.6891
      gen_sec: 4.67
      ref_sec: 5.94
      cer: 0.0182
      wer: 0.1667
    bible_00047:
      source: bible
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.6816
      gen_sec: 5.44
      ref_sec: 14.94
      cer: 0.0606
      wer: 0.1818
    bible_00048:
      source: bible
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.7314
      gen_sec: 5.95
      ref_sec: 6.46
      cer: 0.0267
      wer: 0.0455
    bible_00049:
      source: bible
      text: Kyɛ a Gyuumine da erɛ la nyuuri, ka zɔɔŋmareba mine naŋ da be a daa poɔ da wa poɔ ba poɔ a
        soŋ ba ka ba da dɔ̃ɔ̃ a teŋɛ.
      sbs: 0.6924
      gen_sec: 7.52
      ref_sec: 9.82
      cer: 0.0115
      wer: 0.0333
    bible_00050:
      source: bible
      text: Kyɛ o naŋ da woŋ ka Akyilɔ la leɛre o saa Hɛrɔde zu a di a Gyudiya naaloŋ, a Yuzɛb da zoro
        la dabeɛ̃ ka o gaa a be.
      sbs: 0.703
      gen_sec: 7.33
      ref_sec: 8.9
      cer: 0.0357
      wer: 0.1379
    bible_00051:
      source: bible
      text: Yeezu Naŋ Koŋ A Gyɛruzɛlɛm Teŋɛ Yɛlɛ.
      sbs: 0.6477
      gen_sec: 2.43
      ref_sec: 10.58
      cer: 0.0
      wer: 0.0
    bible_00052:
      source: bible
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.6688
      gen_sec: 1.98
      ref_sec: 5.8
      cer: 0.0741
      wer: 0.4
    bible_00053:
      source: bible
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.6899
      gen_sec: 4.96
      ref_sec: 6.64
      cer: 0.0656
      wer: 0.1579
    bible_00054:
      source: bible
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.7225
      gen_sec: 3.74
      ref_sec: 4.32
      cer: 0.0455
      wer: 0.0714
    bible_00055:
      source: bible
      text: Yelmeŋɛ zaa, te naŋ da be yɛ zie, te da daŋ yeli ko yɛ la ka te na nyɛ la dɔgɛɛ; ka a da e
        a lɛ seŋ yɛ naŋ da baŋ.
      sbs: 0.7384
      gen_sec: 6.66
      ref_sec: 9.18
      cer: 0.0
      wer: 0.0
    bible_00056:
      source: bible
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.7312
      gen_sec: 5.5
      ref_sec: 7.02
      cer: 0.0299
      wer: 0.1053
    bible_00057:
      source: bible
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.7269
      gen_sec: 5.06
      ref_sec: 5.42
      cer: 0.0164
      wer: 0.0526
    bible_00058:
      source: bible
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.7321
      gen_sec: 5.89
      ref_sec: 7.12
      cer: 0.0139
      wer: 0.0435
    bible_00059:
      source: bible
      text: Tensogɔ koŋ la bebe; ba koŋ la boɔrɔ fentelɛ bee ŋmenaa veɛloŋ, bonso, a Daana Naaŋmen na
        la a ba veɛloŋ kyɛ ka ba di naaloŋ tegitegilɛ.
      sbs: 0.6952
      gen_sec: 8.61
      ref_sec: 10.54
      cer: 0.0
      wer: 0.0
    bible_00060:
      source: bible
      text: Ka a soba ŋa ne o zu wa e fo faa gbɛre boyopoi bebi-yeni poɔ, kyɛ leɛ wa fo zie gbɛre boyopoi
        a wa yeli, ‘N sããɛ la’, a ferɛɛ la ka fo di suuri ko o.
      sbs: 0.729
      gen_sec: 8.83
      ref_sec: 11.34
      cer: 0.0283
      wer: 0.0811
    bible_00061:
      source: bible
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.6865
      gen_sec: 5.38
      ref_sec: 5.42
      cer: 0.0161
      wer: 0.0588
    bible_00062:
      source: bible
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.7468
      gen_sec: 3.3
      ref_sec: 3.44
      cer: 0.027
      wer: 0.1818
    bible_00063:
      source: bible
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.7183
      gen_sec: 3.9
      ref_sec: 4.66
      cer: 0.0
      wer: 0.0
    bible_00064:
      source: bible
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.7536
      gen_sec: 4.29
      ref_sec: 4.9
      cer: 0.0208
      wer: 0.2222
    bible_00065:
      source: bible
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
      sbs: 0.7254
      gen_sec: 4.96
      ref_sec: 7.08
      cer: 0.0175
      wer: 0.0588
    bible_00066:
      source: bible
      text: 'Lɛ la ka N da woŋ kɔkɔre kaŋ a saluoni poɔ ka o yele: “N noba, yɛ wa yi o poɔ.'
      sbs: 0.6933
      gen_sec: 4.99
      ref_sec: 6.26
      cer: 0.037
      wer: 0.0476
