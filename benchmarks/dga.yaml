      ref_sec: 7.14
      cer: 0.027
      wer: 0.1538
    bible_00018:
      source: bible
      text: A Yeezu pãã da leɛ soore ba la, “Yɛ buo soba la ka o bie bee o naadɛre na le bulee poɔ a pɛnnoo
