      cer: 0.152
      wer: 0.4118
    waxal_00040:
      source: waxal
      text: Noba la be kporeŋ a kpore lɔɔre la kõɔ yaga mine poɔ ba zaa wa neŋ pɛle bibili pɔge a ne dɔɔ
