      ref_sec: 21.14
      cer: 0.0538
      wer: 0.3659
    waxal_00036:
      source: waxal
      text: Tontoneba ba la are a kyɛ ba su la kaya zeere ba vɔgle kpoglo a kpoglo waa la peɛle ka mine
