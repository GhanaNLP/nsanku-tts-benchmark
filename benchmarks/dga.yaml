    jw_00066:
      source: jw
      text: VƐŊ KA NAAŊMEN YELBIRI NA EŊ BO FAŊA
      sbs: 0.6925
      gen_sec: 2.46
      ref_sec: 4.55
      cer: 0.1034
      wer: 0.375
    waxal_00000:
      source: waxal
      text: Bibiiri bayɔpoi la zeŋ, ba mine leɛ la ba nime kyaare taa, ka ba mine meŋ leɛ ba nimie a kaara
        zie kaŋa. Ba mine seɛ la teraza, ka ba mine meŋ seɛ kurigbɛŋaara. Kaŋa seɛ la kurigbɛŋmaa naŋ
        e bondoɔ
      sbs: 0.6315
      gen_sec: 12.38
      ref_sec: 19.02
      cer: 0.0658
      wer: 0.1707
    waxal_00001:
      source: waxal
      text: eŋfoɔne na poʊ bibile la zeŋ ka a kang a lɛ de a o bibile tɔsobo a dogle o gbɛɛ zu ka a kanga
        kanga ba su kparo kyɛ ba kyɛlee ne suɛ kang ka kang sul o zu kyɛ ba kyɛlee nɛ kyɛ ka baa zeŋ dokɔge
        bonyeni zu
      sbs: 0.6661
      gen_sec: 12.77
      ref_sec: 18.49
      cer: 0.1871
      wer: 0.4
    waxal_00002:
      source: waxal
      text: Dɔbɔ la a be lɔɔre zuŋ, a pɛgele malfa ane felakere. A dɔɔ kaŋa sue kparenuwogi pelaa. A malfabie
        mine meŋ biŋ a pareŋ.
      sbs: 0.6723
      gen_sec: 7.68
      ref_sec: 18.81
      cer: 0.0978
      wer: 0.3333
    waxal_00003:
      source: waxal
      text: Nobaa yaga la zeŋ ba waa pogeba naŋ zeŋ teŋɛ mine yɛrɛ kparzeere mine yɛrɛ kparpeɛle ka mine
        meŋ yɛre kparŋmonnɔŋmonɔ kyɛ ka ba eŋ boma mine orɔbareŋ ka mine de ba nuuri eŋ a boma poɔ a boma
        mine waa la kamaana mine waa bɛŋɛ ka mine meŋ waa simie meŋ.
      sbs: 0.6458
      gen_sec: 15.58
      ref_sec: 24.56
      cer: 0.0553
      wer: 0.2115
    waxal_00004:
      source: waxal
      text: Dɔɔba bayi ka pool dare ba ka kuri eŋ ka wire dɔre a be be ka wire ziɛ a be be ka ba vɔgle
        kpo peɛle ayi a mare a.
      sbs: 0.646
      gen_sec: 7.04
      ref_sec: 16.32
      cer: 0.1071
      wer: 0.4
    waxal_00005:
      source: waxal
      text: Bondimaale die poɔŋ la ka pɔɡelee kaŋa are a seɛ kurwoɡi bonzeɛ a kyɛ su kparnuwoori meŋ bonsɔɡelaa
        kyɛ ka kɔpo ane felaawɛre a parepare tabul kaŋa nuuriŋ kyɛ ka o pɛɡele boma mine.
      sbs: 0.6532
      gen_sec: 11.46
      ref_sec: 25.36
      cer: 0.1156
      wer: 0.3529
    waxal_00006:
      source: waxal
      text: Dakogigyamaa la biŋ biŋ ka dakogro ayi zaa maŋ taa la tabol a nimitɔɔre ka teere are lɔmboe
        ka poolo meŋ baba a lɔmboe.
      sbs: 0.6817
      gen_sec: 7.84
      ref_sec: 17.32
      cer: 0.0842
      wer: 0.2917
    waxal_00007:
      source: waxal
      text: Biiri bata la zeŋ die poɔ kogi-yenaa zu k'a bombile kaŋ zeŋ a boŋkpoŋ puoriŋ a eŋ nɔɔte doɔ
        a su kpare kyɛkyɛrɛɛ nu-ŋmaara, k'a sonsogere soba a boŋkpoŋ k'o seɛ mɔŋkuri sɔgelaa a ba su kparoŋ
        kyɛ de a bombile a dɔgele o gbɛɛ zu k'a bombile su kpare pelaa.
      sbs: 0.5204
      gen_sec: 15.84
      ref_sec: 20.81
      cer: 0.0508
      wer: 0.3137
    waxal_00008:
      source: waxal
      text: Dɔɔ la de o soola yi biŋ ŋmenaa poɔ. A soola eɛ kpoŋ ka o la de kaŋa meŋ a lɛle. A baateɛ
        niŋ la a soola lamboriŋ, kyɛ ka o puori sɛŋ ka noba mine meŋ gaa are yiri poɔ.
      sbs: 0.6508
      gen_sec: 10.14
      ref_sec: 17.31
      cer: 0.0645
      wer: 0.2195
    waxal_00009:
      source: waxal
      text: sɛɛre la ka ba sɛɛrɛ ka pɔge naŋ de weɛ a vara kyɛ ka a onaŋ naŋ be a puoreŋ meŋ noŋnɔ eŋnɛ.
        Naasalba ane niŋsaalsɔglɔ zaa la pullitaa.
      sbs: 0.6839
      gen_sec: 8.48
      ref_sec: 19.24
      cer: 0.1238
      wer: 0.3793
    waxal_00010:
      source: waxal
      text: Dakoge pilaa la biŋ ka kapuro dɔgle o zuiŋ kaa sɔgsɔgliŋ ka tabol dɔgle kyɛ ka dakoge kyaŋ
        sɔglaa meŋ biŋ ka kapuro dɔgloo zu kyɛ koo lambori meŋ ka tabol bile meŋ biŋ kɔge o.
      sbs: 0.5538
      gen_sec: 11.23
      ref_sec: 15.79
      cer: 0.0504
      wer: 0.2222
    waxal_00011:
      source: waxal
      text: Lɔɔre arɛɛ lɔɔre kãã emmo zie, pɔlbili kaŋ meŋ are la a be, o deni a lɔɔre kãã ennɛ a lɔɔre
        kaŋ poɔ, a lɔɔre mine e la bonsɔgelaa, o de la gbɛre kaŋ bare a kãã emmo dankyini.
      sbs: 0.6542
      gen_sec: 10.46
      ref_sec: 21.96
      cer: 0.0992
      wer: 0.3333
    waxal_00012:
      source: waxal
      text: Nasadɔbɔ ne nasapɔgebɔ la a are ka bamine su kpare zeere ka bamine su kpare giriin a hɔɔle
        kpogilo naŋ e peɛle k'a mine e zeere ka yikpoŋ kaŋa naŋ e sɔgelaa a are a ba puori sɛŋ.
      sbs: 0.6474
      gen_sec: 11.39
      ref_sec: 17.51
      cer: 0.0791
      wer: 0.2895
    waxal_00013:
      source: waxal
      text: Pɔgsarre bilii seɛ la wajeri kaa wajeri pɔg ba nyaã kye ka ba en lɛɛ ba kɔkɔɛ pou ba tuo la
        buma a gɛrɛ ni.
      sbs: 0.6424
      gen_sec: 6.98
      ref_sec: 16.62
      cer: 0.1707
      wer: 0.56
    waxal_00014:
      source: waxal
      text: Dɔɔ la su kparewoge koo pɔgoo eŋɛ zaa kyo ko vɔgle zu kpogle pelaa la yie meŋ are peɛloo ka
        teere meŋ yɛ are are a kɔge a yie.
      sbs: 0.6508
      gen_sec: 7.58
      ref_sec: 17.2
      cer: 0.0825
      wer: 0.2759
    waxal_00015:
      source: waxal
      text: Noba yaga arɛɛ la kaŋ are la a niŋeŋ a su kpare zeɛ naŋ kyoɔne peɛle, ba taaɛ filakiri, a
        zie waɛ sɔgelaa lɛ.
      sbs: 0.6555
      gen_sec: 6.85
      ref_sec: 17.27
      cer: 0.0843
      wer: 0.3333
    waxal_00016:
      source: waxal
      text: Nasapelaa la eŋ o nimikyaane kyɛ su o kpare pelaa ka bibiiri ŋmaa gili, a bibiiri nyɛ maale
        la ba zu kyɛ ka dɔɔlee kaŋa naŋ leɛ gyɛŋ yi are de o nuuri lantaa kyɛ are kaara zie kaŋa.
      sbs: 0.5335
      gen_sec: 11.2
      ref_sec: 19.87
      cer: 0.0284
      wer: 0.1282
    waxal_00017:
      source: waxal
      text: Naa la a zeŋ wiri zu a su dagakparoo ane kuree ka a wiri e sɔgelaa ka ba su kaaya peɛle a
        ŋmeɛrɛ gaŋgare a tuuro o ka pɔge are o nimitɔɔreŋ a seɛ kaayɛ daga wagya kaaya peɛle ane vaare
        ka pɔgelee a are o puoriŋ ka o pɛgle zoore ka naabo a gaŋ a be.
      sbs: 0.6213
      gen_sec: 15.84
      ref_sec: 29.7
      cer: 0.0471
      wer: 0.1754
    waxal_00018:
      source: waxal
      text: Dɔbɔ la are waa gyamaa lɛ. Ka teere are ba poore seŋ. Ka bole be a dɔbɔ mene nimisɔgoŋ. Ka
        a dɔbɔ mene vogle zupule kyɛ ba mene meŋ ba vogle a zupule
      sbs: 0.575
      gen_sec: 9.06
      ref_sec: 17.56
      cer: 0.0877
      wer: 0.2727
    waxal_00019:
      source: waxal
      text: Bondirii la zɛvaare zeɛre ane paɛ boma anuu ane gyɛlɛ ayi a de bɔɔdemoɔmo sɔl sɔl ata la be
        potoyua poɔ.
      sbs: 0.5967
      gen_sec: 7.3
      ref_sec: 16.03
      cer: 0.0723
      wer: 0.3333
    waxal_00020:
      source: waxal
      text: Yie ayi la are ka ba pili kaŋa moɔ a pili kaŋa meŋ kyɛnse kyɛ ka bipɔgelee a tuo baagi.
      sbs: 0.6045
      gen_sec: 5.57
      ref_sec: 15.69
      cer: 0.1194
      wer: 0.35
    waxal_00021:
      source: waxal
      text: Noba la are, ka kaŋa seɛ wogyɛ ka talarɛɛ ane orabasɔglɔ ane gyɛɛreka ane orabapeɛle, a biŋ,
        ka a pɔge kaŋa a ɔnnɔ kõɔ yire oraba kpoŋ kaŋa poɔ ennɛ bogti kaŋ poɔ.
      sbs: 0.6101
      gen_sec: 10.91
      ref_sec: 20.89
      cer: 0.1102
      wer: 0.4242
    waxal_00022:
      source: waxal
      text: Deɛmo zie la, ka dɔbɔ mine zeŋ a ŋmeɛrɛ gaŋgare, ka ba mine yiele yiele, kyɛ ka ba mine pãã
        be ba nimisogɔŋ a seɛrɛ kyɛ kpaara ba nuuri.
      sbs: 0.6877
      gen_sec: 8.48
      ref_sec: 16.13
      cer: 0.0673
      wer: 0.1034
    waxal_00023:
      source: waxal
      text: Vūū la di ka laafiiloŋ tontuma meŋ kaare a vūū Zie a wa de ba kõɔ a kpine a vūū ba su la kaaya
        doɔre kyɛ vɔgle zupele doɔre noba mine meŋ be la a be ba meŋ su la kaaya sɔglɔ.
      sbs: 0.5246
      gen_sec: 10.94
      ref_sec: 18.48
      cer: 0.0909
      wer: 0.2619
    waxal_00024:
      source: waxal
      text: Tome zie na, ba mine su ne bonsԑlebԑ. Dͻͻ kaŋa are la a de daa saare a peerԑ ne a teŋԑ sogͻ.
        O seԑ kuri gbԑwori naŋ e seԑ ԑ su kpare nuŋmaarԑ naŋ e tampԑloŋ. A dendͻԑ e na kuri. Dͻͻ kaŋa
        meŋ are la zie kaŋa, a seԑ kurigbԑwogiri naŋ e zeԑ ԑ su kpare nuŋmaarԑ meŋ naŋ e zeԑ.  Pԑmbuluu
        yagele na a de kuree kaŋa zu.
      sbs: 0.6496
      gen_sec: 18.56
      ref_sec: 29.28
      cer: 0.2265
      wer: 0.4143
    waxal_00025:
      source: waxal
      text: Bibiiri bayopoi la a zeŋ dԑre zu. A biiri mine bayi zeŋ kͻge la taa. A bie kaŋ su la kpare
        vaare kyԑ seԑ pieto sͻgelaa. Kaa kaŋ meŋ su kpare zeԑ kyԑ meŋ seԑ kure doͻre. ba deԑ ba gbԑԑ pare
        kaayaa zu.
      sbs: 0.6872
      gen_sec: 11.97
      ref_sec: 23.2
      cer: 0.2053
      wer: 0.4091
    waxal_00026:
      source: waxal
      text: Dakogro la a biŋ ka tabol bile a be a sensogleŋ ka fotori ayi a mare dankyini ka telee a meŋ
        a be a die poɔŋ ka ba de pili a yɛre biŋ avde a tabol a dɔgle.
      sbs: 0.6456
      gen_sec: 10.21
      ref_sec: 18.64
      cer: 0.0855
      wer: 0.2895
    waxal_00027:
      source: waxal
      text: Neɛ kaŋa tuoe peɛ ka boma be a peɛ poɔ kyɛ k,o taa kɔva ka kaŋ meŋ are a leɛ o puori k,o ka
        pɔge kaŋ meŋ mare bie a te kyɛnɛ waana kyɛ pɛgle pɔlenten sɔglaa ka dɔɔ kaŋ meŋ su kparepelaa
        kyɛ yɛre baage.
      sbs: 0.6439
      gen_sec: 12.67
      ref_sec: 17.15
      cer: 0.0196
      wer: 0.1304
    waxal_00028:
      source: waxal
      text: Pɔgebɔ laŋɛɛ taa ba seɛrɛɛ seɛre ba su la kaaya zèère pɔge kaŋa maal loo zu ba seɛrɛ la ne
        gbɛgbala.
      sbs: 0.5615
      gen_sec: 6.43
      ref_sec: 16.01
      cer: 0.1266
      wer: 0.381
    waxal_00029:
      source: waxal
      text: Tewɔmparɛɛ parɛɛparɛɛ kuori zie la ka pɔɡesaraa zeŋ dakoɡizeɛ zu kyɛ laara a liri o ɡbɛɛ kyɛ
        ka o doloŋ a te pelee a tewɔŋtuo mine naŋ bebe kyɛ ka o ɡɔɔ meŋ la te a pelee a tewɔnziiri mine
        a laara.
      sbs: 0.6564
      gen_sec: 12.96
      ref_sec: 19.38
      cer: 0.1677
      wer: 0.4524
    waxal_00030:
      source: waxal
      text: Noba la kyԑnԑ a yԑre baagere, a pԑgele boŋganne, ka teere be a zie ka mõõre meŋ bebe ka yire
        are tͻͻre lԑ.
      sbs: 0.6282
      gen_sec: 6.72
      ref_sec: 17.08
      cer: 0.2222
      wer: 0.3913
    waxal_00031:
      source: waxal
      text: Noba la laŋ taa a zeŋ gɔlle tabol ba naŋ de biŋ zie kaŋ soŋsogleŋ soga poɔ ka a noba zeŋ a
        kyɛ a kyɔgrɔ kɔmpeeta a nyɛrɛ yɛlɛ .
      sbs: 0.6379
      gen_sec: 8.13
      ref_sec: 16.32
      cer: 0.0722
      wer: 0.2069
    waxal_00032:
      source: waxal
      text: Neŋgyamaa la, ba mine are la, ba mine meŋ zeŋ la. Pɔge kaŋ naŋ zeŋ kono la, kyɛ ka kũũ daga
        biŋ ba nimisogɔŋ. Ba su la bonsɔglɔ. Ba mine vɔgle zupili. Ba mine ba vɔgle.
      sbs: 0.627
      gen_sec: 10.18
      ref_sec: 16.48
      cer: 0.016
      wer: 0.0278
    waxal_00033:
      source: waxal
      text: Pɔgɔ la a are a eŋ nimikyaanaaa a su kparresɔglaa ne kparrepelaa a de o nuuri a dogli tebol
        zu ka gane a dogli a tebol ka nobɔ a zeŋ a kyɛ a kaara a pɔgɔ.
      sbs: 0.6174
      gen_sec: 9.89
      ref_sec: 19.76
      cer: 0.0763
      wer: 0.1944
    waxal_00034:
      source: waxal
      text: Nɛmɛ zoma koɔrɔ zie a zie e la yɛloŋ lɛ ba kyaare la kataweere a sazuree zaa dɔba bayi a are
        kyaarɛɛ taa kaŋ su la kparewogi zeɛ a su kparenuwogri sɔglaa.
      sbs: 0.6671
      gen_sec: 10.27
      ref_sec: 20.24
      cer: 0.0656
      wer: 0.1875
    waxal_00035:
      source: waxal
      text: Namine la a zeŋ ka o potuurobo a zeŋ gɔloo ka dɔɔ kaŋ a are a su kpare pelaa a nyɔge a naa
        nu eŋa a puoro kataweɛ kyaare la a naa ka ba zeŋ kɔge dakyini naŋ waa boŋ pelaa.
      sbs: 0.6782
      gen_sec: 11.14
      ref_sec: 21.14
      cer: 0.0692
      wer: 0.2439
    waxal_00036:
      source: waxal
      text: Tontoneba ba la are a kyɛ ba su la kaya zeere ba vɔgle kpoglo a kpoglo waa la peɛle ka mine
        waa buluu bogi kaŋa be la ba nimisoga ba kpaare la kuree gɔgle a bogi ba kpaare la taabo eŋ a
        bogi poɔ waya kaŋa yi la a yeŋe wa kpɛ a bogi poɔ.
      sbs: 0.6117
      gen_sec: 14.56
      ref_sec: 22.28
      cer: 0.0663
      wer: 0.1818
    waxal_00037:
      source: waxal
      text: Dɔba mine bayi la zeŋ kaŋa zeŋɛɛ la kyɛ ka kaŋa a are a teɛnɛ o nu a wullo o tɔsoba kaŋ bonkaŋ
        naŋ be a dankyini eŋɛ kyɛ ka kyããne mine meŋ a mare mare a dankyime zaa kpɛlɛŋ a wa golli.
      sbs: 0.6789
      gen_sec: 12.0
      ref_sec: 17.04
      cer: 0.0634
      wer: 0.186
    waxal_00038:
      source: waxal
      text: Noba arɛɛ la gyamaa kyɛ ka torata na maŋ koɔra weɛ ka o are a torata kuori nyemɛ eɛ doɔre
        kyɛ ka a noba meŋ vɔgle zupili ka ba mine meŋ su kpare sɔglɔ.
      sbs: 0.5757
      gen_sec: 9.47
      ref_sec: 16.7
      cer: 0.094
      wer: 0.2647
    waxal_00039:
      source: waxal
