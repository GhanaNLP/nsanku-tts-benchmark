      gen_sec: 4.24
      ref_sec: 3.42
      cer: 0.0
      wer: 0.1818
    bible_00014:
      source: bible
      text: Ba naŋ wa te kpeɛrɛ a die, ba da nyɛ la a bie ne O ma Mareya, ka ba da gbi dumo a puori O
        ne emmo, kyɛ yuo ba woore a ko O kyɔɔtaare; salema, ensɛnse ane turaali.
