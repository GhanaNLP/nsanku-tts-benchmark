      ref_sec: 13.7
      cer: 0.0853
      wer: 0.2727
    bible_00042:
      source: bible
      text: A pɛnnoo bebiri kaŋ daare Yeezu naŋ da kyɛnɛ te tu kyi weɛ poɔ, a O potuuribo da kɔɔ la a
        kazuri mine a ŋmeɛnɛ ne ba nuuri ɔɔrɔ.
