      gen_sec: 12.56
      ref_sec: 20.64
      cer: 0.0397
      wer: 0.25
    waxal_00048:
      source: waxal
      text: Noba la taa gane a sɛge sɛgere eŋ bonzeere ane bonsɔgelɔ a vɛŋ ka noba kaara ka dɔɔ eŋ nimi-gele
