      gen_sec: 3.46
      ref_sec: 5.22
      cer: 0.2381
      wer: 0.5
    jw_00020:
      source: jw
      text: Sobuo ka Jehoova da maŋ tu kyɛ korɔ a Izerayɛl biiri sowuli?
      sbs: 0.6671
      gen_sec: 3.74
      ref_sec: 6.01
      cer: 0.1042
      wer: 0.0833
    jw_00021:
      source: jw
      text: De Apoɔsori Ho Naŋ Taa Ka Ho Puoro Jehoova O Siiloŋ Ŋmenpuoredie Naŋ Tegroŋ Yaga Zaa
      sbs: 0.701
      gen_sec: 5.86
      ref_sec: 6.3
      cer: 0.1159
      wer: 0.375
    jw_00022:
      source: jw
      text: Aneazaa ka a Kyɛrite noba, a Pɛlite noba, ane a Giti noba da ba e Izerayɛl biiri, kyɛ ba da
        taaɛ gyeremɛ naŋ e zuluŋ a ko Jehoova a yelmeŋɛ Naaŋmen, a neŋ neɛ na Jehoova naŋ sɔ naaloŋ kãã
        na. Deevid niŋe da paalɛɛŋ yaga zaa neŋ lɛ na a dɔbɔ ŋa naŋ da be o zieŋ a dire yelmennoŋ koroo
        na!
      sbs: 0.5428
