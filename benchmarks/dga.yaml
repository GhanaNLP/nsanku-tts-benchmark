      sbs: 0.6156
      gen_sec: 11.68
      ref_sec: 17.32
      cer: 0.25
      wer: 0.5
    waxal_00059:
      source: waxal
      text: Neŋgyamaa la, bas u la kpare sͻgelͻ a vͻgele zupili zeere. A dͻͻ kaŋ naŋ are be vͻgele la
        zupili sͻgelaa kyԑ kyԑ su kpare zeԑ, ka a dͻͻ kaŋa meŋ su kpare dõͻre a seԑ torͻza sͻgelaa.
