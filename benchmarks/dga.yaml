      cer: 0.1613
      wer: 0.7143
    jw_00053:
      source: jw
      text: Ka hooŋ kaa te gama na poɔŋ, ho na nyɛɛ fotori yaga naŋ wulo yelnimizeere. Wala hoŋ na baŋ
