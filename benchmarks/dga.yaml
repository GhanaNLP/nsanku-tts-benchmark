      cer: 0.0891
      wer: 0.4333
    jw_00054:
      source: jw
      text: YƐLƐ NAŊ NA BAŊ SOŊ TE KA TE TA TEƐRƐ TE YOŊ YƐLƐ BEE A TEƐRƐ KA TE SEƐ LA TE TAABA
      sbs: 0.7086
