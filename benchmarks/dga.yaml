      gen_sec: 8.1
      ref_sec: 11.08
      cer: 0.0851
      wer: 0.1765
    jw_00010:
      source: jw
      text: Bonso aŋ e nimizeɛ ka noba naŋ waana ka ba kultaa de emmo ko Jehoova ba kultaa bebiri?
