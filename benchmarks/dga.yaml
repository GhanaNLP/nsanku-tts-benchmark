      source: bible
      text: Bonso, neɛ naŋ da waa gbaŋgbaa kyɛ ka ba boɔle o a Daana eŋɛ, so la o meŋɛ a waa a Daana soobo
        aŋa neɛ naŋ da so o meŋɛ a saŋ ba naŋ da boɔle o ka o leɛ a Kirista gbaŋgbaa lɛ.
      sbs: 0.7426
      gen_sec: 14.08
      ref_sec: 13.7
      cer: 0.0155
      wer: 0.0227
    bible_00042:
      source: bible
      text: A pɛnnoo bebiri kaŋ daare Yeezu naŋ da kyɛnɛ te tu kyi weɛ poɔ, a O potuuribo da kɔɔ la a
        kazuri mine a ŋmeɛnɛ ne ba nuuri ɔɔrɔ.
      sbs: 0.7248
      gen_sec: 10.15
      ref_sec: 10.12
      cer: 0.0612
      wer: 0.2069
    bible_00043:
      source: bible
      text: Yɛ gu yɛmenne yi a nensaal-baare zie, a gu yɛmenne yi a yelfa-erebɛ zie, a gu yɛmenne yi a
        banaŋ naŋ maŋ kyerɛ noba eŋgama zie!
      sbs: 0.7563
      gen_sec: 10.5
      ref_sec: 9.92
      cer: 0.1031
      wer: 0.1923
    bible_00044:
      source: bible
      text: 'Azuiŋ la ka ba yeli: “Gɔŋgbire, iri!'
      sbs: 0.7355
      gen_sec: 3.07
      ref_sec: 3.24
      cer: 0.2308
      wer: 0.2857
    bible_00045:
      source: bible
      text: Pampana te ba de a andonɛɛ vooroŋ, kyɛ te de la a Vooroŋ na naŋ yi Naaŋmen zie, ka lɛ vɛŋ
        ka te na toɔ̃ baŋ a kyɔɔtaare na Naaŋmen naŋ ko te.
      sbs: 0.7361
      gen_sec: 11.52
      ref_sec: 9.46
      cer: 0.019
      wer: 0.0303
    bible_00046:
      source: bible
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.7101
      gen_sec: 5.63
      ref_sec: 5.94
      cer: 0.0909
      wer: 0.2778
    bible_00047:
      source: bible
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.685
      gen_sec: 7.17
      ref_sec: 14.94
      cer: 0.0152
      wer: 0.0455
    bible_00048:
      source: bible
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.6942
      gen_sec: 8.11
      ref_sec: 6.46
      cer: 0.04
      wer: 0.0909
    bible_00049:
      source: bible
      text: Kyɛ a Gyuumine da erɛ la nyuuri, ka zɔɔŋmareba mine naŋ da be a daa poɔ da wa poɔ ba poɔ a
        soŋ ba ka ba da dɔ̃ɔ̃ a teŋɛ.
      sbs: 0.7326
      gen_sec: 9.3
      ref_sec: 9.82
      cer: 0.023
      wer: 0.0333
    bible_00050:
      source: bible
      text: Kyɛ o naŋ da woŋ ka Akyilɔ la leɛre o saa Hɛrɔde zu a di a Gyudiya naaloŋ, a Yuzɛb da zoro
        la dabeɛ̃ ka o gaa a be.
      sbs: 0.7404
      gen_sec: 8.79
      ref_sec: 8.9
      cer: 0.0476
      wer: 0.1379
    bible_00051:
      source: bible
      text: Yeezu Naŋ Koŋ A Gyɛruzɛlɛm Teŋɛ Yɛlɛ.
      sbs: 0.627
      gen_sec: 3.24
      ref_sec: 10.58
      cer: 0.0
      wer: 0.0
    bible_00052:
      source: bible
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.645
      gen_sec: 2.9
      ref_sec: 5.8
      cer: 0.0741
      wer: 0.6
    bible_00053:
      source: bible
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.729
      gen_sec: 6.23
      ref_sec: 6.64
      cer: 0.0492
      wer: 0.1579
    bible_00054:
      source: bible
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.7245
      gen_sec: 4.95
      ref_sec: 4.32
      cer: 0.0909
      wer: 0.2143
    bible_00055:
      source: bible
      text: Yelmeŋɛ zaa, te naŋ da be yɛ zie, te da daŋ yeli ko yɛ la ka te na nyɛ la dɔgɛɛ; ka a da e
        a lɛ seŋ yɛ naŋ da baŋ.
      sbs: 0.7556
      gen_sec: 8.79
      ref_sec: 9.18
      cer: 0.0506
      wer: 0.0312
    bible_00056:
      source: bible
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.7611
      gen_sec: 7.08
      ref_sec: 7.02
      cer: 0.1045
      wer: 0.1579
    bible_00057:
      source: bible
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.743
      gen_sec: 6.49
      ref_sec: 5.42
      cer: 0.0164
      wer: 0.0526
    bible_00058:
      source: bible
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.7301
      gen_sec: 7.68
      ref_sec: 7.12
      cer: 0.0417
      wer: 0.087
    bible_00059:
      source: bible
      text: Tensogɔ koŋ la bebe; ba koŋ la boɔrɔ fentelɛ bee ŋmenaa veɛloŋ, bonso, a Daana Naaŋmen na
        la a ba veɛloŋ kyɛ ka ba di naaloŋ tegitegilɛ.
      sbs: 0.7033
      gen_sec: 11.52
      ref_sec: 10.54
      cer: 0.0472
      wer: 0.1111
    bible_00060:
      source: bible
      text: Ka a soba ŋa ne o zu wa e fo faa gbɛre boyopoi bebi-yeni poɔ, kyɛ leɛ wa fo zie gbɛre boyopoi
        a wa yeli, ‘N sããɛ la’, a ferɛɛ la ka fo di suuri ko o.
      sbs: 0.7611
      gen_sec: 11.26
      ref_sec: 11.34
      cer: 0.1226
      wer: 0.1081
    bible_00061:
      source: bible
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.6897
      gen_sec: 6.49
      ref_sec: 5.42
      cer: 0.0968
      wer: 0.1765
    bible_00062:
      source: bible
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.6835
      gen_sec: 3.84
      ref_sec: 3.44
      cer: 0.2703
      wer: 0.5455
    bible_00063:
      source: bible
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.6896
      gen_sec: 5.29
      ref_sec: 4.66
      cer: 0.1042
      wer: 0.2353
    bible_00064:
      source: bible
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.7331
      gen_sec: 5.12
      ref_sec: 4.9
      cer: 0.0208
      wer: 0.1111
    bible_00065:
      source: bible
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
