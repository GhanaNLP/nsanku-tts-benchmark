      cer: 0.0488
      wer: 0.3056
    waxal_00052:
      source: waxal
      text: Teelare la ka ba seɛrɛ ba zeŋɛɛ teelare la biŋ ba taa pɔge vuunee la a su kaaya ka a yitaa
