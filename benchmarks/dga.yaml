      sbs: 0.6812
      gen_sec: 19.76
      ref_sec: 18.84
      cer: 0.4724
      wer: 0.9038
    waxal_00065:
      source: waxal
      text: Nasadɔbɔ ayi ane pɔgeba bayi la zeŋ ba biŋ la tebol ba sensɔgleŋsɔga a dɔgle gama a pare kɔpore
