      text: MOƆRƆ HO MOƆBO ZAA A SONNƆ HO TAABA
      sbs: 0.7477
      gen_sec: 5.68
      ref_sec: 4.88
      cer: 0.1429
      wer: 0.75
    jw_00026:
      source: jw
      text: “Naaŋmen naaneŋ maale boma, boma la leɛre a menneŋ a wa bebe.”
      sbs: 0.6871
      gen_sec: 4.64
