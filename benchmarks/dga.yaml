      sbs: 0.6085
      gen_sec: 12.72
      ref_sec: 17.32
      cer: 0.2737
      wer: 0.5417
    waxal_00007:
      source: waxal
      text: Biiri bata la zeŋ die poɔ kogi-yenaa zu k'a bombile kaŋ zeŋ a boŋkpoŋ puoriŋ a eŋ nɔɔte doɔ
        a su kpare kyɛkyɛrɛɛ nu-ŋmaara, k'a sonsogere soba a boŋkpoŋ k'o seɛ mɔŋkuri sɔgelaa a ba su kparoŋ
        kyɛ de a bombile a dɔgele o gbɛɛ zu k'a bombile su kpare pelaa.
      sbs: 0.4868
      gen_sec: 23.08
      ref_sec: 20.81
      cer: 0.2284
      wer: 0.5294
    waxal_00008:
      source: waxal
      text: Dɔɔ la de o soola yi biŋ ŋmenaa poɔ. A soola eɛ kpoŋ ka o la de kaŋa meŋ a lɛle. A baateɛ
        niŋ la a soola lamboriŋ, kyɛ ka o puori sɛŋ ka noba mine meŋ gaa are yiri poɔ.
      sbs: 0.6133
      gen_sec: 15.28
      ref_sec: 17.31
      cer: 0.3468
      wer: 0.561
    waxal_00009:
      source: waxal
      text: sɛɛre la ka ba sɛɛrɛ ka pɔge naŋ de weɛ a vara kyɛ ka a onaŋ naŋ be a puoreŋ meŋ noŋnɔ eŋnɛ.
        Naasalba ane niŋsaalsɔglɔ zaa la pullitaa.
      sbs: 0.6324
      gen_sec: 12.28
      ref_sec: 19.24
      cer: 0.2381
      wer: 0.6207
    waxal_00010:
      source: waxal
      text: Dakoge pilaa la biŋ ka kapuro dɔgle o zuiŋ kaa sɔgsɔgliŋ ka tabol dɔgle kyɛ ka dakoge kyaŋ
        sɔglaa meŋ biŋ ka kapuro dɔgloo zu kyɛ koo lambori meŋ ka tabol bile meŋ biŋ kɔge o.
      sbs: 0.5602
      gen_sec: 17.0
      ref_sec: 15.79
      cer: 0.2014
      wer: 0.5
    waxal_00011:
      source: waxal
      text: Lɔɔre arɛɛ lɔɔre kãã emmo zie, pɔlbili kaŋ meŋ are la a be, o deni a lɔɔre kãã ennɛ a lɔɔre
        kaŋ poɔ, a lɔɔre mine e la bonsɔgelaa, o de la gbɛre kaŋ bare a kãã emmo dankyini.
      sbs: 0.6303
      gen_sec: 15.52
      ref_sec: 21.96
      cer: 0.3359
      wer: 0.6667
    waxal_00012:
      source: waxal
      text: Nasadɔbɔ ne nasapɔgebɔ la a are ka bamine su kpare zeere ka bamine su kpare giriin a hɔɔle
        kpogilo naŋ e peɛle k'a mine e zeere ka yikpoŋ kaŋa naŋ e sɔgelaa a are a ba puori sɛŋ.
      sbs: 0.631
      gen_sec: 21.6
      ref_sec: 17.51
      cer: 0.2086
      wer: 0.5263
    waxal_00013:
      source: waxal
      text: Pɔgsarre bilii seɛ la wajeri kaa wajeri pɔg ba nyaã kye ka ba en lɛɛ ba kɔkɔɛ pou ba tuo la
        buma a gɛrɛ ni.
      sbs: 0.6094
      gen_sec: 10.32
      ref_sec: 16.62
      cer: 0.2805
      wer: 0.64
    waxal_00014:
      source: waxal
      text: Dɔɔ la su kparewoge koo pɔgoo eŋɛ zaa kyo ko vɔgle zu kpogle pelaa la yie meŋ are peɛloo ka
        teere meŋ yɛ are are a kɔge a yie.
      sbs: 0.6929
      gen_sec: 20.92
      ref_sec: 17.2
      cer: 0.4536
      wer: 0.8966
    waxal_00015:
      source: waxal
      text: Noba yaga arɛɛ la kaŋ are la a niŋeŋ a su kpare zeɛ naŋ kyoɔne peɛle, ba taaɛ filakiri, a
        zie waɛ sɔgelaa lɛ.
      sbs: 0.6091
      gen_sec: 13.88
      ref_sec: 17.27
      cer: 0.2289
      wer: 0.6667
    waxal_00016:
      source: waxal
      text: Nasapelaa la eŋ o nimikyaane kyɛ su o kpare pelaa ka bibiiri ŋmaa gili, a bibiiri nyɛ maale
        la ba zu kyɛ ka dɔɔlee kaŋa naŋ leɛ gyɛŋ yi are de o nuuri lantaa kyɛ are kaara zie kaŋa.
      sbs: 0.5776
      gen_sec: 18.36
      ref_sec: 19.87
      cer: 0.1844
      wer: 0.4872
    waxal_00017:
      source: waxal
      text: Naa la a zeŋ wiri zu a su dagakparoo ane kuree ka a wiri e sɔgelaa ka ba su kaaya peɛle a
        ŋmeɛrɛ gaŋgare a tuuro o ka pɔge are o nimitɔɔreŋ a seɛ kaayɛ daga wagya kaaya peɛle ane vaare
        ka pɔgelee a are o puoriŋ ka o pɛgle zoore ka naabo a gaŋ a be.
      sbs: 0.6372
      gen_sec: 27.0
      ref_sec: 29.7
      cer: 0.2932
      wer: 0.7193
    waxal_00018:
      source: waxal
      text: Dɔbɔ la are waa gyamaa lɛ. Ka teere are ba poore seŋ. Ka bole be a dɔbɔ mene nimisɔgoŋ. Ka
        a dɔbɔ mene vogle zupule kyɛ ba mene meŋ ba vogle a zupule
      sbs: 0.539
      gen_sec: 14.24
      ref_sec: 17.56
      cer: 0.2895
      wer: 0.5758
    waxal_00019:
      source: waxal
      text: Bondirii la zɛvaare zeɛre ane paɛ boma anuu ane gyɛlɛ ayi a de bɔɔdemoɔmo sɔl sɔl ata la be
        potoyua poɔ.
      sbs: 0.6156
      gen_sec: 13.52
      ref_sec: 16.03
      cer: 0.3012
      wer: 1.0
    waxal_00020:
      source: waxal
      text: Yie ayi la are ka ba pili kaŋa moɔ a pili kaŋa meŋ kyɛnse kyɛ ka bipɔgelee a tuo baagi.
      sbs: 0.5707
      gen_sec: 8.28
      ref_sec: 15.69
      cer: 0.2537
      wer: 0.6
    waxal_00021:
      source: waxal
      text: Noba la are, ka kaŋa seɛ wogyɛ ka talarɛɛ ane orabasɔglɔ ane gyɛɛreka ane orabapeɛle, a biŋ,
        ka a pɔge kaŋa a ɔnnɔ kõɔ yire oraba kpoŋ kaŋa poɔ ennɛ bogti kaŋ poɔ.
      sbs: 0.6331
      gen_sec: 19.08
      ref_sec: 20.89
      cer: 0.2835
      wer: 0.6364
    waxal_00022:
      source: waxal
      text: Deɛmo zie la, ka dɔbɔ mine zeŋ a ŋmeɛrɛ gaŋgare, ka ba mine yiele yiele, kyɛ ka ba mine pãã
        be ba nimisogɔŋ a seɛrɛ kyɛ kpaara ba nuuri.
      sbs: 0.5565
      gen_sec: 13.44
      ref_sec: 16.13
      cer: 0.1154
      wer: 0.3103
    waxal_00023:
      source: waxal
      text: Vūū la di ka laafiiloŋ tontuma meŋ kaare a vūū Zie a wa de ba kõɔ a kpine a vūū ba su la kaaya
        doɔre kyɛ vɔgle zupele doɔre noba mine meŋ be la a be ba meŋ su la kaaya sɔglɔ.
      sbs: 0.5715
      gen_sec: 22.52
      ref_sec: 18.48
      cer: 0.197
      wer: 0.3571
    waxal_00024:
      source: waxal
      text: Tome zie na, ba mine su ne bonsԑlebԑ. Dͻͻ kaŋa are la a de daa saare a peerԑ ne a teŋԑ sogͻ.
        O seԑ kuri gbԑwori naŋ e seԑ ԑ su kpare nuŋmaarԑ naŋ e tampԑloŋ. A dendͻԑ e na kuri. Dͻͻ kaŋa
        meŋ are la zie kaŋa, a seԑ kurigbԑwogiri naŋ e zeԑ ԑ su kpare nuŋmaarԑ meŋ naŋ e zeԑ.  Pԑmbuluu
        yagele na a de kuree kaŋa zu.
      sbs: 0.6361
      gen_sec: 32.2
      ref_sec: 29.28
      cer: 0.6026
      wer: 0.9143
    waxal_00025:
      source: waxal
      text: Bibiiri bayopoi la a zeŋ dԑre zu. A biiri mine bayi zeŋ kͻge la taa. A bie kaŋ su la kpare
        vaare kyԑ seԑ pieto sͻgelaa. Kaa kaŋ meŋ su kpare zeԑ kyԑ meŋ seԑ kure doͻre. ba deԑ ba gbԑԑ pare
        kaayaa zu.
      sbs: 0.6422
      gen_sec: 20.6
      ref_sec: 23.2
      cer: 0.2583
      wer: 0.7273
    waxal_00026:
      source: waxal
      text: Dakogro la a biŋ ka tabol bile a be a sensogleŋ ka fotori ayi a mare dankyini ka telee a meŋ
        a be a die poɔŋ ka ba de pili a yɛre biŋ avde a tabol a dɔgle.
      sbs: 0.6166
      gen_sec: 15.52
      ref_sec: 18.64
      cer: 0.1795
      wer: 0.5
    waxal_00027:
      source: waxal
      text: Neɛ kaŋa tuoe peɛ ka boma be a peɛ poɔ kyɛ k,o taa kɔva ka kaŋ meŋ are a leɛ o puori k,o ka
        pɔge kaŋ meŋ mare bie a te kyɛnɛ waana kyɛ pɛgle pɔlenten sɔglaa ka dɔɔ kaŋ meŋ su kparepelaa
        kyɛ yɛre baage.
      sbs: 0.6332
      gen_sec: 24.6
      ref_sec: 17.15
      cer: 0.3268
      wer: 0.6739
    waxal_00028:
      source: waxal
      text: Pɔgebɔ laŋɛɛ taa ba seɛrɛɛ seɛre ba su la kaaya zèère pɔge kaŋa maal loo zu ba seɛrɛ la ne
        gbɛgbala.
      sbs: 0.5127
      gen_sec: 10.56
      ref_sec: 16.01
      cer: 0.2152
      wer: 0.7143
    waxal_00029:
      source: waxal
      text: Tewɔmparɛɛ parɛɛparɛɛ kuori zie la ka pɔɡesaraa zeŋ dakoɡizeɛ zu kyɛ laara a liri o ɡbɛɛ kyɛ
        ka o doloŋ a te pelee a tewɔŋtuo mine naŋ bebe kyɛ ka o ɡɔɔ meŋ la te a pelee a tewɔnziiri mine
        a laara.
      sbs: 0.607
      gen_sec: 26.48
      ref_sec: 19.38
      cer: 0.3355
      wer: 0.6905
    waxal_00030:
      source: waxal
      text: Noba la kyԑnԑ a yԑre baagere, a pԑgele boŋganne, ka teere be a zie ka mõõre meŋ bebe ka yire
        are tͻͻre lԑ.
      sbs: 0.6455
      gen_sec: 11.24
      ref_sec: 17.08
      cer: 0.5062
      wer: 0.913
    waxal_00031:
      source: waxal
      text: Noba la laŋ taa a zeŋ gɔlle tabol ba naŋ de biŋ zie kaŋ soŋsogleŋ soga poɔ ka a noba zeŋ a
        kyɛ a kyɔgrɔ kɔmpeeta a nyɛrɛ yɛlɛ .
      sbs: 0.617
      gen_sec: 13.08
      ref_sec: 16.32
      cer: 0.2165
      wer: 0.5517
    waxal_00032:
      source: waxal
      text: Neŋgyamaa la, ba mine are la, ba mine meŋ zeŋ la. Pɔge kaŋ naŋ zeŋ kono la, kyɛ ka kũũ daga
        biŋ ba nimisogɔŋ. Ba su la bonsɔglɔ. Ba mine vɔgle zupili. Ba mine ba vɔgle.
      sbs: 0.6104
      gen_sec: 15.36
      ref_sec: 16.48
      cer: 0.136
      wer: 0.3333
    waxal_00033:
      source: waxal
      text: Pɔgɔ la a are a eŋ nimikyaanaaa a su kparresɔglaa ne kparrepelaa a de o nuuri a dogli tebol
        zu ka gane a dogli a tebol ka nobɔ a zeŋ a kyɛ a kaara a pɔgɔ.
      sbs: 0.6063
      gen_sec: 14.2
      ref_sec: 19.76
      cer: 0.2712
      wer: 0.5556
    waxal_00034:
      source: waxal
      text: Nɛmɛ zoma koɔrɔ zie a zie e la yɛloŋ lɛ ba kyaare la kataweere a sazuree zaa dɔba bayi a are
        kyaarɛɛ taa kaŋ su la kparewogi zeɛ a su kparenuwogri sɔglaa.
      sbs: 0.6366
      gen_sec: 22.2
      ref_sec: 20.24
      cer: 0.2787
      wer: 0.625
    waxal_00035:
      source: waxal
      text: Namine la a zeŋ ka o potuurobo a zeŋ gɔloo ka dɔɔ kaŋ a are a su kpare pelaa a nyɔge a naa
        nu eŋa a puoro kataweɛ kyaare la a naa ka ba zeŋ kɔge dakyini naŋ waa boŋ pelaa.
      sbs: 0.6101
      gen_sec: 17.96
      ref_sec: 21.14
      cer: 0.2385
      wer: 0.5854
    waxal_00036:
      source: waxal
      text: Tontoneba ba la are a kyɛ ba su la kaya zeere ba vɔgle kpoglo a kpoglo waa la peɛle ka mine
        waa buluu bogi kaŋa be la ba nimisoga ba kpaare la kuree gɔgle a bogi ba kpaare la taabo eŋ a
        bogi poɔ waya kaŋa yi la a yeŋe wa kpɛ a bogi poɔ.
      sbs: 0.6378
      gen_sec: 32.64
      ref_sec: 22.28
      cer: 0.2044
      wer: 0.4545
    waxal_00037:
      source: waxal
      text: Dɔba mine bayi la zeŋ kaŋa zeŋɛɛ la kyɛ ka kaŋa a are a teɛnɛ o nu a wullo o tɔsoba kaŋ bonkaŋ
        naŋ be a dankyini eŋɛ kyɛ ka kyããne mine meŋ a mare mare a dankyime zaa kpɛlɛŋ a wa golli.
      sbs: 0.6314
      gen_sec: 17.16
      ref_sec: 17.04
      cer: 0.1972
      wer: 0.4186
    waxal_00038:
      source: waxal
      text: Noba arɛɛ la gyamaa kyɛ ka torata na maŋ koɔra weɛ ka o are a torata kuori nyemɛ eɛ doɔre
        kyɛ ka a noba meŋ vɔgle zupili ka ba mine meŋ su kpare sɔglɔ.
      sbs: 0.5371
      gen_sec: 16.04
      ref_sec: 16.7
      cer: 0.2051
      wer: 0.3824
    waxal_00039:
      source: waxal
      text: Pɔgesare bilee la laŋtaa a taa karitaare ba nuuri poɔ ba taɛ karitatɛtɛ a sɛgre meŋ naŋ be
        a karitaa poɔ sɛge tɛɛtɛɛ la kyɛ ka ba zɛge ba nuuri a eŋ saseɛ poɔ.
      sbs: 0.6099
      gen_sec: 14.84
      ref_sec: 19.4
      cer: 0.232
      wer: 0.4412
    waxal_00040:
      source: waxal
      text: Noba la be kporeŋ a kpore lɔɔre la kõɔ yaga mine poɔ ba zaa wa neŋ pɛle bibili pɔge a ne dɔɔ
        la be a kõɔ ba mine vɔle la ba zupele a teɛ a kyɛ laa.
      sbs: 0.5986
      gen_sec: 16.56
      ref_sec: 21.08
      cer: 0.1727
      wer: 0.5135
    waxal_00041:
      source: waxal
      text: Biiri bata ne pɔge a are sori zu ka lɔɛ zoro ka teere are gɔɔ ne doloŋ zaa ka yie meŋ are
        gyamaa lɛ a waa yipeɛle yoŋ tɛgɛ.
      sbs: 0.5329
      gen_sec: 13.36
      ref_sec: 16.67
      cer: 0.1809
      wer: 0.6207
    waxal_00042:
      source: waxal
      text: Pɔɔbɔ la tuo aŋkaare a kyɔɡe fuoliŋ tuuro taa ka kaŋ mare bie a ɡɛrɛ te pɔɡe pɔɔ naŋ yɛre
        baaɡe a leŋ zutalaa ka ba are yele yɛlɛ ka a o taa na meŋ a are kaara ba.
      sbs: 0.5358
      gen_sec: 14.64
      ref_sec: 19.92
      cer: 0.3226
      wer: 0.5641
    waxal_00043:
      source: waxal
      text: Pɔgesare la laŋ taa ka ba taa gama a lere ba nuuri a are ka kaŋ leŋ o zu wogri lɛ ka ba are
        dankyini seɛ ba mine sue bompelaa bonsɔglɔ ka kaŋ seɛ gondonsɔglaa ka ba are dankyini seɛ a laara.
      sbs: 0.516
      gen_sec: 16.08
      ref_sec: 20.56
      cer: 0.2365
      wer: 0.619
    waxal_00044:
      source: waxal
      text: Pɔge ne o pɔgeyaare la kaara ba felaaware ba gaadi poɔ ka a pɔge ane o pɔgeyaare bayi a zeŋ
        kyɛ ka kaŋa meŋ gaa te seŋ o yoŋ tɛgɛ.
      sbs: 0.6078
      gen_sec: 12.72
      ref_sec: 21.6
      cer: 0.18
      wer: 0.6333
    waxal_00045:
      source: waxal
      text: Pɔgebileee la be a zie ŋa bɔli ,la ka ba ŋmeɛrɛ ba mine su la kpare zēēre ka ba mine meŋ su
        kpare dɔre ,ba zaa be la mubilee mine poɔ ka kaŋa de o gbɛre pare a bɔli zu.
      sbs: 0.625
      gen_sec: 15.56
      ref_sec: 18.96
      cer: 0.2778
      wer: 0.525
    waxal_00046:
      source: waxal
      text: Bondirii maaloo zie la ba marɛɛ vūū ba dogle la a daransaŋ a vūū zu ba are kɔge la a tabol
        a pɔge seɛ la wagyɛ o de la nu a kori o zu a bie are la o su la kparoo doɔre o seɛ la monkuri
        naŋ leni doɔre ane peɛle.
      sbs: 0.6606
      gen_sec: 34.12
      ref_sec: 20.07
      cer: 0.2722
      wer: 0.5385
    waxal_00047:
      source: waxal
      text: Dɔbɔ ne pɔgebɔ la lantaa waa gyɛmaa lɛ ka bamine su bonyaayirii, bamine meŋ su bontɛɛtɛɛ kyɛ
        ka bonwogiri mine meŋ are a e karetaare ka teere meŋ be a ba poɔŋ.
      sbs: 0.5851
      gen_sec: 14.44
      ref_sec: 20.64
      cer: 0.1905
      wer: 0.5625
    waxal_00048:
      source: waxal
      text: Noba la taa gane a sɛge sɛgere eŋ bonzeere ane bonsɔgelɔ a vɛŋ ka noba kaara ka dɔɔ eŋ nimi-gele
        ka a e bonsɔgelɔ ka kaŋa hɔgele zupili ka bondoɔre a bebe kyɛ ka ba zɛge a bone ka noba kaara
        .
      sbs: 0.6018
      gen_sec: 20.12
      ref_sec: 16.76
      cer: 0.3758
      wer: 0.8293
    waxal_00049:
      source: waxal
      text: Bibiiri la a su kparedɛgɛ a zeŋ zidɛgre poɔ ba nyɔge la dɛre geli a lanne dankyini a do zeŋ
        batori biŋ biŋ la ba nimitɔɔre kyɛ ka kartaare meŋ biŋ ba nimitɔɔre saga be la ba nimitɔɔre meŋ.
      sbs: 0.5933
      gen_sec: 20.72
      ref_sec: 22.11
      cer: 0.1879
      wer: 0.5385
    waxal_00050:
      source: waxal
      text: Pɔllee la vuuni, o de la o nu ti ne bonsɔglaa kaŋ. A pɔllee su la kparesɔgelaa, kyɛ a pɔllee
        lamboriŋ batere dɔgele la bonsgelaa kaŋ zu. A pɔllee puoriŋ. Keɛos kaŋ arɛɛ la ka ba penti o buluu.
      sbs: 0.6587
      gen_sec: 18.48
      ref_sec: 20.36
      cer: 0.2432
      wer: 0.4872
    waxal_00051:
      source: waxal
      text: Ba kyɛne la a kyɛ kɔrekɔre nuuri a kyɛne die kaŋ naŋ are ka ba tɛɛ boma gyolokɔloŋ die laŋ
        boɛ poɔ ba mine vaare la wagye pɛle a kyɛne ka kaŋ be puori a kyɛne.
      sbs: 0.6402
      gen_sec: 17.44
      ref_sec: 21.09
      cer: 0.252
      wer: 0.5
    waxal_00052:
      source: waxal
      text: Teelare la ka ba seɛrɛ ba zeŋɛɛ teelare la biŋ ba taa pɔge vuunee la a su kaaya ka a yitaa
        ka o le o zutara ka a kaaya yitaa de o nu te a bie kaŋa naŋ zeŋ a o niŋe sɔgaŋ.
      sbs: 0.5701
      gen_sec: 16.8
      ref_sec: 16.17
      cer: 0.2047
      wer: 0.5581
    waxal_00053:
      source: waxal
      text: Laa pelaa la eŋ bondirii mui ane bɛŋɛ ka vaare a bebe ka ka ka zam ka zama dɔgle ka
      sbs: 0.6229
      gen_sec: 10.72
      ref_sec: 17.15
      cer: 0.3125
      wer: 0.8
    waxal_00054:
      source: waxal
      text: Kãã koͻroo zie la. Ka pͻgebͻ mine bayi ane bibiiri bata a are a niŋe poͻŋ. Lͻԑ be la a zie
        ŋa ka noba mine meŋ a taa motori a zeŋ a zu poͻ.
      sbs: 0.6493
      gen_sec: 17.16
      ref_sec: 17.4
      cer: 0.1942
      wer: 0.4706
    waxal_00055:
      source: waxal
      text: Pɔgebɔ la a are. A pɔgebɔ nyɔgɛɛ ba nuuri a zɛge ka a do, kyɛ ka soola panal a biŋ a ba niŋe
        sogɔ. moɔ meŋ be la a ba puriŋ.
      sbs: 0.5913
      gen_sec: 11.88
      ref_sec: 17.24
      cer: 0.2
      wer: 0.3226
    waxal_00056:
      source: waxal
      text: Poɔ la ka noba are, ka kaŋ su kparre nu sɔglo kpare sɔglo kyɛ vɔgle zupele dɔre kyɛ seɛ treasure
        ka pɔɔli a are ka nensaala di o nu tu kuri kaŋ naŋ zaŋlaa a waa sɔglaa.
      sbs: 0.5615
      gen_sec: 17.2
      ref_sec: 19.32
      cer: 0.2462
      wer: 0.5405
    waxal_00057:
      source: waxal
      text: Boma,pooli daare ane wire dɔ ane wire ziɛ ka dɔɔba bayi a vɔgle kpo peɛle kyɛ ti a pooli daa
        a pooli daa a daa kaŋa.
      sbs: 0.6024
      gen_sec: 12.8
      ref_sec: 17.07
      cer: 0.2697
      wer: 0.7308
    waxal_00058:
      source: waxal
      text: Pɔge kaŋa la zeŋ, a pɔge zeŋ dagle la ,o laɛ la ,wagyere meŋ ŋmaa gyile la a pɔge, a mine
        silee la kyɛ ka a mine meŋ yagele a lɛ a wagyere meŋ waa la iri iri.
      sbs: 0.5833
      gen_sec: 17.84
      ref_sec: 17.32
      cer: 0.1983
      wer: 0.5263
    waxal_00059:
      source: waxal
      text: Neŋgyamaa la, bas u la kpare sͻgelͻ a vͻgele zupili zeere. A dͻͻ kaŋ naŋ are be vͻgele la
        zupili sͻgelaa kyԑ kyԑ su kpare zeԑ, ka a dͻͻ kaŋa meŋ su kpare dõͻre a seԑ torͻza sͻgelaa.
      sbs: 0.607
      gen_sec: 16.56
      ref_sec: 15.68
      cer: 0.4571
      wer: 0.8158
    waxal_00060:
      source: waxal
      text: koɔ poɔ la ka gbori a are ka noba kpɛ. be a gbori poɔ kaa kaŋa a kyɛne a pɛgeli a Zuma ane
        a roober sɔglaa
      sbs: 0.643
      gen_sec: 11.48
      ref_sec: 16.54
      cer: 0.1875
      wer: 0.3846
    waxal_00061:
      source: waxal
      text: Dɔbɔ la laŋ taa a manna Naaŋmene yɛlɛ a korɔ taa ba baare meŋ be la ba puoriŋ kaŋ waa sɔglaa
        ka kaŋ waa pelaa ka teɛ a bebe ka ba zeŋ kyɛ ba boŋ koɔle meŋ pãã te be la a moore poɔ zie.
      sbs: 0.6674
      gen_sec: 19.28
      ref_sec: 24.84
      cer: 0.2878
      wer: 0.5111
    waxal_00062:
      source: waxal
      text: Noba mine la a are are a ŋmaa gyili ka ba de plane bile kaŋa a biŋ.
      sbs: 0.5126
      gen_sec: 6.48
      ref_sec: 15.83
      cer: 0.22
      wer: 0.6471
    waxal_00063:
      source: waxal
      text: Laafeɛloŋ ane gyɛl nyɛ boŋyɛllɛ noba la a kaara yɛllɛ banaŋ na e kaataa sommo la. Ba zaa su
        la kparepeɛle. Ba mine ziŋɛɛ la kyɛ ka bamine are a mɔrɔlaare.
      sbs: 0.5987
      gen_sec: 14.12
      ref_sec: 24.8
      cer: 0.2066
      wer: 0.7419
    waxal_00064:
      source: waxal
      text: Deɛn deɛn zeɛ kanga la a zeɛ nga bibile kanga arẽ a nimitoore be ka poɔ kanga arẽ a ɔ poɔring
        kye ka doɔ kanga meng arẽ a de bun pen a le ɔ zu pou kye ka ba menne meng arẽ ɔ poɔring kye ka
        a bibile nga a muri laare.
      sbs: 0.6276
      gen_sec: 18.92
      ref_sec: 18.84
      cer: 0.4417
      wer: 0.7885
    waxal_00065:
      source: waxal
      text: Nasadɔbɔ ayi ane pɔgeba bayi la zeŋ ba biŋ la tebol ba sensɔgleŋsɔga a dɔgle gama a pare kɔpore
        a eŋ filaware kyɛ ka a dɔɔ ba bayi pɔge gaŋ zeŋ la dakogi kyɛrɛkyɛrɛ zu k'o waa boŋ pelaa kaŋ
        meŋ zeŋ ba sensɔgleŋ sɔga kyɛ ka kaara a gane a dɔɔ naŋ taa.
      sbs: 0.5134
      gen_sec: 27.2
      ref_sec: 22.47
      cer: 0.2256
      wer: 0.5185
