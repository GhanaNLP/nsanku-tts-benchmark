      cer: 0.0288
      wer: 0.1556
    waxal_00062:
      source: waxal
      text: Noba mine la a are are a ŋmaa gyili ka ba de plane bile kaŋa a biŋ.
      sbs: 0.5447
      gen_sec: 4.56
      ref_sec: 15.83
      cer: 0.44
      wer: 0.5294
    waxal_00063:
      source: waxal
      text: Laafeɛloŋ ane gyɛl nyɛ boŋyɛllɛ noba la a kaara yɛllɛ banaŋ na e kaataa sommo la. Ba zaa su
