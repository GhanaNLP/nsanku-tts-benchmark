      cer: 0.125
      wer: 0.6
    jw_00002:
      source: jw
      text: VƐŊ KA HO TEƐROŊ GAŊ KA HO NAŊ KYƐNƐ SIGRI HO MEŊƐ MEŊ
      sbs: 0.6669
      gen_sec: 4.64
      ref_sec: 4.96
