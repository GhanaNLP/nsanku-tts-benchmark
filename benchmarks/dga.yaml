      gen_sec: 1.6
      ref_sec: 3.25
      cer: 0.0625
      wer: 0.4
    jw_00004:
      source: jw
      text: A maŋ kyɛrɛɛ fẽẽ ka N nyɛ accident, kyɛbee N maŋ de la a lɔɔre te va boma mine naŋ are?
      sbs: 0.6521
      gen_sec: 5.84
      ref_sec: 8.08
      cer: 0.1077
      wer: 0.1905
    jw_00005:
      source: jw
      text: GYOOB YƐLƐ ŊA NA BAŊ SOŊ TEŊ KA TE NYƆGRƆ TE MENNE
      sbs: 0.6238
      gen_sec: 4.24
      ref_sec: 5.44
      cer: 0.1795
      wer: 0.4167
    jw_00006:
      source: jw
      text: Bon nanso ka Naaŋmen tere sori teŋ dire dɔgɛɛ
      sbs: 0.6883
      gen_sec: 3.2
      ref_sec: 4.74
      cer: 0.1081
      wer: 0.6667
    jw_00007:
      source: jw
      text: Sobuoŋ ka a Baabole vɛŋ teŋ baŋ peɛlaaŋ ka ka Jehoovaŋ wa di suuri ko te, a ba la seŋ ka te
        vɛŋ ka a dɔnnɔ te?
      sbs: 0.6627
      gen_sec: 7.44
      ref_sec: 8.01
      cer: 0.1098
      wer: 0.2222
    jw_00008:
      source: jw
      text: Hulda Da Toɔ̃ Ta La Yɛlɛ Na Oŋ Da De Biŋ O Nimitɔɔreŋ Na
      sbs: 0.6619
      gen_sec: 4.96
      ref_sec: 4.72
      cer: 0.0714
      wer: 0.1429
    jw_00009:
      source: jw
      text: Jehoova da wuli teŋ ka o sereŋ eɛ siri ka o kaa te zu. Yɛlɛ yoŋ aŋ da seŋ ka te e la ka te
        de o Naaloŋ yɛlɛ de weɛ te zemmo poɔŋ.
      sbs: 0.6617
      gen_sec: 8.88
      ref_sec: 11.08
      cer: 0.0957
      wer: 0.1471
    jw_00010:
      source: jw
      text: Bonso aŋ e nimizeɛ ka noba naŋ waana ka ba kultaa de emmo ko Jehoova ba kultaa bebiri?
      sbs: 0.6418
      gen_sec: 6.64
      ref_sec: 6.49
      cer: 0.0735
      wer: 0.2778
    jw_00011:
      source: jw
      text: WALA HOŊ NA IRI A NOƆRE?
      sbs: 0.6833
      gen_sec: 2.4
      ref_sec: 3.44
      cer: 0.1111
      wer: 0.6667
    jw_00012:
      source: jw
      text: Bonso aŋ ba fɛre ka te baŋ bieu yɛlɛ sɛre kyɛ na baŋ taa popeɛloŋ?
      sbs: 0.6986
      gen_sec: 4.8
      ref_sec: 6.54
      cer: 0.0196
      wer: 0.0667
    jw_00013:
      source: jw
      text: WALA HOŊ NA IRI A NOƆRE?
      sbs: 0.711
      gen_sec: 2.32
      ref_sec: 3.18
      cer: 0.1111
      wer: 0.6667
    jw_00014:
      source: jw
      text: Maŋ Moɔrɔ Ka Ho Manne Yɛlɛ Na Hoŋ Zanne Na Ko Ho Taaba
      sbs: 0.6561
      gen_sec: 4.0
      ref_sec: 4.84
      cer: 0.0238
      wer: 0.2308
    jw_00015:
      source: jw
      text: LƐ TEŊ NA BAŊ E TAA POPEƐLOŊ KYƐ NAŊ KYƐNLƐ
      sbs: 0.6557
      gen_sec: 3.52
      ref_sec: 5.53
      cer: 0.1471
      wer: 0.5
    jw_00016:
      source: jw
      text: Te na zanne nyɛɛ tɛɛtɛɛ naŋ be yelmeŋɛ na te naŋ zanne yi Jehoova zie, ane zirii na Setaana
        ane te dɔndɔnne naŋ ŋmaara na kpakyagaŋ.
      sbs: 0.6458
      gen_sec: 9.28
      ref_sec: 9.61
      cer: 0.0857
      wer: 0.2692
    jw_00017:
      source: jw
      text: Ka ba naŋ yelka Jehoova de la o yuori na ko Yezu, wala ka lɛ wuli?
      sbs: 0.6805
      gen_sec: 4.64
      ref_sec: 6.4
      cer: 0.102
      wer: 0.3125
    jw_00018:
      source: jw
      text: Gyoob Gane Na Na Baŋ Soŋ Boŋ Ka Ho Terɛ Kawaŋ-Sonne
      sbs: 0.6737
      gen_sec: 4.0
      ref_sec: 5.63
      cer: 0.2
      wer: 0.6364
    jw_00019:
      source: jw
      text: NAŊ KYƐNƐ TU PUORE SƆROO EŊƐŊ A TAGRA PEƐLƐ JEHOOVA
      sbs: 0.6672
      gen_sec: 4.32
      ref_sec: 5.22
      cer: 0.2619
      wer: 0.4
    jw_00020:
      source: jw
      text: Sobuo ka Jehoova da maŋ tu kyɛ korɔ a Izerayɛl biiri sowuli?
      sbs: 0.6648
      gen_sec: 5.04
      ref_sec: 6.01
      cer: 0.1458
      wer: 0.3333
    jw_00021:
      source: jw
      text: De Apoɔsori Ho Naŋ Taa Ka Ho Puoro Jehoova O Siiloŋ Ŋmenpuoredie Naŋ Tegroŋ Yaga Zaa
      sbs: 0.6483
      gen_sec: 6.32
      ref_sec: 6.3
      cer: 0.087
      wer: 0.4375
    jw_00022:
      source: jw
      text: Aneazaa ka a Kyɛrite noba, a Pɛlite noba, ane a Giti noba da ba e Izerayɛl biiri, kyɛ ba da
        taaɛ gyeremɛ naŋ e zuluŋ a ko Jehoova a yelmeŋɛ Naaŋmen, a neŋ neɛ na Jehoova naŋ sɔ naaloŋ kãã
        na. Deevid niŋe da paalɛɛŋ yaga zaa neŋ lɛ na a dɔbɔ ŋa naŋ da be o zieŋ a dire yelmennoŋ koroo
        na!
      sbs: 0.5375
      gen_sec: 18.08
      ref_sec: 6.44
      cer: 0.1096
      wer: 0.3333
    jw_00023:
      source: jw
      text: Sori A Daŋyelbo Naŋ Tu A Nyɛ Eebo
      sbs: 0.6862
      gen_sec: 2.56
      ref_sec: 3.3
      cer: 0.1154
      wer: 0.375
    jw_00024:
      source: jw
      text: TƆNƆ NOBA NAŊ BE A SIILOŊ POƆ PARADIISI NAŊ NYƐRƐ
      sbs: 0.6999
      gen_sec: 3.12
      ref_sec: 5.58
      cer: 0.05
      wer: 0.2
    jw_00025:
