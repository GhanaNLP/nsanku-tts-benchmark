      gen_sec: 4.56
      ref_sec: 3.56
      cer: 0.0
      wer: 0.1538
    bible_00016:
      source: bible
      text: O naŋ da wono tuo, O da ba yeli yɛlɛ tɔ dabeɛ̃ eŋ neɛzaa; kyɛ O da dɛle la a soba na naŋ maŋ
        di sɛrɛɛ ne mennoŋ.
