      gen_sec: 7.68
      ref_sec: 9.4
      cer: 0.0247
      wer: 0.0714
    bible_00017:
      source: bible
      text: O naŋ da wa ta a mane noɔre, O da nyɛ la nembeɛoŋ ka ba nembaaloŋ kpɛ O yaga, ka O da saŋ
