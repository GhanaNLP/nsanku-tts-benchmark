      cer: 0.5156
      wer: 0.55
    waxal_00054:
      source: waxal
      text: Kãã koͻroo zie la. Ka pͻgebͻ mine bayi ane bibiiri bata a are a niŋe poͻŋ. Lͻԑ be la a zie
