      gen_sec: 13.2
      ref_sec: 14.04
      cer: 0.0294
      wer: 0.125
    bible_00025:
      source: bible
      text: Kyɛ a ŋaa la ka yɛ mine da waa, kyɛ ka ba da pɛge yɛ.
