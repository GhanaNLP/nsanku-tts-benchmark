      gen_sec: 12.24
      ref_sec: 18.96
      cer: 0.1349
      wer: 0.35
    waxal_00046:
      source: waxal
      text: Bondirii maaloo zie la ba marɛɛ vūū ba dogle la a daransaŋ a vūū zu ba are kɔge la a tabol
