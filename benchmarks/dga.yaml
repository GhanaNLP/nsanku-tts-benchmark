  entries:
    '0':
      text: Ka maa bare ba ne a kɔŋ ka ba kulo, ba na yĩĩe la a sobiriŋ, bonso, ba mine yi la tentɔbɔ
        a wa.
      sbs: 0.6986
      gen_sec: 5.73
      ref_sec: 7.66
    '2':
      text: A Yeezu naŋ da gɛrɛ Gyɛruzɛlɛm, O da kpɛ la a teŋkponni ane a tembilii poore a kanna a noba
        gɛrɛ.
      sbs: 0.7131
      gen_sec: 6.11
      ref_sec: 7.54
    '3':
      text: A Naaŋmen Bagmaale Wederebɛ Nembɛrɛ Zusoba Naŋ Soore Yeezu Soorebie.
      sbs: 0.6283
      gen_sec: 4.58
      ref_sec: 8.22
    '5':
      text: Azuiŋ, yɛ ta daŋ di sɛrɛɛ kyɛ ka a saŋ ba ta; kyɛ ka a Daana waabo naŋ ba ta sɛre.
      sbs: 0.7523
      gen_sec: 5.09
      ref_sec: 5.84
    '6':
      text: O naŋ da wa pɔge te a Azɔ poɔ, o da kpɛ la a gbori ka te gaa Mitelen.
      sbs: 0.6868
      gen_sec: 4.13
      ref_sec: 6.46
    '7':
      text: Ba da lɔɔ o la bare ka o sigi wa a teŋɛzu, a lɔɔ a o malekere meŋ poɔ o eŋɛ.
      sbs: 0.7209
      gen_sec: 4.9
      ref_sec: 6.06
    '8':
      text: Ka a toŋkpeɛne ama naŋ toŋ fo poɔ, da toŋ Sodom teŋɛ poɔ, o da na kyɛnɛ bebe la wa ta zenɛ.
      sbs: 0.7323
      gen_sec: 5.7
      ref_sec: 7.3
    '10':
      text: A banaŋ naŋ da zo yaare da yi yoɔrɔ la, a moɔlɔ a yelbiri.
      sbs: 0.7067
      gen_sec: 3.55
      ref_sec: 5.66
    '11':
      text: N poyɛŋ noba, nɔpaalaa naane ka N sɛgrɛ korɔ yɛ, kyɛ a nɔkoraa na yɛ naŋ da taa yi a piiluu
        saŋ la.
      sbs: 0.7143
      gen_sec: 6.14
      ref_sec: 8.0
    '12':
      text: ” Ka Yeezu da yeli, “Yɛ e ka a noba zeŋ teŋɛ.
      sbs: 0.6818
      gen_sec: 2.59
      ref_sec: 14.68
    '13':
      text: Wola pãã ka a weɛ soba na e a wɛkaareba ŋa?
      sbs: 0.7497
      gen_sec: 2.75
      ref_sec: 3.42
    '15':
      text: Ona la boɔrɔ ka neɛzaa nyɛ faabo a kyɛ wa baŋ a yelmeŋɛ.
      sbs: 0.752
      gen_sec: 3.55
      ref_sec: 3.56
    '19':
      text: Pɔɔl Naŋ Puori A Filipae Deme Yaane.
      sbs: 0.7064
      gen_sec: 2.34
      ref_sec: 5.12
    '20':
      text: Bonso, ba da ba sage de a banaŋ zaa naŋ da wa yeli a O kuuni poɔ leɛ-iruu yɛlɛ ko ba.
      sbs: 0.7121
      gen_sec: 5.44
      ref_sec: 5.86
    '21':
      text: ” Ba da do la a sazu a zunzugri poɔ ka a ba dɔndɔnne da kaara ba.
      sbs: 0.6927
      gen_sec: 4.32
      ref_sec: 4.64
    '25':
      text: Kyɛ a ŋaa la ka yɛ mine da waa, kyɛ ka ba da pɛge yɛ.
      sbs: 0.7446
      gen_sec: 3.01
      ref_sec: 3.38
    '27':
      text: Ka fõõ meŋɛ soore o, fo na nyɛ la ka a yɛlɛ zaa te naŋ yeli kyaare ne o waa la a lɛ.
      sbs: 0.7141
      gen_sec: 4.8
      ref_sec: 5.82
    '28':
      text: “Daana, a piiluu saŋ, fõõ la iri a teŋɛ.
      sbs: 0.6986
      gen_sec: 2.5
      ref_sec: 3.28
    '29':
      text: Bebie ata puoriŋ, a Pɔɔl da boɔle la a Gyuumine nembɛrɛ naŋ da be a be lantaa.
      sbs: 0.6931
      gen_sec: 5.02
      ref_sec: 5.56
    '30':
      text: A Maleke Na Naŋ Taa A Ganlee Yɛlɛ.
      sbs: 0.6478
      gen_sec: 2.24
      ref_sec: 3.8
    '31':
      text: Nɔmmo maŋ taa la teɛretɔroo ne yelzaa kyɛ maŋ di kannyiri ne yelzaa.
      sbs: 0.7683
      gen_sec: 4.26
      ref_sec: 3.94
    '32':
      text: N naŋ da wa nyɛ O, N da le vɔgle la muro O gbɛɛ puliŋ a waa ŋa neɛ naŋ kpi.
      sbs: 0.7168
      gen_sec: 4.32
      ref_sec: 5.86
    '36':
      text: Lɛ la ka o da boɔle o a soore o, ‘Boŋ la ka N wono kyaare ne fo ya?
      sbs: 0.7412
      gen_sec: 4.0
      ref_sec: 4.14
    '37':
      text: Yɛ kaa a Izerayɛl biiri nyɛ; a banaŋ naŋ maŋ di a Naaŋmen bagmaale boma, ba ba maŋ waa a Naaŋmen
        bagmaalkuuri laŋne deme be?
      sbs: 0.7512
      gen_sec: 7.26
      ref_sec: 7.62
    '38':
      text: Kyɛ N na ko la a N dansediribe bayi naŋ su boɔre kparre kpeɛ̃õ ka ba yeli Ŋmen-yelmanna yelyelii
        bebie turi dɔgle kɔɔraayi ne lezaata.
      sbs: 0.684
      gen_sec: 8.29
      ref_sec: 12.4
    '39':
      text: Te sɛgrɛ la a yɛlɛ ama ka ka a te kyelloo na paale.
      sbs: 0.732
      gen_sec: 3.14
      ref_sec: 3.98
    '40':
      text: ka ba da de O do ne sazu ne puubu.
      sbs: 0.7252
      gen_sec: 2.37
      ref_sec: 4.84
    '44':
      text: 'Azuiŋ la ka ba yeli: “Gɔŋgbire, iri!'
      sbs: 0.6922
      gen_sec: 2.08
      ref_sec: 3.24
    '46':
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.6891
      gen_sec: 4.67
      ref_sec: 5.94
    '47':
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.6816
      gen_sec: 5.44
      ref_sec: 14.94
    '48':
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.7314
      gen_sec: 5.95
      ref_sec: 6.46
    '51':
      text: Yeezu Naŋ Koŋ A Gyɛruzɛlɛm Teŋɛ Yɛlɛ.
      sbs: 0.6477
      gen_sec: 2.43
      ref_sec: 10.58
    '52':
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.6688
      gen_sec: 1.98
      ref_sec: 5.8
    '53':
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.6899
      gen_sec: 4.96
      ref_sec: 6.64
    '54':
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.7225
      gen_sec: 3.74
      ref_sec: 4.32
    '56':
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.7312
      gen_sec: 5.5
      ref_sec: 7.02
    '57':
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.7269
      gen_sec: 5.06
      ref_sec: 5.42
    '58':
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.7321
      gen_sec: 5.89
      ref_sec: 7.12
    '61':
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.6865
      gen_sec: 5.38
      ref_sec: 5.42
    '62':
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.7468
      gen_sec: 3.3
      ref_sec: 3.44
    '63':
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.7183
      gen_sec: 3.9
      ref_sec: 4.66
    '64':
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.7536
      gen_sec: 4.29
      ref_sec: 4.9
    '65':
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
      sbs: 0.7254
      gen_sec: 4.96
      ref_sec: 7.08
    '66':
      text: 'Lɛ la ka N da woŋ kɔkɔre kaŋ a saluoni poɔ ka o yele: “N noba, yɛ wa yi o poɔ.'
      sbs: 0.6933
      gen_sec: 4.99
      ref_sec: 6.26
    '67':
      text: O da iri arɛɛ la ka O sɔre, ka ba de a Ŋmen-yelmanna Azaaya gansɛgraa ko O.
      sbs: 0.6354
      gen_sec: 4.9
      ref_sec: 13.28
    '69':
      text: Neɛzaa ba nyɛ fo saanaa ka fo seŋ ne la kũũ be?
      sbs: 0.7159
      gen_sec: 3.17
      ref_sec: 3.28
    '70':
      text: A ŋaa la tori kyɛ pɛllɛ Naaŋmen a te Faara poɔ.
      sbs: 0.7399
      gen_sec: 2.88
      ref_sec: 3.26
    '71':
      text: Te da kpɛ la a gbori a be ka Arestaku naŋ da waa Masedoniya neɛ kyɛ da yi Tɛsalonika da beɛle
        te.
      sbs: 0.6976
      gen_sec: 6.34
      ref_sec: 7.84
    '72':
      text: Pampana, nembuo mɔɔ la na e yɛ yelfaa, ka yɛneŋ wa kyerɛ ka yɛ e yɛlɛ naŋ e velaa?
      sbs: 0.7346
      gen_sec: 5.31
      ref_sec: 6.04
    '73':
      text: A soba na naŋ da faa te yi ne a dɔgɛɛ naŋ tɔgle kũũ, naŋ na kyɛnɛ faa te la.
      sbs: 0.7368
      gen_sec: 4.74
      ref_sec: 5.32
    '74':
      text: 'Ba sɛge la a begɛ gane poɔ: “Noba naŋ yele kɔkɔsaama.'
      sbs: 0.7178
      gen_sec: 3.36
      ref_sec: 5.08
    '75':
      text: Biiri na kyiiri la ba dɔgreba a vɛŋ ka ba ko ba.
      sbs: 0.7382
      gen_sec: 2.88
      ref_sec: 3.32
    '76':
      text: Yɛ erɛ yɛlɛ ne yɛŋ a kyaara noba na naŋ ba poɔ yɛ poɔ, kyɛ maŋ vɛŋ ka wagre zaa yire tɔnɔ.
      sbs: 0.7429
      gen_sec: 5.5
      ref_sec: 6.24
    '77':
      text: A ŋaa zie la ka te baŋ ka a baaraa saŋ taɛ la.
      sbs: 0.728
      gen_sec: 2.91
      ref_sec: 3.6
    '79':
      text: Kyɛ ba da de la soba na zaa yuori ba naŋ ba sɛge eŋ a nyɔvore gane poɔ lɔɔ eŋ a baa vũũ poɔ.
      sbs: 0.725
      gen_sec: 5.76
      ref_sec: 9.34
    '80':
      text: A dɛndɛŋ soba da yi waɛ la, a wa yeli, ‘Daana, a fo warbiri yi la warbie pie tɔnɔ dɔgle o
        zu.
      sbs: 0.7316
      gen_sec: 5.28
      ref_sec: 7.52
    '81':
      text: 'A yelwulaa yɛ naŋ na nyɛ la ŋa: yɛ na nyɛ la bie ba naŋ pilli ne bipɛmɛ a gaale O donne bondi
        gbori poɔ.'
      sbs: 0.6741
      gen_sec: 6.08
      ref_sec: 8.0
    '82':
      text: Nemmeŋɛ maŋ iri la bonsonne yi o nabonsonne poɔ, ka nenfaa meŋ maŋ iri bonfaare yi o nabonfaare
        poɔ.
      sbs: 0.6054
      gen_sec: 6.56
      ref_sec: 4.78
    '86':
      text: Bonso, neɛzaa koŋ la baŋ biŋ yiri pare zaa ka a onaŋ ba naŋ biŋ naane; a yiri pare ŋa la a
        Yeezu Kirista.
      sbs: 0.7577
      gen_sec: 6.4
      ref_sec: 8.06
    '87':
      text: A O eŋɛ la ka a yiri lamboe zaa mɛ lantaa a baa te leɛ Naaŋmen die naŋ e soŋ a be a Daana
        eŋɛ.
      sbs: 0.7479
      gen_sec: 5.95
      ref_sec: 6.34
    '88':
      text: ” Ka O yeli ko ba, “N nyɛ la Setaana ka o yi sazu a le teŋɛ a ŋa saa naŋ nyegre.
      sbs: 0.7098
      gen_sec: 4.8
      ref_sec: 5.76
    '89':
      text: Kyɛ deɛ yeli a yelbiri yoŋ, a vɛŋ ka N gbaŋgbaa nyɛ o sammo.
      sbs: 0.7053
      gen_sec: 3.65
      ref_sec: 4.36
    '90':
      text: ” O da kaara ba la polipoli a teɛre ka ba na ko o la bonkaŋ.
      sbs: 0.6822
      gen_sec: 3.65
      ref_sec: 3.88
    '93':
      text: Ka maa puori Naaŋmen ameseɛrɛ kyɛ di a bondirii, bonso ka ba na saana n yuori ne bondirii
        N naŋ puori Naaŋmen ameseɛrɛ kyɛ di?
      sbs: 0.734
      gen_sec: 7.94
      ref_sec: 7.7
    '94':
      text: Saa nyegroo ane hooroo ane saa tannoo da yire la a nakogi zie, kyɛ ka fentele ayopoĩ da dire
        a nakogi niŋesogɔ.
      sbs: 0.6734
      gen_sec: 7.42
      ref_sec: 10.42
    '95':
      text: N da guoli yɛ la ane beroŋ, a da ba e bondi-tage, bonso, yɛ da naŋ ba ta bondi-tage diibu.
      sbs: 0.7309
      gen_sec: 5.57
      ref_sec: 7.16
    '96':
      text: Yuoni zaa poɔ a Yeezu dɔgrebɔ da maŋ gaa la Gyɛruzɛlɛm a te di a Ista tigri.
      sbs: 0.7064
      gen_sec: 4.96
      ref_sec: 5.88
    '97':
      text: Ka a naŋ wa seŋ ka N meŋ gaa, ba na beɛle ma la ka te gaa.
      sbs: 0.7747
      gen_sec: 3.36
      ref_sec: 3.68
    '99':
      text: Ba da teɛre ka O be la a noba poɔ ka ba zaa kyɛnɛ a sori poɔ.
      sbs: 0.7162
      gen_sec: 3.9
      ref_sec: 4.2
    '101':
      text: Neɛzaa kontoɔ̃ pigi ma sori ka N ta ire n meŋɛ yuori!
      sbs: 0.7677
      gen_sec: 3.39
      ref_sec: 3.5
    '103':
      text: Te baŋ ka te yi la kũũ poɔ a kpɛ nyɔvore poɔ, te naŋ nɔŋ taa zuiŋ.
      sbs: 0.7359
      gen_sec: 4.1
      ref_sec: 4.58
    '104':
      text: N baŋ ka a N gaabo puoriŋ, noba mine naŋ waa ŋa gboŋgbo-faare na wa kpɛ la yɛ poɔ, a koŋ bare
        a peere.
      sbs: 0.7302
      gen_sec: 5.98
      ref_sec: 7.04
    '106':
      text: O da ba di bonzaa a bebie na zaa poɔ, kyɛ O naŋ da wa te baare, kɔŋ da kpɛ O la yaga.
      sbs: 0.6788
      gen_sec: 5.09
      ref_sec: 6.58
    '109':
      text: Ba na de a la lɔɔ bare.
      sbs: 0.6563
      gen_sec: 1.44
      ref_sec: 11.98
    '112':
      text: ” Ka O yeli, “Yɛ gu yɛmenne velaa ka ba ta wa bɛlle yɛ.
      sbs: 0.7537
      gen_sec: 3.14
      ref_sec: 3.4
    '113':
      text: Kyɛ a Yeezu naŋ da bale a O kyɛmmo poɔ la so ka O da wa zeŋ a bulee noɔreŋ.
      sbs: 0.7315
      gen_sec: 4.77
      ref_sec: 5.98
    '114':
      text: Ba suuri da iree la yaga ane ba naŋ da kanna a noba kyɛ moɔlɔ ka a Yeezu zie la ka kuuni leɛ-iruu
        be.
      sbs: 0.7086
      gen_sec: 6.08
      ref_sec: 7.64
    '115':
      text: Piita Ane Gyɔɔn Naŋ Are A Sɛrediribe Niŋesogɔ.
      sbs: 0.5798
      gen_sec: 3.01
      ref_sec: 3.4
    '116':
      text: Bonso, te waa la Naaŋmen tontonema naŋ laŋ tonɔ, yɛnee la a Naaŋmen weɛ, a Naaŋmen yiri.
      sbs: 0.7562
      gen_sec: 5.22
      ref_sec: 7.14
    '121':
      text: Pɔlbile kaŋ yuori naŋ da di Yutaaku da zeŋ la a takoro noɔreŋ a gbire kyuuro, a Pɔɔl naŋ da
        yele yɛlɛ.
      sbs: 0.6843
      gen_sec: 6.21
      ref_sec: 7.18
    '124':
      text: ” Ka O yeli ko o, “Bonso ka fo soorɔ ma bon naŋ e soŋ yɛlɛ?
      sbs: 0.7177
      gen_sec: 3.74
      ref_sec: 4.1
    '125':
      text: A ŋaa zie la ka te maŋ baŋ a yelmeŋɛ vooroŋ ane a tuluu vooroŋ.
      sbs: 0.7299
      gen_sec: 3.94
      ref_sec: 5.28
    '126':
      text: N zoro la dabeɛ̃ ka a toma N naŋ toŋ ko yɛ na pɔɔ wa e la weɛlɛ.
      sbs: 0.7388
      gen_sec: 3.97
      ref_sec: 3.96
    '127':
      text: Kyɛ a Vooroŋ Soŋ la a dansedire, bonso a Vooroŋ Soŋ la a yelmeŋɛ.
      sbs: 0.731
      gen_sec: 4.19
      ref_sec: 6.28
    '128':
      text: bonso, yɛ baŋ la a soba na naŋ bebe a yi a piiluu saŋ.
      sbs: 0.7419
      gen_sec: 3.42
      ref_sec: 4.44
    '130':
      text: ” Ka a noba da yeli sɔge, “Fo taa la sefaa!
      sbs: 0.6367
      gen_sec: 2.53
      ref_sec: 3.94
    '131':
      text: ” Kyɛ a Yeezu da taŋ la O noɔre a ba yeli yelzaa sɔge.
      sbs: 0.6392
      gen_sec: 3.36
      ref_sec: 7.12
    '133':
      text: Bonso, N dire la o danseɛ ka o toŋ la toma yaga ko yɛ ane banaŋ naŋ be Laodisiya teŋɛ ane
        Hɛrapoli teŋɛ poɔ.
      sbs: 0.7424
      gen_sec: 7.14
      ref_sec: 9.18
    '134':
      text: ” A lɛ la ka ba da yi moɔle ka neɛzaa leɛ o eebo a yi o yelbebe poɔ.
      sbs: 0.7164
      gen_sec: 4.22
      ref_sec: 4.52
    '135':
      text: ” Ba da yeli la a ŋaa ka ba e O nyɛ, a pãã na toɔ̃ nyɛ saanaa tuo O.
      sbs: 0.7257
      gen_sec: 3.94
      ref_sec: 5.6
    '137':
      text: Soba na zaa naŋ yeli, “N baŋ O la,” kyɛ ba sagra a O nɔɛ, waa la zirŋmaara, ka a yelmeŋɛ ba
        kye o zie.
      sbs: 0.7106
      gen_sec: 6.11
      ref_sec: 8.44
    '138':
      text: “Pampana ŋa N teɛroŋ zaa gyɛrɛɛ la.
      sbs: 0.7157
      gen_sec: 2.14
      ref_sec: 3.38
    '140':
      text: A Daana la na wa e ka yɛlɛ naŋ sɔgle lige poɔ sãã veɛloŋ ka bon naŋ be sukyiri poɔ meŋ sãã.
      sbs: 0.736
      gen_sec: 6.02
      ref_sec: 7.44
    '141':
      text: A Yeezu da yi la a be a wa O meŋɛ teŋɛ poɔ, ka a O potuuribo da tu O wa.
      sbs: 0.7379
      gen_sec: 4.32
      ref_sec: 4.6
    '142':
      text: N na iri la a gaa a N saa zie a te yeli ko o, “N saa, N eɛɛ yelbieri a kyaare Naaŋmen ane
        fõõ.
      sbs: 0.7277
      gen_sec: 5.89
      ref_sec: 8.56
    '143':
      text: Ba da ko o la sori meŋ ka o zɔɔ ne a nensonne a toɔ̃ ba.
      sbs: 0.7131
      gen_sec: 3.49
      ref_sec: 3.52
    '144':
      text: 'Azuiŋ, yɛ ko a teŋɛzu yɛlɛ zaa naŋ be yɛ enneŋ: peɛ̃mo toma, yeldɛgɛ, vɔlfaare, yelfaare
        boɔbo ane bombɔ-gaŋne .'
      sbs: 0.7359
      gen_sec: 7.17
      ref_sec: 10.3
    '149':
      text: A banaŋ naŋ puoro a wɛdoŋɔ ane a o teebo ane neɛzaa naŋ de a o yuori ŋmaaroŋ daŋ koŋ nyɛ pɛnnoo
        ŋmenaa bee tensogɔ.
      sbs: 0.674
      gen_sec: 7.39
      ref_sec: 10.84
    '150':
      text: Maata la da kaara a bondirii yɛlɛ, ka Laazoro da e a neɛ na kaŋ naŋ da laŋ zeŋ a diibu zie
        ne a Yeezu.
      sbs: 0.7062
      gen_sec: 6.46
      ref_sec: 7.98
    '151':
      text: fo naŋ nare biŋ a andonɛɛ zaa niŋesogɔ.
      sbs: 0.7045
      gen_sec: 2.56
      ref_sec: 3.0
    '153':
      text: N erɛ la ama zaa a Ŋmen-yelnoore zuiŋ, ka ka N na toɔ̃ nyɛ a yelnoore maaloo.
      sbs: 0.7455
      gen_sec: 4.8
      ref_sec: 4.82
    '154':
      text: O da laŋ kpeɛrɛ ne la a wɛdonne; ka a malekere da kaara O zie.
      sbs: 0.6933
      gen_sec: 3.94
      ref_sec: 4.12
    '156':
      text: A Yeezu da zɛge la O zu a nyɛ bondaanema naŋ eŋnɛ ba kyɔɔtaare a kyɔɔtaare daga poɔ.
      sbs: 0.717
      gen_sec: 5.34
      ref_sec: 6.0
    '157':
      text: Yɛ nyɛ, N tonɔ yɛ la aŋa pebilii ka yɛ yi te kpɛ gboŋgboe poɔ.
      sbs: 0.7161
      gen_sec: 3.65
      ref_sec: 4.98
    '158':
      text: Yɛ ta erɛ ka a Naaŋmen Vooroŋ Soŋ poɔ saana, Ona la a ŋmaaroŋ Naaŋmen naŋ eŋ yɛ a kyɛllɛ ne
        a faabo bebiri.
      sbs: 0.7311
      gen_sec: 6.4
      ref_sec: 6.72
    '159':
      text: N sɔre la a fo potuuribo ka ba digi a sefaa ka o yi, kyɛ ka ba digi fãã.
      sbs: 0.6673
      gen_sec: 4.96
      ref_sec: 6.1
    '160':
      text: Bonso, a Laazoro kuuni poɔ leɛ-iruu yɛlɛ la so ka a Gyuumine yaga da sagra derɛ a Yeezu yɛlɛ
        kyɛ zagra a ba yɛlɛ.
      sbs: 0.7072
      gen_sec: 7.23
      ref_sec: 8.62
    '165':
      text: Leɛ-teɛre nyɛ bonna naŋ da e ka fo le; leɛ fo eebo a kyɛ tonɔ a toma na fo naŋ da tonɔ a dɛndɛŋ
        saŋ.
      sbs: 0.6822
      gen_sec: 6.46
      ref_sec: 7.78
    '170':
      text: ka turi pie ne turi ayi da yi a Bɛŋgyamen bale poɔ ka ba da eŋ a ŋmaaroŋ.
      sbs: 0.7171
      gen_sec: 4.58
      ref_sec: 6.14
    '173':
      text: A ba seŋ ka o e Kiristabi-paalaa, ka lɛ naane, o na baŋ paale ne la pɔloo a le a sebɛlbɛllɛ
        dɔgroŋ poɔ.
      sbs: 0.734
      gen_sec: 6.37
      ref_sec: 7.02
    '174':
      text: Ka Yeezu da soore a bege baŋnema ane a Faraziimine, “Sori bebe la ka ba saŋ baala a pɛnnoo
        bebiri daare bee sori kyebe.
      sbs: 0.7029
      gen_sec: 7.84
      ref_sec: 9.08
    '175':
      text: Ona la vɛŋ ka te baŋ lɛ yɛ naŋ taa nɔmmo a Vooroŋ Soŋ poɔ.
      sbs: 0.7531
      gen_sec: 3.68
      ref_sec: 3.9
    '176':
      text: Yɛ naŋ sage tu a yelmeŋɛ pampana, yɛ pɛge la a yɛ seere ka ka yɛ na taa nɔmmo naŋ sereŋ e
        meŋɛ.
      sbs: 0.7146
      gen_sec: 6.21
      ref_sec: 8.06
    '177':
      text: Kyɛ a Soŋ Soba da sɔ yɛ la kããsoŋ, ka yɛ zaa taa yelbammo.
      sbs: 0.7201
      gen_sec: 3.74
      ref_sec: 4.56
    '178':
      text: ka turi pie ne turi ayi da yi a Manaasɛ bale poɔ.
      sbs: 0.7247
      gen_sec: 3.07
      ref_sec: 4.14
    '179':
      text: Yiri na zaa poɔ yɛ naŋ wa kpɛ, yɛ daŋ yeli, ‘Ka maaroŋ be a yiri ŋa poɔ!
      sbs: 0.7247
      gen_sec: 4.16
      ref_sec: 5.22
    '181':
      text: Bee boŋ la ka Kiristabie ne neɛ naŋ ba sage de a Kirista yɛlɛ laŋ?
      sbs: 0.7424
      gen_sec: 4.13
      ref_sec: 3.58
    '182':
      text: Yɛ ta wa poɔrɔ sazu, bonso, o e la Naaŋmen nakogi, bee a poɔrɔ a teŋɛ, bonso, o meŋ waa la
        a Naaŋmen gbɛɛ-bimmu zie.
      sbs: 0.728
      gen_sec: 7.36
      ref_sec: 11.22
    '184':
      text: Te da taa la yɛ vɔlaa kyɛ da nɔnɔ yaga ka te wa ka te nyɛ taa nimisogre.
      sbs: 0.7422
      gen_sec: 4.38
      ref_sec: 4.98
    '187':
      text: A gaŋ a zaa, yɛ de nɔmmo su pɔge yɛmenne, ona la maŋ leŋ boma zaa lantaa velaa zaa.
      sbs: 0.7536
      gen_sec: 5.38
      ref_sec: 5.7
    '189':
      text: Pampana ŋa, N de yɛ la ko Naaŋmen ane a Naaŋmen yelbiri garaaseɛ.
      sbs: 0.7318
      gen_sec: 3.9
      ref_sec: 4.66
    '190':
      text: Ba naŋ da ba nyɛ O, ba da leɛ gaa la a Gyɛruzɛlɛm ka ba te bɔ O.
      sbs: 0.698
      gen_sec: 3.74
      ref_sec: 4.26
    '191':
      text: ” Kyɛ ba da ba baŋ a yɛlɛ O naŋ yeli ko ba tɛgɛ.
      sbs: 0.6709
      gen_sec: 2.62
      ref_sec: 8.26
    '192':
      text: ” A yeli ŋa da wa ne la tage taa, ka nɔkpeɛne da kpɛ a Pɔɔl ane Banabase ane a noba na sogɔŋ.
      sbs: 0.6948
      gen_sec: 5.82
      ref_sec: 7.4
    '195':
      text: Azuiŋ, yɛ baŋ ne a, a ta inni ka yuomo ata tensogɔ bee ŋmenaa, ka N ba nage ka N kpãã yɛ ane
        nentaŋ.
      sbs: 0.7153
      gen_sec: 6.24
      ref_sec: 8.14
    '197':
      text: Te nyɛ la dɔgɛɛ boorɔ zaa, kyɛ naŋ voorɔ; ka te teɛroŋ gyɛre, kyɛ ka te nuuri ba yoɔrɔ.
      sbs: 0.7526
      gen_sec: 5.02
      ref_sec: 6.04
    '198':
      text: N na boɔrɔ la ka yɛ zaa yele kɔkɔsaama, kyɛ a gaŋ a zaa N na boɔrɔ la ka yɛ yele Ŋmen-yelmanna
        yelyelii.
      sbs: 0.7305
      gen_sec: 6.37
      ref_sec: 6.62
    '199':
      text: Enyaabo zaa daŋ ba pɔge yɛ naŋ daŋ ba pɔge nensaala.
      sbs: 0.7657
      gen_sec: 3.2
      ref_sec: 3.24
    '202':
      text: A banaŋ N naŋ nɔŋ la ka N maŋ wuli kyɛ tage ba tobo.
      sbs: 0.6823
      gen_sec: 3.23
      ref_sec: 3.16
    '203':
      text: A Naaŋmen da di la a Davil danseɛ a yeli, ‘N nyɛ la Davil, a Gyɛse bidɔɔ, ka o waa N yɛŋ neɛ.
      sbs: 0.7479
      gen_sec: 5.73
      ref_sec: 6.96
    '204':
      text: Lɛ la ka a bie da yeli ko a o saa, ‘N saa, N sãã la Naaŋmen poɔ, a sãã fo meŋ poɔ.
      sbs: 0.7277
      gen_sec: 4.8
      ref_sec: 6.42
    '205':
      text: A bama moɔlɔ la a Kirista yɛlɛ ne nɔmmo, a baŋ ka ba eŋ ma la a kyɛ N naŋ zɔɔrɔ a Ŋmen-yelnoore
        zɔɔre zuiŋ.
      sbs: 0.7484
      gen_sec: 6.4
      ref_sec: 7.48
    '207':
      text: Ka o da boɔle a gbaŋgbaa kaŋ a soore o bonna naŋ erɛ.
      sbs: 0.7322
      gen_sec: 3.42
      ref_sec: 3.9
    '208':
      text: Yeezu Naŋ Saŋ Neɛ Kaŋ Ba Naŋ Dɔge Ne Zɔnnoŋ.
      sbs: 0.6309
      gen_sec: 2.85
      ref_sec: 3.56
    '209':
      text: ka turi pie ne turi ayi da yi a Nafetali bale poɔ.
      sbs: 0.7336
      gen_sec: 3.1
      ref_sec: 4.0
    '211':
      text: Moozul da yelee la, ‘A Daana a yɛ Naaŋmen na iri la Ŋmen-yelmanna a yɛ meŋɛ noba poɔ ka o
        waa aŋa maa.
      sbs: 0.7324
      gen_sec: 6.11
      ref_sec: 7.9
    '212':
      text: “Yuomo lezaayi puoriŋ, maleke da wuli la o meŋɛ ko a Moozul vũũ naŋ da dire tuu kaŋ poɔ a
        Sanae taŋ wɛgyɛŋ poɔ.
      sbs: 0.7117
      gen_sec: 7.17
      ref_sec: 9.28
    '214':
      text: 'Kyɛ fo taa la garebanyɛ ne a yeli ŋa: fo kyiire la a Nikoletan deme tontonne na N meŋ naŋ
        kyiire.'
      sbs: 0.6926
      gen_sec: 6.02
      ref_sec: 6.68
    '215':
      text: Pampana, a malekere ayopoĩ na naŋ da taa a eelɛ ayopoĩ da narɛɛ la ka ba peɛle a eelɛ.
      sbs: 0.717
      gen_sec: 5.79
      ref_sec: 7.48
    '217':
      text: ” A Yeezu naŋ da woŋ a ŋaa, O da yeli ko la a dɔɔ, “Yelyeni kaŋ la kyɛre ka fo ba taa.
      sbs: 0.7098
      gen_sec: 5.12
      ref_sec: 6.44
    '219':
      text: ’ Lɛ la ka a saa da de a o boma poŋ a o biiri na bayi.
      sbs: 0.7456
      gen_sec: 3.17
      ref_sec: 3.54
    '220':
      text: yɛ ta dare a yɛ sukyie aŋa lɛ a yɛ sããkommine naŋ da zɔɔ ne Naaŋmen.
      sbs: 0.6946
      gen_sec: 4.35
      ref_sec: 5.5
    '221':
      text: Ka Yeezu yeli, “Pɔlbile, maa yeli ko fo, vaa-iri!
      sbs: 0.7113
      gen_sec: 2.82
      ref_sec: 4.68
    '224':
      text: A yelwolɔ naŋ waana zuiŋ, N teɛre ka a na soma la ka neɛzaa naŋ kyɛnɛ waa lɛ zaa o naŋ da
        waa.
      sbs: 0.7608
      gen_sec: 5.98
      ref_sec: 7.48
    '225':
      text: Maa Gyɔɔn la a soba na naŋ da woŋ kyɛ nyɛ a yɛlɛ ama.
      sbs: 0.7153
      gen_sec: 3.14
      ref_sec: 10.56
    '226':
      text: Ona la e ka te taa faŋ a waa a nɔpaalaa tontonema.
      sbs: 0.7582
      gen_sec: 3.42
      ref_sec: 3.28
    '227':
      text: A yɛlɛ na eŋ naŋ kyɛre, N na wuli yɛ la ka maa wa wa yɛ zie.
      sbs: 0.7652
      gen_sec: 3.46
      ref_sec: 6.74
    '228':
      text: a zɔɔrɔ ne a Daana ane a O Mɛzaaya.
      sbs: 0.7325
      gen_sec: 2.4
      ref_sec: 3.3
    '229':
      text: Yɛ nyɛ nɔmmo na tɔ a Saa naŋ nɔŋ te, a e ka ba boɔlɔ te Naaŋmen bibiiri; ka te sereŋ waa a
        lɛ.
      sbs: 0.7199
      gen_sec: 5.76
      ref_sec: 7.2
    '230':
      text: O da gaa te de la a gane yi a soba na naŋ da zeŋ a nakogi zu nuduluŋ poɔ.
      sbs: 0.7065
      gen_sec: 4.67
      ref_sec: 4.9
    '231':
      text: Yɛ saŋna a baalba naŋ be a be, kyɛ yeli ko ba, ‘A Naaŋmen naaloŋ wa peɛle yɛ la.
      sbs: 0.7289
      gen_sec: 4.48
      ref_sec: 5.5
    '233':
      text: Kyɛ tɔnɔ na zaa N naŋ da nyɛ, N de a la ka a waa zaglaa a Kirista zuiŋ.
      sbs: 0.7597
      gen_sec: 4.54
      ref_sec: 5.24
    '234':
      text: Kyɛ soba na zaa naŋ ba sage de a yelbiri na wɛ la.
      sbs: 0.7424
      gen_sec: 3.33
      ref_sec: 3.1
    '235':
      text: A ŋa la a n noɔre N naŋ wullo a puoruu laŋne yie zaa poore.
      sbs: 0.7806
      gen_sec: 3.65
      ref_sec: 3.88
    '236':
      text: 'Serɛzaa ka N yele korɔ yɛ: Gyɔɔn Bati e la kpoŋ gaŋ banaŋ zaa pɔgeba naŋ dɔge a teŋɛzu.'
      sbs: 0.7072
      gen_sec: 5.44
      ref_sec: 6.58
    '237':
      text: Bonso, dɔgroŋ la so ka dabeɛ̃ bebe, kyɛ neɛ na zaa naŋ zoro dabeɛ̃ ba taa nɔmmo naŋ e soŋ.
      sbs: 0.7223
      gen_sec: 5.82
      ref_sec: 7.54
    '238':
      text: Azuiŋ a ferɛɛ la ka te maaleŋ kyɛlle velaa bon te naŋ da woŋ, ka te ta wa sare yi a poɔ.
      sbs: 0.7174
      gen_sec: 5.47
      ref_sec: 7.8
    '239':
      text: ” Ka O yeli sɔge ba, “Nembuo la N ma ane N yɔɔmine?
      sbs: 0.6557
      gen_sec: 3.23
      ref_sec: 7.36
    '240':
      text: A yɛlɛ ama da eɛɛ la ka a e yelwulaa ko te, ka ka te na ta boɔrɔ yelfaare aŋa ba naŋ da e
        lɛ.
      sbs: 0.7405
      gen_sec: 5.63
      ref_sec: 6.92
    '241':
      text: Kyɛ ka o naŋ wa poɔ̃, o maŋ buli la a eŋ bie yaga.
      sbs: 0.7459
      gen_sec: 2.91
      ref_sec: 3.5
    '242':
      text: A ŋaa la vɛŋ ka te ba zoro dabeɛ̃ a Naaŋmen niŋeŋ a yi a Kirista zuiŋ.
      sbs: 0.7442
      gen_sec: 4.32
      ref_sec: 4.86
    '243':
      text: Kyɛ Pɔɔl da ba boɔrɔ ka o taa neɛ naŋ da zo kyɛ bare ba Pamfiliya poɔ, a ba tu ba a toŋ a
        toma.
      sbs: 0.6901
      gen_sec: 5.79
      ref_sec: 7.42
    '244':
      text: Kyɛ ŋmenaa naŋ da wa do, a bombulo da zoɔlɛɛ la, a ko, a naŋ da ba taa nyaga zuiŋ.
      sbs: 0.7164
      gen_sec: 4.77
      ref_sec: 6.62
    '245':
      text: A weɛ soba da naŋ taa la neŋyenaa kaŋ, a o poyɛŋ bie.
      sbs: 0.7471
      gen_sec: 3.39
      ref_sec: 3.66
    '246':
      text: N naŋ da wa nyɛ o, N noɔre da maaɛ la yaga.
      sbs: 0.743
      gen_sec: 2.43
      ref_sec: 3.1
    '247':
      text: Dabeɛ̃ ne nɔmaa da kpɛ ba la ne a yeli ŋa naŋ da e a gbɛre ŋa zie.
      sbs: 0.6717
      gen_sec: 4.06
      ref_sec: 6.38
    '250':
      text: A Fɛstu pãã da tere la noɔre, ka ba taa a Pɔɔl wa ne.
      sbs: 0.6936
      gen_sec: 3.26
      ref_sec: 3.48
    '252':
      text: Pampana ŋa, vi ba erɛ ma, ka maa gba erɛ pɔloo yaga ne a kpeɛ̃õ a Daana naŋ tere ka N de maale
        ne yɛ.
      sbs: 0.7362
      gen_sec: 6.11
      ref_sec: 6.86
    '253':
      text: ” Ka Yeezu da yeli ko o, “Yelmeŋɛ ka N yele korɔ yɛ.
      sbs: 0.6587
      gen_sec: 2.88
      ref_sec: 9.28
    '256':
      text: Yɛ vɛŋ ka neɛzaa maŋ sigre o meŋɛ korɔ a teŋɛzu wederebɛ; bonso, wederɛ zaa ba kyebe ka Naaŋmen
        zie naane ka o yi.
      sbs: 0.7549
      gen_sec: 7.3
      ref_sec: 8.34
    '257':
      text: Yelmeŋɛ zaa la ka N yele korɔ yɛ, ka kabiri ba le teŋɛ a poɔ̃, o maŋ e la kabi-yeni.
      sbs: 0.7244
      gen_sec: 4.93
      ref_sec: 5.78
    '260':
      text: Ka maa pãã la bee ka bana la, a yeli ŋa la ka te moɔle ka yɛ da sage de.
      sbs: 0.7452
      gen_sec: 4.26
      ref_sec: 5.08
    '262':
      text: O eŋɛ da kɔɔ guree la, ka o da kontoɔ̃ dɔle o meŋɛ.
      sbs: 0.7096
      gen_sec: 3.07
      ref_sec: 3.74
    '263':
      text: Bonso, a ba seŋ ka o voorɔ.
      sbs: 0.6343
      gen_sec: 1.86
      ref_sec: 8.1
    '264':
      text: 'Bonso, o yeli la o poɔŋ: ‘N dire la naaloŋ aŋa pɔgenaa; N ba waa pɔgekoɔre.'
      sbs: 0.652
      gen_sec: 4.7
      ref_sec: 7.4
    '265':
      text: Kyɛ a Yeezu da ba yeli ko o ka o koŋ kpi.
      sbs: 0.6338
      gen_sec: 2.37
      ref_sec: 8.18
    '269':
      text: Neɛ kaŋ da soore O la, “Daana, noba belaa la na nyɛ faabo be?
      sbs: 0.7118
      gen_sec: 3.65
      ref_sec: 5.22
    '270':
      text: A apostoliimine ane a nembɛrɛ da laŋ la taa ka ba kaa a yeli ŋa nyɛ.
      sbs: 0.7202
      gen_sec: 4.51
      ref_sec: 5.22
    '271':
      text: bonso, fo yɔɔ la a fo tontonema, a Ŋmen-yelmanneba.
      sbs: 0.7085
      gen_sec: 3.26
      ref_sec: 3.84
    '272':
      text: Yɛ ta de faaloŋ yɔɔ ne neɛzaa naŋ e yɛ faaloŋ; kyɛ yɛ maŋ moɔrɔ ka yɛ erɛ yɛlɛ naŋ soma noba
        zaa zie.
      sbs: 0.7577
      gen_sec: 6.43
      ref_sec: 7.24
    '273':
      text: O ba kye kyɛ, ba eɛɛ la ka O leɛ-iri yi a kuuni poɔ.
      sbs: 0.6875
      gen_sec: 3.01
      ref_sec: 4.26
    '274':
      text: Bonso, ba sɛge la a Moozul begɛ poɔ, “Ta leŋ a naadɛre naŋ ŋmeɛrɛ kyi noɔre.
      sbs: 0.7026
      gen_sec: 4.77
      ref_sec: 6.58
    '276':
      text: N maŋ leŋ la noɔre gbɛre boyi daa gbuli zaa poɔ.
      sbs: 0.7378
      gen_sec: 2.82
      ref_sec: 3.1
    '277':
      text: ” A noba naŋ da bebe da ta ŋa turi anuu.
      sbs: 0.6856
      gen_sec: 2.53
      ref_sec: 3.76
    '278':
      text: 'Ba maŋ vɔge la a ba nazupile biŋ a nakogi niŋesogɔ, kyɛ yiele: “Te Daana Naaŋmen, fo seŋ
        ne la.'
      sbs: 0.6936
      gen_sec: 5.66
      ref_sec: 7.9
    '279':
      text: 'Kyɛ a danseɛ la ŋa: Naaŋmen ko te la nyɔvore naŋ ba taa baaraa, ka a nyɔvore ŋa be a O Bie
        poɔ.'
      sbs: 0.7117
      gen_sec: 5.76
      ref_sec: 6.84
    '281':
      text: A pɔge da su la kpareze-velaa, ka o lenni ne salema ane lɛɛbie ane kusi-veɛle.
      sbs: 0.7251
      gen_sec: 5.25
      ref_sec: 6.68
    '282':
      text: A zenɛ ŋa, ba dɔge la a yɛ Faara a Davil teŋkpoŋ poɔ, Ona la a Mɛzaaya, a Daana.
      sbs: 0.7047
      gen_sec: 4.93
      ref_sec: 6.9
    '284':
      text: Azuiŋ ba da ŋmaa la kpaakpaa vaare, a yi ka ba te tuori O.
      sbs: 0.6935
      gen_sec: 3.42
      ref_sec: 4.78
    '286':
      text: Amine meŋ da le la tɛnnoɔ poɔ, a buli, a maale eŋ bie kɔɔ.
      sbs: 0.7434
      gen_sec: 3.68
      ref_sec: 4.96
    '287':
      text: Ba da ba puori a wɛdoŋɔ bee a o teebo, a da ba de a o ŋmaaroŋ a ba gberi bee ba nuuri eŋɛ.
      sbs: 0.7193
      gen_sec: 5.82
      ref_sec: 7.26
    '288':
      text: Ba maŋ erɛ la a lɛ a na de bon naŋ maŋ wɛ, kyɛ tenee deni ba weɛrɛ.
      sbs: 0.737
      gen_sec: 3.81
      ref_sec: 4.84
    '289':
      text: Ka fõõ wa to fo yɔɔ bee fo yɔɔpuulee, a seŋ ka ba zeŋ ne fo nembɛrɛ niŋesogɔ.
      sbs: 0.7286
      gen_sec: 4.9
      ref_sec: 6.08
    '290':
      text: Naboma Naŋ Be Yagraa Dogre Poɔ.
      sbs: 0.6704
      gen_sec: 2.14
      ref_sec: 4.54
    '292':
      text: Lɛ la ka o toŋ ka ba te ko bibiiri na zaa naŋ ta yuomo ayi kyɛ sigre, a Bɛtelɛhɛm ane o tembilii
        poore.
      sbs: 0.6991
      gen_sec: 6.53
      ref_sec: 8.1
    '293':
      text: A o soba ta boɔrɔ ka o sɔglɔ a dɛgre iruu ŋmaaroŋ.
      sbs: 0.7449
      gen_sec: 3.49
      ref_sec: 3.92
    '294':
      text: Lɛ la ka Yeezu da toŋ Piita ane Gyɔɔn, a yele, “Yɛ gaa te nare a Ista tigri bondiraa ka te
        di.
      sbs: 0.7079
      gen_sec: 5.73
      ref_sec: 7.38
    '295':
      text: ” Ba naŋ da wa gbole kaa, ba ba la nyɛ neɛzaa ka a Yeezu yoŋ naane.
      sbs: 0.7209
      gen_sec: 3.81
      ref_sec: 4.52
    '298':
      text: O naŋ da wa de a suobu baare, o da be la a Filipi zie tegitegilɛ.
      sbs: 0.7072
      gen_sec: 4.0
      ref_sec: 4.48
    '299':
      text: Fo ba ŋmaa a zirii ŋa ko te kyɛ Naaŋmen la ka fo ŋmaa tere.
      sbs: 0.7204
      gen_sec: 3.3
      ref_sec: 3.62
  score: 0.7149
  partial: true
- model: ghananlpcommunity/ghana-tts-72k-ref
  sbs: 0.7071
  num_scored: 200
  uses_reference: true
  entries:
    '0':
      text: Ka maa bare ba ne a kɔŋ ka ba kulo, ba na yĩĩe la a sobiriŋ, bonso, ba mine yi la tentɔbɔ
        a wa.
      sbs: 0.6843
      gen_sec: 7.2
      ref_sec: 7.66
    '2':
      text: A Yeezu naŋ da gɛrɛ Gyɛruzɛlɛm, O da kpɛ la a teŋkponni ane a tembilii poore a kanna a noba
        gɛrɛ.
      sbs: 0.7167
      gen_sec: 6.88
      ref_sec: 7.54
    '3':
      text: A Naaŋmen Bagmaale Wederebɛ Nembɛrɛ Zusoba Naŋ Soore Yeezu Soorebie.
      sbs: 0.6351
      gen_sec: 6.4
      ref_sec: 8.22
    '5':
      text: Azuiŋ, yɛ ta daŋ di sɛrɛɛ kyɛ ka a saŋ ba ta; kyɛ ka a Daana waabo naŋ ba ta sɛre.
      sbs: 0.7141
      gen_sec: 6.72
      ref_sec: 5.84
    '6':
      text: O naŋ da wa pɔge te a Azɔ poɔ, o da kpɛ la a gbori ka te gaa Mitelen.
      sbs: 0.6932
      gen_sec: 6.72
      ref_sec: 6.46
    '7':
      text: Ba da lɔɔ o la bare ka o sigi wa a teŋɛzu, a lɔɔ a o malekere meŋ poɔ o eŋɛ.
      sbs: 0.744
      gen_sec: 6.32
      ref_sec: 6.06
    '8':
      text: Ka a toŋkpeɛne ama naŋ toŋ fo poɔ, da toŋ Sodom teŋɛ poɔ, o da na kyɛnɛ bebe la wa ta zenɛ.
      sbs: 0.7389
      gen_sec: 7.44
      ref_sec: 7.3
    '10':
      text: A banaŋ naŋ da zo yaare da yi yoɔrɔ la, a moɔlɔ a yelbiri.
      sbs: 0.7093
      gen_sec: 4.48
      ref_sec: 5.66
    '11':
      text: N poyɛŋ noba, nɔpaalaa naane ka N sɛgrɛ korɔ yɛ, kyɛ a nɔkoraa na yɛ naŋ da taa yi a piiluu
        saŋ la.
      sbs: 0.7534
      gen_sec: 9.12
      ref_sec: 8.0
    '12':
      text: ” Ka Yeezu da yeli, “Yɛ e ka a noba zeŋ teŋɛ.
      sbs: 0.694
      gen_sec: 3.68
      ref_sec: 14.68
    '13':
      text: Wola pãã ka a weɛ soba na e a wɛkaareba ŋa?
      sbs: 0.7378
      gen_sec: 4.24
      ref_sec: 3.42
    '15':
      text: Ona la boɔrɔ ka neɛzaa nyɛ faabo a kyɛ wa baŋ a yelmeŋɛ.
      sbs: 0.7243
      gen_sec: 4.56
      ref_sec: 3.56
    '19':
      text: Pɔɔl Naŋ Puori A Filipae Deme Yaane.
      sbs: 0.7109
      gen_sec: 3.6
      ref_sec: 5.12
    '20':
      text: Bonso, ba da ba sage de a banaŋ zaa naŋ da wa yeli a O kuuni poɔ leɛ-iruu yɛlɛ ko ba.
      sbs: 0.7197
      gen_sec: 7.12
      ref_sec: 5.86
    '21':
      text: ” Ba da do la a sazu a zunzugri poɔ ka a ba dɔndɔnne da kaara ba.
      sbs: 0.6879
      gen_sec: 5.12
      ref_sec: 4.64
    '25':
      text: Kyɛ a ŋaa la ka yɛ mine da waa, kyɛ ka ba da pɛge yɛ.
      sbs: 0.7168
      gen_sec: 4.24
      ref_sec: 3.38
    '27':
      text: Ka fõõ meŋɛ soore o, fo na nyɛ la ka a yɛlɛ zaa te naŋ yeli kyaare ne o waa la a lɛ.
      sbs: 0.8233
      gen_sec: 5.92
      ref_sec: 5.82
    '28':
      text: “Daana, a piiluu saŋ, fõõ la iri a teŋɛ.
      sbs: 0.6827
      gen_sec: 4.0
      ref_sec: 3.28
    '29':
      text: Bebie ata puoriŋ, a Pɔɔl da boɔle la a Gyuumine nembɛrɛ naŋ da be a be lantaa.
      sbs: 0.7075
      gen_sec: 6.72
      ref_sec: 5.56
    '30':
      text: A Maleke Na Naŋ Taa A Ganlee Yɛlɛ.
      sbs: 0.6881
      gen_sec: 2.72
      ref_sec: 3.8
    '31':
      text: Nɔmmo maŋ taa la teɛretɔroo ne yelzaa kyɛ maŋ di kannyiri ne yelzaa.
      sbs: 0.6877
      gen_sec: 6.8
      ref_sec: 3.94
    '32':
      text: N naŋ da wa nyɛ O, N da le vɔgle la muro O gbɛɛ puliŋ a waa ŋa neɛ naŋ kpi.
      sbs: 0.7617
      gen_sec: 5.68
      ref_sec: 5.86
    '36':
      text: Lɛ la ka o da boɔle o a soore o, ‘Boŋ la ka N wono kyaare ne fo ya?
      sbs: 0.7071
      gen_sec: 5.68
      ref_sec: 4.14
    '37':
      text: Yɛ kaa a Izerayɛl biiri nyɛ; a banaŋ naŋ maŋ di a Naaŋmen bagmaale boma, ba ba maŋ waa a Naaŋmen
        bagmaalkuuri laŋne deme be?
      sbs: 0.7126
      gen_sec: 8.16
      ref_sec: 7.62
    '38':
      text: Kyɛ N na ko la a N dansediribe bayi naŋ su boɔre kparre kpeɛ̃õ ka ba yeli Ŋmen-yelmanna yelyelii
        bebie turi dɔgle kɔɔraayi ne lezaata.
      sbs: 0.6731
      gen_sec: 11.68
      ref_sec: 12.4
    '39':
      text: Te sɛgrɛ la a yɛlɛ ama ka ka a te kyelloo na paale.
      sbs: 0.7261
      gen_sec: 3.76
      ref_sec: 3.98
    '40':
      text: ka ba da de O do ne sazu ne puubu.
      sbs: 0.6943
      gen_sec: 2.88
      ref_sec: 4.84
    '44':
      text: 'Azuiŋ la ka ba yeli: “Gɔŋgbire, iri!'
      sbs: 0.722
      gen_sec: 3.6
      ref_sec: 3.24
    '46':
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.7133
      gen_sec: 6.4
      ref_sec: 5.94
    '47':
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.6777
      gen_sec: 7.12
      ref_sec: 14.94
    '48':
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.6636
      gen_sec: 7.76
      ref_sec: 6.46
    '51':
      text: Yeezu Naŋ Koŋ A Gyɛruzɛlɛm Teŋɛ Yɛlɛ.
      sbs: 0.6733
      gen_sec: 2.88
      ref_sec: 10.58
    '52':
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.6867
      gen_sec: 2.48
      ref_sec: 5.8
    '53':
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.7143
      gen_sec: 6.16
      ref_sec: 6.64
    '54':
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.7412
      gen_sec: 5.04
      ref_sec: 4.32
    '56':
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.7282
      gen_sec: 7.84
      ref_sec: 7.02
    '57':
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.6826
      gen_sec: 8.72
      ref_sec: 5.42
    '58':
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.7055
      gen_sec: 7.6
      ref_sec: 7.12
    '61':
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.6436
      gen_sec: 6.96
      ref_sec: 5.42
    '62':
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.731
      gen_sec: 3.36
      ref_sec: 3.44
    '63':
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.6988
      gen_sec: 5.12
      ref_sec: 4.66
    '64':
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.7183
      gen_sec: 5.12
      ref_sec: 4.9
    '65':
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
      sbs: 0.7364
      gen_sec: 6.8
      ref_sec: 7.08
    '66':
      text: 'Lɛ la ka N da woŋ kɔkɔre kaŋ a saluoni poɔ ka o yele: “N noba, yɛ wa yi o poɔ.'
      sbs: 0.7376
      gen_sec: 6.72
      ref_sec: 6.26
    '67':
      text: O da iri arɛɛ la ka O sɔre, ka ba de a Ŋmen-yelmanna Azaaya gansɛgraa ko O.
      sbs: 0.6472
      gen_sec: 5.68
      ref_sec: 13.28
    '69':
      text: Neɛzaa ba nyɛ fo saanaa ka fo seŋ ne la kũũ be?
      sbs: 0.7474
      gen_sec: 4.32
      ref_sec: 3.28
    '70':
      text: A ŋaa la tori kyɛ pɛllɛ Naaŋmen a te Faara poɔ.
      sbs: 0.7008
      gen_sec: 3.92
      ref_sec: 3.26
    '71':
      text: Te da kpɛ la a gbori a be ka Arestaku naŋ da waa Masedoniya neɛ kyɛ da yi Tɛsalonika da beɛle
        te.
      sbs: 0.6857
      gen_sec: 8.24
      ref_sec: 7.84
    '72':
      text: Pampana, nembuo mɔɔ la na e yɛ yelfaa, ka yɛneŋ wa kyerɛ ka yɛ e yɛlɛ naŋ e velaa?
      sbs: 0.7328
      gen_sec: 7.04
      ref_sec: 6.04
    '73':
      text: A soba na naŋ da faa te yi ne a dɔgɛɛ naŋ tɔgle kũũ, naŋ na kyɛnɛ faa te la.
      sbs: 0.7128
      gen_sec: 5.52
      ref_sec: 5.32
    '74':
      text: 'Ba sɛge la a begɛ gane poɔ: “Noba naŋ yele kɔkɔsaama.'
      sbs: 0.7162
      gen_sec: 4.08
      ref_sec: 5.08
    '75':
      text: Biiri na kyiiri la ba dɔgreba a vɛŋ ka ba ko ba.
      sbs: 0.7542
      gen_sec: 3.76
      ref_sec: 3.32
    '76':
      text: Yɛ erɛ yɛlɛ ne yɛŋ a kyaara noba na naŋ ba poɔ yɛ poɔ, kyɛ maŋ vɛŋ ka wagre zaa yire tɔnɔ.
      sbs: 0.7027
      gen_sec: 7.2
      ref_sec: 6.24
    '77':
      text: A ŋaa zie la ka te baŋ ka a baaraa saŋ taɛ la.
      sbs: 0.7322
      gen_sec: 3.68
      ref_sec: 3.6
    '79':
      text: Kyɛ ba da de la soba na zaa yuori ba naŋ ba sɛge eŋ a nyɔvore gane poɔ lɔɔ eŋ a baa vũũ poɔ.
      sbs: 0.7229
      gen_sec: 7.6
      ref_sec: 9.34
    '80':
      text: A dɛndɛŋ soba da yi waɛ la, a wa yeli, ‘Daana, a fo warbiri yi la warbie pie tɔnɔ dɔgle o
        zu.
      sbs: 0.7464
      gen_sec: 7.44
      ref_sec: 7.52
    '81':
      text: 'A yelwulaa yɛ naŋ na nyɛ la ŋa: yɛ na nyɛ la bie ba naŋ pilli ne bipɛmɛ a gaale O donne bondi
        gbori poɔ.'
      sbs: 0.6655
      gen_sec: 8.48
      ref_sec: 8.0
    '82':
      text: Nemmeŋɛ maŋ iri la bonsonne yi o nabonsonne poɔ, ka nenfaa meŋ maŋ iri bonfaare yi o nabonfaare
        poɔ.
      sbs: 0.6004
      gen_sec: 8.0
      ref_sec: 4.78
    '86':
      text: Bonso, neɛzaa koŋ la baŋ biŋ yiri pare zaa ka a onaŋ ba naŋ biŋ naane; a yiri pare ŋa la a
        Yeezu Kirista.
      sbs: 0.7303
      gen_sec: 9.2
      ref_sec: 8.06
    '87':
      text: A O eŋɛ la ka a yiri lamboe zaa mɛ lantaa a baa te leɛ Naaŋmen die naŋ e soŋ a be a Daana
        eŋɛ.
      sbs: 0.7065
      gen_sec: 7.12
      ref_sec: 6.34
    '88':
      text: ” Ka O yeli ko ba, “N nyɛ la Setaana ka o yi sazu a le teŋɛ a ŋa saa naŋ nyegre.
      sbs: 0.7463
      gen_sec: 6.32
      ref_sec: 5.76
    '89':
      text: Kyɛ deɛ yeli a yelbiri yoŋ, a vɛŋ ka N gbaŋgbaa nyɛ o sammo.
      sbs: 0.7005
      gen_sec: 4.4
      ref_sec: 4.36
    '90':
      text: ” O da kaara ba la polipoli a teɛre ka ba na ko o la bonkaŋ.
      sbs: 0.6593
      gen_sec: 4.8
      ref_sec: 3.88
    '93':
      text: Ka maa puori Naaŋmen ameseɛrɛ kyɛ di a bondirii, bonso ka ba na saana n yuori ne bondirii
        N naŋ puori Naaŋmen ameseɛrɛ kyɛ di?
      sbs: 0.698
      gen_sec: 9.28
      ref_sec: 7.7
    '94':
      text: Saa nyegroo ane hooroo ane saa tannoo da yire la a nakogi zie, kyɛ ka fentele ayopoĩ da dire
        a nakogi niŋesogɔ.
      sbs: 0.6458
      gen_sec: 8.72
      ref_sec: 10.42
    '95':
      text: N da guoli yɛ la ane beroŋ, a da ba e bondi-tage, bonso, yɛ da naŋ ba ta bondi-tage diibu.
      sbs: 0.7207
      gen_sec: 8.16
      ref_sec: 7.16
    '96':
      text: Yuoni zaa poɔ a Yeezu dɔgrebɔ da maŋ gaa la Gyɛruzɛlɛm a te di a Ista tigri.
      sbs: 0.7065
      gen_sec: 7.76
      ref_sec: 5.88
    '97':
      text: Ka a naŋ wa seŋ ka N meŋ gaa, ba na beɛle ma la ka te gaa.
      sbs: 0.7257
      gen_sec: 4.72
      ref_sec: 3.68
    '99':
      text: Ba da teɛre ka O be la a noba poɔ ka ba zaa kyɛnɛ a sori poɔ.
      sbs: 0.6544
      gen_sec: 5.44
      ref_sec: 4.2
    '101':
      text: Neɛzaa kontoɔ̃ pigi ma sori ka N ta ire n meŋɛ yuori!
      sbs: 0.7062
      gen_sec: 4.8
      ref_sec: 3.5
    '103':
      text: Te baŋ ka te yi la kũũ poɔ a kpɛ nyɔvore poɔ, te naŋ nɔŋ taa zuiŋ.
      sbs: 0.7546
      gen_sec: 5.44
      ref_sec: 4.58
    '104':
      text: N baŋ ka a N gaabo puoriŋ, noba mine naŋ waa ŋa gboŋgbo-faare na wa kpɛ la yɛ poɔ, a koŋ bare
        a peere.
      sbs: 0.7213
      gen_sec: 8.32
      ref_sec: 7.04
    '106':
      text: O da ba di bonzaa a bebie na zaa poɔ, kyɛ O naŋ da wa te baare, kɔŋ da kpɛ O la yaga.
      sbs: 0.709
      gen_sec: 6.96
      ref_sec: 6.58
    '109':
      text: Ba na de a la lɔɔ bare.
      sbs: 0.7204
      gen_sec: 2.16
      ref_sec: 11.98
    '112':
      text: ” Ka O yeli, “Yɛ gu yɛmenne velaa ka ba ta wa bɛlle yɛ.
      sbs: 0.733
      gen_sec: 3.76
      ref_sec: 3.4
    '113':
      text: Kyɛ a Yeezu naŋ da bale a O kyɛmmo poɔ la so ka O da wa zeŋ a bulee noɔreŋ.
      sbs: 0.7193
      gen_sec: 5.76
      ref_sec: 5.98
    '114':
      text: Ba suuri da iree la yaga ane ba naŋ da kanna a noba kyɛ moɔlɔ ka a Yeezu zie la ka kuuni leɛ-iruu
        be.
      sbs: 0.7068
      gen_sec: 7.68
      ref_sec: 7.64
    '115':
      text: Piita Ane Gyɔɔn Naŋ Are A Sɛrediribe Niŋesogɔ.
      sbs: 0.6163
      gen_sec: 4.72
      ref_sec: 3.4
    '116':
      text: Bonso, te waa la Naaŋmen tontonema naŋ laŋ tonɔ, yɛnee la a Naaŋmen weɛ, a Naaŋmen yiri.
      sbs: 0.7136
      gen_sec: 6.88
      ref_sec: 7.14
    '121':
      text: Pɔlbile kaŋ yuori naŋ da di Yutaaku da zeŋ la a takoro noɔreŋ a gbire kyuuro, a Pɔɔl naŋ da
        yele yɛlɛ.
      sbs: 0.694
      gen_sec: 8.56
      ref_sec: 7.18
    '124':
      text: ” Ka O yeli ko o, “Bonso ka fo soorɔ ma bon naŋ e soŋ yɛlɛ?
      sbs: 0.7065
      gen_sec: 4.56
      ref_sec: 4.1
    '125':
      text: A ŋaa zie la ka te maŋ baŋ a yelmeŋɛ vooroŋ ane a tuluu vooroŋ.
      sbs: 0.75
      gen_sec: 5.28
      ref_sec: 5.28
    '126':
      text: N zoro la dabeɛ̃ ka a toma N naŋ toŋ ko yɛ na pɔɔ wa e la weɛlɛ.
      sbs: 0.7139
      gen_sec: 4.8
      ref_sec: 3.96
    '127':
      text: Kyɛ a Vooroŋ Soŋ la a dansedire, bonso a Vooroŋ Soŋ la a yelmeŋɛ.
      sbs: 0.72
      gen_sec: 5.6
      ref_sec: 6.28
    '128':
      text: bonso, yɛ baŋ la a soba na naŋ bebe a yi a piiluu saŋ.
      sbs: 0.7403
      gen_sec: 5.04
      ref_sec: 4.44
    '130':
      text: ” Ka a noba da yeli sɔge, “Fo taa la sefaa!
      sbs: 0.6198
      gen_sec: 3.36
      ref_sec: 3.94
    '131':
      text: ” Kyɛ a Yeezu da taŋ la O noɔre a ba yeli yelzaa sɔge.
      sbs: 0.6757
      gen_sec: 4.8
      ref_sec: 7.12
    '133':
      text: Bonso, N dire la o danseɛ ka o toŋ la toma yaga ko yɛ ane banaŋ naŋ be Laodisiya teŋɛ ane
        Hɛrapoli teŋɛ poɔ.
      sbs: 0.7081
      gen_sec: 9.68
      ref_sec: 9.18
    '134':
      text: ” A lɛ la ka ba da yi moɔle ka neɛzaa leɛ o eebo a yi o yelbebe poɔ.
      sbs: 0.7305
      gen_sec: 5.6
      ref_sec: 4.52
    '135':
      text: ” Ba da yeli la a ŋaa ka ba e O nyɛ, a pãã na toɔ̃ nyɛ saanaa tuo O.
      sbs: 0.7102
      gen_sec: 7.28
      ref_sec: 5.6
    '137':
      text: Soba na zaa naŋ yeli, “N baŋ O la,” kyɛ ba sagra a O nɔɛ, waa la zirŋmaara, ka a yelmeŋɛ ba
        kye o zie.
      sbs: 0.7307
      gen_sec: 8.4
      ref_sec: 8.44
    '138':
      text: “Pampana ŋa N teɛroŋ zaa gyɛrɛɛ la.
      sbs: 0.7578
      gen_sec: 3.12
      ref_sec: 3.38
    '140':
      text: A Daana la na wa e ka yɛlɛ naŋ sɔgle lige poɔ sãã veɛloŋ ka bon naŋ be sukyiri poɔ meŋ sãã.
      sbs: 0.7173
      gen_sec: 7.52
      ref_sec: 7.44
    '141':
      text: A Yeezu da yi la a be a wa O meŋɛ teŋɛ poɔ, ka a O potuuribo da tu O wa.
      sbs: 0.7305
      gen_sec: 6.24
      ref_sec: 4.6
    '142':
      text: N na iri la a gaa a N saa zie a te yeli ko o, “N saa, N eɛɛ yelbieri a kyaare Naaŋmen ane
        fõõ.
      sbs: 0.7243
      gen_sec: 8.24
      ref_sec: 8.56
    '143':
      text: Ba da ko o la sori meŋ ka o zɔɔ ne a nensonne a toɔ̃ ba.
      sbs: 0.6601
      gen_sec: 4.72
      ref_sec: 3.52
    '144':
      text: 'Azuiŋ, yɛ ko a teŋɛzu yɛlɛ zaa naŋ be yɛ enneŋ: peɛ̃mo toma, yeldɛgɛ, vɔlfaare, yelfaare
        boɔbo ane bombɔ-gaŋne .'
      sbs: 0.7055
      gen_sec: 11.52
      ref_sec: 10.3
    '149':
      text: A banaŋ naŋ puoro a wɛdoŋɔ ane a o teebo ane neɛzaa naŋ de a o yuori ŋmaaroŋ daŋ koŋ nyɛ pɛnnoo
        ŋmenaa bee tensogɔ.
      sbs: 0.6537
      gen_sec: 10.32
      ref_sec: 10.84
    '150':
      text: Maata la da kaara a bondirii yɛlɛ, ka Laazoro da e a neɛ na kaŋ naŋ da laŋ zeŋ a diibu zie
        ne a Yeezu.
      sbs: 0.6903
      gen_sec: 8.32
      ref_sec: 7.98
    '151':
      text: fo naŋ nare biŋ a andonɛɛ zaa niŋesogɔ.
      sbs: 0.6919
      gen_sec: 2.96
      ref_sec: 3.0
    '153':
      text: N erɛ la ama zaa a Ŋmen-yelnoore zuiŋ, ka ka N na toɔ̃ nyɛ a yelnoore maaloo.
      sbs: 0.7116
      gen_sec: 7.52
      ref_sec: 4.82
    '154':
      text: O da laŋ kpeɛrɛ ne la a wɛdonne; ka a malekere da kaara O zie.
      sbs: 0.718
      gen_sec: 4.96
      ref_sec: 4.12
    '156':
      text: A Yeezu da zɛge la O zu a nyɛ bondaanema naŋ eŋnɛ ba kyɔɔtaare a kyɔɔtaare daga poɔ.
      sbs: 0.7148
      gen_sec: 6.56
      ref_sec: 6.0
    '157':
      text: Yɛ nyɛ, N tonɔ yɛ la aŋa pebilii ka yɛ yi te kpɛ gboŋgboe poɔ.
      sbs: 0.7571
      gen_sec: 6.16
      ref_sec: 4.98
    '158':
      text: Yɛ ta erɛ ka a Naaŋmen Vooroŋ Soŋ poɔ saana, Ona la a ŋmaaroŋ Naaŋmen naŋ eŋ yɛ a kyɛllɛ ne
        a faabo bebiri.
      sbs: 0.7155
      gen_sec: 8.0
      ref_sec: 6.72
    '159':
      text: N sɔre la a fo potuuribo ka ba digi a sefaa ka o yi, kyɛ ka ba digi fãã.
      sbs: 0.659
      gen_sec: 5.84
      ref_sec: 6.1
    '160':
      text: Bonso, a Laazoro kuuni poɔ leɛ-iruu yɛlɛ la so ka a Gyuumine yaga da sagra derɛ a Yeezu yɛlɛ
        kyɛ zagra a ba yɛlɛ.
      sbs: 0.6966
      gen_sec: 9.52
      ref_sec: 8.62
    '165':
      text: Leɛ-teɛre nyɛ bonna naŋ da e ka fo le; leɛ fo eebo a kyɛ tonɔ a toma na fo naŋ da tonɔ a dɛndɛŋ
        saŋ.
      sbs: 0.6745
      gen_sec: 8.88
      ref_sec: 7.78
    '170':
      text: ka turi pie ne turi ayi da yi a Bɛŋgyamen bale poɔ ka ba da eŋ a ŋmaaroŋ.
      sbs: 0.6858
      gen_sec: 6.72
      ref_sec: 6.14
    '173':
      text: A ba seŋ ka o e Kiristabi-paalaa, ka lɛ naane, o na baŋ paale ne la pɔloo a le a sebɛlbɛllɛ
        dɔgroŋ poɔ.
      sbs: 0.7239
      gen_sec: 9.36
      ref_sec: 7.02
    '174':
      text: Ka Yeezu da soore a bege baŋnema ane a Faraziimine, “Sori bebe la ka ba saŋ baala a pɛnnoo
        bebiri daare bee sori kyebe.
      sbs: 0.7009
      gen_sec: 9.76
      ref_sec: 9.08
    '175':
      text: Ona la vɛŋ ka te baŋ lɛ yɛ naŋ taa nɔmmo a Vooroŋ Soŋ poɔ.
      sbs: 0.6926
      gen_sec: 4.64
      ref_sec: 3.9
    '176':
      text: Yɛ naŋ sage tu a yelmeŋɛ pampana, yɛ pɛge la a yɛ seere ka ka yɛ na taa nɔmmo naŋ sereŋ e
        meŋɛ.
      sbs: 0.7272
      gen_sec: 7.2
      ref_sec: 8.06
    '177':
      text: Kyɛ a Soŋ Soba da sɔ yɛ la kããsoŋ, ka yɛ zaa taa yelbammo.
      sbs: 0.6963
      gen_sec: 4.8
      ref_sec: 4.56
    '178':
      text: ka turi pie ne turi ayi da yi a Manaasɛ bale poɔ.
      sbs: 0.7297
      gen_sec: 4.48
      ref_sec: 4.14
    '179':
      text: Yiri na zaa poɔ yɛ naŋ wa kpɛ, yɛ daŋ yeli, ‘Ka maaroŋ be a yiri ŋa poɔ!
      sbs: 0.7453
      gen_sec: 6.0
      ref_sec: 5.22
    '181':
      text: Bee boŋ la ka Kiristabie ne neɛ naŋ ba sage de a Kirista yɛlɛ laŋ?
      sbs: 0.6844
      gen_sec: 5.44
      ref_sec: 3.58
    '182':
      text: Yɛ ta wa poɔrɔ sazu, bonso, o e la Naaŋmen nakogi, bee a poɔrɔ a teŋɛ, bonso, o meŋ waa la
        a Naaŋmen gbɛɛ-bimmu zie.
      sbs: 0.7652
      gen_sec: 10.56
      ref_sec: 11.22
    '184':
      text: Te da taa la yɛ vɔlaa kyɛ da nɔnɔ yaga ka te wa ka te nyɛ taa nimisogre.
      sbs: 0.7235
      gen_sec: 6.56
      ref_sec: 4.98
    '187':
      text: A gaŋ a zaa, yɛ de nɔmmo su pɔge yɛmenne, ona la maŋ leŋ boma zaa lantaa velaa zaa.
      sbs: 0.7164
      gen_sec: 7.44
      ref_sec: 5.7
    '189':
      text: Pampana ŋa, N de yɛ la ko Naaŋmen ane a Naaŋmen yelbiri garaaseɛ.
      sbs: 0.7049
      gen_sec: 5.92
      ref_sec: 4.66
    '190':
      text: Ba naŋ da ba nyɛ O, ba da leɛ gaa la a Gyɛruzɛlɛm ka ba te bɔ O.
      sbs: 0.6879
      gen_sec: 5.04
      ref_sec: 4.26
    '191':
      text: ” Kyɛ ba da ba baŋ a yɛlɛ O naŋ yeli ko ba tɛgɛ.
      sbs: 0.7069
      gen_sec: 3.28
      ref_sec: 8.26
    '192':
      text: ” A yeli ŋa da wa ne la tage taa, ka nɔkpeɛne da kpɛ a Pɔɔl ane Banabase ane a noba na sogɔŋ.
      sbs: 0.7147
      gen_sec: 6.88
      ref_sec: 7.4
    '195':
      text: Azuiŋ, yɛ baŋ ne a, a ta inni ka yuomo ata tensogɔ bee ŋmenaa, ka N ba nage ka N kpãã yɛ ane
        nentaŋ.
      sbs: 0.4734
      gen_sec: 10.4
      ref_sec: 8.14
    '197':
      text: Te nyɛ la dɔgɛɛ boorɔ zaa, kyɛ naŋ voorɔ; ka te teɛroŋ gyɛre, kyɛ ka te nuuri ba yoɔrɔ.
      sbs: 0.7268
      gen_sec: 6.48
      ref_sec: 6.04
    '198':
      text: N na boɔrɔ la ka yɛ zaa yele kɔkɔsaama, kyɛ a gaŋ a zaa N na boɔrɔ la ka yɛ yele Ŋmen-yelmanna
        yelyelii.
      sbs: 0.717
      gen_sec: 8.96
      ref_sec: 6.62
    '199':
      text: Enyaabo zaa daŋ ba pɔge yɛ naŋ daŋ ba pɔge nensaala.
      sbs: 0.6718
      gen_sec: 11.12
      ref_sec: 3.24
    '202':
      text: A banaŋ N naŋ nɔŋ la ka N maŋ wuli kyɛ tage ba tobo.
      sbs: 0.6475
      gen_sec: 4.72
      ref_sec: 3.16
    '203':
      text: A Naaŋmen da di la a Davil danseɛ a yeli, ‘N nyɛ la Davil, a Gyɛse bidɔɔ, ka o waa N yɛŋ neɛ.
      sbs: 0.7342
      gen_sec: 8.0
      ref_sec: 6.96
    '204':
      text: Lɛ la ka a bie da yeli ko a o saa, ‘N saa, N sãã la Naaŋmen poɔ, a sãã fo meŋ poɔ.
      sbs: 0.7266
      gen_sec: 7.76
      ref_sec: 6.42
    '205':
      text: A bama moɔlɔ la a Kirista yɛlɛ ne nɔmmo, a baŋ ka ba eŋ ma la a kyɛ N naŋ zɔɔrɔ a Ŋmen-yelnoore
        zɔɔre zuiŋ.
      sbs: 0.7219
      gen_sec: 8.88
      ref_sec: 7.48
    '207':
      text: Ka o da boɔle a gbaŋgbaa kaŋ a soore o bonna naŋ erɛ.
      sbs: 0.7237
      gen_sec: 4.0
      ref_sec: 3.9
    '208':
      text: Yeezu Naŋ Saŋ Neɛ Kaŋ Ba Naŋ Dɔge Ne Zɔnnoŋ.
      sbs: 0.6663
      gen_sec: 3.2
      ref_sec: 3.56
    '209':
      text: ka turi pie ne turi ayi da yi a Nafetali bale poɔ.
      sbs: 0.7108
      gen_sec: 4.48
      ref_sec: 4.0
    '211':
      text: Moozul da yelee la, ‘A Daana a yɛ Naaŋmen na iri la Ŋmen-yelmanna a yɛ meŋɛ noba poɔ ka o
        waa aŋa maa.
      sbs: 0.7424
      gen_sec: 8.64
      ref_sec: 7.9
    '212':
      text: “Yuomo lezaayi puoriŋ, maleke da wuli la o meŋɛ ko a Moozul vũũ naŋ da dire tuu kaŋ poɔ a
        Sanae taŋ wɛgyɛŋ poɔ.
      sbs: 0.7071
      gen_sec: 8.24
      ref_sec: 9.28
    '214':
      text: 'Kyɛ fo taa la garebanyɛ ne a yeli ŋa: fo kyiire la a Nikoletan deme tontonne na N meŋ naŋ
        kyiire.'
      sbs: 0.675
      gen_sec: 8.56
      ref_sec: 6.68
    '215':
      text: Pampana, a malekere ayopoĩ na naŋ da taa a eelɛ ayopoĩ da narɛɛ la ka ba peɛle a eelɛ.
      sbs: 0.7068
      gen_sec: 8.0
      ref_sec: 7.48
    '217':
      text: ” A Yeezu naŋ da woŋ a ŋaa, O da yeli ko la a dɔɔ, “Yelyeni kaŋ la kyɛre ka fo ba taa.
      sbs: 0.7072
      gen_sec: 6.24
      ref_sec: 6.44
    '219':
      text: ’ Lɛ la ka a saa da de a o boma poŋ a o biiri na bayi.
      sbs: 0.7149
      gen_sec: 4.64
      ref_sec: 3.54
    '220':
      text: yɛ ta dare a yɛ sukyie aŋa lɛ a yɛ sããkommine naŋ da zɔɔ ne Naaŋmen.
      sbs: 0.6623
      gen_sec: 6.0
      ref_sec: 5.5
    '221':
      text: Ka Yeezu yeli, “Pɔlbile, maa yeli ko fo, vaa-iri!
      sbs: 0.6783
      gen_sec: 5.04
      ref_sec: 4.68
    '224':
      text: A yelwolɔ naŋ waana zuiŋ, N teɛre ka a na soma la ka neɛzaa naŋ kyɛnɛ waa lɛ zaa o naŋ da
        waa.
      sbs: 0.7351
      gen_sec: 7.76
      ref_sec: 7.48
    '225':
      text: Maa Gyɔɔn la a soba na naŋ da woŋ kyɛ nyɛ a yɛlɛ ama.
      sbs: 0.7275
      gen_sec: 4.56
      ref_sec: 10.56
    '226':
      text: Ona la e ka te taa faŋ a waa a nɔpaalaa tontonema.
      sbs: 0.7113
      gen_sec: 3.92
      ref_sec: 3.28
    '227':
      text: A yɛlɛ na eŋ naŋ kyɛre, N na wuli yɛ la ka maa wa wa yɛ zie.
      sbs: 0.7212
      gen_sec: 4.48
      ref_sec: 6.74
    '228':
      text: a zɔɔrɔ ne a Daana ane a O Mɛzaaya.
      sbs: 0.7179
      gen_sec: 3.28
      ref_sec: 3.3
    '229':
      text: Yɛ nyɛ nɔmmo na tɔ a Saa naŋ nɔŋ te, a e ka ba boɔlɔ te Naaŋmen bibiiri; ka te sereŋ waa a
        lɛ.
      sbs: 0.7269
      gen_sec: 8.24
      ref_sec: 7.2
    '230':
      text: O da gaa te de la a gane yi a soba na naŋ da zeŋ a nakogi zu nuduluŋ poɔ.
      sbs: 0.6843
      gen_sec: 6.0
      ref_sec: 4.9
    '231':
      text: Yɛ saŋna a baalba naŋ be a be, kyɛ yeli ko ba, ‘A Naaŋmen naaloŋ wa peɛle yɛ la.
      sbs: 0.7653
      gen_sec: 6.08
      ref_sec: 5.5
    '233':
      text: Kyɛ tɔnɔ na zaa N naŋ da nyɛ, N de a la ka a waa zaglaa a Kirista zuiŋ.
      sbs: 0.7452
      gen_sec: 5.76
      ref_sec: 5.24
    '234':
      text: Kyɛ soba na zaa naŋ ba sage de a yelbiri na wɛ la.
      sbs: 0.7393
      gen_sec: 4.08
      ref_sec: 3.1
    '235':
      text: A ŋa la a n noɔre N naŋ wullo a puoruu laŋne yie zaa poore.
      sbs: 0.6673
      gen_sec: 5.44
      ref_sec: 3.88
    '236':
      text: 'Serɛzaa ka N yele korɔ yɛ: Gyɔɔn Bati e la kpoŋ gaŋ banaŋ zaa pɔgeba naŋ dɔge a teŋɛzu.'
      sbs: 0.716
      gen_sec: 6.72
      ref_sec: 6.58
    '237':
      text: Bonso, dɔgroŋ la so ka dabeɛ̃ bebe, kyɛ neɛ na zaa naŋ zoro dabeɛ̃ ba taa nɔmmo naŋ e soŋ.
      sbs: 0.7467
      gen_sec: 7.12
      ref_sec: 7.54
    '238':
      text: Azuiŋ a ferɛɛ la ka te maaleŋ kyɛlle velaa bon te naŋ da woŋ, ka te ta wa sare yi a poɔ.
      sbs: 0.7199
      gen_sec: 6.56
      ref_sec: 7.8
    '239':
      text: ” Ka O yeli sɔge ba, “Nembuo la N ma ane N yɔɔmine?
      sbs: 0.6789
      gen_sec: 4.56
      ref_sec: 7.36
    '240':
      text: A yɛlɛ ama da eɛɛ la ka a e yelwulaa ko te, ka ka te na ta boɔrɔ yelfaare aŋa ba naŋ da e
        lɛ.
      sbs: 0.7169
      gen_sec: 7.28
      ref_sec: 6.92
    '241':
      text: Kyɛ ka o naŋ wa poɔ̃, o maŋ buli la a eŋ bie yaga.
      sbs: 0.7219
      gen_sec: 4.32
      ref_sec: 3.5
    '242':
      text: A ŋaa la vɛŋ ka te ba zoro dabeɛ̃ a Naaŋmen niŋeŋ a yi a Kirista zuiŋ.
      sbs: 0.7295
      gen_sec: 5.36
      ref_sec: 4.86
    '243':
      text: Kyɛ Pɔɔl da ba boɔrɔ ka o taa neɛ naŋ da zo kyɛ bare ba Pamfiliya poɔ, a ba tu ba a toŋ a
        toma.
      sbs: 0.6873
      gen_sec: 8.0
      ref_sec: 7.42
    '244':
      text: Kyɛ ŋmenaa naŋ da wa do, a bombulo da zoɔlɛɛ la, a ko, a naŋ da ba taa nyaga zuiŋ.
      sbs: 0.7187
      gen_sec: 6.4
      ref_sec: 6.62
    '245':
      text: A weɛ soba da naŋ taa la neŋyenaa kaŋ, a o poyɛŋ bie.
      sbs: 0.7255
      gen_sec: 5.04
      ref_sec: 3.66
    '246':
      text: N naŋ da wa nyɛ o, N noɔre da maaɛ la yaga.
      sbs: 0.7766
      gen_sec: 3.6
      ref_sec: 3.1
    '247':
      text: Dabeɛ̃ ne nɔmaa da kpɛ ba la ne a yeli ŋa naŋ da e a gbɛre ŋa zie.
      sbs: 0.6882
      gen_sec: 5.12
      ref_sec: 6.38
    '250':
      text: A Fɛstu pãã da tere la noɔre, ka ba taa a Pɔɔl wa ne.
      sbs: 0.743
      gen_sec: 4.88
      ref_sec: 3.48
    '252':
      text: Pampana ŋa, vi ba erɛ ma, ka maa gba erɛ pɔloo yaga ne a kpeɛ̃õ a Daana naŋ tere ka N de maale
        ne yɛ.
      sbs: 0.712
      gen_sec: 7.84
      ref_sec: 6.86
    '253':
      text: ” Ka Yeezu da yeli ko o, “Yelmeŋɛ ka N yele korɔ yɛ.
      sbs: 0.6834
      gen_sec: 4.88
      ref_sec: 9.28
    '256':
      text: Yɛ vɛŋ ka neɛzaa maŋ sigre o meŋɛ korɔ a teŋɛzu wederebɛ; bonso, wederɛ zaa ba kyebe ka Naaŋmen
        zie naane ka o yi.
      sbs: 0.719
      gen_sec: 9.36
      ref_sec: 8.34
    '257':
      text: Yelmeŋɛ zaa la ka N yele korɔ yɛ, ka kabiri ba le teŋɛ a poɔ̃, o maŋ e la kabi-yeni.
      sbs: 0.7156
      gen_sec: 6.64
      ref_sec: 5.78
    '260':
      text: Ka maa pãã la bee ka bana la, a yeli ŋa la ka te moɔle ka yɛ da sage de.
      sbs: 0.7112
      gen_sec: 5.36
      ref_sec: 5.08
    '262':
      text: O eŋɛ da kɔɔ guree la, ka o da kontoɔ̃ dɔle o meŋɛ.
      sbs: 0.6984
      gen_sec: 4.4
      ref_sec: 3.74
    '263':
      text: Bonso, a ba seŋ ka o voorɔ.
      sbs: 0.6724
      gen_sec: 2.8
      ref_sec: 8.1
    '264':
      text: 'Bonso, o yeli la o poɔŋ: ‘N dire la naaloŋ aŋa pɔgenaa; N ba waa pɔgekoɔre.'
      sbs: 0.6413
      gen_sec: 6.0
      ref_sec: 7.4
    '265':
      text: Kyɛ a Yeezu da ba yeli ko o ka o koŋ kpi.
      sbs: 0.6679
      gen_sec: 3.44
      ref_sec: 8.18
    '269':
      text: Neɛ kaŋ da soore O la, “Daana, noba belaa la na nyɛ faabo be?
      sbs: 0.7182
      gen_sec: 4.8
      ref_sec: 5.22
    '270':
      text: A apostoliimine ane a nembɛrɛ da laŋ la taa ka ba kaa a yeli ŋa nyɛ.
      sbs: 0.719
      gen_sec: 5.2
      ref_sec: 5.22
    '271':
      text: bonso, fo yɔɔ la a fo tontonema, a Ŋmen-yelmanneba.
      sbs: 0.6761
      gen_sec: 4.32
      ref_sec: 3.84
    '272':
      text: Yɛ ta de faaloŋ yɔɔ ne neɛzaa naŋ e yɛ faaloŋ; kyɛ yɛ maŋ moɔrɔ ka yɛ erɛ yɛlɛ naŋ soma noba
        zaa zie.
      sbs: 0.7059
      gen_sec: 8.32
      ref_sec: 7.24
    '273':
      text: O ba kye kyɛ, ba eɛɛ la ka O leɛ-iri yi a kuuni poɔ.
      sbs: 0.6998
      gen_sec: 4.16
      ref_sec: 4.26
    '274':
      text: Bonso, ba sɛge la a Moozul begɛ poɔ, “Ta leŋ a naadɛre naŋ ŋmeɛrɛ kyi noɔre.
      sbs: 0.7009
      gen_sec: 6.32
      ref_sec: 6.58
    '276':
      text: N maŋ leŋ la noɔre gbɛre boyi daa gbuli zaa poɔ.
      sbs: 0.7289
      gen_sec: 3.92
      ref_sec: 3.1
    '277':
      text: ” A noba naŋ da bebe da ta ŋa turi anuu.
      sbs: 0.6994
      gen_sec: 2.96
      ref_sec: 3.76
    '278':
      text: 'Ba maŋ vɔge la a ba nazupile biŋ a nakogi niŋesogɔ, kyɛ yiele: “Te Daana Naaŋmen, fo seŋ
        ne la.'
      sbs: 0.6714
      gen_sec: 8.4
      ref_sec: 7.9
    '279':
      text: 'Kyɛ a danseɛ la ŋa: Naaŋmen ko te la nyɔvore naŋ ba taa baaraa, ka a nyɔvore ŋa be a O Bie
        poɔ.'
      sbs: 0.7191
      gen_sec: 7.2
      ref_sec: 6.84
    '281':
      text: A pɔge da su la kpareze-velaa, ka o lenni ne salema ane lɛɛbie ane kusi-veɛle.
      sbs: 0.7097
      gen_sec: 6.08
      ref_sec: 6.68
    '282':
      text: A zenɛ ŋa, ba dɔge la a yɛ Faara a Davil teŋkpoŋ poɔ, Ona la a Mɛzaaya, a Daana.
      sbs: 0.65
      gen_sec: 7.6
      ref_sec: 6.9
    '284':
      text: Azuiŋ ba da ŋmaa la kpaakpaa vaare, a yi ka ba te tuori O.
      sbs: 0.6659
      gen_sec: 4.88
      ref_sec: 4.78
    '286':
      text: Amine meŋ da le la tɛnnoɔ poɔ, a buli, a maale eŋ bie kɔɔ.
      sbs: 0.7514
      gen_sec: 5.68
      ref_sec: 4.96
    '287':
      text: Ba da ba puori a wɛdoŋɔ bee a o teebo, a da ba de a o ŋmaaroŋ a ba gberi bee ba nuuri eŋɛ.
      sbs: 0.7646
      gen_sec: 8.16
      ref_sec: 7.26
    '288':
      text: Ba maŋ erɛ la a lɛ a na de bon naŋ maŋ wɛ, kyɛ tenee deni ba weɛrɛ.
      sbs: 0.7171
      gen_sec: 5.6
      ref_sec: 4.84
    '289':
      text: Ka fõõ wa to fo yɔɔ bee fo yɔɔpuulee, a seŋ ka ba zeŋ ne fo nembɛrɛ niŋesogɔ.
      sbs: 0.7197
      gen_sec: 5.76
      ref_sec: 6.08
    '290':
      text: Naboma Naŋ Be Yagraa Dogre Poɔ.
      sbs: 0.6546
      gen_sec: 3.44
      ref_sec: 4.54
    '292':
      text: Lɛ la ka o toŋ ka ba te ko bibiiri na zaa naŋ ta yuomo ayi kyɛ sigre, a Bɛtelɛhɛm ane o tembilii
        poore.
      sbs: 0.7082
      gen_sec: 9.28
      ref_sec: 8.1
    '293':
      text: A o soba ta boɔrɔ ka o sɔglɔ a dɛgre iruu ŋmaaroŋ.
      sbs: 0.7312
      gen_sec: 4.08
      ref_sec: 3.92
    '294':
      text: Lɛ la ka Yeezu da toŋ Piita ane Gyɔɔn, a yele, “Yɛ gaa te nare a Ista tigri bondiraa ka te
        di.
      sbs: 0.7085
      gen_sec: 8.16
      ref_sec: 7.38
    '295':
      text: ” Ba naŋ da wa gbole kaa, ba ba la nyɛ neɛzaa ka a Yeezu yoŋ naane.
      sbs: 0.7387
      gen_sec: 4.32
      ref_sec: 4.52
    '298':
      text: O naŋ da wa de a suobu baare, o da be la a Filipi zie tegitegilɛ.
      sbs: 0.7227
      gen_sec: 5.28
      ref_sec: 4.48
    '299':
      text: Fo ba ŋmaa a zirii ŋa ko te kyɛ Naaŋmen la ka fo ŋmaa tere.
      sbs: 0.7361
      gen_sec: 4.96
      ref_sec: 3.62
  score: 0.7071
  partial: true
- model: k2-fsa/OmniVoice-ref
  sbs: 0.697
  num_scored: 200
  uses_reference: true
  entries:
    '0':
      text: Ka maa bare ba ne a kɔŋ ka ba kulo, ba na yĩĩe la a sobiriŋ, bonso, ba mine yi la tentɔbɔ
        a wa.
      sbs: 0.6607
      gen_sec: 6.72
      ref_sec: 7.66
    '2':
      text: A Yeezu naŋ da gɛrɛ Gyɛruzɛlɛm, O da kpɛ la a teŋkponni ane a tembilii poore a kanna a noba
        gɛrɛ.
      sbs: 0.7135
      gen_sec: 7.16
      ref_sec: 7.54
    '3':
      text: A Naaŋmen Bagmaale Wederebɛ Nembɛrɛ Zusoba Naŋ Soore Yeezu Soorebie.
      sbs: 0.6313
      gen_sec: 5.41
      ref_sec: 8.22
    '5':
      text: Azuiŋ, yɛ ta daŋ di sɛrɛɛ kyɛ ka a saŋ ba ta; kyɛ ka a Daana waabo naŋ ba ta sɛre.
      sbs: 0.713
      gen_sec: 5.84
      ref_sec: 5.84
    '6':
      text: O naŋ da wa pɔge te a Azɔ poɔ, o da kpɛ la a gbori ka te gaa Mitelen.
      sbs: 0.6528
      gen_sec: 4.88
      ref_sec: 6.46
    '7':
      text: Ba da lɔɔ o la bare ka o sigi wa a teŋɛzu, a lɔɔ a o malekere meŋ poɔ o eŋɛ.
      sbs: 0.7118
      gen_sec: 5.36
      ref_sec: 6.06
    '8':
      text: Ka a toŋkpeɛne ama naŋ toŋ fo poɔ, da toŋ Sodom teŋɛ poɔ, o da na kyɛnɛ bebe la wa ta zenɛ.
      sbs: 0.7065
      gen_sec: 6.45
      ref_sec: 7.3
    '10':
      text: A banaŋ naŋ da zo yaare da yi yoɔrɔ la, a moɔlɔ a yelbiri.
      sbs: 0.7042
      gen_sec: 4.24
      ref_sec: 5.66
    '11':
      text: N poyɛŋ noba, nɔpaalaa naane ka N sɛgrɛ korɔ yɛ, kyɛ a nɔkoraa na yɛ naŋ da taa yi a piiluu
        saŋ la.
      sbs: 0.7331
      gen_sec: 7.16
      ref_sec: 8.0
    '12':
      text: ” Ka Yeezu da yeli, “Yɛ e ka a noba zeŋ teŋɛ.
      sbs: 0.6839
      gen_sec: 3.16
      ref_sec: 14.68
    '13':
      text: Wola pãã ka a weɛ soba na e a wɛkaareba ŋa?
      sbs: 0.6982
      gen_sec: 3.2
      ref_sec: 3.42
    '15':
      text: Ona la boɔrɔ ka neɛzaa nyɛ faabo a kyɛ wa baŋ a yelmeŋɛ.
      sbs: 0.6992
      gen_sec: 4.19
      ref_sec: 3.56
    '19':
      text: Pɔɔl Naŋ Puori A Filipae Deme Yaane.
      sbs: 0.6913
      gen_sec: 2.88
      ref_sec: 5.12
    '20':
      text: Bonso, ba da ba sage de a banaŋ zaa naŋ da wa yeli a O kuuni poɔ leɛ-iruu yɛlɛ ko ba.
      sbs: 0.7079
      gen_sec: 6.08
      ref_sec: 5.86
    '21':
      text: ” Ba da do la a sazu a zunzugri poɔ ka a ba dɔndɔnne da kaara ba.
      sbs: 0.6778
      gen_sec: 4.64
      ref_sec: 4.64
    '25':
      text: Kyɛ a ŋaa la ka yɛ mine da waa, kyɛ ka ba da pɛge yɛ.
      sbs: 0.6943
      gen_sec: 3.61
      ref_sec: 3.38
    '27':
      text: Ka fõõ meŋɛ soore o, fo na nyɛ la ka a yɛlɛ zaa te naŋ yeli kyaare ne o waa la a lɛ.
      sbs: 0.8087
      gen_sec: 5.92
      ref_sec: 5.82
    '28':
      text: “Daana, a piiluu saŋ, fõõ la iri a teŋɛ.
      sbs: 0.6665
      gen_sec: 2.96
      ref_sec: 3.28
    '29':
      text: Bebie ata puoriŋ, a Pɔɔl da boɔle la a Gyuumine nembɛrɛ naŋ da be a be lantaa.
      sbs: 0.6864
      gen_sec: 5.8
      ref_sec: 5.56
    '30':
      text: A Maleke Na Naŋ Taa A Ganlee Yɛlɛ.
      sbs: 0.6856
      gen_sec: 2.64
      ref_sec: 3.8
    '31':
      text: Nɔmmo maŋ taa la teɛretɔroo ne yelzaa kyɛ maŋ di kannyiri ne yelzaa.
      sbs: 0.7114
      gen_sec: 5.24
      ref_sec: 3.94
    '32':
      text: N naŋ da wa nyɛ O, N da le vɔgle la muro O gbɛɛ puliŋ a waa ŋa neɛ naŋ kpi.
      sbs: 0.7374
      gen_sec: 5.24
      ref_sec: 5.86
    '36':
      text: Lɛ la ka o da boɔle o a soore o, ‘Boŋ la ka N wono kyaare ne fo ya?
      sbs: 0.6784
      gen_sec: 4.64
      ref_sec: 4.14
    '37':
      text: Yɛ kaa a Izerayɛl biiri nyɛ; a banaŋ naŋ maŋ di a Naaŋmen bagmaale boma, ba ba maŋ waa a Naaŋmen
        bagmaalkuuri laŋne deme be?
      sbs: 0.7118
      gen_sec: 9.2
      ref_sec: 7.62
    '38':
      text: Kyɛ N na ko la a N dansediribe bayi naŋ su boɔre kparre kpeɛ̃õ ka ba yeli Ŋmen-yelmanna yelyelii
        bebie turi dɔgle kɔɔraayi ne lezaata.
      sbs: 0.6441
      gen_sec: 10.04
      ref_sec: 12.4
    '39':
      text: Te sɛgrɛ la a yɛlɛ ama ka ka a te kyelloo na paale.
      sbs: 0.7184
      gen_sec: 3.76
      ref_sec: 3.98
    '40':
      text: ka ba da de O do ne sazu ne puubu.
      sbs: 0.6941
      gen_sec: 2.48
      ref_sec: 4.84
    '44':
      text: 'Azuiŋ la ka ba yeli: “Gɔŋgbire, iri!'
      sbs: 0.6778
      gen_sec: 2.72
      ref_sec: 3.24
    '46':
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.6881
      gen_sec: 5.32
      ref_sec: 5.94
    '47':
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.6614
      gen_sec: 6.56
      ref_sec: 14.94
    '48':
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.666
      gen_sec: 7.28
      ref_sec: 6.46
    '51':
      text: Yeezu Naŋ Koŋ A Gyɛruzɛlɛm Teŋɛ Yɛlɛ.
      sbs: 0.6647
      gen_sec: 2.96
      ref_sec: 10.58
    '52':
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.6908
      gen_sec: 2.64
      ref_sec: 5.8
    '53':
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.6942
      gen_sec: 5.92
      ref_sec: 6.64
    '54':
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.6909
      gen_sec: 4.36
      ref_sec: 4.32
    '56':
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.7074
      gen_sec: 6.44
      ref_sec: 7.02
    '57':
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.7425
      gen_sec: 5.59
      ref_sec: 5.42
    '58':
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.691
      gen_sec: 7.0
      ref_sec: 7.12
    '61':
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.6613
      gen_sec: 6.0
      ref_sec: 5.42
    '62':
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.6999
      gen_sec: 3.64
      ref_sec: 3.44
    '63':
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.6989
      gen_sec: 4.8
      ref_sec: 4.66
    '64':
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.7101
      gen_sec: 4.68
      ref_sec: 4.9
    '65':
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
      sbs: 0.7062
      gen_sec: 5.68
      ref_sec: 7.08
    '66':
      text: 'Lɛ la ka N da woŋ kɔkɔre kaŋ a saluoni poɔ ka o yele: “N noba, yɛ wa yi o poɔ.'
      sbs: 0.7007
      gen_sec: 5.37
      ref_sec: 6.26
    '67':
      text: O da iri arɛɛ la ka O sɔre, ka ba de a Ŋmen-yelmanna Azaaya gansɛgraa ko O.
      sbs: 0.6483
      gen_sec: 5.36
      ref_sec: 13.28
    '69':
      text: Neɛzaa ba nyɛ fo saanaa ka fo seŋ ne la kũũ be?
      sbs: 0.7075
      gen_sec: 3.48
      ref_sec: 3.28
    '70':
      text: A ŋaa la tori kyɛ pɛllɛ Naaŋmen a te Faara poɔ.
      sbs: 0.6964
      gen_sec: 3.56
      ref_sec: 3.26
    '71':
      text: Te da kpɛ la a gbori a be ka Arestaku naŋ da waa Masedoniya neɛ kyɛ da yi Tɛsalonika da beɛle
        te.
      sbs: 0.6954
      gen_sec: 7.1
      ref_sec: 7.84
    '72':
      text: Pampana, nembuo mɔɔ la na e yɛ yelfaa, ka yɛneŋ wa kyerɛ ka yɛ e yɛlɛ naŋ e velaa?
      sbs: 0.7211
      gen_sec: 5.96
      ref_sec: 6.04
    '73':
      text: A soba na naŋ da faa te yi ne a dɔgɛɛ naŋ tɔgle kũũ, naŋ na kyɛnɛ faa te la.
      sbs: 0.697
      gen_sec: 5.4
      ref_sec: 5.32
    '74':
      text: 'Ba sɛge la a begɛ gane poɔ: “Noba naŋ yele kɔkɔsaama.'
      sbs: 0.7
      gen_sec: 3.92
      ref_sec: 5.08
    '75':
      text: Biiri na kyiiri la ba dɔgreba a vɛŋ ka ba ko ba.
      sbs: 0.713
      gen_sec: 3.55
      ref_sec: 3.32
    '76':
      text: Yɛ erɛ yɛlɛ ne yɛŋ a kyaara noba na naŋ ba poɔ yɛ poɔ, kyɛ maŋ vɛŋ ka wagre zaa yire tɔnɔ.
      sbs: 0.7082
      gen_sec: 6.48
      ref_sec: 6.24
    '77':
      text: A ŋaa zie la ka te baŋ ka a baaraa saŋ taɛ la.
      sbs: 0.7135
      gen_sec: 3.32
      ref_sec: 3.6
    '79':
      text: Kyɛ ba da de la soba na zaa yuori ba naŋ ba sɛge eŋ a nyɔvore gane poɔ lɔɔ eŋ a baa vũũ poɔ.
      sbs: 0.723
      gen_sec: 6.49
      ref_sec: 9.34
    '80':
      text: A dɛndɛŋ soba da yi waɛ la, a wa yeli, ‘Daana, a fo warbiri yi la warbie pie tɔnɔ dɔgle o
        zu.
      sbs: 0.7302
      gen_sec: 6.64
      ref_sec: 7.52
    '81':
      text: 'A yelwulaa yɛ naŋ na nyɛ la ŋa: yɛ na nyɛ la bie ba naŋ pilli ne bipɛmɛ a gaale O donne bondi
        gbori poɔ.'
      sbs: 0.6578
      gen_sec: 7.52
      ref_sec: 8.0
    '82':
      text: Nemmeŋɛ maŋ iri la bonsonne yi o nabonsonne poɔ, ka nenfaa meŋ maŋ iri bonfaare yi o nabonfaare
        poɔ.
      sbs: 0.6075
      gen_sec: 7.56
      ref_sec: 4.78
    '86':
      text: Bonso, neɛzaa koŋ la baŋ biŋ yiri pare zaa ka a onaŋ ba naŋ biŋ naane; a yiri pare ŋa la a
        Yeezu Kirista.
      sbs: 0.7181
      gen_sec: 7.64
      ref_sec: 8.06
    '87':
      text: A O eŋɛ la ka a yiri lamboe zaa mɛ lantaa a baa te leɛ Naaŋmen die naŋ e soŋ a be a Daana
        eŋɛ.
      sbs: 0.7083
      gen_sec: 6.68
      ref_sec: 6.34
    '88':
      text: ” Ka O yeli ko ba, “N nyɛ la Setaana ka o yi sazu a le teŋɛ a ŋa saa naŋ nyegre.
      sbs: 0.712
      gen_sec: 5.35
      ref_sec: 5.76
    '89':
      text: Kyɛ deɛ yeli a yelbiri yoŋ, a vɛŋ ka N gbaŋgbaa nyɛ o sammo.
      sbs: 0.691
      gen_sec: 4.44
      ref_sec: 4.36
    '90':
      text: ” O da kaara ba la polipoli a teɛre ka ba na ko o la bonkaŋ.
      sbs: 0.6481
      gen_sec: 4.21
      ref_sec: 3.88
    '93':
      text: Ka maa puori Naaŋmen ameseɛrɛ kyɛ di a bondirii, bonso ka ba na saana n yuori ne bondirii
        N naŋ puori Naaŋmen ameseɛrɛ kyɛ di?
      sbs: 0.7004
      gen_sec: 9.44
      ref_sec: 7.7
    '94':
      text: Saa nyegroo ane hooroo ane saa tannoo da yire la a nakogi zie, kyɛ ka fentele ayopoĩ da dire
        a nakogi niŋesogɔ.
      sbs: 0.6533
      gen_sec: 8.07
      ref_sec: 10.42
    '95':
      text: N da guoli yɛ la ane beroŋ, a da ba e bondi-tage, bonso, yɛ da naŋ ba ta bondi-tage diibu.
      sbs: 0.7052
      gen_sec: 6.44
      ref_sec: 7.16
    '96':
      text: Yuoni zaa poɔ a Yeezu dɔgrebɔ da maŋ gaa la Gyɛruzɛlɛm a te di a Ista tigri.
      sbs: 0.699
      gen_sec: 5.64
      ref_sec: 5.88
    '97':
      text: Ka a naŋ wa seŋ ka N meŋ gaa, ba na beɛle ma la ka te gaa.
      sbs: 0.7218
      gen_sec: 4.04
      ref_sec: 3.68
    '99':
      text: Ba da teɛre ka O be la a noba poɔ ka ba zaa kyɛnɛ a sori poɔ.
      sbs: 0.6831
      gen_sec: 4.36
      ref_sec: 4.2
    '101':
      text: Neɛzaa kontoɔ̃ pigi ma sori ka N ta ire n meŋɛ yuori!
      sbs: 0.7038
      gen_sec: 3.92
      ref_sec: 3.5
    '103':
      text: Te baŋ ka te yi la kũũ poɔ a kpɛ nyɔvore poɔ, te naŋ nɔŋ taa zuiŋ.
      sbs: 0.72
      gen_sec: 4.32
      ref_sec: 4.58
    '104':
      text: N baŋ ka a N gaabo puoriŋ, noba mine naŋ waa ŋa gboŋgbo-faare na wa kpɛ la yɛ poɔ, a koŋ bare
        a peere.
      sbs: 0.6958
      gen_sec: 7.32
      ref_sec: 7.04
    '106':
      text: O da ba di bonzaa a bebie na zaa poɔ, kyɛ O naŋ da wa te baare, kɔŋ da kpɛ O la yaga.
      sbs: 0.6672
      gen_sec: 5.96
      ref_sec: 6.58
    '109':
      text: Ba na de a la lɔɔ bare.
      sbs: 0.6879
      gen_sec: 2.0
      ref_sec: 11.98
    '112':
      text: ” Ka O yeli, “Yɛ gu yɛmenne velaa ka ba ta wa bɛlle yɛ.
      sbs: 0.7217
      gen_sec: 3.92
      ref_sec: 3.4
    '113':
      text: Kyɛ a Yeezu naŋ da bale a O kyɛmmo poɔ la so ka O da wa zeŋ a bulee noɔreŋ.
      sbs: 0.7078
      gen_sec: 5.36
      ref_sec: 5.98
    '114':
      text: Ba suuri da iree la yaga ane ba naŋ da kanna a noba kyɛ moɔlɔ ka a Yeezu zie la ka kuuni leɛ-iruu
        be.
      sbs: 0.7144
      gen_sec: 7.32
      ref_sec: 7.64
    '115':
      text: Piita Ane Gyɔɔn Naŋ Are A Sɛrediribe Niŋesogɔ.
      sbs: 0.6084
      gen_sec: 3.68
      ref_sec: 3.4
    '116':
      text: Bonso, te waa la Naaŋmen tontonema naŋ laŋ tonɔ, yɛnee la a Naaŋmen weɛ, a Naaŋmen yiri.
      sbs: 0.7251
      gen_sec: 6.6
      ref_sec: 7.14
    '121':
      text: Pɔlbile kaŋ yuori naŋ da di Yutaaku da zeŋ la a takoro noɔreŋ a gbire kyuuro, a Pɔɔl naŋ da
        yele yɛlɛ.
      sbs: 0.6854
      gen_sec: 7.56
      ref_sec: 7.18
    '124':
      text: ” Ka O yeli ko o, “Bonso ka fo soorɔ ma bon naŋ e soŋ yɛlɛ?
      sbs: 0.7043
      gen_sec: 4.04
      ref_sec: 4.1
    '125':
      text: A ŋaa zie la ka te maŋ baŋ a yelmeŋɛ vooroŋ ane a tuluu vooroŋ.
      sbs: 0.74
      gen_sec: 4.68
      ref_sec: 5.28
    '126':
      text: N zoro la dabeɛ̃ ka a toma N naŋ toŋ ko yɛ na pɔɔ wa e la weɛlɛ.
      sbs: 0.7015
      gen_sec: 4.44
      ref_sec: 3.96
    '127':
      text: Kyɛ a Vooroŋ Soŋ la a dansedire, bonso a Vooroŋ Soŋ la a yelmeŋɛ.
      sbs: 0.72
      gen_sec: 4.88
      ref_sec: 6.28
    '128':
      text: bonso, yɛ baŋ la a soba na naŋ bebe a yi a piiluu saŋ.
      sbs: 0.7351
      gen_sec: 3.92
      ref_sec: 4.44
    '130':
      text: ” Ka a noba da yeli sɔge, “Fo taa la sefaa!
      sbs: 0.6406
      gen_sec: 3.08
      ref_sec: 3.94
    '131':
      text: ” Kyɛ a Yeezu da taŋ la O noɔre a ba yeli yelzaa sɔge.
      sbs: 0.6535
      gen_sec: 3.92
      ref_sec: 7.12
    '133':
      text: Bonso, N dire la o danseɛ ka o toŋ la toma yaga ko yɛ ane banaŋ naŋ be Laodisiya teŋɛ ane
        Hɛrapoli teŋɛ poɔ.
      sbs: 0.7005
      gen_sec: 7.92
      ref_sec: 9.18
    '134':
      text: ” A lɛ la ka ba da yi moɔle ka neɛzaa leɛ o eebo a yi o yelbebe poɔ.
      sbs: 0.7054
      gen_sec: 4.55
      ref_sec: 4.52
    '135':
      text: ” Ba da yeli la a ŋaa ka ba e O nyɛ, a pãã na toɔ̃ nyɛ saanaa tuo O.
      sbs: 0.693
      gen_sec: 4.41
      ref_sec: 5.6
    '137':
      text: Soba na zaa naŋ yeli, “N baŋ O la,” kyɛ ba sagra a O nɔɛ, waa la zirŋmaara, ka a yelmeŋɛ ba
        kye o zie.
      sbs: 0.7068
      gen_sec: 7.09
      ref_sec: 8.44
    '138':
      text: “Pampana ŋa N teɛroŋ zaa gyɛrɛɛ la.
      sbs: 0.714
      gen_sec: 2.72
      ref_sec: 3.38
    '140':
      text: A Daana la na wa e ka yɛlɛ naŋ sɔgle lige poɔ sãã veɛloŋ ka bon naŋ be sukyiri poɔ meŋ sãã.
      sbs: 0.6989
      gen_sec: 6.56
      ref_sec: 7.44
    '141':
      text: A Yeezu da yi la a be a wa O meŋɛ teŋɛ poɔ, ka a O potuuribo da tu O wa.
      sbs: 0.7082
      gen_sec: 4.91
      ref_sec: 4.6
    '142':
      text: N na iri la a gaa a N saa zie a te yeli ko o, “N saa, N eɛɛ yelbieri a kyaare Naaŋmen ane
        fõõ.
      sbs: 0.7011
      gen_sec: 6.56
      ref_sec: 8.56
    '143':
      text: Ba da ko o la sori meŋ ka o zɔɔ ne a nensonne a toɔ̃ ba.
      sbs: 0.6608
      gen_sec: 3.88
      ref_sec: 3.52
    '144':
      text: 'Azuiŋ, yɛ ko a teŋɛzu yɛlɛ zaa naŋ be yɛ enneŋ: peɛ̃mo toma, yeldɛgɛ, vɔlfaare, yelfaare
        boɔbo ane bombɔ-gaŋne .'
      sbs: 0.7018
      gen_sec: 7.98
      ref_sec: 10.3
    '149':
      text: A banaŋ naŋ puoro a wɛdoŋɔ ane a o teebo ane neɛzaa naŋ de a o yuori ŋmaaroŋ daŋ koŋ nyɛ pɛnnoo
        ŋmenaa bee tensogɔ.
      sbs: 0.6619
      gen_sec: 8.52
      ref_sec: 10.84
    '150':
      text: Maata la da kaara a bondirii yɛlɛ, ka Laazoro da e a neɛ na kaŋ naŋ da laŋ zeŋ a diibu zie
        ne a Yeezu.
      sbs: 0.6792
      gen_sec: 7.32
      ref_sec: 7.98
    '151':
      text: fo naŋ nare biŋ a andonɛɛ zaa niŋesogɔ.
      sbs: 0.6898
      gen_sec: 3.04
      ref_sec: 3.0
    '153':
      text: N erɛ la ama zaa a Ŋmen-yelnoore zuiŋ, ka ka N na toɔ̃ nyɛ a yelnoore maaloo.
      sbs: 0.7256
      gen_sec: 5.56
      ref_sec: 4.82
    '154':
      text: O da laŋ kpeɛrɛ ne la a wɛdonne; ka a malekere da kaara O zie.
      sbs: 0.7052
      gen_sec: 4.52
      ref_sec: 4.12
    '156':
      text: A Yeezu da zɛge la O zu a nyɛ bondaanema naŋ eŋnɛ ba kyɔɔtaare a kyɔɔtaare daga poɔ.
      sbs: 0.7022
      gen_sec: 6.27
      ref_sec: 6.0
    '157':
      text: Yɛ nyɛ, N tonɔ yɛ la aŋa pebilii ka yɛ yi te kpɛ gboŋgboe poɔ.
      sbs: 0.7247
      gen_sec: 4.52
      ref_sec: 4.98
    '158':
      text: Yɛ ta erɛ ka a Naaŋmen Vooroŋ Soŋ poɔ saana, Ona la a ŋmaaroŋ Naaŋmen naŋ eŋ yɛ a kyɛllɛ ne
        a faabo bebiri.
      sbs: 0.6855
      gen_sec: 7.84
      ref_sec: 6.72
    '159':
      text: N sɔre la a fo potuuribo ka ba digi a sefaa ka o yi, kyɛ ka ba digi fãã.
      sbs: 0.646
      gen_sec: 5.12
      ref_sec: 6.1
    '160':
      text: Bonso, a Laazoro kuuni poɔ leɛ-iruu yɛlɛ la so ka a Gyuumine yaga da sagra derɛ a Yeezu yɛlɛ
        kyɛ zagra a ba yɛlɛ.
      sbs: 0.7146
      gen_sec: 8.32
      ref_sec: 8.62
    '165':
      text: Leɛ-teɛre nyɛ bonna naŋ da e ka fo le; leɛ fo eebo a kyɛ tonɔ a toma na fo naŋ da tonɔ a dɛndɛŋ
        saŋ.
      sbs: 0.6778
      gen_sec: 7.12
      ref_sec: 7.78
    '170':
      text: ka turi pie ne turi ayi da yi a Bɛŋgyamen bale poɔ ka ba da eŋ a ŋmaaroŋ.
      sbs: 0.7069
      gen_sec: 5.25
      ref_sec: 6.14
    '173':
      text: A ba seŋ ka o e Kiristabi-paalaa, ka lɛ naane, o na baŋ paale ne la pɔloo a le a sebɛlbɛllɛ
        dɔgroŋ poɔ.
      sbs: 0.6975
      gen_sec: 7.48
      ref_sec: 7.02
    '174':
      text: Ka Yeezu da soore a bege baŋnema ane a Faraziimine, “Sori bebe la ka ba saŋ baala a pɛnnoo
        bebiri daare bee sori kyebe.
      sbs: 0.7129
      gen_sec: 8.64
      ref_sec: 9.08
    '175':
      text: Ona la vɛŋ ka te baŋ lɛ yɛ naŋ taa nɔmmo a Vooroŋ Soŋ poɔ.
      sbs: 0.6978
      gen_sec: 4.24
      ref_sec: 3.9
    '176':
      text: Yɛ naŋ sage tu a yelmeŋɛ pampana, yɛ pɛge la a yɛ seere ka ka yɛ na taa nɔmmo naŋ sereŋ e
        meŋɛ.
      sbs: 0.7143
      gen_sec: 6.88
      ref_sec: 8.06
    '177':
      text: Kyɛ a Soŋ Soba da sɔ yɛ la kããsoŋ, ka yɛ zaa taa yelbammo.
      sbs: 0.7172
      gen_sec: 4.24
      ref_sec: 4.56
    '178':
      text: ka turi pie ne turi ayi da yi a Manaasɛ bale poɔ.
      sbs: 0.701
      gen_sec: 3.59
      ref_sec: 4.14
    '179':
      text: Yiri na zaa poɔ yɛ naŋ wa kpɛ, yɛ daŋ yeli, ‘Ka maaroŋ be a yiri ŋa poɔ!
      sbs: 0.7164
      gen_sec: 5.12
      ref_sec: 5.22
    '181':
      text: Bee boŋ la ka Kiristabie ne neɛ naŋ ba sage de a Kirista yɛlɛ laŋ?
      sbs: 0.6734
      gen_sec: 4.92
      ref_sec: 3.58
    '182':
      text: Yɛ ta wa poɔrɔ sazu, bonso, o e la Naaŋmen nakogi, bee a poɔrɔ a teŋɛ, bonso, o meŋ waa la
        a Naaŋmen gbɛɛ-bimmu zie.
      sbs: 0.7188
      gen_sec: 8.36
      ref_sec: 11.22
    '184':
      text: Te da taa la yɛ vɔlaa kyɛ da nɔnɔ yaga ka te wa ka te nyɛ taa nimisogre.
      sbs: 0.7053
      gen_sec: 5.24
      ref_sec: 4.98
    '187':
      text: A gaŋ a zaa, yɛ de nɔmmo su pɔge yɛmenne, ona la maŋ leŋ boma zaa lantaa velaa zaa.
      sbs: 0.6992
      gen_sec: 6.04
      ref_sec: 5.7
    '189':
      text: Pampana ŋa, N de yɛ la ko Naaŋmen ane a Naaŋmen yelbiri garaaseɛ.
      sbs: 0.696
      gen_sec: 4.92
      ref_sec: 4.66
    '190':
      text: Ba naŋ da ba nyɛ O, ba da leɛ gaa la a Gyɛruzɛlɛm ka ba te bɔ O.
      sbs: 0.6702
      gen_sec: 4.52
      ref_sec: 4.26
    '191':
      text: ” Kyɛ ba da ba baŋ a yɛlɛ O naŋ yeli ko ba tɛgɛ.
      sbs: 0.6856
      gen_sec: 3.37
      ref_sec: 8.26
    '192':
      text: ” A yeli ŋa da wa ne la tage taa, ka nɔkpeɛne da kpɛ a Pɔɔl ane Banabase ane a noba na sogɔŋ.
      sbs: 0.6996
      gen_sec: 6.37
      ref_sec: 7.4
    '195':
      text: Azuiŋ, yɛ baŋ ne a, a ta inni ka yuomo ata tensogɔ bee ŋmenaa, ka N ba nage ka N kpãã yɛ ane
        nentaŋ.
      sbs: 0.7014
      gen_sec: 7.16
      ref_sec: 8.14
    '197':
      text: Te nyɛ la dɔgɛɛ boorɔ zaa, kyɛ naŋ voorɔ; ka te teɛroŋ gyɛre, kyɛ ka te nuuri ba yoɔrɔ.
      sbs: 0.7239
      gen_sec: 6.36
      ref_sec: 6.04
    '198':
      text: N na boɔrɔ la ka yɛ zaa yele kɔkɔsaama, kyɛ a gaŋ a zaa N na boɔrɔ la ka yɛ yele Ŋmen-yelmanna
        yelyelii.
      sbs: 0.7135
      gen_sec: 7.6
      ref_sec: 6.62
    '199':
      text: Enyaabo zaa daŋ ba pɔge yɛ naŋ daŋ ba pɔge nensaala.
      sbs: 0.7132
      gen_sec: 3.95
      ref_sec: 3.24
    '202':
      text: A banaŋ N naŋ nɔŋ la ka N maŋ wuli kyɛ tage ba tobo.
      sbs: 0.6582
      gen_sec: 3.76
      ref_sec: 3.16
    '203':
      text: A Naaŋmen da di la a Davil danseɛ a yeli, ‘N nyɛ la Davil, a Gyɛse bidɔɔ, ka o waa N yɛŋ neɛ.
      sbs: 0.7004
      gen_sec: 6.56
      ref_sec: 6.96
    '204':
      text: Lɛ la ka a bie da yeli ko a o saa, ‘N saa, N sãã la Naaŋmen poɔ, a sãã fo meŋ poɔ.
      sbs: 0.7031
      gen_sec: 5.6
      ref_sec: 6.42
    '205':
      text: A bama moɔlɔ la a Kirista yɛlɛ ne nɔmmo, a baŋ ka ba eŋ ma la a kyɛ N naŋ zɔɔrɔ a Ŋmen-yelnoore
        zɔɔre zuiŋ.
      sbs: 0.7132
      gen_sec: 7.72
      ref_sec: 7.48
    '207':
      text: Ka o da boɔle a gbaŋgbaa kaŋ a soore o bonna naŋ erɛ.
      sbs: 0.6948
      gen_sec: 3.92
      ref_sec: 3.9
    '208':
      text: Yeezu Naŋ Saŋ Neɛ Kaŋ Ba Naŋ Dɔge Ne Zɔnnoŋ.
      sbs: 0.6443
      gen_sec: 3.36
      ref_sec: 3.56
    '209':
      text: ka turi pie ne turi ayi da yi a Nafetali bale poɔ.
      sbs: 0.7082
      gen_sec: 3.72
      ref_sec: 4.0
    '211':
      text: Moozul da yelee la, ‘A Daana a yɛ Naaŋmen na iri la Ŋmen-yelmanna a yɛ meŋɛ noba poɔ ka o
        waa aŋa maa.
      sbs: 0.7306
      gen_sec: 7.4
      ref_sec: 7.9
    '212':
      text: “Yuomo lezaayi puoriŋ, maleke da wuli la o meŋɛ ko a Moozul vũũ naŋ da dire tuu kaŋ poɔ a
        Sanae taŋ wɛgyɛŋ poɔ.
      sbs: 0.7394
      gen_sec: 8.16
      ref_sec: 9.28
    '214':
      text: 'Kyɛ fo taa la garebanyɛ ne a yeli ŋa: fo kyiire la a Nikoletan deme tontonne na N meŋ naŋ
        kyiire.'
      sbs: 0.6678
      gen_sec: 6.72
      ref_sec: 6.68
    '215':
      text: Pampana, a malekere ayopoĩ na naŋ da taa a eelɛ ayopoĩ da narɛɛ la ka ba peɛle a eelɛ.
      sbs: 0.7305
      gen_sec: 6.33
      ref_sec: 7.48
    '217':
      text: ” A Yeezu naŋ da woŋ a ŋaa, O da yeli ko la a dɔɔ, “Yelyeni kaŋ la kyɛre ka fo ba taa.
      sbs: 0.6901
      gen_sec: 5.96
      ref_sec: 6.44
    '219':
      text: ’ Lɛ la ka a saa da de a o boma poŋ a o biiri na bayi.
      sbs: 0.713
      gen_sec: 3.68
      ref_sec: 3.54
    '220':
      text: yɛ ta dare a yɛ sukyie aŋa lɛ a yɛ sããkommine naŋ da zɔɔ ne Naaŋmen.
      sbs: 0.6634
      gen_sec: 5.04
      ref_sec: 5.5
    '221':
      text: Ka Yeezu yeli, “Pɔlbile, maa yeli ko fo, vaa-iri!
      sbs: 0.6735
      gen_sec: 3.64
      ref_sec: 4.68
    '224':
      text: A yelwolɔ naŋ waana zuiŋ, N teɛre ka a na soma la ka neɛzaa naŋ kyɛnɛ waa lɛ zaa o naŋ da
        waa.
      sbs: 0.7184
      gen_sec: 6.76
      ref_sec: 7.48
    '225':
      text: Maa Gyɔɔn la a soba na naŋ da woŋ kyɛ nyɛ a yɛlɛ ama.
      sbs: 0.6953
      gen_sec: 3.88
      ref_sec: 10.56
    '226':
      text: Ona la e ka te taa faŋ a waa a nɔpaalaa tontonema.
      sbs: 0.706
      gen_sec: 3.72
      ref_sec: 3.28
    '227':
      text: A yɛlɛ na eŋ naŋ kyɛre, N na wuli yɛ la ka maa wa wa yɛ zie.
      sbs: 0.7301
      gen_sec: 4.24
      ref_sec: 6.74
    '228':
      text: a zɔɔrɔ ne a Daana ane a O Mɛzaaya.
      sbs: 0.7466
      gen_sec: 2.64
      ref_sec: 3.3
    '229':
      text: Yɛ nyɛ nɔmmo na tɔ a Saa naŋ nɔŋ te, a e ka ba boɔlɔ te Naaŋmen bibiiri; ka te sereŋ waa a
        lɛ.
      sbs: 0.7103
      gen_sec: 6.68
      ref_sec: 7.2
    '230':
      text: O da gaa te de la a gane yi a soba na naŋ da zeŋ a nakogi zu nuduluŋ poɔ.
      sbs: 0.691
      gen_sec: 5.2
      ref_sec: 4.9
    '231':
      text: Yɛ saŋna a baalba naŋ be a be, kyɛ yeli ko ba, ‘A Naaŋmen naaloŋ wa peɛle yɛ la.
      sbs: 0.7299
      gen_sec: 5.76
      ref_sec: 5.5
    '233':
      text: Kyɛ tɔnɔ na zaa N naŋ da nyɛ, N de a la ka a waa zaglaa a Kirista zuiŋ.
      sbs: 0.7143
      gen_sec: 5.04
      ref_sec: 5.24
    '234':
      text: Kyɛ soba na zaa naŋ ba sage de a yelbiri na wɛ la.
      sbs: 0.7089
      gen_sec: 3.68
      ref_sec: 3.1
    '235':
      text: A ŋa la a n noɔre N naŋ wullo a puoruu laŋne yie zaa poore.
      sbs: 0.715
      gen_sec: 4.23
      ref_sec: 3.88
    '236':
      text: 'Serɛzaa ka N yele korɔ yɛ: Gyɔɔn Bati e la kpoŋ gaŋ banaŋ zaa pɔgeba naŋ dɔge a teŋɛzu.'
      sbs: 0.7074
      gen_sec: 6.41
      ref_sec: 6.58
    '237':
      text: Bonso, dɔgroŋ la so ka dabeɛ̃ bebe, kyɛ neɛ na zaa naŋ zoro dabeɛ̃ ba taa nɔmmo naŋ e soŋ.
      sbs: 0.7338
      gen_sec: 6.4
      ref_sec: 7.54
    '238':
      text: Azuiŋ a ferɛɛ la ka te maaleŋ kyɛlle velaa bon te naŋ da woŋ, ka te ta wa sare yi a poɔ.
      sbs: 0.6929
      gen_sec: 6.32
      ref_sec: 7.8
    '239':
      text: ” Ka O yeli sɔge ba, “Nembuo la N ma ane N yɔɔmine?
      sbs: 0.6451
      gen_sec: 3.64
      ref_sec: 7.36
    '240':
      text: A yɛlɛ ama da eɛɛ la ka a e yelwulaa ko te, ka ka te na ta boɔrɔ yelfaare aŋa ba naŋ da e
        lɛ.
      sbs: 0.7116
      gen_sec: 6.56
      ref_sec: 6.92
    '241':
      text: Kyɛ ka o naŋ wa poɔ̃, o maŋ buli la a eŋ bie yaga.
      sbs: 0.7209
      gen_sec: 3.48
      ref_sec: 3.5
    '242':
      text: A ŋaa la vɛŋ ka te ba zoro dabeɛ̃ a Naaŋmen niŋeŋ a yi a Kirista zuiŋ.
      sbs: 0.7031
      gen_sec: 5.02
      ref_sec: 4.86
    '243':
      text: Kyɛ Pɔɔl da ba boɔrɔ ka o taa neɛ naŋ da zo kyɛ bare ba Pamfiliya poɔ, a ba tu ba a toŋ a
        toma.
      sbs: 0.6892
      gen_sec: 6.72
      ref_sec: 7.42
    '244':
      text: Kyɛ ŋmenaa naŋ da wa do, a bombulo da zoɔlɛɛ la, a ko, a naŋ da ba taa nyaga zuiŋ.
      sbs: 0.6933
      gen_sec: 5.84
      ref_sec: 6.62
    '245':
      text: A weɛ soba da naŋ taa la neŋyenaa kaŋ, a o poyɛŋ bie.
      sbs: 0.7069
      gen_sec: 3.88
      ref_sec: 3.66
    '246':
      text: N naŋ da wa nyɛ o, N noɔre da maaɛ la yaga.
      sbs: 0.7253
      gen_sec: 3.08
      ref_sec: 3.1
    '247':
      text: Dabeɛ̃ ne nɔmaa da kpɛ ba la ne a yeli ŋa naŋ da e a gbɛre ŋa zie.
      sbs: 0.6664
      gen_sec: 4.51
      ref_sec: 6.38
    '250':
      text: A Fɛstu pãã da tere la noɔre, ka ba taa a Pɔɔl wa ne.
      sbs: 0.7088
      gen_sec: 3.8
      ref_sec: 3.48
    '252':
      text: Pampana ŋa, vi ba erɛ ma, ka maa gba erɛ pɔloo yaga ne a kpeɛ̃õ a Daana naŋ tere ka N de maale
        ne yɛ.
      sbs: 0.7088
      gen_sec: 7.12
      ref_sec: 6.86
    '253':
      text: ” Ka Yeezu da yeli ko o, “Yelmeŋɛ ka N yele korɔ yɛ.
      sbs: 0.6576
      gen_sec: 3.72
      ref_sec: 9.28
    '256':
      text: Yɛ vɛŋ ka neɛzaa maŋ sigre o meŋɛ korɔ a teŋɛzu wederebɛ; bonso, wederɛ zaa ba kyebe ka Naaŋmen
        zie naane ka o yi.
      sbs: 0.7152
      gen_sec: 8.4
      ref_sec: 8.34
    '257':
      text: Yelmeŋɛ zaa la ka N yele korɔ yɛ, ka kabiri ba le teŋɛ a poɔ̃, o maŋ e la kabi-yeni.
      sbs: 0.7127
      gen_sec: 5.92
      ref_sec: 5.78
    '260':
      text: Ka maa pãã la bee ka bana la, a yeli ŋa la ka te moɔle ka yɛ da sage de.
      sbs: 0.7116
      gen_sec: 4.88
      ref_sec: 5.08
    '262':
      text: O eŋɛ da kɔɔ guree la, ka o da kontoɔ̃ dɔle o meŋɛ.
      sbs: 0.6894
      gen_sec: 3.64
      ref_sec: 3.74
    '263':
      text: Bonso, a ba seŋ ka o voorɔ.
      sbs: 0.6588
      gen_sec: 2.12
      ref_sec: 8.1
    '264':
      text: 'Bonso, o yeli la o poɔŋ: ‘N dire la naaloŋ aŋa pɔgenaa; N ba waa pɔgekoɔre.'
      sbs: 0.6223
      gen_sec: 5.48
      ref_sec: 7.4
    '265':
      text: Kyɛ a Yeezu da ba yeli ko o ka o koŋ kpi.
      sbs: 0.6456
      gen_sec: 2.96
      ref_sec: 8.18
    '269':
      text: Neɛ kaŋ da soore O la, “Daana, noba belaa la na nyɛ faabo be?
      sbs: 0.6972
      gen_sec: 4.44
      ref_sec: 5.22
    '270':
      text: A apostoliimine ane a nembɛrɛ da laŋ la taa ka ba kaa a yeli ŋa nyɛ.
      sbs: 0.6968
      gen_sec: 5.04
      ref_sec: 5.22
    '271':
      text: bonso, fo yɔɔ la a fo tontonema, a Ŋmen-yelmanneba.
      sbs: 0.6591
      gen_sec: 3.92
      ref_sec: 3.84
    '272':
      text: Yɛ ta de faaloŋ yɔɔ ne neɛzaa naŋ e yɛ faaloŋ; kyɛ yɛ maŋ moɔrɔ ka yɛ erɛ yɛlɛ naŋ soma noba
        zaa zie.
      sbs: 0.7053
      gen_sec: 7.32
      ref_sec: 7.24
    '273':
      text: O ba kye kyɛ, ba eɛɛ la ka O leɛ-iri yi a kuuni poɔ.
      sbs: 0.6784
      gen_sec: 3.68
      ref_sec: 4.26
    '274':
      text: Bonso, ba sɛge la a Moozul begɛ poɔ, “Ta leŋ a naadɛre naŋ ŋmeɛrɛ kyi noɔre.
      sbs: 0.6997
      gen_sec: 5.55
      ref_sec: 6.58
    '276':
      text: N maŋ leŋ la noɔre gbɛre boyi daa gbuli zaa poɔ.
      sbs: 0.7245
      gen_sec: 3.64
      ref_sec: 3.1
    '277':
      text: ” A noba naŋ da bebe da ta ŋa turi anuu.
      sbs: 0.6712
      gen_sec: 2.82
      ref_sec: 3.76
    '278':
      text: 'Ba maŋ vɔge la a ba nazupile biŋ a nakogi niŋesogɔ, kyɛ yiele: “Te Daana Naaŋmen, fo seŋ
        ne la.'
      sbs: 0.6731
      gen_sec: 6.94
      ref_sec: 7.9
    '279':
      text: 'Kyɛ a danseɛ la ŋa: Naaŋmen ko te la nyɔvore naŋ ba taa baaraa, ka a nyɔvore ŋa be a O Bie
        poɔ.'
      sbs: 0.7264
      gen_sec: 6.8
      ref_sec: 6.84
    '281':
      text: A pɔge da su la kpareze-velaa, ka o lenni ne salema ane lɛɛbie ane kusi-veɛle.
      sbs: 0.7174
      gen_sec: 5.84
      ref_sec: 6.68
    '282':
      text: A zenɛ ŋa, ba dɔge la a yɛ Faara a Davil teŋkpoŋ poɔ, Ona la a Mɛzaaya, a Daana.
      sbs: 0.6589
      gen_sec: 5.64
      ref_sec: 6.9
    '284':
      text: Azuiŋ ba da ŋmaa la kpaakpaa vaare, a yi ka ba te tuori O.
      sbs: 0.6482
      gen_sec: 4.24
      ref_sec: 4.78
    '286':
      text: Amine meŋ da le la tɛnnoɔ poɔ, a buli, a maale eŋ bie kɔɔ.
      sbs: 0.7284
      gen_sec: 4.2
      ref_sec: 4.96
    '287':
      text: Ba da ba puori a wɛdoŋɔ bee a o teebo, a da ba de a o ŋmaaroŋ a ba gberi bee ba nuuri eŋɛ.
      sbs: 0.7079
      gen_sec: 6.36
      ref_sec: 7.26
    '288':
      text: Ba maŋ erɛ la a lɛ a na de bon naŋ maŋ wɛ, kyɛ tenee deni ba weɛrɛ.
      sbs: 0.72
      gen_sec: 4.76
      ref_sec: 4.84
    '289':
      text: Ka fõõ wa to fo yɔɔ bee fo yɔɔpuulee, a seŋ ka ba zeŋ ne fo nembɛrɛ niŋesogɔ.
      sbs: 0.7358
      gen_sec: 5.64
      ref_sec: 6.08
    '290':
      text: Naboma Naŋ Be Yagraa Dogre Poɔ.
      sbs: 0.6563
      gen_sec: 2.48
      ref_sec: 4.54
    '292':
      text: Lɛ la ka o toŋ ka ba te ko bibiiri na zaa naŋ ta yuomo ayi kyɛ sigre, a Bɛtelɛhɛm ane o tembilii
        poore.
      sbs: 0.6852
      gen_sec: 7.43
      ref_sec: 8.1
    '293':
      text: A o soba ta boɔrɔ ka o sɔglɔ a dɛgre iruu ŋmaaroŋ.
      sbs: 0.7221
      gen_sec: 3.72
      ref_sec: 3.92
    '294':
      text: Lɛ la ka Yeezu da toŋ Piita ane Gyɔɔn, a yele, “Yɛ gaa te nare a Ista tigri bondiraa ka te
        di.
      sbs: 0.6957
      gen_sec: 6.73
      ref_sec: 7.38
    '295':
      text: ” Ba naŋ da wa gbole kaa, ba ba la nyɛ neɛzaa ka a Yeezu yoŋ naane.
      sbs: 0.7205
      gen_sec: 4.8
      ref_sec: 4.52
    '298':
      text: O naŋ da wa de a suobu baare, o da be la a Filipi zie tegitegilɛ.
      sbs: 0.7047
      gen_sec: 4.72
      ref_sec: 4.48
    '299':
      text: Fo ba ŋmaa a zirii ŋa ko te kyɛ Naaŋmen la ka fo ŋmaa tere.
      sbs: 0.7147
      gen_sec: 3.97
      ref_sec: 3.62
  score: 0.697
  partial: true
- model: ghananlpcommunity/ghana-tts-36k-ref
  sbs: 0.7006
  num_scored: 200
  uses_reference: true
  entries:
    '0':
      text: Ka maa bare ba ne a kɔŋ ka ba kulo, ba na yĩĩe la a sobiriŋ, bonso, ba mine yi la tentɔbɔ
        a wa.
      sbs: 0.6719
      gen_sec: 6.8
      ref_sec: 7.66
    '2':
      text: A Yeezu naŋ da gɛrɛ Gyɛruzɛlɛm, O da kpɛ la a teŋkponni ane a tembilii poore a kanna a noba
        gɛrɛ.
      sbs: 0.696
      gen_sec: 7.2
      ref_sec: 7.54
    '3':
      text: A Naaŋmen Bagmaale Wederebɛ Nembɛrɛ Zusoba Naŋ Soore Yeezu Soorebie.
      sbs: 0.6198
      gen_sec: 5.2
      ref_sec: 8.22
    '5':
      text: Azuiŋ, yɛ ta daŋ di sɛrɛɛ kyɛ ka a saŋ ba ta; kyɛ ka a Daana waabo naŋ ba ta sɛre.
      sbs: 0.7119
      gen_sec: 6.64
      ref_sec: 5.84
    '6':
      text: O naŋ da wa pɔge te a Azɔ poɔ, o da kpɛ la a gbori ka te gaa Mitelen.
      sbs: 0.6633
      gen_sec: 5.84
      ref_sec: 6.46
    '7':
      text: Ba da lɔɔ o la bare ka o sigi wa a teŋɛzu, a lɔɔ a o malekere meŋ poɔ o eŋɛ.
      sbs: 0.7247
      gen_sec: 6.48
      ref_sec: 6.06
    '8':
      text: Ka a toŋkpeɛne ama naŋ toŋ fo poɔ, da toŋ Sodom teŋɛ poɔ, o da na kyɛnɛ bebe la wa ta zenɛ.
      sbs: 0.7396
      gen_sec: 6.8
      ref_sec: 7.3
    '10':
      text: A banaŋ naŋ da zo yaare da yi yoɔrɔ la, a moɔlɔ a yelbiri.
      sbs: 0.6971
      gen_sec: 4.24
      ref_sec: 5.66
    '11':
      text: N poyɛŋ noba, nɔpaalaa naane ka N sɛgrɛ korɔ yɛ, kyɛ a nɔkoraa na yɛ naŋ da taa yi a piiluu
        saŋ la.
      sbs: 0.7184
      gen_sec: 7.12
      ref_sec: 8.0
    '12':
      text: ” Ka Yeezu da yeli, “Yɛ e ka a noba zeŋ teŋɛ.
      sbs: 0.6815
      gen_sec: 3.52
      ref_sec: 14.68
    '13':
      text: Wola pãã ka a weɛ soba na e a wɛkaareba ŋa?
      sbs: 0.7293
      gen_sec: 3.36
      ref_sec: 3.42
    '15':
      text: Ona la boɔrɔ ka neɛzaa nyɛ faabo a kyɛ wa baŋ a yelmeŋɛ.
      sbs: 0.7189
      gen_sec: 3.92
      ref_sec: 3.56
    '19':
      text: Pɔɔl Naŋ Puori A Filipae Deme Yaane.
      sbs: 0.6944
      gen_sec: 2.96
      ref_sec: 5.12
    '20':
      text: Bonso, ba da ba sage de a banaŋ zaa naŋ da wa yeli a O kuuni poɔ leɛ-iruu yɛlɛ ko ba.
      sbs: 0.7301
      gen_sec: 6.4
      ref_sec: 5.86
    '21':
      text: ” Ba da do la a sazu a zunzugri poɔ ka a ba dɔndɔnne da kaara ba.
      sbs: 0.6413
      gen_sec: 6.96
      ref_sec: 4.64
    '25':
      text: Kyɛ a ŋaa la ka yɛ mine da waa, kyɛ ka ba da pɛge yɛ.
      sbs: 0.7106
      gen_sec: 4.0
      ref_sec: 3.38
    '27':
      text: Ka fõõ meŋɛ soore o, fo na nyɛ la ka a yɛlɛ zaa te naŋ yeli kyaare ne o waa la a lɛ.
      sbs: 0.8127
      gen_sec: 5.44
      ref_sec: 5.82
    '28':
      text: “Daana, a piiluu saŋ, fõõ la iri a teŋɛ.
      sbs: 0.6672
      gen_sec: 3.92
      ref_sec: 3.28
    '29':
      text: Bebie ata puoriŋ, a Pɔɔl da boɔle la a Gyuumine nembɛrɛ naŋ da be a be lantaa.
      sbs: 0.6771
      gen_sec: 6.0
      ref_sec: 5.56
    '30':
      text: A Maleke Na Naŋ Taa A Ganlee Yɛlɛ.
      sbs: 0.634
      gen_sec: 2.4
      ref_sec: 3.8
    '31':
      text: Nɔmmo maŋ taa la teɛretɔroo ne yelzaa kyɛ maŋ di kannyiri ne yelzaa.
      sbs: 0.7159
      gen_sec: 5.36
      ref_sec: 3.94
    '32':
      text: N naŋ da wa nyɛ O, N da le vɔgle la muro O gbɛɛ puliŋ a waa ŋa neɛ naŋ kpi.
      sbs: 0.7354
      gen_sec: 5.36
      ref_sec: 5.86
    '36':
      text: Lɛ la ka o da boɔle o a soore o, ‘Boŋ la ka N wono kyaare ne fo ya?
      sbs: 0.6674
      gen_sec: 5.12
      ref_sec: 4.14
    '37':
      text: Yɛ kaa a Izerayɛl biiri nyɛ; a banaŋ naŋ maŋ di a Naaŋmen bagmaale boma, ba ba maŋ waa a Naaŋmen
        bagmaalkuuri laŋne deme be?
      sbs: 0.7224
      gen_sec: 8.24
      ref_sec: 7.62
    '38':
      text: Kyɛ N na ko la a N dansediribe bayi naŋ su boɔre kparre kpeɛ̃õ ka ba yeli Ŋmen-yelmanna yelyelii
        bebie turi dɔgle kɔɔraayi ne lezaata.
      sbs: 0.6573
      gen_sec: 9.92
      ref_sec: 12.4
    '39':
      text: Te sɛgrɛ la a yɛlɛ ama ka ka a te kyelloo na paale.
      sbs: 0.7186
      gen_sec: 3.92
      ref_sec: 3.98
    '40':
      text: ka ba da de O do ne sazu ne puubu.
      sbs: 0.6798
      gen_sec: 2.72
      ref_sec: 4.84
    '44':
      text: 'Azuiŋ la ka ba yeli: “Gɔŋgbire, iri!'
      sbs: 0.6975
      gen_sec: 3.2
      ref_sec: 3.24
    '46':
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.6702
      gen_sec: 5.84
      ref_sec: 5.94
    '47':
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.6612
      gen_sec: 7.04
      ref_sec: 14.94
    '48':
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.6647
      gen_sec: 7.44
      ref_sec: 6.46
    '51':
      text: Yeezu Naŋ Koŋ A Gyɛruzɛlɛm Teŋɛ Yɛlɛ.
      sbs: 0.6623
      gen_sec: 2.88
      ref_sec: 10.58
    '52':
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.6581
      gen_sec: 2.32
      ref_sec: 5.8
    '53':
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.7001
      gen_sec: 6.16
      ref_sec: 6.64
    '54':
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.713
      gen_sec: 4.24
      ref_sec: 4.32
    '56':
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.7228
      gen_sec: 6.48
      ref_sec: 7.02
    '57':
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.7305
      gen_sec: 5.28
      ref_sec: 5.42
    '58':
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.6978
      gen_sec: 6.64
      ref_sec: 7.12
    '61':
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.63
      gen_sec: 6.88
      ref_sec: 5.42
    '62':
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.7027
      gen_sec: 3.84
      ref_sec: 3.44
    '63':
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.6968
      gen_sec: 5.28
      ref_sec: 4.66
    '64':
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.7254
      gen_sec: 5.12
      ref_sec: 4.9
    '65':
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
      sbs: 0.7217
      gen_sec: 6.0
      ref_sec: 7.08
    '66':
      text: 'Lɛ la ka N da woŋ kɔkɔre kaŋ a saluoni poɔ ka o yele: “N noba, yɛ wa yi o poɔ.'
      sbs: 0.7013
      gen_sec: 6.24
      ref_sec: 6.26
    '67':
      text: O da iri arɛɛ la ka O sɔre, ka ba de a Ŋmen-yelmanna Azaaya gansɛgraa ko O.
      sbs: 0.6332
      gen_sec: 5.36
      ref_sec: 13.28
    '69':
      text: Neɛzaa ba nyɛ fo saanaa ka fo seŋ ne la kũũ be?
      sbs: 0.7269
      gen_sec: 3.84
      ref_sec: 3.28
    '70':
      text: A ŋaa la tori kyɛ pɛllɛ Naaŋmen a te Faara poɔ.
      sbs: 0.7013
      gen_sec: 3.44
      ref_sec: 3.26
    '71':
      text: Te da kpɛ la a gbori a be ka Arestaku naŋ da waa Masedoniya neɛ kyɛ da yi Tɛsalonika da beɛle
        te.
      sbs: 0.6834
      gen_sec: 7.28
      ref_sec: 7.84
    '72':
      text: Pampana, nembuo mɔɔ la na e yɛ yelfaa, ka yɛneŋ wa kyerɛ ka yɛ e yɛlɛ naŋ e velaa?
      sbs: 0.7259
      gen_sec: 7.12
      ref_sec: 6.04
    '73':
      text: A soba na naŋ da faa te yi ne a dɔgɛɛ naŋ tɔgle kũũ, naŋ na kyɛnɛ faa te la.
      sbs: 0.7117
      gen_sec: 5.36
      ref_sec: 5.32
    '74':
      text: 'Ba sɛge la a begɛ gane poɔ: “Noba naŋ yele kɔkɔsaama.'
      sbs: 0.6826
      gen_sec: 4.16
      ref_sec: 5.08
    '75':
      text: Biiri na kyiiri la ba dɔgreba a vɛŋ ka ba ko ba.
      sbs: 0.7445
      gen_sec: 3.68
      ref_sec: 3.32
    '76':
      text: Yɛ erɛ yɛlɛ ne yɛŋ a kyaara noba na naŋ ba poɔ yɛ poɔ, kyɛ maŋ vɛŋ ka wagre zaa yire tɔnɔ.
      sbs: 0.6967
      gen_sec: 6.64
      ref_sec: 6.24
    '77':
      text: A ŋaa zie la ka te baŋ ka a baaraa saŋ taɛ la.
      sbs: 0.7297
      gen_sec: 3.52
      ref_sec: 3.6
    '79':
      text: Kyɛ ba da de la soba na zaa yuori ba naŋ ba sɛge eŋ a nyɔvore gane poɔ lɔɔ eŋ a baa vũũ poɔ.
      sbs: 0.7174
      gen_sec: 6.4
      ref_sec: 9.34
    '80':
      text: A dɛndɛŋ soba da yi waɛ la, a wa yeli, ‘Daana, a fo warbiri yi la warbie pie tɔnɔ dɔgle o
        zu.
      sbs: 0.7325
      gen_sec: 6.72
      ref_sec: 7.52
    '81':
      text: 'A yelwulaa yɛ naŋ na nyɛ la ŋa: yɛ na nyɛ la bie ba naŋ pilli ne bipɛmɛ a gaale O donne bondi
        gbori poɔ.'
      sbs: 0.6488
      gen_sec: 7.6
      ref_sec: 8.0
    '82':
      text: Nemmeŋɛ maŋ iri la bonsonne yi o nabonsonne poɔ, ka nenfaa meŋ maŋ iri bonfaare yi o nabonfaare
        poɔ.
      sbs: 0.5898
      gen_sec: 7.44
      ref_sec: 4.78
    '86':
      text: Bonso, neɛzaa koŋ la baŋ biŋ yiri pare zaa ka a onaŋ ba naŋ biŋ naane; a yiri pare ŋa la a
        Yeezu Kirista.
      sbs: 0.7146
      gen_sec: 8.16
      ref_sec: 8.06
    '87':
      text: A O eŋɛ la ka a yiri lamboe zaa mɛ lantaa a baa te leɛ Naaŋmen die naŋ e soŋ a be a Daana
        eŋɛ.
      sbs: 0.7014
      gen_sec: 6.72
      ref_sec: 6.34
    '88':
      text: ” Ka O yeli ko ba, “N nyɛ la Setaana ka o yi sazu a le teŋɛ a ŋa saa naŋ nyegre.
      sbs: 0.7405
      gen_sec: 6.24
      ref_sec: 5.76
    '89':
      text: Kyɛ deɛ yeli a yelbiri yoŋ, a vɛŋ ka N gbaŋgbaa nyɛ o sammo.
      sbs: 0.689
      gen_sec: 5.12
      ref_sec: 4.36
    '90':
      text: ” O da kaara ba la polipoli a teɛre ka ba na ko o la bonkaŋ.
      sbs: 0.6634
      gen_sec: 5.04
      ref_sec: 3.88
    '93':
      text: Ka maa puori Naaŋmen ameseɛrɛ kyɛ di a bondirii, bonso ka ba na saana n yuori ne bondirii
        N naŋ puori Naaŋmen ameseɛrɛ kyɛ di?
      sbs: 0.7108
      gen_sec: 8.8
      ref_sec: 7.7
    '94':
      text: Saa nyegroo ane hooroo ane saa tannoo da yire la a nakogi zie, kyɛ ka fentele ayopoĩ da dire
        a nakogi niŋesogɔ.
      sbs: 0.6346
      gen_sec: 8.72
      ref_sec: 10.42
    '95':
      text: N da guoli yɛ la ane beroŋ, a da ba e bondi-tage, bonso, yɛ da naŋ ba ta bondi-tage diibu.
      sbs: 0.6881
      gen_sec: 7.12
      ref_sec: 7.16
    '96':
      text: Yuoni zaa poɔ a Yeezu dɔgrebɔ da maŋ gaa la Gyɛruzɛlɛm a te di a Ista tigri.
      sbs: 0.7042
      gen_sec: 5.76
      ref_sec: 5.88
    '97':
      text: Ka a naŋ wa seŋ ka N meŋ gaa, ba na beɛle ma la ka te gaa.
      sbs: 0.7063
      gen_sec: 4.64
      ref_sec: 3.68
    '99':
      text: Ba da teɛre ka O be la a noba poɔ ka ba zaa kyɛnɛ a sori poɔ.
      sbs: 0.678
      gen_sec: 5.12
      ref_sec: 4.2
    '101':
      text: Neɛzaa kontoɔ̃ pigi ma sori ka N ta ire n meŋɛ yuori!
      sbs: 0.6903
      gen_sec: 4.32
      ref_sec: 3.5
    '103':
      text: Te baŋ ka te yi la kũũ poɔ a kpɛ nyɔvore poɔ, te naŋ nɔŋ taa zuiŋ.
      sbs: 0.7287
      gen_sec: 4.72
      ref_sec: 4.58
    '104':
      text: N baŋ ka a N gaabo puoriŋ, noba mine naŋ waa ŋa gboŋgbo-faare na wa kpɛ la yɛ poɔ, a koŋ bare
        a peere.
      sbs: 0.7128
      gen_sec: 7.84
      ref_sec: 7.04
    '106':
      text: O da ba di bonzaa a bebie na zaa poɔ, kyɛ O naŋ da wa te baare, kɔŋ da kpɛ O la yaga.
      sbs: 0.6686
      gen_sec: 6.64
      ref_sec: 6.58
    '109':
      text: Ba na de a la lɔɔ bare.
      sbs: 0.6747
      gen_sec: 1.84
      ref_sec: 11.98
    '112':
      text: ” Ka O yeli, “Yɛ gu yɛmenne velaa ka ba ta wa bɛlle yɛ.
      sbs: 0.7487
      gen_sec: 3.84
      ref_sec: 3.4
    '113':
      text: Kyɛ a Yeezu naŋ da bale a O kyɛmmo poɔ la so ka O da wa zeŋ a bulee noɔreŋ.
      sbs: 0.7305
      gen_sec: 5.68
      ref_sec: 5.98
    '114':
      text: Ba suuri da iree la yaga ane ba naŋ da kanna a noba kyɛ moɔlɔ ka a Yeezu zie la ka kuuni leɛ-iruu
        be.
      sbs: 0.6986
      gen_sec: 6.8
      ref_sec: 7.64
    '115':
      text: Piita Ane Gyɔɔn Naŋ Are A Sɛrediribe Niŋesogɔ.
      sbs: 0.6094
      gen_sec: 4.0
      ref_sec: 3.4
    '116':
      text: Bonso, te waa la Naaŋmen tontonema naŋ laŋ tonɔ, yɛnee la a Naaŋmen weɛ, a Naaŋmen yiri.
      sbs: 0.7138
      gen_sec: 6.4
      ref_sec: 7.14
    '121':
      text: Pɔlbile kaŋ yuori naŋ da di Yutaaku da zeŋ la a takoro noɔreŋ a gbire kyuuro, a Pɔɔl naŋ da
        yele yɛlɛ.
      sbs: 0.6775
      gen_sec: 6.4
      ref_sec: 7.18
    '124':
      text: ” Ka O yeli ko o, “Bonso ka fo soorɔ ma bon naŋ e soŋ yɛlɛ?
      sbs: 0.7297
      gen_sec: 4.48
      ref_sec: 4.1
    '125':
      text: A ŋaa zie la ka te maŋ baŋ a yelmeŋɛ vooroŋ ane a tuluu vooroŋ.
      sbs: 0.7519
      gen_sec: 4.16
      ref_sec: 5.28
    '126':
      text: N zoro la dabeɛ̃ ka a toma N naŋ toŋ ko yɛ na pɔɔ wa e la weɛlɛ.
      sbs: 0.7174
      gen_sec: 4.72
      ref_sec: 3.96
    '127':
      text: Kyɛ a Vooroŋ Soŋ la a dansedire, bonso a Vooroŋ Soŋ la a yelmeŋɛ.
      sbs: 0.7295
      gen_sec: 5.04
      ref_sec: 6.28
    '128':
      text: bonso, yɛ baŋ la a soba na naŋ bebe a yi a piiluu saŋ.
      sbs: 0.7324
      gen_sec: 5.12
      ref_sec: 4.44
    '130':
      text: ” Ka a noba da yeli sɔge, “Fo taa la sefaa!
      sbs: 0.6415
      gen_sec: 3.52
      ref_sec: 3.94
    '131':
      text: ” Kyɛ a Yeezu da taŋ la O noɔre a ba yeli yelzaa sɔge.
      sbs: 0.6631
      gen_sec: 4.0
      ref_sec: 7.12
    '133':
      text: Bonso, N dire la o danseɛ ka o toŋ la toma yaga ko yɛ ane banaŋ naŋ be Laodisiya teŋɛ ane
        Hɛrapoli teŋɛ poɔ.
      sbs: 0.6923
      gen_sec: 9.04
      ref_sec: 9.18
    '134':
      text: ” A lɛ la ka ba da yi moɔle ka neɛzaa leɛ o eebo a yi o yelbebe poɔ.
      sbs: 0.7322
      gen_sec: 5.36
      ref_sec: 4.52
    '135':
      text: ” Ba da yeli la a ŋaa ka ba e O nyɛ, a pãã na toɔ̃ nyɛ saanaa tuo O.
      sbs: 0.6911
      gen_sec: 5.12
      ref_sec: 5.6
    '137':
      text: Soba na zaa naŋ yeli, “N baŋ O la,” kyɛ ba sagra a O nɔɛ, waa la zirŋmaara, ka a yelmeŋɛ ba
        kye o zie.
      sbs: 0.7129
      gen_sec: 7.6
      ref_sec: 8.44
    '138':
      text: “Pampana ŋa N teɛroŋ zaa gyɛrɛɛ la.
      sbs: 0.7418
      gen_sec: 2.72
      ref_sec: 3.38
    '140':
      text: A Daana la na wa e ka yɛlɛ naŋ sɔgle lige poɔ sãã veɛloŋ ka bon naŋ be sukyiri poɔ meŋ sãã.
      sbs: 0.7082
      gen_sec: 6.96
      ref_sec: 7.44
    '141':
      text: A Yeezu da yi la a be a wa O meŋɛ teŋɛ poɔ, ka a O potuuribo da tu O wa.
      sbs: 0.7232
      gen_sec: 5.52
      ref_sec: 4.6
    '142':
      text: N na iri la a gaa a N saa zie a te yeli ko o, “N saa, N eɛɛ yelbieri a kyaare Naaŋmen ane
        fõõ.
      sbs: 0.7158
      gen_sec: 7.68
      ref_sec: 8.56
    '143':
      text: Ba da ko o la sori meŋ ka o zɔɔ ne a nensonne a toɔ̃ ba.
      sbs: 0.6833
      gen_sec: 4.16
      ref_sec: 3.52
    '144':
      text: 'Azuiŋ, yɛ ko a teŋɛzu yɛlɛ zaa naŋ be yɛ enneŋ: peɛ̃mo toma, yeldɛgɛ, vɔlfaare, yelfaare
        boɔbo ane bombɔ-gaŋne .'
      sbs: 0.7172
      gen_sec: 13.12
      ref_sec: 10.3
    '149':
      text: A banaŋ naŋ puoro a wɛdoŋɔ ane a o teebo ane neɛzaa naŋ de a o yuori ŋmaaroŋ daŋ koŋ nyɛ pɛnnoo
        ŋmenaa bee tensogɔ.
      sbs: 0.6714
      gen_sec: 8.16
      ref_sec: 10.84
    '150':
      text: Maata la da kaara a bondirii yɛlɛ, ka Laazoro da e a neɛ na kaŋ naŋ da laŋ zeŋ a diibu zie
        ne a Yeezu.
      sbs: 0.6898
      gen_sec: 8.08
      ref_sec: 7.98
    '151':
      text: fo naŋ nare biŋ a andonɛɛ zaa niŋesogɔ.
      sbs: 0.6828
      gen_sec: 3.6
      ref_sec: 3.0
    '153':
      text: N erɛ la ama zaa a Ŋmen-yelnoore zuiŋ, ka ka N na toɔ̃ nyɛ a yelnoore maaloo.
      sbs: 0.7043
      gen_sec: 6.72
      ref_sec: 4.82
    '154':
      text: O da laŋ kpeɛrɛ ne la a wɛdonne; ka a malekere da kaara O zie.
      sbs: 0.6985
      gen_sec: 4.56
      ref_sec: 4.12
    '156':
      text: A Yeezu da zɛge la O zu a nyɛ bondaanema naŋ eŋnɛ ba kyɔɔtaare a kyɔɔtaare daga poɔ.
      sbs: 0.6938
      gen_sec: 6.56
      ref_sec: 6.0
    '157':
      text: Yɛ nyɛ, N tonɔ yɛ la aŋa pebilii ka yɛ yi te kpɛ gboŋgboe poɔ.
      sbs: 0.7472
      gen_sec: 5.36
      ref_sec: 4.98
    '158':
      text: Yɛ ta erɛ ka a Naaŋmen Vooroŋ Soŋ poɔ saana, Ona la a ŋmaaroŋ Naaŋmen naŋ eŋ yɛ a kyɛllɛ ne
        a faabo bebiri.
      sbs: 0.6995
      gen_sec: 7.84
      ref_sec: 6.72
    '159':
      text: N sɔre la a fo potuuribo ka ba digi a sefaa ka o yi, kyɛ ka ba digi fãã.
      sbs: 0.6458
      gen_sec: 5.52
      ref_sec: 6.1
    '160':
      text: Bonso, a Laazoro kuuni poɔ leɛ-iruu yɛlɛ la so ka a Gyuumine yaga da sagra derɛ a Yeezu yɛlɛ
        kyɛ zagra a ba yɛlɛ.
      sbs: 0.6992
      gen_sec: 8.48
      ref_sec: 8.62
    '165':
      text: Leɛ-teɛre nyɛ bonna naŋ da e ka fo le; leɛ fo eebo a kyɛ tonɔ a toma na fo naŋ da tonɔ a dɛndɛŋ
        saŋ.
      sbs: 0.6777
      gen_sec: 7.52
      ref_sec: 7.78
    '170':
      text: ka turi pie ne turi ayi da yi a Bɛŋgyamen bale poɔ ka ba da eŋ a ŋmaaroŋ.
      sbs: 0.6974
      gen_sec: 5.84
      ref_sec: 6.14
    '173':
      text: A ba seŋ ka o e Kiristabi-paalaa, ka lɛ naane, o na baŋ paale ne la pɔloo a le a sebɛlbɛllɛ
        dɔgroŋ poɔ.
      sbs: 0.6991
      gen_sec: 7.52
      ref_sec: 7.02
    '174':
      text: Ka Yeezu da soore a bege baŋnema ane a Faraziimine, “Sori bebe la ka ba saŋ baala a pɛnnoo
        bebiri daare bee sori kyebe.
      sbs: 0.7064
      gen_sec: 8.4
      ref_sec: 9.08
    '175':
      text: Ona la vɛŋ ka te baŋ lɛ yɛ naŋ taa nɔmmo a Vooroŋ Soŋ poɔ.
      sbs: 0.6791
      gen_sec: 4.64
      ref_sec: 3.9
    '176':
      text: Yɛ naŋ sage tu a yelmeŋɛ pampana, yɛ pɛge la a yɛ seere ka ka yɛ na taa nɔmmo naŋ sereŋ e
        meŋɛ.
      sbs: 0.7145
      gen_sec: 6.64
      ref_sec: 8.06
    '177':
      text: Kyɛ a Soŋ Soba da sɔ yɛ la kããsoŋ, ka yɛ zaa taa yelbammo.
      sbs: 0.7243
      gen_sec: 4.56
      ref_sec: 4.56
    '178':
      text: ka turi pie ne turi ayi da yi a Manaasɛ bale poɔ.
      sbs: 0.7159
      gen_sec: 3.6
      ref_sec: 4.14
    '179':
      text: Yiri na zaa poɔ yɛ naŋ wa kpɛ, yɛ daŋ yeli, ‘Ka maaroŋ be a yiri ŋa poɔ!
      sbs: 0.722
      gen_sec: 5.36
      ref_sec: 5.22
    '181':
      text: Bee boŋ la ka Kiristabie ne neɛ naŋ ba sage de a Kirista yɛlɛ laŋ?
      sbs: 0.6686
      gen_sec: 5.44
      ref_sec: 3.58
    '182':
      text: Yɛ ta wa poɔrɔ sazu, bonso, o e la Naaŋmen nakogi, bee a poɔrɔ a teŋɛ, bonso, o meŋ waa la
        a Naaŋmen gbɛɛ-bimmu zie.
      sbs: 0.7375
      gen_sec: 10.08
      ref_sec: 11.22
    '184':
      text: Te da taa la yɛ vɔlaa kyɛ da nɔnɔ yaga ka te wa ka te nyɛ taa nimisogre.
      sbs: 0.7047
      gen_sec: 5.36
      ref_sec: 4.98
    '187':
      text: A gaŋ a zaa, yɛ de nɔmmo su pɔge yɛmenne, ona la maŋ leŋ boma zaa lantaa velaa zaa.
      sbs: 0.7084
      gen_sec: 6.48
      ref_sec: 5.7
    '189':
      text: Pampana ŋa, N de yɛ la ko Naaŋmen ane a Naaŋmen yelbiri garaaseɛ.
      sbs: 0.7152
      gen_sec: 4.88
      ref_sec: 4.66
    '190':
      text: Ba naŋ da ba nyɛ O, ba da leɛ gaa la a Gyɛruzɛlɛm ka ba te bɔ O.
      sbs: 0.6685
      gen_sec: 4.8
      ref_sec: 4.26
    '191':
      text: ” Kyɛ ba da ba baŋ a yɛlɛ O naŋ yeli ko ba tɛgɛ.
      sbs: 0.7043
      gen_sec: 3.52
      ref_sec: 8.26
    '192':
      text: ” A yeli ŋa da wa ne la tage taa, ka nɔkpeɛne da kpɛ a Pɔɔl ane Banabase ane a noba na sogɔŋ.
      sbs: 0.689
      gen_sec: 6.4
      ref_sec: 7.4
    '195':
      text: Azuiŋ, yɛ baŋ ne a, a ta inni ka yuomo ata tensogɔ bee ŋmenaa, ka N ba nage ka N kpãã yɛ ane
        nentaŋ.
      sbs: 0.6977
      gen_sec: 8.16
      ref_sec: 8.14
    '197':
      text: Te nyɛ la dɔgɛɛ boorɔ zaa, kyɛ naŋ voorɔ; ka te teɛroŋ gyɛre, kyɛ ka te nuuri ba yoɔrɔ.
      sbs: 0.7412
      gen_sec: 6.48
      ref_sec: 6.04
    '198':
      text: N na boɔrɔ la ka yɛ zaa yele kɔkɔsaama, kyɛ a gaŋ a zaa N na boɔrɔ la ka yɛ yele Ŋmen-yelmanna
        yelyelii.
      sbs: 0.7241
      gen_sec: 7.6
      ref_sec: 6.62
    '199':
      text: Enyaabo zaa daŋ ba pɔge yɛ naŋ daŋ ba pɔge nensaala.
      sbs: 0.7139
      gen_sec: 4.08
      ref_sec: 3.24
    '202':
      text: A banaŋ N naŋ nɔŋ la ka N maŋ wuli kyɛ tage ba tobo.
      sbs: 0.6708
      gen_sec: 3.68
      ref_sec: 3.16
    '203':
      text: A Naaŋmen da di la a Davil danseɛ a yeli, ‘N nyɛ la Davil, a Gyɛse bidɔɔ, ka o waa N yɛŋ neɛ.
      sbs: 0.7092
      gen_sec: 6.96
      ref_sec: 6.96
    '204':
      text: Lɛ la ka a bie da yeli ko a o saa, ‘N saa, N sãã la Naaŋmen poɔ, a sãã fo meŋ poɔ.
      sbs: 0.7102
      gen_sec: 6.48
      ref_sec: 6.42
    '205':
      text: A bama moɔlɔ la a Kirista yɛlɛ ne nɔmmo, a baŋ ka ba eŋ ma la a kyɛ N naŋ zɔɔrɔ a Ŋmen-yelnoore
        zɔɔre zuiŋ.
      sbs: 0.7264
      gen_sec: 7.52
      ref_sec: 7.48
    '207':
      text: Ka o da boɔle a gbaŋgbaa kaŋ a soore o bonna naŋ erɛ.
      sbs: 0.7144
      gen_sec: 4.24
      ref_sec: 3.9
    '208':
      text: Yeezu Naŋ Saŋ Neɛ Kaŋ Ba Naŋ Dɔge Ne Zɔnnoŋ.
      sbs: 0.6357
      gen_sec: 3.68
      ref_sec: 3.56
    '209':
      text: ka turi pie ne turi ayi da yi a Nafetali bale poɔ.
      sbs: 0.7177
      gen_sec: 4.0
      ref_sec: 4.0
    '211':
      text: Moozul da yelee la, ‘A Daana a yɛ Naaŋmen na iri la Ŋmen-yelmanna a yɛ meŋɛ noba poɔ ka o
        waa aŋa maa.
      sbs: 0.7419
      gen_sec: 7.44
      ref_sec: 7.9
    '212':
      text: “Yuomo lezaayi puoriŋ, maleke da wuli la o meŋɛ ko a Moozul vũũ naŋ da dire tuu kaŋ poɔ a
        Sanae taŋ wɛgyɛŋ poɔ.
      sbs: 0.7522
      gen_sec: 8.96
      ref_sec: 9.28
    '214':
      text: 'Kyɛ fo taa la garebanyɛ ne a yeli ŋa: fo kyiire la a Nikoletan deme tontonne na N meŋ naŋ
        kyiire.'
      sbs: 0.6657
      gen_sec: 6.96
      ref_sec: 6.68
    '215':
      text: Pampana, a malekere ayopoĩ na naŋ da taa a eelɛ ayopoĩ da narɛɛ la ka ba peɛle a eelɛ.
      sbs: 0.7055
      gen_sec: 6.88
      ref_sec: 7.48
    '217':
      text: ” A Yeezu naŋ da woŋ a ŋaa, O da yeli ko la a dɔɔ, “Yelyeni kaŋ la kyɛre ka fo ba taa.
      sbs: 0.6968
      gen_sec: 6.48
      ref_sec: 6.44
    '219':
      text: ’ Lɛ la ka a saa da de a o boma poŋ a o biiri na bayi.
      sbs: 0.7367
      gen_sec: 4.32
      ref_sec: 3.54
    '220':
      text: yɛ ta dare a yɛ sukyie aŋa lɛ a yɛ sããkommine naŋ da zɔɔ ne Naaŋmen.
      sbs: 0.677
      gen_sec: 5.12
      ref_sec: 5.5
    '221':
      text: Ka Yeezu yeli, “Pɔlbile, maa yeli ko fo, vaa-iri!
      sbs: 0.6802
      gen_sec: 3.68
      ref_sec: 4.68
    '224':
      text: A yelwolɔ naŋ waana zuiŋ, N teɛre ka a na soma la ka neɛzaa naŋ kyɛnɛ waa lɛ zaa o naŋ da
        waa.
      sbs: 0.7377
      gen_sec: 6.72
      ref_sec: 7.48
    '225':
      text: Maa Gyɔɔn la a soba na naŋ da woŋ kyɛ nyɛ a yɛlɛ ama.
      sbs: 0.718
      gen_sec: 3.84
      ref_sec: 10.56
    '226':
      text: Ona la e ka te taa faŋ a waa a nɔpaalaa tontonema.
      sbs: 0.7153
      gen_sec: 3.92
      ref_sec: 3.28
    '227':
      text: A yɛlɛ na eŋ naŋ kyɛre, N na wuli yɛ la ka maa wa wa yɛ zie.
      sbs: 0.7284
      gen_sec: 4.48
      ref_sec: 6.74
    '228':
      text: a zɔɔrɔ ne a Daana ane a O Mɛzaaya.
      sbs: 0.7204
      gen_sec: 3.04
      ref_sec: 3.3
    '229':
      text: Yɛ nyɛ nɔmmo na tɔ a Saa naŋ nɔŋ te, a e ka ba boɔlɔ te Naaŋmen bibiiri; ka te sereŋ waa a
        lɛ.
      sbs: 0.7163
      gen_sec: 7.12
      ref_sec: 7.2
    '230':
      text: O da gaa te de la a gane yi a soba na naŋ da zeŋ a nakogi zu nuduluŋ poɔ.
      sbs: 0.6939
      gen_sec: 5.6
      ref_sec: 4.9
    '231':
      text: Yɛ saŋna a baalba naŋ be a be, kyɛ yeli ko ba, ‘A Naaŋmen naaloŋ wa peɛle yɛ la.
      sbs: 0.735
      gen_sec: 5.76
      ref_sec: 5.5
    '233':
      text: Kyɛ tɔnɔ na zaa N naŋ da nyɛ, N de a la ka a waa zaglaa a Kirista zuiŋ.
      sbs: 0.7249
      gen_sec: 5.76
      ref_sec: 5.24
    '234':
      text: Kyɛ soba na zaa naŋ ba sage de a yelbiri na wɛ la.
      sbs: 0.7153
      gen_sec: 4.0
      ref_sec: 3.1
    '235':
      text: A ŋa la a n noɔre N naŋ wullo a puoruu laŋne yie zaa poore.
      sbs: 0.7065
      gen_sec: 4.8
      ref_sec: 3.88
    '236':
      text: 'Serɛzaa ka N yele korɔ yɛ: Gyɔɔn Bati e la kpoŋ gaŋ banaŋ zaa pɔgeba naŋ dɔge a teŋɛzu.'
      sbs: 0.7206
      gen_sec: 6.72
      ref_sec: 6.58
    '237':
      text: Bonso, dɔgroŋ la so ka dabeɛ̃ bebe, kyɛ neɛ na zaa naŋ zoro dabeɛ̃ ba taa nɔmmo naŋ e soŋ.
      sbs: 0.74
      gen_sec: 7.52
      ref_sec: 7.54
    '238':
      text: Azuiŋ a ferɛɛ la ka te maaleŋ kyɛlle velaa bon te naŋ da woŋ, ka te ta wa sare yi a poɔ.
      sbs: 0.6945
      gen_sec: 6.64
      ref_sec: 7.8
    '239':
      text: ” Ka O yeli sɔge ba, “Nembuo la N ma ane N yɔɔmine?
      sbs: 0.6721
      gen_sec: 4.88
      ref_sec: 7.36
    '240':
      text: A yɛlɛ ama da eɛɛ la ka a e yelwulaa ko te, ka ka te na ta boɔrɔ yelfaare aŋa ba naŋ da e
        lɛ.
      sbs: 0.7239
      gen_sec: 6.4
      ref_sec: 6.92
    '241':
      text: Kyɛ ka o naŋ wa poɔ̃, o maŋ buli la a eŋ bie yaga.
      sbs: 0.7293
      gen_sec: 3.92
      ref_sec: 3.5
    '242':
      text: A ŋaa la vɛŋ ka te ba zoro dabeɛ̃ a Naaŋmen niŋeŋ a yi a Kirista zuiŋ.
      sbs: 0.706
      gen_sec: 5.52
      ref_sec: 4.86
    '243':
      text: Kyɛ Pɔɔl da ba boɔrɔ ka o taa neɛ naŋ da zo kyɛ bare ba Pamfiliya poɔ, a ba tu ba a toŋ a
        toma.
      sbs: 0.6916
      gen_sec: 7.28
      ref_sec: 7.42
    '244':
      text: Kyɛ ŋmenaa naŋ da wa do, a bombulo da zoɔlɛɛ la, a ko, a naŋ da ba taa nyaga zuiŋ.
      sbs: 0.7069
      gen_sec: 6.64
      ref_sec: 6.62
    '245':
      text: A weɛ soba da naŋ taa la neŋyenaa kaŋ, a o poyɛŋ bie.
      sbs: 0.71
      gen_sec: 4.48
      ref_sec: 3.66
    '246':
      text: N naŋ da wa nyɛ o, N noɔre da maaɛ la yaga.
      sbs: 0.7274
      gen_sec: 3.36
      ref_sec: 3.1
    '247':
      text: Dabeɛ̃ ne nɔmaa da kpɛ ba la ne a yeli ŋa naŋ da e a gbɛre ŋa zie.
      sbs: 0.6828
      gen_sec: 4.96
      ref_sec: 6.38
    '250':
      text: A Fɛstu pãã da tere la noɔre, ka ba taa a Pɔɔl wa ne.
      sbs: 0.6986
      gen_sec: 3.68
      ref_sec: 3.48
    '252':
      text: Pampana ŋa, vi ba erɛ ma, ka maa gba erɛ pɔloo yaga ne a kpeɛ̃õ a Daana naŋ tere ka N de maale
        ne yɛ.
      sbs: 0.7217
      gen_sec: 7.84
      ref_sec: 6.86
    '253':
      text: ” Ka Yeezu da yeli ko o, “Yelmeŋɛ ka N yele korɔ yɛ.
      sbs: 0.6783
      gen_sec: 6.4
      ref_sec: 9.28
    '256':
      text: Yɛ vɛŋ ka neɛzaa maŋ sigre o meŋɛ korɔ a teŋɛzu wederebɛ; bonso, wederɛ zaa ba kyebe ka Naaŋmen
        zie naane ka o yi.
      sbs: 0.7217
      gen_sec: 8.72
      ref_sec: 8.34
    '257':
      text: Yelmeŋɛ zaa la ka N yele korɔ yɛ, ka kabiri ba le teŋɛ a poɔ̃, o maŋ e la kabi-yeni.
      sbs: 0.7078
      gen_sec: 6.24
      ref_sec: 5.78
    '260':
      text: Ka maa pãã la bee ka bana la, a yeli ŋa la ka te moɔle ka yɛ da sage de.
      sbs: 0.6996
      gen_sec: 5.36
      ref_sec: 5.08
    '262':
      text: O eŋɛ da kɔɔ guree la, ka o da kontoɔ̃ dɔle o meŋɛ.
      sbs: 0.6822
      gen_sec: 3.92
      ref_sec: 3.74
    '263':
      text: Bonso, a ba seŋ ka o voorɔ.
      sbs: 0.6522
      gen_sec: 2.64
      ref_sec: 8.1
    '264':
      text: 'Bonso, o yeli la o poɔŋ: ‘N dire la naaloŋ aŋa pɔgenaa; N ba waa pɔgekoɔre.'
      sbs: 0.6293
      gen_sec: 6.4
      ref_sec: 7.4
    '265':
      text: Kyɛ a Yeezu da ba yeli ko o ka o koŋ kpi.
      sbs: 0.6694
      gen_sec: 3.2
      ref_sec: 8.18
    '269':
      text: Neɛ kaŋ da soore O la, “Daana, noba belaa la na nyɛ faabo be?
      sbs: 0.6888
      gen_sec: 5.12
      ref_sec: 5.22
    '270':
      text: A apostoliimine ane a nembɛrɛ da laŋ la taa ka ba kaa a yeli ŋa nyɛ.
      sbs: 0.7139
      gen_sec: 4.88
      ref_sec: 5.22
    '271':
      text: bonso, fo yɔɔ la a fo tontonema, a Ŋmen-yelmanneba.
      sbs: 0.6645
      gen_sec: 4.0
      ref_sec: 3.84
    '272':
      text: Yɛ ta de faaloŋ yɔɔ ne neɛzaa naŋ e yɛ faaloŋ; kyɛ yɛ maŋ moɔrɔ ka yɛ erɛ yɛlɛ naŋ soma noba
        zaa zie.
      sbs: 0.7214
      gen_sec: 7.76
      ref_sec: 7.24
    '273':
      text: O ba kye kyɛ, ba eɛɛ la ka O leɛ-iri yi a kuuni poɔ.
      sbs: 0.6934
      gen_sec: 4.24
      ref_sec: 4.26
    '274':
      text: Bonso, ba sɛge la a Moozul begɛ poɔ, “Ta leŋ a naadɛre naŋ ŋmeɛrɛ kyi noɔre.
      sbs: 0.7202
      gen_sec: 6.24
      ref_sec: 6.58
    '276':
      text: N maŋ leŋ la noɔre gbɛre boyi daa gbuli zaa poɔ.
      sbs: 0.7229
      gen_sec: 3.84
      ref_sec: 3.1
    '277':
      text: ” A noba naŋ da bebe da ta ŋa turi anuu.
      sbs: 0.6734
      gen_sec: 3.6
      ref_sec: 3.76
    '278':
      text: 'Ba maŋ vɔge la a ba nazupile biŋ a nakogi niŋesogɔ, kyɛ yiele: “Te Daana Naaŋmen, fo seŋ
        ne la.'
      sbs: 0.6675
      gen_sec: 7.04
      ref_sec: 7.9
    '279':
      text: 'Kyɛ a danseɛ la ŋa: Naaŋmen ko te la nyɔvore naŋ ba taa baaraa, ka a nyɔvore ŋa be a O Bie
        poɔ.'
      sbs: 0.7117
      gen_sec: 7.12
      ref_sec: 6.84
    '281':
      text: A pɔge da su la kpareze-velaa, ka o lenni ne salema ane lɛɛbie ane kusi-veɛle.
      sbs: 0.7121
      gen_sec: 6.72
      ref_sec: 6.68
    '282':
      text: A zenɛ ŋa, ba dɔge la a yɛ Faara a Davil teŋkpoŋ poɔ, Ona la a Mɛzaaya, a Daana.
      sbs: 0.6427
      gen_sec: 6.16
      ref_sec: 6.9
    '284':
      text: Azuiŋ ba da ŋmaa la kpaakpaa vaare, a yi ka ba te tuori O.
      sbs: 0.6657
      gen_sec: 4.48
      ref_sec: 4.78
    '286':
      text: Amine meŋ da le la tɛnnoɔ poɔ, a buli, a maale eŋ bie kɔɔ.
      sbs: 0.7432
      gen_sec: 5.12
      ref_sec: 4.96
    '287':
      text: Ba da ba puori a wɛdoŋɔ bee a o teebo, a da ba de a o ŋmaaroŋ a ba gberi bee ba nuuri eŋɛ.
      sbs: 0.7272
      gen_sec: 7.2
      ref_sec: 7.26
    '288':
      text: Ba maŋ erɛ la a lɛ a na de bon naŋ maŋ wɛ, kyɛ tenee deni ba weɛrɛ.
      sbs: 0.7286
      gen_sec: 5.04
      ref_sec: 4.84
    '289':
      text: Ka fõõ wa to fo yɔɔ bee fo yɔɔpuulee, a seŋ ka ba zeŋ ne fo nembɛrɛ niŋesogɔ.
      sbs: 0.7295
      gen_sec: 6.0
      ref_sec: 6.08
    '290':
      text: Naboma Naŋ Be Yagraa Dogre Poɔ.
      sbs: 0.652
      gen_sec: 2.4
      ref_sec: 4.54
    '292':
      text: Lɛ la ka o toŋ ka ba te ko bibiiri na zaa naŋ ta yuomo ayi kyɛ sigre, a Bɛtelɛhɛm ane o tembilii
        poore.
      sbs: 0.6941
      gen_sec: 8.24
      ref_sec: 8.1
    '293':
      text: A o soba ta boɔrɔ ka o sɔglɔ a dɛgre iruu ŋmaaroŋ.
      sbs: 0.7472
      gen_sec: 4.72
      ref_sec: 3.92
    '294':
      text: Lɛ la ka Yeezu da toŋ Piita ane Gyɔɔn, a yele, “Yɛ gaa te nare a Ista tigri bondiraa ka te
        di.
      sbs: 0.7014
      gen_sec: 7.52
      ref_sec: 7.38
    '295':
      text: ” Ba naŋ da wa gbole kaa, ba ba la nyɛ neɛzaa ka a Yeezu yoŋ naane.
      sbs: 0.7308
      gen_sec: 4.4
      ref_sec: 4.52
    '298':
      text: O naŋ da wa de a suobu baare, o da be la a Filipi zie tegitegilɛ.
      sbs: 0.7199
      gen_sec: 4.64
      ref_sec: 4.48
    '299':
      text: Fo ba ŋmaa a zirii ŋa ko te kyɛ Naaŋmen la ka fo ŋmaa tere.
      sbs: 0.7047
      gen_sec: 4.24
      ref_sec: 3.62
  score: 0.7006
  partial: true
- model: ghananlpcommunity/ghana-tts-36k-noref
  sbs: 0.6861
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Ka maa bare ba ne a kɔŋ ka ba kulo, ba na yĩĩe la a sobiriŋ, bonso, ba mine yi la tentɔbɔ
        a wa.
      sbs: 0.6231
      gen_sec: 6.8
      ref_sec: 7.66
    '2':
      text: A Yeezu naŋ da gɛrɛ Gyɛruzɛlɛm, O da kpɛ la a teŋkponni ane a tembilii poore a kanna a noba
        gɛrɛ.
      sbs: 0.6919
      gen_sec: 6.88
      ref_sec: 7.54
    '3':
      text: A Naaŋmen Bagmaale Wederebɛ Nembɛrɛ Zusoba Naŋ Soore Yeezu Soorebie.
      sbs: 0.6166
      gen_sec: 3.52
      ref_sec: 8.22
    '5':
      text: Azuiŋ, yɛ ta daŋ di sɛrɛɛ kyɛ ka a saŋ ba ta; kyɛ ka a Daana waabo naŋ ba ta sɛre.
      sbs: 0.6863
      gen_sec: 6.32
      ref_sec: 5.84
    '6':
      text: O naŋ da wa pɔge te a Azɔ poɔ, o da kpɛ la a gbori ka te gaa Mitelen.
      sbs: 0.6919
      gen_sec: 5.04
      ref_sec: 6.46
    '7':
      text: Ba da lɔɔ o la bare ka o sigi wa a teŋɛzu, a lɔɔ a o malekere meŋ poɔ o eŋɛ.
      sbs: 0.7011
      gen_sec: 5.2
      ref_sec: 6.06
    '8':
      text: Ka a toŋkpeɛne ama naŋ toŋ fo poɔ, da toŋ Sodom teŋɛ poɔ, o da na kyɛnɛ bebe la wa ta zenɛ.
      sbs: 0.7387
      gen_sec: 7.28
      ref_sec: 7.3
    '10':
      text: A banaŋ naŋ da zo yaare da yi yoɔrɔ la, a moɔlɔ a yelbiri.
      sbs: 0.6678
      gen_sec: 3.76
      ref_sec: 5.66
    '11':
      text: N poyɛŋ noba, nɔpaalaa naane ka N sɛgrɛ korɔ yɛ, kyɛ a nɔkoraa na yɛ naŋ da taa yi a piiluu
        saŋ la.
      sbs: 0.7442
      gen_sec: 7.28
      ref_sec: 8.0
    '12':
      text: ” Ka Yeezu da yeli, “Yɛ e ka a noba zeŋ teŋɛ.
      sbs: 0.6441
      gen_sec: 3.04
      ref_sec: 14.68
    '13':
      text: Wola pãã ka a weɛ soba na e a wɛkaareba ŋa?
      sbs: 0.741
      gen_sec: 2.96
      ref_sec: 3.42
    '15':
      text: Ona la boɔrɔ ka neɛzaa nyɛ faabo a kyɛ wa baŋ a yelmeŋɛ.
      sbs: 0.692
      gen_sec: 4.48
      ref_sec: 3.56
    '19':
      text: Pɔɔl Naŋ Puori A Filipae Deme Yaane.
      sbs: 0.5588
      gen_sec: 3.28
      ref_sec: 5.12
    '20':
      text: Bonso, ba da ba sage de a banaŋ zaa naŋ da wa yeli a O kuuni poɔ leɛ-iruu yɛlɛ ko ba.
      sbs: 0.6606
      gen_sec: 8.32
      ref_sec: 5.86
    '21':
      text: ” Ba da do la a sazu a zunzugri poɔ ka a ba dɔndɔnne da kaara ba.
      sbs: 0.645
      gen_sec: 5.12
      ref_sec: 4.64
    '25':
      text: Kyɛ a ŋaa la ka yɛ mine da waa, kyɛ ka ba da pɛge yɛ.
      sbs: 0.6737
      gen_sec: 2.8
      ref_sec: 3.38
    '27':
      text: Ka fõõ meŋɛ soore o, fo na nyɛ la ka a yɛlɛ zaa te naŋ yeli kyaare ne o waa la a lɛ.
      sbs: 0.6969
      gen_sec: 6.56
      ref_sec: 5.82
    '28':
      text: “Daana, a piiluu saŋ, fõõ la iri a teŋɛ.
      sbs: 0.6864
      gen_sec: 3.36
      ref_sec: 3.28
    '29':
      text: Bebie ata puoriŋ, a Pɔɔl da boɔle la a Gyuumine nembɛrɛ naŋ da be a be lantaa.
      sbs: 0.6918
      gen_sec: 5.6
      ref_sec: 5.56
    '30':
      text: A Maleke Na Naŋ Taa A Ganlee Yɛlɛ.
      sbs: 0.6168
      gen_sec: 8.48
      ref_sec: 3.8
    '31':
      text: Nɔmmo maŋ taa la teɛretɔroo ne yelzaa kyɛ maŋ di kannyiri ne yelzaa.
      sbs: 0.671
      gen_sec: 6.08
      ref_sec: 3.94
    '32':
      text: N naŋ da wa nyɛ O, N da le vɔgle la muro O gbɛɛ puliŋ a waa ŋa neɛ naŋ kpi.
      sbs: 0.7122
      gen_sec: 5.2
      ref_sec: 5.86
    '36':
      text: Lɛ la ka o da boɔle o a soore o, ‘Boŋ la ka N wono kyaare ne fo ya?
      sbs: 0.7107
      gen_sec: 5.92
      ref_sec: 4.14
    '37':
      text: Yɛ kaa a Izerayɛl biiri nyɛ; a banaŋ naŋ maŋ di a Naaŋmen bagmaale boma, ba ba maŋ waa a Naaŋmen
        bagmaalkuuri laŋne deme be?
      sbs: 0.6954
      gen_sec: 6.72
      ref_sec: 7.62
    '38':
      text: Kyɛ N na ko la a N dansediribe bayi naŋ su boɔre kparre kpeɛ̃õ ka ba yeli Ŋmen-yelmanna yelyelii
        bebie turi dɔgle kɔɔraayi ne lezaata.
      sbs: 0.6532
      gen_sec: 10.56
      ref_sec: 12.4
    '39':
      text: Te sɛgrɛ la a yɛlɛ ama ka ka a te kyelloo na paale.
      sbs: 0.7216
      gen_sec: 4.32
      ref_sec: 3.98
    '40':
      text: ka ba da de O do ne sazu ne puubu.
      sbs: 0.6427
      gen_sec: 2.0
      ref_sec: 4.84
    '44':
      text: 'Azuiŋ la ka ba yeli: “Gɔŋgbire, iri!'
      sbs: 0.7421
      gen_sec: 2.48
      ref_sec: 3.24
    '46':
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.6713
      gen_sec: 6.64
      ref_sec: 5.94
    '47':
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.6721
      gen_sec: 6.56
      ref_sec: 14.94
    '48':
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.5963
      gen_sec: 8.64
      ref_sec: 6.46
    '51':
      text: Yeezu Naŋ Koŋ A Gyɛruzɛlɛm Teŋɛ Yɛlɛ.
      sbs: 0.6072
      gen_sec: 2.64
      ref_sec: 10.58
    '52':
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.6642
      gen_sec: 3.84
      ref_sec: 5.8
    '53':
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.7032
      gen_sec: 6.08
      ref_sec: 6.64
    '54':
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.7583
      gen_sec: 4.0
      ref_sec: 4.32
    '56':
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.722
      gen_sec: 7.04
      ref_sec: 7.02
    '57':
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.6938
      gen_sec: 6.24
      ref_sec: 5.42
    '58':
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.6922
      gen_sec: 6.96
      ref_sec: 7.12
    '61':
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.6604
      gen_sec: 5.92
      ref_sec: 5.42
    '62':
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.7173
      gen_sec: 3.12
      ref_sec: 3.44
    '63':
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.6971
      gen_sec: 4.48
      ref_sec: 4.66
    '64':
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.7061
      gen_sec: 4.24
      ref_sec: 4.9
    '65':
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
      sbs: 0.7274
      gen_sec: 5.28
      ref_sec: 7.08
    '66':
      text: 'Lɛ la ka N da woŋ kɔkɔre kaŋ a saluoni poɔ ka o yele: “N noba, yɛ wa yi o poɔ.'
      sbs: 0.6533
      gen_sec: 6.96
      ref_sec: 6.26
    '67':
      text: O da iri arɛɛ la ka O sɔre, ka ba de a Ŋmen-yelmanna Azaaya gansɛgraa ko O.
      sbs: 0.617
      gen_sec: 6.32
      ref_sec: 13.28
    '69':
      text: Neɛzaa ba nyɛ fo saanaa ka fo seŋ ne la kũũ be?
      sbs: 0.6274
      gen_sec: 3.36
      ref_sec: 3.28
    '70':
      text: A ŋaa la tori kyɛ pɛllɛ Naaŋmen a te Faara poɔ.
      sbs: 0.6892
      gen_sec: 3.12
      ref_sec: 3.26
    '71':
      text: Te da kpɛ la a gbori a be ka Arestaku naŋ da waa Masedoniya neɛ kyɛ da yi Tɛsalonika da beɛle
        te.
      sbs: 0.6957
      gen_sec: 8.24
      ref_sec: 7.84
    '72':
      text: Pampana, nembuo mɔɔ la na e yɛ yelfaa, ka yɛneŋ wa kyerɛ ka yɛ e yɛlɛ naŋ e velaa?
      sbs: 0.6949
      gen_sec: 5.84
      ref_sec: 6.04
    '73':
      text: A soba na naŋ da faa te yi ne a dɔgɛɛ naŋ tɔgle kũũ, naŋ na kyɛnɛ faa te la.
      sbs: 0.6295
      gen_sec: 8.16
      ref_sec: 5.32
    '74':
      text: 'Ba sɛge la a begɛ gane poɔ: “Noba naŋ yele kɔkɔsaama.'
      sbs: 0.7183
      gen_sec: 4.08
      ref_sec: 5.08
    '75':
      text: Biiri na kyiiri la ba dɔgreba a vɛŋ ka ba ko ba.
      sbs: 0.7026
      gen_sec: 4.64
      ref_sec: 3.32
    '76':
      text: Yɛ erɛ yɛlɛ ne yɛŋ a kyaara noba na naŋ ba poɔ yɛ poɔ, kyɛ maŋ vɛŋ ka wagre zaa yire tɔnɔ.
      sbs: 0.7155
      gen_sec: 5.84
      ref_sec: 6.24
    '77':
      text: A ŋaa zie la ka te baŋ ka a baaraa saŋ taɛ la.
      sbs: 0.7335
      gen_sec: 4.56
      ref_sec: 3.6
    '79':
      text: Kyɛ ba da de la soba na zaa yuori ba naŋ ba sɛge eŋ a nyɔvore gane poɔ lɔɔ eŋ a baa vũũ poɔ.
      sbs: 0.6483
      gen_sec: 6.88
      ref_sec: 9.34
    '80':
      text: A dɛndɛŋ soba da yi waɛ la, a wa yeli, ‘Daana, a fo warbiri yi la warbie pie tɔnɔ dɔgle o
        zu.
      sbs: 0.7356
      gen_sec: 7.12
      ref_sec: 7.52
    '81':
      text: 'A yelwulaa yɛ naŋ na nyɛ la ŋa: yɛ na nyɛ la bie ba naŋ pilli ne bipɛmɛ a gaale O donne bondi
        gbori poɔ.'
      sbs: 0.6473
      gen_sec: 7.04
      ref_sec: 8.0
    '82':
      text: Nemmeŋɛ maŋ iri la bonsonne yi o nabonsonne poɔ, ka nenfaa meŋ maŋ iri bonfaare yi o nabonfaare
        poɔ.
      sbs: 0.5684
      gen_sec: 6.88
      ref_sec: 4.78
    '86':
      text: Bonso, neɛzaa koŋ la baŋ biŋ yiri pare zaa ka a onaŋ ba naŋ biŋ naane; a yiri pare ŋa la a
        Yeezu Kirista.
      sbs: 0.6943
      gen_sec: 7.68
      ref_sec: 8.06
    '87':
      text: A O eŋɛ la ka a yiri lamboe zaa mɛ lantaa a baa te leɛ Naaŋmen die naŋ e soŋ a be a Daana
        eŋɛ.
      sbs: 0.656
      gen_sec: 6.96
      ref_sec: 6.34
    '88':
      text: ” Ka O yeli ko ba, “N nyɛ la Setaana ka o yi sazu a le teŋɛ a ŋa saa naŋ nyegre.
      sbs: 0.6851
      gen_sec: 5.68
      ref_sec: 5.76
    '89':
      text: Kyɛ deɛ yeli a yelbiri yoŋ, a vɛŋ ka N gbaŋgbaa nyɛ o sammo.
      sbs: 0.6646
      gen_sec: 4.88
      ref_sec: 4.36
    '90':
      text: ” O da kaara ba la polipoli a teɛre ka ba na ko o la bonkaŋ.
      sbs: 0.6924
      gen_sec: 3.92
      ref_sec: 3.88
    '93':
      text: Ka maa puori Naaŋmen ameseɛrɛ kyɛ di a bondirii, bonso ka ba na saana n yuori ne bondirii
        N naŋ puori Naaŋmen ameseɛrɛ kyɛ di?
      sbs: 0.7079
      gen_sec: 9.12
      ref_sec: 7.7
    '94':
      text: Saa nyegroo ane hooroo ane saa tannoo da yire la a nakogi zie, kyɛ ka fentele ayopoĩ da dire
        a nakogi niŋesogɔ.
      sbs: 0.6494
      gen_sec: 8.64
      ref_sec: 10.42
    '95':
      text: N da guoli yɛ la ane beroŋ, a da ba e bondi-tage, bonso, yɛ da naŋ ba ta bondi-tage diibu.
      sbs: 0.704
      gen_sec: 7.2
      ref_sec: 7.16
    '96':
      text: Yuoni zaa poɔ a Yeezu dɔgrebɔ da maŋ gaa la Gyɛruzɛlɛm a te di a Ista tigri.
      sbs: 0.6739
      gen_sec: 5.2
      ref_sec: 5.88
    '97':
      text: Ka a naŋ wa seŋ ka N meŋ gaa, ba na beɛle ma la ka te gaa.
      sbs: 0.7143
      gen_sec: 4.16
      ref_sec: 3.68
    '99':
      text: Ba da teɛre ka O be la a noba poɔ ka ba zaa kyɛnɛ a sori poɔ.
      sbs: 0.6965
      gen_sec: 3.6
      ref_sec: 4.2
    '101':
      text: Neɛzaa kontoɔ̃ pigi ma sori ka N ta ire n meŋɛ yuori!
      sbs: 0.7021
      gen_sec: 3.6
      ref_sec: 3.5
    '103':
      text: Te baŋ ka te yi la kũũ poɔ a kpɛ nyɔvore poɔ, te naŋ nɔŋ taa zuiŋ.
      sbs: 0.707
      gen_sec: 5.28
      ref_sec: 4.58
    '104':
      text: N baŋ ka a N gaabo puoriŋ, noba mine naŋ waa ŋa gboŋgbo-faare na wa kpɛ la yɛ poɔ, a koŋ bare
        a peere.
      sbs: 0.6847
      gen_sec: 8.0
      ref_sec: 7.04
    '106':
      text: O da ba di bonzaa a bebie na zaa poɔ, kyɛ O naŋ da wa te baare, kɔŋ da kpɛ O la yaga.
      sbs: 0.6733
      gen_sec: 6.4
      ref_sec: 6.58
    '109':
      text: Ba na de a la lɔɔ bare.
      sbs: 0.6377
      gen_sec: 1.12
      ref_sec: 11.98
    '112':
      text: ” Ka O yeli, “Yɛ gu yɛmenne velaa ka ba ta wa bɛlle yɛ.
      sbs: 0.7178
      gen_sec: 3.36
      ref_sec: 3.4
    '113':
      text: Kyɛ a Yeezu naŋ da bale a O kyɛmmo poɔ la so ka O da wa zeŋ a bulee noɔreŋ.
      sbs: 0.6836
      gen_sec: 5.44
      ref_sec: 5.98
    '114':
      text: Ba suuri da iree la yaga ane ba naŋ da kanna a noba kyɛ moɔlɔ ka a Yeezu zie la ka kuuni leɛ-iruu
        be.
      sbs: 0.7098
      gen_sec: 7.36
      ref_sec: 7.64
    '115':
      text: Piita Ane Gyɔɔn Naŋ Are A Sɛrediribe Niŋesogɔ.
      sbs: 0.6022
      gen_sec: 3.12
      ref_sec: 3.4
    '116':
      text: Bonso, te waa la Naaŋmen tontonema naŋ laŋ tonɔ, yɛnee la a Naaŋmen weɛ, a Naaŋmen yiri.
      sbs: 0.7378
      gen_sec: 5.92
      ref_sec: 7.14
    '121':
      text: Pɔlbile kaŋ yuori naŋ da di Yutaaku da zeŋ la a takoro noɔreŋ a gbire kyuuro, a Pɔɔl naŋ da
        yele yɛlɛ.
      sbs: 0.6775
      gen_sec: 7.84
      ref_sec: 7.18
    '124':
      text: ” Ka O yeli ko o, “Bonso ka fo soorɔ ma bon naŋ e soŋ yɛlɛ?
      sbs: 0.7217
      gen_sec: 4.0
      ref_sec: 4.1
    '125':
      text: A ŋaa zie la ka te maŋ baŋ a yelmeŋɛ vooroŋ ane a tuluu vooroŋ.
      sbs: 0.7221
      gen_sec: 3.68
      ref_sec: 5.28
    '126':
      text: N zoro la dabeɛ̃ ka a toma N naŋ toŋ ko yɛ na pɔɔ wa e la weɛlɛ.
      sbs: 0.7053
      gen_sec: 4.16
      ref_sec: 3.96
    '127':
      text: Kyɛ a Vooroŋ Soŋ la a dansedire, bonso a Vooroŋ Soŋ la a yelmeŋɛ.
      sbs: 0.5943
      gen_sec: 5.2
      ref_sec: 6.28
    '128':
      text: bonso, yɛ baŋ la a soba na naŋ bebe a yi a piiluu saŋ.
      sbs: 0.7051
      gen_sec: 4.32
      ref_sec: 4.44
    '130':
      text: ” Ka a noba da yeli sɔge, “Fo taa la sefaa!
      sbs: 0.603
      gen_sec: 3.92
      ref_sec: 3.94
    '131':
      text: ” Kyɛ a Yeezu da taŋ la O noɔre a ba yeli yelzaa sɔge.
      sbs: 0.6375
      gen_sec: 3.92
      ref_sec: 7.12
    '133':
      text: Bonso, N dire la o danseɛ ka o toŋ la toma yaga ko yɛ ane banaŋ naŋ be Laodisiya teŋɛ ane
        Hɛrapoli teŋɛ poɔ.
      sbs: 0.6792
      gen_sec: 10.0
      ref_sec: 9.18
    '134':
      text: ” A lɛ la ka ba da yi moɔle ka neɛzaa leɛ o eebo a yi o yelbebe poɔ.
      sbs: 0.7315
      gen_sec: 5.84
      ref_sec: 4.52
    '135':
      text: ” Ba da yeli la a ŋaa ka ba e O nyɛ, a pãã na toɔ̃ nyɛ saanaa tuo O.
      sbs: 0.6888
      gen_sec: 4.56
      ref_sec: 5.6
    '137':
      text: Soba na zaa naŋ yeli, “N baŋ O la,” kyɛ ba sagra a O nɔɛ, waa la zirŋmaara, ka a yelmeŋɛ ba
        kye o zie.
      sbs: 0.7442
      gen_sec: 7.6
      ref_sec: 8.44
    '138':
      text: “Pampana ŋa N teɛroŋ zaa gyɛrɛɛ la.
      sbs: 0.6733
      gen_sec: 2.24
      ref_sec: 3.38
    '140':
      text: A Daana la na wa e ka yɛlɛ naŋ sɔgle lige poɔ sãã veɛloŋ ka bon naŋ be sukyiri poɔ meŋ sãã.
      sbs: 0.655
      gen_sec: 6.96
      ref_sec: 7.44
    '141':
      text: A Yeezu da yi la a be a wa O meŋɛ teŋɛ poɔ, ka a O potuuribo da tu O wa.
      sbs: 0.6016
      gen_sec: 5.84
      ref_sec: 4.6
    '142':
      text: N na iri la a gaa a N saa zie a te yeli ko o, “N saa, N eɛɛ yelbieri a kyaare Naaŋmen ane
        fõõ.
      sbs: 0.7285
      gen_sec: 6.72
      ref_sec: 8.56
    '143':
      text: Ba da ko o la sori meŋ ka o zɔɔ ne a nensonne a toɔ̃ ba.
      sbs: 0.7038
      gen_sec: 4.0
      ref_sec: 3.52
    '144':
      text: 'Azuiŋ, yɛ ko a teŋɛzu yɛlɛ zaa naŋ be yɛ enneŋ: peɛ̃mo toma, yeldɛgɛ, vɔlfaare, yelfaare
        boɔbo ane bombɔ-gaŋne .'
      sbs: 0.7129
      gen_sec: 11.84
      ref_sec: 10.3
    '149':
      text: A banaŋ naŋ puoro a wɛdoŋɔ ane a o teebo ane neɛzaa naŋ de a o yuori ŋmaaroŋ daŋ koŋ nyɛ pɛnnoo
        ŋmenaa bee tensogɔ.
      sbs: 0.6543
      gen_sec: 9.6
      ref_sec: 10.84
    '150':
      text: Maata la da kaara a bondirii yɛlɛ, ka Laazoro da e a neɛ na kaŋ naŋ da laŋ zeŋ a diibu zie
        ne a Yeezu.
      sbs: 0.6716
      gen_sec: 6.24
      ref_sec: 7.98
    '151':
      text: fo naŋ nare biŋ a andonɛɛ zaa niŋesogɔ.
      sbs: 0.7037
      gen_sec: 1.92
      ref_sec: 3.0
    '153':
      text: N erɛ la ama zaa a Ŋmen-yelnoore zuiŋ, ka ka N na toɔ̃ nyɛ a yelnoore maaloo.
      sbs: 0.6324
      gen_sec: 7.12
      ref_sec: 4.82
    '154':
      text: O da laŋ kpeɛrɛ ne la a wɛdonne; ka a malekere da kaara O zie.
      sbs: 0.694
      gen_sec: 3.76
      ref_sec: 4.12
    '156':
      text: A Yeezu da zɛge la O zu a nyɛ bondaanema naŋ eŋnɛ ba kyɔɔtaare a kyɔɔtaare daga poɔ.
      sbs: 0.6789
      gen_sec: 6.88
      ref_sec: 6.0
    '157':
      text: Yɛ nyɛ, N tonɔ yɛ la aŋa pebilii ka yɛ yi te kpɛ gboŋgboe poɔ.
      sbs: 0.6952
      gen_sec: 5.52
      ref_sec: 4.98
    '158':
      text: Yɛ ta erɛ ka a Naaŋmen Vooroŋ Soŋ poɔ saana, Ona la a ŋmaaroŋ Naaŋmen naŋ eŋ yɛ a kyɛllɛ ne
        a faabo bebiri.
      sbs: 0.7192
      gen_sec: 7.68
      ref_sec: 6.72
    '159':
      text: N sɔre la a fo potuuribo ka ba digi a sefaa ka o yi, kyɛ ka ba digi fãã.
      sbs: 0.6183
      gen_sec: 6.48
      ref_sec: 6.1
    '160':
      text: Bonso, a Laazoro kuuni poɔ leɛ-iruu yɛlɛ la so ka a Gyuumine yaga da sagra derɛ a Yeezu yɛlɛ
        kyɛ zagra a ba yɛlɛ.
      sbs: 0.6429
      gen_sec: 8.8
      ref_sec: 8.62
    '165':
      text: Leɛ-teɛre nyɛ bonna naŋ da e ka fo le; leɛ fo eebo a kyɛ tonɔ a toma na fo naŋ da tonɔ a dɛndɛŋ
        saŋ.
      sbs: 0.6811
      gen_sec: 6.24
      ref_sec: 7.78
    '170':
      text: ka turi pie ne turi ayi da yi a Bɛŋgyamen bale poɔ ka ba da eŋ a ŋmaaroŋ.
      sbs: 0.7265
      gen_sec: 5.44
      ref_sec: 6.14
    '173':
      text: A ba seŋ ka o e Kiristabi-paalaa, ka lɛ naane, o na baŋ paale ne la pɔloo a le a sebɛlbɛllɛ
        dɔgroŋ poɔ.
      sbs: 0.6967
      gen_sec: 7.92
      ref_sec: 7.02
    '174':
      text: Ka Yeezu da soore a bege baŋnema ane a Faraziimine, “Sori bebe la ka ba saŋ baala a pɛnnoo
        bebiri daare bee sori kyebe.
      sbs: 0.6874
      gen_sec: 9.76
      ref_sec: 9.08
    '175':
      text: Ona la vɛŋ ka te baŋ lɛ yɛ naŋ taa nɔmmo a Vooroŋ Soŋ poɔ.
      sbs: 0.6835
      gen_sec: 3.04
      ref_sec: 3.9
    '176':
      text: Yɛ naŋ sage tu a yelmeŋɛ pampana, yɛ pɛge la a yɛ seere ka ka yɛ na taa nɔmmo naŋ sereŋ e
        meŋɛ.
      sbs: 0.7271
      gen_sec: 6.88
      ref_sec: 8.06
    '177':
      text: Kyɛ a Soŋ Soba da sɔ yɛ la kããsoŋ, ka yɛ zaa taa yelbammo.
      sbs: 0.6667
      gen_sec: 4.72
      ref_sec: 4.56
    '178':
      text: ka turi pie ne turi ayi da yi a Manaasɛ bale poɔ.
      sbs: 0.6885
      gen_sec: 3.36
      ref_sec: 4.14
    '179':
      text: Yiri na zaa poɔ yɛ naŋ wa kpɛ, yɛ daŋ yeli, ‘Ka maaroŋ be a yiri ŋa poɔ!
      sbs: 0.7382
      gen_sec: 5.04
      ref_sec: 5.22
    '181':
      text: Bee boŋ la ka Kiristabie ne neɛ naŋ ba sage de a Kirista yɛlɛ laŋ?
      sbs: 0.6867
      gen_sec: 4.8
      ref_sec: 3.58
    '182':
      text: Yɛ ta wa poɔrɔ sazu, bonso, o e la Naaŋmen nakogi, bee a poɔrɔ a teŋɛ, bonso, o meŋ waa la
        a Naaŋmen gbɛɛ-bimmu zie.
      sbs: 0.7407
      gen_sec: 12.0
      ref_sec: 11.22
    '184':
      text: Te da taa la yɛ vɔlaa kyɛ da nɔnɔ yaga ka te wa ka te nyɛ taa nimisogre.
      sbs: 0.6606
      gen_sec: 5.12
      ref_sec: 4.98
    '187':
      text: A gaŋ a zaa, yɛ de nɔmmo su pɔge yɛmenne, ona la maŋ leŋ boma zaa lantaa velaa zaa.
      sbs: 0.6785
      gen_sec: 5.84
      ref_sec: 5.7
    '189':
      text: Pampana ŋa, N de yɛ la ko Naaŋmen ane a Naaŋmen yelbiri garaaseɛ.
      sbs: 0.6054
      gen_sec: 3.84
      ref_sec: 4.66
    '190':
      text: Ba naŋ da ba nyɛ O, ba da leɛ gaa la a Gyɛruzɛlɛm ka ba te bɔ O.
      sbs: 0.6143
      gen_sec: 3.84
      ref_sec: 4.26
    '191':
      text: ” Kyɛ ba da ba baŋ a yɛlɛ O naŋ yeli ko ba tɛgɛ.
      sbs: 0.6467
      gen_sec: 4.0
      ref_sec: 8.26
    '192':
      text: ” A yeli ŋa da wa ne la tage taa, ka nɔkpeɛne da kpɛ a Pɔɔl ane Banabase ane a noba na sogɔŋ.
      sbs: 0.7214
      gen_sec: 5.04
      ref_sec: 7.4
    '195':
      text: Azuiŋ, yɛ baŋ ne a, a ta inni ka yuomo ata tensogɔ bee ŋmenaa, ka N ba nage ka N kpãã yɛ ane
        nentaŋ.
      sbs: 0.7126
      gen_sec: 9.2
      ref_sec: 8.14
    '197':
      text: Te nyɛ la dɔgɛɛ boorɔ zaa, kyɛ naŋ voorɔ; ka te teɛroŋ gyɛre, kyɛ ka te nuuri ba yoɔrɔ.
      sbs: 0.6973
      gen_sec: 7.68
      ref_sec: 6.04
    '198':
      text: N na boɔrɔ la ka yɛ zaa yele kɔkɔsaama, kyɛ a gaŋ a zaa N na boɔrɔ la ka yɛ yele Ŋmen-yelmanna
        yelyelii.
      sbs: 0.6764
      gen_sec: 8.56
      ref_sec: 6.62
    '199':
      text: Enyaabo zaa daŋ ba pɔge yɛ naŋ daŋ ba pɔge nensaala.
      sbs: 0.6958
      gen_sec: 4.08
      ref_sec: 3.24
    '202':
      text: A banaŋ N naŋ nɔŋ la ka N maŋ wuli kyɛ tage ba tobo.
      sbs: 0.6919
      gen_sec: 3.2
      ref_sec: 3.16
    '203':
      text: A Naaŋmen da di la a Davil danseɛ a yeli, ‘N nyɛ la Davil, a Gyɛse bidɔɔ, ka o waa N yɛŋ neɛ.
      sbs: 0.6893
      gen_sec: 6.72
      ref_sec: 6.96
    '204':
      text: Lɛ la ka a bie da yeli ko a o saa, ‘N saa, N sãã la Naaŋmen poɔ, a sãã fo meŋ poɔ.
      sbs: 0.7311
      gen_sec: 7.2
      ref_sec: 6.42
    '205':
      text: A bama moɔlɔ la a Kirista yɛlɛ ne nɔmmo, a baŋ ka ba eŋ ma la a kyɛ N naŋ zɔɔrɔ a Ŋmen-yelnoore
        zɔɔre zuiŋ.
      sbs: 0.72
      gen_sec: 6.64
      ref_sec: 7.48
    '207':
      text: Ka o da boɔle a gbaŋgbaa kaŋ a soore o bonna naŋ erɛ.
      sbs: 0.7288
      gen_sec: 3.36
      ref_sec: 3.9
    '208':
      text: Yeezu Naŋ Saŋ Neɛ Kaŋ Ba Naŋ Dɔge Ne Zɔnnoŋ.
      sbs: 0.6783
      gen_sec: 9.04
      ref_sec: 3.56
    '209':
      text: ka turi pie ne turi ayi da yi a Nafetali bale poɔ.
      sbs: 0.7281
      gen_sec: 3.36
      ref_sec: 4.0
    '211':
      text: Moozul da yelee la, ‘A Daana a yɛ Naaŋmen na iri la Ŋmen-yelmanna a yɛ meŋɛ noba poɔ ka o
        waa aŋa maa.
      sbs: 0.7227
      gen_sec: 7.68
      ref_sec: 7.9
    '212':
      text: “Yuomo lezaayi puoriŋ, maleke da wuli la o meŋɛ ko a Moozul vũũ naŋ da dire tuu kaŋ poɔ a
        Sanae taŋ wɛgyɛŋ poɔ.
      sbs: 0.7084
      gen_sec: 7.6
      ref_sec: 9.28
    '214':
      text: 'Kyɛ fo taa la garebanyɛ ne a yeli ŋa: fo kyiire la a Nikoletan deme tontonne na N meŋ naŋ
        kyiire.'
      sbs: 0.6688
      gen_sec: 6.72
      ref_sec: 6.68
    '215':
      text: Pampana, a malekere ayopoĩ na naŋ da taa a eelɛ ayopoĩ da narɛɛ la ka ba peɛle a eelɛ.
      sbs: 0.7038
      gen_sec: 12.32
      ref_sec: 7.48
    '217':
      text: ” A Yeezu naŋ da woŋ a ŋaa, O da yeli ko la a dɔɔ, “Yelyeni kaŋ la kyɛre ka fo ba taa.
      sbs: 0.6605
      gen_sec: 8.24
      ref_sec: 6.44
    '219':
      text: ’ Lɛ la ka a saa da de a o boma poŋ a o biiri na bayi.
      sbs: 0.7084
      gen_sec: 3.92
      ref_sec: 3.54
    '220':
      text: yɛ ta dare a yɛ sukyie aŋa lɛ a yɛ sããkommine naŋ da zɔɔ ne Naaŋmen.
      sbs: 0.6563
      gen_sec: 4.48
      ref_sec: 5.5
    '221':
      text: Ka Yeezu yeli, “Pɔlbile, maa yeli ko fo, vaa-iri!
      sbs: 0.67
      gen_sec: 7.04
      ref_sec: 4.68
    '224':
      text: A yelwolɔ naŋ waana zuiŋ, N teɛre ka a na soma la ka neɛzaa naŋ kyɛnɛ waa lɛ zaa o naŋ da
        waa.
      sbs: 0.7216
      gen_sec: 6.88
      ref_sec: 7.48
    '225':
      text: Maa Gyɔɔn la a soba na naŋ da woŋ kyɛ nyɛ a yɛlɛ ama.
      sbs: 0.7122
      gen_sec: 3.36
      ref_sec: 10.56
    '226':
      text: Ona la e ka te taa faŋ a waa a nɔpaalaa tontonema.
      sbs: 0.6906
      gen_sec: 3.84
      ref_sec: 3.28
    '227':
      text: A yɛlɛ na eŋ naŋ kyɛre, N na wuli yɛ la ka maa wa wa yɛ zie.
      sbs: 0.6915
      gen_sec: 3.44
      ref_sec: 6.74
    '228':
      text: a zɔɔrɔ ne a Daana ane a O Mɛzaaya.
      sbs: 0.6893
      gen_sec: 4.32
      ref_sec: 3.3
    '229':
      text: Yɛ nyɛ nɔmmo na tɔ a Saa naŋ nɔŋ te, a e ka ba boɔlɔ te Naaŋmen bibiiri; ka te sereŋ waa a
        lɛ.
      sbs: 0.7357
      gen_sec: 8.32
      ref_sec: 7.2
    '230':
      text: O da gaa te de la a gane yi a soba na naŋ da zeŋ a nakogi zu nuduluŋ poɔ.
      sbs: 0.693
      gen_sec: 4.4
      ref_sec: 4.9
    '231':
      text: Yɛ saŋna a baalba naŋ be a be, kyɛ yeli ko ba, ‘A Naaŋmen naaloŋ wa peɛle yɛ la.
      sbs: 0.7602
      gen_sec: 5.28
      ref_sec: 5.5
    '233':
      text: Kyɛ tɔnɔ na zaa N naŋ da nyɛ, N de a la ka a waa zaglaa a Kirista zuiŋ.
      sbs: 0.7189
      gen_sec: 5.6
      ref_sec: 5.24
    '234':
      text: Kyɛ soba na zaa naŋ ba sage de a yelbiri na wɛ la.
      sbs: 0.6938
      gen_sec: 4.0
      ref_sec: 3.1
    '235':
      text: A ŋa la a n noɔre N naŋ wullo a puoruu laŋne yie zaa poore.
      sbs: 0.6887
      gen_sec: 4.88
      ref_sec: 3.88
    '236':
      text: 'Serɛzaa ka N yele korɔ yɛ: Gyɔɔn Bati e la kpoŋ gaŋ banaŋ zaa pɔgeba naŋ dɔge a teŋɛzu.'
      sbs: 0.7143
      gen_sec: 6.16
      ref_sec: 6.58
    '237':
      text: Bonso, dɔgroŋ la so ka dabeɛ̃ bebe, kyɛ neɛ na zaa naŋ zoro dabeɛ̃ ba taa nɔmmo naŋ e soŋ.
      sbs: 0.7043
      gen_sec: 8.48
      ref_sec: 7.54
    '238':
      text: Azuiŋ a ferɛɛ la ka te maaleŋ kyɛlle velaa bon te naŋ da woŋ, ka te ta wa sare yi a poɔ.
      sbs: 0.7541
      gen_sec: 7.2
      ref_sec: 7.8
    '239':
      text: ” Ka O yeli sɔge ba, “Nembuo la N ma ane N yɔɔmine?
      sbs: 0.6541
      gen_sec: 3.52
      ref_sec: 7.36
    '240':
      text: A yɛlɛ ama da eɛɛ la ka a e yelwulaa ko te, ka ka te na ta boɔrɔ yelfaare aŋa ba naŋ da e
        lɛ.
      sbs: 0.6914
      gen_sec: 6.8
      ref_sec: 6.92
    '241':
      text: Kyɛ ka o naŋ wa poɔ̃, o maŋ buli la a eŋ bie yaga.
      sbs: 0.719
      gen_sec: 3.52
      ref_sec: 3.5
    '242':
      text: A ŋaa la vɛŋ ka te ba zoro dabeɛ̃ a Naaŋmen niŋeŋ a yi a Kirista zuiŋ.
      sbs: 0.7021
      gen_sec: 4.8
      ref_sec: 4.86
    '243':
      text: Kyɛ Pɔɔl da ba boɔrɔ ka o taa neɛ naŋ da zo kyɛ bare ba Pamfiliya poɔ, a ba tu ba a toŋ a
        toma.
      sbs: 0.6988
      gen_sec: 7.04
      ref_sec: 7.42
    '244':
      text: Kyɛ ŋmenaa naŋ da wa do, a bombulo da zoɔlɛɛ la, a ko, a naŋ da ba taa nyaga zuiŋ.
      sbs: 0.6966
      gen_sec: 6.64
      ref_sec: 6.62
    '245':
      text: A weɛ soba da naŋ taa la neŋyenaa kaŋ, a o poyɛŋ bie.
      sbs: 0.7437
      gen_sec: 3.36
      ref_sec: 3.66
    '246':
      text: N naŋ da wa nyɛ o, N noɔre da maaɛ la yaga.
      sbs: 0.7322
      gen_sec: 2.72
      ref_sec: 3.1
    '247':
      text: Dabeɛ̃ ne nɔmaa da kpɛ ba la ne a yeli ŋa naŋ da e a gbɛre ŋa zie.
      sbs: 0.6811
      gen_sec: 3.84
      ref_sec: 6.38
    '250':
      text: A Fɛstu pãã da tere la noɔre, ka ba taa a Pɔɔl wa ne.
      sbs: 0.7027
      gen_sec: 4.16
      ref_sec: 3.48
    '252':
      text: Pampana ŋa, vi ba erɛ ma, ka maa gba erɛ pɔloo yaga ne a kpeɛ̃õ a Daana naŋ tere ka N de maale
        ne yɛ.
      sbs: 0.6819
      gen_sec: 7.76
      ref_sec: 6.86
    '253':
      text: ” Ka Yeezu da yeli ko o, “Yelmeŋɛ ka N yele korɔ yɛ.
      sbs: 0.6501
      gen_sec: 3.76
      ref_sec: 9.28
    '256':
      text: Yɛ vɛŋ ka neɛzaa maŋ sigre o meŋɛ korɔ a teŋɛzu wederebɛ; bonso, wederɛ zaa ba kyebe ka Naaŋmen
        zie naane ka o yi.
      sbs: 0.678
      gen_sec: 10.32
      ref_sec: 8.34
    '257':
      text: Yelmeŋɛ zaa la ka N yele korɔ yɛ, ka kabiri ba le teŋɛ a poɔ̃, o maŋ e la kabi-yeni.
      sbs: 0.6857
      gen_sec: 5.6
      ref_sec: 5.78
    '260':
      text: Ka maa pãã la bee ka bana la, a yeli ŋa la ka te moɔle ka yɛ da sage de.
      sbs: 0.713
      gen_sec: 4.8
      ref_sec: 5.08
    '262':
      text: O eŋɛ da kɔɔ guree la, ka o da kontoɔ̃ dɔle o meŋɛ.
      sbs: 0.6798
      gen_sec: 4.48
      ref_sec: 3.74
    '263':
      text: Bonso, a ba seŋ ka o voorɔ.
      sbs: 0.62
      gen_sec: 2.16
      ref_sec: 8.1
    '264':
      text: 'Bonso, o yeli la o poɔŋ: ‘N dire la naaloŋ aŋa pɔgenaa; N ba waa pɔgekoɔre.'
      sbs: 0.6602
      gen_sec: 7.36
      ref_sec: 7.4
    '265':
      text: Kyɛ a Yeezu da ba yeli ko o ka o koŋ kpi.
      sbs: 0.6359
      gen_sec: 3.36
      ref_sec: 8.18
    '269':
      text: Neɛ kaŋ da soore O la, “Daana, noba belaa la na nyɛ faabo be?
      sbs: 0.7256
      gen_sec: 4.48
      ref_sec: 5.22
    '270':
      text: A apostoliimine ane a nembɛrɛ da laŋ la taa ka ba kaa a yeli ŋa nyɛ.
      sbs: 0.7012
      gen_sec: 4.88
      ref_sec: 5.22
    '271':
      text: bonso, fo yɔɔ la a fo tontonema, a Ŋmen-yelmanneba.
      sbs: 0.6596
      gen_sec: 3.44
      ref_sec: 3.84
    '272':
      text: Yɛ ta de faaloŋ yɔɔ ne neɛzaa naŋ e yɛ faaloŋ; kyɛ yɛ maŋ moɔrɔ ka yɛ erɛ yɛlɛ naŋ soma noba
        zaa zie.
      sbs: 0.6893
      gen_sec: 6.88
      ref_sec: 7.24
    '273':
      text: O ba kye kyɛ, ba eɛɛ la ka O leɛ-iri yi a kuuni poɔ.
      sbs: 0.6706
      gen_sec: 3.76
      ref_sec: 4.26
    '274':
      text: Bonso, ba sɛge la a Moozul begɛ poɔ, “Ta leŋ a naadɛre naŋ ŋmeɛrɛ kyi noɔre.
      sbs: 0.7129
      gen_sec: 4.96
      ref_sec: 6.58
    '276':
      text: N maŋ leŋ la noɔre gbɛre boyi daa gbuli zaa poɔ.
      sbs: 0.7246
      gen_sec: 4.08
      ref_sec: 3.1
    '277':
      text: ” A noba naŋ da bebe da ta ŋa turi anuu.
      sbs: 0.6865
      gen_sec: 2.8
      ref_sec: 3.76
    '278':
      text: 'Ba maŋ vɔge la a ba nazupile biŋ a nakogi niŋesogɔ, kyɛ yiele: “Te Daana Naaŋmen, fo seŋ
        ne la.'
      sbs: 0.6614
      gen_sec: 7.04
      ref_sec: 7.9
    '279':
      text: 'Kyɛ a danseɛ la ŋa: Naaŋmen ko te la nyɔvore naŋ ba taa baaraa, ka a nyɔvore ŋa be a O Bie
        poɔ.'
      sbs: 0.7269
      gen_sec: 6.64
      ref_sec: 6.84
    '281':
      text: A pɔge da su la kpareze-velaa, ka o lenni ne salema ane lɛɛbie ane kusi-veɛle.
      sbs: 0.665
      gen_sec: 5.04
      ref_sec: 6.68
    '282':
      text: A zenɛ ŋa, ba dɔge la a yɛ Faara a Davil teŋkpoŋ poɔ, Ona la a Mɛzaaya, a Daana.
      sbs: 0.6265
      gen_sec: 7.12
      ref_sec: 6.9
    '284':
      text: Azuiŋ ba da ŋmaa la kpaakpaa vaare, a yi ka ba te tuori O.
      sbs: 0.6426
      gen_sec: 3.76
      ref_sec: 4.78
    '286':
      text: Amine meŋ da le la tɛnnoɔ poɔ, a buli, a maale eŋ bie kɔɔ.
      sbs: 0.6935
      gen_sec: 6.32
      ref_sec: 4.96
    '287':
      text: Ba da ba puori a wɛdoŋɔ bee a o teebo, a da ba de a o ŋmaaroŋ a ba gberi bee ba nuuri eŋɛ.
      sbs: 0.7439
      gen_sec: 6.16
      ref_sec: 7.26
    '288':
      text: Ba maŋ erɛ la a lɛ a na de bon naŋ maŋ wɛ, kyɛ tenee deni ba weɛrɛ.
      sbs: 0.7271
      gen_sec: 5.04
      ref_sec: 4.84
    '289':
      text: Ka fõõ wa to fo yɔɔ bee fo yɔɔpuulee, a seŋ ka ba zeŋ ne fo nembɛrɛ niŋesogɔ.
      sbs: 0.7157
      gen_sec: 5.04
      ref_sec: 6.08
    '290':
      text: Naboma Naŋ Be Yagraa Dogre Poɔ.
      sbs: 0.6323
      gen_sec: 1.92
      ref_sec: 4.54
    '292':
      text: Lɛ la ka o toŋ ka ba te ko bibiiri na zaa naŋ ta yuomo ayi kyɛ sigre, a Bɛtelɛhɛm ane o tembilii
        poore.
      sbs: 0.6541
      gen_sec: 7.2
      ref_sec: 8.1
    '293':
      text: A o soba ta boɔrɔ ka o sɔglɔ a dɛgre iruu ŋmaaroŋ.
      sbs: 0.6902
      gen_sec: 3.76
      ref_sec: 3.92
    '294':
      text: Lɛ la ka Yeezu da toŋ Piita ane Gyɔɔn, a yele, “Yɛ gaa te nare a Ista tigri bondiraa ka te
        di.
      sbs: 0.6756
      gen_sec: 6.16
      ref_sec: 7.38
    '295':
      text: ” Ba naŋ da wa gbole kaa, ba ba la nyɛ neɛzaa ka a Yeezu yoŋ naane.
      sbs: 0.7439
      gen_sec: 4.64
      ref_sec: 4.52
    '298':
      text: O naŋ da wa de a suobu baare, o da be la a Filipi zie tegitegilɛ.
      sbs: 0.7006
      gen_sec: 5.04
      ref_sec: 4.48
    '299':
      text: Fo ba ŋmaa a zirii ŋa ko te kyɛ Naaŋmen la ka fo ŋmaa tere.
      sbs: 0.6903
      gen_sec: 3.84
      ref_sec: 3.62
  score: 0.6861
  partial: true
- model: ghananlpcommunity/ghana-tts-72k-noref
  sbs: 0.6783
  num_scored: 200
  uses_reference: false
  entries:
    '0':
      text: Ka maa bare ba ne a kɔŋ ka ba kulo, ba na yĩĩe la a sobiriŋ, bonso, ba mine yi la tentɔbɔ
        a wa.
      sbs: 0.6315
      gen_sec: 6.48
      ref_sec: 7.66
    '2':
      text: A Yeezu naŋ da gɛrɛ Gyɛruzɛlɛm, O da kpɛ la a teŋkponni ane a tembilii poore a kanna a noba
        gɛrɛ.
      sbs: 0.6794
      gen_sec: 9.36
      ref_sec: 7.54
    '3':
      text: A Naaŋmen Bagmaale Wederebɛ Nembɛrɛ Zusoba Naŋ Soore Yeezu Soorebie.
      sbs: 0.57
      gen_sec: 10.0
      ref_sec: 8.22
    '5':
      text: Azuiŋ, yɛ ta daŋ di sɛrɛɛ kyɛ ka a saŋ ba ta; kyɛ ka a Daana waabo naŋ ba ta sɛre.
      sbs: 0.6973
      gen_sec: 6.88
      ref_sec: 5.84
    '6':
      text: O naŋ da wa pɔge te a Azɔ poɔ, o da kpɛ la a gbori ka te gaa Mitelen.
      sbs: 0.6655
      gen_sec: 4.88
      ref_sec: 6.46
    '7':
      text: Ba da lɔɔ o la bare ka o sigi wa a teŋɛzu, a lɔɔ a o malekere meŋ poɔ o eŋɛ.
      sbs: 0.7005
      gen_sec: 5.76
      ref_sec: 6.06
    '8':
      text: Ka a toŋkpeɛne ama naŋ toŋ fo poɔ, da toŋ Sodom teŋɛ poɔ, o da na kyɛnɛ bebe la wa ta zenɛ.
      sbs: 0.7242
      gen_sec: 6.8
      ref_sec: 7.3
    '10':
      text: A banaŋ naŋ da zo yaare da yi yoɔrɔ la, a moɔlɔ a yelbiri.
      sbs: 0.7012
      gen_sec: 4.24
      ref_sec: 5.66
    '11':
      text: N poyɛŋ noba, nɔpaalaa naane ka N sɛgrɛ korɔ yɛ, kyɛ a nɔkoraa na yɛ naŋ da taa yi a piiluu
        saŋ la.
      sbs: 0.7069
      gen_sec: 9.36
      ref_sec: 8.0
    '12':
      text: ” Ka Yeezu da yeli, “Yɛ e ka a noba zeŋ teŋɛ.
      sbs: 0.6344
      gen_sec: 3.44
      ref_sec: 14.68
    '13':
      text: Wola pãã ka a weɛ soba na e a wɛkaareba ŋa?
      sbs: 0.7414
      gen_sec: 2.72
      ref_sec: 3.42
    '15':
      text: Ona la boɔrɔ ka neɛzaa nyɛ faabo a kyɛ wa baŋ a yelmeŋɛ.
      sbs: 0.7085
      gen_sec: 3.2
      ref_sec: 3.56
    '19':
      text: Pɔɔl Naŋ Puori A Filipae Deme Yaane.
      sbs: 0.6518
      gen_sec: 3.52
      ref_sec: 5.12
    '20':
      text: Bonso, ba da ba sage de a banaŋ zaa naŋ da wa yeli a O kuuni poɔ leɛ-iruu yɛlɛ ko ba.
      sbs: 0.6944
      gen_sec: 7.2
      ref_sec: 5.86
    '21':
      text: ” Ba da do la a sazu a zunzugri poɔ ka a ba dɔndɔnne da kaara ba.
      sbs: 0.6726
      gen_sec: 3.68
      ref_sec: 4.64
    '25':
      text: Kyɛ a ŋaa la ka yɛ mine da waa, kyɛ ka ba da pɛge yɛ.
      sbs: 0.6742
      gen_sec: 3.2
      ref_sec: 3.38
    '27':
      text: Ka fõõ meŋɛ soore o, fo na nyɛ la ka a yɛlɛ zaa te naŋ yeli kyaare ne o waa la a lɛ.
      sbs: 0.73
      gen_sec: 6.16
      ref_sec: 5.82
    '28':
      text: “Daana, a piiluu saŋ, fõõ la iri a teŋɛ.
      sbs: 0.684
      gen_sec: 3.6
      ref_sec: 3.28
    '29':
      text: Bebie ata puoriŋ, a Pɔɔl da boɔle la a Gyuumine nembɛrɛ naŋ da be a be lantaa.
      sbs: 0.6905
      gen_sec: 5.12
      ref_sec: 5.56
    '30':
      text: A Maleke Na Naŋ Taa A Ganlee Yɛlɛ.
      sbs: 0.809
      gen_sec: 2.64
      ref_sec: 3.8
    '31':
      text: Nɔmmo maŋ taa la teɛretɔroo ne yelzaa kyɛ maŋ di kannyiri ne yelzaa.
      sbs: 0.6752
      gen_sec: 5.92
      ref_sec: 3.94
    '32':
      text: N naŋ da wa nyɛ O, N da le vɔgle la muro O gbɛɛ puliŋ a waa ŋa neɛ naŋ kpi.
      sbs: 0.727
      gen_sec: 4.8
      ref_sec: 5.86
    '36':
      text: Lɛ la ka o da boɔle o a soore o, ‘Boŋ la ka N wono kyaare ne fo ya?
      sbs: 0.7262
      gen_sec: 5.76
      ref_sec: 4.14
    '37':
      text: Yɛ kaa a Izerayɛl biiri nyɛ; a banaŋ naŋ maŋ di a Naaŋmen bagmaale boma, ba ba maŋ waa a Naaŋmen
        bagmaalkuuri laŋne deme be?
      sbs: 0.7098
      gen_sec: 7.44
      ref_sec: 7.62
    '38':
      text: Kyɛ N na ko la a N dansediribe bayi naŋ su boɔre kparre kpeɛ̃õ ka ba yeli Ŋmen-yelmanna yelyelii
        bebie turi dɔgle kɔɔraayi ne lezaata.
      sbs: 0.6311
      gen_sec: 8.48
      ref_sec: 12.4
    '39':
      text: Te sɛgrɛ la a yɛlɛ ama ka ka a te kyelloo na paale.
      sbs: 0.6793
      gen_sec: 3.84
      ref_sec: 3.98
    '40':
      text: ka ba da de O do ne sazu ne puubu.
      sbs: 0.6087
      gen_sec: 3.44
      ref_sec: 4.84
    '44':
      text: 'Azuiŋ la ka ba yeli: “Gɔŋgbire, iri!'
      sbs: 0.744
      gen_sec: 3.52
      ref_sec: 3.24
    '46':
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.6473
      gen_sec: 6.64
      ref_sec: 5.94
    '47':
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.6794
      gen_sec: 7.04
      ref_sec: 14.94
    '48':
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.6431
      gen_sec: 8.88
      ref_sec: 6.46
    '51':
      text: Yeezu Naŋ Koŋ A Gyɛruzɛlɛm Teŋɛ Yɛlɛ.
      sbs: 0.6833
      gen_sec: 4.72
      ref_sec: 10.58
    '52':
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.6825
      gen_sec: 2.24
      ref_sec: 5.8
    '53':
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.6834
      gen_sec: 4.96
      ref_sec: 6.64
    '54':
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.6829
      gen_sec: 4.4
      ref_sec: 4.32
    '56':
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.561
      gen_sec: 5.92
      ref_sec: 7.02
    '57':
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.7007
      gen_sec: 5.76
      ref_sec: 5.42
    '58':
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.6787
      gen_sec: 7.92
      ref_sec: 7.12
    '61':
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.6838
      gen_sec: 6.8
      ref_sec: 5.42
    '62':
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.6778
      gen_sec: 3.76
      ref_sec: 3.44
    '63':
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.6181
      gen_sec: 5.04
      ref_sec: 4.66
    '64':
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.703
      gen_sec: 5.2
      ref_sec: 4.9
    '65':
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
      sbs: 0.7383
      gen_sec: 5.28
      ref_sec: 7.08
    '66':
      text: 'Lɛ la ka N da woŋ kɔkɔre kaŋ a saluoni poɔ ka o yele: “N noba, yɛ wa yi o poɔ.'
      sbs: 0.6719
      gen_sec: 7.44
      ref_sec: 6.26
    '67':
      text: O da iri arɛɛ la ka O sɔre, ka ba de a Ŋmen-yelmanna Azaaya gansɛgraa ko O.
      sbs: 0.6564
      gen_sec: 6.08
      ref_sec: 13.28
    '69':
      text: Neɛzaa ba nyɛ fo saanaa ka fo seŋ ne la kũũ be?
      sbs: 0.7159
      gen_sec: 2.8
      ref_sec: 3.28
    '70':
      text: A ŋaa la tori kyɛ pɛllɛ Naaŋmen a te Faara poɔ.
      sbs: 0.6079
      gen_sec: 4.32
      ref_sec: 3.26
    '71':
      text: Te da kpɛ la a gbori a be ka Arestaku naŋ da waa Masedoniya neɛ kyɛ da yi Tɛsalonika da beɛle
        te.
      sbs: 0.542
      gen_sec: 7.44
      ref_sec: 7.84
    '72':
      text: Pampana, nembuo mɔɔ la na e yɛ yelfaa, ka yɛneŋ wa kyerɛ ka yɛ e yɛlɛ naŋ e velaa?
      sbs: 0.6941
      gen_sec: 5.68
      ref_sec: 6.04
    '73':
      text: A soba na naŋ da faa te yi ne a dɔgɛɛ naŋ tɔgle kũũ, naŋ na kyɛnɛ faa te la.
      sbs: 0.6785
      gen_sec: 5.76
      ref_sec: 5.32
    '74':
      text: 'Ba sɛge la a begɛ gane poɔ: “Noba naŋ yele kɔkɔsaama.'
      sbs: 0.665
      gen_sec: 4.32
      ref_sec: 5.08
    '75':
      text: Biiri na kyiiri la ba dɔgreba a vɛŋ ka ba ko ba.
      sbs: 0.7043
      gen_sec: 5.92
      ref_sec: 3.32
    '76':
      text: Yɛ erɛ yɛlɛ ne yɛŋ a kyaara noba na naŋ ba poɔ yɛ poɔ, kyɛ maŋ vɛŋ ka wagre zaa yire tɔnɔ.
      sbs: 0.5736
      gen_sec: 6.72
      ref_sec: 6.24
    '77':
      text: A ŋaa zie la ka te baŋ ka a baaraa saŋ taɛ la.
      sbs: 0.7457
      gen_sec: 2.72
      ref_sec: 3.6
    '79':
      text: Kyɛ ba da de la soba na zaa yuori ba naŋ ba sɛge eŋ a nyɔvore gane poɔ lɔɔ eŋ a baa vũũ poɔ.
      sbs: 0.7051
      gen_sec: 7.44
      ref_sec: 9.34
    '80':
      text: A dɛndɛŋ soba da yi waɛ la, a wa yeli, ‘Daana, a fo warbiri yi la warbie pie tɔnɔ dɔgle o
        zu.
      sbs: 0.7481
      gen_sec: 7.28
      ref_sec: 7.52
    '81':
      text: 'A yelwulaa yɛ naŋ na nyɛ la ŋa: yɛ na nyɛ la bie ba naŋ pilli ne bipɛmɛ a gaale O donne bondi
        gbori poɔ.'
      sbs: 0.5946
      gen_sec: 9.76
      ref_sec: 8.0
    '82':
      text: Nemmeŋɛ maŋ iri la bonsonne yi o nabonsonne poɔ, ka nenfaa meŋ maŋ iri bonfaare yi o nabonfaare
        poɔ.
      sbs: 0.583
      gen_sec: 7.28
      ref_sec: 4.78
    '86':
      text: Bonso, neɛzaa koŋ la baŋ biŋ yiri pare zaa ka a onaŋ ba naŋ biŋ naane; a yiri pare ŋa la a
        Yeezu Kirista.
      sbs: 0.7266
      gen_sec: 9.68
      ref_sec: 8.06
    '87':
      text: A O eŋɛ la ka a yiri lamboe zaa mɛ lantaa a baa te leɛ Naaŋmen die naŋ e soŋ a be a Daana
        eŋɛ.
      sbs: 0.6868
      gen_sec: 9.12
      ref_sec: 6.34
    '88':
      text: ” Ka O yeli ko ba, “N nyɛ la Setaana ka o yi sazu a le teŋɛ a ŋa saa naŋ nyegre.
      sbs: 0.6979
      gen_sec: 5.44
      ref_sec: 5.76
    '89':
      text: Kyɛ deɛ yeli a yelbiri yoŋ, a vɛŋ ka N gbaŋgbaa nyɛ o sammo.
      sbs: 0.6776
      gen_sec: 4.08
      ref_sec: 4.36
    '90':
      text: ” O da kaara ba la polipoli a teɛre ka ba na ko o la bonkaŋ.
      sbs: 0.6312
      gen_sec: 3.12
      ref_sec: 3.88
    '93':
      text: Ka maa puori Naaŋmen ameseɛrɛ kyɛ di a bondirii, bonso ka ba na saana n yuori ne bondirii
        N naŋ puori Naaŋmen ameseɛrɛ kyɛ di?
      sbs: 0.6713
      gen_sec: 9.6
      ref_sec: 7.7
    '94':
      text: Saa nyegroo ane hooroo ane saa tannoo da yire la a nakogi zie, kyɛ ka fentele ayopoĩ da dire
        a nakogi niŋesogɔ.
      sbs: 0.6583
      gen_sec: 8.4
      ref_sec: 10.42
    '95':
      text: N da guoli yɛ la ane beroŋ, a da ba e bondi-tage, bonso, yɛ da naŋ ba ta bondi-tage diibu.
      sbs: 0.6605
      gen_sec: 8.64
      ref_sec: 7.16
    '96':
      text: Yuoni zaa poɔ a Yeezu dɔgrebɔ da maŋ gaa la Gyɛruzɛlɛm a te di a Ista tigri.
      sbs: 0.6854
      gen_sec: 5.52
      ref_sec: 5.88
    '97':
      text: Ka a naŋ wa seŋ ka N meŋ gaa, ba na beɛle ma la ka te gaa.
      sbs: 0.6703
      gen_sec: 4.16
      ref_sec: 3.68
    '99':
      text: Ba da teɛre ka O be la a noba poɔ ka ba zaa kyɛnɛ a sori poɔ.
      sbs: 0.7082
      gen_sec: 4.32
      ref_sec: 4.2
    '101':
      text: Neɛzaa kontoɔ̃ pigi ma sori ka N ta ire n meŋɛ yuori!
      sbs: 0.6824
      gen_sec: 5.2
      ref_sec: 3.5
    '103':
      text: Te baŋ ka te yi la kũũ poɔ a kpɛ nyɔvore poɔ, te naŋ nɔŋ taa zuiŋ.
      sbs: 0.6986
      gen_sec: 4.64
      ref_sec: 4.58
    '104':
      text: N baŋ ka a N gaabo puoriŋ, noba mine naŋ waa ŋa gboŋgbo-faare na wa kpɛ la yɛ poɔ, a koŋ bare
        a peere.
      sbs: 0.68
      gen_sec: 7.76
      ref_sec: 7.04
    '106':
      text: O da ba di bonzaa a bebie na zaa poɔ, kyɛ O naŋ da wa te baare, kɔŋ da kpɛ O la yaga.
      sbs: 0.6791
      gen_sec: 6.48
      ref_sec: 6.58
    '109':
      text: Ba na de a la lɔɔ bare.
      sbs: 0.6555
      gen_sec: 1.2
      ref_sec: 11.98
    '112':
      text: ” Ka O yeli, “Yɛ gu yɛmenne velaa ka ba ta wa bɛlle yɛ.
      sbs: 0.7265
      gen_sec: 4.0
      ref_sec: 3.4
    '113':
      text: Kyɛ a Yeezu naŋ da bale a O kyɛmmo poɔ la so ka O da wa zeŋ a bulee noɔreŋ.
      sbs: 0.7083
      gen_sec: 6.0
      ref_sec: 5.98
    '114':
      text: Ba suuri da iree la yaga ane ba naŋ da kanna a noba kyɛ moɔlɔ ka a Yeezu zie la ka kuuni leɛ-iruu
        be.
      sbs: 0.6789
      gen_sec: 7.68
      ref_sec: 7.64
    '115':
      text: Piita Ane Gyɔɔn Naŋ Are A Sɛrediribe Niŋesogɔ.
      sbs: 0.7584
      gen_sec: 4.16
      ref_sec: 3.4
    '116':
      text: Bonso, te waa la Naaŋmen tontonema naŋ laŋ tonɔ, yɛnee la a Naaŋmen weɛ, a Naaŋmen yiri.
      sbs: 0.736
      gen_sec: 6.32
      ref_sec: 7.14
    '121':
      text: Pɔlbile kaŋ yuori naŋ da di Yutaaku da zeŋ la a takoro noɔreŋ a gbire kyuuro, a Pɔɔl naŋ da
        yele yɛlɛ.
      sbs: 0.6725
      gen_sec: 7.6
      ref_sec: 7.18
    '124':
      text: ” Ka O yeli ko o, “Bonso ka fo soorɔ ma bon naŋ e soŋ yɛlɛ?
      sbs: 0.7011
      gen_sec: 4.16
      ref_sec: 4.1
    '125':
      text: A ŋaa zie la ka te maŋ baŋ a yelmeŋɛ vooroŋ ane a tuluu vooroŋ.
      sbs: 0.6745
      gen_sec: 4.56
      ref_sec: 5.28
    '126':
      text: N zoro la dabeɛ̃ ka a toma N naŋ toŋ ko yɛ na pɔɔ wa e la weɛlɛ.
      sbs: 0.7162
      gen_sec: 4.24
      ref_sec: 3.96
    '127':
      text: Kyɛ a Vooroŋ Soŋ la a dansedire, bonso a Vooroŋ Soŋ la a yelmeŋɛ.
      sbs: 0.7241
      gen_sec: 6.4
      ref_sec: 6.28
    '128':
      text: bonso, yɛ baŋ la a soba na naŋ bebe a yi a piiluu saŋ.
      sbs: 0.7297
      gen_sec: 4.72
      ref_sec: 4.44
    '130':
      text: ” Ka a noba da yeli sɔge, “Fo taa la sefaa!
      sbs: 0.6121
      gen_sec: 2.96
      ref_sec: 3.94
    '131':
      text: ” Kyɛ a Yeezu da taŋ la O noɔre a ba yeli yelzaa sɔge.
      sbs: 0.6596
      gen_sec: 3.6
      ref_sec: 7.12
    '133':
      text: Bonso, N dire la o danseɛ ka o toŋ la toma yaga ko yɛ ane banaŋ naŋ be Laodisiya teŋɛ ane
        Hɛrapoli teŋɛ poɔ.
      sbs: 0.7067
      gen_sec: 11.28
      ref_sec: 9.18
    '134':
      text: ” A lɛ la ka ba da yi moɔle ka neɛzaa leɛ o eebo a yi o yelbebe poɔ.
      sbs: 0.7151
      gen_sec: 4.4
      ref_sec: 4.52
    '135':
      text: ” Ba da yeli la a ŋaa ka ba e O nyɛ, a pãã na toɔ̃ nyɛ saanaa tuo O.
      sbs: 0.7053
      gen_sec: 4.56
      ref_sec: 5.6
    '137':
      text: Soba na zaa naŋ yeli, “N baŋ O la,” kyɛ ba sagra a O nɔɛ, waa la zirŋmaara, ka a yelmeŋɛ ba
        kye o zie.
      sbs: 0.7218
      gen_sec: 7.2
      ref_sec: 8.44
    '138':
      text: “Pampana ŋa N teɛroŋ zaa gyɛrɛɛ la.
      sbs: 0.6993
      gen_sec: 2.8
      ref_sec: 3.38
    '140':
      text: A Daana la na wa e ka yɛlɛ naŋ sɔgle lige poɔ sãã veɛloŋ ka bon naŋ be sukyiri poɔ meŋ sãã.
      sbs: 0.6842
      gen_sec: 7.12
      ref_sec: 7.44
    '141':
      text: A Yeezu da yi la a be a wa O meŋɛ teŋɛ poɔ, ka a O potuuribo da tu O wa.
      sbs: 0.6469
      gen_sec: 5.12
      ref_sec: 4.6
    '142':
      text: N na iri la a gaa a N saa zie a te yeli ko o, “N saa, N eɛɛ yelbieri a kyaare Naaŋmen ane
        fõõ.
      sbs: 0.7132
      gen_sec: 8.32
      ref_sec: 8.56
    '143':
      text: Ba da ko o la sori meŋ ka o zɔɔ ne a nensonne a toɔ̃ ba.
      sbs: 0.65
      gen_sec: 3.92
      ref_sec: 3.52
    '144':
      text: 'Azuiŋ, yɛ ko a teŋɛzu yɛlɛ zaa naŋ be yɛ enneŋ: peɛ̃mo toma, yeldɛgɛ, vɔlfaare, yelfaare
        boɔbo ane bombɔ-gaŋne .'
      sbs: 0.7331
      gen_sec: 11.04
      ref_sec: 10.3
    '149':
      text: A banaŋ naŋ puoro a wɛdoŋɔ ane a o teebo ane neɛzaa naŋ de a o yuori ŋmaaroŋ daŋ koŋ nyɛ pɛnnoo
        ŋmenaa bee tensogɔ.
      sbs: 0.6501
      gen_sec: 9.76
      ref_sec: 10.84
    '150':
      text: Maata la da kaara a bondirii yɛlɛ, ka Laazoro da e a neɛ na kaŋ naŋ da laŋ zeŋ a diibu zie
        ne a Yeezu.
      sbs: 0.6854
      gen_sec: 6.96
      ref_sec: 7.98
    '151':
      text: fo naŋ nare biŋ a andonɛɛ zaa niŋesogɔ.
      sbs: 0.5787
      gen_sec: 10.4
      ref_sec: 3.0
    '153':
      text: N erɛ la ama zaa a Ŋmen-yelnoore zuiŋ, ka ka N na toɔ̃ nyɛ a yelnoore maaloo.
      sbs: 0.572
      gen_sec: 10.16
      ref_sec: 4.82
    '154':
      text: O da laŋ kpeɛrɛ ne la a wɛdonne; ka a malekere da kaara O zie.
      sbs: 0.7243
      gen_sec: 5.6
      ref_sec: 4.12
    '156':
      text: A Yeezu da zɛge la O zu a nyɛ bondaanema naŋ eŋnɛ ba kyɔɔtaare a kyɔɔtaare daga poɔ.
      sbs: 0.6971
      gen_sec: 5.04
      ref_sec: 6.0
    '157':
      text: Yɛ nyɛ, N tonɔ yɛ la aŋa pebilii ka yɛ yi te kpɛ gboŋgboe poɔ.
      sbs: 0.7158
      gen_sec: 4.24
      ref_sec: 4.98
    '158':
      text: Yɛ ta erɛ ka a Naaŋmen Vooroŋ Soŋ poɔ saana, Ona la a ŋmaaroŋ Naaŋmen naŋ eŋ yɛ a kyɛllɛ ne
        a faabo bebiri.
      sbs: 0.7038
      gen_sec: 8.08
      ref_sec: 6.72
    '159':
      text: N sɔre la a fo potuuribo ka ba digi a sefaa ka o yi, kyɛ ka ba digi fãã.
      sbs: 0.6311
      gen_sec: 5.04
      ref_sec: 6.1
    '160':
      text: Bonso, a Laazoro kuuni poɔ leɛ-iruu yɛlɛ la so ka a Gyuumine yaga da sagra derɛ a Yeezu yɛlɛ
        kyɛ zagra a ba yɛlɛ.
      sbs: 0.6943
      gen_sec: 10.08
      ref_sec: 8.62
    '165':
      text: Leɛ-teɛre nyɛ bonna naŋ da e ka fo le; leɛ fo eebo a kyɛ tonɔ a toma na fo naŋ da tonɔ a dɛndɛŋ
        saŋ.
      sbs: 0.6517
      gen_sec: 8.24
      ref_sec: 7.78
    '170':
      text: ka turi pie ne turi ayi da yi a Bɛŋgyamen bale poɔ ka ba da eŋ a ŋmaaroŋ.
      sbs: 0.6847
      gen_sec: 5.6
      ref_sec: 6.14
    '173':
      text: A ba seŋ ka o e Kiristabi-paalaa, ka lɛ naane, o na baŋ paale ne la pɔloo a le a sebɛlbɛllɛ
        dɔgroŋ poɔ.
      sbs: 0.6852
      gen_sec: 8.56
      ref_sec: 7.02
    '174':
      text: Ka Yeezu da soore a bege baŋnema ane a Faraziimine, “Sori bebe la ka ba saŋ baala a pɛnnoo
        bebiri daare bee sori kyebe.
      sbs: 0.7011
      gen_sec: 8.16
      ref_sec: 9.08
    '175':
      text: Ona la vɛŋ ka te baŋ lɛ yɛ naŋ taa nɔmmo a Vooroŋ Soŋ poɔ.
      sbs: 0.676
      gen_sec: 3.76
      ref_sec: 3.9
    '176':
      text: Yɛ naŋ sage tu a yelmeŋɛ pampana, yɛ pɛge la a yɛ seere ka ka yɛ na taa nɔmmo naŋ sereŋ e
        meŋɛ.
      sbs: 0.6988
      gen_sec: 6.88
      ref_sec: 8.06
    '177':
      text: Kyɛ a Soŋ Soba da sɔ yɛ la kããsoŋ, ka yɛ zaa taa yelbammo.
      sbs: 0.5913
      gen_sec: 6.8
      ref_sec: 4.56
    '178':
      text: ka turi pie ne turi ayi da yi a Manaasɛ bale poɔ.
      sbs: 0.7231
      gen_sec: 3.76
      ref_sec: 4.14
    '179':
      text: Yiri na zaa poɔ yɛ naŋ wa kpɛ, yɛ daŋ yeli, ‘Ka maaroŋ be a yiri ŋa poɔ!
      sbs: 0.7316
      gen_sec: 4.4
      ref_sec: 5.22
    '181':
      text: Bee boŋ la ka Kiristabie ne neɛ naŋ ba sage de a Kirista yɛlɛ laŋ?
      sbs: 0.6309
      gen_sec: 4.16
      ref_sec: 3.58
    '182':
      text: Yɛ ta wa poɔrɔ sazu, bonso, o e la Naaŋmen nakogi, bee a poɔrɔ a teŋɛ, bonso, o meŋ waa la
        a Naaŋmen gbɛɛ-bimmu zie.
      sbs: 0.7365
      gen_sec: 8.48
      ref_sec: 11.22
    '184':
      text: Te da taa la yɛ vɔlaa kyɛ da nɔnɔ yaga ka te wa ka te nyɛ taa nimisogre.
      sbs: 0.6159
      gen_sec: 6.24
      ref_sec: 4.98
    '187':
      text: A gaŋ a zaa, yɛ de nɔmmo su pɔge yɛmenne, ona la maŋ leŋ boma zaa lantaa velaa zaa.
      sbs: 0.731
      gen_sec: 6.32
      ref_sec: 5.7
    '189':
      text: Pampana ŋa, N de yɛ la ko Naaŋmen ane a Naaŋmen yelbiri garaaseɛ.
      sbs: 0.6664
      gen_sec: 4.72
      ref_sec: 4.66
    '190':
      text: Ba naŋ da ba nyɛ O, ba da leɛ gaa la a Gyɛruzɛlɛm ka ba te bɔ O.
      sbs: 0.6468
      gen_sec: 5.04
      ref_sec: 4.26
    '191':
      text: ” Kyɛ ba da ba baŋ a yɛlɛ O naŋ yeli ko ba tɛgɛ.
      sbs: 0.6731
      gen_sec: 2.64
      ref_sec: 8.26
    '192':
      text: ” A yeli ŋa da wa ne la tage taa, ka nɔkpeɛne da kpɛ a Pɔɔl ane Banabase ane a noba na sogɔŋ.
      sbs: 0.6403
      gen_sec: 6.96
      ref_sec: 7.4
    '195':
      text: Azuiŋ, yɛ baŋ ne a, a ta inni ka yuomo ata tensogɔ bee ŋmenaa, ka N ba nage ka N kpãã yɛ ane
        nentaŋ.
      sbs: 0.6622
      gen_sec: 6.64
      ref_sec: 8.14
    '197':
      text: Te nyɛ la dɔgɛɛ boorɔ zaa, kyɛ naŋ voorɔ; ka te teɛroŋ gyɛre, kyɛ ka te nuuri ba yoɔrɔ.
      sbs: 0.6819
      gen_sec: 6.96
      ref_sec: 6.04
    '198':
      text: N na boɔrɔ la ka yɛ zaa yele kɔkɔsaama, kyɛ a gaŋ a zaa N na boɔrɔ la ka yɛ yele Ŋmen-yelmanna
        yelyelii.
      sbs: 0.6618
      gen_sec: 7.92
      ref_sec: 6.62
    '199':
      text: Enyaabo zaa daŋ ba pɔge yɛ naŋ daŋ ba pɔge nensaala.
      sbs: 0.6744
      gen_sec: 4.48
      ref_sec: 3.24
    '202':
      text: A banaŋ N naŋ nɔŋ la ka N maŋ wuli kyɛ tage ba tobo.
      sbs: 0.6166
      gen_sec: 3.68
      ref_sec: 3.16
    '203':
      text: A Naaŋmen da di la a Davil danseɛ a yeli, ‘N nyɛ la Davil, a Gyɛse bidɔɔ, ka o waa N yɛŋ neɛ.
      sbs: 0.6404
      gen_sec: 6.4
      ref_sec: 6.96
    '204':
      text: Lɛ la ka a bie da yeli ko a o saa, ‘N saa, N sãã la Naaŋmen poɔ, a sãã fo meŋ poɔ.
      sbs: 0.7316
      gen_sec: 6.56
      ref_sec: 6.42
    '205':
      text: A bama moɔlɔ la a Kirista yɛlɛ ne nɔmmo, a baŋ ka ba eŋ ma la a kyɛ N naŋ zɔɔrɔ a Ŋmen-yelnoore
        zɔɔre zuiŋ.
      sbs: 0.7083
      gen_sec: 7.84
      ref_sec: 7.48
    '207':
      text: Ka o da boɔle a gbaŋgbaa kaŋ a soore o bonna naŋ erɛ.
      sbs: 0.6111
      gen_sec: 3.76
      ref_sec: 3.9
    '208':
      text: Yeezu Naŋ Saŋ Neɛ Kaŋ Ba Naŋ Dɔge Ne Zɔnnoŋ.
      sbs: 0.723
      gen_sec: 5.12
      ref_sec: 3.56
    '209':
      text: ka turi pie ne turi ayi da yi a Nafetali bale poɔ.
      sbs: 0.7355
      gen_sec: 4.48
      ref_sec: 4.0
    '211':
      text: Moozul da yelee la, ‘A Daana a yɛ Naaŋmen na iri la Ŋmen-yelmanna a yɛ meŋɛ noba poɔ ka o
        waa aŋa maa.
      sbs: 0.7185
      gen_sec: 8.4
      ref_sec: 7.9
    '212':
      text: “Yuomo lezaayi puoriŋ, maleke da wuli la o meŋɛ ko a Moozul vũũ naŋ da dire tuu kaŋ poɔ a
        Sanae taŋ wɛgyɛŋ poɔ.
      sbs: 0.6949
      gen_sec: 8.88
      ref_sec: 9.28
    '214':
      text: 'Kyɛ fo taa la garebanyɛ ne a yeli ŋa: fo kyiire la a Nikoletan deme tontonne na N meŋ naŋ
        kyiire.'
      sbs: 0.6479
      gen_sec: 7.12
      ref_sec: 6.68
    '215':
      text: Pampana, a malekere ayopoĩ na naŋ da taa a eelɛ ayopoĩ da narɛɛ la ka ba peɛle a eelɛ.
      sbs: 0.697
      gen_sec: 6.88
      ref_sec: 7.48
    '217':
      text: ” A Yeezu naŋ da woŋ a ŋaa, O da yeli ko la a dɔɔ, “Yelyeni kaŋ la kyɛre ka fo ba taa.
      sbs: 0.6281
      gen_sec: 21.92
      ref_sec: 6.44
    '219':
      text: ’ Lɛ la ka a saa da de a o boma poŋ a o biiri na bayi.
      sbs: 0.7501
      gen_sec: 3.04
      ref_sec: 3.54
    '220':
      text: yɛ ta dare a yɛ sukyie aŋa lɛ a yɛ sããkommine naŋ da zɔɔ ne Naaŋmen.
      sbs: 0.6767
      gen_sec: 4.32
      ref_sec: 5.5
    '221':
      text: Ka Yeezu yeli, “Pɔlbile, maa yeli ko fo, vaa-iri!
      sbs: 0.4681
      gen_sec: 12.8
      ref_sec: 4.68
    '224':
      text: A yelwolɔ naŋ waana zuiŋ, N teɛre ka a na soma la ka neɛzaa naŋ kyɛnɛ waa lɛ zaa o naŋ da
        waa.
      sbs: 0.6173
      gen_sec: 7.2
      ref_sec: 7.48
    '225':
      text: Maa Gyɔɔn la a soba na naŋ da woŋ kyɛ nyɛ a yɛlɛ ama.
      sbs: 0.6748
      gen_sec: 2.96
      ref_sec: 10.56
    '226':
      text: Ona la e ka te taa faŋ a waa a nɔpaalaa tontonema.
      sbs: 0.7168
      gen_sec: 2.32
      ref_sec: 3.28
    '227':
      text: A yɛlɛ na eŋ naŋ kyɛre, N na wuli yɛ la ka maa wa wa yɛ zie.
      sbs: 0.7071
      gen_sec: 4.88
      ref_sec: 6.74
    '228':
      text: a zɔɔrɔ ne a Daana ane a O Mɛzaaya.
      sbs: 0.7199
      gen_sec: 3.6
      ref_sec: 3.3
    '229':
      text: Yɛ nyɛ nɔmmo na tɔ a Saa naŋ nɔŋ te, a e ka ba boɔlɔ te Naaŋmen bibiiri; ka te sereŋ waa a
        lɛ.
      sbs: 0.6956
      gen_sec: 7.36
      ref_sec: 7.2
    '230':
      text: O da gaa te de la a gane yi a soba na naŋ da zeŋ a nakogi zu nuduluŋ poɔ.
      sbs: 0.6317
      gen_sec: 6.96
      ref_sec: 4.9
    '231':
      text: Yɛ saŋna a baalba naŋ be a be, kyɛ yeli ko ba, ‘A Naaŋmen naaloŋ wa peɛle yɛ la.
      sbs: 0.6918
      gen_sec: 8.0
      ref_sec: 5.5
    '233':
      text: Kyɛ tɔnɔ na zaa N naŋ da nyɛ, N de a la ka a waa zaglaa a Kirista zuiŋ.
      sbs: 0.636
      gen_sec: 5.44
      ref_sec: 5.24
    '234':
      text: Kyɛ soba na zaa naŋ ba sage de a yelbiri na wɛ la.
      sbs: 0.7343
      gen_sec: 3.12
      ref_sec: 3.1
    '235':
      text: A ŋa la a n noɔre N naŋ wullo a puoruu laŋne yie zaa poore.
      sbs: 0.6643
      gen_sec: 3.92
      ref_sec: 3.88
    '236':
      text: 'Serɛzaa ka N yele korɔ yɛ: Gyɔɔn Bati e la kpoŋ gaŋ banaŋ zaa pɔgeba naŋ dɔge a teŋɛzu.'
      sbs: 0.6695
      gen_sec: 7.2
      ref_sec: 6.58
    '237':
      text: Bonso, dɔgroŋ la so ka dabeɛ̃ bebe, kyɛ neɛ na zaa naŋ zoro dabeɛ̃ ba taa nɔmmo naŋ e soŋ.
      sbs: 0.751
      gen_sec: 6.32
      ref_sec: 7.54
    '238':
      text: Azuiŋ a ferɛɛ la ka te maaleŋ kyɛlle velaa bon te naŋ da woŋ, ka te ta wa sare yi a poɔ.
      sbs: 0.6356
      gen_sec: 5.76
      ref_sec: 7.8
    '239':
      text: ” Ka O yeli sɔge ba, “Nembuo la N ma ane N yɔɔmine?
      sbs: 0.6505
      gen_sec: 4.96
      ref_sec: 7.36
    '240':
      text: A yɛlɛ ama da eɛɛ la ka a e yelwulaa ko te, ka ka te na ta boɔrɔ yelfaare aŋa ba naŋ da e
        lɛ.
      sbs: 0.7128
      gen_sec: 6.72
      ref_sec: 6.92
    '241':
      text: Kyɛ ka o naŋ wa poɔ̃, o maŋ buli la a eŋ bie yaga.
      sbs: 0.7106
      gen_sec: 3.28
      ref_sec: 3.5
    '242':
      text: A ŋaa la vɛŋ ka te ba zoro dabeɛ̃ a Naaŋmen niŋeŋ a yi a Kirista zuiŋ.
      sbs: 0.6433
      gen_sec: 4.8
      ref_sec: 4.86
    '243':
      text: Kyɛ Pɔɔl da ba boɔrɔ ka o taa neɛ naŋ da zo kyɛ bare ba Pamfiliya poɔ, a ba tu ba a toŋ a
        toma.
      sbs: 0.713
      gen_sec: 7.44
      ref_sec: 7.42
    '244':
      text: Kyɛ ŋmenaa naŋ da wa do, a bombulo da zoɔlɛɛ la, a ko, a naŋ da ba taa nyaga zuiŋ.
      sbs: 0.6899
      gen_sec: 5.6
      ref_sec: 6.62
    '245':
      text: A weɛ soba da naŋ taa la neŋyenaa kaŋ, a o poyɛŋ bie.
      sbs: 0.6363
      gen_sec: 3.6
      ref_sec: 3.66
    '246':
      text: N naŋ da wa nyɛ o, N noɔre da maaɛ la yaga.
      sbs: 0.7252
      gen_sec: 3.2
      ref_sec: 3.1
    '247':
      text: Dabeɛ̃ ne nɔmaa da kpɛ ba la ne a yeli ŋa naŋ da e a gbɛre ŋa zie.
      sbs: 0.6491
      gen_sec: 4.32
      ref_sec: 6.38
    '250':
      text: A Fɛstu pãã da tere la noɔre, ka ba taa a Pɔɔl wa ne.
      sbs: 0.6435
      gen_sec: 4.32
      ref_sec: 3.48
    '252':
      text: Pampana ŋa, vi ba erɛ ma, ka maa gba erɛ pɔloo yaga ne a kpeɛ̃õ a Daana naŋ tere ka N de maale
        ne yɛ.
      sbs: 0.657
      gen_sec: 9.92
      ref_sec: 6.86
    '253':
      text: ” Ka Yeezu da yeli ko o, “Yelmeŋɛ ka N yele korɔ yɛ.
      sbs: 0.682
      gen_sec: 4.16
      ref_sec: 9.28
    '256':
      text: Yɛ vɛŋ ka neɛzaa maŋ sigre o meŋɛ korɔ a teŋɛzu wederebɛ; bonso, wederɛ zaa ba kyebe ka Naaŋmen
        zie naane ka o yi.
      sbs: 0.6823
      gen_sec: 10.48
      ref_sec: 8.34
    '257':
      text: Yelmeŋɛ zaa la ka N yele korɔ yɛ, ka kabiri ba le teŋɛ a poɔ̃, o maŋ e la kabi-yeni.
      sbs: 0.6979
      gen_sec: 5.6
      ref_sec: 5.78
    '260':
      text: Ka maa pãã la bee ka bana la, a yeli ŋa la ka te moɔle ka yɛ da sage de.
      sbs: 0.6789
      gen_sec: 4.32
      ref_sec: 5.08
    '262':
      text: O eŋɛ da kɔɔ guree la, ka o da kontoɔ̃ dɔle o meŋɛ.
      sbs: 0.6902
      gen_sec: 5.6
      ref_sec: 3.74
    '263':
      text: Bonso, a ba seŋ ka o voorɔ.
      sbs: 0.6218
      gen_sec: 2.16
      ref_sec: 8.1
    '264':
      text: 'Bonso, o yeli la o poɔŋ: ‘N dire la naaloŋ aŋa pɔgenaa; N ba waa pɔgekoɔre.'
      sbs: 0.6159
      gen_sec: 6.8
      ref_sec: 7.4
    '265':
      text: Kyɛ a Yeezu da ba yeli ko o ka o koŋ kpi.
      sbs: 0.6203
      gen_sec: 1.92
      ref_sec: 8.18
    '269':
      text: Neɛ kaŋ da soore O la, “Daana, noba belaa la na nyɛ faabo be?
      sbs: 0.7196
      gen_sec: 4.72
      ref_sec: 5.22
    '270':
      text: A apostoliimine ane a nembɛrɛ da laŋ la taa ka ba kaa a yeli ŋa nyɛ.
      sbs: 0.6747
      gen_sec: 5.36
      ref_sec: 5.22
    '271':
      text: bonso, fo yɔɔ la a fo tontonema, a Ŋmen-yelmanneba.
      sbs: 0.6248
      gen_sec: 3.12
      ref_sec: 3.84
    '272':
      text: Yɛ ta de faaloŋ yɔɔ ne neɛzaa naŋ e yɛ faaloŋ; kyɛ yɛ maŋ moɔrɔ ka yɛ erɛ yɛlɛ naŋ soma noba
        zaa zie.
      sbs: 0.7182
      gen_sec: 7.52
      ref_sec: 7.24
    '273':
      text: O ba kye kyɛ, ba eɛɛ la ka O leɛ-iri yi a kuuni poɔ.
      sbs: 0.6632
      gen_sec: 4.64
      ref_sec: 4.26
    '274':
      text: Bonso, ba sɛge la a Moozul begɛ poɔ, “Ta leŋ a naadɛre naŋ ŋmeɛrɛ kyi noɔre.
      sbs: 0.6987
      gen_sec: 5.2
      ref_sec: 6.58
    '276':
      text: N maŋ leŋ la noɔre gbɛre boyi daa gbuli zaa poɔ.
      sbs: 0.7088
      gen_sec: 3.76
      ref_sec: 3.1
    '277':
      text: ” A noba naŋ da bebe da ta ŋa turi anuu.
      sbs: 0.6539
      gen_sec: 3.12
      ref_sec: 3.76
    '278':
      text: 'Ba maŋ vɔge la a ba nazupile biŋ a nakogi niŋesogɔ, kyɛ yiele: “Te Daana Naaŋmen, fo seŋ
        ne la.'
      sbs: 0.6731
      gen_sec: 6.48
      ref_sec: 7.9
    '279':
      text: 'Kyɛ a danseɛ la ŋa: Naaŋmen ko te la nyɔvore naŋ ba taa baaraa, ka a nyɔvore ŋa be a O Bie
        poɔ.'
      sbs: 0.7054
      gen_sec: 7.44
      ref_sec: 6.84
    '281':
      text: A pɔge da su la kpareze-velaa, ka o lenni ne salema ane lɛɛbie ane kusi-veɛle.
      sbs: 0.7499
      gen_sec: 6.48
      ref_sec: 6.68
    '282':
      text: A zenɛ ŋa, ba dɔge la a yɛ Faara a Davil teŋkpoŋ poɔ, Ona la a Mɛzaaya, a Daana.
      sbs: 0.6392
      gen_sec: 6.8
      ref_sec: 6.9
    '284':
      text: Azuiŋ ba da ŋmaa la kpaakpaa vaare, a yi ka ba te tuori O.
      sbs: 0.6746
      gen_sec: 3.28
      ref_sec: 4.78
    '286':
      text: Amine meŋ da le la tɛnnoɔ poɔ, a buli, a maale eŋ bie kɔɔ.
      sbs: 0.7115
      gen_sec: 6.72
      ref_sec: 4.96
    '287':
      text: Ba da ba puori a wɛdoŋɔ bee a o teebo, a da ba de a o ŋmaaroŋ a ba gberi bee ba nuuri eŋɛ.
      sbs: 0.7295
      gen_sec: 8.0
      ref_sec: 7.26
    '288':
      text: Ba maŋ erɛ la a lɛ a na de bon naŋ maŋ wɛ, kyɛ tenee deni ba weɛrɛ.
      sbs: 0.7112
      gen_sec: 6.4
      ref_sec: 4.84
    '289':
      text: Ka fõõ wa to fo yɔɔ bee fo yɔɔpuulee, a seŋ ka ba zeŋ ne fo nembɛrɛ niŋesogɔ.
      sbs: 0.6557
      gen_sec: 5.84
      ref_sec: 6.08
    '290':
      text: Naboma Naŋ Be Yagraa Dogre Poɔ.
      sbs: 0.6044
      gen_sec: 2.16
      ref_sec: 4.54
    '292':
      text: Lɛ la ka o toŋ ka ba te ko bibiiri na zaa naŋ ta yuomo ayi kyɛ sigre, a Bɛtelɛhɛm ane o tembilii
        poore.
      sbs: 0.7104
      gen_sec: 8.96
      ref_sec: 8.1
    '293':
      text: A o soba ta boɔrɔ ka o sɔglɔ a dɛgre iruu ŋmaaroŋ.
      sbs: 0.6567
      gen_sec: 4.48
      ref_sec: 3.92
    '294':
      text: Lɛ la ka Yeezu da toŋ Piita ane Gyɔɔn, a yele, “Yɛ gaa te nare a Ista tigri bondiraa ka te
        di.
      sbs: 0.6359
      gen_sec: 7.68
      ref_sec: 7.38
    '295':
      text: ” Ba naŋ da wa gbole kaa, ba ba la nyɛ neɛzaa ka a Yeezu yoŋ naane.
      sbs: 0.6543
      gen_sec: 4.0
      ref_sec: 4.52
    '298':
      text: O naŋ da wa de a suobu baare, o da be la a Filipi zie tegitegilɛ.
      sbs: 0.6916
      gen_sec: 4.16
      ref_sec: 4.48
    '299':
      text: Fo ba ŋmaa a zirii ŋa ko te kyɛ Naaŋmen la ka fo ŋmaa tere.
      sbs: 0.7079
      gen_sec: 3.36
      ref_sec: 3.62
  score: 0.6783
  partial: true
- model: Google/gemini-3.1-flash-tts-preview
  sbs: 0.6245
  num_scored: 199
  uses_reference: false
  entries:
    '0':
      text: Ka maa bare ba ne a kɔŋ ka ba kulo, ba na yĩĩe la a sobiriŋ, bonso, ba mine yi la tentɔbɔ
        a wa.
      sbs: 0.5826
      gen_sec: 9.52
      ref_sec: 7.66
    '2':
      text: A Yeezu naŋ da gɛrɛ Gyɛruzɛlɛm, O da kpɛ la a teŋkponni ane a tembilii poore a kanna a noba
        gɛrɛ.
      sbs: 0.623
      gen_sec: 7.56
      ref_sec: 7.54
    '3':
      text: A Naaŋmen Bagmaale Wederebɛ Nembɛrɛ Zusoba Naŋ Soore Yeezu Soorebie.
      sbs: 0.5727
      gen_sec: 8.24
      ref_sec: 8.22
    '5':
      text: Azuiŋ, yɛ ta daŋ di sɛrɛɛ kyɛ ka a saŋ ba ta; kyɛ ka a Daana waabo naŋ ba ta sɛre.
      sbs: 0.6151
      gen_sec: 7.44
      ref_sec: 5.84
    '6':
      text: O naŋ da wa pɔge te a Azɔ poɔ, o da kpɛ la a gbori ka te gaa Mitelen.
      sbs: 0.604
      gen_sec: 6.4
      ref_sec: 6.46
    '7':
      text: Ba da lɔɔ o la bare ka o sigi wa a teŋɛzu, a lɔɔ a o malekere meŋ poɔ o eŋɛ.
      sbs: 0.6425
      gen_sec: 7.32
      ref_sec: 6.06
    '8':
      text: Ka a toŋkpeɛne ama naŋ toŋ fo poɔ, da toŋ Sodom teŋɛ poɔ, o da na kyɛnɛ bebe la wa ta zenɛ.
      sbs: 0.6403
      gen_sec: 7.32
      ref_sec: 7.3
    '10':
      text: A banaŋ naŋ da zo yaare da yi yoɔrɔ la, a moɔlɔ a yelbiri.
      sbs: 0.6473
      gen_sec: 5.32
      ref_sec: 5.66
    '11':
      text: N poyɛŋ noba, nɔpaalaa naane ka N sɛgrɛ korɔ yɛ, kyɛ a nɔkoraa na yɛ naŋ da taa yi a piiluu
        saŋ la.
      sbs: 0.66
      gen_sec: 8.32
      ref_sec: 8.0
    '12':
      text: ” Ka Yeezu da yeli, “Yɛ e ka a noba zeŋ teŋɛ.
      sbs: 0.6144
      gen_sec: 4.16
      ref_sec: 14.68
    '13':
      text: Wola pãã ka a weɛ soba na e a wɛkaareba ŋa?
      sbs: 0.6623
      gen_sec: 3.92
      ref_sec: 3.42
    '15':
      text: Ona la boɔrɔ ka neɛzaa nyɛ faabo a kyɛ wa baŋ a yelmeŋɛ.
      sbs: 0.6397
      gen_sec: 5.24
      ref_sec: 3.56
    '19':
      text: Pɔɔl Naŋ Puori A Filipae Deme Yaane.
      sbs: 0.6349
      gen_sec: 4.08
      ref_sec: 5.12
    '20':
      text: Bonso, ba da ba sage de a banaŋ zaa naŋ da wa yeli a O kuuni poɔ leɛ-iruu yɛlɛ ko ba.
      sbs: 0.6065
      gen_sec: 7.68
      ref_sec: 5.86
    '21':
      text: ” Ba da do la a sazu a zunzugri poɔ ka a ba dɔndɔnne da kaara ba.
      sbs: 0.6013
      gen_sec: 5.52
      ref_sec: 4.64
    '27':
      text: Ka fõõ meŋɛ soore o, fo na nyɛ la ka a yɛlɛ zaa te naŋ yeli kyaare ne o waa la a lɛ.
      sbs: 0.6178
      gen_sec: 6.68
      ref_sec: 5.82
    '28':
      text: “Daana, a piiluu saŋ, fõõ la iri a teŋɛ.
      sbs: 0.5897
      gen_sec: 4.44
      ref_sec: 3.28
    '29':
      text: Bebie ata puoriŋ, a Pɔɔl da boɔle la a Gyuumine nembɛrɛ naŋ da be a be lantaa.
      sbs: 0.5995
      gen_sec: 6.76
      ref_sec: 5.56
    '30':
      text: A Maleke Na Naŋ Taa A Ganlee Yɛlɛ.
      sbs: 0.6287
      gen_sec: 3.68
      ref_sec: 3.8
    '31':
      text: Nɔmmo maŋ taa la teɛretɔroo ne yelzaa kyɛ maŋ di kannyiri ne yelzaa.
      sbs: 0.6218
      gen_sec: 5.6
      ref_sec: 3.94
    '32':
      text: N naŋ da wa nyɛ O, N da le vɔgle la muro O gbɛɛ puliŋ a waa ŋa neɛ naŋ kpi.
      sbs: 0.6631
      gen_sec: 6.52
      ref_sec: 5.86
    '36':
      text: Lɛ la ka o da boɔle o a soore o, ‘Boŋ la ka N wono kyaare ne fo ya?
      sbs: 0.6387
      gen_sec: 6.04
      ref_sec: 4.14
    '37':
      text: Yɛ kaa a Izerayɛl biiri nyɛ; a banaŋ naŋ maŋ di a Naaŋmen bagmaale boma, ba ba maŋ waa a Naaŋmen
        bagmaalkuuri laŋne deme be?
      sbs: 0.6587
      gen_sec: 10.0
      ref_sec: 7.62
    '38':
      text: Kyɛ N na ko la a N dansediribe bayi naŋ su boɔre kparre kpeɛ̃õ ka ba yeli Ŋmen-yelmanna yelyelii
        bebie turi dɔgle kɔɔraayi ne lezaata.
      sbs: 0.5494
      gen_sec: 12.56
      ref_sec: 12.4
    '39':
      text: Te sɛgrɛ la a yɛlɛ ama ka ka a te kyelloo na paale.
      sbs: 0.6594
      gen_sec: 5.04
      ref_sec: 3.98
    '40':
      text: ka ba da de O do ne sazu ne puubu.
      sbs: 0.6354
      gen_sec: 3.32
      ref_sec: 4.84
    '44':
      text: 'Azuiŋ la ka ba yeli: “Gɔŋgbire, iri!'
      sbs: 0.7003
      gen_sec: 4.48
      ref_sec: 3.24
    '46':
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.6059
      gen_sec: 6.56
      ref_sec: 5.94
    '47':
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.5976
      gen_sec: 8.4
      ref_sec: 14.94
    '48':
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.5882
      gen_sec: 9.12
      ref_sec: 6.46
    '51':
      text: Yeezu Naŋ Koŋ A Gyɛruzɛlɛm Teŋɛ Yɛlɛ.
      sbs: 0.645
      gen_sec: 4.12
      ref_sec: 10.58
    '52':
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.585
      gen_sec: 3.12
      ref_sec: 5.8
    '53':
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.617
      gen_sec: 6.84
      ref_sec: 6.64
    '54':
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.6546
      gen_sec: 5.64
      ref_sec: 4.32
    '56':
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.6191
      gen_sec: 7.44
      ref_sec: 7.02
    '57':
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.6264
      gen_sec: 8.76
      ref_sec: 5.42
    '58':
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.645
      gen_sec: 9.56
      ref_sec: 7.12
    '61':
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.57
      gen_sec: 7.24
      ref_sec: 5.42
    '62':
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.6094
      gen_sec: 5.52
      ref_sec: 3.44
    '63':
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.5885
      gen_sec: 6.04
      ref_sec: 4.66
    '64':
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.6327
      gen_sec: 5.56
      ref_sec: 4.9
    '65':
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
      sbs: 0.6534
      gen_sec: 6.92
      ref_sec: 7.08
    '66':
      text: 'Lɛ la ka N da woŋ kɔkɔre kaŋ a saluoni poɔ ka o yele: “N noba, yɛ wa yi o poɔ.'
      sbs: 0.6208
      gen_sec: 6.16
      ref_sec: 6.26
    '67':
      text: O da iri arɛɛ la ka O sɔre, ka ba de a Ŋmen-yelmanna Azaaya gansɛgraa ko O.
      sbs: 0.5936
      gen_sec: 7.56
      ref_sec: 13.28
    '69':
      text: Neɛzaa ba nyɛ fo saanaa ka fo seŋ ne la kũũ be?
      sbs: 0.6182
      gen_sec: 4.4
      ref_sec: 3.28
    '70':
      text: A ŋaa la tori kyɛ pɛllɛ Naaŋmen a te Faara poɔ.
      sbs: 0.6198
      gen_sec: 4.44
      ref_sec: 3.26
    '71':
      text: Te da kpɛ la a gbori a be ka Arestaku naŋ da waa Masedoniya neɛ kyɛ da yi Tɛsalonika da beɛle
        te.
      sbs: 0.6188
      gen_sec: 9.04
      ref_sec: 7.84
    '72':
      text: Pampana, nembuo mɔɔ la na e yɛ yelfaa, ka yɛneŋ wa kyerɛ ka yɛ e yɛlɛ naŋ e velaa?
      sbs: 0.6529
      gen_sec: 9.64
      ref_sec: 6.04
    '73':
      text: A soba na naŋ da faa te yi ne a dɔgɛɛ naŋ tɔgle kũũ, naŋ na kyɛnɛ faa te la.
      sbs: 0.6232
      gen_sec: 6.52
      ref_sec: 5.32
    '74':
      text: 'Ba sɛge la a begɛ gane poɔ: “Noba naŋ yele kɔkɔsaama.'
      sbs: 0.6578
      gen_sec: 5.32
      ref_sec: 5.08
    '75':
      text: Biiri na kyiiri la ba dɔgreba a vɛŋ ka ba ko ba.
      sbs: 0.6451
      gen_sec: 4.24
      ref_sec: 3.32
    '76':
      text: Yɛ erɛ yɛlɛ ne yɛŋ a kyaara noba na naŋ ba poɔ yɛ poɔ, kyɛ maŋ vɛŋ ka wagre zaa yire tɔnɔ.
      sbs: 0.6136
      gen_sec: 8.24
      ref_sec: 6.24
    '77':
      text: A ŋaa zie la ka te baŋ ka a baaraa saŋ taɛ la.
      sbs: 0.6484
      gen_sec: 4.4
      ref_sec: 3.6
    '79':
      text: Kyɛ ba da de la soba na zaa yuori ba naŋ ba sɛge eŋ a nyɔvore gane poɔ lɔɔ eŋ a baa vũũ poɔ.
      sbs: 0.6454
      gen_sec: 7.36
      ref_sec: 9.34
    '80':
      text: A dɛndɛŋ soba da yi waɛ la, a wa yeli, ‘Daana, a fo warbiri yi la warbie pie tɔnɔ dɔgle o
        zu.
      sbs: 0.6689
      gen_sec: 9.72
      ref_sec: 7.52
    '81':
      text: 'A yelwulaa yɛ naŋ na nyɛ la ŋa: yɛ na nyɛ la bie ba naŋ pilli ne bipɛmɛ a gaale O donne bondi
        gbori poɔ.'
      sbs: 0.5745
      gen_sec: 9.04
      ref_sec: 8.0
    '82':
      text: Nemmeŋɛ maŋ iri la bonsonne yi o nabonsonne poɔ, ka nenfaa meŋ maŋ iri bonfaare yi o nabonfaare
        poɔ.
      sbs: 0.5238
      gen_sec: 8.8
      ref_sec: 4.78
    '86':
      text: Bonso, neɛzaa koŋ la baŋ biŋ yiri pare zaa ka a onaŋ ba naŋ biŋ naane; a yiri pare ŋa la a
        Yeezu Kirista.
      sbs: 0.6477
      gen_sec: 9.48
      ref_sec: 8.06
    '87':
      text: A O eŋɛ la ka a yiri lamboe zaa mɛ lantaa a baa te leɛ Naaŋmen die naŋ e soŋ a be a Daana
        eŋɛ.
      sbs: 0.6243
      gen_sec: 8.24
      ref_sec: 6.34
    '88':
      text: ” Ka O yeli ko ba, “N nyɛ la Setaana ka o yi sazu a le teŋɛ a ŋa saa naŋ nyegre.
      sbs: 0.6603
      gen_sec: 6.64
      ref_sec: 5.76
    '89':
      text: Kyɛ deɛ yeli a yelbiri yoŋ, a vɛŋ ka N gbaŋgbaa nyɛ o sammo.
      sbs: 0.5863
      gen_sec: 5.76
      ref_sec: 4.36
    '90':
      text: ” O da kaara ba la polipoli a teɛre ka ba na ko o la bonkaŋ.
      sbs: 0.5756
      gen_sec: 4.96
      ref_sec: 3.88
    '93':
      text: Ka maa puori Naaŋmen ameseɛrɛ kyɛ di a bondirii, bonso ka ba na saana n yuori ne bondirii
        N naŋ puori Naaŋmen ameseɛrɛ kyɛ di?
      sbs: 0.6199
      gen_sec: 9.28
      ref_sec: 7.7
    '94':
      text: Saa nyegroo ane hooroo ane saa tannoo da yire la a nakogi zie, kyɛ ka fentele ayopoĩ da dire
        a nakogi niŋesogɔ.
      sbs: 0.5709
      gen_sec: 10.96
      ref_sec: 10.42
    '95':
      text: N da guoli yɛ la ane beroŋ, a da ba e bondi-tage, bonso, yɛ da naŋ ba ta bondi-tage diibu.
      sbs: 0.652
      gen_sec: 7.76
      ref_sec: 7.16
    '96':
      text: Yuoni zaa poɔ a Yeezu dɔgrebɔ da maŋ gaa la Gyɛruzɛlɛm a te di a Ista tigri.
      sbs: 0.6032
      gen_sec: 7.8
      ref_sec: 5.88
    '97':
      text: Ka a naŋ wa seŋ ka N meŋ gaa, ba na beɛle ma la ka te gaa.
      sbs: 0.6477
      gen_sec: 4.96
      ref_sec: 3.68
    '99':
      text: Ba da teɛre ka O be la a noba poɔ ka ba zaa kyɛnɛ a sori poɔ.
      sbs: 0.5976
      gen_sec: 5.12
      ref_sec: 4.2
    '101':
      text: Neɛzaa kontoɔ̃ pigi ma sori ka N ta ire n meŋɛ yuori!
      sbs: 0.6091
      gen_sec: 5.24
      ref_sec: 3.5
    '103':
      text: Te baŋ ka te yi la kũũ poɔ a kpɛ nyɔvore poɔ, te naŋ nɔŋ taa zuiŋ.
      sbs: 0.6407
      gen_sec: 6.0
      ref_sec: 4.58
    '104':
      text: N baŋ ka a N gaabo puoriŋ, noba mine naŋ waa ŋa gboŋgbo-faare na wa kpɛ la yɛ poɔ, a koŋ bare
        a peere.
      sbs: 0.6352
      gen_sec: 8.04
      ref_sec: 7.04
    '106':
      text: O da ba di bonzaa a bebie na zaa poɔ, kyɛ O naŋ da wa te baare, kɔŋ da kpɛ O la yaga.
      sbs: 0.6066
      gen_sec: 6.96
      ref_sec: 6.58
    '109':
      text: Ba na de a la lɔɔ bare.
      sbs: 0.7151
      gen_sec: 3.84
      ref_sec: 11.98
    '112':
      text: ” Ka O yeli, “Yɛ gu yɛmenne velaa ka ba ta wa bɛlle yɛ.
      sbs: 0.6545
      gen_sec: 5.44
      ref_sec: 3.4
    '113':
      text: Kyɛ a Yeezu naŋ da bale a O kyɛmmo poɔ la so ka O da wa zeŋ a bulee noɔreŋ.
      sbs: 0.6223
      gen_sec: 6.6
      ref_sec: 5.98
    '114':
      text: Ba suuri da iree la yaga ane ba naŋ da kanna a noba kyɛ moɔlɔ ka a Yeezu zie la ka kuuni leɛ-iruu
        be.
      sbs: 0.5891
      gen_sec: 7.92
      ref_sec: 7.64
    '115':
      text: Piita Ane Gyɔɔn Naŋ Are A Sɛrediribe Niŋesogɔ.
      sbs: 0.5383
      gen_sec: 5.0
      ref_sec: 3.4
    '116':
      text: Bonso, te waa la Naaŋmen tontonema naŋ laŋ tonɔ, yɛnee la a Naaŋmen weɛ, a Naaŋmen yiri.
      sbs: 0.6547
      gen_sec: 8.56
      ref_sec: 7.14
    '121':
      text: Pɔlbile kaŋ yuori naŋ da di Yutaaku da zeŋ la a takoro noɔreŋ a gbire kyuuro, a Pɔɔl naŋ da
        yele yɛlɛ.
      sbs: 0.5742
      gen_sec: 8.56
      ref_sec: 7.18
    '124':
      text: ” Ka O yeli ko o, “Bonso ka fo soorɔ ma bon naŋ e soŋ yɛlɛ?
      sbs: 0.6321
      gen_sec: 5.84
      ref_sec: 4.1
    '125':
      text: A ŋaa zie la ka te maŋ baŋ a yelmeŋɛ vooroŋ ane a tuluu vooroŋ.
      sbs: 0.6549
      gen_sec: 6.16
      ref_sec: 5.28
    '126':
      text: N zoro la dabeɛ̃ ka a toma N naŋ toŋ ko yɛ na pɔɔ wa e la weɛlɛ.
      sbs: 0.6189
      gen_sec: 6.12
      ref_sec: 3.96
    '127':
      text: Kyɛ a Vooroŋ Soŋ la a dansedire, bonso a Vooroŋ Soŋ la a yelmeŋɛ.
      sbs: 0.6228
      gen_sec: 6.12
      ref_sec: 6.28
    '128':
      text: bonso, yɛ baŋ la a soba na naŋ bebe a yi a piiluu saŋ.
      sbs: 0.6584
      gen_sec: 4.92
      ref_sec: 4.44
    '130':
      text: ” Ka a noba da yeli sɔge, “Fo taa la sefaa!
      sbs: 0.5639
      gen_sec: 4.48
      ref_sec: 3.94
    '131':
      text: ” Kyɛ a Yeezu da taŋ la O noɔre a ba yeli yelzaa sɔge.
      sbs: 0.593
      gen_sec: 5.44
      ref_sec: 7.12
    '133':
      text: Bonso, N dire la o danseɛ ka o toŋ la toma yaga ko yɛ ane banaŋ naŋ be Laodisiya teŋɛ ane
        Hɛrapoli teŋɛ poɔ.
      sbs: 0.624
      gen_sec: 9.64
      ref_sec: 9.18
    '134':
      text: ” A lɛ la ka ba da yi moɔle ka neɛzaa leɛ o eebo a yi o yelbebe poɔ.
      sbs: 0.6467
      gen_sec: 7.24
      ref_sec: 4.52
    '135':
      text: ” Ba da yeli la a ŋaa ka ba e O nyɛ, a pãã na toɔ̃ nyɛ saanaa tuo O.
      sbs: 0.5952
      gen_sec: 7.72
      ref_sec: 5.6
    '137':
      text: Soba na zaa naŋ yeli, “N baŋ O la,” kyɛ ba sagra a O nɔɛ, waa la zirŋmaara, ka a yelmeŋɛ ba
        kye o zie.
      sbs: 0.7062
      gen_sec: 10.8
      ref_sec: 8.44
    '138':
      text: “Pampana ŋa N teɛroŋ zaa gyɛrɛɛ la.
      sbs: 0.6742
      gen_sec: 4.0
      ref_sec: 3.38
    '140':
      text: A Daana la na wa e ka yɛlɛ naŋ sɔgle lige poɔ sãã veɛloŋ ka bon naŋ be sukyiri poɔ meŋ sãã.
      sbs: 0.6314
      gen_sec: 8.52
      ref_sec: 7.44
    '141':
      text: A Yeezu da yi la a be a wa O meŋɛ teŋɛ poɔ, ka a O potuuribo da tu O wa.
      sbs: 0.633
      gen_sec: 7.08
      ref_sec: 4.6
    '142':
      text: N na iri la a gaa a N saa zie a te yeli ko o, “N saa, N eɛɛ yelbieri a kyaare Naaŋmen ane
        fõõ.
      sbs: 0.6645
      gen_sec: 11.24
      ref_sec: 8.56
    '143':
      text: Ba da ko o la sori meŋ ka o zɔɔ ne a nensonne a toɔ̃ ba.
      sbs: 0.5294
      gen_sec: 6.52
      ref_sec: 3.52
    '144':
      text: 'Azuiŋ, yɛ ko a teŋɛzu yɛlɛ zaa naŋ be yɛ enneŋ: peɛ̃mo toma, yeldɛgɛ, vɔlfaare, yelfaare
        boɔbo ane bombɔ-gaŋne .'
      sbs: 0.654
      gen_sec: 11.6
      ref_sec: 10.3
    '149':
      text: A banaŋ naŋ puoro a wɛdoŋɔ ane a o teebo ane neɛzaa naŋ de a o yuori ŋmaaroŋ daŋ koŋ nyɛ pɛnnoo
        ŋmenaa bee tensogɔ.
      sbs: 0.5577
      gen_sec: 11.72
      ref_sec: 10.84
    '150':
      text: Maata la da kaara a bondirii yɛlɛ, ka Laazoro da e a neɛ na kaŋ naŋ da laŋ zeŋ a diibu zie
        ne a Yeezu.
      sbs: 0.6213
      gen_sec: 9.12
      ref_sec: 7.98
    '151':
      text: fo naŋ nare biŋ a andonɛɛ zaa niŋesogɔ.
      sbs: 0.5998
      gen_sec: 3.52
      ref_sec: 3.0
    '153':
      text: N erɛ la ama zaa a Ŋmen-yelnoore zuiŋ, ka ka N na toɔ̃ nyɛ a yelnoore maaloo.
      sbs: 0.623
      gen_sec: 7.48
      ref_sec: 4.82
    '154':
      text: O da laŋ kpeɛrɛ ne la a wɛdonne; ka a malekere da kaara O zie.
      sbs: 0.6172
      gen_sec: 5.32
      ref_sec: 4.12
    '156':
      text: A Yeezu da zɛge la O zu a nyɛ bondaanema naŋ eŋnɛ ba kyɔɔtaare a kyɔɔtaare daga poɔ.
      sbs: 0.5961
      gen_sec: 7.64
      ref_sec: 6.0
    '157':
      text: Yɛ nyɛ, N tonɔ yɛ la aŋa pebilii ka yɛ yi te kpɛ gboŋgboe poɔ.
      sbs: 0.6486
      gen_sec: 6.52
      ref_sec: 4.98
    '158':
      text: Yɛ ta erɛ ka a Naaŋmen Vooroŋ Soŋ poɔ saana, Ona la a ŋmaaroŋ Naaŋmen naŋ eŋ yɛ a kyɛllɛ ne
        a faabo bebiri.
      sbs: 0.6323
      gen_sec: 8.52
      ref_sec: 6.72
    '159':
      text: N sɔre la a fo potuuribo ka ba digi a sefaa ka o yi, kyɛ ka ba digi fãã.
      sbs: 0.5858
      gen_sec: 6.56
      ref_sec: 6.1
    '160':
      text: Bonso, a Laazoro kuuni poɔ leɛ-iruu yɛlɛ la so ka a Gyuumine yaga da sagra derɛ a Yeezu yɛlɛ
        kyɛ zagra a ba yɛlɛ.
      sbs: 0.6157
      gen_sec: 8.96
      ref_sec: 8.62
    '165':
      text: Leɛ-teɛre nyɛ bonna naŋ da e ka fo le; leɛ fo eebo a kyɛ tonɔ a toma na fo naŋ da tonɔ a dɛndɛŋ
        saŋ.
      sbs: 0.5986
      gen_sec: 8.12
      ref_sec: 7.78
    '170':
      text: ka turi pie ne turi ayi da yi a Bɛŋgyamen bale poɔ ka ba da eŋ a ŋmaaroŋ.
      sbs: 0.6662
      gen_sec: 6.56
      ref_sec: 6.14
    '173':
      text: A ba seŋ ka o e Kiristabi-paalaa, ka lɛ naane, o na baŋ paale ne la pɔloo a le a sebɛlbɛllɛ
        dɔgroŋ poɔ.
      sbs: 0.6152
      gen_sec: 9.48
      ref_sec: 7.02
    '174':
      text: Ka Yeezu da soore a bege baŋnema ane a Faraziimine, “Sori bebe la ka ba saŋ baala a pɛnnoo
        bebiri daare bee sori kyebe.
      sbs: 0.6568
      gen_sec: 11.08
      ref_sec: 9.08
    '175':
      text: Ona la vɛŋ ka te baŋ lɛ yɛ naŋ taa nɔmmo a Vooroŋ Soŋ poɔ.
      sbs: 0.6095
      gen_sec: 5.84
      ref_sec: 3.9
    '176':
      text: Yɛ naŋ sage tu a yelmeŋɛ pampana, yɛ pɛge la a yɛ seere ka ka yɛ na taa nɔmmo naŋ sereŋ e
        meŋɛ.
      sbs: 0.6353
      gen_sec: 8.08
      ref_sec: 8.06
    '177':
      text: Kyɛ a Soŋ Soba da sɔ yɛ la kããsoŋ, ka yɛ zaa taa yelbammo.
      sbs: 0.6379
      gen_sec: 5.6
      ref_sec: 4.56
    '178':
      text: ka turi pie ne turi ayi da yi a Manaasɛ bale poɔ.
      sbs: 0.6336
      gen_sec: 4.96
      ref_sec: 4.14
    '179':
      text: Yiri na zaa poɔ yɛ naŋ wa kpɛ, yɛ daŋ yeli, ‘Ka maaroŋ be a yiri ŋa poɔ!
      sbs: 0.6488
      gen_sec: 7.28
      ref_sec: 5.22
    '181':
      text: Bee boŋ la ka Kiristabie ne neɛ naŋ ba sage de a Kirista yɛlɛ laŋ?
      sbs: 0.6308
      gen_sec: 5.24
      ref_sec: 3.58
    '182':
      text: Yɛ ta wa poɔrɔ sazu, bonso, o e la Naaŋmen nakogi, bee a poɔrɔ a teŋɛ, bonso, o meŋ waa la
        a Naaŋmen gbɛɛ-bimmu zie.
      sbs: 0.6665
      gen_sec: 10.76
      ref_sec: 11.22
    '184':
      text: Te da taa la yɛ vɔlaa kyɛ da nɔnɔ yaga ka te wa ka te nyɛ taa nimisogre.
      sbs: 0.6343
      gen_sec: 6.2
      ref_sec: 4.98
    '187':
      text: A gaŋ a zaa, yɛ de nɔmmo su pɔge yɛmenne, ona la maŋ leŋ boma zaa lantaa velaa zaa.
      sbs: 0.6383
      gen_sec: 7.68
      ref_sec: 5.7
    '189':
      text: Pampana ŋa, N de yɛ la ko Naaŋmen ane a Naaŋmen yelbiri garaaseɛ.
      sbs: 0.6316
      gen_sec: 7.2
      ref_sec: 4.66
    '190':
      text: Ba naŋ da ba nyɛ O, ba da leɛ gaa la a Gyɛruzɛlɛm ka ba te bɔ O.
      sbs: 0.5977
      gen_sec: 5.16
      ref_sec: 4.26
    '191':
      text: ” Kyɛ ba da ba baŋ a yɛlɛ O naŋ yeli ko ba tɛgɛ.
      sbs: 0.6145
      gen_sec: 4.08
      ref_sec: 8.26
    '192':
      text: ” A yeli ŋa da wa ne la tage taa, ka nɔkpeɛne da kpɛ a Pɔɔl ane Banabase ane a noba na sogɔŋ.
      sbs: 0.6094
      gen_sec: 8.12
      ref_sec: 7.4
    '195':
      text: Azuiŋ, yɛ baŋ ne a, a ta inni ka yuomo ata tensogɔ bee ŋmenaa, ka N ba nage ka N kpãã yɛ ane
        nentaŋ.
      sbs: 0.6165
      gen_sec: 9.36
      ref_sec: 8.14
    '197':
      text: Te nyɛ la dɔgɛɛ boorɔ zaa, kyɛ naŋ voorɔ; ka te teɛroŋ gyɛre, kyɛ ka te nuuri ba yoɔrɔ.
      sbs: 0.6583
      gen_sec: 8.04
      ref_sec: 6.04
    '198':
      text: N na boɔrɔ la ka yɛ zaa yele kɔkɔsaama, kyɛ a gaŋ a zaa N na boɔrɔ la ka yɛ yele Ŋmen-yelmanna
        yelyelii.
      sbs: 0.6313
      gen_sec: 9.4
      ref_sec: 6.62
    '199':
      text: Enyaabo zaa daŋ ba pɔge yɛ naŋ daŋ ba pɔge nensaala.
      sbs: 0.6261
      gen_sec: 4.84
      ref_sec: 3.24
    '202':
      text: A banaŋ N naŋ nɔŋ la ka N maŋ wuli kyɛ tage ba tobo.
      sbs: 0.5861
      gen_sec: 4.6
      ref_sec: 3.16
    '203':
      text: A Naaŋmen da di la a Davil danseɛ a yeli, ‘N nyɛ la Davil, a Gyɛse bidɔɔ, ka o waa N yɛŋ neɛ.
      sbs: 0.6551
      gen_sec: 8.88
      ref_sec: 6.96
    '204':
      text: Lɛ la ka a bie da yeli ko a o saa, ‘N saa, N sãã la Naaŋmen poɔ, a sãã fo meŋ poɔ.
      sbs: 0.677
      gen_sec: 8.52
      ref_sec: 6.42
    '205':
      text: A bama moɔlɔ la a Kirista yɛlɛ ne nɔmmo, a baŋ ka ba eŋ ma la a kyɛ N naŋ zɔɔrɔ a Ŋmen-yelnoore
        zɔɔre zuiŋ.
      sbs: 0.6242
      gen_sec: 10.12
      ref_sec: 7.48
    '207':
      text: Ka o da boɔle a gbaŋgbaa kaŋ a soore o bonna naŋ erɛ.
      sbs: 0.65
      gen_sec: 4.76
      ref_sec: 3.9
    '208':
      text: Yeezu Naŋ Saŋ Neɛ Kaŋ Ba Naŋ Dɔge Ne Zɔnnoŋ.
      sbs: 0.6547
      gen_sec: 6.28
      ref_sec: 3.56
    '209':
      text: ka turi pie ne turi ayi da yi a Nafetali bale poɔ.
      sbs: 0.6503
      gen_sec: 4.12
      ref_sec: 4.0
    '211':
      text: Moozul da yelee la, ‘A Daana a yɛ Naaŋmen na iri la Ŋmen-yelmanna a yɛ meŋɛ noba poɔ ka o
        waa aŋa maa.
      sbs: 0.636
      gen_sec: 8.16
      ref_sec: 7.9
    '212':
      text: “Yuomo lezaayi puoriŋ, maleke da wuli la o meŋɛ ko a Moozul vũũ naŋ da dire tuu kaŋ poɔ a
        Sanae taŋ wɛgyɛŋ poɔ.
      sbs: 0.6325
      gen_sec: 8.88
      ref_sec: 9.28
    '214':
      text: 'Kyɛ fo taa la garebanyɛ ne a yeli ŋa: fo kyiire la a Nikoletan deme tontonne na N meŋ naŋ
        kyiire.'
      sbs: 0.5844
      gen_sec: 8.28
      ref_sec: 6.68
    '215':
      text: Pampana, a malekere ayopoĩ na naŋ da taa a eelɛ ayopoĩ da narɛɛ la ka ba peɛle a eelɛ.
      sbs: 0.6545
      gen_sec: 8.68
      ref_sec: 7.48
    '217':
      text: ” A Yeezu naŋ da woŋ a ŋaa, O da yeli ko la a dɔɔ, “Yelyeni kaŋ la kyɛre ka fo ba taa.
      sbs: 0.6336
      gen_sec: 7.64
      ref_sec: 6.44
    '219':
      text: ’ Lɛ la ka a saa da de a o boma poŋ a o biiri na bayi.
      sbs: 0.6356
      gen_sec: 8.24
      ref_sec: 3.54
    '220':
      text: yɛ ta dare a yɛ sukyie aŋa lɛ a yɛ sããkommine naŋ da zɔɔ ne Naaŋmen.
      sbs: 0.5685
      gen_sec: 5.8
      ref_sec: 5.5
    '221':
      text: Ka Yeezu yeli, “Pɔlbile, maa yeli ko fo, vaa-iri!
      sbs: 0.6283
      gen_sec: 6.84
      ref_sec: 4.68
    '224':
      text: A yelwolɔ naŋ waana zuiŋ, N teɛre ka a na soma la ka neɛzaa naŋ kyɛnɛ waa lɛ zaa o naŋ da
        waa.
      sbs: 0.6429
      gen_sec: 8.0
      ref_sec: 7.48
    '225':
      text: Maa Gyɔɔn la a soba na naŋ da woŋ kyɛ nyɛ a yɛlɛ ama.
      sbs: 0.6654
      gen_sec: 6.04
      ref_sec: 10.56
    '226':
      text: Ona la e ka te taa faŋ a waa a nɔpaalaa tontonema.
      sbs: 0.6362
      gen_sec: 4.56
      ref_sec: 3.28
    '227':
      text: A yɛlɛ na eŋ naŋ kyɛre, N na wuli yɛ la ka maa wa wa yɛ zie.
      sbs: 0.6637
      gen_sec: 5.24
      ref_sec: 6.74
    '228':
      text: a zɔɔrɔ ne a Daana ane a O Mɛzaaya.
      sbs: 0.6317
      gen_sec: 4.72
      ref_sec: 3.3
    '229':
      text: Yɛ nyɛ nɔmmo na tɔ a Saa naŋ nɔŋ te, a e ka ba boɔlɔ te Naaŋmen bibiiri; ka te sereŋ waa a
        lɛ.
      sbs: 0.6654
      gen_sec: 8.48
      ref_sec: 7.2
    '230':
      text: O da gaa te de la a gane yi a soba na naŋ da zeŋ a nakogi zu nuduluŋ poɔ.
      sbs: 0.6206
      gen_sec: 6.2
      ref_sec: 4.9
    '231':
      text: Yɛ saŋna a baalba naŋ be a be, kyɛ yeli ko ba, ‘A Naaŋmen naaloŋ wa peɛle yɛ la.
      sbs: 0.6475
      gen_sec: 8.28
      ref_sec: 5.5
    '233':
      text: Kyɛ tɔnɔ na zaa N naŋ da nyɛ, N de a la ka a waa zaglaa a Kirista zuiŋ.
      sbs: 0.6679
      gen_sec: 5.44
      ref_sec: 5.24
    '234':
      text: Kyɛ soba na zaa naŋ ba sage de a yelbiri na wɛ la.
      sbs: 0.623
      gen_sec: 4.12
      ref_sec: 3.1
    '235':
      text: A ŋa la a n noɔre N naŋ wullo a puoruu laŋne yie zaa poore.
      sbs: 0.6144
      gen_sec: 7.2
      ref_sec: 3.88
    '236':
      text: 'Serɛzaa ka N yele korɔ yɛ: Gyɔɔn Bati e la kpoŋ gaŋ banaŋ zaa pɔgeba naŋ dɔge a teŋɛzu.'
      sbs: 0.6359
      gen_sec: 8.76
      ref_sec: 6.58
    '237':
      text: Bonso, dɔgroŋ la so ka dabeɛ̃ bebe, kyɛ neɛ na zaa naŋ zoro dabeɛ̃ ba taa nɔmmo naŋ e soŋ.
      sbs: 0.6243
      gen_sec: 9.44
      ref_sec: 7.54
    '238':
      text: Azuiŋ a ferɛɛ la ka te maaleŋ kyɛlle velaa bon te naŋ da woŋ, ka te ta wa sare yi a poɔ.
      sbs: 0.6291
      gen_sec: 6.76
      ref_sec: 7.8
    '239':
      text: ” Ka O yeli sɔge ba, “Nembuo la N ma ane N yɔɔmine?
      sbs: 0.6052
      gen_sec: 5.12
      ref_sec: 7.36
    '240':
      text: A yɛlɛ ama da eɛɛ la ka a e yelwulaa ko te, ka ka te na ta boɔrɔ yelfaare aŋa ba naŋ da e
        lɛ.
      sbs: 0.6033
      gen_sec: 9.0
      ref_sec: 6.92
    '241':
      text: Kyɛ ka o naŋ wa poɔ̃, o maŋ buli la a eŋ bie yaga.
      sbs: 0.6647
      gen_sec: 4.4
      ref_sec: 3.5
    '242':
      text: A ŋaa la vɛŋ ka te ba zoro dabeɛ̃ a Naaŋmen niŋeŋ a yi a Kirista zuiŋ.
      sbs: 0.6242
      gen_sec: 6.32
      ref_sec: 4.86
    '243':
      text: Kyɛ Pɔɔl da ba boɔrɔ ka o taa neɛ naŋ da zo kyɛ bare ba Pamfiliya poɔ, a ba tu ba a toŋ a
        toma.
      sbs: 0.597
      gen_sec: 8.92
      ref_sec: 7.42
    '244':
      text: Kyɛ ŋmenaa naŋ da wa do, a bombulo da zoɔlɛɛ la, a ko, a naŋ da ba taa nyaga zuiŋ.
      sbs: 0.6309
      gen_sec: 7.92
      ref_sec: 6.62
    '245':
      text: A weɛ soba da naŋ taa la neŋyenaa kaŋ, a o poyɛŋ bie.
      sbs: 0.6373
      gen_sec: 5.48
      ref_sec: 3.66
    '246':
      text: N naŋ da wa nyɛ o, N noɔre da maaɛ la yaga.
      sbs: 0.6798
      gen_sec: 3.8
      ref_sec: 3.1
    '247':
      text: Dabeɛ̃ ne nɔmaa da kpɛ ba la ne a yeli ŋa naŋ da e a gbɛre ŋa zie.
      sbs: 0.6007
      gen_sec: 5.52
      ref_sec: 6.38
    '250':
      text: A Fɛstu pãã da tere la noɔre, ka ba taa a Pɔɔl wa ne.
      sbs: 0.6277
      gen_sec: 4.68
      ref_sec: 3.48
    '252':
      text: Pampana ŋa, vi ba erɛ ma, ka maa gba erɛ pɔloo yaga ne a kpeɛ̃õ a Daana naŋ tere ka N de maale
        ne yɛ.
      sbs: 0.6411
      gen_sec: 8.92
      ref_sec: 6.86
    '253':
      text: ” Ka Yeezu da yeli ko o, “Yelmeŋɛ ka N yele korɔ yɛ.
      sbs: 0.5809
      gen_sec: 4.8
      ref_sec: 9.28
    '256':
      text: Yɛ vɛŋ ka neɛzaa maŋ sigre o meŋɛ korɔ a teŋɛzu wederebɛ; bonso, wederɛ zaa ba kyebe ka Naaŋmen
        zie naane ka o yi.
      sbs: 0.6228
      gen_sec: 10.24
      ref_sec: 8.34
    '257':
      text: Yelmeŋɛ zaa la ka N yele korɔ yɛ, ka kabiri ba le teŋɛ a poɔ̃, o maŋ e la kabi-yeni.
      sbs: 0.6321
      gen_sec: 7.68
      ref_sec: 5.78
    '260':
      text: Ka maa pãã la bee ka bana la, a yeli ŋa la ka te moɔle ka yɛ da sage de.
      sbs: 0.6247
      gen_sec: 5.64
      ref_sec: 5.08
    '262':
      text: O eŋɛ da kɔɔ guree la, ka o da kontoɔ̃ dɔle o meŋɛ.
      sbs: 0.5959
      gen_sec: 4.8
      ref_sec: 3.74
    '263':
      text: Bonso, a ba seŋ ka o voorɔ.
      sbs: 0.6315
      gen_sec: 3.32
      ref_sec: 8.1
    '264':
      text: 'Bonso, o yeli la o poɔŋ: ‘N dire la naaloŋ aŋa pɔgenaa; N ba waa pɔgekoɔre.'
      sbs: 0.5889
      gen_sec: 6.96
      ref_sec: 7.4
    '265':
      text: Kyɛ a Yeezu da ba yeli ko o ka o koŋ kpi.
      sbs: 0.609
      gen_sec: 3.84
      ref_sec: 8.18
    '269':
      text: Neɛ kaŋ da soore O la, “Daana, noba belaa la na nyɛ faabo be?
      sbs: 0.6644
      gen_sec: 5.88
      ref_sec: 5.22
    '270':
      text: A apostoliimine ane a nembɛrɛ da laŋ la taa ka ba kaa a yeli ŋa nyɛ.
      sbs: 0.607
      gen_sec: 5.8
      ref_sec: 5.22
    '271':
      text: bonso, fo yɔɔ la a fo tontonema, a Ŋmen-yelmanneba.
      sbs: 0.5822
      gen_sec: 5.76
      ref_sec: 3.84
    '272':
      text: Yɛ ta de faaloŋ yɔɔ ne neɛzaa naŋ e yɛ faaloŋ; kyɛ yɛ maŋ moɔrɔ ka yɛ erɛ yɛlɛ naŋ soma noba
        zaa zie.
      sbs: 0.6169
      gen_sec: 7.96
      ref_sec: 7.24
    '273':
      text: O ba kye kyɛ, ba eɛɛ la ka O leɛ-iri yi a kuuni poɔ.
      sbs: 0.5772
      gen_sec: 5.44
      ref_sec: 4.26
    '274':
      text: Bonso, ba sɛge la a Moozul begɛ poɔ, “Ta leŋ a naadɛre naŋ ŋmeɛrɛ kyi noɔre.
      sbs: 0.6492
      gen_sec: 9.24
      ref_sec: 6.58
    '276':
      text: N maŋ leŋ la noɔre gbɛre boyi daa gbuli zaa poɔ.
      sbs: 0.6406
      gen_sec: 6.0
      ref_sec: 3.1
    '277':
      text: ” A noba naŋ da bebe da ta ŋa turi anuu.
      sbs: 0.5917
      gen_sec: 4.08
      ref_sec: 3.76
    '278':
      text: 'Ba maŋ vɔge la a ba nazupile biŋ a nakogi niŋesogɔ, kyɛ yiele: “Te Daana Naaŋmen, fo seŋ
        ne la.'
      sbs: 0.5698
      gen_sec: 8.8
      ref_sec: 7.9
    '279':
      text: 'Kyɛ a danseɛ la ŋa: Naaŋmen ko te la nyɔvore naŋ ba taa baaraa, ka a nyɔvore ŋa be a O Bie
        poɔ.'
      sbs: 0.6516
      gen_sec: 8.56
      ref_sec: 6.84
    '281':
      text: A pɔge da su la kpareze-velaa, ka o lenni ne salema ane lɛɛbie ane kusi-veɛle.
      sbs: 0.642
      gen_sec: 6.56
      ref_sec: 6.68
    '282':
      text: A zenɛ ŋa, ba dɔge la a yɛ Faara a Davil teŋkpoŋ poɔ, Ona la a Mɛzaaya, a Daana.
      sbs: 0.5702
      gen_sec: 9.68
      ref_sec: 6.9
    '284':
      text: Azuiŋ ba da ŋmaa la kpaakpaa vaare, a yi ka ba te tuori O.
      sbs: 0.6009
      gen_sec: 5.4
      ref_sec: 4.78
    '286':
      text: Amine meŋ da le la tɛnnoɔ poɔ, a buli, a maale eŋ bie kɔɔ.
      sbs: 0.675
      gen_sec: 5.84
      ref_sec: 4.96
    '287':
      text: Ba da ba puori a wɛdoŋɔ bee a o teebo, a da ba de a o ŋmaaroŋ a ba gberi bee ba nuuri eŋɛ.
      sbs: 0.6417
      gen_sec: 8.88
      ref_sec: 7.26
    '288':
      text: Ba maŋ erɛ la a lɛ a na de bon naŋ maŋ wɛ, kyɛ tenee deni ba weɛrɛ.
      sbs: 0.6419
      gen_sec: 6.32
      ref_sec: 4.84
    '289':
      text: Ka fõõ wa to fo yɔɔ bee fo yɔɔpuulee, a seŋ ka ba zeŋ ne fo nembɛrɛ niŋesogɔ.
      sbs: 0.6586
      gen_sec: 7.28
      ref_sec: 6.08
    '290':
      text: Naboma Naŋ Be Yagraa Dogre Poɔ.
      sbs: 0.6199
      gen_sec: 2.84
      ref_sec: 4.54
    '292':
      text: Lɛ la ka o toŋ ka ba te ko bibiiri na zaa naŋ ta yuomo ayi kyɛ sigre, a Bɛtelɛhɛm ane o tembilii
        poore.
      sbs: 0.604
      gen_sec: 8.44
      ref_sec: 8.1
    '293':
      text: A o soba ta boɔrɔ ka o sɔglɔ a dɛgre iruu ŋmaaroŋ.
      sbs: 0.6218
      gen_sec: 5.12
      ref_sec: 3.92
    '294':
      text: Lɛ la ka Yeezu da toŋ Piita ane Gyɔɔn, a yele, “Yɛ gaa te nare a Ista tigri bondiraa ka te
        di.
      sbs: 0.6116
      gen_sec: 8.72
      ref_sec: 7.38
    '295':
      text: ” Ba naŋ da wa gbole kaa, ba ba la nyɛ neɛzaa ka a Yeezu yoŋ naane.
      sbs: 0.6108
      gen_sec: 6.0
      ref_sec: 4.52
    '298':
      text: O naŋ da wa de a suobu baare, o da be la a Filipi zie tegitegilɛ.
      sbs: 0.6158
      gen_sec: 5.72
      ref_sec: 4.48
    '299':
      text: Fo ba ŋmaa a zirii ŋa ko te kyɛ Naaŋmen la ka fo ŋmaa tere.
      sbs: 0.6227
      gen_sec: 4.8
      ref_sec: 3.62
  score: 0.6245
  partial: true
- model: Google/gemini-3.1-flash-tts-preview-universal
  sbs: 0.6069
  num_scored: 199
  uses_reference: false
  entries:
    '0':
      text: Ka maa bare ba ne a kɔŋ ka ba kulo, ba na yĩĩe la a sobiriŋ, bonso, ba mine yi la tentɔbɔ
        a wa.
      sbs: 0.5702
      gen_sec: 10.52
      ref_sec: 7.66
    '2':
      text: A Yeezu naŋ da gɛrɛ Gyɛruzɛlɛm, O da kpɛ la a teŋkponni ane a tembilii poore a kanna a noba
        gɛrɛ.
      sbs: 0.6285
      gen_sec: 10.96
      ref_sec: 7.54
    '3':
      text: A Naaŋmen Bagmaale Wederebɛ Nembɛrɛ Zusoba Naŋ Soore Yeezu Soorebie.
      sbs: 0.5726
      gen_sec: 8.12
      ref_sec: 8.22
    '5':
      text: Azuiŋ, yɛ ta daŋ di sɛrɛɛ kyɛ ka a saŋ ba ta; kyɛ ka a Daana waabo naŋ ba ta sɛre.
      sbs: 0.6073
      gen_sec: 7.6
      ref_sec: 5.84
    '6':
      text: O naŋ da wa pɔge te a Azɔ poɔ, o da kpɛ la a gbori ka te gaa Mitelen.
      sbs: 0.5613
      gen_sec: 7.32
      ref_sec: 6.46
    '7':
      text: Ba da lɔɔ o la bare ka o sigi wa a teŋɛzu, a lɔɔ a o malekere meŋ poɔ o eŋɛ.
      sbs: 0.6143
      gen_sec: 9.2
      ref_sec: 6.06
    '8':
      text: Ka a toŋkpeɛne ama naŋ toŋ fo poɔ, da toŋ Sodom teŋɛ poɔ, o da na kyɛnɛ bebe la wa ta zenɛ.
      sbs: 0.5768
      gen_sec: 8.6
      ref_sec: 7.3
    '10':
      text: A banaŋ naŋ da zo yaare da yi yoɔrɔ la, a moɔlɔ a yelbiri.
      sbs: 0.6384
      gen_sec: 4.52
      ref_sec: 5.66
    '11':
      text: N poyɛŋ noba, nɔpaalaa naane ka N sɛgrɛ korɔ yɛ, kyɛ a nɔkoraa na yɛ naŋ da taa yi a piiluu
        saŋ la.
      sbs: 0.6718
      gen_sec: 10.0
      ref_sec: 8.0
    '12':
      text: ” Ka Yeezu da yeli, “Yɛ e ka a noba zeŋ teŋɛ.
      sbs: 0.6028
      gen_sec: 5.72
      ref_sec: 14.68
    '13':
      text: Wola pãã ka a weɛ soba na e a wɛkaareba ŋa?
      sbs: 0.6262
      gen_sec: 4.52
      ref_sec: 3.42
    '15':
      text: Ona la boɔrɔ ka neɛzaa nyɛ faabo a kyɛ wa baŋ a yelmeŋɛ.
      sbs: 0.6182
      gen_sec: 5.28
      ref_sec: 3.56
    '19':
      text: Pɔɔl Naŋ Puori A Filipae Deme Yaane.
      sbs: 0.6212
      gen_sec: 6.0
      ref_sec: 5.12
    '20':
      text: Bonso, ba da ba sage de a banaŋ zaa naŋ da wa yeli a O kuuni poɔ leɛ-iruu yɛlɛ ko ba.
      sbs: 0.6332
      gen_sec: 9.4
      ref_sec: 5.86
    '21':
      text: ” Ba da do la a sazu a zunzugri poɔ ka a ba dɔndɔnne da kaara ba.
      sbs: 0.5889
      gen_sec: 6.28
      ref_sec: 4.64
    '25':
      text: Kyɛ a ŋaa la ka yɛ mine da waa, kyɛ ka ba da pɛge yɛ.
      sbs: 0.6154
      gen_sec: 3.88
      ref_sec: 3.38
    '28':
      text: “Daana, a piiluu saŋ, fõõ la iri a teŋɛ.
      sbs: 0.5795
      gen_sec: 4.84
      ref_sec: 3.28
    '29':
      text: Bebie ata puoriŋ, a Pɔɔl da boɔle la a Gyuumine nembɛrɛ naŋ da be a be lantaa.
      sbs: 0.5563
      gen_sec: 10.96
      ref_sec: 5.56
    '30':
      text: A Maleke Na Naŋ Taa A Ganlee Yɛlɛ.
      sbs: 0.6202
      gen_sec: 3.28
      ref_sec: 3.8
    '31':
      text: Nɔmmo maŋ taa la teɛretɔroo ne yelzaa kyɛ maŋ di kannyiri ne yelzaa.
      sbs: 0.5956
      gen_sec: 7.32
      ref_sec: 3.94
    '32':
      text: N naŋ da wa nyɛ O, N da le vɔgle la muro O gbɛɛ puliŋ a waa ŋa neɛ naŋ kpi.
      sbs: 0.6331
      gen_sec: 7.36
      ref_sec: 5.86
    '36':
      text: Lɛ la ka o da boɔle o a soore o, ‘Boŋ la ka N wono kyaare ne fo ya?
      sbs: 0.592
      gen_sec: 7.36
      ref_sec: 4.14
    '37':
      text: Yɛ kaa a Izerayɛl biiri nyɛ; a banaŋ naŋ maŋ di a Naaŋmen bagmaale boma, ba ba maŋ waa a Naaŋmen
        bagmaalkuuri laŋne deme be?
      sbs: 0.5996
      gen_sec: 11.4
      ref_sec: 7.62
    '38':
      text: Kyɛ N na ko la a N dansediribe bayi naŋ su boɔre kparre kpeɛ̃õ ka ba yeli Ŋmen-yelmanna yelyelii
        bebie turi dɔgle kɔɔraayi ne lezaata.
      sbs: 0.5469
      gen_sec: 10.72
      ref_sec: 12.4
    '39':
      text: Te sɛgrɛ la a yɛlɛ ama ka ka a te kyelloo na paale.
      sbs: 0.6204
      gen_sec: 6.56
      ref_sec: 3.98
    '40':
      text: ka ba da de O do ne sazu ne puubu.
      sbs: 0.637
      gen_sec: 4.08
      ref_sec: 4.84
    '44':
      text: 'Azuiŋ la ka ba yeli: “Gɔŋgbire, iri!'
      sbs: 0.6631
      gen_sec: 4.88
      ref_sec: 3.24
    '46':
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.5721
      gen_sec: 9.2
      ref_sec: 5.94
    '47':
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.5928
      gen_sec: 9.04
      ref_sec: 14.94
    '48':
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.5707
      gen_sec: 10.08
      ref_sec: 6.46
    '51':
      text: Yeezu Naŋ Koŋ A Gyɛruzɛlɛm Teŋɛ Yɛlɛ.
      sbs: 0.6149
      gen_sec: 4.84
      ref_sec: 10.58
    '52':
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.5977
      gen_sec: 2.88
      ref_sec: 5.8
    '53':
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.5722
      gen_sec: 7.96
      ref_sec: 6.64
    '54':
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.5994
      gen_sec: 5.92
      ref_sec: 4.32
    '56':
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.6073
      gen_sec: 8.04
      ref_sec: 7.02
    '57':
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.5895
      gen_sec: 8.44
      ref_sec: 5.42
    '58':
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.616
      gen_sec: 9.04
      ref_sec: 7.12
    '61':
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.5399
      gen_sec: 9.4
      ref_sec: 5.42
    '62':
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.6004
      gen_sec: 5.92
      ref_sec: 3.44
    '63':
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.577
      gen_sec: 3.88
      ref_sec: 4.66
    '64':
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.6392
      gen_sec: 5.52
      ref_sec: 4.9
    '65':
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
      sbs: 0.6026
      gen_sec: 8.12
      ref_sec: 7.08
    '66':
      text: 'Lɛ la ka N da woŋ kɔkɔre kaŋ a saluoni poɔ ka o yele: “N noba, yɛ wa yi o poɔ.'
      sbs: 0.6566
      gen_sec: 9.8
      ref_sec: 6.26
    '67':
      text: O da iri arɛɛ la ka O sɔre, ka ba de a Ŋmen-yelmanna Azaaya gansɛgraa ko O.
      sbs: 0.5686
      gen_sec: 8.32
      ref_sec: 13.28
    '69':
      text: Neɛzaa ba nyɛ fo saanaa ka fo seŋ ne la kũũ be?
      sbs: 0.632
      gen_sec: 4.48
      ref_sec: 3.28
    '70':
      text: A ŋaa la tori kyɛ pɛllɛ Naaŋmen a te Faara poɔ.
      sbs: 0.5942
      gen_sec: 4.2
      ref_sec: 3.26
    '71':
      text: Te da kpɛ la a gbori a be ka Arestaku naŋ da waa Masedoniya neɛ kyɛ da yi Tɛsalonika da beɛle
        te.
      sbs: 0.6088
      gen_sec: 10.88
      ref_sec: 7.84
    '72':
      text: Pampana, nembuo mɔɔ la na e yɛ yelfaa, ka yɛneŋ wa kyerɛ ka yɛ e yɛlɛ naŋ e velaa?
      sbs: 0.6614
      gen_sec: 10.88
      ref_sec: 6.04
    '73':
      text: A soba na naŋ da faa te yi ne a dɔgɛɛ naŋ tɔgle kũũ, naŋ na kyɛnɛ faa te la.
      sbs: 0.6122
      gen_sec: 6.8
      ref_sec: 5.32
    '74':
      text: 'Ba sɛge la a begɛ gane poɔ: “Noba naŋ yele kɔkɔsaama.'
      sbs: 0.6053
      gen_sec: 3.04
      ref_sec: 5.08
    '75':
      text: Biiri na kyiiri la ba dɔgreba a vɛŋ ka ba ko ba.
      sbs: 0.6205
      gen_sec: 5.28
      ref_sec: 3.32
    '76':
      text: Yɛ erɛ yɛlɛ ne yɛŋ a kyaara noba na naŋ ba poɔ yɛ poɔ, kyɛ maŋ vɛŋ ka wagre zaa yire tɔnɔ.
      sbs: 0.5739
      gen_sec: 8.56
      ref_sec: 6.24
    '77':
      text: A ŋaa zie la ka te baŋ ka a baaraa saŋ taɛ la.
      sbs: 0.6568
      gen_sec: 4.12
      ref_sec: 3.6
    '79':
      text: Kyɛ ba da de la soba na zaa yuori ba naŋ ba sɛge eŋ a nyɔvore gane poɔ lɔɔ eŋ a baa vũũ poɔ.
      sbs: 0.6316
      gen_sec: 8.8
      ref_sec: 9.34
    '80':
      text: A dɛndɛŋ soba da yi waɛ la, a wa yeli, ‘Daana, a fo warbiri yi la warbie pie tɔnɔ dɔgle o
        zu.
      sbs: 0.6756
      gen_sec: 10.04
      ref_sec: 7.52
    '81':
      text: 'A yelwulaa yɛ naŋ na nyɛ la ŋa: yɛ na nyɛ la bie ba naŋ pilli ne bipɛmɛ a gaale O donne bondi
        gbori poɔ.'
      sbs: 0.555
      gen_sec: 9.12
      ref_sec: 8.0
    '82':
      text: Nemmeŋɛ maŋ iri la bonsonne yi o nabonsonne poɔ, ka nenfaa meŋ maŋ iri bonfaare yi o nabonfaare
        poɔ.
      sbs: 0.5291
      gen_sec: 9.92
      ref_sec: 4.78
    '86':
      text: Bonso, neɛzaa koŋ la baŋ biŋ yiri pare zaa ka a onaŋ ba naŋ biŋ naane; a yiri pare ŋa la a
        Yeezu Kirista.
      sbs: 0.6173
      gen_sec: 11.08
      ref_sec: 8.06
    '87':
      text: A O eŋɛ la ka a yiri lamboe zaa mɛ lantaa a baa te leɛ Naaŋmen die naŋ e soŋ a be a Daana
        eŋɛ.
      sbs: 0.6094
      gen_sec: 12.36
      ref_sec: 6.34
    '88':
      text: ” Ka O yeli ko ba, “N nyɛ la Setaana ka o yi sazu a le teŋɛ a ŋa saa naŋ nyegre.
      sbs: 0.5948
      gen_sec: 7.96
      ref_sec: 5.76
    '89':
      text: Kyɛ deɛ yeli a yelbiri yoŋ, a vɛŋ ka N gbaŋgbaa nyɛ o sammo.
      sbs: 0.6042
      gen_sec: 5.88
      ref_sec: 4.36
    '90':
      text: ” O da kaara ba la polipoli a teɛre ka ba na ko o la bonkaŋ.
      sbs: 0.555
      gen_sec: 6.16
      ref_sec: 3.88
    '93':
      text: Ka maa puori Naaŋmen ameseɛrɛ kyɛ di a bondirii, bonso ka ba na saana n yuori ne bondirii
        N naŋ puori Naaŋmen ameseɛrɛ kyɛ di?
      sbs: 0.5816
      gen_sec: 11.6
      ref_sec: 7.7
    '94':
      text: Saa nyegroo ane hooroo ane saa tannoo da yire la a nakogi zie, kyɛ ka fentele ayopoĩ da dire
        a nakogi niŋesogɔ.
      sbs: 0.5708
      gen_sec: 12.16
      ref_sec: 10.42
    '95':
      text: N da guoli yɛ la ane beroŋ, a da ba e bondi-tage, bonso, yɛ da naŋ ba ta bondi-tage diibu.
      sbs: 0.6032
      gen_sec: 8.24
      ref_sec: 7.16
    '96':
      text: Yuoni zaa poɔ a Yeezu dɔgrebɔ da maŋ gaa la Gyɛruzɛlɛm a te di a Ista tigri.
      sbs: 0.5838
      gen_sec: 6.96
      ref_sec: 5.88
    '97':
      text: Ka a naŋ wa seŋ ka N meŋ gaa, ba na beɛle ma la ka te gaa.
      sbs: 0.65
      gen_sec: 4.44
      ref_sec: 3.68
    '99':
      text: Ba da teɛre ka O be la a noba poɔ ka ba zaa kyɛnɛ a sori poɔ.
      sbs: 0.5798
      gen_sec: 5.56
      ref_sec: 4.2
    '101':
      text: Neɛzaa kontoɔ̃ pigi ma sori ka N ta ire n meŋɛ yuori!
      sbs: 0.5935
      gen_sec: 6.8
      ref_sec: 3.5
    '103':
      text: Te baŋ ka te yi la kũũ poɔ a kpɛ nyɔvore poɔ, te naŋ nɔŋ taa zuiŋ.
      sbs: 0.6248
      gen_sec: 2.44
      ref_sec: 4.58
    '104':
      text: N baŋ ka a N gaabo puoriŋ, noba mine naŋ waa ŋa gboŋgbo-faare na wa kpɛ la yɛ poɔ, a koŋ bare
        a peere.
      sbs: 0.6157
      gen_sec: 9.12
      ref_sec: 7.04
    '106':
      text: O da ba di bonzaa a bebie na zaa poɔ, kyɛ O naŋ da wa te baare, kɔŋ da kpɛ O la yaga.
      sbs: 0.573
      gen_sec: 7.4
      ref_sec: 6.58
    '109':
      text: Ba na de a la lɔɔ bare.
      sbs: 0.6834
      gen_sec: 3.28
      ref_sec: 11.98
    '112':
      text: ” Ka O yeli, “Yɛ gu yɛmenne velaa ka ba ta wa bɛlle yɛ.
      sbs: 0.6155
      gen_sec: 6.88
      ref_sec: 3.4
    '113':
      text: Kyɛ a Yeezu naŋ da bale a O kyɛmmo poɔ la so ka O da wa zeŋ a bulee noɔreŋ.
      sbs: 0.5875
      gen_sec: 9.12
      ref_sec: 5.98
    '114':
      text: Ba suuri da iree la yaga ane ba naŋ da kanna a noba kyɛ moɔlɔ ka a Yeezu zie la ka kuuni leɛ-iruu
        be.
      sbs: 0.5901
      gen_sec: 10.84
      ref_sec: 7.64
    '115':
      text: Piita Ane Gyɔɔn Naŋ Are A Sɛrediribe Niŋesogɔ.
      sbs: 0.4991
      gen_sec: 4.64
      ref_sec: 3.4
    '116':
      text: Bonso, te waa la Naaŋmen tontonema naŋ laŋ tonɔ, yɛnee la a Naaŋmen weɛ, a Naaŋmen yiri.
      sbs: 0.6475
      gen_sec: 10.48
      ref_sec: 7.14
    '121':
      text: Pɔlbile kaŋ yuori naŋ da di Yutaaku da zeŋ la a takoro noɔreŋ a gbire kyuuro, a Pɔɔl naŋ da
        yele yɛlɛ.
      sbs: 0.5765
      gen_sec: 10.8
      ref_sec: 7.18
    '124':
      text: ” Ka O yeli ko o, “Bonso ka fo soorɔ ma bon naŋ e soŋ yɛlɛ?
      sbs: 0.6197
      gen_sec: 7.52
      ref_sec: 4.1
    '125':
      text: A ŋaa zie la ka te maŋ baŋ a yelmeŋɛ vooroŋ ane a tuluu vooroŋ.
      sbs: 0.625
      gen_sec: 7.76
      ref_sec: 5.28
    '126':
      text: N zoro la dabeɛ̃ ka a toma N naŋ toŋ ko yɛ na pɔɔ wa e la weɛlɛ.
      sbs: 0.6015
      gen_sec: 6.84
      ref_sec: 3.96
    '127':
      text: Kyɛ a Vooroŋ Soŋ la a dansedire, bonso a Vooroŋ Soŋ la a yelmeŋɛ.
      sbs: 0.6348
      gen_sec: 6.88
      ref_sec: 6.28
    '128':
      text: bonso, yɛ baŋ la a soba na naŋ bebe a yi a piiluu saŋ.
      sbs: 0.6267
      gen_sec: 5.68
      ref_sec: 4.44
    '130':
      text: ” Ka a noba da yeli sɔge, “Fo taa la sefaa!
      sbs: 0.5868
      gen_sec: 5.24
      ref_sec: 3.94
    '131':
      text: ” Kyɛ a Yeezu da taŋ la O noɔre a ba yeli yelzaa sɔge.
      sbs: 0.5778
      gen_sec: 6.2
      ref_sec: 7.12
    '133':
      text: Bonso, N dire la o danseɛ ka o toŋ la toma yaga ko yɛ ane banaŋ naŋ be Laodisiya teŋɛ ane
        Hɛrapoli teŋɛ poɔ.
      sbs: 0.5946
      gen_sec: 12.84
      ref_sec: 9.18
    '134':
      text: ” A lɛ la ka ba da yi moɔle ka neɛzaa leɛ o eebo a yi o yelbebe poɔ.
      sbs: 0.6006
      gen_sec: 8.36
      ref_sec: 4.52
    '135':
      text: ” Ba da yeli la a ŋaa ka ba e O nyɛ, a pãã na toɔ̃ nyɛ saanaa tuo O.
      sbs: 0.6164
      gen_sec: 6.76
      ref_sec: 5.6
    '137':
      text: Soba na zaa naŋ yeli, “N baŋ O la,” kyɛ ba sagra a O nɔɛ, waa la zirŋmaara, ka a yelmeŋɛ ba
        kye o zie.
      sbs: 0.6595
      gen_sec: 10.0
      ref_sec: 8.44
    '138':
      text: “Pampana ŋa N teɛroŋ zaa gyɛrɛɛ la.
      sbs: 0.6462
      gen_sec: 3.08
      ref_sec: 3.38
    '140':
      text: A Daana la na wa e ka yɛlɛ naŋ sɔgle lige poɔ sãã veɛloŋ ka bon naŋ be sukyiri poɔ meŋ sãã.
      sbs: 0.6253
      gen_sec: 9.2
      ref_sec: 7.44
    '141':
      text: A Yeezu da yi la a be a wa O meŋɛ teŋɛ poɔ, ka a O potuuribo da tu O wa.
      sbs: 0.6378
      gen_sec: 9.08
      ref_sec: 4.6
    '142':
      text: N na iri la a gaa a N saa zie a te yeli ko o, “N saa, N eɛɛ yelbieri a kyaare Naaŋmen ane
        fõõ.
      sbs: 0.6401
      gen_sec: 12.08
      ref_sec: 8.56
    '143':
      text: Ba da ko o la sori meŋ ka o zɔɔ ne a nensonne a toɔ̃ ba.
      sbs: 0.5671
      gen_sec: 5.56
      ref_sec: 3.52
    '144':
      text: 'Azuiŋ, yɛ ko a teŋɛzu yɛlɛ zaa naŋ be yɛ enneŋ: peɛ̃mo toma, yeldɛgɛ, vɔlfaare, yelfaare
        boɔbo ane bombɔ-gaŋne .'
      sbs: 0.6348
      gen_sec: 13.76
      ref_sec: 10.3
    '149':
      text: A banaŋ naŋ puoro a wɛdoŋɔ ane a o teebo ane neɛzaa naŋ de a o yuori ŋmaaroŋ daŋ koŋ nyɛ pɛnnoo
        ŋmenaa bee tensogɔ.
      sbs: 0.5729
      gen_sec: 22.24
      ref_sec: 10.84
    '150':
      text: Maata la da kaara a bondirii yɛlɛ, ka Laazoro da e a neɛ na kaŋ naŋ da laŋ zeŋ a diibu zie
        ne a Yeezu.
      sbs: 0.6263
      gen_sec: 9.04
      ref_sec: 7.98
    '151':
      text: fo naŋ nare biŋ a andonɛɛ zaa niŋesogɔ.
      sbs: 0.5869
      gen_sec: 4.44
      ref_sec: 3.0
    '153':
      text: N erɛ la ama zaa a Ŋmen-yelnoore zuiŋ, ka ka N na toɔ̃ nyɛ a yelnoore maaloo.
      sbs: 0.6073
      gen_sec: 9.56
      ref_sec: 4.82
    '154':
      text: O da laŋ kpeɛrɛ ne la a wɛdonne; ka a malekere da kaara O zie.
      sbs: 0.5798
      gen_sec: 6.88
      ref_sec: 4.12
    '156':
      text: A Yeezu da zɛge la O zu a nyɛ bondaanema naŋ eŋnɛ ba kyɔɔtaare a kyɔɔtaare daga poɔ.
      sbs: 0.5713
      gen_sec: 8.92
      ref_sec: 6.0
    '157':
      text: Yɛ nyɛ, N tonɔ yɛ la aŋa pebilii ka yɛ yi te kpɛ gboŋgboe poɔ.
      sbs: 0.6199
      gen_sec: 6.64
      ref_sec: 4.98
    '158':
      text: Yɛ ta erɛ ka a Naaŋmen Vooroŋ Soŋ poɔ saana, Ona la a ŋmaaroŋ Naaŋmen naŋ eŋ yɛ a kyɛllɛ ne
        a faabo bebiri.
      sbs: 0.5928
      gen_sec: 11.48
      ref_sec: 6.72
    '159':
      text: N sɔre la a fo potuuribo ka ba digi a sefaa ka o yi, kyɛ ka ba digi fãã.
      sbs: 0.5591
      gen_sec: 6.68
      ref_sec: 6.1
    '160':
      text: Bonso, a Laazoro kuuni poɔ leɛ-iruu yɛlɛ la so ka a Gyuumine yaga da sagra derɛ a Yeezu yɛlɛ
        kyɛ zagra a ba yɛlɛ.
      sbs: 0.616
      gen_sec: 13.24
      ref_sec: 8.62
    '165':
      text: Leɛ-teɛre nyɛ bonna naŋ da e ka fo le; leɛ fo eebo a kyɛ tonɔ a toma na fo naŋ da tonɔ a dɛndɛŋ
        saŋ.
      sbs: 0.5581
      gen_sec: 12.12
      ref_sec: 7.78
    '170':
      text: ka turi pie ne turi ayi da yi a Bɛŋgyamen bale poɔ ka ba da eŋ a ŋmaaroŋ.
      sbs: 0.6158
      gen_sec: 8.2
      ref_sec: 6.14
    '173':
      text: A ba seŋ ka o e Kiristabi-paalaa, ka lɛ naane, o na baŋ paale ne la pɔloo a le a sebɛlbɛllɛ
        dɔgroŋ poɔ.
      sbs: 0.6064
      gen_sec: 9.68
      ref_sec: 7.02
    '174':
      text: Ka Yeezu da soore a bege baŋnema ane a Faraziimine, “Sori bebe la ka ba saŋ baala a pɛnnoo
        bebiri daare bee sori kyebe.
      sbs: 0.6212
      gen_sec: 11.32
      ref_sec: 9.08
    '175':
      text: Ona la vɛŋ ka te baŋ lɛ yɛ naŋ taa nɔmmo a Vooroŋ Soŋ poɔ.
      sbs: 0.6008
      gen_sec: 5.32
      ref_sec: 3.9
    '176':
      text: Yɛ naŋ sage tu a yelmeŋɛ pampana, yɛ pɛge la a yɛ seere ka ka yɛ na taa nɔmmo naŋ sereŋ e
        meŋɛ.
      sbs: 0.6324
      gen_sec: 11.52
      ref_sec: 8.06
    '177':
      text: Kyɛ a Soŋ Soba da sɔ yɛ la kããsoŋ, ka yɛ zaa taa yelbammo.
      sbs: 0.6543
      gen_sec: 5.48
      ref_sec: 4.56
    '178':
      text: ka turi pie ne turi ayi da yi a Manaasɛ bale poɔ.
      sbs: 0.6441
      gen_sec: 4.12
      ref_sec: 4.14
    '179':
      text: Yiri na zaa poɔ yɛ naŋ wa kpɛ, yɛ daŋ yeli, ‘Ka maaroŋ be a yiri ŋa poɔ!
      sbs: 0.6658
      gen_sec: 8.2
      ref_sec: 5.22
    '181':
      text: Bee boŋ la ka Kiristabie ne neɛ naŋ ba sage de a Kirista yɛlɛ laŋ?
      sbs: 0.5802
      gen_sec: 6.28
      ref_sec: 3.58
    '182':
      text: Yɛ ta wa poɔrɔ sazu, bonso, o e la Naaŋmen nakogi, bee a poɔrɔ a teŋɛ, bonso, o meŋ waa la
        a Naaŋmen gbɛɛ-bimmu zie.
      sbs: 0.6539
      gen_sec: 14.72
      ref_sec: 11.22
    '184':
      text: Te da taa la yɛ vɔlaa kyɛ da nɔnɔ yaga ka te wa ka te nyɛ taa nimisogre.
      sbs: 0.5927
      gen_sec: 6.92
      ref_sec: 4.98
    '187':
      text: A gaŋ a zaa, yɛ de nɔmmo su pɔge yɛmenne, ona la maŋ leŋ boma zaa lantaa velaa zaa.
      sbs: 0.5928
      gen_sec: 8.72
      ref_sec: 5.7
    '189':
      text: Pampana ŋa, N de yɛ la ko Naaŋmen ane a Naaŋmen yelbiri garaaseɛ.
      sbs: 0.6492
      gen_sec: 6.64
      ref_sec: 4.66
    '190':
      text: Ba naŋ da ba nyɛ O, ba da leɛ gaa la a Gyɛruzɛlɛm ka ba te bɔ O.
      sbs: 0.5622
      gen_sec: 5.72
      ref_sec: 4.26
    '191':
      text: ” Kyɛ ba da ba baŋ a yɛlɛ O naŋ yeli ko ba tɛgɛ.
      sbs: 0.6157
      gen_sec: 4.68
      ref_sec: 8.26
    '192':
      text: ” A yeli ŋa da wa ne la tage taa, ka nɔkpeɛne da kpɛ a Pɔɔl ane Banabase ane a noba na sogɔŋ.
      sbs: 0.5959
      gen_sec: 10.12
      ref_sec: 7.4
    '195':
      text: Azuiŋ, yɛ baŋ ne a, a ta inni ka yuomo ata tensogɔ bee ŋmenaa, ka N ba nage ka N kpãã yɛ ane
        nentaŋ.
      sbs: 0.627
      gen_sec: 10.44
      ref_sec: 8.14
    '197':
      text: Te nyɛ la dɔgɛɛ boorɔ zaa, kyɛ naŋ voorɔ; ka te teɛroŋ gyɛre, kyɛ ka te nuuri ba yoɔrɔ.
      sbs: 0.6222
      gen_sec: 9.4
      ref_sec: 6.04
    '198':
      text: N na boɔrɔ la ka yɛ zaa yele kɔkɔsaama, kyɛ a gaŋ a zaa N na boɔrɔ la ka yɛ yele Ŋmen-yelmanna
        yelyelii.
      sbs: 0.615
      gen_sec: 9.96
      ref_sec: 6.62
    '199':
      text: Enyaabo zaa daŋ ba pɔge yɛ naŋ daŋ ba pɔge nensaala.
      sbs: 0.6031
      gen_sec: 5.2
      ref_sec: 3.24
    '202':
      text: A banaŋ N naŋ nɔŋ la ka N maŋ wuli kyɛ tage ba tobo.
      sbs: 0.5677
      gen_sec: 6.36
      ref_sec: 3.16
    '203':
      text: A Naaŋmen da di la a Davil danseɛ a yeli, ‘N nyɛ la Davil, a Gyɛse bidɔɔ, ka o waa N yɛŋ neɛ.
      sbs: 0.6314
      gen_sec: 11.32
      ref_sec: 6.96
    '204':
      text: Lɛ la ka a bie da yeli ko a o saa, ‘N saa, N sãã la Naaŋmen poɔ, a sãã fo meŋ poɔ.
      sbs: 0.6703
      gen_sec: 9.6
      ref_sec: 6.42
    '205':
      text: A bama moɔlɔ la a Kirista yɛlɛ ne nɔmmo, a baŋ ka ba eŋ ma la a kyɛ N naŋ zɔɔrɔ a Ŋmen-yelnoore
        zɔɔre zuiŋ.
      sbs: 0.6099
      gen_sec: 10.0
      ref_sec: 7.48
    '207':
      text: Ka o da boɔle a gbaŋgbaa kaŋ a soore o bonna naŋ erɛ.
      sbs: 0.6103
      gen_sec: 5.8
      ref_sec: 3.9
    '208':
      text: Yeezu Naŋ Saŋ Neɛ Kaŋ Ba Naŋ Dɔge Ne Zɔnnoŋ.
      sbs: 0.5979
      gen_sec: 8.52
      ref_sec: 3.56
    '209':
      text: ka turi pie ne turi ayi da yi a Nafetali bale poɔ.
      sbs: 0.6614
      gen_sec: 4.96
      ref_sec: 4.0
    '211':
      text: Moozul da yelee la, ‘A Daana a yɛ Naaŋmen na iri la Ŋmen-yelmanna a yɛ meŋɛ noba poɔ ka o
        waa aŋa maa.
      sbs: 0.6295
      gen_sec: 9.96
      ref_sec: 7.9
    '212':
      text: “Yuomo lezaayi puoriŋ, maleke da wuli la o meŋɛ ko a Moozul vũũ naŋ da dire tuu kaŋ poɔ a
        Sanae taŋ wɛgyɛŋ poɔ.
      sbs: 0.5886
      gen_sec: 13.72
      ref_sec: 9.28
    '214':
      text: 'Kyɛ fo taa la garebanyɛ ne a yeli ŋa: fo kyiire la a Nikoletan deme tontonne na N meŋ naŋ
        kyiire.'
      sbs: 0.5737
      gen_sec: 10.8
      ref_sec: 6.68
    '215':
      text: Pampana, a malekere ayopoĩ na naŋ da taa a eelɛ ayopoĩ da narɛɛ la ka ba peɛle a eelɛ.
      sbs: 0.644
      gen_sec: 8.92
      ref_sec: 7.48
    '217':
      text: ” A Yeezu naŋ da woŋ a ŋaa, O da yeli ko la a dɔɔ, “Yelyeni kaŋ la kyɛre ka fo ba taa.
      sbs: 0.5434
      gen_sec: 10.52
      ref_sec: 6.44
    '219':
      text: ’ Lɛ la ka a saa da de a o boma poŋ a o biiri na bayi.
      sbs: 0.6179
      gen_sec: 6.68
      ref_sec: 3.54
    '220':
      text: yɛ ta dare a yɛ sukyie aŋa lɛ a yɛ sããkommine naŋ da zɔɔ ne Naaŋmen.
      sbs: 0.5635
      gen_sec: 6.24
      ref_sec: 5.5
    '221':
      text: Ka Yeezu yeli, “Pɔlbile, maa yeli ko fo, vaa-iri!
      sbs: 0.5846
      gen_sec: 6.8
      ref_sec: 4.68
    '224':
      text: A yelwolɔ naŋ waana zuiŋ, N teɛre ka a na soma la ka neɛzaa naŋ kyɛnɛ waa lɛ zaa o naŋ da
        waa.
      sbs: 0.6205
      gen_sec: 7.28
      ref_sec: 7.48
    '225':
      text: Maa Gyɔɔn la a soba na naŋ da woŋ kyɛ nyɛ a yɛlɛ ama.
      sbs: 0.6584
      gen_sec: 4.84
      ref_sec: 10.56
    '226':
      text: Ona la e ka te taa faŋ a waa a nɔpaalaa tontonema.
      sbs: 0.5851
      gen_sec: 5.6
      ref_sec: 3.28
    '227':
      text: A yɛlɛ na eŋ naŋ kyɛre, N na wuli yɛ la ka maa wa wa yɛ zie.
      sbs: 0.6693
      gen_sec: 7.04
      ref_sec: 6.74
    '228':
      text: a zɔɔrɔ ne a Daana ane a O Mɛzaaya.
      sbs: 0.6095
      gen_sec: 5.16
      ref_sec: 3.3
    '229':
      text: Yɛ nyɛ nɔmmo na tɔ a Saa naŋ nɔŋ te, a e ka ba boɔlɔ te Naaŋmen bibiiri; ka te sereŋ waa a
        lɛ.
      sbs: 0.6465
      gen_sec: 8.84
      ref_sec: 7.2
    '230':
      text: O da gaa te de la a gane yi a soba na naŋ da zeŋ a nakogi zu nuduluŋ poɔ.
      sbs: 0.5946
      gen_sec: 8.36
      ref_sec: 4.9
    '231':
      text: Yɛ saŋna a baalba naŋ be a be, kyɛ yeli ko ba, ‘A Naaŋmen naaloŋ wa peɛle yɛ la.
      sbs: 0.6141
      gen_sec: 7.44
      ref_sec: 5.5
    '233':
      text: Kyɛ tɔnɔ na zaa N naŋ da nyɛ, N de a la ka a waa zaglaa a Kirista zuiŋ.
      sbs: 0.6136
      gen_sec: 6.36
      ref_sec: 5.24
    '234':
      text: Kyɛ soba na zaa naŋ ba sage de a yelbiri na wɛ la.
      sbs: 0.6266
      gen_sec: 4.8
      ref_sec: 3.1
    '235':
      text: A ŋa la a n noɔre N naŋ wullo a puoruu laŋne yie zaa poore.
      sbs: 0.6155
      gen_sec: 7.72
      ref_sec: 3.88
    '236':
      text: 'Serɛzaa ka N yele korɔ yɛ: Gyɔɔn Bati e la kpoŋ gaŋ banaŋ zaa pɔgeba naŋ dɔge a teŋɛzu.'
      sbs: 0.6305
      gen_sec: 9.6
      ref_sec: 6.58
    '237':
      text: Bonso, dɔgroŋ la so ka dabeɛ̃ bebe, kyɛ neɛ na zaa naŋ zoro dabeɛ̃ ba taa nɔmmo naŋ e soŋ.
      sbs: 0.6192
      gen_sec: 9.24
      ref_sec: 7.54
    '238':
      text: Azuiŋ a ferɛɛ la ka te maaleŋ kyɛlle velaa bon te naŋ da woŋ, ka te ta wa sare yi a poɔ.
      sbs: 0.5999
      gen_sec: 9.28
      ref_sec: 7.8
    '239':
      text: ” Ka O yeli sɔge ba, “Nembuo la N ma ane N yɔɔmine?
      sbs: 0.5718
      gen_sec: 6.16
      ref_sec: 7.36
    '240':
      text: A yɛlɛ ama da eɛɛ la ka a e yelwulaa ko te, ka ka te na ta boɔrɔ yelfaare aŋa ba naŋ da e
        lɛ.
      sbs: 0.6377
      gen_sec: 16.28
      ref_sec: 6.92
    '241':
      text: Kyɛ ka o naŋ wa poɔ̃, o maŋ buli la a eŋ bie yaga.
      sbs: 0.6482
      gen_sec: 5.04
      ref_sec: 3.5
    '242':
      text: A ŋaa la vɛŋ ka te ba zoro dabeɛ̃ a Naaŋmen niŋeŋ a yi a Kirista zuiŋ.
      sbs: 0.608
      gen_sec: 6.4
      ref_sec: 4.86
    '243':
      text: Kyɛ Pɔɔl da ba boɔrɔ ka o taa neɛ naŋ da zo kyɛ bare ba Pamfiliya poɔ, a ba tu ba a toŋ a
        toma.
      sbs: 0.6097
      gen_sec: 8.52
      ref_sec: 7.42
    '244':
      text: Kyɛ ŋmenaa naŋ da wa do, a bombulo da zoɔlɛɛ la, a ko, a naŋ da ba taa nyaga zuiŋ.
      sbs: 0.6208
      gen_sec: 9.56
      ref_sec: 6.62
    '245':
      text: A weɛ soba da naŋ taa la neŋyenaa kaŋ, a o poyɛŋ bie.
      sbs: 0.6168
      gen_sec: 5.92
      ref_sec: 3.66
    '246':
      text: N naŋ da wa nyɛ o, N noɔre da maaɛ la yaga.
      sbs: 0.6281
      gen_sec: 4.92
      ref_sec: 3.1
    '247':
      text: Dabeɛ̃ ne nɔmaa da kpɛ ba la ne a yeli ŋa naŋ da e a gbɛre ŋa zie.
      sbs: 0.5815
      gen_sec: 6.16
      ref_sec: 6.38
    '250':
      text: A Fɛstu pãã da tere la noɔre, ka ba taa a Pɔɔl wa ne.
      sbs: 0.5867
      gen_sec: 5.24
      ref_sec: 3.48
    '252':
      text: Pampana ŋa, vi ba erɛ ma, ka maa gba erɛ pɔloo yaga ne a kpeɛ̃õ a Daana naŋ tere ka N de maale
        ne yɛ.
      sbs: 0.6031
      gen_sec: 10.92
      ref_sec: 6.86
    '253':
      text: ” Ka Yeezu da yeli ko o, “Yelmeŋɛ ka N yele korɔ yɛ.
      sbs: 0.5742
      gen_sec: 5.96
      ref_sec: 9.28
    '256':
      text: Yɛ vɛŋ ka neɛzaa maŋ sigre o meŋɛ korɔ a teŋɛzu wederebɛ; bonso, wederɛ zaa ba kyebe ka Naaŋmen
        zie naane ka o yi.
      sbs: 0.6016
      gen_sec: 13.28
      ref_sec: 8.34
    '257':
      text: Yelmeŋɛ zaa la ka N yele korɔ yɛ, ka kabiri ba le teŋɛ a poɔ̃, o maŋ e la kabi-yeni.
      sbs: 0.6205
      gen_sec: 7.28
      ref_sec: 5.78
    '260':
      text: Ka maa pãã la bee ka bana la, a yeli ŋa la ka te moɔle ka yɛ da sage de.
      sbs: 0.6245
      gen_sec: 6.76
      ref_sec: 5.08
    '262':
      text: O eŋɛ da kɔɔ guree la, ka o da kontoɔ̃ dɔle o meŋɛ.
      sbs: 0.5492
      gen_sec: 5.6
      ref_sec: 3.74
    '263':
      text: Bonso, a ba seŋ ka o voorɔ.
      sbs: 0.635
      gen_sec: 3.24
      ref_sec: 8.1
    '264':
      text: 'Bonso, o yeli la o poɔŋ: ‘N dire la naaloŋ aŋa pɔgenaa; N ba waa pɔgekoɔre.'
      sbs: 0.5775
      gen_sec: 12.96
      ref_sec: 7.4
    '265':
      text: Kyɛ a Yeezu da ba yeli ko o ka o koŋ kpi.
      sbs: 0.5783
      gen_sec: 4.32
      ref_sec: 8.18
    '269':
      text: Neɛ kaŋ da soore O la, “Daana, noba belaa la na nyɛ faabo be?
      sbs: 0.5878
      gen_sec: 7.8
      ref_sec: 5.22
    '270':
      text: A apostoliimine ane a nembɛrɛ da laŋ la taa ka ba kaa a yeli ŋa nyɛ.
      sbs: 0.6135
      gen_sec: 6.84
      ref_sec: 5.22
    '271':
      text: bonso, fo yɔɔ la a fo tontonema, a Ŋmen-yelmanneba.
      sbs: 0.579
      gen_sec: 6.52
      ref_sec: 3.84
    '272':
      text: Yɛ ta de faaloŋ yɔɔ ne neɛzaa naŋ e yɛ faaloŋ; kyɛ yɛ maŋ moɔrɔ ka yɛ erɛ yɛlɛ naŋ soma noba
        zaa zie.
      sbs: 0.6187
      gen_sec: 11.36
      ref_sec: 7.24
    '273':
      text: O ba kye kyɛ, ba eɛɛ la ka O leɛ-iri yi a kuuni poɔ.
      sbs: 0.6077
      gen_sec: 6.04
      ref_sec: 4.26
    '274':
      text: Bonso, ba sɛge la a Moozul begɛ poɔ, “Ta leŋ a naadɛre naŋ ŋmeɛrɛ kyi noɔre.
      sbs: 0.6001
      gen_sec: 9.76
      ref_sec: 6.58
    '276':
      text: N maŋ leŋ la noɔre gbɛre boyi daa gbuli zaa poɔ.
      sbs: 0.6256
      gen_sec: 5.4
      ref_sec: 3.1
    '277':
      text: ” A noba naŋ da bebe da ta ŋa turi anuu.
      sbs: 0.5822
      gen_sec: 4.6
      ref_sec: 3.76
    '278':
      text: 'Ba maŋ vɔge la a ba nazupile biŋ a nakogi niŋesogɔ, kyɛ yiele: “Te Daana Naaŋmen, fo seŋ
        ne la.'
      sbs: 0.6028
      gen_sec: 3.28
      ref_sec: 7.9
    '279':
      text: 'Kyɛ a danseɛ la ŋa: Naaŋmen ko te la nyɔvore naŋ ba taa baaraa, ka a nyɔvore ŋa be a O Bie
        poɔ.'
      sbs: 0.6463
      gen_sec: 11.32
      ref_sec: 6.84
    '281':
      text: A pɔge da su la kpareze-velaa, ka o lenni ne salema ane lɛɛbie ane kusi-veɛle.
      sbs: 0.6107
      gen_sec: 8.2
      ref_sec: 6.68
    '282':
      text: A zenɛ ŋa, ba dɔge la a yɛ Faara a Davil teŋkpoŋ poɔ, Ona la a Mɛzaaya, a Daana.
      sbs: 0.5639
      gen_sec: 7.96
      ref_sec: 6.9
    '284':
      text: Azuiŋ ba da ŋmaa la kpaakpaa vaare, a yi ka ba te tuori O.
      sbs: 0.589
      gen_sec: 5.92
      ref_sec: 4.78
    '286':
      text: Amine meŋ da le la tɛnnoɔ poɔ, a buli, a maale eŋ bie kɔɔ.
      sbs: 0.6394
      gen_sec: 10.48
      ref_sec: 4.96
    '287':
      text: Ba da ba puori a wɛdoŋɔ bee a o teebo, a da ba de a o ŋmaaroŋ a ba gberi bee ba nuuri eŋɛ.
      sbs: 0.6229
      gen_sec: 11.84
      ref_sec: 7.26
    '288':
      text: Ba maŋ erɛ la a lɛ a na de bon naŋ maŋ wɛ, kyɛ tenee deni ba weɛrɛ.
      sbs: 0.603
      gen_sec: 7.4
      ref_sec: 4.84
    '289':
      text: Ka fõõ wa to fo yɔɔ bee fo yɔɔpuulee, a seŋ ka ba zeŋ ne fo nembɛrɛ niŋesogɔ.
      sbs: 0.6127
      gen_sec: 9.44
      ref_sec: 6.08
    '290':
      text: Naboma Naŋ Be Yagraa Dogre Poɔ.
      sbs: 0.5899
      gen_sec: 4.52
      ref_sec: 4.54
    '292':
      text: Lɛ la ka o toŋ ka ba te ko bibiiri na zaa naŋ ta yuomo ayi kyɛ sigre, a Bɛtelɛhɛm ane o tembilii
        poore.
      sbs: 0.5932
      gen_sec: 11.36
      ref_sec: 8.1
    '293':
      text: A o soba ta boɔrɔ ka o sɔglɔ a dɛgre iruu ŋmaaroŋ.
      sbs: 0.6116
      gen_sec: 6.88
      ref_sec: 3.92
    '294':
      text: Lɛ la ka Yeezu da toŋ Piita ane Gyɔɔn, a yele, “Yɛ gaa te nare a Ista tigri bondiraa ka te
        di.
      sbs: 0.6148
      gen_sec: 8.04
      ref_sec: 7.38
    '295':
      text: ” Ba naŋ da wa gbole kaa, ba ba la nyɛ neɛzaa ka a Yeezu yoŋ naane.
      sbs: 0.6384
      gen_sec: 6.88
      ref_sec: 4.52
    '298':
      text: O naŋ da wa de a suobu baare, o da be la a Filipi zie tegitegilɛ.
      sbs: 0.5816
      gen_sec: 6.32
      ref_sec: 4.48
    '299':
      text: Fo ba ŋmaa a zirii ŋa ko te kyɛ Naaŋmen la ka fo ŋmaa tere.
      sbs: 0.6117
      gen_sec: 6.12
      ref_sec: 3.62
  score: 0.6069
  partial: true
- model: k2-fsa/OmniVoice-design
  sbs: 0.657
  num_scored: 194
  uses_reference: false
  entries:
    '0':
      text: Ka maa bare ba ne a kɔŋ ka ba kulo, ba na yĩĩe la a sobiriŋ, bonso, ba mine yi la tentɔbɔ
        a wa.
      sbs: 0.5794
      gen_sec: 2.72
      ref_sec: 7.66
    '2':
      text: A Yeezu naŋ da gɛrɛ Gyɛruzɛlɛm, O da kpɛ la a teŋkponni ane a tembilii poore a kanna a noba
        gɛrɛ.
      sbs: 0.6695
      gen_sec: 4.82
      ref_sec: 7.54
    '3':
      text: A Naaŋmen Bagmaale Wederebɛ Nembɛrɛ Zusoba Naŋ Soore Yeezu Soorebie.
      sbs: 0.5996
      gen_sec: 3.57
      ref_sec: 8.22
    '5':
      text: Azuiŋ, yɛ ta daŋ di sɛrɛɛ kyɛ ka a saŋ ba ta; kyɛ ka a Daana waabo naŋ ba ta sɛre.
      sbs: 0.6635
      gen_sec: 3.58
      ref_sec: 5.84
    '7':
      text: Ba da lɔɔ o la bare ka o sigi wa a teŋɛzu, a lɔɔ a o malekere meŋ poɔ o eŋɛ.
      sbs: 0.6885
      gen_sec: 3.67
      ref_sec: 6.06
    '8':
      text: Ka a toŋkpeɛne ama naŋ toŋ fo poɔ, da toŋ Sodom teŋɛ poɔ, o da na kyɛnɛ bebe la wa ta zenɛ.
      sbs: 0.7155
      gen_sec: 3.86
      ref_sec: 7.3
    '10':
      text: A banaŋ naŋ da zo yaare da yi yoɔrɔ la, a moɔlɔ a yelbiri.
      sbs: 0.6272
      gen_sec: 2.94
      ref_sec: 5.66
    '11':
      text: N poyɛŋ noba, nɔpaalaa naane ka N sɛgrɛ korɔ yɛ, kyɛ a nɔkoraa na yɛ naŋ da taa yi a piiluu
        saŋ la.
      sbs: 0.6799
      gen_sec: 4.99
      ref_sec: 8.0
    '12':
      text: ” Ka Yeezu da yeli, “Yɛ e ka a noba zeŋ teŋɛ.
      sbs: 0.6492
      gen_sec: 2.08
      ref_sec: 14.68
    '13':
      text: Wola pãã ka a weɛ soba na e a wɛkaareba ŋa?
      sbs: 0.7127
      gen_sec: 1.95
      ref_sec: 3.42
    '15':
      text: Ona la boɔrɔ ka neɛzaa nyɛ faabo a kyɛ wa baŋ a yelmeŋɛ.
      sbs: 0.6763
      gen_sec: 2.75
      ref_sec: 3.56
    '19':
      text: Pɔɔl Naŋ Puori A Filipae Deme Yaane.
      sbs: 0.6456
      gen_sec: 0.68
      ref_sec: 5.12
    '20':
      text: Bonso, ba da ba sage de a banaŋ zaa naŋ da wa yeli a O kuuni poɔ leɛ-iruu yɛlɛ ko ba.
      sbs: 0.6822
      gen_sec: 3.84
      ref_sec: 5.86
    '21':
      text: ” Ba da do la a sazu a zunzugri poɔ ka a ba dɔndɔnne da kaara ba.
      sbs: 0.6438
      gen_sec: 3.32
      ref_sec: 4.64
    '25':
      text: Kyɛ a ŋaa la ka yɛ mine da waa, kyɛ ka ba da pɛge yɛ.
      sbs: 0.6673
      gen_sec: 2.68
      ref_sec: 3.38
    '27':
      text: Ka fõõ meŋɛ soore o, fo na nyɛ la ka a yɛlɛ zaa te naŋ yeli kyaare ne o waa la a lɛ.
      sbs: 0.683
      gen_sec: 3.73
      ref_sec: 5.82
    '28':
      text: “Daana, a piiluu saŋ, fõõ la iri a teŋɛ.
      sbs: 0.5921
      gen_sec: 0.5
      ref_sec: 3.28
    '29':
      text: Bebie ata puoriŋ, a Pɔɔl da boɔle la a Gyuumine nembɛrɛ naŋ da be a be lantaa.
      sbs: 0.6329
      gen_sec: 3.9
      ref_sec: 5.56
    '30':
      text: A Maleke Na Naŋ Taa A Ganlee Yɛlɛ.
      sbs: 0.7383
      gen_sec: 0.89
      ref_sec: 3.8
    '31':
      text: Nɔmmo maŋ taa la teɛretɔroo ne yelzaa kyɛ maŋ di kannyiri ne yelzaa.
      sbs: 0.6593
      gen_sec: 3.61
      ref_sec: 3.94
    '32':
      text: N naŋ da wa nyɛ O, N da le vɔgle la muro O gbɛɛ puliŋ a waa ŋa neɛ naŋ kpi.
      sbs: 0.6909
      gen_sec: 3.48
      ref_sec: 5.86
    '36':
      text: Lɛ la ka o da boɔle o a soore o, ‘Boŋ la ka N wono kyaare ne fo ya?
      sbs: 0.7115
      gen_sec: 2.83
      ref_sec: 4.14
    '37':
      text: Yɛ kaa a Izerayɛl biiri nyɛ; a banaŋ naŋ maŋ di a Naaŋmen bagmaale boma, ba ba maŋ waa a Naaŋmen
        bagmaalkuuri laŋne deme be?
      sbs: 0.6751
      gen_sec: 6.61
      ref_sec: 7.62
    '38':
      text: Kyɛ N na ko la a N dansediribe bayi naŋ su boɔre kparre kpeɛ̃õ ka ba yeli Ŋmen-yelmanna yelyelii
        bebie turi dɔgle kɔɔraayi ne lezaata.
      sbs: 0.6175
      gen_sec: 6.74
      ref_sec: 12.4
    '39':
      text: Te sɛgrɛ la a yɛlɛ ama ka ka a te kyelloo na paale.
      sbs: 0.6645
      gen_sec: 2.79
      ref_sec: 3.98
    '40':
      text: ka ba da de O do ne sazu ne puubu.
      sbs: 0.636
      gen_sec: 2.12
      ref_sec: 4.84
    '44':
      text: 'Azuiŋ la ka ba yeli: “Gɔŋgbire, iri!'
      sbs: 0.6081
      gen_sec: 2.24
      ref_sec: 3.24
    '46':
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.6469
      gen_sec: 3.63
      ref_sec: 5.94
    '47':
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.6401
      gen_sec: 4.32
      ref_sec: 14.94
    '48':
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.6427
      gen_sec: 5.04
      ref_sec: 6.46
    '52':
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.6643
      gen_sec: 2.2
      ref_sec: 5.8
    '53':
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.6437
      gen_sec: 4.08
      ref_sec: 6.64
    '54':
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.6958
      gen_sec: 2.72
      ref_sec: 4.32
    '56':
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.692
      gen_sec: 4.23
      ref_sec: 7.02
    '57':
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.6707
      gen_sec: 3.87
      ref_sec: 5.42
    '58':
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.6637
      gen_sec: 4.62
      ref_sec: 7.12
    '61':
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.6274
      gen_sec: 4.05
      ref_sec: 5.42
    '62':
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.4416
      gen_sec: 2.29
      ref_sec: 3.44
    '63':
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.6795
      gen_sec: 3.25
      ref_sec: 4.66
    '64':
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.6588
      gen_sec: 3.6
      ref_sec: 4.9
    '65':
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
      sbs: 0.7079
      gen_sec: 3.44
      ref_sec: 7.08
    '66':
      text: 'Lɛ la ka N da woŋ kɔkɔre kaŋ a saluoni poɔ ka o yele: “N noba, yɛ wa yi o poɔ.'
      sbs: 0.7024
      gen_sec: 1.89
      ref_sec: 6.26
    '67':
      text: O da iri arɛɛ la ka O sɔre, ka ba de a Ŋmen-yelmanna Azaaya gansɛgraa ko O.
      sbs: 0.5947
      gen_sec: 4.15
      ref_sec: 13.28
    '69':
      text: Neɛzaa ba nyɛ fo saanaa ka fo seŋ ne la kũũ be?
      sbs: 0.7222
      gen_sec: 1.68
      ref_sec: 3.28
    '70':
      text: A ŋaa la tori kyɛ pɛllɛ Naaŋmen a te Faara poɔ.
      sbs: 0.684
      gen_sec: 2.23
      ref_sec: 3.26
    '71':
      text: Te da kpɛ la a gbori a be ka Arestaku naŋ da waa Masedoniya neɛ kyɛ da yi Tɛsalonika da beɛle
        te.
      sbs: 0.6607
      gen_sec: 5.21
      ref_sec: 7.84
    '72':
      text: Pampana, nembuo mɔɔ la na e yɛ yelfaa, ka yɛneŋ wa kyerɛ ka yɛ e yɛlɛ naŋ e velaa?
      sbs: 0.7047
      gen_sec: 4.01
      ref_sec: 6.04
    '73':
      text: A soba na naŋ da faa te yi ne a dɔgɛɛ naŋ tɔgle kũũ, naŋ na kyɛnɛ faa te la.
      sbs: 0.6475
      gen_sec: 3.64
      ref_sec: 5.32
    '74':
      text: 'Ba sɛge la a begɛ gane poɔ: “Noba naŋ yele kɔkɔsaama.'
      sbs: 0.6883
      gen_sec: 1.78
      ref_sec: 5.08
    '75':
      text: Biiri na kyiiri la ba dɔgreba a vɛŋ ka ba ko ba.
      sbs: 0.6208
      gen_sec: 1.44
      ref_sec: 3.32
    '76':
      text: Yɛ erɛ yɛlɛ ne yɛŋ a kyaara noba na naŋ ba poɔ yɛ poɔ, kyɛ maŋ vɛŋ ka wagre zaa yire tɔnɔ.
      sbs: 0.6609
      gen_sec: 4.33
      ref_sec: 6.24
    '77':
      text: A ŋaa zie la ka te baŋ ka a baaraa saŋ taɛ la.
      sbs: 0.6831
      gen_sec: 2.24
      ref_sec: 3.6
    '79':
      text: Kyɛ ba da de la soba na zaa yuori ba naŋ ba sɛge eŋ a nyɔvore gane poɔ lɔɔ eŋ a baa vũũ poɔ.
      sbs: 0.675
      gen_sec: 4.03
      ref_sec: 9.34
    '80':
      text: A dɛndɛŋ soba da yi waɛ la, a wa yeli, ‘Daana, a fo warbiri yi la warbie pie tɔnɔ dɔgle o
        zu.
      sbs: 0.688
      gen_sec: 4.46
      ref_sec: 7.52
    '81':
      text: 'A yelwulaa yɛ naŋ na nyɛ la ŋa: yɛ na nyɛ la bie ba naŋ pilli ne bipɛmɛ a gaale O donne bondi
        gbori poɔ.'
      sbs: 0.6157
      gen_sec: 5.19
      ref_sec: 8.0
    '82':
      text: Nemmeŋɛ maŋ iri la bonsonne yi o nabonsonne poɔ, ka nenfaa meŋ maŋ iri bonfaare yi o nabonfaare
        poɔ.
      sbs: 0.5863
      gen_sec: 5.17
      ref_sec: 4.78
    '86':
      text: Bonso, neɛzaa koŋ la baŋ biŋ yiri pare zaa ka a onaŋ ba naŋ biŋ naane; a yiri pare ŋa la a
        Yeezu Kirista.
      sbs: 0.6459
      gen_sec: 4.97
      ref_sec: 8.06
    '87':
      text: A O eŋɛ la ka a yiri lamboe zaa mɛ lantaa a baa te leɛ Naaŋmen die naŋ e soŋ a be a Daana
        eŋɛ.
      sbs: 0.6747
      gen_sec: 4.62
      ref_sec: 6.34
    '88':
      text: ” Ka O yeli ko ba, “N nyɛ la Setaana ka o yi sazu a le teŋɛ a ŋa saa naŋ nyegre.
      sbs: 0.6684
      gen_sec: 3.15
      ref_sec: 5.76
    '89':
      text: Kyɛ deɛ yeli a yelbiri yoŋ, a vɛŋ ka N gbaŋgbaa nyɛ o sammo.
      sbs: 0.6506
      gen_sec: 2.62
      ref_sec: 4.36
    '90':
      text: ” O da kaara ba la polipoli a teɛre ka ba na ko o la bonkaŋ.
      sbs: 0.5272
      gen_sec: 0.44
      ref_sec: 3.88
    '93':
      text: Ka maa puori Naaŋmen ameseɛrɛ kyɛ di a bondirii, bonso ka ba na saana n yuori ne bondirii
        N naŋ puori Naaŋmen ameseɛrɛ kyɛ di?
      sbs: 0.6745
      gen_sec: 6.91
      ref_sec: 7.7
    '94':
      text: Saa nyegroo ane hooroo ane saa tannoo da yire la a nakogi zie, kyɛ ka fentele ayopoĩ da dire
        a nakogi niŋesogɔ.
      sbs: 0.595
      gen_sec: 6.15
      ref_sec: 10.42
    '95':
      text: N da guoli yɛ la ane beroŋ, a da ba e bondi-tage, bonso, yɛ da naŋ ba ta bondi-tage diibu.
      sbs: 0.6331
      gen_sec: 4.49
      ref_sec: 7.16
    '96':
      text: Yuoni zaa poɔ a Yeezu dɔgrebɔ da maŋ gaa la Gyɛruzɛlɛm a te di a Ista tigri.
      sbs: 0.6363
      gen_sec: 3.88
      ref_sec: 5.88
    '97':
      text: Ka a naŋ wa seŋ ka N meŋ gaa, ba na beɛle ma la ka te gaa.
      sbs: 0.6282
      gen_sec: 0.42
      ref_sec: 3.68
    '99':
      text: Ba da teɛre ka O be la a noba poɔ ka ba zaa kyɛnɛ a sori poɔ.
      sbs: 0.6693
      gen_sec: 3.15
      ref_sec: 4.2
    '101':
      text: Neɛzaa kontoɔ̃ pigi ma sori ka N ta ire n meŋɛ yuori!
      sbs: 0.6763
      gen_sec: 2.44
      ref_sec: 3.5
    '103':
      text: Te baŋ ka te yi la kũũ poɔ a kpɛ nyɔvore poɔ, te naŋ nɔŋ taa zuiŋ.
      sbs: 0.6938
      gen_sec: 3.4
      ref_sec: 4.58
    '104':
      text: N baŋ ka a N gaabo puoriŋ, noba mine naŋ waa ŋa gboŋgbo-faare na wa kpɛ la yɛ poɔ, a koŋ bare
        a peere.
      sbs: 0.6705
      gen_sec: 4.78
      ref_sec: 7.04
    '106':
      text: O da ba di bonzaa a bebie na zaa poɔ, kyɛ O naŋ da wa te baare, kɔŋ da kpɛ O la yaga.
      sbs: 0.6381
      gen_sec: 4.36
      ref_sec: 6.58
    '109':
      text: Ba na de a la lɔɔ bare.
      sbs: 0.6691
      gen_sec: 1.44
      ref_sec: 11.98
    '112':
      text: ” Ka O yeli, “Yɛ gu yɛmenne velaa ka ba ta wa bɛlle yɛ.
      sbs: 0.708
      gen_sec: 2.52
      ref_sec: 3.4
    '113':
      text: Kyɛ a Yeezu naŋ da bale a O kyɛmmo poɔ la so ka O da wa zeŋ a bulee noɔreŋ.
      sbs: 0.6583
      gen_sec: 2.08
      ref_sec: 5.98
    '114':
      text: Ba suuri da iree la yaga ane ba naŋ da kanna a noba kyɛ moɔlɔ ka a Yeezu zie la ka kuuni leɛ-iruu
        be.
      sbs: 0.6319
      gen_sec: 5.26
      ref_sec: 7.64
    '115':
      text: Piita Ane Gyɔɔn Naŋ Are A Sɛrediribe Niŋesogɔ.
      sbs: 0.5719
      gen_sec: 2.24
      ref_sec: 3.4
    '116':
      text: Bonso, te waa la Naaŋmen tontonema naŋ laŋ tonɔ, yɛnee la a Naaŋmen weɛ, a Naaŋmen yiri.
      sbs: 0.6594
      gen_sec: 4.48
      ref_sec: 7.14
    '121':
      text: Pɔlbile kaŋ yuori naŋ da di Yutaaku da zeŋ la a takoro noɔreŋ a gbire kyuuro, a Pɔɔl naŋ da
        yele yɛlɛ.
      sbs: 0.6288
      gen_sec: 4.84
      ref_sec: 7.18
    '124':
      text: ” Ka O yeli ko o, “Bonso ka fo soorɔ ma bon naŋ e soŋ yɛlɛ?
      sbs: 0.698
      gen_sec: 2.79
      ref_sec: 4.1
    '125':
      text: A ŋaa zie la ka te maŋ baŋ a yelmeŋɛ vooroŋ ane a tuluu vooroŋ.
      sbs: 0.6899
      gen_sec: 3.11
      ref_sec: 5.28
    '126':
      text: N zoro la dabeɛ̃ ka a toma N naŋ toŋ ko yɛ na pɔɔ wa e la weɛlɛ.
      sbs: 0.6778
      gen_sec: 3.08
      ref_sec: 3.96
    '127':
      text: Kyɛ a Vooroŋ Soŋ la a dansedire, bonso a Vooroŋ Soŋ la a yelmeŋɛ.
      sbs: 0.6257
      gen_sec: 1.28
      ref_sec: 6.28
    '128':
      text: bonso, yɛ baŋ la a soba na naŋ bebe a yi a piiluu saŋ.
      sbs: 0.5868
      gen_sec: 2.27
      ref_sec: 4.44
    '130':
      text: ” Ka a noba da yeli sɔge, “Fo taa la sefaa!
      sbs: 0.6105
      gen_sec: 2.01
      ref_sec: 3.94
    '131':
      text: ” Kyɛ a Yeezu da taŋ la O noɔre a ba yeli yelzaa sɔge.
      sbs: 0.622
      gen_sec: 2.6
      ref_sec: 7.12
    '133':
      text: Bonso, N dire la o danseɛ ka o toŋ la toma yaga ko yɛ ane banaŋ naŋ be Laodisiya teŋɛ ane
        Hɛrapoli teŋɛ poɔ.
      sbs: 0.6573
      gen_sec: 5.01
      ref_sec: 9.18
    '134':
      text: ” A lɛ la ka ba da yi moɔle ka neɛzaa leɛ o eebo a yi o yelbebe poɔ.
      sbs: 0.6688
      gen_sec: 3.06
      ref_sec: 4.52
    '135':
      text: ” Ba da yeli la a ŋaa ka ba e O nyɛ, a pãã na toɔ̃ nyɛ saanaa tuo O.
      sbs: 0.698
      gen_sec: 2.34
      ref_sec: 5.6
    '137':
      text: Soba na zaa naŋ yeli, “N baŋ O la,” kyɛ ba sagra a O nɔɛ, waa la zirŋmaara, ka a yelmeŋɛ ba
        kye o zie.
      sbs: 0.6636
      gen_sec: 5.06
      ref_sec: 8.44
    '138':
      text: “Pampana ŋa N teɛroŋ zaa gyɛrɛɛ la.
      sbs: 0.6263
      gen_sec: 0.56
      ref_sec: 3.38
    '140':
      text: A Daana la na wa e ka yɛlɛ naŋ sɔgle lige poɔ sãã veɛloŋ ka bon naŋ be sukyiri poɔ meŋ sãã.
      sbs: 0.6265
      gen_sec: 4.19
      ref_sec: 7.44
    '141':
      text: A Yeezu da yi la a be a wa O meŋɛ teŋɛ poɔ, ka a O potuuribo da tu O wa.
      sbs: 0.6907
      gen_sec: 3.12
      ref_sec: 4.6
    '142':
      text: N na iri la a gaa a N saa zie a te yeli ko o, “N saa, N eɛɛ yelbieri a kyaare Naaŋmen ane
        fõõ.
      sbs: 0.675
      gen_sec: 4.64
      ref_sec: 8.56
    '143':
      text: Ba da ko o la sori meŋ ka o zɔɔ ne a nensonne a toɔ̃ ba.
      sbs: 0.5695
      gen_sec: 0.59
      ref_sec: 3.52
    '144':
      text: 'Azuiŋ, yɛ ko a teŋɛzu yɛlɛ zaa naŋ be yɛ enneŋ: peɛ̃mo toma, yeldɛgɛ, vɔlfaare, yelfaare
        boɔbo ane bombɔ-gaŋne .'
      sbs: 0.6703
      gen_sec: 5.96
      ref_sec: 10.3
    '149':
      text: A banaŋ naŋ puoro a wɛdoŋɔ ane a o teebo ane neɛzaa naŋ de a o yuori ŋmaaroŋ daŋ koŋ nyɛ pɛnnoo
        ŋmenaa bee tensogɔ.
      sbs: 0.6309
      gen_sec: 5.82
      ref_sec: 10.84
    '150':
      text: Maata la da kaara a bondirii yɛlɛ, ka Laazoro da e a neɛ na kaŋ naŋ da laŋ zeŋ a diibu zie
        ne a Yeezu.
      sbs: 0.6646
      gen_sec: 5.15
      ref_sec: 7.98
    '151':
      text: fo naŋ nare biŋ a andonɛɛ zaa niŋesogɔ.
      sbs: 0.4944
      gen_sec: 2.52
      ref_sec: 3.0
    '153':
      text: N erɛ la ama zaa a Ŋmen-yelnoore zuiŋ, ka ka N na toɔ̃ nyɛ a yelnoore maaloo.
      sbs: 0.6713
      gen_sec: 3.71
      ref_sec: 4.82
    '154':
      text: O da laŋ kpeɛrɛ ne la a wɛdonne; ka a malekere da kaara O zie.
      sbs: 0.6837
      gen_sec: 3.08
      ref_sec: 4.12
    '156':
      text: A Yeezu da zɛge la O zu a nyɛ bondaanema naŋ eŋnɛ ba kyɔɔtaare a kyɔɔtaare daga poɔ.
      sbs: 0.6508
      gen_sec: 3.9
      ref_sec: 6.0
    '157':
      text: Yɛ nyɛ, N tonɔ yɛ la aŋa pebilii ka yɛ yi te kpɛ gboŋgboe poɔ.
      sbs: 0.7016
      gen_sec: 3.03
      ref_sec: 4.98
    '158':
      text: Yɛ ta erɛ ka a Naaŋmen Vooroŋ Soŋ poɔ saana, Ona la a ŋmaaroŋ Naaŋmen naŋ eŋ yɛ a kyɛllɛ ne
        a faabo bebiri.
      sbs: 0.6767
      gen_sec: 5.37
      ref_sec: 6.72
    '159':
      text: N sɔre la a fo potuuribo ka ba digi a sefaa ka o yi, kyɛ ka ba digi fãã.
      sbs: 0.6277
      gen_sec: 3.49
      ref_sec: 6.1
    '160':
      text: Bonso, a Laazoro kuuni poɔ leɛ-iruu yɛlɛ la so ka a Gyuumine yaga da sagra derɛ a Yeezu yɛlɛ
        kyɛ zagra a ba yɛlɛ.
      sbs: 0.6767
      gen_sec: 5.75
      ref_sec: 8.62
    '165':
      text: Leɛ-teɛre nyɛ bonna naŋ da e ka fo le; leɛ fo eebo a kyɛ tonɔ a toma na fo naŋ da tonɔ a dɛndɛŋ
        saŋ.
      sbs: 0.6479
      gen_sec: 4.29
      ref_sec: 7.78
    '170':
      text: ka turi pie ne turi ayi da yi a Bɛŋgyamen bale poɔ ka ba da eŋ a ŋmaaroŋ.
      sbs: 0.6767
      gen_sec: 3.37
      ref_sec: 6.14
    '173':
      text: A ba seŋ ka o e Kiristabi-paalaa, ka lɛ naane, o na baŋ paale ne la pɔloo a le a sebɛlbɛllɛ
        dɔgroŋ poɔ.
      sbs: 0.6611
      gen_sec: 5.1
      ref_sec: 7.02
    '174':
      text: Ka Yeezu da soore a bege baŋnema ane a Faraziimine, “Sori bebe la ka ba saŋ baala a pɛnnoo
        bebiri daare bee sori kyebe.
      sbs: 0.6637
      gen_sec: 6.74
      ref_sec: 9.08
    '175':
      text: Ona la vɛŋ ka te baŋ lɛ yɛ naŋ taa nɔmmo a Vooroŋ Soŋ poɔ.
      sbs: 0.6569
      gen_sec: 2.54
      ref_sec: 3.9
    '176':
      text: Yɛ naŋ sage tu a yelmeŋɛ pampana, yɛ pɛge la a yɛ seere ka ka yɛ na taa nɔmmo naŋ sereŋ e
        meŋɛ.
      sbs: 0.6768
      gen_sec: 4.7
      ref_sec: 8.06
    '177':
      text: Kyɛ a Soŋ Soba da sɔ yɛ la kããsoŋ, ka yɛ zaa taa yelbammo.
      sbs: 0.6949
      gen_sec: 2.86
      ref_sec: 4.56
    '178':
      text: ka turi pie ne turi ayi da yi a Manaasɛ bale poɔ.
      sbs: 0.7132
      gen_sec: 2.99
      ref_sec: 4.14
    '179':
      text: Yiri na zaa poɔ yɛ naŋ wa kpɛ, yɛ daŋ yeli, ‘Ka maaroŋ be a yiri ŋa poɔ!
      sbs: 0.7058
      gen_sec: 3.48
      ref_sec: 5.22
    '181':
      text: Bee boŋ la ka Kiristabie ne neɛ naŋ ba sage de a Kirista yɛlɛ laŋ?
      sbs: 0.6486
      gen_sec: 3.35
      ref_sec: 3.58
    '182':
      text: Yɛ ta wa poɔrɔ sazu, bonso, o e la Naaŋmen nakogi, bee a poɔrɔ a teŋɛ, bonso, o meŋ waa la
        a Naaŋmen gbɛɛ-bimmu zie.
      sbs: 0.6974
      gen_sec: 6.8
      ref_sec: 11.22
    '184':
      text: Te da taa la yɛ vɔlaa kyɛ da nɔnɔ yaga ka te wa ka te nyɛ taa nimisogre.
      sbs: 0.6757
      gen_sec: 3.56
      ref_sec: 4.98
    '187':
      text: A gaŋ a zaa, yɛ de nɔmmo su pɔge yɛmenne, ona la maŋ leŋ boma zaa lantaa velaa zaa.
      sbs: 0.6894
      gen_sec: 4.07
      ref_sec: 5.7
    '189':
      text: Pampana ŋa, N de yɛ la ko Naaŋmen ane a Naaŋmen yelbiri garaaseɛ.
      sbs: 0.6443
      gen_sec: 3.43
      ref_sec: 4.66
    '190':
      text: Ba naŋ da ba nyɛ O, ba da leɛ gaa la a Gyɛruzɛlɛm ka ba te bɔ O.
      sbs: 0.6324
      gen_sec: 3.06
      ref_sec: 4.26
    '191':
      text: ” Kyɛ ba da ba baŋ a yɛlɛ O naŋ yeli ko ba tɛgɛ.
      sbs: 0.6549
      gen_sec: 2.23
      ref_sec: 8.26
    '192':
      text: ” A yeli ŋa da wa ne la tage taa, ka nɔkpeɛne da kpɛ a Pɔɔl ane Banabase ane a noba na sogɔŋ.
      sbs: 0.6625
      gen_sec: 3.92
      ref_sec: 7.4
    '195':
      text: Azuiŋ, yɛ baŋ ne a, a ta inni ka yuomo ata tensogɔ bee ŋmenaa, ka N ba nage ka N kpãã yɛ ane
        nentaŋ.
      sbs: 0.6674
      gen_sec: 4.99
      ref_sec: 8.14
    '197':
      text: Te nyɛ la dɔgɛɛ boorɔ zaa, kyɛ naŋ voorɔ; ka te teɛroŋ gyɛre, kyɛ ka te nuuri ba yoɔrɔ.
      sbs: 0.6885
      gen_sec: 4.07
      ref_sec: 6.04
    '198':
      text: N na boɔrɔ la ka yɛ zaa yele kɔkɔsaama, kyɛ a gaŋ a zaa N na boɔrɔ la ka yɛ yele Ŋmen-yelmanna
        yelyelii.
      sbs: 0.6805
      gen_sec: 5.26
      ref_sec: 6.62
    '199':
      text: Enyaabo zaa daŋ ba pɔge yɛ naŋ daŋ ba pɔge nensaala.
      sbs: 0.5987
      gen_sec: 1.42
      ref_sec: 3.24
    '202':
      text: A banaŋ N naŋ nɔŋ la ka N maŋ wuli kyɛ tage ba tobo.
      sbs: 0.6607
      gen_sec: 2.49
      ref_sec: 3.16
    '203':
      text: A Naaŋmen da di la a Davil danseɛ a yeli, ‘N nyɛ la Davil, a Gyɛse bidɔɔ, ka o waa N yɛŋ neɛ.
      sbs: 0.6652
      gen_sec: 4.31
      ref_sec: 6.96
    '204':
      text: Lɛ la ka a bie da yeli ko a o saa, ‘N saa, N sãã la Naaŋmen poɔ, a sãã fo meŋ poɔ.
      sbs: 0.6434
      gen_sec: 4.38
      ref_sec: 6.42
    '205':
      text: A bama moɔlɔ la a Kirista yɛlɛ ne nɔmmo, a baŋ ka ba eŋ ma la a kyɛ N naŋ zɔɔrɔ a Ŋmen-yelnoore
        zɔɔre zuiŋ.
      sbs: 0.6888
      gen_sec: 4.93
      ref_sec: 7.48
    '207':
      text: Ka o da boɔle a gbaŋgbaa kaŋ a soore o bonna naŋ erɛ.
      sbs: 0.6931
      gen_sec: 2.46
      ref_sec: 3.9
    '208':
      text: Yeezu Naŋ Saŋ Neɛ Kaŋ Ba Naŋ Dɔge Ne Zɔnnoŋ.
      sbs: 0.6235
      gen_sec: 2.11
      ref_sec: 3.56
    '209':
      text: ka turi pie ne turi ayi da yi a Nafetali bale poɔ.
      sbs: 0.6488
      gen_sec: 0.47
      ref_sec: 4.0
    '211':
      text: Moozul da yelee la, ‘A Daana a yɛ Naaŋmen na iri la Ŋmen-yelmanna a yɛ meŋɛ noba poɔ ka o
        waa aŋa maa.
      sbs: 0.673
      gen_sec: 5.3
      ref_sec: 7.9
    '212':
      text: “Yuomo lezaayi puoriŋ, maleke da wuli la o meŋɛ ko a Moozul vũũ naŋ da dire tuu kaŋ poɔ a
        Sanae taŋ wɛgyɛŋ poɔ.
      sbs: 0.6739
      gen_sec: 5.71
      ref_sec: 9.28
    '214':
      text: 'Kyɛ fo taa la garebanyɛ ne a yeli ŋa: fo kyiire la a Nikoletan deme tontonne na N meŋ naŋ
        kyiire.'
      sbs: 0.6434
      gen_sec: 5.13
      ref_sec: 6.68
    '215':
      text: Pampana, a malekere ayopoĩ na naŋ da taa a eelɛ ayopoĩ da narɛɛ la ka ba peɛle a eelɛ.
      sbs: 0.6844
      gen_sec: 4.21
      ref_sec: 7.48
    '217':
      text: ” A Yeezu naŋ da woŋ a ŋaa, O da yeli ko la a dɔɔ, “Yelyeni kaŋ la kyɛre ka fo ba taa.
      sbs: 0.6667
      gen_sec: 4.04
      ref_sec: 6.44
    '220':
      text: yɛ ta dare a yɛ sukyie aŋa lɛ a yɛ sããkommine naŋ da zɔɔ ne Naaŋmen.
      sbs: 0.6446
      gen_sec: 3.43
      ref_sec: 5.5
    '221':
      text: Ka Yeezu yeli, “Pɔlbile, maa yeli ko fo, vaa-iri!
      sbs: 0.6792
      gen_sec: 2.47
      ref_sec: 4.68
    '224':
      text: A yelwolɔ naŋ waana zuiŋ, N teɛre ka a na soma la ka neɛzaa naŋ kyɛnɛ waa lɛ zaa o naŋ da
        waa.
      sbs: 0.6614
      gen_sec: 4.61
      ref_sec: 7.48
    '225':
      text: Maa Gyɔɔn la a soba na naŋ da woŋ kyɛ nyɛ a yɛlɛ ama.
      sbs: 0.6871
      gen_sec: 2.62
      ref_sec: 10.56
    '226':
      text: Ona la e ka te taa faŋ a waa a nɔpaalaa tontonema.
      sbs: 0.6711
      gen_sec: 2.61
      ref_sec: 3.28
    '227':
      text: A yɛlɛ na eŋ naŋ kyɛre, N na wuli yɛ la ka maa wa wa yɛ zie.
      sbs: 0.7098
      gen_sec: 2.95
      ref_sec: 6.74
    '228':
      text: a zɔɔrɔ ne a Daana ane a O Mɛzaaya.
      sbs: 0.6704
      gen_sec: 0.33
      ref_sec: 3.3
    '229':
      text: Yɛ nyɛ nɔmmo na tɔ a Saa naŋ nɔŋ te, a e ka ba boɔlɔ te Naaŋmen bibiiri; ka te sereŋ waa a
        lɛ.
      sbs: 0.6907
      gen_sec: 4.83
      ref_sec: 7.2
    '230':
      text: O da gaa te de la a gane yi a soba na naŋ da zeŋ a nakogi zu nuduluŋ poɔ.
      sbs: 0.5256
      gen_sec: 0.74
      ref_sec: 4.9
    '231':
      text: Yɛ saŋna a baalba naŋ be a be, kyɛ yeli ko ba, ‘A Naaŋmen naaloŋ wa peɛle yɛ la.
      sbs: 0.702
      gen_sec: 4.0
      ref_sec: 5.5
    '233':
      text: Kyɛ tɔnɔ na zaa N naŋ da nyɛ, N de a la ka a waa zaglaa a Kirista zuiŋ.
      sbs: 0.6724
      gen_sec: 3.15
      ref_sec: 5.24
    '235':
      text: A ŋa la a n noɔre N naŋ wullo a puoruu laŋne yie zaa poore.
      sbs: 0.6797
      gen_sec: 2.85
      ref_sec: 3.88
    '236':
      text: 'Serɛzaa ka N yele korɔ yɛ: Gyɔɔn Bati e la kpoŋ gaŋ banaŋ zaa pɔgeba naŋ dɔge a teŋɛzu.'
      sbs: 0.6973
      gen_sec: 4.26
      ref_sec: 6.58
    '237':
      text: Bonso, dɔgroŋ la so ka dabeɛ̃ bebe, kyɛ neɛ na zaa naŋ zoro dabeɛ̃ ba taa nɔmmo naŋ e soŋ.
      sbs: 0.6814
      gen_sec: 4.45
      ref_sec: 7.54
    '238':
      text: Azuiŋ a ferɛɛ la ka te maaleŋ kyɛlle velaa bon te naŋ da woŋ, ka te ta wa sare yi a poɔ.
      sbs: 0.6838
      gen_sec: 4.01
      ref_sec: 7.8
    '239':
      text: ” Ka O yeli sɔge ba, “Nembuo la N ma ane N yɔɔmine?
      sbs: 0.642
      gen_sec: 2.2
      ref_sec: 7.36
    '240':
      text: A yɛlɛ ama da eɛɛ la ka a e yelwulaa ko te, ka ka te na ta boɔrɔ yelfaare aŋa ba naŋ da e
        lɛ.
      sbs: 0.6592
      gen_sec: 3.9
      ref_sec: 6.92
    '241':
      text: Kyɛ ka o naŋ wa poɔ̃, o maŋ buli la a eŋ bie yaga.
      sbs: 0.7105
      gen_sec: 2.44
      ref_sec: 3.5
    '242':
      text: A ŋaa la vɛŋ ka te ba zoro dabeɛ̃ a Naaŋmen niŋeŋ a yi a Kirista zuiŋ.
      sbs: 0.6671
      gen_sec: 3.2
      ref_sec: 4.86
    '243':
      text: Kyɛ Pɔɔl da ba boɔrɔ ka o taa neɛ naŋ da zo kyɛ bare ba Pamfiliya poɔ, a ba tu ba a toŋ a
        toma.
      sbs: 0.6547
      gen_sec: 4.62
      ref_sec: 7.42
    '244':
      text: Kyɛ ŋmenaa naŋ da wa do, a bombulo da zoɔlɛɛ la, a ko, a naŋ da ba taa nyaga zuiŋ.
      sbs: 0.7
      gen_sec: 3.6
      ref_sec: 6.62
    '245':
      text: A weɛ soba da naŋ taa la neŋyenaa kaŋ, a o poyɛŋ bie.
      sbs: 0.6111
      gen_sec: 0.51
      ref_sec: 3.66
    '246':
      text: N naŋ da wa nyɛ o, N noɔre da maaɛ la yaga.
      sbs: 0.5768
      gen_sec: 2.52
      ref_sec: 3.1
    '247':
      text: Dabeɛ̃ ne nɔmaa da kpɛ ba la ne a yeli ŋa naŋ da e a gbɛre ŋa zie.
      sbs: 0.64
      gen_sec: 3.43
      ref_sec: 6.38
    '250':
      text: A Fɛstu pãã da tere la noɔre, ka ba taa a Pɔɔl wa ne.
      sbs: 0.6576
      gen_sec: 2.64
      ref_sec: 3.48
    '252':
      text: Pampana ŋa, vi ba erɛ ma, ka maa gba erɛ pɔloo yaga ne a kpeɛ̃õ a Daana naŋ tere ka N de maale
        ne yɛ.
      sbs: 0.6716
      gen_sec: 4.75
      ref_sec: 6.86
    '253':
      text: ” Ka Yeezu da yeli ko o, “Yelmeŋɛ ka N yele korɔ yɛ.
      sbs: 0.636
      gen_sec: 1.66
      ref_sec: 9.28
    '256':
      text: Yɛ vɛŋ ka neɛzaa maŋ sigre o meŋɛ korɔ a teŋɛzu wederebɛ; bonso, wederɛ zaa ba kyebe ka Naaŋmen
        zie naane ka o yi.
      sbs: 0.6656
      gen_sec: 6.02
      ref_sec: 8.34
    '257':
      text: Yelmeŋɛ zaa la ka N yele korɔ yɛ, ka kabiri ba le teŋɛ a poɔ̃, o maŋ e la kabi-yeni.
      sbs: 0.7052
      gen_sec: 3.82
      ref_sec: 5.78
    '260':
      text: Ka maa pãã la bee ka bana la, a yeli ŋa la ka te moɔle ka yɛ da sage de.
      sbs: 0.6675
      gen_sec: 3.2
      ref_sec: 5.08
    '263':
      text: Bonso, a ba seŋ ka o voorɔ.
      sbs: 0.6719
      gen_sec: 0.79
      ref_sec: 8.1
    '264':
      text: 'Bonso, o yeli la o poɔŋ: ‘N dire la naaloŋ aŋa pɔgenaa; N ba waa pɔgekoɔre.'
      sbs: 0.6081
      gen_sec: 4.2
      ref_sec: 7.4
    '265':
      text: Kyɛ a Yeezu da ba yeli ko o ka o koŋ kpi.
      sbs: 0.6049
      gen_sec: 2.01
      ref_sec: 8.18
    '269':
      text: Neɛ kaŋ da soore O la, “Daana, noba belaa la na nyɛ faabo be?
      sbs: 0.658
      gen_sec: 3.05
      ref_sec: 5.22
    '270':
      text: A apostoliimine ane a nembɛrɛ da laŋ la taa ka ba kaa a yeli ŋa nyɛ.
      sbs: 0.6582
      gen_sec: 3.43
      ref_sec: 5.22
    '271':
      text: bonso, fo yɔɔ la a fo tontonema, a Ŋmen-yelmanneba.
      sbs: 0.6597
      gen_sec: 2.32
      ref_sec: 3.84
    '272':
      text: Yɛ ta de faaloŋ yɔɔ ne neɛzaa naŋ e yɛ faaloŋ; kyɛ yɛ maŋ moɔrɔ ka yɛ erɛ yɛlɛ naŋ soma noba
        zaa zie.
      sbs: 0.6668
      gen_sec: 5.09
      ref_sec: 7.24
    '273':
      text: O ba kye kyɛ, ba eɛɛ la ka O leɛ-iri yi a kuuni poɔ.
      sbs: 0.6065
      gen_sec: 1.57
      ref_sec: 4.26
    '276':
      text: N maŋ leŋ la noɔre gbɛre boyi daa gbuli zaa poɔ.
      sbs: 0.7038
      gen_sec: 2.73
      ref_sec: 3.1
    '277':
      text: ” A noba naŋ da bebe da ta ŋa turi anuu.
      sbs: 0.5612
      gen_sec: 2.36
      ref_sec: 3.76
    '278':
      text: 'Ba maŋ vɔge la a ba nazupile biŋ a nakogi niŋesogɔ, kyɛ yiele: “Te Daana Naaŋmen, fo seŋ
        ne la.'
      sbs: 0.6428
      gen_sec: 4.5
      ref_sec: 7.9
    '279':
      text: 'Kyɛ a danseɛ la ŋa: Naaŋmen ko te la nyɔvore naŋ ba taa baaraa, ka a nyɔvore ŋa be a O Bie
        poɔ.'
      sbs: 0.664
      gen_sec: 4.41
      ref_sec: 6.84
    '281':
      text: A pɔge da su la kpareze-velaa, ka o lenni ne salema ane lɛɛbie ane kusi-veɛle.
      sbs: 0.6741
      gen_sec: 4.06
      ref_sec: 6.68
    '282':
      text: A zenɛ ŋa, ba dɔge la a yɛ Faara a Davil teŋkpoŋ poɔ, Ona la a Mɛzaaya, a Daana.
      sbs: 0.6478
      gen_sec: 3.91
      ref_sec: 6.9
    '284':
      text: Azuiŋ ba da ŋmaa la kpaakpaa vaare, a yi ka ba te tuori O.
      sbs: 0.5402
      gen_sec: 0.68
      ref_sec: 4.78
    '286':
      text: Amine meŋ da le la tɛnnoɔ poɔ, a buli, a maale eŋ bie kɔɔ.
      sbs: 0.7147
      gen_sec: 1.77
      ref_sec: 4.96
    '287':
      text: Ba da ba puori a wɛdoŋɔ bee a o teebo, a da ba de a o ŋmaaroŋ a ba gberi bee ba nuuri eŋɛ.
      sbs: 0.6897
      gen_sec: 4.21
      ref_sec: 7.26
    '288':
      text: Ba maŋ erɛ la a lɛ a na de bon naŋ maŋ wɛ, kyɛ tenee deni ba weɛrɛ.
      sbs: 0.6447
      gen_sec: 1.43
      ref_sec: 4.84
    '289':
      text: Ka fõõ wa to fo yɔɔ bee fo yɔɔpuulee, a seŋ ka ba zeŋ ne fo nembɛrɛ niŋesogɔ.
      sbs: 0.6995
      gen_sec: 4.06
      ref_sec: 6.08
    '290':
      text: Naboma Naŋ Be Yagraa Dogre Poɔ.
      sbs: 0.6147
      gen_sec: 2.12
      ref_sec: 4.54
    '292':
      text: Lɛ la ka o toŋ ka ba te ko bibiiri na zaa naŋ ta yuomo ayi kyɛ sigre, a Bɛtelɛhɛm ane o tembilii
        poore.
      sbs: 0.6631
      gen_sec: 4.03
      ref_sec: 8.1
    '293':
      text: A o soba ta boɔrɔ ka o sɔglɔ a dɛgre iruu ŋmaaroŋ.
      sbs: 0.686
      gen_sec: 2.54
      ref_sec: 3.92
    '294':
      text: Lɛ la ka Yeezu da toŋ Piita ane Gyɔɔn, a yele, “Yɛ gaa te nare a Ista tigri bondiraa ka te
        di.
      sbs: 0.6643
      gen_sec: 4.42
      ref_sec: 7.38
    '295':
      text: ” Ba naŋ da wa gbole kaa, ba ba la nyɛ neɛzaa ka a Yeezu yoŋ naane.
      sbs: 0.6723
      gen_sec: 3.59
      ref_sec: 4.52
    '298':
      text: O naŋ da wa de a suobu baare, o da be la a Filipi zie tegitegilɛ.
      sbs: 0.6707
      gen_sec: 2.21
      ref_sec: 4.48
    '299':
      text: Fo ba ŋmaa a zirii ŋa ko te kyɛ Naaŋmen la ka fo ŋmaa tere.
      sbs: 0.6854
      gen_sec: 2.81
      ref_sec: 3.62
  score: 0.657
  partial: true
- model: k2-fsa/OmniVoice-noref
  sbs: 0.6573
  num_scored: 197
  uses_reference: false
  entries:
    '0':
      text: Ka maa bare ba ne a kɔŋ ka ba kulo, ba na yĩĩe la a sobiriŋ, bonso, ba mine yi la tentɔbɔ
        a wa.
      sbs: 0.6612
      gen_sec: 4.51
      ref_sec: 7.66
    '2':
      text: A Yeezu naŋ da gɛrɛ Gyɛruzɛlɛm, O da kpɛ la a teŋkponni ane a tembilii poore a kanna a noba
        gɛrɛ.
      sbs: 0.6762
      gen_sec: 4.76
      ref_sec: 7.54
    '3':
      text: A Naaŋmen Bagmaale Wederebɛ Nembɛrɛ Zusoba Naŋ Soore Yeezu Soorebie.
      sbs: 0.5841
      gen_sec: 3.79
      ref_sec: 8.22
    '5':
      text: Azuiŋ, yɛ ta daŋ di sɛrɛɛ kyɛ ka a saŋ ba ta; kyɛ ka a Daana waabo naŋ ba ta sɛre.
      sbs: 0.6695
      gen_sec: 3.61
      ref_sec: 5.84
    '7':
      text: Ba da lɔɔ o la bare ka o sigi wa a teŋɛzu, a lɔɔ a o malekere meŋ poɔ o eŋɛ.
      sbs: 0.6737
      gen_sec: 3.47
      ref_sec: 6.06
    '8':
      text: Ka a toŋkpeɛne ama naŋ toŋ fo poɔ, da toŋ Sodom teŋɛ poɔ, o da na kyɛnɛ bebe la wa ta zenɛ.
      sbs: 0.6986
      gen_sec: 4.24
      ref_sec: 7.3
    '10':
      text: A banaŋ naŋ da zo yaare da yi yoɔrɔ la, a moɔlɔ a yelbiri.
      sbs: 0.64
      gen_sec: 2.92
      ref_sec: 5.66
    '11':
      text: N poyɛŋ noba, nɔpaalaa naane ka N sɛgrɛ korɔ yɛ, kyɛ a nɔkoraa na yɛ naŋ da taa yi a piiluu
        saŋ la.
      sbs: 0.6843
      gen_sec: 4.87
      ref_sec: 8.0
    '12':
      text: ” Ka Yeezu da yeli, “Yɛ e ka a noba zeŋ teŋɛ.
      sbs: 0.5385
      gen_sec: 0.43
      ref_sec: 14.68
    '13':
      text: Wola pãã ka a weɛ soba na e a wɛkaareba ŋa?
      sbs: 0.5699
      gen_sec: 2.36
      ref_sec: 3.42
    '15':
      text: Ona la boɔrɔ ka neɛzaa nyɛ faabo a kyɛ wa baŋ a yelmeŋɛ.
      sbs: 0.6798
      gen_sec: 2.75
      ref_sec: 3.56
    '19':
      text: Pɔɔl Naŋ Puori A Filipae Deme Yaane.
      sbs: 0.6201
      gen_sec: 0.52
      ref_sec: 5.12
    '20':
      text: Bonso, ba da ba sage de a banaŋ zaa naŋ da wa yeli a O kuuni poɔ leɛ-iruu yɛlɛ ko ba.
      sbs: 0.675
      gen_sec: 4.24
      ref_sec: 5.86
    '21':
      text: ” Ba da do la a sazu a zunzugri poɔ ka a ba dɔndɔnne da kaara ba.
      sbs: 0.6663
      gen_sec: 3.31
      ref_sec: 4.64
    '25':
      text: Kyɛ a ŋaa la ka yɛ mine da waa, kyɛ ka ba da pɛge yɛ.
      sbs: 0.6656
      gen_sec: 2.58
      ref_sec: 3.38
    '27':
      text: Ka fõõ meŋɛ soore o, fo na nyɛ la ka a yɛlɛ zaa te naŋ yeli kyaare ne o waa la a lɛ.
      sbs: 0.6837
      gen_sec: 3.88
      ref_sec: 5.82
    '28':
      text: “Daana, a piiluu saŋ, fõõ la iri a teŋɛ.
      sbs: 0.5866
      gen_sec: 0.42
      ref_sec: 3.28
    '29':
      text: Bebie ata puoriŋ, a Pɔɔl da boɔle la a Gyuumine nembɛrɛ naŋ da be a be lantaa.
      sbs: 0.6491
      gen_sec: 4.14
      ref_sec: 5.56
    '30':
      text: A Maleke Na Naŋ Taa A Ganlee Yɛlɛ.
      sbs: 0.5847
      gen_sec: 2.16
      ref_sec: 3.8
    '31':
      text: Nɔmmo maŋ taa la teɛretɔroo ne yelzaa kyɛ maŋ di kannyiri ne yelzaa.
      sbs: 0.6728
      gen_sec: 3.49
      ref_sec: 3.94
    '32':
      text: N naŋ da wa nyɛ O, N da le vɔgle la muro O gbɛɛ puliŋ a waa ŋa neɛ naŋ kpi.
      sbs: 0.6763
      gen_sec: 3.71
      ref_sec: 5.86
    '36':
      text: Lɛ la ka o da boɔle o a soore o, ‘Boŋ la ka N wono kyaare ne fo ya?
      sbs: 0.7112
      gen_sec: 3.27
      ref_sec: 4.14
    '37':
      text: Yɛ kaa a Izerayɛl biiri nyɛ; a banaŋ naŋ maŋ di a Naaŋmen bagmaale boma, ba ba maŋ waa a Naaŋmen
        bagmaalkuuri laŋne deme be?
      sbs: 0.6532
      gen_sec: 6.78
      ref_sec: 7.62
    '38':
      text: Kyɛ N na ko la a N dansediribe bayi naŋ su boɔre kparre kpeɛ̃õ ka ba yeli Ŋmen-yelmanna yelyelii
        bebie turi dɔgle kɔɔraayi ne lezaata.
      sbs: 0.6028
      gen_sec: 7.55
      ref_sec: 12.4
    '39':
      text: Te sɛgrɛ la a yɛlɛ ama ka ka a te kyelloo na paale.
      sbs: 0.6694
      gen_sec: 2.46
      ref_sec: 3.98
    '40':
      text: ka ba da de O do ne sazu ne puubu.
      sbs: 0.668
      gen_sec: 2.12
      ref_sec: 4.84
    '44':
      text: 'Azuiŋ la ka ba yeli: “Gɔŋgbire, iri!'
      sbs: 0.5759
      gen_sec: 2.24
      ref_sec: 3.24
    '46':
      text: Bebie yaga ka te da mɔŋ a gbori bale bale a da di dɔgɛɛ kyɛ te ta Sinidu.
      sbs: 0.6788
      gen_sec: 3.3
      ref_sec: 5.94
    '47':
      text: ” A daadaalɛ ka a bie saa ŋmɛ kpɛlle a yeli, “N sage deɛ la, soŋ a n yeldeebo naŋ ba seŋ bon.
      sbs: 0.6423
      gen_sec: 4.73
      ref_sec: 14.94
    '48':
      text: Kyɛ pampana ŋa, N yele korɔ yɛ la ka yɛ nyɔge yɛmenne, bonso yɛ kanzaa koŋ wɛ, ka a gbori
        yoŋ naane.
      sbs: 0.6559
      gen_sec: 4.79
      ref_sec: 6.46
    '51':
      text: Yeezu Naŋ Koŋ A Gyɛruzɛlɛm Teŋɛ Yɛlɛ.
      sbs: 0.6286
      gen_sec: 2.11
      ref_sec: 10.58
    '52':
      text: A Yeezu Kirista Sããkommine Yɛlɛ.
      sbs: 0.6164
      gen_sec: 2.2
      ref_sec: 5.8
    '53':
      text: O da kyerɛ la ka ka a naŋ wa taa eebo, ka o ta Gyɛruzɛlɛm a Pɛnteko bebiri daare.
      sbs: 0.6473
      gen_sec: 3.93
      ref_sec: 6.64
    '54':
      text: Yɛ de fentere wa eŋ o nubiriŋ, kyɛ de nɔɔteɛ wa eŋ o gbɛɛŋ.
      sbs: 0.7096
      gen_sec: 2.93
      ref_sec: 4.32
    '56':
      text: Yɛ ta gaa a Samareya noba meŋ teŋɛ kanzaa, kyɛ yɛ gaa a Izerayɛl peere naŋ bɔre na zie.
      sbs: 0.6985
      gen_sec: 4.2
      ref_sec: 7.02
    '57':
      text: haali a banaŋ naŋ kyɔge O ne a kpane; kyɛ a tendaa nemboorɔ zaa na koŋ la O yɛlɛ.
      sbs: 0.691
      gen_sec: 4.14
      ref_sec: 5.42
    '58':
      text: Moɔ nimiri kanna a gansoŋ korɔ noba, a yele yɛlɛ teɛrɛ ba, kyɛ kanna ba te ta saŋ na N naŋ
        na wa.
      sbs: 0.6655
      gen_sec: 4.73
      ref_sec: 7.12
    '61':
      text: A zuyɔɔ-derebɛ ane yelbe-erebɛ zaa da tagra tara la a Yeezu zie ka ba woŋ O yɛlɛ.
      sbs: 0.628
      gen_sec: 4.16
      ref_sec: 5.42
    '62':
      text: A Farazii kaŋ da bebe la ka o yuori di Nikodemu.
      sbs: 0.6476
      gen_sec: 2.26
      ref_sec: 3.44
    '63':
      text: Ka a Yeezu soore a bie saa, “O naŋ maŋ erɛ a ŋaa kɔɔre seŋ la wola?
      sbs: 0.677
      gen_sec: 3.11
      ref_sec: 4.66
    '64':
      text: N ba baŋ ne yeli zaa naŋ do ma, kyɛ lɛ naane so ka N ba taa saanaa.
      sbs: 0.6427
      gen_sec: 2.98
      ref_sec: 4.9
    '65':
      text: Ka fõõ boɔle fo tɔsoba, ‘Neŋlaane ŋa’, a seŋ ka ba de fo lɔɔ eŋ dazugovũũ poɔ.
      sbs: 0.6995
      gen_sec: 3.8
      ref_sec: 7.08
    '66':
      text: 'Lɛ la ka N da woŋ kɔkɔre kaŋ a saluoni poɔ ka o yele: “N noba, yɛ wa yi o poɔ.'
      sbs: 0.6219
      gen_sec: 1.18
      ref_sec: 6.26
    '67':
      text: O da iri arɛɛ la ka O sɔre, ka ba de a Ŋmen-yelmanna Azaaya gansɛgraa ko O.
      sbs: 0.6044
      gen_sec: 3.61
      ref_sec: 13.28
    '69':
      text: Neɛzaa ba nyɛ fo saanaa ka fo seŋ ne la kũũ be?
      sbs: 0.6815
      gen_sec: 2.31
      ref_sec: 3.28
    '70':
      text: A ŋaa la tori kyɛ pɛllɛ Naaŋmen a te Faara poɔ.
      sbs: 0.7044
      gen_sec: 2.54
      ref_sec: 3.26
    '71':
      text: Te da kpɛ la a gbori a be ka Arestaku naŋ da waa Masedoniya neɛ kyɛ da yi Tɛsalonika da beɛle
        te.
      sbs: 0.6422
      gen_sec: 4.56
      ref_sec: 7.84
    '72':
      text: Pampana, nembuo mɔɔ la na e yɛ yelfaa, ka yɛneŋ wa kyerɛ ka yɛ e yɛlɛ naŋ e velaa?
      sbs: 0.7074
      gen_sec: 4.17
      ref_sec: 6.04
    '73':
      text: A soba na naŋ da faa te yi ne a dɔgɛɛ naŋ tɔgle kũũ, naŋ na kyɛnɛ faa te la.
      sbs: 0.6467
      gen_sec: 3.35
      ref_sec: 5.32
    '74':
      text: 'Ba sɛge la a begɛ gane poɔ: “Noba naŋ yele kɔkɔsaama.'
      sbs: 0.6515
      gen_sec: 0.42
      ref_sec: 5.08
    '75':
      text: Biiri na kyiiri la ba dɔgreba a vɛŋ ka ba ko ba.
      sbs: 0.7064
      gen_sec: 2.09
      ref_sec: 3.32
    '76':
      text: Yɛ erɛ yɛlɛ ne yɛŋ a kyaara noba na naŋ ba poɔ yɛ poɔ, kyɛ maŋ vɛŋ ka wagre zaa yire tɔnɔ.
      sbs: 0.6658
      gen_sec: 4.45
      ref_sec: 6.24
    '77':
      text: A ŋaa zie la ka te baŋ ka a baaraa saŋ taɛ la.
      sbs: 0.5625
      gen_sec: 2.72
      ref_sec: 3.6
    '79':
      text: Kyɛ ba da de la soba na zaa yuori ba naŋ ba sɛge eŋ a nyɔvore gane poɔ lɔɔ eŋ a baa vũũ poɔ.
      sbs: 0.6828
      gen_sec: 4.64
      ref_sec: 9.34
    '80':
      text: A dɛndɛŋ soba da yi waɛ la, a wa yeli, ‘Daana, a fo warbiri yi la warbie pie tɔnɔ dɔgle o
        zu.
      sbs: 0.6824
      gen_sec: 4.22
      ref_sec: 7.52
    '81':
      text: 'A yelwulaa yɛ naŋ na nyɛ la ŋa: yɛ na nyɛ la bie ba naŋ pilli ne bipɛmɛ a gaale O donne bondi
        gbori poɔ.'
      sbs: 0.6029
      gen_sec: 5.57
      ref_sec: 8.0
    '82':
      text: Nemmeŋɛ maŋ iri la bonsonne yi o nabonsonne poɔ, ka nenfaa meŋ maŋ iri bonfaare yi o nabonfaare
        poɔ.
      sbs: 0.6039
      gen_sec: 1.65
      ref_sec: 4.78
    '86':
      text: Bonso, neɛzaa koŋ la baŋ biŋ yiri pare zaa ka a onaŋ ba naŋ biŋ naane; a yiri pare ŋa la a
        Yeezu Kirista.
      sbs: 0.6456
      gen_sec: 5.81
      ref_sec: 8.06
    '87':
      text: A O eŋɛ la ka a yiri lamboe zaa mɛ lantaa a baa te leɛ Naaŋmen die naŋ e soŋ a be a Daana
        eŋɛ.
      sbs: 0.6885
      gen_sec: 4.7
      ref_sec: 6.34
    '88':
      text: ” Ka O yeli ko ba, “N nyɛ la Setaana ka o yi sazu a le teŋɛ a ŋa saa naŋ nyegre.
      sbs: 0.6848
      gen_sec: 3.65
      ref_sec: 5.76
    '89':
      text: Kyɛ deɛ yeli a yelbiri yoŋ, a vɛŋ ka N gbaŋgbaa nyɛ o sammo.
      sbs: 0.6584
      gen_sec: 2.89
      ref_sec: 4.36
    '90':
      text: ” O da kaara ba la polipoli a teɛre ka ba na ko o la bonkaŋ.
      sbs: 0.6106
      gen_sec: 2.56
      ref_sec: 3.88
    '93':
      text: Ka maa puori Naaŋmen ameseɛrɛ kyɛ di a bondirii, bonso ka ba na saana n yuori ne bondirii
        N naŋ puori Naaŋmen ameseɛrɛ kyɛ di?
      sbs: 0.6729
      gen_sec: 6.62
      ref_sec: 7.7
    '94':
      text: Saa nyegroo ane hooroo ane saa tannoo da yire la a nakogi zie, kyɛ ka fentele ayopoĩ da dire
        a nakogi niŋesogɔ.
      sbs: 0.5854
      gen_sec: 6.58
      ref_sec: 10.42
    '95':
      text: N da guoli yɛ la ane beroŋ, a da ba e bondi-tage, bonso, yɛ da naŋ ba ta bondi-tage diibu.
      sbs: 0.6789
      gen_sec: 3.8
      ref_sec: 7.16
    '96':
      text: Yuoni zaa poɔ a Yeezu dɔgrebɔ da maŋ gaa la Gyɛruzɛlɛm a te di a Ista tigri.
      sbs: 0.6403
      gen_sec: 3.98
      ref_sec: 5.88
    '97':
      text: Ka a naŋ wa seŋ ka N meŋ gaa, ba na beɛle ma la ka te gaa.
      sbs: 0.5909
      gen_sec: 0.5
      ref_sec: 3.68
    '99':
      text: Ba da teɛre ka O be la a noba poɔ ka ba zaa kyɛnɛ a sori poɔ.
      sbs: 0.6532
      gen_sec: 2.56
      ref_sec: 4.2
    '101':
      text: Neɛzaa kontoɔ̃ pigi ma sori ka N ta ire n meŋɛ yuori!
      sbs: 0.6788
      gen_sec: 2.55
      ref_sec: 3.5
    '103':
      text: Te baŋ ka te yi la kũũ poɔ a kpɛ nyɔvore poɔ, te naŋ nɔŋ taa zuiŋ.
      sbs: 0.676
      gen_sec: 2.76
      ref_sec: 4.58
    '104':
      text: N baŋ ka a N gaabo puoriŋ, noba mine naŋ waa ŋa gboŋgbo-faare na wa kpɛ la yɛ poɔ, a koŋ bare
        a peere.
      sbs: 0.6341
      gen_sec: 2.27
      ref_sec: 7.04
    '106':
      text: O da ba di bonzaa a bebie na zaa poɔ, kyɛ O naŋ da wa te baare, kɔŋ da kpɛ O la yaga.
      sbs: 0.6152
      gen_sec: 4.35
      ref_sec: 6.58
    '112':
      text: ” Ka O yeli, “Yɛ gu yɛmenne velaa ka ba ta wa bɛlle yɛ.
      sbs: 0.7092
      gen_sec: 2.47
      ref_sec: 3.4
    '113':
      text: Kyɛ a Yeezu naŋ da bale a O kyɛmmo poɔ la so ka O da wa zeŋ a bulee noɔreŋ.
      sbs: 0.6649
      gen_sec: 3.55
      ref_sec: 5.98
    '114':
      text: Ba suuri da iree la yaga ane ba naŋ da kanna a noba kyɛ moɔlɔ ka a Yeezu zie la ka kuuni leɛ-iruu
        be.
      sbs: 0.6435
      gen_sec: 4.62
      ref_sec: 7.64
    '115':
      text: Piita Ane Gyɔɔn Naŋ Are A Sɛrediribe Niŋesogɔ.
      sbs: 0.5612
      gen_sec: 2.42
      ref_sec: 3.4
    '116':
      text: Bonso, te waa la Naaŋmen tontonema naŋ laŋ tonɔ, yɛnee la a Naaŋmen weɛ, a Naaŋmen yiri.
      sbs: 0.6651
      gen_sec: 3.92
      ref_sec: 7.14
    '121':
      text: Pɔlbile kaŋ yuori naŋ da di Yutaaku da zeŋ la a takoro noɔreŋ a gbire kyuuro, a Pɔɔl naŋ da
        yele yɛlɛ.
      sbs: 0.6704
      gen_sec: 4.76
      ref_sec: 7.18
    '124':
      text: ” Ka O yeli ko o, “Bonso ka fo soorɔ ma bon naŋ e soŋ yɛlɛ?
      sbs: 0.712
      gen_sec: 3.12
      ref_sec: 4.1
    '125':
      text: A ŋaa zie la ka te maŋ baŋ a yelmeŋɛ vooroŋ ane a tuluu vooroŋ.
      sbs: 0.687
      gen_sec: 3.29
      ref_sec: 5.28
    '126':
      text: N zoro la dabeɛ̃ ka a toma N naŋ toŋ ko yɛ na pɔɔ wa e la weɛlɛ.
      sbs: 0.6731
      gen_sec: 2.88
      ref_sec: 3.96
    '127':
      text: Kyɛ a Vooroŋ Soŋ la a dansedire, bonso a Vooroŋ Soŋ la a yelmeŋɛ.
      sbs: 0.7104
      gen_sec: 2.62
      ref_sec: 6.28
    '128':
      text: bonso, yɛ baŋ la a soba na naŋ bebe a yi a piiluu saŋ.
      sbs: 0.6841
      gen_sec: 2.47
      ref_sec: 4.44
    '130':
      text: ” Ka a noba da yeli sɔge, “Fo taa la sefaa!
      sbs: 0.5988
      gen_sec: 2.18
      ref_sec: 3.94
    '131':
      text: ” Kyɛ a Yeezu da taŋ la O noɔre a ba yeli yelzaa sɔge.
      sbs: 0.6228
      gen_sec: 2.84
      ref_sec: 7.12
    '133':
      text: Bonso, N dire la o danseɛ ka o toŋ la toma yaga ko yɛ ane banaŋ naŋ be Laodisiya teŋɛ ane
        Hɛrapoli teŋɛ poɔ.
      sbs: 0.6637
      gen_sec: 5.65
      ref_sec: 9.18
    '134':
      text: ” A lɛ la ka ba da yi moɔle ka neɛzaa leɛ o eebo a yi o yelbebe poɔ.
      sbs: 0.6823
      gen_sec: 2.86
      ref_sec: 4.52
    '135':
      text: ” Ba da yeli la a ŋaa ka ba e O nyɛ, a pãã na toɔ̃ nyɛ saanaa tuo O.
      sbs: 0.6796
      gen_sec: 2.13
      ref_sec: 5.6
    '137':
      text: Soba na zaa naŋ yeli, “N baŋ O la,” kyɛ ba sagra a O nɔɛ, waa la zirŋmaara, ka a yelmeŋɛ ba
        kye o zie.
      sbs: 0.6631
      gen_sec: 5.01
      ref_sec: 8.44
    '138':
      text: “Pampana ŋa N teɛroŋ zaa gyɛrɛɛ la.
      sbs: 0.6854
      gen_sec: 1.87
      ref_sec: 3.38
    '140':
      text: A Daana la na wa e ka yɛlɛ naŋ sɔgle lige poɔ sãã veɛloŋ ka bon naŋ be sukyiri poɔ meŋ sãã.
      sbs: 0.6473
      gen_sec: 4.62
      ref_sec: 7.44
    '141':
      text: A Yeezu da yi la a be a wa O meŋɛ teŋɛ poɔ, ka a O potuuribo da tu O wa.
      sbs: 0.6921
      gen_sec: 3.05
      ref_sec: 4.6
    '142':
      text: N na iri la a gaa a N saa zie a te yeli ko o, “N saa, N eɛɛ yelbieri a kyaare Naaŋmen ane
        fõõ.
      sbs: 0.7006
      gen_sec: 4.55
      ref_sec: 8.56
    '143':
      text: Ba da ko o la sori meŋ ka o zɔɔ ne a nensonne a toɔ̃ ba.
      sbs: 0.6528
      gen_sec: 2.75
      ref_sec: 3.52
    '144':
      text: 'Azuiŋ, yɛ ko a teŋɛzu yɛlɛ zaa naŋ be yɛ enneŋ: peɛ̃mo toma, yeldɛgɛ, vɔlfaare, yelfaare
        boɔbo ane bombɔ-gaŋne .'
      sbs: 0.6956
      gen_sec: 5.83
      ref_sec: 10.3
    '149':
      text: A banaŋ naŋ puoro a wɛdoŋɔ ane a o teebo ane neɛzaa naŋ de a o yuori ŋmaaroŋ daŋ koŋ nyɛ pɛnnoo
        ŋmenaa bee tensogɔ.
      sbs: 0.6209
      gen_sec: 5.73
      ref_sec: 10.84
    '150':
      text: Maata la da kaara a bondirii yɛlɛ, ka Laazoro da e a neɛ na kaŋ naŋ da laŋ zeŋ a diibu zie
        ne a Yeezu.
      sbs: 0.661
      gen_sec: 5.1
      ref_sec: 7.98
    '151':
      text: fo naŋ nare biŋ a andonɛɛ zaa niŋesogɔ.
      sbs: 0.6466
      gen_sec: 2.26
      ref_sec: 3.0
    '153':
      text: N erɛ la ama zaa a Ŋmen-yelnoore zuiŋ, ka ka N na toɔ̃ nyɛ a yelnoore maaloo.
      sbs: 0.6673
      gen_sec: 3.71
      ref_sec: 4.82
    '154':
      text: O da laŋ kpeɛrɛ ne la a wɛdonne; ka a malekere da kaara O zie.
      sbs: 0.7067
      gen_sec: 3.31
      ref_sec: 4.12
    '156':
      text: A Yeezu da zɛge la O zu a nyɛ bondaanema naŋ eŋnɛ ba kyɔɔtaare a kyɔɔtaare daga poɔ.
      sbs: 0.6531
      gen_sec: 3.9
      ref_sec: 6.0
    '157':
      text: Yɛ nyɛ, N tonɔ yɛ la aŋa pebilii ka yɛ yi te kpɛ gboŋgboe poɔ.
      sbs: 0.6941
      gen_sec: 3.08
      ref_sec: 4.98
    '158':
      text: Yɛ ta erɛ ka a Naaŋmen Vooroŋ Soŋ poɔ saana, Ona la a ŋmaaroŋ Naaŋmen naŋ eŋ yɛ a kyɛllɛ ne
        a faabo bebiri.
      sbs: 0.6929
      gen_sec: 5.75
      ref_sec: 6.72
    '159':
      text: N sɔre la a fo potuuribo ka ba digi a sefaa ka o yi, kyɛ ka ba digi fãã.
      sbs: 0.6231
      gen_sec: 3.53
      ref_sec: 6.1
    '160':
      text: Bonso, a Laazoro kuuni poɔ leɛ-iruu yɛlɛ la so ka a Gyuumine yaga da sagra derɛ a Yeezu yɛlɛ
        kyɛ zagra a ba yɛlɛ.
      sbs: 0.6855
      gen_sec: 5.76
      ref_sec: 8.62
    '165':
      text: Leɛ-teɛre nyɛ bonna naŋ da e ka fo le; leɛ fo eebo a kyɛ tonɔ a toma na fo naŋ da tonɔ a dɛndɛŋ
        saŋ.
      sbs: 0.6499
      gen_sec: 5.17
      ref_sec: 7.78
    '170':
      text: ka turi pie ne turi ayi da yi a Bɛŋgyamen bale poɔ ka ba da eŋ a ŋmaaroŋ.
      sbs: 0.6818
      gen_sec: 3.32
      ref_sec: 6.14
    '173':
      text: A ba seŋ ka o e Kiristabi-paalaa, ka lɛ naane, o na baŋ paale ne la pɔloo a le a sebɛlbɛllɛ
        dɔgroŋ poɔ.
      sbs: 0.6592
      gen_sec: 5.41
      ref_sec: 7.02
    '174':
      text: Ka Yeezu da soore a bege baŋnema ane a Faraziimine, “Sori bebe la ka ba saŋ baala a pɛnnoo
        bebiri daare bee sori kyebe.
      sbs: 0.6479
      gen_sec: 6.78
      ref_sec: 9.08
    '175':
      text: Ona la vɛŋ ka te baŋ lɛ yɛ naŋ taa nɔmmo a Vooroŋ Soŋ poɔ.
      sbs: 0.663
      gen_sec: 2.95
      ref_sec: 3.9
    '176':
      text: Yɛ naŋ sage tu a yelmeŋɛ pampana, yɛ pɛge la a yɛ seere ka ka yɛ na taa nɔmmo naŋ sereŋ e
        meŋɛ.
      sbs: 0.6831
      gen_sec: 4.73
      ref_sec: 8.06
    '177':
      text: Kyɛ a Soŋ Soba da sɔ yɛ la kããsoŋ, ka yɛ zaa taa yelbammo.
      sbs: 0.7068
      gen_sec: 2.79
      ref_sec: 4.56
    '178':
      text: ka turi pie ne turi ayi da yi a Manaasɛ bale poɔ.
      sbs: 0.6993
      gen_sec: 2.3
      ref_sec: 4.14
    '179':
      text: Yiri na zaa poɔ yɛ naŋ wa kpɛ, yɛ daŋ yeli, ‘Ka maaroŋ be a yiri ŋa poɔ!
      sbs: 0.7007
      gen_sec: 3.49
      ref_sec: 5.22
    '181':
      text: Bee boŋ la ka Kiristabie ne neɛ naŋ ba sage de a Kirista yɛlɛ laŋ?
      sbs: 0.6515
      gen_sec: 3.04
      ref_sec: 3.58
    '182':
      text: Yɛ ta wa poɔrɔ sazu, bonso, o e la Naaŋmen nakogi, bee a poɔrɔ a teŋɛ, bonso, o meŋ waa la
        a Naaŋmen gbɛɛ-bimmu zie.
      sbs: 0.6901
      gen_sec: 5.56
      ref_sec: 11.22
    '184':
      text: Te da taa la yɛ vɔlaa kyɛ da nɔnɔ yaga ka te wa ka te nyɛ taa nimisogre.
      sbs: 0.6623
      gen_sec: 3.64
      ref_sec: 4.98
    '187':
      text: A gaŋ a zaa, yɛ de nɔmmo su pɔge yɛmenne, ona la maŋ leŋ boma zaa lantaa velaa zaa.
      sbs: 0.6765
      gen_sec: 4.02
      ref_sec: 5.7
    '189':
      text: Pampana ŋa, N de yɛ la ko Naaŋmen ane a Naaŋmen yelbiri garaaseɛ.
      sbs: 0.6599
      gen_sec: 3.38
      ref_sec: 4.66
    '190':
      text: Ba naŋ da ba nyɛ O, ba da leɛ gaa la a Gyɛruzɛlɛm ka ba te bɔ O.
      sbs: 0.5531
      gen_sec: 0.5
      ref_sec: 4.26
    '191':
      text: ” Kyɛ ba da ba baŋ a yɛlɛ O naŋ yeli ko ba tɛgɛ.
      sbs: 0.6654
      gen_sec: 2.66
      ref_sec: 8.26
    '192':
      text: ” A yeli ŋa da wa ne la tage taa, ka nɔkpeɛne da kpɛ a Pɔɔl ane Banabase ane a noba na sogɔŋ.
      sbs: 0.6685
      gen_sec: 4.72
      ref_sec: 7.4
    '195':
      text: Azuiŋ, yɛ baŋ ne a, a ta inni ka yuomo ata tensogɔ bee ŋmenaa, ka N ba nage ka N kpãã yɛ ane
        nentaŋ.
      sbs: 0.6663
      gen_sec: 4.69
      ref_sec: 8.14
    '197':
      text: Te nyɛ la dɔgɛɛ boorɔ zaa, kyɛ naŋ voorɔ; ka te teɛroŋ gyɛre, kyɛ ka te nuuri ba yoɔrɔ.
      sbs: 0.6939
      gen_sec: 4.18
      ref_sec: 6.04
    '198':
      text: N na boɔrɔ la ka yɛ zaa yele kɔkɔsaama, kyɛ a gaŋ a zaa N na boɔrɔ la ka yɛ yele Ŋmen-yelmanna
        yelyelii.
      sbs: 0.694
      gen_sec: 5.22
      ref_sec: 6.62
    '199':
      text: Enyaabo zaa daŋ ba pɔge yɛ naŋ daŋ ba pɔge nensaala.
      sbs: 0.6648
      gen_sec: 2.44
      ref_sec: 3.24
    '202':
      text: A banaŋ N naŋ nɔŋ la ka N maŋ wuli kyɛ tage ba tobo.
      sbs: 0.6344
      gen_sec: 1.69
      ref_sec: 3.16
    '203':
      text: A Naaŋmen da di la a Davil danseɛ a yeli, ‘N nyɛ la Davil, a Gyɛse bidɔɔ, ka o waa N yɛŋ neɛ.
      sbs: 0.7012
      gen_sec: 4.6
      ref_sec: 6.96
    '204':
      text: Lɛ la ka a bie da yeli ko a o saa, ‘N saa, N sãã la Naaŋmen poɔ, a sãã fo meŋ poɔ.
      sbs: 0.6679
      gen_sec: 2.65
      ref_sec: 6.42
    '205':
      text: A bama moɔlɔ la a Kirista yɛlɛ ne nɔmmo, a baŋ ka ba eŋ ma la a kyɛ N naŋ zɔɔrɔ a Ŋmen-yelnoore
        zɔɔre zuiŋ.
      sbs: 0.6812
      gen_sec: 5.1
      ref_sec: 7.48
    '207':
      text: Ka o da boɔle a gbaŋgbaa kaŋ a soore o bonna naŋ erɛ.
      sbs: 0.6864
      gen_sec: 2.71
      ref_sec: 3.9
    '208':
      text: Yeezu Naŋ Saŋ Neɛ Kaŋ Ba Naŋ Dɔge Ne Zɔnnoŋ.
      sbs: 0.6177
      gen_sec: 2.51
      ref_sec: 3.56
    '209':
      text: ka turi pie ne turi ayi da yi a Nafetali bale poɔ.
      sbs: 0.6974
      gen_sec: 2.31
      ref_sec: 4.0
    '211':
      text: Moozul da yelee la, ‘A Daana a yɛ Naaŋmen na iri la Ŋmen-yelmanna a yɛ meŋɛ noba poɔ ka o
        waa aŋa maa.
      sbs: 0.6821
      gen_sec: 4.86
      ref_sec: 7.9
    '212':
      text: “Yuomo lezaayi puoriŋ, maleke da wuli la o meŋɛ ko a Moozul vũũ naŋ da dire tuu kaŋ poɔ a
        Sanae taŋ wɛgyɛŋ poɔ.
      sbs: 0.6688
      gen_sec: 5.6
      ref_sec: 9.28
    '214':
      text: 'Kyɛ fo taa la garebanyɛ ne a yeli ŋa: fo kyiire la a Nikoletan deme tontonne na N meŋ naŋ
        kyiire.'
      sbs: 0.5524
      gen_sec: 5.32
      ref_sec: 6.68
    '215':
      text: Pampana, a malekere ayopoĩ na naŋ da taa a eelɛ ayopoĩ da narɛɛ la ka ba peɛle a eelɛ.
      sbs: 0.6972
      gen_sec: 4.61
      ref_sec: 7.48
    '217':
      text: ” A Yeezu naŋ da woŋ a ŋaa, O da yeli ko la a dɔɔ, “Yelyeni kaŋ la kyɛre ka fo ba taa.
      sbs: 0.6636
      gen_sec: 4.08
      ref_sec: 6.44
    '219':
      text: ’ Lɛ la ka a saa da de a o boma poŋ a o biiri na bayi.
      sbs: 0.6958
      gen_sec: 2.33
      ref_sec: 3.54
    '220':
      text: yɛ ta dare a yɛ sukyie aŋa lɛ a yɛ sããkommine naŋ da zɔɔ ne Naaŋmen.
      sbs: 0.6317
      gen_sec: 3.21
      ref_sec: 5.5
    '221':
      text: Ka Yeezu yeli, “Pɔlbile, maa yeli ko fo, vaa-iri!
      sbs: 0.6735
      gen_sec: 2.23
      ref_sec: 4.68
    '224':
      text: A yelwolɔ naŋ waana zuiŋ, N teɛre ka a na soma la ka neɛzaa naŋ kyɛnɛ waa lɛ zaa o naŋ da
        waa.
      sbs: 0.6831
      gen_sec: 4.63
      ref_sec: 7.48
    '225':
      text: Maa Gyɔɔn la a soba na naŋ da woŋ kyɛ nyɛ a yɛlɛ ama.
      sbs: 0.6804
      gen_sec: 2.72
      ref_sec: 10.56
    '226':
      text: Ona la e ka te taa faŋ a waa a nɔpaalaa tontonema.
      sbs: 0.6673
      gen_sec: 2.37
      ref_sec: 3.28
    '227':
      text: A yɛlɛ na eŋ naŋ kyɛre, N na wuli yɛ la ka maa wa wa yɛ zie.
      sbs: 0.6976
      gen_sec: 2.64
      ref_sec: 6.74
    '228':
      text: a zɔɔrɔ ne a Daana ane a O Mɛzaaya.
      sbs: 0.7359
      gen_sec: 1.71
      ref_sec: 3.3
    '229':
      text: Yɛ nyɛ nɔmmo na tɔ a Saa naŋ nɔŋ te, a e ka ba boɔlɔ te Naaŋmen bibiiri; ka te sereŋ waa a
        lɛ.
      sbs: 0.6767
      gen_sec: 4.32
      ref_sec: 7.2
    '230':
      text: O da gaa te de la a gane yi a soba na naŋ da zeŋ a nakogi zu nuduluŋ poɔ.
      sbs: 0.6622
      gen_sec: 2.17
      ref_sec: 4.9
    '231':
      text: Yɛ saŋna a baalba naŋ be a be, kyɛ yeli ko ba, ‘A Naaŋmen naaloŋ wa peɛle yɛ la.
      sbs: 0.6992
      gen_sec: 2.04
      ref_sec: 5.5
    '233':
      text: Kyɛ tɔnɔ na zaa N naŋ da nyɛ, N de a la ka a waa zaglaa a Kirista zuiŋ.
      sbs: 0.6718
      gen_sec: 3.26
      ref_sec: 5.24
    '234':
      text: Kyɛ soba na zaa naŋ ba sage de a yelbiri na wɛ la.
      sbs: 0.7045
      gen_sec: 2.54
      ref_sec: 3.1
    '235':
      text: A ŋa la a n noɔre N naŋ wullo a puoruu laŋne yie zaa poore.
      sbs: 0.4407
      gen_sec: 3.52
      ref_sec: 3.88
    '236':
      text: 'Serɛzaa ka N yele korɔ yɛ: Gyɔɔn Bati e la kpoŋ gaŋ banaŋ zaa pɔgeba naŋ dɔge a teŋɛzu.'
      sbs: 0.6926
      gen_sec: 4.65
      ref_sec: 6.58
    '237':
      text: Bonso, dɔgroŋ la so ka dabeɛ̃ bebe, kyɛ neɛ na zaa naŋ zoro dabeɛ̃ ba taa nɔmmo naŋ e soŋ.
      sbs: 0.6753
      gen_sec: 4.49
      ref_sec: 7.54
    '238':
      text: Azuiŋ a ferɛɛ la ka te maaleŋ kyɛlle velaa bon te naŋ da woŋ, ka te ta wa sare yi a poɔ.
      sbs: 0.7005
      gen_sec: 4.55
      ref_sec: 7.8
    '239':
      text: ” Ka O yeli sɔge ba, “Nembuo la N ma ane N yɔɔmine?
      sbs: 0.6401
      gen_sec: 2.28
      ref_sec: 7.36
    '240':
      text: A yɛlɛ ama da eɛɛ la ka a e yelwulaa ko te, ka ka te na ta boɔrɔ yelfaare aŋa ba naŋ da e
        lɛ.
      sbs: 0.6615
      gen_sec: 4.08
      ref_sec: 6.92
    '241':
      text: Kyɛ ka o naŋ wa poɔ̃, o maŋ buli la a eŋ bie yaga.
      sbs: 0.7134
      gen_sec: 2.19
      ref_sec: 3.5
    '242':
      text: A ŋaa la vɛŋ ka te ba zoro dabeɛ̃ a Naaŋmen niŋeŋ a yi a Kirista zuiŋ.
      sbs: 0.6512
      gen_sec: 3.61
      ref_sec: 4.86
    '243':
      text: Kyɛ Pɔɔl da ba boɔrɔ ka o taa neɛ naŋ da zo kyɛ bare ba Pamfiliya poɔ, a ba tu ba a toŋ a
        toma.
      sbs: 0.6462
      gen_sec: 4.75
      ref_sec: 7.42
    '244':
      text: Kyɛ ŋmenaa naŋ da wa do, a bombulo da zoɔlɛɛ la, a ko, a naŋ da ba taa nyaga zuiŋ.
      sbs: 0.6903
      gen_sec: 4.22
      ref_sec: 6.62
    '245':
      text: A weɛ soba da naŋ taa la neŋyenaa kaŋ, a o poyɛŋ bie.
      sbs: 0.6507
      gen_sec: 1.26
      ref_sec: 3.66
    '246':
      text: N naŋ da wa nyɛ o, N noɔre da maaɛ la yaga.
      sbs: 0.5891
      gen_sec: 2.52
      ref_sec: 3.1
    '247':
      text: Dabeɛ̃ ne nɔmaa da kpɛ ba la ne a yeli ŋa naŋ da e a gbɛre ŋa zie.
      sbs: 0.6374
      gen_sec: 3.28
      ref_sec: 6.38
    '250':
      text: A Fɛstu pãã da tere la noɔre, ka ba taa a Pɔɔl wa ne.
      sbs: 0.662
      gen_sec: 2.81
      ref_sec: 3.48
    '252':
      text: Pampana ŋa, vi ba erɛ ma, ka maa gba erɛ pɔloo yaga ne a kpeɛ̃õ a Daana naŋ tere ka N de maale
        ne yɛ.
      sbs: 0.669
      gen_sec: 4.71
      ref_sec: 6.86
    '253':
      text: ” Ka Yeezu da yeli ko o, “Yelmeŋɛ ka N yele korɔ yɛ.
      sbs: 0.6115
      gen_sec: 2.28
      ref_sec: 9.28
    '256':
      text: Yɛ vɛŋ ka neɛzaa maŋ sigre o meŋɛ korɔ a teŋɛzu wederebɛ; bonso, wederɛ zaa ba kyebe ka Naaŋmen
        zie naane ka o yi.
      sbs: 0.6551
      gen_sec: 5.76
      ref_sec: 8.34
    '257':
      text: Yelmeŋɛ zaa la ka N yele korɔ yɛ, ka kabiri ba le teŋɛ a poɔ̃, o maŋ e la kabi-yeni.
      sbs: 0.7066
      gen_sec: 4.16
      ref_sec: 5.78
    '260':
      text: Ka maa pãã la bee ka bana la, a yeli ŋa la ka te moɔle ka yɛ da sage de.
      sbs: 0.6593
      gen_sec: 3.73
      ref_sec: 5.08
    '263':
      text: Bonso, a ba seŋ ka o voorɔ.
      sbs: 0.6496
      gen_sec: 1.61
      ref_sec: 8.1
    '264':
      text: 'Bonso, o yeli la o poɔŋ: ‘N dire la naaloŋ aŋa pɔgenaa; N ba waa pɔgekoɔre.'
      sbs: 0.6206
      gen_sec: 0.91
      ref_sec: 7.4
    '265':
      text: Kyɛ a Yeezu da ba yeli ko o ka o koŋ kpi.
      sbs: 0.617
      gen_sec: 1.96
      ref_sec: 8.18
    '269':
      text: Neɛ kaŋ da soore O la, “Daana, noba belaa la na nyɛ faabo be?
      sbs: 0.6534
      gen_sec: 3.18
      ref_sec: 5.22
    '270':
      text: A apostoliimine ane a nembɛrɛ da laŋ la taa ka ba kaa a yeli ŋa nyɛ.
      sbs: 0.6502
      gen_sec: 3.56
      ref_sec: 5.22
    '271':
      text: bonso, fo yɔɔ la a fo tontonema, a Ŋmen-yelmanneba.
      sbs: 0.6625
      gen_sec: 2.74
      ref_sec: 3.84
    '272':
      text: Yɛ ta de faaloŋ yɔɔ ne neɛzaa naŋ e yɛ faaloŋ; kyɛ yɛ maŋ moɔrɔ ka yɛ erɛ yɛlɛ naŋ soma noba
        zaa zie.
      sbs: 0.6559
      gen_sec: 5.13
      ref_sec: 7.24
    '273':
      text: O ba kye kyɛ, ba eɛɛ la ka O leɛ-iri yi a kuuni poɔ.
      sbs: 0.6511
      gen_sec: 2.44
      ref_sec: 4.26
    '274':
      text: Bonso, ba sɛge la a Moozul begɛ poɔ, “Ta leŋ a naadɛre naŋ ŋmeɛrɛ kyi noɔre.
      sbs: 0.696
      gen_sec: 4.19
      ref_sec: 6.58
    '276':
      text: N maŋ leŋ la noɔre gbɛre boyi daa gbuli zaa poɔ.
      sbs: 0.7096
      gen_sec: 2.44
      ref_sec: 3.1
    '277':
      text: ” A noba naŋ da bebe da ta ŋa turi anuu.
      sbs: 0.5919
      gen_sec: 0.43
      ref_sec: 3.76
    '278':
      text: 'Ba maŋ vɔge la a ba nazupile biŋ a nakogi niŋesogɔ, kyɛ yiele: “Te Daana Naaŋmen, fo seŋ
        ne la.'
      sbs: 0.6317
      gen_sec: 4.77
      ref_sec: 7.9
    '279':
      text: 'Kyɛ a danseɛ la ŋa: Naaŋmen ko te la nyɔvore naŋ ba taa baaraa, ka a nyɔvore ŋa be a O Bie
        poɔ.'
      sbs: 0.5309
      gen_sec: 5.56
      ref_sec: 6.84
    '281':
      text: A pɔge da su la kpareze-velaa, ka o lenni ne salema ane lɛɛbie ane kusi-veɛle.
      sbs: 0.7001
      gen_sec: 4.09
      ref_sec: 6.68
    '282':
      text: A zenɛ ŋa, ba dɔge la a yɛ Faara a Davil teŋkpoŋ poɔ, Ona la a Mɛzaaya, a Daana.
      sbs: 0.6473
      gen_sec: 3.71
      ref_sec: 6.9
    '284':
      text: Azuiŋ ba da ŋmaa la kpaakpaa vaare, a yi ka ba te tuori O.
      sbs: 0.6371
      gen_sec: 3.07
      ref_sec: 4.78
    '286':
      text: Amine meŋ da le la tɛnnoɔ poɔ, a buli, a maale eŋ bie kɔɔ.
      sbs: 0.7115
      gen_sec: 2.26
      ref_sec: 4.96
    '287':
      text: Ba da ba puori a wɛdoŋɔ bee a o teebo, a da ba de a o ŋmaaroŋ a ba gberi bee ba nuuri eŋɛ.
      sbs: 0.685
      gen_sec: 4.08
      ref_sec: 7.26
    '288':
      text: Ba maŋ erɛ la a lɛ a na de bon naŋ maŋ wɛ, kyɛ tenee deni ba weɛrɛ.
      sbs: 0.5694
      gen_sec: 0.5
      ref_sec: 4.84
    '289':
      text: Ka fõõ wa to fo yɔɔ bee fo yɔɔpuulee, a seŋ ka ba zeŋ ne fo nembɛrɛ niŋesogɔ.
      sbs: 0.685
      gen_sec: 3.19
      ref_sec: 6.08
    '290':
      text: Naboma Naŋ Be Yagraa Dogre Poɔ.
      sbs: 0.5616
      gen_sec: 2.12
      ref_sec: 4.54
    '292':
      text: Lɛ la ka o toŋ ka ba te ko bibiiri na zaa naŋ ta yuomo ayi kyɛ sigre, a Bɛtelɛhɛm ane o tembilii
        poore.
      sbs: 0.6626
      gen_sec: 5.46
      ref_sec: 8.1
    '293':
      text: A o soba ta boɔrɔ ka o sɔglɔ a dɛgre iruu ŋmaaroŋ.
      sbs: 0.6763
      gen_sec: 2.39
      ref_sec: 3.92
    '294':
      text: Lɛ la ka Yeezu da toŋ Piita ane Gyɔɔn, a yele, “Yɛ gaa te nare a Ista tigri bondiraa ka te
        di.
      sbs: 0.6755
      gen_sec: 4.84
      ref_sec: 7.38
    '295':
      text: ” Ba naŋ da wa gbole kaa, ba ba la nyɛ neɛzaa ka a Yeezu yoŋ naane.
      sbs: 0.6998
      gen_sec: 2.32
      ref_sec: 4.52
    '298':
      text: O naŋ da wa de a suobu baare, o da be la a Filipi zie tegitegilɛ.
      sbs: 0.4999
      gen_sec: 3.88
      ref_sec: 4.48
    '299':
      text: Fo ba ŋmaa a zirii ŋa ko te kyɛ Naaŋmen la ka fo ŋmaa tere.
      sbs: 0.6809
      gen_sec: 2.69
      ref_sec: 3.62
  score: 0.6573
