      ref_sec: 3.38
      cer: 0.0
      wer: 0.0
    bible_00026:
      source: bible
      text: Ba naŋ da laŋ ũũ yɛ ne O a suobu poɔ, lɛ meŋ la ka ba e ka yɛ ne O leɛ-iri a yɛ yeldeebo yɛ
