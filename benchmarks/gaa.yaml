    jw_00000:
      source: jw
      text: NIBII NI BAAYE ABUA BO NI OBATSƆ KRISTOFONYO NI EDA YƐ MUMƆŊ
      sbs: 0.732
      gen_sec: 5.52
      ref_sec: 4.33
      cer: 0.1837
      wer: 0.5833
    jw_00001:
      source: jw
      text: MIKASE NII NI MITSƆƆ NII BE NI MISƆMƆƆ AKƐ KPOKPAA NƆKWƐLƆ KƐ BE NI MISƆMƆƆ AKƐ KPOKPAA WULU
        NƆKWƐLƆ LƐ
      sbs: 0.6332
      gen_sec: 8.8
      ref_sec: 6.75
      cer: 0.1667
      wer: 0.6
    jw_00002:
      source: jw
      text: Mɛɛ be nɛkɛ Yehowa yelikɛbuamɔ he baahia wɔ waa?
      sbs: 0.7746
      gen_sec: 3.44
      ref_sec: 4.84
      cer: 0.1026
      wer: 0.5556
    jw_00003:
      source: jw
      text: Mɛni hewɔ esaaa akɛ wɔnuɔ he akɛ kɛ́ wɔbatsɔmɔ Kristofoi ni edara yɛ mumɔŋ lɛ, belɛ wɔgbe
        naa lɛ?
      sbs: 0.656
      gen_sec: 7.44
      ref_sec: 6.92
      cer: 0.1053
      wer: 0.5263
    jw_00004:
      source: jw
      text: No hewɔ lɛ, eyɛ mli akɛ mɛi ni hi shi yɛ blema lɛ bɛ watsii, tamɔ bɔ ni wɔyɔɔ ŋmɛnɛ lɛ moŋ,
        shi no mli lɛ amɛyɛ gbɛ ni amɛtsɔɔ nɔ amɛtsɔɔ bɔ ni atswa.
      sbs: 0.7227
      gen_sec: 10.48
      ref_sec: 13.08
      cer: 0.4732
      wer: 0.9143
    jw_00005:
      source: jw
      text: Feemɔ nibii ni nyɛmimɛi lɛ feɔ lɛ eko. Yaa asafoŋ kpeei lɛ fɛɛ, ni okɛ amɛ afee ekome kɛya
        shiɛmɔ
      sbs: 0.706
      gen_sec: 9.12
      ref_sec: 9.49
      cer: 0.3158
      wer: 0.8
    jw_00006:
      source: jw
      text: Winston, ani sɔɔmɔ ni oyasɔmɔ yɛ Pasifik Wuoyigbɛ Ŋshɔkpɔi lɛ anɔ lɛ eye ebua bo ni onyɛ otsu
        onitsumɔ akɛ Australasia Nitsumɔhe Nine Ajinafoi Akuu lɛ mli nyo lɛ jogbaŋŋ?
      sbs: 0.7527
      gen_sec: 4.96
      ref_sec: 11.67
      cer: 0.9928
      wer: 1.0
    jw_00007:
      source: jw
      text: HÃ NIKASEMƆ ATSE ONAA
      sbs: 0.8081
      gen_sec: 5.04
      ref_sec: 3.6
      cer: 0.8333
      wer: 1.0
    jw_00008:
      source: jw
      text: KƐ́ WƆKƐ WƆHIƐ FƆ̃ YEHOWA NƆ LƐ WƆBAANÁ NAANƆ WALA
      sbs: 0.7294
      gen_sec: 3.12
      ref_sec: 5.23
      cer: 0.2051
      wer: 0.4
    jw_00009:
      source: jw
      text: Mɛni kɛ́ wɔfee lɛ, no baahã wɔye Yehowa anɔkwa?
      sbs: 0.6977
      gen_sec: 3.12
      ref_sec: 4.33
      cer: 0.0556
      wer: 0.5556
    jw_00010:
      source: jw
      text: Wɔbaakase bɔ ni wɔnáa mfonirifeemɔŋ paradeiso lɛ he sɛɛ kɛ nɔ ni wɔbaafee ni baagbala mɛi
        krokomɛi kɛba mli lɛ he nii.
      sbs: 0.6545
      gen_sec: 8.32
      ref_sec: 9.49
      cer: 0.1771
      wer: 0.5909
    jw_00011:
      source: jw
      text: ESAA MƐI ATSUI KƐ AMƐJWƐŊMƆ
      sbs: 0.6978
      gen_sec: 1.6
      ref_sec: 3.36
      cer: 0.2174
      wer: 0.6
    jw_00012:
      source: jw
      text: Sanebimɔi Ni Jɛ Kanelɔi Adɛŋ
      sbs: 0.7498
      gen_sec: 2.4
      ref_sec: 3.49
      cer: 0.0
      wer: 0.0
    jw_00013:
      source: jw
      text: PAULO YE EBUA ENYƐMIMƐI LƐ KONI AMƐHEMƆKƐYELI LƐ MLI AWA
      sbs: 0.703
      gen_sec: 5.2
      ref_sec: 4.79
      cer: 0.0851
      wer: 0.5
    jw_00014:
      source: jw
      text: NITSUMƆ KO NI HE HIAA WAA
      sbs: 0.7677
      gen_sec: 1.92
      ref_sec: 3.23
      cer: 0.15
      wer: 0.3333
    jw_00015:
      source: jw
      text: Pam, bo hu obale anɔkwale lɛ yɛ ogbekɛbiiashi. Te eba lɛ tɛŋŋ?
      sbs: 0.7237
      gen_sec: 4.96
      ref_sec: 5.26
      cer: 0.2083
      wer: 1.0
    jw_00016:
      source: jw
      text: MƐƐ GBƐ NƆ NIBII NI NYIƐ SƐƐ NƐƐ BAANYƐ AYE ABUA WƆ NI WƆKAYOYORO KƐ́ WƆKƐ NAAGBAI KPE?
      sbs: 0.7312
      gen_sec: 5.92
      ref_sec: 6.96
      cer: 0.0735
      wer: 0.4444
    jw_00017:
      source: jw
      text: Mɛni hewɔ ehe miihia ni wɔhã yiŋtoi ahewɔ ni wɔshiɛɔ lɛ ahi wɔjwɛŋmɔ mli?
      sbs: 0.6926
      gen_sec: 5.04
      ref_sec: 5.45
      cer: 0.1356
      wer: 0.6429
    jw_00018:
      source: jw
      text: Mɛɛ gbɛ nɔ brikii ni ana yɛ he ni blema Babilon yɔɔ lɛ kɛ gbɛi ni atsɔ nɔ afee brikii nɛɛ
        maa nɔ mi akɛ, nɔ ni awie yɛ Biblia lɛ mli lɛ ja lɛɛlɛŋ?
      sbs: 0.7872
      gen_sec: 20.48
      ref_sec: 11.51
      cer: 0.7455
      wer: 0.9714
    jw_00019:
      source: jw
      text: NYƐSUƆMƆ LƐ MLI AWAA
      sbs: 0.7119
      gen_sec: 6.56
      ref_sec: 3.1
      cer: 1.0588
      wer: 1.0
    jw_00020:
      source: jw
      text: Nyɛmimɛi ni tee kpee nɛɛ eko lɛ ateŋ mɛi pii kɛɛ miishɛɛ ni amɛná yɛ kpee nɛɛ shishi lɛ nɔ
        bɛ, ejaakɛ amɛna faŋŋ akɛ Yehowa miijɔɔ ewebii lɛ. Shi amɛmiishɛɛ lɛ sɛɛ etsɛɛɛ.
