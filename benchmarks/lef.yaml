      source: bible
      text: Na lɛla lɛni na Unwoti ɔ́su-mi ɔnii nsu nsiku Egyipteƒuɔ bekpone lɛlɔ na bɛdubo bunu mɛni.
      sbs: 0.6808
      gen_sec: 4.59
      ref_sec: 7.2
      cer: 0.0556
      wer: 0.25
    bible_00001:
      source: bible
      text: Na limeyi lɛmmɔ lɛlɔ ni, Yese kugyii ugyiitu ɔdubɔlɛ unye aani ngba bɔƒɔ aƒlaga ute kayawi
        bekyuli ƒui.
