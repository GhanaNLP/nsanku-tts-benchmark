      ref_sec: 6.28
      cer: 0.075
      wer: 0.3333
    bible_00012:
      source: bible
      text: 'Ɗal min ndarna ɗoo buguuji tati: aan wooturu, Muusaa wooturu, Iliyaasa wooturu.'
