      ref_sec: 4.88
      cer: 0.0308
      wer: 0.0769
    bible_00016:
      source: bible
      text: Ana yiɗaa taalibbo wuurda no moobbo mum wuurdi fuu, maccuɗo duu no kalfaaɗo mum wuurdi.
