      source: bible
      text: Nguleefi kii yaltini e majje mboddi, ndi soppi junngo makko.
      sbs: 0.7237
      gen_sec: 3.68
      ref_sec: 3.38
      cer: 0.102
      wer: 0.4
    bible_00026:
      source: bible
      text: 'Kaa Pool jippii, hippii e makko, ɓami mo e juuɗe muuɗum, wii: —Mbaaltee!'
      sbs: 0.7515
      gen_sec: 6.24
      ref_sec: 6.02
      cer: 0.0926
      wer: 0.1538
    bible_00027:
      source: bible
      text: Ɓee ana ngullana ɗum ɗoo, ɓee too ana ngullana ɗum gaa.
      sbs: 0.7226
      gen_sec: 4.56
      ref_sec: 3.34
      cer: 0.1163
      wer: 0.4545
    bible_00028:
      source: bible
      text: Walaa ko o wiiri non, sinaa Iisaa yamirii seyɗaani oo yalta e neɗɗo oo.
      sbs: 0.7147
      gen_sec: 4.96
      ref_sec: 5.22
      cer: 0.0357
      wer: 0.1429
    bible_00029:
      source: bible
      text: 'Saabe ɗum, miɗo wiya on: ɲannde darngal, jukkungo mon ɓuran ngo Tirus e Sidon ngoo naawde.'
      sbs: 0.76
      gen_sec: 7.04
      ref_sec: 5.9
      cer: 0.1127
      wer: 0.25
    bible_00030:
      source: bible
      text: Ana tilsi pelle-pelle ngaɗa hakkunde mon, yalla hoolniiɓe jaati wonɓe e ley mon ɓee ana annditee.
      sbs: 0.6767
      gen_sec: 5.84
      ref_sec: 6.46
      cer: 0.0886
      wer: 0.3125
    bible_00031:
      source: bible
      text: Sabi miɗo nii golla golle e ley wakkati mooɗon.
      sbs: 0.7227
      gen_sec: 3.04
      ref_sec: 14.82
      cer: 0.0
      wer: 0.0
    bible_00032:
      source: bible
      text: Laaci maggal wuuwi tatoɓere koode kammu, wedii ɗum e leydi.
      sbs: 0.732
      gen_sec: 4.24
      ref_sec: 3.8
      cer: 0.1042
      wer: 0.4
    bible_00033:
      source: bible
      text: On fuu yo on keɓu jam onon yimɓe Iisaa Almasiihu ɓee!
      sbs: 0.6661
      gen_sec: 3.2
      ref_sec: 9.5
      cer: 0.0
      wer: 0.0
    bible_00034:
      source: bible
      text: Kaa neɗɗo fuu jiɗɗo Laamɗo, Laamɗo ana anndi ɗum.
      sbs: 0.683
      gen_sec: 3.44
      ref_sec: 3.16
      cer: 0.0256
      wer: 0.1111
    bible_00035:
      source: bible
      text: 'Ɓe fuu ɓe mbemmbaa, ɓe cikkitii, ɓe mbiyondiri: —Koɗum ɗum foti laataade?'
      sbs: 0.7241
      gen_sec: 5.68
      ref_sec: 5.76
      cer: 0.0175
      wer: 0.0833
    bible_00036:
      source: bible
      text: Oɗon njiɗi mi yoppitana on kaananke Yahuudiyankooɓe oo naa?
      sbs: 0.599
      gen_sec: 3.44
      ref_sec: 3.32
      cer: 0.0
      wer: 0.2222
    bible_00037:
      source: bible
      text: Nde ɓe tilinoo ɲaagaade Laamɗo ndee, nokku ɗo ɓe kawritinnoo ɗoo dimmbii.
      sbs: 0.7425
      gen_sec: 5.04
      ref_sec: 4.56
      cer: 0.05
      wer: 0.4167
    bible_00038:
      source: bible
      text: 'Nelaaɓe sappo e ɗiɗon ɓee noddi jamaa goonɗinɓe oo fuu, mbii: —Minen, yoppude konngol Laamɗo,
        min kiinnoo jakkaade hiraande, sellantaa min.'
      sbs: 0.701
      gen_sec: 9.92
      ref_sec: 10.8
      cer: 0.0089
      wer: 0.0476
    bible_00039:
      source: bible
      text: O waɗi ɗum hakke ɲalaaɗe ɗe jomen annde ɓee ndokki mo taƴoral mum ɗee.
      sbs: 0.6811
      gen_sec: 4.0
      ref_sec: 4.86
      cer: 0.25
      wer: 0.5714
    bible_00040:
      source: bible
      text: No anndirten ko woni jilli dee, Almasiihu hokkitirii yonki mum kammari men.
      sbs: 0.7477
      gen_sec: 4.72
      ref_sec: 4.76
      cer: 0.0806
      wer: 0.4167
    bible_00041:
      source: bible
      text: Saabe majjum, haala mbonka ɓe kaalata, aduna oo ana hettinanoo ɓe.
      sbs: 0.7423
      gen_sec: 4.64
      ref_sec: 4.14
      cer: 0.0189
      wer: 0.1818
    bible_00042:
      source: bible
      text: 'O jaabii ɓe, o wii: —Onon nee, koɗum waɗi so oɗon luutta yamiroore Laamɗo ndee faa njokkon
        neesu mooɗon?'
      sbs: 0.7594
      gen_sec: 7.44
      ref_sec: 6.4
      cer: 0.0
      wer: 0.0
    bible_00043:
      source: bible
      text: Ɓoornotooɓe kaddule lobbe so nguura nguurndam lobbam ɓee, e cuuɗi kaanankooɓe tawetee.
      sbs: 0.7608
      gen_sec: 5.52
      ref_sec: 5.04
      cer: 0.0959
      wer: 0.5833
    bible_00044:
      source: bible
      text: Ɗiin luutti kaɲumen njippinta tikkere Laamɗo e dow saliiɓe goonɗinde mo ɓee.
      sbs: 0.6788
      gen_sec: 4.4
      ref_sec: 4.76
      cer: 0.0625
      wer: 0.3333
    bible_00045:
      source: bible
      text: 'Sabi ɲalaaɗe ngaran nde yimɓe mbiyata: «Rewɓe rimarɓe e deeɗi ɗi caawaali abada e enɗi ɗi
        muyninaali, mbelii hoore!'
      sbs: 0.7474
      gen_sec: 8.0
      ref_sec: 8.42
      cer: 0.0645
      wer: 0.3684
    bible_00046:
      source: bible
      text: Miin Pool e Timote, maccuɓe Iisaa Almasiihu, mbinndi oo ɓataaki faade e deental goonɗinɓe
        Iisaa gonngal ngeenndi Filipa.
      sbs: 0.6995
      gen_sec: 7.12
      ref_sec: 8.04
      cer: 0.1
      wer: 0.3889
    bible_00047:
      source: bible
      text: Ɓe ngaɗanii kam ko onon on mbaawaa waɗande kam saabe waasude mon taweede.
      sbs: 0.7076
      gen_sec: 4.64
      ref_sec: 4.9
      cer: 0.0667
      wer: 0.2308
    bible_00048:
      source: bible
      text: Iisaa yalti, fai waamnde haayre wiyeteende Jaytun no o woowiri nii.
      sbs: 0.7124
      gen_sec: 4.0
      ref_sec: 4.56
      cer: 0.0364
      wer: 0.3636
    bible_00049:
      source: bible
      text: Jooni eɗen njeyaa e goongaraajo oo, sabi eɗen ɲiiɓi e Ɓiyiiko Iisaa Almasiihu.
      sbs: 0.7383
      gen_sec: 6.56
      ref_sec: 5.2
      cer: 0.0469
      wer: 0.2308
    bible_00050:
      source: bible
      text: Kasen duu, Baabiraaɗo nelɗo kam oo hoore seettantoo kam.
      sbs: 0.7857
      gen_sec: 3.92
      ref_sec: 3.48
      cer: 0.0
      wer: 0.0
    bible_00051:
      source: bible
      text: O darni koyngal makko ɲaamal dow geeci, o darni nanal dow njoorndi, o eewnii daande toownde
        no rawaandu ladde uggirta nii.
      sbs: 0.7297
      gen_sec: 7.28
      ref_sec: 8.72
      cer: 0.1616
      wer: 0.5714
    bible_00052:
      source: bible
      text: Sabi ɗum gasataa no kasunke neldirtee kaananke mawɗo oo tawee ko nanngiraa koo hollitaaka
        faa laaɓa.
      sbs: 0.6736
      gen_sec: 6.24
      ref_sec: 9.66
      cer: 0.0714
      wer: 0.3125
    bible_00053:
      source: bible
      text: Publiyus, hooreejo ruunde ndee oo, ngesa muuɗum ana e sera nokkuure ndee.
      sbs: 0.6996
      gen_sec: 5.28
      ref_sec: 5.22
      cer: 0.0678
      wer: 0.25
    bible_00054:
      source: bible
      text: Yoga e hooreeɓe leydi Asiya, yiɓɓe makko, neli e makko ana ndaarda mo pati o naata boowal
        too.
      sbs: 0.7262
      gen_sec: 5.52
      ref_sec: 6.1
      cer: 0.0541
      wer: 0.1667
    bible_00055:
      source: bible
      text: Nde wonnoo jaangol ana heewi, gollooɓe e doomooɓe kuɓɓiino yiite ana ƴuwloo.
      sbs: 0.7294
      gen_sec: 4.88
      ref_sec: 4.7
      cer: 0.0635
      wer: 0.25
    bible_00056:
      source: bible
      text: 'Iisaa yeeccitii, yii eɓe njokki e mum, wii ɓe: —Koɗum tewtaton?'
      sbs: 0.7384
      gen_sec: 4.88
      ref_sec: 4.14
      cer: 0.1042
      wer: 0.4545
    bible_00057:
      source: bible
      text: Yahuuda nanngu lonngere ndee tan, yalti oon wakkati fuu.
      sbs: 0.7448
      gen_sec: 3.36
      ref_sec: 3.06
      cer: 0.0217
      wer: 0.1111
    bible_00058:
      source: bible
      text: 'Annii ko mbiyan-mi felooɓe kam ɓee: min kaandaa e heɓude ɲaamdu e yardu e ley golle amen
        naa?'
      sbs: 0.7234
      gen_sec: 5.44
      ref_sec: 5.88
      cer: 0.0548
      wer: 0.2222
    bible_00059:
      source: bible
      text: Ɗum hawri e wakkati lanndinal Yahuudiyankooɓe, tawi yanaande ndee ana ɓadii, ɗum waɗi so ɓe
        ndesi Iisaa ɗon.
      sbs: 0.7341
      gen_sec: 6.32
      ref_sec: 8.26
      cer: 0.1023
      wer: 0.4444
    bible_00060:
      source: bible
      text: O yii malaaikaen ɗiɗon ɓe kaddule daneeje ana njooɗii ɗo tew Iisaa oo resanoo ɗoo, gooto ɗo
        hoore ɗoo, goɗɗo oo to koyɗe too.
      sbs: 0.7225
      gen_sec: 8.4
      ref_sec: 8.62
      cer: 0.0707
      wer: 0.375
    bible_00061:
      source: bible
      text: No Joomiraaɗo yaaforii on nii, njaafondiron.
      sbs: 0.7348
      gen_sec: 3.36
      ref_sec: 3.3
      cer: 0.0
      wer: 0.0
    bible_00062:
      source: bible
      text: Eka ɲeɲaa ɲeɲugol Tooruuji Puneeji.
      sbs: 0.7141
      gen_sec: 2.64
      ref_sec: 3.46
      cer: 0.3
      wer: 1.2
    bible_00063:
      source: bible
      text: Debbo oo dogi yehi ley ladde, nokku ɗo Laamɗo moƴƴinannoo ɗum.
      sbs: 0.7378
      gen_sec: 3.84
      ref_sec: 3.82
      cer: 0.06
      wer: 0.0909
    bible_00064:
      source: bible
      text: Oɗon noddira kam «Moobbo» oɗon noddira kam «Kalfaaɗo».
      sbs: 0.7825
      gen_sec: 3.76
      ref_sec: 4.18
      cer: 0.0238
      wer: 0.125
    bible_00065:
      source: bible
      text: 'Kaa nde wonnoo omo anndi miilooji maɓɓe, o wii mo junngo mum waati oo: —Imma, dara hakkunde
        yimɓe!'
      sbs: 0.7174
      gen_sec: 6.72
      ref_sec: 5.94
      cer: 0.0263
      wer: 0.1111
    bible_00066:
      source: bible
      text: O haalanaa inna makko e miɲiraaɓe makko ana ndarii sella ana njiɗi yiide mo.
      sbs: 0.6737
      gen_sec: 4.8
      ref_sec: 4.04
      cer: 0.0645
      wer: 0.3571
    bible_00067:
      source: bible
      text: 'Nden binndoowo ngalluure ndee deƴƴini jamaa oo, wii: —Onon Efeesunkooɓe, homo woni mo anndaa
        ngalluure Efeesu ndee woni hayboore rewrudu Artemis deweteeɗo mawɗo oo, kaɲum e natal muuɗum iwrungal
        dow kammu ngal?'
      sbs: 0.6775
      gen_sec: 14.08
      ref_sec: 14.76
      cer: 0.1329
      wer: 0.4375
    bible_00068:
      source: bible
      text: Balɗe seeɗa caggal muuɗum, Agirippa kaananke oo e Barniki ngari Kaysariya jowtude Festus.
      sbs: 0.6745
      gen_sec: 5.28
      ref_sec: 7.32
      cer: 0.0533
      wer: 0.3077
    bible_00069:
      source: bible
      text: Nden moƴƴere o hokki en saabe Ɓiyiiko korsuɗo oo.
      sbs: 0.6763
      gen_sec: 3.12
      ref_sec: 3.5
      cer: 0.2
      wer: 0.5556
    bible_00070:
      source: bible
      text: 'Sabi nii Binndi ɗii mbiiri: «Homo anndi anniya Joomiraaɗo oo?'
      sbs: 0.7221
      gen_sec: 4.4
      ref_sec: 4.2
      cer: 0.0204
      wer: 0.1
    bible_00071:
      source: bible
      text: Tama on anndaa daɗondirteeɓe ɓee fuu yo dogooɓe, kaa gooto tan heɓata deesewal?
      sbs: 0.6964
      gen_sec: 4.96
      ref_sec: 5.62
      cer: 0.0308
      wer: 0.3077
    bible_00072:
      source: bible
      text: Njoɓdi am, ɗum woni seyo am ko mbaajotoo-mi Kabaaru Lobbo meere meere koo, tawti e ko mi lamndataako
        ko waajotooɓe Kabaaru Lobbo oo ɓee poti heɓude.
      sbs: 0.6871
      gen_sec: 10.16
      ref_sec: 11.84
      cer: 0.0924
      wer: 0.3846
    bible_00073:
      source: bible
      text: Tama on anndaa halfinaaɓe golle ittirde sadaka ɓee ana keɓa ngeɗu mumen e mayre?
      sbs: 0.6696
      gen_sec: 5.12
      ref_sec: 5.56
      cer: 0.1364
      wer: 0.5
    bible_00074:
      source: bible
      text: Iisaa yalti ana roondii leggal mum bardugal faa yottii nokku biyeteeɗo Laalagal Hoore .
      sbs: 0.643
      gen_sec: 9.12
      ref_sec: 5.08
      cer: 0.3973
      wer: 0.7692
    bible_00075:
      source: bible
      text: Yimɓe wonɓe e aduna oo ɓee fuu cujidanan taktakol ngol, ɗum woni neɗɗo fuu mo innde mum tawaaka
        ana winndii gila e diidugol aduna oo e ley dewtere nguurndam ndee, dewtere Njawdiri kirsanoondi
        ndii.
      sbs: 0.7176
      gen_sec: 12.8
      ref_sec: 12.02
      cer: 0.0435
      wer: 0.1765
    bible_00076:
      source: bible
      text: Sawru naa jilli e newaare?
      sbs: 0.6949
      gen_sec: 2.16
      ref_sec: 4.46
      cer: 0.0952
      wer: 1.0
    bible_00077:
      source: bible
      text: 'Nde ɓadinoo weetude ndee, Pool ndaardi ɓe fuu ɓe ɲaama, wii: —Hannde woni balɗe sappo e nay
        oɗon kettii on ɲaamaali fay huunde.'
      sbs: 0.6944
      gen_sec: 7.76
      ref_sec: 9.46
      cer: 0.09
      wer: 0.2174
    bible_00078:
      source: bible
      text: Sinndo mi gollaalino ɗii golleeji ɗi fay gooto meeɗaali gollude yeeso maɓɓe, ɓe ɲiŋataakeno.
      sbs: 0.7733
      gen_sec: 6.32
      ref_sec: 5.16
      cer: 0.1039
      wer: 0.5714
    bible_00079:
      source: bible
      text: Sakiraaɓe am horsuɓe, pati torra ittoowa koro mon naawnoowa hono no yiite nii haayno on, hono
        no huunde nde haanaa wardi e mon nii.
      sbs: 0.6914
      gen_sec: 7.76
      ref_sec: 10.94
      cer: 0.0857
      wer: 0.25
    bible_00080:
      source: bible
      text: Ɗum metti ɓe sanne, hedde eɓe piya dabare no ɓe kaani waɗude Iisaa.
      sbs: 0.6958
      gen_sec: 4.32
      ref_sec: 3.56
      cer: 0.0377
      wer: 0.3077
    bible_00081:
      source: bible
      text: Hono non Yaakuuba e Yuhanna ɓiɓɓe Jebede reentuɓe e Simon ɓee duu kaayniraa.
      sbs: 0.7145
      gen_sec: 5.12
      ref_sec: 7.18
      cer: 0.0635
      wer: 0.3077
    bible_00082:
      source: bible
      text: Durooɓe ɓee ndogi njantanoyii ngeenndi ndii e seraaji mum ko hewtii ɗumen koo.
      sbs: 0.6507
      gen_sec: 5.28
      ref_sec: 4.68
      cer: 0.0923
      wer: 0.3077
    bible_00083:
      source: bible
      text: Daande nde nan-mi ndee ana wai no dillere fiyooɓe kolli mumen nii.
      sbs: 0.7101
      gen_sec: 4.08
      ref_sec: 3.74
      cer: 0.1321
      wer: 0.5
    bible_00084:
      source: bible
      text: Piyeer sunaa sabi jooni woni cilol tataɓol ko Iisaa wii mo «Aɗa yiɗi kam naa?
      sbs: 0.7126
      gen_sec: 4.4
      ref_sec: 5.26
      cer: 0.082
      wer: 0.2667
    bible_00085:
      source: bible
      text: Faa hiiri, gorko arsukunte jeyaaɗo Arimatiya wari.
      sbs: 0.7049
      gen_sec: 3.52
      ref_sec: 3.96
      cer: 0.0952
      wer: 0.4286
    bible_00086:
      source: bible
      text: Nde weetunoo ndee, ɓe coynii leydi, kaa ɓe annditaali ndi.
      sbs: 0.723
      gen_sec: 4.0
      ref_sec: 4.14
      cer: 0.1087
      wer: 0.3
    bible_00087:
      source: bible
      text: Aleksandere huncani ɓe junngo faa jinngana yimɓe muuɗum ɓee.
      sbs: 0.6393
      gen_sec: 3.76
      ref_sec: 3.34
      cer: 0.0588
      wer: 0.1111
    bible_00088:
      source: bible
      text: 'Piyeer wii mo: —Kalfaaɗo, mi lanndinike naɓdeede e maa kasu e wardeede e maa!'
      sbs: 0.7355
      gen_sec: 5.04
      ref_sec: 6.06
      cer: 0.0167
      wer: 0.0714
    bible_00089:
      source: bible
      text: Saruku ɓii Ragawu, Ragawu ɓii Faleka.
      sbs: 0.7314
      gen_sec: 3.76
      ref_sec: 3.52
      cer: 0.0333
      wer: 0.1667
    bible_00090:
      source: bible
      text: 'O jaabii: —Goonga, Moobbo, aɗa anndi miɗo yiɗu maa.'
      sbs: 0.7805
      gen_sec: 6.08
      ref_sec: 4.26
      cer: 0.1053
      wer: 0.6667
    bible_00091:
      source: bible
      text: Kaa laatike tilsere ngolliran-moo-mi, mo golle mo kalfinaa-mi.
      sbs: 0.7113
      gen_sec: 5.04
      ref_sec: 4.06
      cer: 0.02
      wer: 0.375
    bible_00092:
      source: bible
      text: Ndennoo, ko min njii e ko min nani min kaalanta on onon duu, yalla oɗon ndeentira e amen hono
        no min ndeentiri e Baabiraaɗo e Ɓiyum Iisaa Almasiihu nii.
      sbs: 0.7284
      gen_sec: 10.0
      ref_sec: 10.44
      cer: 0.0826
      wer: 0.3448
    bible_00093:
      source: bible
      text: Fay so yettugol maa ngol ana wooɗi sanne, ngol nafataa joomum.
      sbs: 0.7101
      gen_sec: 3.92
      ref_sec: 4.0
      cer: 0.0
      wer: 0.0
    bible_00094:
      source: bible
      text: 'Ɓii Neɗɗo oo duu warii ana ɲaama, ana yara, yimɓe mbii ɗum: «Ɲaamde e yarde tan woni e hakkille
        mum, o giɗo duwaaɲeen e luuttooɓe hono mumen!'
      sbs: 0.7581
      gen_sec: 8.24
      ref_sec: 8.66
      cer: 0.055
      wer: 0.2222
    bible_00095:
      source: bible
      text: ɗe podannoo-mi Daawuuda ɗee.
      sbs: 0.7617
      gen_sec: 1.92
      ref_sec: 3.36
      cer: 0.2174
      wer: 0.75
    bible_00096:
      source: bible
      text: Jooni kaa, o waddii fay Yunaninkooɓe e ley Suudu Dewal Mawndu nduu.
      sbs: 0.7101
      gen_sec: 4.8
      ref_sec: 4.48
      cer: 0.037
      wer: 0.1667
    bible_00097:
      source: bible
      text: Jamaa garnooɗo ƴeewde oo fuu, nde yiinoo ko waɗi koo ndee, wirfitii terɗe mum ana mbaati.
      sbs: 0.706
      gen_sec: 5.92
      ref_sec: 6.8
      cer: 0.0845
      wer: 0.25
    bible_00098:
      source: bible
      text: O ɓattii Pool, o yamiri Pool nanngee, o wii haɓɓiree calali ɗiɗi, o lamndii kaɲum yo homo
        e koɗum waɗi?
      sbs: 0.7438
      gen_sec: 7.12
      ref_sec: 6.98
      cer: 0.0875
      wer: 0.5
    bible_00099:
      source: bible
      text: Hirudus yiɗi warde mo kaa suusaano yimɓe ɓee, sabi ɓe fuu eɓe njogorinoo Yaayaa yo annabaajo.
      sbs: 0.7034
      gen_sec: 6.16
      ref_sec: 7.68
      cer: 0.0263
      wer: 0.125
    bible_00100:
      source: bible
      text: 'E junngo am jaati mbinndiran-mi ngoo ɗoo jowtaango: miin Pool miɗo jowta on.'
      sbs: 0.7041
      gen_sec: 5.2
      ref_sec: 6.24
      cer: 0.0656
      wer: 0.2308
    bible_00101:
      source: bible
      text: Gaɗoowo ko boni fuu, heɓan mbarjaari golle mum bonɗo oo, sabi Laamɗo ɓurdintaa yimɓe.
      sbs: 0.7454
      gen_sec: 5.84
      ref_sec: 7.72
      cer: 0.1159
      wer: 0.4286
    bible_00102:
      source: bible
      text: Kaa jaɓɓiiɓe mo so ngoonɗini mo ɓee, o hokkii ɗumen baawɗe laataade ɓiɓɓe Laamɗo.
      sbs: 0.7331
      gen_sec: 5.28
      ref_sec: 4.68
      cer: 0.0606
      wer: 0.3571
    bible_00103:
      source: bible
      text: Nde ɓeen ƴeewi kabaaru am ndee, njiɗiino yoppude kam, sabi ɓe tawaali e am fay daliili gooto
        kaanɗo warde kam.
      sbs: 0.7071
      gen_sec: 7.04
      ref_sec: 6.6
      cer: 0.0909
      wer: 0.35
    bible_00104:
      source: bible
      text: So non, pati haaɗu e koyɗe am tan, lootu juuɗe am e hoore am duu.
      sbs: 0.6866
      gen_sec: 4.32
      ref_sec: 5.44
      cer: 0.0417
      wer: 0.1333
    bible_00105:
      source: bible
      text: Mi winndanii on haala majjum no raɓɓiɗiri, so on njanngii ɗum on anndan no paamir-mi sirri
        haala Almasiihu oo.
      sbs: 0.6908
      gen_sec: 6.32
      ref_sec: 9.76
      cer: 0.0337
      wer: 0.1579
    bible_00106:
      source: bible
      text: Laatee yurmotooɓe, no Baabiraaɗo mon oo laatorii jurmotooɗo nii.
      sbs: 0.763
      gen_sec: 4.16
      ref_sec: 3.8
      cer: 0.037
      wer: 0.2222
    bible_00107:
      source: bible
      text: Eɗen anndi en keɓii ko nduwi-ɗen koo, nde wonnoo eɗen anndi omo jaabanoo en duwaawu men.
      sbs: 0.7254
      gen_sec: 6.16
      ref_sec: 5.24
      cer: 0.0143
      wer: 0.1875
    bible_00108:
      source: bible
      text: Omo yeewaa on fuu, kasen o wemmbanooma sanne ko nan-ɗon o sellaano koo.
      sbs: 0.714
      gen_sec: 4.88
      ref_sec: 5.94
      cer: 0.0179
      wer: 0.0769
    bible_00109:
      source: bible
      text: O tawi ɗon dooyoore, yimɓe ana mboya, ana conkina semmbe.
      sbs: 0.6721
      gen_sec: 3.92
      ref_sec: 4.28
      cer: 0.0444
      wer: 0.4
    bible_00110:
      source: bible
      text: O tilaaki haalde, faa Yahuuda, gooto e sappo e ɗiɗon ɓee, yottii ana wondi e yimɓe heewɓe
        jogiiɓe kaafaaje e cabbi.
      sbs: 0.7013
      gen_sec: 7.44
      ref_sec: 8.7
      cer: 0.0549
      wer: 0.2381
    bible_00111:
      source: bible
      text: Heewɓe e yimɓe leydi ndii njehi Urusaliima faa cenna koe mumen gila iidi oo yottaaki.
      sbs: 0.6982
      gen_sec: 5.36
      ref_sec: 5.18
      cer: 0.0714
      wer: 0.2667
    bible_00112:
      source: bible
      text: Yamiroore makko yo goonɗinde Iisaa Almasiihu Ɓiyiiko oo, kaɲum e yiɗondirde hono no o yamiri
        en nii.
      sbs: 0.7345
      gen_sec: 6.32
      ref_sec: 6.22
      cer: 0.061
      wer: 0.3529
    bible_00113:
      source: bible
      text: Haaltude ko Laamɗo loowi e men koo ana timma, ɗemɗe ana timma, anndal ana timma.
      sbs: 0.7047
      gen_sec: 5.12
      ref_sec: 5.6
      cer: 0.0159
      wer: 0.0667
    bible_00114:
      source: bible
      text: 'Iisaa jokkini hen, wii: —Oɗon njoppa jamirooje Laamɗo ɗee, oɗon njokka neesuuji yimɓe ɗii.'
      sbs: 0.7522
      gen_sec: 6.4
      ref_sec: 5.58
      cer: 0.0278
      wer: 0.1429
    bible_00115:
      source: bible
      text: Nden ngol ƴoɲɲugol cakitiingol ɓuran aranndeewol ngol bonde.
      sbs: 0.7234
      gen_sec: 3.92
      ref_sec: 4.14
      cer: 0.1923
      wer: 0.625
    bible_00116:
      source: bible
      text: 'Ɓe njaabii, ɓe mbii: —Won wiyooɓe a Yaayaa mo lootogal batisima, won wiyooɓe a annabi Iliyaasa,
        won wiyooɓe kasen a annabi Yeremiya naa gooto e annabaaɓe ɓee.'
      sbs: 0.7428
      gen_sec: 9.68
      ref_sec: 11.04
      cer: 0.0635
      wer: 0.3333
    bible_00117:
      source: bible
      text: Naɓuɓe mo ɓee naataali huɓeere ndee, sabi so ɓe naatii nde, ɓe coɓan, ɓe ɲaamataa ndeendi
        iidi Paska ndii.
      sbs: 0.7129
      gen_sec: 7.04
      ref_sec: 6.6
      cer: 0.0595
      wer: 0.2105
    bible_00118:
      source: bible
      text: So luurral waɗii hakkunde mon, hono joomumen cuusirta wullitaade ooɲiiɓe ɓee njoppa fooccitiiɓe
        ɓee?
      sbs: 0.7007
      gen_sec: 5.92
      ref_sec: 6.98
      cer: 0.0471
      wer: 0.3571
    bible_00119:
      source: bible
      text: Engol tinndina yimɓe aduna moƴƴina tooru nanndundu e taktakol barminiranoongol kaafaawi faa
        hosi waatude kaa ana wuuri ngol.
      sbs: 0.6959
      gen_sec: 8.16
      ref_sec: 8.14
      cer: 0.0566
      wer: 0.6111
    bible_00120:
      source: bible
      text: 'Iisaa jaabii mo: —So neɗɗo ana yiɗi kam, jokkan konngol am, Baabiraaɗo am yiɗan ɗum.'
      sbs: 0.7383
      gen_sec: 6.4
      ref_sec: 5.98
      cer: 0.0
      wer: 0.0
    bible_00121:
      source: bible
      text: Kaa jooni, e haɓɓagol mooɗon e Iisaa Almasiihu, onon woɗɗunooɓe arannde ɓee on ɓattiniraama
        saabe ƴiiƴam makko ɗam.
      sbs: 0.6995
      gen_sec: 7.2
      ref_sec: 8.0
      cer: 0.0421
      wer: 0.2222
    bible_00122:
      source: bible
      text: Kaa onon, oɗon anndi mo sabi omo wondi e mon, omo e mon.
      sbs: 0.7585
      gen_sec: 4.24
      ref_sec: 3.7
      cer: 0.0
      wer: 0.0
    bible_00123:
      source: bible
      text: —So ɓooyii seeɗa, on njiyataa kam, so ɓooyii seeɗa kasen, njiyon kam.
      sbs: 0.7666
      gen_sec: 4.88
      ref_sec: 4.54
      cer: 0.0943
      wer: 0.3333
    bible_00124:
      source: bible
      text: faa terɗe am duu mbaaltoo dow jikke.
      sbs: 0.7094
      gen_sec: 2.24
      ref_sec: 3.06
      cer: 0.2414
      wer: 0.7143
    bible_00125:
      source: bible
      text: Ruuhu Ceniiɗo, Balloowo on mo Baabiraaɗo neldirta on saabe am oo, kaɲum anndinta on kulle
        fuu.
      sbs: 0.764
      gen_sec: 7.44
      ref_sec: 5.82
      cer: 0.0395
      wer: 0.3125
    bible_00126:
      source: bible
      text: Mi torrii ɓe cili keewɗi e cuuɗi baajorɗi ɗii fuu, mi tilsinii ɓe mbonkoo Joomiraaɗo.
      sbs: 0.7349
      gen_sec: 5.12
      ref_sec: 5.3
      cer: 0.1159
      wer: 0.2667
    bible_00127:
      source: bible
      text: So ɗum waɗii, wanaa ɓe ɗiɗon fuu, ɓe caaman ley ngaykaare naa?
      sbs: 0.75
      gen_sec: 3.84
      ref_sec: 3.9
      cer: 0.0625
      wer: 0.1667
    bible_00128:
      source: bible
      text: Ɲaagee Laamɗo yalla miɗo waajoroo oon goonga tedduɗo no haaniri nii.
      sbs: 0.7063
      gen_sec: 4.4
      ref_sec: 4.86
      cer: 0.0351
      wer: 0.1818
    bible_00129:
      source: bible
      text: «Anndal» nee waddan mawninkinaare, jilli ngoni ko naɓata deental goonɗinɓe ngal yeeso.
      sbs: 0.6994
      gen_sec: 5.36
      ref_sec: 5.48
      cer: 0.0704
      wer: 0.4167
    bible_00130:
      source: bible
      text: Caggal ɗeen balɗe, min lanndinii, min ŋabbiti Urusaliima.
      sbs: 0.6899
      gen_sec: 3.76
      ref_sec: 3.44
      cer: 0.0638
      wer: 0.5
    bible_00131:
      source: bible
      text: Yahuudiyankooɓe goonɗinɓe wardunooɓe e Piyeer ɓee fuu kaaynaa, no dokkal Ruuhu Ceniiɗo ngal
        saakorii e yimɓe ɓe nganaa Yahuudiyankooɓe nii.
      sbs: 0.7131
      gen_sec: 7.92
      ref_sec: 10.2
      cer: 0.1525
      wer: 0.65
    bible_00132:
      source: bible
      text: 'Eɓe nanndi e sukaaɓe jooɗiiɓe e luumooji, ɓee ɗoo ana mbiya ɓee too: «Min piyanii on cereeli.'
      sbs: 0.7538
      gen_sec: 5.76
      ref_sec: 5.9
      cer: 0.0959
      wer: 0.2941
    bible_00133:
      source: bible
      text: No Iisaa selliniri gorko paho mo haala mum laaɓaa.
      sbs: 0.7102
      gen_sec: 3.44
      ref_sec: 8.92
      cer: 0.0976
      wer: 0.2222
    bible_00134:
      source: bible
      text: 'Iisaa jaabii ɓe: —Wakkati mo Laamɗo hollata teddeengal Ɓii Neɗɗo oo yottike.'
      sbs: 0.7383
      gen_sec: 5.36
      ref_sec: 4.78
      cer: 0.0645
      wer: 0.3333
    bible_00135:
      source: bible
      text: Kaa o darii omo tewta memɗo mo oo.
      sbs: 0.7189
      gen_sec: 2.4
      ref_sec: 3.22
      cer: 0.1923
      wer: 0.625
    bible_00136:
      source: bible
      text: Wakkati fuu omo soobii e duwaawu saabe mooɗon yalla oɗon ɲiiɓa e ley kiɓɓal, timminon muuyɗe
        Laamɗo fuu.
      sbs: 0.6964
      gen_sec: 6.48
      ref_sec: 6.9
      cer: 0.0706
      wer: 0.2222
    bible_00137:
      source: bible
      text: Oo kabaaru saakii e leydi Yahuudiya e seraaji mum fuu.
      sbs: 0.7105
      gen_sec: 3.52
      ref_sec: 3.72
      cer: 0.2045
      wer: 1.0
    bible_00138:
      source: bible
      text: Ɓiraaɗam ndokku-mi on, wanaa ɲaamdu tekkundu, sabi on mbaawanaano ndu.
      sbs: 0.7282
      gen_sec: 4.4
      ref_sec: 5.12
      cer: 0.2105
      wer: 0.8
    bible_00139:
      source: bible
      text: 'Iisaa jaabii mo: —So wanaa Laamɗo hokku maa baawɗe, a waawaano e am fay huunde.'
      sbs: 0.7513
      gen_sec: 6.16
      ref_sec: 5.44
      cer: 0.2951
      wer: 1.2667
    bible_00140:
      source: bible
      text: 'Piyeer haali, tekkini, wii: —Fay so tilsi mi maaydan e maa, abada mi wiyataa mi anndaa ma.'
      sbs: 0.6936
      gen_sec: 7.52
      ref_sec: 6.46
      cer: 0.1765
      wer: 0.5882
    bible_00141:
      source: bible
      text: Oon hokkata terɗe ɗee fuu ko kaajaa, hawrintinira ɗe jokkolɗe e ɗaɗi.
      sbs: 0.7151
      gen_sec: 4.72
      ref_sec: 4.96
      cer: 0.1429
      wer: 0.4167
    bible_00142:
      source: bible
      text: 'Caggal ɗum, Iisaa yottodii e maɓɓe nokku biyeteeɗo Gecemane, wii ɓe: —Njooɗee ɗoo, faa mi
        waɗoya too duwaawu.'
      sbs: 0.7184
      gen_sec: 7.44
      ref_sec: 8.6
      cer: 0.0698
      wer: 0.3333
    bible_00143:
      source: bible
      text: Aawdi ndi aaw-ɗaa fuu, sinaa waata so fuɗa.
      sbs: 0.6915
      gen_sec: 3.12
      ref_sec: 3.24
      cer: 0.0606
      wer: 0.25
    bible_00144:
      source: bible
      text: Nde kiikiiɗe alan warnoo ndee, taalibaaɓe Iisaa coki baafal dow hoore mumen nokku ɗo ɓe kawriti
        ɗoo, saabe kulol hooreeɓe Yahuudiyankooɓe.
      sbs: 0.7149
      gen_sec: 8.16
      ref_sec: 8.22
      cer: 0.113
      wer: 0.4762
    bible_00145:
      source: bible
      text: Pati ndurdon nde tilsere, ndurdon nde ɓernde laaɓunde no Laamɗo yiɗiri nii.
      sbs: 0.6961
      gen_sec: 4.88
      ref_sec: 5.04
      cer: 0.0806
      wer: 0.4167
    bible_00146:
      source: bible
      text: Iisaa e hoore mum ana anndi to Laamɗo iwri to Laamɗo hootata.
      sbs: 0.7019
      gen_sec: 4.16
      ref_sec: 3.4
      cer: 0.0816
      wer: 0.1667
    bible_00147:
      source: bible
      text: 'O jaabii, o wii: —Miin woni «ooynotooɗo ley ladde jeereende so ana wiya: moƴƴintinee laawol
        Joomiraaɗo», hono no annabi Esaaya wiiri nii.'
      sbs: 0.7096
      gen_sec: 9.92
      ref_sec: 10.82
      cer: 0.037
      wer: 0.1364
    bible_00148:
      source: bible
      text: Taalibaaɓe ɗiɗon ɓee nani ko o haali koo, njokkitii Iisaa.
      sbs: 0.6912
      gen_sec: 3.6
      ref_sec: 3.26
      cer: 0.0638
      wer: 0.4
    bible_00149:
      source: bible
      text: Ngel welan e hunduko maa no njuumri nii, kaa ngel wulnan reedu maa taw.
      sbs: 0.6493
      gen_sec: 4.56
      ref_sec: 3.58
      cer: 0.0536
      wer: 0.3571
    bible_00150:
      source: bible
      text: Nde o hokkitirnoo hoore makko ndee, nden o wurjini kokowol palaangol ngol, ɗum woni o ittii
        ngaɲaandi hakkunde leɲi ɗii.
      sbs: 0.712
      gen_sec: 7.2
      ref_sec: 8.08
      cer: 0.0612
      wer: 0.3
    bible_00151:
      source: bible
      text: Joomiraaɗo ana ɓanngina baawɗe mum e makko, omo sellina ɲawuuji.
      sbs: 0.7207
      gen_sec: 3.92
      ref_sec: 3.66
      cer: 0.0755
      wer: 0.3
    bible_00152:
      source: bible
      text: Ngol hokkaa baawɗe laamaade suudu baaba fuu e jaaleɲol fuu e ɗemngal fuu e leɲol fuu.
      sbs: 0.7535
      gen_sec: 6.32
      ref_sec: 6.38
      cer: 0.0725
      wer: 0.4375
    bible_00153:
      source: bible
      text: Ɗum waddani mo laataade curoowo hakkunde yimɓe e Laamɗo ley aadi keyri ndii, yalla noddaaɓe
        ɓee ana keɓa ndonu keddotooɗo faa abada mo Laamɗo fodi oo.
      sbs: 0.7053
      gen_sec: 8.32
      ref_sec: 11.82
      cer: 0.0407
      wer: 0.1923
    bible_00154:
      source: bible
      text: laatiinde haayre ɓurnde fuu teentilaade e maadi ndii.
      sbs: 0.6912
      gen_sec: 3.44
      ref_sec: 3.82
      cer: 0.0444
      wer: 0.5
    bible_00155:
      source: bible
      text: '» Kaa Iisaa wiyaali mo maayataa, ko o wii dee: «So miɗo muuyani mo nguurndam faa nde ngartu-mi,
        koɗum hillu maa hen?'
      sbs: 0.6792
      gen_sec: 7.6
      ref_sec: 14.36
      cer: 0.1932
      wer: 0.8571
    bible_00156:
      source: bible
      text: Kaa kammari Yahuudiyankooɓe ɓee caliima mi yoppitee, ɗum waddani kam ɲaagaade sariya am ɓettinee
        naɓee to kaananke Roma mawɗo oo, tawee mi happaali leɲol am ngol fay huunde.
      sbs: 0.7043
      gen_sec: 10.88
      ref_sec: 10.62
      cer: 0.1259
      wer: 0.6071
    bible_00157:
      source: bible
      text: 'Iisaa wii ɓe: —Kakkilee, ndeentee e ƴuufinirdi Farisaen e Sadukien ndii.'
      sbs: 0.7482
      gen_sec: 5.12
      ref_sec: 5.0
      cer: 0.1207
      wer: 0.3636
    bible_00158:
      source: bible
      text: sabi omo ɲaamo am, pati mi yeryerta.
      sbs: 0.7211
      gen_sec: 2.72
      ref_sec: 3.22
      cer: 0.0
      wer: 0.0
    bible_00159:
      source: bible
      text: Mo seyɗaani mum ribbaa oo, ndaardi Iisaa acca o jokka e mum.
      sbs: 0.7162
      gen_sec: 4.24
      ref_sec: 3.88
      cer: 0.2128
      wer: 0.5833
    bible_00160:
      source: bible
      text: Nde Pool tilinoo haalde ɗum ndee, kaɲum e maɓɓe fuu ɓe ndiccii, ɓe nduwii.
      sbs: 0.6897
      gen_sec: 4.8
      ref_sec: 4.66
      cer: 0.0862
      wer: 0.3571
    bible_00161:
      source: bible
      text: Ɓe njokkitii mo, ɓe miili o woyoyan dow yanaande too.
      sbs: 0.7376
      gen_sec: 3.36
      ref_sec: 3.12
      cer: 0.0
      wer: 0.0
    bible_00162:
      source: bible
      text: Waajuuji ɗi mbaajii-mi on ɗii fuu, mi waajortaako ɗi hiini hoore am.
      sbs: 0.7649
      gen_sec: 4.8
      ref_sec: 4.02
      cer: 0.0556
      wer: 0.25
    bible_00163:
      source: bible
      text: Sabi heewɓe laatike konneeen leggal bardugal Iisaa Almasiihu.
      sbs: 0.6464
      gen_sec: 4.16
      ref_sec: 3.72
      cer: 0.0566
      wer: 0.25
    bible_00164:
      source: bible
      text: —Sakiraaɓe e baabiraaɓe, kettinee jooni faa mi fammina on mi waɗaali ko boni.
      sbs: 0.7401
      gen_sec: 5.2
      ref_sec: 4.76
      cer: 0.0484
      wer: 0.2308
    bible_00165:
      source: bible
      text: Ruuhu oo duu hollata ɗum, sabi Ruuhu oo woni goonga.
      sbs: 0.7324
      gen_sec: 3.76
      ref_sec: 3.22
      cer: 0.0488
      wer: 0.2
    bible_00166:
      source: bible
      text: Pool ana yiɗi naatude hakkunde jamaa oo, kaa taalibaaɓe ɓee kaɗi mo ɗum.
      sbs: 0.7076
      gen_sec: 4.48
      ref_sec: 3.86
      cer: 0.0
      wer: 0.1538
    bible_00167:
      source: bible
      text: Nasuuna ɓii Aminadaabu, Aminadaabu ɓii Adamin.
      sbs: 0.7238
      gen_sec: 3.76
      ref_sec: 3.94
      cer: 0.2051
      wer: 1.0
    bible_00168:
      source: bible
      text: Nde taalibaaɓe ɓee lummbata weendu nduu ndee, njeggiti yooɓaade ɲaamdu.
      sbs: 0.6781
      gen_sec: 4.64
      ref_sec: 4.36
      cer: 0.1667
      wer: 0.7
    bible_00169:
      source: bible
