      text: Oɗon njiɗi mi yoppitana on kaananke Yahuudiyankooɓe oo naa?
      sbs: 0.6378
      gen_sec: 3.76
      ref_sec: 3.32
      cer: 0.2
      wer: 2.0
    bible_00037:
      source: bible
      text: Nde ɓe tilinoo ɲaagaade Laamɗo ndee, nokku ɗo ɓe kawritinnoo ɗoo dimmbii.
      sbs: 0.6465
      gen_sec: 5.2
      ref_sec: 4.56
      cer: 0.3
      wer: 1.25
    bible_00038:
      source: bible
      text: 'Nelaaɓe sappo e ɗiɗon ɓee noddi jamaa goonɗinɓe oo fuu, mbii: —Minen, yoppude konngol Laamɗo,
        min kiinnoo jakkaade hiraande, sellantaa min.'
      sbs: 0.7268
      gen_sec: 11.28
      ref_sec: 10.8
      cer: 0.3482
      wer: 1.5714
    bible_00039:
      source: bible
      text: O waɗi ɗum hakke ɲalaaɗe ɗe jomen annde ɓee ndokki mo taƴoral mum ɗee.
      sbs: 0.6615
      gen_sec: 5.52
      ref_sec: 4.86
      cer: 0.5357
      wer: 1.0714
    bible_00040:
      source: bible
      text: No anndirten ko woni jilli dee, Almasiihu hokkitirii yonki mum kammari men.
      sbs: 0.6938
      gen_sec: 5.36
      ref_sec: 4.76
      cer: 0.2258
      wer: 0.6667
    bible_00041:
      source: bible
      text: Saabe majjum, haala mbonka ɓe kaalata, aduna oo ana hettinanoo ɓe.
      sbs: 0.698
      gen_sec: 6.72
      ref_sec: 4.14
      cer: 0.1509
      wer: 0.6364
    bible_00042:
      source: bible
      text: 'O jaabii ɓe, o wii: —Onon nee, koɗum waɗi so oɗon luutta yamiroore Laamɗo ndee faa njokkon
        neesu mooɗon?'
      sbs: 0.6862
      gen_sec: 8.96
      ref_sec: 6.4
      cer: 0.284
      wer: 1.1579
    bible_00043:
      source: bible
      text: Ɓoornotooɓe kaddule lobbe so nguura nguurndam lobbam ɓee, e cuuɗi kaanankooɓe tawetee.
      sbs: 0.6522
      gen_sec: 9.44
      ref_sec: 5.04
      cer: 0.1918
      wer: 1.25
    bible_00044:
      source: bible
      text: Ɗiin luutti kaɲumen njippinta tikkere Laamɗo e dow saliiɓe goonɗinde mo ɓee.
      sbs: 0.6294
      gen_sec: 6.24
      ref_sec: 4.76
      cer: 0.2969
      wer: 1.3333
    bible_00045:
      source: bible
      text: 'Sabi ɲalaaɗe ngaran nde yimɓe mbiyata: «Rewɓe rimarɓe e deeɗi ɗi caawaali abada e enɗi ɗi
        muyninaali, mbelii hoore!'
      sbs: 0.6423
      gen_sec: 9.6
      ref_sec: 8.42
      cer: 0.2258
      wer: 1.1053
    bible_00046:
      source: bible
      text: Miin Pool e Timote, maccuɓe Iisaa Almasiihu, mbinndi oo ɓataaki faade e deental goonɗinɓe
        Iisaa gonngal ngeenndi Filipa.
      sbs: 0.6774
      gen_sec: 8.48
      ref_sec: 8.04
      cer: 0.27
      wer: 1.4444
    bible_00047:
      source: bible
      text: Ɓe ngaɗanii kam ko onon on mbaawaa waɗande kam saabe waasude mon taweede.
      sbs: 0.6646
      gen_sec: 5.44
      ref_sec: 4.9
      cer: 0.0333
      wer: 0.2308
    bible_00048:
      source: bible
      text: Iisaa yalti, fai waamnde haayre wiyeteende Jaytun no o woowiri nii.
      sbs: 0.6658
      gen_sec: 4.48
      ref_sec: 4.56
      cer: 0.2727
      wer: 1.0
    bible_00049:
      source: bible
      text: Jooni eɗen njeyaa e goongaraajo oo, sabi eɗen ɲiiɓi e Ɓiyiiko Iisaa Almasiihu.
      sbs: 0.6828
      gen_sec: 6.48
      ref_sec: 5.2
      cer: 0.1562
      wer: 0.6154
    bible_00050:
      source: bible
      text: Kasen duu, Baabiraaɗo nelɗo kam oo hoore seettantoo kam.
      sbs: 0.6632
      gen_sec: 4.96
      ref_sec: 3.48
      cer: 0.2391
      wer: 0.5556
    bible_00051:
      source: bible
      text: O darni koyngal makko ɲaamal dow geeci, o darni nanal dow njoorndi, o eewnii daande toownde
        no rawaandu ladde uggirta nii.
      sbs: 0.6926
      gen_sec: 9.36
      ref_sec: 8.72
      cer: 0.303
      wer: 1.1905
    bible_00052:
      source: bible
      text: Sabi ɗum gasataa no kasunke neldirtee kaananke mawɗo oo tawee ko nanngiraa koo hollitaaka
        faa laaɓa.
      sbs: 0.7028
      gen_sec: 10.64
      ref_sec: 9.66
      cer: 0.2024
      wer: 1.3125
    bible_00053:
      source: bible
      text: Publiyus, hooreejo ruunde ndee oo, ngesa muuɗum ana e sera nokkuure ndee.
      sbs: 0.6345
      gen_sec: 6.16
      ref_sec: 5.22
      cer: 0.1017
      wer: 0.75
    bible_00054:
      source: bible
      text: Yoga e hooreeɓe leydi Asiya, yiɓɓe makko, neli e makko ana ndaarda mo pati o naata boowal
        too.
      sbs: 0.7033
      gen_sec: 8.48
      ref_sec: 6.1
      cer: 0.2162
      wer: 0.9444
    bible_00055:
      source: bible
      text: Nde wonnoo jaangol ana heewi, gollooɓe e doomooɓe kuɓɓiino yiite ana ƴuwloo.
      sbs: 0.6336
      gen_sec: 5.92
      ref_sec: 4.7
      cer: 0.254
      wer: 0.75
    bible_00056:
      source: bible
      text: 'Iisaa yeeccitii, yii eɓe njokki e mum, wii ɓe: —Koɗum tewtaton?'
      sbs: 0.6997
      gen_sec: 6.16
      ref_sec: 4.14
      cer: 0.2708
      wer: 1.1818
    bible_00057:
      source: bible
      text: Yahuuda nanngu lonngere ndee tan, yalti oon wakkati fuu.
      sbs: 0.7012
      gen_sec: 3.28
      ref_sec: 3.06
      cer: 0.0652
      wer: 0.2222
    bible_00058:
      source: bible
      text: 'Annii ko mbiyan-mi felooɓe kam ɓee: min kaandaa e heɓude ɲaamdu e yardu e ley golle amen
        naa?'
      sbs: 0.6836
      gen_sec: 7.76
      ref_sec: 5.88
      cer: 0.1507
      wer: 0.4444
    bible_00059:
      source: bible
      text: Ɗum hawri e wakkati lanndinal Yahuudiyankooɓe, tawi yanaande ndee ana ɓadii, ɗum waɗi so ɓe
        ndesi Iisaa ɗon.
      sbs: 0.6724
      gen_sec: 8.96
      ref_sec: 8.26
      cer: 0.1932
      wer: 0.7778
    bible_00060:
      source: bible
      text: O yii malaaikaen ɗiɗon ɓe kaddule daneeje ana njooɗii ɗo tew Iisaa oo resanoo ɗoo, gooto ɗo
        hoore ɗoo, goɗɗo oo to koyɗe too.
      sbs: 0.6521
      gen_sec: 11.12
      ref_sec: 8.62
      cer: 0.3636
      wer: 1.125
    bible_00061:
      source: bible
      text: No Joomiraaɗo yaaforii on nii, njaafondiron.
      sbs: 0.6709
      gen_sec: 3.6
      ref_sec: 3.3
      cer: 0.2432
      wer: 0.8333
    bible_00062:
      source: bible
      text: Eka ɲeɲaa ɲeɲugol Tooruuji Puneeji.
      sbs: 0.6921
      gen_sec: 2.16
      ref_sec: 3.46
      cer: 1.0
      wer: 1.0
    bible_00063:
      source: bible
      text: Debbo oo dogi yehi ley ladde, nokku ɗo Laamɗo moƴƴinannoo ɗum.
      sbs: 0.6541
      gen_sec: 4.0
      ref_sec: 3.82
      cer: 0.6
      wer: 1.6364
    bible_00064:
      source: bible
      text: Oɗon noddira kam «Moobbo» oɗon noddira kam «Kalfaaɗo».
      sbs: 0.7464
      gen_sec: 5.04
      ref_sec: 4.18
      cer: 0.3095
      wer: 1.0
    bible_00065:
      source: bible
      text: 'Kaa nde wonnoo omo anndi miilooji maɓɓe, o wii mo junngo mum waati oo: —Imma, dara hakkunde
        yimɓe!'
      sbs: 0.6675
      gen_sec: 8.4
      ref_sec: 5.94
      cer: 0.1711
      wer: 1.0
    bible_00066:
      source: bible
      text: O haalanaa inna makko e miɲiraaɓe makko ana ndarii sella ana njiɗi yiide mo.
      sbs: 0.6199
      gen_sec: 7.2
      ref_sec: 4.04
      cer: 0.2419
      wer: 1.0
    bible_00067:
      source: bible
      text: 'Nden binndoowo ngalluure ndee deƴƴini jamaa oo, wii: —Onon Efeesunkooɓe, homo woni mo anndaa
        ngalluure Efeesu ndee woni hayboore rewrudu Artemis deweteeɗo mawɗo oo, kaɲum e natal muuɗum iwrungal
        dow kammu ngal?'
      sbs: 0.6957
      gen_sec: 14.72
      ref_sec: 14.76
      cer: 0.2254
      wer: 0.8125
    bible_00068:
      source: bible
      text: Balɗe seeɗa caggal muuɗum, Agirippa kaananke oo e Barniki ngari Kaysariya jowtude Festus.
      sbs: 0.6697
      gen_sec: 9.52
      ref_sec: 7.32
      cer: 0.1867
      wer: 1.6923
    bible_00069:
      source: bible
      text: Nden moƴƴere o hokki en saabe Ɓiyiiko korsuɗo oo.
      sbs: 0.6048
      gen_sec: 3.76
      ref_sec: 3.5
      cer: 0.5
      wer: 1.0
    bible_00070:
      source: bible
      text: 'Sabi nii Binndi ɗii mbiiri: «Homo anndi anniya Joomiraaɗo oo?'
      sbs: 0.7003
      gen_sec: 4.32
      ref_sec: 4.2
      cer: 0.2857
      wer: 0.9
    bible_00071:
      source: bible
      text: Tama on anndaa daɗondirteeɓe ɓee fuu yo dogooɓe, kaa gooto tan heɓata deesewal?
      sbs: 0.6506
      gen_sec: 6.0
      ref_sec: 5.62
      cer: 0.3692
      wer: 1.2308
    bible_00072:
      source: bible
      text: Njoɓdi am, ɗum woni seyo am ko mbaajotoo-mi Kabaaru Lobbo meere meere koo, tawti e ko mi lamndataako
        ko waajotooɓe Kabaaru Lobbo oo ɓee poti heɓude.
      sbs: 0.6699
      gen_sec: 14.32
      ref_sec: 11.84
      cer: 0.2269
      wer: 1.3846
    bible_00073:
      source: bible
      text: Tama on anndaa halfinaaɓe golle ittirde sadaka ɓee ana keɓa ngeɗu mumen e mayre?
      sbs: 0.6305
      gen_sec: 5.84
      ref_sec: 5.56
      cer: 0.4545
      wer: 0.9286
    bible_00074:
      source: bible
      text: Iisaa yalti ana roondii leggal mum bardugal faa yottii nokku biyeteeɗo Laalagal Hoore .
      sbs: 0.6862
      gen_sec: 6.32
      ref_sec: 5.08
      cer: 0.3425
      wer: 1.0769
    bible_00075:
      source: bible
      text: Yimɓe wonɓe e aduna oo ɓee fuu cujidanan taktakol ngol, ɗum woni neɗɗo fuu mo innde mum tawaaka
        ana winndii gila e diidugol aduna oo e ley dewtere nguurndam ndee, dewtere Njawdiri kirsanoondi
        ndii.
      sbs: 0.6953
      gen_sec: 16.0
      ref_sec: 12.02
      cer: 0.1615
      wer: 1.0882
    bible_00076:
      source: bible
      text: Sawru naa jilli e newaare?
      sbs: 0.5944
      gen_sec: 1.68
      ref_sec: 4.46
      cer: 0.4286
      wer: 1.0
    bible_00077:
      source: bible
      text: 'Nde ɓadinoo weetude ndee, Pool ndaardi ɓe fuu ɓe ɲaama, wii: —Hannde woni balɗe sappo e nay
        oɗon kettii on ɲaamaali fay huunde.'
      sbs: 0.6582
      gen_sec: 9.76
      ref_sec: 9.46
      cer: 0.18
      wer: 0.9565
    bible_00078:
      source: bible
      text: Sinndo mi gollaalino ɗii golleeji ɗi fay gooto meeɗaali gollude yeeso maɓɓe, ɓe ɲiŋataakeno.
      sbs: 0.6715
      gen_sec: 9.52
      ref_sec: 5.16
      cer: 0.3506
      wer: 1.5
    bible_00079:
      source: bible
      text: Sakiraaɓe am horsuɓe, pati torra ittoowa koro mon naawnoowa hono no yiite nii haayno on, hono
        no huunde nde haanaa wardi e mon nii.
      sbs: 0.7011
      gen_sec: 10.24
      ref_sec: 10.94
      cer: 0.1714
      wer: 1.0417
    bible_00080:
      source: bible
      text: Ɗum metti ɓe sanne, hedde eɓe piya dabare no ɓe kaani waɗude Iisaa.
      sbs: 0.6885
      gen_sec: 5.04
      ref_sec: 3.56
      cer: 0.3208
      wer: 0.8462
    bible_00081:
      source: bible
      text: Hono non Yaakuuba e Yuhanna ɓiɓɓe Jebede reentuɓe e Simon ɓee duu kaayniraa.
      sbs: 0.7078
      gen_sec: 6.48
      ref_sec: 7.18
      cer: 0.3016
      wer: 1.1538
    bible_00082:
      source: bible
      text: Durooɓe ɓee ndogi njantanoyii ngeenndi ndii e seraaji mum ko hewtii ɗumen koo.
      sbs: 0.6455
      gen_sec: 7.52
      ref_sec: 4.68
      cer: 0.2923
      wer: 1.4615
    bible_00083:
      source: bible
      text: Daande nde nan-mi ndee ana wai no dillere fiyooɓe kolli mumen nii.
      sbs: 0.641
      gen_sec: 5.04
      ref_sec: 3.74
      cer: 0.2642
      wer: 0.8333
    bible_00084:
      source: bible
      text: Piyeer sunaa sabi jooni woni cilol tataɓol ko Iisaa wii mo «Aɗa yiɗi kam naa?
      sbs: 0.68
      gen_sec: 5.2
      ref_sec: 5.26
      cer: 0.2131
      wer: 0.8
    bible_00085:
      source: bible
      text: Faa hiiri, gorko arsukunte jeyaaɗo Arimatiya wari.
      sbs: 0.5731
      gen_sec: 12.32
      ref_sec: 3.96
      cer: 2.4762
      wer: 6.1429
    bible_00086:
      source: bible
      text: Nde weetunoo ndee, ɓe coynii leydi, kaa ɓe annditaali ndi.
      sbs: 0.7216
      gen_sec: 4.72
      ref_sec: 4.14
      cer: 0.3043
      wer: 1.5
    bible_00087:
      source: bible
      text: Aleksandere huncani ɓe junngo faa jinngana yimɓe muuɗum ɓee.
      sbs: 0.389
      gen_sec: 15.2
      ref_sec: 3.34
      cer: 3.4902
      wer: 6.0
    bible_00088:
      source: bible
      text: 'Piyeer wii mo: —Kalfaaɗo, mi lanndinike naɓdeede e maa kasu e wardeede e maa!'
      sbs: 0.752
      gen_sec: 5.76
      ref_sec: 6.06
      cer: 0.2167
      wer: 1.0714
    bible_00089:
      source: bible
      text: Saruku ɓii Ragawu, Ragawu ɓii Faleka.
      sbs: 0.775
      gen_sec: 2.08
      ref_sec: 3.52
      cer: 1.0
      wer: 1.0
    bible_00090:
      source: bible
      text: 'O jaabii: —Goonga, Moobbo, aɗa anndi miɗo yiɗu maa.'
      sbs: 0.7045
      gen_sec: 4.64
      ref_sec: 4.26
      cer: 0.3947
      wer: 1.4444
    bible_00091:
      source: bible
      text: Kaa laatike tilsere ngolliran-moo-mi, mo golle mo kalfinaa-mi.
      sbs: 0.6845
      gen_sec: 4.32
      ref_sec: 4.06
      cer: 0.2
      wer: 1.5
    bible_00092:
      source: bible
      text: Ndennoo, ko min njii e ko min nani min kaalanta on onon duu, yalla oɗon ndeentira e amen hono
        no min ndeentiri e Baabiraaɗo e Ɓiyum Iisaa Almasiihu nii.
      sbs: 0.6613
      gen_sec: 11.52
      ref_sec: 10.44
      cer: 0.1983
      wer: 0.9655
    bible_00093:
      source: bible
      text: Fay so yettugol maa ngol ana wooɗi sanne, ngol nafataa joomum.
      sbs: 0.6689
      gen_sec: 6.0
      ref_sec: 4.0
      cer: 0.06
      wer: 0.2727
    bible_00094:
      source: bible
      text: 'Ɓii Neɗɗo oo duu warii ana ɲaama, ana yara, yimɓe mbii ɗum: «Ɲaamde e yarde tan woni e hakkille
        mum, o giɗo duwaaɲeen e luuttooɓe hono mumen!'
      sbs: 0.7244
      gen_sec: 11.04
      ref_sec: 8.66
      cer: 0.2936
      wer: 0.963
    bible_00095:
      source: bible
      text: ɗe podannoo-mi Daawuuda ɗee.
      sbs: 0.735
      gen_sec: 2.08
      ref_sec: 3.36
      cer: 0.3913
      wer: 1.25
    bible_00096:
      source: bible
      text: Jooni kaa, o waddii fay Yunaninkooɓe e ley Suudu Dewal Mawndu nduu.
      sbs: 0.6982
      gen_sec: 5.52
      ref_sec: 4.48
      cer: 0.1481
      wer: 0.6667
    bible_00097:
      source: bible
      text: Jamaa garnooɗo ƴeewde oo fuu, nde yiinoo ko waɗi koo ndee, wirfitii terɗe mum ana mbaati.
      sbs: 0.6419
      gen_sec: 8.96
      ref_sec: 6.8
      cer: 0.3239
      wer: 1.0
    bible_00098:
      source: bible
      text: O ɓattii Pool, o yamiri Pool nanngee, o wii haɓɓiree calali ɗiɗi, o lamndii kaɲum yo homo
        e koɗum waɗi?
      sbs: 0.6434
      gen_sec: 7.44
      ref_sec: 6.98
      cer: 0.3
      wer: 1.0
    bible_00099:
      source: bible
      text: Hirudus yiɗi warde mo kaa suusaano yimɓe ɓee, sabi ɓe fuu eɓe njogorinoo Yaayaa yo annabaajo.
      sbs: 0.6306
      gen_sec: 8.4
      ref_sec: 7.68
      cer: 0.3947
      wer: 0.9375
    bible_00100:
      source: bible
      text: 'E junngo am jaati mbinndiran-mi ngoo ɗoo jowtaango: miin Pool miɗo jowta on.'
      sbs: 0.6706
      gen_sec: 5.76
      ref_sec: 6.24
      cer: 0.3443
      wer: 1.0
    bible_00101:
      source: bible
      text: Gaɗoowo ko boni fuu, heɓan mbarjaari golle mum bonɗo oo, sabi Laamɗo ɓurdintaa yimɓe.
      sbs: 0.6834
      gen_sec: 7.04
      ref_sec: 7.72
      cer: 0.1739
      wer: 1.0714
    bible_00102:
      source: bible
      text: Kaa jaɓɓiiɓe mo so ngoonɗini mo ɓee, o hokkii ɗumen baawɗe laataade ɓiɓɓe Laamɗo.
      sbs: 0.7024
      gen_sec: 5.68
      ref_sec: 4.68
      cer: 0.1212
      wer: 0.5
    bible_00103:
      source: bible
      text: Nde ɓeen ƴeewi kabaaru am ndee, njiɗiino yoppude kam, sabi ɓe tawaali e am fay daliili gooto
        kaanɗo warde kam.
      sbs: 0.6126
      gen_sec: 9.28
      ref_sec: 6.6
      cer: 0.1932
      wer: 0.8
    bible_00104:
      source: bible
      text: So non, pati haaɗu e koyɗe am tan, lootu juuɗe am e hoore am duu.
      sbs: 0.6568
      gen_sec: 5.68
      ref_sec: 5.44
      cer: 0.125
      wer: 0.4667
    bible_00105:
      source: bible
      text: Mi winndanii on haala majjum no raɓɓiɗiri, so on njanngii ɗum on anndan no paamir-mi sirri
        haala Almasiihu oo.
      sbs: 0.6784
      gen_sec: 7.92
      ref_sec: 9.76
      cer: 0.1236
      wer: 0.4737
    bible_00106:
      source: bible
      text: Laatee yurmotooɓe, no Baabiraaɗo mon oo laatorii jurmotooɗo nii.
      sbs: 0.6357
      gen_sec: 4.48
      ref_sec: 3.8
      cer: 0.4444
      wer: 1.0
    bible_00107:
      source: bible
      text: Eɗen anndi en keɓii ko nduwi-ɗen koo, nde wonnoo eɗen anndi omo jaabanoo en duwaawu men.
      sbs: 0.6947
      gen_sec: 5.12
      ref_sec: 5.24
      cer: 0.3714
      wer: 1.1875
    bible_00108:
      source: bible
      text: Omo yeewaa on fuu, kasen o wemmbanooma sanne ko nan-ɗon o sellaano koo.
      sbs: 0.6943
      gen_sec: 5.12
      ref_sec: 5.94
      cer: 0.0714
      wer: 0.3846
    bible_00109:
      source: bible
      text: O tawi ɗon dooyoore, yimɓe ana mboya, ana conkina semmbe.
      sbs: 0.688
      gen_sec: 5.12
      ref_sec: 4.28
      cer: 0.1778
      wer: 0.7
    bible_00110:
      source: bible
      text: O tilaaki haalde, faa Yahuuda, gooto e sappo e ɗiɗon ɓee, yottii ana wondi e yimɓe heewɓe
        jogiiɓe kaafaaje e cabbi.
      sbs: 0.6734
      gen_sec: 10.4
      ref_sec: 8.7
      cer: 0.2527
      wer: 1.1429
    bible_00111:
      source: bible
      text: Heewɓe e yimɓe leydi ndii njehi Urusaliima faa cenna koe mumen gila iidi oo yottaaki.
      sbs: 0.6779
      gen_sec: 6.32
      ref_sec: 5.18
      cer: 0.2429
      wer: 0.9333
    bible_00112:
      source: bible
      text: Yamiroore makko yo goonɗinde Iisaa Almasiihu Ɓiyiiko oo, kaɲum e yiɗondirde hono no o yamiri
        en nii.
      sbs: 0.6812
      gen_sec: 6.08
      ref_sec: 6.22
      cer: 0.2561
      wer: 1.0588
    bible_00113:
      source: bible
      text: Haaltude ko Laamɗo loowi e men koo ana timma, ɗemɗe ana timma, anndal ana timma.
      sbs: 0.7154
      gen_sec: 5.68
      ref_sec: 5.6
      cer: 0.1746
      wer: 0.6667
    bible_00114:
      source: bible
      text: 'Iisaa jokkini hen, wii: —Oɗon njoppa jamirooje Laamɗo ɗee, oɗon njokka neesuuji yimɓe ɗii.'
      sbs: 0.7077
      gen_sec: 5.92
      ref_sec: 5.58
      cer: 0.2361
      wer: 1.1429
    bible_00115:
      source: bible
      text: Nden ngol ƴoɲɲugol cakitiingol ɓuran aranndeewol ngol bonde.
      sbs: 0.7006
      gen_sec: 7.2
      ref_sec: 4.14
      cer: 0.1538
      wer: 0.5
    bible_00116:
      source: bible
      text: 'Ɓe njaabii, ɓe mbii: —Won wiyooɓe a Yaayaa mo lootogal batisima, won wiyooɓe a annabi Iliyaasa,
        won wiyooɓe kasen a annabi Yeremiya naa gooto e annabaaɓe ɓee.'
      sbs: 0.7234
      gen_sec: 13.44
      ref_sec: 11.04
      cer: 0.1984
      wer: 0.963
    bible_00117:
      source: bible
      text: Naɓuɓe mo ɓee naataali huɓeere ndee, sabi so ɓe naatii nde, ɓe coɓan, ɓe ɲaamataa ndeendi
        iidi Paska ndii.
      sbs: 0.7065
      gen_sec: 9.44
      ref_sec: 6.6
      cer: 0.2143
      wer: 1.1579
    bible_00118:
      source: bible
      text: So luurral waɗii hakkunde mon, hono joomumen cuusirta wullitaade ooɲiiɓe ɓee njoppa fooccitiiɓe
        ɓee?
      sbs: 0.6723
      gen_sec: 6.88
      ref_sec: 6.98
      cer: 0.2118
      wer: 1.0714
    bible_00119:
      source: bible
      text: Engol tinndina yimɓe aduna moƴƴina tooru nanndundu e taktakol barminiranoongol kaafaawi faa
        hosi waatude kaa ana wuuri ngol.
      sbs: 0.6551
      gen_sec: 9.68
      ref_sec: 8.14
      cer: 0.1792
      wer: 0.9444
    bible_00120:
      source: bible
      text: 'Iisaa jaabii mo: —So neɗɗo ana yiɗi kam, jokkan konngol am, Baabiraaɗo am yiɗan ɗum.'
      sbs: 0.6831
      gen_sec: 9.04
      ref_sec: 5.98
      cer: 0.5077
      wer: 0.9333
    bible_00121:
      source: bible
      text: Kaa jooni, e haɓɓagol mooɗon e Iisaa Almasiihu, onon woɗɗunooɓe arannde ɓee on ɓattiniraama
        saabe ƴiiƴam makko ɗam.
      sbs: 0.6848
      gen_sec: 8.4
      ref_sec: 8.0
      cer: 0.0947
      wer: 0.3889
    bible_00122:
      source: bible
      text: Kaa onon, oɗon anndi mo sabi omo wondi e mon, omo e mon.
      sbs: 0.6744
      gen_sec: 5.28
      ref_sec: 3.7
      cer: 0.1463
      wer: 1.0
    bible_00123:
      source: bible
      text: —So ɓooyii seeɗa, on njiyataa kam, so ɓooyii seeɗa kasen, njiyon kam.
      sbs: 0.713
      gen_sec: 6.96
      ref_sec: 4.54
      cer: 0.3019
      wer: 1.25
    bible_00124:
      source: bible
      text: faa terɗe am duu mbaaltoo dow jikke.
      sbs: 0.6696
      gen_sec: 3.2
      ref_sec: 3.06
      cer: 0.4483
      wer: 0.8571
    bible_00125:
      source: bible
      text: Ruuhu Ceniiɗo, Balloowo on mo Baabiraaɗo neldirta on saabe am oo, kaɲum anndinta on kulle
        fuu.
      sbs: 0.6654
      gen_sec: 8.56
      ref_sec: 5.82
      cer: 0.3289
      wer: 1.4375
    bible_00126:
      source: bible
      text: Mi torrii ɓe cili keewɗi e cuuɗi baajorɗi ɗii fuu, mi tilsinii ɓe mbonkoo Joomiraaɗo.
      sbs: 0.6566
      gen_sec: 8.16
      ref_sec: 5.3
      cer: 0.3043
      wer: 0.9333
    bible_00127:
      source: bible
      text: So ɗum waɗii, wanaa ɓe ɗiɗon fuu, ɓe caaman ley ngaykaare naa?
      sbs: 0.6724
      gen_sec: 5.76
      ref_sec: 3.9
      cer: 0.3125
      wer: 1.1667
    bible_00128:
      source: bible
      text: Ɲaagee Laamɗo yalla miɗo waajoroo oon goonga tedduɗo no haaniri nii.
      sbs: 0.6983
      gen_sec: 4.32
      ref_sec: 4.86
      cer: 0.2982
      wer: 1.0909
    bible_00129:
      source: bible
      text: «Anndal» nee waddan mawninkinaare, jilli ngoni ko naɓata deental goonɗinɓe ngal yeeso.
      sbs: 0.6505
      gen_sec: 5.12
      ref_sec: 5.48
      cer: 0.2535
      wer: 1.3333
    bible_00130:
      source: bible
      text: Caggal ɗeen balɗe, min lanndinii, min ŋabbiti Urusaliima.
      sbs: 0.6888
      gen_sec: 4.64
      ref_sec: 3.44
      cer: 0.4468
      wer: 1.75
    bible_00131:
      source: bible
      text: Yahuudiyankooɓe goonɗinɓe wardunooɓe e Piyeer ɓee fuu kaaynaa, no dokkal Ruuhu Ceniiɗo ngal
        saakorii e yimɓe ɓe nganaa Yahuudiyankooɓe nii.
      sbs: 0.6919
      gen_sec: 10.4
      ref_sec: 10.2
      cer: 0.2288
      wer: 1.1
    bible_00132:
      source: bible
      text: 'Eɓe nanndi e sukaaɓe jooɗiiɓe e luumooji, ɓee ɗoo ana mbiya ɓee too: «Min piyanii on cereeli.'
      sbs: 0.6121
      gen_sec: 9.28
      ref_sec: 5.9
      cer: 0.5479
      wer: 1.2941
    bible_00133:
      source: bible
      text: No Iisaa selliniri gorko paho mo haala mum laaɓaa.
      sbs: 0.6024
      gen_sec: 3.36
      ref_sec: 8.92
      cer: 0.2927
      wer: 0.7778
    bible_00134:
      source: bible
      text: 'Iisaa jaabii ɓe: —Wakkati mo Laamɗo hollata teddeengal Ɓii Neɗɗo oo yottike.'
      sbs: 0.6976
      gen_sec: 5.84
      ref_sec: 4.78
      cer: 0.1613
      wer: 0.4167
    bible_00135:
      source: bible
      text: Kaa o darii omo tewta memɗo mo oo.
      sbs: 0.6907
      gen_sec: 2.32
      ref_sec: 3.22
      cer: 0.3462
      wer: 1.0
    bible_00136:
      source: bible
      text: Wakkati fuu omo soobii e duwaawu saabe mooɗon yalla oɗon ɲiiɓa e ley kiɓɓal, timminon muuyɗe
        Laamɗo fuu.
      sbs: 0.6258
      gen_sec: 8.4
      ref_sec: 6.9
      cer: 0.3176
      wer: 0.9444
    bible_00137:
      source: bible
      text: Oo kabaaru saakii e leydi Yahuudiya e seraaji mum fuu.
      sbs: 0.6552
      gen_sec: 4.32
      ref_sec: 3.72
      cer: 0.1818
      wer: 0.9
    bible_00138:
      source: bible
      text: Ɓiraaɗam ndokku-mi on, wanaa ɲaamdu tekkundu, sabi on mbaawanaano ndu.
      sbs: 0.6886
      gen_sec: 5.92
      ref_sec: 5.12
      cer: 0.0702
      wer: 0.5
    bible_00139:
      source: bible
      text: 'Iisaa jaabii mo: —So wanaa Laamɗo hokku maa baawɗe, a waawaano e am fay huunde.'
      sbs: 0.6898
      gen_sec: 5.2
      ref_sec: 5.44
      cer: 0.2295
      wer: 0.8
    bible_00140:
      source: bible
      text: 'Piyeer haali, tekkini, wii: —Fay so tilsi mi maaydan e maa, abada mi wiyataa mi anndaa ma.'
      sbs: 0.6752
      gen_sec: 7.92
      ref_sec: 6.46
      cer: 0.1618
      wer: 0.9412
    bible_00141:
      source: bible
      text: Oon hokkata terɗe ɗee fuu ko kaajaa, hawrintinira ɗe jokkolɗe e ɗaɗi.
      sbs: 0.652
      gen_sec: 6.4
      ref_sec: 4.96
      cer: 0.375
      wer: 1.25
    bible_00142:
      source: bible
      text: 'Caggal ɗum, Iisaa yottodii e maɓɓe nokku biyeteeɗo Gecemane, wii ɓe: —Njooɗee ɗoo, faa mi
        waɗoya too duwaawu.'
      sbs: 0.6679
      gen_sec: 11.76
      ref_sec: 8.6
      cer: 0.2209
      wer: 1.0556
    bible_00143:
      source: bible
      text: Aawdi ndi aaw-ɗaa fuu, sinaa waata so fuɗa.
      sbs: 0.6978
      gen_sec: 2.88
      ref_sec: 3.24
      cer: 0.2424
      wer: 1.375
    bible_00144:
      source: bible
      text: Nde kiikiiɗe alan warnoo ndee, taalibaaɓe Iisaa coki baafal dow hoore mumen nokku ɗo ɓe kawriti
        ɗoo, saabe kulol hooreeɓe Yahuudiyankooɓe.
      sbs: 0.7015
      gen_sec: 11.6
      ref_sec: 8.22
      cer: 0.2
      wer: 1.3333
    bible_00145:
      source: bible
      text: Pati ndurdon nde tilsere, ndurdon nde ɓernde laaɓunde no Laamɗo yiɗiri nii.
      sbs: 0.5623
      gen_sec: 7.2
      ref_sec: 5.04
      cer: 0.5645
      wer: 0.9167
    bible_00146:
      source: bible
      text: Iisaa e hoore mum ana anndi to Laamɗo iwri to Laamɗo hootata.
      sbs: 0.6701
      gen_sec: 4.32
      ref_sec: 3.4
      cer: 0.1224
      wer: 0.3333
    bible_00147:
      source: bible
      text: 'O jaabii, o wii: —Miin woni «ooynotooɗo ley ladde jeereende so ana wiya: moƴƴintinee laawol
        Joomiraaɗo», hono no annabi Esaaya wiiri nii.'
      sbs: 0.7074
      gen_sec: 10.16
      ref_sec: 10.82
      cer: 0.1204
      wer: 0.4091
    bible_00148:
      source: bible
      text: Taalibaaɓe ɗiɗon ɓee nani ko o haali koo, njokkitii Iisaa.
      sbs: 0.6397
      gen_sec: 4.8
      ref_sec: 3.26
      cer: 0.3191
      wer: 1.0
    bible_00149:
      source: bible
      text: Ngel welan e hunduko maa no njuumri nii, kaa ngel wulnan reedu maa taw.
      sbs: 0.6144
      gen_sec: 6.4
      ref_sec: 3.58
      cer: 0.1964
      wer: 0.8571
    bible_00150:
      source: bible
      text: Nde o hokkitirnoo hoore makko ndee, nden o wurjini kokowol palaangol ngol, ɗum woni o ittii
        ngaɲaandi hakkunde leɲi ɗii.
      sbs: 0.7007
      gen_sec: 8.32
      ref_sec: 8.08
      cer: 0.0714
      wer: 0.2
    bible_00151:
      source: bible
      text: Joomiraaɗo ana ɓanngina baawɗe mum e makko, omo sellina ɲawuuji.
      sbs: 0.656
      gen_sec: 4.8
      ref_sec: 3.66
      cer: 0.3208
      wer: 0.8
    bible_00152:
      source: bible
      text: Ngol hokkaa baawɗe laamaade suudu baaba fuu e jaaleɲol fuu e ɗemngal fuu e leɲol fuu.
      sbs: 0.6943
      gen_sec: 6.88
      ref_sec: 6.38
      cer: 0.2464
      wer: 0.75
    bible_00153:
      source: bible
      text: Ɗum waddani mo laataade curoowo hakkunde yimɓe e Laamɗo ley aadi keyri ndii, yalla noddaaɓe
        ɓee ana keɓa ndonu keddotooɗo faa abada mo Laamɗo fodi oo.
      sbs: 0.6993
      gen_sec: 10.24
      ref_sec: 11.82
      cer: 0.2602
      wer: 1.5769
    bible_00154:
      source: bible
      text: laatiinde haayre ɓurnde fuu teentilaade e maadi ndii.
      sbs: 0.7054
      gen_sec: 2.4
      ref_sec: 3.82
      cer: 0.4889
      wer: 1.125
    bible_00155:
      source: bible
      text: '» Kaa Iisaa wiyaali mo maayataa, ko o wii dee: «So miɗo muuyani mo nguurndam faa nde ngartu-mi,
        koɗum hillu maa hen?'
      sbs: 0.6294
      gen_sec: 27.68
      ref_sec: 14.36
      cer: 0.75
      wer: 1.9048
    bible_00156:
      source: bible
      text: Kaa kammari Yahuudiyankooɓe ɓee caliima mi yoppitee, ɗum waddani kam ɲaagaade sariya am ɓettinee
        naɓee to kaananke Roma mawɗo oo, tawee mi happaali leɲol am ngol fay huunde.
      sbs: 0.6446
      gen_sec: 13.6
      ref_sec: 10.62
      cer: 0.1958
      wer: 1.1071
    bible_00157:
      source: bible
      text: 'Iisaa wii ɓe: —Kakkilee, ndeentee e ƴuufinirdi Farisaen e Sadukien ndii.'
      sbs: 0.6664
      gen_sec: 8.16
      ref_sec: 5.0
      cer: 0.2069
      wer: 0.6364
    bible_00158:
      source: bible
      text: sabi omo ɲaamo am, pati mi yeryerta.
      sbs: 0.7202
      gen_sec: 3.52
      ref_sec: 3.22
      cer: 0.1786
      wer: 0.5714
    bible_00159:
      source: bible
      text: Mo seyɗaani mum ribbaa oo, ndaardi Iisaa acca o jokka e mum.
      sbs: 0.6826
      gen_sec: 4.72
      ref_sec: 3.88
      cer: 0.2553
      wer: 1.1667
    bible_00160:
      source: bible
      text: Nde Pool tilinoo haalde ɗum ndee, kaɲum e maɓɓe fuu ɓe ndiccii, ɓe nduwii.
      sbs: 0.6926
      gen_sec: 6.08
      ref_sec: 4.66
      cer: 0.4483
      wer: 1.0
    bible_00161:
      source: bible
      text: Ɓe njokkitii mo, ɓe miili o woyoyan dow yanaande too.
      sbs: 0.7299
      gen_sec: 3.76
      ref_sec: 3.12
      cer: 0.0476
      wer: 0.5
    bible_00162:
      source: bible
      text: Waajuuji ɗi mbaajii-mi on ɗii fuu, mi waajortaako ɗi hiini hoore am.
      sbs: 0.678
      gen_sec: 5.36
      ref_sec: 4.02
      cer: 0.1481
      wer: 0.6667
    bible_00163:
      source: bible
      text: Sabi heewɓe laatike konneeen leggal bardugal Iisaa Almasiihu.
      sbs: 0.6983
      gen_sec: 4.96
      ref_sec: 3.72
      cer: 0.2075
      wer: 1.625
    bible_00164:
      source: bible
      text: —Sakiraaɓe e baabiraaɓe, kettinee jooni faa mi fammina on mi waɗaali ko boni.
      sbs: 0.6883
      gen_sec: 5.52
      ref_sec: 4.76
      cer: 0.1613
      wer: 1.0
    bible_00165:
      source: bible
      text: Ruuhu oo duu hollata ɗum, sabi Ruuhu oo woni goonga.
      sbs: 0.5176
      gen_sec: 13.76
      ref_sec: 3.22
      cer: 2.9024
      wer: 4.5
    bible_00166:
      source: bible
      text: Pool ana yiɗi naatude hakkunde jamaa oo, kaa taalibaaɓe ɓee kaɗi mo ɗum.
      sbs: 0.6238
      gen_sec: 5.44
      ref_sec: 3.86
      cer: 0.3448
      wer: 1.0
    bible_00167:
      source: bible
      text: Nasuuna ɓii Aminadaabu, Aminadaabu ɓii Adamin.
      sbs: 0.6712
      gen_sec: 5.04
      ref_sec: 3.94
      cer: 0.359
      wer: 1.0
    bible_00168:
      source: bible
      text: Nde taalibaaɓe ɓee lummbata weendu nduu ndee, njeggiti yooɓaade ɲaamdu.
      sbs: 0.6432
      gen_sec: 5.36
      ref_sec: 4.36
      cer: 0.35
      wer: 1.4
    bible_00169:
      source: bible
      text: Kasen duu so ɓerɗe men pelii en, en mbaaltinan ɗe yeeso Laamɗo, sabi Laamɗo ɓuri ɗe manngu,
        kanko woni annduɗo huunde fuu.
      sbs: 0.6215
      gen_sec: 11.36
      ref_sec: 7.6
      cer: 0.2474
      wer: 0.7273
    bible_00170:
      source: bible
      text: 'O jaabii, o wii: —Miin woni kanko.'
      sbs: 0.7447
      gen_sec: 2.96
      ref_sec: 3.0
      cer: 0.0833
      wer: 0.7143
    bible_00171:
      source: bible
      text: Kaa ɓe ɓeydii wullude gullaali mawɗi, eɓe mbiya o tontee.
      sbs: 0.6385
      gen_sec: 5.84
      ref_sec: 3.7
      cer: 0.2826
      wer: 1.1
    bible_00172:
      source: bible
      text: Ɗee kulle fuu e yuɓɓondirde hono nii, yottinooɓe sadaka ɓee ɲannde fuu ana naata ana njalta
        to suudu aranndeeru too faa ngolla golle mumen dewal Laamɗo.
      sbs: 0.6131
      gen_sec: 30.0
      ref_sec: 11.28
      cer: 1.072
      wer: 2.8462
    bible_00173:
      source: bible
      text: 'Taalibaaɓe makko ɓee lamndii mo: —Koɗum ngol banndol firritata?'
      sbs: 0.6786
      gen_sec: 3.84
      ref_sec: 4.46
      cer: 0.1923
      wer: 0.6667
    bible_00174:
      source: bible
      text: So ɗum waɗii, joomum bonnan kesal ngal, tawee fetalaare ittaande hen ndee yaadataa e kiinngal
        ngal.
      sbs: 0.6201
      gen_sec: 7.04
      ref_sec: 3.54
      cer: 0.3086
      wer: 1.375
    bible_00175:
      source: bible
      text: Awooɓe yaltuɓe e majji ɓee, ana lalla bubbi mumen.
      sbs: 0.7097
      gen_sec: 3.44
      ref_sec: 3.32
      cer: 0.325
      wer: 1.5556
    bible_00176:
      source: bible
      text: Nde Apollos wonnoo Korintu ndee, Pool jokki laawol haayre, yehi Efeesu.
      sbs: 0.6913
      gen_sec: 6.48
      ref_sec: 5.86
      cer: 0.1897
      wer: 1.0
    bible_00177:
      source: bible
      text: Sabi Ɓii Neɗɗo oo wardan e malaaikaen mum e ley teddeengal Baabiraaɗo mum.
      sbs: 0.6029
      gen_sec: 7.44
      ref_sec: 3.86
      cer: 0.2459
      wer: 1.0
    bible_00178:
      source: bible
      text: Min nanii haala makko, min njiirii mo gite amen, min taykike mo, min memirii mo juuɗe amen.
      sbs: 0.6316
      gen_sec: 7.28
      ref_sec: 6.5
      cer: 0.2535
      wer: 0.8235
    bible_00179:
      source: bible
      text: Nde ɓe tewti faa ɓe mbara Pool ndee, tawi hooreejo sordaasien oo humpitike Urusaliima fuu
        ana darorii koyngal gootal.
      sbs: 0.63
      gen_sec: 8.56
      ref_sec: 6.56
      cer: 0.2784
