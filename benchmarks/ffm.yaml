      gen_sec: 6.16
      ref_sec: 3.44
      cer: 0.22
      wer: 0.7778
    bible_00018:
      source: bible
      text: 'Nde Iisaa nani kaa haala ndee, haaynaa e hooreejo sordaasien oo, yeeƴii yimɓe jokkuɓe e mum
