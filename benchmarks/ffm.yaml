    bible_00050:
      source: bible
      text: Kasen duu, Baabiraaɗo nelɗo kam oo hoore seettantoo kam.
      sbs: 0.6704
      gen_sec: 3.09
      ref_sec: 3.48
      cer: 0.0435
      wer: 0.2222
    bible_00051:
      source: bible
      text: O darni koyngal makko ɲaamal dow geeci, o darni nanal dow njoorndi, o eewnii daande toownde
        no rawaandu ladde uggirta nii.
      sbs: 0.6454
      gen_sec: 7.42
      ref_sec: 8.72
      cer: 0.2323
      wer: 0.619
    bible_00052:
      source: bible
      text: Sabi ɗum gasataa no kasunke neldirtee kaananke mawɗo oo tawee ko nanngiraa koo hollitaaka
        faa laaɓa.
      sbs: 0.6494
      gen_sec: 6.12
      ref_sec: 9.66
      cer: 0.0952
      wer: 0.4375
    bible_00053:
      source: bible
      text: Publiyus, hooreejo ruunde ndee oo, ngesa muuɗum ana e sera nokkuure ndee.
      sbs: 0.6577
      gen_sec: 4.56
      ref_sec: 5.22
      cer: 0.1017
      wer: 0.5
    bible_00054:
      source: bible
      text: Yoga e hooreeɓe leydi Asiya, yiɓɓe makko, neli e makko ana ndaarda mo pati o naata boowal
        too.
      sbs: 0.6531
      gen_sec: 5.14
      ref_sec: 6.1
      cer: 0.0541
      wer: 0.2222
    bible_00055:
      source: bible
      text: Nde wonnoo jaangol ana heewi, gollooɓe e doomooɓe kuɓɓiino yiite ana ƴuwloo.
      sbs: 0.5903
      gen_sec: 4.88
      ref_sec: 4.7
      cer: 1.0
      wer: 1.0
    bible_00056:
      source: bible
      text: 'Iisaa yeeccitii, yii eɓe njokki e mum, wii ɓe: —Koɗum tewtaton?'
      sbs: 0.6177
      gen_sec: 3.92
      ref_sec: 4.14
      cer: 1.0
      wer: 1.0
    bible_00057:
      source: bible
      text: Yahuuda nanngu lonngere ndee tan, yalti oon wakkati fuu.
      sbs: 0.5273
      gen_sec: 3.64
      ref_sec: 3.06
      cer: 1.0
      wer: 1.0
    bible_00058:
      source: bible
      text: 'Annii ko mbiyan-mi felooɓe kam ɓee: min kaandaa e heɓude ɲaamdu e yardu e ley golle amen
        naa?'
      sbs: 0.5969
      gen_sec: 5.72
      ref_sec: 5.88
      cer: 1.0
      wer: 1.0
    bible_00059:
      source: bible
      text: Ɗum hawri e wakkati lanndinal Yahuudiyankooɓe, tawi yanaande ndee ana ɓadii, ɗum waɗi so ɓe
        ndesi Iisaa ɗon.
      sbs: 0.6869
      gen_sec: 6.56
      ref_sec: 8.26
      cer: 0.125
      wer: 0.3333
    bible_00060:
      source: bible
      text: O yii malaaikaen ɗiɗon ɓe kaddule daneeje ana njooɗii ɗo tew Iisaa oo resanoo ɗoo, gooto ɗo
        hoore ɗoo, goɗɗo oo to koyɗe too.
      sbs: 0.6581
      gen_sec: 7.24
      ref_sec: 8.62
      cer: 0.0404
      wer: 0.1667
    bible_00061:
      source: bible
      text: No Joomiraaɗo yaaforii on nii, njaafondiron.
      sbs: 0.6713
      gen_sec: 0.8
      ref_sec: 3.3
      cer: 1.0
      wer: 1.0
    bible_00062:
      source: bible
      text: Eka ɲeɲaa ɲeɲugol Tooruuji Puneeji.
      sbs: 0.6677
      gen_sec: 2.26
      ref_sec: 3.46
      cer: 0.2667
      wer: 1.6
    bible_00063:
      source: bible
      text: Debbo oo dogi yehi ley ladde, nokku ɗo Laamɗo moƴƴinannoo ɗum.
      sbs: 0.6778
      gen_sec: 3.92
      ref_sec: 3.82
      cer: 1.0
      wer: 1.0
    bible_00064:
      source: bible
      text: Oɗon noddira kam «Moobbo» oɗon noddira kam «Kalfaaɗo».
      sbs: 0.6606
      gen_sec: 3.06
      ref_sec: 4.18
      cer: 0.119
      wer: 0.875
    bible_00065:
      source: bible
      text: 'Kaa nde wonnoo omo anndi miilooji maɓɓe, o wii mo junngo mum waati oo: —Imma, dara hakkunde
        yimɓe!'
      sbs: 0.6431
      gen_sec: 5.53
      ref_sec: 5.94
      cer: 0.0526
      wer: 0.2222
    bible_00066:
      source: bible
      text: O haalanaa inna makko e miɲiraaɓe makko ana ndarii sella ana njiɗi yiide mo.
      sbs: 0.6445
      gen_sec: 4.5
      ref_sec: 4.04
      cer: 0.0484
      wer: 0.1429
    bible_00067:
      source: bible
      text: 'Nden binndoowo ngalluure ndee deƴƴini jamaa oo, wii: —Onon Efeesunkooɓe, homo woni mo anndaa
        ngalluure Efeesu ndee woni hayboore rewrudu Artemis deweteeɗo mawɗo oo, kaɲum e natal muuɗum iwrungal
        dow kammu ngal?'
      sbs: 0.6123
      gen_sec: 12.87
      ref_sec: 14.76
      cer: 0.0751
      wer: 0.5312
    bible_00068:
      source: bible
      text: Balɗe seeɗa caggal muuɗum, Agirippa kaananke oo e Barniki ngari Kaysariya jowtude Festus.
      sbs: 0.6308
      gen_sec: 5.44
      ref_sec: 7.32
      cer: 0.0933
      wer: 0.4615
    bible_00069:
      source: bible
      text: Nden moƴƴere o hokki en saabe Ɓiyiiko korsuɗo oo.
      sbs: 0.6503
      gen_sec: 2.88
      ref_sec: 3.5
      cer: 0.125
      wer: 0.5556
    bible_00070:
      source: bible
      text: 'Sabi nii Binndi ɗii mbiiri: «Homo anndi anniya Joomiraaɗo oo?'
      sbs: 0.6735
      gen_sec: 3.24
      ref_sec: 4.2
      cer: 0.0
      wer: 0.0
    bible_00071:
      source: bible
      text: Tama on anndaa daɗondirteeɓe ɓee fuu yo dogooɓe, kaa gooto tan heɓata deesewal?
      sbs: 0.6794
      gen_sec: 4.27
      ref_sec: 5.62
      cer: 0.0
      wer: 0.0
    bible_00072:
      source: bible
      text: Njoɓdi am, ɗum woni seyo am ko mbaajotoo-mi Kabaaru Lobbo meere meere koo, tawti e ko mi lamndataako
        ko waajotooɓe Kabaaru Lobbo oo ɓee poti heɓude.
      sbs: 0.6382
      gen_sec: 8.77
      ref_sec: 11.84
      cer: 0.0336
      wer: 0.1154
    bible_00073:
      source: bible
      text: Tama on anndaa halfinaaɓe golle ittirde sadaka ɓee ana keɓa ngeɗu mumen e mayre?
      sbs: 0.6601
      gen_sec: 4.41
      ref_sec: 5.56
      cer: 0.0455
      wer: 0.2143
    bible_00074:
      source: bible
      text: Iisaa yalti ana roondii leggal mum bardugal faa yottii nokku biyeteeɗo Laalagal Hoore .
      sbs: 0.7135
      gen_sec: 4.61
      ref_sec: 5.08
      cer: 0.0411
      wer: 0.2308
    bible_00075:
      source: bible
      text: Yimɓe wonɓe e aduna oo ɓee fuu cujidanan taktakol ngol, ɗum woni neɗɗo fuu mo innde mum tawaaka
        ana winndii gila e diidugol aduna oo e ley dewtere nguurndam ndee, dewtere Njawdiri kirsanoondi
        ndii.
      sbs: 0.6326
      gen_sec: 11.5
      ref_sec: 12.02
      cer: 0.0497
      wer: 0.2353
    bible_00076:
      source: bible
      text: Sawru naa jilli e newaare?
      sbs: 0.6638
      gen_sec: 2.04
      ref_sec: 4.46
      cer: 0.0476
      wer: 0.2
    bible_00077:
      source: bible
      text: 'Nde ɓadinoo weetude ndee, Pool ndaardi ɓe fuu ɓe ɲaama, wii: —Hannde woni balɗe sappo e nay
        oɗon kettii on ɲaamaali fay huunde.'
      sbs: 0.6317
      gen_sec: 7.27
      ref_sec: 9.46
      cer: 0.09
      wer: 0.4348
    bible_00078:
      source: bible
      text: Sinndo mi gollaalino ɗii golleeji ɗi fay gooto meeɗaali gollude yeeso maɓɓe, ɓe ɲiŋataakeno.
      sbs: 0.6662
      gen_sec: 5.56
      ref_sec: 5.16
      cer: 0.0779
      wer: 0.2857
    bible_00079:
      source: bible
      text: Sakiraaɓe am horsuɓe, pati torra ittoowa koro mon naawnoowa hono no yiite nii haayno on, hono
        no huunde nde haanaa wardi e mon nii.
      sbs: 0.6016
      gen_sec: 7.63
      ref_sec: 10.94
      cer: 0.0667
      wer: 0.25
    bible_00080:
      source: bible
      text: Ɗum metti ɓe sanne, hedde eɓe piya dabare no ɓe kaani waɗude Iisaa.
      sbs: 0.6547
      gen_sec: 3.82
      ref_sec: 3.56
      cer: 0.0377
      wer: 0.3077
    bible_00081:
      source: bible
      text: Hono non Yaakuuba e Yuhanna ɓiɓɓe Jebede reentuɓe e Simon ɓee duu kaayniraa.
      sbs: 0.6303
      gen_sec: 4.24
      ref_sec: 7.18
      cer: 0.1429
      wer: 0.4615
    bible_00082:
      source: bible
      text: Durooɓe ɓee ndogi njantanoyii ngeenndi ndii e seraaji mum ko hewtii ɗumen koo.
      sbs: 0.6488
      gen_sec: 4.6
      ref_sec: 4.68
      cer: 0.0615
      wer: 0.3846
    bible_00083:
      source: bible
      text: Daande nde nan-mi ndee ana wai no dillere fiyooɓe kolli mumen nii.
      sbs: 0.6628
      gen_sec: 4.16
      ref_sec: 3.74
      cer: 0.0943
      wer: 0.5833
    bible_00084:
      source: bible
      text: Piyeer sunaa sabi jooni woni cilol tataɓol ko Iisaa wii mo «Aɗa yiɗi kam naa?
      sbs: 0.6354
      gen_sec: 4.42
      ref_sec: 5.26
      cer: 0.1639
      wer: 0.6
    bible_00085:
      source: bible
      text: Faa hiiri, gorko arsukunte jeyaaɗo Arimatiya wari.
      sbs: 0.6519
      gen_sec: 2.9
      ref_sec: 3.96
      cer: 0.0714
      wer: 0.2857
    bible_00086:
      source: bible
      text: Nde weetunoo ndee, ɓe coynii leydi, kaa ɓe annditaali ndi.
      sbs: 0.7093
      gen_sec: 3.68
      ref_sec: 4.14
      cer: 1.0
      wer: 1.0
    bible_00087:
      source: bible
      text: Aleksandere huncani ɓe junngo faa jinngana yimɓe muuɗum ɓee.
      sbs: 0.6592
      gen_sec: 3.34
      ref_sec: 3.34
      cer: 0.0588
      wer: 0.3333
    bible_00088:
      source: bible
      text: 'Piyeer wii mo: —Kalfaaɗo, mi lanndinike naɓdeede e maa kasu e wardeede e maa!'
      sbs: 0.6442
      gen_sec: 4.36
      ref_sec: 6.06
      cer: 0.0167
      wer: 0.2143
    bible_00089:
      source: bible
      text: Saruku ɓii Ragawu, Ragawu ɓii Faleka.
      sbs: 0.5867
      gen_sec: 2.44
      ref_sec: 3.52
      cer: 1.0
      wer: 1.0
    bible_00090:
      source: bible
      text: 'O jaabii: —Goonga, Moobbo, aɗa anndi miɗo yiɗu maa.'
      sbs: 0.5433
      gen_sec: 3.16
      ref_sec: 4.26
      cer: 1.0
      wer: 1.0
    bible_00091:
      source: bible
      text: Kaa laatike tilsere ngolliran-moo-mi, mo golle mo kalfinaa-mi.
      sbs: 0.5787
      gen_sec: 4.0
      ref_sec: 4.06
      cer: 1.0
      wer: 1.0
    bible_00092:
      source: bible
      text: Ndennoo, ko min njii e ko min nani min kaalanta on onon duu, yalla oɗon ndeentira e amen hono
        no min ndeentiri e Baabiraaɗo e Ɓiyum Iisaa Almasiihu nii.
      sbs: 0.652
      gen_sec: 8.84
      ref_sec: 10.44
      cer: 0.0331
      wer: 0.1379
    bible_00093:
      source: bible
      text: Fay so yettugol maa ngol ana wooɗi sanne, ngol nafataa joomum.
      sbs: 0.5417
      gen_sec: 3.92
      ref_sec: 4.0
      cer: 1.0
      wer: 1.0
    bible_00094:
      source: bible
      text: 'Ɓii Neɗɗo oo duu warii ana ɲaama, ana yara, yimɓe mbii ɗum: «Ɲaamde e yarde tan woni e hakkille
        mum, o giɗo duwaaɲeen e luuttooɓe hono mumen!'
      sbs: 0.6434
      gen_sec: 8.08
      ref_sec: 8.66
      cer: 0.156
      wer: 0.3704
    bible_00095:
      source: bible
      text: ɗe podannoo-mi Daawuuda ɗee.
      sbs: 0.6924
      gen_sec: 2.08
      ref_sec: 3.36
      cer: 1.0
      wer: 1.0
    bible_00096:
      source: bible
      text: Jooni kaa, o waddii fay Yunaninkooɓe e ley Suudu Dewal Mawndu nduu.
      sbs: 0.5173
      gen_sec: 4.24
      ref_sec: 4.48
      cer: 1.0
      wer: 1.0
    bible_00097:
      source: bible
      text: Jamaa garnooɗo ƴeewde oo fuu, nde yiinoo ko waɗi koo ndee, wirfitii terɗe mum ana mbaati.
      sbs: 0.6336
      gen_sec: 5.47
      ref_sec: 6.8
      cer: 0.1549
      wer: 0.5625
    bible_00098:
      source: bible
      text: O ɓattii Pool, o yamiri Pool nanngee, o wii haɓɓiree calali ɗiɗi, o lamndii kaɲum yo homo
        e koɗum waɗi?
      sbs: 0.6273
      gen_sec: 5.8
      ref_sec: 6.98
      cer: 0.2125
      wer: 0.5
    bible_00099:
      source: bible
      text: Hirudus yiɗi warde mo kaa suusaano yimɓe ɓee, sabi ɓe fuu eɓe njogorinoo Yaayaa yo annabaajo.
      sbs: 0.6375
      gen_sec: 5.72
      ref_sec: 7.68
      cer: 0.1184
      wer: 0.5
    bible_00100:
      source: bible
      text: 'E junngo am jaati mbinndiran-mi ngoo ɗoo jowtaango: miin Pool miɗo jowta on.'
      sbs: 0.6575
      gen_sec: 4.46
      ref_sec: 6.24
      cer: 0.0492
      wer: 0.3077
    bible_00101:
      source: bible
      text: Gaɗoowo ko boni fuu, heɓan mbarjaari golle mum bonɗo oo, sabi Laamɗo ɓurdintaa yimɓe.
      sbs: 0.6484
      gen_sec: 5.32
      ref_sec: 7.72
      cer: 0.029
      wer: 0.1429
    bible_00102:
      source: bible
      text: Kaa jaɓɓiiɓe mo so ngoonɗini mo ɓee, o hokkii ɗumen baawɗe laataade ɓiɓɓe Laamɗo.
      sbs: 0.6585
      gen_sec: 4.64
      ref_sec: 4.68
      cer: 0.0152
      wer: 0.0714
    bible_00103:
      source: bible
      text: Nde ɓeen ƴeewi kabaaru am ndee, njiɗiino yoppude kam, sabi ɓe tawaali e am fay daliili gooto
        kaanɗo warde kam.
      sbs: 0.6438
      gen_sec: 6.44
      ref_sec: 6.6
      cer: 0.1023
      wer: 0.45
    bible_00104:
      source: bible
      text: So non, pati haaɗu e koyɗe am tan, lootu juuɗe am e hoore am duu.
      sbs: 0.6287
      gen_sec: 3.75
      ref_sec: 5.44
      cer: 0.0625
      wer: 0.2
    bible_00105:
      source: bible
      text: Mi winndanii on haala majjum no raɓɓiɗiri, so on njanngii ɗum on anndan no paamir-mi sirri
        haala Almasiihu oo.
      sbs: 0.631
      gen_sec: 6.38
      ref_sec: 9.76
      cer: 0.1236
      wer: 0.4737
    bible_00106:
      source: bible
      text: Laatee yurmotooɓe, no Baabiraaɗo mon oo laatorii jurmotooɗo nii.
      sbs: 0.6841
      gen_sec: 4.2
      ref_sec: 3.8
      cer: 1.0
      wer: 1.0
    bible_00107:
      source: bible
      text: Eɗen anndi en keɓii ko nduwi-ɗen koo, nde wonnoo eɗen anndi omo jaabanoo en duwaawu men.
      sbs: 0.6834
      gen_sec: 5.11
      ref_sec: 5.24
      cer: 0.0571
      wer: 0.25
    bible_00108:
      source: bible
      text: Omo yeewaa on fuu, kasen o wemmbanooma sanne ko nan-ɗon o sellaano koo.
      sbs: 0.6657
      gen_sec: 4.0
      ref_sec: 5.94
      cer: 0.0536
      wer: 0.2308
    bible_00109:
      source: bible
      text: O tawi ɗon dooyoore, yimɓe ana mboya, ana conkina semmbe.
      sbs: 0.6816
      gen_sec: 3.6
      ref_sec: 4.28
      cer: 1.0
      wer: 1.0
    bible_00110:
      source: bible
      text: O tilaaki haalde, faa Yahuuda, gooto e sappo e ɗiɗon ɓee, yottii ana wondi e yimɓe heewɓe
        jogiiɓe kaafaaje e cabbi.
      sbs: 0.6373
      gen_sec: 6.54
      ref_sec: 8.7
      cer: 0.1099
      wer: 0.3333
    bible_00111:
      source: bible
      text: Heewɓe e yimɓe leydi ndii njehi Urusaliima faa cenna koe mumen gila iidi oo yottaaki.
      sbs: 0.6776
      gen_sec: 4.79
      ref_sec: 5.18
      cer: 0.0857
      wer: 0.2
    bible_00112:
      source: bible
      text: Yamiroore makko yo goonɗinde Iisaa Almasiihu Ɓiyiiko oo, kaɲum e yiɗondirde hono no o yamiri
        en nii.
      sbs: 0.6408
      gen_sec: 5.56
      ref_sec: 6.22
      cer: 0.1951
      wer: 0.5294
    bible_00113:
      source: bible
      text: Haaltude ko Laamɗo loowi e men koo ana timma, ɗemɗe ana timma, anndal ana timma.
      sbs: 0.6365
      gen_sec: 4.61
      ref_sec: 5.6
      cer: 0.0794
      wer: 0.3333
    bible_00114:
      source: bible
      text: 'Iisaa jokkini hen, wii: —Oɗon njoppa jamirooje Laamɗo ɗee, oɗon njokka neesuuji yimɓe ɗii.'
      sbs: 0.6203
      gen_sec: 5.36
      ref_sec: 5.58
      cer: 1.1667
      wer: 1.6429
    bible_00115:
      source: bible
      text: Nden ngol ƴoɲɲugol cakitiingol ɓuran aranndeewol ngol bonde.
      sbs: 0.6833
      gen_sec: 3.69
      ref_sec: 4.14
      cer: 0.0769
      wer: 0.375
    bible_00116:
      source: bible
      text: 'Ɓe njaabii, ɓe mbii: —Won wiyooɓe a Yaayaa mo lootogal batisima, won wiyooɓe a annabi Iliyaasa,
        won wiyooɓe kasen a annabi Yeremiya naa gooto e annabaaɓe ɓee.'
      sbs: 0.6585
      gen_sec: 9.07
      ref_sec: 11.04
      cer: 0.127
      wer: 0.5185
    bible_00117:
      source: bible
      text: Naɓuɓe mo ɓee naataali huɓeere ndee, sabi so ɓe naatii nde, ɓe coɓan, ɓe ɲaamataa ndeendi
        iidi Paska ndii.
      sbs: 0.6312
      gen_sec: 6.13
      ref_sec: 6.6
      cer: 0.25
      wer: 0.7895
    bible_00118:
      source: bible
      text: So luurral waɗii hakkunde mon, hono joomumen cuusirta wullitaade ooɲiiɓe ɓee njoppa fooccitiiɓe
        ɓee?
      sbs: 0.644
      gen_sec: 5.98
      ref_sec: 6.98
      cer: 0.0706
      wer: 0.5
    bible_00119:
      source: bible
      text: Engol tinndina yimɓe aduna moƴƴina tooru nanndundu e taktakol barminiranoongol kaafaawi faa
        hosi waatude kaa ana wuuri ngol.
      sbs: 0.4198
      gen_sec: 7.57
      ref_sec: 8.14
      cer: 1.0
      wer: 1.1111
    bible_00120:
      source: bible
      text: 'Iisaa jaabii mo: —So neɗɗo ana yiɗi kam, jokkan konngol am, Baabiraaɗo am yiɗan ɗum.'
      sbs: 0.6829
      gen_sec: 4.93
      ref_sec: 5.98
      cer: 0.0154
      wer: 0.0667
    bible_00121:
      source: bible
      text: Kaa jooni, e haɓɓagol mooɗon e Iisaa Almasiihu, onon woɗɗunooɓe arannde ɓee on ɓattiniraama
        saabe ƴiiƴam makko ɗam.
      sbs: 0.656
      gen_sec: 6.86
      ref_sec: 8.0
      cer: 0.0526
      wer: 0.2778
    bible_00122:
      source: bible
      text: Kaa onon, oɗon anndi mo sabi omo wondi e mon, omo e mon.
      sbs: 0.6707
      gen_sec: 3.36
      ref_sec: 3.7
      cer: 1.0
      wer: 1.0
    bible_00123:
      source: bible
      text: —So ɓooyii seeɗa, on njiyataa kam, so ɓooyii seeɗa kasen, njiyon kam.
      sbs: 0.6916
      gen_sec: 3.86
      ref_sec: 4.54
      cer: 0.1132
      wer: 0.6667
    bible_00124:
      source: bible
      text: faa terɗe am duu mbaaltoo dow jikke.
      sbs: 0.6581
      gen_sec: 2.12
      ref_sec: 3.06
      cer: 0.0345
      wer: 0.1429
    bible_00125:
      source: bible
      text: Ruuhu Ceniiɗo, Balloowo on mo Baabiraaɗo neldirta on saabe am oo, kaɲum anndinta on kulle
        fuu.
      sbs: 0.6791
      gen_sec: 5.32
      ref_sec: 5.82
      cer: 0.1053
      wer: 0.3125
    bible_00126:
      source: bible
      text: Mi torrii ɓe cili keewɗi e cuuɗi baajorɗi ɗii fuu, mi tilsinii ɓe mbonkoo Joomiraaɗo.
      sbs: 0.6673
      gen_sec: 4.87
      ref_sec: 5.3
      cer: 0.029
      wer: 0.1333
    bible_00127:
      source: bible
      text: So ɗum waɗii, wanaa ɓe ɗiɗon fuu, ɓe caaman ley ngaykaare naa?
      sbs: 0.6962
      gen_sec: 3.27
      ref_sec: 3.9
      cer: 0.1042
      wer: 0.3333
    bible_00128:
      source: bible
      text: Ɲaagee Laamɗo yalla miɗo waajoroo oon goonga tedduɗo no haaniri nii.
      sbs: 0.6975
      gen_sec: 3.98
      ref_sec: 4.86
      cer: 0.1228
      wer: 0.4545
    bible_00129:
      source: bible
      text: «Anndal» nee waddan mawninkinaare, jilli ngoni ko naɓata deental goonɗinɓe ngal yeeso.
      sbs: 0.6552
      gen_sec: 5.13
      ref_sec: 5.48
      cer: 0.0141
      wer: 0.0833
    bible_00130:
      source: bible
      text: Caggal ɗeen balɗe, min lanndinii, min ŋabbiti Urusaliima.
      sbs: 0.6215
      gen_sec: 3.26
      ref_sec: 3.44
      cer: 0.1489
      wer: 0.5
    bible_00131:
      source: bible
      text: Yahuudiyankooɓe goonɗinɓe wardunooɓe e Piyeer ɓee fuu kaaynaa, no dokkal Ruuhu Ceniiɗo ngal
        saakorii e yimɓe ɓe nganaa Yahuudiyankooɓe nii.
      sbs: 0.6601
      gen_sec: 8.26
      ref_sec: 10.2
      cer: 0.1525
      wer: 0.6
    bible_00132:
      source: bible
      text: 'Eɓe nanndi e sukaaɓe jooɗiiɓe e luumooji, ɓee ɗoo ana mbiya ɓee too: «Min piyanii on cereeli.'
      sbs: 0.6823
      gen_sec: 5.42
      ref_sec: 5.9
      cer: 0.1233
      wer: 0.7059
    bible_00133:
      source: bible
      text: No Iisaa selliniri gorko paho mo haala mum laaɓaa.
      sbs: 0.6503
      gen_sec: 3.24
      ref_sec: 8.92
      cer: 1.0
      wer: 1.0
    bible_00134:
      source: bible
      text: 'Iisaa jaabii ɓe: —Wakkati mo Laamɗo hollata teddeengal Ɓii Neɗɗo oo yottike.'
      sbs: 0.6708
      gen_sec: 4.75
      ref_sec: 4.78
      cer: 0.0323
      wer: 0.1667
    bible_00135:
      source: bible
      text: Kaa o darii omo tewta memɗo mo oo.
      sbs: 0.6719
      gen_sec: 2.16
      ref_sec: 3.22
      cer: 1.0
      wer: 1.0
    bible_00136:
      source: bible
      text: Wakkati fuu omo soobii e duwaawu saabe mooɗon yalla oɗon ɲiiɓa e ley kiɓɓal, timminon muuyɗe
        Laamɗo fuu.
      sbs: 0.6481
      gen_sec: 6.11
      ref_sec: 6.9
      cer: 0.0588
      wer: 0.3889
    bible_00137:
      source: bible
      text: Oo kabaaru saakii e leydi Yahuudiya e seraaji mum fuu.
      sbs: 0.6871
      gen_sec: 2.61
      ref_sec: 3.72
      cer: 0.2727
      wer: 1.0
    bible_00138:
      source: bible
      text: Ɓiraaɗam ndokku-mi on, wanaa ɲaamdu tekkundu, sabi on mbaawanaano ndu.
      sbs: 0.6582
      gen_sec: 4.37
      ref_sec: 5.12
      cer: 0.1053
      wer: 0.5
    bible_00139:
      source: bible
      text: 'Iisaa jaabii mo: —So wanaa Laamɗo hokku maa baawɗe, a waawaano e am fay huunde.'
      sbs: 0.6606
      gen_sec: 4.35
      ref_sec: 5.44
      cer: 0.2459
      wer: 0.6667
    bible_00140:
      source: bible
      text: 'Piyeer haali, tekkini, wii: —Fay so tilsi mi maaydan e maa, abada mi wiyataa mi anndaa ma.'
      sbs: 0.5864
      gen_sec: 4.97
      ref_sec: 6.46
      cer: 1.0
      wer: 1.0
    bible_00141:
      source: bible
      text: Oon hokkata terɗe ɗee fuu ko kaajaa, hawrintinira ɗe jokkolɗe e ɗaɗi.
      sbs: 0.6644
      gen_sec: 3.95
      ref_sec: 4.96
      cer: 0.1071
      wer: 0.3333
    bible_00142:
      source: bible
      text: 'Caggal ɗum, Iisaa yottodii e maɓɓe nokku biyeteeɗo Gecemane, wii ɓe: —Njooɗee ɗoo, faa mi
        waɗoya too duwaawu.'
      sbs: 0.6446
      gen_sec: 6.33
      ref_sec: 8.6
      cer: 0.0465
      wer: 0.2778
    bible_00143:
      source: bible
      text: Aawdi ndi aaw-ɗaa fuu, sinaa waata so fuɗa.
      sbs: 0.6822
      gen_sec: 2.07
      ref_sec: 3.24
      cer: 0.2121
      wer: 0.625
    bible_00144:
      source: bible
      text: Nde kiikiiɗe alan warnoo ndee, taalibaaɓe Iisaa coki baafal dow hoore mumen nokku ɗo ɓe kawriti
        ɗoo, saabe kulol hooreeɓe Yahuudiyankooɓe.
      sbs: 0.6319
      gen_sec: 8.55
      ref_sec: 8.22
      cer: 0.0783
      wer: 0.5238
    bible_00145:
      source: bible
      text: Pati ndurdon nde tilsere, ndurdon nde ɓernde laaɓunde no Laamɗo yiɗiri nii.
      sbs: 0.6184
      gen_sec: 4.32
      ref_sec: 5.04
      cer: 0.0968
      wer: 0.3333
    bible_00146:
      source: bible
      text: Iisaa e hoore mum ana anndi to Laamɗo iwri to Laamɗo hootata.
      sbs: 0.6393
      gen_sec: 3.4
      ref_sec: 3.4
      cer: 0.0816
      wer: 0.25
    bible_00147:
      source: bible
      text: 'O jaabii, o wii: —Miin woni «ooynotooɗo ley ladde jeereende so ana wiya: moƴƴintinee laawol
        Joomiraaɗo», hono no annabi Esaaya wiiri nii.'
      sbs: 0.6367
      gen_sec: 7.79
      ref_sec: 10.82
      cer: 0.0463
      wer: 0.1818
    bible_00148:
      source: bible
      text: Taalibaaɓe ɗiɗon ɓee nani ko o haali koo, njokkitii Iisaa.
      sbs: 0.6663
      gen_sec: 3.67
      ref_sec: 3.26
      cer: 0.1064
      wer: 0.4
    bible_00149:
      source: bible
      text: Ngel welan e hunduko maa no njuumri nii, kaa ngel wulnan reedu maa taw.
      sbs: 0.6339
      gen_sec: 4.4
      ref_sec: 3.58
      cer: 1.0
      wer: 1.0
    bible_00150:
      source: bible
      text: Nde o hokkitirnoo hoore makko ndee, nden o wurjini kokowol palaangol ngol, ɗum woni o ittii
        ngaɲaandi hakkunde leɲi ɗii.
      sbs: 0.6645
      gen_sec: 7.03
      ref_sec: 8.08
      cer: 0.0714
      wer: 0.25
    bible_00151:
      source: bible
      text: Joomiraaɗo ana ɓanngina baawɗe mum e makko, omo sellina ɲawuuji.
      sbs: 0.6783
      gen_sec: 3.76
      ref_sec: 3.66
      cer: 0.0566
      wer: 0.2
    bible_00152:
      source: bible
      text: Ngol hokkaa baawɗe laamaade suudu baaba fuu e jaaleɲol fuu e ɗemngal fuu e leɲol fuu.
      sbs: 0.673
      gen_sec: 4.9
      ref_sec: 6.38
      cer: 0.1304
      wer: 0.5
    bible_00153:
      source: bible
      text: Ɗum waddani mo laataade curoowo hakkunde yimɓe e Laamɗo ley aadi keyri ndii, yalla noddaaɓe
        ɓee ana keɓa ndonu keddotooɗo faa abada mo Laamɗo fodi oo.
      sbs: 0.6496
      gen_sec: 8.74
      ref_sec: 11.82
      cer: 0.0976
      wer: 0.5
    bible_00154:
      source: bible
      text: laatiinde haayre ɓurnde fuu teentilaade e maadi ndii.
      sbs: 0.6822
      gen_sec: 2.96
      ref_sec: 3.82
      cer: 0.0444
      wer: 0.25
    bible_00155:
      source: bible
      text: '» Kaa Iisaa wiyaali mo maayataa, ko o wii dee: «So miɗo muuyani mo nguurndam faa nde ngartu-mi,
        koɗum hillu maa hen?'
      sbs: 0.6493
      gen_sec: 6.68
      ref_sec: 14.36
      cer: 0.125
      wer: 0.6667
    bible_00156:
      source: bible
      text: Kaa kammari Yahuudiyankooɓe ɓee caliima mi yoppitee, ɗum waddani kam ɲaagaade sariya am ɓettinee
        naɓee to kaananke Roma mawɗo oo, tawee mi happaali leɲol am ngol fay huunde.
      sbs: 0.6501
      gen_sec: 10.51
      ref_sec: 10.62
      cer: 0.0699
      wer: 0.3214
    bible_00157:
      source: bible
      text: 'Iisaa wii ɓe: —Kakkilee, ndeentee e ƴuufinirdi Farisaen e Sadukien ndii.'
      sbs: 0.6759
      gen_sec: 4.13
      ref_sec: 5.0
      cer: 0.1552
      wer: 0.7273
    bible_00158:
      source: bible
      text: sabi omo ɲaamo am, pati mi yeryerta.
      sbs: 0.6241
      gen_sec: 2.32
      ref_sec: 3.22
      cer: 1.0
      wer: 1.0
    bible_00159:
      source: bible
      text: Mo seyɗaani mum ribbaa oo, ndaardi Iisaa acca o jokka e mum.
      sbs: 0.6502
      gen_sec: 0.42
      ref_sec: 3.88
      cer: 1.0
      wer: 1.0
    bible_00160:
      source: bible
      text: Nde Pool tilinoo haalde ɗum ndee, kaɲum e maɓɓe fuu ɓe ndiccii, ɓe nduwii.
      sbs: 0.6156
      gen_sec: 4.6
      ref_sec: 4.66
      cer: 1.0
      wer: 1.0
    bible_00161:
      source: bible
      text: Ɓe njokkitii mo, ɓe miili o woyoyan dow yanaande too.
      sbs: 0.6872
      gen_sec: 3.16
      ref_sec: 3.12
      cer: 0.0714
      wer: 0.2
    bible_00162:
      source: bible
      text: Waajuuji ɗi mbaajii-mi on ɗii fuu, mi waajortaako ɗi hiini hoore am.
      sbs: 0.6888
      gen_sec: 4.24
      ref_sec: 4.02
      cer: 0.1852
      wer: 0.5833
    bible_00163:
      source: bible
      text: Sabi heewɓe laatike konneeen leggal bardugal Iisaa Almasiihu.
      sbs: 0.6742
      gen_sec: 3.91
      ref_sec: 3.72
      cer: 0.0566
      wer: 0.375
    bible_00164:
      source: bible
      text: —Sakiraaɓe e baabiraaɓe, kettinee jooni faa mi fammina on mi waɗaali ko boni.
      sbs: 0.6383
      gen_sec: 4.84
      ref_sec: 4.76
      cer: 0.0
      wer: 0.0
    bible_00165:
      source: bible
      text: Ruuhu oo duu hollata ɗum, sabi Ruuhu oo woni goonga.
      sbs: 0.6397
      gen_sec: 3.12
      ref_sec: 3.22
      cer: 0.1707
      wer: 0.6
    bible_00166:
      source: bible
      text: Pool ana yiɗi naatude hakkunde jamaa oo, kaa taalibaaɓe ɓee kaɗi mo ɗum.
      sbs: 0.5863
      gen_sec: 4.52
      ref_sec: 3.86
      cer: 0.9138
      wer: 1.0
    bible_00167:
      source: bible
      text: Nasuuna ɓii Aminadaabu, Aminadaabu ɓii Adamin.
      sbs: 0.625
      gen_sec: 3.08
      ref_sec: 3.94
      cer: 1.0
      wer: 1.0
    bible_00168:
      source: bible
      text: Nde taalibaaɓe ɓee lummbata weendu nduu ndee, njeggiti yooɓaade ɲaamdu.
      sbs: 0.6543
      gen_sec: 4.26
      ref_sec: 4.36
      cer: 0.15
      wer: 0.8
    bible_00169:
      source: bible
      text: Kasen duu so ɓerɗe men pelii en, en mbaaltinan ɗe yeeso Laamɗo, sabi Laamɗo ɓuri ɗe manngu,
        kanko woni annduɗo huunde fuu.
      sbs: 0.6472
      gen_sec: 6.93
      ref_sec: 7.6
      cer: 0.0515
      wer: 0.1818
    bible_00170:
      source: bible
      text: 'O jaabii, o wii: —Miin woni kanko.'
      sbs: 0.6313
      gen_sec: 2.16
      ref_sec: 3.0
      cer: 1.0833
      wer: 1.0
    bible_00171:
      source: bible
      text: Kaa ɓe ɓeydii wullude gullaali mawɗi, eɓe mbiya o tontee.
      sbs: 0.6841
      gen_sec: 2.97
      ref_sec: 3.7
      cer: 0.0652
      wer: 0.2
    bible_00172:
      source: bible
      text: Ɗee kulle fuu e yuɓɓondirde hono nii, yottinooɓe sadaka ɓee ɲannde fuu ana naata ana njalta
        to suudu aranndeeru too faa ngolla golle mumen dewal Laamɗo.
      sbs: 0.6451
      gen_sec: 8.81
      ref_sec: 11.28
      cer: 0.104
      wer: 0.5
    bible_00173:
      source: bible
      text: 'Taalibaaɓe makko ɓee lamndii mo: —Koɗum ngol banndol firritata?'
      sbs: 0.6408
      gen_sec: 3.53
      ref_sec: 4.46
      cer: 0.0962
      wer: 0.4444
    bible_00174:
      source: bible
      text: So ɗum waɗii, joomum bonnan kesal ngal, tawee fetalaare ittaande hen ndee yaadataa e kiinngal
        ngal.
      sbs: 0.5717
      gen_sec: 5.6
      ref_sec: 3.54
      cer: 0.0741
      wer: 0.3125
    bible_00175:
      source: bible
      text: Awooɓe yaltuɓe e majji ɓee, ana lalla bubbi mumen.
      sbs: 0.7206
      gen_sec: 2.6
      ref_sec: 3.32
      cer: 0.0
      wer: 0.2222
    bible_00176:
      source: bible
      text: Nde Apollos wonnoo Korintu ndee, Pool jokki laawol haayre, yehi Efeesu.
      sbs: 0.6692
      gen_sec: 3.84
      ref_sec: 5.86
      cer: 0.3621
      wer: 1.0
    bible_00177:
      source: bible
      text: Sabi Ɓii Neɗɗo oo wardan e malaaikaen mum e ley teddeengal Baabiraaɗo mum.
      sbs: 0.6702
      gen_sec: 4.35
      ref_sec: 3.86
      cer: 0.0328
      wer: 0.1538
    bible_00178:
      source: bible
      text: Min nanii haala makko, min njiirii mo gite amen, min taykike mo, min memirii mo juuɗe amen.
      sbs: 0.5069
      gen_sec: 5.6
      ref_sec: 6.5
      cer: 1.9718
      wer: 1.4118
    bible_00179:
      source: bible
      text: Nde ɓe tewti faa ɓe mbara Pool ndee, tawi hooreejo sordaasien oo humpitike Urusaliima fuu
        ana darorii koyngal gootal.
      sbs: 0.6381
      gen_sec: 7.28
      ref_sec: 6.56
      cer: 0.1031
      wer: 0.5263
    bible_00180:
      source: bible
      text: So oɗon miiloo huunde wonnde, Laamɗo ɓannginanan on ɗum.
      sbs: 0.6198
      gen_sec: 3.64
      ref_sec: 3.7
      cer: 1.0
      wer: 1.0
    bible_00181:
      source: bible
      text: Kaa saakinooɓe ɓee naati e yiilaade ana mbaajoo Kabaaru Lobbo oo.
      sbs: 0.6872
      gen_sec: 3.85
      ref_sec: 3.64
      cer: 0.0556
      wer: 0.4545
    bible_00182:
      source: bible
      text: 'Ɓe mbii: —En kaajaaka seedee hankasen, nde wonnoo o haaldii hunduko makko, en fuu en nanii!'
      sbs: 0.6021
      gen_sec: 5.08
      ref_sec: 8.04
      cer: 0.0704
      wer: 0.5
    bible_00183:
      source: bible
      text: Hono non, onon duu, so on njottinirii kabaaru oo ɗemɗe Ruuhu tawa ko famminii fuu walaa hen,
        hono paamirte-ɗon?
      sbs: 0.667
      gen_sec: 6.35
      ref_sec: 8.06
      cer: 0.1136
      wer: 0.5263
    bible_00184:
      source: bible
      text: Kaa miin, mi jataaki nguurndam am e maayde am fuu so mi heɓii yottinirde golle mo Iisaa Joomiraaɗo
        halfini kam oo seyo.
      sbs: 0.6406
      gen_sec: 6.92
      ref_sec: 7.86
      cer: 0.0312
      wer: 0.1818
    bible_00185:
      source: bible
      text: Saabe ɗum, sakiraaɓe am horsuɓe, ngoɗɗee dewal tooruuji.
      sbs: 0.638
      gen_sec: 3.19
      ref_sec: 3.72
      cer: 0.0435
      wer: 0.125
    bible_00186:
      source: bible
      text: 'Ɓe ndarii eɓe ngullanoo mo, eɓe mbiya: —Min tawii oo ana jirkita leɲol amen, ana haɗa ɗum
        yoɓude kaananke Roma oo lampo, ana wiya hoore mum yo Almasiihu, ɗum woni kaananke.'
      sbs: 0.6042
      gen_sec: 9.75
      ref_sec: 11.66
      cer: 0.0667
      wer: 0.2903
    bible_00187:
      source: bible
      text: Caggal ɗum, Laamɗo daalii ɓe ley koyɗol pati ɓe mbirfitoo to Hirudus, ɓe kootiri leydi maɓɓe
        laawol gonngol.
      sbs: 0.6521
      gen_sec: 6.42
      ref_sec: 7.34
      cer: 0.0455
      wer: 0.2778
    bible_00188:
      source: bible
      text: E ley ɗum, o daalii ɓe daaloore sattunde pati ɓe kaalana ɗum fay gooto.
      sbs: 0.6394
      gen_sec: 3.84
      ref_sec: 4.4
      cer: 0.0
      wer: 0.1429
    bible_00189:
      source: bible
      text: Ndennoo, koɗum waɗi so oɗon nguurda no jeyaaɓe e oo ɗoo aduna nii?
      sbs: 0.5965
      gen_sec: 4.12
      ref_sec: 4.38
      cer: 1.0
      wer: 1.0
    bible_00190:
      source: bible
      text: Won ko njiɗu-mi yamirde on kasen, haala no kawritirton.
      sbs: 0.6711
      gen_sec: 2.07
      ref_sec: 3.94
      cer: 0.4091
      wer: 0.3333
    bible_00191:
      source: bible
      text: Hono non, tutuɗo oo e jarnuɗo oo fuu nganaa hen fay huunde, Laamɗo mawninoowo oo tan woni
        fuu.
      sbs: 0.6424
      gen_sec: 5.32
      ref_sec: 6.32
      cer: 0.0135
      wer: 0.0556
    bible_00192:
      source: bible
      text: Nden, neɗɗo fuu nodduɗo innde Joomiraaɗo hisinte.
      sbs: 0.6566
      gen_sec: 2.83
      ref_sec: 3.82
      cer: 0.1463
      wer: 1.1429
    bible_00193:
      source: bible
      text: Taƴoral, hakkillaaji mon ana ngonnoo e am, kaa on keɓaali yottinde ballal ngal.
      sbs: 0.6846
      gen_sec: 5.0
      ref_sec: 6.88
      cer: 1.0
      wer: 1.0
