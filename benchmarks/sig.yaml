      cer: 0.069
      wer: 0.24
    bible_00040:
      source: bible
      text: Ɛɛ wɩya, dɩ ámaa rɛ kaŋ kɩdiiliye abee gannɩ, ʋ maga dɩ á leŋ dɩ ba maga ma rɛ.
