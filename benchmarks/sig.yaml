      sbs: 0.6652
      gen_sec: 7.63
      ref_sec: 12.54
      cer: 0.2185
      wer: 0.7576
    bible_00038:
      source: bible
      text: Ɛɛ rɛ Pɔɔl dɩya toluu biibaal mɛ nɩɩ ba aa vʋʋlɩ wɩɩ hʋ. Ɛɛ rɛ ʋ sii mʋ gyʋʋ laalyuwolo dɩɩduwo
        hʋ, a basɩ wɩɩ hʋ tɩya Pɔɔl.
      sbs: 0.662
      gen_sec: 5.93
      ref_sec: 8.2
      cer: 0.1596
      wer: 0.4286
    bible_00039:
      source: bible
      text: Doŋ nɛ á we kyɛyɛ baŋmana, dɩ baal kɩdɩgɩ ba aa yɩrɩ Agabu mɛ lɩɩ Gyudɩya paalʋʋ ko. Ʋ mɛ
        fa yaa Wɩɩsɩ tɩŋdaal lɛ.
      sbs: 0.6864
      gen_sec: 6.5
      ref_sec: 8.6
      cer: 0.1724
      wer: 0.64
    bible_00040:
      source: bible
      text: Ɛɛ wɩya, dɩ ámaa rɛ kaŋ kɩdiiliye abee gannɩ, ʋ maga dɩ á leŋ dɩ ba maga ma rɛ.
      sbs: 0.6627
      gen_sec: 4.64
      ref_sec: 5.86
      cer: 0.1552
      wer: 0.7895
    bible_00041:
      source: bible
      text: Dɩ mamaa rɛ ko mʋ tɔɔ buloŋ, dɩ tɔɔ hʋ nala bɩ tɔgɩmɔ ma, ma piisi ma naasɩ taŋha ta doŋ,
        aŋ lɩɩ tɔɔ hʋ tɩyaŋ. Ɛɛ sɩ leŋ dɩ ba gyɩma anɩɩ ba aa vɩya ma nyɛ, Wɩɩsɩ sɩ dɔgɩsɩ ba.”
      sbs: 0.643
      gen_sec: 9.33
      ref_sec: 12.98
      cer: 0.0465
      wer: 0.3095
    bible_00042:
      source: bible
      text: Á Tɩɩna Yesu Krisita nyubaanɩŋ, ŋ aa sʋl ma, ŋ naabalɩya, ma buloŋ kaŋ nyʋʋdɩgɩ, a ta kɩ porigi
        dɔmɔŋ. Ma kaŋ nyʋʋdɩgɩ abee tɩdɩgɩ wɩɩ buloŋ tɩyaŋ.
      sbs: 0.6174
      gen_sec: 7.72
      ref_sec: 11.4
      cer: 0.1667
      wer: 0.5
    bible_00043:
      source: bible
      text: Ŋ basɩ kɩ tɩya ma rɛ, ma bɩl bɩ sɩ na ŋ, see saŋa hʋ tɩyaŋ ma aa sɩ lɔllɩ ŋ a baa, ‘Nyusʋŋtɩɩna
        rɛ yaa nal hʋ aa ko Wɩɩsɩ feŋ tɩyaŋ.”’
      sbs: 0.6617
      gen_sec: 7.16
      ref_sec: 13.26
      cer: 0.1474
      wer: 0.6667
    bible_00044:
      source: bible
      text: Ba wɩbasɩɩ no ba aa basɩ hʋ nɛ gyɩ leŋ nala hʋ abee ba bee nɩhɩyasɩ buloŋ bɩ gyɩŋ wɩɩ hʋ buloŋ
        ba aa sɩ yaa, aŋ kɩ yaa kyagɩŋsɩ dʋŋ.
      sbs: 0.6102
      gen_sec: 7.76
      ref_sec: 12.3
      cer: 0.28
      wer: 0.7097
    bible_00045:
      source: bible
      text: Amɛ baal hʋ basɩ tɩya ʋ a baa, “Ŋ nɩhɩyawʋ, ŋ bɩ maga dɩ ɩ ko gyʋʋ ŋ dɩya. Ɛɛwɩya ɩ kɛ haa
        suri ɩ nyʋwa dʋŋ a baa dɩ ŋ tʋŋtʋnnɩ hʋ deye, ʋ sɩ deye.
      sbs: 0.6721
      gen_sec: 7.46
      ref_sec: 12.2
      cer: 0.2667
      wer: 0.6486
    bible_00046:
      source: bible
      text: Ba aa nɩɩ dɩ Pɔɔl basɩ wɩya ba tɩɩ taal tɩyaŋ gɛɛ, ba buloŋ yaa fʋɩɩ. Ɛɛ rɛ Pɔɔl basɩ tɩya
        ba a baa,
      sbs: 0.707
      gen_sec: 4.69
      ref_sec: 7.48
      cer: 0.1892
      wer: 0.5417
    bible_00047:
      source: bible
      text: Ɛɛ rɛ ka Yesu basɩ tɩya haaŋ hʋ a baa, “Ŋ kpaa ɩ wɩbɔmɔ kyɛ ɩ rɛ.”
      sbs: 0.6365
      gen_sec: 3.8
      ref_sec: 4.32
      cer: 0.2609
      wer: 0.7647
    bible_00048:
      source: bible
      text: Amɛ kyɛɛ bee ʋ nyʋwa buloŋ, nala aa laa Yesu wɩya di rɛ, baala abee haana buloŋ, a ko kɩ pɛ
        nɩbɩnɩya hʋ tɩyaŋ.
      sbs: 0.6434
      gen_sec: 5.66
      ref_sec: 8.78
      cer: 0.0723
      wer: 0.4583
    bible_00049:
      source: bible
      text: Dɩ nal lɛ aa nyʋwa sɩwiilii, ʋ bɩl bɩ sɩ kɩ kyɛ dɩ ʋ nyʋwa sɩhuwo, beewɩya tɩɩna aa baa dɩ
        sɩwiilii rɛ weliye te sɩhuwo.”
      sbs: 0.6533
      gen_sec: 6.56
      ref_sec: 10.82
      cer: 0.2935
      wer: 0.8462
    bible_00050:
      source: bible
      text: Beewɩya dɩ mamaa rɛ kaŋ gyogiweliye no kɩdɩgɩ buloŋ yʋga, ɛɛ rɛ sɩ leŋ dɩ ma marɩ gyɩŋ á Tɩɩna
        Yesu Krisita weliŋ ka dɩ ma mɩɩbol mɛ kaŋ tɔnɔ.
      sbs: 0.6354
      gen_sec: 7.91
      ref_sec: 10.68
      cer: 0.0631
      wer: 0.4667
    bible_00051:
      source: bible
      text: Ŋ biikpɩyanama, ma ta leŋ dɩ á kaŋ nyʋwa dʋŋ kɩ basɩ anɩɩ á kyo dɔmɔŋ nɛ. Ma leŋ dɩ á kɩ kyiyeli
        dɔmɔŋ wɩtɩɩ tɩyaŋ. Ɛɛ rɛ sɩ daga anɩɩ á kɔnɩ kyo dɔmɔŋ nɛ.
      sbs: 0.6131
      gen_sec: 9.04
      ref_sec: 12.78
      cer: 0.2759
      wer: 0.75
    bible_00052:
      source: bible
      text: Nal hʋ buloŋ ba aa kpaa kɩna we ʋ nosi tɩyaŋ, ʋ maga dɩ ʋ kɩ deŋ ba nyuu abee wɩtɩɩ rɛ.
      sbs: 0.6157
      gen_sec: 3.7
      ref_sec: 6.02
      cer: 0.1875
      wer: 0.7727
    bible_00053:
      source: bible
      text: Ɛɛ rɛ Yesu bɩl maga namaga kɩdɩgɩ tɩya nala hʋ aa pɩyɛsɩ ʋ dee wɩya,
      sbs: 0.5834
      gen_sec: 3.94
      ref_sec: 4.24
      cer: 0.283
      wer: 0.6
    bible_00054:
      source: bible
      text: Ɛɛ rɛ Yesu basɩ tɩya ʋ a baa, “Ŋ toluu, ɩ aa laa ŋ di rɛ tɩŋ ɩ deye. Kɩ mʋ abee laaŋfɩya.”
      sbs: 0.6226
      gen_sec: 4.63
      ref_sec: 7.38
      cer: 0.2258
      wer: 0.7826
    bible_00055:
      source: bible
      text: Ba gyɩ vʋwa ʋ sɩya tɔ rɛ, aŋ aa ŋmaa ʋ, aŋ pɩyɛsɩ ʋ dɩ ʋ daga nal hʋ aa ŋmaa ʋ.
      sbs: 0.6514
      gen_sec: 3.84
      ref_sec: 4.96
      cer: 0.2
      wer: 0.5909
    bible_00056:
      source: bible
      text: Ɛɛ rɛ Yesu pɩyɛsɩ ba a baa, “Ma ha bɩ karɩmɩ wɩɩ hʋ Kuwori Deviti gyɩ aa yaa saŋa hʋ losi
        gyɩ aa kaŋ ʋ bee ʋ hatɩnna?
      sbs: 0.6332
      gen_sec: 5.65
      ref_sec: 9.38
      cer: 0.1839
      wer: 0.5357
    bible_00057:
      source: bible
      text: Kyɛwiyesii hʋ kyɛɛ kɛ buloŋ, ʋ aa mʋ ba wɩɩkyʋwaldɩya rɛ. Ʋ bee Gyuuma abee Giriki tɩmma buloŋ
        kaŋ Wɩɩsɩ wɩya hʋ kɩ kpa dɔmɔŋ. Ʋ aa kɩ lʋga dɩ ba laa Wɩɩsɩ wɩya hʋ di.
      sbs: 0.6753
      gen_sec: 9.06
      ref_sec: 12.68
      cer: 0.2578
      wer: 0.75
    bible_00058:
      source: bible
      text: Ba mɩɩgɩ kaŋ ba mʋ Keenaŋ paalʋʋ, a hogi ba Sɛkɛm tɩyaŋ. Bʋbʋʋbal kɩdɩgɩ rɛ Abɩraham fa yɔbɔ
        Hamɔ nala lee. Doŋ tɩyaŋ nɛ ba hogi ba.
      sbs: 0.6323
      gen_sec: 6.33
      ref_sec: 9.38
      cer: 0.2059
      wer: 0.5556
    bible_00059:
      source: bible
      text: Ɛɛ rɛ Siimɔŋ Piita baa, “Ɩ rɛ yaa Krisita hʋ, Wɩɩsɩ hʋ aa weye biye.”
      sbs: 0.6228
      gen_sec: 3.46
      ref_sec: 5.36
      cer: 0.22
      wer: 0.6667
    bible_00060:
      source: bible
      text: Gyuuma hʋ bee Giriki tɩmma hʋ abee nala hʋ buloŋ aa we Ɛfiso tɩyaŋ aa nɩɩ wɩɩ no, kambɩŋ gyɩ
        gyʋʋ ba buloŋ nɛ. Doŋ tɩyaŋ nɛ ba marɩ kɩ kpa á Tɩɩna Yesu yohuŋ weliŋ.
      sbs: 0.6198
      gen_sec: 8.91
      ref_sec: 11.32
      cer: 0.2381
      wer: 0.6111
    bible_00061:
      source: bible
      text: Ɛɛwɩya, ma ta leŋ dɩ wɩɩ buloŋ wɩya yaa ma kambɩŋ, beewɩya Wɩɩsɩ paalɩ gyɩŋ ma nyupʋna mɛ
        gba nyʋwa rɛ. Wɩɩsɩ lee tɩyaŋ, ma kɩdɩgɩ buloŋ kaŋ tɔnɔ te kokogyamaa rɛ.
      sbs: 0.6199
      gen_sec: 8.23
      ref_sec: 13.2
      cer: 0.0709
      wer: 0.5312
    bible_00062:
      source: bible
      text: Ɛɛ rɛ bee hʋ nala buloŋ laa taawɛɛ, nala hʋ buloŋ sii tɩŋ dɔmɔŋ a kaŋ Pɔɔl tarɩ lɩɩ Wɩɩkyʋwaldɩɩbal
        hʋ tɩyaŋ, aŋ kaŋ dimbeye hʋ tɔ haŋ lagɩlagɩbiye hʋ.
      sbs: 0.6197
      gen_sec: 7.57
      ref_sec: 10.5
      cer: 0.1765
      wer: 0.7
    bible_00063:
      source: bible
      text: Yesu Krisita doho nala rɛ nyɛ. Ʋ naabaa rɛ gyɩ yaa Deviti, Deviti mɛ naabaa yaa Abɩraham.
      sbs: 0.6795
      gen_sec: 5.48
      ref_sec: 6.24
      cer: 0.8143
      wer: 1.0
    bible_00064:
      source: bible
      text: Ŋ fa bɩ gyɩŋ ɛɛ hʋ buloŋ ŋ aa sɩ yaa, a gyɩŋ wɩɩ no naasɩ. Nyɛ rɛ ŋ pɩyɛsɩ Pɔɔl anɩɩ ʋ sɩ
        laa nyʋwa a mʋ Gyerusalɛm dɩ ba di ʋ sarɩya doŋ tɩyaŋ?
      sbs: 0.6543
      gen_sec: 7.75
      ref_sec: 10.36
      cer: 0.2075
      wer: 0.8056
    bible_00065:
      source: bible
      text: Ɛɛ rɛ Yesu yɩrɩ ba, ba guu sii a leŋ ba nɩɩduworiboro hʋ abee ba kuwo buloŋ ta, aŋ tɩŋ Yesu
        hal.
      sbs: 0.6028
      gen_sec: 4.49
      ref_sec: 7.4
      cer: 0.25
      wer: 0.6364
    bible_00066:
      source: bible
      text: ba sɩ na kɩŋ hʋ wɩya Wɩɩsɩ aa wee nyʋwa baa ʋ sɩ kpa tɩya ba.
      sbs: 0.6574
      gen_sec: 2.93
      ref_sec: 3.74
      cer: 0.1111
      wer: 0.5625
    bible_00067:
      source: bible
      text: Á bɩ ko ma lee a kɩ kyɛ dɩ ma tɩɩ koo nal kɩdɩgɩ buloŋ bigisi ma.
      sbs: 0.6087
      gen_sec: 3.15
      ref_sec: 5.1
      cer: 0.1458
      wer: 0.3529
    bible_00068:
      source: bible
      text: Ɛɛ rɛ Yesu yɩrɩ ʋ hatɩnna hʋ buloŋ ko laŋŋɩ, a basɩ tɩya ba a baa, “Na ma gyɩma anɩɩ nala
        hʋ aa bɩ yaa Gyuuma, ba kuworo aa hɔŋ ba nyuu tɩyaŋ nɛ, ba sɩlaala mɛ kaŋ ba kɩ fɩla.
      sbs: 0.6518
      gen_sec: 7.73
      ref_sec: 13.24
      cer: 0.1473
      wer: 0.5854
    bible_00069:
      source: bible
      text: Krisitabiisi aa we Liisira abee Ikoniya buloŋ tɩyaŋ fa aa bigisi Timoti rɛ weliŋ.
      sbs: 0.6525
      gen_sec: 3.91
      ref_sec: 6.86
      cer: 0.2239
      wer: 0.7857
    bible_00070:
      source: bible
      text: Ŋ bɩl bɩ maga dɩ ɩ kana ŋ yaa ɩ biye. Kpa ŋ dɩ ŋ yaa ɩ tʋŋtʋnna hʋ kɩdɩgɩ á tʋma kɩ tɩya ɩ.’
        Ɛɛ rɛ ka ʋ sii kpa kɩ mʋ ʋ kuwo lee.
      sbs: 0.6246
      gen_sec: 1.22
      ref_sec: 10.82
      cer: 0.9444
      wer: 0.9722
    bible_00071:
      source: bible
      text: Wɩɩsɩ aa kaŋ bɔnyɛ beel-ma abee ma aa laa ʋ di wɩya rɛ tɩŋ ʋ laa ma ta, ʋ bɩ kɩɩ nɩɩ ma wɩyaalɩya
        rɛ tɩŋ. Laatayɩ yaa Wɩɩsɩ bɔnyɛ kɩŋ nɛ ʋ kpa tɩya ma.
      sbs: 0.6573
      gen_sec: 7.88
      ref_sec: 12.22
      cer: 0.125
      wer: 0.5556
    bible_00072:
      source: bible
      text: Amɛ ma kɛ gyɩŋ wɩtɩɩ hʋ rɛ, beewɩya Krisita kpa ʋ Wiyesi Welii hʋ we ma tɩyaŋ nɛ.
      sbs: 0.6309
      gen_sec: 4.28
      ref_sec: 6.1
      cer: 0.0968
      wer: 0.4444
    bible_00073:
      source: bible
      text: Ɛɛ rɛ Yesu basɩ tɩya ʋ a baa, “Ɩ kɛ yaa gɛɛ ŋ aa baa ɩ yaa. Nyɛ rɛ sɩ leŋ dɩ á yaa wɩya hʋ
        buloŋ Wɩɩsɩ aa kyɛɛ.” Ɛɛ rɛ Gyɔɔŋ laa nyʋwa, a fo Yesu wɩɩkyʋwalnɩɩ.
      sbs: 0.6468
      gen_sec: 8.07
      ref_sec: 11.62
      cer: 0.2807
      wer: 0.7179
    bible_00074:
      source: bible
      text: Kyɛbee rɛ á naa ɩ dɩ ɩ yaa nɩhʋwal, á kana ɩ weliŋ, koo kyɛbee rɛ á naa ɩ dɩ ɩ kaŋ teŋbil
        á kpa gal laalɩ ɩ?
      sbs: 0.6702
      gen_sec: 5.44
      ref_sec: 9.06
      cer: 0.2949
      wer: 0.75
    bible_00075:
      source: bible
      text: Ɛɛ rɛ Kuwori Hɛrɔtɩ ta ba dɩ ba mʋ Bɛtɩlɛhɛm, aŋ basɩ tɩya ba a baa, “Ma mʋ kyɛ biye hʋ abee
        sɩfɩyasɩ. Ma yaŋ ko na ʋ pɛ, ma leŋ dɩ ŋ mɛ kaŋ duwoso, dɩ ŋ mɛ mʋ kyʋwalɩ ʋ a kpa ʋ gyɩrɩma tɩya
        ʋ.”
      sbs: 0.6376
      gen_sec: 9.08
      ref_sec: 14.9
      cer: 0.1007
      wer: 0.4583
    bible_00076:
      source: bible
      text: Ŋ ha aa we ŋ mɩɩbol tɩyaŋ nyɛ ŋ naa anɩɩ ʋ yaa wɩwelii rɛ dɩ ŋ liisi ma wɩya no dɩ ma ta yeŋŋi
        ba,
      sbs: 0.6158
      gen_sec: 3.82
      ref_sec: 8.16
      cer: 0.2778
      wer: 0.9615
    bible_00077:
      source: bible
      text: Á bɩ sɩ wuwo kyʋwalɩ Wɩɩsɩ teŋ ma wɩya. Á aa kɩ kyʋwalɩ ʋ aŋgyʋwasʋ rɛ weliŋ akuu teŋfɩyɛlʋʋ
        hʋ á aa kana ʋ sɩya tɩyaŋ ma wɩya.
      sbs: 0.7107
      gen_sec: 7.6
      ref_sec: 8.44
      cer: 0.6327
      wer: 0.9286
    bible_00078:
      source: bible
      text: Ʋ aa basɩ gɛɛ ko teŋ, nɩhɩyawʋ hʋ basɩ tɩya bapʋwasɩbiye hʋ baa, “Ta ko basɩ wɩɩ no ɩ aa basɩ
        tɩya ŋ, a tɩya nal buloŋ.” Ɛɛ rɛ ka ʋ ta biye hʋ, ʋ mʋ.
      sbs: 0.6392
      gen_sec: 7.21
      ref_sec: 12.28
      cer: 0.1604
      wer: 0.4722
    bible_00079:
      source: bible
      text: Wɩya no rɛ aa leŋ nal kaŋ bisiŋ. Amɛ dɩ nal bɩ sɔmɔ ʋ noŋ aŋ di kɩna anɩɩ ma naabaala a daga
        gɛɛ, ɛɛ bɩ sɩ wuwo leŋ dɩ ʋ tɩɩna kaŋ bisiŋ.”
      sbs: 0.6276
      gen_sec: 7.02
      ref_sec: 12.24
      cer: 0.2673
      wer: 0.8824
    bible_00080:
      source: bible
      text: Badɔmɔŋ mɛ tele bʋnyɩŋ tɩyaŋ, a nyʋ aŋ sʋba, beewɩya fɩyɛl gyɩ tuwo doŋ.
      sbs: 0.6591
      gen_sec: 3.74
      ref_sec: 6.1
      cer: 0.1071
      wer: 0.6429
    bible_00081:
      source: bible
      text: Dɩ ɩ rɛ tɩŋ dʋnɩya no buloŋ, aŋka dɩ ɩ bɩ sɩ na mɩɩbol hʋ aa bɩ kaŋ tenii, bekiŋ tɔnɔ rɛ ɩ
        na?
      sbs: 0.5906
      gen_sec: 4.61
      ref_sec: 6.2
      cer: 0.2206
      wer: 0.625
    bible_00082:
      source: bible
      text: Ba aa nɩɩ wɩya no, ba bɩl bɩ wuwo basɩ wɩɩ buloŋ. Nyɛ rɛ ba dannɩ Wɩɩsɩ a baa, “Wɩɩsɩ tɩya
        nala mɛ aa bɩ yaa Gyuuma ŋmanɩɩ rɛ dɩ ba mɛ wuwo bɩrɩmɩ lɩɩ ba wɩbɔmɔ tɩyaŋ, aŋ kaŋ mɩɩbol hʋ
        aa bɩ kaŋ tenii.”
      sbs: 0.6746
      gen_sec: 10.65
      ref_sec: 14.0
      cer: 0.0933
      wer: 0.3261
    bible_00083:
      source: bible
      text: “Ŋ biye, ɩ sɩ yaa Wɩɩbal hʋ tɩŋdaal
      sbs: 0.6624
      gen_sec: 2.2
      ref_sec: 3.46
      cer: 0.9231
      wer: 1.375
    bible_00084:
      source: bible
      text: Krisita aa sʋba daagarɩɩ hʋ tɩyaŋ wɩya, ʋ leŋ ba dɔŋdɔŋ hʋ teŋ nɛ. Ʋ aa yaa gɛɛ, ʋ leŋ ba
        buloŋ balɩya tɩŋa ʋ tɩyaŋ nɛ a ko yaa kɩdɩgɩ, aŋ kaŋ ba bee Wɩɩsɩ mɛ we dɔmɔŋ ba yaa sʋma.
      sbs: 0.683
      gen_sec: 9.26
      ref_sec: 13.84
      cer: 0.1194
      wer: 0.4762
    bible_00085:
      source: bible
      text: Beewɩya ba sɩ na gɛɛ ma gyogo aa weliye abee gɛɛ ma aa fá Wɩɩsɩ.
      sbs: 0.644
      gen_sec: 3.3
      ref_sec: 5.0
      cer: 0.0408
      wer: 0.4667
    bible_00086:
      source: bible
      text: Nɩɩfori kɩdɩgɩ rɛ we doŋ ba aa sɩ fo ŋ. Dɩ ba aa rɛ bɩ foo ŋ teŋ, ŋ hakɩla bɩ sɩ pɩŋ lɩdɩgɩ.
      sbs: 0.6688
      gen_sec: 4.8
      ref_sec: 8.68
      cer: 0.1364
      wer: 0.625
    bible_00087:
      source: bible
      text: Ɛɛ rɛ tɩŋ abee ma aa gyɩŋ wɩya no buloŋ a sɩŋ wɩtɩɩ hʋ ba aa daga ma tɩyaŋ weliŋ mɛ, amɛ ŋ
        ha sɩ kɩ liisi ma wɩya no saŋa kɛ buloŋ.
      sbs: 0.6164
      gen_sec: 7.26
      ref_sec: 11.38
      cer: 0.0722
      wer: 0.4242
    bible_00088:
      source: bible
      text: Ɛɛwɩya, nal hʋ aa wuwo kɩ basɩ taakperiye Wiyesi Welii hʋ dee tɩyaŋ, ʋ tɩɩna maga dɩ ʋ sʋla
        Wɩɩsɩ rɛ dɩ ʋ leŋ ʋ wuwo kɩ daga wɩya hʋ ʋ aa basɩ memii.
      sbs: 0.6506
      gen_sec: 7.69
      ref_sec: 10.2
      cer: 0.3186
      wer: 0.7353
    bible_00089:
      source: bible
      text: Ʋ sɩya gyɩ kɩɩ gɛɛ rɛ anɩɩ duwoŋ aa lɩgɩsa, aŋka ʋ gannɩ mɛ pʋrɩsɩ gɛɛ kpil kpil.
      sbs: 0.5867
      gen_sec: 3.99
      ref_sec: 6.32
      cer: 0.1129
      wer: 0.6667
    bible_00090:
      source: bible
      text: Kyɛɛ kɩdɩgɩ wɩɩhaa anɩɩ kerifi boto saŋa, Kɔniiliyo na ʋ duwoso tɩyaŋ dɩ malɩka kɩdɩgɩ ko
        gyʋʋ yɩrɩ ʋ, “Kɔniiliyo.”
      sbs: 0.6343
      gen_sec: 6.79
      ref_sec: 8.56
      cer: 0.2088
      wer: 0.5
    bible_00091:
      source: bible
      text: Ɛɛ rɛ ka nɩgyamaa nɩɩ á Tɩɩna Yesu wɩya haŋ paalʋʋ hʋ tɩyaŋ buloŋ.
      sbs: 0.6342
      gen_sec: 3.28
      ref_sec: 5.1
      cer: 0.2885
      wer: 0.7857
    bible_00092:
      source: bible
      text: Krisita pɛɛ á kɩdɩgɩ buloŋ tɩyaŋ nɛ a kpa ʋ bɔnyɛ kɩna tɩya ma a maga gɛɛ ʋ aa kyo.
      sbs: 0.6478
      gen_sec: 3.79
      ref_sec: 5.28
      cer: 0.127
      wer: 0.45
    bible_00093:
      source: bible
      text: Yesu aa basɩ gɛɛ ko teŋ, Wɩɩsɩ kpa ʋ kaŋ gyɩŋ wɩɩsɩbee, ka ʋ kpambɩsɩ hʋ sɩŋ wil nyuni kɩ
        deŋ wɩɩsɩnyuu. Nyɛ rɛ taal ko tɔ ʋ, ba bɩl bɩ na ʋ.
      sbs: 0.6419
      gen_sec: 8.11
      ref_sec: 10.28
      cer: 0.1538
      wer: 0.6061
    bible_00094:
      source: bible
      text: Ɛɛ rɛ Yesu bɩl sii doŋ a kpa tɩŋ Galili fuwo hʋ dɩɩlaŋ kɩ mʋ, a mʋ gyɩŋ hɔŋ dogimo kɩdɩgɩ
        nyuu tɩyaŋ.
      sbs: 0.6115
      gen_sec: 5.6
      ref_sec: 8.38
      cer: 0.3896
      wer: 0.8261
    bible_00095:
      source: bible
      text: Ma na, Wɩɩsɩ yaa siri abee ʋ saa rɛ dɩ ʋ ŋmaŋ tɩɩsɩ lo. Tɩya hʋ buloŋ aa bee nɔŋ nɔŋweliye,
        ʋ sɩ ŋmana ʋ lo a paa we diŋ tɩyaŋ.
      sbs: 0.6006
      gen_sec: 5.99
      ref_sec: 11.06
      cer: 0.0968
      wer: 0.6452
    bible_00096:
      source: bible
      text: Ʋ yaa gɛɛ rɛ dɩ wɩya hʋ Wɩɩsɩ gyɩ aa tɩŋ ʋ tɩŋdaal Azaaya tɩyaŋ a basɩ ko yaa wɩtɩɩ. Ʋ gyɩ
        baa,
      sbs: 0.6425
      gen_sec: 5.04
      ref_sec: 7.88
      cer: 0.1268
      wer: 0.6087
    bible_00097:
      source: bible
      text: Ɛɛwɩya, ma aa laa Yesu Krisita di a kpa ʋ ʋ yaa ma Tɩɩna nyɛ, ma leŋ dɩ ma beel-ʋ kɩŋ yaa
        kɩdɩgɩ ma wɩyaalɩya buloŋ tɩyaŋ.
      sbs: 0.6824
      gen_sec: 5.98
      ref_sec: 9.54
      cer: 0.5435
      wer: 0.9259
    bible_00098:
      source: bible
      text: Malɩkasɩ hʋ aa mɩɩgɩ mʋ wɩɩsɩbee ko teŋ, pedaala hʋ basɩ tɩya dɔmɔŋ a baa, “Ma leŋ dɩ á mʋ
        Bɛtɩlɛhɛm, a na wɩɩ hʋ á Tɩɩna Wɩɩsɩ aa leŋ ʋ malɩkasɩ hʋ ko basɩ tɩya ma.”
      sbs: 0.6371
      gen_sec: 2.51
      ref_sec: 12.78
      cer: 0.7823
      wer: 0.973
    bible_00099:
      source: bible
      text: 'Saŋa hʋ Yesu gyɩ aa piili ʋ tʋma hʋ, dɩ ʋ gyɩ yaa bɩsɩ mɔlɩya abee fi rɛ. Nala gyɩ bɩɩna
        anɩɩ Gyosɛfʋ rɛ lʋl Yesu. Nyɛ rɛ Yesu doho tɩŋa: Gyosɛfʋ kuwo feŋ nɛ yaa Heli.'
      sbs: 0.6493
      gen_sec: 8.31
      ref_sec: 13.28
      cer: 0.2778
      wer: 0.6216
    bible_00100:
      source: bible
      text: Baala no balɩya tɩyaŋ, ba kɩdɩgɩ buloŋ bɩ wuwo tuŋ kyɩŋ hʋ. Ɛɛ rɛ kɩna tɩɩna hʋ kpa kyɩma
        hʋ a kyɛ ba buloŋ balɩya. Baala no balɩya tɩyaŋ, ba kɩbee rɛ sɩ kyo kɩna tɩɩna hʋ wɩya yʋga?”
      sbs: 0.6745
      gen_sec: 9.49
      ref_sec: 12.64
      cer: 0.1871
      wer: 0.6667
    bible_00101:
      source: bible
      text: Ŋ aa tɩma ʋ rɛ ma lee dɩ ʋ leŋ ma gyɩŋ gɛɛ ba aa kɩya á tɩyaŋ, ka dɩ ʋ basɩ wɩya tɩya ma dɩ
        ma tenni polli.
      sbs: 0.6533
      gen_sec: 4.72
      ref_sec: 8.32
      cer: 0.1429
      wer: 0.6897
    bible_00102:
      source: bible
      text: Amɛ wɩɩ hʋ aa we doŋ nɛ nyɛ, Wɩɩsɩ marɩ nihuwobiŋ logimo buloŋ nɛ a leŋ ba kɩdɩgɩ buloŋ we
        lee hʋ ʋ aa kyɛ gɛɛ.
      sbs: 0.6201
      gen_sec: 4.91
      ref_sec: 7.8
      cer: 0.25
      wer: 0.6538
    bible_00103:
      source: bible
      text: Ma fa kɩɩ gɛɛ rɛ anɩɩ piyese aa nyʋgɩsa, amɛ nyɛ kɛ ma mɩɩgɩ ko Pedaal hʋ lee rɛ, nal hʋ aa
        deŋ ma mɩɩbol nyuu tɩyaŋ.
      sbs: 0.6529
      gen_sec: 5.66
      ref_sec: 12.26
      cer: 0.1932
      wer: 0.8148
    bible_00104:
      source: bible
      text: Amɛ ba gyɩ bɩ naa wɩɩ buloŋ ba aa sɩ nyɩya tɩya ʋ. Haalɩ nala yʋga gyɩ ko nyɩya wɩya tɩya
        ʋ, amɛ ba bɩ naa wɩɩ buloŋ ʋ aa yaa kyogi a maga dɩ ba kpʋ ʋ.
      sbs: 0.62
      gen_sec: 5.32
      ref_sec: 12.18
      cer: 0.9189
      wer: 0.9737
    bible_00105:
      source: bible
      text: Alahadi kyɛɛ kɛ buloŋ, molbiye hʋ ma kɩdɩgɩ buloŋ aa tʋma a na yɔbɔ hʋ paga tɩyaŋ, nal buloŋ
        lɩɩ maga gɛɛ ɩ aa wuwo dɩ ba kpa kɩ biŋ. Dɩ mɩyaŋ nɛ ko ko, ma bɩl bɩ sɩ kɩ kɩyɛsɩ molbiye.
      sbs: 0.543
      gen_sec: 1.21
      ref_sec: 14.7
      cer: 0.8116
      wer: 1.0
    bible_00106:
      source: bible
      text: Nahɔ mɛ kuwo feŋ nɛ yaa Sɛrugu. Sɛrugu mɛ kuwo feŋ nɛ yaa Ruu. Ruu mɛ kuwo feŋ nɛ yaa Pɛlɛgɩ.
        Pɛlɛgɩ mɛ kuwo feŋ nɛ yaa Iiba. Iiba mɛ kuwo feŋ nɛ yaa Sɛla.
      sbs: 0.6709
      gen_sec: 3.54
      ref_sec: 12.82
      cer: 0.7414
      wer: 0.8286
    bible_00107:
      source: bible
      text: Amɛ ŋ basɩ kɩ tɩya ma rɛ, ma kyo ma dɔmɔ aŋ kyʋwalɩ Wɩɩsɩ kɩ tɩya nala hʋ mɛ aa dɔgɩsɩ ma.
      sbs: 0.6207
      gen_sec: 5.32
      ref_sec: 5.42
      cer: 0.1791
      wer: 0.7727
    bible_00108:
      source: bible
      text: Wɩɩsɩ dɩya bee vʋga bɩ sɩ wuwo pɛ wɩɩ buloŋ tɩyaŋ, beewɩya, ámaa rɛ yaa Wɩɩweyi hʋ dɩya. Wɩɩsɩ
        tɩɩ basɩ ʋ teŋ tɩyaŋ nɛ a baa,
      sbs: 0.6488
      gen_sec: 6.33
      ref_sec: 8.4
      cer: 0.2
      wer: 0.6667
    bible_00109:
      source: bible
      text: Ɛɛwɩya, á mɛ laŋŋa rɛ, a vʋʋlɩ. Á naa dɩ ʋ yaa wɩwelii rɛ a tɩya ma, dɩ á lɩɩ nala a tɩŋ ba
        ma lee. Ba bee á kyaŋsɩ Banabaasɩ bee Pɔɔl lɛ sɩ ko.
      sbs: 0.669
      gen_sec: 5.35
      ref_sec: 12.94
      cer: 0.5631
      wer: 0.8611
    bible_00110:
      source: bible
      text: Ɛɛ hʋ ma aa daga ma tɩɩ hʋ bɩ weliye. Ma bɩ gyɩma anɩɩ sɩbʋl mʋhʋ rɛ ba aa kpa we paanʋʋ muŋ
        tɩyaŋ, ka ʋ sii pʋwarɩ a yʋga gɛɛ?
      sbs: 0.6507
      gen_sec: 6.81
      ref_sec: 8.38
      cer: 0.0957
      wer: 0.4516
    bible_00111:
      source: bible
      text: (Gyudasɩ gyɩ yaa wɩbɔŋ nɛ, a na molbiye doŋ a kpa yɔbɔ taŋha kɩdɩgɩ. Haŋ taŋha hʋ tɩyaŋ nɛ
        ʋ tele pɔsɔ, ʋ nabolimo buloŋ lɩɩ gyaasɩ.
      sbs: 0.6507
      gen_sec: 6.97
      ref_sec: 10.04
      cer: 0.2475
      wer: 0.7407
    bible_00112:
      source: bible
      text: Ɛɛ rɛ ʋ ko gyʋʋ a kaŋ haaŋ hʋ noŋ tɩyaŋ a kaŋ tarɩ ʋ sii sɩŋ. Ʋ teŋnɩma hʋ pirigi nyʋgɩsɩ,
        ka ʋ sii yaa kɩdiiliye tɩya ba.
      sbs: 0.6133
      gen_sec: 6.06
      ref_sec: 10.44
      cer: 0.3297
      wer: 0.6207
    bible_00113:
      source: bible
      text: Ba aa karɩma teŋ hʋ, wɩya hʋ buloŋ ba aa saba yaa ba teŋfɩyɛlʋʋ rɛ. Ba tenni buloŋ polli.
      sbs: 0.6522
      gen_sec: 4.76
      ref_sec: 7.02
      cer: 0.1618
      wer: 0.5789
    bible_00114:
      source: bible
      text: Á gyɩma anɩɩ Wɩɩsɩ aa yaŋ kyisi á Tɩɩna Yesu sʋʋ tɩyaŋ gɛɛ, ɛɛ tɩɩ rɛ ʋ sɩ kyisi ma mɛ sʋʋ
        tɩyaŋ, dɩ á bee Yesu buloŋ kaŋ mɩɩbol, ka dɩ ʋ kaŋ á beel-ma buloŋ mʋ Wɩɩsɩ sɩya.
      sbs: 0.6102
      gen_sec: 9.02
      ref_sec: 11.62
      cer: 0.2109
      wer: 0.55
    bible_00115:
      source: bible
      text: Amɛ á kɛ kɩɩ gɛɛ rɛ anɩɩ viini, Wɩɩsɩ kpa wɩweliye no a we á tɩyaŋ. Nyɛ yaŋ daga anɩɩ debal
        hʋ aa we á tɩyaŋ yaa Wɩɩsɩ kɩŋ nɛ; á tɩɩ dee daa.
      sbs: 0.6484
      gen_sec: 3.7
      ref_sec: 10.32
      cer: 0.6346
      wer: 0.8824
    bible_00116:
      source: bible
      text: Ma kɩ bara doo a kɩ sʋla Wɩɩsɩ aŋ kɩ pɔ dɩ Sɩtaanɩ ta wuwo mʋrɩ ma. Ma tɩɩsɩ tɩyaŋ ma kyo
        dɩ ma tɩŋa ŋ nyʋwa rɛ, amɛ ma tɩɩ bɩ kaŋ ɛɛ dee.”
      sbs: 0.6337
      gen_sec: 7.23
      ref_sec: 11.72
      cer: 0.1485
      wer: 0.4571
    bible_00117:
      source: bible
      text: “Ŋ Kuwo, dɩ ʋ ko yaa ɩ kyɛrɩ, lɩɩ ŋ tʋwara no aa ko tɩyaŋ. Amɛ mɩyaŋ kɛ kyɛrɩ daa, leŋ dɩ
        ɩ kyɛrɩ yaa.”
      sbs: 0.6904
      gen_sec: 5.18
      ref_sec: 9.6
      cer: 0.4167
      wer: 0.64
    bible_00118:
      source: bible
      text: Amɛ ŋ sɩ laa sɩya na tʋwara, ka dɩ ma gyɩnaŋ nala ha vɩya ŋ.
      sbs: 0.6311
      gen_sec: 2.79
      ref_sec: 5.16
      cer: 0.0455
      wer: 0.6
    bible_00119:
      source: bible
      text: Dʋnɩya bayuwo kɩna daa á kaŋ kɩ lʋga á lʋgʋ, amɛ Wɩɩsɩ tɩɩ dee rɛ ʋ kpa tɩya ma, a wuwo kpa
        yuwo kɩ di Sɩtaanɩ leye hʋ buloŋ ʋ aa kaŋ dee tɩyaŋ.
      sbs: 0.6821
      gen_sec: 4.05
      ref_sec: 10.7
      cer: 0.5926
      wer: 0.7941
    bible_00120:
      source: bible
      text: Koo á aa kyɛ dɩ á yaa dɩ Wɩɩsɩ baaŋ sii rɛ? Koo á bɩɩna anɩɩ ámaa rɛ kaŋ dee te Wɩɩsɩ?
      sbs: 0.6722
      gen_sec: 1.92
      ref_sec: 7.14
      cer: 0.6508
      wer: 0.9545
    bible_00121:
      source: bible
      text: Ɛɛwɩya, ma ta leŋ dɩ kɩna hʋ ma aa sɩ di abee kɩna hʋ ma aa sɩ nyʋwa wɩya dʋŋ kyɩl ma.
      sbs: 0.6377
      gen_sec: 3.98
      ref_sec: 5.82
      cer: 0.1905
      wer: 0.9091
    bible_00122:
      source: bible
      text: Pɔɔl baa, “Aayɩ, ŋ yaa gyuu rɛ a lɩɩ Taasu, Silisɩya paalʋʋ tɔbal hʋ. Ŋ aa sʋla ɩ rɛ dɩ ɩ
        leŋ dɩ ŋ basɩ wɩya tɩya nala no.”
      sbs: 0.6096
      gen_sec: 5.97
      ref_sec: 11.42
      cer: 0.1591
      wer: 0.5862
    bible_00123:
      source: bible
      text: Deviti fa aa naa wɩɩ hʋ Wɩɩsɩ fa aa kyɛ dɩ ʋ yaa, ʋ wuwo basɩ Krisita sʋʋ tɩyaŋ mɩɩgɩ siiyi
        wɩya rɛ a baa, ‘Wɩɩsɩ bɩ laa nyʋwa vɩya ʋ ta lalɩyabee tɩyaŋ. Ʋ bɩ laa nyʋwa leŋ ʋ teŋbii pɩŋ
        bʋwa tɩyaŋ a pʋwa.’
      sbs: 0.6227
      gen_sec: 10.93
      ref_sec: 14.6
      cer: 0.2662
      wer: 0.6957
    bible_00124:
      source: bible
      text: Wɩtɩɩ hʋ aa we á tɩyaŋ, ʋ rɛ tɩŋ á kyo ma gɛɛ. Wɩtɩɩ no sɩ we á tɩyaŋ a kaŋ kɩ mʋ maakyiye
        buloŋ.
      sbs: 0.6098
      gen_sec: 5.13
      ref_sec: 7.64
      cer: 0.3
      wer: 0.76
    bible_00125:
      source: bible
      text: Ŋ sɩ kɩ yaa wɩkperiye Wɩɩsɩnyuu tɩyaŋ, aŋ kɩ yaa wɩmagɩla mɛ dʋnɩya abee taŋhanyuu tɩyaŋ daha.
        Kyal, diŋ, abee nyʋwɔsɩ sɩ we doŋ.
      sbs: 0.6231
      gen_sec: 6.93
      ref_sec: 10.64
      cer: 0.1881
      wer: 0.7083
    bible_00126:
      source: bible
      text: Ɛɛ rɛ Yesu gyɩ bɩl sii kɩ mʋ Gyerusalɛm, a gyɩ mʋ tɩŋ Samaarɩya abee Galili paalʋʋ paga a
        kɩ mʋ.
      sbs: 0.6204
      gen_sec: 5.04
      ref_sec: 6.72
      cer: 0.1081
      wer: 0.4286
    bible_00127:
      source: bible
      text: a lɩɩ molbiye hʋ badɔmɔŋ faŋa, ka Ananiyasɩ sii kaŋ molbikaalɩya hʋ mʋ Yesu kpambɩsɩ hʋ lee.
      sbs: 0.6344
      gen_sec: 5.03
      ref_sec: 5.38
      cer: 0.1216
      wer: 0.7059
    bible_00128:
      source: bible
      text: Ŋ naabalɩya, wɩtɩɩ hʋ á aa gʋnna rɛ á mɛ kpa kɩ daga ma. Ɛɛwɩya ma sɩŋ ʋ tɩyaŋ weliŋ, dɩ ʋ
        yaa á wɩbasɩɩ tɩyaŋ koo dɩ wɩya hʋ á saba tɩya ma tɩyaŋ nɛ.
      sbs: 0.6471
      gen_sec: 8.2
      ref_sec: 12.28
      cer: 0.1892
      wer: 0.6389
    bible_00129:
      source: bible
      text: Dɩ haaŋ mɛ rɛ vɩya ʋ bala, aŋ mɛ bɩl mʋ yal badɩma, ʋ mɛ gyʋʋ ʋ bala hʋ haakye tɩyaŋ nɛ, aŋ
        pɛ yaa sɔŋsɔnnɩ mɛ.”
      sbs: 0.6502
      gen_sec: 5.5
      ref_sec: 8.04
      cer: 0.2469
      wer: 0.6296
    bible_00130:
      source: bible
      text: Á aa kyɛ dɩ á teŋfɩyɛlʋʋ no ko yaa teŋfɩyɛl-piliŋ nɛ, ɛɛ rɛ tɩŋ ŋ sabɩ wɩya no kɩ tɩya ma.
      sbs: 0.6487
      gen_sec: 5.03
      ref_sec: 6.8
      cer: 0.209
      wer: 0.7143
    bible_00131:
      source: bible
      text: Nala no buloŋ gyɩ yaa anɩɩ baala fi abee balɩya rɛ.
      sbs: 0.67
      gen_sec: 2.34
      ref_sec: 3.58
      cer: 0.175
      wer: 0.4545
    bible_00132:
      source: bible
      text: Nal hʋ mɛ buloŋ aa sɩ yaa nɩɩfɩyɛlɩɩ mɛ gba tɩya ŋ hatɩnna no tɩyaŋ nɩbiye akuu ʋ aa yaa ŋ
        hatɩnnɩ wɩya, wɩtɩɩ rɛ ŋ basɩ kɩ tɩya ma Wɩɩsɩ kɔnɩ sɩ tuŋ ʋ tɩɩna.”
      sbs: 0.6238
      gen_sec: 2.41
      ref_sec: 14.92
      cer: 0.9587
      wer: 1.0
    bible_00133:
      source: bible
      text: Ŋ fɩla ŋ tɩɩ rɛ, a kana ŋ teŋbii bɩrɩmɩ ŋ yoŋ. Ŋ yaa gɛɛ rɛ dɩ ŋ ta ko basɩ Wɩɩsɩ wɩweliye
        hʋ tɩya nala teŋ, ka dɩ ŋ tɩɩ bɩ kaŋ tol Wɩɩsɩ koro hʋ tɩyaŋ.
      sbs: 0.7131
      gen_sec: 4.08
      ref_sec: 14.5
      cer: 0.7387
      wer: 0.8158
    bible_00134:
      source: bible
      text: Beewɩya, á tɩɩ kɩɩ gɛɛ rɛ anɩɩ tʋranɩɩ sʋwala aa sʋma, Krisita kpa ma tɩya Wɩɩsɩ. Nyɛ rɛ Wɩɩsɩ
        leŋ á pɩsa gyʋʋ nala hʋ ʋ aa laa kɩ ta, abee nala hʋ aa nyʋgɩsɩ buloŋ tɩyaŋ.
      sbs: 0.6379
      gen_sec: 9.19
      ref_sec: 12.84
      cer: 0.0692
      wer: 0.5676
    bible_00135:
      source: bible
      text: Wɩya hʋ ba aa basɩ Wɩɩsɩ Wiyesi Welii hʋ dee tɩyaŋ, ma ta kɩ kpaa ba waasʋ.
      sbs: 0.6451
      gen_sec: 3.26
      ref_sec: 5.0
      cer: 0.2807
      wer: 0.7647
    bible_00136:
      source: bible
      text: anɩɩ mɩyaŋ Nihuwobiŋ Biye aa kɩɩ gɛɛ. Ŋ bɩ ko dɩ nala tʋma kɩ tɩya ŋ, amɛ nala rɛ ŋ ko dɩ
        ŋ tʋma tɩya, aŋ kpa ŋ mɩɩbol mɛ lenni sʋʋ a laa nala yʋga ta ba wɩbɔmɔ tɩyaŋ.”
      sbs: 0.6542
      gen_sec: 8.08
      ref_sec: 14.44
      cer: 0.129
      wer: 0.675
    bible_00137:
      source: bible
      text: Dɩ nal kɩdɩgɩ buloŋ nɛ ko kɩ daga wɩdʋŋsɩ Wɩɩsɩ ŋmanɩɩ tɩyaŋ, dɩ ba bee wɩtɩɩ hʋ á Tɩɩna Yesu
        Krisita aa daga ma, abee á wɩɩkyʋwal ŋmanɩɩ hʋ á aa tɩŋ bɩ yaa kɩdɩgɩ,
      sbs: 0.5973
      gen_sec: 0.44
      ref_sec: 13.2
      cer: 0.874
      wer: 1.0
    bible_00138:
      source: bible
      text: Ɛɛ rɛ Yesu pɩyɛsɩ nala hʋ a baa, “Ɛɛ rɛ Wɩɩsɩ koro hʋ kɩɩ? Bekiŋ nɛ ŋ sɩ kpa ʋ magɩsɩ?
      sbs: 0.6547
      gen_sec: 4.39
      ref_sec: 6.28
      cer: 0.1935
      wer: 0.7143
    bible_00139:
      source: bible
      text: a baa dɩ ba kaŋ Yesu mʋ kpaasɩ mal daagarɩɩ tɩyaŋ.
      sbs: 0.5188
      gen_sec: 3.12
      ref_sec: 3.04
      cer: 0.7692
      wer: 1.0
    bible_00140:
      source: bible
      text: Ŋ basɩ kɩ tɩya ma rɛ, ba bɩ sɩ lɩɩ ɩ dɩya no tɩyaŋ, see dɩ ɩ tuŋ kyɩŋ hʋ ba aa kere tɩya ɩ
        teŋ.”
      sbs: 0.6578
      gen_sec: 4.59
      ref_sec: 9.72
      cer: 0.1194
      wer: 0.4231
    bible_00141:
      source: bible
      text: Hɛrɔtɩ mɛ bɩ naa ʋ wɩkyogii buloŋ, ɛɛ rɛ tɩŋ ʋ leŋ ba bɩl mɩɩgɩ kana ʋ ko daha. Ma na, baal
        no bɩ yaa wɩɩ buloŋ kyogi a maga dɩ ba kpʋ ʋ.
      sbs: 0.5916
      gen_sec: 7.32
      ref_sec: 10.8
      cer: 0.13
      wer: 0.6471
    bible_00142:
      source: bible
      text: Amɛ nyɛ kɛ, ʋ maga dɩ ma lɩɩ ma tɩɩ wɩya no buloŋ tɩyaŋ nɛ. Ma leŋ baaŋ nayɩ, a leŋ dɔmɔŋ
        fene kyogii, a ta kaŋ tahaa, aŋ leŋ wɩlaama basɩɩ mɛ.
      sbs: 0.6785
      gen_sec: 7.65
      ref_sec: 11.72
      cer: 0.1238
      wer: 0.4545
    bible_00143:
      source: bible
      text: Kaŋ wɩya no buloŋ weliŋ abee tɩdɩgɩ aŋ ta kaŋ wɩkyogii buloŋ a mʋ pele kyɛɛ hʋ á Tɩɩna Yesu
        Krisita aa sɩ mɩɩgɩ ko.
      sbs: 0.6029
      gen_sec: 6.26
      ref_sec: 7.38
      cer: 0.1111
      wer: 0.44
    bible_00144:
      source: bible
      text: Wɩtɩɩ rɛ ŋ basɩ kɩ tɩya ma, doŋ tɩyaŋ nɛ ɩ sɩ we a mʋ pele saŋa hʋ ɩ aa sɩ tuŋ kyɩŋ hʋ ba
        aa kere tɩya ɩ buloŋ teŋ.
      sbs: 0.6178
      gen_sec: 6.24
      ref_sec: 7.5
      cer: 0.1687
      wer: 0.4194
    bible_00145:
      source: bible
      text: Farasiima hʋ aa nɩya anɩɩ Yesu basɩ wɩya lo Sadusiima ba nyʋʋsɩ gyʋʋ kpʋlɩya gɛɛ, ba ko yaa
        nyʋʋdɩgɩ a sii kpa mʋ Yesu lee.
      sbs: 0.6611
      gen_sec: 6.27
      ref_sec: 11.08
      cer: 0.134
      wer: 0.72
    bible_00146:
      source: bible
      text: “Nala hʋ buloŋ gyɩ aa paa yʋga, ba gyɩ bɩ diye aŋ ka kɩŋ, nala hʋ mɛ gyɩ aa paa mʋhʋ, ba mɛ
        gyɩ bɩ dii buwo.”
      sbs: 0.679
      gen_sec: 5.52
      ref_sec: 8.38
      cer: 0.2468
      wer: 0.7037
    bible_00147:
      source: bible
      text: Ɛɛwɩya, ma wɩyaalɩya rɛ nala hʋ buloŋ aa laa Yesu wɩya di a we Masidooniya abee Akaaya paalʋʋ
        tɩyaŋ kɩ kyesi.
      sbs: 0.6523
      gen_sec: 5.71
      ref_sec: 7.8
      cer: 0.1494
      wer: 0.7143
    bible_00148:
      source: bible
      text: Mɩyaŋ Pɔɔl aa yaa Yesu Krisita Kpambɩya Wɩɩsɩ kyɛrɩ tɩyaŋ abee á nɩɩnabiye Timoti rɛ saba
        teŋ no kɩ tɩya ma.
      sbs: 0.636
      gen_sec: 5.86
      ref_sec: 7.06
      cer: 0.1724
      wer: 0.619
    bible_00149:
      source: bible
      text: Mɩyaŋ Pɔɔl abee Silaasi abee Timoti rɛ sabɩ teŋ no a kɩ tɩya ma Krisitabiisi hʋ buloŋ aa we
        Tesaloniika tɩyaŋ, a yaa á Kuwo Wɩɩsɩ abee á Tɩɩna Yesu Krisita nala. Wɩɩsɩ bɔnyɛ abee ʋ fɩyɛlʋʋ
        sɩ we ma lee.
      sbs: 0.6455
      gen_sec: 11.74
      ref_sec: 14.8
      cer: 0.1887
      wer: 0.6585
    bible_00150:
      source: bible
      text: Nyɛ rɛ Pɔɔl yɩrɩ laalyuwolo nɩhɩyasɩ hʋ kɩdɩgɩ a basɩ tɩya ʋ a baa, “Kaŋ bapʋwasɩbiye no mʋ
        ma nɩhɩyawʋ hʋ lee, ʋ kaŋ wɩɩ rɛ dɩ ʋ basɩ tɩya ʋ.”
      sbs: 0.5902
      gen_sec: 7.86
      ref_sec: 8.48
      cer: 0.0741
      wer: 0.3871
    bible_00151:
      source: bible
      text: Ɛɛ mɛ yaŋ daga anɩɩ á gba nyɩya wɩya kɩ tɩya Wɩɩsɩ rɛ, beewɩya á baa ʋ kyisi Krisita sʋʋ tɩyaŋ
        nɛ. Dɩ sʋʋnɩ mɩɩgɩ sii kɔnɩ ko tuwo, ɛɛ kɛ Wɩɩsɩ bɩ kyisi Krisita mɛ sʋʋ tɩyaŋ.
      sbs: 0.6305
      gen_sec: 9.82
      ref_sec: 12.48
      cer: 0.1053
      wer: 0.4737
    bible_00152:
      source: bible
      text: Mʋhʋ sʋwaa, dɩ ʋ haaŋ hʋ mɛ ko gyʋʋ. Ʋ kɛ fa bɩ gyɩŋ wɩɩ hʋ aa yaa tɩyaŋ.
      sbs: 0.6531
      gen_sec: 3.72
      ref_sec: 5.36
      cer: 0.2115
      wer: 0.4737
    bible_00153:
      source: bible
      text: Teŋ hʋ ŋ gyɩ aa saba tɩya ma tɩyaŋ, ŋ gyɩ basɩ tɩya ma a baa dɩ ma lɩɩ ma tɩɩ nala hʋ aa yaa
        sɔŋsɔŋ wɩya tɩyaŋ nɛ.
      sbs: 0.6496
      gen_sec: 5.5
      ref_sec: 7.6
      cer: 0.1071
      wer: 0.4138
    bible_00154:
      source: bible
      text: Ʋ sɩ lʋl boyoŋbiye, dɩ ɩ we ʋ feŋ Yesu. Feŋ hʋ memii rɛ yaa Laataal, beewɩya ʋ rɛ sɩ laa ʋ
        nala ta ba wɩbɔmɔ tɩyaŋ.”
      sbs: 0.6346
      gen_sec: 5.97
      ref_sec: 10.82
      cer: 0.0706
      wer: 0.4444
    bible_00155:
      source: bible
      text: Nala hʋ aa kyɛ dɩ ba mʋrɩ ma wɩya rɛ ŋ sabɩ wɩya no kɩ tɩya ma.
      sbs: 0.6351
      gen_sec: 2.88
      ref_sec: 3.72
      cer: 0.3696
      wer: 0.9412
    bible_00156:
      source: bible
      text: Ba kasɩ ba a ŋmaa kɩdɩgɩ, a kpʋ kɩdɩgɩ, aŋ yaga kɩdɩgɩ hʋ mɛ abee bʋwa.
      sbs: 0.6281
      gen_sec: 3.75
      ref_sec: 5.84
      cer: 0.1132
      wer: 0.5
    bible_00157:
      source: bible
      text: Wɩɩ no yaa wɩwelii rɛ a kɩ fɩyɛlɩ Wɩɩsɩ á laataal teŋ mɛ,
      sbs: 0.6687
      gen_sec: 2.68
      ref_sec: 3.44
      cer: 0.25
      wer: 0.6923
    bible_00158:
      source: bible
      text: beewɩya ɩ kɛ paalɩ gyɩŋ Gyuuma lesiri buloŋ nɛ abee ba wɩkaŋtarɩya buloŋ. Ŋ yaŋ aa sʋla ɩ
        rɛ dɩ ɩ di kenyiri aŋ gyegili nɩɩ ŋ nyʋwa.
      sbs: 0.6442
      gen_sec: 6.31
      ref_sec: 9.28
      cer: 0.2816
      wer: 0.7857
    bible_00159:
      source: bible
      text: Ɛɛ rɛ ma mɛ yaŋ kɩɩ anɩɩ dʋma, ma bɔmɔ rɛ weliŋ, ɛɛwɩya ma bɩ sɩ wuwo basɩ wɩwelii kɩdɩgɩ
        buloŋ. Beewɩya, nihuwobiŋ wɩbasɩɩ tɩyaŋ nɛ ɩ aa gyɩŋ nihuwobiŋ hʋ iriŋ ʋ aa yaa.
      sbs: 0.6757
      gen_sec: 8.11
      ref_sec: 14.86
      cer: 0.1832
      wer: 0.6571
    bible_00160:
      source: bible
      text: aŋ sʋla ʋ dɩ ʋ kɛ haa leŋ dɩ nala hʋ buloŋ aa wɩɩlɩ dige ʋ gal nyʋwa. Nala hʋ buloŋ gyɩ aa
        dige ʋ gal nyʋwa, ba buloŋ nɛ gyɩ naa laaŋfɩya.
      sbs: 0.6321
      gen_sec: 7.19
      ref_sec: 14.08
      cer: 0.2136
      wer: 0.5455
    bible_00161:
      source: bible
      text: Akuu lagɩlagɩ no taŋha hʋ aa deye wɩya, dɩ baal lɛ bɩ kpa haaŋ, ʋ rɛ kpɩya.
      sbs: 0.6415
      gen_sec: 3.53
      ref_sec: 5.72
      cer: 0.3214
      wer: 0.7647
    bible_00162:
      source: bible
      text: Wɩfaŋɩɩ buloŋ tuwo dɩ ʋ bɩ sɩ ko lɩɩ lɩgyalɩɩ. Wɩɩ buloŋ mɛ aa we bilhuu tɩyaŋ, ʋ mɛ sɩ ko
        lɩɩ pʋlʋŋ.
      sbs: 0.653
      gen_sec: 5.51
      ref_sec: 8.4
      cer: 0.2763
      wer: 0.7826
    bible_00163:
      source: bible
      text: Ɛɛwɩya, ŋ kyaŋweliye, ma lɩɩ ma tɩɩ vʋga marɩɩ tɩyaŋ.
      sbs: 0.6244
      gen_sec: 2.69
      ref_sec: 4.6
      cer: 0.2195
      wer: 1.0
    bible_00164:
      source: bible
      text: Amɛ ʋ gyɩ aa yaa gɛɛ rɛ Wɩɩsɩ leŋ ʋ kokumo basɩ ʋ sɩya wɩya tɩya ʋ abee nihuwobiŋ abee kokusi
        aa bee basɩ wɩya buloŋ, ɛɛ leŋ ʋ leŋ ʋ bambugiliŋ hʋ.
      sbs: 0.6278
      gen_sec: 8.46
      ref_sec: 11.76
      cer: 0.1504
      wer: 0.4242
    bible_00165:
      source: bible
      text: Amɛ Gyudɩya paalʋʋ buloŋ tɩyaŋ, Bɛtɩlɛhɛm nala rɛ yaa nɩbala,
      sbs: 0.65
      gen_sec: 3.33
      ref_sec: 4.4
      cer: 0.08
      wer: 0.4
    bible_00166:
      source: bible
      text: Amɛ ʋ maga dɩ ba kɩ yaa wɩweliye hʋ haana aa kpaa ba tɩɩ tɩya Wɩɩsɩ aa maga dɩ ba kɩ yaa rɛ.
      sbs: 0.6108
      gen_sec: 4.5
      ref_sec: 6.3
      cer: 0.1884
      wer: 0.8261
    bible_00167:
      source: bible
      text: Aŋka paanʋʋ gama bapɛ hʋ mɛ ŋ gyɩ aa kaŋ lɔgɔ lɔgɔ tɩya nala tusi banaa hʋ? Simbiisi baŋmɛ
        rɛ ma gyɩ paa ba kɩkaalɩya hʋ mɛ su?
      sbs: 0.6434
      gen_sec: 6.39
      ref_sec: 10.98
      cer: 0.1735
      wer: 0.8214
    bible_00168:
      source: bible
      text: Yesu ha gyɩ aa basɩ wɩya kɩ tɩya nɩgyamaa hʋ gɛɛ, dɩ ʋ naa abee ʋ naabalɩya ko sɩŋ gyaŋhal
        tɩyaŋ a kɩ kyɛ dɩ ba na ʋ.
      sbs: 0.6462
      gen_sec: 5.71
      ref_sec: 9.14
      cer: 0.1591
      wer: 0.6071
    bible_00169:
      source: bible
      text: 'Ka ba buloŋ tɩyaŋ, wɩɩ hʋ aa yaa wɩɩ rɛ nyɛ: Wɩɩsɩ wɩweliye hʋ rɛ á buloŋ kɩ basɩ. Wɩya hʋ
        ba aa basɩ, ba aa rɛ ŋ mɛ kɩ basɩ. Wɩya no tɩɩ rɛ ma mɛ laa di gɛɛ.'
      sbs: 0.6273
      gen_sec: 0.77
      ref_sec: 12.24
      cer: 0.8142
      wer: 1.0
    bible_00170:
      source: bible
      text: Ʋ sɩya aa gballa, Roma nɩhɩyasɩ hʋ tɩŋ porisi nɩhɩyasɩ dɩ ba mʋ basɩ tɩya nal hʋ aa deŋ nɩtɔdɩya
        hʋ dɩ ʋ lɩɩ Pɔɔl bee Silaasi ta dɩ ba kɩ mʋ.
      sbs: 0.6325
      gen_sec: 6.54
      ref_sec: 11.14
      cer: 0.2315
      wer: 0.7188
    bible_00171:
      source: bible
