      gen_sec: 9.92
      ref_sec: 9.54
      cer: 0.1957
      wer: 0.7037
    bible_00098:
      source: bible
      text: Malɩkasɩ hʋ aa mɩɩgɩ mʋ wɩɩsɩbee ko teŋ, pedaala hʋ basɩ tɩya dɔmɔŋ a baa, “Ma leŋ dɩ á mʋ
        Bɛtɩlɛhɛm, a na wɩɩ hʋ á Tɩɩna Wɩɩsɩ aa leŋ ʋ malɩkasɩ hʋ ko basɩ tɩya ma.”
      sbs: 0.581
      gen_sec: 12.76
      ref_sec: 12.78
      cer: 0.2984
      wer: 0.7838
    bible_00099:
      source: bible
      text: 'Saŋa hʋ Yesu gyɩ aa piili ʋ tʋma hʋ, dɩ ʋ gyɩ yaa bɩsɩ mɔlɩya abee fi rɛ. Nala gyɩ bɩɩna
        anɩɩ Gyosɛfʋ rɛ lʋl Yesu. Nyɛ rɛ Yesu doho tɩŋa: Gyosɛfʋ kuwo feŋ nɛ yaa Heli.'
      sbs: 0.5752
      gen_sec: 18.88
      ref_sec: 13.28
      cer: 0.2857
      wer: 0.7297
    bible_00100:
      source: bible
      text: Baala no balɩya tɩyaŋ, ba kɩdɩgɩ buloŋ bɩ wuwo tuŋ kyɩŋ hʋ. Ɛɛ rɛ kɩna tɩɩna hʋ kpa kyɩma
        hʋ a kyɛ ba buloŋ balɩya. Baala no balɩya tɩyaŋ, ba kɩbee rɛ sɩ kyo kɩna tɩɩna hʋ wɩya yʋga?”
      sbs: 0.6354
      gen_sec: 16.44
      ref_sec: 12.64
      cer: 0.2158
      wer: 0.6154
    bible_00101:
      source: bible
      text: Ŋ aa tɩma ʋ rɛ ma lee dɩ ʋ leŋ ma gyɩŋ gɛɛ ba aa kɩya á tɩyaŋ, ka dɩ ʋ basɩ wɩya tɩya ma dɩ
        ma tenni polli.
      sbs: 0.5842
      gen_sec: 7.72
      ref_sec: 8.32
      cer: 0.1299
      wer: 0.4138
    bible_00102:
      source: bible
      text: Amɛ wɩɩ hʋ aa we doŋ nɛ nyɛ, Wɩɩsɩ marɩ nihuwobiŋ logimo buloŋ nɛ a leŋ ba kɩdɩgɩ buloŋ we
        lee hʋ ʋ aa kyɛ gɛɛ.
      sbs: 0.5884
      gen_sec: 13.36
      ref_sec: 7.8
      cer: 0.2738
      wer: 0.6538
    bible_00103:
      source: bible
      text: Ma fa kɩɩ gɛɛ rɛ anɩɩ piyese aa nyʋgɩsa, amɛ nyɛ kɛ ma mɩɩgɩ ko Pedaal hʋ lee rɛ, nal hʋ aa
        deŋ ma mɩɩbol nyuu tɩyaŋ.
      sbs: 0.5821
      gen_sec: 9.4
      ref_sec: 12.26
      cer: 0.25
      wer: 0.7778
    bible_00104:
      source: bible
      text: Amɛ ba gyɩ bɩ naa wɩɩ buloŋ ba aa sɩ nyɩya tɩya ʋ. Haalɩ nala yʋga gyɩ ko nyɩya wɩya tɩya
        ʋ, amɛ ba bɩ naa wɩɩ buloŋ ʋ aa yaa kyogi a maga dɩ ba kpʋ ʋ.
      sbs: 0.6024
      gen_sec: 11.6
      ref_sec: 12.18
      cer: 0.1712
      wer: 0.6842
    bible_00105:
      source: bible
      text: Alahadi kyɛɛ kɛ buloŋ, molbiye hʋ ma kɩdɩgɩ buloŋ aa tʋma a na yɔbɔ hʋ paga tɩyaŋ, nal buloŋ
        lɩɩ maga gɛɛ ɩ aa wuwo dɩ ba kpa kɩ biŋ. Dɩ mɩyaŋ nɛ ko ko, ma bɩl bɩ sɩ kɩ kɩyɛsɩ molbiye.
      sbs: 0.5796
      gen_sec: 13.12
      ref_sec: 14.7
      cer: 0.2246
      wer: 0.6667
    bible_00106:
      source: bible
      text: Nahɔ mɛ kuwo feŋ nɛ yaa Sɛrugu. Sɛrugu mɛ kuwo feŋ nɛ yaa Ruu. Ruu mɛ kuwo feŋ nɛ yaa Pɛlɛgɩ.
        Pɛlɛgɩ mɛ kuwo feŋ nɛ yaa Iiba. Iiba mɛ kuwo feŋ nɛ yaa Sɛla.
      sbs: 0.5587
      gen_sec: 13.88
      ref_sec: 12.82
      cer: 0.319
      wer: 0.7429
    bible_00107:
      source: bible
      text: Amɛ ŋ basɩ kɩ tɩya ma rɛ, ma kyo ma dɔmɔ aŋ kyʋwalɩ Wɩɩsɩ kɩ tɩya nala hʋ mɛ aa dɔgɩsɩ ma.
      sbs: 0.5441
      gen_sec: 8.0
      ref_sec: 5.42
      cer: 0.1343
      wer: 0.6818
    bible_00108:
      source: bible
      text: Wɩɩsɩ dɩya bee vʋga bɩ sɩ wuwo pɛ wɩɩ buloŋ tɩyaŋ, beewɩya, ámaa rɛ yaa Wɩɩweyi hʋ dɩya. Wɩɩsɩ
        tɩɩ basɩ ʋ teŋ tɩyaŋ nɛ a baa,
      sbs: 0.6188
      gen_sec: 13.52
      ref_sec: 8.4
      cer: 0.1368
      wer: 0.5926
    bible_00109:
      source: bible
      text: Ɛɛwɩya, á mɛ laŋŋa rɛ, a vʋʋlɩ. Á naa dɩ ʋ yaa wɩwelii rɛ a tɩya ma, dɩ á lɩɩ nala a tɩŋ ba
        ma lee. Ba bee á kyaŋsɩ Banabaasɩ bee Pɔɔl lɛ sɩ ko.
      sbs: 0.6261
      gen_sec: 19.92
      ref_sec: 12.94
      cer: 0.2913
      wer: 0.5278
    bible_00110:
      source: bible
      text: Ɛɛ hʋ ma aa daga ma tɩɩ hʋ bɩ weliye. Ma bɩ gyɩma anɩɩ sɩbʋl mʋhʋ rɛ ba aa kpa we paanʋʋ muŋ
        tɩyaŋ, ka ʋ sii pʋwarɩ a yʋga gɛɛ?
      sbs: 0.5975
      gen_sec: 9.76
      ref_sec: 8.38
      cer: 0.2766
      wer: 0.7419
    bible_00111:
      source: bible
      text: (Gyudasɩ gyɩ yaa wɩbɔŋ nɛ, a na molbiye doŋ a kpa yɔbɔ taŋha kɩdɩgɩ. Haŋ taŋha hʋ tɩyaŋ nɛ
        ʋ tele pɔsɔ, ʋ nabolimo buloŋ lɩɩ gyaasɩ.
      sbs: 0.6067
      gen_sec: 13.12
      ref_sec: 10.04
      cer: 0.1188
      wer: 0.6667
    bible_00112:
      source: bible
      text: Ɛɛ rɛ ʋ ko gyʋʋ a kaŋ haaŋ hʋ noŋ tɩyaŋ a kaŋ tarɩ ʋ sii sɩŋ. Ʋ teŋnɩma hʋ pirigi nyʋgɩsɩ,
        ka ʋ sii yaa kɩdiiliye tɩya ba.
      sbs: 0.6002
      gen_sec: 10.16
      ref_sec: 10.44
      cer: 0.4505
      wer: 0.8276
    bible_00113:
      source: bible
      text: Ba aa karɩma teŋ hʋ, wɩya hʋ buloŋ ba aa saba yaa ba teŋfɩyɛlʋʋ rɛ. Ba tenni buloŋ polli.
      sbs: 0.595
      gen_sec: 7.36
      ref_sec: 7.02
      cer: 0.2647
      wer: 0.4737
    bible_00114:
      source: bible
      text: Á gyɩma anɩɩ Wɩɩsɩ aa yaŋ kyisi á Tɩɩna Yesu sʋʋ tɩyaŋ gɛɛ, ɛɛ tɩɩ rɛ ʋ sɩ kyisi ma mɛ sʋʋ
        tɩyaŋ, dɩ á bee Yesu buloŋ kaŋ mɩɩbol, ka dɩ ʋ kaŋ á beel-ma buloŋ mʋ Wɩɩsɩ sɩya.
      sbs: 0.6002
      gen_sec: 14.08
      ref_sec: 11.62
      cer: 0.1328
      wer: 0.4
    bible_00115:
      source: bible
      text: Amɛ á kɛ kɩɩ gɛɛ rɛ anɩɩ viini, Wɩɩsɩ kpa wɩweliye no a we á tɩyaŋ. Nyɛ yaŋ daga anɩɩ debal
        hʋ aa we á tɩyaŋ yaa Wɩɩsɩ kɩŋ nɛ; á tɩɩ dee daa.
      sbs: 0.6225
      gen_sec: 13.4
      ref_sec: 10.32
      cer: 0.2981
      wer: 0.8529
    bible_00116:
      source: bible
      text: Ma kɩ bara doo a kɩ sʋla Wɩɩsɩ aŋ kɩ pɔ dɩ Sɩtaanɩ ta wuwo mʋrɩ ma. Ma tɩɩsɩ tɩyaŋ ma kyo
        dɩ ma tɩŋa ŋ nyʋwa rɛ, amɛ ma tɩɩ bɩ kaŋ ɛɛ dee.”
      sbs: 0.5684
      gen_sec: 12.4
      ref_sec: 11.72
      cer: 0.2178
      wer: 0.5143
    bible_00117:
      source: bible
      text: “Ŋ Kuwo, dɩ ʋ ko yaa ɩ kyɛrɩ, lɩɩ ŋ tʋwara no aa ko tɩyaŋ. Amɛ mɩyaŋ kɛ kyɛrɩ daa, leŋ dɩ
        ɩ kyɛrɩ yaa.”
      sbs: 0.5651
      gen_sec: 9.08
      ref_sec: 9.6
      cer: 0.3611
      wer: 0.8
    bible_00118:
      source: bible
      text: Amɛ ŋ sɩ laa sɩya na tʋwara, ka dɩ ma gyɩnaŋ nala ha vɩya ŋ.
      sbs: 0.5604
      gen_sec: 5.8
      ref_sec: 5.16
      cer: 0.2955
      wer: 0.9333
    bible_00119:
      source: bible
      text: Dʋnɩya bayuwo kɩna daa á kaŋ kɩ lʋga á lʋgʋ, amɛ Wɩɩsɩ tɩɩ dee rɛ ʋ kpa tɩya ma, a wuwo kpa
        yuwo kɩ di Sɩtaanɩ leye hʋ buloŋ ʋ aa kaŋ dee tɩyaŋ.
      sbs: 0.6247
      gen_sec: 13.52
      ref_sec: 10.7
      cer: 0.1667
      wer: 0.7647
    bible_00120:
      source: bible
      text: Koo á aa kyɛ dɩ á yaa dɩ Wɩɩsɩ baaŋ sii rɛ? Koo á bɩɩna anɩɩ ámaa rɛ kaŋ dee te Wɩɩsɩ?
      sbs: 0.6041
      gen_sec: 8.56
      ref_sec: 7.14
      cer: 0.2698
      wer: 0.6818
    bible_00121:
      source: bible
      text: Ɛɛwɩya, ma ta leŋ dɩ kɩna hʋ ma aa sɩ di abee kɩna hʋ ma aa sɩ nyʋwa wɩya dʋŋ kyɩl ma.
      sbs: 0.6022
      gen_sec: 8.4
      ref_sec: 5.82
      cer: 0.1587
      wer: 0.5909
    bible_00122:
      source: bible
      text: Pɔɔl baa, “Aayɩ, ŋ yaa gyuu rɛ a lɩɩ Taasu, Silisɩya paalʋʋ tɔbal hʋ. Ŋ aa sʋla ɩ rɛ dɩ ɩ
        leŋ dɩ ŋ basɩ wɩya tɩya nala no.”
      sbs: 0.5536
      gen_sec: 11.88
      ref_sec: 11.42
      cer: 0.3409
      wer: 0.6897
    bible_00123:
      source: bible
      text: Deviti fa aa naa wɩɩ hʋ Wɩɩsɩ fa aa kyɛ dɩ ʋ yaa, ʋ wuwo basɩ Krisita sʋʋ tɩyaŋ mɩɩgɩ siiyi
        wɩya rɛ a baa, ‘Wɩɩsɩ bɩ laa nyʋwa vɩya ʋ ta lalɩyabee tɩyaŋ. Ʋ bɩ laa nyʋwa leŋ ʋ teŋbii pɩŋ
        bʋwa tɩyaŋ a pʋwa.’
      sbs: 0.6369
      gen_sec: 23.44
      ref_sec: 14.6
      cer: 0.1883
      wer: 0.5
    bible_00124:
      source: bible
      text: Wɩtɩɩ hʋ aa we á tɩyaŋ, ʋ rɛ tɩŋ á kyo ma gɛɛ. Wɩtɩɩ no sɩ we á tɩyaŋ a kaŋ kɩ mʋ maakyiye
        buloŋ.
      sbs: 0.6011
      gen_sec: 8.84
      ref_sec: 7.64
      cer: 0.3571
      wer: 0.8
    bible_00125:
      source: bible
      text: Ŋ sɩ kɩ yaa wɩkperiye Wɩɩsɩnyuu tɩyaŋ, aŋ kɩ yaa wɩmagɩla mɛ dʋnɩya abee taŋhanyuu tɩyaŋ daha.
        Kyal, diŋ, abee nyʋwɔsɩ sɩ we doŋ.
      sbs: 0.59
      gen_sec: 12.0
      ref_sec: 10.64
      cer: 0.2277
      wer: 0.8333
    bible_00126:
      source: bible
      text: Ɛɛ rɛ Yesu gyɩ bɩl sii kɩ mʋ Gyerusalɛm, a gyɩ mʋ tɩŋ Samaarɩya abee Galili paalʋʋ paga a
        kɩ mʋ.
      sbs: 0.5838
      gen_sec: 7.48
      ref_sec: 6.72
      cer: 0.1486
      wer: 0.5238
    bible_00127:
      source: bible
      text: a lɩɩ molbiye hʋ badɔmɔŋ faŋa, ka Ananiyasɩ sii kaŋ molbikaalɩya hʋ mʋ Yesu kpambɩsɩ hʋ lee.
      sbs: 0.5878
      gen_sec: 7.28
      ref_sec: 5.38
      cer: 0.2973
      wer: 0.8235
    bible_00128:
      source: bible
      text: Ŋ naabalɩya, wɩtɩɩ hʋ á aa gʋnna rɛ á mɛ kpa kɩ daga ma. Ɛɛwɩya ma sɩŋ ʋ tɩyaŋ weliŋ, dɩ ʋ
        yaa á wɩbasɩɩ tɩyaŋ koo dɩ wɩya hʋ á saba tɩya ma tɩyaŋ nɛ.
      sbs: 0.6081
      gen_sec: 12.24
      ref_sec: 12.28
      cer: 0.2252
      wer: 0.7222
    bible_00129:
      source: bible
      text: Dɩ haaŋ mɛ rɛ vɩya ʋ bala, aŋ mɛ bɩl mʋ yal badɩma, ʋ mɛ gyʋʋ ʋ bala hʋ haakye tɩyaŋ nɛ, aŋ
        pɛ yaa sɔŋsɔnnɩ mɛ.”
      sbs: 0.5567
      gen_sec: 9.92
      ref_sec: 8.04
      cer: 0.1481
      wer: 0.4815
    bible_00130:
      source: bible
      text: Á aa kyɛ dɩ á teŋfɩyɛlʋʋ no ko yaa teŋfɩyɛl-piliŋ nɛ, ɛɛ rɛ tɩŋ ŋ sabɩ wɩya no kɩ tɩya ma.
      sbs: 0.5567
      gen_sec: 7.8
      ref_sec: 6.8
      cer: 0.2537
      wer: 0.6667
    bible_00131:
      source: bible
      text: Nala no buloŋ gyɩ yaa anɩɩ baala fi abee balɩya rɛ.
      sbs: 0.6137
      gen_sec: 4.8
      ref_sec: 3.58
      cer: 0.2
      wer: 0.6364
    bible_00132:
      source: bible
      text: Nal hʋ mɛ buloŋ aa sɩ yaa nɩɩfɩyɛlɩɩ mɛ gba tɩya ŋ hatɩnna no tɩyaŋ nɩbiye akuu ʋ aa yaa ŋ
        hatɩnnɩ wɩya, wɩtɩɩ rɛ ŋ basɩ kɩ tɩya ma Wɩɩsɩ kɔnɩ sɩ tuŋ ʋ tɩɩna.”
      sbs: 0.5743
      gen_sec: 12.24
      ref_sec: 14.92
      cer: 0.2066
      wer: 0.6944
    bible_00133:
      source: bible
      text: Ŋ fɩla ŋ tɩɩ rɛ, a kana ŋ teŋbii bɩrɩmɩ ŋ yoŋ. Ŋ yaa gɛɛ rɛ dɩ ŋ ta ko basɩ Wɩɩsɩ wɩweliye
        hʋ tɩya nala teŋ, ka dɩ ŋ tɩɩ bɩ kaŋ tol Wɩɩsɩ koro hʋ tɩyaŋ.
      sbs: 0.6072
      gen_sec: 12.64
      ref_sec: 14.5
      cer: 0.3063
      wer: 0.7368
    bible_00134:
      source: bible
      text: Beewɩya, á tɩɩ kɩɩ gɛɛ rɛ anɩɩ tʋranɩɩ sʋwala aa sʋma, Krisita kpa ma tɩya Wɩɩsɩ. Nyɛ rɛ Wɩɩsɩ
        leŋ á pɩsa gyʋʋ nala hʋ ʋ aa laa kɩ ta, abee nala hʋ aa nyʋgɩsɩ buloŋ tɩyaŋ.
      sbs: 0.5674
      gen_sec: 15.08
      ref_sec: 12.84
      cer: 0.2385
      wer: 0.6216
    bible_00135:
      source: bible
      text: Wɩya hʋ ba aa basɩ Wɩɩsɩ Wiyesi Welii hʋ dee tɩyaŋ, ma ta kɩ kpaa ba waasʋ.
      sbs: 0.5914
      gen_sec: 7.36
      ref_sec: 5.0
      cer: 0.1053
      wer: 0.5294
    bible_00136:
      source: bible
      text: anɩɩ mɩyaŋ Nihuwobiŋ Biye aa kɩɩ gɛɛ. Ŋ bɩ ko dɩ nala tʋma kɩ tɩya ŋ, amɛ nala rɛ ŋ ko dɩ
        ŋ tʋma tɩya, aŋ kpa ŋ mɩɩbol mɛ lenni sʋʋ a laa nala yʋga ta ba wɩbɔmɔ tɩyaŋ.”
      sbs: 0.5982
      gen_sec: 16.52
      ref_sec: 14.44
      cer: 0.2581
      wer: 0.675
    bible_00137:
      source: bible
      text: Dɩ nal kɩdɩgɩ buloŋ nɛ ko kɩ daga wɩdʋŋsɩ Wɩɩsɩ ŋmanɩɩ tɩyaŋ, dɩ ba bee wɩtɩɩ hʋ á Tɩɩna Yesu
        Krisita aa daga ma, abee á wɩɩkyʋwal ŋmanɩɩ hʋ á aa tɩŋ bɩ yaa kɩdɩgɩ,
      sbs: 0.551
      gen_sec: 14.04
      ref_sec: 13.2
      cer: 0.1024
      wer: 0.4571
    bible_00138:
      source: bible
      text: Ɛɛ rɛ Yesu pɩyɛsɩ nala hʋ a baa, “Ɛɛ rɛ Wɩɩsɩ koro hʋ kɩɩ? Bekiŋ nɛ ŋ sɩ kpa ʋ magɩsɩ?
      sbs: 0.5575
      gen_sec: 8.68
      ref_sec: 6.28
      cer: 0.3548
      wer: 0.7619
    bible_00139:
      source: bible
      text: a baa dɩ ba kaŋ Yesu mʋ kpaasɩ mal daagarɩɩ tɩyaŋ.
      sbs: 0.5421
      gen_sec: 4.24
      ref_sec: 3.04
      cer: 0.2051
      wer: 0.6364
    bible_00140:
      source: bible
      text: Ŋ basɩ kɩ tɩya ma rɛ, ba bɩ sɩ lɩɩ ɩ dɩya no tɩyaŋ, see dɩ ɩ tuŋ kyɩŋ hʋ ba aa kere tɩya ɩ
        teŋ.”
      sbs: 0.5789
      gen_sec: 8.8
      ref_sec: 9.72
      cer: 0.2836
      wer: 0.6154
    bible_00141:
      source: bible
      text: Hɛrɔtɩ mɛ bɩ naa ʋ wɩkyogii buloŋ, ɛɛ rɛ tɩŋ ʋ leŋ ba bɩl mɩɩgɩ kana ʋ ko daha. Ma na, baal
        no bɩ yaa wɩɩ buloŋ kyogi a maga dɩ ba kpʋ ʋ.
      sbs: 0.5307
      gen_sec: 11.84
      ref_sec: 10.8
      cer: 0.25
      wer: 0.7059
    bible_00142:
      source: bible
      text: Amɛ nyɛ kɛ, ʋ maga dɩ ma lɩɩ ma tɩɩ wɩya no buloŋ tɩyaŋ nɛ. Ma leŋ baaŋ nayɩ, a leŋ dɔmɔŋ
        fene kyogii, a ta kaŋ tahaa, aŋ leŋ wɩlaama basɩɩ mɛ.
      sbs: 0.6583
      gen_sec: 14.36
      ref_sec: 11.72
      cer: 0.2095
      wer: 0.7576
    bible_00143:
      source: bible
      text: Kaŋ wɩya no buloŋ weliŋ abee tɩdɩgɩ aŋ ta kaŋ wɩkyogii buloŋ a mʋ pele kyɛɛ hʋ á Tɩɩna Yesu
        Krisita aa sɩ mɩɩgɩ ko.
      sbs: 0.5996
      gen_sec: 15.76
      ref_sec: 7.38
      cer: 0.1889
      wer: 0.6
    bible_00144:
      source: bible
      text: Wɩtɩɩ rɛ ŋ basɩ kɩ tɩya ma, doŋ tɩyaŋ nɛ ɩ sɩ we a mʋ pele saŋa hʋ ɩ aa sɩ tuŋ kyɩŋ hʋ ba
        aa kere tɩya ɩ buloŋ teŋ.
      sbs: 0.5411
      gen_sec: 10.52
      ref_sec: 7.5
      cer: 0.2771
      wer: 0.6129
    bible_00145:
      source: bible
      text: Farasiima hʋ aa nɩya anɩɩ Yesu basɩ wɩya lo Sadusiima ba nyʋʋsɩ gyʋʋ kpʋlɩya gɛɛ, ba ko yaa
        nyʋʋdɩgɩ a sii kpa mʋ Yesu lee.
      sbs: 0.5857
      gen_sec: 9.4
      ref_sec: 11.08
      cer: 0.2577
      wer: 0.72
    bible_00146:
      source: bible
      text: “Nala hʋ buloŋ gyɩ aa paa yʋga, ba gyɩ bɩ diye aŋ ka kɩŋ, nala hʋ mɛ gyɩ aa paa mʋhʋ, ba mɛ
        gyɩ bɩ dii buwo.”
      sbs: 0.6102
      gen_sec: 4.36
      ref_sec: 8.38
      cer: 0.6753
      wer: 0.9259
    bible_00147:
      source: bible
      text: Ɛɛwɩya, ma wɩyaalɩya rɛ nala hʋ buloŋ aa laa Yesu wɩya di a we Masidooniya abee Akaaya paalʋʋ
        tɩyaŋ kɩ kyesi.
      sbs: 0.6203
      gen_sec: 12.4
      ref_sec: 7.8
      cer: 0.1724
      wer: 0.8095
    bible_00148:
      source: bible
      text: Mɩyaŋ Pɔɔl aa yaa Yesu Krisita Kpambɩya Wɩɩsɩ kyɛrɩ tɩyaŋ abee á nɩɩnabiye Timoti rɛ saba
        teŋ no kɩ tɩya ma.
      sbs: 0.6106
      gen_sec: 11.12
      ref_sec: 7.06
      cer: 0.2184
      wer: 0.5714
    bible_00149:
      source: bible
      text: Mɩyaŋ Pɔɔl abee Silaasi abee Timoti rɛ sabɩ teŋ no a kɩ tɩya ma Krisitabiisi hʋ buloŋ aa we
        Tesaloniika tɩyaŋ, a yaa á Kuwo Wɩɩsɩ abee á Tɩɩna Yesu Krisita nala. Wɩɩsɩ bɔnyɛ abee ʋ fɩyɛlʋʋ
        sɩ we ma lee.
      sbs: 0.6289
      gen_sec: 24.16
      ref_sec: 14.8
      cer: 0.2264
      wer: 0.7317
    bible_00150:
      source: bible
      text: Nyɛ rɛ Pɔɔl yɩrɩ laalyuwolo nɩhɩyasɩ hʋ kɩdɩgɩ a basɩ tɩya ʋ a baa, “Kaŋ bapʋwasɩbiye no mʋ
        ma nɩhɩyawʋ hʋ lee, ʋ kaŋ wɩɩ rɛ dɩ ʋ basɩ tɩya ʋ.”
      sbs: 0.562
      gen_sec: 12.56
      ref_sec: 8.48
      cer: 0.1389
      wer: 0.5161
    bible_00151:
      source: bible
      text: Ɛɛ mɛ yaŋ daga anɩɩ á gba nyɩya wɩya kɩ tɩya Wɩɩsɩ rɛ, beewɩya á baa ʋ kyisi Krisita sʋʋ tɩyaŋ
        nɛ. Dɩ sʋʋnɩ mɩɩgɩ sii kɔnɩ ko tuwo, ɛɛ kɛ Wɩɩsɩ bɩ kyisi Krisita mɛ sʋʋ tɩyaŋ.
      sbs: 0.6272
      gen_sec: 16.08
      ref_sec: 12.48
      cer: 0.188
      wer: 0.5526
    bible_00152:
      source: bible
      text: Mʋhʋ sʋwaa, dɩ ʋ haaŋ hʋ mɛ ko gyʋʋ. Ʋ kɛ fa bɩ gyɩŋ wɩɩ hʋ aa yaa tɩyaŋ.
      sbs: 0.5726
      gen_sec: 3.68
      ref_sec: 5.36
      cer: 0.6538
      wer: 0.8421
    bible_00153:
      source: bible
      text: Teŋ hʋ ŋ gyɩ aa saba tɩya ma tɩyaŋ, ŋ gyɩ basɩ tɩya ma a baa dɩ ma lɩɩ ma tɩɩ nala hʋ aa yaa
        sɔŋsɔŋ wɩya tɩyaŋ nɛ.
      sbs: 0.5783
      gen_sec: 9.88
      ref_sec: 7.6
      cer: 0.1548
      wer: 0.5172
    bible_00154:
      source: bible
      text: Ʋ sɩ lʋl boyoŋbiye, dɩ ɩ we ʋ feŋ Yesu. Feŋ hʋ memii rɛ yaa Laataal, beewɩya ʋ rɛ sɩ laa ʋ
        nala ta ba wɩbɔmɔ tɩyaŋ.”
      sbs: 0.5754
      gen_sec: 10.52
      ref_sec: 10.82
      cer: 0.2706
      wer: 0.7407
    bible_00155:
      source: bible
      text: Nala hʋ aa kyɛ dɩ ba mʋrɩ ma wɩya rɛ ŋ sabɩ wɩya no kɩ tɩya ma.
      sbs: 0.5822
      gen_sec: 9.12
      ref_sec: 3.72
      cer: 0.3261
      wer: 1.0
    bible_00156:
      source: bible
      text: Ba kasɩ ba a ŋmaa kɩdɩgɩ, a kpʋ kɩdɩgɩ, aŋ yaga kɩdɩgɩ hʋ mɛ abee bʋwa.
      sbs: 0.5618
      gen_sec: 6.6
      ref_sec: 5.84
      cer: 0.0566
      wer: 0.4375
    bible_00157:
      source: bible
      text: Wɩɩ no yaa wɩwelii rɛ a kɩ fɩyɛlɩ Wɩɩsɩ á laataal teŋ mɛ,
      sbs: 0.6085
      gen_sec: 6.56
      ref_sec: 3.44
      cer: 0.2955
      wer: 0.6923
    bible_00158:
      source: bible
      text: beewɩya ɩ kɛ paalɩ gyɩŋ Gyuuma lesiri buloŋ nɛ abee ba wɩkaŋtarɩya buloŋ. Ŋ yaŋ aa sʋla ɩ
        rɛ dɩ ɩ di kenyiri aŋ gyegili nɩɩ ŋ nyʋwa.
      sbs: 0.6036
      gen_sec: 11.64
      ref_sec: 9.28
      cer: 0.2039
      wer: 0.6786
    bible_00159:
      source: bible
      text: Ɛɛ rɛ ma mɛ yaŋ kɩɩ anɩɩ dʋma, ma bɔmɔ rɛ weliŋ, ɛɛwɩya ma bɩ sɩ wuwo basɩ wɩwelii kɩdɩgɩ
        buloŋ. Beewɩya, nihuwobiŋ wɩbasɩɩ tɩyaŋ nɛ ɩ aa gyɩŋ nihuwobiŋ hʋ iriŋ ʋ aa yaa.
      sbs: 0.5998
      gen_sec: 17.64
      ref_sec: 14.86
      cer: 0.2748
      wer: 0.8
    bible_00160:
      source: bible
      text: aŋ sʋla ʋ dɩ ʋ kɛ haa leŋ dɩ nala hʋ buloŋ aa wɩɩlɩ dige ʋ gal nyʋwa. Nala hʋ buloŋ gyɩ aa
        dige ʋ gal nyʋwa, ba buloŋ nɛ gyɩ naa laaŋfɩya.
      sbs: 0.5792
      gen_sec: 10.72
      ref_sec: 14.08
      cer: 0.1553
      wer: 0.4545
    bible_00161:
      source: bible
      text: Akuu lagɩlagɩ no taŋha hʋ aa deye wɩya, dɩ baal lɛ bɩ kpa haaŋ, ʋ rɛ kpɩya.
      sbs: 0.6091
      gen_sec: 9.76
      ref_sec: 5.72
      cer: 0.2857
      wer: 0.7647
    bible_00162:
      source: bible
      text: Wɩfaŋɩɩ buloŋ tuwo dɩ ʋ bɩ sɩ ko lɩɩ lɩgyalɩɩ. Wɩɩ buloŋ mɛ aa we bilhuu tɩyaŋ, ʋ mɛ sɩ ko
        lɩɩ pʋlʋŋ.
      sbs: 0.5744
      gen_sec: 12.24
      ref_sec: 8.4
      cer: 0.2105
      wer: 0.5652
    bible_00163:
      source: bible
      text: Ɛɛwɩya, ŋ kyaŋweliye, ma lɩɩ ma tɩɩ vʋga marɩɩ tɩyaŋ.
      sbs: 0.6496
      gen_sec: 4.96
      ref_sec: 4.6
      cer: 0.2683
      wer: 0.7
    bible_00164:
      source: bible
      text: Amɛ ʋ gyɩ aa yaa gɛɛ rɛ Wɩɩsɩ leŋ ʋ kokumo basɩ ʋ sɩya wɩya tɩya ʋ abee nihuwobiŋ abee kokusi
        aa bee basɩ wɩya buloŋ, ɛɛ leŋ ʋ leŋ ʋ bambugiliŋ hʋ.
      sbs: 0.5302
      gen_sec: 16.04
      ref_sec: 11.76
      cer: 0.4159
      wer: 0.8485
    bible_00165:
      source: bible
      text: Amɛ Gyudɩya paalʋʋ buloŋ tɩyaŋ, Bɛtɩlɛhɛm nala rɛ yaa nɩbala,
      sbs: 0.6302
      gen_sec: 9.04
      ref_sec: 4.4
      cer: 0.3
      wer: 0.7
    bible_00166:
      source: bible
      text: Amɛ ʋ maga dɩ ba kɩ yaa wɩweliye hʋ haana aa kpaa ba tɩɩ tɩya Wɩɩsɩ aa maga dɩ ba kɩ yaa rɛ.
      sbs: 0.5907
      gen_sec: 6.64
      ref_sec: 6.3
      cer: 0.2464
      wer: 0.8696
    bible_00167:
      source: bible
      text: Aŋka paanʋʋ gama bapɛ hʋ mɛ ŋ gyɩ aa kaŋ lɔgɔ lɔgɔ tɩya nala tusi banaa hʋ? Simbiisi baŋmɛ
        rɛ ma gyɩ paa ba kɩkaalɩya hʋ mɛ su?
      sbs: 0.5641
      gen_sec: 9.8
      ref_sec: 10.98
      cer: 0.2245
      wer: 0.6429
    bible_00168:
      source: bible
      text: Yesu ha gyɩ aa basɩ wɩya kɩ tɩya nɩgyamaa hʋ gɛɛ, dɩ ʋ naa abee ʋ naabalɩya ko sɩŋ gyaŋhal
        tɩyaŋ a kɩ kyɛ dɩ ba na ʋ.
      sbs: 0.5794
      gen_sec: 10.36
      ref_sec: 9.14
      cer: 0.1364
      wer: 0.5714
    bible_00169:
      source: bible
      text: 'Ka ba buloŋ tɩyaŋ, wɩɩ hʋ aa yaa wɩɩ rɛ nyɛ: Wɩɩsɩ wɩweliye hʋ rɛ á buloŋ kɩ basɩ. Wɩya hʋ
        ba aa basɩ, ba aa rɛ ŋ mɛ kɩ basɩ. Wɩya no tɩɩ rɛ ma mɛ laa di gɛɛ.'
      sbs: 0.6327
      gen_sec: 16.56
      ref_sec: 12.24
      cer: 0.1062
      wer: 0.525
    bible_00170:
      source: bible
      text: Ʋ sɩya aa gballa, Roma nɩhɩyasɩ hʋ tɩŋ porisi nɩhɩyasɩ dɩ ba mʋ basɩ tɩya nal hʋ aa deŋ nɩtɔdɩya
        hʋ dɩ ʋ lɩɩ Pɔɔl bee Silaasi ta dɩ ba kɩ mʋ.
      sbs: 0.5948
      gen_sec: 14.28
      ref_sec: 11.14
      cer: 0.1852
      wer: 0.5625
    bible_00171:
      source: bible
      text: ‘I bɩ sɩ leŋ dɩ Ɩ Tɩpʋlʋŋ Tɩɩna sʋba a pʋw bʋwa tɩyaŋ.’
      sbs: 0.5511
      gen_sec: 5.64
      ref_sec: 3.38
      cer: 0.25
      wer: 0.8462
    bible_00172:
      source: bible
      text: Kyɛwiyesii hʋ kyɛɛ kɩdɩgɩ Yesu gyɩ aa daga nala Wɩɩsɩ wɩya gyuuma wɩɩkyʋwaldɩya tɩyaŋ nɛ.
      sbs: 0.5611
      gen_sec: 6.72
      ref_sec: 5.74
      cer: 0.2568
      wer: 0.6667
    bible_00173:
      source: bible
      text: Nyɛ rɛ á kyɛ mʋ na Krisitabiisi hʋ aa we doŋ tɩyaŋ, a gyɩ hɔŋ ba lee kyɛyɛ bapɛ. Wɩɩsɩ Wiyesi
        Welii hʋ dee tɩyaŋ, ba gyɩ basɩ tɩya Pɔɔl lɛ dɩ ʋ ta mʋ Gyerusalɛm.
      sbs: 0.5436
      gen_sec: 15.2
      ref_sec: 11.54
      cer: 0.3033
      wer: 0.8056
    bible_00174:
      source: bible
      text: Ɛɛwɩya, ma nala hʋ aa bɩ yaa Gyuuma, ma bɩl bɩ yaa nɩhʋwala koo gyʋgyʋʋlɩya. Nyɛ kɛ, ma bee
        Wɩɩsɩ nala buloŋ yaa bedɩgɩ nala rɛ, a yaa Wɩɩsɩ dɩya nala.
      sbs: 0.5972
      gen_sec: 14.12
      ref_sec: 12.54
      cer: 0.2435
      wer: 0.6774
    bible_00175:
      source: bible
      text: Ma sii mʋ! Ma kɩɩ gɛɛ rɛ anɩɩ pebiisi, ŋ kɩ tɩŋ ma dɩ ma mʋ guwosi gboni tɩyaŋ.
      sbs: 0.5774
      gen_sec: 7.08
      ref_sec: 7.46
      cer: 0.3103
      wer: 0.6842
    bible_00176:
      source: bible
      text: Amɛ baal hʋ aa kaŋ haaŋ, ʋ aa kpa ʋ nyuu buloŋ we dʋnɩya wɩkanɩya tɩyaŋ nɛ, beewɩya ɛɛ hʋ
        ʋ aa sɩ yaa dɩ haaŋ hʋ teŋ fɩyɛlɩ wɩya dʋŋ nɛ aa kyɩla ʋ.
      sbs: 0.5766
      gen_sec: 12.48
      ref_sec: 13.04
      cer: 0.2455
      wer: 0.7714
    bible_00177:
      source: bible
      text: Nal hʋ buloŋ aa haasɩ ʋ dɔŋtɩɩna, ʋ yaa nɩkpʋʋl lɛ Wɩɩsɩ sɩya tɩyaŋ. Na ma yaŋ gyɩma anɩɩ
        nɩkpʋʋl kɛ buloŋ bɩ kaŋ mɩɩbol aa bɩ kaŋ tenii?
      sbs: 0.6167
      gen_sec: 11.32
      ref_sec: 12.24
      cer: 0.3774
      wer: 0.7931
    bible_00178:
      source: bible
      text: Wɩɩ no ŋ aa basɩ yaa wɩtɩɩ rɛ, a maga dɩ nal buloŋ gyɩma ʋ, a laa ʋ di weliŋ.
      sbs: 0.6106
      gen_sec: 6.4
      ref_sec: 5.54
      cer: 0.1636
      wer: 0.55
    bible_00179:
      source: bible
      text: Amɛ nala hʋ aa yaa nɩbala dʋnɩya sɩya tɩyaŋ, ba sɩ maakyiye ko yaa nɩbiisi, ka nala hʋ mɛ
        aa yaa nɩbiisi dʋnɩya sɩya tɩyaŋ ba mɛ sɩ maakyiye ko yaa nɩbala.”
      sbs: 0.5912
      gen_sec: 12.0
      ref_sec: 12.78
      cer: 0.157
      wer: 0.6562
    bible_00180:
      source: bible
      text: Ɛɛ rɛ biye hʋ kuwo basɩ tɩya ʋ a baa, “Ŋ biye, ɩ kɛ we dɩya tɩyaŋ nɛ saŋa buloŋ. Kɩŋ buloŋ
        ŋ aa kana, ɩ rɛ tɩŋa ʋ.
      sbs: 0.5802
      gen_sec: 11.88
      ref_sec: 9.88
      cer: 0.325
      wer: 0.7931
    bible_00181:
      source: bible
      text: Ɛɛ rɛ baga hʋ tɩɩna basɩ tɩya ba kɩdɩgɩ a baa, “Ŋ bagyʋwa gyegile nɩɩ daha, ŋ bɩ firimi ma.
        Na ma laa nyʋwa rɛ anɩɩ ma sɩ tʋma dɩ wɩɩsɩ gyʋʋ, ka dɩ ma laa kyɛdɩgɩ tuno.
      sbs: 0.6046
      gen_sec: 16.84
      ref_sec: 13.66
      cer: 0.264
      wer: 0.7632
    bible_00182:
      source: bible
      text: Ma ta leŋ dɩ nal buloŋ mʋrɩ ma. Dɩ ɩ rɛ yaa nɩtɩɩ aŋ kɩ tɩŋ nɩbɔmɔ hal, ɩ mɛ aa ko ɩ yaa nɩbɔŋ
        nɛ.
      sbs: 0.6134
      gen_sec: 9.76
      ref_sec: 6.58
      cer: 0.2571
      wer: 0.7308
    bible_00183:
      source: bible
      text: Yoŋ hʋ buloŋ aa laa á Tɩɩna Krisita wɩya di, ʋ tɩɩna tɩŋa ʋ tɩɩ rɛ Krisita lee. Ɛɛ tɩɩ rɛ
        nal hʋ fa aa tɩŋa ʋ tɩɩ aŋ na ko laa Krisita wɩya di, ʋ bɩrɩmɩ Krisita yoŋ nɛ.
      sbs: 0.5831
      gen_sec: 14.48
      ref_sec: 13.48
      cer: 0.384
      wer: 0.8
    bible_00184:
      source: bible
      text: Badɔmɔŋ mɛ gyɩ tele bʋnyɩŋ nyuu tɩyaŋ, a pesi nyʋ.
      sbs: 0.5804
      gen_sec: 4.08
      ref_sec: 3.46
      cer: 0.4615
      wer: 0.9
    bible_00185:
      source: bible
      text: Gyuuma badɔmɔŋ mɛ aa lɩɩ Esɩya paalʋʋ mɛ rɛ fa we doŋ. Dɩ ba aa rɛ fa kaŋ wɩɩ buloŋ abeel-ŋ,
        ʋ fa maga dɩ ba tɩɩ ko basɩ rɛ daha tɩyaŋ.
      sbs: 0.5999
      gen_sec: 12.64
      ref_sec: 9.28
      cer: 0.22
      wer: 0.7188
    bible_00186:
      source: bible
      text: Ŋ basɩ kɩ tɩya ma rɛ, haŋ kyɛɛ hʋ, nala balɩya sɩ pɩŋ doo gododɩgɩ tɩyaŋ tebine, dɩ ba kpa
        kɩdɩgɩ aŋ leŋ kɩdɩgɩ ta.
      sbs: 0.5685
      gen_sec: 10.76
      ref_sec: 9.52
      cer: 0.1724
      wer: 0.72
    bible_00187:
      source: bible
      text: Ma pɔ dɩ nal buloŋ ta ko yaa wɩbɔŋ tuŋ ʋ dɔŋtɩɩna. Amɛ saŋa kɛ buloŋ, ma yaa wɩweliye kɩ tɩya
        dɔmɔŋ abee nal buloŋ.
      sbs: 0.5932
      gen_sec: 11.92
      ref_sec: 8.86
      cer: 0.1023
      wer: 0.36
    bible_00188:
      source: bible
      text: a baa, “Saŋa hʋ pele rɛ. Wɩɩsɩ koro hʋ pele rɛ. Ma bɩrɩmɩ lɩɩ ma wɩbɔmɔ tɩyaŋ aŋ laa Wɩɩsɩ
        wɩweliye hʋ di.”
      sbs: 0.5741
      gen_sec: 11.04
      ref_sec: 8.6
      cer: 0.2532
      wer: 0.6522
    bible_00189:
      source: bible
      text: Piita ha fa hɔnɔ rɛ a kaŋ wɩɩ hʋ ʋ fa aa naa hʋ kɩ bɩɩnɩ dɩ ʋ na ʋ memii. Ɛɛ rɛ Wɩɩsɩ Wiyesi
        Welii hʋ basɩ tɩya ʋ a baa, “Deŋ na, baala boto rɛ we daha a kɩ kyɛ ɩ.
      sbs: 0.5863
      gen_sec: 17.0
      ref_sec: 13.34
      cer: 0.2414
      wer: 0.6512
    bible_00190:
      source: bible
      text: Ba kpa kyapɩya a vɩɩrɩ ʋ nyuu tɩyaŋ, a tʋ naŋtʋwɔl we ʋ tɩyaŋ, a tuu gbinni, a tɩya ʋ gyɩrɩma.
      sbs: 0.5145
      gen_sec: 9.04
      ref_sec: 6.66
      cer: 0.2571
      wer: 0.5714
    bible_00191:
      source: bible
      text: Nala badɔmɔŋ mɛ gyɩ sɩŋ doŋ a kɩ deŋ, aŋka Gyuuma nɩhɩyasɩ kɩ yaa ʋ sɩya, a baa, “Na ʋ baa
        ʋ rɛ yaa Krisita hʋ, laataal hʋ Wɩɩsɩ aa lɩya, a laa nala kɩ ta, ma leŋ dɩ ʋ laa ʋ tɩɩ ta dɩ á
        na.”
      sbs: 0.5853
      gen_sec: 17.28
      ref_sec: 13.54
      cer: 0.2815
      wer: 0.7021
    bible_00192:
      source: bible
      text: Akuu ba aa bɩ laa ʋ di wɩya, ʋ gyɩ bɩ yaa wɩmagɩla yʋga doŋ tɩyaŋ.
      sbs: 0.6702
      gen_sec: 21.36
      ref_sec: 6.74
      cer: 0.3061
      wer: 1.25
    bible_00193:
      source: bible
      text: 'Wɩɩ hʋ aa tɩŋ ŋ aa kaŋ namagɩsɩ basɩ wɩya kɩ tɩya ba hʋ rɛ nyɛ: Ba aa deŋ deŋ nɛ aŋ bɩ wuwo
        kɩ na kɩŋ buloŋ, a kɩ gyegili wɩya mɛ aŋ bee nɩɩ wɩɩ buloŋ, aŋ bɩ wuwo kɩ gyɩŋ wɩya memii mɛ.'
      sbs: 0.5751
      gen_sec: 17.32
      ref_sec: 13.9
      cer: 0.2059
      wer: 0.7391
    bible_00194:
      source: bible
      text: beewɩya ma tɩɩ gyɩma rɛ weliŋ anɩɩ kyɛɛ hʋ á Tɩɩna Yesu aa sɩ mɩɩgɩ ko sɩ pirigi ma tɩyaŋ
        gɛɛ anɩɩ gaal aa pirigi ko tebine gɛɛ.
      sbs: 0.6326
      gen_sec: 13.44
      ref_sec: 9.76
      cer: 0.22
      wer: 0.8214
    bible_00195:
      source: bible
      text: Farasiima badɔmɔŋ aa naa gɛɛ, ba pɩyɛsɩ Yesu hatɩnna hʋ a baa, “Bee rɛ tɩŋ ma nɩhɩyawʋ bee
        lampolaala abee wɩbɔŋyaala no buloŋ hɔŋ kɩ di kɩna?”
      sbs: 0.5699
      gen_sec: 12.84
      ref_sec: 10.62
      cer: 0.2321
      wer: 0.8519
    bible_00196:
      source: bible
      text: abee Gyemsi biibaal Gyudasɩ, abee Gyudasɩ Isɩkarɔtɩ, nal hʋ aa ko yaa minaafigi tɩɩna hʋ.
      sbs: 0.5553
      gen_sec: 7.24
      ref_sec: 7.64
      cer: 0.25
      wer: 0.8667
    bible_00197:
      source: bible
      text: Ŋ aa sʋla á Tɩɩna Wɩɩsɩ rɛ dɩ ʋ leŋ dɩ ma marɩ gyɩŋ ʋ bee á Tɩɩna Yesu dɩ gɛɛ leŋ dɩ ʋ fɩyɛlʋʋ
        abee ʋ bɔnyɛ we ma lee weliŋ.
      sbs: 0.5799
      gen_sec: 10.24
      ref_sec: 10.96
      cer: 0.337
      wer: 0.7188
    bible_00198:
      source: bible
      text: Amɛ nala hʋ badɔmɔŋ baa dɩ gyɩŋbɔmɔ kuwori hʋ ba aa yɩrɩ Bɛlizebul lɛ tɩya ʋ dee dɩ ʋ kɩ kile
        gyɩŋbɔmɔ gɛɛ.
      sbs: 0.5469
      gen_sec: 9.0
      ref_sec: 8.2
      cer: 0.2738
      wer: 0.8696
    bible_00199:
      source: bible
      text: “Ŋ sɩ tɩŋ nala aa basɩ taakperiye tɩyaŋ, a basɩ wɩya tɩya ŋ nala, ŋ sɩ tɩŋ nɩhʋwala tɩyaŋ,
        a basɩ wɩya tɩya ŋ nala, ka abee gɛɛ buloŋ mɛ, ba bɩ sɩ gyegile nɩɩ ŋ nyʋwa.”
      sbs: 0.6257
