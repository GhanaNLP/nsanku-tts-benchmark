      ref_sec: 10.82
      cer: 0.1196
      wer: 0.4231
    bible_00050:
      source: bible
      text: Beewɩya dɩ mamaa rɛ kaŋ gyogiweliye no kɩdɩgɩ buloŋ yʋga, ɛɛ rɛ sɩ leŋ dɩ ma marɩ gyɩŋ á Tɩɩna
