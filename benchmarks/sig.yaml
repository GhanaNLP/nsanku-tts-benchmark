      gen_sec: 3.6
      ref_sec: 3.74
      cer: 0.1333
      wer: 0.5625
    bible_00067:
      source: bible
      text: Á bɩ ko ma lee a kɩ kyɛ dɩ ma tɩɩ koo nal kɩdɩgɩ buloŋ bigisi ma.
