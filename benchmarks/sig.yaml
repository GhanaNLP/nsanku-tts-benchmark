      gen_sec: 10.56
      ref_sec: 12.78
      cer: 0.1724
      wer: 0.2222
    bible_00052:
      source: bible
      text: Nal hʋ buloŋ ba aa kpaa kɩna we ʋ nosi tɩyaŋ, ʋ maga dɩ ʋ kɩ deŋ ba nyuu abee wɩtɩɩ rɛ.
