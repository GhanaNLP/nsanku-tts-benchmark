    bible_00056:
      source: bible
      text: Ɛɛ rɛ Yesu pɩyɛsɩ ba a baa, “Ma ha bɩ karɩmɩ wɩɩ hʋ Kuwori Deviti gyɩ aa yaa saŋa hʋ losi
