      ref_sec: 10.36
      cer: 0.5943
      wer: 0.8333
    bible_00065:
      source: bible
      text: Ɛɛ rɛ Yesu yɩrɩ ba, ba guu sii a leŋ ba nɩɩduworiboro hʋ abee ba kuwo buloŋ ta, aŋ tɩŋ Yesu
