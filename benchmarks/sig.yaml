    bible_00077:
      source: bible
      text: Á bɩ sɩ wuwo kyʋwalɩ Wɩɩsɩ teŋ ma wɩya. Á aa kɩ kyʋwalɩ ʋ aŋgyʋwasʋ rɛ weliŋ akuu teŋfɩyɛlʋʋ
        hʋ á aa kana ʋ sɩya tɩyaŋ ma wɩya.
      sbs: 0.715
      gen_sec: 7.28
      ref_sec: 8.44
      cer: 0.0816
      wer: 0.2857
    bible_00078:
      source: bible
      text: Ʋ aa basɩ gɛɛ ko teŋ, nɩhɩyawʋ hʋ basɩ tɩya bapʋwasɩbiye hʋ baa, “Ta ko basɩ wɩɩ no ɩ aa basɩ
        tɩya ŋ, a tɩya nal buloŋ.” Ɛɛ rɛ ka ʋ ta biye hʋ, ʋ mʋ.
      sbs: 0.733
      gen_sec: 8.16
      ref_sec: 12.28
      cer: 0.1226
      wer: 0.4167
    bible_00079:
      source: bible
      text: Wɩya no rɛ aa leŋ nal kaŋ bisiŋ. Amɛ dɩ nal bɩ sɔmɔ ʋ noŋ aŋ di kɩna anɩɩ ma naabaala a daga
        gɛɛ, ɛɛ bɩ sɩ wuwo leŋ dɩ ʋ tɩɩna kaŋ bisiŋ.”
      sbs: 0.7189
      gen_sec: 7.55
      ref_sec: 12.24
      cer: 0.1089
      wer: 0.3529
    bible_00080:
      source: bible
      text: Badɔmɔŋ mɛ tele bʋnyɩŋ tɩyaŋ, a nyʋ aŋ sʋba, beewɩya fɩyɛl gyɩ tuwo doŋ.
      sbs: 0.7167
      gen_sec: 4.21
      ref_sec: 6.1
      cer: 0.0893
      wer: 0.4286
    bible_00081:
      source: bible
      text: Dɩ ɩ rɛ tɩŋ dʋnɩya no buloŋ, aŋka dɩ ɩ bɩ sɩ na mɩɩbol hʋ aa bɩ kaŋ tenii, bekiŋ tɔnɔ rɛ ɩ
        na?
      sbs: 0.7271
      gen_sec: 5.24
      ref_sec: 6.2
      cer: 0.2206
      wer: 0.625
    bible_00082:
      source: bible
      text: Ba aa nɩɩ wɩya no, ba bɩl bɩ wuwo basɩ wɩɩ buloŋ. Nyɛ rɛ ba dannɩ Wɩɩsɩ a baa, “Wɩɩsɩ tɩya
        nala mɛ aa bɩ yaa Gyuuma ŋmanɩɩ rɛ dɩ ba mɛ wuwo bɩrɩmɩ lɩɩ ba wɩbɔmɔ tɩyaŋ, aŋ kaŋ mɩɩbol hʋ
        aa bɩ kaŋ tenii.”
      sbs: 0.7111
      gen_sec: 11.24
      ref_sec: 14.0
      cer: 0.0733
      wer: 0.3261
    bible_00083:
      source: bible
      text: “Ŋ biye, ɩ sɩ yaa Wɩɩbal hʋ tɩŋdaal
      sbs: 0.6877
      gen_sec: 2.16
      ref_sec: 3.46
      cer: 0.1538
      wer: 0.5
    bible_00084:
      source: bible
      text: Krisita aa sʋba daagarɩɩ hʋ tɩyaŋ wɩya, ʋ leŋ ba dɔŋdɔŋ hʋ teŋ nɛ. Ʋ aa yaa gɛɛ, ʋ leŋ ba
        buloŋ balɩya tɩŋa ʋ tɩyaŋ nɛ a ko yaa kɩdɩgɩ, aŋ kaŋ ba bee Wɩɩsɩ mɛ we dɔmɔŋ ba yaa sʋma.
      sbs: 0.6868
      gen_sec: 9.98
      ref_sec: 13.84
      cer: 0.097
      wer: 0.3095
    bible_00085:
      source: bible
      text: Beewɩya ba sɩ na gɛɛ ma gyogo aa weliye abee gɛɛ ma aa fá Wɩɩsɩ.
      sbs: 0.7065
      gen_sec: 3.76
      ref_sec: 5.0
      cer: 0.0816
      wer: 0.4
    bible_00086:
      source: bible
      text: Nɩɩfori kɩdɩgɩ rɛ we doŋ ba aa sɩ fo ŋ. Dɩ ba aa rɛ bɩ foo ŋ teŋ, ŋ hakɩla bɩ sɩ pɩŋ lɩdɩgɩ.
      sbs: 0.7217
      gen_sec: 5.08
      ref_sec: 8.68
      cer: 0.1515
      wer: 0.5417
    bible_00087:
      source: bible
      text: Ɛɛ rɛ tɩŋ abee ma aa gyɩŋ wɩya no buloŋ a sɩŋ wɩtɩɩ hʋ ba aa daga ma tɩyaŋ weliŋ mɛ, amɛ ŋ
        ha sɩ kɩ liisi ma wɩya no saŋa kɛ buloŋ.
      sbs: 0.7033
      gen_sec: 7.28
      ref_sec: 11.38
      cer: 0.0825
      wer: 0.4242
    bible_00088:
      source: bible
      text: Ɛɛwɩya, nal hʋ aa wuwo kɩ basɩ taakperiye Wiyesi Welii hʋ dee tɩyaŋ, ʋ tɩɩna maga dɩ ʋ sʋla
        Wɩɩsɩ rɛ dɩ ʋ leŋ ʋ wuwo kɩ daga wɩya hʋ ʋ aa basɩ memii.
      sbs: 0.7116
      gen_sec: 8.43
      ref_sec: 10.2
      cer: 0.1416
      wer: 0.3824
    bible_00089:
      source: bible
      text: Ʋ sɩya gyɩ kɩɩ gɛɛ rɛ anɩɩ duwoŋ aa lɩgɩsa, aŋka ʋ gannɩ mɛ pʋrɩsɩ gɛɛ kpil kpil.
      sbs: 0.6749
      gen_sec: 4.72
      ref_sec: 6.32
      cer: 0.1452
      wer: 0.5
    bible_00090:
      source: bible
      text: Kyɛɛ kɩdɩgɩ wɩɩhaa anɩɩ kerifi boto saŋa, Kɔniiliyo na ʋ duwoso tɩyaŋ dɩ malɩka kɩdɩgɩ ko
        gyʋʋ yɩrɩ ʋ, “Kɔniiliyo.”
      sbs: 0.7025
      gen_sec: 6.79
      ref_sec: 8.56
      cer: 0.1209
      wer: 0.45
    bible_00091:
      source: bible
      text: Ɛɛ rɛ ka nɩgyamaa nɩɩ á Tɩɩna Yesu wɩya haŋ paalʋʋ hʋ tɩyaŋ buloŋ.
      sbs: 0.6953
      gen_sec: 3.73
      ref_sec: 5.1
      cer: 0.1731
      wer: 0.3571
    bible_00092:
      source: bible
      text: Krisita pɛɛ á kɩdɩgɩ buloŋ tɩyaŋ nɛ a kpa ʋ bɔnyɛ kɩna tɩya ma a maga gɛɛ ʋ aa kyo.
      sbs: 0.6937
      gen_sec: 4.76
      ref_sec: 5.28
      cer: 0.0952
      wer: 0.5
    bible_00093:
      source: bible
      text: Yesu aa basɩ gɛɛ ko teŋ, Wɩɩsɩ kpa ʋ kaŋ gyɩŋ wɩɩsɩbee, ka ʋ kpambɩsɩ hʋ sɩŋ wil nyuni kɩ
        deŋ wɩɩsɩnyuu. Nyɛ rɛ taal ko tɔ ʋ, ba bɩl bɩ na ʋ.
      sbs: 0.7031
      gen_sec: 7.54
      ref_sec: 10.28
      cer: 0.1923
      wer: 0.5455
    bible_00094:
      source: bible
      text: Ɛɛ rɛ Yesu bɩl sii doŋ a kpa tɩŋ Galili fuwo hʋ dɩɩlaŋ kɩ mʋ, a mʋ gyɩŋ hɔŋ dogimo kɩdɩgɩ
        nyuu tɩyaŋ.
      sbs: 0.6703
      gen_sec: 5.68
      ref_sec: 8.38
      cer: 0.0909
      wer: 0.3478
    bible_00095:
      source: bible
      text: Ma na, Wɩɩsɩ yaa siri abee ʋ saa rɛ dɩ ʋ ŋmaŋ tɩɩsɩ lo. Tɩya hʋ buloŋ aa bee nɔŋ nɔŋweliye,
        ʋ sɩ ŋmana ʋ lo a paa we diŋ tɩyaŋ.
      sbs: 0.6867
      gen_sec: 7.05
      ref_sec: 11.06
      cer: 0.1828
      wer: 0.5484
    bible_00096:
      source: bible
      text: Ʋ yaa gɛɛ rɛ dɩ wɩya hʋ Wɩɩsɩ gyɩ aa tɩŋ ʋ tɩŋdaal Azaaya tɩyaŋ a basɩ ko yaa wɩtɩɩ. Ʋ gyɩ
        baa,
      sbs: 0.6873
      gen_sec: 5.39
      ref_sec: 7.88
      cer: 0.1831
      wer: 0.7391
    bible_00097:
      source: bible
      text: Ɛɛwɩya, ma aa laa Yesu Krisita di a kpa ʋ ʋ yaa ma Tɩɩna nyɛ, ma leŋ dɩ ma beel-ʋ kɩŋ yaa
        kɩdɩgɩ ma wɩyaalɩya buloŋ tɩyaŋ.
      sbs: 0.698
      gen_sec: 6.7
      ref_sec: 9.54
      cer: 0.0652
      wer: 0.4444
    bible_00098:
      source: bible
      text: Malɩkasɩ hʋ aa mɩɩgɩ mʋ wɩɩsɩbee ko teŋ, pedaala hʋ basɩ tɩya dɔmɔŋ a baa, “Ma leŋ dɩ á mʋ
        Bɛtɩlɛhɛm, a na wɩɩ hʋ á Tɩɩna Wɩɩsɩ aa leŋ ʋ malɩkasɩ hʋ ko basɩ tɩya ma.”
      sbs: 0.7066
      gen_sec: 9.32
      ref_sec: 12.78
      cer: 0.25
      wer: 0.6757
    bible_00099:
      source: bible
      text: 'Saŋa hʋ Yesu gyɩ aa piili ʋ tʋma hʋ, dɩ ʋ gyɩ yaa bɩsɩ mɔlɩya abee fi rɛ. Nala gyɩ bɩɩna
        anɩɩ Gyosɛfʋ rɛ lʋl Yesu. Nyɛ rɛ Yesu doho tɩŋa: Gyosɛfʋ kuwo feŋ nɛ yaa Heli.'
      sbs: 0.6835
      gen_sec: 9.2
      ref_sec: 13.28
      cer: 0.127
      wer: 0.4595
    bible_00100:
      source: bible
      text: Baala no balɩya tɩyaŋ, ba kɩdɩgɩ buloŋ bɩ wuwo tuŋ kyɩŋ hʋ. Ɛɛ rɛ kɩna tɩɩna hʋ kpa kyɩma
        hʋ a kyɛ ba buloŋ balɩya. Baala no balɩya tɩyaŋ, ba kɩbee rɛ sɩ kyo kɩna tɩɩna hʋ wɩya yʋga?”
      sbs: 0.7307
      gen_sec: 10.36
      ref_sec: 12.64
      cer: 0.0791
      wer: 0.2821
    bible_00101:
      source: bible
      text: Ŋ aa tɩma ʋ rɛ ma lee dɩ ʋ leŋ ma gyɩŋ gɛɛ ba aa kɩya á tɩyaŋ, ka dɩ ʋ basɩ wɩya tɩya ma dɩ
        ma tenni polli.
      sbs: 0.701
      gen_sec: 5.86
      ref_sec: 8.32
      cer: 0.2078
      wer: 0.5862
    bible_00102:
      source: bible
      text: Amɛ wɩɩ hʋ aa we doŋ nɛ nyɛ, Wɩɩsɩ marɩ nihuwobiŋ logimo buloŋ nɛ a leŋ ba kɩdɩgɩ buloŋ we
        lee hʋ ʋ aa kyɛ gɛɛ.
      sbs: 0.7008
      gen_sec: 6.32
      ref_sec: 7.8
      cer: 0.2738
      wer: 0.6538
    bible_00103:
      source: bible
      text: Ma fa kɩɩ gɛɛ rɛ anɩɩ piyese aa nyʋgɩsa, amɛ nyɛ kɛ ma mɩɩgɩ ko Pedaal hʋ lee rɛ, nal hʋ aa
        deŋ ma mɩɩbol nyuu tɩyaŋ.
      sbs: 0.705
      gen_sec: 6.34
      ref_sec: 12.26
      cer: 0.1932
      wer: 0.4074
    bible_00104:
      source: bible
      text: Amɛ ba gyɩ bɩ naa wɩɩ buloŋ ba aa sɩ nyɩya tɩya ʋ. Haalɩ nala yʋga gyɩ ko nyɩya wɩya tɩya
        ʋ, amɛ ba bɩ naa wɩɩ buloŋ ʋ aa yaa kyogi a maga dɩ ba kpʋ ʋ.
      sbs: 0.7056
      gen_sec: 8.24
      ref_sec: 12.18
      cer: 0.1171
      wer: 0.5526
    bible_00105:
      source: bible
      text: Alahadi kyɛɛ kɛ buloŋ, molbiye hʋ ma kɩdɩgɩ buloŋ aa tʋma a na yɔbɔ hʋ paga tɩyaŋ, nal buloŋ
        lɩɩ maga gɛɛ ɩ aa wuwo dɩ ba kpa kɩ biŋ. Dɩ mɩyaŋ nɛ ko ko, ma bɩl bɩ sɩ kɩ kɩyɛsɩ molbiye.
      sbs: 0.6983
      gen_sec: 10.32
      ref_sec: 14.7
      cer: 0.058
      wer: 0.3571
    bible_00106:
      source: bible
      text: Nahɔ mɛ kuwo feŋ nɛ yaa Sɛrugu. Sɛrugu mɛ kuwo feŋ nɛ yaa Ruu. Ruu mɛ kuwo feŋ nɛ yaa Pɛlɛgɩ.
        Pɛlɛgɩ mɛ kuwo feŋ nɛ yaa Iiba. Iiba mɛ kuwo feŋ nɛ yaa Sɛla.
      sbs: 0.7179
      gen_sec: 8.72
      ref_sec: 12.82
      cer: 0.2155
      wer: 0.5143
    bible_00107:
      source: bible
      text: Amɛ ŋ basɩ kɩ tɩya ma rɛ, ma kyo ma dɔmɔ aŋ kyʋwalɩ Wɩɩsɩ kɩ tɩya nala hʋ mɛ aa dɔgɩsɩ ma.
      sbs: 0.7199
      gen_sec: 4.89
      ref_sec: 5.42
      cer: 0.1493
      wer: 0.5
    bible_00108:
      source: bible
      text: Wɩɩsɩ dɩya bee vʋga bɩ sɩ wuwo pɛ wɩɩ buloŋ tɩyaŋ, beewɩya, ámaa rɛ yaa Wɩɩweyi hʋ dɩya. Wɩɩsɩ
        tɩɩ basɩ ʋ teŋ tɩyaŋ nɛ a baa,
      sbs: 0.731
      gen_sec: 7.16
      ref_sec: 8.4
      cer: 0.2421
      wer: 0.6667
    bible_00109:
      source: bible
      text: Ɛɛwɩya, á mɛ laŋŋa rɛ, a vʋʋlɩ. Á naa dɩ ʋ yaa wɩwelii rɛ a tɩya ma, dɩ á lɩɩ nala a tɩŋ ba
        ma lee. Ba bee á kyaŋsɩ Banabaasɩ bee Pɔɔl lɛ sɩ ko.
      sbs: 0.714
      gen_sec: 7.74
      ref_sec: 12.94
      cer: 0.2233
      wer: 0.5278
    bible_00110:
      source: bible
      text: Ɛɛ hʋ ma aa daga ma tɩɩ hʋ bɩ weliye. Ma bɩ gyɩma anɩɩ sɩbʋl mʋhʋ rɛ ba aa kpa we paanʋʋ muŋ
        tɩyaŋ, ka ʋ sii pʋwarɩ a yʋga gɛɛ?
      sbs: 0.709
      gen_sec: 7.04
      ref_sec: 8.38
      cer: 0.1596
      wer: 0.5806
    bible_00111:
      source: bible
      text: (Gyudasɩ gyɩ yaa wɩbɔŋ nɛ, a na molbiye doŋ a kpa yɔbɔ taŋha kɩdɩgɩ. Haŋ taŋha hʋ tɩyaŋ nɛ
        ʋ tele pɔsɔ, ʋ nabolimo buloŋ lɩɩ gyaasɩ.
      sbs: 0.7071
      gen_sec: 7.6
      ref_sec: 10.04
      cer: 0.1089
      wer: 0.4815
    bible_00112:
      source: bible
      text: Ɛɛ rɛ ʋ ko gyʋʋ a kaŋ haaŋ hʋ noŋ tɩyaŋ a kaŋ tarɩ ʋ sii sɩŋ. Ʋ teŋnɩma hʋ pirigi nyʋgɩsɩ,
        ka ʋ sii yaa kɩdiiliye tɩya ba.
      sbs: 0.6905
      gen_sec: 6.69
      ref_sec: 10.44
      cer: 0.1209
      wer: 0.3793
    bible_00113:
      source: bible
      text: Ba aa karɩma teŋ hʋ, wɩya hʋ buloŋ ba aa saba yaa ba teŋfɩyɛlʋʋ rɛ. Ba tenni buloŋ polli.
      sbs: 0.7066
      gen_sec: 5.16
      ref_sec: 7.02
      cer: 0.0735
      wer: 0.4737
    bible_00114:
      source: bible
      text: Á gyɩma anɩɩ Wɩɩsɩ aa yaŋ kyisi á Tɩɩna Yesu sʋʋ tɩyaŋ gɛɛ, ɛɛ tɩɩ rɛ ʋ sɩ kyisi ma mɛ sʋʋ
        tɩyaŋ, dɩ á bee Yesu buloŋ kaŋ mɩɩbol, ka dɩ ʋ kaŋ á beel-ma buloŋ mʋ Wɩɩsɩ sɩya.
      sbs: 0.6893
      gen_sec: 9.58
      ref_sec: 11.62
      cer: 0.1406
      wer: 0.475
    bible_00115:
      source: bible
      text: Amɛ á kɛ kɩɩ gɛɛ rɛ anɩɩ viini, Wɩɩsɩ kpa wɩweliye no a we á tɩyaŋ. Nyɛ yaŋ daga anɩɩ debal
        hʋ aa we á tɩyaŋ yaa Wɩɩsɩ kɩŋ nɛ; á tɩɩ dee daa.
      sbs: 0.711
      gen_sec: 7.84
      ref_sec: 10.32
      cer: 0.25
      wer: 0.6176
    bible_00116:
      source: bible
      text: Ma kɩ bara doo a kɩ sʋla Wɩɩsɩ aŋ kɩ pɔ dɩ Sɩtaanɩ ta wuwo mʋrɩ ma. Ma tɩɩsɩ tɩyaŋ ma kyo
        dɩ ma tɩŋa ŋ nyʋwa rɛ, amɛ ma tɩɩ bɩ kaŋ ɛɛ dee.”
      sbs: 0.7229
      gen_sec: 7.68
      ref_sec: 11.72
      cer: 0.1089
      wer: 0.2857
    bible_00117:
      source: bible
      text: “Ŋ Kuwo, dɩ ʋ ko yaa ɩ kyɛrɩ, lɩɩ ŋ tʋwara no aa ko tɩyaŋ. Amɛ mɩyaŋ kɛ kyɛrɩ daa, leŋ dɩ
        ɩ kyɛrɩ yaa.”
      sbs: 0.7355
      gen_sec: 5.62
      ref_sec: 9.6
      cer: 0.0972
      wer: 0.48
    bible_00118:
      source: bible
      text: Amɛ ŋ sɩ laa sɩya na tʋwara, ka dɩ ma gyɩnaŋ nala ha vɩya ŋ.
      sbs: 0.7278
      gen_sec: 3.44
      ref_sec: 5.16
      cer: 0.1136
      wer: 0.8
    bible_00119:
      source: bible
      text: Dʋnɩya bayuwo kɩna daa á kaŋ kɩ lʋga á lʋgʋ, amɛ Wɩɩsɩ tɩɩ dee rɛ ʋ kpa tɩya ma, a wuwo kpa
        yuwo kɩ di Sɩtaanɩ leye hʋ buloŋ ʋ aa kaŋ dee tɩyaŋ.
      sbs: 0.7163
      gen_sec: 8.08
      ref_sec: 10.7
      cer: 0.2222
      wer: 0.6176
    bible_00120:
      source: bible
      text: Koo á aa kyɛ dɩ á yaa dɩ Wɩɩsɩ baaŋ sii rɛ? Koo á bɩɩna anɩɩ ámaa rɛ kaŋ dee te Wɩɩsɩ?
      sbs: 0.7216
      gen_sec: 4.84
      ref_sec: 7.14
      cer: 0.2381
      wer: 0.7273
    bible_00121:
      source: bible
      text: Ɛɛwɩya, ma ta leŋ dɩ kɩna hʋ ma aa sɩ di abee kɩna hʋ ma aa sɩ nyʋwa wɩya dʋŋ kyɩl ma.
      sbs: 0.7283
      gen_sec: 4.84
      ref_sec: 5.82
      cer: 0.1429
      wer: 0.5909
    bible_00122:
      source: bible
      text: Pɔɔl baa, “Aayɩ, ŋ yaa gyuu rɛ a lɩɩ Taasu, Silisɩya paalʋʋ tɔbal hʋ. Ŋ aa sʋla ɩ rɛ dɩ ɩ
        leŋ dɩ ŋ basɩ wɩya tɩya nala no.”
      sbs: 0.6822
      gen_sec: 6.8
      ref_sec: 11.42
      cer: 0.1818
      wer: 0.6552
    bible_00123:
      source: bible
      text: Deviti fa aa naa wɩɩ hʋ Wɩɩsɩ fa aa kyɛ dɩ ʋ yaa, ʋ wuwo basɩ Krisita sʋʋ tɩyaŋ mɩɩgɩ siiyi
        wɩya rɛ a baa, ‘Wɩɩsɩ bɩ laa nyʋwa vɩya ʋ ta lalɩyabee tɩyaŋ. Ʋ bɩ laa nyʋwa leŋ ʋ teŋbii pɩŋ
        bʋwa tɩyaŋ a pʋwa.’
      sbs: 0.6853
      gen_sec: 11.21
      ref_sec: 14.6
      cer: 0.1558
      wer: 0.5652
    bible_00124:
      source: bible
      text: Wɩtɩɩ hʋ aa we á tɩyaŋ, ʋ rɛ tɩŋ á kyo ma gɛɛ. Wɩtɩɩ no sɩ we á tɩyaŋ a kaŋ kɩ mʋ maakyiye
        buloŋ.
      sbs: 0.7018
      gen_sec: 5.36
      ref_sec: 7.64
      cer: 0.1571
      wer: 0.36
    bible_00125:
      source: bible
      text: Ŋ sɩ kɩ yaa wɩkperiye Wɩɩsɩnyuu tɩyaŋ, aŋ kɩ yaa wɩmagɩla mɛ dʋnɩya abee taŋhanyuu tɩyaŋ daha.
        Kyal, diŋ, abee nyʋwɔsɩ sɩ we doŋ.
      sbs: 0.7029
      gen_sec: 7.56
      ref_sec: 10.64
      cer: 0.1386
      wer: 0.5
    bible_00126:
      source: bible
      text: Ɛɛ rɛ Yesu gyɩ bɩl sii kɩ mʋ Gyerusalɛm, a gyɩ mʋ tɩŋ Samaarɩya abee Galili paalʋʋ paga a
        kɩ mʋ.
      sbs: 0.7107
      gen_sec: 5.36
      ref_sec: 6.72
      cer: 0.027
      wer: 0.4286
    bible_00127:
      source: bible
      text: a lɩɩ molbiye hʋ badɔmɔŋ faŋa, ka Ananiyasɩ sii kaŋ molbikaalɩya hʋ mʋ Yesu kpambɩsɩ hʋ lee.
      sbs: 0.6957
      gen_sec: 5.44
      ref_sec: 5.38
      cer: 0.1216
      wer: 0.5294
    bible_00128:
      source: bible
      text: Ŋ naabalɩya, wɩtɩɩ hʋ á aa gʋnna rɛ á mɛ kpa kɩ daga ma. Ɛɛwɩya ma sɩŋ ʋ tɩyaŋ weliŋ, dɩ ʋ
        yaa á wɩbasɩɩ tɩyaŋ koo dɩ wɩya hʋ á saba tɩya ma tɩyaŋ nɛ.
      sbs: 0.6932
      gen_sec: 8.36
      ref_sec: 12.28
      cer: 0.1802
      wer: 0.4722
    bible_00129:
      source: bible
      text: Dɩ haaŋ mɛ rɛ vɩya ʋ bala, aŋ mɛ bɩl mʋ yal badɩma, ʋ mɛ gyʋʋ ʋ bala hʋ haakye tɩyaŋ nɛ, aŋ
        pɛ yaa sɔŋsɔnnɩ mɛ.”
      sbs: 0.712
      gen_sec: 6.22
      ref_sec: 8.04
      cer: 0.2099
      wer: 0.4815
    bible_00130:
      source: bible
      text: Á aa kyɛ dɩ á teŋfɩyɛlʋʋ no ko yaa teŋfɩyɛl-piliŋ nɛ, ɛɛ rɛ tɩŋ ŋ sabɩ wɩya no kɩ tɩya ma.
      sbs: 0.6885
      gen_sec: 5.01
      ref_sec: 6.8
      cer: 0.1045
      wer: 0.5238
    bible_00131:
      source: bible
      text: Nala no buloŋ gyɩ yaa anɩɩ baala fi abee balɩya rɛ.
      sbs: 0.7143
      gen_sec: 3.08
      ref_sec: 3.58
      cer: 0.175
      wer: 0.6364
    bible_00132:
      source: bible
      text: Nal hʋ mɛ buloŋ aa sɩ yaa nɩɩfɩyɛlɩɩ mɛ gba tɩya ŋ hatɩnna no tɩyaŋ nɩbiye akuu ʋ aa yaa ŋ
        hatɩnnɩ wɩya, wɩtɩɩ rɛ ŋ basɩ kɩ tɩya ma Wɩɩsɩ kɔnɩ sɩ tuŋ ʋ tɩɩna.”
      sbs: 0.7155
      gen_sec: 9.0
      ref_sec: 14.92
      cer: 0.0579
      wer: 0.3889
    bible_00133:
      source: bible
      text: Ŋ fɩla ŋ tɩɩ rɛ, a kana ŋ teŋbii bɩrɩmɩ ŋ yoŋ. Ŋ yaa gɛɛ rɛ dɩ ŋ ta ko basɩ Wɩɩsɩ wɩweliye
        hʋ tɩya nala teŋ, ka dɩ ŋ tɩɩ bɩ kaŋ tol Wɩɩsɩ koro hʋ tɩyaŋ.
      sbs: 0.708
      gen_sec: 8.35
      ref_sec: 14.5
      cer: 0.0991
      wer: 0.2632
    bible_00134:
      source: bible
      text: Beewɩya, á tɩɩ kɩɩ gɛɛ rɛ anɩɩ tʋranɩɩ sʋwala aa sʋma, Krisita kpa ma tɩya Wɩɩsɩ. Nyɛ rɛ Wɩɩsɩ
        leŋ á pɩsa gyʋʋ nala hʋ ʋ aa laa kɩ ta, abee nala hʋ aa nyʋgɩsɩ buloŋ tɩyaŋ.
      sbs: 0.6968
      gen_sec: 9.59
      ref_sec: 12.84
      cer: 0.1154
      wer: 0.4054
    bible_00135:
      source: bible
      text: Wɩya hʋ ba aa basɩ Wɩɩsɩ Wiyesi Welii hʋ dee tɩyaŋ, ma ta kɩ kpaa ba waasʋ.
      sbs: 0.7144
      gen_sec: 4.36
      ref_sec: 5.0
      cer: 0.1579
      wer: 0.5294
    bible_00136:
      source: bible
      text: anɩɩ mɩyaŋ Nihuwobiŋ Biye aa kɩɩ gɛɛ. Ŋ bɩ ko dɩ nala tʋma kɩ tɩya ŋ, amɛ nala rɛ ŋ ko dɩ
        ŋ tʋma tɩya, aŋ kpa ŋ mɩɩbol mɛ lenni sʋʋ a laa nala yʋga ta ba wɩbɔmɔ tɩyaŋ.”
      sbs: 0.7346
      gen_sec: 9.32
      ref_sec: 14.44
      cer: 0.0968
      wer: 0.375
    bible_00137:
      source: bible
      text: Dɩ nal kɩdɩgɩ buloŋ nɛ ko kɩ daga wɩdʋŋsɩ Wɩɩsɩ ŋmanɩɩ tɩyaŋ, dɩ ba bee wɩtɩɩ hʋ á Tɩɩna Yesu
        Krisita aa daga ma, abee á wɩɩkyʋwal ŋmanɩɩ hʋ á aa tɩŋ bɩ yaa kɩdɩgɩ,
      sbs: 0.6813
      gen_sec: 9.37
      ref_sec: 13.2
      cer: 0.1496
      wer: 0.6571
    bible_00138:
      source: bible
      text: Ɛɛ rɛ Yesu pɩyɛsɩ nala hʋ a baa, “Ɛɛ rɛ Wɩɩsɩ koro hʋ kɩɩ? Bekiŋ nɛ ŋ sɩ kpa ʋ magɩsɩ?
      sbs: 0.69
      gen_sec: 4.8
      ref_sec: 6.28
      cer: 0.2097
      wer: 0.6667
    bible_00139:
      source: bible
      text: a baa dɩ ba kaŋ Yesu mʋ kpaasɩ mal daagarɩɩ tɩyaŋ.
      sbs: 0.7034
      gen_sec: 3.0
      ref_sec: 3.04
      cer: 0.0769
      wer: 0.1818
    bible_00140:
      source: bible
      text: Ŋ basɩ kɩ tɩya ma rɛ, ba bɩ sɩ lɩɩ ɩ dɩya no tɩyaŋ, see dɩ ɩ tuŋ kyɩŋ hʋ ba aa kere tɩya ɩ
        teŋ.”
      sbs: 0.7129
      gen_sec: 5.24
      ref_sec: 9.72
      cer: 0.1642
      wer: 0.4615
    bible_00141:
      source: bible
      text: Hɛrɔtɩ mɛ bɩ naa ʋ wɩkyogii buloŋ, ɛɛ rɛ tɩŋ ʋ leŋ ba bɩl mɩɩgɩ kana ʋ ko daha. Ma na, baal
        no bɩ yaa wɩɩ buloŋ kyogi a maga dɩ ba kpʋ ʋ.
      sbs: 0.6527
      gen_sec: 7.56
      ref_sec: 10.8
      cer: 0.07
      wer: 0.5588
    bible_00142:
      source: bible
      text: Amɛ nyɛ kɛ, ʋ maga dɩ ma lɩɩ ma tɩɩ wɩya no buloŋ tɩyaŋ nɛ. Ma leŋ baaŋ nayɩ, a leŋ dɔmɔŋ
        fene kyogii, a ta kaŋ tahaa, aŋ leŋ wɩlaama basɩɩ mɛ.
      sbs: 0.7224
      gen_sec: 7.96
      ref_sec: 11.72
      cer: 0.1048
      wer: 0.4242
    bible_00143:
      source: bible
      text: Kaŋ wɩya no buloŋ weliŋ abee tɩdɩgɩ aŋ ta kaŋ wɩkyogii buloŋ a mʋ pele kyɛɛ hʋ á Tɩɩna Yesu
        Krisita aa sɩ mɩɩgɩ ko.
      sbs: 0.6913
      gen_sec: 6.63
      ref_sec: 7.38
      cer: 0.1222
      wer: 0.4
    bible_00144:
      source: bible
      text: Wɩtɩɩ rɛ ŋ basɩ kɩ tɩya ma, doŋ tɩyaŋ nɛ ɩ sɩ we a mʋ pele saŋa hʋ ɩ aa sɩ tuŋ kyɩŋ hʋ ba
        aa kere tɩya ɩ buloŋ teŋ.
      sbs: 0.7013
      gen_sec: 6.32
      ref_sec: 7.5
      cer: 0.241
      wer: 0.5161
    bible_00145:
      source: bible
      text: Farasiima hʋ aa nɩya anɩɩ Yesu basɩ wɩya lo Sadusiima ba nyʋʋsɩ gyʋʋ kpʋlɩya gɛɛ, ba ko yaa
        nyʋʋdɩgɩ a sii kpa mʋ Yesu lee.
      sbs: 0.7111
      gen_sec: 6.69
      ref_sec: 11.08
      cer: 0.1237
      wer: 0.36
    bible_00146:
      source: bible
      text: “Nala hʋ buloŋ gyɩ aa paa yʋga, ba gyɩ bɩ diye aŋ ka kɩŋ, nala hʋ mɛ gyɩ aa paa mʋhʋ, ba mɛ
        gyɩ bɩ dii buwo.”
      sbs: 0.693
      gen_sec: 5.97
      ref_sec: 8.38
      cer: 0.1429
      wer: 0.4074
    bible_00147:
      source: bible
      text: Ɛɛwɩya, ma wɩyaalɩya rɛ nala hʋ buloŋ aa laa Yesu wɩya di a we Masidooniya abee Akaaya paalʋʋ
        tɩyaŋ kɩ kyesi.
      sbs: 0.7186
      gen_sec: 6.15
      ref_sec: 7.8
      cer: 0.1149
      wer: 0.5714
    bible_00148:
      source: bible
      text: Mɩyaŋ Pɔɔl aa yaa Yesu Krisita Kpambɩya Wɩɩsɩ kyɛrɩ tɩyaŋ abee á nɩɩnabiye Timoti rɛ saba
        teŋ no kɩ tɩya ma.
      sbs: 0.7162
      gen_sec: 6.4
      ref_sec: 7.06
      cer: 0.1494
      wer: 0.6667
    bible_00149:
      source: bible
      text: Mɩyaŋ Pɔɔl abee Silaasi abee Timoti rɛ sabɩ teŋ no a kɩ tɩya ma Krisitabiisi hʋ buloŋ aa we
        Tesaloniika tɩyaŋ, a yaa á Kuwo Wɩɩsɩ abee á Tɩɩna Yesu Krisita nala. Wɩɩsɩ bɔnyɛ abee ʋ fɩyɛlʋʋ
        sɩ we ma lee.
      sbs: 0.6934
      gen_sec: 11.6
      ref_sec: 14.8
      cer: 0.0943
      wer: 0.3171
    bible_00150:
      source: bible
      text: Nyɛ rɛ Pɔɔl yɩrɩ laalyuwolo nɩhɩyasɩ hʋ kɩdɩgɩ a basɩ tɩya ʋ a baa, “Kaŋ bapʋwasɩbiye no mʋ
        ma nɩhɩyawʋ hʋ lee, ʋ kaŋ wɩɩ rɛ dɩ ʋ basɩ tɩya ʋ.”
      sbs: 0.6934
      gen_sec: 8.09
      ref_sec: 8.48
      cer: 0.1852
      wer: 0.5806
    bible_00151:
      source: bible
      text: Ɛɛ mɛ yaŋ daga anɩɩ á gba nyɩya wɩya kɩ tɩya Wɩɩsɩ rɛ, beewɩya á baa ʋ kyisi Krisita sʋʋ tɩyaŋ
        nɛ. Dɩ sʋʋnɩ mɩɩgɩ sii kɔnɩ ko tuwo, ɛɛ kɛ Wɩɩsɩ bɩ kyisi Krisita mɛ sʋʋ tɩyaŋ.
      sbs: 0.7131
      gen_sec: 9.88
      ref_sec: 12.48
      cer: 0.1203
      wer: 0.3421
    bible_00152:
      source: bible
      text: Mʋhʋ sʋwaa, dɩ ʋ haaŋ hʋ mɛ ko gyʋʋ. Ʋ kɛ fa bɩ gyɩŋ wɩɩ hʋ aa yaa tɩyaŋ.
      sbs: 0.6981
      gen_sec: 4.08
      ref_sec: 5.36
      cer: 0.1923
      wer: 0.5263
    bible_00153:
      source: bible
      text: Teŋ hʋ ŋ gyɩ aa saba tɩya ma tɩyaŋ, ŋ gyɩ basɩ tɩya ma a baa dɩ ma lɩɩ ma tɩɩ nala hʋ aa yaa
        sɔŋsɔŋ wɩya tɩyaŋ nɛ.
      sbs: 0.7168
      gen_sec: 6.24
      ref_sec: 7.6
      cer: 0.1429
      wer: 0.4138
    bible_00154:
      source: bible
      text: Ʋ sɩ lʋl boyoŋbiye, dɩ ɩ we ʋ feŋ Yesu. Feŋ hʋ memii rɛ yaa Laataal, beewɩya ʋ rɛ sɩ laa ʋ
        nala ta ba wɩbɔmɔ tɩyaŋ.”
      sbs: 0.6724
      gen_sec: 6.48
      ref_sec: 10.82
      cer: 0.2235
      wer: 0.5926
    bible_00155:
      source: bible
      text: Nala hʋ aa kyɛ dɩ ba mʋrɩ ma wɩya rɛ ŋ sabɩ wɩya no kɩ tɩya ma.
      sbs: 0.6955
      gen_sec: 3.56
      ref_sec: 3.72
      cer: 0.1522
      wer: 0.7059
    bible_00156:
      source: bible
      text: Ba kasɩ ba a ŋmaa kɩdɩgɩ, a kpʋ kɩdɩgɩ, aŋ yaga kɩdɩgɩ hʋ mɛ abee bʋwa.
      sbs: 0.7283
      gen_sec: 4.08
      ref_sec: 5.84
      cer: 0.0755
      wer: 0.5
    bible_00157:
      source: bible
      text: Wɩɩ no yaa wɩwelii rɛ a kɩ fɩyɛlɩ Wɩɩsɩ á laataal teŋ mɛ,
      sbs: 0.7254
      gen_sec: 3.36
      ref_sec: 3.44
      cer: 0.3409
      wer: 0.8462
    bible_00158:
      source: bible
      text: beewɩya ɩ kɛ paalɩ gyɩŋ Gyuuma lesiri buloŋ nɛ abee ba wɩkaŋtarɩya buloŋ. Ŋ yaŋ aa sʋla ɩ
        rɛ dɩ ɩ di kenyiri aŋ gyegili nɩɩ ŋ nyʋwa.
      sbs: 0.6934
      gen_sec: 7.62
      ref_sec: 9.28
      cer: 0.068
      wer: 0.3571
    bible_00159:
      source: bible
      text: Ɛɛ rɛ ma mɛ yaŋ kɩɩ anɩɩ dʋma, ma bɔmɔ rɛ weliŋ, ɛɛwɩya ma bɩ sɩ wuwo basɩ wɩwelii kɩdɩgɩ
        buloŋ. Beewɩya, nihuwobiŋ wɩbasɩɩ tɩyaŋ nɛ ɩ aa gyɩŋ nihuwobiŋ hʋ iriŋ ʋ aa yaa.
      sbs: 0.7322
      gen_sec: 9.72
      ref_sec: 14.86
      cer: 0.1374
      wer: 0.3714
    bible_00160:
      source: bible
      text: aŋ sʋla ʋ dɩ ʋ kɛ haa leŋ dɩ nala hʋ buloŋ aa wɩɩlɩ dige ʋ gal nyʋwa. Nala hʋ buloŋ gyɩ aa
        dige ʋ gal nyʋwa, ba buloŋ nɛ gyɩ naa laaŋfɩya.
      sbs: 0.663
      gen_sec: 7.72
      ref_sec: 14.08
      cer: 0.1262
      wer: 0.3333
    bible_00161:
      source: bible
      text: Akuu lagɩlagɩ no taŋha hʋ aa deye wɩya, dɩ baal lɛ bɩ kpa haaŋ, ʋ rɛ kpɩya.
      sbs: 0.7063
      gen_sec: 4.32
      ref_sec: 5.72
      cer: 0.1964
      wer: 0.7059
    bible_00162:
      source: bible
      text: Wɩfaŋɩɩ buloŋ tuwo dɩ ʋ bɩ sɩ ko lɩɩ lɩgyalɩɩ. Wɩɩ buloŋ mɛ aa we bilhuu tɩyaŋ, ʋ mɛ sɩ ko
        lɩɩ pʋlʋŋ.
      sbs: 0.7346
      gen_sec: 5.76
      ref_sec: 8.4
      cer: 0.1711
      wer: 0.6957
    bible_00163:
      source: bible
      text: Ɛɛwɩya, ŋ kyaŋweliye, ma lɩɩ ma tɩɩ vʋga marɩɩ tɩyaŋ.
      sbs: 0.692
      gen_sec: 3.2
      ref_sec: 4.6
      cer: 0.0732
      wer: 0.7
    bible_00164:
      source: bible
      text: Amɛ ʋ gyɩ aa yaa gɛɛ rɛ Wɩɩsɩ leŋ ʋ kokumo basɩ ʋ sɩya wɩya tɩya ʋ abee nihuwobiŋ abee kokusi
        aa bee basɩ wɩya buloŋ, ɛɛ leŋ ʋ leŋ ʋ bambugiliŋ hʋ.
      sbs: 0.6953
      gen_sec: 8.4
      ref_sec: 11.76
      cer: 0.2389
      wer: 0.697
    bible_00165:
      source: bible
      text: Amɛ Gyudɩya paalʋʋ buloŋ tɩyaŋ, Bɛtɩlɛhɛm nala rɛ yaa nɩbala,
      sbs: 0.7072
      gen_sec: 3.75
      ref_sec: 4.4
      cer: 0.12
      wer: 0.5
    bible_00166:
      source: bible
      text: Amɛ ʋ maga dɩ ba kɩ yaa wɩweliye hʋ haana aa kpaa ba tɩɩ tɩya Wɩɩsɩ aa maga dɩ ba kɩ yaa rɛ.
      sbs: 0.6961
      gen_sec: 5.2
      ref_sec: 6.3
      cer: 0.1739
      wer: 0.4783
    bible_00167:
      source: bible
      text: Aŋka paanʋʋ gama bapɛ hʋ mɛ ŋ gyɩ aa kaŋ lɔgɔ lɔgɔ tɩya nala tusi banaa hʋ? Simbiisi baŋmɛ
        rɛ ma gyɩ paa ba kɩkaalɩya hʋ mɛ su?
      sbs: 0.6844
      gen_sec: 7.1
      ref_sec: 10.98
      cer: 0.0918
      wer: 0.6071
    bible_00168:
      source: bible
      text: Yesu ha gyɩ aa basɩ wɩya kɩ tɩya nɩgyamaa hʋ gɛɛ, dɩ ʋ naa abee ʋ naabalɩya ko sɩŋ gyaŋhal
        tɩyaŋ a kɩ kyɛ dɩ ba na ʋ.
      sbs: 0.6887
      gen_sec: 6.37
      ref_sec: 9.14
      cer: 0.1477
      wer: 0.5714
    bible_00169:
      source: bible
      text: 'Ka ba buloŋ tɩyaŋ, wɩɩ hʋ aa yaa wɩɩ rɛ nyɛ: Wɩɩsɩ wɩweliye hʋ rɛ á buloŋ kɩ basɩ. Wɩya hʋ
        ba aa basɩ, ba aa rɛ ŋ mɛ kɩ basɩ. Wɩya no tɩɩ rɛ ma mɛ laa di gɛɛ.'
      sbs: 0.711
      gen_sec: 8.43
      ref_sec: 12.24
      cer: 0.2035
      wer: 0.6
    bible_00170:
      source: bible
      text: Ʋ sɩya aa gballa, Roma nɩhɩyasɩ hʋ tɩŋ porisi nɩhɩyasɩ dɩ ba mʋ basɩ tɩya nal hʋ aa deŋ nɩtɔdɩya
        hʋ dɩ ʋ lɩɩ Pɔɔl bee Silaasi ta dɩ ba kɩ mʋ.
      sbs: 0.7123
      gen_sec: 7.89
      ref_sec: 11.14
      cer: 0.1296
      wer: 0.4062
    bible_00171:
      source: bible
      text: ‘I bɩ sɩ leŋ dɩ Ɩ Tɩpʋlʋŋ Tɩɩna sʋba a pʋw bʋwa tɩyaŋ.’
      sbs: 0.7081
      gen_sec: 3.16
      ref_sec: 3.38
      cer: 0.125
      wer: 0.7692
    bible_00172:
      source: bible
      text: Kyɛwiyesii hʋ kyɛɛ kɩdɩgɩ Yesu gyɩ aa daga nala Wɩɩsɩ wɩya gyuuma wɩɩkyʋwaldɩya tɩyaŋ nɛ.
      sbs: 0.689
      gen_sec: 5.44
      ref_sec: 5.74
      cer: 0.2297
      wer: 0.7333
    bible_00173:
      source: bible
      text: Nyɛ rɛ á kyɛ mʋ na Krisitabiisi hʋ aa we doŋ tɩyaŋ, a gyɩ hɔŋ ba lee kyɛyɛ bapɛ. Wɩɩsɩ Wiyesi
        Welii hʋ dee tɩyaŋ, ba gyɩ basɩ tɩya Pɔɔl lɛ dɩ ʋ ta mʋ Gyerusalɛm.
      sbs: 0.705
      gen_sec: 9.06
      ref_sec: 11.54
      cer: 0.1311
      wer: 0.4444
    bible_00174:
      source: bible
      text: Ɛɛwɩya, ma nala hʋ aa bɩ yaa Gyuuma, ma bɩl bɩ yaa nɩhʋwala koo gyʋgyʋʋlɩya. Nyɛ kɛ, ma bee
        Wɩɩsɩ nala buloŋ yaa bedɩgɩ nala rɛ, a yaa Wɩɩsɩ dɩya nala.
      sbs: 0.7094
      gen_sec: 8.64
      ref_sec: 12.54
      cer: 0.1304
      wer: 0.4839
    bible_00175:
      source: bible
      text: Ma sii mʋ! Ma kɩɩ gɛɛ rɛ anɩɩ pebiisi, ŋ kɩ tɩŋ ma dɩ ma mʋ guwosi gboni tɩyaŋ.
      sbs: 0.7123
      gen_sec: 4.48
