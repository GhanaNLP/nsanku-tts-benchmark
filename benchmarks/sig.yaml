      text: Wɩɩ buloŋ bɩ leŋ ŋ teŋ fɩyɛlɩ a maga ŋ aa nɩya anɩɩ ŋ biisi aa tɩŋ wɩtɩɩ ŋmanɩɩ hʋ rɛ.
      sbs: 0.6168
      gen_sec: 3.85
      ref_sec: 8.7
      cer: 0.0923
      wer: 0.6667
    bible_00023:
      source: bible
      text: Ɛɛwɩya, ŋ aa sabɩ teŋ hʋ, ʋ bɩ kɩɩ nɩɩ nal hʋ aa yaa wɩɩ kyogi, koo nal hʋ ba aa yaa wɩɩ hʋ
        kyogi wɩya rɛ kyɩla ŋ. Amɛ ŋ aa kyɛ dɩ Wɩɩsɩ leŋ ma gyɩŋ ɛɛ hʋ ma aa kyɩla á wɩya rɛ.
      sbs: 0.5653
      gen_sec: 6.9
      ref_sec: 13.5
      cer: 0.9921
      wer: 0.9783
    bible_00024:
      source: bible
      text: Nyɛ rɛ ba kyɛ ʋ lɔlɔ ba tɩyaŋ, aŋ mɩɩgɩ kile ʋ lugo mʋ Gyerusalɛm, a deŋ kɩ kyɛ ʋ doŋ.
      sbs: 0.6584
      gen_sec: 4.53
      ref_sec: 6.66
      cer: 0.2857
      wer: 0.8571
    bible_00025:
      source: bible
      text: Nala sɩ lɩɩ dʋnɩya logiŋ logiŋ buloŋ a gyʋʋ Wɩɩsɩ koro hʋ, a hɔŋ kɩ di kɩna aŋ kɩ gbɩyalɩ.
      sbs: 0.6452
      gen_sec: 4.7
      ref_sec: 7.08
      cer: 0.4058
      wer: 0.9
    bible_00026:
      source: bible
      text: Ma bɩ gyɩŋ wɩɩ no memii? Kɩŋ kɛ buloŋ aa tɩŋ nal nyʋwa gyʋʋ, ʋ aa tuu ʋ fuu rɛ, a tɩŋ ʋ memii
        lɩɩ.
      sbs: 0.6527
      gen_sec: 4.58
      ref_sec: 8.08
      cer: 0.2571
      wer: 0.68
    bible_00027:
      source: bible
      text: Ʋ aa yaa wɩkperiye no pɩɩsɩ rɛ, ɛɛ rɛ tɩŋ nala na anɩɩ ʋ bɩra rɛ. Ɛɛ rɛ tɩŋ ba kpa ba nyuni
        we ʋ wɩyaalɩya tɩyaŋ gɛɛ.
      sbs: 0.589
      gen_sec: 6.18
      ref_sec: 7.96
      cer: 0.1264
      wer: 0.6429
    bible_00028:
      source: bible
      text: Ŋ teŋ fɩyɛlɩ rɛ weliŋ abee Sɩtɩfanasɩ, Fɔɔtunaatusɩ abee Akayikusɩ aa ko ŋ lee. Ba aa rɛ laa
        ma nyuu daha.
      sbs: 0.6462
      gen_sec: 5.19
      ref_sec: 8.7
      cer: 0.1325
      wer: 0.6667
    bible_00029:
      source: bible
      text: Ma aa sɩŋ weliŋ á Tɩɩna Yesu wɩya hʋ ma aa laa di tɩyaŋ wɩya, nyɛ kɛ á dʋnɩya tɩyaŋ weyi kaŋ
        tɔnɔ rɛ.
      sbs: 0.6838
      gen_sec: 4.52
      ref_sec: 6.92
      cer: 0.1974
      wer: 0.8333
    bible_00030:
      source: bible
      text: Wɩɩsɩ koro hʋ we ma tɩyaŋ nɛ. Ɛɛwɩya, nal buloŋ bɩ sɩ wuwo baa, ‘Ma deŋ na, ʋ we daha, koo
        ʋ we lee kɩdɩgɩ dɔŋ.”’
      sbs: 0.6876
      gen_sec: 6.12
      ref_sec: 10.14
      cer: 0.2532
      wer: 0.8462
    bible_00031:
      source: bible
      text: Saŋa hʋ tɩyaŋ mɩyaŋ Nihuwobiŋ Biye aa sɩ mɩɩgɩ ko, ʋ sɩ kɩɩ gɛɛ anɩɩ wɩya hʋ gyɩ aa yaa saŋa
        hʋ Nowa gyɩ aa we ʋ mɩɩbol tɩyaŋ.
      sbs: 0.597
      gen_sec: 6.71
      ref_sec: 9.88
      cer: 0.1979
      wer: 0.6552
    bible_00032:
      source: bible
      text: a baa, “Nɩhɩyawʋ, Wɩɩsɩ mɩrɩsɩ hʋ tɩyaŋ, ba kɩbee rɛ yaa ba buloŋ tɩyaŋ sɩfɩyaŋ wɩɩ?”
      sbs: 0.6074
      gen_sec: 4.43
      ref_sec: 6.96
      cer: 0.1875
      wer: 0.875
    bible_00033:
      source: bible
      text: Haana hʋ gyɩ aa tɩŋ Yesu hal a lɩɩ Galili paalʋʋ ko sii tɩŋ Gyosɛfʋ hal a mʋ dɩ ba na ɛɛ ba
        aa hogo Yesu bʋbʋwa hʋ tɩyaŋ.
      sbs: 0.6273
      gen_sec: 6.95
      ref_sec: 9.58
      cer: 0.2065
      wer: 0.6897
    bible_00034:
      source: bible
      text: Ŋ gyɩ aa ko ma lee, lɔl gyɩ gyʋʋ ŋ nɛ. Kambɩŋ mɛ gyɩ kana ŋ nɛ, ŋ kɩ kyele, ka ŋ baŋkyesi
        kɩ kpa.
      sbs: 0.637
      gen_sec: 4.6
      ref_sec: 7.04
      cer: 0.1324
      wer: 0.44
    bible_00035:
      source: bible
      text: Gyotam mɛ sii lʋl Ahazɩ.
      sbs: 0.6381
      gen_sec: 1.46
      ref_sec: 3.18
      cer: 0.2632
      wer: 1.0
    bible_00036:
      source: bible
      text: Ɛɛ rɛ Siimɔŋ sʋla Piita bee Gyɔɔŋ dɩ ba kyʋwalɩ Wɩɩsɩ tɩya ʋ dɩ wɩya no buloŋ ba aa basa ta
        yaa ʋ tɩyaŋ.
      sbs: 0.6236
      gen_sec: 5.1
      ref_sec: 8.14
      cer: 0.15
      wer: 0.4167
    bible_00037:
      source: bible
      text: Ʋ hɔŋ doŋ mɛ pɩɩsɩ mʋhʋ rɛ aŋ bɩl sii tɩŋ Galetiya bee Firigyiya paalʋʋ, a basɩ wɩya kɩ tɩya
