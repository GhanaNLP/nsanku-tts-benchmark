      wer: 0.7647
    bible_00064:
      source: bible
      text: Ŋ fa bɩ gyɩŋ ɛɛ hʋ buloŋ ŋ aa sɩ yaa, a gyɩŋ wɩɩ no naasɩ. Nyɛ rɛ ŋ pɩyɛsɩ Pɔɔl anɩɩ ʋ sɩ
