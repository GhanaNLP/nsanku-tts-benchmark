      wer: 0.7857
    bible_00070:
      source: bible
      text: Ŋ bɩl bɩ maga dɩ ɩ kana ŋ yaa ɩ biye. Kpa ŋ dɩ ŋ yaa ɩ tʋŋtʋnna hʋ kɩdɩgɩ á tʋma kɩ tɩya ɩ.’
        Ɛɛ rɛ ka ʋ sii kpa kɩ mʋ ʋ kuwo lee.
