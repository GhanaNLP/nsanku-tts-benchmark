      ref_sec: 13.24
      cer: 0.0233
      wer: 0.3171
    bible_00069:
      source: bible
      text: Krisitabiisi aa we Liisira abee Ikoniya buloŋ tɩyaŋ fa aa bigisi Timoti rɛ weliŋ.
      sbs: 0.6708
      gen_sec: 6.08
      ref_sec: 6.86
      cer: 0.2239
      wer: 0.7143
    bible_00070:
      source: bible
      text: Ŋ bɩl bɩ maga dɩ ɩ kana ŋ yaa ɩ biye. Kpa ŋ dɩ ŋ yaa ɩ tʋŋtʋnna hʋ kɩdɩgɩ á tʋma kɩ tɩya ɩ.’
