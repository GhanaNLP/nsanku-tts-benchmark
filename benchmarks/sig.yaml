      gen_sec: 10.4
      ref_sec: 12.24
      cer: 0.0891
      wer: 0.2941
    bible_00080:
      source: bible
      text: Badɔmɔŋ mɛ tele bʋnyɩŋ tɩyaŋ, a nyʋ aŋ sʋba, beewɩya fɩyɛl gyɩ tuwo doŋ.
      sbs: 0.641
