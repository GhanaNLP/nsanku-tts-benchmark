      gen_sec: 12.16
      ref_sec: 11.32
      cer: 0.0714
      wer: 0.25
    bible_00061:
      source: bible
      text: Ɛɛwɩya, ma ta leŋ dɩ wɩɩ buloŋ wɩya yaa ma kambɩŋ, beewɩya Wɩɩsɩ paalɩ gyɩŋ ma nyupʋna mɛ
