      cer: 0.0115
      wer: 0.1786
    bible_00057:
      source: bible
      text: Kyɛwiyesii hʋ kyɛɛ kɛ buloŋ, ʋ aa mʋ ba wɩɩkyʋwaldɩya rɛ. Ʋ bee Gyuuma abee Giriki tɩmma buloŋ
        kaŋ Wɩɩsɩ wɩya hʋ kɩ kpa dɔmɔŋ. Ʋ aa kɩ lʋga dɩ ba laa Wɩɩsɩ wɩya hʋ di.
      sbs: 0.7044
      gen_sec: 11.44
      ref_sec: 12.68
      cer: 0.0234
      wer: 0.0556
    bible_00058:
      source: bible
      text: Ba mɩɩgɩ kaŋ ba mʋ Keenaŋ paalʋʋ, a hogi ba Sɛkɛm tɩyaŋ. Bʋbʋʋbal kɩdɩgɩ rɛ Abɩraham fa yɔbɔ
