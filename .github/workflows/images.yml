name: Build benchmark images

# The benchmark runs on HuggingFace Jobs, which pulls these images. Building
# them here means a job starts synthesising in seconds instead of spending
# half an hour installing a stack it will throw away.
on:
  push:
    branches: [main]
    paths:
      - 'requirements/**'
      - 'docker/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        stack: [tts, asr]
    steps:
      - uses: actions/checkout@v4

      # The GPU images are large; reclaim the runner's preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.stack }}
          push: true
          tags: ghcr.io/ghananlp/nsanku-tts-benchmark:${{ matrix.stack }}
          cache-from: type=gha,scope=${{ matrix.stack }}
          cache-to: type=gha,mode=max,scope=${{ matrix.stack }}
