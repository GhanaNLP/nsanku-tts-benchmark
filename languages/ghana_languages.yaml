# nsanku-TTS benchmark languages
#
# All language codes from nsanku-ASR are pre-registered here for easy expansion.
# Languages present in ghana-sentences are marked with in_sentences: true.
# To add a new language: add its entry below and add sentences to ghana-sentences.

languages:
  - name: Akuapem_Twi
    iso_639_3: twi_akuapem
    iso_639_1: tw
    family: Kwa
    in_sentences: true
    subset: twi-aku
    alignment_lang: aka

